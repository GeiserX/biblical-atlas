# Nombres de personas del carril jesus-a que busca scripts/videos/index.py. Formato en nombres/pablo.yaml.
# Solo formas que no se confunden. Sin entrada, a propósito: jose-esposo-de-maria, simeon-del-templo (también el hijo
# de Jacob), santiago-hijo-de-alfeo, jairo y juana (nombres frecuentes en las experiencias) y los que solo tienen un
# nombre compartido. Andrés, Felipe, Mateo, Tomás y Gabriel van con «apóstol» o «ángel» por la misma razón.

jesus:
  names: [Jesucristo, Jesús]

andres:
  names: [apóstol Andrés]

maria-madre-de-jesus:
  names: [madre de Jesús]

juan-el-bautista:
  names: [Juan el Bautista]

herodes-el-grande:
  names: [Herodes el Grande]

elisabet:
  names: [Elisabet]

zacarias-padre-de-juan:
  names: [sacerdote Zacarías]

ana-profetisa:
  names: [profetisa Ana]

gabriel:
  names: [ángel Gabriel]

felipe-apostol:
  names: [apóstol Felipe]

natanael:
  names: [Natanael]

mateo:
  names: [apóstol Mateo]

tomas:
  names: [apóstol Tomás]

tadeo:
  names: [Tadeo]

simon-el-cananita:
  names: [Simón el cananita]

arquelao:
  names: [Arquelao]

nicodemo:
  names: [Nicodemo]

herodias:
  names: [Herodías]
