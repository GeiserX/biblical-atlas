# "tiro" en minúscula (disparo, lanzamiento) no cuenta porque los nombres
# respetan mayúsculas. Con acentos estrictos tampoco cuenta "Tiró" a principio
# de frase. Sigue colándose el verbo "Tiro" (yo tiro) al empezar una frase.
tiro:
  names: [Tiro]
  accents: strict

