# Nombres de lugares del carril jesus-b que busca scripts/videos/index.py. Formato en nombres/pablo.yaml.
# Nombres según la Traducción del Nuevo Mundo en español (wol.jw.org), consultada el 28 de septiembre de 2026.
#
# Sin nombres buscables en este fichero, a propósito:
#   efrain: «Efraín» casi siempre es la tribu o el hijo de José, no la ciudad de Jn 11:54.
#   perea: no sale en el texto bíblico y en los vídeos se confundiría con el apellido Perea.

betania:
  names: [Betania]
  exclude: [Betania al otro lado del Jordán, Betania del otro lado del Jordán]

monte-de-los-olivos:
  names: [monte de los Olivos, Monte de los Olivos]

jerico:
  names: [Jericó]
  accents: strict

betfague:
  names: [Betfagué]

getsemani:
  names: [Getsemaní]

estanque-de-siloam:
  names: [Siloam]

akeldama:
  names: [Akéldama, Campo de Sangre]

valle-de-cedron:
  names: [Cedrón]

monte-moria:
  names: [Moria, monte del templo]

# Sin nombres buscables (motivo en la cabecera); la entrada vacía mantiene iguales los ids de nombres/ y de data/places/.
efrain:
  names: []

perea:
  names: []
