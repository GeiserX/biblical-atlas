# Nombres de lugares del carril «patriarcas» que busca scripts/videos/indexar.py en los subtítulos.
# Mismo formato que nombres/pablo.yaml. Nombres según la Traducción del Nuevo Mundo en español.
# «Nebo» suelto es también el dios de Babilonia (Is 46:1): solo la forma con «monte».

beer-seba:
  nombres: [Beer-seba, Beerseba]
silo:
  nombres: [Siló]
monte-nebo:
  nombres: [monte Nebo]
madian:
  nombres: [Madián]
  gentilicios: [madianitas]
