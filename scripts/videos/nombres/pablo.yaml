# Nombres que busca scripts/videos/indexar.py en los subtítulos de los videos de jw.org.
#
# Una entrada por lugar, con el mismo id que usa data/lugares.
# Formato (subconjunto mínimo de YAML que entiende el script, sin dependencias):
#
#   nombres:     formas del nombre del lugar. Se comparan sin tildes, respetando
#                mayúsculas: "Malta" cuenta, "malta" (el cereal) no.
#   gentilicios: formas derivadas (corintios, filipenses). Se comparan sin tildes
#                ni mayúsculas, pero no cuentan si van seguidas de un número,
#                porque "Filipenses 4:13" cita la carta, no habla de la ciudad.
#   excluir:     frases que contienen el nombre pero hablan de otra cosa.
#   acentos:     "estricto" compara con tildes. Sirve para Atalia (el puerto de
#                Hch 14:25) frente a Atalía (la reina de 2 Reyes 11), y para Tiro
#                frente al verbo "tiró".
#   ambiguo:     palabra compartida por varios lugares ("Antioquía"). Cada aparición
#                suelta se asigna al lugar cuyas palabras de "contexto" salen más
#                cerca (250 caracteres a cada lado); si empatan, gana "por_defecto".
#
# Nombres según la Traducción del Nuevo Mundo en español (wol.jw.org, Hechos 13 a 28),
# consultada el 27 de septiembre de 2026.

antioquia-de-siria:
  nombres: [Antioquía de Siria]
  ambiguo: Antioquía
  contexto: [Siria, Seleucia, cristianos, Bernabé y Saulo, Agabo]
  por_defecto: sí

antioquia-de-pisidia:
  nombres: [Antioquía de Pisidia]
  ambiguo: Antioquía
  contexto: [Pisidia, Iconio, Listra, Derbe, Perga, Panfilia]

