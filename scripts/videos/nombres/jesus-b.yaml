# Nombres de lugares del carril jesus-b que busca scripts/videos/indexar.py. Formato en nombres/pablo.yaml.
# Nombres según la Traducción del Nuevo Mundo en español (wol.jw.org), consultada el 28 de septiembre de 2026.
#
# Sin nombres buscables en este fichero, a propósito:
#   efrain: «Efraín» casi siempre es la tribu o el hijo de José, no la ciudad de Jn 11:54.
#   perea: no sale en el texto bíblico y en los vídeos se confundiría con el apellido Perea.

betania:
  nombres: [Betania]
  excluir: [Betania al otro lado del Jordán, Betania del otro lado del Jordán]

monte-de-los-olivos:
  nombres: [monte de los Olivos, Monte de los Olivos]

jerico:
  nombres: [Jericó]
  acentos: estricto

betfague:
  nombres: [Betfagué]

getsemani:
  nombres: [Getsemaní]

estanque-de-siloam:
  nombres: [Siloam]

akeldama:
  nombres: [Akéldama, Campo de Sangre]

valle-de-cedron:
  nombres: [Cedrón]

monte-moria:
  nombres: [Moria, monte del templo]

# Sin nombres buscables (motivo en la cabecera); la entrada vacía mantiene iguales los ids de nombres/ y de data/lugares/.
efrain:
  nombres: []

perea:
  nombres: []
