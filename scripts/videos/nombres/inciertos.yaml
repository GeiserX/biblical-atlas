# Nombres que busca scripts/videos/indexar.py en los subtítulos: lugares del carril «inciertos».
# Mismo formato que scripts/videos/nombres/pablo.yaml. Nombres según la Traducción del Nuevo Mundo en español,
# consultada el 28 de septiembre de 2026.
#
# cruce-del-mar-rojo busca frases del paso, no «mar Rojo» suelto, que sale en muchos otros contextos.
#
# Sin nombres buscables en este fichero, a propósito:
#   monte-de-la-transfiguracion: la Biblia no le da nombre («una montaña alta»); «transfiguración» es el suceso.
#   antipatris: ya está en nombres/pablo.yaml; «Afec» no sirve porque nombra al menos cinco ciudades.

eden:
  nombres: [Edén]
  excluir: [Bet-edén]

ararat:
  nombres: [Ararat]

monte-sinai:
  nombres: [monte Sinaí, Monte Sinaí, Horeb]

pihahirot:
  nombres: [Pihahirot]

cruce-del-mar-rojo:
  nombres: [cruzar el mar Rojo, cruzaron el mar Rojo, cruce del mar Rojo, dividió el mar Rojo, abrió el mar Rojo]

gosen:
  nombres: [Gosén]

rameses:
  nombres: [Ramesés, Raamsés]

ur:
  nombres: [Ur de los caldeos, Ur]

haran:
  nombres: [Harán]
  excluir: [hermano de Abrán, hermano de Abrahán]

sodoma:
  nombres: [Sodoma]
  gentilicios: [sodomitas]

gomorra:
  nombres: [Gomorra]

cades:
  nombres: [Cadés, Cadés-Barnea, Qadés]
  acentos: estricto

golgota:
  nombres: [Gólgota, Calvario]

betania-del-otro-lado-del-jordan:
  nombres: [Betania del otro lado del Jordán]

emaus:
  nombres: [Emaús]

ofir:
  nombres: [Ofir]

tarsis:
  nombres: [Tarsis]
  excluir: [naves de Tarsis, barcos de Tarsis]

# Sin nombres buscables (motivo en la cabecera); la entrada vacía mantiene iguales los ids de nombres/ y de data/lugares/.
monte-de-la-transfiguracion:
  nombres: []
