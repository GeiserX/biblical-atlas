# Nombres de lugares del carril «reyes» que busca scripts/videos/indexar.py en los subtítulos.
# Mismo formato que nombres/pablo.yaml. Nombres según la Traducción del Nuevo Mundo en español
# (wol.jw.org, 1 Samuel a 2 Reyes, Jeremías y Amós), consultada el 28 de septiembre de 2026.
# jerusalen ya está en nombres/pablo.yaml; Jebús y Salem (sus nombres antiguos) se proponen en el informe del carril.

samaria:
  nombres: [Samaria]
ninive:
  nombres: [Nínive]
  gentilicios: [ninivitas]
siquem:
  nombres: [Siquem]
betel:
  nombres: [Betel]
# «Dan» suelto es también la tribu, el hijo de Jacob y el verbo al principio de frase: solo la forma calificada.
dan:
  nombres: [ciudad de Dan]
tirza:
  nombres: [Tirzá]
jezreel:
  nombres: [Jezreel]
  excluir: [valle de Jezreel, llanura de Jezreel]
hebron:
  nombres: [Hebrón]
lakis:
  nombres: [Lakís, Laquis]
carquemis:
  nombres: [Carquemis]
meguido:
  nombres: [Meguidó]
ribla:
  nombres: [Riblá]
# «Carmelo» suelto es también un nombre de pila y la ciudad de Judá de 1 Samuel 25.
monte-carmelo:
  nombres: [monte Carmelo]
anatot:
  nombres: [Anatot]
tecoa:
  nombres: [Tecoa]
guibea-de-benjamin:
  nombres: [Guibeá]
gabaon:
  nombres: [Gabaón]
  gentilicios: [gabaonitas]
monte-guilboa:
  nombres: [monte Guilboa, Guilboa]
gat-hefer:
  nombres: [Gat-Héfer]
abel-mehola:
  nombres: [Abel-Meholá]
# Hay varias Mizpá en la Biblia (Galaad, Benjamín, Judá) y en los subtítulos no se puede saber cuál se nombra.
mizpa-de-benjamin:
  nombres: []
# «Judá» suelto es también el hijo de Jacob y la tribu; Judea tiene su id en nombres/pablo.yaml.
juda:
  nombres: [reino de Judá, tierra de Judá]
