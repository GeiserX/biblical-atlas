# Nombres de personas que busca scripts/videos/indexar.py en los subtítulos: carril «reyes».
# Mismo formato que scripts/videos/nombres/pablo.yaml, con el id de data/personas. Solo formas que no se confunden.
# David, Samuel, Elías, Eliseo, Isaías, Jeremías, Ezequiel, Jonás, Amós, Oseas, Natán, Saúl, Salomón y Joaquín son
# también nombres de pila en las experiencias: van calificados («rey David», «profeta Elías»). Joel, Abías, Asá, Amón,
# Manasés, Nadab, Elá, Salum, Zacarías y Hosea nombran a varias personas o a una tribu: no se buscan sueltos.

