# Nombres de personas del carril hechos-pablo que busca scripts/videos/indexar.py en los subtítulos.
# Mismo formato que nombres/pablo.yaml, con el id de data/personas. Solo nombres que no se confunden o formas
# calificadas. Sin entrada, a propósito: lucas, tito, dionisio, julio, segundo y tercio (nombres o palabras
# corrientes hoy, que salen en experiencias; Julio es además un mes y Tito un general romano), gayo-de-macedonia,
# gayo-de-corinto, erasto-colaborador-de-pablo y erasto-mayordomo-de-corinto (nombres compartidos entre dos personas).
# «Demas» va con acentos estrictos para no contar la palabra «demás», y «Jasón» para no contar el nombre inglés Jason.

