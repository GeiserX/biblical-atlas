# Nombres de personas del carril jesus-a que busca scripts/videos/indexar.py. Formato en nombres/pablo.yaml.
# Solo formas que no se confunden. Sin entrada, a propósito: jose-esposo-de-maria, simeon-del-templo (también el hijo
# de Jacob), santiago-hijo-de-alfeo, jairo y juana (nombres frecuentes en las experiencias) y los que solo tienen un
# nombre compartido. Andrés, Felipe, Mateo, Tomás y Gabriel van con «apóstol» o «ángel» por la misma razón.

jesus:
  nombres: [Jesucristo, Jesús]

andres:
