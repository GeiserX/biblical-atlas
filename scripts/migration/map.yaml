# ---------------------------------------------------------------- la propuesta de un lector
# En esta ola solo se escribe el formato 1, que es el que escriben los carriles en marcha. Su sobre no cambia.
# apply.py traduce lo que la propuesta lleva de una ficha antes de aplicarla.
proposal:
  format: biblical-atlas/propuesta-cobertura/1
  envelope_unchanged:
    [formato, libro, capitulos, agente, leido, cobertura, fuentes, cambios, op, tipo, id, datos, campo, valores,
     antes, despues, historial, preguntas]
  ops_unchanged: [crear, anadir, cambiar]
  translate:
    tipo: el valor, con `proposal_types`
    campo: el valor, con `keys`
    datos: claves con `keys`; valores con `enums` por su ruta, `relation_rewrites`, `relation_fallback` y `selection_types`
    valores: como `datos`, en la ruta <tipo>.<campo>[]
    antes: como `datos`, en la ruta <tipo>.<campo>
    despues: como `datos`, en la ruta <tipo>.<campo>
    historial: claves con `keys` (fecha, cambio, fuente)
    cobertura: claves con `keys`, valores con `enums`, referencias con `coverage_prefixes` y `relation_reference`
    fuentes: no se traduce; sus claves son ids de fuente
  proposal_types:
    lugares: places
    personas: people
    viajes: journeys
    cartas: letters
    eventos: events
    periodos: periods
    hallazgos: finds
    recorridos: tours
  owner_rule: >-
    Un `anadir` de una relación cuya palabra lleva owns: target no se aplica: apply.py se para y dice en qué
    ficha va y con qué palabras inversas. No la escribe él en la otra ficha, porque la razón habría que
    escribirla desde allí.
  deferred: >-
    El formato 2, con el sobre en inglés, se diseña cuando los tres carriles hayan terminado. Dos trampas para
    quien lo diseñe: «campo» es aquí el nombre de un campo y en el calendario las cosechas del mes (harvest), y
    «despues» no puede llamarse after, que ya es el nombre de «tras».

# ---------------------------------------------------------------- lo que compila build.py
# Todo lo que el sitio lee hoy conserva nombre y valor: build.py aplica `keys`, `enums`, `selection_types` y
# `relation_types` al revés. Las claves de `new_keys` no se traducen en su ruta: `type` de un suceso y `checked_on`
# de una parada salen con ese nombre, aunque `tipo` y `consultado` de un fichero salgan con el suyo de siempre.
# Un objeto fecha dentro de un campo nuevo sale con la forma que el sitio ya lee (desde, hasta, precision...),
# para que sirvan sus funciones de fecha.
# `differences` es la lista entera de lo que puede cambiar en data.json respecto al de antes de migrar.
compiled:
  top_level_unchanged:
    [formato, generado, fuentes, libros, calendario, lugares, personas, viajes, cartas, eventos, periodos,
     hallazgos, recorridos, cobertura]
  relation:
    legacy:
      tipo: el tipo antiguo de `types.<type>.legacy` del vocabulario
      persona: person
      lugar: place
      relacion: la palabra en español (`es`) o el caption; falta si la relación no lleva ninguno de los dos
      relacion_inversa: inverse_caption
      fecha: date
      deducido: inferred
      estado: status
      fuentes: sources
      razon: reason
    added:
      [type, word, office, certainty, checked_on, verb, inverse_verb, key, reference, family, inverse_family,
       inverse_label, duplicate_of]
  differences:
    - path: personas[].relaciones[]
      what: los campos de `relation.added`
    - path: personas[].relaciones[].relacion
      what: >-
        Cambia en las relaciones que una regla reescribe con otro texto: falta en las 21 de disciple_of y en la
        same_as que lo llevaba, y es el `es` de la palabra en las de `reversed: true`.
    - path: personas[].relaciones[]
      what: no salen las de tipo holds_office, que hoy no existen
    - path: personas[].offices[]
      what: >-
        Nuevo. Cada cargo con office, es, place, date, inferred, sources, reason, status, checked_on y origin
        (relation o period:<id>).
    - path: viajes[].paradas[].checked_on
      what: nuevo
    - path: lugares[].candidatos[].checked_on
      what: nuevo
    - path: calendario.meses[].nombres[].checked_on, calendario.meses[].fiestas[].checked_on
      what: nuevo
    - path: eventos[].type, eventos[].roles
      what: nuevo; cada papel sale como {role, date, place}, con la fecha y el lugar ya resueltos
    - path: periodos[].office
      what: nuevo
  sqlite:
    unchanged: las tablas y las columnas de hoy, con los valores del lado `legacy`
    added_columns:
      relaciones: [type, word, office, certainty, checked_on, key]
      paradas: [checked_on]
      candidatos: [checked_on]
      eventos: [type, roles]
      periodos: [office]
    note: >-
      Las relaciones holds_office no entran en la tabla relaciones. Si el esquema pasa al inglés, from, to y
      order son palabras reservadas de SQL y allí necesitan otro nombre.
  registry: docs/investigacion/registro/ escribe cada relación con su verbo y con su propio checked_on
