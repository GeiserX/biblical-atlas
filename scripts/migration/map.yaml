# biblical-atlas: mapa de renombres del núcleo al inglés. Lo lee scripts/migration/migrate.py (de español a
# inglés, una vez por rama) y scripts/build.py (de inglés a español, al compilar lo que el sitio ya lee).
# La especificación está en docs/investigacion/modelo.md. Aquí solo hay cambios mecánicos: lo que pide leer el
# texto está en la sección «Decisiones que necesita la migración» de ese documento.
# Medido sobre el commit de `measured_on`. Una clave o un valor cerrado que no esté aquí para la migración; una
# palabra de relación que no esté aquí pasa a `caption` tal como está (relation_fallback).
# Las rutas de `at` y de `id_maps` son rutas del esquema antiguo, que es el que lee la migración: la carpeta o el
# fichero raíz sin extensión, las claves separadas por puntos, `[]` por cada lista y `<id>` por cada clave de un mapa
# de ids. `at` es una expresión regular sobre esa ruta.
format: biblical-atlas/migration-map/1
measured_on: 14b6c01
checked_on: '2026-09-29'

# ---------------------------------------------------------------- carpetas, ficheros y scripts
directories:
  data/lugares: data/places
  data/personas: data/people
  data/viajes: data/journeys
  data/cartas: data/letters
  data/eventos: data/events
  data/periodos: data/periods
  data/hallazgos: data/finds
  data/recorridos: data/tours
  data/fuentes: data/sources
  data/cobertura: data/coverage
  data/_propuestas: data/_proposals
  data/videos: data/videos
  data/videos-personas: data/videos-people
  data/videos-pasajes: data/videos-passages
  scripts/videos/nombres: scripts/videos/place_names
  scripts/videos/personas: scripts/videos/people_names

files:
  data/libros.yaml: data/books.yaml
  data/calendario.yaml: data/calendar.yaml
  data/cobertura/README.md: data/coverage/README.md

# El módulo de la cobertura no se llama coverage.py: taparía el paquete `coverage` de Python al importarlo.
scripts:
  scripts/build.py: scripts/build.py
  scripts/validate.py: scripts/validate.py
  scripts/aplicar.py: scripts/apply.py
  scripts/test_aplicar.py: scripts/test_apply.py
  scripts/cobertura.py: scripts/bible_coverage.py
  scripts/revisar.py: scripts/review.py
  scripts/videos/indexar.py: scripts/videos/index.py
  scripts/videos/pasajes.py: scripts/videos/passages.py

# Opciones de los scripts. El nombre nuevo es el que se documenta; el antiguo se sigue aceptando como alias hasta
# que las ramas de libro en marcha estén fusionadas, y entonces se quita. revisar.py ya aceptaba --dias y --days.
flags:
  --salida: --out
  --fallar: --fail
  --seco: --dry-run
  --sin-red: --offline
  --paralelo: --parallel
  --faltan: --missing
  --fugas: --leaks
  --hoy: --today
  --raiz: --root
  --dias: --days
  --datos: --data
  --libros: --books
  --nombres: --names
  --personas: --people
flags_unchanged: [--data, --days, --links]

# Ficheros que nombran una carpeta, un fichero, un script o una opción que cambia de nombre y que no se renombran
# ellos mismos. La migración los reescribe en el mismo cambio, con `directories`, `files`, `scripts` y `flags`.
# Las rutas de esta lista son las de después de renombrar.
references:
  rewrite:
    - .github/workflows/validar.yml
    - CLAUDE.md
    - CONTRIBUTING.md
    - README.md
    - scripts/README.md
    - scripts/videos/people_names/README.md
    - site/README.md
    - data/coverage/README.md
    - docs/decisiones.md
    - docs/hoja-de-ruta.md
    - docs/investigacion/README.md
    - docs/investigacion/versiculos.md
    - docs/investigacion/entre-libros.md
    - docs/investigacion/videos-jw.md
    - la primera línea de comentario de cada fichero de data/ y de scripts/videos/ que nombra una ruta
    - el texto de los scripts renombrados (rutas por defecto, mensajes y ayuda)
  exempt:
    - path: docs/ideas/
      why: Son propuestas ancladas en un commit; nombran el código como era ese día.
    - path: docs/investigacion/registro/
      why: Lo escribe build.py; se genera de nuevo después de migrar.
    - path: docs/investigacion/modelo.md, scripts/migration/
      why: Nombran lo antiguo a propósito, para decir a qué pasa.
    - path: .beads/
      why: Es el historial de las tareas.

# Lo que no cambia de nombre en esta ola, y por qué.
not_renamed:
  - path: site/data.json, site/data.js, site/videos*.json
    why: Es lo que lee el sitio; build.py y los scripts de vídeos lo siguen escribiendo con la forma de hoy.
  - path: dist/data.json, dist/biblical-atlas.sqlite
    why: >-
      dist/data.json es el mismo fichero que site/data.json. La base SQLite conserva sus tablas y sus columnas
      de hoy y gana las columnas de `compiled.sqlite`; su esquema pasa al inglés con la tabla de afirmaciones.
  - path: .github/workflows/validar.yml, .github/workflows/pages.yml
    why: >-
      El nombre del flujo puede ser una comprobación obligatoria de la rama; lo decide el dueño. Su contenido sí
      cambia: está en `references`.
  - path: docs/
    why: Es prosa en español.
  - path: data/fuentes/<carril>.yaml, data/fuentes/cobertura-<slug>.yaml
    why: Son nombres de carril y de libro, que son contenido; solo cambia la carpeta.
  - path: las claves y los valores del sobre de una propuesta
    why: Tres carriles escriben hoy el formato 1; ver `proposal`.

