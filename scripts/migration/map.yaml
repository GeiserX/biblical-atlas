# Las dos claves de una relación que dependen de su regla de `relation_rewrites`: la palabra antigua pasa a
# `word` si está en el vocabulario y a `caption` si se queda fuera.
relation_keys:
  relacion: [word, caption]
  relacion_inversa: [inverse_caption]

# Claves nuevas del modelo: no tienen nombre antiguo. build.py no las traduce, las añade con este mismo nombre.
new_keys:
  relations[]: [word, caption, inverse_caption, office, certainty, checked_on]
  journeys.stops[]: [checked_on]
  places.candidates[]: [checked_on, shape]
  places: [shape]
  # La forma de una zona sale entera en inglés, como en el YAML; build.py le añade `ring` y `bbox`.
  shape: [type, center, radius_km, radii_km, bearing, bounds, vertices, note, sources, reason, checked_on, status]
  shape.center: [lat, lon]
  shape.bounds: [south, west, north, east]
  calendar.months[].names[]: [checked_on]
  calendar.months[].festivals[]: [checked_on]
  events: [type, roles]
  # Lo que el relato dice que pasa desde un suceso anterior de su serie (be-64b.15).
  events.narrative_order: [elapsed]
  events.narrative_order.elapsed: [since, days, months, years, reason]
  events.roles.<id>: [role, date, place]
  periods: [office]
  journeys: [repeats]

# Mapas cuyas claves son ids o números y no cambian. `events.roles` es nuevo y también lo es.
id_maps:
  - fuentes
  - cobertura.capitulos
  - libros.libros[].omitidos
  - videos.videos[].terminos
  - videos-personas.videos[].terminos
  - videos-pasajes.capitulos

# Claves que llevan un objeto fecha: dentro de ellas valen los valores cerrados `date.*`.
date_keys: [fecha, fecha_objeto, abarca]

# Claves de la configuración de los vídeos (scripts/videos/place_names y people_names).
video_config_keys:
  nombres: names
  gentilicios: demonyms
  excluir: exclude
  acentos: accents
  ambiguo: ambiguous
  contexto: context
  por_defecto: default

# ---------------------------------------------------------------- valores cerrados
# `field` es el nombre para quien lee; `at` dice dónde vive hoy, y es lo que usan la migración y su puerta. Cada
# ruta de data/ que acaba en una clave que lleva un valor cerrado casa con un solo `at`. Lo que no está aquí es
# contenido y se queda en español: ids, slugs de libro, series de orden_relato, ids de mes, ids de fuente, textos.
enums:
  - field: status
    at: '^(?!cobertura\.)(?!lugares\.candidatos).*\.estado$'
    values: {verificado: verified, pendiente: pending}
  - field: coverage.chapters.<n>.status
    at: '^cobertura\.capitulos\.<id>\.estado$'
    values: {pendiente: pending, completo: complete}
  - field: places.candidates[].status
    at: '^lugares\.candidatos\[\]\.estado$'
    values:
      seguro: certain
      favorecido_nivel_1: favored_level_1
      tradicion: tradition
      alternativa: alternative
      solo_nivel_2: level_2_only
      descartado_nivel_1: rejected_level_1
  - field: date.precision
    at: '\.(fecha|fecha_objeto|abarca)\.precision$'
    values: {día: day, mes: month, estación: season, año: year, rango: range}
  - field: date.type
    at: '\.(fecha|fecha_objeto|abarca)\.tipo$'
    values: {anclada: anchored, narrativa: narrative, derivada: derived}
  - field: date.chronology
    at: '\.cronologia$'
    values: {tnm: tnm, secular: secular}
  - field: date.detail.season
    at: '\.detalle\.estacion$'
    values: {primavera: spring, verano: summer, otoño: autumn, invierno: winter}
  - field: places.type
    at: '^lugares\.tipo$'
    values:
      ciudad: city
      region: region
      isla: island
      provincia: province
      puerto: port
      cabo: cape
      monte: mountain
      rio: river
      mar: sea
      lago: lake
      desierto: desert
      valle: valley
      llanura: plain
      pais: country
      reino: kingdom
  - field: places.precision
    at: '^lugares\.precision$'
    values: {punto: point, zona: zone, incierto: uncertain}
  - field: places.candidates[].geometry.type
    at: '\.geometria\.tipo$'
    values: {punto: point, zona: zone, franja: strip}
  - field: coord_source
    at: '\.coord_fuente$'
    value_is: lo que va antes de los dos puntos; openbible:<id> conserva su id
    values: {calculo: calculation, openbible: openbible}
  - field: links[].type
    at: '\.enlaces\[\]\.tipo$'
    values: {perspicacia: perspicacia, biblia: bible, video: video, externo: external}
  - field: periods.type
    at: '^periodos\.tipo$'
    values:
      emperador: emperor
      gobernador: governor
      potencia: power
      rey: king
      era: era
      sumo-sacerdote: high_priest
  - field: finds.identification
    at: '^hallazgos\.identificacion$'
    values: {segura: certain, incierta: uncertain}
  - field: coverage.chapters.<n>.spans[].type
    at: '^cobertura\.capitulos\.<id>\.tramos\[\]\.tipo$'
    values:
      narracion: narration
      genealogia: genealogy
      ley: law
      poesia: poetry
      profecia: prophecy
      discurso: speech
      carta: letter
      lista: list
      vision: vision
  - field: videos-passages.chapters.<n>[].matched_by
    at: '^videos-pasajes\.capitulos\.<id>\[\]\.por\[\]$'
    values: {titulo: title, subtitulos: subtitles}
  - field: relations[].type
    at: '^personas\.relaciones\[\]\.tipo$'
    values_from: relation_types
  - field: video_config.accents
    at: null
    outside_data: scripts/videos/nombres y scripts/videos/personas, clave `acentos`
    values: {estricto: strict}

# ---------------------------------------------------------------- selecciones y referencias de la cobertura
# En los YAML (coverage entities y mentions, finds.relates_to, tours.stops[].sel) van en inglés. En data.json y en
# la dirección del sitio siguen en español: build.py las devuelve con el nombre antiguo.
selection_types:
  persona: person
  lugar: place
  evento: event
  periodo: period
  viaje: journey
  carta: letter
  hallazgo: find
  recorrido: tour
  libro: book
  parada: stop
  pasaje: passage
coverage_prefixes:
  persona: person
  lugar: place
  evento: event
  periodo: period
  viaje: journey
  carta: letter
  hallazgo: find
  relacion: relation
# Dónde hay selecciones y referencias en los YAML de hoy.
selection_at:
  - '^recorridos\.paradas\[\]\.sel$'
  - '^hallazgos\.relaciona\[\]$'
  - '^cobertura\.capitulos\.<id>\.tramos\[\]\.(entidades|menciona)\[\]$'
relation_reference:
  old: 'relacion:<persona>/<tipo>/<otro>'
  new: 'relation:<person>/<type>/<target>[/<word u office>][@<date.from>]'
  no_target: '-'
  canonical: >-
    Una referencia se escribe de una sola manera, la más corta que casa con una sola relación, probando en este
    orden: sin nada más; con @<date.from>; con /<word u office>; con los dos. El `caption` nunca entra.
    validate rechaza cualquier otra forma y dice la que toca.
  rule: >-
    Cada cita sigue a su relación: cambia el prefijo y el tipo como la relación. Si casa con una sola relación,
    se escribe en su forma canónica.
  several_spans: >-
    Una cita del capítulo C que casa con varias relaciones se queda con las relaciones cuya razón o cuyas
    fuentes citan el capítulo C, leídas con la función de citas de la cobertura. Una: se escribe con su
    @<date.from>. Varias: una cita por cada una, en el mismo tramo. Ninguna: la migración se para y nombra la
    cita, para que alguien lea el tramo.
  redirects: scripts/migration/redirects.yaml

# ---------------------------------------------------------------- relaciones
relation_types:
  pariente: kin
  acompana: accompanies
  vivio_en: lived_in
  nacio_en: born_in
  murio_en: died_in
  sucede_a: succeeds
  mismo_que: same_as
  se_aparece_a: appears_to

# Reescrituras por (tipo antiguo, relacion antigua). Se aplica la primera regla que casa. `inverse_was` lista los
# valores de relacion_inversa con los que la regla vale (null: sin ella); con otro valor no casa.
# `word: null` deja la relación sin palabra. `reversed: true` dice que el texto antiguo decía lo que es la ficha
# y la palabra nueva dice lo mismo desde el destino («huésped de» y `host`), sin cambiar de ficha.
# Ninguna regla cambia una relación de ficha ni la quita: su razón está escrita desde la ficha en la que está, y
# moverla pide volver a escribirla (decisiones K2, K3, T1, T2 y O3).
relation_rewrites:
  # kin: la palabra pasa a su id del vocabulario
  - {from: {tipo: pariente, relacion: padre}, to: {type: kin, word: father}}
  - {from: {tipo: pariente, relacion: madre}, to: {type: kin, word: mother}}
  - {from: {tipo: pariente, relacion: padre adoptivo}, to: {type: kin, word: adoptive_father}}
  - {from: {tipo: pariente, relacion: padrastro}, to: {type: kin, word: stepfather}}
  - {from: {tipo: pariente, relacion: abuelo}, to: {type: kin, word: grandfather}}
  - {from: {tipo: pariente, relacion: abuela}, to: {type: kin, word: grandmother}}
  - {from: {tipo: pariente, relacion: bisabuelo}, to: {type: kin, word: great_grandfather}}
  - {from: {tipo: pariente, relacion: antepasado}, to: {type: kin, word: ancestor}}
  - {from: {tipo: pariente, relacion: tío}, to: {type: kin, word: uncle}}
  - {from: {tipo: pariente, relacion: tío abuelo}, to: {type: kin, word: great_uncle}}
  - {from: {tipo: pariente, relacion: suegro}, to: {type: kin, word: father_in_law}}
  - {from: {tipo: pariente, relacion: suegra}, to: {type: kin, word: mother_in_law}}
  - {from: {tipo: pariente, relacion: hijo}, to: {type: kin, word: son}}
  - {from: {tipo: pariente, relacion: hija}, to: {type: kin, word: daughter}}
  - {from: {tipo: pariente, relacion: hijo adoptivo}, to: {type: kin, word: adopted_son}}
  - {from: {tipo: pariente, relacion: nieto}, to: {type: kin, word: grandson}}
  - {from: {tipo: pariente, relacion: sobrino}, to: {type: kin, word: nephew}}
  - {from: {tipo: pariente, relacion: yerno}, to: {type: kin, word: son_in_law}}
  - {from: {tipo: pariente, relacion: esposa}, to: {type: kin, word: wife}}
  - {from: {tipo: pariente, relacion: esposa secundaria}, to: {type: kin, word: secondary_wife}}
  - {from: {tipo: pariente, relacion: concubina}, to: {type: kin, word: concubine}}
  - {from: {tipo: pariente, relacion: esposo}, to: {type: kin, word: husband}}
  - {from: {tipo: pariente, relacion: hermano}, to: {type: kin, word: brother}}
  - {from: {tipo: pariente, relacion: hermana}, to: {type: kin, word: sister}}
  - {from: {tipo: pariente, relacion: medio hermano}, to: {type: kin, word: half_brother}}
  - {from: {tipo: pariente, relacion: hermano gemelo}, to: {type: kin, word: twin_brother}}
  - {from: {tipo: pariente, relacion: primo}, to: {type: kin, word: cousin}}
  - {from: {tipo: pariente, relacion: pariente}, to: {type: kin, word: relative}}
  - {from: {tipo: pariente, relacion: cuñado}, to: {type: kin, word: brother_in_law}}
  # sin palabra se quedan sin palabra: darles una es la decisión K5
  - {from: {tipo: pariente, relacion: null}, to: {type: kin, word: null}}
  # kin fuera del vocabulario: el texto se queda en caption hasta su decisión (K1, K2)
  - {from: {tipo: pariente, relacion: hijo de Jerjes I}, to: {type: kin, caption: hijo de Jerjes I}}
  - {from: {tipo: pariente, relacion: hijo de Darío I}, to: {type: kin, caption: hijo de Darío I}}
  - {from: {tipo: pariente, relacion: hijo de Nabonido}, to: {type: kin, caption: hijo de Nabonido}}
  - {from: {tipo: pariente, relacion: padre de Cambises II}, to: {type: kin, caption: padre de Cambises II}}
  - {from: {tipo: pariente, relacion: prima de Mardoqueo}, to: {type: kin, caption: prima de Mardoqueo}}
  - {from: {tipo: pariente, relacion: esposa de Asuero}, to: {type: kin, caption: esposa de Asuero}}
  - {from: {tipo: pariente, relacion: hijastro e hijo adoptivo}, to: {type: kin, caption: hijastro e hijo adoptivo}}
  - {from: {tipo: pariente, relacion: quizás hijo}, to: {type: kin, caption: quizás hijo}}
  # discípulos: el tipo lo dice todo y la relación ya está en la ficha del discípulo
  - {from: {tipo: acompana, relacion: maestro}, inverse_was: [null], to: {type: disciple_of, word: null}}
  - from: {tipo: acompana, relacion: discípulo de}
    inverse_was: [null]
    reversed: true
    to: {type: disciple_of, word: null}
  # tratos
  - {from: {tipo: acompana, relacion: amigo}, inverse_was: [null, amigo], to: {type: tie, word: friend}}
  - {from: {tipo: acompana, relacion: señor}, inverse_was: [null], to: {type: tie, word: master}}
  - {from: {tipo: acompana, relacion: señora}, inverse_was: [null], to: {type: tie, word: mistress}}
  - {from: {tipo: acompana, relacion: huésped de}, inverse_was: [null], reversed: true, to: {type: tie, word: host}}
  # tratos escritos desde el otro lado: se quedan en su ficha con sus dos textos hasta la decisión T1
  - from: {tipo: acompana, relacion: custodio}
    inverse_was: [custodiado por]
    to: {type: tie, caption: custodio, inverse_caption: custodiado por}
  - from: {tipo: acompana, relacion: consejero}
    inverse_was: [lo tenía de consejero]
    to: {type: tie, caption: consejero, inverse_caption: lo tenía de consejero}
  # compañeros
  - {from: {tipo: acompana, relacion: compañero}, inverse_was: [null, compañero], to: {type: accompanies, word: companion}}
  - {from: {tipo: acompana, relacion: compañera}, inverse_was: [null], to: {type: accompanies, word: female_companion}}
  - from: {tipo: acompana, relacion: colaborador}
    inverse_was: [null, colaborador]
    to: {type: accompanies, word: fellow_worker}
  - {from: {tipo: acompana, relacion: null}, inverse_was: [null], to: {type: accompanies, word: null}}
  # fuera del vocabulario: los dos textos se quedan como están
  - from: {tipo: acompana, relacion: compañero entre los siete}
    inverse_was: [compañero entre los siete]
    to: {type: accompanies, caption: compañero entre los siete, inverse_caption: compañero entre los siete}
  - from: {tipo: acompana, relacion: socio en la pesca}
    inverse_was: [socio en la pesca]
    to: {type: accompanies, caption: socio en la pesca, inverse_caption: socio en la pesca}
  - from: {tipo: acompana, relacion: instruido por él en Éfeso}
    inverse_was: [lo instruye en Éfeso]
    to: {type: accompanies, caption: instruido por él en Éfeso, inverse_caption: lo instruye en Éfeso}
  - from: {tipo: acompana, relacion: instruido por ella en Éfeso}
    inverse_was: [lo instruye en Éfeso]
    to: {type: accompanies, caption: instruido por ella en Éfeso, inverse_caption: lo instruye en Éfeso}
  - from: {tipo: acompana, relacion: '«Marcos mi hijo»'}
    inverse_was: ['Pedro lo llama «Marcos mi hijo»']
    to: {type: accompanies, caption: '«Marcos mi hijo»', inverse_caption: 'Pedro lo llama «Marcos mi hijo»'}
  - from: {tipo: acompana, relacion: escribió 1 Pedro por medio de él}
    inverse_was: [amanuense de 1 Pedro]
    to: {type: accompanies, caption: escribió 1 Pedro por medio de él, inverse_caption: amanuense de 1 Pedro}
  # apariciones: los dos textos se quedan como están
  - from: {tipo: se_aparece_a, relacion: se le aparece camino de Damasco}
    inverse_was: [lo ve resucitado camino de Damasco]
    to: {type: appears_to, caption: se le aparece camino de Damasco, inverse_caption: lo ve resucitado camino de Damasco}
  - from: {tipo: se_aparece_a, relacion: le habla en una visión}
    inverse_was: [Jesús le habla en una visión]
    to: {type: appears_to, caption: le habla en una visión, inverse_caption: Jesús le habla en una visión}
  - from: {tipo: se_aparece_a, relacion: se le aparece resucitado}
    inverse_was: [lo ve resucitado]
    to: {type: appears_to, caption: se le aparece resucitado, inverse_caption: lo ve resucitado}
  - from: {tipo: se_aparece_a, relacion: 'se le muestra en una visión, de pie a la derecha de Dios'}
    inverse_was: ['lo ve en el cielo, en una visión']
    to:
      type: appears_to
      caption: 'se le muestra en una visión, de pie a la derecha de Dios'
      inverse_caption: 'lo ve en el cielo, en una visión'
  - {from: {tipo: se_aparece_a, relacion: null}, inverse_was: [null], to: {type: appears_to, word: null}}
  # identidades: la palabra que decía la certeza pasa al campo certainty; las demás certezas son la decisión O2
  - from: {tipo: mismo_que, relacion: probablemente la misma persona}
    inverse_was: [null]
    to: {type: same_as, word: null, certainty: probable}
  - {from: {tipo: mismo_que, relacion: null}, inverse_was: [null], to: {type: same_as, word: null}}
  # sucesiones y lugares: solo cambia el tipo; el cargo de cada sucesión es la decisión O1
  - {from: {tipo: sucede_a, relacion: null}, inverse_was: [null], to: {type: succeeds, word: null}}
  - {from: {tipo: vivio_en, relacion: null}, inverse_was: [null], to: {type: lived_in, word: null}}
  - {from: {tipo: nacio_en, relacion: null}, inverse_was: [null], to: {type: born_in, word: null}}
  - {from: {tipo: murio_en, relacion: null}, inverse_was: [null], to: {type: died_in, word: null}}

# Una relación cuya `relacion` no casa con ninguna regla no para la migración ni pierde su texto.
relation_fallback:
  type: el de `relation_types` para su tipo antiguo
  caption: el texto de `relacion`, tal como está
  inverse_caption: el texto de `relacion_inversa`, si lo lleva
  warns: unlisted_caption
  report: true
  gate: En main tiene que dar 0 antes de migrar. En una rama de libro se cuenta y se decide al leerla (decisión T3).

# Reglas que tocan más de un hecho. Se aplican después de las reescrituras, en este orden.
relation_rules:
  - id: checked_on
    baseline: el commit de main anterior a su migración (P); en main, el propio commit que se migra
    does: >-
      Pone checked_on en cada hecho anidado que no lo tenga: relations[], stops[], candidates[], y names[] y
      festivals[] de cada mes. El valor es el checked_on del hecho que lo contiene, el más cercano: el mes para
      un nombre o una fiesta, el fichero para los demás. Un hecho anidado que está igual en `baseline` toma el
      valor que ese hecho tenía allí; uno que la rama añadió o cambió toma el de la rama. Si el hecho que lo
      contiene no lleva checked_on, la migración se para.
  - id: status
    does: >-
      No copia `status`. Es obligatorio en relations[], stops[] y candidates[], que ya lo llevan todos. Un nombre
      o una fiesta de un mes que no lo lleva vale con el del mes.
  - id: pairs
    does: >-
      No quita ninguna copia de un par escrito en las dos fichas. Las dos se quedan con `pair_twice` hasta que
      alguien las lee (decisiones K3 y K4); build.py marca la copia que no manda y el sitio dibuja una sola.
  - id: report
    path: scripts/migration/reports/<commit>.yaml
    does: >-
      La migración escribe un informe con cada relación cuya palabra cambió o se quitó, cada texto que pasó por
      `relation_fallback`, cada cita de la cobertura que cambió y cada línea añadida. <commit> es el commit del
      que partió. Si el fichero ya existe, no lo pisa: una segunda ejecución no tiene nada que escribir.
  - id: redirects
    path: scripts/migration/redirects.yaml
    does: >-
      La migración lo crea vacío. Quien quita o mueve una relación a mano añade una fila {from, to, removed_on,
      reason} con la clave que desaparece y la que queda. apply.py y bible_coverage.py lo leen: una cita o un
      `anadir` de una propuesta que nombra la clave antigua pasa a la nueva.

# ---------------------------------------------------------------- sucesos
# Tipo y papel de los sucesos en los que el sitio ya leía del título quién nace, muere o habla, y acertaba.
# Se nombran uno a uno: una regla por título tiparía sin leer los sucesos nuevos de las ramas de libro.
events:
  birth:
    role: born
    who: first_of_people
    ids:
