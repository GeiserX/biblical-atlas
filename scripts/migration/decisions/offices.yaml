# ---------------------------------------------------------------- O6: quien tuvo dos cargos
- file: people/samuel
  add:
    type: holds_office
    office: prophet
    inferred: false
    sources: [1-samuel-3, it-samuel]
    reason: Todo Israel, de Dan a Beer-Seba, supo que Jehová lo había acreditado como profeta (1Sa 3:20).
    checked_on: '2026-09-29'
    status: verified
  sources: [1-samuel-3, it-samuel]
  reason: El resumen de Samuel nombra dos cargos y ninguno estaba en un dato.
- file: people/samuel
  add:
    type: holds_office
    office: judge
    inferred: false
    sources: [1-samuel-7, it-samuel]
    reason: Empezó a servir como juez en Mizpá (1Sa 7:6) y juzgó a Israel toda su vida, en Betel, Guilgal, Mizpá y Ramá (1Sa
      7:15-17).
    checked_on: '2026-09-29'
    status: verified
  sources: [1-samuel-7, it-samuel]
  reason: La TNM lo llama juez en 1Sa 7:6. Perspicacia «Jueces» no lo suele contar entre ellos, pero el texto sí le da el
    cargo. Juzgaba en cuatro ciudades, así que no lleva lugar.
- file: people/eli
  add:
    type: holds_office
    place: silo
    office: high_priest
    inferred: true
    sources: [1-samuel-1, it-eli]
    reason: El texto lo llama el sacerdote Elí, sentado junto al templo de Siló (1Sa 1:3, 9); Perspicacia «Elí» lo llama sumo
      sacerdote.
    checked_on: '2026-09-29'
    status: verified
  sources: [1-samuel-1, it-eli]
  reason: Que era el sumo sacerdote lo dice la publicación; el texto lo llama sacerdote. Por eso va deducido.
- file: people/eli
  add:
    type: holds_office
    office: judge
    inferred: false
    sources: [1-samuel-4, it-eli]
    reason: Había juzgado a Israel cuarenta años cuando murió (1Sa 4:18); Perspicacia «Elí» dice que lo hizo como sumo
      sacerdote.
    checked_on: '2026-09-29'
    status: verified
  sources: [1-samuel-4, it-eli]
  reason: El resumen de Elí nombra los dos cargos. El texto no dice dónde juzgaba, así que este no lleva lugar.
- file: people/melquisedec
  add:
    type: holds_office
    office: king
    inferred: false
    sources: [genesis-14, it-melquisedec]
    reason: Gé 14:18 lo llama rey de Salem.
    checked_on: '2026-09-29'
    status: verified
  sources: [genesis-14, it-melquisedec]
  reason: El resumen de Melquisedec nombra dos cargos. Salem no tiene ficha de lugar; su estancia en Jerusalén ya está en otra
    relación.
- file: people/melquisedec
  add:
    type: holds_office
    office: priest
    inferred: false
    sources: [genesis-14, it-melquisedec]
    reason: Gé 14:18 lo llama sacerdote del Dios Altísimo; Perspicacia «Melquisedec» dice que es el primer sacerdote que nombra
      la Biblia.
    checked_on: '2026-09-29'
    status: verified
  sources: [genesis-14, it-melquisedec]
  reason: El segundo cargo de Melquisedec, en su propia relación.
- file: people/esdras
  add:
    type: holds_office
    office: priest
    inferred: false
    sources: [esdras-7, it-esdras]
