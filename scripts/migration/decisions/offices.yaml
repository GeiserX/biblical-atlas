# ---------------------------------------------------------------- O2: la certeza de las identidades
- file: people/ada-hija-de-elon
  relation: ada-hija-de-elon/same_as/basemat-hija-de-elon
  set:
    certainty: possible
    status: verified
    reason: 'Perspicacia «Adá», núm. 2, y «Basemat», núm. 1: puede ser la misma mujer. Gé 36:2 llama a Adá hija de Elón el
      hitita, y Gé 26:34 dice lo mismo de Basemat.'
  sources: [it-ada, it-basemat]
  reason: Perspicacia «Adá», núm. 2, lo da como posible, y «Basemat», núm. 1, dice que era Adá o su hermana. La razón cita
    el versículo de cada una.
- file: people/bartolome
  relation: bartolome/same_as/natanael
  set: {certainty: probable, status: verified}
  sources: [it-bartolome, it-natanael]
  reason: Perspicacia «Natanael» lo da como probable nombre personal de Bartolomé; «Bartolomé» dice que se le identifica por lo
    general con él.
- file: people/basemat-hija-de-ismael
  relation: basemat-hija-de-ismael/same_as/mahalat-hija-de-ismael
  set: {certainty: possible, status: verified}
  sources: [it-basemat, it-esau]
  reason: Perspicacia «Basemat», núm. 2, dice que posiblemente es Mahalat; «Esaú» pone a Basemat entre interrogaciones junto a
    Mahalat.
- file: people/hur-companero-de-moises
  relation: hur-companero-de-moises/same_as/hur-hijo-de-caleb
  set:
    certainty: probable
    status: verified
    reason: 'Perspicacia «Hur», núm. 1 y 2: probablemente el compañero de Moisés es el hijo de Caleb y abuelo de Bezalel (1Cr
      2:19, 20), pero no lo afirma.'
  sources: [it-hur, 1-cronicas-2]
  reason: Perspicacia «Hur» lo da como probable en los dos artículos. La razón cita ahora el pasaje del hijo de Caleb, para
    que la relación tenga referencia.
- file: people/sesbazar
  relation: sesbazar/same_as/zorobabel
  set:
    certainty: probable
    status: verified
    reason: Perspicacia «Sesbazar» lo ve lo más probable. Lo que Esd 1:8-11 y 5:14-16 cuentan de Sesbazar se cuenta de
      Zorobabel en los demás pasajes, y a los dos se les llama gobernador.
  sources: [it-sesbazar, it-zorobabel, esdras-1, esdras-5]
  reason: La certeza ya salía de la palabra antigua. La razón cita ahora los pasajes, para que la relación tenga referencia.
- file: people/zerah-de-bozra
  relation: zerah-de-bozra/same_as/zerah-hijo-de-reuel
  set: {certainty: possible, status: verified}
  sources: [it-zerah]
  reason: Perspicacia «Zérah», núm. 1 y 2, dice en los dos que posiblemente son la misma persona.

