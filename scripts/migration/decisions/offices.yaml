# biblical-earth: decisiones O1 a O6 de docs/investigacion/modelo.md (cargos e identidades). Las aplica
# scripts/migration/migrate.py después de la migración mecánica, sobre los datos ya en inglés.
#
# O1  El cargo de cada una de las 57 sucesiones, con el reino dicho en la razón. Una corrige su razón: Jehoiaquim.
# O2  La certeza y el estado de las 8 identidades, leídos en su artículo de Perspicacia.
# O3  Las dos identidades escritas en la ficha cuyo id va después pasan a la otra, con la razón escrita desde allí.
# O4  Sin entradas: el cargo derivado de un periodo toma su primer lugar, que es la sede (Jerusalén, Samaria, Tirza)
#     y no el reino. El reino ya lo dicen el nombre del periodo y la razón de cada sucesión.
# O5  Cada persona de una sucesión sin periodo recibe su cargo como holds_office, y los dos periodos cuyo cargo no es
#     el de su tipo llevan office. Los 11 titulares de un periodo sin sucesión se leyeron: ningún texto les da un
#     antecesor o un sucesor con ficha. Los 11 periodos sin ficha de persona siguen sin ella.
# O6  Los cargos de Samuel, Melquisedec, Elí, Esdras y Débora, uno por relación. Quedan fuera «copista» (Esdras), que
#     no es un cargo del vocabulario, y «juez» para Débora: el texto dice que juzgaba, Perspicacia «Jueces» no la
#     cuenta entre los doce y el vocabulario no tiene la forma femenina.
format: biblical-earth/migration-decisions/1
decision: O1-O6
checked_on: '2026-09-29'
entries:

# ---------------------------------------------------------------- O1: el cargo de cada sucesión
