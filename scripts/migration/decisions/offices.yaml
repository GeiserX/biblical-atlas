# Corrección de la razón: 2Re 23:34 no dice «en lugar de su hermano», dice «en lugar de su padre Josías». La sucesión
# sigue siendo cierta: Jehoiaquim reinó después de los tres meses de Jehoacaz, a quien Nekó se llevó (23:31-34).
- file: people/jehoiaquim
  relation: jehoiaquim/succeeds/jehoacaz-de-juda
  set:
    office: king
    reason: Rey de Judá después de los tres meses de su hermano Jehoacaz, a quien Nekó apresó (2Re 23:31-34). El v. 34 dice
      que Nekó lo puso en el trono en lugar de Josías, su padre.
  sources: [2-reyes-23, it-jehoiaquim]
  reason: La razón decía que 2Re 23:34 lo pone en lugar de su hermano; el versículo nombra a su padre Josías. El orden de
    reinados, Jehoacaz y después Jehoiaquim, sale de 23:31-34.
