    checked_on: '2026-09-29'
    status: verified
  sources: [esdras-7, it-esdras]
  reason: Solo el cargo de sacerdote. Copista no es un cargo del vocabulario y queda abierto.
- file: people/debora-profetisa
  add:
    type: holds_office
    office: prophetess
    inferred: false
    sources: [jueces-4, it-debora]
    reason: Jue 4:4 la llama profetisa, y Perspicacia «Débora», núm. 2, también.
    checked_on: '2026-09-29'
