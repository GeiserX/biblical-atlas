name: validar

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/build.py
      - run: python3 scripts/validate.py
      - run: python3 scripts/test_aplicar.py
      - run: python3 scripts/cobertura.py
      - name: Enlaces (solo en main y en la revisión semanal)
        if: github.event_name != 'pull_request'
        run: python3 scripts/validate.py --links
      - name: Datos que llevan más de un año sin releer
        if: github.event_name == 'schedule'
        run: python3 scripts/revisar.py --fallar
