name: validar

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/build.py
      # Sin --strict: main tiene avisos que esperan una decisión (docs/investigacion/modelo.md, secciones 13 y 16). Los
      # avisos de cada código no pueden pasar de su número en scripts/avisos-presupuesto.txt: un aviso nuevo falla aquí.
      - name: Esquema, y avisos dentro del presupuesto
        run: python3 scripts/validate.py
      - run: python3 scripts/test_apply.py
      - run: python3 scripts/test_build.py
      - run: python3 scripts/test_validate.py
      - run: python3 scripts/migration/test_migrate.py
      - run: python3 scripts/videos/test_videos.py
      - run: python3 scripts/bible_coverage.py
      # La portada: sus reglas y sus destinos escritos a mano contra los datos recién compilados. Los enlaces a jw.org:
      # el capítulo de cada fuente, el ancla de cada cita y cada cita de los datos dentro de su libro. Los relatos atados
      # con un plazo, juntos en la línea de tiempo. Sin navegador.
      - run: >-
          BE_DATA_FILE=site/data.json node --test tests/site/portada-reglas.test.mjs tests/site/portada-destinos.test.mjs
          tests/site/capitulo-fuente.test.mjs tests/site/enlaces-versiculos.test.mjs tests/site/citas-datos.test.mjs
          tests/site/relato-cadenas.test.mjs
      # Las reglas de «Atrás» y «Adelante»: el número y el nombre de cada entrada. Sin navegador.
      - run: node --test tests/site/visit-history.test.mjs
      # Los textos para quien lee dicen que cada dato enlaza a su fuente, y nada más sobre su origen.
      - run: node --test tests/site/textos-fuentes.test.mjs
      - name: Enlaces (solo en main y en la revisión semanal)
        if: github.event_name != 'pull_request'
        run: python3 scripts/validate.py --links
      - name: Datos que llevan más de un año sin releer
        if: github.event_name == 'schedule'
        run: python3 scripts/review.py --fail
