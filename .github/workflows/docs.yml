name: docs

# Comprueba en cada pull request que la documentación compila en modo estricto: un enlace roto, una
# página que falta o una página a la que nadie llega paran el PR antes de llegar al sitio. La
# publicación la hace pages.yml, que construye la documentación en site/docs/ junto a la aplicación.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Este trabajo nunca hace push; un token persistido lo leerían pip y la compilación.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            docs/requirements-docs.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r docs/requirements-docs.txt

      # El registro de investigación lo escribe build.py: se regenera antes de compilar el sitio.
      - name: Compilar los datos
        run: python3 scripts/build.py

      # zensical.toml ya lleva `strict = true`; la opción aquí lo mantiene aunque alguien quite esa línea.
      - name: Compilar la documentación
        run: python -m zensical build --clean --strict

      # Lo que la compilación estricta no comprueba: una página fuera del menú, una entrada del menú sin
      # fichero, una imagen que falta, un enlace que empieza por /.
      - name: Revisar el sitio compilado
        run: python -I .github/scripts/site-check.py site/docs
