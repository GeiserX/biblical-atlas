name: sitio

# Las pruebas de tests/site en un Chromium de verdad, en cada PR y en cada push a main. El repositorio es público: los
# runners de GitHub no cuestan nada, así que nada de esto corre en máquinas propias. Si una prueba falla, las trazas de
# Playwright de su fichero se suben como artefacto `trazas-<n>`, con n el número del trabajo en la matriz (se abren con
# `npx playwright-core show-trace <fichero>.zip`). Las de timeline-marks pueden pasar de 1 GB.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitio-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  # En un solo runner la batería pasa de 45 minutos: se reparte en seis a la vez. timeline-marks.test.mjs tarda 26 minutos
  # él solo, y sus dos pruebas de clics sobre las marcas, 15: van en dos trabajos aparte. El resto lo reparte node
  # (--test-shard), así que un fichero nuevo entra solo en una de las cuatro partes.
  navegador:
    name: pruebas (${{ matrix.parte }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        parte: ['1/4', '2/4', '3/4', '4/4', 'marcas, clics', 'marcas, resto']
    steps:
      - uses: actions/checkout@v7
        with:
          # timeline-placement.test.mjs compara con el código de un commit antiguo: necesita la historia entera.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Compilar los datos
        run: python3 scripts/build.py

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Instalar playwright-core
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" "playwright-core@$PLAYWRIGHT_VERSION"
      - name: Caché de Chromium
        id: chromium
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # Con la caché puesta solo instala las bibliotecas del sistema; sin ella, también descarga el navegador.
      - name: Instalar Chromium
        run: node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install --with-deps --only-shell chromium
      # Se guarda ya, no al final: una prueba roja no debe costar la descarga de la vez siguiente.
      - name: Guardar Chromium en la caché
        if: steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      # Un fichero detrás de otro (--test-concurrency=1): las pruebas abren un navegador cada una.
      # shell: bash hace que GitHub lo lance con -eo pipefail: sin pipefail, `node --test | tee` da el código de tee y
      # una prueba roja dejaría el paso en verde.
      - name: Pruebas
        shell: bash
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/pw/node_modules
          BE_TRACES: ${{ runner.temp }}/trazas
          # Los presupuestos de tiempo de timeline-marks se midieron en un Mac mini; un runner tarda hasta tres veces más.
          BE_TIME_SCALE: "4"
          PARTE: ${{ matrix.parte }}
        run: |
          run() { node --test --test-concurrency=1 --import ./tests/site/failure-traces.mjs "$@"; }
          clics='clicking a mark keeps the scale'
          case "$PARTE" in
            # Exactamente 2 pruebas, las 2 en verde: si alguien las renombra, el filtro no encontraría ninguna y el
            # trabajo saldría verde; si una tercera casa con el filtro, el recuento ya no cuadra.
            'marcas, clics') run --test-name-pattern="$clics" tests/site/timeline-marks.test.mjs | tee "$RUNNER_TEMP/clics.txt"
                             for linea in 'tests 2' 'pass 2' 'fail 0'; do
                               grep -q "^ℹ $linea\$" "$RUNNER_TEMP/clics.txt" || { echo "::error::el filtro de clics no dio «$linea»"; exit 1; }
                             done ;;
            'marcas, resto') run --test-skip-pattern="$clics" tests/site/timeline-marks.test.mjs ;;
            *) files=(); for f in tests/site/*.test.mjs; do [[ $f == */timeline-marks.test.mjs ]] || files+=("$f"); done
               run --test-shard="$PARTE" "${files[@]}" ;;
          esac

      - name: Subir las trazas de lo que falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trazas-${{ strategy.job-index }}
          path: ${{ runner.temp }}/trazas
          if-no-files-found: ignore
          retention-days: 14

  # Un solo nombre para todo: es el que se marca como obligatorio en main, y no cambia si cambian las partes.
  resultado:
    name: pruebas del sitio
    if: always()
    needs: navegador
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.navegador.result }}" = success
