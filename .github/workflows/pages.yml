name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r docs/requirements-docs.txt
      - run: python3 scripts/build.py
      # La documentación va en site/docs/, dentro del mismo artefacto que la aplicación. mkdocs.yml fija
      # site_dir en site/docs, así que la aplicación no se toca.
      - run: mkdocs build --strict
      - name: La aplicación sigue entera y la documentación está dentro
        run: |
          for f in $(git ls-files site) site/data.json site/data.js site/stats.json; do
            test -f "$f" || { echo "falta $f"; exit 1; }
          done
          test -f site/docs/index.html
          test ! -e site/docs/manifest.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
