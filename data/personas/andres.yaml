resumen: Apóstol, hijo de Jonás (o Juan) y hermano de Simón Pedro. Natural de Betsaida, vivía con Pedro en Capernaúm y pescaba
  en sociedad con Santiago y Juan. Antes fue discípulo de Juan el Bautista.
razon: Perspicacia «Andrés» (párr. 2 y 3) da la familia, las ciudades, el negocio y cómo conoció a Jesús en el otoño de 29
  (Jn 1:35-41).
