resumen: Apóstol de Jesucristo, de la tribu de Benjamín, nacido en Tarso de Cilicia y ciudadano romano. Hizo tres
  viajes misionales y la Tabla de los libros le atribuye 14 cartas.
razon: Perspicacia «Pablo» da su tribu, su origen y sus dos nombres; la Tabla de los libros lo pone como escritor
  de Romanos a Hebreos.
