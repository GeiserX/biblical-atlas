resumen: Tetrarca de Galilea y Perea, nacido de Herodes el Grande. Hizo decapitar a Juan el Bautista y, el día en
  que murió Jesús, lo interrogó en Jerusalén y se burló de él.
razon: Perspicacia «Herodes», apartado 2 (párrafos sobre Juan el Bautista y «Se burla de Jesús»); Lu 23:6-12 narra
  la comparecencia ante él.
