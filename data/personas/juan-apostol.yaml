resumen: Apóstol, hijo de Zebedeo y hermano de Santiago. Compañero de Pedro en Jerusalén y Samaria, sobrevivió a
  los demás apóstoles; exiliado en Patmos escribió Apocalipsis hacia 96 y después su Evangelio y tres cartas.
razon: Perspicacia «Juan» (apartado 3, párr. 21 y 29 a 32) y el recuadro del capítulo 4 del libro «Testimonio completo»;
  el estudio 3 fecha Apocalipsis en c. 96 y sus cartas en c. 98.
