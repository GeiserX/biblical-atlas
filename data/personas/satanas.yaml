# biblical-earth: un fichero por persona. Esquema en docs/investigacion/README.md.
id: satanas
nombre: Satanás
nombres:
- nombre: Satanás
  nota: 'Significa «resistidor»: el nombre le vino de oponerse a Dios.'
- nombre: Diablo
  nota: Título que significa «calumniador».
- nombre: el Tentador
  nota: Así lo llama Mt 4:3.
- nombre: Belcebú
  nota: Así lo llaman los escribas en Mr 3:22. Perspicacia «Beelzebub» lo toma por un apelativo de Satanás, quizá sacado de
    Baal-zebub, el dios de Eqrón.
- nombre: el gobernante de este mundo
  nota: Así lo llama Jesús en Jn 12:31, 14:30 y 16:11; la nota de estudio de Jn 16:8 y Perspicacia «Satanás» dicen que es
    él.
perspicacia: '1200003845'
desambiguacion: El gran adversario de Dios. En hebreo, satán sin artículo nombra también a cualquiera que se opone a otro,
  como el ángel que cortó el paso a Balaam.
resumen: Criatura espiritual que se rebeló contra Dios. En Edén engañó a Eva por medio de una serpiente, acusó a Job ante
  Jehová y le quitó bienes, hijos y salud, y tentó tres veces a Jesús tras su bautismo.
razon: Perspicacia «Satanás», párr. 1 a 4, los párrafos sobre Job y el apartado «Sus esfuerzos por hacer tropezar a Jesús»;
  Gé 3; Job 1:6-12; Mt 4:1-11.
