desambiguacion: Padre de Zacarías en Mt 23:35; no es Berekías, el padre del profeta Zacarías, cuyo nombre se escribe distinto.
resumen: Padre, según Mateo, del Zacarías al que mataron entre el santuario y el altar. Perspicacia recoge la idea de que
  fuera otro nombre de Jehoiadá; la nota de Mt 23:35 añade que algunos lo ven como su abuelo o antepasado.
razon: Perspicacia «Baraquías» y «Zacarías», núm. 12 y 20; nota de estudio de Mt 23:35. Solo Mateo da este nombre.
