resumen: Efraimita, servidor de Moisés desde joven. Mandó a Israel contra Amalec, fue uno de los dos espías fieles y sucedió
  a Moisés. Llevó al pueblo a cruzar el Jordán y a conquistar Canaán. Murió a los 110 años.
razon: 'Perspicacia «Josué», núm. 1, párr. 2, 3, 7, 9 y 19: en 1513 a.e.c. mandaba contra Amaleq; el cuadro del estudio
  3 pone su muerte hacia 1450.'
