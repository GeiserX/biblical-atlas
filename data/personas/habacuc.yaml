resumen: Profeta de Judá que escribió el libro de Habacuc; su nombre quizá signifique «abrazo ardiente». Profetizó al comenzar
  el reinado de Jehoiaquim, antes de la batalla de Carquemis, y fue contemporáneo de Jeremías. No se sabe si era músico levita.
razon: Perspicacia «Habacuc» y «Habacuc, Libro de»; «Toda Escritura», libro 35, párr. 2 y 3; Hab 1:1 y su nota al pie. La
  Tabla de los libros pone «c. 628 (?)», con duda.
