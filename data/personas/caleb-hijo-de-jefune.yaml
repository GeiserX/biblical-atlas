id: caleb-hijo-de-jefune
nombre: Caleb
nombres:
- nombre: Caleb
desambiguacion: Caleb hijo de Jefuné, compañero de Josué entre los espías; no Caleb hijo de Hezrón.
resumen: Quenizita de la tribu de Judá y tío de Otniel. A los 40 años fue uno de los doce espías y, con Josué, animó a entrar
  en Canaán. Recibió Hebrón como herencia.
razon: Perspicacia «Caleb», núm. 2, párr. 3 y 4; Nú 13:6, 30; Jos 14:6-15; 15:13-19. Espía en 1512 a.e.c. (Perspicacia «Espías»);
  toma Hebrón y casa a Acsá tras 1467 (estudio 3), antes de c. 1450 (tabla de libros).
