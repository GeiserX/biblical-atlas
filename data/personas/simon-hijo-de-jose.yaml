resumen: Medio hermano menor de Jesús, nombrado por la gente de Nazaret. Todavía no creía en él en 32 e.c.; después
  cambió, y en 33 estaba con los discípulos reunidos en Jerusalén.
razon: Perspicacia «Simón», núm. 4; Mt 13:55 y Mr 6:3. «Testimonio completo», cap. 2, párr. 17, pone a cuatro hijos de
  María en la reunión de Hch 1:14.
