resumen: Rey de Madián que dependía del amorreo Sehón hasta que Israel lo venció. Perspicacia cree que luego se alió con Balac;
  murió en la guerra de Israel contra Madián, junto con Balaam.
razon: Perspicacia «Hur», núm. 3; Nú 31:8; Jos 13:21. Según «Madián, madianitas», núm. 3, vivían al parecer junto a Moab y
  Sehón; Jos 13:21 los pone en la tierra de Sehón dada a Rubén.
