resumen: Presidente de la sinagoga de Corinto, quizás sucesor de Crispo. La multitud lo golpeó ante Galión. Tal vez es el
  hermano Sóstenes que estaba con Pablo en Éfeso y quizá le escribió al dictado 1 Corintios.
razon: Perspicacia «Sóstenes» (párr. 1 y 2); Hch 18:12-17; 1Co 1:1. Empieza con Galión, procónsul del verano de 51 al de 52
  (estudio 3, párr. 25), y llega a 1 Corintios, c. 55 (Tabla), si es el mismo hermano, solo posible.
