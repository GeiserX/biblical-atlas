  nota: Así lo llama el encabezamiento del Salmo 34; Perspicacia lo ve como un título de los reyes filisteos, parecido a faraón.
perspicacia: '1200000078'
resumen: 'Rey filisteo de Gat en tiempos de David y de Salomón. David, huyendo de Saúl, buscó refugio en su tierra dos veces:
  la primera se hizo pasar por loco y la segunda vivió en Ziqlag.'
razon: Perspicacia «Akís», párr. 1 y 2, y «Abimélec», núm. 3; encabezamiento del Salmo 34.
desambiguacion: 'No es ninguno de los reyes de Guerar llamados Abimélec en Génesis: en el Salmo 34 Abimélec es un título de
  Akís, rey de Gat.'
