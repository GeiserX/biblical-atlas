id: eli
nombre: Elí
nombres:
- nombre: Elí
desambiguacion: Elí, sumo sacerdote en Siló en la niñez de Samuel; no las palabras «Elí, Elí» que dijo Jesús en el madero.
resumen: Sumo sacerdote que juzgó a Israel cuarenta años en Siló. Reprendió con blandura a sus hijos Hofní y Finehás, pero
  los dejó en el cargo. Al saber que el Arca estaba en manos filisteas, cayó y murió con 98 años.
razon: Perspicacia «Elí, I», párr. 1 a 4 y 6; 1Sa 1:9-17; 2:22-36; 4:12-18.
