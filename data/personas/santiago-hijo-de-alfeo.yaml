id: santiago-hijo-de-alfeo
nombre: Santiago
nombres:
- nombre: Santiago, hijo de Alfeo
- nombre: Santiago el Menor
  nota: Así lo llama Mr 15:40, y la nota de estudio de ese versículo lo identifica con el hijo de Alfeo. Perspicacia usa la
    forma antigua «el Menos».
desambiguacion: Apóstol, hijo de Alfeo; no es Santiago, hijo de Zebedeo, ni Santiago, el medio hermano de Jesús.
no_confundir_con:
- santiago-hijo-de-zebedeo
- santiago-hermano-de-jesus
resumen: Uno de los doce apóstoles, hijo de Alfeo. La TNM de estudio lo identifica con Santiago el Menor, hermano de Josés,
  cuya madre, María, presenció la muerte de Jesús.
razon: Perspicacia «Santiago» (núm. 3) da como probable que Alfeo y Clopas sean el mismo. La nota de Mr 15:40 lo llama Santiago
  el Menor; Mt 27:56 nombra a su madre y a su hermano.
