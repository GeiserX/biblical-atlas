  nota: Nombre que le dio su padre Joás cuando derribó el altar de Baal (Jue 6:32).
resumen: Juez de la tribu de Manasés, hijo de Joás, que vivía en Ofrá. Derribó el altar de Baal de su padre y con pocos
  hombres libró a Israel de Madián. Hubo paz los cuarenta años que juzgó.
