resumen: Hijo del sacerdote Zacarías y de Elisabet, unos seis meses mayor que Jesús. Empezó a predicar hacia abril de 29,
  bautizó a Jesús y lo presentó como el Cordero de Dios. Herodes Antipas lo encarceló y lo mandó decapitar.
razon: Perspicacia «Juan» (núm. 1) da la familia, el ministerio, la cárcel y la muerte; la nota de Lu 3:1 fecha el comienzo.
  La fecha de la ficha va de ese comienzo a su muerte.
