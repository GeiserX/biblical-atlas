resumen: Profeta de Judá, hijo de Cusí; su nombre significa «Jehová ha ocultado». Profetizó al principio del reinado de Josías,
  antes de 648 a.e.c. Al parecer era tataranieto del rey Ezequías.
razon: Perspicacia «Sofonías», núm. 2, y «Sofonías, Libro de»; «Toda Escritura», libro 36, párr. 1 y 3; Sof 1:1 y su nota.
  Josías reinó desde 659 (A6-B); la tabla y el estudio 3 cierran el libro antes de 648.
