id: sulamita
nombre: Sulamita
nombres:
- nombre: Sulamita
  nota: Así la llama Can 6:13. Perspicacia cree que indica su origen en Sunem; la Septuaginta la llama «sunamita». El Cantar
    no da su nombre propio.
perspicacia: '1200004094'
resumen: Joven campesina que protagoniza El Cantar de los Cantares. Sus hermanos la pusieron a cuidar las viñas; llevada al
  campamento de Salomón y a Jerusalén, rechazó al rey y volvió a casa con el pastor al que amaba.
razon: Perspicacia «Sulamita» y «Cantar de los Cantares, El», apartados «Personajes» y «Argumento»; «Toda Escritura», libro
  22, párr. 5-15; Can 1:5-7; 2:1-17.
