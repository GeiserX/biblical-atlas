desambiguacion: Labán hijo de Betuel, suegro de Jacob; no el lugar del mismo nombre que nombra Deuteronomio.
resumen: Arameo de Harán, hermano de Rebeca y nieto de Nacor. Casó a Jacob con sus hijas Lea y Raquel, engañándolo con la
  mayor, y le cambió el salario muchas veces. Terminó pactando la paz con él en Galaad.
