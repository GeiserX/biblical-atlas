  texto: 29-33 e.c.
resumen: Hijo de Dios, nacido de María en Belén hacia octubre de 2 a.e.c. y criado en Nazaret. Bautizado en el otoño de 29
  e.c., predicó unos tres años y medio, sobre todo en Galilea, hasta la Pascua de 33.
razon: Perspicacia «Jesucristo» (secciones «Cuándo nació y cuánto duró su ministerio», «Primeros años» y «Su bautismo») da
  las fechas y los lugares; la fecha de la ficha es la de su ministerio.
