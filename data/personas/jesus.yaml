# biblical-earth: un fichero por persona. Esquema en docs/investigacion/README.md.
id: jesus
nombre: Jesús
nombres:
- nombre: Jesús
- nombre: Jesucristo
  nota: Nombre con el título Cristo, «Ungido», que le corresponde desde su bautismo (Perspicacia).
fecha:
  desde: 29
  hasta: 33
  precision: rango
  aprox: false
  tipo: anclada
  cronologia: tnm
  texto: 29-33 e.c.
resumen: Hijo de Dios, nacido de María en Belén hacia octubre de 2 a.e.c. y criado en Nazaret. Bautizado en el otoño de 29
  e.c., predicó unos tres años y medio, sobre todo en Galilea, hasta la Pascua de 33.
razon: Perspicacia «Jesucristo» (secciones «Cuándo nació y cuánto duró su ministerio», «Primeros años» y «Su bautismo») da
  las fechas y los lugares; la fecha de la ficha es la de su ministerio.
fuentes:
- it-jesucristo
- si-3
- lucas-2
- lucas-3
no_afirmamos:
- 'Que Jesús naciera el 25 de diciembre: Perspicacia lo descarta porque los pastores pasaban la noche al raso.'
- 'Un día exacto de nacimiento: las fuentes dicen hacia el 1 de octubre.'
