desambiguacion: El antepasado de Saúl de 1Sa 9:1, entrada núm. 1 de Perspicacia «Abiel». No es el otro benjamita de ese nombre,
  la núm. 2, a quien Perspicacia remite a Abí-Albón.
resumen: Benjamita, hijo de Zeror y antepasado del rey Saúl. 1Sa 9:1 llama a Quis su hijo, pero Perspicacia entiende que era
  su nieto, por medio de Ner, y cree que Abiel es el Jeiel de Crónicas.
razon: Perspicacia «Abiel», núm. 1, y «Quis», núm. 3; 1Sa 9:1.
no_afirmamos:
- 'Que Abiel y Jeiel sean la misma persona: Perspicacia lo da por probable, no por seguro.'
