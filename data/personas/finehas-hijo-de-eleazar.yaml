resumen: Sacerdote, hijo de Eleazar y nieto de Aarón. En las llanuras de Moab paró el azote que castigaba el culto a Baal
  de Peor, y Dios pactó que el sacerdocio seguiría en su linaje. Más tarde fue sumo sacerdote.
razon: Perspicacia «Finehás», núm. 1, párr. 1 y 2; Sl 106:30, 31 dice que su acción se le contó como justicia.
desambiguacion: Finehás nieto de Aarón; no el hijo del sacerdote Elí ni el levita cuyo hijo Eleazar sirvió en tiempos de Esdras.
