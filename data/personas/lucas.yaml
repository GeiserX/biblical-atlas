resumen: Médico que acompañó a Pablo; escribió el tercer Evangelio y Hechos. Los pasajes en «nosotros» muestran
  cuándo viajaba con él.
razon: Perspicacia «Lucas» lo identifica como escritor de Hechos y señala los tres tramos del libro contados en
  primera persona del plural (desde Hch 16:10, 20:5 y 27:1).
