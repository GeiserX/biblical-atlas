nombre: Simón el mago
nombres:
- nombre: Simón
  nota: Nombre que comparte con Pedro y con otros.
desambiguacion: El mago de Samaria (Hch 8:9). No es Simón Pedro ni Simón el curtidor de Jope.
resumen: Mago de la ciudad de Samaria a quien la gente admiraba. Creyó y se bautizó con la predicación de Felipe,
  pero luego ofreció dinero a Pedro y Juan por su poder, y Pedro lo reprendió.
