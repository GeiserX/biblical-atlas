nombre: Natanael
nombres:
- nombre: Natanael
- nombre: Bartolomé
  nota: Nombre que le dan Mateo, Marcos y Lucas; significa «hijo de Tolmai» (Perspicacia).
resumen: Apóstol de Caná, llamado Bartolomé en los otros tres Evangelios. Felipe lo llevó a Jesús, que lo describió como un
  israelita sin engaño; tras la resurrección estuvo en la pesca del mar de Galilea.
razon: Perspicacia «Natanael» (párr. 2-4) y «Bartolomé» explican que son la misma persona y cuentan su historia (Jn 1:45-49;
  21:2).
