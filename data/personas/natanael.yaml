# biblical-earth: un fichero por persona. Esquema en docs/investigacion/README.md.
id: natanael
nombre: Natanael
nombres:
- nombre: Natanael
resumen: Discípulo de Caná al que Felipe llevó ante Jesús, que lo llamó israelita sin engaño. Tras la resurrección estuvo
  en la pesca del mar de Galilea. Probablemente es el apóstol Bartolomé.
razon: Perspicacia «Natanael» (párr. 2-4) cuenta su historia (Jn 1:45-49; 21:2). Que sea Bartolomé lo da solo como probable,
  igual que «Bartolomé»; por eso van en dos fichas.
