resumen: Rey de los ammonitas cuando Saúl empezó a reinar. Su amenaza empujó a Israel a pedir rey. Sitió Jabés de Galaad y
  quiso sacar el ojo derecho a sus hombres, pero Saúl deshizo su ejército.
razon: Perspicacia «Nahás», núm. 1, y «Samuel»; 1Sa 11:1-11; 12:12.
