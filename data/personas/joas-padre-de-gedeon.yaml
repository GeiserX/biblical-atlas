resumen: Abí-ezrita de Manasés, padre del juez Gedeón y hombre influyente de Ofrá. Tenía un altar de Baal y un poste sagrado;
  cuando Gedeón los derribó, lo defendió ante la ciudad y lo llamó Jerubaal. En su tumba enterraron a Gedeón.
razon: Perspicacia «Joás», núm. 3; Jue 6:11, 25-32; 7:14; 8:13, 29, 32. Perspicacia deduce que era próspero por su altar,
  su poste y sus siervos.
