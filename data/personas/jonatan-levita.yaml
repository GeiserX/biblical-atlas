perspicacia: 1200002506#1
desambiguacion: El levita de Jue 17 y 18, sacerdote de Miqueas y luego de los danitas; no Jonatán hijo de Saúl ni los otros
  doce Jonatán de Perspicacia.
resumen: Joven levita que vivía en Belén de Judá y se hizo sacerdote del santuario de ídolos de Miqueas, en Efraín, aunque
  no descendía de Aarón. Los danitas se lo llevaron, y él y sus hijos fueron sacerdotes en Dan.
razon: Perspicacia «Jonatán», núm. 1, y «Miqueas», núm. 1; Jue 17:7-13; 18:3-6, 18-20, 30. Jue 18:30 le da el nombre.
