resumen: Hijo de David y Bat-Seba. Pidió sabiduría en Gabaón, construyó el templo de Jerusalén y escribió El Cantar de los
  Cantares, Eclesiastés y casi todo Proverbios. Ya anciano, sus esposas extranjeras lo volvieron idólatra; muerto él, el reino
  se dividió.
