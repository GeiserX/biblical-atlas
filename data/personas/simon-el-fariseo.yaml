id: simon-el-fariseo
nombre: Simón el fariseo
nombres:
- nombre: Simón
  nota: Lu 7:40-44 lo llama así; el apelativo «el fariseo» es nuestro, para separarlo de los otros Simón.
perspicacia: 1200004131#5
desambiguacion: El fariseo que invitó a Jesús a comer en Galilea (Lu 7:36-50). No es Simón el leproso, de Betania, en cuya
  casa ungió María a Jesús, ni Simón Pedro.
no_confundir_con:
- simon-el-leproso
- pedro
resumen: Fariseo que invitó a Jesús a su mesa. No le dio agua para los pies, beso ni aceite, y juzgó por dentro a la pecadora
  que ungió los pies de Jesús. Jesús le respondió con el ejemplo de dos deudores.
razon: Perspicacia «Simón», núm. 5; Lu 7:36-50. El libro jy (cap. 40) pone la casa en Galilea.
