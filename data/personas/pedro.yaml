nombre: Pedro
nombres:
- nombre: Pedro
  nota: Nombre griego que en la Biblia solo lleva él.
- nombre: Simón
  nota: Forma griega de su nombre.
- nombre: Symeón
  nota: Forma hebrea (Hch 15:14).
- nombre: Cefas
  nota: Equivalente semítico de Pedro (Jn 1:42).
- nombre: Simón Pedro
desambiguacion: El apóstol. No es Simón el mago de Samaria ni Simón el curtidor de Jope, con quien se hospedó.
fecha:
  desde: 29
  hasta: 64
  precision: rango
