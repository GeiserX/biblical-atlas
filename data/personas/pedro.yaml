no_afirmamos:
- 'Que Pedro estuviera en Roma o dirigiera allí la congregación: Perspicacia dice que esa idea solo se apoya en
  tradiciones dudosas.'
- 'El año y el lugar de su muerte: Jn 21:18, 19 anuncia cómo moriría, pero ninguna fuente que leímos da fecha ni
  sitio.'
- 'Que tuviera por nombramiento autoridad sobre los demás apóstoles: Perspicacia muestra que lo enviaban y que actuó
  como testigo, no como juez.'
