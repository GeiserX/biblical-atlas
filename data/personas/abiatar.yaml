perspicacia: '1200000030'
resumen: Sacerdote de la línea de Elí, hijo del sumo sacerdote Ahimélec. Fue el único que escapó de la matanza de Nob, siguió
  a David durante su huida y en su reinado fue sumo sacerdote. Salomón lo desterró a Anatot.
razon: Perspicacia «Abiatar», párr. 1 a 4, 8 y 10. Jesús lo nombra en Mr 2:26; la nota de estudio lo llama sacerdote principal
  porque el sumo sacerdote era aún su padre.
