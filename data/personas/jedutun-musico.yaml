- nombre: Jedutún
perspicacia: 1200002360#1
resumen: Músico levita de tiempos de David, al frente de uno de los tres grupos de cantores del santuario; seis hijos suyos
  dirigían turnos de músicos. Tres salmos, entre ellos el 39, lo nombran en su encabezamiento.
razon: Perspicacia «Jedutún», núm. 1, párr. 1-3; encabezamiento del Salmo 39. Perspicacia cree que antes se llamaba Etán y
  que el encabezamiento indica un estilo o instrumento, no su autoría.
desambiguacion: No es el otro Jedutún de Perspicacia (núm. 2), el levita de cuya familia era el portero Obed-edom.
no_afirmamos:
- 'Que Jedutún compusiera el Salmo 39: el encabezamiento se lo atribuye a David.'
- 'Que Jedutún y Etán sean con seguridad la misma persona: Perspicacia solo dice que al parecer lo eran.'
