# biblical-earth: un fichero por persona. Esquema en docs/investigacion/README.md.
id: eunuco-etiope
nombre: El funcionario etíope
nombres:
- nombre: eunuco etíope
  nota: La Biblia no da su nombre.
desambiguacion: 'Sin nombre en la Biblia: el funcionario de la reina Candace (Hch 8:27). No es Ébed-mélec, el etíope
  que rescató a Jeremías.'
resumen: Funcionario de la corte de Candace, reina de los etíopes, encargado de su tesoro. Prosélito judío, volvía
  de adorar en Jerusalén leyendo a Isaías cuando Felipe le explicó el pasaje y lo bautizó.
razon: 'Perspicacia «Etiopía» (párr. 5) y «Eunuco» (párr. 3): era prosélito circunciso, y aquí «eunuco» significa
  funcionario de la corte (Hch 8:26-39).'
