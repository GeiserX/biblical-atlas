  nota: Grafía de Perspicacia, que traduce el nombre «[Mi] Señor Es Justicia».
perspicacia: '1200000113'
resumen: Rey de Jerusalén cuando Israel entró en Canaán. Al saber que Gabaón había pactado con Josué, juntó a otros cuatro
  reyes amorreos contra ella; vencido, se escondió en una cueva de Maquedá y Josué lo mató.
razon: Perspicacia «Adoni-zédeq»; Jos 10:1-5, 16-27. Perspicacia lo pone también al frente de la alianza de reyes de Jos 9:1-3.
