desambiguacion: El hijo de Nacor. No es Buz, cabeza de familia de la tribu de Gad, ni el lugar de Arabia con ese nombre.
resumen: Segundo de los ocho hijos que Milcá dio a Nacor, el hermano de Abrahán, y por tanto tío de Rebeca. De él vendrían
  los buzitas, como Barakel, el padre de Elihú.
razon: Perspicacia «Buz», núm. 1, que relaciona con él el gentilicio buzita de Job 32:2, 6.
