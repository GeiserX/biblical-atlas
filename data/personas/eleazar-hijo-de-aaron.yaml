resumen: Tercer hijo de Aarón y Eliseba, jefe de los levitas en el desierto. Casado con una hija de Putiel, madre de Finehás,
  sucedió a Aarón como sumo sacerdote. Lo enterraron en la colina de Finehás, en Efraín.
