desambiguacion: Amram hijo de Cohat, padre de Moisés; no el israelita que en días de Esdras despidió a su esposa extranjera.
resumen: Levita, hijo de Cohat y nieto de Leví. Se casó con Jokébed, hermana de su padre, y tuvo con ella a Míriam, Aarón
