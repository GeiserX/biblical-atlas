resumen: Cilindro de arcilla hallado en 1879 donde estuvo el templo de Marduk en Babilonia. Cuenta cómo tomó Ciro la ciudad
  y su costumbre de devolver a los pueblos cautivos a su tierra.
razon: Perspicacia «Arqueología» (lugar del hallazgo) y «Ciro»; La Atalaya de 2008 da el año 1879; el estudio 9 (párr. 14,
  15) lo sitúa en el Museo Británico.
nota: 'El decreto sobre los judíos no está en el cilindro: está en Esd 1:1-4. El cilindro atribuye la victoria a Marduk.'
