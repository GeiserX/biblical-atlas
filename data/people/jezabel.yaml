summary: Hija de Etbaal, rey de Sidón, y esposa de Acab. Promovió el culto a Baal, mandó matar a los profetas de Jehová, amenazó
  a Elías y tramó la muerte de Nabot. Jehú la hizo arrojar por una ventana en Jezreel.
