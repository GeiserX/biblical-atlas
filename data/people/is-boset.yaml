summary: Hijo de Saúl. Muerto su padre, Abner lo llevó a Mahanaim y lo hizo rey de todas las tribus salvo Judá. Tenía 40 años
  y reinó dos; al final lo asesinaron dos de sus capitanes.
reason: Perspicacia «Is-bóset», párr. 1, 3 y 4; 2Sa 2:8-10; 4:5-7.
