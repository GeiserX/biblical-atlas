summary: Hijo de David y Bat-Seba. Pidió sabiduría en Gabaón, construyó el templo de Jerusalén y escribió El Cantar de los
  Cantares, Eclesiastés y casi todo Proverbios. Ya anciano, sus esposas extranjeras lo volvieron idólatra; muerto él, el reino
  se dividió.
reason: Perspicacia «Salomón», párr. 1, 10, 12 y 31, y apartado «Se aparta de la justicia»; Perspicacia «Proverbios, Libro
  de», «Eclesiastés, Libro de» y «Cantar de los Cantares, El»; 1Re 6:1 y 11:4-13, 42; Pr 1:1; Ec 1:1; Can 1:1.
