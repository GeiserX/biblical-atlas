id: salomon
name: Salomón
names:
- name: Salomón
- name: Congregador
  note: Título con que se presenta en Eclesiastés (Ec 1:1, 12; 7:27; 12:8-10), del hebreo Qohéleth. Perspicacia «Eclesiastés,
    Libro de» dice que es Salomón.
- name: Jedidías
  note: Nombre que Jehová le hizo poner por medio de Natán (2Sa 12:25); quiere decir «amado de Jah». Perspicacia dice que
    se le conoció mucho menos por él.
