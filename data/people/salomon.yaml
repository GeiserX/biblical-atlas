history:
- date: '2026-09-29'
  change: Grafía «Bat-seba» cambiada a «Bat-Seba», la de la TNM revisada en el encabezamiento de Sal 51 y la del nombre de
    su ficha.
  source: salmos-51
- date: '2026-09-29'
  change: En la razón de su relación con David, «Bat-seba» pasa a «Bat-Seba», la grafía de la TNM (Sl 51, encabezamiento;
    2Sa 12:24).
  source: salmos-51
- date: '2026-09-29'
  change: El resumen añade que compuso la mayor parte de Proverbios (Pr 1:1; 10:1; 25:1), como dice Perspicacia «Proverbios,
    Libro de».
  source: proverbios-1
- date: '2026-09-29'
  change: La razón cita Pr 1:1 y los artículos de Perspicacia que le atribuyen los proverbios.
  source: it-proverbios-libro
- date: '2026-09-29'
  change: El resumen añade que escribió Eclesiastés (Perspicacia «Eclesiastés, Libro de» y «Salomón», apartado «Se aparta
    de la justicia»). «En su vejez» pasa a «Ya anciano» para no pasar de 40 palabras.
  source: eclesiastes-1
- date: '2026-09-29'
  change: La razón cita Ec 1:1 y el artículo de Perspicacia que le atribuye el libro de Eclesiastés.
  source: it-eclesiastes-libro
- date: '2026-09-29'
  change: El resumen añade que escribió El Cantar de los Cantares (Can 1:1; Perspicacia «Salomón», apartado «Se aparta de
    la justicia»). Para no pasar de 40 palabras se abrevian Proverbios, la idolatría y la división.
  source: cantar-de-los-cantares-1
- date: '2026-09-29'
  change: La razón cita Can 1:1 y el artículo de Perspicacia que le atribuye El Cantar de los Cantares.
  source: it-cantar-de-los-cantares
- date: '2026-09-29'
  change: 'Las razones de su madre y de su padre citan 2Sa 12:24, donde Bat-Seba da a luz a Salomón; la del padre, con palabras
    nuestras.'
  source: 2-samuel-12
