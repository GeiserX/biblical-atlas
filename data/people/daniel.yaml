summary: Profeta de Judá, desterrado joven en Babilonia en 617 a.e.c. Sirvió en las cortes babilonia y persa, interpretó
  la escritura en la pared y seguía activo en el tercer año de Ciro, al parecer con casi cien años.
reason: 'Perspicacia «Daniel», núm. 2: llevado a principios de 617 con Joaquín y en la corte persa hasta al menos el tercer
  año de Ciro (536). Da 1:1-7 y 10:1. El manual: casi 100 años, última visión y
  libro hacia 536.'
