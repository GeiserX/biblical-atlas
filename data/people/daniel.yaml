not_claimed:
- 'Que Daniel volviera a Jerusalén con Zorobabel: vivió para ver el regreso, pero la Biblia no dice que fuera.'
- 'Que Daniel estuviera en Susa en persona durante la visión de Da 8: puede que se viera allí en visión.'
- 'Que Daniel estuviera con sus tres compañeros ante la estatua de oro: la Biblia no dice dónde estaba ni por qué no lo acusaron.'
- 'Dónde y cuándo murió Daniel: Da 12:13 solo deja ver que le quedaba poca vida y que resucitará (Perspicacia «Daniel»; «Profecías
  de Daniel», cap. 18).'
