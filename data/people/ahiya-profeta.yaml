summary: Profeta de Siló. Partió un manto nuevo en doce trozos y dio diez a Jeroboán, señal de que reinaría sobre diez tribus;
  ya ciego, anunció la ruina de su casa. Su profecía escrita fue un registro del reinado de Salomón.
reason: Perspicacia «Ahíya», núm. 7; 1Re 11:29-39 y 14:2-18; 2Cr 9:29.
