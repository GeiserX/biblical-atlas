name: Ahíya
names:
- name: Ahíya
perspicacia: 1200000153#7
disambiguation: Ahíya el silonita, profeta que vivía en Siló (núm. 7 de Perspicacia); no el sacerdote Ahíya hijo de Ahitub
  ni los demás Ahíya.
