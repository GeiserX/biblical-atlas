summary: Hijo de Cus y nieto de Cam. Fundó el primer reino después del Diluvio, con Babel entre sus ciudades, y fue un cazador
  poderoso opuesto a Jehová. Luego edificó en Asiria, también Nínive.
reason: Perspicacia «Nemrod», párr. 2 a 5; Gé 10:8-12. Perspicacia ve probable que la torre de Babel se empezara bajo su
  dirección (párr. 4).
