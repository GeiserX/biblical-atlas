id: simon-el-curtidor
name: Simón el curtidor
names:
- name: Simón
disambiguation: El curtidor de Jope (Hch 9:43). No es Simón Pedro, su huésped, ni Simón el mago.
summary: Curtidor de Jope con casa junto al mar. Pedro se alojó con él bastantes días en 36; en su azotea tuvo la
  visión que lo preparó para ir a casa de Cornelio.
reason: Perspicacia «Simón», apartado 9 (párr. 10), y la nota de estudio a Hch 10:6, que explica por qué muchos judíos
  evitaban a los curtidores.
