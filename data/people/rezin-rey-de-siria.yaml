summary: Rey de Siria que gobernaba desde Damasco. Aliado de Pécah de Israel, hostigó a Judá y sitió Jerusalén para poner
  en el trono al hijo de Tabeel, sin lograrlo. Tiglat-Piléser III tomó Damasco y lo mató.
reason: Perspicacia «Rezín», núm. 1; Is 7:1-9 y 8:6; 2Re 15:37 y 16:5-9. Los años van del reinado de Jotán (desde 777) a la
  muerte de Pécah, hacia 758 (A6-B).
