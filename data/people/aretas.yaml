summary: Rey árabe de los nabateos, conocido como Aretas IV, que reinó desde Petra y dominó Damasco. Su gobernador vigilaba
  la ciudad para prender a Pablo. Casó a una hija con Herodes Antipas, que la repudió por Herodías.
reason: Perspicacia «Aretas», párr. 1 y 2, y «Arabia», párrafo de los nabateos. La nota de estudio de 2Co 11:32 da su reinado,
  de c. 9 a.e.c. a 40 e.c., y su capital, Petra.
