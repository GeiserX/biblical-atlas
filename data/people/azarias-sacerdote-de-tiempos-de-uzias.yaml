names:
- name: Azarías
perspicacia: null
summary: Sacerdote principal que, con otros 80 sacerdotes, entró en el templo tras el rey Uzías y le exigió salir cuando quiso
  quemar incienso. El cuadro de Perspicacia «Sumo sacerdote» ve probable que sea Azarías hijo de Johanán.
reason: 2Cr 26:17-20; Perspicacia «Uzías», núm. 3, que lo llama sumo sacerdote, «Azarías», núm. 14, que dice quizás, y el cuadro
  de «Sumo sacerdote», que lo da como probable. Sin artículo propio.
