summary: Sacerdote principal que, con otros 80 sacerdotes, entró en el templo tras el rey Uzías y le exigió salir cuando quiso
  quemar incienso. Perspicacia ve posible que sea Azarías hijo de Johanán.
reason: 2Cr 26:17-20; Perspicacia «Uzías», núm. 3, que lo llama sumo sacerdote, y «Azarías», núm. 14, que solo lo da como
  posible. Sin artículo propio.
