disambiguation: Cam hijo de Noé; no la ciudad de los zuzim ni la «tierra de Cam», que es Egipto en los Salmos.
summary: Hijo de Noé, quizá el menor, que sobrevivió al Diluvio con su esposa. Fue padre de Cus, Mizraim, Put y Canaán.
