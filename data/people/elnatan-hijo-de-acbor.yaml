perspicacia: null
disambiguation: El hijo de Acbor que Jehoiaquim envió a Egipto; probablemente el mismo que el padre de Nehustá (elnatan-padre-de-nehusta).
summary: Hijo de Acbor y príncipe de la corte de Jehoiaquim. Fue a Egipto a traer al profeta Uriya; años después oyó el rollo
  de Baruc y rogó al rey que no lo quemara.
reason: 'Jer 26:22, 23; 36:12, 25. Perspicacia «Elnatán» no le da número propio: lo nombra dentro del núm. 1 como posible
  padre de Nehustá, y «Acbor», núm. 2, lo da por muy probable.'
