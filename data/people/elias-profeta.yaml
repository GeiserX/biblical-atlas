  text: c. 940-906 a.e.c.
summary: Profeta tisbita en tiempos de Acab. Anunció la sequía, venció a los profetas de Baal en el Carmelo y huyó de Jezabel
  al Horeb. Nombró a Eliseo y luego fue llevado en una tempestad.
reason: Perspicacia «Elías», núm. 1, párr. 1-10; 1Re 17-19 y 2Re 2. Actúa desde que reina Acab (c. 940, A6-A) hasta su carta
  a Jehoram de Judá (2Cr 21:12), a quien sucede Ocozías c. 906 (A6-A).
