summary: 'Levita, hija de Leví y hermana de Cohat, casada con su sobrino Amram. Madre de Míriam, Aarón y Moisés: escondió
  al niño, lo dejó en el Nilo en una canasta y después lo crió para la hija del faraón.'
reason: Perspicacia «Jokébed»; Éx 2:1-10, que no da su nombre, y Éx 6:20. Perspicacia recoge que versiones antiguas la hacen
