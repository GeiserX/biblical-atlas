disambiguation: El libertador que Samuel nombra en 1Sa 12:11 (Perspicacia, núm. 1); no el descendiente de Manasés (núm. 2).
summary: Libertador de Israel que Samuel nombra junto a Jerubaal, Jefté y él mismo. No sale en ningún otro pasaje ni fuera
  de la Biblia. Puede que sea Barac, que es lo que leen la Septuaginta y la Peshitta.
reason: Perspicacia «Bedán», núm. 1, y «Barac»; 1Sa 12:11. Otros lo toman por el juez Abdón.
