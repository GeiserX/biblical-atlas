summary: Judía creyente, casada con un griego, madre de Timoteo. Le enseñó los santos escritos desde niño. Probablemente se
  hizo cristiana, con su madre Loida, en la primera visita de Pablo a Listra.
reason: Perspicacia «Eunice»; Hch 16:1; 2Ti 1:5 y 3:15. La nota de 2Ti 1:5 ve probable que creyera en la primera visita de
  Pablo a Listra, de 47-48 e.c. según el estudio 3; 2 Timoteo es de c. 65.
