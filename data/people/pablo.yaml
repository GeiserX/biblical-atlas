  chronology: tnm
  text: c. 33-65 e.c. (de la muerte de Esteban a su último encierro en Roma)
not_claimed:
- 'Que Pablo llegara a España: Perspicacia dice que no se sabe (Ro 15:24).'
- 'El año y el lugar exactos de su muerte: Perspicacia solo lo cree probable bajo Nerón, poco después de c. 65.'
- 'Que Pablo se casara alguna vez: en sus viajes no estaba casado (1Co 7:8), y la nota de estudio de 1Co 7:7 solo ve posible
  que fuera viudo.'
- 'Que las marcas de esclavo de Jesús que llevaba en el cuerpo (Gál 6:17) fueran cicatrices: Perspicacia «Marca» lo ve posible,
  pero quizás aludía a su vida de ministro.'
summary: Apóstol de Jesucristo, de la tribu de Benjamín, nacido en Tarso de Cilicia y ciudadano romano. Hizo tres
  viajes misionales y la Tabla de los libros le atribuye 14 cartas.
reason: Perspicacia «Pablo» da su tribu, su origen y sus dos nombres; la Tabla de los libros lo pone como escritor
  de Romanos a Hebreos.
