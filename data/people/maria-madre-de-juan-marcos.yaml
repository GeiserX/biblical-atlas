name: María, madre de Juan Marcos
names:
- name: María
disambiguation: Madre de Juan Marcos; en su casa de Jerusalén se reunían los discípulos a orar (Hch 12:12). No es María, la
  madre de Jesús, ni otra de las Marías.
summary: Cristiana de Jerusalén en cuya casa, grande y con sirvienta, se reunía la congregación. Allí fue Pedro
  al salir de la cárcel en 44. Quizá era viuda; era tía de Bernabé.
reason: Perspicacia «María», apartado 5 (párr. 30), y la nota de estudio de Hch 12:12.
