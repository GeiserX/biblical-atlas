summary: Consejero de David, de Guiló, en las montañas de Judá; su consejo se tenía por palabra de Dios. Traicionó al rey
  y se unió a la rebelión de Absalón; al ver que fracasaba, se suicidó.
reason: Perspicacia «Ahitofel»; 2Sa 15:12, 31 y 17:23. Perspicacia cree que Sal 55:12-14 alude a su traición, aunque el salmo
  no da su nombre.
