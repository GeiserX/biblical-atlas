disambiguation: El hijo de Senaquerib (Perspicacia «Adramélec», núm. 1). El núm. 2 es un dios de los sefarvitas (2Re 17:31),
  no una persona.
summary: Hijo del rey asirio Senaquerib. Junto con Sarézer mató a espada a su padre cuando este adoraba a Nisroc, y los dos
  se refugiaron en la tierra de Ararat.
reason: Perspicacia «Adramélec», núm. 1; Is 37:38; 2Re 19:37. Según una inscripción de Esar-Hadón, este venció después a los
  asesinos en la tierra adonde huyeron.
