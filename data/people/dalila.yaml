summary: Mujer del valle de Sorec de la que Sansón se enamoró al final de su judicatura. A cambio de plata de los gobernantes
  filisteos le sacó el secreto de su fuerza y lo entregó. No vuelve a aparecer.
reason: Perspicacia «Dalila»; Jue 16:4-21. Cada gobernante le prometió 1.100 piezas de plata (Jue 16:5).
not_claimed:
- 'Que Dalila fuera la prostituta de Gaza de Jue 16:1: Perspicacia dice que aquella vivía en Gaza y Dalila en el valle de
  Sorec.'
- 'Que fuera filistea: Perspicacia la cree probablemente israelita, porque le compraron la traición en vez de apelar a su
  patria.'
