history:
- date: '2026-09-29'
  change: La relación con Jesús decía «apóstol de», que con la regla «Y es el R de X» se lee al revés; pasa a «maestro», como
    pide la tabla de relaciones (Mt 10:2-4).
  source: mateo-10
- date: '2026-09-29'
  change: La TNM de estudio (Mr 15:40 y la nota de Mt 27:56) dice «Santiago el Menor» y lo identifica con el hijo de Alfeo;
    «el Menos» es la forma de Perspicacia.
  source: mateo-27
- date: '2026-09-29'
  change: La nota de Mr 15:40 identifica sin reservas a Santiago el Menor con el hijo de Alfeo; lo que se cree es solo que
    Alfeo y Clopas son el mismo.
  source: mateo-27
- date: '2026-09-29'
  change: La razón cita ahora la nota de Mr 15:40 y Mt 27:56, que sostienen el nombre y la familia.
  source: mateo-27
- date: '2026-09-29'
  change: La razón de la relación con su madre era condicional («sería su madre si…»); la nota de Mr 15:40 ya identifica a
    este Santiago con el de Mt 27:56.
  source: mateo-27
