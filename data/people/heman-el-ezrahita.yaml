perspicacia: 1200001982#1
summary: Sabio de la tribu de Judá, descendiente de Zérah, al que Salomón superó en sabiduría; por ese origen lo llaman ezrahíta.
  El encabezamiento del Salmo 88 le atribuye ese maskil.
reason: Perspicacia «Hemán», núm. 1, y «Ezrahíta»; 1Re 4:31; 1Cr 2:6; encabezamiento del Salmo 88. Perspicacia «Salmos, Libro
  de los» también lo nombra en el Salmo 88.
disambiguation: No es Hemán el cantor levita, hijo de Joel y nieto de Samuel, que servía con Asaf y Jedutún (Perspicacia,
  núm. 2).
