disambiguation: Jaír, el que tomó Havot-Jaír en tiempos de Moisés; no el juez Jaír, quizá descendiente suyo, ni el padre de
  Mardoqueo, ni el de Elhanán.
summary: Contemporáneo de Moisés que tomó las aldeas de tiendas de Galaad y les dio su nombre, Havot-Jaír. Se le cuenta en
  Manasés, aunque por línea paterna venía de Judá, por Hezrón.
reason: Perspicacia «Jaír», núm. 1, y «Havot-jaír»; Nú 32:41. El id lleva el nombre de su padre, Segub (1Cr 2:22).
