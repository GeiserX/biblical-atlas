- name: Áquila
summary: Judío del Ponto, esposo de Priscila y fabricante de tiendas. Expulsados de Roma por el decreto de Claudio,
  hospedaron a Pablo en Corinto.
reason: Perspicacia «Áquila» cuenta su origen, el decreto de 49 o principios de 50 y el encuentro con Pablo en Corinto
  (Hch 18:1-3).
