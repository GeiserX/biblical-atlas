summary: 'Rey de Asiria, hijo de Sargón II. En 732 tomó ciudades de Judá y sitió Lakís, pero no Jerusalén: un ángel mató a
  185.000 de sus soldados. Sus hijos lo asesinaron en Nínive.'
reason: Perspicacia «Senaquerib», párr. 2-4, y «Ezequías», párr. 11 y 14-16; 2Re 18:13-19:37.
