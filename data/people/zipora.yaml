summary: Hija de Jetró, sacerdote de Madián, y esposa de Moisés, con quien tuvo a Guersom y a Eliezer. Camino de Egipto circuncidó
  a un hijo con un pedernal; tras el éxodo, su padre la llevó al campamento.
reason: Perspicacia «Ziporá» y «Cusita»; Éx 2:16-22; 4:20, 24-26; 18:2-6; Nú 12:1, donde la llaman cusita por su origen árabe,
  no porque Moisés tomara otra esposa.
