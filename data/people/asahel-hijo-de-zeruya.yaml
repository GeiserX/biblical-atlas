summary: 'Hijo de Zeruyá y hermano de Joab y Abisái, sobrino de David y uno de sus treinta valientes. Era muy veloz: persiguió
  a Abner tras el combate de Gabaón, y este lo mató con el extremo trasero de su lanza.'
reason: Perspicacia «Asahel», núm. 1; 2Sa 2:18-23, 32; 23:24.
