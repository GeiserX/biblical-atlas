id: timoteo
name: Timoteo
names:
- name: Timoteo
summary: Hijo de madre judía y padre griego, al parecer de Listra. Se unió a Pablo en el segundo viaje, entre finales de 49
  y principios de 50. Hacia 61-65 fue superintendente en Éfeso, donde al parecer recibió sus dos cartas.
reason: Perspicacia «Timoteo» da su familia y fecha su encuentro con Pablo en Listra (Hch 16:1-3). La nota de estudio de 1Ti
  1:3 lo pone de superintendente en Éfeso.
