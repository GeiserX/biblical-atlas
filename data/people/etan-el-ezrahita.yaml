id: etan-el-ezrahita
name: Etán
names:
- name: Etán
perspicacia: 1200001434#1
summary: Sabio de la tribu de Judá, descendiente de Zérah, al que Salomón superó en sabiduría; lo llaman ezrahíta. Fue padre
  de Azarías y quizá compuso el Salmo 89.
reason: Perspicacia «Etán», núm. 1, y «Ezrahíta»; 1Re 4:31; 1Cr 2:6, 8. La Atalaya del 15 de julio de 2006 también lo da como
  probable autor del Salmo 89.
disambiguation: No es el levita guersonita hijo de Zimá (núm. 2) ni el cantor merarita hijo de Quisí, quizá el mismo que Jedutún
  (núm. 3).
not_claimed:
- 'Que sea seguro que compuso el Salmo 89: Perspicacia y La Atalaya solo lo dan como posible.'
