disambiguation: Réquem, rey de Madián; no el manasita ni el judaíta de 1 Crónicas, ni la ciudad de Benjamín del mismo nombre.
summary: Rey madianita, uno de los cinco que murieron en la guerra con que Israel castigó a Madián por el pecado de Peor.
  Perspicacia cree que dependían de los amorreos.
reason: Perspicacia «Réquem», núm. 1; Nú 31:8; Jos 13:21. Según «Madián, madianitas», núm. 3, vivían al parecer junto a Moab
  y Sehón; Jos 13:21 los pone en la tierra de Sehón dada a Rubén.
