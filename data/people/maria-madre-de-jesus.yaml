summary: Madre de Jesús, descendiente de David, de la tribu de Judá. Vivía en Nazaret, comprometida con José, cuando Gabriel
  le anunció el nacimiento. Pariente de Elisabet, siguió siendo discípula fiel tras la ascensión de Jesús.
reason: 'Perspicacia «María» (núm. 1: párr. 4, 6, 7 y 18) da su linaje, el anuncio, el parentesco con Elisabet y su última
  mención en Hch 1:14.'
