id: gedeon
name: Gedeón
names:
- name: Gedeón
- name: Jerubaal
  note: Nombre que le dio su padre Joás cuando derribó el altar de Baal (Jue 6:32).
- name: Jerubéset
  note: Así lo llama 2Sa 11:21. Perspicacia «Jerubéset» lo toma por una variante de Jerubaal; quizá el escritor cambió Baal
    por la palabra hebrea para «vergüenza».
summary: Juez de la tribu de Manasés, hijo de Joás, que vivía en Ofrá. Derribó el altar de Baal de su padre y con pocos
  hombres libró a Israel de Madián. Hubo paz los cuarenta años que juzgó.
reason: Perspicacia «Gedeón», párr. 2, 5, 6 y 16; Jue 6:11 a 8:28.
