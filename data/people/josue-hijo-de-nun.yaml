summary: Efraimita, servidor de Moisés desde joven. Mandó a Israel contra Amaleq, fue uno de los dos espías fieles y sucedió
  a Moisés. Llevó al pueblo a cruzar el Jordán y a conquistar Canaán. Murió a los 110 años.
