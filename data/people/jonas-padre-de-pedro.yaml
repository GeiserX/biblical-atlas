name: Jonás
names:
- name: Jonás
  note: Así lo nombra Jesús en Mt 16:17.
- name: Juan
  note: La TNM lo llama así en Jn 1:42 y 21:15-17; otros manuscritos antiguos dicen Joná.
perspicacia: 1200002503#2
disambiguation: El padre de Simón Pedro y de Andrés, del siglo I, al que Jn 1:42 y 21:15-17 llaman Juan (Perspicacia «Juan»,
  núm. 2). No es el profeta Jonás, hijo de Amitai.
distinct_from:
- jonas-profeta
summary: Padre de Simón Pedro y de su hermano Andrés, los dos apóstoles. Solo sale como nombre de familia de Pedro.
reason: Perspicacia «Jonás», núm. 2, y «Juan», núm. 2, hablan del mismo hombre. Mt 16:17 lo nombra; la nota de estudio de Jn
  1:42 explica por qué los manuscritos alternan los dos nombres.
