disambiguation: El rey asirio de Isaías 20:1, sucesor de Salmanasar V y padre de Senaquerib.
summary: Rey de Asiria. La Biblia lo nombra una vez, cuando su tartán tomó Asdod. Sus ruinas de Jorsabad, halladas desde 1843,
  acallaron a quienes dudaban de él. Murió poco después de estrenar su palacio.
reason: Perspicacia «Sargón», párr. 1, 2, 7 y 9; «Las profecías de Isaías I», cap. 16, párr. 5 y 6; Is 20:1. Empezó a reinar
  con la caída de Samaria, en 740 a.e.c., o poco después.
