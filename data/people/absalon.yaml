summary: Tercer hijo de David, nacido en Hebrón de Maacá. Mató a su medio hermano Amnón por violar a Tamar, se sublevó después
  contra su padre y murió a manos de Joab en el bosque de Efraín.
reason: Perspicacia «Absalón», párr. 1, 3, 4 y apartados sobre la sublevación y su muerte; Sal 3, encabezamiento.
