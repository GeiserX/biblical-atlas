name: Juan, el apóstol
names:
- name: Juan
- name: Juan, el apóstol
- name: Boanerges
  note: 'Sobrenombre que Jesús dio a él y a Santiago: «hijos del trueno» (Mr 3:17).'
- name: el discípulo al que Jesús amaba
  note: Así se nombra a sí mismo en su Evangelio.
disambiguation: El apóstol, hijo de Zebedeo. No es Juan el Bautista, ni Juan Marcos, ni el gobernante Juan de Hch
  4:6, ni Juan el padre de Pedro.
date:
  from: 29
  to: 100
  precision: range
  approx: true
  type: anchored
  chronology: tnm
  text: c. 29-100 e.c.
  note: Desde que conoce a Jesús en 29 hasta su muerte, hacia 100, según el estudio 3.
summary: Apóstol, hijo de Zebedeo y hermano de Santiago. Compañero de Pedro en Jerusalén y Samaria, sobrevivió a
  los demás apóstoles; exiliado en Patmos escribió Apocalipsis hacia 96 y después su Evangelio y tres cartas.
reason: Perspicacia «Juan» (apartado 3, párr. 21 y 29 a 32) y el recuadro del capítulo 4 del libro «Testimonio completo»;
  el estudio 3 fecha Apocalipsis en c. 96 y sus cartas en c. 98.
