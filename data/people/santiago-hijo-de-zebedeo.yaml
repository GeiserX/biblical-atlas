- name: Boanerges
  note: Sobrenombre compartido con su hermano Juan (Mr 3:17).
disambiguation: El hijo de Zebedeo. No es Santiago hijo de Alfeo, otro apóstol, ni Santiago el medio hermano de
  Jesús, que dirigía en Jerusalén.
date:
  from: 30
  to: 44
  precision: range
  approx: true
  type: anchored
  chronology: tnm
  text: c. 30-44 e.c.
  note: Desde su llamada en 30 hasta su muerte en 44.
summary: 'Apóstol, quizá el hermano mayor de Juan, y socio de Pedro en la pesca. Uno de los tres más cercanos a
  Jesús. Herodes Agripa I lo mató a espada hacia 44: el primero de los doce que murió mártir.'
reason: Perspicacia «Santiago» (apartado 2, párr. 3 a 8) da la llamada en 30, el nombramiento en 31 y la muerte en
  44; la nota de estudio de Hch 12:2 lo confirma.
