id: bernabe
name: Bernabé
names:
- name: José
  note: Su nombre; Bernabé es un sobrenombre que le dieron los apóstoles.
- name: Bernabé
  note: Sobrenombre que significa «hijo del consuelo» (Hch 4:36); la nota de estudio lo liga a su don para animar a otros.
summary: Levita nacido en Chipre, llamado José; los apóstoles le pusieron Bernabé. En Jerusalén vendió un terreno y dio el
  dinero a los apóstoles. Acompañó a Pablo en el primer viaje y a la reunión de Jerusalén de 49.
reason: Perspicacia «Bernabé» lo presenta como levita chipriota y compañero de Pablo; Hechos 13 a 15 narra los viajes
  juntos.
