  text: de 456 a después de 443 a.e.c.
summary: Hijo de Hacalías, copero de Artajerjes en Susa y después gobernador de Judá. En 455 a.e.c. reconstruyó el muro
  de Jerusalén en 52 días pese a Sanbalat y Tobías; en 443 volvió un tiempo al rey.
reason: 'Perspicacia «Nehemías», núm. 3: noticias en kislev, permiso en nisán del año 20, muro del 4 de ab al 25 de elul
  y salida en el año 32. Ne 5:14 da doce años de gobierno.'
