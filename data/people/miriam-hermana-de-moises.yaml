  text: 1593-1474 a.e.c. (de cuando vigila a Moisés en el Nilo a su muerte en Cadés)
summary: Hermana mayor de Moisés y Aarón, y profetisa. Todo indica que vigiló a Moisés en el Nilo. Tras el mar Rojo dirigió
  el canto de las mujeres. Por murmurar contra Moisés sufrió lepra. Murió en Cadés.
reason: 'Perspicacia «Míriam», núm. 1, párr. 2 a 6, y «Moisés», párr. 2; Éx 15:20, 21, Nú 12 y 20:1. Años: el mar Rojo en
  1513 a.e.c. (estudio 3); muere poco antes que Aarón, en 1474.'
