summary: Hijo mayor del sumo sacerdote Elí y sacerdote en Siló con su hermano Finehás. Robaba carne de los sacrificios y se
  acostaba con las mujeres que servían en el tabernáculo. Murió el día en que los filisteos tomaron el Arca.
