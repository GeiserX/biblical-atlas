summary: Medio hermano de Jesús, hijo de José y María, y casado. No creía durante el ministerio, pero antes de Pentecostés
  oraba con los apóstoles. Fue columna de la congregación de Jerusalén y escribió la carta de Santiago.
reason: Perspicacia «Santiago», apartado 4 (párr. 10 a 14; en el 10 lee en 1Co 9:5 que estaba casado), y «Santiago, Carta de»,
  que lo identifica como el escritor.
