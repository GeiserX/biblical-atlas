disambiguation: Rey de Judá, nieto de Jehosafat; su tío Ocozías, hijo de Acab, reinó antes en Israel. Crónicas lo llama también
  Jehoacaz, y algunos manuscritos, Azarías, pero no es ninguno de los reyes Jehoacaz ni de los otros Azarías.
