disambiguation: Asaf padre de Joá, de tiempos de Ezequías. Perspicacia lo registra aparte del levita cantor de David (asaf-hijo-de-berekias)
  y del guarda del parque de Artajerjes.
distinct_from:
- asaf-hijo-de-berekias
summary: Padre de Joá, uno de los tres funcionarios que el rey Ezequías mandó a escuchar al rabsaqué en 732 a.e.c. La Biblia
  no cuenta nada más de él.
reason: Perspicacia «Asaf», núm. 3; Is 36:3, 22; 2Re 18:18, 37.
not_claimed:
- 'Que sea el cantor Asaf de tiempos de David: Perspicacia solo recoge que algunos lo creen, porque «hijo» puede querer decir
  descendiente.'
- 'Que él fuera el registrador: según Perspicacia, la mayoría de los estudiosos da ese cargo a su hijo Joá.'
