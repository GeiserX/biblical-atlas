id: zur-rey-de-madian
name: Zur
names:
- name: Zur
perspicacia: 1200004771#1
disambiguation: El madianita padre de Cozbí; no el benjamita hijo de Jeiel.
summary: Uno de los cinco reyes de Madián cuando Israel se acercaba a la Tierra Prometida, y cabeza de una familia principal
  de los madianitas. Su hija Cozbí murió en Sitim; él cayó después, cuando Israel castigó a Madián.
reason: Perspicacia «Zur», núm. 1; Nú 25:15, 18; 31:8; Jos 13:21. Según «Madián, madianitas», núm. 3, vivían al parecer junto
  a Moab y Sehón; Jos 13:21 los pone en la tierra de Sehón dada a Rubén.
