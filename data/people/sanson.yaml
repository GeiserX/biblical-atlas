summary: Juez de la tribu de Dan, hijo de Manóah, nazareo desde que nació. Luchó contra los filisteos. Dalila lo traicionó
  y, ciego, derribó la casa de Dagón y murió con muchos filisteos tras juzgar veinte años.
reason: Perspicacia «Sansón», párr. 2 y 9 a 11; Jue 13 a 16. Jue 16:21 dice que los filisteos lo bajaron a Gaza.
