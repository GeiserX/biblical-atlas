summary: Rey de Madián, uno de los cinco que cayeron cuando Israel castigó a los madianitas por haberlo arrastrado al culto
  de Baal de Peor. Perspicacia lo cuenta entre los vasallos del rey amorreo Sehón.
reason: Perspicacia «Eví»; Nú 31:8; Jos 13:21. Según «Madián, madianitas», núm. 3, vivían al parecer junto a Moab y Sehón;
  Jos 13:21 los pone en la tierra de Sehón dada a Rubén.
