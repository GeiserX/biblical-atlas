id: simon-el-mago
name: Simón el mago
names:
- name: Simón
  note: Nombre que comparte con Pedro y con otros.
disambiguation: El mago de Samaria (Hch 8:9). No es Simón Pedro, ni Simón el curtidor de Jope, ni los demás Simón que numera
  Perspicacia.
summary: Mago de la ciudad de Samaria a quien la gente admiraba. Creyó y se bautizó con la predicación de Felipe,
  pero luego ofreció dinero a Pedro y Juan por su poder, y Pedro lo reprendió.
reason: Perspicacia «Simón», apartado 8 (párr. 9); nota de estudio de Hch 8:18; Hch 8:9-24.
