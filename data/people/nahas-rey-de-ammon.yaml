id: nahas-rey-de-ammon
name: Nahás
names:
- name: Nahás
perspicacia: 1200003167#1
disambiguation: El rey ammonita que sitió Jabés al empezar el reinado de Saúl y el padre de Hanún (Perspicacia, núm. 1); no
  el padre de Abigaíl ni el de Sobí (núm. 2 y 3).
summary: Rey ammonita cuando Saúl empezó a reinar. Su amenaza empujó a Israel a pedir rey, y Saúl deshizo su ejército en Jabés.
  Bajo este nombre va también el Nahás leal a David, cuya muerte abrió la guerra con Hanún.
reason: Perspicacia «Nahás», núm. 1, y «Samuel»; 1Sa 11:1-11; 12:12. La misma entrada incluye al Nahás de 2Sa 10:1, 2, padre
  de Hanún, aunque ve posible que fuera hijo del primero.
not_claimed:
- 'Que muriera en la batalla de Jabés: eso lo cuenta Josefo, no la Biblia.'
- 'Que el rey de 1Sa 11 y el padre de Hanún sean un solo hombre: si Nahás murió luchando contra Saúl, como dice Josefo, Perspicacia
  ve en el segundo a su hijo y sucesor.'
