- name: Jehielí
  note: Forma de 1Cr 26:21, 22. Perspicacia «Jehiel», núm. 2, la refiere a él o a la casa paterna que tomó su nombre.
perspicacia: 1200002366#2
summary: Levita guersonita, cabeza de los hijos de Ladán. En los últimos años de David, él y los suyos guardaban el tesoro
  de la casa de Jehová, donde se depositaron las piedras preciosas donadas para el templo.
disambiguation: El guersonita de la casa de Ladán que custodiaba el tesoro del santuario (1Cr 23:8; 29:8). No es el músico
  levita que acompañó el arca ni el tutor de los hijos del rey.
reason: Perspicacia «Jehiel», núm. 2; 1Cr 23:6-8; 26:21, 22; 29:8.
