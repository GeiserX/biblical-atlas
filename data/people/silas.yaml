# biblical-atlas: un fichero por persona. Esquema en docs/investigacion/README.md.
id: silas
name: Silas
names:
- name: Silas
  note: Forma que usa Lucas en Hechos.
- name: Silvano
  note: Forma latina que usan Pablo y Pedro en sus cartas.
summary: Profeta de la congregación de Jerusalén, al parecer ciudadano romano. Compañero de Pablo en el segundo viaje. Es
  el Silvano por medio del cual Pedro escribió su primera carta, hacia 62-64.
reason: Perspicacia «Silas, Silvano» explica los dos nombres y su papel en el segundo viaje (Hch 15:40). La nota de 1Pe 5:12
  lo identifica con el Silvano de Pedro; Perspicacia ve posible que fuera su amanuense.
