id: joab-hijo-de-zeruya
name: Joab
names:
- name: Joab
perspicacia: 1200002469#2
disambiguation: El jefe del ejército de David, hijo de Zeruyá, hermana del rey; no Joab, hijo de Seraya, de Judá, ni los cabezas
  de familia que volvieron del destierro.
summary: 'Sobrino de David y jefe de su ejército. General capaz, pero vengativo: mató a Abner, a Absalón y a Amasá. Tras apoyar
  a Adonías, Salomón lo mandó ejecutar.'
reason: Perspicacia «Joab», núm. 2; 2Sa 8:16 y 1Re 2:28-34. Según el encabezamiento de Sal 60, a su regreso venció a Edom en
  el valle de la Sal, con 12.000 edomitas muertos.
