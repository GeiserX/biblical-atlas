perspicacia: 1200001853#5
disambiguation: El profeta falso de Gabaón, hijo de Azur, que rompió el yugo de Jeremías; no es Sadrac, cuyo nombre hebreo
  también era Hananías, ni el padre del príncipe Sedequías ni el abuelo de Iriya.
summary: Profeta falso de Gabaón. En el cuarto año de Sedequías anunció en el templo que en dos años Jehová quebraría el poder
  de Babilonia, y rompió el yugo de Jeremías. Murió ese mismo año, como Jeremías le dijo.
reason: Perspicacia «Hananías», núm. 5; Jer 28:1-17. «Toda Escritura», libro 24, cuenta su muerte entre las profecías que
  Jeremías vio cumplidas.
