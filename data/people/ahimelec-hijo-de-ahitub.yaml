disambiguation: El sumo sacerdote de Nob, bisnieto de Elí; no su nieto Ahimélec, hijo de Abiatar, ni Ahimélec el hitita que
  estuvo con David.
summary: Sumo sacerdote en Nob, donde estaba el tabernáculo. Ayudó a David, que huía de Saúl, sin saberlo. Por eso Saúl lo
  mandó matar con otros 84 sacerdotes; solo escapó su hijo Abiatar.
reason: Perspicacia «Ahimélec», núm. 1; 1Sa 21:1-9 y 22:9-20. El encabezamiento de Sal 52 cuenta que David fue a su casa.
