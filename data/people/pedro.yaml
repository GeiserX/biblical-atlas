id: pedro
name: Pedro
names:
- name: Pedro
  note: Nombre griego que en la Biblia solo lleva él.
- name: Simón
  note: Nombre griego; como Symeón, sale de un verbo hebreo que significa «oír» (nota de estudio de Mt 10:2).
- name: Symeón
  note: Forma griega del nombre hebreo Simeón (Hch 15:14), según la nota de estudio de Mt 10:2.
- name: Cefas
  note: Equivalente semítico de Pedro (Jn 1:42).
- name: Simón Pedro
- name: Barjonás
  note: «Hijo de Jonás» con la palabra aramea bar; forma que da la nota de estudio de Mt 16:17.
disambiguation: El apóstol. No es Simón el mago de Samaria ni Simón el curtidor de Jope, con quien se hospedó.
date:
  from: 29
  to: 64
  precision: range
  approx: true
  type: anchored
  chronology: tnm
  text: c. 29-64 e.c.
  note: 'Actividad conocida: desde que conoce a Jesús, en el otoño de 29, hasta su segunda carta, hacia 64.'
summary: Apóstol, hijo de Juan o Jonás y hermano de Andrés. Pescador en el mar de Galilea, casado. Portavoz en Pentecostés,
  abrió el camino a samaritanos y gentiles. Desde Babilonia escribió su primera carta y quizá la segunda.
reason: Perspicacia «Pedro» da sus cinco nombres (párr. 2), su familia y su oficio (párr. 3 y 4) y su papel en Hechos
  (párr. 17 a 22); «Pedro, Cartas de» sitúa las cartas en Babilonia.
