id: core-hijo-de-izhar
name: Coré
names:
- name: Coré
perspicacia: 1200002648#3
summary: Levita, hijo de Izhar y descendiente de Cohat. En el desierto encabezó con Datán y Abiram una rebelión contra Moisés
  y Aarón y murió en el fuego enviado por Jehová. Sus hijos sobrevivieron; de ellos salieron cantores del templo.
reason: Perspicacia «Coré», núm. 3, y «Coreíta», párr. 1 y 3. Varios salmos, empezando por el 42, el 44 y el 45, se atribuyen
  en su encabezamiento a los hijos de Coré, o sea, a sus descendientes.
disambiguation: No es el hijo de Esaú llamado Coré ni el Coré judaíta que era hijo de Hebrón (Perspicacia, núm. 1 y 2).
