# biblical-earth: un fichero por persona. Esquema en docs/investigacion/README.md.
id: akis
name: Akís
names:
- name: Akís
- name: Abimélec
  note: Así lo llama el encabezamiento del Salmo 34; Perspicacia lo ve como un título de los reyes filisteos, parecido a faraón.
perspicacia: '1200000078'
summary: 'Rey filisteo de Gat en tiempos de David y de Salomón. David, huyendo de Saúl, se refugió dos veces en su tierra:
  primero se fingió loco y luego vivió en Ziclag. Akís llegó a hacerlo su guardaespaldas.'
reason: Perspicacia «Akís», párr. 1 y 2, y «Abimélec», núm. 3; encabezamiento del Salmo 34.
disambiguation: 'No es ninguno de los reyes de Guerar llamados Abimélec en Génesis: en el Salmo 34 Abimélec es un título de
  Akís, rey de Gat.'
