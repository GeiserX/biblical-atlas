disambiguation: Benjamín hijo de Jacob; no la tribu ni los otros benjamitas del mismo nombre.
summary: Duodécimo hijo de Jacob y hermano de padre y madre de José; al parecer, el único nacido en Canaán. Raquel murió
  en el parto. Jacob lo quería mucho y le costó dejarlo ir a Egipto.
reason: Perspicacia «Benjamín», núm. 1, párr. 2 y 3; Gé 35:16-19 y 43:1-15.
