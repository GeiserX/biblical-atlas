summary: Benjamita, hijo de Quis. Samuel lo ungió como primer rey de Israel. Desobedeció a Jehová y fue rechazado; la víspera
  de caer ante los filisteos en el monte Guilboa, consultó a una médium en En-Dor.
reason: Perspicacia «Saúl», párr. 1, 3 y 16; 1Sa 10:1, 24; 28:7-25. El estudio 3 fecha su unción en 1117 y pone hacia 1078
  el final de 1 Samuel; Jonatán muere con él en 1078 (Perspicacia «Jonatán», núm. 2).
