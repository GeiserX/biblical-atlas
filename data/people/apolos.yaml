summary: Judío de Alejandría, elocuente y buen conocedor de las Escrituras. Áquila y Priscila le explicaron mejor el camino
  de Dios en Éfeso hacia 52; ayudó en Corinto y, hacia 61-64, Pablo pidió a Tito que lo proveyera para un viaje.
reason: Perspicacia «Apolos» (párr. 1 y 2) y la nota de estudio de Hch 18:24; Hch 18:24-28; 1Co 3:6. Su última mención es
  Tit 3:13, en la carta de c. 61-64.
