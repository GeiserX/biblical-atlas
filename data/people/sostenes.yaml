summary: Presidente de la sinagoga de Corinto, quizás sucesor de Crispo. La multitud lo golpeó ante Galión. Tal vez es el
  hermano Sóstenes que estaba con Pablo en Éfeso y quizá le escribió al dictado 1 Corintios.
