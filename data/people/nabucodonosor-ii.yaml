summary: Hijo de Nabopolasar y rey de Babilonia. Venció a Egipto en Carquemis, se llevó a Joaquín en 617 y destruyó Jerusalén
  en 607. Levantó la estatua de oro de Dura y pasó siete años loco, como le anunció Daniel.
reason: Perspicacia «Nabucodonosor, Nabucodorosor», párr. 1-6. Subió al trono en 625; su primer año cuenta desde nisán de 624
  (estudio 3).
