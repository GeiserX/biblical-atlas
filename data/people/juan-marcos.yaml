summary: Hijo de María de Jerusalén y primo de Bernabé; escribió el Evangelio de Marcos. Quizá fue el joven que huyó desnudo
  de Getsemaní. Dejó el primer viaje en Perga y volvió a Jerusalén.
reason: Perspicacia «Marcos» lo identifica con el Juan Marcos de Hechos y con el Juan de Hch 13:5, 13, y ve probable que fuera
  el joven de Mr 14:51, 52.
