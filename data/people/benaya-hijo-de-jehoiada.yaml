summary: Hijo del sacerdote Jehoiadá y guerrero muy valiente de David. Mandaba a los keretitas y los peletitas, fieles al
  rey en las rebeliones. Con Salomón ejecutó a Adonías, Joab y Simeí, y dirigió el ejército.
