id: lemuel
name: Lemuel
names:
- name: Lemuel
perspicacia: '1200002717'
summary: 'Rey sin identificar cuyas palabras forman el capítulo 31 de Proverbios: lo que su madre le enseñó sobre las mujeres,
  el vino, la justicia con el pobre y la esposa capaz.'
reason: Perspicacia «Lemuel» lo da como rey sin identificar; Pr 31:1, 4. El estudio del libro 20 añade que de Agur y Lemuel
  no se sabe nada seguro.
not_claimed:
- 'Que Lemuel sea Salomón o Ezequías: Perspicacia recoge que algunos lo identifican con uno u otro; el estudio del libro 20
  y La Atalaya de 2006, solo con Salomón.'
- 'Que reinara en Masá: según Perspicacia «Masá», en Pr 31:1 esa palabra significa mensaje de peso y Lemuel sería israelita.'
- 'Cuándo vivió: el estudio del libro 20 dice que lo que escribió no se puede fechar.'
