  text: '913-858 a.e.c. (tiempo narrativo: sumo sacerdote en los reinados de Jehoram, Ocozías, Atalía y Jehoás de Judá)'
summary: Sumo sacerdote casado con Jehoseba, hija del rey Jehoram. Coronó al niño Jehoás, hizo ejecutar a Atalía, renovó el
  pacto con Jehová y dirigió la reparación del templo. Murió a los 130 años y lo enterraron con los reyes.
reason: Perspicacia «Jehoiadá», núm. 3; 2Re 11:4-20 y 12:2, 7-10; 2Cr 23 y 24:2-22. Los límites de la fecha son el reinado
  de Jehoram de Judá (desde 913) y el de Jehoás (hasta 858), según la tabla A6-A.
