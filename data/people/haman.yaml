summary: Hijo de Hamedata, el agaguita, y primer ministro de Asuero. Tramó exterminar a los judíos del imperio y acabó colgado
  en el madero que había levantado para Mardoqueo.
reason: 'Perspicacia «Hamán»: agaguita, quizá amalequita de linaje real; decreto contra los judíos y su caída (Est 3:1-11;
