summary: Danita de Zorá, padre del juez Sansón. Un ángel anunció a su esposa estéril el nacimiento del hijo y volvió a petición
  suya. No quería una nuera filistea, pero fue con Sansón a Timná. En su tumba enterraron a Sansón.
