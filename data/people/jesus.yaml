# biblical-earth: un fichero por persona. Esquema en docs/investigacion/README.md.
id: jesus
name: Jesús
names:
- name: Jesús
- name: Jesucristo
  note: Nombre con el título Cristo, «Ungido», que le corresponde desde su bautismo (Perspicacia).
- name: la Palabra
  note: Título que Juan da a Jesús (Jn 1:1, 14; Ap 19:13). Según la nota de estudio, lo llevó como portavoz de Dios en el
    cielo, en la tierra y tras volver al cielo.
- name: Emmanuel
  note: Título profético de Is 7:14 y 8:8, «con nosotros está Dios», que Mt 1:23 aplica a Jesús (Perspicacia «Emmanuel»).
date:
  from: 29
  to: 33
  precision: range
  approx: false
  type: anchored
  chronology: tnm
  text: 29-33 e.c.
summary: Hijo de Dios, nacido de María en Belén hacia octubre de 2 a.e.c. y criado en Nazaret. Bautizado en el otoño de 29
  e.c., predicó unos tres años y medio, sobre todo en Galilea, hasta la Pascua de 33.
reason: Perspicacia «Jesucristo» (secciones «Cuándo nació y cuánto duró su ministerio», «Primeros años» y «Su bautismo») da
  las fechas y los lugares; la fecha de la ficha es la de su ministerio.
