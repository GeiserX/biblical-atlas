disambiguation: La esposa de Nabal y luego de David; no Abigaíl, la hermana de David (Perspicacia «Abigail», núm. 2).
summary: Mujer sensata y hermosa, casada con Nabal. Con comida abundante y una súplica humilde impidió que David se vengara
  de su marido. Al enviudar, días después, se casó con David.
reason: Perspicacia «Abigail», núm. 1; 1Sa 25:3, 14-42.
