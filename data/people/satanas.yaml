# biblical-earth: un fichero por persona. Esquema en docs/investigacion/README.md.
id: satanas
name: Satanás
names:
- name: Satanás
  note: 'Significa «resistidor»: el nombre le vino de oponerse a Dios.'
- name: Diablo
  note: Título que significa «calumniador».
- name: el Tentador
  note: Así lo llama Mt 4:3.
- name: Belcebú
  note: Así lo llaman los escribas en Mr 3:22. Perspicacia «Beelzebub» lo toma por un apelativo de Satanás, quizá sacado de
    Baal-zebub, el dios de Eqrón.
- name: el gobernante de este mundo
  note: Así lo llama Jesús en Jn 12:31, 14:30 y 16:11; la nota de estudio de Jn 16:8 y Perspicacia «Satanás» dicen que es
    él.
- name: el dios de este sistema
  note: 'Así lo llama 2Co 4:4. La nota de estudio lo identifica por lo que hace allí: ciega la mente de los no creyentes.'
- name: Belial
  note: Así lo llama Pablo en 2Co 6:15. La palabra hebrea quiere decir «inútil»; Perspicacia «Belial» y la nota de estudio
    dicen que en el siglo I ya era un apelativo de Satanás.
perspicacia: '1200003845'
disambiguation: El gran adversario de Dios. En hebreo, satán sin artículo nombra también a cualquiera que se opone a otro,
  como el ángel que cortó el paso a Balaam.
summary: Criatura espiritual que se rebeló contra Dios. En Edén engañó a Eva por medio de una serpiente, acusó a Job ante
  Jehová y le quitó bienes, hijos y salud, y tentó tres veces a Jesús tras su bautismo.
reason: Perspicacia «Satanás», párr. 1 a 4, los párrafos sobre Job y el apartado «Sus esfuerzos por hacer tropezar a Jesús»;
  Gé 3; Job 1:6-12; Mt 4:1-11.
