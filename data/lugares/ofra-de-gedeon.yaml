id: ofra-de-gedeon
nombre: Ofrá
nombres:
- nombre: Ofrá
  nota: Ofrá de Gedeón, en Manasés; no es la Ofrá de Benjamín (Perspicacia «Ofrá», núm. 2 y 3).
- nombre: Ofrá de los abí-ezritas
  nota: Así la llaman Jue 6:24 y 8:32.
- nombre: Jehová-Salom
  nota: Altar que Gedeón levantó en Ofrá tras ver al ángel; significa «Jehová es paz» (Jue 6:24). Perspicacia cree que fue
    un recuerdo, no un altar para sacrificios.
tipo: ciudad
