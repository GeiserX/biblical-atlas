lon: 35.29
precision: incierto
coord_fuente: openbible:abd637f
coord_url: https://www.openbible.info/geo/ancient/abd637f/ophrah-2
coord_nota: Punto de OpenBible en Afula (el-ʽAffuleh), su primera identificación; Perspicacia solo la propone de forma tentativa.
resumen: Ciudad de los abí-ezritas, al oeste del Jordán, donde vivía Gedeón. Allí lo comisionó el ángel, derribó el altar
  de Baal y levantó Jehová-Salom; después expuso su efod y lo enterraron allí. Abimélec mató allí a sus hermanos.
razon: 'Perspicacia «Ofrá», núm. 3, y «Jehová-salom»; Jue 6:11-32; 8:27, 32; 9:5. Se la iguala tentativamente con el-ʽAffuleh,
  unos 45 km al norte de Siquem. OpenBible: solo el punto.'
