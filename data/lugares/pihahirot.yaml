resumen: Último campamento de Israel antes de cruzar el mar Rojo, entre Migdol y el mar, frente a Baal-zefón. Como tampoco
  se sabe dónde estaban Migdol ni Baal-zefón, su sitio se deduce del relato.
razon: Perspicacia «Pihahirot» (párr. 3-7), Éx 14:1-3 y Nú 33:7-8. El mapa B3 lo dibuja junto al golfo de Suez.
