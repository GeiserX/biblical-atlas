id: jerusalen
nombre: Jerusalén
nombres:
- nombre: Jerusalén
- nombre: Salem
  nota: Nombre más antiguo que se conoce de la ciudad, en tiempos de Abrahán (Gé 14:18).
- nombre: Jebús
  hasta: -1069
  nota: Nombre que a veces recibió mientras la ocupaban los jebuseos, hasta que David la tomó en 1070 a.e.c. (Jue 19:10).
- nombre: Ciudad de David
  desde: -1069
  nota: Nombre de la fortaleza de Sion que David tomó y habitó (2Sa 5:7).
- nombre: Sion
  nota: Nombre de la fortaleza y, por extensión, de la ciudad (Is 33:20). Es la grafía de la TNM; Perspicacia escribe «Sión».
- nombre: Ciudad santa
  nota: Se la llamaba así porque en ella estaba el templo de Jehová (Mt 4:5; Ne 11:1).
- nombre: Torre de Siloam
  nota: Torre de la ciudad que cayó y mató a 18 personas (Lu 13:4). Perspicacia «Siloam» no conoce su sitio exacto; la nota
    de estudio la pone probablemente cerca del estanque de Siloam.
- nombre: Puerta de las Ovejas
  nota: Puerta del norte, cerca del templo, junto al estanque de Betzata (Jn 5:2). Perspicacia ve probable que sea la que
    reconstruyeron los sacerdotes con Nehemías (Ne 3:1) u otra en el mismo sitio.
- nombre: Fortaleza Antonia
  nota: Cuartel de la tropa romana pegado al recinto del templo, en su ángulo noroeste; allí subieron a Pablo tras el motín
    (nota de estudio de Hch 21:34).
- nombre: Torre de David
  nota: Torre de Can 4:4 de la que colgaban mil escudos. Perspicacia recoge que quizá sea la de la Casa del Rey (Ne 3:25);
    no es la moderna así llamada, de Herodes.
