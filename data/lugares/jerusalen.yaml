resumen: Capital de Israel desde 1070 a.e.c. y de Judá tras la división. Babilonia la destruyó en 607 a.e.c. Siglos después,
  Pablo subió allí en 49 por la circuncisión y lo arrestaron en 56.
razon: 'Perspicacia «Jerusalén», párr. 1-3, 21 y 35; «Jebús», párr. 1-3; «Salem», párr. 2. Pablo: Hch 15:4-29. OpenBible:
  solo el punto.'
