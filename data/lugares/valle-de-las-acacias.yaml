resumen: 'Cauce seco que Joel 3:18 nombra en una promesa: lo regará un manantial salido de la casa de Jehová, figura de sus
  bendiciones. No se sabe con seguridad dónde estaba.'
razon: Perspicacia «Sitim», núm. 2, y «Acacia»; Joe 3:18 y su nota. La adoración pura (recuadro 19A) toma el manantial como
  figura. El sitio solo se propone como posible.
no_afirmamos:
- 'Que sea con seguridad el curso bajo del Cedrón: Perspicacia lo ofrece solo como posibilidad.'
- Que Joel prometa un riego literal del valle. La adoración pura pone el manantial entre los ríos que representan las bendiciones
  de Jehová, como el de Ezequiel 47.
