resumen: Ciudad del valle del Jordán, unos 250 m bajo el nivel del mar. En 1473 a.e.c. fue la primera que Israel tomó al oeste
  del río. En tiempos de Jesús había otra al sur; allí se alojó con Zaqueo.
razon: 'Perspicacia «Jericó» (párr. 2 y 13) y la nota de Mt 20:29 explican las dos ciudades; Lu 19:1-7. El mismo artículo
  fecha la toma en 1473 a.e.c. (Jos 6). OpenBible: solo el punto.'
