coord_nota: 'Punto de Sufeh, tercera identificación de OpenBible: es Khirbet Sufa, que Perspicacia da con reservas como
  el sitio, a unos 6 km al sur-sureste de Madaba. Sufá comparte este mismo punto.'
resumen: Lugar al este del Jordán que, con otros, sirve para situar dónde habló Moisés a Israel al terminar los cuarenta años
  en el desierto. No se sabe con seguridad dónde estaba.
razon: 'Perspicacia «Suf»; Dt 1:1, 5. No es Sufá, que Perspicacia trata en otro artículo. OpenBible: solo el punto.'
nota: La Septuaginta y la Vulgata ponen «mar Rojo» en lugar de Suf, lo que apuntaría al golfo de ʽAqaba. Perspicacia sigue
  el texto hebreo, que junto con el versículo 5 sitúa el lugar en Moab, al este del Jordán.
