resumen: Sitio adonde, según Amós, serían echadas las mujeres ricas de Samaria. No se sabe qué designa la palabra hebrea;
  quizá el peñasco de Rimón, cerca de Betel.
razon: 'Perspicacia «Harmón»: no se puede precisar; otras versiones traducen «palacio» o «estiércol». Am 4:3. El punto del
  candidato es de OpenBible.'
no_afirmamos:
- 'Que Harmón sea con seguridad un lugar con nombre propio: Perspicacia no sabe a qué alude la palabra hebrea.'
- 'Que Harmón esté en el monte Hermón, como propone OpenBible: esa identificación no viene de jw.org.'
