nombre: Monte Hor
nombres:
- nombre: Monte Hor
  nota: En hebreo, «Hor la montaña». No es el Hor del límite norte de Canaán (Nú 34:7, 8), que Perspicacia trata aparte.
tipo: monte
lat: 30.832057
lon: 35.056872
precision: incierto
coord_fuente: openbible:ad8027f
coord_url: https://www.openbible.info/geo/ancient/ad8027f/mount-hor-1
coord_nota: Punto de OpenBible en Har Zin (Jebel Madurah), al suroeste del mar Muerto. Perspicacia dice que muchos eruditos
  lo prefieren; no es seguro.
resumen: Monte en la frontera de Edom al que Israel llegó desde Cadés. En su cima Moisés pasó las ropas de sumo sacerdote
  de Aarón a Eleazar, y allí murió Aarón.
razon: 'Perspicacia «Hor», núm. 1; Nú 20:22-29. La tradición lo pone en Jebel Harun, junto a Petra, pero ese monte queda dentro
  de Edom, adonde Israel no entró. OpenBible: solo el punto.'
no_afirmamos:
- 'Que sea Jebel Harun, cerca de Petra: estaría dentro de Edom y no en su frontera.'
