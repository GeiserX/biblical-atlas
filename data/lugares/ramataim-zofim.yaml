id: ramataim-zofim
nombre: Ramá
nombres:
- nombre: Ramá
  nota: Forma corta que usa el relato desde 1Sa 1:19; Perspicacia la trata como Ramá, núm. 5.
- nombre: Ramataim-Zofim
  nota: Nombre largo de 1Sa 1:1. La nota al pie permite leer «de Ramá, un zufita»; Perspicacia lo da por la misma ciudad.
- nombre: Nayot
  nota: 'Nayot de Ramá (1Sa 19:18-24): sitio donde al parecer vivían profetas; Perspicacia «Nayot» cree que era un barrio
    o paraje de esta ciudad.'
