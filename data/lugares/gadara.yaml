coord_nota: Punto de la ciudad de Gadara (Um Qeis), centro del distrito, que llegaba hasta el lago.
resumen: Distrito al sureste del mar de Galilea con centro en la ciudad de Gadara, a unos 10 km del lago. En esa orilla Jesús
  dejó que unos demonios entraran en una piara de cerdos.
razon: Perspicacia «Gadarenos» (párr. 2 y 3) y la nota de Mt 8:28 describen el distrito; B10 pone Gadara en la Decápolis.
  La nota de Mr 5:1 da a los gerasenos casi la misma zona; Perspicacia «Gerasenos» no fija límites.
