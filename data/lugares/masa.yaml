resumen: Paraje cercano a Refidim donde Israel, falto de agua, riñó con Moisés y desafió a Jehová. Moisés golpeó una roca
  y brotó agua; de ahí los nombres Masá y Meribá que recibió el sitio.
razon: Perspicacia «Masah» y «Meribá», núm. 1. Sl 95:8 lo recuerda como aviso contra la terquedad; según Perspicacia, quizá
  aluda también al Meribá de Cadés.
