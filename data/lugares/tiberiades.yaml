resumen: Ciudad fundada por Herodes Antipas entre 18 y 26 e.c. en la costa oeste del lago, con el nombre de Tiberio, y sede
  de su tetrarquía. Al parecer, Juan el Bautista murió preso allí.
razon: Perspicacia «Tiberíades» (núm. 1) da la sede; la nota de Jn 6:23, más reciente, la fundación. La nota de Mt 14:3 ve
  más probable que Juan muriera allí que en Maqueronte. Coordenada de OpenBible.
