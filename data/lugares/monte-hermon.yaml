id: monte-hermon
nombre: Monte Hermón
nombres:
- nombre: Hermón
- nombre: Sirión
  nota: Nombre que le daban los sidonios (Dt 3:9). Como Sl 29:6 lo pone junto al Líbano, hay quien cree que designa todo el
    Antilíbano.
- nombre: Senir
  nota: Nombre que le daban los amorreos (Dt 3:9); quizá también de una parte del Antilíbano (1Cr 5:23).
- nombre: Siyón
  nota: Otro nombre del monte, distinto de Sion (Dt 4:48).
tipo: monte
