lon: 35.85
precision: punto
coord_fuente: openbible:a341fe8
coord_url: https://www.openbible.info/geo/ancient/a341fe8/mount-hermon
resumen: El monte más alto de la región, nevado casi todo el año, en el extremo sur del Antilíbano. Sus nieves alimentan el
  Jordán y fue el límite norte de la Tierra Prometida.
razon: 'Perspicacia «Hermón» (nombres, altura, rocío y nieves, límite norte) y «Sirión». Sl 29:6 lo llama Sirión. OpenBible:
  solo el punto.'
