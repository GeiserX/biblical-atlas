resumen: Región de Egipto donde vivió Israel entre 1728 y 1513 a.e.c., 215 años. Era la mejor tierra de pastos, y desde la
  cuarta plaga quedó libre de los castigos. Su sitio exacto es incierto.
razon: Perspicacia «Gosén» (párr. 3-4), Gé 45:10 y 47:27, Éx 8:22. El mapa B3 y «El mundo de los patriarcas» la dibujan en
  el este del delta.
