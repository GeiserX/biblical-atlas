resumen: Monte donde Israel acampó casi un año y recibió la Ley. No se sabe cuál es con seguridad; lo más citado es un macizo
  de dos cumbres en el sur de la península del Sinaí.
razon: Perspicacia «Sinaí» (párr. 3-6) y «Horeb» (párr. 3); el mapa B3 lo dibuja. Har Karkom y Jebel Sin Bishar no aparecen
  en wol.jw.org, así que no los incluimos.
