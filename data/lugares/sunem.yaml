resumen: Ciudad de Isacar, cerca de Jezreel y del monte Guilboa, hoy Sulam. Allí acamparon los filisteos antes de la batalla
  en que murió Saúl. Era la tierra de la sulamita, y junto a ella acampó Salomón en el Cantar.
razon: 'Perspicacia «Sunem», párr. 1. La sulamita es campesina de Sunem según Perspicacia «Cantar de los Cantares, El», párr.
  1, y «Toda Escritura», libro 22, párr. 5, que sitúa el drama cerca; «Sulamita» dice probablemente. OpenBible: solo el punto.'
