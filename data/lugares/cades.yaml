resumen: Campamento de Israel en el desierto, en el borde del territorio de Edom. De allí salieron los doce espías, y allí
  murió Míriam. Estaba entre los desiertos de Zin y Parán.
razon: Perspicacia «Qadés» (párr. 3-9); Nú 13:26 y 20:1. La Traducción del Nuevo Mundo de hoy escribe «Cadés». El mapa B3 y «De Egipto a la Tierra
  Prometida» lo dibujan.
