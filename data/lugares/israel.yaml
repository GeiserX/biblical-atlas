resumen: La Tierra Prometida, repartida entre las doce tribus y gobernada por sus reyes. Tras la división del reino el nombre
  designó a veces solo al reino del norte; luego, a la tierra de los judíos.
razon: Perspicacia «Israel», núm. 3 y 4; Mt 2:20, 21. La zona del mapa es un cálculo nuestro.
