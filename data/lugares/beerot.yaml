resumen: Una de las cuatro ciudades heveas que, por medio de Gabaón, lograron con astucia el pacto con Josué. Después fue
  de Benjamín, quizá como ciudad de frontera, y se repobló tras el exilio.
razon: 'Perspicacia «Beerot», párr. 1 y 2; Jos 9:17; 18:25. Perspicacia no elige entre Khirbet el-Burj o Nabi Samwil, al sur,
  y el-Bira, al norte. OpenBible: solo los puntos.'
