  razon: Propuesto en el siglo XIX, en un risco cerca de la Puerta de Damasco, hacia el noreste. Perspicacia no ve pruebas,
    y la tumba del Jardín cercana es siglos anterior a Jesús (párr. 5-6).
  coord_fuente: openbible:a631d35
  coord_url: https://www.openbible.info/geo/ancient/a631d35/golgotha
resumen: Lugar a las afueras de Jerusalén donde ejecutaron a Jesús; cerca pasaba un camino y había un jardín con una tumba
  nueva. La Biblia no dice que fuera una colina, y hoy nadie sabe con exactitud dónde estaba.
razon: Perspicacia «Gólgotha» (párr. 3-6), nota de estudio de Jn 19:17 y «¿Por qué tuvo que morir Jesús?» (párr. 22). El mapa
  B12-A lo marca con signo de duda.
