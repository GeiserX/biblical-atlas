summary: La congregación de Filipos manda a Epafrodito con un regalo para Pablo, preso en Roma. Allí lo atiende, arriesga
  la vida y cae tan enfermo que casi muere, pero Dios se compadece y sana.
reason: 'Perspicacia «Epafrodito»: lo envían durante el primer encierro en Roma (c. 59-61) y enferma allí; «Filipenses, Carta
