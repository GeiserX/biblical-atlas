summary: Cuando Adonías intenta quedarse con el trono, David manda ungir a Salomón. En el manantial de Guihon, Sadoc lo unge
  con Natán, Benaya y la guardia presentes, y el pueblo sube tras él a Jerusalén aclamándolo.
reason: 1Re 1:32-40; 2:12. El estudio 3 fecha la sucesión en 1037 y explica el año de ascenso (párr. 4); Perspicacia «Natán»,
  núm. 2, párr. 4, y «Guihón», núm. 2, que sitúa allí la unción.
