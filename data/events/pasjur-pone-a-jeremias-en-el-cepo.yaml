summary: En el patio del templo, Jeremías repite el aviso de Tófet. Pasjur, supervisor del templo, lo golpea y lo deja la
  noche en el cepo; al soltarlo, Jeremías le anuncia que morirá desterrado en Babilonia, y luego se lamenta.
reason: 'Jer 20:1: Pasjur oye lo que Jeremías dijo en el patio (19:14, 15). «Dios nos habla mediante Jeremías», cap. 7, párr.
  7-11, une el lamento de 20:7-18 a ese maltrato. Sin rey: entre 647 y 607 (estudio 3).'
