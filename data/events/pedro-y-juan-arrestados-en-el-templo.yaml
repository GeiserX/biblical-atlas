summary: 'Mientras hablan al pueblo, se presentan sacerdotes, saduceos y el capitán del templo, molestos porque anuncian que
  Jesús resucitó. Los encierran hasta el día siguiente, pero muchos creen: ya son unos 5.000 hombres.'
