summary: El año en que muere Uzías, Isaías ve en visión a Jehová en su trono. Un serafín le limpia los labios con una brasa
  y él se ofrece a ir; Jehová le anuncia que el pueblo no querrá entender.
reason: «Las profecías de Isaías», cap. 8, párr. 1-3, pone la visión en 778 y dice que no consta dónde estaba Isaías. «Toda
  Escritura», libro 23, párr. 2, añade que ya profetizaba antes (Is 1:1).
