summary: 'Por orden de Jehová, Jeremías se pone al cuello correas y yugos y los envía por los mensajeros que visitaban a Sedequías:
  Edom, Moab, Ammón, Tiro y Sidón tendrán que someterse a Nabucodonosor o sufrir espada, hambre y peste.'
reason: 'Jer 28:1 lo pone en el año cuarto de Sedequías, 614 según Perspicacia «Seraya», núm. 5. El «Jehoiaquim» de 27:1 quizá
  es error de copista (Perspicacia «Sedequías», núm. 4). Los cinco reinos solo reciben yugos: no sitúan a nadie.'
