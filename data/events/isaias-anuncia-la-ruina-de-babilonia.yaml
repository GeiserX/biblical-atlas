summary: Isaías ve en visión que Jehová levantará a los medos contra la orgullosa Babilonia, que quedará despoblada para siempre,
  y que Israel, ya libre, se burlará de su rey. Jehová jura también quebrar al asirio.
reason: '«Toda Escritura», libro 23, párr. 14, agrupa Is 13:1-14:27. No lleva fecha: Isaías empezó hacia 778, y el encabezamiento
  del libro las pone en días de reyes que acaban con Ezequías (716, A6-B). No consta dónde tuvo la visión.'
