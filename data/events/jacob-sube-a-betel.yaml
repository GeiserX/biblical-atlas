summary: Por orden de Dios, Jacob hace que su casa entregue los dioses extranjeros, los entierra junto a Siquem y sube a Betel,
  donde construye un altar. Allí muere Débora, la nodriza de Rebeca.
reason: Jacob vuelve a Canaán en 1761 (estudio 3); Benjamín tenía de 40 a 50 años al morir Jacob en 1711 (Perspicacia «Benjamín»).
