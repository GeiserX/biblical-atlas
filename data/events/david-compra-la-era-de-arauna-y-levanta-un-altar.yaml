summary: 'Por orden de Gad, David sube a la era de Arauna, u Ornán, el jebuseo. No la acepta regalada: la paga, levanta un
  altar y ofrece sacrificios; Jehová responde con fuego del cielo y la epidemia cesa.'
reason: '2Sa 24:18-25; 1Cr 21:18-30. Perspicacia «Arauna» cree que 50 siclos de plata pagaron el sitio del altar y las reses,
  y 600 de oro el recinto del templo. Final del reinado: entre 1070 y c. 1040 (estudio 3).'
