summary: 'Ammón paga a sirios de Bet-Rehob, Zobá, Maacá e Istob. Joab reparte el ejército: él se enfrenta a los sirios y su
  hermano Abisái a los ammonitas. Todos huyen, y Joab regresa a Jerusalén.'
reason: '2 Samuel no nombra el campo: 1Cr 19:7 y Perspicacia «Medebá» ponen a los sirios ante Medebá, donde lucha Joab. Abisái
  ataca la ciudad, probablemente Rabá («Rabá», núm. 1, párr. 3). Fecha: entre 1070 y c. 1040 (estudio 3).'
