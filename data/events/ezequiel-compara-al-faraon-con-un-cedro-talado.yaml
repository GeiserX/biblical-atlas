summary: 'Poco antes de la caída de Jerusalén, Jehová da a Ezequiel un mensaje para el faraón: Egipto es como un cedro enorme
  y soberbio que un conquistador cortará y que bajará a la Tumba.'
reason: 'Eze 31:1-18. La Atalaya de 2007 y Perspicacia «Árbol» aplican el cedro al faraón y sus multitudes. El sitio se deduce:
  Ezequiel vivía en Tel-Abib (Perspicacia «Ezequiel»). Fecha: cuenta nuestra en date.note.'
