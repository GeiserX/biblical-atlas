summary: Tras un sitio de tres años que empezó en 742, Asiria toma Samaria. Con su caída acaba el reino de diez tribus, que
  había durado 257 años.
reason: Estudio 3 (740); Perspicacia «Ezequías», párr. 10 (sitio desde 742) y «Salmanasar», párr. 15 (257 años). Sitió Salmanasar
  V (2Re 18:9); «Sargón» ve probable que la toma fuera suya. A6-B da el mismo año.
