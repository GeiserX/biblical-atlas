history:
- date: '2026-09-30'
  change: 'Se decide la duda de Oseas: Salmanasar V sigue presente. Sitió la ciudad (2Re 18:9) y Perspicacia «Sargón» tiene
    por jactancia la toma que Sargón se atribuye.'
  source: it-sargon
- date: '2026-09-30'
  change: El vasallaje y la cárcel de Hosea (2Re 17:3, 4) y el destierro (2Re 17:6; 18:11, 12) son ahora sucesos propios;
    este se queda con el sitio y la toma.
  source: 2-reyes-17
- date: '2026-09-30'
  change: El destierro de los israelitas pasa a asiria-destierra-a-israel; el resumen cuenta solo el sitio y la toma.
  source: 2-reyes-17
- date: '2026-09-30'
  change: 'Ezequías no actúa en la escena: 2Re 18:9, 10 solo fecha el sitio por sus años de reinado.'
  source: 2-reyes-18
- date: '2026-09-30'
  change: Hosea sale de quienes actúan. Salmanasar lo encerró antes de sitiar Samaria (2Re 17:4, 5; Perspicacia «Hosea»),
    y 2Re 17:6 y 18:10 solo fechan la toma por sus años de reinado.
  source: it-hosea
