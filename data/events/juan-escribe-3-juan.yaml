summary: 'Ya anciano, el apóstol Juan escribe, probablemente desde Éfeso, a su amigo Gayo: alaba cómo acoge a los hermanos
  que viajan, censura a Diótrefes y habla bien de Demetrio.'
reason: 'Tabla de los libros: Éfeso o cerca, c. 98. Estudio 3, párr. 29: libre ya de Patmos, escribió el Evangelio y tres
  cartas. «Toda Escritura», libro 64, párr. 2, lo da por escritor; Perspicacia «Juan, Cartas de»: probablemente Éfeso.'
note: 'Pasajes: el saludo y el v. 13, donde habla de escribir. Orden 2982 de hechos, nuestro, tras 2 Juan (2981). El escrito
  anterior a la congregación de 3Jn 9 es otro y ninguna fuente lo identifica.'
