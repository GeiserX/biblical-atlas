summary: 'Un ángel lleva a Juan a una montaña alta y le muestra la Nueva Jerusalén, la esposa del Cordero: una ciudad cúbica
  de oro y piedras preciosas, sin templo, con un río de agua de vida y árboles de vida.'
reason: '«Toda Escritura», libro 66, párr. 6, la cuenta como la visión 16 (Ap 21:9-22:5); párr. 5: Patmos, hacia 96. Juan
  está en Patmos aunque en la visión lo lleven a una montaña. Orden 21009.'
