summary: Senaquerib envía desde Lakís al rabsaqué con un gran ejército. Junto al canal del estanque superior, este se burla
  de Jehová y, en hebreo para que lo oiga el pueblo, exige la rendición. Eliaquim, Sebná y Joá no le contestan.
reason: 'Is 36:1, 2 lo pone en el año 14 de Ezequías, 732 a.e.c. (estudio 3). Rabsaqué es un título y su nombre no consta
  (Perspicacia «Rabsaqué»): no tiene ficha, y por eso el suceso no lleva papel de quien habla.'
