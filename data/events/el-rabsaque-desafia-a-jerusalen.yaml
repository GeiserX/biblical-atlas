summary: Senaquerib envía desde Lakís al tartán, al rabsarís y al rabsaqué con un gran ejército. Junto al estanque superior,
  el rabsaqué se burla de Ezequías y de Jehová a gritos, en hebreo, ante la muralla.
reason: 'Año 14 de Ezequías, 732 a.e.c., durante el sitio de Lakís (Is 36:1, 2; estudio 3; Perspicacia «Rabsaqué»). El rabsaqué
  es un título sin nombre, así que nadie lleva papel. Ezequías no salió al canal: seguía en la ciudad.'
