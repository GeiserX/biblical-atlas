summary: El faraón Nekó marcha hacia el Éufrates para ayudar a Asiria. Josías sale a detenerlo en Meguidó y cae herido de
  muerte; muere camino de Jerusalén o al llegar, y el pueblo corona a su hijo Jehoacaz.
reason: 'A6-B y el estudio 3 ponen el comienzo de Jehoacaz en 628; Perspicacia «Josías», núm. 1, párr. 9, y «Meguidó», párr.
  8. El papel no lleva sitio: 2Re 23:29 dice Meguidó y 2Cr 35:24, Jerusalén.'
