history:
- date: '2026-09-28'
  change: Perspicacia «Josías» y «Carquemis» fechaban la muerte hacia 629 a.e.c.; A6-B, más reciente, pone a su sucesor en
    628, como el estudio 3.
  source: tnm-a6-b
- date: '2026-09-30'
  change: 'Josías salió a luchar contra Nekó y cayó en Meguidó (2Re 23:29): estaba allí, y present no lo llevaba.'
  source: 2-reyes-23
- date: '2026-09-30'
  change: El título lo hacía morir en Meguidó; 2Cr 35:24 dice que murió en Jerusalén, y Perspicacia «Josías» deja abierto
    si en el camino o al llegar.
  source: 2-reyes-23
- date: '2026-09-30'
  change: El resumen decía que Josías moría en Meguidó. 2Re 23:29, 30 y 2Cr 35:23, 24 no coinciden en el sitio; se dice solo
    lo que dan los dos.
  source: 2-cronicas-35
- date: '2026-09-30'
  change: 'La razón explica por qué el papel died no lleva lugar: los dos relatos no dan el mismo sitio de la muerte.'
  source: 2-reyes-23
