summary: 'Desde su año 12, Josías limpia Judá y Jerusalén: derriba los altares de los Baales, hace polvo postes e imágenes
  y quema huesos de sacerdotes en sus altares. Luego hace lo mismo en el antiguo Israel, hasta Neftalí.'
reason: '2Cr 34:3-7; Perspicacia «Josías», núm. 1, párr. 3: la campaña duró quizá hasta el año 18 y alcanzó el norte del antiguo
  reino de diez tribus. Perspicacia «Simeón» deduce de 34:6 que esa tribu se había unido al norte.'
