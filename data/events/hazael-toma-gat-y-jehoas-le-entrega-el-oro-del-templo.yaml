summary: Hazael, rey de Siria, toma Gat y se vuelve contra Jerusalén. Su pequeño ejército vence al gran ejército de Judá y
  mata a los príncipes; Jehoás le entrega el oro del templo y del palacio, y Hazael se retira.
reason: 2Re 12:17, 18; 2Cr 24:23, 24; Perspicacia «Hazael» y «Jehoás», núm. 1, que pone a Hazael al frente de los sirios.
  «Gat» pone la toma poco después del año 23 de Jehoás (876 a.e.c.). Jehoás murió en 858 (tabla A6-A).
