summary: Una voz como de trompeta manda a Juan escribir lo que ve. Al volverse, ve a Jesús glorificado entre siete candelabros
  de oro, y Jesús le dicta un mensaje para cada una de las siete congregaciones de Asia.
reason: 'Primera de las 16 visiones según «Toda Escritura», libro 66, párr. 6 y 8, y el libro Apocalipsis, cap. 5, que la
  abre en Ap 1:10. Fecha c. 96 y Patmos: estudio 3, Tabla de los libros y Perspicacia «Patmos».'
note: 'Orden 1010 de la serie apocalipsis, nuestro: capítulo por mil más el primer versículo, como las demás visiones del
  libro. El libro Apocalipsis, cap. 6, sitúa los mensajes a las congregaciones en 96.'
not_claimed:
- 'Cuándo se cumple lo visto: el libro Apocalipsis, cap. 5, aplica esta visión sobre todo al día del Señor, desde 1914. El
  suceso solo fecha el momento en que Juan la tuvo.'
