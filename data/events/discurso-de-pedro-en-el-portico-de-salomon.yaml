summary: La gente corre asombrada al Pórtico de Salomón. Pedro dice que el cojo sanó por el nombre de Jesús, a quien ellos
  rechazaron ante Pilato y Dios resucitó, y los llama a arrepentirse para que se borren sus pecados.
reason: Hch 3:11-26 y el capítulo 4 de «Testimonio completo» (párr. 3 a 6). Perspicacia «Columnata de Salomón» dice que los
  discípulos siguieron predicando allí. El año sale de Perspicacia «Herodes», núm. 2.
