summary: 'Jehová avisa a Ezequiel de que le quitará a su amada esposa. Ella muere al atardecer y él, como se le mandó, no
  hace duelo: así harán los desterrados cuando Jehová profane su santuario.'
reason: '«Toda Escritura», libro 26, párr. 2 y 20: la esposa murió el día en que empezó el sitio final (609, estudio 3). Sin
  nombre ni ficha, no lleva papel. Perspicacia «Ezequiel», párr. 4, lo pone en Tel-abib.'
