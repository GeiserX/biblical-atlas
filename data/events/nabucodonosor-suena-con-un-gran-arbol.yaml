summary: En su palacio, el rey sueña con un árbol enorme que un vigilante del cielo manda talar. Los sabios fallan; Daniel
  le explica que el árbol es él, que vivirá siete tiempos entre las bestias, y le aconseja cambiar.
reason: Perspicacia «Daniel», núm. 2, lo pone tiempo después del horno, y «Nabucodonosor», párr. 1, cuenta los siete tiempos
  dentro de su reinado (624-582). El libro de Daniel, cap. 6, párr. 18, lo pone tras el ascenso de los tres.
