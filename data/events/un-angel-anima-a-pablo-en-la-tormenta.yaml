summary: 'Tras muchos días de temporal, Pablo se levanta ante los de a bordo: un ángel de Dios le dijo de noche que comparecerá
  ante César y que todos vivirán. Solo se perderá el barco, junto a una isla.'
reason: 'Hch 27:21-26; Perspicacia «César» une el mensaje a la apelación ante Nerón. Van a la deriva por el mar de Adria
  (Hch 27:27) y la isla anunciada es Malta (referencia de 27:26), aún lejos: el suceso no sitúa a nadie.'
