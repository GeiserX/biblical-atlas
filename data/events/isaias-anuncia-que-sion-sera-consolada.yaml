summary: 'Consuelo para Sion: el siervo de Jehová será luz de las naciones y morirá por los pecados de muchos, y Jerusalén,
  como esposa abandonada, volverá a llenarse de hijos. Jehová reprueba la idolatría y promete un Recomprador.'
reason: '«Toda Escritura», libro 23, párr. 26-29, agrupa Is 49:1-59:21, escrito tras avisar a Ezequías («Las profecías de
  Isaías I», cap. 30, párr. 3). Perspicacia «Isaías» cierra su obra poco después de 732; 716 (A6-B: muere Ezequías) es el
  tope.'
