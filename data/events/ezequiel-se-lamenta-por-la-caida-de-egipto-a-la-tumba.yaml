summary: 'En el mismo año 12 del destierro, Ezequiel se lamenta por Egipto: bajará a la Tumba, donde ya yacen Asiria, Elam,
  Mesec y Tubal, Edom y los sidonios, y allí el faraón se consolará al verlos.'
reason: Eze 32:17-32. Perspicacia «Egipto, egipcio» lee el capítulo como juicio en lenguaje simbólico, y «Elam» cuenta a Elam
  entre las naciones que bajan al Seol. Sin narrative_order, como Eze 32:1. Lugar deducido de Perspicacia «Ezequiel».
