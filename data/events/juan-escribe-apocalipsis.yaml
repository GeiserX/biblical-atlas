summary: Ya anciano y desterrado en Patmos, el apóstol Juan pone por escrito las visiones que recibe y las envía, en forma
  de carta, a siete congregaciones de la provincia de Asia.
reason: 'Tabla de los libros: Patmos, c. 96. «Toda Escritura», libro 66, párr. 5: hacia 96, durante su destierro. Perspicacia
  «Revelación a Juan, Una»: el propio Juan se nombra escritor y sitúa la obra en Patmos (Ap 1:1, 9).'
note: 'Pasajes: el prólogo y cada versículo donde Juan dice que escribe o se le manda escribir. Orden 2960 de hechos, nuestro:
  tras 2 Timoteo (c. 65), antes de 1 Juan (2980, c. 98), con sitio para el Evangelio.'
