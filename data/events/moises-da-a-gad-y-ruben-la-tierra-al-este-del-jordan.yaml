summary: Gad y Rubén, con mucho ganado, piden quedarse con Galaad. Moisés les reprocha que desanimen al pueblo, como sus padres.
  Prometen cruzar armados y luchar, y reciben con media tribu de Manasés los reinos de Sehón y Og.
reason: Nú 32:1-33; Perspicacia «Galaad» resume la petición y la condición. El texto no nombra el campamento; Perspicacia
