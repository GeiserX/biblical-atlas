summary: Un ángel lleva en espíritu a Juan a un desierto y le muestra a Babilonia la Grande, una prostituta sentada sobre
  una bestia escarlata de siete cabezas y diez cuernos que acabará volviéndose contra ella.
reason: Undécima visión de Apocalipsis (Ap 17:1-18) según «Toda Escritura», libro 66, párr. 6 y 23, y el libro sobre Apocalipsis,
  cap. 33 a 35. Juan las recibió preso en Patmos hacia 96 (libro 66, párr. 5; estudio 3; Tabla).
note: 'Orden 17001 de la serie apocalipsis, nuestro. El desierto no tiene nombre y Babilonia la Grande no es la ciudad de
  Mesopotamia (Perspicacia «Babilonia la Grande»): ninguno lleva ficha.'
