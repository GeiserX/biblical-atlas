summary: 'David da a Salomón el plano que Jehová le hizo conocer: pórtico, cámaras, patios, tesoros y turnos de sacerdotes
  y levitas, con el peso del oro y la plata de cada utensilio. Lo anima a terminar la obra.'
reason: 1Cr 28:11-21. Perspicacia «David», apartado «Compra del lugar para el templo», dice que David trazó los planos por
  inspiración, y «Salomón» la pone antes de los últimos consejos de David a su hijo. Misma asamblea y año que el discurso.
