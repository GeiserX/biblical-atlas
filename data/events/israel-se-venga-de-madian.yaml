summary: Por orden de Jehová, Moisés envía mil hombres de cada tribu con el sacerdote Finehás. Matan a los varones, a los
  cinco reyes y a Balaam, queman las ciudades y vuelven al campamento con cautivos y botín.
reason: Nú 31:1-12 no dice dónde estaban las ciudades; Perspicacia «Madián, madianitas», núm. 3, pone a estos madianitas cerca
