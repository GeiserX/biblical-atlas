summary: 'Ya muy anciano y libre del destierro de Patmos, el apóstol Juan escribe, probablemente desde Éfeso, una carta sin
  saludo para los cristianos: que sigan firmes en la fe en Jesús ante los anticristos y se amen.'
reason: 'Tabla de los libros: Éfeso o cerca, c. 98. Estudio 3, párr. 29: libre ya de Patmos, escribió después el Evangelio
  y tres cartas. Perspicacia «Juan, Cartas de» y La Atalaya de 2008: probablemente en Éfeso.'
note: 'Pasajes: el prólogo y cada versículo donde dice que escribe. Orden 2980 de hechos, nuestro, tras 2 Timoteo (c. 65). Sigue a Apocalipsis (c. 96) por fecha; Perspicacia «Juan, Cartas de», párr. 1, pone las cartas tras el Evangelio.'
