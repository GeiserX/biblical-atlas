reason: '«Toda Escritura», libro 23, párr. 32, 33, agrupa Is 65:1-66:24, escrito tras avisar a Ezequías («Las profecías de
  Isaías I», cap. 30, párr. 3). Perspicacia «Isaías» cierra su obra poco después de 732; 716 (A6-B: muere Ezequías) es el
  tope.'
