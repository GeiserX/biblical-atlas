summary: En Siló, los jefes levitas piden a Eleazar y a Josué las ciudades que Jehová había prometido por medio de Moisés.
  Por sorteo reciben 48 con sus campos de pasto; 13 son para los sacerdotes, hijos de Aarón.
reason: Jos 21:2 lo sitúa en Siló, adonde se llevó el tabernáculo tras la conquista general de 1467 a.e.c. (estudio 3); Josué
  murió hacia 1450. 1Cr 6:54-81 da la lista paralela.
