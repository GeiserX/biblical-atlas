summary: Habacuc pregunta a Jehová hasta cuándo tolerará la violencia en Judá. Jehová responde que la castigará por medio
  de los caldeos y que luego cinco ayes caerán sobre ellos. El libro termina con una oración del profeta.
reason: El estudio 3 y la tabla de libros lo cierran hacia 628 a.e.c., con duda. Perspicacia y «Toda Escritura» lo ponen al
  comienzo del reinado de Jehoiaquim, antes de Carquemis (625). Según «Toda Escritura», se escribió en Judá.
