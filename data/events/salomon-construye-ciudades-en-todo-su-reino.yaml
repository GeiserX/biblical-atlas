summary: Salomón hace trabajar como esclavos a los descendientes de los cananeos, no a los israelitas. Levanta la muralla
  de Jerusalén y el Montículo, fortifica Hazor, Meguidó, Guézer y Tadmor, y construye las dos Bet-Horón, Baalat, Tamar y ciudades
  de almacenes.
reason: 'Perspicacia «Salomón», apartado «Edificación a escala nacional»: estas obras siguen a los edificios oficiales, que
