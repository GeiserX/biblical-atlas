summary: Las congregaciones de Macedonia y de Acaya, y también las de Galacia, dan de buena gana dinero para los cristianos
  pobres de Jerusalén. Pablo, que organiza la colecta, se dispone a llevarla él mismo antes de visitar Roma.
reason: 'Pablo la dirige (Perspicacia «Colecta»). 2Co 8:10 y 9:2: empezó un año antes de esa carta, del otoño de 55 («Corintios,
  Cartas a los»). Ro 15:26 la da por reunida hacia 56; 1Co 16:1 suma Galacia. No sitúa a nadie.'
