summary: 'Isaías anuncia que la gloria de Jehová alumbrará a Sion: sus hijos volverán y las naciones le llevarán riquezas.
  Un ungido proclamará libertad, la ciudad recibirá un nombre nuevo, Edom será juzgada y el pueblo pide perdón.'
reason: '«Toda Escritura», libro 23, párr. 30 y 31, agrupa Is 60:1-64:12, escrito tras avisar a Ezequías (ip-1, cap. 30,
  párr. 3). Perspicacia «Isaías» cierra su obra poco después de 732; 716 (fin de Ezequías, A6-B) solo es el tope.'
