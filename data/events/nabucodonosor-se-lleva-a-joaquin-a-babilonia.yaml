reason: 'Estudio 3: primeros cautivos en 617. Perspicacia «Nabucodonosor» (párr. 7) y «Joaquín» (párr. 2): rendición en adar;
  el sitio pudo empezar con Jehoiaquim (2Cr 36:6; «Jehoiaquim», párr. 6). «Ezequiel», párr. 1, lo cuenta entre los desterrados.'
