summary: 'La profetisa, esposa de Isaías, da a luz un hijo. Jehová manda llamarlo Maher-Salal-Has-Baz: antes de que aprenda
  a decir «papá» y «mamá», Asiria despojará a Damasco y a Samaria.'
reason: 'Perspicacia «Maher-salal-has-baz»: Tiglat-Piléser III saqueó Israel en el reinado de Pécah, que acabó c. 758 (A6-B),
  y la tablilla se escribió durante el asedio («Las profecías de Isaías I», cap. 9, párr. 23). El texto no dice dónde nació.'
