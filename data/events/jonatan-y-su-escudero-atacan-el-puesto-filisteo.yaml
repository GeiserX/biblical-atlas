summary: 'Sin avisar a Saúl, Jonatán cruza con su escudero el barranco entre los peñascos Bozez y Sené. La invitación filistea
  a subir es su señal de Jehová: trepa hasta el puesto y entre los dos matan a unos 20.'
reason: '1Sa 13:23; 14:1-14; Perspicacia «Micmás, Micmash», párr. 3 y 4, «Bozez» y «Sené». El escudero no tiene nombre. Fecha:
  tras la unción de Saúl (1117, estudio 3) y antes de su muerte (1078, Perspicacia «Jonatán», núm. 2).'
