summary: En Babilonia, el rey manda a Aspenaz traer jóvenes israelitas de la realeza y la nobleza para servir en el palacio.
  Entre ellos están Daniel, Hananías, Misael y Azarías, que reciben los nombres de Beltsasar, Sadrac, Mesac y Abednego.
reason: 'Estudio 3 (617). Perspicacia «Daniel», núm. 2, «Bajo el dominio babilonio», y «Sadrac»: ya en Babilonia, no junto
  al Kebar con los demás desterrados, los escogen, les cambian el nombre y los forman. El traslado es nabucodonosor-se-lleva-a-joaquin-a-babilonia.'
