summary: En Mizpá, los jefes del ejército avisan a Guedalías de que Baalís, rey de Ammón, ha enviado a Ismael a matarlo. Johanán
  se ofrece en secreto a matar a Ismael, pero Guedalías lo toma por mentira.
reason: Jer 40:13-16, antes del asesinato del mes séptimo de 607 (estudio 3). Según Perspicacia, Seraya hijo de Tanhúmet,
  Jonatán y Jaazanías estaban entre los jefes que avisaron; el texto solo nombra a Johanán, y no los situamos. Orden por fecha.
