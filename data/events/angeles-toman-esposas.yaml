summary: Ángeles, los hijos del Dios verdadero, se casan con las mujeres que eligen y tienen a los nefilim, hombres violentos
  y famosos que hacen crecer la maldad. Dios acaba recluyéndolos en el Tártaro, al parecer en días de Noé.
reason: 'Nota de Gé 6:2: son ángeles. Según Perspicacia, sus hijos ya vivían al darse el plazo de 2490 («Nefilim») y ellos
  desobedecían aún mientras se construía el arca («Tártaro», 1Pe 3:20). Por eso, todos los días de Noé.'
