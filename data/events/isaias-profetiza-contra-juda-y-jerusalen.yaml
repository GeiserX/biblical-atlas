summary: Jehová acusa a Judá y Jerusalén de rebeldía, culto vacío, injusticia y orgullo, y compara al pueblo con una viña
  que solo dio uvas silvestres. Anuncia ruina y destierro, pero también que su casa será ensalzada.
reason: Isaías empezó hacia 778, al morir Uzías o antes («Toda Escritura», libro 23, párr. 3, 10; «Las profecías de Isaías
  I», cap. 5, pone Is 2:7 bajo Uzías). Perspicacia «Isaías, Libro de» admite que esto sea anterior a Is 6.
