summary: 'Ya muy mayor, el apóstol Juan, que se presenta como «el anciano», escribe probablemente desde Éfeso a la señora
  escogida y sus hijos: que sigan en la verdad y el amor y no acojan a quien niega a Cristo.'
reason: 'Tabla de los libros: Éfeso o cerca, c. 98. Estudio 3, párr. 29: libre ya de Patmos, escribió el Evangelio y tres
  cartas. «Toda Escritura», libro 63, párr. 2, lo da por escritor; Perspicacia «Juan, Cartas de», probablemente Éfeso.'
note: 'Pasajes: el saludo y cada versículo donde habla de escribir. Orden 2981 de hechos, nuestro, tras 1 Juan (2980). «Toda
  Escritura», libro 63, párr. 2, cita la conjetura ajena de que es posterior; Perspicacia fecha las tres juntas.'
