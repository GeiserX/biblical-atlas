summary: Merodac-Baladán, rey de Babilonia, manda cartas y un regalo a Ezequías, que enseña a sus enviados todos sus tesoros
  y su arsenal. Isaías anuncia que todo irá a Babilonia y que algunos de sus hijos servirán en aquel palacio.
reason: 'Perspicacia «Merodac-baladán», apartado «Envía una delegación a Ezequías»: la embajada pudo llegar en el año 14 de
  Ezequías, 732 a.e.c., o poco después. Merodac-Baladán no se sitúa en Jerusalén: mandó a sus enviados desde Babilonia.'
