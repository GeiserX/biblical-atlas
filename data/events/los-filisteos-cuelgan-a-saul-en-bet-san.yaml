summary: Al día siguiente, los filisteos hallan los cuerpos en Guilboa, decapitan a Saúl y difunden la noticia. Dejan su armadura
  en el templo de Astoret, su cabeza en el de Dagón y los cadáveres en la muralla de Bet-San.
reason: '1Sa 31:8-10; 1Cr 10:10 y Perspicacia «Dagón»: la cabeza quedó en su templo. Perspicacia «Bet-seán, Bet-san», párr.
  6: ciudad filistea. Solo hay cadáveres: no sitúa a nadie. Día siguiente a la batalla de 1078 («Jonatán», núm. 2).'
