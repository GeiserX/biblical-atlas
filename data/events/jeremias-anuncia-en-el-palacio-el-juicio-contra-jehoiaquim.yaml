summary: 'Jeremías baja al palacio: si el rey no hace justicia, la casa quedará en ruinas. Salum morirá en el destierro, y
  Jehoiaquim, que no paga a sus obreros, acabará arrojado fuera de Jerusalén sin duelo.'
reason: Perspicacia «Líbano» dice que Jehoiaquim oyó Jer 22:6, y «Jehoiaquim», párr. 2, le aplica 22:13-19. Salum ya se había
  ido (22:11). Jehoiaquim reinó de 628 a 618 (tabla A6-B). Va tras lo contado del principio del reinado.
