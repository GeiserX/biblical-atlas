summary: En visión, Juan sube al cielo y ve a Jehová en su trono, rodeado de 24 ancianos y cuatro seres vivientes. Solo el
  Cordero, que es Jesús, merece tomar de su mano el rollo de siete sellos.
reason: Segunda visión de Apocalipsis (Ap 4:1-5:14) según «Toda Escritura», libro 66, párr. 6 y 11, y el libro sobre Apocalipsis,
  cap. 14 y 15. Juan la recibió preso en Patmos hacia 96 (libro 66, párr. 5; estudio 3; Tabla).
note: 'Orden 4001 de la serie apocalipsis, elegido por nosotros: «Toda Escritura», libro 66, párr. 6, ve el libro como una
