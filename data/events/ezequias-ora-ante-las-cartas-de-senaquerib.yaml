summary: Senaquerib, que ya lucha contra Libná, oye que Tirhacá de Etiopía sale contra él y escribe a Ezequías que ningún
  dios salvó a las naciones. El rey extiende las cartas ante Jehová y le pide que los salve.
reason: Is 37:8-20 sigue a la visita a Isaías, en 732 a.e.c. (estudio 3). Perspicacia «Libná» pone allí al rey asirio, que
  no estaba en Jerusalén; Ezequías ora en el templo (Is 37:14).
