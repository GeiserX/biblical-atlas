summary: Juan ve en el cielo a una mujer que alumbra un hijo varón y a un dragón que quiere devorarlo. Miguel y sus ángeles
  vencen al dragón, Satanás, y lo arrojan a la tierra, donde la persigue.
reason: 'Séptima visión del libro según «Toda Escritura», libro 66, párr. 19, y el libro Apocalipsis, cap. 27. Fecha c. 96
  y lugar Patmos: estudio 3, párr. 29, Tabla de los libros y Perspicacia «Patmos», donde Juan recibió Apocalipsis.'
note: 'Orden 12001 de la serie apocalipsis, elegido por nosotros: capítulo por mil más el primer versículo, como en Daniel.
  Las visiones no van en orden cronológico de cumplimiento (libro Apocalipsis, cap. 3).'
not_claimed:
- 'Cuándo se cumple lo visto: el libro Apocalipsis lo sitúa en el día del Señor, desde 1914. El suceso solo fecha el momento
  en que Juan tuvo la visión.'
