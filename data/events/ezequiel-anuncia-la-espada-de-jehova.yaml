summary: Jehová desenvaina su espada contra Jerusalén. En un cruce de caminos, el rey de Babilonia consulta sus agüeros y
  marcha contra la ciudad; al jefe malvado le quitan la corona hasta que llegue quien tiene el derecho. Ammón tampoco escapará.
