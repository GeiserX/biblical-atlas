reason: 'Jer 28:1 lo pone en el año cuarto de Sedequías, 614 según Perspicacia «Seraya», núm. 5. El «Jehoiaquim» de 27:1 quizá
  es error de copista (Perspicacia «Sedequías», núm. 4). Jer 27:17, 19: «esta ciudad», Jerusalén.'
