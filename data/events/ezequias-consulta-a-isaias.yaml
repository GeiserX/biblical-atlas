summary: 'Vestido de saco, Ezequías entra en la casa de Jehová y manda a Eliaquim, Sebná y los sacerdotes mayores a Isaías.
  El profeta responde que no teman: el rey asirio volverá a su tierra y caerá allí.'
reason: Is 37:1-7 sigue a las palabras del rabsaqué, en 732 a.e.c. (estudio 3; Perspicacia «Ezequías»). Isaías vivía en Jerusalén;
