  a sacerdotes ancianos a Isaías. Jehová contesta que no teman: el rey asirio volverá a su tierra.'
reason: Is 37:1-7 sigue a las palabras del rabsaqué, en 732 a.e.c. (estudio 3; Perspicacia «Ezequías»). Isaías vivía en Jerusalén;
  el texto no dice en qué parte de la ciudad recibió a los enviados.
