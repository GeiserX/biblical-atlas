summary: 'La esposa de Finehás, embarazada, oye que el Arca fue tomada y que murieron su suegro y su esposo. Se pone de parto
  de golpe y, muriéndose, llama al niño Icabod, pues dice que la gloria dejó a Israel.'
reason: '1Sa 4:19-22; Perspicacia «Icabod». Su madre, que muere, no tiene ficha, y no se dice dónde estaba. Fecha: Jefté juzga
