# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: colosenses
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    nota: "Pablo y Timoteo saludan a Colosas, dan gracias por la fe que Epafras les enseñó y oran por ellos. Siguen el lugar de Cristo en la creación y en la congregación y el trabajo de Pablo por el secreto sagrado."
    tramos:
    - {v: 1-2, tipo: carta, entidades: [carta:colosenses, evento:pablo-escribe-colosenses, persona:pablo, persona:timoteo, relacion:timoteo/acompana/pablo, relacion:timoteo/vivio_en/roma, relacion:pablo/vivio_en/roma, lugar:colosas], menciona: [persona:jesus, lugar:roma, lugar:asia, evento:pablo-predica-dos-anos-en-roma], nota: "Pablo, apóstol por voluntad de Dios, y su hermano Timoteo saludan a los santos de Colosas. La nota pone a Timoteo con Pablo en Roma, en su primer encierro, y la ciudad en el valle del Lico, provincia de Asia."}
    - {v: 3-8, tipo: carta, entidades: [persona:epafras, evento:epafras-predica-en-colosas, evento:epafras-informa-a-pablo-en-roma, relacion:epafras/acompana/pablo, relacion:epafras/vivio_en/roma], menciona: [persona:pablo, persona:jesus, lugar:colosas, lugar:roma, carta:filemon], nota: "Gracias por la fe y el amor de los colosenses, que aprendieron las buenas noticias de Epafras, compañero de esclavitud de Pablo, que luego le habló de ellos. La nota lo identifica con el de Flm 23, no con Epafrodito."}
    - {v: 9-12, tipo: carta, entidades: [evento:epafras-informa-a-pablo-en-roma], nota: "Desde que supieron de ellos, oran para que se llenen del conocimiento exacto de la voluntad de Dios, vivan de un modo digno de Jehová, den fruto, aguanten con alegría y agradezcan al Padre su parte en la herencia."}
    - {v: 13-20, tipo: carta, entidades: [persona:jesus], menciona: [persona:satanas, evento:pentecostes-33, evento:resurreccion-de-jesus, evento:muerte-de-jesus], nota: "Dios los sacó de la oscuridad, que la nota liga a Satanás, al reino de su Hijo, rey de los ungidos desde Pentecostés de 33. Primogénito de la creación y de los muertos, reconcilia todo por su sangre."}
    - {v: 21-23, tipo: carta, menciona: [persona:jesus, evento:muerte-de-jesus, evento:pentecostes-33, persona:pablo], nota: "Antes eran enemigos de Dios; ahora él los reconcilia por la muerte del Hijo, si siguen firmes en la fe. Según la nota, desde Pentecostés de 33 el mensaje había llegado lejos, aunque «toda la creación» no es literal."}
    - {v: 24-29, tipo: carta, entidades: [persona:pablo, evento:pablo-escribe-colosenses], menciona: [persona:jesus], nota: "Pablo se alegra de sufrir por la congregación, el cuerpo de Cristo, y cumple su encargo de anunciar el secreto sagrado, oculto antes y ya revelado: Cristo unido a los de las naciones. Perspicacia ve aquí su prisión."}
  2:
    estado: completo
    revisado: 2026-09-29
    nota: "Pablo lucha por los de Colosas y Laodicea, que no lo conocen en persona, y los previene contra filosofías humanas, la exigencia de la Ley, el culto a los ángeles y el ascetismo: en Cristo ya lo tienen todo."
    tramos:
    - {v: 1-5, tipo: carta, entidades: [carta:colosenses, evento:pablo-escribe-colosenses, persona:pablo, lugar:laodicea, lugar:colosas], menciona: [persona:jesus, evento:escuela-de-tirano], nota: "Pablo se esfuerza por los de Colosas, los de Laodicea y otros que no lo han visto. La nota deduce que no predicó en Laodicea; el mensaje llegó a la zona mientras enseñaba en Éfeso (Hch 19:10)."}
    - {v: 6-7, tipo: carta, menciona: [persona:jesus], nota: "Como aceptaron a Cristo Jesús, que sigan andando unidos a él: con raíces como un árbol, construidos como un edificio y confirmados en la fe, siempre agradecidos."}
    - {v: 8-10, tipo: carta, menciona: [persona:jesus], nota: "Que nadie se los lleve como botín con filosofías vacías y tradiciones humanas; según la nota, Pablo piensa sobre todo en los judaizantes. En Cristo está la plenitud de la naturaleza divina, sin que por eso sea Dios."}
    - {v: 11-15, tipo: carta, menciona: [persona:jesus, evento:resurreccion-de-jesus, evento:muerte-de-jesus, evento:pacto-de-la-ley, persona:satanas], nota: "Tienen la circuncisión del Cristo y fueron enterrados y levantados con él en el bautismo. Dios anuló el pacto de la Ley, el documento de decretos, clavándolo al madero, y exhibió vencidos a los gobiernos de Satanás, según la nota."}
    - {v: 16-19, tipo: carta, menciona: [persona:jesus], nota: "Nadie los juzgue por comidas, fiestas, lunas nuevas o sábados de la Ley, sombra de lo que venía. Tampoco quien finge humildad y busca la adoración de ángeles: se suelta de la cabeza que nutre al cuerpo."}
    - {v: 20-23, tipo: carta, menciona: [persona:jesus], nota: "Si murieron con Cristo a las cosas elementales del mundo, ¿por qué obedecen reglas humanas como «no toques»? Parecen sabias por su humildad fingida y su dureza con el cuerpo, pero no frenan los deseos de la carne."}
  3:
    estado: completo
    revisado: 2026-09-29
    nota: "Consejos de la carta sin nombres nuevos ni sucesos: buscar lo de arriba, quitarse la vieja personalidad y vestirse de la nueva, y deberes de esposas, esposos, hijos, padres y esclavos."
    tramos:
    - {v: 1-4, tipo: carta, entidades: [carta:colosenses], menciona: [persona:jesus, evento:resurreccion-de-jesus, evento:ascension-de-jesus, lugar:colosas], nota: "Si fueron levantados con el Cristo, que busquen lo de arriba, donde él está sentado a la derecha de Dios. La nota dice que Pablo habla a los ungidos de Colosas de su esperanza en el cielo."}
    - {v: 5-9, tipo: carta, menciona: [lugar:colosas], nota: "Den muerte a la inmoralidad sexual, la impureza y la codicia, que equivale a idolatría. Fuera la ira, los insultos, el habla obscena y la mentira: la nota lo compara con desechar ropa sucia."}
    - {v: 10-11, tipo: carta, menciona: [persona:jesus, evento:creacion-de-adan, lugar:colosas], nota: "La nueva personalidad se renueva a imagen de quien la creó, palabra que la nota liga a Gé 1:26. En ella no cuentan griego, judío, bárbaro ni escita; Perspicacia «Colosas» recuerda que allí vivían griegos y judíos."}
    - {v: 12-17, tipo: carta, menciona: [persona:jesus], nota: "Como escogidos de Dios, que se vistan de compasión, bondad, humildad, apacibilidad y paciencia, y sobre todo de amor. Que perdonen como Jehová los perdonó, que la paz del Cristo los gobierne y que canten a Jehová."}
    - {v: 18-21, tipo: carta, menciona: [persona:jesus], nota: "Las esposas, sujetas a sus esposos como conviene en el Señor; los esposos, que las amen sin amargura; los hijos, obedientes; y los padres varones, que no exasperen a sus hijos hasta desanimarlos."}
    - {v: 22-25, tipo: carta, menciona: [persona:jesus, persona:onesimo], nota: "Los esclavos, que sirvan de corazón y con temor de Jehová, como para él y no para los hombres: su Amo es Cristo. Perspicacia «Onésimo» señala que un esclavo fugitivo llevó esta carta."}
  4:
    estado: completo
    revisado: 2026-09-29
    nota: "Últimos consejos, oración por Pablo, preso, y saludos: Tíquico y Onésimo llevan la carta, y Pablo nombra a sus colaboradores en Roma y a los hermanos de Laodicea y Hierápolis. Firma de su puño."
    tramos:
    - {v: "1", tipo: carta, menciona: [persona:jesus], nota: "Los amos, que traten a sus esclavos con justicia e imparcialidad, porque también ellos tienen un Amo en el cielo. Cierra los consejos a la familia y a los esclavos del capítulo 3."}
    - {v: 2-4, tipo: carta, entidades: [persona:pablo, relacion:pablo/vivio_en/roma, evento:pablo-escribe-colosenses], menciona: [lugar:roma, evento:pablo-predica-dos-anos-en-roma], nota: "Que perseveren en la oración y pidan que Dios le abra una puerta para anunciar el secreto sagrado del Cristo, por el que está encadenado. Perspicacia «Colosenses» encaja esto con su primer encierro en Roma."}
    - {v: 5-6, tipo: carta, nota: "Que se porten con sabiduría con los de fuera, aprovechen bien el tiempo y hablen siempre con amabilidad, con palabras sazonadas con sal, para saber qué contestar a cada uno."}
    - {v: 7-9, tipo: carta, entidades: [carta:colosenses, evento:pablo-envia-a-tiquico-a-efeso-y-colosas, persona:tiquico, relacion:tiquico/acompana/pablo, persona:onesimo, relacion:onesimo/acompana/tiquico, relacion:onesimo/acompana/pablo, relacion:onesimo/vivio_en/colosas, lugar:colosas, relacion:filemon/vivio_en/colosas], menciona: [persona:filemon, carta:filemon, carta:efesios, lugar:efeso, lugar:roma, lugar:asia], nota: "Tíquico, hermano amado y compañero de esclavitud, les dará noticias y consuelo; va con Onésimo, colosense. Las notas dicen que Tíquico, de Asia, llevaba también las cartas a Éfeso y a Filemón, de quien Onésimo había huido a Roma."}
    - {v: 10-11, tipo: carta, entidades: [persona:aristarco, relacion:aristarco/acompana/pablo, persona:juan-marcos, relacion:juan-marcos/acompana/pablo, persona:bernabe, relacion:bernabe/pariente/juan-marcos, relacion:maria-madre-de-juan-marcos/pariente/bernabe, persona:jesus-justo, relacion:jesus-justo/acompana/pablo, evento:pablo-escribe-colosenses], menciona: [persona:pablo, persona:maria-madre-de-juan-marcos, evento:pablo-y-bernabe-se-separan, lugar:roma], nota: "Saludan Aristarco, preso con Pablo, Marcos, primo de Bernabé, al que deben acoger si llega, y Jesús, llamado Justo: sus únicos colaboradores judíos, que lo consuelan. La nota ve superada la disputa de Hch 15:37-39."}
    - {v: 12-13, tipo: carta, entidades: [persona:epafras, relacion:epafras/vivio_en/colosas, relacion:epafras/acompana/pablo, relacion:epafras/vivio_en/roma, lugar:laodicea, lugar:hierapolis, evento:pablo-escribe-colosenses], menciona: [lugar:colosas, lugar:roma], nota: "Saluda Epafras, colosense y esclavo de Cristo, que ora con intensidad para que sigan firmes y maduros. Pablo da fe de cuánto se esfuerza por ellos y por los de Laodicea y Hierápolis."}
    - {v: "14", tipo: carta, entidades: [persona:lucas, relacion:lucas/acompana/pablo, persona:demas, relacion:demas/acompana/pablo, evento:pablo-escribe-colosenses], menciona: [lugar:roma], nota: "Saludan Lucas, el médico amado, y Demas. La nota dice que es el único versículo que da el oficio de Lucas, y que años más tarde Demas dejaría a Pablo (2Ti 4:10)."}
    - {v: 15-16, tipo: carta, entidades: [persona:ninfa, relacion:ninfa/vivio_en/laodicea, lugar:laodicea], menciona: [lugar:colosas], nota: "Pablo saluda a los hermanos de Laodicea y a Ninfa, en cuya casa se reúne una congregación. Que se intercambien las cartas: la de Laodicea, dice la nota, se perdió; sin suceso, porque no consta cuándo ni desde dónde salió."}
    - {v: "17", tipo: carta, entidades: [persona:arquipo, relacion:arquipo/vivio_en/colosas], menciona: [persona:filemon, carta:filemon, relacion:arquipo/pariente/filemon], nota: "Que digan a Arquipo que cumpla el ministerio que aceptó en el Señor. La nota lo ve como el Arquipo de Flm 2 y no lo toma por un regaño; que fuera de la casa de Filemón no está probado."}
    - {v: "18", tipo: carta, entidades: [carta:colosenses, evento:pablo-escribe-colosenses, persona:pablo], menciona: [lugar:roma], nota: "Pablo escribe el saludo con su propia mano, según la nota para confirmar que la carta es suya, les pide que se acuerden de sus cadenas y les desea la bondad inmerecida."}
