# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: abdias
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: profecia, entidades: [persona:abdias-profeta, evento:abdias-profetiza-contra-edom, lugar:edom], nota: "Encabezamiento: la visión de Abdías, nombre que la nota traduce «siervo de Jehová». Jehová convoca a las naciones contra Edom, que se cree a salvo en sus peñascos; aunque anidara como el águila, él la derribaría."}
    - {v: 5-7, tipo: profecia, entidades: [evento:abdias-profetiza-contra-edom, lugar:edom], menciona: [persona:nabonido], nota: "Un ladrón o un vendimiador dejan algo; a Esaú, aquí Edom, lo saquearán del todo, y sus aliados lo engañarán. Perspicacia y «Toda Escritura» lo ven cumplido cuando Nabonido de Babilonia conquistó Edom, en el siglo VI a.e.c."}
    - {v: 8-9, tipo: profecia, entidades: [evento:abdias-profetiza-contra-edom, lugar:edom, lugar:teman], nota: "Jehová acabará con los sabios de Edom y con la inteligencia de la región montañosa de Esaú, otro nombre de esa tierra. Los guerreros de Temán, distrito famoso por su sabiduría y su valor, se llenarán de terror."}
    - {v: 10-14, tipo: profecia, entidades: [evento:abdias-profetiza-contra-edom, evento:destruccion-de-jerusalen-607, lugar:edom, lugar:jerusalen], menciona: [lugar:juda], nota: "Edom maltrató a su hermano Jacob, el pueblo del gemelo de Esaú: cuando Babilonia tomó Jerusalén en 607 a.e.c., se alegró, entró a saquear y entregó a los fugitivos (Sl 137:7). Otra referencia lleva a 2Re 24."}
    - {v: 15-16, tipo: profecia, entidades: [evento:abdias-profetiza-contra-edom, lugar:edom], menciona: [lugar:jerusalen], nota: "Está cerca el día en que Jehová juzgará a todas las naciones, y a Edom le pagarán con lo mismo que hizo. Así como bebieron en la santa montaña de Jehová, en Jerusalén, las naciones beberán sin parar hasta desaparecer."}
    - {v: "17", tipo: profecia, entidades: [evento:abdias-profetiza-contra-edom, lugar:jerusalen], menciona: [evento:regreso-de-537], nota: "En el monte Sion quedarán los que escapen, y será santo; la casa de Jacob, el pueblo, recobrará lo suyo. Joe 2:32 dice casi lo mismo, y Perspicacia «Joel, Libro de» no decide cuál de los dos citó al otro."}
    - {v: "18", tipo: profecia, entidades: [evento:abdias-profetiza-contra-edom, lugar:edom], menciona: [lugar:israel, lugar:idumea], nota: "La casa de Jacob será fuego, y la de José, el reino del norte, una llama; la de Esaú arderá como paja. Según Perspicacia, los edomitas acabaron en Idumea y dejaron de ser un pueblo tras el año 70."}
    - {v: 19-20, tipo: profecia, entidades: [evento:abdias-profetiza-contra-edom, lugar:negueb, lugar:edom, lugar:sefela, lugar:filistea, lugar:territorio-de-efrain, lugar:israel, lugar:galaad, lugar:canaan, lugar:sarepta, lugar:jerusalen, lugar:sefarad], menciona: [lugar:samaria, evento:regreso-de-537, periodo:destierro-y-regreso], nota: "Los repatriados ocuparán el Négueb, Edom, la Sefelá, Filistea, Efraín, Samaria (el reino del norte) y Canaán hasta Sarepta; Benjamín, la tribu, cuyo territorio no tiene ficha, tomará Galaad. Los desterrados en Sefarad, quizá Saparda de Media, poblarán el Négueb."}
    - {v: "21", tipo: profecia, entidades: [evento:abdias-profetiza-contra-edom, lugar:jerusalen, lugar:edom], nota: "Unos salvadores subirán al monte Sion a juzgar a Edom, y Jehová será quien reine. «Toda Escritura» lo presenta como el triunfo final de su Reino."}
