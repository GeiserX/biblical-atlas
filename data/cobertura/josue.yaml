    - {v: 2-4, tipo: discurso, entidades: [evento:josue-renueva-el-pacto-en-siquem, persona:tare, persona:abrahan, persona:nacor-hijo-de-tare, persona:isaac, persona:jacob, persona:esau, lugar:rio-eufrates, lugar:canaan, lugar:seir, lugar:egipto, evento:pacto-con-abrahan, evento:nacimiento-de-isaac, evento:nacimiento-de-esau-y-jacob, evento:esau-se-traslada-a-seir, evento:jacob-entra-en-egipto, relacion:abrahan/pariente/tare, relacion:nacor-hijo-de-tare/pariente/tare, relacion:abrahan/vivio_en/canaan, relacion:isaac/pariente/abrahan, relacion:jacob/pariente/isaac, relacion:esau/pariente/isaac, relacion:esau/pariente/jacob, relacion:esau/vivio_en/seir, relacion:jacob/vivio_en/egipto], nota: "Jehová habla por Josué. «El Río» es el Éufrates: al otro lado vivieron los antepasados, Taré incluido, y servían a otros dioses, sin nombre. Los hijos de Jacob no se nombran."}
    - {v: 5-7, tipo: discurso, entidades: [persona:moises, persona:aaron, relacion:aaron/acompana/moises, lugar:egipto, lugar:mar-rojo, evento:exodo, evento:israel-cruza-el-mar-rojo], menciona: [evento:moises-ante-la-zarza-ardiente, evento:israel-vaga-por-el-desierto], nota: "Envío de Moisés y Aarón y las plagas de Egipto, sin detalle. Jehová pone oscuridad entre Israel y los egipcios, que se ahogan en el mar Rojo. Después, muchos años en el desierto."}
    - {v: 8-10, tipo: discurso, entidades: [evento:israel-vence-a-sehon, evento:israel-vence-a-og, evento:balac-manda-llamar-a-balaam, persona:balac, persona:balaam, relacion:balac/pariente/zipor, relacion:balac/vivio_en/moab, relacion:balaam/pariente/beor-padre-de-balaam, lugar:rio-jordan, lugar:moab], menciona: [persona:zipor, persona:beor-padre-de-balaam, evento:balaam-bendice-a-israel-desde-bamot-baal, evento:balaam-bendice-a-israel-desde-pisga, evento:balaam-bendice-a-israel-desde-peor], nota: "Los amorreos del este del Jordán pelean y pierden su tierra; sus reyes no se nombran aquí. Jehová no escucha a Balaam y lo hace bendecir a Israel una y otra vez."}
    - {v: 11-13, tipo: discurso, entidades: [evento:entrada-en-canaan, evento:conquista-de-canaan, lugar:jerico, lugar:rio-jordan, evento:caida-de-jerico], nota: "Cruzan el Jordán y llegan a Jericó; su caída es el suceso de Jos 6. Pelean los de Jericó y siete pueblos, sin ficha. Un desánimo enviado por Jehová los hace huir, como a los dos reyes amorreos."}
    - {v: 14-15, tipo: discurso, entidades: [evento:josue-renueva-el-pacto-en-siquem, persona:josue-hijo-de-nun], menciona: [lugar:rio-eufrates, lugar:egipto], nota: "Josué pide dejar los dioses que sus antepasados adoraron junto al Éufrates y en Egipto, y elegir hoy entre esos, los de los amorreos o Jehová. Él y su casa servirán a Jehová."}
    - {v: 16-24, tipo: discurso, entidades: [evento:josue-renueva-el-pacto-en-siquem, persona:josue-hijo-de-nun], menciona: [evento:exodo, lugar:egipto], nota: "El pueblo recuerda la salida de Egipto y promete servir a Jehová. Josué avisa que Jehová es santo y exige devoción exclusiva; ellos se declaran testigos contra sí mismos y repiten su promesa."}
    - {v: 25-28, tipo: narracion, entidades: [evento:josue-renueva-el-pacto-en-siquem, persona:josue-hijo-de-nun, lugar:siquem], nota: "Pacto, norma y resolución en Siquem. Josué pone esas palabras por escrito en el libro de la Ley y coloca una gran piedra como testigo bajo el gran árbol junto al santuario. Luego despide al pueblo."}
    - {v: 29-31, tipo: narracion, entidades: [evento:muerte-de-josue, persona:josue-hijo-de-nun, lugar:timnat-serah, lugar:monte-gaas, lugar:region-montanosa-de-efrain, relacion:josue-hijo-de-nun/pariente/nun, relacion:josue-hijo-de-nun/vivio_en/timnat-serah], menciona: [persona:nun], nota: "Muere a los 110 años y lo entierran en su herencia, al norte del monte Gaas. Israel sirve a Jehová mientras viven Josué y los ancianos que le sobreviven."}
    - {v: "32", tipo: narracion, entidades: [evento:entierran-los-huesos-de-jose-en-siquem, evento:jacob-compra-un-campo-junto-a-siquem, persona:jose-hijo-de-jacob, persona:hamor, persona:siquem-hijo-de-hamor, relacion:siquem-hijo-de-hamor/pariente/hamor, lugar:siquem], menciona: [persona:jacob, lugar:egipto, evento:muerte-de-jose, evento:israel-acampa-en-ezam], nota: "Se cumple lo que José pidió al morir (Gé 50:25) y Moisés cumplió al salir de Egipto (Éx 13:19). La parcela pasa a los descendientes de José, las tribus de Efraín y Manasés."}
    - {v: "33", tipo: narracion, entidades: [persona:eleazar-hijo-de-aaron, persona:finehas-hijo-de-eleazar, periodo:sumo-sacerdocio-de-eleazar, lugar:colina-de-finehas, lugar:region-montanosa-de-efrain, relacion:eleazar-hijo-de-aaron/pariente/aaron, relacion:finehas-hijo-de-eleazar/pariente/eleazar-hijo-de-aaron, relacion:finehas-hijo-de-eleazar/sucede_a/eleazar-hijo-de-aaron], menciona: [persona:aaron], nota: "Muere Eleazar, sin escena ni lugar de muerte, y lo entierran en la colina que se había dado a Finehás. El texto no dice que Finehás viviera allí."}
