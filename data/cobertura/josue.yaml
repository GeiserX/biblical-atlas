# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: josue
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-9, tipo: narracion, entidades: [evento:jehova-manda-a-josue-cruzar-el-jordan, persona:josue-hijo-de-nun, persona:moises, relacion:josue-hijo-de-nun/sucede_a/moises, relacion:josue-hijo-de-nun/acompana/moises, relacion:josue-hijo-de-nun/pariente/nun, lugar:rio-jordan, lugar:libano, lugar:rio-eufrates, lugar:mar-grande], menciona: [persona:nun, evento:muerte-de-moises, lugar:sitim, lugar:llanuras-deserticas-de-moab], nota: "Jehová fija la frontera del desierto, sin nombre, al Líbano y al Éufrates, y hasta el mar Grande. «La tierra de los hititas» nombra a un pueblo sin ficha. Repite el ánimo que Moisés dio a Josué."}
    - {v: 10-11, tipo: narracion, entidades: [evento:josue-ordena-al-pueblo-prepararse-para-cruzar, persona:josue-hijo-de-nun], menciona: [lugar:rio-jordan, lugar:sitim, lugar:llanuras-deserticas-de-moab], nota: "Los funcionarios no llevan nombre. El plazo de tres días vuelve a salir cuando el pueblo se acerca al río. Sitim y las llanuras de Moab, sin nombre aquí, son el campamento."}
    - {v: 12-18, tipo: narracion, entidades: [evento:las-tribus-del-este-prometen-cruzar-armadas, evento:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, persona:josue-hijo-de-nun, persona:moises, relacion:josue-hijo-de-nun/sucede_a/moises], menciona: [lugar:rio-jordan, lugar:sitim, lugar:llanuras-deserticas-de-moab], nota: "Rubenitas, gaditas y la media tribu de Manasés son tribus, sin ficha; la tierra al este que Moisés les dio no se nombra aquí. Sus guerreros irán delante hasta que los demás reciban su parte."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: narracion, entidades: [evento:rahab-esconde-a-los-espias, persona:josue-hijo-de-nun, persona:rahab, lugar:sitim, lugar:jerico, relacion:josue-hijo-de-nun/pariente/nun, relacion:josue-hijo-de-nun/vivio_en/sitim], menciona: [persona:nun, lugar:rio-jordan], nota: "Los dos espías y el rey de Jericó no llevan nombre. Ella los tapa con lino en la azotea y manda a sus perseguidores hacia los vados del Jordán."}
    - {v: 8-14, tipo: narracion, entidades: [evento:rahab-esconde-a-los-espias, persona:rahab, evento:israel-cruza-el-mar-rojo, evento:israel-vence-a-sehon, evento:israel-vence-a-og], menciona: [lugar:mar-rojo, lugar:egipto, persona:sehon, persona:og, lugar:rio-jordan], nota: "Rahab sabe del mar Rojo y de Sehón y Og, reyes amorreos, un pueblo sin ficha. Pide por juramento la vida de sus padres y hermanos, que no llevan nombre."}
    - {v: 15-21, tipo: narracion, entidades: [evento:rahab-esconde-a-los-espias, persona:rahab, lugar:jerico, relacion:rahab/vivio_en/jerico], nota: "Les aconseja ocultarse tres días en la región montañosa, sin nombre. La señal pactada es un cordón escarlata en su ventana, con toda la familia dentro de la casa."}
    - {v: 22-24, tipo: narracion, entidades: [evento:los-dos-espias-vuelven-a-josue, persona:josue-hijo-de-nun, lugar:rio-jordan, relacion:josue-hijo-de-nun/pariente/nun], menciona: [persona:nun]}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: narracion, entidades: [evento:israel-sale-de-sitim-y-acampa-junto-al-jordan, persona:josue-hijo-de-nun, lugar:sitim, lugar:rio-jordan, relacion:josue-hijo-de-nun/vivio_en/sitim], nota: "Tras tres días junto al río, los funcionarios mandan seguir el Arca, que llevan los sacerdotes levitas, a unos 2.000 codos (890 m, nota del v. 4). Josué pide al pueblo que se santifique."}
    - {v: 7-13, tipo: narracion, entidades: [evento:israel-sale-de-sitim-y-acampa-junto-al-jordan, persona:josue-hijo-de-nun, relacion:josue-hijo-de-nun/sucede_a/moises, lugar:rio-jordan], menciona: [persona:moises], nota: "Jehová promete estar con Josué como estuvo con Moisés. Josué anuncia que Dios echará a cananeos, hititas, heveos, perizitas, guirgaseos, amorreos y jebuseos, pueblos sin ficha, y pide un hombre por tribu."}
    - {v: 14-17, tipo: narracion, entidades: [evento:entrada-en-canaan, lugar:rio-jordan, lugar:adan, lugar:zaretan, lugar:mar-salado], menciona: [lugar:jerico], nota: "Era la cosecha y el Jordán iba desbordado. El agua se represa en Adán y la que baja al mar Salado se corta; los sacerdotes quedan en el cauce seco. Sl 66:6 y 114:3 lo recuerdan."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-9, tipo: narracion, entidades: [evento:doce-hombres-sacan-doce-piedras-del-jordan, persona:josue-hijo-de-nun, lugar:rio-jordan], nota: "Las piedras, una por tribu, serán una señal: cuando los hijos pregunten, se les contará que el agua se detuvo ante el Arca. Según el v. 9, las del cauce seguían allí cuando se escribió."}
    - {v: 10-18, tipo: narracion, entidades: [evento:entrada-en-canaan, persona:josue-hijo-de-nun, relacion:josue-hijo-de-nun/sucede_a/moises, lugar:rio-jordan, lugar:llanuras-deserticas-de-jerico], menciona: [persona:moises, evento:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, evento:las-tribus-del-este-prometen-cruzar-armadas], nota: "Rubenitas, gaditas y media tribu de Manasés, unos 40.000 armados, cruzan delante como mandó Moisés; las tribus son pueblos. Jehová engrandece a Josué y, cuando salen los sacerdotes, el río vuelve a desbordarse."}
    - {v: 19-24, tipo: narracion, entidades: [evento:josue-levanta-las-doce-piedras-en-guilgal, evento:entrada-en-canaan, persona:josue-hijo-de-nun, lugar:guilgal, relacion:josue-hijo-de-nun/vivio_en/guilgal, evento:israel-cruza-el-mar-rojo], menciona: [lugar:jerico, lugar:rio-jordan, lugar:mar-rojo], nota: "El primer mes es nisán desde el éxodo. El v. 23 compara el paso del Jordán con el del mar Rojo, y el v. 24 da el propósito: que todos los pueblos conozcan el poder de Jehová."}
  5:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, menciona: [lugar:rio-jordan, lugar:mar-grande, evento:entrada-en-canaan], nota: "Los reyes amorreos del oeste del Jordán y los cananeos de la costa se enteran de que Jehová secó el río y pierden el valor. Son pueblos, sin ficha; el mar es el Mar Grande."}
    - {v: 2-9, tipo: narracion, entidades: [evento:josue-circuncida-a-israel-en-guilgal, persona:josue-hijo-de-nun, lugar:guilgal, evento:jehova-condena-a-israel-a-40-anos-en-el-desierto], menciona: [lugar:egipto], nota: "Los hombres de guerra que salieron de Egipto murieron en el desierto, como juró Jehová; sus hijos no estaban circuncidados. Guilgal recuerda que Jehová quitó de encima la deshonra de Egipto."}
    - {v: 10-12, tipo: narracion, entidades: [evento:israel-celebra-la-pascua-en-guilgal, evento:cesa-el-mana, lugar:guilgal, lugar:llanuras-deserticas-de-jerico, relacion:josue-hijo-de-nun/vivio_en/guilgal], menciona: [lugar:canaan, evento:codornices-y-mana-en-el-desierto-de-sin]}
    - {v: 13-15, tipo: narracion, entidades: [evento:el-principe-del-ejercito-de-jehova-se-aparece-a-josue, persona:josue-hijo-de-nun, lugar:jerico], menciona: [evento:moises-ante-la-zarza-ardiente], nota: "El príncipe es un ángel sin nombre; jw.org no lo identifica, así que no lleva ficha. Como a Moisés en la zarza, se le manda descalzarse porque el suelo es santo."}
  6:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: narracion, entidades: [evento:el-principe-del-ejercito-de-jehova-se-aparece-a-josue, persona:josue-hijo-de-nun, lugar:jerico], nota: "Jericó está cerrada. Jehová le entrega la ciudad con su rey, que no se nombra, y da el plan: seis días de una vuelta, siete vueltas el séptimo, cuernos de carnero y un grito."}
    - {v: 6-21, tipo: narracion, entidades: [evento:caida-de-jerico, persona:josue-hijo-de-nun, lugar:jerico], menciona: [persona:rahab, evento:rahab-esconde-a-los-espias, persona:nun], nota: "Solo se perdona a Rahab. Lo reservado para la destrucción no se toca, para no traer el desastre al campamento, como pasará con Acán (Jos 7); el metal es para el tesoro de Jehová."}
    - {v: 22-25, tipo: narracion, entidades: [evento:los-espias-sacan-a-rahab-de-jerico, evento:caida-de-jerico, persona:rahab, persona:josue-hijo-de-nun, lugar:jerico, relacion:rahab/vivio_en/jerico, relacion:rahab/vivio_en/israel], menciona: [evento:rahab-esconde-a-los-espias], nota: "Los espías no tienen nombre. La ciudad se quema y el metal va al tesoro de la casa de Jehová, que Perspicacia «Jericó» llama su santuario."}
    - {v: 26-27, tipo: narracion, entidades: [evento:josue-maldice-al-que-reconstruya-jerico, persona:josue-hijo-de-nun, lugar:jerico], nota: "Una nota dice que quizá Josué hizo jurar al pueblo. Se cumple con Hiel de Betel (1Re 16:34), suceso que crea 1 Reyes. Jehová está con Josué y su fama se extiende."}
  7:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, entidades: [persona:acan-hijo-de-carmi, persona:carmi-hijo-de-zabdi, persona:zabdi-abuelo-de-acan, relacion:acan-hijo-de-carmi/pariente/carmi-hijo-de-zabdi, relacion:acan-hijo-de-carmi/pariente/zabdi-abuelo-de-acan, relacion:acan-hijo-de-carmi/pariente/zerah-hijo-de-juda, relacion:carmi-hijo-de-zabdi/pariente/zabdi-abuelo-de-acan, relacion:zabdi-abuelo-de-acan/pariente/zerah-hijo-de-juda], menciona: [persona:zerah-hijo-de-juda], nota: "Acán se queda con parte de lo que Jehová había reservado en Jericó (Jos 6:17-19); lo cuenta del todo su confesión en 7:21. La tribu de Judá es pueblo, sin ficha."}
    - {v: 2-5, tipo: narracion, entidades: [evento:israel-es-derrotado-en-hai, persona:josue-hijo-de-nun, lugar:hai, lugar:bet-aven, lugar:sebarim], menciona: [lugar:betel, lugar:jerico]}
    - {v: 6-15, tipo: narracion, entidades: [evento:josue-ruega-ante-el-arca, persona:josue-hijo-de-nun], menciona: [lugar:rio-jordan], nota: "Josué teme que amorreos y cananeos, pueblos sin ficha, acaben con Israel. Jehová manda santificarse y presentarse por tribus; el culpable será quemado con lo suyo."}
    - {v: 16-23, tipo: narracion, entidades: [evento:descubren-el-pecado-de-acan, persona:acan-hijo-de-carmi, persona:josue-hijo-de-nun], menciona: [persona:zabdi-abuelo-de-acan, persona:carmi-hijo-de-zabdi, persona:zerah-hijo-de-juda, lugar:sinar], nota: "Robó una prenda de Sinar, 200 siclos de plata y una barra de oro de 50 siclos; según la nota de 7:21, el siclo pesaba 11,4 g. Los zerahítas son una familia, sin ficha."}
    - {v: 24-26, tipo: narracion, entidades: [evento:muerte-de-acan, persona:acan-hijo-de-carmi, persona:josue-hijo-de-nun, lugar:valle-de-acor, relacion:acan-hijo-de-carmi/murio_en/valle-de-acor], nota: "Sus hijos e hijas, sin nombre, mueren con él. El montón de piedras seguía allí cuando se escribió el libro."}
  8:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-9, tipo: narracion, entidades: [evento:israel-toma-hai, persona:josue-hijo-de-nun, lugar:hai, lugar:betel], menciona: [lugar:jerico], nota: "Jehová permite esta vez quedarse con el botín y el ganado. Josué envía de noche 30.000 hombres a esconderse al oeste de Hai, del lado de Betel."}
    - {v: 10-29, tipo: narracion, entidades: [evento:israel-toma-hai, persona:josue-hijo-de-nun, lugar:hai, lugar:betel], nota: "El rey de Hai no tiene nombre. Mueren 12.000 habitantes; Hai queda en ruinas y el cuerpo del rey, bajo un montón de piedras a la puerta. La llanura desértica de 8:14 no lleva nombre propio."}
    - {v: 30-35, tipo: narracion, entidades: [evento:josue-lee-la-ley-entre-el-ebal-y-el-guerizim, persona:josue-hijo-de-nun, lugar:monte-ebal, lugar:monte-guerizim], menciona: [persona:moises, evento:moises-manda-escribir-la-ley-en-piedras-en-el-ebal, evento:moises-anuncia-las-bendiciones-y-las-maldiciones], nota: "Cumple lo mandado en Dt 11:29 y 27:1-13. Asisten ancianos, jueces, sacerdotes levitas con el Arca, mujeres, niños y residentes extranjeros."}
  9:
