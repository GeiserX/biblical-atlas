  10:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: narracion, entidades: [evento:cinco-reyes-amorreos-atacan-gabaon, persona:adoni-zedec, persona:hoham, persona:piram, persona:jafia-rey-de-lakis, persona:debir-rey-de-eglon, lugar:gabaon, lugar:jerusalen, lugar:hebron, lugar:jarmut, lugar:lakis, lugar:eglon, relacion:adoni-zedec/vivio_en/jerusalen, relacion:hoham/vivio_en/hebron, relacion:piram/vivio_en/jarmut, relacion:jafia-rey-de-lakis/vivio_en/lakis, relacion:debir-rey-de-eglon/vivio_en/eglon, relacion:hoham/acompana/adoni-zedec, relacion:piram/acompana/adoni-zedec, relacion:jafia-rey-de-lakis/acompana/adoni-zedec, relacion:debir-rey-de-eglon/acompana/adoni-zedec], menciona: [persona:josue-hijo-de-nun, lugar:hai, lugar:jerico, evento:caida-de-jerico, evento:israel-toma-hai, evento:los-gabaonitas-enganan-a-josue], nota: "Los reyes de Hai y de Jericó no se nombran; sus derrotas son de los capítulos 6 y 8. Según Perspicacia «Gabaón», amorreos nombra a veces a todos los cananeos."}
    - {v: 6-11, tipo: narracion, entidades: [evento:josue-derrota-a-los-cinco-reyes-en-gabaon, persona:josue-hijo-de-nun, lugar:guilgal, lugar:gabaon, lugar:bet-horon-alta, lugar:bet-horon-baja, lugar:azeca, lugar:maqueda]}
    - {v: 12-15, tipo: narracion, entidades: [evento:el-sol-se-detiene-sobre-gabaon, persona:josue-hijo-de-nun, lugar:gabaon, lugar:valle-de-ayalon], menciona: [lugar:guilgal], nota: "Los vv. 12 y 13 citan en verso el libro de Jasar, un escrito perdido sin ficha (también 2Sa 1:18). El v. 15 dice que Josué volvió a Guilgal; el v. 21 lo sitúa aún en Maquedá."}
    - {v: 16-27, tipo: narracion, entidades: [evento:josue-ejecuta-a-los-cinco-reyes-en-maqueda, persona:josue-hijo-de-nun, persona:adoni-zedec, persona:hoham, persona:piram, persona:jafia-rey-de-lakis, persona:debir-rey-de-eglon, lugar:maqueda, relacion:adoni-zedec/murio_en/maqueda, relacion:hoham/murio_en/maqueda, relacion:piram/murio_en/maqueda, relacion:jafia-rey-de-lakis/murio_en/maqueda, relacion:debir-rey-de-eglon/murio_en/maqueda], menciona: [lugar:jerusalen, lugar:hebron, lugar:jarmut, lugar:lakis, lugar:eglon], nota: "Los comandantes que pisan la nuca de los reyes no se nombran. Bajar los cuerpos al ponerse el sol cumple Dt 21:22, 23."}
    - {v: "28", tipo: narracion, entidades: [evento:josue-toma-maqueda, lugar:maqueda, persona:josue-hijo-de-nun], menciona: [lugar:jerico], nota: "El rey de Maquedá no se nombra."}
    - {v: 29-30, tipo: narracion, entidades: [evento:josue-toma-libna, lugar:libna, persona:josue-hijo-de-nun], menciona: [lugar:maqueda, lugar:jerico], nota: "El rey de Libná no se nombra."}
    - {v: 31-33, tipo: narracion, entidades: [evento:josue-toma-lakis, lugar:lakis, persona:josue-hijo-de-nun, persona:horam, lugar:guezer, relacion:horam/vivio_en/guezer], menciona: [lugar:libna], nota: "El texto no dice dónde cayó Horam; por eso no lleva relación murio_en."}
    - {v: 34-35, tipo: narracion, entidades: [evento:josue-toma-eglon, lugar:eglon, persona:josue-hijo-de-nun], menciona: [lugar:lakis]}
    - {v: 36-37, tipo: narracion, entidades: [evento:josue-toma-hebron, lugar:hebron, persona:josue-hijo-de-nun], menciona: [lugar:eglon], nota: "El rey de Hebrón que muere aquí no se nombra; Hoham ya había muerto en Maquedá."}
    - {v: 38-39, tipo: narracion, entidades: [evento:josue-toma-debir, lugar:debir, persona:josue-hijo-de-nun], menciona: [lugar:hebron, lugar:libna], nota: "El rey de Debir no se nombra."}
    - {v: 40-43, tipo: narracion, entidades: [evento:josue-conquista-el-sur-de-canaan, persona:josue-hijo-de-nun, lugar:negueb, lugar:sefela, lugar:cades, lugar:gaza, lugar:gosen-de-juda, lugar:guilgal, relacion:josue-hijo-de-nun/vivio_en/guilgal], menciona: [lugar:gabaon], nota: "La región montañosa y las laderas no tienen nombre propio."}
  11:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-9, tipo: narracion, entidades: [evento:batalla-de-las-aguas-de-merom, persona:jabin-rey-de-hazor, persona:jobab-rey-de-madon, persona:josue-hijo-de-nun, lugar:aguas-de-merom, lugar:hazor, lugar:madon, lugar:simron, lugar:acsaf, lugar:dor, lugar:tierra-de-mizpa, lugar:sidon, lugar:misrefot-maim, relacion:jabin-rey-de-hazor/vivio_en/hazor, relacion:jobab-rey-de-madon/vivio_en/madon], menciona: [lugar:mar-de-galilea, lugar:araba, lugar:sefela, lugar:monte-hermon], nota: "Cananeos, amorreos, hititas, perizitas, jebuseos y heveos son pueblos, sin ficha. Kinéret es aquí el lago: las llanuras al sur son el valle del Jordán (Perspicacia «Kinéret»)."}
    - {v: 10-15, tipo: narracion, entidades: [evento:josue-toma-y-quema-hazor, persona:josue-hijo-de-nun, persona:jabin-rey-de-hazor, lugar:hazor, relacion:jabin-rey-de-hazor/murio_en/hazor], menciona: [persona:moises], nota: "Josué cumple lo que Jehová mandó por medio de Moisés: destruye a los habitantes y guarda el botín."}
    - {v: 16-20, tipo: narracion, entidades: [evento:conquista-de-canaan, persona:josue-hijo-de-nun, lugar:gosen-de-juda, lugar:monte-halac, lugar:baal-gad, lugar:valle-del-libano], menciona: [lugar:negueb, lugar:sefela, lugar:araba, lugar:israel, lugar:seir, lugar:monte-hermon, lugar:gabaon, persona:moises], nota: "Resumen de la guerra, que duró bastante tiempo. Solo los heveos de Gabaón hicieron la paz, como cuenta Jos 9; Jehová dejó que los demás reyes se obstinaran en luchar."}
    - {v: 21-22, tipo: narracion, entidades: [evento:josue-acaba-con-los-anaquim, persona:josue-hijo-de-nun, lugar:hebron, lugar:debir, lugar:anab, lugar:gaza, lugar:gat, lugar:asdod], menciona: [lugar:juda, lugar:israel], nota: "Los anaquim son un pueblo de gran estatura, sin ficha. Anac, de quien toman el nombre, no se nombra aquí."}
    - {v: "23", tipo: narracion, entidades: [evento:conquista-de-canaan, persona:josue-hijo-de-nun], menciona: [persona:moises], nota: "Josué entrega la tierra a las tribus como herencia y cesa la guerra."}
  12:
    estado: completo
