# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: joel
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, entidades: [persona:joel-profeta, persona:petuel, relacion:joel-profeta/pariente/petuel, evento:joel-anuncia-el-dia-de-jehova], nota: "Encabezamiento: el mensaje viene de Jehová y su portavoz es Joel, hijo de Petuel. Según la nota, Joel quiere decir «Jehová es Dios»."}
    - {v: 2-4, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova], menciona: [evento:destruccion-de-jerusalen-607], nota: "Ancianos y pueblo deben contar a sus hijos, y estos a los suyos, una desgracia sin igual: cuatro clases de langosta devoran lo que deja la anterior (Éx 10:14, 15). La Atalaya de 2020 aplica el v. 4 a Babilonia."}
    - {v: 5-12, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, relacion:joel-profeta/vivio_en/juda, relacion:joel-profeta/vivio_en/jerusalen], menciona: [evento:destruccion-de-jerusalen-607], nota: "Una nación innumerable, con dientes de león, arrasa vides, higueras y campos; faltan vino, grano y libaciones. La Atalaya de 2020 ve en ella al ejército babilonio de 607 a.e.c., distinto de las langostas de Ap 9:7, 8."}
    - {v: 13-14, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, relacion:joel-profeta/vivio_en/juda, relacion:joel-profeta/vivio_en/jerusalen], nota: "Los sacerdotes deben vestirse de saco, ordenar un ayuno y reunir a los ancianos y a todo el pueblo en la casa de Jehová para clamar a él."}
    - {v: 15-20, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova], nota: "El día de Jehová está cerca. Sin comida, graneros vacíos, ganado sin pasto; el fuego quema los pastos del desierto y el profeta clama a Jehová. Las referencias de 1:15 llevan a Sof 1:14 y Ap 6:16, 17."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-11, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, lugar:jerusalen, relacion:joel-profeta/vivio_en/juda, relacion:joel-profeta/vivio_en/jerusalen], menciona: [lugar:eden, evento:destruccion-de-jerusalen-607], nota: "Alarma en Sion: se acerca el día de Jehová, oscuro, y un ejército que parece de langostas deja un desierto donde había una tierra como Edén. La Atalaya de 2020 lo aplica a Babilonia contra Jerusalén en 607 a.e.c."}
    - {v: 12-17, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, lugar:jerusalen, persona:joel-profeta, relacion:joel-profeta/vivio_en/juda, relacion:joel-profeta/vivio_en/jerusalen], nota: "Jehová pide que vuelvan a él de corazón, con ayuno y llanto, pues es compasivo. En Sion se convoca una asamblea de todo el pueblo y los sacerdotes suplican entre el pórtico y el altar del templo."}
    - {v: 18-27, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, lugar:mar-salado, lugar:mar-grande], menciona: [lugar:jerusalen, evento:destruccion-de-jerusalen-607], nota: "Jehová echará al del norte a los mares oriental (Salado) y occidental (Mediterráneo), dará lluvia y cosechas y repondrá lo perdido. Según La Atalaya de 2020, el del norte y el gran ejército eran Babilonia. Israel es aquí el pueblo."}
    - {v: 28-32, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, lugar:jerusalen, relacion:joel-profeta/vivio_en/juda, relacion:joel-profeta/vivio_en/jerusalen], menciona: [evento:pentecostes-33], nota: "Promesa de derramar el espíritu sobre gente de toda clase y de señales en el cielo antes del gran día; en Sion y Jerusalén se salvará quien invoque a Jehová. Pedro lo vio cumplido en el Pentecostés de 33."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, persona:joel-profeta, relacion:joel-profeta/vivio_en/juda, relacion:joel-profeta/vivio_en/jerusalen, lugar:juda, lugar:jerusalen], menciona: [persona:jehosafat], nota: "Jehová juzgará a las naciones que dispersaron a su pueblo y vendieron a sus niños. El valle de Jehosafat («Jehová es juez») es simbólico y no lleva ficha: evoca cómo libró a Judá en días del rey Jehosafat (2Cr 20)."}
    - {v: 4-6, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, lugar:tiro, lugar:sidon, lugar:filistea, lugar:grecia, lugar:juda, lugar:jerusalen], nota: "Tiro, Sidón y Filistea llevaron a sus templos el oro y la plata de Jehová y vendieron gente de Judá a los griegos (2Cr 21:16, 17). Según Perspicacia, es la vez más antigua que las Escrituras Hebreas nombran a Grecia."}
    - {v: 7-8, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, lugar:reino-de-saba], menciona: [lugar:juda, lugar:tiro, lugar:sidon, lugar:filistea], nota: "Jehová traerá de vuelta a los vendidos, y Judá venderá a los hijos de sus captores a los de Saba, reino lejano de Arabia (Perspicacia «Seba», núm. 6). Tiro cayó ante Nabucodonosor y Alejandro Magno; Filistea sufrió algo parecido."}
    - {v: 9-12, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova], nota: "Desafío a las naciones vecinas: que se preparen para la guerra, hagan espadas de sus arados y lanzas de sus podaderas, y suban al valle de Jehosafat, donde Jehová se sentará a juzgarlas."}
    - {v: 13-15, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova], nota: "La cosecha está madura y el lagar rebosa por la maldad de las naciones. Multitudes llenan el valle de la Decisión, otro nombre simbólico del de Jehosafat (La Atalaya, 2007). Se oscurecen el sol, la luna y las estrellas."}
    - {v: 16-17, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, lugar:jerusalen, relacion:joel-profeta/vivio_en/juda, relacion:joel-profeta/vivio_en/jerusalen], nota: "Jehová ruge desde Sion y hace temblar cielo y tierra, pero es refugio de Israel, aquí el pueblo, sin ficha. Vive en Sion, su santa montaña; Jerusalén será santa y sin extraños. Am 1:2 repite casi el v. 16."}
    - {v: "18", tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, lugar:valle-de-las-acacias, lugar:juda, relacion:joel-profeta/vivio_en/juda, relacion:joel-profeta/vivio_en/jerusalen], nota: "Promesa de abundancia: vino dulce, leche y agua en Judá. Un manantial de la casa de Jehová regará el seco valle de las Acacias, quizá el bajo Cedrón; La adoración pura lo lee como figura de sus bendiciones."}
    - {v: 19-21, tipo: profecia, entidades: [evento:joel-anuncia-el-dia-de-jehova, lugar:egipto, lugar:edom, lugar:juda, lugar:jerusalen, relacion:joel-profeta/vivio_en/juda, relacion:joel-profeta/vivio_en/jerusalen], nota: "Egipto y Edom quedarán desolados por su violencia y la sangre inocente vertida en Judá, que estará habitada para siempre, igual que Jerusalén. Hacia el siglo IV a.e.c. Edom ya era un yermo (La Atalaya, 2007)."}
