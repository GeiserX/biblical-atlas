# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: job
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: narracion, entidades: [persona:job, lugar:uz, relacion:job/vivio_en/uz], nota: "Job, íntegro y muy rico, el más destacado de los orientales, ofrece sacrificios por sus diez hijos por si han pecado."}
    - {v: 6-12, tipo: narracion, entidades: [evento:satanas-pone-en-duda-la-integridad-de-job, persona:satanas, persona:job], nota: "Los «hijos del Dios verdadero» son ángeles, sin nombre."}
    - {v: 13-19, tipo: narracion, entidades: [evento:job-pierde-sus-bienes-y-sus-hijos, persona:job, lugar:caldea], menciona: [lugar:saba], nota: "Los sabeos son un pueblo. Perspicacia los junta con los viajeros de Saba de 6:19 y no sabe de qué Seba venían, así que Saba va sin punto."}
    - {v: 20-22, tipo: narracion, entidades: [evento:job-pierde-sus-bienes-y-sus-hijos, persona:job]}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: narracion, entidades: [evento:satanas-vuelve-a-desafiar-la-integridad-de-job, persona:satanas, persona:job], nota: "Los «hijos del Dios verdadero» vuelven a ser ángeles sin nombre."}
    - {v: 7-10, tipo: narracion, entidades: [evento:satanas-hiere-a-job-con-ulceras, persona:job, persona:satanas], nota: "La esposa de Job no tiene nombre, así que no lleva ficha."}
    - {v: 11-13, tipo: narracion, entidades: [evento:los-tres-companeros-van-a-consolar-a-job, persona:elifaz-el-temanita, persona:bildad, persona:zofar, persona:suah, persona:job, lugar:teman, relacion:elifaz-el-temanita/acompana/job, relacion:elifaz-el-temanita/vivio_en/teman, relacion:bildad/acompana/job, relacion:bildad/acompana/elifaz-el-temanita, relacion:bildad/pariente/suah, relacion:zofar/acompana/job, relacion:zofar/acompana/elifaz-el-temanita], nota: "Naamatita alude a la familia o la tierra de Zofar, que no se conoce; no lleva lugar."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: narracion, entidades: [evento:job-maldice-el-dia-en-que-nacio, persona:job]}
    - {v: 3-26, tipo: poesia, entidades: [persona:job], nota: "Lamento de Job: ojalá no hubiera nacido, pues en la muerte descansaría. Leviatán (v. 8) es un gran animal acuático, no una persona."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-11, tipo: discurso, entidades: [evento:primer-discurso-de-elifaz, persona:elifaz-el-temanita, persona:job, lugar:teman, relacion:elifaz-el-temanita/acompana/job, relacion:elifaz-el-temanita/vivio_en/teman], nota: "Elifaz el temanita abre la primera ronda: recuerda que Job sostenía a los débiles y ahora se hunde; ningún inocente perece y quien cultiva maldad la recoge."}
    - {v: 12-21, tipo: discurso, entidades: [persona:elifaz-el-temanita], nota: "Elifaz relata una visión nocturna: un espíritu le dijo que Dios desconfía hasta de sus ángeles. Según La Atalaya, aquel espíritu era malo, no un ángel fiel."}
  5:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-16, tipo: discurso, entidades: [evento:primer-discurso-de-elifaz, persona:elifaz-el-temanita, persona:job], nota: "Elifaz sigue: ningún santo (ángel, según la nota) ayudará a Job; el necio acaba arruinado. Él acudiría a Dios, que frustra a los astutos."}
    - {v: 17-27, tipo: discurso, entidades: [persona:elifaz-el-temanita, persona:job], nota: "Elifaz llama feliz al que Dios corrige y promete a Job protección, muchos hijos y una vejez fuerte si acepta la disciplina."}
  6:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-13, tipo: discurso, entidades: [evento:job-responde-al-primer-discurso-de-elifaz, persona:job], nota: "Job contesta a Elifaz: dice que su angustia supera en peso a la arena del mar, que las flechas del Todopoderoso lo envenenan y que prefiere que Dios acabe con él."}
    - {v: 14-23, tipo: discurso, entidades: [persona:job, lugar:tema, lugar:saba], nota: "Sus amigos le fallan como torrentes que se secan en verano y dejan chasqueadas a las caravanas de Temá y a los viajeros de Saba."}
    - {v: 24-30, tipo: discurso, entidades: [persona:job], nota: "Job pide que le enseñen en qué se equivocó y les ruega que lo miren y recapaciten: su justicia sigue intacta."}
  7:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-10, tipo: discurso, entidades: [evento:job-responde-al-primer-discurso-de-elifaz, persona:job], nota: "La vida es trabajo forzado; el cuerpo de Job está lleno de gusanos, costras y pus. Quien baja a la Tumba (Seol, lugar simbólico, sin ficha) no vuelve."}
    - {v: 11-21, tipo: discurso, entidades: [persona:job], nota: "Job se queja a Dios: los sueños lo aterran, prefiere morir y pregunta por qué lo ha convertido en su blanco en vez de perdonarlo."}
  8:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: discurso, entidades: [evento:primer-discurso-de-bildad, persona:bildad, persona:job, relacion:bildad/acompana/job, relacion:bildad/pariente/suah], menciona: [persona:suah], nota: "Bildad el suhita (ligado a Súah, hijo de Abrahán) habla en segundo lugar: Dios no tuerce la justicia; si los hijos de Job pecaron, pagaron, y si Job es puro, Dios lo restablecerá."}
    - {v: 8-22, tipo: discurso, entidades: [persona:bildad], nota: "Bildad apela a las generaciones pasadas: como el papiro sin agua, el que olvida a Dios se seca; Dios no rechaza al íntegro."}
  9:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-13, tipo: discurso, entidades: [evento:job-responde-al-primer-discurso-de-bildad, persona:job], nota: "Job contesta a Bildad: nadie gana un pleito a Dios, que mueve montañas e hizo las constelaciones Ash, Kesil y Kimá (quizá Osa Mayor, Orión y Pléyades). Rahab es aquí un monstruo marino, sin ficha."}
    - {v: 14-24, tipo: discurso, entidades: [persona:job], nota: "Aunque tuviera razón, Job no sabría responder a Dios; siente que destruye igual al inocente que al malvado."}
    - {v: 25-35, tipo: discurso, entidades: [persona:job], nota: "Sus días huyen más rápido que un corredor; entre él y Dios no hay nadie que juzgue a los dos."}
  10:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-17, tipo: discurso, entidades: [evento:job-responde-al-primer-discurso-de-bildad, persona:job], nota: "Job pide a Dios que no lo condene sin decirle por qué: lo formó como barro y lo tejió con huesos y tendones, y ahora lo destruye."}
    - {v: 18-22, tipo: discurso, entidades: [persona:job], nota: "Job lamenta haber nacido y pide un poco de alivio antes de ir a la tierra de oscuridad de la que no se vuelve."}
  11:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:primer-discurso-de-zofar, persona:zofar, persona:job], nota: "Zofar, el naamatita, reprocha a Job su palabrería y su pretensión de pureza, y desea que Dios le hable y le muestre su error."}
    - {v: 7-12, tipo: discurso, nota: "Zofar ensalza la sabiduría de Dios, más alta que el cielo y más honda que la Tumba (Seol), y llama cabeza hueca al que no la entiende."}
    - {v: 13-20, tipo: discurso, nota: "Zofar insta a Job a apartar la maldad de su tienda y le promete seguridad; a los malvados solo les queda la muerte."}
  12:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:job-responde-al-primer-discurso-de-zofar, persona:job, persona:zofar, persona:bildad, persona:elifaz-el-temanita, relacion:zofar/acompana/job, relacion:bildad/acompana/job, relacion:elifaz-el-temanita/acompana/job], nota: "Job responde a Zofar: no es inferior a sus compañeros, que se ríen de él aunque es justo, mientras los ladrones viven en paz."}
    - {v: 7-12, tipo: discurso, nota: "Los animales, las aves, la tierra y los peces muestran que la mano de Jehová lo hizo todo y sostiene la vida de todos."}
    - {v: 13-25, tipo: discurso, nota: "Dios tiene sabiduría y poder: derriba consejeros, jueces, reyes y sacerdotes, engrandece y destruye naciones y extravía a sus jefes."}
  13:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-12, tipo: discurso, entidades: [evento:job-responde-al-primer-discurso-de-zofar, persona:job], nota: "Job llama a sus compañeros médicos inútiles que mienten a favor de Dios y prefiere defender su caso ante el Todopoderoso."}
    - {v: 13-19, tipo: discurso, nota: "Job pide silencio para hablar: aunque Dios lo matara seguiría esperando en él, porque sabe que tiene razón."}
    - {v: 20-28, tipo: discurso, nota: "Job ruega a Dios que aparte su mano, le muestre sus pecados y deje de tratarlo como enemigo por las faltas de su juventud."}
  14:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:job-responde-al-primer-discurso-de-zofar, persona:job], nota: "La vida del hombre nacido de mujer es breve y agitada; Job pide a Dios que lo deje descansar hasta cumplir su jornada."}
    - {v: 7-12, tipo: discurso, nota: "Un árbol cortado vuelve a brotar, pero el hombre muere y no se levanta mientras dure el cielo."}
    - {v: 13-17, tipo: discurso, nota: "Job desea que Dios lo oculte en la Tumba (Seol) y fije un plazo para recordarlo; espera que Dios lo llame y el muerto vuelva a la vida."}
    - {v: 18-22, tipo: discurso, nota: "Como el agua desgasta la roca, Dios acaba con la esperanza del hombre; el muerto no sabe qué les pasa a sus hijos."}
  15:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:segundo-discurso-de-elifaz, persona:elifaz-el-temanita, persona:job, lugar:teman, relacion:elifaz-el-temanita/vivio_en/teman], nota: "Elifaz, el temanita, acusa a Job de hablar viento, de quitar valor al temor de Dios y de condenarse con su propia boca."}
    - {v: 7-16, tipo: discurso, nota: "Elifaz se burla de la sabiduría de Job, presume de canosos más viejos que su padre y dice que Dios no confía ni en sus santos."}
    - {v: 17-35, tipo: discurso, nota: "Elifaz describe la suerte del malvado: vive aterrado, pierde sus bienes y sus tiendas arden; los irreverentes no dan fruto."}
  16:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: discurso, entidades: [evento:job-responde-al-segundo-discurso-de-elifaz, persona:job, persona:elifaz-el-temanita], nota: "Job llama a sus compañeros consoladores molestos: él, en su lugar, los animaría con sus palabras."}
    - {v: 6-17, tipo: discurso, nota: "Job siente que Dios lo ha agotado, ha acabado con su casa y lo ataca como un guerrero; viste saco y llora aunque es inocente."}
    - {v: 18-22, tipo: discurso, entidades: [persona:zofar, persona:bildad, relacion:zofar/acompana/job, relacion:bildad/acompana/job, relacion:elifaz-el-temanita/acompana/job], nota: "Job pide que la tierra no tape su sangre; su testigo está en el cielo mientras sus amigos se burlan, y le quedan pocos años."}
  17:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-9, tipo: discurso, entidades: [evento:job-responde-al-segundo-discurso-de-elifaz, persona:job], nota: "Job se ve cerca del cementerio, rodeado de burlones; pide a Dios que sea su fiador. El justo sigue firme en su camino."}
    - {v: 10-16, tipo: discurso, nota: "Job no halla un sabio entre sus compañeros; sus planes se rompieron y su esperanza bajará con él a la Tumba (Seol)."}
  18:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-21, tipo: discurso, entidades: [evento:segundo-discurso-de-bildad, persona:bildad, persona:job], nota: "Bildad describe el fin del malvado: se le apaga la luz, lo atrapan lazos, pierde su tienda y su nombre y no deja descendencia. «Suhita» lo liga a Súah, que aquí no se nombra."}
  19:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-29, tipo: discurso, entidades: [evento:job-responde-al-segundo-discurso-de-bildad, persona:job, persona:bildad, persona:zofar, persona:elifaz-el-temanita, relacion:bildad/acompana/job, relacion:zofar/acompana/job, relacion:elifaz-el-temanita/acompana/job], nota: "Job dice que Dios lo ha cercado y que su esposa, hermanos, amigos y criados lo rechazan; quiere que sus palabras queden grabadas. «Mi redentor vive» (19:25): el redentor no se nombra."}
  20:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-29, tipo: discurso, entidades: [evento:segundo-discurso-de-zofar, persona:zofar, persona:job], menciona: [persona:adan], nota: "Zofar sostiene que la dicha del malvado dura poco y que devolverá lo robado. La nota de 20:4 admite leer «Adán fue puesto en la tierra». «Naamatita» no nombra un lugar seguro."}
  21:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-34, tipo: discurso, entidades: [evento:job-responde-al-segundo-discurso-de-zofar, persona:job], nota: "Job replica que muchos malvados viven ricos y tranquilos y bajan a la Tumba en paz; justo y malvado acaban igual en el polvo. Llama vacío el consuelo de sus compañeros."}
  22:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-30, tipo: discurso, entidades: [evento:tercer-discurso-de-elifaz, persona:elifaz-el-temanita, persona:job, lugar:teman, relacion:elifaz-el-temanita/vivio_en/teman, lugar:ofir], nota: "Elifaz acusa a Job de oprimir a pobres, viudas y huérfanos y le pide que vuelva a Dios. Ofir sale como fuente del oro más fino."}
  23:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-17, tipo: discurso, entidades: [evento:job-responde-al-tercer-discurso-de-elifaz, persona:job], nota: "Job quisiera hallar a Dios para exponerle su causa; está seguro de haber seguido su camino y de salir de la prueba como oro, pero siente temor ante Él."}
  24:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-25, tipo: discurso, entidades: [evento:job-responde-al-tercer-discurso-de-elifaz, persona:job], nota: "Sigue la respuesta de Job: los malvados mueven mojones, roban rebaños y explotan a huérfanos y viudas; asesinos y adúlteros aman la oscuridad, pero la Tumba se los lleva."}
  25:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:tercer-discurso-de-bildad, persona:bildad, persona:job, relacion:bildad/acompana/job], nota: "Tercer discurso de Bildad, el más breve: Dios domina el cielo y ante él nadie nacido de mujer es puro. Zofar no toma la palabra en esta ronda."}
  26:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: discurso, entidades: [evento:job-responde-al-tercer-discurso-de-bildad, persona:job], nota: "Job contesta a Bildad con ironía: sus consejos no han ayudado al débil ni al que no sabe."}
    - {v: 5-14, tipo: discurso, nota: "El poder de Dios en la creación: la Tumba (Seol) y el lugar de destrucción (Abadón) están a su vista. Rahab, el monstruo marino del versículo 12, es figura poética y no lleva ficha."}
  27:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-12, tipo: discurso, entidades: [evento:job-responde-al-tercer-discurso-de-bildad, persona:job], nota: "Job jura por Dios que mientras viva no dará la razón a sus compañeros ni renunciará a su integridad."}
    - {v: 13-23, tipo: discurso, nota: "Lo que le espera al malvado: sus hijos mueren, el justo se queda con su plata y un viento del este lo arrastra."}
  28:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-11, tipo: discurso, entidades: [evento:job-responde-al-tercer-discurso-de-bildad, persona:job], nota: "El hombre abre minas en lo hondo de la tierra y saca plata, oro, hierro, cobre y zafiro de donde ningún animal llega."}
    - {v: 12-19, tipo: discurso, entidades: [lugar:ofir, lugar:etiopia], nota: "La sabiduría no se compra: vale más que el oro de Ofir y que el topacio de Cus, la región que Perspicacia hace corresponder con Etiopía."}
    - {v: 20-28, tipo: discurso, nota: "Solo Dios sabe dónde está la sabiduría. Al hombre le dice que sabiduría es temer a Jehová y apartarse del mal."}
  29:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:job-responde-al-tercer-discurso-de-bildad, persona:job], nota: "Job echa de menos los días en que Dios lo guardaba y sus hijos lo rodeaban."}
    - {v: 7-17, tipo: discurso, entidades: [persona:job], nota: "En la puerta de una ciudad sin nombre lo respetaban jóvenes, ancianos y príncipes; defendía al pobre, al huérfano y a la viuda y juzgaba con justicia."}
    - {v: 18-25, tipo: discurso, nota: "Contaba con morir anciano en su casa; la gente esperaba sus consejos como se espera la lluvia y él los guiaba como un jefe."}
  30:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-15, tipo: discurso, entidades: [evento:job-responde-al-tercer-discurso-de-bildad, persona:job], nota: "Ahora se burlan de él y le escupen hombres más jóvenes, hijos de gente despreciada que vivía expulsada en los barrancos."}
    - {v: 16-31, tipo: discurso, nota: "Job describe su dolor, su piel ennegrecida y su fiebre, y se queja de que Dios no le responde aunque él siempre lloró con el pobre."}
  31:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-12, tipo: discurso, entidades: [evento:job-responde-al-tercer-discurso-de-bildad, persona:job], nota: "Job dice que pactó con sus ojos no desear a otra mujer ni engañar, y pide que Dios lo pese con una balanza justa."}
    - {v: 13-23, tipo: discurso, nota: "No negó justicia a sus siervos ni abandonó al pobre, al huérfano o a la viuda: el mismo Dios los formó a todos."}
    - {v: 24-34, tipo: discurso, nota: "No se fió de su oro ni adoró al sol o a la luna, no celebró la ruina de su enemigo y abrió su casa al forastero."}
    - {v: 35-40, tipo: discurso, nota: "Pide que el Todopoderoso le responda y firma su defensa. El capítulo cierra diciendo que ahí terminan las palabras de Job."}
  32:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: narracion, entidades: [evento:elihu-corrige-a-job, persona:elihu-hijo-de-barakel, persona:barakel, persona:ram-antepasado-de-elihu, persona:buz-hijo-de-nacor, persona:job, persona:elifaz-el-temanita, persona:bildad, persona:zofar, relacion:elihu-hijo-de-barakel/pariente/barakel, relacion:elihu-hijo-de-barakel/pariente/ram-antepasado-de-elihu, relacion:elihu-hijo-de-barakel/pariente/buz-hijo-de-nacor, relacion:barakel/pariente/buz-hijo-de-nacor, relacion:elifaz-el-temanita/acompana/job, relacion:bildad/acompana/job, relacion:zofar/acompana/job], nota: "Los tres compañeros dejan de responder a Job y Elihú, el más joven, se enoja con Job y con ellos."}
    - {v: 6-22, tipo: discurso, entidades: [persona:elihu-hijo-de-barakel], menciona: [persona:barakel, persona:job, persona:elifaz-el-temanita, persona:bildad, persona:zofar], nota: "Elihú explica que calló por ser joven, que la sabiduría la da el espíritu de Dios y no los años, y que hablará sin adular a nadie."}
  33:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: discurso, entidades: [evento:elihu-corrige-a-job, persona:elihu-hijo-de-barakel, persona:job], nota: "Elihú pide a Job que lo escuche: los dos fueron hechos del barro, así que no tiene por qué temerle."}
    - {v: 8-13, tipo: discurso, entidades: [persona:elihu-hijo-de-barakel, persona:job], nota: "Elihú repite lo que Job dijo de su inocencia y de que Dios lo trataba como enemigo, y le contesta que Dios es mayor que el hombre."}
    - {v: 14-30, tipo: discurso, nota: "Dios corrige al hombre con sueños y con el dolor; si un mensajero intercede, Dios halla un rescate y le devuelve el vigor de la juventud."}
    - {v: 31-33, tipo: discurso, entidades: [persona:elihu-hijo-de-barakel, persona:job], nota: "Elihú invita a Job a responderle si puede o, si no, a callar y aprender."}
  34:
    estado: completo
    revisado: 2026-09-29
    tramos:
