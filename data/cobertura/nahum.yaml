# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: nahum
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: profecia, entidades: [persona:nahum-profeta, lugar:elqos, relacion:nahum-profeta/vivio_en/elqos, lugar:ninive, evento:nahum-profetiza-contra-ninive], nota: "Encabezamiento: declaración contra Nínive y libro de la visión de Nahúm, nombre que la nota traduce «consolador». Elcosita quiere decir de Elqós, lugar que Perspicacia no sabe situar con seguridad."}
    - {v: 2-6, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:basan, lugar:monte-carmelo, lugar:libano], nota: "Jehová pide devoción exclusiva, como en el segundo mandamiento (Éx 20:5), y aunque es paciente castiga a sus enemigos. Seca mares y ríos; Basán, el Carmelo y el Líbano se marchitan, imagen de su juicio según Perspicacia «Carmelo»."}
    - {v: 7-10, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:ninive], menciona: [evento:caida-de-ninive, lugar:rio-tigris], nota: "Jehová es refugio de quien confía en él. Una inundación arrasará el lugar de Nínive, como dice la nota, y sus enemigos arderán como rastrojo. La Atalaya de 2007 lo ve cumplido en 632 a.e.c., con el Tigris desbordado."}
    - {v: 11-14, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:asiria, lugar:juda], menciona: [evento:caida-de-ninive, evento:senaquerib-contra-jerusalen, periodo:potencia-asiria], nota: "De Nínive sale quien trama contra Jehová. Él dejará de afligir a Judá, según la nota, y romperá el yugo asirio, que Perspicacia recuerda en la invasión de Senaquerib. Asiria perderá su nombre y sus ídolos, y tendrá su tumba."}
    - {v: "15", tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:juda, relacion:nahum-profeta/vivio_en/juda], nota: "Por las montañas llega quien anuncia paz: Judá podrá celebrar sus fiestas y cumplir sus votos, porque el opresor no volverá. Is 52:7 usa la misma imagen, y Ro 10:15 la aplica a quienes predican las buenas noticias."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:ninive], menciona: [evento:caida-de-ninive, evento:caida-de-samaria], nota: "Un atacante sube contra Nínive, como aclara la nota al pie, y se burla de sus defensas. Jehová devolverá su orgullo a Jacob e Israel, que es el pueblo; la referencia remite a la deportación de 2Re 17:6."}
    - {v: 3-7, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive], menciona: [evento:caida-de-ninive, lugar:rio-tigris, persona:nabopolasar, persona:ciaxares], nota: "Carros de guerra relucientes recorren las calles. Se abren las compuertas fluviales y el palacio se hunde: La Atalaya (1989, 2007) lo ve en la crecida del Tigris durante el cerco de Nabopolasar y Ciaxares, en 632."}
    - {v: 8-10, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:ninive], menciona: [evento:caida-de-ninive, evento:nemrod-edifica-en-asiria], nota: "Nínive, rebosante como un estanque desde su fundación (la referencia remite a Nemrod, Gé 10:8, 11), se vacía: todos huyen y nadie se detiene. Le saquean el oro y la plata y queda desolada."}
    - {v: 11-13, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:ninive], menciona: [evento:caida-de-ninive, evento:senaquerib-contra-jerusalen], nota: "La guarida de leones que llenaban sus cuevas de presas, que es Nínive, pierde carros y cachorros. «Toda Escritura» recuerda los leones de piedra de sus ruinas. Los mensajeros que callarán remiten a los de Senaquerib (2Re 18:17)."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:ninive], menciona: [evento:caida-de-ninive], nota: "¡Ay de la ciudad sanguinaria, repleta de mentira y rapiña! Jinetes, espadas y muertos sin cuento. Como una prostituta hechicera seduce a las naciones: La Atalaya de 1989 pone el caso de Acaz, a quien Asiria acabó oprimiendo."}
    - {v: 5-7, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:ninive], menciona: [evento:caida-de-ninive], nota: "Jehová se pone contra Nínive, precisa la nota: la dejará desnuda ante los pueblos y le arrojará inmundicia, que Perspicacia («Cosa repugnante») entiende como suciedad y no como ídolos. Quien la vea huirá sin nadie que la consuele."}
    - {v: 8-10, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, evento:asurbanipal-saquea-no-amon, persona:asurbanipal, lugar:no-amon, lugar:rio-nilo, lugar:etiopia, lugar:egipto, lugar:put, lugar:libia], menciona: [evento:caida-de-ninive], nota: "No-Amón, Tebas según la nota, protegida por el agua del Nilo y apoyada por Etiopía, Egipto, Put y los libios, también acabó desterrada. Perspicacia atribuye el saqueo a Asurbanipal. Amón es su dios, sin ficha; Put, el pueblo."}
    - {v: 11-17, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive], menciona: [evento:caida-de-ninive], nota: "Nínive se emborrachará y buscará escondite. Sus fortalezas caen como brevas al sacudir la higuera, sus soldados pierden el valor y el fuego quema sus cerrojos. En vano acopia agua y ladrillos; sus guardias se esfuman como langostas."}
    - {v: 18-19, tipo: profecia, entidades: [evento:nahum-profetiza-contra-ninive, lugar:asiria], menciona: [evento:caida-de-ninive, periodo:potencia-asiria, persona:nabopolasar, persona:ciaxares], nota: "El rey de Asiria, sin nombre, tiene a sus pastores dormidos y a su pueblo disperso. Su herida es incurable y todos aplauden. Perspicacia «Medos, Media» lo une al reparto del imperio entre medos y babilonios."}
