# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: ageo
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: profecia, entidades: [evento:primer-mensaje-de-ageo, persona:ageo, persona:zorobabel, persona:sealtiel, persona:josue-sumo-sacerdote, persona:jehozadac, relacion:zorobabel/pariente/sealtiel, relacion:josue-sumo-sacerdote/pariente/jehozadac, relacion:zorobabel/acompana/josue-sumo-sacerdote, relacion:josue-sumo-sacerdote/acompana/zorobabel, relacion:ageo/vivio_en/jerusalen, relacion:zorobabel/vivio_en/jerusalen, relacion:josue-sumo-sacerdote/vivio_en/jerusalen, periodo:gobierno-de-zorobabel, periodo:sumo-sacerdocio-de-josue], menciona: [lugar:juda, persona:dario-i, periodo:dario-i, evento:obra-del-templo-prohibida-522], nota: "Día 1 del sexto mes, año segundo de Darío I. Por Ageo («nacido en una fiesta», según la nota), Jehová se dirige a Zorobabel, gobernador, y a Josué, sumo sacerdote: el pueblo cree que aún no toca reconstruir su casa."}
    - {v: 3-6, tipo: profecia, entidades: [evento:primer-mensaje-de-ageo], menciona: [evento:destruccion-de-jerusalen-607], nota: "Ellos habitan casas con paneles y el templo sigue arruinado; la referencia del v. 4 remite a su quema en 607. Que reflexionen: siembran mucho, cosechan poco y el jornal se les va como por una bolsa rota."}
    - {v: 7-11, tipo: profecia, entidades: [evento:primer-mensaje-de-ageo], nota: "Que suban a la montaña, que el texto no nombra, por madera y construyan la casa. Por atender sus propias casas y descuidar la de Jehová, él les retiene el rocío y manda sequía sobre campos, personas y ganado."}
    - {v: 12-15, tipo: narracion, entidades: [evento:se-reanuda-la-obra-del-templo-520, persona:zorobabel, persona:sealtiel, persona:josue-sumo-sacerdote, persona:jehozadac, persona:ageo, relacion:zorobabel/pariente/sealtiel, relacion:josue-sumo-sacerdote/pariente/jehozadac, relacion:zorobabel/acompana/josue-sumo-sacerdote, relacion:josue-sumo-sacerdote/acompana/zorobabel, periodo:gobierno-de-zorobabel], menciona: [lugar:juda, persona:dario-i, periodo:dario-i, evento:obra-del-templo-prohibida-522], nota: "Zorobabel, Josué y el resto del pueblo obedecen y temen a Jehová; Ageo, su mensajero, les asegura que él está con ellos. El 24 del sexto mes empiezan a trabajar en el templo, aunque la prohibición persa sigue vigente."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: profecia, entidades: [evento:segundo-mensaje-de-ageo, persona:ageo, persona:zorobabel, persona:sealtiel, persona:josue-sumo-sacerdote, persona:jehozadac, relacion:zorobabel/pariente/sealtiel, relacion:josue-sumo-sacerdote/pariente/jehozadac, relacion:zorobabel/acompana/josue-sumo-sacerdote, relacion:josue-sumo-sacerdote/acompana/zorobabel, periodo:gobierno-de-zorobabel, periodo:sumo-sacerdocio-de-josue], menciona: [lugar:juda, evento:templo-de-salomon-terminado], nota: "Día 21 del séptimo mes. Ageo pregunta a Zorobabel, a Josué y al pueblo quién vio la casa en su gloria anterior. Según Perspicacia, algunos mayores recordaban el templo de Salomón y el nuevo les parecía nada."}
    - {v: 4-5, tipo: profecia, entidades: [evento:segundo-mensaje-de-ageo, persona:zorobabel, persona:josue-sumo-sacerdote], menciona: [lugar:egipto, evento:exodo, evento:pacto-de-la-ley], nota: "Jehová pide a Zorobabel, a Josué y a la gente del país que se esfuercen y trabajen, porque él está con ellos. Les recuerda lo que prometió al salir de Egipto; las referencias remiten al pacto del Sinaí."}
    - {v: 6-9, tipo: profecia, entidades: [evento:segundo-mensaje-de-ageo], nota: "Pronto Jehová sacudirá cielos, tierra y naciones; lo valioso de ellas entrará en su casa, y su gloria superará a la del templo anterior. Allí dará paz. Heb 12:26, 27 cita el v. 6 y lo aplica al Reino."}
    - {v: 10-14, tipo: profecia, entidades: [evento:tercer-mensaje-de-ageo, persona:ageo], menciona: [persona:dario-i, periodo:dario-i], nota: "Día 24 del noveno mes. Ageo consulta a los sacerdotes sobre la Ley: la carne santa no santifica lo que toca, pero quien está impuro por un cadáver sí contamina. Así ve Jehová al pueblo y sus ofrendas."}
    - {v: 15-19, tipo: profecia, entidades: [evento:tercer-mensaje-de-ageo], menciona: [evento:se-reanuda-la-obra-del-templo-520], nota: "Antes de reanudar la obra, el grano y el vino rendían la mitad o menos. Ag 2:18 llama al día 24 el de los cimientos; las referencias remiten a Esd 5:2. Desde ese día, Jehová los bendecirá."}
    - {v: 20-23, tipo: profecia, entidades: [evento:cuarto-mensaje-de-ageo, persona:ageo, persona:zorobabel, persona:sealtiel, relacion:zorobabel/pariente/sealtiel, periodo:gobierno-de-zorobabel], menciona: [lugar:juda], nota: "Ese mismo día 24 llega otro mensaje, para Zorobabel, gobernador de Judá: Jehová derribará los tronos de los reinos y sus jinetes caerán unos a manos de otros. A Zorobabel, su elegido, lo hará como un anillo de sellar."}
