# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: efesios
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    nota: "Saludo a los santos de Éfeso, alabanza por lo que Dios da a los ungidos en unión con Cristo y oración de Pablo por ellos. El único suceso es la propia carta, escrita en Roma."
    tramos:
    - {v: 1-2, tipo: carta, entidades: [carta:efesios, evento:pablo-escribe-efesios, persona:pablo, lugar:efeso], menciona: [persona:jesus, lugar:laodicea], nota: "Pablo, apóstol por voluntad de Dios, saluda a los santos fieles de Éfeso. La nota defiende las palabras «en Éfeso», que faltan en algunos manuscritos, frente a quienes suponen la carta enviada a Laodicea."}
    - {v: 3-7, tipo: carta, menciona: [persona:jesus, evento:muerte-de-jesus], nota: "Alabanza a Dios, que escogió de antemano al grupo de los ungidos, no a cada uno, para adoptarlos como hijos por Jesucristo. Su sangre trae rescate y perdón; la nota la compara con la del Día de Expiación."}
    - {v: 8-14, tipo: carta, menciona: [persona:jesus, evento:pentecostes-33], nota: "Dios revela su secreto sagrado: una administración para reunir en Cristo lo del cielo y lo de la tierra. Según la nota, lo del cielo empezó a reunirse en Pentecostés de 33. El espíritu sella a los creyentes."}
    - {v: 15-23, tipo: carta, menciona: [persona:jesus, evento:resurreccion-de-jesus], nota: "Pablo da gracias por su fe y pide que entiendan su esperanza y el poder con que Dios resucitó a Cristo, lo sentó a su derecha sobre toda autoridad y lo hizo cabeza de la congregación, su cuerpo."}
  2:
    estado: completo
    revisado: 2026-09-29
    nota: "Los ungidos, antes muertos por sus pecados, reciben vida por bondad inmerecida. Con su muerte Cristo quita la Ley que separaba a judíos y gentiles y los une en un templo para Jehová. Sin sucesos nuevos."
    tramos:
    - {v: 1-3, tipo: carta, entidades: [carta:efesios, persona:satanas], menciona: [persona:adan], nota: "Antes de ser cristianos estaban muertos por sus pecados y seguían la corriente del mundo y a su gobernante del aire, que la nota identifica con Satanás. Por el pecado heredado de Adán eran hijos de la ira."}
    - {v: 4-10, tipo: carta, menciona: [persona:jesus], nota: "Dios, rico en misericordia, les dio vida con Cristo y los sentó con él en los lugares celestiales. La salvación llega por la fe, como regalo y no por obras; son obra suya, creados para hacer el bien."}
    - {v: 11-13, tipo: carta, menciona: [persona:jesus, evento:muerte-de-jesus], nota: "Los gentiles, a quienes los judíos llamaban incircuncisión, vivían apartados de Israel como nación, ajenos a los pactos de la promesa, sin esperanza y sin Dios. La sangre de Cristo los ha acercado."}
    - {v: 14-18, tipo: carta, menciona: [persona:jesus, evento:muerte-de-jesus, evento:pacto-de-la-ley, lugar:jerusalen, evento:arresto-en-el-templo, evento:pablo-predica-dos-anos-en-roma, lugar:roma], nota: "Cristo derriba el muro entre los dos grupos, la Ley, y los reconcilia en un cuerpo por el madero. La nota ve aludida la barrera del templo de Jerusalén, por la que acusaron a Pablo y acabó preso en Roma."}
    - {v: 19-22, tipo: carta, menciona: [persona:jesus], nota: "Ya no son extranjeros, sino conciudadanos de los santos y familia de Dios, edificados sobre apóstoles y profetas con Cristo como piedra angular: un templo santo para Jehová. Perspicacia lo contrasta con el templo de Ártemis."}
  3:
    estado: completo
    revisado: 2026-09-29
    nota: "Pablo, preso, explica su encargo con las naciones y el secreto sagrado que las hace coherederas con los judíos, y ora por los efesios. Sin sucesos nuevos fuera de la propia carta."
    tramos:
    - {v: 1-7, tipo: carta, entidades: [carta:efesios, persona:pablo, evento:pablo-escribe-efesios, relacion:pablo/vivio_en/roma], menciona: [persona:jesus, lugar:roma, evento:pablo-predica-dos-anos-en-roma, evento:arresto-en-el-templo, lugar:judea], nota: "Pablo, prisionero por servir a los gentiles, recibió por revelación el secreto sagrado: los de las naciones son coherederos del mismo cuerpo. La nota recuerda su arresto en Judea y lo pone en Roma, c. 59-61."}
    - {v: 8-13, tipo: carta, entidades: [persona:pablo, evento:pablo-escribe-efesios], menciona: [persona:jesus, lugar:efeso], nota: "Pablo, el menor de los santos, anuncia a las naciones las riquezas del Cristo; por la congregación los ángeles conocen la sabiduría de Dios. Que los de Éfeso no se desanimen por lo que él sufre."}
    - {v: 14-19, tipo: carta, menciona: [persona:jesus], nota: "Oración de rodillas al Padre, de quien toman nombre todas las familias del cielo y de la tierra: que el espíritu los fortalezca, que el Cristo viva en su corazón y que conozcan su amor."}
    - {v: 20-21, tipo: carta, menciona: [persona:jesus], nota: "Alabanza final de la oración: Dios puede hacer mucho más de lo que se le pide; gloria a él por la congregación y por Cristo Jesús para siempre."}
  4:
    estado: completo
    revisado: 2026-09-29
    nota: "Consejos para la unidad de la congregación, los hombres que Cristo dio como regalos al subir al cielo, y la nueva personalidad frente a la conducta de las naciones."
    tramos:
    - {v: 1-6, tipo: carta, entidades: [carta:efesios, persona:pablo, evento:pablo-escribe-efesios], menciona: [persona:jesus, lugar:efeso, evento:discipulos-de-juan-en-efeso], nota: "Pablo, preso por el Señor, pide humildad, paciencia y unidad: un cuerpo, un espíritu, una esperanza, un Señor, una fe, un bautismo, un Dios. La nota del v. 5 recuerda a los unos doce hombres que Pablo bautizó en Éfeso."}
    - {v: 7-10, tipo: carta, entidades: [evento:ascension-de-jesus], menciona: [persona:jesus, evento:david-rey-de-todo-israel], nota: "Cita Sl 68:18 sin nombrar a David. Según la nota, el salmo celebra la toma de Jerusalén y Pablo lo aplica a Jesús, que bajó a la tierra y subió por encima de los cielos dando hombres como regalos."}
    - {v: 11-16, tipo: carta, menciona: [persona:jesus, lugar:efeso, evento:ascension-de-jesus], nota: "Cristo dio apóstoles, profetas, evangelizadores, pastores y maestros para que el cuerpo madure y no lo arrastren tramposos. La nota ve en los evangelizadores a misioneros y liga las coyunturas a una escuela médica de Éfeso."}
    - {v: 17-24, tipo: carta, menciona: [persona:jesus, lugar:efeso], nota: "Que no vivan como las naciones, con la mente vacía y el corazón endurecido; que se quiten la vieja personalidad y se pongan la nueva. Perspicacia «Efesios» lo relaciona con la superstición y la inmoralidad de Éfeso."}
    - {v: 25-32, tipo: carta, menciona: [persona:satanas, persona:jesus, lugar:efeso, evento:despedida-en-mileto], nota: "Hablar verdad (Zac 8:16, sin nombrar al profeta), enojarse sin pecar (Sl 4:4), no dejar sitio al Diablo, no robar sino trabajar, edificar al hablar, perdonar. La nota recuerda el ejemplo de Pablo ante los ancianos de Éfeso."}
  5:
    estado: completo
    revisado: 2026-09-29
    nota: "Consejo de la carta, sin sucesos ni lugares en el texto: imitar a Dios, andar como hijos de la luz, aprovechar el tiempo, y la sujeción y el amor entre esposa y esposo, como Cristo con la congregación."
    tramos:
    - {v: 1-2, tipo: carta, entidades: [carta:efesios], menciona: [persona:jesus, evento:muerte-de-jesus], nota: "Imiten a Dios como hijos queridos y anden en amor, igual que el Cristo, que se dio por ellos como ofrenda de olor agradable a Dios. La nota une este «por lo tanto» a Ef 4:32."}
    - {v: 3-5, tipo: carta, menciona: [persona:jesus, lugar:efeso], nota: "Ni se nombren entre santos la inmoralidad sexual, la impureza ni la codicia, que es idolatría; nada de bromas obscenas. Según la nota, en Éfeso eran corrientes, incluso en fiestas de la diosa Deméter, sin ficha."}
    - {v: 6-14, tipo: carta, menciona: [persona:jesus], nota: "Que nadie los engañe con palabras vacías. Antes eran oscuridad y ahora son luz: que anden como hijos de la luz y destapen las obras oscuras. El texto no dice de dónde sale la cita del v. 14."}
    - {v: 15-20, tipo: carta, menciona: [persona:jesus, lugar:efeso], nota: "Que vivan como sabios y compren el tiempo oportuno, que según la nota era de relativa libertad en Éfeso. Nada de borracheras, comunes en las fiestas de Dioniso, dios sin ficha; que canten salmos a Jehová."}
    - {v: 21-24, tipo: carta, menciona: [persona:jesus], nota: "Sujeción mutua por respeto a Cristo. Las esposas, sujetas a sus esposos como la congregación a Cristo, que es su cabeza y su salvador."}
    - {v: 25-33, tipo: carta, menciona: [persona:jesus, evento:muerte-de-jesus, evento:creacion-de-eva], nota: "Los esposos amen a sus esposas como Cristo a la congregación, por la que se entregó y a la que limpia con la palabra. Cita Gé 2:24 sin nombrar a Adán ni a Eva. La esposa respete al esposo."}
  6:
    estado: completo
    revisado: 2026-09-29
    nota: "Consejos a hijos, padres, esclavos y amos; la armadura que Dios da contra el Diablo; Pablo, preso, pide oración y envía a Tíquico con la carta. Despedida."
    tramos:
    - {v: 1-4, tipo: carta, entidades: [evento:diez-mandamientos], nota: "Hijos, obedezcan a sus padres: honrarlos, quinto de los Diez Mandamientos (Éx 20:12; Dt 5:16), es según la nota el primer mandato con promesa. Los padres varones no irriten a sus hijos; que los críen con la disciplina de Jehová."}
    - {v: 5-9, tipo: carta, menciona: [persona:jesus], nota: "Los esclavos obedezcan a sus amos de corazón, como sirviendo a Cristo y a Jehová, que premia el bien. Los amos, sin amenazas: los dos tienen el mismo Amo en el cielo, que no hace favoritismos."}
    - {v: 10-13, tipo: carta, entidades: [persona:satanas], menciona: [lugar:efeso], nota: "Pónganse la armadura de Dios contra las trampas del Diablo: la lucha es contra fuerzas espirituales malvadas, no humanas. La nota de estudio dice que son Satanás y sus demonios, y Perspicacia «Efesios», que Éfeso estaba llena de magia."}
    - {v: 14-18, tipo: carta, entidades: [persona:satanas], nota: "Las piezas de la armadura, que la nota compara con la del soldado romano: cinturón, coraza, calzado, escudo que apaga las flechas del Maligno, casco y espada. Añade la oración constante por todos los santos."}
    - {v: 19-20, tipo: carta, entidades: [persona:pablo, relacion:pablo/vivio_en/roma, evento:pablo-escribe-efesios], menciona: [lugar:roma, evento:pablo-predica-dos-anos-en-roma], nota: "Pablo pide que oren para que hable con valor, como embajador encadenado. La nota dice que escribe preso en Roma y que Hch 28:30, 31 muestra que esa oración tuvo respuesta."}
    - {v: 21-22, tipo: carta, entidades: [carta:efesios, evento:pablo-envia-a-tiquico-a-efeso-y-colosas, persona:tiquico, relacion:tiquico/acompana/pablo, persona:pablo], menciona: [lugar:efeso, lugar:roma, lugar:colosas, persona:onesimo, carta:colosenses], nota: "Tíquico, hermano querido y ministro fiel, les llevará noticias de Pablo y los animará. Perspicacia «Tíquico» dice que salió de Roma con esta carta y la de Colosas, junto a Onésimo."}
    - {v: 23-24, tipo: carta, menciona: [persona:jesus], nota: "Despedida: que el Padre y el Señor Jesucristo den a los hermanos paz, amor y fe, y que la bondad inmerecida acompañe a quienes aman al Señor con un amor que no se corrompe."}
