# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: jueces
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: narracion, entidades: [evento:jehova-manda-subir-primero-a-juda], menciona: [persona:josue-hijo-de-nun, evento:muerte-de-josue, lugar:juda, lugar:simeon], nota: "Judá y Simeón son aquí tribus, y los cananeos un pueblo, sin ficha. El texto no dice cómo consultaron a Jehová; la referencia remite a Nú 27:21."}
    - {v: 4-7, tipo: narracion, entidades: [evento:juda-y-simeon-vencen-a-adoni-bezec, persona:adoni-bezec, lugar:bezec, lugar:jerusalen, relacion:adoni-bezec/vivio_en/bezec, relacion:adoni-bezec/murio_en/jerusalen], nota: "Cananeos y perizitas son pueblos, sin ficha. Los 70 reyes mutilados no llevan nombre."}
    - {v: "8", tipo: narracion, entidades: [evento:juda-toma-y-quema-jerusalen, lugar:jerusalen]}
    - {v: 9-10, tipo: narracion, entidades: [evento:caleb-echa-a-los-hijos-de-anac-de-hebron, lugar:hebron, persona:sesai, persona:ahiman-hijo-de-anac, persona:talmai-hijo-de-anac, relacion:sesai/vivio_en/hebron, relacion:ahiman-hijo-de-anac/vivio_en/hebron, relacion:talmai-hijo-de-anac/vivio_en/hebron], menciona: [lugar:negueb, lugar:sefela], nota: "Judá baja contra los cananeos de la región montañosa, sin ficha propia, del Négueb y de la Sefelá. Hebrón se llamaba Quiryat-Arbá. El suceso de Hebrón es el de Jos 15:13, 14."}
    - {v: 11-13, tipo: narracion, entidades: [evento:otniel-toma-debir-y-se-casa-con-acsa, lugar:debir, persona:caleb-hijo-de-jefune, persona:otniel, persona:acsa, persona:quenaz-padre-de-otniel, relacion:otniel/pariente/quenaz-padre-de-otniel, relacion:otniel/pariente/caleb-hijo-de-jefune, relacion:otniel/pariente/acsa, relacion:acsa/pariente/caleb-hijo-de-jefune, relacion:quenaz-padre-de-otniel/pariente/caleb-hijo-de-jefune], menciona: [evento:josue-toma-debir], nota: "Es la segunda toma de Debir, antes Quiryat-Séfer, tras la de Josué. Perspicacia «Debir», núm. 2, no decide si fue antes o después de su muerte: el suceso sigue con la fecha de Josué 15."}
    - {v: 14-15, tipo: narracion, entidades: [evento:acsa-pide-a-caleb-gulot-maim, persona:acsa, persona:otniel, persona:caleb-hijo-de-jefune, lugar:gulot-maim, lugar:negueb], nota: "El terreno en el sur es el Négueb, según la nota; Gulot-Maim significa «cuencas de agua»."}
    - {v: "16", tipo: narracion, entidades: [evento:los-quenitas-se-instalan-al-sur-de-arad, persona:hobab, persona:jetro, relacion:moises/pariente/jetro, lugar:jerico, lugar:desierto-de-juda, lugar:arad], menciona: [persona:moises], nota: "El texto no nombra al quenita: Perspicacia «Jetró» lo identifica con Jetró, y «Hobab» pone allí a la familia de Hobab. La ciudad de las palmeras es Jericó, según la nota."}
    - {v: "17", tipo: narracion, entidades: [evento:juda-y-simeon-destruyen-zefat, lugar:horma], nota: "Zefat es el nombre anterior de Hormá, que significa «una entrega a la destrucción», según la nota. Simeón es aquí la tribu."}
    - {v: 18-19, tipo: narracion, entidades: [evento:juda-toma-gaza-asquelon-y-ecron, lugar:gaza, lugar:asquelon, lugar:ecron, evento:las-tribus-no-expulsan-a-los-cananeos], nota: "La región montañosa y la llanura no llevan nombre propio. Según la nota, los carros de hierro llevaban cuchillas en las ruedas."}
    - {v: "20", tipo: narracion, entidades: [evento:caleb-echa-a-los-hijos-de-anac-de-hebron, persona:caleb-hijo-de-jefune, lugar:hebron, relacion:caleb-hijo-de-jefune/vivio_en/hebron, relacion:sesai/pariente/anac, relacion:ahiman-hijo-de-anac/pariente/anac, relacion:talmai-hijo-de-anac/pariente/anac], menciona: [persona:moises, persona:anac], nota: "Moisés había prometido Hebrón a Caleb (Nú 14:24; Jos 14:9). Los tres hijos de Anac son Sesái, Ahimán y Talmái."}
    - {v: "21", tipo: narracion, entidades: [evento:las-tribus-no-expulsan-a-los-cananeos, lugar:jerusalen], nota: "Los jebuseos, un pueblo, siguen en Jerusalén con los de Benjamín cuando se escribe el libro, antes de que David tomara la ciudad. Jos 15:63 dice lo mismo de Judá."}
    - {v: 22-25, tipo: narracion, entidades: [evento:la-casa-de-jose-toma-betel, lugar:betel], nota: "La casa de José son las tribus de Efraín y Manasés. Luz es el nombre antiguo de Betel. El hombre que les enseña la entrada no lleva nombre."}
    - {v: "26", tipo: narracion, entidades: [evento:el-hombre-de-betel-funda-luz, lugar:luz-de-los-hititas], nota: "Los hititas son un pueblo, sin ficha; su tierra no se sitúa aquí."}
    - {v: 27-28, tipo: lista, entidades: [evento:las-tribus-no-expulsan-a-los-cananeos, lugar:bet-sean, lugar:taanac, lugar:dor, lugar:ibleam, lugar:meguido], nota: "La tribu de Manasés deja a los cananeos en cinco ciudades con sus pueblos. Cuando Israel se hace más fuerte, los pone a trabajos forzados, pero no los echa del todo."}
    - {v: 29-30, tipo: lista, entidades: [evento:las-tribus-no-expulsan-a-los-cananeos, lugar:guezer, lugar:catat, lugar:nahalal], nota: "Efraín no echa a los de Guézer. Zabulón deja a los de Quitrón, que suele identificarse con Qatat, y Nahalol, otro nombre de Nahalal, y los pone a trabajos forzados."}
    - {v: 31-33, tipo: lista, entidades: [evento:las-tribus-no-expulsan-a-los-cananeos, lugar:tolemaida, lugar:sidon, lugar:ahlab, lugar:aczib-de-aser, lugar:helba, lugar:afec-de-aser, lugar:rehob-de-aser, lugar:bet-semes-de-neftali, lugar:bet-anat], nota: "Akkó es la posterior Tolemaida, y Afic, Afec de Aser. Aser vive entre los cananeos; Neftalí también, pero pone a trabajar a los de Bet-Semes y Bet-Anat."}
    - {v: 34-36, tipo: lista, entidades: [evento:las-tribus-no-expulsan-a-los-cananeos, lugar:monte-heres, lugar:ayalon, lugar:saalbim, lugar:subida-de-acrabim, lugar:sela-de-los-amorreos], nota: "Los amorreos, un pueblo, no dejan a Dan bajar a la llanura, y la casa de José los somete después. Su límite parte de la subida de Acrabim y de Sela hacia el norte."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: narracion, entidades: [evento:el-angel-de-jehova-reprende-a-israel-en-bokim, lugar:guilgal, lugar:bokim], menciona: [lugar:egipto, evento:exodo, evento:el-principe-del-ejercito-de-jehova-se-aparece-a-josue], nota: "El ángel no lleva nombre; Perspicacia «Guilgal», núm. 1, ve posible que sea el que se apareció a Josué. La tierra jurada a los antepasados no se nombra."}
    - {v: 6-7, tipo: narracion, entidades: [evento:josue-renueva-el-pacto-en-siquem, persona:josue-hijo-de-nun], nota: "Repite Jos 24:28 y 24:31: Josué despide al pueblo, cada uno va a su herencia, y todos sirven a Jehová mientras viven él y los ancianos que le sobreviven."}
    - {v: 8-9, tipo: narracion, entidades: [evento:muerte-de-josue, persona:josue-hijo-de-nun, lugar:timnat-serah, lugar:region-montanosa-de-efrain, lugar:monte-gaas, relacion:josue-hijo-de-nun/pariente/nun, relacion:josue-hijo-de-nun/vivio_en/timnat-serah], menciona: [persona:nun], nota: "Repite Jos 24:29, 30: muere a los 110 años. Timnat-Heres es otro nombre de Timnat-Sérah."}
    - {v: 10-13, tipo: narracion, entidades: [evento:israel-abandona-a-jehova-y-sirve-a-los-baales], menciona: [lugar:egipto, evento:exodo], nota: "Baal, los Baales y Astoret son dioses, sin ficha. Ser reunido con los antepasados es, según la nota, una forma poética de decir morir."}
    - {v: 14-19, tipo: narracion, entidades: [evento:israel-abandona-a-jehova-y-sirve-a-los-baales], nota: "Ciclo de todo el libro: Jehová entrega a Israel a sus enemigos, se compadece de sus gemidos y le da jueces, que aquí no se nombran; al morir el juez, vuelve la idolatría."}
    - {v: 20-23, tipo: narracion, entidades: [evento:jehova-deja-a-las-naciones-para-probar-a-israel], menciona: [persona:josue-hijo-de-nun, evento:muerte-de-josue], nota: "Las naciones que quedan no se nombran aquí; las enumera Jue 3:1-6."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: narracion, entidades: [lugar:baal-hermon, evento:jehova-deja-a-las-naciones-para-probar-a-israel], menciona: [lugar:canaan, lugar:filistea, lugar:sidon, lugar:libano, lugar:lebo-hamat, persona:moises], nota: "Jehová deja naciones para probar a la generación que no conoció la guerra. Filisteos, sidonios, cananeos, heveos, hititas, amorreos, perizitas y jebuseos son pueblos sin ficha. Israel se casa con ellos y sirve a sus dioses."}
    - {v: 7-11, tipo: narracion, entidades: [evento:otniel-libra-a-israel-de-cusan-risataim, persona:otniel, persona:cusan-risataim, persona:quenaz-padre-de-otniel, lugar:mesopotamia, relacion:cusan-risataim/vivio_en/mesopotamia, relacion:otniel/pariente/quenaz-padre-de-otniel, relacion:otniel/pariente/caleb-hijo-de-jefune, relacion:quenaz-padre-de-otniel/pariente/caleb-hijo-de-jefune], menciona: [persona:caleb-hijo-de-jefune], nota: "Los Baales y los postes sagrados son cultos sin ficha. La muerte de Otniel, tras cuarenta años de paz, no tiene escena ni lugar."}
    - {v: 12-14, tipo: narracion, entidades: [evento:eglon-toma-la-ciudad-de-las-palmeras, persona:eglon, lugar:jerico, relacion:eglon/vivio_en/moab], menciona: [lugar:moab, lugar:ammon, lugar:amalec], nota: "La ciudad de las palmeras es Jericó, según la referencia del v. 13. Ammonitas y amalequitas son pueblos; van sus tierras."}
    - {v: 15-25, tipo: narracion, entidades: [evento:ehud-mata-a-eglon, persona:ehud-hijo-de-guera, persona:guera-padre-de-ehud, persona:eglon, lugar:jerico, lugar:guilgal, relacion:ehud-hijo-de-guera/pariente/guera-padre-de-ehud, relacion:ehud-hijo-de-guera/pariente/benjamin-hijo-de-jacob, relacion:eglon/vivio_en/jerico, relacion:eglon/murio_en/jerico], menciona: [lugar:moab], nota: "Las imágenes talladas de Guilgal quizá eran canteras (nota del v. 19). El texto no nombra la ciudad del palacio; La Atalaya de 1997 la da como Jericó."}
    - {v: 26-30, tipo: narracion, entidades: [evento:ehud-vence-a-moab-en-los-vados-del-jordan, persona:ehud-hijo-de-guera, lugar:seira, lugar:region-montanosa-de-efrain, lugar:rio-jordan], menciona: [lugar:guilgal, lugar:moab]}
    - {v: "31", tipo: narracion, entidades: [evento:samgar-mata-a-600-filisteos, persona:samgar, persona:anat, relacion:samgar/pariente/anat, relacion:samgar/sucede_a/ehud-hijo-de-guera], menciona: [persona:ehud-hijo-de-guera, lugar:filistea], nota: "Los filisteos son un pueblo; su tierra va en menciona."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: narracion, entidades: [evento:jabin-oprime-a-israel, persona:jabin-rey-de-canaan, persona:sisara-de-haroset, lugar:hazor, lugar:haroset, relacion:jabin-rey-de-canaan/vivio_en/hazor, relacion:sisara-de-haroset/vivio_en/haroset, relacion:sisara-de-haroset/acompana/jabin-rey-de-canaan], menciona: [persona:ehud-hijo-de-guera, lugar:canaan], nota: "Muerto Ehúd, Jehová entrega Israel a Jabín veinte años. Es un suceso, como las opresiones de Moab (3:12-14), Madián (6:1-6) y Ammón (10:6-9)."}
    - {v: 4-10, tipo: narracion, entidades: [evento:debora-manda-llamar-a-barac, evento:barac-reune-diez-mil-hombres-en-quedes, persona:debora-profetisa, persona:lapidot, persona:barac, persona:abinoam, lugar:region-montanosa-de-efrain, lugar:quedes-de-neftali, relacion:lapidot/pariente/debora-profetisa, relacion:debora-profetisa/vivio_en/region-montanosa-de-efrain, relacion:barac/pariente/abinoam, relacion:barac/vivio_en/quedes-de-neftali, relacion:barac/acompana/debora-profetisa, relacion:abinoam/pariente/neftali-hijo-de-jacob, relacion:abinoam/vivio_en/quedes-de-neftali], menciona: [lugar:rama-de-benjamin, lugar:betel, lugar:monte-tabor, lugar:cison, persona:sisara-de-haroset, persona:jabin-rey-de-canaan], nota: "La palmera de Débora no tiene punto propio: queda aquí. Zabulón y Neftalí son tribus, sin ficha como pueblo."}
    - {v: "11", tipo: narracion, entidades: [persona:heber-el-quenita, persona:hobab, lugar:zaananim, relacion:heber-el-quenita/pariente/hobab, relacion:heber-el-quenita/vivio_en/zaananim], menciona: [persona:moises, lugar:quedes-de-neftali, lugar:quision], nota: "Los quenitas son un pueblo. Perspicacia «Quedes», núm. 3, y «Zaananim» ven posible que esta Quedes sea la de Isacar, cerca de Meguidó, y no la de Neftalí."}
    - {v: 12-16, tipo: narracion, entidades: [evento:barac-derrota-a-sisara-junto-al-cison, persona:barac, persona:sisara-de-haroset, persona:debora-profetisa, lugar:monte-tabor, lugar:cison, lugar:haroset], menciona: [lugar:en-dor], nota: "Jueces no nombra En-Dor: va en el suceso porque Sl 83:9, 10 liga allí la derrota de Sísara, y Perspicacia «En-dor» cree que la lucha llegó hasta ella, al sur del Tabor."}
    - {v: 17-22, tipo: narracion, entidades: [evento:jael-mata-a-sisara, persona:jael, persona:sisara-de-haroset, persona:heber-el-quenita, persona:barac, lugar:zaananim, relacion:heber-el-quenita/pariente/jael, relacion:jael/vivio_en/zaananim, relacion:sisara-de-haroset/murio_en/zaananim], menciona: [persona:jabin-rey-de-canaan, lugar:hazor]}
    - {v: 23-24, tipo: narracion, entidades: [evento:israel-acaba-con-jabin, persona:jabin-rey-de-canaan], menciona: [lugar:canaan]}
  5:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, entidades: [evento:debora-y-barac-cantan-su-victoria, persona:debora-profetisa, persona:barac, persona:abinoam, relacion:barac/pariente/abinoam, relacion:barac/acompana/debora-profetisa], nota: "Aquel día, el de la victoria sobre Sísara (Jue 4), Débora canta con Barac. Perspicacia «Débora»: la primera persona del v. 7 muestra que ella compuso el canto, al menos en parte."}
    - {v: 2-5, tipo: poesia, entidades: [evento:debora-y-barac-cantan-su-victoria], menciona: [lugar:seir, lugar:edom, lugar:monte-sinai, evento:jehova-desciende-sobre-el-monte-sinai], nota: "Alabanza a Jehová por los voluntarios. Jehová sale de Seír, en Edom, y la tierra tiembla; los montes y el Sinaí se estremecen ante él (referencias a Dt 33:2 y Éx 19:18)."}
    - {v: 6-8, tipo: poesia, entidades: [evento:debora-y-barac-cantan-su-victoria, persona:samgar, persona:anat, relacion:samgar/pariente/anat, persona:jael, persona:debora-profetisa], nota: "En días de Samgar y de Jael nadie iba por los caminos y los campesinos desaparecieron hasta que Débora se alzó como madre de Israel. Eligieron dioses nuevos; ni escudo ni lanza entre 40.000. La opresión es de Jue 4:1-3."}
    - {v: 9-11, tipo: poesia, entidades: [evento:debora-y-barac-cantan-su-victoria], nota: "Débora está con los comandantes que se ofrecieron. Invita a los que montan burros pardos y a los que caminan a pensar en los actos justos de Jehová, que se cuentan junto a los abrevaderos."}
    - {v: 12-18, tipo: poesia, entidades: [evento:debora-y-barac-cantan-su-victoria, persona:debora-profetisa, persona:barac, persona:abinoam, relacion:barac/pariente/abinoam, relacion:barac/acompana/debora-profetisa], menciona: [lugar:galaad, lugar:rio-jordan, lugar:territorio-de-dan, lugar:aser, evento:barac-reune-diez-mil-hombres-en-quedes], nota: "Tribus como pueblos, sin ficha: Efraín, Benjamín, Makir (toda Manasés, según Perspicacia «Makir»), Zabulón, Isacar y Neftalí luchan; Rubén duda. Galaad, Dan y Aser van como lugar: el texto los sitúa en su tierra."}
    - {v: 19-22, tipo: poesia, entidades: [evento:debora-y-barac-cantan-su-victoria, lugar:taanac, lugar:meguido, lugar:cison, persona:sisara-de-haroset, evento:barac-derrota-a-sisara-junto-al-cison], menciona: [lugar:canaan, persona:jabin-rey-de-canaan], nota: "Los reyes de Canaán combaten en Taanac, cerca de las aguas de Meguidó, y no sacan botín. Las estrellas pelean contra Sísara y el Cisón arrastra al enemigo. La batalla es un suceso de Jue 4:12-16."}
    - {v: "23", tipo: poesia, entidades: [evento:debora-y-barac-cantan-su-victoria, evento:el-angel-de-jehova-maldice-a-meroz, lugar:meroz], nota: "El ángel de Jehová no tiene nombre ni ficha."}
    - {v: 24-27, tipo: poesia, entidades: [evento:debora-y-barac-cantan-su-victoria, persona:jael, persona:heber-el-quenita, persona:sisara-de-haroset, relacion:heber-el-quenita/pariente/jael, evento:jael-mata-a-sisara], nota: "Elogio de Jael: le da leche cuajada a Sísara y lo mata con la estaca y el martillo. Ese suceso es de Jue 4:17-22."}
    - {v: 28-30, tipo: poesia, entidades: [evento:debora-y-barac-cantan-su-victoria, persona:sisara-de-haroset], nota: "La madre de Sísara, sin nombre y sin ficha, espera en la ventana su carro, y sus damas le dicen que se reparten el botín."}
    - {v: "31", tipo: poesia, entidades: [evento:debora-y-barac-cantan-su-victoria], nota: "Que perezcan los enemigos de Jehová y brillen como el sol los que lo aman. Después la tierra tiene paz 40 años."}
  6:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: narracion, entidades: [evento:madian-oprime-a-israel, lugar:israel, lugar:gaza], menciona: [lugar:madian, lugar:amalec, persona:zebah, persona:zalmuna], nota: "Con Madián vienen amalequitas y orientales, pueblos sin ficha. Perspicacia «Zébah» cree que él y Zalmuná reinaban en Madián esos siete años. La nota del 6:2 da «graneros subterráneos» por escondites."}
    - {v: 7-10, tipo: narracion, entidades: [evento:jehova-envia-un-profeta-a-israel-oprimido-por-madian, lugar:israel], menciona: [lugar:egipto], nota: "El profeta no tiene nombre. Recuerda la salida de Egipto y el reparto de la tierra; los amorreos, cuyos dioses temió Israel, son un pueblo sin ficha."}
    - {v: 11-24, tipo: narracion, entidades: [evento:el-angel-de-jehova-comisiona-a-gedeon, persona:gedeon, persona:joas-padre-de-gedeon, lugar:ofra-de-gedeon, relacion:gedeon/pariente/joas-padre-de-gedeon, relacion:gedeon/pariente/abi-ezer-hijo-de-galaad, relacion:gedeon/vivio_en/ofra-de-gedeon, relacion:joas-padre-de-gedeon/pariente/abi-ezer-hijo-de-galaad, relacion:joas-padre-de-gedeon/vivio_en/ofra-de-gedeon], menciona: [persona:abi-ezer-hijo-de-galaad, lugar:manases, lugar:egipto, lugar:madian], nota: "El ángel de Jehová no tiene nombre. Gedeón dice que su clan es el menor de Manasés. Ofrece un cabrito y panes de un efá de harina, unos 22 litros. El altar Jehová-Salom va en los nombres de Ofrá."}
    - {v: 25-32, tipo: narracion, entidades: [evento:gedeon-derriba-el-altar-de-baal, persona:gedeon, persona:joas-padre-de-gedeon, lugar:ofra-de-gedeon], nota: "Baal es un dios y no lleva ficha. Gedeón quema el segundo toro de su padre con la madera del poste sagrado. Jerubaal, su nuevo nombre, pide que Baal defienda su propia causa."}
    - {v: 33-35, tipo: narracion, entidades: [evento:gedeon-convoca-a-las-tribus-contra-madian, persona:gedeon, lugar:valle-de-jezreel, lugar:manases, lugar:aser, lugar:zabulon, lugar:neftali], menciona: [lugar:madian, lugar:amalec, persona:abi-ezer-hijo-de-galaad], nota: "Los invasores cruzan «el río», sin nombre. Los abí-ezritas, familia de Gedeón, lo siguen primero. Manasés, Aser, Zabulón y Neftalí van como lugar porque los mensajeros recorren esos territorios."}
    - {v: 36-40, tipo: narracion, entidades: [evento:gedeon-pide-la-senal-del-vellon, persona:gedeon], menciona: [lugar:israel], nota: "No se dice dónde estaba la era. Perspicacia «Gedeón» ve en las dos pruebas cautela y no falta de fe, porque Dios no se la reprocha."}
  7:
    estado: completo
    revisado: 2026-09-29
    tramos:
