# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: deuteronomio
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: narracion, entidades: [evento:primer-discurso-de-moises, persona:moises, persona:sehon, persona:og, lugar:llanuras-deserticas-de-moab, lugar:moab, lugar:suf, lugar:desierto-de-paran, lugar:tofel, lugar:laban, lugar:hazerot, lugar:dizahab, lugar:monte-sinai, lugar:cades, lugar:hesbon, lugar:basan, lugar:astarot, lugar:edrei, relacion:moises/vivio_en/llanuras-deserticas-de-moab, relacion:sehon/vivio_en/hesbon, relacion:og/vivio_en/basan, relacion:og/vivio_en/astarot, relacion:og/vivio_en/edrei], menciona: [lugar:rio-jordan, lugar:seir, evento:israel-vence-a-sehon, evento:israel-vence-a-og], nota: "Día 1 del mes undécimo del año cuarenta. Parán, Hazerot y los demás sitios sirven de referencia. De Horeb a Cadés-Barnea hay once días por el camino de Seír. Los amorreos son un pueblo."}
    - {v: 6-8, tipo: discurso, entidades: [evento:israel-sale-del-desierto-de-sinai, lugar:monte-sinai, lugar:araba, lugar:sefela, lugar:negueb, lugar:canaan, lugar:libano, lugar:rio-eufrates], menciona: [persona:abrahan, persona:isaac, persona:jacob], nota: "En Horeb, Jehová manda ir a la región montañosa de los amorreos, sin ficha propia, y a sus vecinos hasta el Éufrates. «La costa» no es nombre propio; la nota hace del Líbano la cordillera."}
    - {v: 9-18, tipo: discurso, entidades: [evento:moises-nombra-jefes-para-juzgar, persona:moises], nota: "Moisés no podía llevar solo a un pueblo tan numeroso como las estrellas. Nombró jefes de mil, cien, cincuenta y diez, y mandó a los jueces no hacer distinciones; los casos difíciles llegaban a él."}
    - {v: 19-21, tipo: discurso, entidades: [evento:israel-sale-del-desierto-de-sinai, lugar:monte-sinai, lugar:desierto-de-paran, lugar:cades], nota: "De Horeb a Cadés-Barnea por el desierto grande y temible, que Perspicacia «Parán» identifica. Allí Moisés anima a subir sin miedo a la región montañosa de los amorreos."}
    - {v: 22-25, tipo: discurso, entidades: [evento:moises-envia-a-los-doce-espias, evento:los-espias-recorren-canaan, evento:los-espias-informan-en-cades, lugar:valle-de-escol], nota: "La idea de mandar espías sale del pueblo y Moisés la acepta: doce, uno por tribu. Llegan al valle de Escol y vuelven con fruta y con un informe favorable."}
    - {v: 26-33, tipo: discurso, entidades: [evento:israel-se-niega-a-entrar-en-canaan], menciona: [lugar:egipto], nota: "El pueblo murmura en sus tiendas y cree que Jehová lo odia. Los espías hablaron de gente alta y de los anaquim, un pueblo. Jehová los guiaba con fuego de noche y nube de día."}
    - {v: 34-40, tipo: discurso, entidades: [evento:jehova-condena-a-israel-a-40-anos-en-el-desierto, persona:caleb-hijo-de-jefune, persona:josue-hijo-de-nun, persona:moises, relacion:caleb-hijo-de-jefune/pariente/jefune-padre-de-caleb, relacion:josue-hijo-de-nun/pariente/nun, relacion:josue-hijo-de-nun/acompana/moises, relacion:josue-hijo-de-nun/sucede_a/moises], menciona: [persona:jefune-padre-de-caleb, persona:nun, lugar:mar-rojo, evento:agua-del-penasco-en-meriba, evento:moises-nombra-a-josue-su-sucesor], nota: "Solo Caleb y los niños de entonces verán la tierra. Moisés tampoco entrará, por lo de Meribá; entrará Josué, que lo sirve. Los demás vuelven al desierto hacia el mar Rojo."}
    - {v: 41-46, tipo: discurso, entidades: [evento:israel-es-derrotado-hasta-horma, lugar:seir, lugar:horma, lugar:cades], nota: "Suben armados contra la orden. Los amorreos, nombre que aquí abarca a amalequitas y cananeos según Perspicacia, los persiguen como abejas por Seír hasta Hormá. Luego se quedan mucho tiempo en Cadés."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: discurso, entidades: [evento:primer-discurso-de-moises, evento:israel-vaga-por-el-desierto, lugar:seir], menciona: [lugar:mar-rojo], nota: "Dan media vuelta hacia el mar Rojo, como Jehová mandó, y pasan muchos días rodeando el monte Seír: son los años errantes."}
    - {v: 2-7, tipo: discurso, entidades: [evento:israel-pasa-junto-a-seir, persona:esau, persona:moises, lugar:seir, relacion:esau/vivio_en/seir], nota: "Jehová manda ir al norte. Los hijos de Esaú son hermanos: no se los ataca, porque Seír es suyo, y la comida y el agua se pagan. En cuarenta años no les faltó nada."}
    - {v: 8-12, tipo: discurso, entidades: [evento:israel-pasa-junto-a-seir, evento:israel-acampa-de-obot-al-arnon, lugar:seir, lugar:araba, lugar:elat, lugar:ezion-gueber, lugar:moab, lugar:ar], menciona: [persona:lot, persona:esau], nota: "Bordean Seír lejos del Arabá, Elat y Ezión-Guéber, y siguen por el camino del desierto de Moab, que va en la ficha del país. Ar es de los hijos de Lot. Emim, anaquim, refaím y horeos son pueblos sin ficha."}
    - {v: 13-15, tipo: discurso, entidades: [evento:israel-acampa-de-obot-al-arnon, evento:israel-vaga-por-el-desierto, lugar:valle-de-zered, lugar:cades], nota: "Cruzan el valle de Zered 38 años después de salir de Cadés-Barnea, cuando ya han muerto todos los guerreros de aquella generación."}
    - {v: 16-23, tipo: discurso, entidades: [evento:israel-acampa-de-obot-al-arnon, lugar:moab, lugar:ar, lugar:ammon, lugar:creta], menciona: [persona:lot, persona:esau, lugar:seir, lugar:gaza], nota: "No se ataca a Ammón, dado a los hijos de Lot; los ammonitas llamaban zamzumim a los refaím. Los caftorim, de Caftor, que la nota da como Creta, acabaron con los avim, que llegaban hasta Gaza."}
    - {v: 24-25, tipo: discurso, entidades: [evento:israel-vence-a-sehon, persona:sehon, lugar:arnon, lugar:hesbon, relacion:sehon/vivio_en/hesbon], nota: "Jehová manda cruzar el valle de Arnón y pelear contra Sehón, el rey amorreo de Hesbón. Los pueblos temblarán al oír hablar de Israel."}
    - {v: 26-30, tipo: discurso, entidades: [evento:israel-vence-a-sehon, evento:israel-pasa-junto-a-seir, persona:sehon, lugar:quedemot, lugar:hesbon], menciona: [persona:esau, lugar:ar, lugar:seir, lugar:rio-jordan], nota: "Desde el desierto de Quedemot, Moisés pide paso en paz y ofrece pagar comida y agua, como con los hijos de Esaú y los moabitas de Ar. Jehová deja que Sehón se obstine."}
    - {v: 31-37, tipo: discurso, entidades: [evento:israel-vence-a-sehon, persona:sehon, lugar:jahaz, lugar:aroer, lugar:arnon, lugar:galaad, lugar:ammon, lugar:rio-jaboc, relacion:sehon/murio_en/jahaz], nota: "En Jáhaz caen Sehón, sus hijos y su pueblo; sus ciudades se destruyen y queda el ganado como botín. Israel toma de Aroer a Galaad sin tocar Ammón ni el Jaboc. La ciudad del valle no se nombra."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: discurso, entidades: [evento:israel-vence-a-og, persona:og, persona:moises, persona:sehon, lugar:camino-del-rey, lugar:edrei, lugar:basan, lugar:argob, lugar:hesbon, relacion:og/vivio_en/basan, relacion:og/murio_en/edrei, relacion:sehon/vivio_en/hesbon, evento:primer-discurso-de-moises], menciona: [evento:israel-vence-a-sehon], nota: "Moisés recuerda la victoria sobre Og: Israel destruye las sesenta ciudades amuralladas de Argob, como hizo con Sehón, y se queda con el ganado y el botín."}
    - {v: 8-9, tipo: discurso, entidades: [lugar:arnon, lugar:monte-hermon], menciona: [lugar:sidon, lugar:rio-jordan, evento:israel-vence-a-sehon, evento:israel-vence-a-og], nota: "La tierra quitada a los dos reyes amorreos iba del Arnón al Hermón. Los sidonios llamaban Sirión a ese monte y los amorreos, Senir; los dos nombres ya están en su ficha."}
    - {v: 10-11, tipo: discurso, entidades: [evento:israel-vence-a-og, persona:og, lugar:galaad, lugar:basan, lugar:saleca, lugar:edrei, lugar:raba, relacion:og/vivio_en/basan], menciona: [lugar:ammon], nota: "La meseta es el llano entre Hesbón y el Arnón (Perspicacia «Meseta»); no lleva ficha. Og, el último de los refaím, tenía un ataúd de hierro de unos cuatro metros."}
    - {v: 12-13, tipo: discurso, entidades: [evento:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, persona:moises, lugar:aroer, lugar:arnon, lugar:galaad, lugar:basan, lugar:argob, lugar:manases], menciona: [persona:og], nota: "Rubén y Gad reciben la tierra del Arnón a media Galaad; la media tribu de Manasés, el resto de Galaad y Basán. Las tribus son pueblos y no llevan ficha."}
    - {v: "14", tipo: discurso, entidades: [evento:jair-toma-havot-jair, persona:jair-hijo-de-segub, lugar:argob, lugar:havot-jair, lugar:basan, lugar:guesur, lugar:maaca, relacion:jair-hijo-de-segub/pariente/manases-hijo-de-jose], menciona: [persona:manases-hijo-de-jose], nota: "Los guesuritas y los maacatitas son los pueblos de Guesur y Maacá, cuya frontera marcó el límite de lo que tomó Jaír."}
    - {v: "15", tipo: discurso, entidades: [evento:los-hijos-de-makir-toman-galaad, persona:makir-hijo-de-manases, persona:moises, lugar:galaad]}
    - {v: 16-17, tipo: lista, entidades: [evento:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, lugar:galaad, lugar:arnon, lugar:rio-jaboc, lugar:ammon, lugar:araba, lugar:rio-jordan, lugar:mar-de-galilea, lugar:mar-salado, lugar:pisga], nota: "Límites de Rubén y Gad: el centro del Arnón al sur, el Jaboc frente a Ammón al este y, al oeste, el Jordán desde Kinéret, el mar de Galilea, hasta el mar Salado."}
    - {v: 18-20, tipo: discurso, entidades: [evento:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, persona:moises], menciona: [lugar:rio-jordan], nota: "Los guerreros de Rubén, Gad y media Manasés cruzarán armados delante de sus hermanos; las familias y el ganado se quedan en las ciudades hasta que todos tengan su tierra."}
    - {v: 21-22, tipo: discurso, entidades: [evento:moises-nombra-a-josue-su-sucesor, persona:moises, persona:josue-hijo-de-nun], nota: "Moisés anima a Josué con lo que Jehová hizo a los dos reyes. Perspicacia «Josué», núm. 1, lo cuenta entre las instrucciones que le dio como sucesor."}
    - {v: 23-28, tipo: discurso, entidades: [evento:moises-nombra-a-josue-su-sucesor, persona:moises, persona:josue-hijo-de-nun, lugar:pisga, lugar:monte-nebo, relacion:josue-hijo-de-nun/sucede_a/moises], menciona: [lugar:libano, lugar:rio-jordan, evento:agua-del-penasco-en-meriba], nota: "Jehová no deja cruzar a Moisés por lo de Meribá (Nú 20:12). La cima de Pisgá es el monte Nebo de Dt 34:1, y por eso se citan las dos fichas."}
    - {v: "29", tipo: discurso, entidades: [evento:moises-nombra-a-josue-su-sucesor, lugar:bet-peor], nota: "Todo lo anterior ocurre mientras Israel acampa en el valle frente a Bet-Peor, en las llanuras de Moab."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: discurso, entidades: [evento:primer-discurso-de-moises], nota: "Moisés pide a Israel que obedezca las normas que enseña, sin añadir ni quitar nada, para vivir y tomar la tierra."}
    - {v: 3-4, tipo: discurso, entidades: [evento:israel-adora-al-baal-de-peor], menciona: [lugar:peor], nota: "El Baal de Peor es un dios y no lleva ficha; su nombre viene del monte Peor. Jehová eliminó a los que lo siguieron, y los fieles siguen vivos."}
    - {v: 5-8, tipo: discurso, entidades: [evento:primer-discurso-de-moises], nota: "Obedecer esas leyes justas mostrará a los pueblos la sabiduría de Israel, una nación con un Dios que está cerca cuando se le llama."}
    - {v: 9-14, tipo: discurso, entidades: [evento:israel-se-santifica-ante-el-sinai, evento:jehova-desciende-sobre-el-monte-sinai, evento:diez-mandamientos, evento:dios-da-a-moises-las-tablas-del-testimonio, evento:moises-recibe-las-decisiones-judiciales, lugar:monte-sinai, persona:moises], nota: "Horeb es el monte Sinaí. Moisés recuerda el fuego, la voz sin figura, las Diez Palabras escritas en dos tablas de piedra y la orden de enseñar las demás leyes."}
    - {v: 15-24, tipo: discurso, entidades: [persona:moises, evento:primer-discurso-de-moises], menciona: [lugar:monte-sinai, lugar:egipto, lugar:rio-jordan, evento:diez-mandamientos, evento:agua-del-penasco-en-meriba, evento:pacto-de-la-ley, evento:exodo, evento:muerte-de-moises], nota: "Nada de imágenes de hombres, animales o astros. Moisés repite que morirá sin cruzar el Jordán."}
    - {v: 25-31, tipo: profecia, entidades: [evento:primer-discurso-de-moises], nota: "Aviso: si Israel adora imágenes, Jehová lo dispersará entre las naciones; si desde allí lo busca de corazón, lo encontrará, porque no olvida su pacto con los antepasados."}
    - {v: 32-40, tipo: discurso, entidades: [evento:primer-discurso-de-moises], menciona: [lugar:egipto, evento:exodo, evento:diez-mandamientos], nota: "Ningún pueblo oyó a Dios hablar desde el fuego ni fue sacado de otra nación con tales señales. Jehová es el único Dios; obedecerle trae larga vida en la tierra."}
    - {v: 41-43, tipo: narracion, entidades: [evento:moises-aparta-tres-ciudades-de-refugio, persona:moises, lugar:bezer, lugar:ramot-galaad, lugar:golan, lugar:galaad, lugar:basan, lugar:manases], menciona: [evento:jehova-da-la-ley-de-las-ciudades-de-refugio, lugar:rio-jordan], nota: "El desierto de la meseta es el llano al este del mar Muerto (Perspicacia «Meseta»); no lleva ficha. Rubenitas, gaditas y manasitas son tribus."}
    - {v: 44-49, tipo: narracion, entidades: [persona:moises, persona:sehon, persona:og, lugar:bet-peor, lugar:hesbon, lugar:basan, lugar:aroer, lugar:arnon, lugar:monte-hermon, lugar:araba, lugar:mar-salado, lugar:pisga, relacion:sehon/vivio_en/hesbon, relacion:og/vivio_en/basan, evento:primer-discurso-de-moises], menciona: [lugar:egipto, lugar:rio-jordan, evento:israel-vence-a-sehon, evento:israel-vence-a-og, evento:exodo, evento:segundo-discurso-de-moises], nota: "Presenta la Ley que Moisés expone en el valle frente a Bet-Peor, en la antigua tierra de Sehón. Siyón es otro nombre del Hermón y el mar del Arabá es el mar Salado."}
  5:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, entidades: [evento:segundo-discurso-de-moises, persona:moises], nota: "Moisés convoca a todo Israel. Empieza su segundo discurso, que según Perspicacia llega hasta el final del capítulo 26."}
    - {v: 2-5, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:pacto-de-la-ley, evento:diez-mandamientos, lugar:monte-sinai], nota: "Horeb es aquí el Sinaí. El pacto se cerró con la nación que salió de Egipto, no con los patriarcas. Moisés hizo de intermediario porque el pueblo temía el fuego."}
    - {v: 6-21, tipo: ley, entidades: [evento:diez-mandamientos], menciona: [lugar:egipto, evento:exodo], nota: "Moisés repite las Diez Palabras de Éx 20. Aquí el descanso del sábado se liga al recuerdo de la esclavitud en Egipto; Éx 20:11 lo liga a los seis días de la creación."}
    - {v: 22-27, tipo: discurso, entidades: [evento:diez-mandamientos, evento:dios-da-a-moises-las-tablas-del-testimonio, lugar:monte-sinai], nota: "Dios escribió esas leyes en dos tablas de piedra. Los jefes de las tribus y los ancianos, asustados por la voz que salía del fuego, pidieron a Moisés que escuchara él por todos."}
    - {v: 28-31, tipo: discurso, entidades: [evento:moises-recibe-las-decisiones-judiciales, persona:moises], nota: "Jehová aprueba la petición: el pueblo vuelve a sus tiendas y Moisés se queda en el monte para recibir las demás leyes (Éx 20:21)."}
    - {v: 32-33, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], nota: "Moisés insiste en cumplirlo todo sin desviarse, para que les vaya bien y duren en la tierra que van a ocupar."}
  6:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, persona:moises], nota: "Moisés dice para qué enseña estas leyes: que tres generaciones respeten a Jehová, tengan larga vida y lleguen a ser muchos en la tierra que mana leche y miel."}
    - {v: 4-9, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], nota: "Jehová es uno solo. Hay que amarlo con todo el ser, inculcar sus palabras a los hijos y tenerlas a la vista en la mano, la frente y los postes de casa. Jesús citó el versículo 5 (Mr 12:29, 30)."}
    - {v: 10-15, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:abrahan, persona:isaac, persona:jacob, lugar:egipto, evento:exodo], nota: "Al recibir la tierra jurada a Abrahán, Isaac y Jacob, con ciudades, casas, cisternas y viñas que no hicieron ellos, no deben olvidar a Jehová ni seguir a los dioses de los pueblos vecinos."}
    - {v: 16-19, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, lugar:masa, evento:agua-de-la-roca-en-horeb], nota: "No hay que poner a prueba a Jehová como en Masá, junto a Refidim (Éx 17:7). Jesús citó este versículo ante el Diablo (Mt 4:7)."}
    - {v: 20-25, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], menciona: [lugar:egipto, evento:exodo], nota: "Qué contestar al hijo que pregunte por las leyes: Jehová sacó a Israel de Egipto con señales contra el faraón y su casa. Faraón es un título y el texto no dice quién era."}
  7:
    estado: completo
    revisado: 2026-09-29
    nota: "Parte del segundo discurso de Moisés en las llanuras de Moab (Dt 5-26). Moisés habla en primera persona y el capítulo no lo nombra."
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, persona:moises], menciona: [lugar:canaan], nota: "Al entrar en la tierra, Israel acabará con siete naciones: hititas, guirgaseos, amorreos, cananeos, perizitas, heveos y jebuseos, pueblos sin ficha que vivían en Canaán. Nada de pactos ni bodas con ellas; sus altares se derriban."}
    - {v: 7-16, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], menciona: [lugar:egipto, evento:exodo], nota: "Jehová eligió a Israel por amor y por lo jurado a sus antepasados, no por ser muchos, y lo libró del faraón, un título sin nombre. Obedecer traerá hijos, cosechas, crías y salud."}
    - {v: 17-26, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], menciona: [lugar:egipto], nota: "Que no teman a naciones más fuertes: Jehová, que castigó a Egipto, las irá echando poco a poco para que no se multipliquen las fieras. Los ídolos se queman, sin quedarse la plata ni el oro que los cubre."}
  8:
    estado: completo
    revisado: 2026-09-29
    nota: "Parte del segundo discurso de Moisés en las llanuras de Moab (Dt 5-26). Perspicacia «Maná» cita Dt 8:3, 16 para el fin del maná: enseñar y probar a Israel."
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, persona:moises, evento:codornices-y-mana-en-el-desierto-de-sin], menciona: [evento:jehova-condena-a-israel-a-40-anos-en-el-desierto], nota: "En 40 años de desierto Jehová probó y educó a Israel: le dio maná para enseñarle que la vida depende de lo que dice Jehová, y su ropa no se gastó. Jesús citó el versículo 3 (Mt 4:4)."}
    - {v: 7-10, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], nota: "La tierra que los espera tiene arroyos y manantiales, trigo, cebada, vides, higueras, granados, olivos y miel, y rocas con hierro y cobre. Cuando coman hasta saciarse, darán gracias a Jehová."}
    - {v: 11-20, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:codornices-y-mana-en-el-desierto-de-sin], menciona: [lugar:egipto, evento:exodo, evento:agua-del-penasco-en-meriba], nota: "Casas y riquezas no deben volverlos orgullosos: Jehová los guio entre serpientes y escorpiones, sacó agua de la roca (la referencia remite a Nú 20:11) y les dio maná. Si siguen a otros dioses, perecerán."}
  9:
    estado: completo
    revisado: 2026-09-29
    nota: "Parte del segundo discurso de Moisés en las llanuras de Moab (Dt 5-26). Sus recuerdos del desierto van como pasajes de los sucesos de Éxodo y Números."
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, persona:moises], menciona: [lugar:rio-jordan, evento:los-espias-informan-en-cades, persona:abrahan, persona:isaac, persona:jacob], nota: "Israel cruzará el Jordán contra ciudades amuralladas y contra los anaquim, pueblo sin ficha cuya fuerza dio pie a un dicho sobre los hijos de Anac. Vencerá por la maldad de esas naciones y lo jurado a los patriarcas."}
    - {v: 7-21, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:primeros-cuarenta-dias-de-moises-en-el-sinai, evento:dios-da-a-moises-las-tablas-del-testimonio, evento:becerro-de-oro, evento:moises-ruega-por-el-pueblo, evento:moises-rompe-las-tablas, evento:moises-recibe-las-segundas-tablas, persona:aaron, lugar:monte-sinai], menciona: [lugar:egipto, evento:exodo, evento:diez-mandamientos, evento:moises-pide-perdon-por-el-pueblo], nota: "Moisés repasa lo de Horeb: 40 días sin comer ni beber, las tablas escritas por Dios, el becerro, las tablas rotas y otros 40 días postrado. Rogó también por Aarón y echó el polvo del ídolo al torrente del monte."}
    - {v: 22-24, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:fuego-de-jehova-en-tabera, evento:agua-de-la-roca-en-horeb, evento:el-pueblo-pide-carne, evento:codornices-en-quibrot-hataava, evento:israel-se-niega-a-entrar-en-canaan, lugar:tabera, lugar:masa, lugar:quibrot-hataava, lugar:cades], nota: "Más rebeldías: en Taberá, en Masá, junto a Refidim, y en Quibrot-Hataavá; y en Cadés-Barnea, cuando no quisieron subir a tomar la tierra que Jehová les daba."}
    - {v: 25-29, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:moises-recibe-las-segundas-tablas, evento:moises-ruega-por-el-pueblo], menciona: [persona:abrahan, persona:isaac, persona:jacob, lugar:egipto], nota: "Postrado 40 días, Moisés suplicó que Jehová no destruyera a su pueblo, recordando a Abrahán, Isaac y Jacob, para que los egipcios no dijeran que no pudo llevarlo a la tierra prometida."}
  10:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:moises-recibe-las-segundas-tablas, persona:moises], menciona: [evento:moises-rompe-las-tablas, evento:diez-mandamientos], nota: "Moisés recuerda que talló dos tablas nuevas e hizo un arca de acacia; Jehová volvió a escribir los Diez Mandamientos y él guardó las tablas en el arca. La montaña es el Horeb."}
    - {v: 6-7, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:muerte-de-aaron, evento:israel-acampa-en-gudgoda-y-jotbata, persona:aaron, persona:eleazar-hijo-de-aaron, lugar:bene-jaacan, lugar:moserot, lugar:hor-haguidgad, lugar:jotbata, relacion:aaron/murio_en/monte-hor, relacion:eleazar-hijo-de-aaron/sucede_a/aaron, relacion:eleazar-hijo-de-aaron/pariente/aaron], menciona: [periodo:sumo-sacerdocio-de-aaron], nota: "Beerot Bene-Jaacán es Bene-Jaacán, Moserá es Moserot y Gudgoda es probablemente Hor-Haguidgad. Números 33 da otro orden: Perspicacia cree que Israel pasó dos veces. Aarón fue enterrado en Moserá."}
    - {v: 8-9, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:jehova-da-los-levitas-a-aaron, evento:jehova-fija-los-deberes-de-sacerdotes-y-levitas], nota: "Leví es aquí la tribu, sin ficha. Jehová la aparta para llevar el arca, servirle y bendecir al pueblo; no recibe tierra porque Jehová es su herencia (Nú 3:6; 18:20)."}
    - {v: 10-11, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:moises-recibe-las-segundas-tablas, persona:moises], menciona: [evento:moises-ruega-por-el-pueblo, evento:israel-sale-del-desierto-de-sinai], nota: "Segunda estancia de 40 días en la montaña: Jehová escucha a Moisés y no destruye al pueblo. Luego le manda ponerse al frente para ir a la tierra jurada a los antepasados."}
    - {v: 12-19, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], menciona: [lugar:egipto], nota: "Jehová pide temor, amor, servicio y obediencia. Es Dios de dioses, no tiene favoritos ni acepta sobornos y protege al huérfano, a la viuda y al extranjero; Israel también fue extranjero en Egipto."}
    - {v: 20-22, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:jacob-entra-en-egipto], menciona: [lugar:egipto], nota: "Los antepasados bajaron a Egipto siendo 70 y ahora son tantos como las estrellas. Los antepasados no se nombran."}
  11:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:israel-cruza-el-mar-rojo], menciona: [lugar:egipto, lugar:mar-rojo], nota: "Los hijos no vieron la disciplina de Jehová: las señales contra el faraón, que no tiene nombre, el ejército ahogado en el mar Rojo y lo hecho en el desierto hasta llegar aquí."}
    - {v: 6-7, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, evento:la-tierra-se-traga-a-datan-y-abiram, persona:datan, persona:abiram-hijo-de-eliab, persona:eliab-hijo-de-palu, relacion:datan/pariente/eliab-hijo-de-palu, relacion:datan/pariente/abiram-hijo-de-eliab, relacion:abiram-hijo-de-eliab/pariente/eliab-hijo-de-palu, relacion:eliab-hijo-de-palu/pariente/ruben-hijo-de-jacob], menciona: [persona:ruben-hijo-de-jacob], nota: "La tierra se traga a Datán y Abiram con sus casas y sus tiendas. Moisés no nombra aquí a Coré. Eliab es hijo de Rubén en el sentido de descendiente."}
    - {v: 8-12, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], menciona: [lugar:egipto], nota: "La tierra que van a ocupar, de montes y llanuras, bebe la lluvia y Jehová la vigila todo el año; en Egipto, en cambio, se regaba con el pie."}
    - {v: 13-17, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], nota: "Si obedecen, habrá lluvia de otoño y de primavera, grano, vino, aceite y pasto. Si se van tras otros dioses, Jehová cerrará el cielo y morirán pronto."}
    - {v: 18-21, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], nota: "Llevar estas palabras en el corazón, atadas a la mano y en la frente, enseñarlas a los hijos a todas horas y escribirlas en los postes de las casas y en las puertas."}
    - {v: 22-25, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, lugar:libano, lugar:rio-eufrates, lugar:mar-grande], nota: "Si aman a Jehová, él echará a naciones mayores. La frontera irá del desierto, sin nombre, al Líbano y del Éufrates al mar occidental, que la nota llama mar Grande o Mediterráneo."}
    - {v: 26-28, tipo: discurso, entidades: [evento:segundo-discurso-de-moises], nota: "Moisés pone delante una bendición, si obedecen, y una maldición, si desobedecen y siguen a dioses que no conocen."}
    - {v: 29-32, tipo: discurso, entidades: [evento:segundo-discurso-de-moises, lugar:monte-guerizim, lugar:monte-ebal, lugar:araba, lugar:guilgal-frente-a-guerizim-y-ebal, lugar:more], menciona: [lugar:rio-jordan, lugar:canaan, evento:entrada-en-canaan], nota: "En la tierra, la bendición irá en el Guerizim y la maldición en el Ebal, al oeste del Jordán; lo cumple Josué (Jos 8:30-35), suceso que crea Josué. Los cananeos son pueblo sin ficha."}
  12:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-14, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [lugar:rio-jordan, evento:entrada-en-canaan], nota: "Al entrar en la tierra, Israel arrasará los altares, columnas y postes sagrados de las naciones. Sus ofrendas, diezmos y primogénitos irán solo al lugar que Jehová elija para su nombre, donde comerán alegres con el levita."}
    - {v: 15-28, tipo: ley, nota: "En cualquier ciudad se puede matar y comer carne, como la gacela, estando puro o impuro; la sangre, que es la vida, se derrama en tierra. Diezmos, primogénitos y votos se comen solo en el sitio elegido."}
    - {v: 29-32, tipo: ley, nota: "Vencidas las naciones, Israel no debe preguntar cómo servían a sus dioses para imitarlas: llegaban a quemar a sus hijos en su honor. A lo mandado no se le añade ni se le quita nada."}
  13:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [lugar:egipto, evento:exodo], nota: "Aunque su señal se cumpla, al profeta o soñador que invite a seguir a otros dioses no se le escucha y muere por rebelde: así prueba Jehová si Israel lo ama de todo corazón."}
    - {v: 6-11, tipo: ley, menciona: [lugar:egipto, evento:exodo], nota: "Si un hermano, un hijo, la esposa o el amigo más íntimo incita en secreto a servir a otros dioses, no se le encubre: se le apedrea, empezando por quien lo oyó. Así todo Israel escarmienta."}
    - {v: 12-18, tipo: ley, nota: "Si una investigación a fondo confirma que una ciudad israelita se fue tras otros dioses, se la destruye con su ganado, su botín se quema como ofrenda completa y nunca se reconstruye. Nadie se queda nada."}
  14:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: ley, entidades: [evento:segundo-discurso-de-moises], nota: "Como hijos de Jehová y pueblo santo, elegido para ser su propiedad especial, los israelitas no se hacen cortes ni se rapan la frente por un muerto."}
    - {v: 3-21, tipo: ley, nota: "Qué animales se comen, como en Levítico 11: rumiantes de pezuña partida, peces con aletas y escamas, y no ciertas aves. Lo hallado muerto se da o se vende al extranjero. El cabrito no se hierve en leche materna."}
    - {v: 22-29, tipo: ley, nota: "El diezmo anual se come ante Jehová en el sitio elegido; si queda lejos, se vende y allí se compra lo que se quiera. Cada tercer año se guarda en la ciudad para levitas, extranjeros, huérfanos y viudas."}
  15:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:moises], nota: "Cada siete años el acreedor perdona las deudas de su hermano israelita, no las del extranjero. Si Israel obedece, Jehová lo bendecirá: no habrá pobres, prestará a muchas naciones y no pedirá prestado."}
    - {v: 7-11, tipo: ley, nota: "Al hermano pobre se le presta lo que le falte, con generosidad y sin mala gana, aunque esté cerca el año en que se perdonan las deudas. En la tierra nunca faltarán pobres."}
    - {v: 12-18, tipo: ley, menciona: [lugar:egipto, evento:egipto-esclaviza-a-israel, evento:exodo], nota: "El esclavo hebreo, hombre o mujer, sale libre al séptimo año con regalos del rebaño, la era y el lagar; si prefiere quedarse, se le perfora la oreja y sirve de por vida. Israel también fue esclavo en Egipto."}
    - {v: 19-23, tipo: ley, nota: "Los primogénitos machos del ganado son de Jehová: no se trabajan ni se esquilan y la familia los come cada año en el lugar que él escoja. El que tiene un defecto se come en casa, sin su sangre."}
  16:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-8, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:moises, lugar:egipto, evento:exodo, evento:jehova-instituye-la-pascua], nota: "En el mes de abib, la Pascua recuerda la salida nocturna de Egipto y solo se sacrifica, al ponerse el sol, en el lugar que Jehová escoja, que con el tiempo fue Jerusalén. Siguen días de pan sin levadura."}
    - {v: 9-12, tipo: ley, menciona: [lugar:egipto, evento:egipto-esclaviza-a-israel], nota: "Siete semanas después de empezar la siega llega la Fiesta de las Semanas: ofrenda voluntaria según lo bendecido y alegría de toda la casa, también del levita, el extranjero, el huérfano y la viuda."}
    - {v: 13-15, tipo: ley, nota: "La Fiesta de las Cabañas dura siete días, tras recoger la cosecha de la era y del lagar, en el lugar que Jehová escoja. Toda la casa y los necesitados se alegran juntos."}
    - {v: 16-17, tipo: ley, nota: "Tres veces al año, en los Panes Sin Levadura, las Semanas y las Cabañas, cada varón acude ante Jehová al lugar escogido y lleva un regalo según la bendición recibida."}
    - {v: 18-20, tipo: ley, nota: "En cada ciudad se nombran jueces y funcionarios por tribus, que juzguen con rectitud, sin favoritismo ni sobornos. Aquí empieza el esbozo del sistema judicial de Israel, que sigue hasta 17:13."}
    - {v: 21-22, tipo: ley, nota: "Junto al altar de Jehová no se planta ningún poste sagrado ni se levanta una columna sagrada, porque él las odia."}
  17:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:moises], nota: "A Jehová no se le sacrifica un toro ni una oveja con defecto, porque lo detesta."}
    - {v: 2-7, tipo: ley, nota: "Quien adore a otros dioses, al sol, a la luna o a los astros muere apedreado a las puertas de la ciudad, tras una investigación a fondo y con dos o tres testigos, que tiran las primeras piedras."}
    - {v: 8-13, tipo: ley, nota: "Los casos difíciles, como un homicidio, una demanda o una agresión, van al lugar que Jehová escoja, ante los sacerdotes levitas y el juez de turno. Quien desobedezca su fallo por arrogancia muere."}
    - {v: 14-20, tipo: ley, menciona: [lugar:egipto], nota: "Si Israel quiere rey, será un israelita escogido por Jehová, sin muchos caballos traídos de Egipto, ni muchas esposas, ni grandes riquezas. Hará su propia copia de la Ley y la leerá cada día."}
  18:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-8, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [evento:jehova-fija-los-deberes-de-sacerdotes-y-levitas], nota: "Los sacerdotes levitas, como toda la tribu de Leví (sin ficha), no heredan tierra: Jehová es su herencia. Reciben partes de los sacrificios y las primicias; el levita que vaya al santuario escogido sirve y come como los demás."}
    - {v: 9-14, tipo: ley, entidades: [evento:segundo-discurso-de-moises], nota: "Prohíbe imitar a las naciones del país: quemar hijos en el fuego, adivinar, practicar magia, buscar agüeros, hechizar, echar maleficios, consultar médiums o a los muertos. Por eso Jehová las expulsa."}
    - {v: 15-19, tipo: profecia, entidades: [evento:segundo-discurso-de-moises, persona:moises, evento:diez-mandamientos], menciona: [persona:jesus, lugar:desierto-de-sinai], nota: "Jehová levantará un profeta como Moisés, en respuesta al miedo del pueblo en Horeb, que Perspicacia sitúa en la zona del Sinaí. «Profeta» y «Moisés» lo identifican con Jesús, como Pedro en Hch 3:22, 23."}
    - {v: 20-22, tipo: ley, entidades: [evento:segundo-discurso-de-moises], nota: "Muere el profeta que habla sin mandato de Jehová o en nombre de otros dioses, que no llevan ficha. Si lo anunciado en nombre de Jehová no se cumple, Jehová no lo dijo y no hay que temerlo."}
  19:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-13, tipo: ley, entidades: [evento:segundo-discurso-de-moises, evento:jehova-da-la-ley-de-las-ciudades-de-refugio], nota: "Tres ciudades de refugio en la tierra conquistada, con caminos preparados, para quien mata sin querer, como con el hacha suelta; tres más si Jehová ensancha el país. Al asesino, los ancianos lo entregan al vengador de la sangre."}
    - {v: "14", tipo: ley, entidades: [evento:segundo-discurso-de-moises], nota: "Nadie debe correr los mojones que fijaron los antepasados en la herencia de su vecino."}
    - {v: 15-21, tipo: ley, entidades: [evento:segundo-discurso-de-moises], nota: "Se condena con dos o tres testigos, no con uno. Si los jueces prueban que un testigo mintió, sufre lo que quería para el otro: vida por vida, ojo por ojo. Jesús cita esta ley en Mt 5:38."}
  20:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [lugar:egipto, evento:exodo], nota: "Ante un ejército con más caballos y carros, Israel no debe temer: Jehová, que lo sacó de Egipto, pelea por él. Antes del combate, el sacerdote anima al pueblo."}
    - {v: 5-9, tipo: ley, entidades: [evento:segundo-discurso-de-moises], nota: "Los oficiales mandan a casa a quien no ha estrenado su casa nueva, no ha probado su viña o está comprometido, y también al miedoso. Después nombran jefes para las tropas."}
    - {v: 10-18, tipo: ley, entidades: [evento:segundo-discurso-de-moises], nota: "A la ciudad lejana se le ofrece paz: si acepta, hace trabajos forzados; si no, mueren sus varones. En las de hititas, amorreos, cananeos, perizitas, heveos y jebuseos, pueblos sin ficha, no queda nadie con vida."}
    - {v: 19-20, tipo: ley, entidades: [evento:segundo-discurso-de-moises], nota: "En un asedio largo no se talan los árboles frutales; los que no dan alimento sí pueden cortarse para cercar la ciudad."}
  21:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-9, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:moises], nota: "Si aparece un muerto en el campo sin culpable conocido, se mide la distancia hasta las ciudades. Los ancianos de la más próxima desnucan una ternera junto a un arroyo y, ante los sacerdotes, declaran su inocencia lavándose las manos."}
    - {v: 10-14, tipo: ley, nota: "El israelita que quiera casarse con una cautiva de guerra la lleva a casa; ella se rapa, se arregla las uñas y llora a sus padres un mes. Si después la rechaza, la deja libre y no puede venderla."}
    - {v: 15-17, tipo: ley, nota: "Quien tiene dos esposas y prefiere a una no puede dar el derecho de primogénito al hijo de la favorita. El mayor, aunque sea de la menos querida, recibe doble parte de la herencia."}
    - {v: 18-21, tipo: ley, nota: "Al hijo rebelde, glotón y borracho que no se deja corregir lo llevan sus padres a los ancianos, en la puerta, y los vecinos lo apedrean hasta que muere."}
    - {v: 22-23, tipo: ley, nota: "El cuerpo del ejecutado que se cuelga de un madero no pasa allí la noche: se entierra ese día, porque el colgado es maldito de Dios. Gál 3:13 cita este versículo."}
  22:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:moises], nota: "Lo que pierde otro israelita, sea toro, oveja, burro, ropa u otra cosa, se le devuelve; si su dueño vive lejos o es desconocido, se guarda hasta que lo reclame. Al animal caído se le ayuda a levantarse."}
    - {v: 5-8, tipo: ley, nota: "Nadie se viste con ropa del otro sexo. De un nido se pueden tomar crías o huevos, pero la madre se suelta. La casa nueva lleva un pretil en la azotea, para no cargar con la sangre de una caída."}
    - {v: 9-12, tipo: ley, nota: "Sin mezclas: nada de dos semillas en la viña, de un toro y un burro bajo el mismo arado ni de tejidos de lana con lino. La ropa lleva borlas en sus cuatro puntas."}
    - {v: 13-21, tipo: ley, nota: "Si un marido acusa en falso a su esposa de no haber llegado virgen, los padres muestran la prueba a los ancianos; él recibe castigo, paga cien siclos al suegro y no podrá divorciarse. Si era verdad, ella muere apedreada."}
    - {v: 22-27, tipo: ley, nota: "El adulterio con una casada se castiga con la muerte de ambos. Con una prometida en la ciudad mueren los dos, porque ella no pidió ayuda; si fue en el campo, donde nadie la oyó, muere solo él."}
    - {v: 28-30, tipo: ley, nota: "Quien se acuesta con una virgen sin compromiso paga cincuenta siclos al padre, se casa con ella y nunca podrá divorciarse. Nadie toma a la esposa de su padre."}
  23:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:moises], nota: "No entran en la congregación de Jehová el hombre castrado o mutilado ni el hijo ilegítimo; tampoco los descendientes de este hasta la décima generación."}
    - {v: 3-6, tipo: ley, entidades: [persona:balaam, persona:beor-padre-de-balaam, lugar:petor, lugar:mesopotamia, relacion:balaam/pariente/beor-padre-de-balaam, relacion:balaam/vivio_en/petor, relacion:balaam/vivio_en/mesopotamia, evento:balac-manda-llamar-a-balaam, evento:balaam-bendice-a-israel-desde-bamot-baal, evento:balaam-bendice-a-israel-desde-pisga, evento:balaam-bendice-a-israel-desde-peor], menciona: [lugar:ammon, lugar:moab, lugar:egipto, evento:exodo], nota: "Ammonitas y moabitas quedan excluidos de la congregación para siempre: no recibieron a Israel con pan y agua en su viaje desde Egipto y contrataron a Balaam para que lo maldijera. Jehová cambió la maldición en bendición."}
    - {v: 7-8, tipo: ley, menciona: [lugar:edom, lugar:egipto, evento:jacob-entra-en-egipto], nota: "Al edomita no se le odia, porque es hermano, ni al egipcio, porque Israel vivió como extranjero en su tierra. Sus hijos pueden entrar en la congregación desde la tercera generación."}
    - {v: 9-14, tipo: ley, nota: "En campaña el campamento se guarda puro: quien tiene una emisión nocturna sale y vuelve al ponerse el sol, ya lavado, y las necesidades se hacen fuera y se tapan, porque Jehová anda por el campamento."}
    - {v: 15-16, tipo: ley, nota: "Al esclavo que huye de su amo y pide refugio no se le entrega: vive en la ciudad que elija, sin que nadie lo maltrate."}
    - {v: 17-18, tipo: ley, nota: "Ningún israelita, hombre o mujer, puede ser prostituto de templo, y lo ganado con la prostitución no se lleva a la casa de Jehová para pagar un voto."}
    - {v: 19-20, tipo: ley, nota: "Al hermano israelita no se le cobra interés por dinero, comida ni ninguna otra cosa prestada; al extranjero sí."}
    - {v: 21-23, tipo: ley, nota: "El voto hecho a Jehová se cumple sin retraso; no cumplirlo es pecado. No prometer no es pecado, pero lo que uno ofrece de palabra como ofrenda voluntaria tiene que darlo."}
    - {v: 24-25, tipo: ley, nota: "En la viña o el sembrado del prójimo uno puede comer uvas o arrancar espigas con la mano hasta quedar saciado, pero no llenar un recipiente ni meter la hoz."}
  24:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:moises], nota: "Sigue el segundo discurso de Moisés (Dt 5:1-26:19). Divorcio: certificado escrito; el primer esposo no puede volver a tomar a la mujer que se casó con otro. Jesús lo comenta en Mt 19:3-8."}
    - {v: 5-7, tipo: ley, nota: "El recién casado queda un año libre del ejército. No se toma en prenda el molino de mano. Quien secuestre y venda a un israelita debe morir."}
    - {v: 8-9, tipo: ley, entidades: [evento:miriam-y-aaron-hablan-contra-moises, persona:miriam-hermana-de-moises], menciona: [lugar:egipto], nota: "Ante la lepra, obedecer a los sacerdotes levitas. Moisés pone como aviso la lepra que Jehová mandó a Míriam por murmurar (Nú 12), en el camino tras salir de Egipto."}
    - {v: 10-15, tipo: ley, nota: "El prestamista espera fuera a que le saquen la prenda y devuelve al pobre su manto antes de anochecer. Al jornalero, israelita o extranjero, se le paga el mismo día."}
    - {v: 16-18, tipo: ley, menciona: [lugar:egipto, evento:egipto-esclaviza-a-israel, evento:exodo], nota: "Cada uno muere por su propio pecado, no por el de padres o hijos (lo aplica Amasías, 2Re 14:6). Justicia para extranjero, huérfano y viuda, recordando la esclavitud en Egipto."}
    - {v: 19-22, tipo: ley, menciona: [lugar:egipto, evento:egipto-esclaviza-a-israel], nota: "Lo que queda en el campo, el olivo y la viña tras la cosecha es para el extranjero, el huérfano y la viuda. Rut espiga así en Rut 2."}
  25:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:moises], nota: "Sigue el segundo discurso de Moisés (Dt 5:1-26:19). Los jueces deciden la disputa; al culpable se le dan como máximo 40 golpes. Pablo recibió 40 menos uno cinco veces (2Co 11:24)."}
    - {v: "4", tipo: ley, nota: "No se pone bozal al toro que trilla. Pablo aplica esta ley a quienes enseñan (1Co 9:9; 1Ti 5:18)."}
    - {v: 5-10, tipo: ley, nota: "Matrimonio de cuñado: si el hermano muere sin hijo, su hermano se casa con la viuda. Si se niega, ella le quita la sandalia ante los ancianos. Ver Gé 38 y Rut 4. Israel es el pueblo."}
    - {v: 11-12, tipo: ley, nota: "Castigo para la esposa que, al defender a su marido en una pelea, agarra al otro hombre por sus partes íntimas."}
    - {v: 13-16, tipo: ley, nota: "Pesas y medidas exactas, nunca dos distintas, una grande y otra pequeña. Jehová detesta al que engaña así. La nota del v. 14 remite al efá (apéndice B14)."}
    - {v: 17-19, tipo: ley, entidades: [evento:batalla-contra-amalec-en-refidim], menciona: [lugar:amalec, lugar:egipto], nota: "Amalec es el pueblo amalequita, sin ficha como pueblo. Tras el éxodo atacó a los rezagados y cansados; Israel debe borrarlo cuando tenga descanso. Saúl recibe esa orden en 1Sa 15."}
  26:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: ley, entidades: [evento:segundo-discurso-de-moises], menciona: [persona:moises, evento:entrada-en-canaan], nota: "Sigue el segundo discurso de Moisés (Dt 5:1-26:19). Ya en la tierra, el israelita lleva primicias en una canasta al lugar que Jehová elija, sin nombre aquí, y el sacerdote las deja ante el altar."}
    - {v: 5-11, tipo: ley, entidades: [persona:jacob, relacion:jacob/vivio_en/padan-aram, relacion:jacob/vivio_en/egipto], menciona: [lugar:egipto, evento:jacob-entra-en-egipto, evento:egipto-esclaviza-a-israel, evento:exodo], nota: "Declaración al ofrecer: el arameo errante es Jacob (Perspicacia «Aram», núm. 5), que bajó a Egipto con pocos. Allí creció Israel, fue oprimido y Jehová lo sacó. La nota da también «a punto de morir»."}
    - {v: 12-15, tipo: ley, nota: "El diezmo del tercer año se da en las ciudades a levitas, extranjeros, huérfanos y viudas. El que lo entrega declara que no lo usó de luto, impuro ni para los muertos."}
    - {v: 16-19, tipo: discurso, nota: "Cierre del segundo discurso: ese día Israel se compromete a ser propiedad especial de Jehová y Jehová a ser su Dios, y lo pondrá por encima de las naciones si es santo."}
  27:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-8, tipo: discurso, entidades: [evento:moises-manda-escribir-la-ley-en-piedras-en-el-ebal, persona:moises, lugar:monte-ebal], menciona: [lugar:rio-jordan], nota: "Piedras cubiertas de yeso con la Ley escrita y un altar sin herramientas de hierro. Josué lo cumple tras tomar Hai (Jos 8:30-32); ese suceso lo crea Josué."}
    - {v: 9-10, tipo: discurso, entidades: [evento:moises-anuncia-las-bendiciones-y-las-maldiciones, persona:moises], nota: "Moisés y los sacerdotes levitas dicen a Israel que ese día ha llegado a ser el pueblo de Jehová y que debe obedecerle."}
    - {v: 11-14, tipo: discurso, entidades: [evento:moises-anuncia-las-bendiciones-y-las-maldiciones, persona:moises, lugar:monte-guerizim, lugar:monte-ebal], menciona: [lugar:rio-jordan], nota: "En el Guerizim, para bendecir: Simeón, Leví, Judá, Isacar, José y Benjamín. Rubén, Gad, Aser, Zabulón, Dan y Neftalí van al Ebal, para maldecir. Son tribus, no los patriarcas: sin ficha."}
    - {v: 15-26, tipo: ley, entidades: [evento:moises-anuncia-las-bendiciones-y-las-maldiciones], nota: "Doce maldiciones que proclaman los levitas y el pueblo confirma con amén: ídolos ocultos, desprecio a los padres, mover lindes, extraviar al ciego, torcer la justicia, incesto, bestialidad, homicidio, soborno y desobediencia."}
  28:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-14, tipo: discurso, entidades: [evento:moises-anuncia-las-bendiciones-y-las-maldiciones], nota: "Bendiciones de la obediencia: prosperidad en ciudad y campo, hijos, cosechas y ganado, victoria sobre el enemigo, lluvia a su tiempo, prestar sin pedir prestado y estar a la cabeza de las naciones."}
    - {v: 15-44, tipo: discurso, entidades: [evento:moises-anuncia-las-bendiciones-y-las-maldiciones], menciona: [lugar:egipto], nota: "Maldiciones de la desobediencia: enfermedad, sequía, derrota, las úlceras de Egipto, locura, robo, pérdida de hijos y cosechas, destierro con su rey a una nación desconocida y el extranjero por encima."}
    - {v: 45-57, tipo: discurso, entidades: [evento:moises-anuncia-las-bendiciones-y-las-maldiciones], nota: "Una nación lejana de idioma extraño sitiará sus ciudades, y el hambre del cerco llevará a comer a los propios hijos. Las referencias remiten a los asedios de Samaria y Jerusalén (2Re 6; 25; Lam 4)."}
    - {v: 58-68, tipo: discurso, entidades: [evento:moises-anuncia-las-bendiciones-y-las-maldiciones], menciona: [lugar:egipto], nota: "Si no temen el nombre de Jehová: plagas y enfermedades de Egipto, pocos supervivientes, dispersión entre naciones con dioses de madera y piedra, miedo sin descanso y vuelta a Egipto en barco como esclavos."}
  29:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, entidades: [evento:pacto-con-israel-en-moab, persona:moises, lugar:moab], menciona: [evento:pacto-de-la-ley, lugar:desierto-de-sinai], nota: "Título del pacto de Moab, que se suma al de Horeb. Perspicacia «Horeb» cuenta este versículo entre los que usan el nombre para la región del Sinaí."}
    - {v: 2-9, tipo: discurso, entidades: [evento:pacto-con-israel-en-moab, persona:moises, persona:sehon, persona:og, relacion:sehon/vivio_en/hesbon, relacion:og/vivio_en/basan, evento:israel-vence-a-sehon, evento:israel-vence-a-og, evento:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan], menciona: [lugar:egipto, lugar:hesbon, lugar:basan], nota: "Moisés repasa las señales contra el faraón, los cuarenta años en que ni la ropa ni las sandalias se gastaron, y la victoria sobre Sehón y Og. Rubenitas, gaditas y manasitas son pueblos."}
    - {v: 10-15, tipo: discurso, entidades: [evento:pacto-con-israel-en-moab, persona:moises], menciona: [persona:abrahan, persona:isaac, persona:jacob], nota: "Todos están ante Jehová, desde los jefes hasta el leñador y el aguador, para entrar en el pacto jurado a los patriarcas. Vale también para quienes no están presentes."}
    - {v: 16-21, tipo: discurso, menciona: [lugar:egipto], nota: "Recuerdan los ídolos de Egipto y de las naciones que cruzaron. Quien se crea a salvo siguiendo su propio corazón sufrirá las maldiciones del libro; Heb 12:15 recoge la imagen de la raíz venenosa."}
    - {v: 22-28, tipo: profecia, entidades: [evento:destruccion-de-sodoma-y-gomorra, lugar:adma, lugar:zeboyim], menciona: [lugar:sodoma, lugar:gomorra, lugar:egipto, evento:exodo], nota: "Si abandonan el pacto, la tierra quedará arrasada como las cuatro ciudades destruidas en tiempos de Lot y el pueblo acabará desterrado. Los dioses ajenos no llevan nombre."}
    - {v: "29", tipo: discurso, nota: "Lo oculto es de Jehová; lo que él ha dado a conocer es de Israel y de sus hijos, para que lo pongan en práctica."}
  30:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-10, tipo: profecia, entidades: [evento:pacto-con-israel-en-moab, persona:moises], nota: "Si el pueblo dispersado vuelve a Jehová, él lo recogerá de las naciones, lo devolverá a la tierra y purificará su corazón. Las referencias remiten al regreso de Babilonia (Esd 1:2, 3)."}
    - {v: 11-14, tipo: discurso, entidades: [evento:pacto-con-israel-en-moab], nota: "El mandamiento no queda lejos, ni arriba en el cielo ni al otro lado del mar: está en su boca y en su corazón. Pablo cita estas palabras en Ro 10:6-8."}
    - {v: 15-20, tipo: discurso, entidades: [evento:pacto-con-israel-en-moab, persona:moises], menciona: [lugar:rio-jordan, persona:abrahan, persona:isaac, persona:jacob], nota: "Moisés pone al pueblo ante una elección con testigos: obedecer y vivir largo tiempo en la tierra jurada a los patriarcas, o servir a otros dioses y perecer tras cruzar el Jordán."}
  31:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:moises-anima-a-israel-y-a-josue, persona:moises, persona:josue-hijo-de-nun, lugar:llanuras-deserticas-de-moab, persona:sehon, persona:og, evento:israel-vence-a-sehon, evento:israel-vence-a-og], menciona: [lugar:rio-jordan], nota: "Moisés, con 120 años, no cruzará el Jordán. Jehová hará con las naciones lo que hizo con Sehón y Og, reyes amorreos. Los amorreos son un pueblo."}
    - {v: 7-8, tipo: narracion, entidades: [evento:moises-anima-a-israel-y-a-josue, persona:josue-hijo-de-nun, persona:moises, relacion:josue-hijo-de-nun/sucede_a/moises]}
    - {v: 9-13, tipo: ley, entidades: [evento:moises-escribe-la-ley-y-la-confia-a-los-sacerdotes, persona:moises], menciona: [lugar:rio-jordan], nota: "Cada siete años, en la Fiesta de las Cabañas del año en que se perdonan las deudas, se leerá la Ley a hombres, mujeres, niños y extranjeros. La referencia lleva a Ne 8."}
    - {v: 14-15, tipo: narracion, entidades: [evento:jehova-comisiona-a-josue-en-la-tienda-de-reunion, persona:moises, persona:josue-hijo-de-nun]}
    - {v: 16-22, tipo: profecia, entidades: [evento:jehova-comisiona-a-josue-en-la-tienda-de-reunion, persona:moises], nota: "Jehová predice que, ya saciado en la tierra, el pueblo seguirá a dioses extranjeros y romperá el pacto. La canción quedará como testigo; Moisés la escribe ese día y la enseña. Los dioses no llevan nombre."}
    - {v: "23", tipo: narracion, entidades: [evento:jehova-comisiona-a-josue-en-la-tienda-de-reunion, persona:josue-hijo-de-nun, relacion:josue-hijo-de-nun/sucede_a/moises, relacion:josue-hijo-de-nun/pariente/nun], menciona: [persona:nun]}
    - {v: 24-29, tipo: discurso, entidades: [evento:moises-escribe-la-ley-y-la-confia-a-los-sacerdotes, persona:moises], nota: "El libro de la Ley queda junto al arca del pacto como testigo. Moisés reúne a ancianos y funcionarios y prevé que, tras su muerte, el pueblo se desviará."}
    - {v: "30", tipo: narracion, entidades: [evento:moises-recita-su-cancion-ante-israel, persona:moises]}
  32:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: poesia, entidades: [evento:moises-recita-su-cancion-ante-israel, persona:moises], nota: "Empieza la canción: Moisés proclama el nombre de Jehová, la Roca de obras perfectas, y reprocha a un pueblo torcido que no le corresponde."}
    - {v: 7-14, tipo: poesia, menciona: [persona:adan, evento:torre-de-babel, lugar:basan], nota: "Dios repartió las naciones al separar a los hijos de Adán. Jacob, aquí el pueblo, es su herencia: lo halló en el desierto, lo guio como un águila y lo alimentó con lo mejor, hasta carneros de Basán."}
    - {v: 15-18, tipo: poesia, nota: "Jesurún, título honroso de Israel (Perspicacia «Jesurún»), engordó y abandonó a la Roca que lo creó para ofrecer sacrificios a demonios y a dioses nuevos."}
    - {v: 19-35, tipo: poesia, menciona: [lugar:sodoma, lugar:gomorra], nota: "Jehová les dará la espalda, provocará sus celos con una nación que no es pueblo y enviará calamidades. La vid de sus enemigos es como la de Sodoma y Gomorra. Suya es la venganza (Ro 12:19)."}
    - {v: 36-43, tipo: poesia, nota: "Jehová tendrá compasión de sus siervos, demostrará que no hay otro Dios, se vengará de sus enemigos e invita a las naciones a alegrarse con su pueblo (Ro 15:10)."}
    - {v: 44-47, tipo: narracion, entidades: [evento:moises-recita-su-cancion-ante-israel, persona:moises, persona:josue-hijo-de-nun, relacion:josue-hijo-de-nun/pariente/nun], menciona: [persona:nun, lugar:rio-jordan], nota: "Josué recita la canción con Moisés, que lo llama por su nombre original, Hosea."}
    - {v: 48-52, tipo: narracion, entidades: [evento:jehova-manda-a-moises-subir-al-monte-nebo, persona:moises, lugar:llanuras-deserticas-de-moab, lugar:monte-nebo, lugar:abarim, lugar:moab, relacion:moises/murio_en/monte-nebo, persona:aaron, relacion:moises/pariente/aaron, lugar:monte-hor, relacion:aaron/murio_en/monte-hor, evento:muerte-de-aaron, lugar:meriba-de-cades, lugar:desierto-de-zin, evento:agua-del-penasco-en-meriba], menciona: [lugar:jerico, lugar:canaan, lugar:cades]}
  33:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, entidades: [evento:moises-bendice-a-las-tribus, persona:moises], menciona: [lugar:llanuras-deserticas-de-moab], nota: "Moisés, llamado hombre del Dios verdadero, bendice a los israelitas poco antes de morir. Perspicacia pone el libro entero en las llanuras de Moab."}
    - {v: 2-5, tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus, lugar:desierto-de-paran], menciona: [lugar:monte-sinai, lugar:seir, evento:jehova-desciende-sobre-el-monte-sinai, evento:pacto-de-la-ley, persona:moises], nota: "Jehová llega desde Sinaí, Seír y los montes de Parán con miríadas de santos, y Moisés da la Ley. Jesurún, «el recto», es un título de Israel según Perspicacia: sin ficha."}
    - {v: "6", tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus], nota: "Rubén: que viva y no quede reducido a pocos. Es la tribu, no el hijo de Jacob. Simeón no se nombra en la bendición."}
    - {v: "7", tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus], nota: "Judá: Moisés pide a Jehová que lo escuche, lo haga volver con los suyos y lo ayude contra sus enemigos. Es la tribu, sin ficha."}
    - {v: 8-11, tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus, lugar:masa, evento:agua-de-la-roca-en-horeb], menciona: [persona:aaron, evento:levitas-matan-a-los-idolatras, lugar:meriba-de-cades, evento:agua-del-penasco-en-meriba], nota: "Leví guarda el Tumim y el Urim, enseña la Ley y sirve en el altar. La referencia de Meribá lleva a Nú 20:13, en Cadés; Perspicacia «Meribá», núm. 2, ve posible que aluda a Refidim, junto a Masá."}
    - {v: "12", tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus], nota: "Benjamín, el amado de Jehová, vivirá seguro bajo su protección todo el día."}
    - {v: 13-17, tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus], menciona: [persona:jose-hijo-de-jacob, evento:moises-ante-la-zarza-ardiente, lugar:territorio-de-efrain, lugar:manases], nota: "La tierra de José tendrá rocío, manantiales y buenas cosechas, con el favor del que estaba en la zarza. Efraín contará decenas de miles y Manasés miles: Perspicacia «Efraín» ve ahí su primacía."}
    - {v: 18-19, tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus, lugar:zabulon], nota: "Zabulón e Isacar se alegrarán en sus salidas y en sus tiendas y sacarán riquezas del mar y de la arena. Perspicacia «Zabulón» lo relaciona con su salida a dos mares."}
    - {v: 20-21, tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus], menciona: [evento:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan], nota: "Gad, agazapado como un león, escogió primero su parte al este del Jordán (Nú 32:1-5). Su territorio aún no tiene ficha: lo creará Josué."}
    - {v: "22", tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus], menciona: [lugar:basan, persona:sanson], nota: "Dan es un cachorro de león que salta desde Basán. Perspicacia «Dan» ve la bendición cumplida en Sansón."}
