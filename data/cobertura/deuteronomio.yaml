    - {v: 24-25, tipo: poesia, entidades: [evento:moises-bendice-a-las-tribus], nota: "Aser, bendecido con hijos y querido por sus hermanos, bañará sus pies en aceite; sus puertas tendrán cerrojos de hierro y cobre."}
