# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: hechos
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: narracion, entidades: [persona:teofilo], menciona: [persona:jesus, persona:lucas], nota: "Lucas dedica a Teófilo la segunda parte de su relato. El primero, su Evangelio, llegaba hasta el día en que Jesús fue llevado al cielo (nota del v. 1)."}
    - {v: "3", tipo: narracion, entidades: [evento:mandato-de-hacer-discipulos, persona:jesus], menciona: [evento:muerte-de-jesus, evento:resurreccion-de-jesus], nota: "Resumen de los 40 días: el resucitado da pruebas de que vive y habla del Reino. La tabla A7-H pone este versículo entre las apariciones posteriores al 16 de nisán."}
    - {v: 4-5, tipo: narracion, entidades: [evento:manda-esperar-en-jerusalen, persona:jesus, lugar:jerusalen], menciona: [persona:juan-el-bautista, evento:pentecostes-33], nota: "Reunido con ellos en Jerusalén, les manda quedarse allí hasta recibir el espíritu prometido. El libro «Jesús: el camino», cap. 137, pone esta reunión después de la de Galilea."}
    - {v: 6-11, tipo: narracion, entidades: [evento:ascension-de-jesus, persona:jesus], menciona: [lugar:judea, lugar:region-de-samaria, lugar:galilea, periodo:jesus-en-la-tierra], nota: "Preguntan si restaurará ya el reino a Israel, la nación. Jesús los manda ser testigos hasta lo más lejano de la tierra y sube; dos ángeles anuncian que volverá de la misma manera."}
    - {v: 12-14, tipo: narracion, entidades: [evento:ascension-de-jesus, evento:eleccion-de-matias, lugar:monte-de-los-olivos, lugar:jerusalen, persona:pedro, persona:juan-apostol, persona:santiago-hijo-de-zebedeo, persona:andres, persona:felipe-apostol, persona:tomas, persona:bartolome, persona:mateo, persona:santiago-hijo-de-alfeo, persona:simon-el-cananita, persona:tadeo, persona:maria-madre-de-jesus, persona:jose-hijo-de-jose, persona:simon-hijo-de-jose, relacion:tadeo/pariente/santiago-padre-de-tadeo, relacion:santiago-hijo-de-alfeo/pariente/alfeo-padre-de-santiago, relacion:jesus/pariente/maria-madre-de-jesus], menciona: [persona:alfeo-padre-de-santiago, persona:santiago-padre-de-tadeo, persona:santiago-hermano-de-jesus, persona:judas-hermano-de-jesus, evento:aparicion-a-santiago], nota: "El monte está a un camino de sábado, unos 890 m (nota del v. 12). En el cuarto de arriba oran los once, algunas mujeres, María y los medio hermanos de Jesús, sin nombre aquí."}
    - {v: 15-22, tipo: discurso, entidades: [evento:eleccion-de-matias, evento:muerte-de-judas, persona:pedro, persona:judas-iscariote, lugar:akeldama, relacion:judas-iscariote/murio_en/jerusalen, relacion:matias/acompana/jesus], menciona: [persona:david, persona:juan-el-bautista, evento:arresto-en-getsemani, evento:bautismo-de-jesus, persona:jesus], nota: "Ante unos 120 discípulos, Pedro aplica a Judas los Salmos 69:25 y 109:8. El paréntesis de los v. 18 y 19 da el final de Judas y el campo de Akéldama."}
    - {v: 23-26, tipo: narracion, entidades: [evento:eleccion-de-matias, persona:jose-barsabas, persona:matias, relacion:jose-barsabas/acompana/jesus, relacion:matias/sucede_a/judas-iscariote], menciona: [persona:judas-barsabas, persona:judas-iscariote], nota: "Proponen a José Barsabás, llamado Justo, y a Matías; oran a Jehová y echan suertes, la última vez que la Biblia lo cuenta de los discípulos (nota del v. 26)."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: narracion, entidades: [evento:pentecostes-33, periodo:congregacion-cristiana], nota: "En la fiesta del día 50, el 6 de siván (nota del v. 1), un ruido de viento llena la casa, bajan algo como lenguas de fuego y los reunidos hablan otros idiomas."}
    - {v: 5-13, tipo: narracion, entidades: [evento:pentecostes-33, lugar:jerusalen, lugar:partia, lugar:libia], menciona: [lugar:galilea, lugar:media, lugar:elam, lugar:mesopotamia, lugar:judea, lugar:capadocia, lugar:ponto, lugar:asia, lugar:frigia, lugar:panfilia, lugar:egipto, lugar:cirene, lugar:roma, lugar:creta, lugar:arabia], nota: "Judíos y prosélitos de quince tierras oyen a los galileos en su lengua materna; el texto nombra a partos, medos, elamitas, cretenses y árabes por su pueblo. Otros se burlan: los creen bebidos."}
    - {v: 14-21, tipo: discurso, entidades: [evento:pentecostes-33, persona:pedro], menciona: [persona:joel-profeta, lugar:judea, lugar:jerusalen], nota: "Pedro, de pie con los Once, explica que son las nueve de la mañana (nota del v. 15) y que se cumple Joel 2:28-32: Dios derrama su espíritu en los últimos días."}
    - {v: 22-36, tipo: discurso, entidades: [evento:pentecostes-33, persona:jesus, persona:david, relacion:jesus/vivio_en/nazaret, relacion:jesus/pariente/david, relacion:david/murio_en/jerusalen], menciona: [lugar:nazaret, evento:muerte-de-jesus, evento:resurreccion-de-jesus, evento:ascension-de-jesus], nota: "Jesús el Nazareno, ejecutado y resucitado, es Señor y Cristo. Pedro cita los Salmos 16 y 110: David murió, su tumba sigue allí y él no subió al cielo; hablaba de su descendiente."}
    - {v: 37-41, tipo: narracion, entidades: [evento:pentecostes-33, persona:pedro], nota: "Con el corazón herido preguntan qué hacer. Pedro les pide que se arrepientan y que cada uno se bautice en nombre de Jesucristo; ese día se bautizan unas 3.000 personas."}
    - {v: 42-47, tipo: narracion, entidades: [evento:la-congregacion-de-jerusalen-crece], menciona: [lugar:monte-moria], nota: "Los nuevos discípulos aprenden de los apóstoles, comen juntos en las casas, van cada día al templo y comparten sus bienes; Jehová añade creyentes a diario."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-10, tipo: narracion, entidades: [evento:curacion-del-cojo-en-la-puerta-hermosa, persona:pedro, persona:juan-apostol, lugar:monte-moria, relacion:pedro/acompana/juan-apostol, relacion:juan-apostol/acompana/pedro], menciona: [persona:jesus, lugar:nazaret], nota: "Hacia las tres de la tarde, la hora novena. El cojo no tiene nombre. La Puerta Hermosa, entrada del templo, queda en los nombres del monte Moria."}
    - {v: 11-26, tipo: discurso, entidades: [evento:discurso-de-pedro-en-el-portico-de-salomon, persona:pedro, persona:juan-apostol, lugar:monte-moria], menciona: [persona:jesus, persona:abrahan, persona:isaac, persona:jacob, persona:poncio-pilato, persona:barrabas, persona:moises, persona:samuel, evento:sentencia-y-barrabas, evento:muerte-de-jesus, evento:resurreccion-de-jesus, evento:abrahan-ofrece-a-isaac], nota: "El asesino liberado es Barrabás (referencias de 3:14; Perspicacia «Barrabás»). Pedro cita a Moisés (Dt 18:15) y la promesa a Abrahán (Gé 22:18). Hombres de Israel es el pueblo, sin ficha."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: narracion, entidades: [evento:pedro-y-juan-arrestados-en-el-templo, persona:pedro, persona:juan-apostol, lugar:monte-moria], menciona: [persona:jesus], nota: "Los detienen los sacerdotes, el capitán del templo, que no se nombra, y los saduceos, a quienes irrita que anuncien la resurrección de Jesús."}
    - {v: 5-22, tipo: narracion, entidades: [evento:pedro-y-juan-ante-el-sanedrin, persona:pedro, persona:juan-apostol, persona:anas, persona:caifas, persona:juan-gobernante-judio, persona:alejandro-pariente-de-anas, lugar:jerusalen, relacion:caifas/pariente/anas, relacion:juan-gobernante-judio/pariente/anas, relacion:alejandro-pariente-de-anas/pariente/anas, relacion:juan-apostol/acompana/pedro, relacion:pedro/acompana/jesus, relacion:juan-apostol/acompana/jesus], menciona: [persona:jesus, lugar:nazaret, evento:muerte-de-jesus, evento:resurreccion-de-jesus], nota: "Pedro aplica a Jesús la piedra rechazada del Sl 118:22. El curado tenía más de 40 años. El Sanedrín es el tribunal, sin ficha propia."}
    - {v: 23-31, tipo: narracion, entidades: [evento:los-discipulos-oran-y-tiembla-el-lugar, persona:pedro, persona:juan-apostol, lugar:jerusalen], menciona: [persona:david, persona:herodes-antipas, persona:poncio-pilato, persona:jesus, evento:ante-pilato-y-herodes], nota: "La oración cita el Salmo 2 como palabras de David y lo cumple en Herodes, que Perspicacia «Herodes», núm. 2, identifica con Antipas, y en Poncio Pilato."}
    - {v: 32-37, tipo: narracion, entidades: [evento:los-discipulos-comparten-sus-bienes, persona:bernabe, relacion:bernabe/nacio_en/chipre, relacion:bernabe/vivio_en/jerusalen], menciona: [lugar:chipre], nota: "Bernabé era levita, de la tribu de Leví, que como pueblo no lleva ficha."}
  5:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: narracion, entidades: [evento:muerte-de-ananias-y-safira, persona:ananias-de-jerusalen, persona:safira, persona:pedro, relacion:ananias-de-jerusalen/pariente/safira, relacion:ananias-de-jerusalen/murio_en/jerusalen], menciona: [persona:satanas], nota: "Ananías y Safira venden un campo; él entrega solo parte del dinero y finge darlo todo. Pedro le dice que Satanás lo animó a mentir al espíritu santo y a Dios. Cae muerto y los jóvenes lo entierran."}
    - {v: 7-11, tipo: narracion, entidades: [evento:muerte-de-ananias-y-safira, persona:safira, persona:pedro, persona:ananias-de-jerusalen, relacion:safira/pariente/ananias-de-jerusalen, relacion:safira/vivio_en/jerusalen, relacion:safira/murio_en/jerusalen], nota: "Unas tres horas después, Safira repite la mentira sobre el precio. Pedro le dice que los dos pusieron a prueba el espíritu de Jehová; cae muerta y la entierran junto a su marido. Primera vez que Hechos dice «congregación»."}
    - {v: 12-16, tipo: narracion, entidades: [evento:un-angel-libera-a-los-apostoles, persona:pedro, lugar:monte-moria], menciona: [lugar:jerusalen], nota: "Los apóstoles hacen milagros y se reúnen en el Pórtico de Salomón, en el recinto del templo. Crecen los creyentes; sacan enfermos a la calle para que los toque la sombra de Pedro, y traen más de los pueblos vecinos."}
    - {v: 17-26, tipo: narracion, entidades: [evento:un-angel-libera-a-los-apostoles, persona:caifas, lugar:monte-moria], nota: "Celosos, el sumo sacerdote, Caifás según «Testimonio completo», y los saduceos encarcelan a los apóstoles. De noche el ángel de Jehová los saca; al amanecer enseñan en el templo y el capitán del templo los vuelve a traer, sin violencia."}
    - {v: 27-32, tipo: narracion, entidades: [evento:consejo-de-gamaliel, persona:pedro, persona:juan-apostol, persona:caifas], menciona: [persona:jesus, lugar:jerusalen], nota: "Caifás les reprocha haber llenado Jerusalén con su enseñanza. Pedro y los demás, Juan entre ellos según Perspicacia, contestan que Dios manda antes que los hombres: Dios resucitó a Jesús y lo puso a su derecha como Salvador."}
    - {v: 33-39, tipo: narracion, entidades: [evento:consejo-de-gamaliel, persona:gamaliel-fariseo, relacion:gamaliel-fariseo/vivio_en/jerusalen, persona:teudas, persona:judas-el-galileo, relacion:judas-el-galileo/vivio_en/galilea], menciona: [persona:quirinio, lugar:galilea], nota: "Gamaliel hace salir a los apóstoles y recuerda a Teudas y a Judas el galileo, cuyos grupos se deshicieron al morir ellos. Esas revueltas, de hacia el año 6, solo se citan: no son eventos. Aconseja dejarlos."}
    - {v: 40-42, tipo: narracion, entidades: [evento:consejo-de-gamaliel, lugar:monte-moria], menciona: [persona:jesus], nota: "Los golpean, seguramente con los 40 golpes menos uno de la Ley, les prohíben hablar de Jesús y los sueltan. Salen alegres y, cada día, siguen enseñando en el templo y yendo de casa en casa."}
  6:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: narracion, entidades: [evento:nombramiento-de-los-siete, persona:esteban, persona:felipe-evangelizador, persona:procoro, persona:nicanor, persona:timon, persona:parmenas, persona:nicolas, lugar:antioquia-de-siria, relacion:esteban/acompana/felipe-evangelizador, relacion:felipe-evangelizador/acompana/esteban, relacion:procoro/acompana/esteban, relacion:nicanor/acompana/esteban, relacion:timon/acompana/esteban, relacion:parmenas/acompana/esteban, relacion:nicolas/acompana/esteban, relacion:nicolas/vivio_en/antioquia-de-siria, relacion:esteban/vivio_en/jerusalen, relacion:felipe-evangelizador/vivio_en/jerusalen, relacion:procoro/vivio_en/jerusalen, relacion:nicanor/vivio_en/jerusalen, relacion:timon/vivio_en/jerusalen, relacion:parmenas/vivio_en/jerusalen, relacion:nicolas/vivio_en/jerusalen], menciona: [lugar:jerusalen], nota: "Las viudas de los judíos de habla griega quedan fuera del reparto diario. Los Doce piden siete hombres; eligen a siete de nombre griego y los apóstoles, tras orar, les imponen las manos. Muchos sacerdotes se hacen creyentes."}
    - {v: 8-15, tipo: narracion, entidades: [evento:discurso-de-esteban, persona:esteban, lugar:alejandria], menciona: [lugar:cirene, lugar:cilicia, lugar:asia, persona:moises, persona:jesus, lugar:nazaret, lugar:monte-moria, persona:caifas], nota: "Esteban hace grandes milagros. Los de la Sinagoga de los Libertos y judíos de Cirene, Alejandría, Cilicia y Asia no pueden con él; con testigos falsos lo acusan ante el Sanedrín de hablar contra Moisés y el templo."}
  7:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, entidades: [evento:discurso-de-esteban, persona:esteban, persona:caifas], menciona: [periodo:sumo-sacerdocio-de-caifas], nota: "Ante el Sanedrín, el sumo sacerdote pregunta a Esteban si es verdad lo que le achacan. La nota de estudio dice que ese sumo sacerdote es Caifás."}
    - {v: 2-8, tipo: discurso, entidades: [evento:discurso-de-esteban, persona:abrahan, persona:tare, persona:isaac, persona:jacob, lugar:mesopotamia, lugar:haran, lugar:caldea, evento:tare-sale-de-ur, evento:pacto-con-abrahan, evento:pacto-de-los-animales-partidos, evento:pacto-de-la-circuncision, evento:nacimiento-de-isaac, relacion:abrahan/vivio_en/ur, relacion:abrahan/vivio_en/haran, relacion:abrahan/vivio_en/canaan, relacion:tare/murio_en/haran, relacion:isaac/pariente/abrahan, relacion:jacob/pariente/isaac], menciona: [lugar:ur, lugar:canaan, evento:abran-llega-a-siquem, evento:isaac-destetado-e-ismael-se-burla, evento:nacimiento-de-esau-y-jacob], nota: "De la llamada de Abrahán a los doce patriarcas. Según la nota de 7:3, Dios le habló ya en Ur y se lo repitió en Harán; la de 7:6 cuenta los 400 años de aflicción desde 1913 a.e.c."}
    - {v: 9-16, tipo: discurso, entidades: [evento:discurso-de-esteban, persona:jose-hijo-de-jacob, persona:jacob, persona:hamor, lugar:egipto, lugar:canaan, lugar:siquem, evento:sus-hermanos-venden-a-jose, evento:jose-gobernador-de-egipto, evento:empiezan-los-siete-anos-de-hambre, evento:hermanos-de-jose-compran-grano-en-egipto, evento:jose-se-da-a-conocer, evento:faraon-invita-a-la-familia-de-jacob, evento:jose-recibe-a-jacob-en-gosen, evento:muerte-de-jacob, evento:muerte-de-jose, relacion:jose-hijo-de-jacob/pariente/jacob, relacion:jose-hijo-de-jacob/vivio_en/egipto, relacion:jacob/vivio_en/canaan, relacion:jacob/vivio_en/egipto, relacion:jacob/murio_en/egipto, relacion:hamor/vivio_en/siquem], menciona: [persona:abrahan, evento:jose-cuenta-sus-suenos, evento:jacob-compra-un-campo-junto-a-siquem, evento:abrahan-compra-la-cueva-de-macpela], nota: "Los 75 de 7:14 contarían familia más amplia (nota de estudio). Perspicacia «Siquem» lee 7:16 como frase abreviada, o como compra atribuida a Abrahán por ser el cabeza: el campo lo compró Jacob. El faraón no tiene nombre."}
    - {v: 17-22, tipo: discurso, entidades: [evento:discurso-de-esteban, persona:moises, lugar:egipto, evento:egipto-esclaviza-a-israel, evento:el-faraon-manda-echar-al-nilo-a-los-ninos, evento:nacimiento-de-moises, relacion:moises/nacio_en/egipto, relacion:moises/vivio_en/egipto], menciona: [persona:abrahan, persona:jose-hijo-de-jacob], nota: "Un rey que no conocía a José esclaviza al pueblo y obliga a abandonar a los bebés. La hija del faraón, sin nombre, cría a Moisés; su educación egipcia es un dato que solo da Esteban."}
    - {v: 23-29, tipo: discurso, entidades: [evento:discurso-de-esteban, persona:moises, lugar:madian, evento:moises-mata-a-un-egipcio, evento:moises-huye-a-madian, evento:nacimiento-de-guersom, relacion:moises/vivio_en/madian], menciona: [lugar:egipto, persona:guersom-hijo-de-moises, persona:eliezer-hijo-de-moises], nota: "A los 40 años, edad que solo da Esteban, Moisés mata al egipcio que maltrataba a un israelita. Al día siguiente lo rechazan y huye a Madián, donde tiene dos hijos que el texto no nombra."}
    - {v: 30-35, tipo: discurso, entidades: [evento:discurso-de-esteban, persona:moises, lugar:monte-sinai, lugar:desierto-de-sinai, evento:moises-ante-la-zarza-ardiente], menciona: [persona:abrahan, persona:isaac, persona:jacob, lugar:egipto], nota: "Cuarenta años después, un ángel se le aparece en la zarza y Jehová lo manda como gobernante y libertador. La nota de 7:30 pone la estancia en Madián entre 1553 y 1513 a.e.c."}
    - {v: 36-38, tipo: discurso, entidades: [evento:discurso-de-esteban, persona:moises, lugar:mar-rojo, evento:exodo, evento:israel-cruza-el-mar-rojo], menciona: [lugar:egipto, lugar:monte-sinai, evento:jehova-ofrece-su-pacto-a-israel, evento:diez-mandamientos, evento:moises-recibe-las-decisiones-judiciales], nota: "Moisés saca al pueblo con prodigios en tierra egipcia, junto al mar Rojo y durante 40 años de desierto (1513 a 1473 a.e.c.). Anunció un profeta como él y, por medio de un ángel, recibió la Ley en el Sinaí."}
    - {v: 39-43, tipo: discurso, entidades: [evento:discurso-de-esteban, persona:aaron, evento:becerro-de-oro], menciona: [persona:moises, lugar:egipto, lugar:babilonia, persona:amos-profeta], nota: "El pueblo pide dioses a Aarón y adora un becerro. Esteban cita Amós 5:25-27: cargaron la tienda de Moloc y la estrella de Refán, dioses sin ficha, y serán desterrados más allá de Babilonia."}
    - {v: 44-50, tipo: discurso, entidades: [evento:discurso-de-esteban, persona:josue-hijo-de-nun, persona:david, persona:salomon, evento:jehova-da-a-moises-el-modelo-del-tabernaculo, evento:entrada-en-canaan, evento:templo-de-salomon-empieza, evento:templo-de-salomon-terminado], menciona: [persona:moises, persona:jacob, persona:isaias, evento:conquista-de-canaan, evento:pacto-con-david, evento:se-monta-el-tabernaculo], nota: "La tienda del Testimonio, hecha según el modelo, entra en la tierra con Josué y sigue hasta David, que pide hacer una morada a Dios; la casa la construye Salomón. Cita Isaías 66:1, 2."}
    - {v: 51-53, tipo: discurso, entidades: [evento:discurso-de-esteban], menciona: [persona:jesus], nota: "Esteban llama tercos a sus jueces: sus padres persiguieron a los profetas y ellos han traicionado y matado al Justo. Recibieron la Ley por medio de ángeles, dato que añade Esteban, y no la cumplen."}
    - {v: 54-60, tipo: narracion, entidades: [evento:muerte-de-esteban, persona:esteban, persona:jesus, persona:pablo, lugar:jerusalen, relacion:esteban/murio_en/jerusalen, relacion:jesus/se_aparece_a/esteban], menciona: [evento:entierro-de-esteban], nota: "Esteban ve a Jesús en pie a la derecha de Dios. Lo sacan de la ciudad y lo apedrean ante Saulo, que guarda los mantos. Pide a Jesús que reciba su espíritu y ruega a Jehová por ellos."}
  8:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: narracion, entidades: [evento:muerte-de-esteban, evento:dispersion-de-los-discipulos, evento:entierro-de-esteban, evento:saulo-persigue-a-la-congregacion, viaje:primeros-anos-de-pablo, persona:pablo, persona:esteban, lugar:jerusalen, lugar:judea, lugar:region-de-samaria], nota: "Saulo aprueba la muerte de Esteban. Estalla una gran persecución y todos menos los apóstoles se dispersan por Judea y Samaria. Hombres devotos entierran a Esteban; Saulo saca de sus casas a hombres y mujeres y los encarcela."}
