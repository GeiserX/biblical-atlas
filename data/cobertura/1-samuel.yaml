    - {v: 10-12, tipo: narracion, entidades: [evento:ecron-pide-que-se-devuelva-el-arca, lugar:ecron, lugar:gat], nota: "Los ecronitas y los gobernantes no tienen nombre. Sus gritos llegan hasta los cielos."}
  6:
    estado: completo
