    - {v: 14-16, tipo: narracion, entidades: [persona:saul], menciona: [persona:samuel], nota: "Saúl cuenta a su tío que Samuel le dijo que los burros habían aparecido, y calla lo del reino. El tío no tiene nombre; Perspicacia no dice si era Abner."}
    - {v: 17-19, tipo: discurso, entidades: [evento:saul-elegido-rey-en-mizpa, lugar:mizpa-de-benjamin, persona:samuel], menciona: [lugar:egipto, evento:exodo], nota: "Samuel recuerda que Jehová sacó a Israel de Egipto y que, al pedir rey, el pueblo lo ha rechazado."}
    - {v: 20-25, tipo: narracion, entidades: [evento:saul-elegido-rey-en-mizpa, persona:saul, persona:samuel, relacion:saul/pariente/quis-hijo-de-ner, periodo:saul], nota: "Benjamín es la tribu y los matritas su familia, sin ficha: Perspicacia «Abiel» dice que Matri no sale en la Biblia. Samuel pone por escrito los derechos del rey."}
    - {v: 26-27, tipo: narracion, entidades: [evento:saul-vuelve-a-guibea, lugar:guibea-de-benjamin, persona:saul, relacion:saul/vivio_en/guibea-de-benjamin, relacion:quis-hijo-de-ner/vivio_en/guibea-de-benjamin], nota: "Los guerreros que lo acompañan y los hombres inútiles no tienen nombre."}
