    - {v: 19-20, tipo: narracion, entidades: [evento:nacimiento-de-samuel, persona:samuel, persona:ana-madre-de-samuel, persona:elcana-hijo-de-jeroham, lugar:ramataim-zofim, relacion:samuel/pariente/elcana-hijo-de-jeroham, relacion:samuel/pariente/ana-madre-de-samuel, relacion:samuel/nacio_en/ramataim-zofim, relacion:ana-madre-de-samuel/vivio_en/ramataim-zofim, relacion:penina/vivio_en/ramataim-zofim]}
    - {v: 21-28, tipo: narracion, entidades: [evento:ana-lleva-a-samuel-a-silo, persona:ana-madre-de-samuel, persona:samuel, persona:elcana-hijo-de-jeroham, persona:eli, lugar:silo, relacion:samuel/vivio_en/silo], nota: "El sujeto de «se inclinó» en 1:28 parece ser Elcaná, según la nota al pie."}
