    - {v: 10-16, tipo: narracion, entidades: [evento:las-vacas-llevan-el-arca-a-bet-semes, persona:josue-el-betsemita, lugar:bet-semes, lugar:ecron, relacion:josue-el-betsemita/vivio_en/bet-semes], nota: "Cosechaban trigo en la llanura. La carreta se hace leña y las vacas, ofrenda quemada. Los levitas que bajan el Arca no tienen nombre."}
    - {v: 17-18, tipo: lista, entidades: [evento:las-vacas-llevan-el-arca-a-bet-semes, persona:josue-el-betsemita], menciona: [lugar:asdod, lugar:gaza, lugar:asquelon, lugar:gat, lugar:ecron], nota: "Una hemorroide de oro por cada ciudad de un gobernante; tantos ratones como ciudades y aldeas filisteas. La gran piedra del campo de Josué no tiene nombre propio."}
    - {v: 19-21, tipo: narracion, entidades: [evento:jehova-castiga-a-los-de-bet-semes-por-mirar-el-arca, lugar:bet-semes, lugar:quiryat-jearim], nota: "La TNM da 50.070 muertos y en la nota al pie el hebreo literal. Perspicacia «Bet-semes» cuenta 70 y ve añadidos los 50.000. El traslado sigue en 1Sa 7:1."}
  7:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: narracion, entidades: [evento:el-arca-queda-en-casa-de-abinadab, persona:abinadab-de-quiryat-jearim, persona:eleazar-hijo-de-abinadab, lugar:quiryat-jearim, relacion:abinadab-de-quiryat-jearim/vivio_en/quiryat-jearim, relacion:eleazar-hijo-de-abinadab/pariente/abinadab-de-quiryat-jearim, relacion:eleazar-hijo-de-abinadab/vivio_en/quiryat-jearim], nota: "Sigue al mensaje de 1Sa 6:21. Las referencias llevan al traslado del Arca por David (2Sa 6:2-4; 1Cr 13:5-7), suceso que crea 2 Samuel."}
    - {v: 3-4, tipo: narracion, entidades: [evento:samuel-exhorta-a-israel-a-servir-solo-a-jehova, persona:samuel], menciona: [lugar:filistea], nota: "Los Baales y Astoret son dioses, sin ficha. Los filisteos son un pueblo; su tierra va en menciona."}
    - {v: 5-6, tipo: narracion, entidades: [evento:samuel-reune-a-israel-en-mizpa, persona:samuel, lugar:mizpa-de-benjamin], nota: "Derramar agua y ayunar acompañan la confesión. Desde aquí Samuel juzga a Israel."}
    - {v: 7-12, tipo: narracion, entidades: [evento:jehova-derrota-a-los-filisteos-en-mizpa, persona:samuel, lugar:mizpa-de-benjamin, lugar:bet-car, lugar:jesana], menciona: [lugar:filistea], nota: "Ebenézer, «piedra de ayuda», es la piedra que Samuel levanta: va en nombres de Mizpá, no es el Ebenézer de 1Sa 4:1. Los gobernantes filisteos no tienen nombre."}
    - {v: 13-14, tipo: narracion, entidades: [evento:jehova-derrota-a-los-filisteos-en-mizpa, lugar:ecron, lugar:gat], menciona: [persona:samuel, lugar:israel, lugar:filistea], nota: "Los filisteos ya no invaden en los días de Samuel e Israel recobra sus ciudades, de Ecrón a Gat. Los amorreos son un pueblo sin ficha."}
    - {v: 15-17, tipo: narracion, entidades: [evento:samuel-juzga-a-israel-en-su-recorrido-anual, persona:samuel, lugar:ramataim-zofim, lugar:betel, lugar:mizpa-de-benjamin, relacion:samuel/vivio_en/ramataim-zofim], menciona: [lugar:guilgal, lugar:guilgal-cerca-de-betel], nota: "Perspicacia «Guilgal» no sabe si la del recorrido es la de junto a Jericó (núm. 1) o la de cerca de Betel (núm. 2): las dos van en menciona."}
  8:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: narracion, entidades: [evento:samuel-nombra-jueces-a-joel-y-abias, persona:samuel, persona:joel-hijo-de-samuel, persona:abias-hijo-de-samuel, lugar:beer-seba, relacion:joel-hijo-de-samuel/pariente/samuel, relacion:joel-hijo-de-samuel/pariente/abias-hijo-de-samuel, relacion:joel-hijo-de-samuel/vivio_en/beer-seba, relacion:abias-hijo-de-samuel/pariente/samuel, relacion:abias-hijo-de-samuel/vivio_en/beer-seba], nota: "La referencia lleva a 1Cr 6:28, que repite los dos hijos."}
    - {v: 4-9, tipo: narracion, entidades: [evento:israel-pide-un-rey, persona:samuel, lugar:ramataim-zofim], menciona: [lugar:egipto, evento:exodo], nota: "Jehová dice que al pedir rey lo rechazan a él, como hacen desde que salieron de Egipto, y manda a Samuel que les advierta."}
    - {v: 10-18, tipo: discurso, entidades: [evento:israel-pide-un-rey], nota: "Samuel explica lo que exigirá el rey: hijos para sus carros y sus campos, hijas para su casa, tierras, la décima parte de cosechas y rebaños, y siervos."}
    - {v: 19-22, tipo: narracion, entidades: [evento:israel-pide-un-rey, persona:samuel], nota: "El pueblo insiste en ser como las demás naciones y Jehová manda darles rey. La referencia lleva a Os 13:11."}
