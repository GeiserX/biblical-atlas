    - {v: 1-2, tipo: genealogia, entidades: [persona:quis-hijo-de-ner, persona:abiel-hijo-de-zeror, persona:zeror, persona:becorat, persona:afias, persona:saul, relacion:quis-hijo-de-ner/pariente/abiel-hijo-de-zeror, relacion:abiel-hijo-de-zeror/pariente/zeror, relacion:zeror/pariente/becorat, relacion:becorat/pariente/afias, relacion:saul/pariente/quis-hijo-de-ner], nota: "Benjamín es aquí la tribu, sin ficha. Perspicacia «Abiel», núm. 1, lee «hijo de Abiel» como nieto: entre los dos va Ner."}
