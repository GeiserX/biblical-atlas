    - {v: 18-21, tipo: narracion, entidades: [evento:eli-bendice-a-elcana-y-a-ana, persona:samuel, persona:ana-madre-de-samuel, persona:elcana-hijo-de-jeroham, persona:eli, relacion:samuel/pariente/ana-madre-de-samuel]}
    - {v: 22-26, tipo: narracion, entidades: [evento:los-hijos-de-eli-desprecian-las-ofrendas, persona:eli, persona:hofni, persona:finehas-hijo-de-eli, persona:samuel], nota: "Elí reprende a sus hijos, que se acostaban con las mujeres que hacían servicio junto a la tienda de reunión. Samuel sigue creciendo con el favor de Jehová y de la gente."}
    - {v: 27-36, tipo: profecia, entidades: [evento:un-hombre-de-dios-anuncia-el-juicio-contra-la-casa-de-eli, persona:eli, persona:hofni, persona:finehas-hijo-de-eli, relacion:eli/pariente/aaron, relacion:hofni/pariente/finehas-hijo-de-eli], menciona: [persona:aaron, lugar:egipto], nota: "Se cumple con la muerte de Hofní y Finehás (1Sa 4:11) y cuando Salomón quita a Abiatar y pone a Sadoc (1Re 2:27, 35; Perspicacia «Sadoc», núm. 1). Los de Nob mueren en 1Sa 22."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-18, tipo: narracion, entidades: [evento:jehova-llama-a-samuel, persona:samuel, persona:eli, lugar:silo, relacion:samuel/acompana/eli, relacion:samuel/vivio_en/silo, relacion:eli/vivio_en/silo], nota: "El templo de 3:3 es el tabernáculo (nota al pie). Jehová confirma el castigo que ya anunció contra la casa de Elí porque este no frenó a sus hijos, que ofendían a Dios."}
    - {v: 19-21, tipo: narracion, entidades: [evento:todo-israel-reconoce-a-samuel-como-profeta, persona:samuel, lugar:silo], menciona: [lugar:dan, lugar:beer-seba, lugar:israel], nota: "De Dan a Beer-Seba es la fórmula de los dos extremos del país."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: narracion, entidades: [evento:todo-israel-reconoce-a-samuel-como-profeta, evento:los-filisteos-derrotan-a-israel-junto-a-ebenezer, lugar:ebenezer, lugar:antipatris], menciona: [persona:samuel], nota: "4:1a cierra el capítulo 3. Afec es la núm. 3 de Perspicacia «Afeq», en la ficha de Antípatris. Los filisteos son un pueblo."}
    - {v: 3-9, tipo: narracion, entidades: [evento:israel-lleva-el-arca-al-campamento, persona:hofni, persona:finehas-hijo-de-eli, lugar:silo, lugar:ebenezer, relacion:hofni/pariente/eli, relacion:hofni/pariente/finehas-hijo-de-eli, relacion:finehas-hijo-de-eli/pariente/eli, relacion:hofni/vivio_en/silo, relacion:finehas-hijo-de-eli/vivio_en/silo], menciona: [lugar:egipto], nota: "Los ancianos no tienen nombre. Los filisteos recuerdan los golpes de Dios a Egipto y temen servir a los hebreos como estos les sirvieron (Jue 13:1)."}
    - {v: 10-11, tipo: narracion, entidades: [evento:los-filisteos-capturan-el-arca, persona:hofni, persona:finehas-hijo-de-eli, lugar:ebenezer, lugar:antipatris, relacion:hofni/murio_en/ebenezer, relacion:finehas-hijo-de-eli/murio_en/ebenezer]}
    - {v: 12-18, tipo: narracion, entidades: [evento:muerte-de-eli, persona:eli, lugar:silo, relacion:eli/murio_en/silo], nota: "El mensajero, de la tribu de Benjamín, no tiene nombre. Elí tenía 98 años y había juzgado a Israel 40."}
    - {v: 19-22, tipo: narracion, entidades: [evento:nacimiento-de-icabod, persona:icabod, persona:finehas-hijo-de-eli, persona:eli, lugar:silo, relacion:icabod/pariente/finehas-hijo-de-eli, relacion:icabod/pariente/eli], nota: "La esposa de Finehás no tiene nombre. Icabod quiere decir «¿dónde está la gloria?» (nota al pie)."}
