    - {v: 18-21, tipo: narracion, entidades: [evento:samuel-recibe-a-saul, persona:samuel, persona:saul], nota: "Saúl se presenta como de la tribu más pequeña, Benjamín, y de la familia más humilde de ella."}
    - {v: 22-25, tipo: narracion, entidades: [evento:samuel-recibe-a-saul, persona:samuel, persona:saul], nota: "Unos 30 invitados comen en el comedor del lugar alto. El cocinero no tiene nombre."}
    - {v: 26-27, tipo: narracion, entidades: [evento:saul-ungido-rey, persona:samuel, persona:saul], nota: "Samuel hace que el sirviente se adelante para darle a Saúl un mensaje de Dios a solas."}
  10:
    estado: completo
    revisado: 2026-09-29
    tramos:
