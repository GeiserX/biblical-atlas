    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: narracion, entidades: [evento:nahas-sitia-jabes-galaad, persona:nahas-rey-de-ammon, lugar:jabes-galaad, relacion:nahas-rey-de-ammon/vivio_en/ammon], menciona: [lugar:galaad, lugar:israel, lugar:ammon]}
    - {v: 4-7, tipo: narracion, entidades: [evento:saul-reune-a-israel-contra-nahas, persona:saul, lugar:guibea-de-benjamin, relacion:saul/vivio_en/guibea-de-benjamin], menciona: [persona:samuel, lugar:israel]}
    - {v: 8-10, tipo: narracion, entidades: [evento:saul-pasa-revista-al-ejercito-en-bezec, persona:saul, lugar:bezec-cerca-de-siquem], menciona: [lugar:jabes-galaad, lugar:galaad, lugar:bezec], nota: "Judá se cuenta aparte, como pueblo, sin ficha. La otra Bézec, la de Adoni-Bézec, va en menciona porque su ficha nombra este versículo para distinguirse."}
    - {v: 11-13, tipo: narracion, entidades: [evento:saul-derrota-a-los-ammonitas-en-jabes-galaad, persona:saul, persona:samuel, lugar:jabes-galaad], nota: "Los que despreciaron a Saúl son los de 1Sa 10:27."}
    - {v: 14-15, tipo: narracion, entidades: [evento:saul-confirmado-rey-en-guilgal, persona:samuel, persona:saul, lugar:guilgal], menciona: [evento:saul-ungido-rey]}
  12:
