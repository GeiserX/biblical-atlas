# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: lucas
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: narracion, entidades: [persona:lucas, persona:teofilo], nota: "Prólogo. Lucas no presenció los hechos: los investigó desde el comienzo y los ordena por escrito para el excelentísimo Teófilo, que ya los había aprendido de palabra."}
    - {v: 5-7, tipo: narracion, entidades: [evento:anuncio-a-zacarias, persona:zacarias-padre-de-juan, persona:elisabet, persona:abias-de-tiempos-de-david, relacion:zacarias-padre-de-juan/pariente/elisabet, relacion:elisabet/pariente/zacarias-padre-de-juan, relacion:elisabet/pariente/aaron, relacion:zacarias-padre-de-juan/pariente/aaron], menciona: [persona:herodes-el-grande, persona:aaron, lugar:judea], nota: "El Herodes del v. 5 es Herodes el Grande (nota de estudio). La división de Abías era el octavo turno sacerdotal; según la nota, no prueba que Zacarías descendiera de ese Abías."}
    - {v: 8-23, tipo: narracion, entidades: [evento:anuncio-a-zacarias, persona:zacarias-padre-de-juan, persona:gabriel, lugar:jerusalen, lugar:monte-moria], menciona: [persona:juan-el-bautista, persona:elisabet, persona:elias-profeta], nota: "Gabriel se aparece junto al altar del incienso, en el Santo. El texto no nombra Jerusalén: la tabla A7-A pone el suceso en su templo. Juan irá con el espíritu y el poder de Elías."}
    - {v: 24-25, tipo: narracion, entidades: [evento:anuncio-a-zacarias, persona:elisabet], nota: "Elisabet queda embarazada y pasa cinco meses sin salir de casa. Va dentro del anuncio a Zacarías, como en la fila 1 de A7-A (Lu 1:5-25)."}
    - {v: 26-38, tipo: narracion, entidades: [evento:anuncio-a-maria, persona:gabriel, persona:maria-madre-de-jesus, persona:jose-esposo-de-maria, persona:jesus, lugar:nazaret, relacion:maria-madre-de-jesus/vivio_en/nazaret, relacion:maria-madre-de-jesus/pariente/jose-esposo-de-maria, relacion:jose-esposo-de-maria/pariente/david, relacion:jesus/pariente/david, relacion:maria-madre-de-jesus/pariente/david, relacion:maria-madre-de-jesus/pariente/elisabet, relacion:elisabet/pariente/maria-madre-de-jesus, relacion:jesus/pariente/juan-el-bautista], menciona: [lugar:galilea, persona:david, persona:jacob, persona:elisabet], nota: "La casa de Jacob es su descendencia, el pueblo de Israel. Según la nota del v. 36, María y Elisabet eran parientes, pero no se sabe en qué grado."}
    - {v: 39-45, tipo: narracion, entidades: [evento:maria-visita-a-elisabet, persona:maria-madre-de-jesus, persona:elisabet, persona:zacarias-padre-de-juan, lugar:judea, relacion:zacarias-padre-de-juan/vivio_en/judea, relacion:elisabet/vivio_en/judea], menciona: [lugar:juda, persona:juan-el-bautista], nota: "La ciudad de Judá no tiene nombre. La nota del v. 39 calcula un viaje de tres o cuatro días desde Nazaret, de 100 km o más."}
    - {v: 46-55, tipo: poesia, entidades: [evento:maria-visita-a-elisabet, persona:maria-madre-de-jesus], menciona: [persona:abrahan], nota: "Alabanza de María a Jehová. La nota de estudio encuentra más de veinte ecos de las Escrituras Hebreas, muchos de la oración de Ana (1Sa 2:1-10). Israel es aquí el pueblo."}
    - {v: "56", tipo: narracion, entidades: [evento:maria-visita-a-elisabet, persona:maria-madre-de-jesus], nota: "Tras unos tres meses, María vuelve a su casa; Perspicacia «María» dice que a Nazaret."}
    - {v: 57-66, tipo: narracion, entidades: [evento:nacimiento-de-juan-el-bautista, persona:juan-el-bautista, persona:elisabet, persona:zacarias-padre-de-juan, lugar:judea, relacion:juan-el-bautista/pariente/zacarias-padre-de-juan, relacion:juan-el-bautista/pariente/elisabet, relacion:zacarias-padre-de-juan/pariente/juan-el-bautista, relacion:elisabet/pariente/juan-el-bautista, relacion:juan-el-bautista/nacio_en/judea], nota: "Al octavo día circuncidan al niño. Elisabet, y luego Zacarías en una tablilla, le ponen Juan, y él vuelve a hablar. Los vecinos y los parientes no tienen nombre."}
    - {v: 67-79, tipo: profecia, entidades: [evento:nacimiento-de-juan-el-bautista, persona:zacarias-padre-de-juan, persona:juan-el-bautista], menciona: [persona:david, persona:abrahan, persona:jesus], nota: "Profecía de Zacarías: Dios levanta un salvador de la casa de David, como juró a Abrahán, y el niño será profeta que prepare el camino de Jehová (Is 40:3; Mal 3:1)."}
    - {v: "80", tipo: narracion, entidades: [evento:nacimiento-de-juan-el-bautista, persona:juan-el-bautista], menciona: [evento:juan-comienza-su-ministerio], nota: "Juan crece en el desierto, que ni el texto ni jw.org identifican, hasta presentarse a Israel. La nota de estudio lo pone hacia abril de 29 e.c."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: narracion, entidades: [evento:nacimiento-de-jesus, persona:augusto, persona:quirinio, persona:jose-esposo-de-maria, persona:maria-madre-de-jesus, persona:jesus, lugar:siria, lugar:galilea, lugar:judea, lugar:nazaret, lugar:belen, relacion:quirinio/vivio_en/siria, relacion:jose-esposo-de-maria/pariente/david, relacion:jose-esposo-de-maria/pariente/maria-madre-de-jesus, relacion:jose-esposo-de-maria/vivio_en/nazaret, relacion:jesus/nacio_en/belen, relacion:maria-madre-de-jesus/pariente/jesus, relacion:jesus/pariente/maria-madre-de-jesus], menciona: [persona:david, periodo:augusto], nota: "El censo de Augusto, el primero, cuando Quirinio gobernaba Siria, lleva a José y a María de Nazaret a Belén, que Lucas llama ciudad de David. Allí nace Jesús, su primer hijo."}
    - {v: 8-14, tipo: narracion, entidades: [evento:pastores-visitan-a-jesus, persona:jesus, lugar:belen], menciona: [persona:david], nota: "El ángel de Jehová, sin nombre, anuncia a los pastores que ha nacido el Cristo; un ejército celestial alaba a Dios. La nota de 2:8 ve en los pastores al raso una señal de antes de las lluvias."}
    - {v: 15-20, tipo: narracion, entidades: [evento:pastores-visitan-a-jesus, persona:jesus, persona:maria-madre-de-jesus, persona:jose-esposo-de-maria, lugar:belen]}
    - {v: 21-24, tipo: narracion, entidades: [evento:presentacion-en-el-templo, persona:jesus, persona:maria-madre-de-jesus, persona:jose-esposo-de-maria, lugar:jerusalen, lugar:monte-moria], menciona: [persona:moises], nota: "Circuncisión al octavo día y, pasados los días de purificación, la presentación en el templo. Las dos aves eran la ofrenda de los pobres, según la nota de 2:24."}
    - {v: 25-35, tipo: narracion, entidades: [evento:presentacion-en-el-templo, persona:simeon-del-templo, persona:jesus, persona:maria-madre-de-jesus, lugar:jerusalen, relacion:simeon-del-templo/vivio_en/jerusalen, lugar:monte-moria], nota: "Israel aquí es el pueblo, sin ficha. Simeón llama al niño luz para las naciones y avisa a María del dolor que le espera."}
    - {v: 36-38, tipo: narracion, entidades: [evento:presentacion-en-el-templo, persona:ana-profetisa, persona:fanuel, persona:jesus, lugar:jerusalen, relacion:ana-profetisa/pariente/fanuel, relacion:ana-profetisa/vivio_en/jerusalen, relacion:fanuel/pariente/aser-hijo-de-jacob, lugar:monte-moria], nota: "La tribu de Aser es el pueblo, sin ficha; su antepasado queda en la relación de Fanuel. El esposo de Ana no tiene nombre."}
    - {v: 39-40, tipo: narracion, entidades: [evento:regreso-a-nazaret, persona:jesus, lugar:galilea, lugar:nazaret, relacion:jesus/vivio_en/nazaret, relacion:maria-madre-de-jesus/vivio_en/nazaret], nota: "Lucas resume: la nota de 2:39 explica que entre medias van la visita de los astrólogos, la huida a Egipto y la vuelta que cuenta Mateo."}
    - {v: 41-50, tipo: narracion, entidades: [evento:jesus-en-el-templo-a-los-12, persona:jesus, persona:maria-madre-de-jesus, persona:jose-esposo-de-maria, lugar:jerusalen, relacion:jesus/pariente/jose-esposo-de-maria, lugar:monte-moria], nota: "Las primeras palabras de Jesús que recoge la Biblia: tenía que estar en la casa de su Padre."}
    - {v: 51-52, tipo: narracion, entidades: [evento:jesus-crece-en-nazaret, persona:jesus, persona:maria-madre-de-jesus, lugar:nazaret]}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: narracion, entidades: [evento:juan-comienza-su-ministerio, persona:juan-el-bautista, persona:tiberio, persona:poncio-pilato, persona:herodes-antipas, persona:filipo-el-tetrarca, persona:lisanias, lugar:judea, lugar:galilea, lugar:iturea, lugar:traconitide, lugar:abilene, lugar:desierto-de-juda, relacion:herodes-antipas/pariente/filipo-el-tetrarca, relacion:filipo-el-tetrarca/pariente/herodes-el-grande, relacion:filipo-el-tetrarca/vivio_en/iturea, relacion:filipo-el-tetrarca/vivio_en/traconitide, relacion:lisanias/vivio_en/abilene, relacion:juan-el-bautista/pariente/zacarias-padre-de-juan, relacion:juan-el-bautista/vivio_en/desierto-de-juda], menciona: [persona:anas, persona:caifas, persona:zacarias-padre-de-juan, periodo:tiberio, periodo:gobierno-de-poncio-pilato, periodo:sumo-sacerdocio-de-caifas], nota: "Lucas fecha el comienzo por seis gobernantes. El año 15 de Tiberio va de 28 a 29 e.c.; la nota lo pone en la primavera de 29. Anás ya no era sumo sacerdote, pero conservaba su poder."}
    - {v: 3-6, tipo: narracion, entidades: [evento:juan-comienza-su-ministerio, persona:juan-el-bautista, lugar:rio-jordan], menciona: [persona:isaias], nota: "La región del Jordán se apunta en el río Jordán, como en Mateo. La cita es de Is 40:3-5."}
    - {v: 7-9, tipo: discurso, entidades: [evento:juan-comienza-su-ministerio, persona:juan-el-bautista], menciona: [persona:abrahan], nota: "Juan llama crías de víboras a las multitudes y les avisa de que ser hijos de Abrahán no basta: hacen falta frutos del arrepentimiento."}
    - {v: 10-14, tipo: discurso, entidades: [evento:juan-comienza-su-ministerio, persona:juan-el-bautista], nota: "Consejos a la gente, a los cobradores de impuestos y a los soldados, que la nota cree judíos: compartir, no cobrar de más, no extorsionar y conformarse con la paga."}
    - {v: 15-18, tipo: discurso, entidades: [evento:juan-comienza-su-ministerio, persona:juan-el-bautista], nota: "La gente se pregunta si Juan es el Cristo. Él anuncia a uno más fuerte que bautizará con espíritu santo y con fuego."}
    - {v: 19-20, tipo: narracion, entidades: [evento:encarcelamiento-de-juan, persona:herodes-antipas, persona:juan-el-bautista, persona:herodias, persona:filipo-esposo-de-herodias, relacion:herodes-antipas/pariente/herodias, relacion:herodes-antipas/pariente/filipo-esposo-de-herodias, relacion:filipo-esposo-de-herodias/pariente/herodias], nota: "Lucas adelanta aquí el arresto, que la tabla A7-B pone en 30 e.c. El hermano sin nombre es Herodes Filipo, primer esposo de Herodías, según Perspicacia «Filipo», núm. 1."}
    - {v: 21-22, tipo: narracion, entidades: [evento:bautismo-de-jesus, persona:jesus], nota: "Lucas no nombra aquí ni a Juan ni el lugar. Solo él dice que Jesús oraba; la voz del cielo es la primera de tres, según la nota de 3:22."}
    - {v: 23-27, tipo: genealogia, entidades: [persona:jesus, persona:jose-esposo-de-maria, persona:maria-madre-de-jesus, persona:heli, persona:matat-padre-de-heli, persona:levi-hijo-de-melqui, persona:melqui-hijo-de-janai, persona:janai-hijo-de-jose, persona:jose-hijo-de-matatias, persona:matatias-hijo-de-amos, persona:amos-hijo-de-nahum, persona:nahum-hijo-de-esli, persona:esli, persona:nagai, persona:maat, persona:matatias-hijo-de-semein, persona:semein, persona:josec, persona:joda, persona:joanan, persona:resa, persona:neri, persona:zorobabel, persona:sealtiel, relacion:jesus/pariente/jose-esposo-de-maria, relacion:heli/pariente/matat-padre-de-heli, relacion:matat-padre-de-heli/pariente/levi-hijo-de-melqui, relacion:levi-hijo-de-melqui/pariente/melqui-hijo-de-janai, relacion:melqui-hijo-de-janai/pariente/janai-hijo-de-jose, relacion:janai-hijo-de-jose/pariente/jose-hijo-de-matatias, relacion:jose-hijo-de-matatias/pariente/matatias-hijo-de-amos, relacion:matatias-hijo-de-amos/pariente/amos-hijo-de-nahum, relacion:amos-hijo-de-nahum/pariente/nahum-hijo-de-esli, relacion:nahum-hijo-de-esli/pariente/esli, relacion:esli/pariente/nagai, relacion:nagai/pariente/maat, relacion:maat/pariente/matatias-hijo-de-semein, relacion:matatias-hijo-de-semein/pariente/semein, relacion:semein/pariente/josec, relacion:josec/pariente/joda, relacion:joda/pariente/joanan, relacion:joanan/pariente/resa, relacion:resa/pariente/zorobabel, relacion:neri/pariente/melqui-hijo-de-adi, relacion:zorobabel/pariente/sealtiel, relacion:sealtiel/pariente/neri, relacion:maria-madre-de-jesus/pariente/heli, relacion:jose-esposo-de-maria/pariente/heli], menciona: [persona:amos-profeta], nota: "Unos 30 años al empezar. Lucas sigue la línea de María: José figura como hijo de Helí por ser su yerno, y Sealtiel, quizá por lo mismo, como hijo de Nerí (notas de 3:23 y 3:27)."}
    - {v: 28-31, tipo: genealogia, entidades: [persona:melqui-hijo-de-adi, persona:adi, persona:cosam, persona:elmadam, persona:er-hijo-de-jesus, persona:jesus-hijo-de-eliezer, persona:eliezer-hijo-de-jorim, persona:jorim, persona:matat-padre-de-jorim, persona:levi-hijo-de-simeon, persona:simeon-hijo-de-judas, persona:judas-hijo-de-jose, persona:jose-hijo-de-jonam, persona:jonam, persona:eliaquim-hijo-de-melea, persona:melea, persona:mena, persona:matata, persona:natan-hijo-de-david, persona:david, relacion:melqui-hijo-de-adi/pariente/adi, relacion:adi/pariente/cosam, relacion:cosam/pariente/elmadam, relacion:elmadam/pariente/er-hijo-de-jesus, relacion:er-hijo-de-jesus/pariente/jesus-hijo-de-eliezer, relacion:jesus-hijo-de-eliezer/pariente/eliezer-hijo-de-jorim, relacion:eliezer-hijo-de-jorim/pariente/jorim, relacion:jorim/pariente/matat-padre-de-jorim, relacion:matat-padre-de-jorim/pariente/levi-hijo-de-simeon, relacion:levi-hijo-de-simeon/pariente/simeon-hijo-de-judas, relacion:simeon-hijo-de-judas/pariente/judas-hijo-de-jose, relacion:judas-hijo-de-jose/pariente/jose-hijo-de-jonam, relacion:jose-hijo-de-jonam/pariente/jonam, relacion:jonam/pariente/eliaquim-hijo-de-melea, relacion:eliaquim-hijo-de-melea/pariente/melea, relacion:melea/pariente/mena, relacion:mena/pariente/matata, relacion:matata/pariente/natan-hijo-de-david, relacion:natan-hijo-de-david/pariente/david, relacion:natan-hijo-de-david/pariente/bat-seba, relacion:david/pariente/jese, relacion:jesus/pariente/david], nota: "De Nerí a David por Natán, no por Salomón como Mateo. La nota de 3:29 dice que el nombre Jesús equivale a Josué; algunos manuscritos leen José."}
    - {v: 32-34, tipo: genealogia, entidades: [persona:jese, persona:obed-hijo-de-boaz, persona:boaz, persona:salmon, persona:nahson, persona:aminadab-hijo-de-ram, persona:ram-hijo-de-hezron, persona:hezron-hijo-de-perez, persona:perez, persona:juda-hijo-de-jacob, persona:jacob, persona:isaac, persona:abrahan, persona:tare, persona:nacor-hijo-de-serug, relacion:jese/pariente/obed-hijo-de-boaz, relacion:obed-hijo-de-boaz/pariente/boaz, relacion:boaz/pariente/salmon, relacion:salmon/pariente/nahson, relacion:nahson/pariente/aminadab-hijo-de-ram, relacion:aminadab-hijo-de-ram/pariente/ram-hijo-de-hezron, relacion:ram-hijo-de-hezron/pariente/hezron-hijo-de-perez, relacion:hezron-hijo-de-perez/pariente/perez, relacion:perez/pariente/juda-hijo-de-jacob, relacion:juda-hijo-de-jacob/pariente/jacob, relacion:jacob/pariente/isaac, relacion:isaac/pariente/abrahan, relacion:abrahan/pariente/tare, relacion:tare/pariente/nacor-hijo-de-serug, relacion:nacor-hijo-de-serug/pariente/serug, relacion:jesus/pariente/abrahan], nota: "Arní es otra forma de Ram, según la nota de 3:33. Salmón sale como Sala en algunos manuscritos antiguos."}
    - {v: 35-38, tipo: genealogia, entidades: [persona:serug, persona:reu, persona:peleg, persona:eber-hijo-de-sela, persona:sela-hijo-de-arpaksad, persona:cainan-hijo-de-arpaksad, persona:arpaksad, persona:sem, persona:noe, persona:lamec-padre-de-noe, persona:matusalen, persona:enoc-hijo-de-jared, persona:jared, persona:mahalalel-hijo-de-quenan, persona:quenan, persona:enos, persona:set, persona:adan, relacion:cainan-hijo-de-arpaksad/pariente/arpaksad, relacion:serug/pariente/reu, relacion:reu/pariente/peleg, relacion:peleg/pariente/eber-hijo-de-sela, relacion:eber-hijo-de-sela/pariente/sela-hijo-de-arpaksad, relacion:arpaksad/pariente/sem, relacion:sem/pariente/noe, relacion:noe/pariente/lamec-padre-de-noe, relacion:lamec-padre-de-noe/pariente/matusalen, relacion:matusalen/pariente/enoc-hijo-de-jared, relacion:enoc-hijo-de-jared/pariente/jared, relacion:jared/pariente/mahalalel-hijo-de-quenan, relacion:mahalalel-hijo-de-quenan/pariente/quenan, relacion:quenan/pariente/enos, relacion:enos/pariente/set, relacion:set/pariente/adan, relacion:sela-hijo-de-arpaksad/pariente/cainan-hijo-de-arpaksad], nota: "El Cainán de 3:36 falta en unos pocos manuscritos y en el texto hebreo; el de 3:37 es Quenán. Lucas llega hasta Adán, hijo de Dios; Jehová no lleva ficha."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-13, tipo: narracion, entidades: [evento:tentacion-en-el-desierto, persona:jesus, persona:satanas, lugar:desierto-de-juda, lugar:jerusalen], menciona: [lugar:rio-jordan], nota: "Jesús deja el Jordán y pasa 40 días en el desierto. Lucas pone la tentación del templo al final; la nota de 4:5 cree más probable el orden de Mateo. Jesús responde con Deuteronomio."}
    - {v: 14-15, tipo: narracion, entidades: [evento:anuncio-del-reino-en-galilea, persona:jesus, lugar:galilea], nota: "Vuelve a Galilea con el poder del espíritu; enseña en las sinagogas y su fama se extiende."}
    - {v: 16-22, tipo: narracion, entidades: [evento:hijo-del-funcionario-y-sinagoga-de-nazaret, persona:jesus, lugar:nazaret, relacion:jesus/vivio_en/nazaret, relacion:jesus/pariente/jose-esposo-de-maria], menciona: [persona:isaias, persona:jose-esposo-de-maria], nota: "Un sábado lee en la sinagoga Is 61:1, 2 y se detiene antes del día de la venganza (nota de 4:19). Dice que hoy se cumple; lo admiran y preguntan si no es el hijo de José."}
    - {v: 23-27, tipo: narracion, entidades: [evento:hijo-del-funcionario-y-sinagoga-de-nazaret, persona:jesus, persona:elias-profeta, persona:eliseo, persona:naaman-el-sirio, lugar:sarepta, relacion:naaman-el-sirio/vivio_en/siria], menciona: [lugar:capernaum, lugar:israel, lugar:sidon, lugar:siria], nota: "Ningún profeta es bien recibido en su tierra: Elías fue a una viuda de Sarepta y Eliseo limpió solo a Naamán. Sucesos de 1Re 17 y 2Re 5, sin evento aún; los crea Reyes. La viuda no tiene nombre."}
    - {v: 28-30, tipo: narracion, entidades: [evento:hijo-del-funcionario-y-sinagoga-de-nazaret, persona:jesus, lugar:nazaret], menciona: [evento:rechazado-otra-vez-en-nazaret], nota: "Furiosos, lo suben a la cumbre del monte de la ciudad para despeñarlo y él se va entre ellos. Perspicacia «Nazaret» la distingue de la visita posterior de Mt 13 y Mr 6."}
    - {v: 31-37, tipo: narracion, entidades: [evento:curaciones-en-capernaum, persona:jesus, lugar:capernaum, relacion:jesus/vivio_en/capernaum], menciona: [lugar:galilea], nota: "Baja a Capernaúm, ciudad de Galilea bajo el nivel del mar (nota de 4:31). Un sábado, en la sinagoga, expulsa un demonio que lo llama el Nazareno y Santo de Dios."}
    - {v: 38-41, tipo: narracion, entidades: [evento:curaciones-en-capernaum, persona:jesus, persona:pedro, persona:suegra-de-pedro, relacion:pedro/pariente/suegra-de-pedro, relacion:pedro/vivio_en/capernaum, relacion:suegra-de-pedro/vivio_en/capernaum], nota: "En casa de Simón cura a su suegra, que tenía una fiebre muy alta, detalle de médico según la nota. Al ponerse el sol cura a muchos; los demonios lo llaman Hijo de Dios y no los deja hablar."}
