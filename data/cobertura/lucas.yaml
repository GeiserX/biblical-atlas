    - {v: 13-21, tipo: discurso, entidades: [evento:rico-insensato-y-mayordomo-fiel, persona:jesus], nota: "Uno de la multitud le pide que haga a su hermano repartir la herencia. Jesús no acepta hacer de juez, advierte contra la codicia y cuenta la comparación del rico insensato."}
    - {v: 22-34, tipo: discurso, entidades: [evento:rico-insensato-y-mayordomo-fiel], menciona: [persona:salomon], nota: "A los discípulos: no angustiarse por comida ni ropa; Dios alimenta a los cuervos y viste a los lirios mejor que a Salomón. El rebaño pequeño recibirá el Reino; su tesoro, en el cielo."}
    - {v: 35-40, tipo: discurso, entidades: [evento:rico-insensato-y-mayordomo-fiel], nota: "Los esclavos esperan despiertos, con las lámparas encendidas, al amo que vuelve de la boda. El Hijo del Hombre llegará cuando menos lo esperen."}
    - {v: 41-48, tipo: discurso, entidades: [evento:rico-insensato-y-mayordomo-fiel, persona:pedro, persona:jesus, relacion:pedro/acompana/jesus], nota: "Pedro pregunta si la comparación es solo para ellos. Jesús responde con el mayordomo fiel y prudente que reparte el alimento a su tiempo, y con el castigo del esclavo que se descuida."}
    - {v: 49-53, tipo: discurso, entidades: [evento:rico-insensato-y-mayordomo-fiel], nota: "Vino a encender un fuego y le espera un bautismo que lo angustia. No trae paz sino división, incluso entre padres, hijos, suegras y nueras de una misma casa."}
    - {v: 54-59, tipo: discurso, entidades: [evento:rico-insensato-y-mayordomo-fiel], nota: "A la multitud: saben interpretar las nubes y el viento, pero no el tiempo presente. Conviene arreglarse con el adversario por el camino, antes de llegar al juez."}
  13:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: narracion, entidades: [evento:mujer-encorvada-y-grano-de-mostaza, persona:jesus, persona:poncio-pilato, lugar:jerusalen, lugar:judea], menciona: [lugar:galilea, lugar:monte-moria, lugar:estanque-de-siloam], nota: "Le cuentan que Pilato mató a unos galileos y mezcló su sangre con sus sacrificios; Perspicacia cree que fue en el recinto del templo. Jesús cita a los 18 que aplastó la torre de Siloam: hay que arrepentirse."}
    - {v: 6-9, tipo: discurso, entidades: [evento:mujer-encorvada-y-grano-de-mostaza], nota: "Comparación de la higuera sin fruto durante tres años, para la que el viñador pide un año más. La nota la aplica a la nación judía, en el cuarto año del ministerio de Jesús."}
    - {v: 10-17, tipo: narracion, entidades: [evento:mujer-encorvada-y-grano-de-mostaza, persona:jesus], menciona: [persona:abrahan, persona:satanas], nota: "Un sábado, en una sinagoga, cura a una mujer que un demonio tenía encorvada desde hacía 18 años. El presidente de la sinagoga protesta; Jesús la llama hija de Abrahán, atada por Satanás."}
    - {v: 18-21, tipo: discurso, entidades: [evento:mujer-encorvada-y-grano-de-mostaza], nota: "El Reino es como un grano de mostaza que llega a ser árbol y como la levadura que fermenta la masa. Según jy cap. 79, repite en Judea lo que ya dijo en Galilea (Mt 13:31-33)."}
    - {v: "22", tipo: narracion, entidades: [evento:ensena-en-perea, persona:jesus, lugar:perea], menciona: [lugar:jerusalen], nota: "Camino de Jerusalén, va enseñando por ciudades y aldeas. La tabla A7-F lo pone en Perea, después de la Fiesta de la Dedicación de 32."}
    - {v: 23-30, tipo: discurso, entidades: [evento:puerta-angosta-y-lamento-por-jerusalen, persona:jesus, lugar:perea], menciona: [persona:abrahan, persona:isaac, persona:jacob], nota: "Uno pregunta si son pocos los que se salvan. Jesús pide esforzarse por la puerta angosta; Abrahán, Isaac, Jacob y los profetas estarán en el Reino, y vendrá gente de todas partes."}
    - {v: 31-35, tipo: narracion, entidades: [evento:puerta-angosta-y-lamento-por-jerusalen, persona:jesus, persona:herodes-antipas, lugar:jerusalen, lugar:perea], menciona: [lugar:monte-moria], nota: "Unos fariseos le avisan de que Herodes Antipas quiere matarlo, y Jesús lo llama zorro. Un profeta no puede morir fuera de Jerusalén; se lamenta por la ciudad y su casa, el templo. Cita Sl 118:26."}
  14:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: narracion, entidades: [evento:invitados-a-una-comida, persona:jesus, lugar:perea], nota: "Un sábado come en casa de un líder fariseo y cura a un hombre con hidropesía, un edema. La nota de 14:2 lo cuenta entre los milagros que solo narra Lucas. A7-F: probablemente en Perea."}
    - {v: 7-14, tipo: discurso, entidades: [evento:invitados-a-una-comida, persona:jesus], nota: "Viendo que los invitados eligen los mejores divanes, aconseja sentarse en el último puesto. Al anfitrión le pide invitar a pobres, cojos y ciegos: su pago llegará en la resurrección de los justos."}
    - {v: 15-24, tipo: discurso, entidades: [evento:invitados-a-una-comida], nota: "Un comensal alaba a quien coma en el Reino de Dios. Jesús responde con la parábola de la gran cena: los invitados se excusan y el amo manda traer a pobres de calles y caminos. Sus personajes no llevan ficha."}
    - {v: 25-35, tipo: discurso, entidades: [evento:calcular-el-costo, persona:jesus, lugar:perea], nota: "Ya en camino, a las multitudes: su discípulo tiene que amarlo más que a la familia y a la propia vida y cargar su madero. Ejemplos de la torre, del rey que cuenta sus soldados y de la sal."}
  15:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: narracion, entidades: [evento:oveja-moneda-e-hijo-perdidos, persona:jesus, lugar:perea], nota: "Cobradores de impuestos y pecadores se acercan a escucharlo; fariseos y escribas critican que los acoja y coma con ellos. La tabla A7-F pone la escena probablemente en Perea."}
    - {v: 3-7, tipo: discurso, entidades: [evento:oveja-moneda-e-hijo-perdidos, persona:jesus], nota: "Comparación del pastor que deja las 99 ovejas para buscar la extraviada y lo celebra al hallarla: en el cielo hay más alegría por un pecador arrepentido."}
    - {v: 8-10, tipo: discurso, entidades: [evento:oveja-moneda-e-hijo-perdidos], nota: "La mujer que busca con lámpara y escoba una de sus 10 dracmas. Según la nota de 15:8, la dracma era de plata y valía casi el jornal de un día. Los ángeles se alegran igual."}
    - {v: 11-24, tipo: discurso, entidades: [evento:oveja-moneda-e-hijo-perdidos], nota: "Parábola del hijo perdido: el menor pide su herencia, la derrocha lejos, acaba cuidando cerdos y vuelve arrepentido; el padre corre a abrazarlo y le hace fiesta. Los personajes no llevan ficha."}
    - {v: 25-32, tipo: discurso, entidades: [evento:oveja-moneda-e-hijo-perdidos], nota: "El hijo mayor se enfada por la fiesta y no quiere entrar; el padre sale a rogarle, le recuerda que todo lo suyo es de él y que su hermano ha vuelto a la vida."}
  16:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-8, tipo: discurso, entidades: [evento:mayordomo-injusto-y-rico-y-lazaro, persona:jesus, lugar:perea], nota: "A los discípulos: un mayordomo acusado de derrochar rebaja las deudas de aceite y trigo para ganarse amigos, y su señor alaba su sagacidad. Las medidas son batos y coros (notas de 16:6, 7)."}
    - {v: 9-13, tipo: discurso, entidades: [evento:mayordomo-injusto-y-rico-y-lazaro, persona:jesus], nota: "Usar las riquezas injustas para ganar amigos que reciban en las moradas eternas, ser fiel en lo poco y no servir a Dios y a las Riquezas a la vez. Riquezas no es un dios con ficha."}
    - {v: 14-18, tipo: discurso, entidades: [evento:mayordomo-injusto-y-rico-y-lazaro, persona:jesus], menciona: [persona:juan-el-bautista], nota: "Los fariseos, amigos del dinero, se burlan; Jesús les dice que Dios ve el corazón. La Ley y los Profetas duraron hasta Juan el Bautista (jy cap. 88). Casarse tras divorciarse es adulterio."}
    - {v: 19-31, tipo: discurso, entidades: [evento:mayordomo-injusto-y-rico-y-lazaro], menciona: [persona:abrahan, persona:moises], nota: "Parábola del rico y el mendigo Lázaro: al morir se invierte su suerte. Abrahán y Moisés solo se nombran dentro del relato. El mendigo no es el Lázaro de Betania (Perspicacia «Lázaro», núm. 2)."}
  17:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: discurso, entidades: [evento:no-hacer-tropezar-perdonar-y-fe, persona:jesus, lugar:perea], nota: "Aviso a los discípulos: ay de quien haga caer a uno de estos pequeños. Al hermano que se arrepiente se le perdona siempre, aunque falle siete veces en un día. La tabla A7-F pone la enseñanza probablemente en Perea."}
    - {v: 5-10, tipo: discurso, entidades: [evento:no-hacer-tropezar-perdonar-y-fe, persona:jesus], nota: "Los apóstoles piden más fe. Con la semilla de mostaza, el moral arrancado y el esclavo que sirve la cena antes de comer, Jesús enseña fe y modestia. Los del ejemplo no son personas del atlas."}
    - {v: 11-19, tipo: narracion, entidades: [evento:cura-a-diez-leprosos, persona:jesus, lugar:region-de-samaria, lugar:galilea], menciona: [lugar:jerusalen, lugar:efrain], nota: "Rumbo a Jerusalén, salido de Efraín según la nota de 17:11, cruza entre Samaria y Galilea. En una aldea sin nombre curan diez leprosos; solo vuelve a agradecerlo uno, samaritano. Solo Lucas lo cuenta."}
    - {v: 20-21, tipo: narracion, entidades: [evento:cura-a-diez-leprosos, persona:jesus], nota: "Los fariseos preguntan cuándo llega el Reino. Jesús dice que no vendrá de forma visible a todos; la nota de 17:21 explica que ya estaba entre ellos porque allí estaba el Rey que Dios había elegido."}
    - {v: 22-37, tipo: profecia, entidades: [evento:cura-a-diez-leprosos, persona:jesus], menciona: [persona:noe, evento:diluvio, persona:lot, lugar:sodoma, evento:lot-huye-a-zoar, evento:destruccion-de-sodoma-y-gomorra], nota: "A los discípulos: el día del Hijo del Hombre será como el relámpago y como los tiempos de Noé y de Lot. La esposa de Lot no tiene nombre ni ficha. El versículo 36 no está en la TNM."}
  18:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-8, tipo: discurso, entidades: [evento:viuda-persistente-y-fariseo-y-cobrador, persona:jesus], menciona: [lugar:region-de-samaria, lugar:galilea], nota: "Parábola, solo en Lucas, del juez injusto que acaba atendiendo a una viuda que insiste: orar sin rendirse. El juez y la viuda no llevan ficha. A7-F y jy cap. 94 la ponen en Samaria o en Galilea."}
    - {v: 9-14, tipo: discurso, entidades: [evento:viuda-persistente-y-fariseo-y-cobrador, persona:jesus], nota: "Parábola del fariseo que presume de sus ayunos y diezmos y del cobrador de impuestos que pide perdón en el templo. Es un ejemplo: ni los dos hombres ni el templo sitúan a nadie."}
    - {v: 15-17, tipo: narracion, entidades: [evento:bendice-a-unos-ninos, persona:jesus, lugar:perea], nota: "Le traen niños muy pequeños para que los toque, es decir, los bendiga; los discípulos lo impiden y Jesús los llama. Según A7-F y jy cap. 95, pasa en Perea."}
    - {v: 18-23, tipo: narracion, entidades: [evento:joven-rico-y-trabajadores-de-la-vina, persona:jesus, lugar:perea], nota: "Un gobernante judío muy rico cumple los mandamientos pero no quiere vender sus bienes para seguirlo. No tiene nombre ni ficha; jy cap. 96 sugiere que presidía una sinagoga o era del Sanedrín."}
    - {v: 24-30, tipo: narracion, entidades: [evento:joven-rico-y-trabajadores-de-la-vina, persona:jesus, persona:pedro, relacion:pedro/acompana/jesus], nota: "El camello por el ojo de la aguja es una hipérbole (nota de 18:25). Pedro recuerda lo que dejaron para seguirlo; Jesús promete mucho más ahora y vida eterna en la era que viene."}
    - {v: 31-34, tipo: narracion, entidades: [evento:tercer-anuncio-de-su-muerte, persona:jesus, lugar:perea], menciona: [lugar:jerusalen], nota: "Aparte con los Doce, anuncia lo que le espera en Jerusalén: entregado a extranjeros, burlas, escupitajos, azotes, muerte y resurrección al tercer día. Ellos no lo entienden."}
    - {v: 35-43, tipo: narracion, entidades: [evento:jerico-ciegos-zaqueo-y-minas, persona:jesus, persona:bartimeo, lugar:jerico, relacion:bartimeo/acompana/jesus, relacion:jesus/pariente/david, relacion:jesus/vivio_en/nazaret], menciona: [persona:david, lugar:nazaret], nota: "Lucas no nombra al ciego; la nota de 18:35 dice que Marcos lo llama Bartimeo y que Mateo habla de dos. Lucas dice «acercándose a Jericó»: había una ciudad judía y otra romana."}
  19:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-10, tipo: narracion, entidades: [evento:jerico-ciegos-zaqueo-y-minas, persona:jesus, persona:zaqueo, lugar:jerico, relacion:zaqueo/vivio_en/jerico, relacion:zaqueo/acompana/jesus, relacion:zaqueo/pariente/abrahan], menciona: [persona:abrahan], nota: "Zaqueo, rico jefe de cobradores, sube a un sicómoro (o higuera moral) para ver a Jesús y lo hospeda. Promete dar la mitad a los pobres y devolver el cuádruple, más de lo que pedía la Ley (nota de 19:8)."}
    - {v: 11-27, tipo: discurso, entidades: [evento:jerico-ciegos-zaqueo-y-minas, persona:jesus], menciona: [lugar:jerusalen, persona:arquelao, persona:herodes-el-grande, persona:augusto, lugar:roma], nota: "Parábola de las minas: un noble viaja lejos a recibir el reino. La nota de 19:12 recuerda a Arquelao, que fue a Roma para que Augusto lo confirmara. Los personajes de la parábola no llevan ficha."}
    - {v: 28-35, tipo: narracion, entidades: [evento:entrada-triunfal-en-jerusalen, persona:jesus, lugar:betfague, lugar:betania, lugar:monte-de-los-olivos], menciona: [lugar:jerusalen], nota: "El v. 28 cierra la estancia en Jericó (A7-F: Lu 18:35-19:28). Junto a Betfagué y Betania, dos discípulos sin nombre desatan un burrito nunca montado y dicen a sus dueños que el Señor lo necesita."}
    - {v: 36-40, tipo: narracion, entidades: [evento:entrada-triunfal-en-jerusalen, persona:jesus, lugar:monte-de-los-olivos], nota: "Al bajar del monte, los discípulos lo aclaman con el Sl 118:26. Solo Lucas cuenta que unos fariseos le piden que los haga callar; él responde que, si callaran, gritarían las piedras."}
    - {v: 41-44, tipo: profecia, entidades: [evento:entrada-triunfal-en-jerusalen, evento:destruccion-de-jerusalen-70, persona:jesus, lugar:jerusalen], nota: "Llora al ver la ciudad y le anuncia un cerco de estacas y la ruina. La nota de 19:43 lo ve cumplido en 70 e.c., cuando las tropas del general Tito la rodearon con una empalizada."}
    - {v: 45-46, tipo: narracion, entidades: [evento:higuera-maldita-y-limpieza-del-templo, persona:jesus, lugar:monte-moria], menciona: [evento:primera-limpieza-del-templo], nota: "Echa a los vendedores del templo con Is 56:7 y Jer 7:11. Según la nota de 19:45 es la segunda limpieza, el 10 de nisán de 33; la primera fue en la Pascua de 30 (Jn 2:13-17)."}
    - {v: 47-48, tipo: narracion, entidades: [evento:planean-matarlo-10-de-nisan, persona:jesus, lugar:monte-moria], nota: "Enseña cada día en el templo. Los sacerdotes principales, los escribas y los notables quieren acabar con él, pero no hallan cómo, porque el pueblo entero lo escucha atento."}
  20:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-8, tipo: narracion, entidades: [evento:cuestionan-su-autoridad, persona:jesus, persona:juan-el-bautista, lugar:monte-moria], nota: "En el templo, sacerdotes principales, escribas y ancianos le piden cuentas de su autoridad. Él pregunta de dónde venía el bautismo de Juan; callan por miedo a que el pueblo, que lo tenía por profeta, los apedree."}
    - {v: 9-18, tipo: discurso, entidades: [evento:agricultores-asesinos-y-banquete-de-boda, persona:jesus], nota: "Parábola de la viña arrendada; solo Lucas dice que el dueño se fue por mucho tiempo (nota de 20:9). Termina con la piedra desechada del Sl 118:22. Sus personajes no llevan ficha."}
    - {v: "19", tipo: narracion, entidades: [evento:agricultores-asesinos-y-banquete-de-boda, persona:jesus], nota: "Los escribas y los sacerdotes principales ven que la parábola iba por ellos y quieren prenderlo en ese momento, pero temen al pueblo."}
    - {v: 20-26, tipo: narracion, entidades: [evento:cesar-resurreccion-y-mandamiento, persona:jesus], menciona: [persona:tiberio, persona:poncio-pilato], nota: "Hombres pagados que fingen ser justos preguntan por el tributo, para entregarlo al gobernador, que por Lu 3:1 y 23:1 era Pilato. La nota de 20:22 remite a la de Mt 22:17: el César era Tiberio."}
    - {v: 27-40, tipo: narracion, entidades: [evento:cesar-resurreccion-y-mandamiento, persona:jesus], menciona: [persona:moises, persona:abrahan, persona:isaac, persona:jacob], nota: "Única vez que Lucas nombra a los saduceos; la nota de 20:27 liga su nombre con Sadoc, sumo sacerdote con Salomón. Jesús responde con Éx 3:6, la zarza, suceso que crea Éxodo. Unos escribas aprueban su respuesta."}
    - {v: 41-44, tipo: narracion, entidades: [evento:hijo-de-david, persona:jesus, relacion:jesus/pariente/david], menciona: [persona:david], nota: "Con el Sl 110:1 pregunta cómo puede el Cristo ser hijo de David si David, en el libro de los Salmos, lo llama Señor."}
    - {v: 45-47, tipo: discurso, entidades: [evento:denuncia-a-escribas-y-fariseos, persona:jesus], nota: "Delante del pueblo avisa a sus discípulos contra los escribas que buscan saludos y primeros asientos, se quedan con los bienes de las viudas y alargan sus oraciones para aparentar."}
  21:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: narracion, entidades: [evento:donativo-de-la-viuda, persona:jesus, lugar:monte-moria], nota: "En las arcas del tesoro del templo una viuda necesitada echa dos leptones, según la nota la moneda más pequeña de Israel. Jesús dice que dio más que los ricos. La viuda no tiene nombre."}
    - {v: 5-7, tipo: narracion, entidades: [evento:senal-de-su-presencia, persona:jesus, lugar:monte-moria, evento:destruccion-de-jerusalen-70], nota: "Hablan de las piedras y ofrendas del templo y Jesús anuncia que todo será derribado. Lucas no nombra a quienes preguntan por la señal ni dice dónde; Mateo y Marcos lo ponen en el monte de los Olivos."}
    - {v: 8-11, tipo: profecia, entidades: [evento:senal-de-su-presencia], nota: "Primeros rasgos de la señal: muchos vendrán en su nombre, guerras y revueltas, naciones enfrentadas, grandes terremotos, hambres y epidemias, escenas que asustan y señales del cielo. Las epidemias solo las cuenta Lucas, según la nota."}
    - {v: 12-19, tipo: profecia, entidades: [evento:senal-de-su-presencia], nota: "Antes de todo eso los perseguirán: sinagogas, cárceles, reyes y gobernadores. Jesús les dará palabras que nadie podrá rebatir; hasta la familia los entregará, pero con aguante salvarán la vida."}
    - {v: 20-24, tipo: profecia, entidades: [lugar:jerusalen, lugar:judea, evento:revuelta-judia-66, evento:destruccion-de-jerusalen-70, evento:senal-de-su-presencia], menciona: [evento:destruccion-de-jerusalen-607], nota: "Al ver ejércitos acampados alrededor de Jerusalén, los de Judea deben huir a las montañas; la nota del v. 21 cita a Eusebio: huyeron a Pela, en la Decápolis. Perspicacia cuenta los tiempos de las naciones desde 607 a.e.c."}
    - {v: 25-28, tipo: profecia, entidades: [evento:senal-de-su-presencia], nota: "Habrá señales en los astros y los pueblos sufrirán angustia ante el mar agitado. Verán al Hijo del Hombre llegar en una nube; los discípulos han de alzar la cabeza porque su liberación se acerca."}
    - {v: 29-33, tipo: discurso, entidades: [evento:senal-de-su-presencia], nota: "Comparación de la higuera y los demás árboles: cuando brotan se sabe que viene el verano. Así, al ver estas cosas, el Reino de Dios está cerca; esa generación no pasará antes."}
    - {v: 34-36, tipo: discurso, entidades: [evento:senal-de-su-presencia], nota: "Aviso para no dejarse abrumar por los excesos ni por las inquietudes de cada día, porque ese día llegará como una trampa. Hay que velar y rogar para poder estar de pie ante el Hijo del Hombre."}
    - {v: 37-38, tipo: narracion, entidades: [evento:noche-en-betania-10-de-nisan, evento:senal-de-su-presencia, persona:jesus, lugar:monte-de-los-olivos, lugar:monte-moria], menciona: [lugar:betania], nota: "Enseña de día en el templo y cada noche se aloja en el monte de los Olivos; la nota del v. 37 precisa que dormía en Betania, en casa de Lázaro y sus hermanas. El pueblo madruga para oírlo."}
  22:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: narracion, entidades: [evento:planean-matarlo-12-de-nisan, persona:jesus, lugar:jerusalen], nota: "Se acerca la Pascua, a la que Lucas junta los Panes Sin Levadura. Sacerdotes principales y escribas buscan cómo quitarlo de en medio sin alborotar al pueblo; la nota lo fecha el 12 de nisán."}
    - {v: 3-6, tipo: narracion, entidades: [evento:judas-acuerda-la-traicion, persona:judas-iscariote, persona:satanas, lugar:jerusalen, relacion:judas-iscariote/acompana/jesus], menciona: [persona:jesus], nota: "Satanás entra en Judas, uno de los Doce, que trata la entrega con los sacerdotes y los capitanes del templo, jefes de la guardia que solo nombra Lucas. Le prometen dinero; Mt 26:15 da la cifra."}
    - {v: 7-13, tipo: narracion, entidades: [evento:preparativos-de-la-pascua, persona:jesus, persona:pedro, persona:juan-apostol, lugar:jerusalen, relacion:pedro/acompana/juan-apostol, relacion:pedro/acompana/jesus, relacion:juan-apostol/acompana/jesus], nota: "Solo Lucas dice que los enviados eran Pedro y Juan. Siguen a un hombre con un cántaro y el dueño, ambos sin nombre, les enseña una sala arriba. La nota lo pone la tarde del 13 de nisán."}
    - {v: 14-18, tipo: narracion, entidades: [evento:ultima-pascua, persona:jesus, lugar:jerusalen], nota: "Al anochecer, ya 14 de nisán, se pone a la mesa con los apóstoles. Dice cuánto deseaba comer esa Pascua antes de sufrir, hace circular una copa y anuncia que no volverá a beber vino hasta que venga el Reino."}
    - {v: 19-20, tipo: narracion, entidades: [evento:cena-del-senor, persona:jesus, lugar:jerusalen], nota: "Pan y copa como símbolos de su cuerpo y de su sangre. La nota del v. 20 dice que solo Lucas habla aquí del nuevo pacto de Jer 31:31 y que parte de estos versículos falta en algunos manuscritos."}
    - {v: 21-23, tipo: narracion, entidades: [evento:despide-a-judas, persona:jesus, persona:judas-iscariote, lugar:jerusalen], nota: "Anuncia que su traidor come con él y discuten quién será. Lucas no nombra aquí a Judas; la nota del v. 21 dice que estos versículos no van en orden y que Judas salió antes de la Cena."}
    - {v: 24-30, tipo: narracion, entidades: [evento:cena-del-senor, persona:jesus], nota: "Discuten quién es el mayor. Jesús contrapone a los reyes que se hacen llamar benefactores con quien sirve, y pacta con los que siguieron a su lado un reino: comerán a su mesa y juzgarán a las 12 tribus."}
    - {v: 31-34, tipo: narracion, entidades: [evento:predice-las-negaciones-de-pedro, persona:jesus, persona:pedro, persona:satanas], nota: "Satanás ha pedido zarandearlos como trigo, pero Jesús ha rogado por la fe de Simón, que luego fortalecerá a los demás. Pedro promete ir a la cárcel y morir; lo negará tres veces antes del canto del gallo."}
    - {v: 35-38, tipo: narracion, entidades: [evento:predice-las-negaciones-de-pedro, persona:jesus], menciona: [evento:tercera-gira-y-envio-de-los-doce], nota: "Recuerda que cuando los mandó a predicar sin bolsa ni sandalias nada les faltó; ahora deben llevar provisiones y espada, porque se cumple en él Is 53:12. Le enseñan dos espadas y dice que bastan."}
    - {v: 39-46, tipo: narracion, entidades: [evento:arresto-en-getsemani, persona:jesus, lugar:monte-de-los-olivos, lugar:getsemani], nota: "Va como solía al monte de los Olivos; Lucas no nombra Getsemaní. Ora de rodillas, un ángel lo conforta y su sudor cae como sangre; los versículos 43 y 44 faltan en algunos manuscritos. Los discípulos duermen."}
    - {v: 47-53, tipo: narracion, entidades: [evento:arresto-en-getsemani, persona:judas-iscariote, persona:jesus, persona:pedro, persona:malco, lugar:getsemani, relacion:judas-iscariote/acompana/jesus], menciona: [lugar:monte-moria], nota: "Judas se acerca a besarlo. Lucas no nombra a quien hiere al esclavo ni al herido; la nota del v. 50 da a Pedro y a Malco por Jn 18:10. Solo Lucas cuenta que Jesús le curó la oreja."}
    - {v: 54-62, tipo: narracion, entidades: [evento:juicio-ante-el-sanedrin, persona:jesus, persona:pedro, lugar:jerusalen, relacion:pedro/acompana/jesus, relacion:pedro/vivio_en/galilea], menciona: [lugar:galilea], nota: "Lo llevan a casa del sumo sacerdote, a quien Lucas no nombra. Junto al fuego del patio, Pedro niega tres veces conocerlo; al último lo delata ser galileo. Canta un gallo, el Señor lo mira y Pedro sale a llorar."}
    - {v: 63-65, tipo: narracion, entidades: [evento:juicio-ante-el-sanedrin, persona:jesus], nota: "Sus guardias se burlan de él, lo golpean con la cara tapada y le piden que adivine quién le pegó."}
    - {v: 66-71, tipo: narracion, entidades: [evento:juicio-ante-el-sanedrin, persona:jesus, lugar:jerusalen], nota: "De día se reúne el consejo de ancianos, sacerdotes principales y escribas, y lo lleva a la sala del Sanedrín, cuyo posible sitio da B12. Jesús admite ser el Hijo de Dios y lo dan por probado."}
  23:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: narracion, entidades: [evento:ante-pilato-y-herodes, persona:jesus, persona:poncio-pilato, persona:herodes-antipas, lugar:galilea, relacion:jesus/vivio_en/galilea], menciona: [persona:tiberio, lugar:judea, lugar:jerusalen], nota: "Lo acusan de agitar a la nación, de oponerse al tributo al César (Tiberio, Lu 3:1) y de llamarse rey. Al saber que es galileo, Pilato lo remite a Herodes Antipas, que gobernaba Galilea y estaba en Jerusalén."}
    - {v: 8-12, tipo: narracion, entidades: [evento:ante-pilato-y-herodes, persona:herodes-antipas, persona:jesus, persona:poncio-pilato, relacion:herodes-antipas/acompana/poncio-pilato], nota: "Herodes quería ver un milagro; Jesús calla. Con sus soldados lo desprecia y lo viste con ropa vistosa, quizá una prenda real suya (nota del v. 11). Ese día él y Pilato se reconcilian."}
    - {v: 13-25, tipo: narracion, entidades: [evento:sentencia-y-barrabas, persona:barrabas, persona:poncio-pilato, persona:jesus], menciona: [persona:herodes-antipas], nota: "Pilato declara inocente a Jesús tres veces y propone castigarlo y soltarlo; la multitud pide a Barrabás, preso por una revuelta y un asesinato. La TNM no incluye el v. 17 (nota de estudio)."}
    - {v: 26-31, tipo: narracion, entidades: [evento:muerte-de-jesus, persona:jesus, persona:simon-de-cirene, lugar:cirene, relacion:simon-de-cirene/nacio_en/cirene], menciona: [lugar:jerusalen], nota: "Simón, que llegaba del campo, carga el madero detrás de Jesús. Anuncia días peores a las hijas de Jerusalén que lloraban por él; el árbol verde y el seco sería la nación judía (nota del v. 31)."}
    - {v: 32-43, tipo: narracion, entidades: [evento:muerte-de-jesus, persona:jesus, lugar:golgota], nota: "Calavera es la traducción griega de Gólgota (nota del v. 33). Los dos delincuentes no tienen nombre. El Paraíso prometido es la tierra futura, no un lugar del mapa; la pausa va tras «hoy» (nota del v. 43)."}
    - {v: 44-49, tipo: narracion, entidades: [evento:muerte-de-jesus, persona:jesus, relacion:jesus/murio_en/golgota, persona:juana, relacion:juana/acompana/jesus], menciona: [lugar:monte-moria, lugar:galilea], nota: "Oscuridad de mediodía a las tres, milagrosa y no un eclipse (nota del v. 44); se rasga la cortina del santuario. El oficial sin nombre lo llama justo. Perspicacia «Juana» la pone entre las mujeres de Galilea."}
    - {v: 50-54, tipo: narracion, entidades: [evento:entierro-de-jesus, persona:jose-de-arimatea, lugar:arimatea, relacion:jose-de-arimatea/vivio_en/arimatea, persona:poncio-pilato, persona:jesus], menciona: [lugar:judea], nota: "José, miembro del Sanedrín que no apoyó la condena, pide el cuerpo, lo envuelve en lino y lo pone en una tumba nueva cavada en la roca. Es el día de la preparación y empieza el sábado."}
    - {v: 55-56, tipo: narracion, entidades: [evento:entierro-de-jesus, persona:maria-magdalena, relacion:maria-magdalena/acompana/jesus, persona:juana], menciona: [lugar:galilea], nota: "Las mujeres venidas de Galilea miran la tumba y preparan especias antes de que empiece el sábado, y luego descansan. Perspicacia «María» (núm. 3) y «Juana» nombran entre ellas a María Magdalena y a Juana."}
  24:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-8, tipo: narracion, entidades: [evento:resurreccion-de-jesus, persona:jesus], menciona: [lugar:galilea], nota: "Temprano, el domingo 16 de nisán, las mujeres llevan las especias, hallan la piedra movida y la tumba sin el cuerpo. Los dos hombres de ropa brillante son ángeles (nota del v. 4)."}
    - {v: 9-11, tipo: narracion, entidades: [evento:resurreccion-de-jesus, persona:maria-magdalena, persona:juana, persona:maria-esposa-de-clopas, relacion:santiago-hijo-de-alfeo/pariente/maria-esposa-de-clopas], menciona: [persona:santiago-hijo-de-alfeo], nota: "Cuentan lo ocurrido a los Once y a los demás, que no las creen. La madre de Santiago es la esposa de Clopas. Juana era esposa de Cuza, servidor de Herodes Antipas (nota del v. 10)."}
    - {v: "12", tipo: narracion, entidades: [evento:resurreccion-de-jesus, persona:pedro], nota: "Pedro corre a la tumba, ve solo las vendas de lino y se marcha desconcertado. Juan 20:3-10 añade que fue con Juan."}
    - {v: 13-27, tipo: narracion, entidades: [evento:camino-de-emaus, persona:jesus, persona:cleopas, relacion:cleopas/acompana/jesus, lugar:emaus, lugar:jerusalen], menciona: [lugar:nazaret, persona:moises], nota: "Emaús estaba a 60 estadios, unos 11 km (nota del v. 13). Su compañero no tiene nombre; según Perspicacia «Cleopas», ninguno era apóstol. Jesús repasa lo que Moisés y los profetas decían del Cristo."}
    - {v: 28-32, tipo: narracion, entidades: [evento:camino-de-emaus, persona:jesus, persona:cleopas, lugar:emaus], nota: "Al anochecer se queda a cenar con ellos en la aldea; lo reconocen cuando parte el pan y desaparece."}
    - {v: 33-35, tipo: narracion, entidades: [evento:camino-de-emaus, evento:aparicion-a-pedro, persona:pedro, persona:cleopas, lugar:jerusalen], nota: "Vuelven enseguida a Jerusalén, donde los Once ya dicen que el Señor se ha aparecido a Simón, es decir, a Pedro (1Co 15:5). Lucas no cuenta esa aparición ni da el lugar."}
    - {v: 36-43, tipo: narracion, entidades: [evento:aparicion-a-los-discipulos-sin-tomas, persona:jesus, persona:cleopas], nota: "Jesús se presenta entre los reunidos, les muestra manos y pies y come pescado asado para probar que no es un espíritu. Jn 20:24 dice que Tomás no estaba."}
    - {v: 44-49, tipo: narracion, entidades: [evento:aparicion-a-los-discipulos-sin-tomas, persona:jesus, lugar:jerusalen], menciona: [persona:moises, evento:pentecostes-33], nota: "La Ley de Moisés, los Profetas y los Salmos son las tres partes de las Escrituras Hebreas (nota del v. 44). La predicación empezará en Jerusalén, donde deben esperar el espíritu prometido (nota del v. 49)."}
    - {v: 50-53, tipo: narracion, entidades: [evento:ascension-de-jesus, persona:jesus, lugar:betania, lugar:jerusalen], menciona: [lugar:monte-moria], nota: "Entre el v. 49 y el 50 pasan unos cuarenta días: esto ocurre el 25 de iyar (nota del v. 50). Tras la ascensión vuelven a Jerusalén y alaban a Dios en el templo."}
