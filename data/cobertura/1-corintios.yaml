# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: 1-corintios
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    nota: "Saludo y primera parte de la carta: las divisiones de Corinto y la sabiduría de Dios frente a la del mundo."
    tramos:
    - {v: 1-3, tipo: carta, entidades: [carta:1-corintios, persona:pablo, persona:sostenes, relacion:sostenes/acompana/pablo, relacion:sostenes/vivio_en/efeso, lugar:corinto, evento:pablo-escribe-1-corintios], menciona: [persona:jesus, evento:pablo-ante-galion, lugar:efeso, evento:pablo-recibe-una-carta-de-los-corintios], nota: "Saludo de Pablo, apóstol, y del hermano Sóstenes a la congregación de Corinto. La nota de estudio ve posible que fuera el jefe de sinagoga golpeado ante Galión y que Pablo le dictara la carta."}
    - {v: 4-9, tipo: carta, menciona: [persona:jesus], nota: "Pablo da gracias porque Dios dio a los corintios dones, palabra y conocimiento mientras esperan la revelación de Jesucristo. Dios es fiel y los mantendrá firmes hasta el fin."}
    - {v: 10-12, tipo: carta, entidades: [evento:la-casa-de-cloe-informa-a-pablo, persona:cloe, persona:apolos], menciona: [persona:pedro, lugar:efeso, persona:jesus, persona:pablo, evento:estefanas-fortunato-y-acaico-visitan-a-pablo], nota: "Ruega que no haya divisiones. Por los de la casa de Cloe sabe que hay bandos: de Pablo, de Apolos, de Cefas (el apóstol Pedro) y de Cristo. La nota de estudio sitúa a Apolos en Corinto tras Pablo."}
    - {v: 13-17, tipo: carta, entidades: [evento:pablo-bautiza-a-gayo-y-a-la-casa-de-estefanas, evento:crispo-cree, persona:crispo, persona:gayo-de-corinto, persona:estefanas, relacion:crispo/vivio_en/corinto, relacion:gayo-de-corinto/vivio_en/corinto, relacion:estefanas/vivio_en/corinto], menciona: [evento:muerte-de-jesus, persona:jesus, persona:pablo], nota: "Cristo no está dividido ni Pablo murió por ellos. Se alegra de haber bautizado solo a Crispo, a Gayo y a la casa de Estéfanas, porque su encargo principal era predicar, no bautizar."}
    - {v: 18-25, tipo: carta, menciona: [evento:muerte-de-jesus], nota: "El mensaje del madero parece absurdo a los que se pierden y es poder de Dios para los que se salvan. Judíos y griegos, pueblos sin ficha, tropiezan con él. Cita Is 29:14 sin nombrar al profeta."}
    - {v: 26-31, tipo: carta, nota: "Dios escogió a los que el mundo tiene por débiles y despreciables para que nadie presuma ante él. Cita Jer 9:24, donde el hebreo lleva el nombre divino, sin nombrar al profeta."}
  2:
    estado: completo
    revisado: 2026-09-29
    nota: "Pablo recuerda cómo predicó en Corinto y contrasta la sabiduría del mundo con la que revela el espíritu de Dios."
    tramos:
    - {v: 1-5, tipo: carta, entidades: [carta:1-corintios, persona:pablo, evento:pablo-llega-a-corinto, relacion:pablo/vivio_en/corinto], menciona: [persona:jesus, evento:muerte-de-jesus, lugar:corinto], nota: "Pablo recuerda su llegada a Corinto: débil y con temor, sin discursos brillantes, predicó solo a Jesucristo ejecutado en el madero, para que su fe se apoyara en el poder de Dios."}
    - {v: 6-10, tipo: carta, menciona: [evento:muerte-de-jesus], nota: "La sabiduría de Dios, un secreto sagrado, no la conocieron los gobernantes de este sistema, que ejecutaron al Señor glorioso. Junta en una cita Is 52:15 y 64:4, sin nombrar al profeta."}
    - {v: 11-16, tipo: carta, nota: "Solo el espíritu de Dios conoce las cosas de Dios. El hombre físico las tiene por absurdas; el espiritual las examina. Cita Is 40:13, con el nombre divino, sin nombrar al profeta."}
  3:
    estado: completo
    revisado: 2026-09-29
    nota: "Cuerpo de la carta, sin sucesos narrados. Nombra a Pablo, Apolos, Cefas y Cristo; recuerda cómo nació la congregación de Corinto."
    tramos:
    - {v: 1-4, tipo: carta, entidades: [carta:1-corintios, persona:pablo, persona:apolos], menciona: [persona:jesus], nota: "Pablo no pudo tratarlos como espirituales: aún son carnales, niños que necesitan leche. Lo prueban los celos y las peleas, cuando unos dicen ser de Pablo y otros de Apolos."}
    - {v: 5-9, tipo: carta, entidades: [persona:pablo, persona:apolos, evento:pablo-llega-a-corinto, evento:apolos-en-acaya, relacion:apolos/acompana/pablo, relacion:pablo/vivio_en/corinto, relacion:apolos/vivio_en/corinto], menciona: [lugar:corinto], nota: "Pablo y Apolos solo son ministros: uno plantó y el otro regó, y el crecimiento lo da Dios. Las referencias del v. 6 llevan a la predicación de Pablo en Corinto y a la labor posterior de Apolos."}
    - {v: 10-15, tipo: carta, entidades: [persona:pablo, relacion:pablo/vivio_en/corinto], menciona: [persona:jesus], nota: "Como maestro de obras, Pablo puso el fundamento, que es Jesucristo. Unos edifican encima con materiales que aguantan el fuego, como el oro, y otros con paja o madera; el fuego probará cada obra."}
    - {v: 16-17, tipo: carta, nota: "La congregación es el templo de Dios y su espíritu vive en ella. Ese templo es santo, y Dios destruirá a quien lo destruya."}
    - {v: 18-23, tipo: carta, menciona: [persona:pablo, persona:apolos, persona:pedro, persona:jesus], nota: "Para Dios la sabiduría del mundo es absurda: cita Job 5:13, palabras de Elifaz según la nota de estudio, y Sl 94:11. Nadie presuma de hombres: Pablo, Apolos y Cefas, que es Pedro, son de ellos."}
  4:
    estado: completo
    revisado: 2026-09-29
    nota: "Cuerpo de la carta. Pablo se defiende, recuerda que fundó la congregación, anuncia que envía a Timoteo y que irá pronto."
    tramos:
    - {v: 1-5, tipo: carta, entidades: [carta:1-corintios, persona:pablo], menciona: [persona:jesus], nota: "Los apóstoles sirven a Cristo y administran los secretos sagrados de Dios, y deben ser fieles. A Pablo poco le importa que lo juzguen los corintios o un tribunal humano: lo juzga Jehová."}
    - {v: 6-7, tipo: carta, entidades: [persona:pablo, persona:apolos, relacion:apolos/acompana/pablo], nota: "Pablo se pone a sí mismo y a Apolos como ejemplo de la regla de no ir más allá de lo escrito, que según la nota de estudio era una frase conocida. Así nadie tomará partido por uno contra otro."}
    - {v: 8-13, tipo: carta, entidades: [persona:pablo], menciona: [persona:jesus, lugar:corinto], nota: "Con ironía: los corintios se creen ricos y reyes, y los apóstoles pasan hambre y sed, reciben golpes, trabajan con sus manos y son la basura del mundo. La nota de estudio recuerda el teatro de Corinto."}
    - {v: 14-16, tipo: carta, entidades: [persona:pablo, relacion:pablo/vivio_en/corinto], menciona: [persona:jesus, evento:crispo-cree, evento:el-senor-anima-a-pablo-en-corinto], nota: "Los aconseja como a hijos: tendrán miles de tutores, pero un solo padre, él, que les llevó las buenas noticias en el año y medio que pasó en Corinto (nota de estudio del v. 15). Les pide que lo imiten."}
    - {v: "17", tipo: carta, entidades: [persona:timoteo, persona:pablo, evento:pablo-envia-a-timoteo-a-corinto, relacion:timoteo/acompana/pablo], menciona: [persona:jesus], nota: "Timoteo, hijo amado y fiel en el Señor, les recordará los métodos de Pablo. Es hijo en sentido espiritual, no un parentesco."}
    - {v: 18-21, tipo: carta, entidades: [persona:pablo], menciona: [evento:complot-en-grecia], nota: "Algunos, orgullosos, creen que Pablo no irá. Irá pronto si Jehová quiere, para ver su poder y no sus palabras. Perspicacia «Corintios» dice que esa visita se retrasó y llegó en 56."}
  5:
    estado: completo
    revisado: 2026-09-29
    nota: "Un caso de inmoralidad en la congregación de Corinto y la orden de expulsarlo. Sin nombres nuevos: solo Jesús y Satanás."
    tramos:
    - {v: 1-5, tipo: carta, entidades: [carta:1-corintios, evento:pablo-manda-expulsar-al-inmoral-de-corinto, persona:pablo, lugar:corinto], menciona: [persona:jesus, persona:satanas, evento:estefanas-fortunato-y-acaico-visitan-a-pablo], nota: "Un hombre se ha unido a la mujer de su padre y la congregación lo tolera. Pablo, ausente, lo ha juzgado: que lo entreguen a Satanás, o sea, que lo expulsen (nota del v. 5). Ninguno tiene nombre."}
    - {v: 6-8, tipo: carta, menciona: [persona:jesus, evento:muerte-de-jesus, evento:jehova-instituye-la-pascua], nota: "Un poco de levadura hace fermentar toda la masa, así que hay que quitar la vieja. Cristo, el cordero de la Pascua, ya fue sacrificado, y la fiesta se celebra con sinceridad y verdad."}
    - {v: 9-13, tipo: carta, entidades: [evento:pablo-escribe-una-carta-perdida-a-corinto], nota: "Ya les había escrito una carta que se perdió. No pide salir del mundo, sino no tratar ni comer con quien se dice hermano y sigue en el pecado. Cita Dt 17:7 sin nombrar a Moisés."}
  6:
    estado: completo
    revisado: 2026-09-29
    nota: "Consejos a la congregación de Corinto sobre los pleitos entre hermanos y la limpieza moral. Sin sucesos ni lugares; solo nombra a Jesucristo."
    tramos:
    - {v: 1-8, tipo: carta, entidades: [carta:1-corintios], nota: "Hermanos que se llevan a juicio ante jueces no creyentes. Si los santos juzgarán al mundo y a ángeles, pueden resolverlo ellos; mejor sufrir la injusticia. Es una costumbre, sin un caso concreto, así que no es suceso."}
    - {v: 9-11, tipo: carta, menciona: [persona:jesus, lugar:corinto], nota: "Los injustos, como inmorales, idólatras, adúlteros, homosexuales, ladrones, borrachos o extorsionadores, no heredarán el Reino. Algunos corintios lo fueron, pero ya están lavados y declarados justos en el nombre de Jesucristo."}
    - {v: 12-14, tipo: carta, menciona: [persona:pablo, persona:jesus, evento:resurreccion-de-jesus], nota: "Todo está permitido, pero no todo conviene, y Pablo no se deja dominar por nada. El cuerpo es para el Señor, no para la inmoralidad; Dios lo resucitó y también levantará a los cristianos."}
    - {v: 15-17, tipo: carta, menciona: [persona:jesus, evento:creacion-de-eva], nota: "Los cuerpos de los cristianos son miembros de Cristo. Quien se une a una prostituta forma con ella una sola carne, como dice Gé 2:24; quien se une al Señor forma con él un solo espíritu."}
    - {v: 18-20, tipo: carta, menciona: [evento:muerte-de-jesus, evento:jose-en-casa-de-potifar, persona:jose-hijo-de-jacob, persona:potifar], nota: "Hay que huir de la inmoralidad sexual: quien la practica peca contra su cuerpo, que es templo del espíritu y fue comprado por un precio. Según la nota del v. 18, quizá alude a José y la esposa de Potifar."}
  7:
    estado: completo
    revisado: 2026-09-29
    nota: "Respuesta a la carta de los corintios sobre el matrimonio y la soltería. Sin lugares ni personas nuevas: nombra a Satanás, a Cristo y al propio Pablo."
    tramos:
    - {v: 1-5, tipo: carta, entidades: [carta:1-corintios, evento:pablo-recibe-una-carta-de-los-corintios, lugar:corinto], menciona: [persona:satanas, lugar:efeso], nota: "Pablo contesta lo que los corintios le preguntaron por carta. Como la inmoralidad abundaba en Corinto (nota del v. 2), cada uno tenga su cónyuge; no se nieguen el deber conyugal, para que Satanás no los tiente."}
    - {v: 6-9, tipo: carta, entidades: [persona:pablo], nota: "Pablo querría que todos fueran como él; Perspicacia «Pablo», párr. 2, dice que en sus viajes no estaba casado. A solteros y viudas les conviene seguir así, pero es mejor casarse que arder de deseo."}
    - {v: 10-11, tipo: carta, entidades: [evento:matrimonio-y-divorcio], menciona: [persona:jesus, evento:sermon-del-monte], nota: "Orden del Señor, no de Pablo: la esposa no se separa del esposo y, si lo hace, se queda sin casar o se reconcilia; él tampoco la deja. Recoge lo que Jesús enseñó (Mt 19:6; Mr 10:11)."}
    - {v: 12-16, tipo: carta, nota: "Consejo del propio Pablo: si un creyente está casado con quien no cree y este acepta seguir, que no lo deje; los hijos son santos. Si el no creyente se va, el creyente queda sin obligación."}
    - {v: 17-24, tipo: carta, menciona: [persona:jesus, evento:muerte-de-jesus, lugar:roma], nota: "Cada uno siga en la situación en que Dios lo llamó, circunciso o no, esclavo o libre. La nota del v. 22 cuenta que en Corinto, rehecha por Roma, había muchos libertos. Cristo pagó el precio por todos."}
    - {v: 25-28, tipo: carta, nota: "Sobre los que nunca se han casado, Pablo no tiene mandato del Señor y da su opinión: por la situación de entonces, mejor seguir como están. Casarse no es pecado, aunque trae dificultades."}
    - {v: 29-35, tipo: carta, nota: "Queda poco tiempo y la escena del mundo cambia. El soltero puede ocuparse de las cosas del Señor; el casado, de agradar a su cónyuge, y está dividido. Pablo no quiere atarlos, sino ayudarlos a servir sin distracciones."}
    - {v: 36-38, tipo: carta, nota: "Quien ya pasó la flor de la juventud y cree que debe casarse no peca si lo hace. Quien decide con firmeza seguir soltero hace mejor."}
    - {v: 39-40, tipo: carta, nota: "La esposa está unida a su esposo mientras él vive; si muere, puede casarse con quien quiera, pero solo en el Señor, con un cristiano según la nota. En opinión de Pablo, será más feliz si sigue viuda."}
  8:
    estado: completo
    revisado: 2026-09-29
    nota: "Respuesta a la pregunta de los corintios sobre la carne ofrecida a los ídolos. No nombra ningún dios, templo ni lugar; solo a Jesucristo."
    tramos:
    - {v: 1-3, tipo: carta, entidades: [carta:1-corintios, evento:pablo-recibe-una-carta-de-los-corintios], menciona: [lugar:corinto, evento:concilio-de-jerusalen-49], nota: "Otra de sus preguntas: la carne ofrecida a los ídolos. La nota del v. 1 explica que lo que sobraba de los sacrificios se vendía, y recuerda el mandato de Hch 15:28, 29. El conocimiento envanece; el amor edifica."}
    - {v: 4-6, tipo: carta, menciona: [persona:jesus], nota: "Un ídolo no es nada. Aunque se hable de muchos dioses y señores, sin nombrar a ninguno, para los cristianos hay un solo Dios, el Padre, y un solo Señor, Jesucristo, por medio de quien existe todo."}
    - {v: 7-13, tipo: carta, menciona: [persona:jesus, evento:muerte-de-jesus, persona:pablo], nota: "No todos lo entienden así. Ver a otro comer en un templo de ídolos, sin nombre, puede hacer caer al de conciencia débil, un hermano por quien Cristo murió. Pablo dejaría la carne antes que hacerlo tropezar."}
  9:
    estado: completo
    revisado: 2026-09-29
    nota: "Pablo defiende su apostolado y explica por qué predica sin cobrar. Nombra a Jesús, Cefas, Bernabé y Moisés; sin sucesos nuevos."
    tramos:
    - {v: 1-2, tipo: carta, entidades: [carta:1-corintios, persona:pablo, evento:conversion-de-pablo, relacion:jesus/se_aparece_a/pablo], menciona: [persona:jesus], nota: "Pablo se dice libre y apóstol: ha visto al Señor Jesús, como en el camino de Damasco (Hch 9:3-5, en las referencias). La congregación de Corinto es la prueba de su apostolado."}
    - {v: 3-7, tipo: carta, entidades: [persona:pedro, persona:bernabe, persona:santiago-hermano-de-jesus], menciona: [relacion:pedro/pariente/suegra-de-pedro], nota: "Su defensa: podría llevar de viaje a una esposa cristiana, igual que Cefas, otros apóstoles y los hermanos de Jesús; Perspicacia deduce que Pedro y Santiago, medio hermano de Jesús, estaban casados. Él y Bernabé se mantienen trabajando."}
    - {v: 8-14, tipo: carta, menciona: [persona:moises, evento:pacto-de-la-ley, evento:pablo-llega-a-corinto, evento:tercera-gira-y-envio-de-los-doce, evento:envio-de-los-setenta], nota: "La Ley de Moisés prohíbe poner bozal al toro que trilla (Dt 25:4), y quien sirve en el altar come de él. El Señor mandó que los predicadores vivan de su labor (Mt 10:10; Lu 10:7)."}
    - {v: 15-18, tipo: carta, nota: "Pablo no ha usado ese derecho y prefiere no hacerlo; predicar es para él una obligación. Su recompensa es anunciar las buenas noticias gratis, sin abusar de su autoridad."}
    - {v: 19-23, tipo: carta, menciona: [persona:timoteo, evento:timoteo-se-une-a-pablo, evento:voto-en-cencreas, evento:pablo-se-purifica-en-el-templo, evento:discurso-en-el-areopago, lugar:atenas], nota: "Se hace como judío con los judíos y como sin ley con los gentiles. Las notas dan ejemplos: circuncidó a Timoteo (Hch 16:1-3) y en Atenas citó a poetas griegos (Hch 17:22-34)."}
    - {v: 24-27, tipo: carta, entidades: [relacion:pablo/vivio_en/corinto], menciona: [lugar:corinto], nota: "Ejemplos del corredor y del boxeador. Según la nota, Corinto conocía los Juegos Ístmicos, cada dos años, y Pablo probablemente estaba allí en los de 51. Olimpia solo sale en la nota, sin ficha."}
  10:
    estado: completo
    revisado: 2026-09-29
    nota: "Los sucesos del desierto como advertencia contra la idolatría y la inmoralidad, y la carne sacrificada a ídolos. Recuerda sucesos de Éxodo y Números; no crea ninguno."
    tramos:
    - {v: 1-5, tipo: carta, entidades: [carta:1-corintios, evento:israel-cruza-el-mar-rojo, evento:codornices-y-mana-en-el-desierto-de-sin, evento:agua-de-la-roca-en-horeb], menciona: [persona:moises, persona:jesus, lugar:mar-rojo, lugar:meriba-de-cades, evento:exodo, evento:israel-acampa-en-ezam], nota: "Nube y mar: bautizados en Moisés (Éx 13:21; 14:21, 22); maná y agua de la roca, figura del Cristo. El agua de Meribá de Cades (Nú 20) y las muertes del desierto (Nú 14:29) son de Números."}
    - {v: 6-11, tipo: carta, entidades: [evento:becerro-de-oro], menciona: [persona:aaron, persona:core-hijo-de-izhar, persona:datan, persona:abiram-hijo-de-eliab, lugar:monte-sinai, evento:destruccion-de-jerusalen-70, persona:moises, lugar:moab, lugar:jerusalen], nota: "Ejemplos: la codicia (Nú 11), el becerro de oro (Éx 32:6), Baal de Peor en Sitim con 23.000 muertos en un día (Nú 25), las serpientes (Nú 21) y las quejas (Nú 14; 16). Los de Números los crea Números."}
    - {v: 12-13, tipo: carta, nota: "Quien cree estar firme, que no caiga. Ninguna tentación es fuera de lo común, y Dios, que es fiel, da la salida para aguantarla."}
    - {v: 14-22, tipo: carta, menciona: [evento:cena-del-senor], nota: "Huir de la idolatría. La copa y el pan de la Cena del Señor unen con Cristo, e Israel comía de los sacrificios del altar. Lo sacrificado a ídolos va a demonios (Dt 32:17); «mesa de Jehová», Mal 1:7."}
    - {v: 23-30, tipo: carta, nota: "Todo es lícito, pero no todo edifica. Se puede comer lo que vende el mercado y lo que sirve un anfitrión no creyente (cita Sl 24:1), salvo si alguien avisa de que se ofreció a un ídolo."}
    - {v: 31-33, tipo: carta, menciona: [persona:pablo], nota: "Hacerlo todo para la gloria de Dios y no hacer tropezar a judíos, griegos ni a la congregación, como Pablo, que busca el provecho de muchos."}
  11:
    estado: completo
    revisado: 2026-09-29
    nota: "Orden en las reuniones: la mujer que ora se cubre la cabeza, y la Cena del Señor, cuya institución Pablo relata, se respeta. No nombra lugares ni personas nuevas."
    tramos:
    - {v: 1-2, tipo: carta, entidades: [carta:1-corintios], menciona: [persona:pablo, persona:jesus], nota: "Pablo les pide que lo imiten, igual que él imita a Cristo, y los elogia por guardar las tradiciones que les dejó. La nota de estudio da como ejemplo lo que él recibió sobre la Cena del Señor."}
    - {v: 3-16, tipo: carta, entidades: [evento:creacion-de-eva], menciona: [persona:jesus, evento:creacion-de-adan], nota: "Jefatura: Dios es cabeza de Cristo, Cristo del hombre y el hombre de la mujer. Ella se cubre al orar o profetizar, señal visible incluso para los ángeles. Se apoya en cómo Dios formó a la mujer (Gé 2)."}
    - {v: 17-22, tipo: carta, menciona: [lugar:corinto, evento:estefanas-fortunato-y-acaico-visitan-a-pablo], nota: "Reproche: Pablo sabe que en sus reuniones hay bandos, y que al juntarse para la Cena del Señor unos llegan ya comidos o ebrios mientras otros pasan hambre y quedan avergonzados. No los puede elogiar."}
    - {v: 23-26, tipo: carta, entidades: [evento:cena-del-senor], menciona: [persona:jesus, evento:arresto-en-getsemani, evento:muerte-de-jesus], nota: "Lo que Pablo recibió del Señor: la noche en que lo entregaron, Jesús dio pan y copa como símbolos de su cuerpo y del nuevo pacto con su sangre. Celebrarla anuncia su muerte hasta que él venga."}
    - {v: 27-34, tipo: carta, nota: "Quien participa sin respetar lo que representan el pan y la copa se acarrea condena; por eso hay débiles y muertos espirituales. Que cada uno se examine, coman en casa y se esperen. Pablo ordenará lo demás al ir."}
  12:
    estado: completo
    revisado: 2026-09-29
    nota: "Los dones del espíritu y la congregación como un solo cuerpo. Sin sucesos, lugares ni personas nuevas; solo nombra a Jesús."
    tramos:
    - {v: 1-3, tipo: carta, entidades: [carta:1-corintios], menciona: [persona:jesus], nota: "Sobre los dones del espíritu. Antes de creer los arrastraban ídolos mudos, sin nombre. Nadie guiado por el espíritu de Dios maldice a Jesús, y solo con espíritu santo se le reconoce como Señor."}
    - {v: 4-11, tipo: carta, menciona: [evento:pentecostes-33], nota: "Un solo espíritu reparte dones distintos: sabiduría, conocimiento, fe, curar, milagros, profecía, distinguir mensajes inspirados, lenguas e interpretarlas. Las notas los ven milagrosos y ligan las lenguas al Pentecostés de 33 (Hch 2)."}
    - {v: 12-26, tipo: carta, menciona: [persona:jesus], nota: "Un cuerpo tiene muchos miembros y los necesita todos; Dios los colocó para que no haya divisiones y se cuiden. Así es el Cristo: judíos o griegos, esclavos o libres, bautizados por un solo espíritu. Son pueblos, sin ficha."}
    - {v: 27-31, tipo: carta, nota: "Ellos son el cuerpo de Cristo. Dios puso en la congregación apóstoles, profetas, maestros, milagros, curaciones, ayudas, dirección y lenguas, y no todos tienen el mismo. Pablo anuncia un camino mejor, el amor del capítulo 13."}
  13:
    estado: completo
    revisado: 2026-09-29
    nota: "Descripción del amor cristiano, sin personas ni lugares con nombre y sin sucesos. Pablo habla en primera persona solo para poner ejemplos."
    tramos:
    - {v: 1-3, tipo: carta, entidades: [carta:1-corintios], nota: "Sin amor, ni las lenguas de hombres y ángeles, ni profetizar, ni una fe capaz de mover montañas, ni darlo todo a otros sirven de nada. El gong y el címbalo son instrumentos de percusión ruidosos."}
    - {v: 4-7, tipo: carta, nota: "Cómo actúa el amor: es paciente y bondadoso, no tiene celos ni presume, no busca lo suyo, no se irrita, no guarda rencor por el daño, se alegra con la verdad y todo lo aguanta."}
    - {v: 8-13, tipo: carta, nota: "El amor no se acaba; los dones de profetizar, de lenguas y de conocimiento sí. Según las notas, servían a la congregación mientras era niña. Hoy se ve como en un espejo de metal. Quedan fe, esperanza y amor."}
  14:
    estado: completo
    revisado: 2026-09-29
    nota: "Instrucciones sobre las lenguas, la profecía y el orden en las reuniones de la congregación. Sin lugares ni sucesos; solo Pablo dice algo de sí mismo (v. 18)."
    tramos:
    - {v: 1-5, tipo: carta, entidades: [carta:1-corintios], nota: "Profetizar vale más que hablar en lenguas: quien habla otro idioma que nadie entiende solo se edifica a sí mismo, mientras que quien profetiza anima y consuela a toda la congregación, salvo que alguien traduzca."}
    - {v: 6-12, tipo: carta, nota: "Hablar en lenguas sin revelación ni enseñanza no aprovecha. La flauta, el arpa y la trompeta de guerra (Nú 10:9, según la nota) necesitan sonidos claros; si no, quien escucha queda como un extranjero."}
    - {v: 13-19, tipo: carta, entidades: [persona:pablo], nota: "Quien habla en lenguas debe pedir poder traducirlas, para orar y cantar también con la mente y que los demás digan amén. Pablo habla más lenguas que todos, pero prefiere cinco palabras entendidas a diez mil ininteligibles."}
    - {v: 20-25, tipo: carta, nota: "Ser adultos en entendimiento. Cita Is 28:11, 12 sin nombrar al profeta: las lenguas son señal para los incrédulos. Si todos profetizan, el visitante no creyente descubre su corazón y reconoce que Dios está con ellos."}
    - {v: 26-33, tipo: carta, nota: "Orden en las reuniones: cada uno aporta un salmo, una enseñanza o una revelación. Hablan en lenguas dos o tres por turno y con intérprete; los profetas, uno a uno. Dios es Dios de paz."}
    - {v: 34-35, tipo: carta, nota: "Como en todas las congregaciones, las mujeres guardan silencio en la reunión y preguntan en casa a sus esposos. La nota ve posible que algunas interrumpieran a quienes enseñaban, y cita 1Ti 2:12."}
    - {v: 36-40, tipo: carta, nota: "La palabra de Dios no nació entre los corintios ni llegó solo a ellos. Quien se crea profeta debe aceptar que lo escrito son mandatos del Señor. Seguir profetizando, no prohibir las lenguas y hacerlo todo con orden."}
  15:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: carta, entidades: [carta:1-corintios, persona:pablo], menciona: [evento:pablo-llega-a-corinto, lugar:corinto], nota: "Pablo recuerda a los corintios las buenas noticias que les anunció al fundar la congregación (las referencias remiten a Hch 18:1, 11). Por ellas se salvan si no las sueltan; si no, habrán creído en vano."}
    - {v: 3-4, tipo: carta, entidades: [persona:jesus, evento:entierro-de-jesus, evento:resurreccion-de-jesus], menciona: [evento:muerte-de-jesus], nota: "Lo primero que Pablo transmitió: Cristo murió por los pecados, fue enterrado y Dios lo levantó al tercer día, conforme a las Escrituras. La nota del v. 20 pone la resurrección el 16 de nisán del 33."}
    - {v: 5-8, tipo: carta, entidades: [persona:pedro, evento:aparicion-a-pedro, evento:mandato-de-hacer-discipulos, evento:aparicion-a-santiago, evento:conversion-de-pablo, relacion:jesus/se_aparece_a/santiago-hermano-de-jesus, relacion:jesus/se_aparece_a/pablo], menciona: [persona:jesus, persona:pablo, evento:aparicion-a-los-discipulos-sin-tomas, evento:manda-esperar-en-jerusalen, evento:ascension-de-jesus, evento:aparicion-a-tomas, persona:santiago-hermano-de-jesus, persona:tomas, lugar:galilea, lugar:damasco], nota: "Apariciones en orden: a Cefas; a los Doce, quizá la de Tomás (nota del v. 5); a más de 500, quizá en Galilea; a Santiago, probablemente su medio hermano; a todos los apóstoles y, por último, a Pablo."}
    - {v: 9-11, tipo: carta, entidades: [persona:pablo, evento:saulo-persigue-a-la-congregacion], nota: "Pablo se tiene por el menor de los apóstoles, porque persiguió a la congregación de Dios. Todo lo debe a la bondad inmerecida de Dios, y por ella ha trabajado más que los otros."}
    - {v: 12-19, tipo: carta, menciona: [persona:jesus, evento:resurreccion-de-jesus], nota: "Algunos corintios negaban que los muertos resuciten. Pablo saca las consecuencias: tampoco Cristo habría resucitado, su predicación y la fe de ellos serían vanas y los que murieron en Cristo estarían perdidos."}
    - {v: 20-28, tipo: carta, entidades: [persona:adan, evento:pecado-de-adan-y-eva], menciona: [persona:jesus, evento:resurreccion-de-jesus], nota: "Cristo resucitó como primicias. Por Adán llegó la muerte y por otro hombre llega la resurrección. Cristo reina hasta acabar con todo enemigo, la muerte en último lugar, y entrega el Reino al Padre (Sl 110:1; 8:6)."}
    - {v: 29-34, tipo: carta, entidades: [evento:pablo-escribe-1-corintios, relacion:pablo/vivio_en/efeso], menciona: [lugar:efeso, evento:motin-de-efeso], nota: "Pablo arriesga la vida a diario. Pelear con animales salvajes en Éfeso puede ser literal o hablar de enemigos, como el motín de Hch 19 (nota del v. 32). Cita Is 22:13 y un refrán sobre compañías."}
    - {v: 35-49, tipo: carta, entidades: [persona:adan, evento:creacion-de-adan], menciona: [persona:jesus], nota: "Como la semilla que muere y brota distinta, se siembra un cuerpo físico y resucita uno espiritual. Adán, el primer hombre, salió del polvo (Gé 2:7); Jesús, el último Adán, es del cielo (nota del v. 45)."}
    - {v: 50-58, tipo: carta, menciona: [persona:jesus], nota: "La carne y la sangre no heredan el Reino. Con la última trompeta los muertos resucitan incorruptibles y los vivos son cambiados. Cita Is 25:8 y Os 13:14: Dios da la victoria por Jesucristo."}
  16:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: carta, entidades: [carta:1-corintios, evento:colecta-de-macedonia-y-acaya, lugar:galacia], menciona: [lugar:jerusalen, evento:pablo-recorre-galacia-y-frigia, evento:companeros-de-la-colecta, lugar:judea, lugar:macedonia, lugar:acaya], nota: "La colecta para los santos se hace como en Galacia: al empezar cada semana, cada uno guarda algo según pueda. Los hombres que ellos aprueben llevarán el regalo a Jerusalén, quizá con Pablo."}
    - {v: 5-9, tipo: carta, entidades: [persona:pablo, lugar:efeso, relacion:pablo/vivio_en/efeso], menciona: [lugar:macedonia, viaje:tercer-viaje, evento:pablo-deja-efeso-hacia-macedonia, evento:pablo-escribe-romanos, evento:complot-en-grecia, lugar:asia], nota: "Pablo irá a Corinto tras pasar por Macedonia y quizá se quede el invierno. Mientras tanto sigue en Éfeso hasta Pentecostés, una fiesta sin ficha. El estudio 3 dice que salió después de esa fiesta, en 55."}
    - {v: 10-11, tipo: carta, entidades: [persona:timoteo, relacion:timoteo/acompana/pablo, evento:pablo-envia-a-timoteo-a-corinto], menciona: [evento:pablo-envia-a-timoteo-y-erasto-a-macedonia], nota: "Si Timoteo llega, que no tenga miedo con ellos y que lo ayuden a volver con Pablo. Perspicacia «Timoteo» duda de que llegara a Corinto; si fue, fue antes de su viaje a Macedonia con Erasto."}
    - {v: "12", tipo: carta, entidades: [persona:apolos, relacion:apolos/vivio_en/efeso, relacion:apolos/acompana/pablo], menciona: [persona:estefanas, persona:fortunato, persona:acaico, lugar:efeso], nota: "Pablo insistió a Apolos para que fuera a Corinto, pero él no quiso ir por el momento. La nota lo sitúa en Éfeso o cerca y ve posible que «los hermanos» fueran Estéfanas y sus dos compañeros."}
    - {v: 13-14, tipo: carta, nota: "Consejos breves: vigilar, seguir firmes en la fe, ser valientes y fuertes, y hacerlo todo con amor."}
    - {v: 15-18, tipo: carta, entidades: [persona:estefanas, persona:fortunato, persona:acaico, evento:estefanas-fortunato-y-acaico-visitan-a-pablo, relacion:estefanas/vivio_en/corinto, relacion:estefanas/acompana/pablo, relacion:fortunato/vivio_en/corinto, relacion:fortunato/acompana/pablo, relacion:fortunato/acompana/estefanas, relacion:acaico/vivio_en/corinto, relacion:acaico/acompana/pablo, relacion:acaico/acompana/estefanas, evento:pablo-bautiza-a-gayo-y-a-la-casa-de-estefanas], menciona: [lugar:acaya, lugar:corinto], nota: "Los de la casa de Estéfanas fueron los primeros creyentes de Acaya y se dedicaron a servir. Estéfanas, Fortunato y Acaico, venidos de Corinto, están con Pablo en Éfeso y lo han reanimado."}
    - {v: 19-20, tipo: carta, entidades: [persona:aquila, persona:priscila, relacion:aquila/vivio_en/efeso, relacion:priscila/vivio_en/efeso, relacion:aquila/acompana/pablo, relacion:priscila/acompana/pablo], menciona: [lugar:asia, lugar:efeso, lugar:colosas, lugar:laodicea, lugar:hierapolis, lugar:esmirna, lugar:pergamo, lugar:sardis, lugar:tiatira, lugar:filadelfia], nota: "Saludan las congregaciones de la provincia de Asia y Áquila y Prisca, con la congregación que se reúne en su casa de Éfeso (nota del v. 8). Que se saluden con un beso santo."}
    - {v: 21-24, tipo: carta, entidades: [persona:pablo, evento:pablo-escribe-1-corintios], menciona: [persona:jesus], nota: "Pablo firma el saludo de su puño y letra; Perspicacia cree que Sóstenes pudo escribir el resto. Cierra con la expresión aramea «¡Oh, Señor nuestro, ven!» y con su amor para todos."}
