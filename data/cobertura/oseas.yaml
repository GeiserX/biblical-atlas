# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: oseas
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, entidades: [persona:oseas, persona:beeri-padre-de-oseas, relacion:oseas/pariente/beeri-padre-de-oseas, relacion:oseas/vivio_en/israel], menciona: [persona:uzias, persona:jotan, persona:acaz, persona:ezequias, persona:jeroboan-ii, persona:jehoas-de-israel, lugar:juda, lugar:israel], nota: "Encabezamiento: la palabra de Jehová a Oseas hijo de Beerí, en días de cuatro reyes de Judá y de Jeroboán II. Joás es Jehoás de Israel."}
    - {v: 2-5, tipo: narracion, entidades: [evento:oseas-se-casa-con-gomer, evento:nacimiento-de-jezreel-hijo-de-oseas, persona:oseas, persona:gomer-hija-de-diblaim, persona:diblaim, persona:jezreel-hijo-de-oseas, persona:jehu-de-israel, lugar:jezreel, lugar:valle-de-jezreel, relacion:oseas/pariente/gomer-hija-de-diblaim, relacion:gomer-hija-de-diblaim/pariente/diblaim, relacion:jezreel-hijo-de-oseas/pariente/oseas, relacion:jezreel-hijo-de-oseas/pariente/gomer-hija-de-diblaim, lugar:israel], menciona: [evento:caida-de-samaria], nota: "La sangre de Jezreel no es la matanza que Jehová mandó a Jehú, sino, según Perspicacia, la culpa de su casa por mantener los becerros. Se cumplió al matar Salum a Zacarías (2Re 15:8-10)."}
    - {v: 6-7, tipo: narracion, entidades: [evento:nacimiento-de-lo-ruhama, persona:lo-ruhama, persona:gomer-hija-de-diblaim, relacion:lo-ruhama/pariente/gomer-hija-de-diblaim, relacion:jezreel-hijo-de-oseas/pariente/lo-ruhama, lugar:israel], menciona: [persona:oseas, lugar:juda, evento:caida-de-samaria, evento:senaquerib-contra-jerusalen], nota: "Judá se salvará sin armas: Perspicacia y «Toda Escritura» lo ven cumplido cuando el ángel mató a 185.000 asirios de Senaquerib."}
    - {v: 8-9, tipo: narracion, entidades: [evento:nacimiento-de-lo-ammi, persona:lo-ammi, persona:gomer-hija-de-diblaim, relacion:lo-ammi/pariente/gomer-hija-de-diblaim, relacion:jezreel-hijo-de-oseas/pariente/lo-ammi, relacion:lo-ruhama/pariente/lo-ammi], menciona: [persona:lo-ruhama]}
    - {v: 10-11, tipo: profecia, menciona: [lugar:israel, lugar:juda, evento:regreso-de-537], nota: "Promesa: Israel será numeroso como la arena y se llamará hijos del Dios vivo; Judá e Israel, unidos bajo un cabeza, subirán del país. Se cumplió en 537 a.e.c.; Pablo y Pedro la citan."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: profecia, nota: "Los hermanos serán llamados «Mi pueblo» y las hermanas, compadecidas: se da la vuelta a los nombres de Lo-Ammí y Lo-Ruhamá (notas de Os 2:1)."}
    - {v: 2-13, tipo: profecia, nota: "Jehová acusa a la madre, Israel, de irse tras sus amantes y atribuirles el grano, el vino y la lana; le quitará todo y acabará con sus fiestas. Usó para Baal el oro que él le dio."}
    - {v: 14-23, tipo: profecia, entidades: [lugar:valle-de-acor, evento:exodo], menciona: [lugar:egipto, evento:regreso-de-537], nota: "Jehová la llevará al desierto y le hablará al corazón; ella lo llamará Esposo mío y no Baal mío. Jezreel es aquí el pueblo sembrado de nuevo; La Atalaya (2005) lo ve cumplido en 537 a.e.c."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: narracion, entidades: [evento:oseas-vuelve-a-tomar-a-gomer, persona:oseas, persona:gomer-hija-de-diblaim, relacion:oseas/pariente/gomer-hija-de-diblaim], nota: "El texto no nombra a la mujer; Perspicacia y «Toda Escritura» la tienen por Gómer. Las tortas de pasas se usaban en la adoración falsa. Un homer eran unos 220 litros."}
    - {v: 4-5, tipo: profecia, menciona: [persona:david, persona:jesus, lugar:israel, evento:caida-de-samaria, evento:regreso-de-537], nota: "Israel pasará mucho tiempo sin rey, sacrificios, columnas ni terafim; luego buscará a Jehová y a «David su rey». La Atalaya de 1991 («La abundante bondad de Jehová») ve a ese rey en Jesucristo y un primer cumplimiento en 537."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel], menciona: [persona:oseas], nota: "Jehová abre un pleito contra los habitantes del país: no hay verdad, amor leal ni conocimiento de Dios, sino perjurio, robo, adulterio y sangre. Por eso la tierra estará de luto."}
    - {v: 4-10, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], nota: "Reproche a los sacerdotes: rechazaron el conocimiento y olvidaron la ley, así que Jehová los rechaza y olvidará a sus hijos. Viven del pecado del pueblo; comerán sin saciarse."}
    - {v: 11-14, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], nota: "La prostitución y el vino embotan el juicio. El pueblo consulta ídolos de madera y una vara de adivinar, sacrifica en montes y bajo árboles frondosos, y los hombres van con prostitutas de templo."}
    - {v: 15-19, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:juda, lugar:guilgal-cerca-de-betel, lugar:betel], nota: "Judá no debe imitar a Israel ni ir a Guilgal (la de cerca de Betel, o quizá la de Jericó) ni a Bet-Aven, nombre de desprecio de Betel. Efraín, el reino del norte, está pegado a sus ídolos."}
  5:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:juda, lugar:mizpa-de-galaad, lugar:monte-tabor], nota: "Juicio contra los sacerdotes, Israel y la casa del rey, que fueron trampa en Mizpá y red en el Tabor, quizá centros de idolatría (Perspicacia «Tabor»). Efraín cayó y Judá con él; buscan a Jehová y no lo hallan."}
    - {v: 8-10, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:guibea-de-benjamin, lugar:rama-de-benjamin, lugar:betel, lugar:israel, lugar:juda], nota: "Alarma en Guibeá, Ramá y Bet-Aven, ciudades de Benjamín, tribu sin ficha. Según Perspicacia «Guibeah», Oseas habla como si el norte ya hubiera caído y el enemigo amenazara a Judá, cuyos príncipes mueven los mojones."}
    - {v: 11-15, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:juda, lugar:asiria], nota: "Efraín, oprimido, acudió a Asiria y mandó mensajeros a un gran rey sin nombre, que no pudo curarlo. Jehová será como un león para Efraín y Judá, y se retirará hasta que lo busquen en su angustia."}
  6:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [persona:oseas], nota: "Oseas invita al pueblo a volver a Jehová, según «Toda Escritura»: quien los hirió los curará y al tercer día los levantará; su llegada es tan segura como el alba y la lluvia de primavera."}
    - {v: 4-6, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:juda], nota: "El amor leal de Efraín y Judá se esfuma como el rocío. Jehová prefiere amor leal y conocimiento de Dios a los sacrificios; Jesús citó el versículo 6 en Mt 9:13 y 12:7."}
    - {v: 7-8, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:galaad], nota: "Rompieron el pacto. Galaad es ciudad de malhechores manchada de sangre; Perspicacia «Galaad», núm. 5, no sabe si habla de Ramot-Galaad, de Jabés-Galaad o de toda la región, que es la ficha que usamos."}
    - {v: 9-11, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:siquem, lugar:israel, lugar:juda], nota: "Los sacerdotes, como una banda de asaltantes, matan en el camino cerca de Siquem. Efraín se prostituye e Israel se contamina. A Judá le espera una cosecha cuando Jehová haga volver a los cautivos."}
  7:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:samaria], nota: "Cuando Dios quiere sanar a Israel salen a la luz los pecados de Efraín y de Samaria: robos, engaño y una corte que disfruta la maldad. Arden de intrigas como un horno y derriban a sus propios reyes."}
    - {v: 8-12, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:egipto, lugar:asiria], menciona: [persona:hosea-de-israel], nota: "Efraín, el reino del norte, se mezcla con las naciones y no ve su declive. Como paloma sin juicio busca a Egipto y a Asiria, y Dios lo atrapará. Perspicacia «Asiria» lo une a la intriga de Hosea con Egipto."}
    - {v: 13-16, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:egipto], nota: "¡Ay de ellos! Huyen de Dios, le mienten y le claman sin sinceridad, haciéndose cortes por el grano y el vino. Fallan como un arco sin tensión; sus príncipes morirán a espada y Egipto se burlará."}
  8:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:samaria], nota: "Suena la alarma: un enemigo cae como un águila sobre un pueblo que rompió el pacto. Israel puso reyes sin Dios e hizo ídolos; el becerro de Samaria acabará en pedazos. Las referencias remiten a los becerros de Jeroboán."}
    - {v: 7-10, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:asiria], menciona: [evento:caida-de-samaria], nota: "Siembran viento y cosecharán tempestad. Israel sube a Asiria y paga a otras naciones como amantes, pero será tragado entre ellas. Perspicacia y «Toda Escritura» ven esto cumplido cuando Asiria tomó Samaria en 740 a.e.c."}
    - {v: 11-14, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:egipto, lugar:juda], menciona: [evento:caida-de-samaria, evento:senaquerib-contra-jerusalen, evento:destruccion-de-jerusalen-607], nota: "Efraín multiplica altares para pecar y tiene por ajena la ley de Dios; volverá a Egipto. Israel construye templos y Judá ciudades fortificadas, pero el fuego las devorará: Senaquerib (732) y Babilonia (607 a.e.c.)."}
  9:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:egipto, lugar:asiria, lugar:menfis], nota: "Israel no tiene motivo para celebrar: ha sido infiel a su Dios. Perderá la cosecha y la tierra; irá a Egipto y a Asiria, donde comerá lo impuro. Menfis enterrará a los que huyan y crecerán ortigas en sus casas."}
    - {v: 7-9, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel], menciona: [lugar:guibea-de-benjamin], nota: "Llega el castigo: el profeta parecerá necio y el inspirado, loco. El centinela de Efraín estuvo con Dios; sus profetas son ahora trampas. Su corrupción iguala la de Guibeá (Jue 19 y 20, según Perspicacia); lo crea Jueces."}
    - {v: 10-14, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel], menciona: [lugar:tiro], nota: "Dios halló a Israel como uvas en el desierto, pero sus padres se entregaron a Baal de Peor, un dios sin ficha (Nú 25; lo crea Números). Efraín, lozano como Tiro, perderá a sus hijos; el profeta pide vientres estériles."}
    - {v: 15-17, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel, lugar:guilgal-cerca-de-betel], menciona: [evento:caida-de-samaria], nota: "Toda la maldad de Israel se concentró en Guilgal; Dios lo echará de su casa y andará fugitivo entre las naciones. Perspicacia pone este Guilgal cerca de Betel, aunque admite el de Jericó. La Atalaya lo ve cumplido en 740."}
  10:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:israel], nota: "Israel, vid que da fruto para sí, multiplica altares y columnas sagradas, y Dios los derribará. Sin temor de Jehová dirán que no tienen rey; sus juramentos falsos y sus pactos brotan como hierba venenosa."}
    - {v: 5-8, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:betel], menciona: [lugar:samaria, lugar:asiria, lugar:israel, evento:caida-de-samaria], nota: "Samaria llorará por el becerro de Bet-Aven, es decir Betel, que irá a Asiria como regalo para el gran rey, un título sin nombre. Samaria y su rey caerán (740 a.e.c.). Efraín es el reino del norte."}
    - {v: 9-10, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:guibea-de-benjamin], menciona: [lugar:israel], nota: "Israel peca desde los días de Guibeá; Perspicacia ve posible que aluda al crimen de Jue 19 y 20, suceso que crea Jueces. Dios los castigará cuando quiera y los pueblos se unirán contra ellos."}
    - {v: 11-13, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:israel, lugar:juda], nota: "Efraín, ternera que disfrutaba trillando, llevará yugo; Judá arará y Jacob, aquí el pueblo, rastrillará. Dios pide sembrar justicia y buscarlo, pero confiaron en sus guerreros y cosecharon injusticia."}
    - {v: 14-15, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, persona:salman, lugar:casa-de-arbel, relacion:salman/mismo_que/salmanasar-v, lugar:betel], menciona: [persona:salmanasar-v, lugar:israel, evento:caida-de-samaria], nota: "Sus fortalezas serán arrasadas como la casa de Arbel cuando la saqueó Salmán. Perspicacia no fecha ese saqueo, así que no es evento. A Betel le pasará igual y el rey de Israel desaparecerá."}
  11:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, evento:exodo], menciona: [lugar:israel, lugar:egipto, evento:huida-a-egipto], nota: "Dios amó a Israel desde joven y llamó a su hijo fuera de Egipto; Mt 2:15 lo aplica a Jesús. Aun así ofrecieron sacrificios a las imágenes de Baal, dios sin ficha, aunque él había enseñado a andar a Efraín."}
    - {v: 5-7, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:egipto, lugar:asiria, lugar:israel, evento:caida-de-samaria], nota: "No volverán a Egipto: Asiria mandará sobre ellos, porque rehusaron volver a Dios. La espada recorrerá sus ciudades por sus maquinaciones; el pueblo se inclina a la infidelidad."}
    - {v: 8-9, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:adma, lugar:zeboyim, lugar:israel, evento:destruccion-de-sodoma-y-gomorra, evento:regreso-de-537], nota: "Dios no quiere tratar a Efraín como a Admá y Zeboyim, destruidas junto con Sodoma y Gomorra (Dt 29:23). Se conmueve de compasión y no descargará toda su ira: es Dios, no un hombre."}
    - {v: 10-11, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:egipto, lugar:asiria, evento:regreso-de-537], nota: "Jehová rugirá como un león y sus hijos acudirán temblando desde el oeste, desde Egipto y Asiria, y los hará vivir otra vez en sus casas. Perspicacia aplica Os 11:8-11 al regreso de 537."}
    - {v: "12", tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:israel, lugar:juda], nota: "Efraín e Israel cercan a Dios con mentiras y engaños; Judá todavía camina con él y le es fiel. Las referencias remiten a Ezequías (2Re 18:1, 6)."}
  12:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:israel, lugar:asiria, lugar:egipto, lugar:juda], nota: "Efraín persigue el viento del este: pacta con Asiria y lleva aceite a Egipto (2Re 15:19; 17:4, sucesos que crea Reyes). Jehová pleitea con Judá y pedirá cuentas a Jacob, aquí el pueblo."}
    - {v: 3-6, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, persona:jacob, lugar:betel, evento:nacimiento-de-esau-y-jacob, evento:jacob-lucha-con-un-angel, evento:jacob-suena-con-una-escalera-en-betel], nota: "Jacob agarró del talón a su hermano, que el texto no nombra (Esaú), luchó con un ángel, lloró y pidió su favor, y Dios lo halló en Betel. Jehová de los ejércitos llama al pueblo a volver."}
    - {v: 7-10, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:israel, lugar:egipto, evento:exodo], nota: "Efraín, mercader de balanzas falsas, presume de rico y sin culpa. Jehová, su Dios desde Egipto, lo hará vivir otra vez en tiendas, como en una fiesta, y le habló por profetas, visiones y parábolas."}
    - {v: "11", tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:guilgal-cerca-de-betel], menciona: [lugar:galaad], nota: "Engaño en Galaad y toros sacrificados en Guilgal, con altares como montones de piedras. Perspicacia duda si este Galaad es la región o una ciudad, y si Guilgal es el de Betel o el de Jericó."}
    - {v: 12-14, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, persona:jacob, lugar:padan-aram, relacion:jacob/vivio_en/padan-aram, evento:isaac-envia-a-jacob-a-padan-aram, evento:jacob-se-casa-con-lea-y-raquel, evento:exodo], menciona: [lugar:egipto, lugar:israel], nota: "Jacob huyó a Aram y cuidó ovejas por una esposa, sin nombre aquí. Por un profeta, que las referencias llevan a Moisés (Sl 77:20), Jehová sacó a Israel de Egipto. Efraín cargará con su culpa de sangre."}
  13:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:israel], nota: "Efraín, la tribu que más pesaba en el reino del norte, cayó por Baal. Ahora funde ídolos de plata y pide besar los becerros de Jeroboán (1Re 12:28-30). Pasará como neblina, rocío, paja o humo."}
    - {v: 4-8, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:egipto, evento:exodo], nota: "Jehová es su Dios desde que los sacó de Egipto y los cuidó en el desierto (Dt 2:7). Saciados, se volvieron orgullosos y lo olvidaron; él los atacará como león, leopardo u osa sin crías."}
    - {v: 9-11, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:israel], nota: "Israel pidió un rey (1Sa 8:5); Dios se lo dio con enojo y se lo quitará. Las referencias remiten a Saúl (1Sa 12:13) y al encarcelamiento de Hosea (2Re 17:4). El suceso de 1Sa 8 lo crea 1 Samuel."}
    - {v: 12-14, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:israel, evento:regreso-de-537], nota: "El pecado de Efraín queda guardado; es un hijo necio que no quiere nacer. Jehová promete rescatarlos de la Tumba; Pablo cita el v. 14 en 1Co 15:55. Perspicacia lo aplica al regreso de Babilonia en 537."}
    - {v: 15-16, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda, lugar:samaria], menciona: [evento:caida-de-samaria], nota: "Un viento del este, caliente y seco, vendrá del desierto y agotará sus fuentes. Samaria caerá a espada por rebelde. Se cumplió en 740 a.e.c. (2Re 17:5, 6); el libro no lo narra."}
  14:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: profecia, entidades: [evento:juicios-profeticos-contra-efrain-y-juda], menciona: [lugar:israel, lugar:asiria, evento:regreso-de-537], nota: "Llamada a Israel para que vuelva a Jehová, pida perdón y le ofrezca la alabanza de sus labios en lugar de toros (Heb 13:15). Ni Asiria ni los caballos ni los ídolos los salvarán."}
