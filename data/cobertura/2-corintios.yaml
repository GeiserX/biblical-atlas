    - {v: 1-4, tipo: carta, entidades: [carta:2-corintios, persona:pablo], menciona: [lugar:corinto, evento:complot-en-grecia, persona:jesus, evento:muerte-de-jesus, evento:resurreccion-de-jesus], nota: "Se prepara para ir por tercera vez, la visita de c. 56 según la nota de 12:14. Cita Dt 19:15 sin nombrar a Moisés y avisa a los que pecaron de que habrá disciplina. Cristo vive por poder divino."}
    - {v: 5-10, tipo: carta, entidades: [persona:pablo, evento:pablo-escribe-2-corintios], menciona: [persona:jesus], nota: "Que se examinen para ver si siguen en la fe. Pablo ora para que se corrijan y escribe estando lejos, para no tener que ser severo cuando esté allí con la autoridad que el Señor le dio."}
    - {v: 11-14, tipo: carta, menciona: [persona:jesus], nota: "Despedida: que se alegren, se corrijan, vivan en paz y se saluden con un beso santo. Saludan los santos que están con Pablo, sin nombres. Cierra pidiendo para ellos la bondad de Jesucristo, el amor divino y el espíritu santo."}
