# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: cantar-de-los-cantares
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: poesia, entidades: [persona:salomon], menciona: [periodo:salomon], nota: "Título: el cantar de los cantares, la canción superlativa, que es de Salomón. Perspicacia y «Toda Escritura» lo tienen por su escritor y lo fechan al comienzo de su reinado, hacia 1020 a.e.c."}
    - {v: 2-4, tipo: poesia, entidades: [evento:la-sulamita-en-el-campamento-de-salomon, persona:sulamita, persona:salomon, lugar:sunem], nota: "En las tiendas del rey, la sulamita habla a su pastor como si estuviera allí. «El rey» que la ha traído es Salomón; el pastor no tiene nombre."}
    - {v: 5-8, tipo: poesia, entidades: [evento:la-sulamita-en-el-campamento-de-salomon, evento:el-pastor-invita-a-la-sulamita-y-sus-hermanos-la-ponen-a-cuidar-las-vinas, persona:sulamita, persona:salomon, lugar:quedar, relacion:sulamita/vivio_en/sunem], menciona: [lugar:jerusalen], nota: "Está morena como las tiendas de Quedar porque sus hermanos, sin nombre, la pusieron al sol en las viñas. Las hijas de Jerusalén son las damas de la corte, que la mandan a buscar a su pastor."}
    - {v: 9-14, tipo: poesia, entidades: [evento:la-sulamita-en-el-campamento-de-salomon, persona:salomon, persona:sulamita, lugar:en-guedi], nota: "Salomón la compara con una yegua de los carros del faraón, título sin ficha (1Re 10:28), y le promete adornos de oro y plata. Ella responde que ama a otro, como la alheña de las viñas de En-Guedí."}
    - {v: 15-17, tipo: poesia, entidades: [evento:el-pastor-visita-a-la-sulamita-en-el-campamento, persona:sulamita], nota: "Entra el pastor y alaba sus ojos de paloma; ella le responde que su lecho es la hierba y su casa, los cedros y enebros del campo."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: poesia, entidades: [evento:el-pastor-visita-a-la-sulamita-en-el-campamento, persona:sulamita, lugar:llanura-de-saron], nota: "Ella se llama flor de azafrán de la llanura costera, que Perspicacia «Sarón» identifica con Sarón; él la ve como un lirio entre espinos."}
    - {v: 3-7, tipo: poesia, entidades: [evento:la-sulamita-anhela-a-su-pastor, persona:sulamita, lugar:sunem], menciona: [lugar:jerusalen], nota: "Compara a su amado con un manzano: la llevó a la sala del banquete («casa del vino», según la nota). Hace jurar a las damas de la corte que no despertarán en ella un amor no deseado."}
    - {v: 8-15, tipo: poesia, entidades: [evento:el-pastor-invita-a-la-sulamita-y-sus-hermanos-la-ponen-a-cuidar-las-vinas, persona:sulamita], nota: "Recuerdo: en primavera el pastor llegó saltando por las colinas y la invitó a salir. Según Perspicacia, los zorros que destrozan las viñas son la tarea que le dieron sus hermanos."}
    - {v: 16-17, tipo: poesia, entidades: [evento:la-sulamita-anhela-a-su-pastor, persona:sulamita], nota: "Dice que ella y su amado se pertenecen y le pide que vuelva veloz como una gacela. Las «montañas de separación» (o «de Beter», según la nota) no tienen artículo en Perspicacia ni llevan ficha."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: poesia, entidades: [evento:la-sulamita-anhela-a-su-pastor, persona:sulamita], menciona: [lugar:jerusalen], nota: "De noche, en el campamento de Salomón, la sulamita sueña que busca a su amado por la ciudad y lo lleva a casa de su madre, que no se nombra. Vuelve a juramentar a las damas de la corte."}
    - {v: 6-11, tipo: poesia, entidades: [evento:salomon-regresa-a-jerusalen-con-la-sulamita, persona:salomon, persona:sulamita, lugar:jerusalen, lugar:libano, relacion:salomon/vivio_en/jerusalen], menciona: [periodo:salomon], nota: "La litera real, hecha con madera del Líbano, plata, oro y lana púrpura, llega escoltada por guerreros de Israel (1Re 9:22). La referencia del v. 11 remite a 2Sa 12:24: su madre es Bat-Seba."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-5, tipo: poesia, entidades: [evento:el-pastor-visita-a-la-sulamita-en-jerusalen, persona:sulamita, lugar:jerusalen], menciona: [lugar:galaad, persona:david], nota: "El pastor describe a la sulamita con velo: cabello como cabras que bajan de Galaad y cuello como la torre de David, con mil escudos colgados (2Sa 8:7; 2Re 11:10). La torre va en los nombres de Jerusalén."}
    - {v: "6", tipo: poesia, entidades: [evento:el-pastor-visita-a-la-sulamita-en-jerusalen, persona:sulamita], nota: "Ella dice que se irá a los montes del olíbano y la mirra antes de que caiga la tarde. Perspicacia lo lee como su deseo de salir de la ciudad."}
    - {v: 7-11, tipo: poesia, entidades: [evento:el-pastor-visita-a-la-sulamita-en-jerusalen, persona:sulamita, lugar:libano, lugar:antilibano, lugar:monte-hermon], nota: "La llama novia y hermana y le pide que baje del Líbano, del Amaná, del Senir y del Hermón, guaridas de leones y leopardos. Sus caricias superan al vino y su ropa huele como el Líbano."}
    - {v: 12-15, tipo: poesia, entidades: [evento:el-pastor-visita-a-la-sulamita-en-jerusalen, persona:sulamita], menciona: [lugar:libano], nota: "Ella es un jardín cerrado y un manantial sellado, lleno de granados, nardo, azafrán, canela, mirra y áloes, y un pozo de agua fresca con arroyos que bajan del Líbano."}
    - {v: "16", tipo: poesia, entidades: [evento:el-pastor-visita-a-la-sulamita-en-jerusalen, persona:sulamita], nota: "Él pide a los vientos del norte y del sur que esparzan el aroma de su jardín, y ella invita a su amado a entrar y comer sus mejores frutos. La respuesta sigue en Can 5:1."}
  5:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: poesia, entidades: [evento:el-pastor-visita-a-la-sulamita-en-jerusalen, persona:sulamita], nota: "El pastor acepta la invitación de 4:16: ha entrado en su jardín, su novia. Las mujeres de Jerusalén los animan. Cierra la visita que empieza en Can 4:1."}
    - {v: 2-8, tipo: poesia, entidades: [evento:la-sulamita-describe-a-su-amado, persona:sulamita, lugar:jerusalen], nota: "La joven sueña que su amado llama, tarda en abrirle y él se va; lo busca y los guardias la golpean. Es un sueño, no un hecho. Pide a las hijas de Jerusalén que la avisen si lo encuentran."}
    - {v: "9", tipo: poesia, entidades: [evento:la-sulamita-describe-a-su-amado, persona:sulamita], nota: "Las hijas de Jerusalén, mujeres de la corte de Salomón según Perspicacia, le preguntan qué tiene su amado que no tengan los demás. No son personas con ficha."}
    - {v: 10-16, tipo: poesia, entidades: [evento:la-sulamita-describe-a-su-amado, persona:sulamita], menciona: [lugar:libano], nota: "Ella describe a su amado de la cabeza a los pies: sonrosado, cabello negro, ojos como palomas, labios como lirios; su porte es como el Líbano con sus cedros. El amado es el pastor, sin nombre en el libro."}
  6:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: poesia, entidades: [evento:la-sulamita-describe-a-su-amado, persona:sulamita], nota: "Las hijas de Jerusalén se ofrecen a buscar al amado. Ella dice que bajó a su jardín a pastorear entre los lirios: ella es de él y él es de ella."}
    - {v: 4-10, tipo: poesia, entidades: [evento:salomon-vuelve-a-alabar-a-la-sulamita, persona:salomon, persona:sulamita, lugar:jerusalen, lugar:tirza], menciona: [lugar:galaad, periodo:salomon], nota: "Habla el rey: la compara con Tirzá y Jerusalén, su cabello con cabras de Galaad. Tiene 60 reinas y 80 concubinas; Perspicacia fecha el poema por este dato. El v. 10 cita lo que dicen las mujeres."}
    - {v: 11-12, tipo: poesia, entidades: [evento:la-sulamita-llega-al-campamento-de-salomon, persona:sulamita, lugar:sunem], nota: "La joven explica que bajó al jardín de los nogales a ver el valle y, sin darse cuenta, acabó junto a los carros de su pueblo, los del campamento de Salomón según Perspicacia."}
    - {v: "13", tipo: poesia, entidades: [evento:salomon-vuelve-a-alabar-a-la-sulamita, persona:salomon, persona:sulamita, lugar:sunem, relacion:sulamita/vivio_en/sunem], menciona: [lugar:mahanaim], nota: "Salomón le pide que vuelva (Perspicacia; el plural de la TNM no dice quién más) y ella pregunta por qué la miran. Único versículo que la llama sulamita. La nota da «danza de Mahanaim»: quizá una fiesta allí."}
  7:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-9, tipo: poesia, entidades: [evento:salomon-vuelve-a-alabar-a-la-sulamita, persona:salomon, persona:sulamita, lugar:hesbon, lugar:libano], menciona: [lugar:damasco, lugar:monte-carmelo], nota: "El rey la describe de los pies a la cabeza: sus ojos, como los estanques de Hesbón cerca de la puerta de Bat-Rabim; su nariz, como la torre del Líbano vuelta hacia Damasco; su cabeza, como el Carmelo."}
    - {v: 10-13, tipo: poesia, entidades: [evento:la-sulamita-se-mantiene-fiel-a-su-pastor, persona:sulamita], nota: "Ella, que ya toma la palabra en el versículo 9, dice que es de su amado y lo invita a salir al campo y a las viñas en primavera; le tiene guardados frutos de toda clase."}
  8:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: poesia, entidades: [evento:la-sulamita-se-mantiene-fiel-a-su-pastor, persona:sulamita], menciona: [lugar:jerusalen], nota: "Quisiera que su amado fuera como un hermano, para besarlo en público y llevarlo a casa de su madre. Hace jurar otra vez a las hijas de Jerusalén, las damas de la corte, que no despertarán en ella el amor."}
    - {v: 5-7, tipo: poesia, entidades: [evento:la-sulamita-vuelve-a-casa, persona:sulamita, lugar:sunem, relacion:sulamita/vivio_en/sunem], nota: "Sus hermanos la ven llegar del desierto apoyada en su pastor. Ella recuerda que lo despertó bajo el manzano donde él nació y dice que ese amor, llama de Jah, no lo apagan las aguas ni lo compra el dinero."}
    - {v: 8-10, tipo: poesia, entidades: [evento:la-sulamita-vuelve-a-casa, persona:sulamita], nota: "Recuerda lo que decían sus hermanos cuando era pequeña: si resultaba una muralla la adornarían, y si era una puerta la cerrarían. Ella afirma que ha sido una muralla y que su amado la ve en paz."}
    - {v: 11-12, tipo: poesia, entidades: [evento:la-sulamita-vuelve-a-casa, persona:sulamita, persona:salomon, lugar:baal-hamon], nota: "Salomón arrendaba su viña de Baal-Hamón y cada cuidador le pagaba mil piezas de plata. Ella le deja esas ganancias al rey: su propia viña es solo para ella."}
    - {v: 13-14, tipo: poesia, entidades: [evento:la-sulamita-vuelve-a-casa, persona:sulamita], nota: "El pastor, rodeado de sus compañeros, pide oír la voz de la que vive en los jardines. Ella le ruega que venga corriendo como una gacela sobre los montes de especias."}
