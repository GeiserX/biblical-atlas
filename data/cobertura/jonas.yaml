# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: jonas
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: narracion, entidades: [persona:jonas-profeta, persona:amitai, relacion:jonas-profeta/pariente/amitai, evento:jonas-huye-hacia-tarsis, lugar:ninive, lugar:jope, lugar:tarsis], menciona: [evento:senal-de-jonas-en-galilea, evento:dedo-de-dios-y-senal-de-jonas], nota: "La nota da «paloma» como significado de Jonás. Jehová lo manda a anunciar un juicio contra Nínive por su maldad; él baja a Jope y embarca hacia Tarsis. Perspicacia lo identifica con el profeta de 2Re 14:25."}
    - {v: 4-16, tipo: narracion, entidades: [evento:los-marineros-arrojan-a-jonas-al-mar, persona:jonas-profeta], nota: "Jehová lanza una tormenta. Los marineros y su capitán, sin nombre, claman a sus dioses y echan suertes, que señalan a Jonás. Él, hebreo, pide que lo arrojen; al hacerlo, el mar se calma."}
    - {v: "17", tipo: narracion, entidades: [evento:un-gran-pez-se-traga-a-jonas, persona:jonas-profeta], menciona: [evento:senal-de-jonas-en-galilea, evento:senal-de-jonas-en-magadan, evento:dedo-de-dios-y-senal-de-jonas], nota: "Jehová envía un pez enorme que se traga a Jonás, y pasa dentro tres días con sus noches. Las referencias llevan a la señal de Jonás que Jesús da en Mt 12:39, 40, 16:4 y Lu 11:29, 30."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-9, tipo: poesia, entidades: [evento:un-gran-pez-se-traga-a-jonas, persona:jonas-profeta], menciona: [evento:senal-de-jonas-en-galilea], nota: "Desde el vientre del pez, Jonás ora: se hundió en el mar, pero Jehová lo sacó de la Tumba, el Seol según la nota, un lugar simbólico. Promete cumplir sus votos, porque la salvación viene de Jehová."}
    - {v: "10", tipo: narracion, entidades: [evento:un-gran-pez-se-traga-a-jonas, persona:jonas-profeta], nota: "Jehová da la orden y el pez deja a Jonás en la orilla. El texto no dice dónde; Perspicacia «Jonás, Libro de» recuerda que el relato omite ese detalle."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: narracion, entidades: [evento:jonas-predica-en-ninive, persona:jonas-profeta, lugar:ninive], nota: "Segundo encargo de Jehová, y esta vez Jonás obedece. La nota al pie traduce literalmente «ciudad grande para Dios»: recorrerla a pie llevaba tres días. Tras un día de camino por ella anuncia su ruina en 40 días."}
    - {v: 5-10, tipo: narracion, entidades: [evento:ninive-se-arrepiente, lugar:ninive], menciona: [evento:senal-de-jonas-en-galilea, evento:dedo-de-dios-y-senal-de-jonas], nota: "El rey de Nínive y sus nobles no tienen nombre ni ficha; Perspicacia «Asiria» ve posible, sin seguridad, que reinara Adad-nirari III. Las referencias llevan a Mt 12:41 y Lu 11:32, donde Jesús recuerda este arrepentimiento."}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: narracion, entidades: [evento:jonas-se-enfurece-por-el-perdon-de-ninive, evento:jonas-huye-hacia-tarsis, persona:jonas-profeta], menciona: [lugar:tarsis], nota: "Jonás explica que huyó a Tarsis porque sabía que Jehová es compasivo, paciente y de amor leal (Éx 34:6), y pide morir, como Elías en 1Re 19:4."}
    - {v: 5-11, tipo: narracion, entidades: [evento:leccion-de-la-calabaza-vinatera, persona:jonas-profeta, lugar:ninive], nota: "La nota del v. 6 da «ricino» como posible planta. Los más de 120.000 que no saben distinguir el bien del mal son, según otra nota, los que no distinguen su mano derecha de la izquierda."}
