# biblical-earth: cobertura de un libro. Formato en data/cobertura/README.md.
libro: sofonias
capitulos:
  1:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: profecia, entidades: [persona:sofonias-profeta, persona:cusi-hijo-de-guedalias, persona:guedalias-hijo-de-amarias, persona:amarias-hijo-de-ezequias, persona:ezequias-antepasado-de-sofonias, persona:josias, evento:sofonias-anuncia-el-dia-de-jehova, relacion:sofonias-profeta/pariente/cusi-hijo-de-guedalias, relacion:cusi-hijo-de-guedalias/pariente/guedalias-hijo-de-amarias, relacion:guedalias-hijo-de-amarias/pariente/amarias-hijo-de-ezequias, relacion:amarias-hijo-de-ezequias/pariente/ezequias-antepasado-de-sofonias, relacion:ezequias-antepasado-de-sofonias/mismo_que/ezequias, relacion:josias/pariente/amon-de-juda, relacion:sofonias-profeta/vivio_en/juda], menciona: [persona:amon-de-juda, persona:ezequias, lugar:juda, periodo:josias, evento:libro-de-la-ley-hallado], nota: "Encabezamiento: Sofonías («Jehová ha ocultado») recibe la palabra de Jehová en días de Josías; su linaje sube hasta un Ezequías. Según «Toda Escritura», Josías atendió el aviso, y el libro de la Ley, hallado después, lo confirmó."}
    - {v: 2-3, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova], nota: "Jehová anuncia que barrerá de la tierra a hombres y animales, aves y peces. Los obstáculos que eliminará son, según la nota al pie, cosas y prácticas de la idolatría."}
    - {v: 4-6, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova, lugar:juda, lugar:jerusalen], menciona: [evento:destruccion-de-jerusalen-607], nota: "Contra Judá y Jerusalén: caerán los restos de Baal, los sacerdotes de dioses extranjeros, quienes adoran a los astros en las azoteas y quienes juran por Jehová y por Malcam, dios ammonita según Perspicacia. Se cumplió en 607."}
    - {v: 7-9, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova], menciona: [evento:destruccion-de-jerusalen-607], nota: "Silencio: el día de Jehová se acerca y él tiene listo un sacrificio. Pedirá cuentas a príncipes, hijos del rey y a quienes visten a lo extranjero. «Toda Escritura» lo ve cumplido en los hijos y el nieto de Josías."}
    - {v: 10-13, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova, lugar:jerusalen], menciona: [evento:destruccion-de-jerusalen-607], nota: "Habrá gritos en la Puerta del Pescado, el Segundo Barrio y Mactés, zonas de Jerusalén según Perspicacia, y caerán los comerciantes. Jehová revisará la ciudad con lámparas; los indiferentes perderán casas y viñas."}
    - {v: 14-18, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova], menciona: [evento:destruccion-de-jerusalen-607], nota: "El gran día de Jehová llega deprisa: furia, angustia, tinieblas y toques de guerra contra las ciudades amuralladas. Ni plata ni oro salvarán. «Toda Escritura» compara el v. 17 con Lamentaciones 4:14, escrito tras 607."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-3, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova], menciona: [evento:destruccion-de-jerusalen-607], nota: "Llamada a la nación sin vergüenza: antes de que llegue la furia de Jehová, que los mansos lo busquen a él, la justicia y la mansedumbre; quizá queden ocultos. «Toda Escritura» compara el v. 2 con Lamentaciones 4:11."}
    - {v: 4-7, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova, lugar:gaza, lugar:asquelon, lugar:asdod, lugar:ecron, lugar:filistea], menciona: [lugar:canaan, periodo:potencia-babilonica], nota: "Gaza, Asquelón, Asdod y Ecrón quedarán vacías. La costa de los keretitas, pueblo afín a los filisteos, y Canaán, que aquí es su tierra, será pasto para el resto de Judá. Perspicacia atribuye el cumplimiento a Babilonia."}
    - {v: 8-11, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova, lugar:moab, lugar:ammon], menciona: [lugar:sodoma, lugar:gomorra, evento:destruccion-de-sodoma-y-gomorra, persona:nabucodonosor-ii], nota: "Moab y los ammonitas se burlaron del pueblo de Jehová: acabarán como Sodoma y Gomorra, entre ortigas y sal. «Toda Escritura» recuerda que Nabucodonosor sometió a Moab y que ambos pueblos desaparecieron. Jehová dejará sin fuerza a los dioses."}
    - {v: "12", tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova, lugar:etiopia], menciona: [evento:nabucodonosor-contra-egipto], nota: "Los etíopes también caerán a espada. Perspicacia cree que, como aliados de Egipto, lo sufrieron cuando Nabucodonosor conquistó ese país (Eze 30:4, 5)."}
    - {v: 13-15, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova, lugar:asiria, lugar:ninive], menciona: [evento:caida-de-ninive, periodo:potencia-asiria, persona:nabopolasar, persona:ciaxares], nota: "Jehová arruinará Asiria, al norte, y dejará Nínive seca, refugio de fieras y aves. Perspicacia lo ve cumplido cuando Nabopolasar y el medo Ciaxares la tomaron; La Atalaya de 2007 dice que la voz que canta es de aves."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-7, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova, lugar:jerusalen], nota: "¡Ay de la ciudad rebelde y opresora, que Perspicacia identifica con Jerusalén! Príncipes, jueces, profetas y sacerdotes se han corrompido. Jehová, justo, arrasó otras naciones como aviso, pero ella se corrompió todavía más."}
    - {v: "8", tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova], nota: "Jehová pide que lo esperen: ha decidido reunir naciones y reinos para derramar sobre ellos su furia, y el fuego de su celo consumirá la tierra. Las referencias remiten a Joel 3:2 y a Ap 16:14."}
    - {v: 9-13, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova, lugar:etiopia], menciona: [lugar:jerusalen, evento:regreso-de-537], nota: "Los pueblos recibirán un idioma puro para servir unidos a Jehová; desde los ríos de Etiopía, sus dispersos le traerán regalos. En su santa montaña quedará un pueblo humilde. La Atalaya de 2007 ve en ese idioma la verdad bíblica."}
    - {v: 14-20, tipo: profecia, entidades: [evento:sofonias-anuncia-el-dia-de-jehova, lugar:jerusalen], menciona: [evento:regreso-de-537], nota: "Sion, Israel y Jerusalén deben gritar de alegría: Jehová, Rey de Israel, está con ellos y salva como guerrero. Reunirá a los dispersos y les dará fama; Perspicacia lo une a la vuelta del cautiverio."}
