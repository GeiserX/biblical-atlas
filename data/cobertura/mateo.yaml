    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: genealogia, entidades: [persona:jesus, persona:david, persona:abrahan, persona:isaac, persona:jacob, persona:juda-hijo-de-jacob, persona:perez, persona:zerah-hijo-de-juda, persona:tamar-nuera-de-juda, persona:hezron-hijo-de-perez, persona:ram-hijo-de-hezron, persona:aminadab-hijo-de-ram, persona:nahson, persona:salmon, persona:rahab, persona:boaz, persona:rut, persona:obed-hijo-de-boaz, persona:jese, persona:salomon, persona:urias-el-hitita, persona:bat-seba, relacion:jesus/pariente/david, relacion:jesus/pariente/abrahan, relacion:isaac/pariente/abrahan, relacion:jacob/pariente/isaac, relacion:juda-hijo-de-jacob/pariente/jacob, relacion:perez/pariente/juda-hijo-de-jacob, relacion:perez/pariente/tamar-nuera-de-juda, relacion:perez/pariente/zerah-hijo-de-juda, relacion:zerah-hijo-de-juda/pariente/juda-hijo-de-jacob, relacion:zerah-hijo-de-juda/pariente/tamar-nuera-de-juda, relacion:hezron-hijo-de-perez/pariente/perez, relacion:ram-hijo-de-hezron/pariente/hezron-hijo-de-perez, relacion:aminadab-hijo-de-ram/pariente/ram-hijo-de-hezron, relacion:nahson/pariente/aminadab-hijo-de-ram, relacion:salmon/pariente/nahson, relacion:salmon/pariente/rahab, relacion:boaz/pariente/salmon, relacion:boaz/pariente/rahab, relacion:obed-hijo-de-boaz/pariente/boaz, relacion:obed-hijo-de-boaz/pariente/rut, relacion:jese/pariente/obed-hijo-de-boaz, relacion:david/pariente/jese, relacion:salomon/pariente/david, relacion:salomon/pariente/bat-seba, relacion:david/pariente/bat-seba, relacion:urias-el-hitita/pariente/bat-seba], nota: "De Abrahán a David. Mateo nombra a cuatro mujeres: Tamar, Rahab, Rut y la esposa de Urías, que la nota identifica con Bat-Seba. Los hermanos de Judá no se nombran."}
    - {v: 7-11, tipo: genealogia, entidades: [persona:salomon, persona:rehoboam, persona:abias-de-juda, persona:asa, persona:jehosafat, persona:jehoram-de-juda, persona:uzias, persona:jotan, persona:acaz, persona:ezequias, persona:manases-de-juda, persona:amon-de-juda, persona:josias, persona:joaquin, relacion:rehoboam/pariente/salomon, relacion:abias-de-juda/pariente/rehoboam, relacion:asa/pariente/abias-de-juda, relacion:jehosafat/pariente/asa, relacion:jehoram-de-juda/pariente/jehosafat, relacion:uzias/pariente/jehoram-de-juda, relacion:jotan/pariente/uzias, relacion:acaz/pariente/jotan, relacion:ezequias/pariente/acaz, relacion:manases-de-juda/pariente/ezequias, relacion:amon-de-juda/pariente/manases-de-juda, relacion:josias/pariente/amon-de-juda, relacion:joaquin/pariente/josias], menciona: [persona:ocozias-de-juda, persona:jehoas-de-juda, persona:amasias, persona:jehoiaquim, lugar:babilonia, evento:daniel-llevado-a-babilonia], nota: "Los reyes de Judá. Mateo salta a Ocozías, Jehoás y Amasías entre Jehoram y Uzías, y a Jehoiaquim entre Josías y Jeconías, que es Joaquín."}
    - {v: 12-16, tipo: genealogia, entidades: [persona:joaquin, persona:sealtiel, persona:zorobabel, persona:abiud, persona:eliaquim-hijo-de-abiud, persona:azor, persona:sadoc-hijo-de-azor, persona:aquim, persona:eliud, persona:eleazar-hijo-de-eliud, persona:mattan, persona:jacob-hijo-de-mattan, persona:jose-esposo-de-maria, persona:maria-madre-de-jesus, persona:jesus, relacion:sealtiel/pariente/joaquin, relacion:sealtiel/nacio_en/babilonia, relacion:zorobabel/pariente/sealtiel, relacion:zorobabel/pariente/david, relacion:abiud/pariente/zorobabel, relacion:eliaquim-hijo-de-abiud/pariente/abiud, relacion:azor/pariente/eliaquim-hijo-de-abiud, relacion:sadoc-hijo-de-azor/pariente/azor, relacion:aquim/pariente/sadoc-hijo-de-azor, relacion:eliud/pariente/aquim, relacion:eleazar-hijo-de-eliud/pariente/eliud, relacion:mattan/pariente/eleazar-hijo-de-eliud, relacion:jacob-hijo-de-mattan/pariente/mattan, relacion:jose-esposo-de-maria/pariente/jacob-hijo-de-mattan, relacion:jose-esposo-de-maria/pariente/maria-madre-de-jesus, relacion:jesus/pariente/maria-madre-de-jesus, relacion:jesus/pariente/jose-esposo-de-maria], menciona: [lugar:babilonia], nota: "Del destierro a Jesús. Mateo no dice que José engendrara a Jesús: solo que era esposo de María, de quien nació; la nota lo explica como padre adoptivo."}
    - {v: "17", tipo: genealogia, menciona: [persona:abrahan, persona:david, persona:jesus, lugar:babilonia], nota: "Mateo reparte la lista en tres grupos de catorce generaciones: hasta David, hasta la deportación a Babilonia y hasta el Cristo."}
    - {v: 18-25, tipo: narracion, entidades: [evento:jose-lleva-a-maria-a-su-casa, evento:nacimiento-de-jesus, persona:jose-esposo-de-maria, persona:maria-madre-de-jesus, persona:jesus, relacion:maria-madre-de-jesus/pariente/jose-esposo-de-maria, relacion:jose-esposo-de-maria/pariente/david], menciona: [persona:isaias], nota: "La profecía citada es la de Is 7:14. Emmanuel es un título profético del Mesías, no otra persona. El ángel no tiene nombre en el texto."}
  2:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-8, tipo: narracion, entidades: [evento:astrologos-ante-herodes, persona:herodes-el-grande, persona:jesus, lugar:jerusalen, lugar:belen, lugar:judea, relacion:jesus/nacio_en/belen, relacion:herodes-el-grande/vivio_en/jerusalen], menciona: [evento:nacimiento-de-jesus, persona:miqueas-profeta, lugar:juda], nota: "Los astrólogos no tienen nombre ni número. Vienen de Oriente, que Perspicacia cree probablemente Babilonia o Mesopotamia. La profecía citada es la de Miq 5:2."}
    - {v: 9-12, tipo: narracion, entidades: [evento:astrologos-en-belen, persona:jesus, persona:maria-madre-de-jesus, lugar:belen, relacion:jesus/vivio_en/belen, relacion:maria-madre-de-jesus/vivio_en/belen, relacion:jose-esposo-de-maria/vivio_en/belen], menciona: [persona:herodes-el-grande]}
    - {v: 13-15, tipo: narracion, entidades: [evento:huida-a-egipto, persona:jose-esposo-de-maria, persona:jesus, persona:maria-madre-de-jesus, persona:herodes-el-grande, lugar:egipto, relacion:jose-esposo-de-maria/vivio_en/egipto, relacion:maria-madre-de-jesus/vivio_en/egipto, relacion:jesus/vivio_en/egipto], menciona: [persona:oseas], nota: "La cita «Llamé a mi hijo» es de Os 11:1. Egipto era entonces provincia romana."}
    - {v: 16-18, tipo: narracion, entidades: [evento:matanza-de-los-ninos-de-belen, persona:herodes-el-grande, lugar:belen, lugar:rama-de-benjamin], menciona: [persona:jeremias-profeta, persona:raquel], nota: "La cita es de Jer 31:15. Raquel, enterrada cerca de Belén, representa a las madres que lloran; no actúa en el suceso."}
    - {v: 19-23, tipo: narracion, entidades: [evento:regreso-a-nazaret, persona:jose-esposo-de-maria, persona:jesus, persona:maria-madre-de-jesus, persona:arquelao, persona:herodes-el-grande, lugar:israel, lugar:judea, lugar:galilea, lugar:nazaret, relacion:arquelao/pariente/herodes-el-grande, relacion:arquelao/sucede_a/herodes-el-grande, relacion:herodes-el-grande/pariente/arquelao, relacion:jesus/vivio_en/nazaret, relacion:jose-esposo-de-maria/vivio_en/nazaret, relacion:maria-madre-de-jesus/vivio_en/nazaret], menciona: [persona:isaias, lugar:egipto], nota: "Nazareno, por Nazaret. Según la nota, Mateo alude al brote de Is 11:1 y quizá a otros profetas."}
  3:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: narracion, entidades: [evento:juan-comienza-su-ministerio, persona:juan-el-bautista, lugar:desierto-de-juda, lugar:judea, lugar:rio-jordan], menciona: [persona:isaias, lugar:jerusalen], nota: "La «región del Jordán» del versículo 5 se apunta en el río Jordán."}
    - {v: 7-12, tipo: discurso, entidades: [evento:juan-comienza-su-ministerio, persona:juan-el-bautista], menciona: [persona:abrahan], nota: "Juan acusa a fariseos y saduceos de fiarse de ser hijos de Abrahán y anuncia a alguien más poderoso, que bautizará con espíritu santo y con fuego."}
    - {v: 13-17, tipo: narracion, entidades: [evento:bautismo-de-jesus, persona:jesus, persona:juan-el-bautista, lugar:rio-jordan], menciona: [lugar:galilea]}
  4:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-11, tipo: narracion, entidades: [evento:tentacion-en-el-desierto, persona:jesus, persona:satanas, lugar:desierto-de-juda, lugar:jerusalen], nota: "Mateo lo llama la ciudad santa (v. 5). La montaña altísima del versículo 8 no tiene nombre."}
    - {v: "12", tipo: narracion, entidades: [evento:encarcelamiento-de-juan, persona:juan-el-bautista, persona:jesus, lugar:galilea], nota: "Entre los versículos 11 y 12 pasa cerca de un año (Jn 1:29 a 4:3), según la nota de estudio."}
    - {v: 13-16, tipo: narracion, entidades: [evento:hijo-del-funcionario-y-sinagoga-de-nazaret, persona:jesus, relacion:jesus/vivio_en/capernaum, lugar:nazaret, lugar:capernaum, lugar:zabulon, lugar:neftali, lugar:galilea], menciona: [persona:isaias, lugar:mar-de-galilea, lugar:rio-jordan], nota: "Mateo ve cumplido Is 9:1, 2: la luz llega a la tierra de Zabulón y Neftalí, Galilea de las naciones."}
    - {v: "17", tipo: narracion, entidades: [evento:anuncio-del-reino-en-galilea, persona:jesus]}
    - {v: 18-22, tipo: narracion, entidades: [evento:llamada-de-cuatro-pescadores, persona:jesus, persona:pedro, persona:andres, persona:santiago-hijo-de-zebedeo, persona:juan-apostol, persona:zebedeo, lugar:mar-de-galilea, relacion:pedro/pariente/andres, relacion:pedro/acompana/jesus, relacion:andres/acompana/jesus, relacion:santiago-hijo-de-zebedeo/pariente/juan-apostol, relacion:santiago-hijo-de-zebedeo/pariente/zebedeo, relacion:santiago-hijo-de-zebedeo/acompana/jesus, relacion:juan-apostol/pariente/zebedeo, relacion:juan-apostol/acompana/jesus]}
    - {v: 23-25, tipo: narracion, entidades: [evento:primera-gira-por-galilea, persona:jesus, lugar:galilea, lugar:siria, lugar:decapolis, lugar:perea, lugar:jerusalen], menciona: [lugar:judea, lugar:rio-jordan], nota: "La región al otro lado del Jordán (v. 25) es Perea, según la nota de estudio."}
  5:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-2, tipo: narracion, entidades: [evento:sermon-del-monte, persona:jesus], menciona: [lugar:capernaum], nota: "La montaña no tiene nombre; la nota de estudio la pone cerca de Capernaúm y del mar de Galilea."}
    - {v: 3-12, tipo: discurso, entidades: [evento:sermon-del-monte], nota: "Nueve veces «felices»: los que saben que necesitan a Dios, los que lloran, los apacibles, los misericordiosos, los limpios de corazón, los pacíficos y los perseguidos por hacer el bien."}
    - {v: 13-16, tipo: discurso, nota: "Los discípulos son la sal de la tierra y la luz del mundo: sus buenas obras han de dar gloria al Padre."}
    - {v: 17-20, tipo: discurso, nota: "Jesús viene a cumplir la Ley y los Profetas, no a anularlos; la justicia de sus discípulos tiene que superar a la de escribas y fariseos."}
    - {v: 21-26, tipo: discurso, entidades: [lugar:valle-de-hinon], nota: "Quien sigue airado o insulta a su hermano merece juicio; antes de ofrecer en el altar hay que hacer las paces. El Tribunal Supremo es el Sanedrín; la Gehena, el valle de Hinón."}
    - {v: 27-30, tipo: discurso, menciona: [lugar:valle-de-hinon], nota: "Mirar a una mujer con pasión ya es adulterio; más vale perder un ojo o una mano que acabar en la Gehena."}
    - {v: 31-32, tipo: discurso, nota: "Divorciarse por algo que no sea inmoralidad sexual expone al adulterio a la mujer y a quien se case con ella."}
    - {v: 33-37, tipo: discurso, menciona: [lugar:jerusalen, persona:satanas], nota: "Nada de juramentos a la ligera: basta un sí o un no. El Maligno del versículo 37 es Satanás; la nota al pie admite también «lo que es malo»."}
    - {v: 38-42, tipo: discurso, nota: "En vez de vengarse, poner la otra mejilla, dar también el manto, andar la segunda milla y prestar a quien pide."}
    - {v: 43-48, tipo: discurso, nota: "Amar también a los enemigos y orar por quien persigue, como el Padre, que da sol y lluvia a buenos y malos."}
  6:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: discurso, entidades: [evento:sermon-del-monte, persona:jesus], nota: "Sigue el Sermón del Monte. Dar a los necesitados sin buscar el aplauso de nadie, no como los hipócritas de las sinagogas."}
    - {v: 5-15, tipo: discurso, entidades: [evento:sermon-del-monte], menciona: [persona:satanas], nota: "Orar en privado y sin frases repetidas de memoria. Jesús da el padrenuestro como modelo y condiciona el perdón de Dios a perdonar a los demás. El Maligno (v. 13) es Satanás."}
    - {v: 16-18, tipo: discurso, entidades: [evento:sermon-del-monte], nota: "Quien ayuna no lo muestra en la cara; basta con que lo vea el Padre."}
    - {v: 19-24, tipo: discurso, entidades: [evento:sermon-del-monte], nota: "Guardar tesoros en el cielo, tener la vista fija en una sola meta y no servir a dos amos. Las Riquezas se personifican como amo; no son un dios con ficha."}
    - {v: 25-34, tipo: discurso, entidades: [evento:sermon-del-monte], menciona: [persona:salomon], nota: "No vivir angustiados por comida y ropa: Dios cuida de aves y lirios, vestidos mejor que Salomón. Lo primero ha de ser buscar el Reino y lo que Dios considera justo."}
  7:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-6, tipo: discurso, entidades: [evento:sermon-del-monte, persona:jesus], nota: "No condenar a otros: quitarse antes la viga del propio ojo. Lo santo no se da a quien lo desprecia, figurados en perros y cerdos."}
    - {v: 7-12, tipo: discurso, entidades: [evento:sermon-del-monte], nota: "Insistir al pedir, buscar y llamar; el Padre da cosas buenas. Tratar a los demás como uno quiere ser tratado resume la Ley y los Profetas."}
    - {v: 13-14, tipo: discurso, entidades: [evento:sermon-del-monte], nota: "Dos puertas y dos caminos: el ancho lleva a la destrucción; el estrecho, que pocos hallan, a la vida."}
    - {v: 15-23, tipo: discurso, entidades: [evento:sermon-del-monte], nota: "A los falsos profetas se les conoce por sus frutos. Entrar en el Reino exige hacer la voluntad del Padre, no solo decir «Señor»."}
    - {v: 24-27, tipo: discurso, entidades: [evento:sermon-del-monte], nota: "Ilustración del hombre prudente y el insensato, que edifican sobre roca y sobre arena. Son figuras, no personas del atlas."}
    - {v: 28-29, tipo: narracion, entidades: [evento:sermon-del-monte, persona:jesus], nota: "Al acabar el sermón, la gente queda asombrada porque enseña con autoridad propia, a diferencia de los escribas."}
  8:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-4, tipo: narracion, entidades: [evento:curacion-de-un-leproso, persona:jesus], menciona: [persona:moises], nota: "La montaña de 8:1 es la del sermón y no tiene nombre. El curado debe llevar al sacerdote la ofrenda que fijó la Ley de Moisés."}
    - {v: 5-13, tipo: narracion, entidades: [evento:siervo-del-oficial, persona:jesus, lugar:capernaum], menciona: [persona:abrahan, persona:isaac, persona:jacob], nota: "El oficial romano y su siervo no tienen nombre. Israel en 8:10 es el pueblo, sin ficha."}
    - {v: 14-17, tipo: narracion, entidades: [evento:curaciones-en-capernaum, persona:jesus, persona:pedro, persona:suegra-de-pedro, relacion:pedro/pariente/suegra-de-pedro], menciona: [persona:isaias], nota: "Mateo presenta estas curaciones como cumplimiento de una profecía de Isaías."}
    - {v: 18, tipo: narracion, entidades: [evento:calma-la-tormenta, persona:jesus], nota: "Jesús manda cruzar a la orilla oriental; el viaje sigue en 8:23."}
    - {v: 19-22, tipo: narracion, entidades: [evento:dejarlo-todo-por-el-reino, persona:jesus], nota: "El escriba y el discípulo no tienen nombre. La tabla A7-E pone este diálogo en 32 e.c., camino de Jerusalén, no antes de la tormenta."}
    - {v: 23-27, tipo: narracion, entidades: [evento:calma-la-tormenta, persona:jesus, lugar:mar-de-galilea]}
    - {v: 28-34, tipo: narracion, entidades: [evento:demonios-a-los-cerdos, persona:jesus, lugar:gadara, lugar:mar-de-galilea], nota: "Los dos endemoniados no tienen nombre. Perspicacia no nombra la ciudad de 8:33."}
  9:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: 1-8, tipo: narracion, entidades: [evento:curacion-de-un-paralitico, persona:jesus, lugar:capernaum, relacion:jesus/vivio_en/capernaum], menciona: [lugar:mar-de-galilea], nota: "La nota de estudio identifica «su ciudad» con Capernaúm; el mar que cruza es el de Galilea. Los escribas lo acusan de blasfemar."}
    - {v: 9-17, tipo: narracion, entidades: [evento:llamada-de-mateo, persona:mateo, relacion:mateo/vivio_en/capernaum], menciona: [persona:juan-el-bautista], nota: "Comida en casa de Mateo con cobradores de impuestos y pecadores; cita de Os 6:6. Los discípulos de Juan preguntan por el ayuno: el novio, el parche y los odres."}
    - {v: 18-26, tipo: narracion, entidades: [evento:hija-de-jairo, persona:jairo], nota: "Mateo no da el nombre del gobernante; la nota de estudio lo identifica con Jairo (Mr 5:22; Lu 8:41). La mujer con hemorragias queda sin nombre."}
    - {v: 27-34, tipo: narracion, entidades: [evento:dos-ciegos-y-un-mudo], menciona: [persona:david], nota: "Los ciegos lo llaman Hijo de David, título del Mesías. «Israel» (v. 33) es el pueblo. Los fariseos culpan al gobernante de los demonios, sin nombrarlo."}
    - {v: 35-38, tipo: narracion, entidades: [evento:tercera-gira-y-envio-de-los-doce], nota: "Empieza la tercera gira por Galilea (A7-D). Jesús se compadece de la gente y pide rogar por más trabajadores para la cosecha."}
  10:
    estado: completo
    revisado: 2026-09-29
    tramos:
    - {v: "1", tipo: narracion, entidades: [evento:tercera-gira-y-envio-de-los-doce, persona:jesus], nota: "Jesús reúne a los doce y les da autoridad sobre los espíritus malignos y para curar."}
    - {v: 2-4, tipo: lista, entidades: [persona:pedro, persona:andres, persona:santiago-hijo-de-zebedeo, persona:zebedeo, persona:juan-apostol, persona:felipe-apostol, persona:bartolome, persona:tomas, persona:mateo, persona:santiago-hijo-de-alfeo, persona:alfeo-padre-de-santiago, persona:tadeo, persona:simon-el-cananita, persona:judas-iscariote, relacion:pedro/pariente/andres, relacion:andres/pariente/pedro, relacion:santiago-hijo-de-zebedeo/pariente/zebedeo, relacion:santiago-hijo-de-zebedeo/pariente/juan-apostol, relacion:juan-apostol/pariente/santiago-hijo-de-zebedeo, relacion:santiago-hijo-de-alfeo/pariente/alfeo-padre-de-santiago, relacion:pedro/acompana/jesus, relacion:andres/acompana/jesus, relacion:santiago-hijo-de-zebedeo/acompana/jesus, relacion:juan-apostol/acompana/jesus, relacion:felipe-apostol/acompana/jesus, relacion:bartolome/acompana/jesus, relacion:bartolome/mismo_que/natanael, relacion:tomas/acompana/jesus, relacion:mateo/acompana/jesus, relacion:santiago-hijo-de-alfeo/acompana/jesus, relacion:tadeo/acompana/jesus, relacion:simon-el-cananita/acompana/jesus, relacion:judas-iscariote/acompana/jesus], nota: "Lista de los doce. La nota de estudio ve en Bartolomé al Natanael de Juan, sin darlo por seguro; Tadeo es el Judas hijo de Santiago de Lucas."}
    - {v: 5-15, tipo: discurso, menciona: [lugar:region-de-samaria, lugar:sodoma, lugar:gomorra], nota: "Instrucciones: ir solo a Israel, no a las naciones ni a Samaria; predicar sin cobrar ni llevar provisiones; sacudirse el polvo donde no los reciban."}
    - {v: 16-23, tipo: discurso, menciona: [lugar:israel], nota: "Aviso de persecución: tribunales, sinagogas, gobernadores y reyes; el espíritu hablará por ellos. «Las ciudades de Israel» (v. 23) son las de la tierra de Israel."}
    - {v: 24-33, tipo: discurso, menciona: [persona:satanas, lugar:valle-de-hinon], nota: "Si al amo lo llaman Belcebú, a los suyos también; la nota de estudio lo da como nombre de Satanás. La Gehena, el valle de Hinón, simboliza la destrucción eterna. No temer a los hombres."}
    - {v: 34-42, tipo: discurso, nota: "Jesús trae división aun en las familias; quien no lo pone primero no es digno de él. Recompensa para quien recibe a sus enviados."}
  11:
    estado: completo
