# biblical-earth: un fichero por recorrido. Esquema en docs/investigacion/README.md.
id: de-babilonia-a-jerusalen
title: De Babilonia a Jerusalén
summary: 'Ocho paradas, desde que Jerusalén cae en 607 a.e.c. hasta el templo terminado en 515: la caída de Babilonia,
  el decreto de Ciro, el viaje de vuelta y la reconstrucción.'
stops:
- sel: event:destruccion-de-jerusalen-607
  t: -605.4422
  text: Nabucodonosor destruye Jerusalén y su templo. Empiezan setenta años en los que la tierra de Judá quedará desolada,
    como había anunciado Jeremías.
  passages:
  - 2Re 25:8-10
  - Jer 25:11, 12
- sel: event:caida-de-babilonia
  t: -537.2642
  text: Una noche de octubre de 539 a.e.c., el ejército de Ciro entra en Babilonia sin combatir. Belsasar muere en pleno
    banquete, después de que Daniel leyera la escritura en la pared.
  passages:
  - Da 5:1-31
- sel: event:decreto-de-ciro
  t: -536.9
  text: En su primer año sobre Babilonia, Ciro permite a los judíos volver y reconstruir el templo. Les devuelve los utensilios
    que se había llevado Nabucodonosor.
  passages:
  - Esd 1:1-11
  - 2Cr 36:22, 23
  unknown: No sabemos dónde proclamó Ciro el decreto. Años después apareció en Ecbátana otro documento suyo, un memorándum
    sobre el templo.
- sel: event:regreso-de-537
  t: -535.3
  text: 'Un largo camino de vuelta: 42.360 personas, sin contar 7.337 esclavos y 200 cantores, salen de Babilonia con 5.400
    utensilios de oro y plata. Viajan entre 800 y 1.600 km, según la ruta.'
  passages:
  - Esd 1:11
  - Esd 2:64, 65
  unknown: La Biblia no da la ruta ni la fecha de salida. Perspicacia estima unos cuatro meses de viaje comparándolo
    con el de Esdras (Esd 7:9).
  question:
    text: ¿Quién guio a este primer grupo de vuelta a Jerusalén?
    options:
    - Esdras
    - Zorobabel
    - Nehemías
    answer: Zorobabel
    explanation: Lo guio Zorobabel con el sumo sacerdote Josué. Esdras llegó 69 años después, en 468 a.e.c., y Nehemías
      en 455.
- sel: event:altar-reconstruido-537
  t: -535.27
  text: En el séptimo mes, tisri de 537, los repatriados levantan el altar en su sitio y celebran la fiesta de las Cabañas.
    Termina la desolación de setenta años.
  passages:
  - Esd 3:1-6
- sel: event:fundamento-del-templo-536
  t: -534.67
  text: En el segundo mes de 536 se ponen los cimientos del templo. Unos gritan de alegría y otros, los que recordaban
    el templo de Salomón, lloran.
  passages:
  - Esd 3:8-13
- sel: event:obra-del-templo-prohibida-522
  t: -520.5
  text: Los vecinos hostiles acusan a los judíos ante el rey persa, y en 522 la obra queda prohibida. El templo sigue a
    medio construir.
  passages:
  - Esd 4:4-24
- sel: event:templo-terminado-515
  t: -513.8955
  text: En 520, Ageo y Zacarías animan a reanudar la obra, y Darío I la respalda al hallarse el decreto de Ciro. El templo
    se termina el 3 de adar de 515.
  passages:
  - Ag 1:1-15
  - Esd 5:1, 2
  - Esd 6:14, 15
