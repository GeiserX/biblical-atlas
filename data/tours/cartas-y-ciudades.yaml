# biblical-atlas: un fichero por recorrido. Esquema en docs/investigacion/README.md.
id: cartas-y-ciudades
title: Las cartas de Pablo y las ciudades que las recibieron
stops:
- sel: letter:1-tesalonicenses
  t: 50.8
  text: Otoño de 50. Desde Corinto, Pablo escribe con Silas y Timoteo a la congregación de Tesalónica, de la que
    había tenido que salir de noche. Es su primera carta de la Biblia.
  passages:
  - 1Te 1:1
  - Hch 17:1-10
  question:
    text: ¿Desde qué ciudad escribió Pablo su primera carta a los tesalonicenses?
    options:
    - Atenas
    - Corinto
    - Éfeso
    answer: Corinto
    explanation: La Tabla de los libros y el estudio 3 la sitúan en Corinto, hacia el año 50.
- sel: letter:2-tesalonicenses
  t: 51.3
  text: 'Hacia 51, todavía en Corinto, les escribe otra vez: algunos creían que el día de Jehová ya estaba encima.'
  passages:
  - 2Te 1:1
  - 2Te 2:1, 2
- sel: letter:galatas
  t: 51.5
  text: Entre 50 y 52 escribe a las congregaciones de Galacia, las que fundó con Bernabé, contra quienes exigían
    la circuncisión.
  passages:
  - Gál 1:1, 2
  - Gál 2:1-10
  unknown: 'Si la escribió desde Corinto o desde Antioquía de Siria: Perspicacia admite las dos.'
- sel: letter:1-corintios
  t: 55.3
  text: En 55, en Éfeso, Pablo recibe noticias de divisiones en Corinto y escribe su primera carta. Estéfanas y
    otros dos hermanos habían venido a verlo.
  passages:
  - 1Co 1:10-12
  - 1Co 16:8, 17
- sel: letter:2-corintios
  t: 55.7
  text: Final del verano de 55, en Macedonia. Tito le trae buenas noticias de Corinto y Pablo escribe su segunda
    carta.
  passages:
  - 2Co 2:12, 13
  - 2Co 7:5-7
- sel: letter:romanos
  t: 56.1
  text: Hacia 56, en Corinto, dicta a Tercio la carta a Roma, una ciudad que todavía no conocía. Recomienda a Febe,
    de Cencreas.
  passages:
  - Ro 16:1, 2
  - Ro 16:22
  question:
    text: ¿Quién escribió materialmente la carta a los Romanos?
    options:
    - Tercio
    - Timoteo
    - Lucas
    answer: Tercio
    explanation: 'Ro 16:22: Tercio, que escribió la carta, añade su propio saludo.'
- sel: place:roma
  t: 59.2
  text: Hacia 59 Pablo llega preso a Roma. Durante dos años, en una casa alquilada, recibe visitas y escribe varias
    cartas.
  passages:
  - Hch 28:16, 30, 31
- sel: letter:efesios
  t: 60.5
  text: Desde Roma escribe a Éfeso, donde había trabajado tres años. Tíquico lleva la carta.
  passages:
  - Ef 6:21, 22
- sel: letter:colosenses
  t: 60.6
  text: A Colosas, una ciudad que no había visitado, le escribe por las noticias de Epafras. Tíquico y Onésimo
    la llevan.
  passages:
  - Col 1:7, 8
  - Col 4:7-9
- sel: letter:filemon
  t: 60.7
  text: 'Con Onésimo va también una carta para su amo Filemón, en Colosas: Pablo le pide que lo reciba como a un
    hermano.'
  passages:
  - Flm 10-17
  question:
    text: ¿Quién llevó la carta a Filemón?
    options:
    - Onésimo
    - Epafras
    - Tito
    answer: Onésimo
    explanation: 'Perspicacia «Onésimo»: Pablo le dio la carta para Filemón al enviarlo de vuelta.'
- sel: letter:filipenses
  t: 60.8
  text: Los filipenses le mandan un regalo con Epafrodito, que enferma en Roma. Ya curado, vuelve a Filipos con
    la carta.
  passages:
  - Flp 2:25-30
  - Flp 4:18
- sel: letter:hebreos
  t: 61.0
  text: Hacia 61, desde Italia, al parecer Roma, escribe a los cristianos hebreos de Judea.
  passages:
  - Heb 13:23, 24
  unknown: La carta no lleva el nombre del escritor; Perspicacia la atribuye a Pablo por su contenido.
- sel: letter:1-timoteo
  t: 62.5
  text: Ya libre, Pablo deja a Tito en Creta y a Timoteo en Éfeso. Entre 61 y 64, al parecer desde Macedonia, escribe
    a los dos.
  passages:
  - 1Ti 1:3
  - Tit 1:5
  unknown: 'El orden de sus viajes en estos años: Hechos ya no los cuenta.'
- sel: letter:2-timoteo
  t: 65.0
  text: Hacia 65, preso otra vez en Roma, escribe su última carta. Solo Lucas está con él y siente cerca su muerte.
  passages:
  - 2Ti 4:6-11
