  passages:
  - Mt 28:1-10
  - Jn 20:1-18
  text: Al amanecer del 16 de nisán, las mujeres encuentran la tumba vacía. Jesús ha sido resucitado y ese día
    se aparece cinco veces.
- sel: event:camino-de-emaus
  t: 33.25187
  passages:
  - Lu 24:13-35
  text: Por la tarde camina con Cleopas y otro discípulo hacia Emaús, a unos 11 km. Lo reconocen al partir el pan.
  unknown: 'Dónde estaba Emaús: se han propuesto una docena de lugares.'
- sel: event:ascension-de-jesus
  t: 33.35626
  passages:
  - Hch 1:3-12
  - Lu 24:50-53
  text: Cuarenta días después, desde el monte de los Olivos, junto a Betania, Jesús sube al cielo ante los apóstoles.
- sel: event:pentecostes-33
  t: 33.38509
  passages:
  - Hch 2:1-4
