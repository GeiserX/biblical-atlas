# biblical-atlas: un fichero por recorrido. Esquema en docs/investigacion/README.md.
id: la-ultima-semana
title: La última semana de Jesús
stops:
- sel: event:llegada-a-betania-8-de-nisan
  t: 33.22764
  passages:
  - Jn 11:55-12:1
  text: Al ponerse el sol empieza el 8 de nisán, un sábado. Jesús llega a Betania, a casa de sus amigos, seis días
    antes de la Pascua.
- sel: event:maria-unge-a-jesus
  t: 33.23051
  passages:
  - Jn 12:2-11
  - Mt 26:6-13
  text: Terminado el sábado, cena en casa de Simón el leproso. María derrama sobre él un nardo carísimo y Judas
    se queja del gasto.
  question:
    text: ¿En casa de quién fue la cena en la que María ungió a Jesús?
    options:
    - Lázaro
    - Simón el leproso
    - Zaqueo
    answer: Simón el leproso
    explanation: Según Mt 26:6 y Mr 14:3, la cena fue en Betania, en la casa de Simón, llamado el leproso.
- sel: event:entrada-triunfal-en-jerusalen
  t: 33.23215
  passages:
  - Lu 19:29-44
  - Mt 21:1-11
  text: De día, desde Betfagué, baja el monte de los Olivos montado en un burro. La gente lo aclama como rey y
    él llora al ver la ciudad.
  unknown: 'Dónde estaba exactamente Betfagué: la tradición dice et-Tur; otros, Abu Dis.'
- sel: event:higuera-maldita-y-limpieza-del-templo
  t: 33.23434
  passages:
  - Mr 11:12-19
  text: Duerme en Betania y vuelve temprano. Maldice una higuera sin fruto y echa del templo a los que compran
    y venden.
- sel: event:senal-de-su-presencia
  t: 33.23708
  passages:
  - Mt 21:23-25:46
  text: 'Último día de enseñanza en el templo: preguntas trampa, parábolas y la ofrenda de la viuda. Por la tarde,
    sentado en el monte de los Olivos, explica la señal de su presencia.'
- sel: event:judas-acuerda-la-traicion
  t: 33.23982
  passages:
  - Mt 26:14-16
  text: Jesús pasa el día con sus discípulos. Judas va a los sacerdotes principales y acuerda entregarlo.
  question:
    text: ¿Cuánto le pagaron a Judas por entregar a Jesús?
    options:
    - 30 piezas de plata
    - 300 denarios
    - Un talento
    answer: 30 piezas de plata
    explanation: Mt 26:15. Según Éx 21:32, era el precio de un esclavo.
- sel: event:preparativos-de-la-pascua
  t: 33.24256
  passages:
  - Lu 22:7-13
  text: Pedro y Juan preparan la Pascua en una habitación de arriba de Jerusalén. Al caer la tarde llega Jesús
    con los demás.
- sel: event:cena-del-senor
  t: 33.2442
  passages:
  - Lu 22:14-20
  - Jn 13:21-30
  text: Empieza el 14 de nisán. Tras la Pascua, Jesús despide a Judas y establece con pan y vino la Cena del Señor.
  question:
    text: ¿Estaba Judas cuando Jesús estableció la Cena del Señor?
    options:
    - Sí
    - 'No'
    answer: 'No'
    explanation: Comparando Mt 26:20-29 con Jn 13:21-30 se ve que salió antes, según Perspicacia «Judas».
- sel: event:arresto-en-getsemani
  t: 33.24461
  passages:
  - Jn 18:1-12
  text: Cruza el Cedrón y ora en Getsemaní. Judas llega con gente armada, lo identifica con un beso y lo arrestan.
  unknown: 'El lugar exacto del jardín: los árboles se talaron en 70 e.c. y solo queda la tradición.'
- sel: event:juicio-ante-el-sanedrin
  t: 33.24488
  passages:
  - Mt 26:57-75
  text: De noche lo interroga Anás y lo juzga el Sanedrín en casa de Caifás. En el patio, Pedro niega tres veces
    conocerlo.
  unknown: 'Dónde estaba la casa de Caifás: B12-B la marca con interrogación.'
- sel: event:ante-pilato-y-herodes
  t: 33.24543
  passages:
  - Lu 23:1-25
  text: Al amanecer lo llevan a Pilato, que lo envía a Herodes Antipas y lo recibe de vuelta. La multitud pide
    a Barrabás.
- sel: event:muerte-de-jesus
  t: 33.24625
  passages:
  - Mr 15:22-41
  text: En el Gólgota, fuera de la ciudad, lo clavan en un madero. Tras tres horas de oscuridad, muere hacia las
    tres de la tarde.
  unknown: 'Dónde estaba el Gólgota: solo que estaba fuera de las murallas.'
  question:
    text: ¿Hacia qué hora murió Jesús?
    options:
    - Las 9 de la mañana
    - El mediodía
    - Las 3 de la tarde
    answer: Las 3 de la tarde
    explanation: La hora novena de Mr 15:34 equivale a cerca de las 3 de la tarde, según la nota de estudio.
