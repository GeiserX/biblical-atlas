resumen: Por miedo, Lot deja Zóar y se va a vivir a una cueva de los montes con sus dos hijas. Ellas lo emborrachan dos noches
  seguidas para tener hijos de él, y nacen Moab y Ben-Ammí.
razon: Sigue a la destrucción de 1919 a.e.c. (estudio 3). Gé 19:37, 38 habla de moabitas y ammonitas como pueblos ya formados
  cuando Moisés terminó Génesis, en 1513 a.e.c. (tabla de los libros). La cueva no tiene nombre.
