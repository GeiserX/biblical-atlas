razon: 'Am 7:10-17. Perspicacia «Betel» dice que Amós había hablado en la propia ciudad. Nadie da el año: cae en los años
  de su profecía, 829-804 (Perspicacia «Amós», núm. 1), y Jeroboán II seguía reinando.'
