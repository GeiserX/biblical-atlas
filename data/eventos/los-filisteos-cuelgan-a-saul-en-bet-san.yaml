resumen: Al día siguiente, los filisteos encuentran los cuerpos en Guilboa. Cortan la cabeza a Saúl, anuncian la victoria
  por su tierra, dejan su armadura en el templo de Astoret y cuelgan los cadáveres en la muralla de Bet-San.
razon: '1Sa 31:8-10; Perspicacia «Bet-seán, Bet-san», párr. 9: la ciudad era filistea. Solo hay cadáveres, así que el suceso
