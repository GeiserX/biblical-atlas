resumen: Jehová dice a Aarón que él y sus hijos guardan el santuario y los levitas los ayudan. Los sacerdotes viven de ofrendas
  y primogénitos, los levitas de los diezmos, y ellos dan a Aarón una décima parte.
razon: 'Perspicacia «Diezmo» y «Levitas»: los levitas, sin territorio, recibían el diezmo y daban su décima parte a los sacerdotes
  (Nú 18:20-29). El texto no nombra el campamento.'
