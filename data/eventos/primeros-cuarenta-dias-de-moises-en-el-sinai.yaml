resumen: Moisés sube con su ayudante Josué a recibir las tablas de piedra y deja a Aarón y a Hur al frente. La nube cubre
  el monte seis días; al séptimo Dios lo llama, y allí se queda 40 días.
razon: Perspicacia «Ley» fecha en 1513 a.e.c. la Ley del Sinaí; «Diez Palabras» sitúa aquí las tablas, y «Josué», a Josué
  con él. Aarón y Hur se quedan con los ancianos en el campamento (Éx 24:14).
