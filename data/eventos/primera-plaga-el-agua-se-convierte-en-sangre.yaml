resumen: Una mañana, junto al Nilo, Aarón golpea el río con la vara ante el faraón. Toda el agua de Egipto se vuelve sangre,
  mueren los peces y los egipcios cavan pozos. Los magos lo imitan y el faraón no cede.
razon: 'El estudio 3 pone la zarza ardiente hacia 1514 a.e.c. y la salida de Egipto, con la Pascua, en 1513. Perspicacia «Aarón»,
  párr. 4: con este golpe empezaron las diez plagas. Según Éx 7:25, pasaron siete días.'
