resumen: Seis días seguidos, el ejército y los sacerdotes con el Arca rodean Jericó una vez tocando los cuernos. El séptimo
  dan siete vueltas, el pueblo grita, la muralla se viene abajo y la ciudad es arrasada y quemada.
razon: Perspicacia «Jericó» cuenta las vueltas y el grito y fecha la destrucción en 1473 a.e.c. El oro, la plata y los objetos
  de metal van al tesoro de Jehová. Heb 11:30 atribuye la caída a la fe.
