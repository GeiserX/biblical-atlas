resumen: En Afec los príncipes filisteos ven a David y a sus hombres detrás de Akís y temen que se vuelvan contra ellos. Akís
  lo despide, y al amanecer David regresa a Filistea mientras los filisteos suben a Jezreel.
razon: Perspicacia «Afeq», núm. 4, y «Akís»; 1Cr 12:19 cuenta la despedida. Días antes de la batalla en que mueren Saúl y
  Jonatán, en 1078 (Perspicacia «Jonatán», núm. 2; el estudio 3 cierra 1 Samuel hacia 1078).
