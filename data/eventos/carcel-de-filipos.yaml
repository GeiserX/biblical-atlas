razon: Perspicacia «Pablo» (párr. 16) y «Silas, Silvano» (párr. 4); la nota de Hch 16:33 explica el bautismo inmediato del
  carcelero y su casa. El estudio 3 (párr. 24) pone Filipos en 50.
