resumen: El pueblo pide enviar exploradores y Jehová lo autoriza. Moisés escoge a un jefe de cada tribu, salvo Leví, y los
  manda desde el desierto de Parán a explorar Canaán. A Hosea le pone el nombre de Josué.
razon: Perspicacia «Espías» fecha el envío en 1512 a.e.c. Nú 13:20 lo pone en la época de las primeras uvas, que el cuadro
  B15 sitúa en tamuz (junio-julio). El campamento estaba en Cadés (Nú 13:26).
