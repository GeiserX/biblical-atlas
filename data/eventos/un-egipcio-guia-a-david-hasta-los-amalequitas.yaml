resumen: En el campo hallan a un egipcio que llevaba tres días sin comer. Era esclavo de un amalequita que lo dejó enfermo;
  cuenta la incursión por el sur y, a cambio de un juramento, lleva a David hasta la banda.
razon: 1Sa 30:11-15. El texto no nombra el sitio; Perspicacia «Besor» dice que los saqueadores volvían hacia el sur, al Négueb,
  de donde eran. Mismo año que la muerte de Saúl y Jonatán, 1078 (Perspicacia «Jonatán», núm. 2).
