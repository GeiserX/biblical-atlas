razon: 'Dt 10:6, 7. Perspicacia «Bene-jaaqán» y «Gudgoda»: Israel quizá cruzó dos veces la zona; Aarón murió en 1474 a.e.c.
  («Aarón»). Ponerlo tras Arad y al empezar el rodeo de Edom es decisión nuestra.'
