resumen: En la provincia de Asia, Pablo sufre una presión que supera sus fuerzas y llega a darse por muerto. Dios lo libra,
  y él pide a los corintios que sigan orando por él.
razon: '2Co 1:8 solo nombra Asia; su nota ve posible el motín o las fieras de Éfeso. Éfeso va segundo porque Pablo vivía allí del invierno de 52-53 a 55 (estudio 3, párr. 26), no porque el texto lo nombre.'
