resumen: 'Oseas transmite el pleito de Jehová contra Israel, al que llama también Efraín, y contra Judá: idolatría, sacerdotes
  corruptos, violencia y alianzas con Asiria y Egipto traerán castigo. También anuncia su perdón si vuelven a él.'
razon: Oseas profetizó desde Uzías (829, A6-A) y Jeroboán II hasta Ezequías; Perspicacia «Oseas, Libro de» cierra el libro
  entre 745 y 740. «Tabor» pone Os 5:1 a mediados del siglo VIII. No dice dónde habló.
