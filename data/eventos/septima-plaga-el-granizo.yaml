resumen: Moisés anuncia una granizada nunca vista y algunos siervos del faraón ponen a salvo su ganado. Caen granizo y fuego
  en todo Egipto menos en Gosén. El faraón reconoce su pecado, pero se endurece cuando cesa la tormenta.
razon: El estudio 3 pone la zarza ardiente hacia 1514 a.e.c. y la salida de Egipto, con la Pascua, en 1513. Según Éx 9:31,
  32, la cebada estaba casi madura; Perspicacia «Cebada» sitúa su siega al empezar la primavera, en nisán.
