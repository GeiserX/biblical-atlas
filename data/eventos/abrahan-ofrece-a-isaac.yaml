resumen: Dios pone a prueba a Abrahán y le pide ofrecer a Isaac en una montaña de Moria. Al tercer día ata a su hijo sobre
  el altar; un ángel lo detiene, Abrahán ofrece un carnero y Dios le jura bendecirlo.
razon: Perspicacia «Abrahán», párr. 17, lo pone unos veinte años después del despido de Ismael (1913 a.e.c.) y en el monte
  Moria; «Isaac» cree que tenía quizá 25 años. Sara muere después, en 1881 (estudio 3).
