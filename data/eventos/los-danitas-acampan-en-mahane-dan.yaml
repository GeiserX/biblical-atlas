resumen: Seiscientos danitas armados salen de Zorá y Estaol y acampan en Judá, al oeste de Quiryat-Jearim. Por eso aquel sitio
  se llamó Mahané-Dan, que significa «campamento de Dan».
razon: Jue 18 lo pone poco antes de tomar Lais, que Perspicacia «Jueces, Libro de», «Orden del libro», sitúa antes de morir
  Josué, c. 1450; la conquista general acabó en 1467 (estudio 3). Va en la serie josue, antes de los-danitas-toman-lesem.
