resumen: 'Mientras hablan al pueblo, se presentan sacerdotes, saduceos y el capitán del templo, molestos porque anuncian que
  Jesús resucitó. Los encierran hasta el día siguiente, pero muchos creen: ya son unos 5.000 hombres.'
razon: Hch 4:1-4 y la nota de estudio de 4:1 sobre el capitán del templo; el capítulo 4 de «Testimonio completo» (párr. 9
  y 10) explica que los saduceos rechazaban la resurrección. El año sale de Perspicacia «Herodes», núm. 2.
