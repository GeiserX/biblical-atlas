resumen: 'Encadenado en Roma y con Timoteo a su lado, Pablo escribe a la congregación de Filipos: agradece su ayuda, cuenta
  que su prisión difunde las buenas noticias, pide unidad y humildad y advierte contra los judaizantes.'
razon: 'Perspicacia «Filipenses, Carta a los»: la guardia pretoriana (Flp 1:13) la pone en el primer encierro en Roma, y la
  escribe tras la llegada y la enfermedad de Epafrodito, hacia 60 o 61. La Tabla de los libros coincide.'
