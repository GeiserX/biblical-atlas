resumen: Moisés intercede y Jehová perdona, pero los registrados de 20 años o más morirán en el desierto en 40 años, uno por
  cada día de exploración. Se salvan Caleb y Josué; los diez del mal informe morirán.
razon: Perspicacia «Espías» pone en 1512 a.e.c. el decreto de los 40 años, del que quedaron fuera Josué, Caleb y los levitas.
  Perspicacia «Amiel» dice que los diez murieron por el castigo.
