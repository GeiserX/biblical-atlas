resumen: Muertos José y su generación, Israel crece tanto que un rey nuevo lo ve como amenaza. Los egipcios lo someten a trabajos
  forzados con barro, ladrillos y labores del campo, y le hacen levantar Pitom y Raamsés.
razon: José murió en 1657 a.e.c. (estudio 3). Según Perspicacia «Éxodo», la orden contra los niños no regía al nacer Aarón
  en 1597; «Raamsés, Ramesés» dice que la ciudad se levantaba antes de nacer Moisés.
