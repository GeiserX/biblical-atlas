resumen: Jehová manda quemar fuera del campamento una vaca roja, ante el sacerdote Eleazar, y guardar sus cenizas. Mezcladas
  con agua purifican a quien toca un muerto, los días tercero y séptimo.
razon: Perspicacia «Eleazar», núm. 1, dice que él ofició en esa ofrenda por el pecado; «Cenizas» y «Vaca» explican el agua
  de limpieza (Heb 9:13). El texto no nombra el campamento.
