resumen: Sísara huye a la tienda de Jael, porque la casa de Héber estaba en paz con Jabín. Ella lo tapa y le da leche; dormido,
  le clava una estaca en las sienes. Luego enseña el cadáver a Barac.
razon: 'Perspicacia «Jael» y «Zaananim»: la tienda estaba junto a ese árbol (Jue 4:11). Se cumple lo que anunció Débora en
  Jue 4:9. Límites: muerte de Josué, c. 1450 (estudio 3), y Jefté, c. 1173 (Perspicacia «Jefté»).'
