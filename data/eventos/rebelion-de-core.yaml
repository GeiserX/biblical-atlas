resumen: El levita Coré, con los rubenitas Datán, Abiram y On y 250 jefes, acusa a Moisés y a Aarón de ponerse por encima
  del pueblo. Moisés los cita con incienso ante Jehová; Datán y Abiram se niegan a ir.
