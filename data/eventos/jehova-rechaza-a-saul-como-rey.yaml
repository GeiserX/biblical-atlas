resumen: Jehová dice a Samuel que Saúl lo ha desobedecido. En Guilgal, Saúl culpa al pueblo; Samuel le dice que obedecer vale
  más que sacrificar y que Jehová lo rechaza. La túnica rasgada anuncia que perderá el reino.
razon: 'Perspicacia «Guilgal», núm. 1, pone allí el rechazo (1Sa 15:12-28), y «Samuel» lo cuenta como su segunda censura a
  Saúl. Fecha: Saúl gobernó de 1117 a 1078 a.e.c. (Perspicacia «Agag»).'
