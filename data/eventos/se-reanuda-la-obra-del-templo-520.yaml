resumen: El día 24 del sexto mes del segundo año de Darío I, movidos por los mensajes de Ageo, Zorobabel, el sumo sacerdote
  Josué y el resto del pueblo empezaron a trabajar en el templo, aunque la prohibición seguía vigente.
razon: Perspicacia «Ageo», «Zorobabel» y «Darío», núm. 2 (520); Ag 1:15 fecha el comienzo de la obra el día 24 del sexto mes.
  Zacarías empezó en el mes octavo (Zac 1:1; Perspicacia «Ageo»), así que no va en este día.
