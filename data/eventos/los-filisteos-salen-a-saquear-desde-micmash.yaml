resumen: 'Saúl cuenta unos 600 hombres y se queda con Jonatán en Gueba de Benjamín. Desde el campamento de Micmash salen tres
  grupos filisteos de asalto: hacia Ofrá y Sual, hacia Bet-Horón y hacia el valle de Zeboím.'
razon: '1Sa 13:15-18; Perspicacia «Ofrá», «Sual» y «Zeboím». Bet-Horón queda fuera: no se sabe cuál de las dos. Fecha: tras
  la unción de Saúl (1117, estudio 3) y antes de su muerte (1078, Perspicacia «Jonatán», núm. 2).'
