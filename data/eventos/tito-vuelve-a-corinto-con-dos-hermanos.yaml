resumen: Desde Macedonia, Pablo anima a Tito a terminar la colecta que empezó en Corinto. Tito va de buena gana con dos hermanos
  de confianza que no se nombran, uno elegido por las congregaciones, y probablemente lleva la segunda carta.
razon: 'Perspicacia «Tito», párr. 2: partió hacia Corinto de buena gana. «Corintios, Cartas a los» fecha la segunda carta
  al final del verano o al empezar el otoño de 55 y ve probable que la llevara Tito.'
