resumen: 'Jehová vuelve a encargar a Jonás que lleve su mensaje a Nínive. Esta vez obedece: entra en la enorme ciudad y, tras
  un día de marcha por ella, avisa de que en 40 días será destruida.'
razon: 'Jon 3:1-4; Perspicacia «Jonás», núm. 1, párr. 5. Año c. 844: «Asiria» lo da como probable, y también el estudio 3
  y «Toda Escritura», libro 32. «Jonás, Libro de», párr. 1, solo da el reinado de Jeroboán II (c. 844-804).'
