resumen: Mientras David está fuera, los amalequitas invaden el Négueb, queman Ziclag y se llevan a las mujeres y los niños,
  Ahinoam y Abigaíl entre ellos. Los hombres, amargados, hablan de apedrear a David, que busca fuerzas en Jehová.
razon: 1Sa 30:1-6; Perspicacia «Ziqlag» y «Abigail», núm. 1. Según «David», párr. 21, pasa a la vez que la batalla de Guilboa.
