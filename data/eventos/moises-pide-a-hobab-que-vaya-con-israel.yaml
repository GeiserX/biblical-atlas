resumen: Al ponerse en marcha, Moisés invita a Hobab, hijo de Reuel, a ir con Israel y guiarlos por el desierto, que conoce.
  Hobab quiere volver con los suyos; Moisés insiste y le promete parte del bien de Jehová.
razon: Perspicacia «Hobab» y «Quenita» ponen la petición cuando Israel iba a dejar la región del Sinaí, en ziv de 1512 a.e.c.
  (Nú 10:11). Añaden que, al parecer, Hobab acabó yendo con ellos.
