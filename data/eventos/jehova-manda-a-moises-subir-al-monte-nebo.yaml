resumen: El día de la canción, Jehová manda a Moisés subir al Nebo, en los montes de Abarim frente a Jericó, para ver Canaán
  de lejos. Morirá allí, como Aarón en el Hor, por lo ocurrido en Meribá.
razon: Repite el aviso que Moisés recibió en Números, antes de nombrar a Josué. Perspicacia «Moisés», párr. 32, lo pone antes
  de que subiera al Nebo y muriera, en 1473 a.e.c. según el estudio 3. Va tras Números en su serie.
