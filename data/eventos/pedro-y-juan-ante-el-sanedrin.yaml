resumen: Al día siguiente, ante Anás, Caifás, Juan, Alejandro y los demás gobernantes, Pedro dice que el cojo sanó por el
  nombre de Jesús. Les prohíben predicar; contestan que no pueden callar y los sueltan con amenazas.
razon: Perspicacia «Pedro» (párr. 18), «Juan» (núm. 3, párr. 29, y núm. 5) y «Alejandro» (núm. 3); la nota de estudio a Hch
  4:6 identifica a Anás y a Caifás. El año sale de Perspicacia «Herodes», núm. 2.
