resumen: 'Moisés cuenta por familias a los varones levitas de un mes o más: 22.000. Guersonitas, cohatitas y meraritas acampan
  al oeste, al sur y al norte del tabernáculo; Moisés, Aarón y sus hijos, al este.'
razon: Nú 3:14-39. Perspicacia «Levitas» lo sitúa en el desierto de Sinaí y da el lado de cada familia; «Guersonitas» y «Meraritas»,
  cifras y jefes. El mes se deduce del orden del libro.
