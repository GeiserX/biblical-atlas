resumen: Entre truenos, humo y el toque del cuerno, Dios da desde el Sinaí las diez leyes básicas del pacto. El pueblo, con
  miedo, se queda lejos y pide que Moisés sea su intermediario.
razon: Perspicacia «Ley» pone la entrega de la Ley en el Sinaí en 1513 a.e.c.; «Moisés», párr. 20, la sitúa al tercer mes
  del éxodo (Éx 19:1, 16), y «Diez Palabras» dice que las transmitió un ángel.
