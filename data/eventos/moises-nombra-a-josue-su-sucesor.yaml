resumen: Moisés ruega cruzar el Jordán, pero Jehová le dice que solo verá la tierra desde lo alto, por lo de Meribá. Moisés
  pide un pastor para el pueblo y, ante Eleazar y la asamblea, impone las manos a Josué.
razon: 'Nú 27:12-23; Perspicacia «Josué», núm. 1, y «Eleazar», núm. 1. Moisés solo recibe el aviso de subir. Fecha: tras vencer
  a Og, hacia 1473 a.e.c. (Perspicacia «Basán»), y antes de acabar Números, en 1473 (estudio 3).'
