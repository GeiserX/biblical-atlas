resumen: Contra la orden de Jehová, los israelitas suben de madrugada a la montaña, sin el arca ni Moisés. Amalequitas y cananeos,
  a los que Dt 1:44 llama amorreos, los vencen y los dispersan por Seír hasta Hormá.
razon: 'Perspicacia «Hormá»: pasó poco después del informe y los vencidos volvieron a Cadés (Dt 1:45, 46). La batalla fue
  en la montaña, que el texto no nombra, así que el suceso no sitúa a nadie.'
