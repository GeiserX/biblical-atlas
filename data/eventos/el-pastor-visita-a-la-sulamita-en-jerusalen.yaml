resumen: El pastor que la ama sigue al séquito hasta Jerusalén y busca a la sulamita, velada. Elogia su belleza y la compara
  con un jardín cerrado; ella quiere dejar la ciudad y lo invita a entrar, y él acepta.
razon: Perspicacia «Cantar de los Cantares, El» («Argumento» y recuadro) y «Toda Escritura», libro 22, sitúan Can 4:1-5:1
  en Jerusalén, tras la llegada del rey. El pastor no tiene nombre. Misma fecha que esa llegada.
