# biblical-earth: los 66 libros de la Biblia. Los campos de estructura (de slug a capitulos) no llevan fuentes;
# los hechos de cada libro sí.
# Nombres, abreviaturas y número de capítulos tal como los da wol.jw.org (Biblia de estudio, índice de libros),
# consultado el 2026-09-28. Esquema en docs/investigacion/README.md.
#
#   slug:      id del libro; con «-<capítulo>» es una fuente implícita (mateo-26) que build.py crea sola.
#   num:       número del libro en las URL de wol.jw.org (nwtsty/<num>/<capítulo>).
#   abr:       abreviatura TNM de las citas («Hch 16:14»).
#   formas:    lo que acepta el buscador del sitio, sin tildes, espacios ni puntos.
#   habladas:  formas escritas en los subtítulos de los vídeos («Hechos», «Hech.»).
#   capitulos: número de capítulos.
#   versiculos: número del último versículo de cada capítulo, en orden (tantos como capitulos).
#   omitidos:  {"<capítulo>": [versículos]} de la numeración tradicional que la TNM no trae como texto,
#              porque solo aparecen en manuscritos posteriores. Se detectan en el HTML de cada capítulo de
#              wol.jw.org (nwtsty/<num>/<capítulo>), cuyas anclas son v<num>-<capítulo>-<versículo>-<parte>:
#              el ancla existe pero su texto es solo «--» (Mateo 17:21) o falta el número en la secuencia
#              (Juan 8:1-11). Los versículos que hay que leer son 1..versiculos menos omitidos.
#   Suma de versiculos: 31089. La numeración tradicional da 31102; la diferencia son 13 versículos con los que
#   la TNM no llega a numerar el capítulo: Marcos 16 acaba en el 8 (sin 9-20) y Juan 7 en el 52 (sin 53).
#   Los encabezamientos de los Salmos llevan ancla 0 y no cuentan. Consultado el 2026-09-29.
#
# Hechos de cada libro (escritor, lugar, fecha, abarca), de la Tabla de los libros de la Biblia de estudio:
# campos opcionales, con fuentes, razon, consultado y estado.
