summary: Ciudad del desierto, dentro del territorio de Israel, que Salomón reconstruyó o fortificó; Ezequiel la pone donde
  empieza la frontera sur. Aharoni la identifica con ʽEn Hazeva, al sudsudoeste del mar Muerto. No es la Tadmor de 2 Crónicas.
reason: 'Perspicacia «Tamar», núm. 4; 1Re 9:17-19; Eze 47:19; 48:28. Perspicacia cree que 2Cr 8:4 habla de otra ciudad, Tadmor.
  OpenBible: solo el punto.'
