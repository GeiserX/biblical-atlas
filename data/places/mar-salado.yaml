# biblical-atlas: un fichero por lugar. Esquema en docs/investigacion/README.md.
id: mar-salado
name: Mar Salado
names:
- name: Mar Salado
- name: Mar Muerto
  modern: true
  note: Nombre de hoy, que da la nota de Gé 14:3; según Perspicacia no se usó hasta el siglo II e.c.
- name: Mar del Arabá
  note: Así lo llaman Dt 3:17 y 4:49, por la gran fosa del Arabá en la que está.
- name: Mar oriental
  note: Así lo llama Joe 2:20, porque cerraba por el este la tierra de Israel, frente al mar occidental (Perspicacia «Mar
    Salado», apartado «Nombre»).
- name: Mar del este
  note: Así lo llaman Eze 47:18 y Zac 14:8; en los dos, la nota al pie aclara que es el mar Muerto.
