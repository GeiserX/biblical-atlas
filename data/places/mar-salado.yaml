summary: Lago muy salado en la gran falla del Arabá, donde desemboca el Jordán; su superficie queda unos 400 m por debajo
  del Mediterráneo. En el sur cubrió el antiguo valle de Sidim.
reason: 'Perspicacia «Mar Salado», apartados «Nombre», «Descripción física» y «Sodoma y Gomorra»; Gé 14:3. Coordenada de OpenBible:
  solo tomamos el punto.'
