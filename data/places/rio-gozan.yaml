summary: Río junto al que el rey de Asiria asentó a israelitas desterrados del reino del norte, en Habor y en otros lugares.
  Perspicacia apunta al Qezel Ouzan, en el noroeste de Irán; según otra opinión, era un río de Mesopotamia.
reason: 'Perspicacia «Gozán», párr. 2: el hebreo permite leer «río Gozán» en 2Re 17:6, 18:11 y 1Cr 5:26, y 1Cr 5:26 no deja
  leer «Habor, río de Gozán». Es otro sitio que la tierra de Gozán.'
