# biblical-atlas: un fichero por lugar. Esquema en docs/investigacion/README.md.
id: israel
name: Israel
names:
- name: Israel
- name: Tierra de Israel
  note: Así la llama Mateo al contar el regreso desde Egipto.
- name: Efraín
  from: -996
  note: Nombre que Oseas alterna con Israel para el reino de diez tribus, por Efraín, su tribu más influyente (Os 13:1; 14:8).
    Lo usan también Isaías y Jeremías.
- name: José
  note: Amós llama así al reino del norte, por José, padre de Efraín y Manasés (Am 5:6, 15; 6:6). Perspicacia «José» dice
    que el nombre designa a veces a todas las tribus.
- name: Samaria
  note: Nombre de la capital aplicado a todo el reino del norte (Perspicacia «Samaria», núm. 2). Así se lee «el campo de Samaria»
    de Abd 19, cuyas referencias remiten a 2Re 17:24 y Jer 31:5.
