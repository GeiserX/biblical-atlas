# biblical-earth: un fichero por lugar. Esquema en docs/investigacion/README.md.
id: guilgal
name: Guilgal
names:
- name: Guilgal
  note: Perspicacia le da el sentido de «rodadura»; Jos 5:9 cuenta por qué se llamó así.
- name: Guibeat-Haaralot
  note: Colina de los prepucios (nota de Jos 5:3), donde Josué circuncidó al pueblo. Perspicacia dice que el sitio acabó conociéndose
    como Guilgal.
type: city
lat: 31.881883
lon: 35.459969
precision: uncertain
coord_source: openbible:ab94aea
coord_url: https://www.openbible.info/geo/ancient/ab94aea/gilgal-1
coord_note: Khirbet el-Mefjir, primera identificación de OpenBible, unos 2 km al nordeste de la antigua Jericó. Perspicacia
  la da como propuesta, no como sitio seguro.
summary: Primer campamento de Israel al oeste del Jordán, en el límite oriental de Jericó. Allí levantó Josué las doce piedras
  del río y desde allí dirigió la conquista.
reason: 'Perspicacia «Guilgal», núm. 1, párr. 1 a 3; Jos 4:19, 20 y Miq 6:5. No es el núm. 2, el de cerca de Betel. OpenBible:
  solo el punto.'
