summary: Ciudad junto al Éufrates, a unos 870 km al este de Jerusalén. La fundó Nemrod, fue capital de la tercera potencia
  mundial, cayó ante Ciro en 539 a.e.c. y acabó en ruinas.
reason: 'Perspicacia «Babilonia» (núm. 1): situación, fundación por Nemrod, caída en 539 a.e.c. (un 5 de octubre) y ruinas
  en el siglo IV e.c. Coordenada de OpenBible: solo tomamos el punto.'
note: Perspicacia identifica la Babilonia desde la que escribe Pedro (1 Pedro 5:13) con esta ciudad del Éufrates, no con
  Roma.
