name: Samaria
names:
- name: Samaria
- name: Sebaste
  note: Nombre griego que le dio Herodes el Grande en honor de Augusto.
- name: Montaña de Samaria
  note: Así llama Amós al monte de la ciudad (Am 4:1; 6:1). Monte y ciudad llevaban el nombre de Sémer, su dueño antes de
    Omrí (Perspicacia «Samaria», núm. 1).
- name: Ofel
  note: Lugar de Samaria, quizá una colina o una fortificación, donde Guehazí guardó lo que obtuvo de Naamán (2Re 5:24; Perspicacia
    «Ofel», párr. 4).
