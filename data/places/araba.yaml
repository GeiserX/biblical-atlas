id: araba
name: Arabá
names:
- name: Arabá
  note: Perspicacia le da el sentido de «llanura desértica».
- name: Torrente del Arabá
  note: 'Am 6:14; la nota da «wadi». Perspicacia lo ciñe al tramo entre el sur del mar Muerto y el golfo de ʽAqaba: quizá
    un cauce como el Zered, o toda esa región. Límite sur de Judá e Israel.'
type: valley
