lon: 35.151389
precision: zone
coord_source: openbible:a2bb5ef
coord_url: https://www.openbible.info/geo/ancient/a2bb5ef/arabah
coord_note: Punto representativo de OpenBible, al sur del mar Muerto; el Arabá de la Biblia llega al norte hasta el mar de
  Galilea.
summary: Gran fosa que baja desde el pie del Hermón por el Jordán y el mar Muerto hasta el golfo de ʽAqaba, a lo largo de
  unos 435 km. Al sur del mar Muerto es muy árida.
reason: 'Perspicacia «Arabá», párr. 1 a 4; Dt 1:7 y 2:8. OpenBible: solo el punto.'
