summary: Principal puerto fenicio, en tierra firme y en una isla. Nabucodonosor la sitió trece años; Alejandro tomó la isla
  en 332 a.e.c. En su región Jesús curó a la hija de una sirofenicia; Pablo pasó allí siete días.
reason: 'Perspicacia «Tiro»: sitio y partes de la ciudad, el asedio de Nabucodonosor (Eze 26:7-12; 29:17-20), Alejandro en
  332 (Eze 26:4, 12) y la visita de Jesús (Mr 7:24-31); Pablo, en Hch 21:3-6. OpenBible: solo el punto.'
