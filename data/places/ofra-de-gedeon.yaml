id: ofra-de-gedeon
name: Ofrá
names:
- name: Ofrá
  note: Ofrá de Gedeón, en Manasés; no es la Ofrá de Benjamín (Perspicacia «Ofrá», núm. 2 y 3).
- name: Ofrá de los abí-ezritas
  note: Así la llaman Jue 6:24 y 8:32.
- name: Jehová-Salom
  note: Altar que Gedeón levantó en Ofrá tras ver al ángel; significa «Jehová es paz» (Jue 6:24). Perspicacia cree que fue
    un recuerdo, no un altar para sacrificios.
type: city
