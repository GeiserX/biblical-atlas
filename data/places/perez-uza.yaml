id: perez-uza
name: Pérez-Uzá
names:
- name: Pérez-Uzá
  note: Significa «brecha de Uzá» (nota de 2Sa 6:8). Nombre que recibió la era tras la muerte de Uzá.
- name: Era de Nacón
  note: Nombre de la era en 2Sa 6:6.
- name: Era de Kidón
  note: Así la llama 1Cr 13:9. Perspicacia «Nacón» ve probable que un nombre sea el del sitio y el otro el de su dueño.
