summary: Era en el camino del Arca de Quiryat-Jearim a Jerusalén, donde Jehová mató a Uzá por sujetar el Arca. David la llamó
  Pérez-Uzá. Hoy no se sabe dónde estaba.
reason: 'Perspicacia «Pérez-uzah» y «Nacón»; 2Sa 6:6-8; 1Cr 13:9-11. Coordenada de OpenBible: solo tomamos el punto.'
