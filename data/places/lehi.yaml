id: lehi
name: Lehí
names:
- name: Lehí
- name: Ramat-Lehí
  note: Nombre que le puso Sansón tras vencer con la quijada (Jue 15:17); según la nota al pie, significa ‘lugar encumbrado
    de la quijada’.
- name: En-Hacore
  note: La fuente de Lehí que Dios abrió para Sansón (Jue 15:19), ‘fuente del que llama’. Perspicacia la escribe En-haqore.
