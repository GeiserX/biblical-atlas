coord_note: Khirbet es-Suyag, primera identificación de OpenBible. Perspicacia la da solo como propuesta, a menos de 3 km
  al este de Bet-Semes.
summary: Lugar de Judá, de sitio exacto desconocido, donde los filisteos buscaron a Sansón y él mató a mil con una quijada
  de burro. Allí brotó para él la fuente En-Hacore. Samá venció luego a los filisteos en Lehí.
reason: 'Perspicacia «Lehí», «Ramat-lehí» y «En-haqore»; Jue 15:9-19; 2Sa 23:11. La Atalaya de septiembre de 2023 la pone probablemente
  en Judá. OpenBible: solo el punto.'
