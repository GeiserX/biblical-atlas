summary: Ciudad de Isacar cerca de Jezreel, identificada con Sulam. Allí acamparon los filisteos antes de morir Saúl, y junto
  a ella Salomón en el Cantar. Era la tierra de la sulamita; Eliseo se alojaba allí y resucitó a un niño.
reason: 'Perspicacia «Sunem», párr. 1 y 2; 1Sa 28:4. La sulamita es campesina de Sunem según «Cantar de los Cantares, El»,
  párr. 1, y «Toda Escritura», libro 22, párr. 5, que sitúa el drama cerca; «Sulamita»: probablemente. OpenBible: solo el
  punto.'
