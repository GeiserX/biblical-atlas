# biblical-atlas: un fichero por lugar. Esquema en docs/investigacion/README.md.
id: valle-de-hinon
name: Valle de Hinón
names:
- name: Valle de Hinón
- name: Valle del Hijo de Hinón
  note: Otra forma del nombre (Jos 15:8).
- name: Valle de los Hijos de Hinón
  note: Forma que da la TNM en 2Re 23:10.
- name: Gehena
  note: Forma griega del nombre hebreo. Jesús la usa como imagen de la destrucción total (Mt 5:22, 29, 30).
- name: Tófet
  note: Lugar del valle, probablemente cerca de la Puerta de los Tiestos, donde se sacrificaba a niños en el fuego; Josías
    lo inutilizó (2Re 23:10; Jer 19:2, 6; Perspicacia «Tófet»).
- name: Valle de la Matanza
  note: Nombre que Jehová anuncia para el valle por la cantidad de muertos que dejará su juicio (Jer 7:32; 19:6; Perspicacia
    «Hinón, Valle de»).
type: valley
