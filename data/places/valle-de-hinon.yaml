id: valle-de-hinon
name: Valle de Hinón
names:
- name: Valle de Hinón
- name: Valle del Hijo de Hinón
  note: Otra forma del nombre (Jos 15:8).
- name: Valle de los Hijos de Hinón
  note: Forma que da la TNM en 2Re 23:10.
- name: Gehena
  note: Forma griega del nombre hebreo. Jesús la usa como imagen de la destrucción total (Mt 5:22, 29, 30).
- name: Tófet
  note: Lugar del valle, quizá cerca de la Puerta de los Tiestos, donde se sacrificaba a niños en el fuego; Josías lo inutilizó
    (2Re 23:10; Perspicacia «Tófet»).
