summary: Valle hondo y estrecho que ciñe Jerusalén por el sur y el suroeste hasta juntarse con el Cedrón. Acaz y Manasés sacrificaron
  allí a sus hijos; en tiempos de Jesús servía para quemar basura.
reason: 'Perspicacia «Hinón, Valle de», párr. 1 y 4; «Gehena», párr. 1 y 2; nota de estudio de Mt 5:22. Coordenada de OpenBible:
  solo tomamos el punto.'
