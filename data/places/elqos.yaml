summary: Ciudad o aldea de la que era el profeta Nahúm, llamado elcosita. Su ubicación no se conoce; si era de Judá, Perspicacia
  la pondría en Beit Jibrin.
reason: Perspicacia «Elqosita» y «Nahúm», núm. 1; «Toda Escritura», libro 34, párr. 3; Na 1:1, 15. El mapa solo muestra los
  candidatos.
not_claimed:
- 'Que Elqós estuviera en Beit Jibrin: Perspicacia lo ve probable solo si Nahúm escribía en Judá, y dice que su sitio exacto
  sigue sin saberse.'
