name: Gadara
names:
- name: Gadara
- name: Región de los gadarenos
  note: Así la llama Mateo (Mt 8:28).
- name: Región de los gerasenos
  note: Así la llaman Marcos y Lucas; quizá las dos regiones compartían una zona (nota de estudio de Mt 8:28).
type: region
lat: 32.655998
lon: 35.679352
