summary: Lugar próximo a Jerusalén cuyo nombre quiere decir «Casa de la Viña». Jer 6:1 manda encender allí una señal de fuego
  ante el enemigo que llega del norte. Tras el destierro dio nombre a un distrito de Judá.
reason: 'Perspicacia «Bet-hakerem»; Jer 6:1; Ne 3:14. Perspicacia duda entre dos sitios, así que van los dos como candidatos.
  OpenBible: solo los puntos.'
