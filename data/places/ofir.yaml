summary: Tierra famosa por su oro fino, adonde iban desde Ezión-Guéber las naves de Salomón. De allí llegaban también madera
  de sándalo y piedras preciosas. Hoy no se sabe dónde estaba.
reason: Perspicacia «Ofir» (párr. 4-9), La Atalaya «¿Lo sabía?» de 2010 (párr. 5-8) y 1Re 9:26-28. Las tres opciones eran accesibles
  por mar desde Ezión-guéber.
