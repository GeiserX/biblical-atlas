  note: Nombre en las Escrituras Hebreas (Nú 34:11).
- name: Lago de Genesaret
  note: Así lo llama Lucas en el siglo I (Lu 5:1).
- name: Mar de Tiberíades
  note: Así lo llama Juan en el siglo I (Jn 6:1), por la ciudad de su orilla oeste.
- name: Kinéret
  note: Así lo nombra Dt 3:17. Era el límite oeste del reino de Og y luego de la tribu de Gad.
