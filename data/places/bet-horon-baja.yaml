summary: La más baja de las dos Bet-Horón, 2,5 km al ONO de la Alta y unos 240 m por debajo. Marcaba la frontera de José y
  de Benjamín; por su bajada cayó el granizo sobre los amorreos.
reason: 'Perspicacia «Bet-horón», párr. 1 a 3, y «Jafletitas»; Jos 10:11; 16:3; 18:13, 14. La montaña de 18:14 es la de 18:13,
  al sur de esta ciudad. OpenBible: solo el punto.'
