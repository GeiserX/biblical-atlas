summary: Valle en el límite noreste de Judá donde fue apedreado Acán; su nombre significa «dificultad». Oseas e Isaías anunciaron
  que, para el pueblo que volviera, sería entrada a la esperanza y descanso para las vacas.
reason: 'Perspicacia «Acor», párr. 1-3; Jos 7:24-26 y la nota de 7:26; Os 2:15; Is 65:10. Coordenada de OpenBible: solo tomamos
  el punto.'
