coord_note: Rantis, sexta identificación de OpenBible. Perspicacia nombra Rentis como el sitio de una tradición antigua recogida
  por Eusebio, sin darlo por seguro. Es el mismo punto de Arimatea.
summary: Ciudad de la región montañosa de Efraín, llamada también Ramataim-Zofim. Allí vivían Elcaná y Ana, allí nació Samuel
  y desde su casa en ella juzgó él más tarde a Israel.
reason: 'Perspicacia «Ramá», núm. 5, y «Ramataim-zofim»; 1Sa 1:1, 19; 2:11. No es la Ramá de Benjamín. OpenBible: solo el punto.'
