summary: Ciudad de la región montañosa cercana a Betel. Elías y Eliseo bajaron desde ella a Betel, y Eliseo quitó allí el
  veneno a un guiso. Luego fue, al parecer, un centro de adoración falsa que condenaron Oseas y Amós.
reason: 'Perspicacia «Guilgal», núm. 2: 2Re 2:1-5; 4:38-41; Os 4:15; 9:15; 12:11; Am 4:4; 5:5. Coordenada de OpenBible: solo
  tomamos el punto.'
not_claimed:
- 'Que la Guilgal de Os 4:15, 9:15 y 12:11 y de Am 4:4 y 5:5 sea con seguridad esta: Perspicacia admite que el centro de culto
  falso quizá fuera la de junto a Jericó.'
