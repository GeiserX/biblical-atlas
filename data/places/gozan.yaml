summary: Tierra del norte de Mesopotamia cuyos habitantes vencieron los reyes de Asiria, según presumió Senaquerib ante Ezequías.
  En los relatos del destierro de Israel, el mismo nombre parece ser el de un río.
reason: 'Perspicacia «Gozán», párr. 1 y 2; Is 37:12; 2Re 19:12. Allí es más que una ciudad, porque sus habitantes cuentan
  entre las naciones vencidas. OpenBible: solo el punto.'
