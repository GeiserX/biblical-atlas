coord_source: openbible:af725bb
coord_url: https://www.openbible.info/geo/ancient/af725bb/suph
coord_note: 'Punto de Sufeh, tercera identificación de OpenBible: es Khirbet Sufa, que Perspicacia da con reservas como
  el sitio, a unos 6 km al sur-sureste de Madaba. Sufá comparte este mismo punto.'
summary: Lugar al este del Jordán que, con otros, sirve para situar dónde habló Moisés a Israel al terminar los cuarenta años
  en el desierto. No se sabe con seguridad dónde estaba.
reason: 'Perspicacia «Suf»; Dt 1:1, 5. No es Sufá, que Perspicacia trata en otro artículo. OpenBible: solo el punto.'
note: La Septuaginta y la Vulgata ponen «mar Rojo» en lugar de Suf, lo que apuntaría al golfo de ʽAqaba. Perspicacia sigue
  el texto hebreo, que junto con el versículo 5 sitúa el lugar en Moab, al este del Jordán.
