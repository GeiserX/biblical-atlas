id: siquem
name: Siquem
names:
- name: Siquem
- name: Dios, el Dios de Israel
  note: Nombre que Jacob puso al altar que levantó junto a la ciudad (Gé 33:20).
- name: Bet-Miló
  note: 'Casa de Miló: quizá una fortaleza de Siquem, y tal vez la misma torre de Siquem. Su gente ayudó a hacer rey a Abimélec
    (Perspicacia «Miló»).'
- name: Torre de Siquem
  note: Lugar fortificado de la ciudad. Sus líderes se escondieron en el templo de El-Berit y murieron en el incendio que
    causó Abimélec.
- name: Templo de Baal-Berit
  note: Casa del Baal de Siquem, llamado también El-Berit. Guardaba plata, y en su bóveda murieron unas mil personas (Perspicacia
    «Baal-berit»).
- name: Árbol grande de Meonenim
  note: Árbol que se veía desde Siquem. Su nombre significa practicantes de magia; quizá allí se practicaba (Perspicacia «Meonenim,
    Árbol grande de»).
