# biblical-atlas: un fichero por lugar. Esquema en docs/investigacion/README.md.
id: jerusalen
name: Jerusalén
names:
- name: Jerusalén
- name: Salem
  note: Nombre más antiguo que se conoce de la ciudad, en tiempos de Abrahán (Gé 14:18).
- name: Jebús
  to: -1069
  note: Nombre que a veces recibió mientras la ocupaban los jebuseos, hasta que David la tomó en 1070 a.e.c. (Jue 19:10).
- name: Ciudad de David
  from: -1069
  note: Nombre de la fortaleza de Sion que David tomó y habitó (2Sa 5:7).
- name: Sion
  note: Nombre de la fortaleza y, por extensión, de la ciudad (Is 33:20). Es la grafía de la TNM; Perspicacia escribe «Sión».
- name: Ciudad santa
  note: Se la llamaba así porque en ella estaba el templo de Jehová (Mt 4:5; Ne 11:1).
- name: Torre de Siloam
  note: Torre de la ciudad que cayó y mató a 18 personas (Lu 13:4). Perspicacia «Siloam» no conoce su sitio exacto; la nota
    de estudio la pone probablemente cerca del estanque de Siloam.
- name: Puerta de las Ovejas
  note: Puerta del norte, cerca del templo, junto al estanque de Betzata (Jn 5:2). Perspicacia ve probable que sea la que
    reconstruyeron los sacerdotes con Nehemías (Ne 3:1) u otra en el mismo sitio.
- name: Fortaleza Antonia
  note: Cuartel de la tropa romana pegado al recinto del templo, en su ángulo noroeste; allí subieron a Pablo tras el motín
    (nota de estudio de Hch 21:34).
- name: Torre de David
  note: Torre de Can 4:4 de la que colgaban mil escudos. Perspicacia recoge que quizá sea la de la Casa del Rey (Ne 3:25);
    no es la moderna así llamada, de Herodes.
- name: Jebusí
  note: Así la llama Jos 18:28, por los jebuseos que la habitaban.
- name: Puerta del Pescado
  note: Puerta del norte, al oeste de la de las Ovejas, quizá hacia el extremo norte del Tiropeón (Ne 3:3; Sof 1:10). Perspicacia
    sugiere que su nombre podía venir de un mercado de pescado cercano.
- name: Segundo Barrio
  note: Zona al oeste o noroeste del recinto del templo, cerrada por los muros de Ezequías y Manasés. Se nombra por primera
    vez en tiempos de Josías (2Re 22:14; Sof 1:10).
- name: Mactés
  note: Al parecer, un sector cerca de la Puerta del Pescado y del Segundo Barrio (Sof 1:11). Significa «mortero». Perspicacia
    recoge que suele situarse en el valle del Tiropeón, quizá en su parte alta, no en el Cedrón.
- name: Puerta de Benjamín
  note: Puerta que daba hacia Benjamín (Jer 37:13; 38:7; Zac 14:10). Perspicacia «Puerta» recoge que unos la igualan con la
    de las Ovejas y otros con la de la Inspección.
- name: Primera Puerta
  note: Solo en Zac 14:10, como límite de la ciudad. Perspicacia «Puerta» recoge que unos la igualan con la Puerta de la Ciudad
    Vieja y otros con la de Efraín.
- name: Puerta de la Esquina
  note: En el ángulo noroeste de la muralla, sobre el valle de Hinón, al oeste de la de Efraín. Jehoás de Israel derribó
    el muro hasta ella y Uzías le levantó una torre al lado (2Re 14:13; 2Cr 26:9; Zac 14:10).
- name: Torre de Hananel
  note: Torre del muro norte, cerca de la Torre de Meah y de la Puerta de las Ovejas; se reconstruyó con Nehemías (Zac 14:10;
    Jer 31:38; Ne 3:1; 12:39). Perspicacia «Torre».
- name: Montículo
  note: Construcción de la Ciudad de David, dentro de ella o junto a ella, desde la que David edificó (2Sa 5:9). La nota la
    llama también Miló. Perspicacia no sabe qué era exactamente.
- name: Bet-Merhac
  note: Sitio donde se detuvo David al dejar la ciudad huyendo de Absalón (2Sa 15:17). Perspicacia «Bet-merhaq» cree que quizá
    fuera la última casa del lado del monte de los Olivos.
- name: Silá
  note: Lugar de la antigua Jerusalén al que bajaba el camino de la casa del Montículo, donde mataron a Jehoás (2Re 12:20).
    Perspicacia «Silá» solo lo conoce por ese versículo.
- name: Puerta de Efraín
  note: Puerta del Muro Ancho, en el norte, que daba hacia Efraín, unos 400 codos al este de la otra puerta que nombra 2Re
    14:13. Perspicacia «Puerta».
- name: Puerta superior de la casa de Jehová
  note: Puerta del templo que construyó Jotán (2Re 15:35). Perspicacia cree que daba al patio interior y que quizá sea la
    puerta nueva que nombra Jeremías.
- name: Estanque superior
  note: Estanque con un conducto que llegaba al lado de la calzada que iba al campo del lavandero (Is 7:3; 36:2; 2Re 18:17).
    Perspicacia «Estanque» dice que no se sabe bien dónde estaba.
- name: Escalera de Acaz
  note: Escalones por los que bajaba la sombra del sol; Jehová la hizo retroceder diez como señal para Ezequías (Is 38:8;
    2Re 20:11). Perspicacia «Sol» recoge, con Josefo, que estaba en el palacio y quizá medía las horas.
- name: Puerta de Josué
  note: Puerta que llevaba el nombre de Josué, jefe de la ciudad; a su entrada había lugares altos que Josías derribó (2Re
    23:8).
- name: Jardín del rey
  note: Junto a la puerta entre las dos murallas por la que huyeron Sedequías y sus soldados (2Re 25:4; Ne 3:15). Perspicacia
    «Jardín» lo pone probablemente fuera del muro sudeste.
- name: Siloé
  note: Canal que llevaba el agua de la fuente de Guihón por el Cedrón hasta un estanque del sur. Is 8:6 usa sus aguas tranquilas
    en sentido figurado (Perspicacia «Siloé»).
- name: Estanque inferior
  note: Is 22:9. Según Perspicacia «Estanque», los eruditos suelen situarlo en Birket el-Hamra, al sur del valle del Tiropeón;
    quizá sea el estanque del Canal de Ne 3:15.
- name: Estanque viejo
  note: Is 22:11. Perspicacia «Estanque» dice que la Biblia no permite saber dónde estaba respecto a la ciudad.
- name: Ofel
  note: Colina amurallada de Jerusalén que salía hacia el este desde el ángulo sudeste del monte del templo, sobre el Cedrón
    (2Cr 27:3; Ne 3:26). Is 32:14 anuncia que quedaría desierta. Perspicacia «Ofel».
- name: Puerta de los hijos del pueblo
  note: Puerta por la que entraban y salían los reyes de Judá; allí debía empezar Jeremías su aviso sobre el sábado (Jer 17:19).
    jw.org no dice cuál era.
- name: Puerta de los Tiestos
  note: Puerta del ángulo sudeste de la muralla, abierta al valle de Hinón cerca de Tófet; Perspicacia «Puerta» la iguala
    con la Puerta de los Montones de Ceniza de Nehemías (Jer 19:2; Ne 2:13).
- name: Puerta de los Caballos
  note: Puerta del muro, probablemente al sudeste del recinto del templo, junto a la que repararon los sacerdotes (Ne 3:28;
    Jer 31:40). Perspicacia «Puerta» no la iguala con la entrada de los caballos del palacio.
- name: Patio de la Guardia
  note: Patio de la casa del rey donde Jeremías estuvo preso al final del sitio; allí podía recibir visitas y cerrar tratos
    (Jer 32:2, 8, 12; 37:21; Perspicacia «Prisión»). Ne 3:25 lo pone junto a la Casa del Rey.
- name: Calle de los panaderos
  note: De ella le daban a Jeremías un pan redondo cada día mientras quedó pan (Jer 37:21). Perspicacia «Panadero» deduce
    que los del oficio ocupaban una calle propia.
- name: Puerta del Medio
  note: Donde se sentaron los príncipes de Babilonia tras la brecha de 607 (Jer 39:3). Perspicacia «Puerta» la iguala, lo
    más probable, con la de la Ciudad Vieja; otros, con la de Efraín o la del Pescado.
- name: Jehová Es Nuestra Justicia
  note: Nombre que Jer 33:16 da a la Jerusalén restaurada; Perspicacia «Jehová Es Nuestra Justicia» dice que el nombre de
    Dios puesto sobre ella asegura su justicia.
- name: Puerta del Rey
  note: Puerta del templo hacia el este que guardaba Salum (1Cr 9:18). Perspicacia «Puerta» cree que era la Puerta Oriental,
    por donde el rey entraba y salía del templo.
- name: Puerta de Saléket
  note: Puerta al oeste del santuario, junto al camino principal que subía; allí hacían guardia Supim y Hosá (1Cr 26:16).
    Perspicacia «Saléket».
- name: Puerta del Valle
  note: En la esquina suroeste de la muralla, hacia el valle de Hinón. Uzías levantó una torre a su lado (2Cr 26:9). Perspicacia
    «Puerta, paso de entrada».
- name: Contrafuerte
  note: Punto de la muralla donde Uzías puso otra torre (2Cr 26:9). Perspicacia «Jerusalén» cree que quizá estaba en el muro
    oriental, cerca de los edificios reales.
- name: Fortaleza de la Casa
  note: Fortaleza al noroeste del templo, cuyas puertas necesitaban vigas (Ne 2:8; 7:2). Perspicacia «Castillo» dice que en
    ese sitio se levantó después la Fortaleza Antonia.
- name: Puerta de los Montones de Ceniza
  note: Puerta del ángulo sudeste, unos 1.000 codos al este de la Puerta del Valle, abierta al valle de Hinón (Ne 2:13; 3:13,
    14). Perspicacia «Puerta» la iguala con la Puerta de los Tiestos.
- name: Puerta de la Fuente
  note: Puerta del extremo sur de la colina oriental, al sur de la Ciudad de David; daba a una fuente, quizá En-Roguel (Ne
    2:14; 3:15; 12:37). Perspicacia «Puerta».
- name: Estanque del Rey
  note: Ne 2:14. Perspicacia «Estanque» ve posible situarlo entre las puertas de la Fuente y de los Montones de Ceniza; quizá
    sea el estanque de Ne 3:16.
- name: Torre de Meá
  note: Torre del muro norte, al este de la de Hananel y cerca de la Puerta de las Ovejas; los sacerdotes santificaron el
    tramo hasta ella (Ne 3:1; 12:39). Perspicacia «Torre» no sabe de dónde viene el nombre, que significa «Centenar».
- name: Puerta de la Ciudad Vieja
  note: Puerta del noroeste, entre la del Pescado y la de Efraín, donde el Muro Ancho se juntaba con el muro del Segundo Barrio;
    la repararon Joiadá y Mesulam (Ne 3:6; 12:39). Perspicacia «Puerta».
- name: Muro Ancho
  note: Tramo norte de la muralla de la ciudad vieja, en el que estaba la Puerta de Efraín; hasta él pavimentaron Uziel y
    Hananías (Ne 3:8; 12:38). Perspicacia «Puerta».
- name: Torre de los Hornos
  note: Torre del extremo noroeste, junto a la Puerta de la Esquina o cerca de ella; la repararon Malkiya y Hasub (Ne 3:11;
    12:38). Perspicacia «Torre» cree que el nombre quizá venga de panaderos del lugar.
- name: Estanque del Canal
  note: Estanque al sur de la Ciudad de David, en la unión de los valles de Hinón y Tiropeón, cerca del Jardín del Rey; Salún
    reparó su muralla (Ne 3:15). Perspicacia «Estanque del Canal» lo iguala con el estanque inferior.
- name: Escalera
  note: La que baja de la Ciudad de David, hasta donde llegaba el tramo de Salún (Ne 3:15; 12:37). Perspicacia «Estanque del
    Canal» la pone en el extremo sur de la Ciudad de David. No es la Escalera de Acaz.
- name: Sepulturas de David
  note: Tumbas de David y de reyes de Judá en la Ciudad de David; desde enfrente de ellas reparó Nehemías hijo de Azbuc (Ne
    3:16; 1Re 2:10). Perspicacia «Sepultura» no conoce su sitio; algunos las ponen en la colina sudeste.
- name: Casa de los Poderosos
  note: Edificio junto a la muralla donde acababa el tramo de Nehemías hijo de Azbuc (Ne 3:16). jw.org no dice qué era.
- name: Arsenal
  note: Depósito de armas de la ciudad; Ézer reparó un tramo frente a la subida a él, en el Contrafuerte (Ne 3:19). jw.org
    no dice dónde estaba exactamente.
- name: Casa del Rey
  note: El palacio (nota de Ne 3:25). Junto a él y al Patio de la Guardia se alzaba una torre (Ne 3:25; Jer 37:21); Perspicacia
    «Torre» recoge que algunos la ven como la Torre de David de Can 4:4.
- name: Puerta del Agua
  note: Puerta del este, cerca de Ofel y del recinto del templo, quizá por su acceso a la fuente de Guihón; ante ella había
    una plaza donde Esdras leyó la Ley (Ne 3:26; 8:1). Perspicacia «Puerta».
- name: Puerta Oriental
  note: Puerta del recinto del templo, no de la muralla; su guarda Semaya reparó un tramo (Ne 3:29). Perspicacia «Puerta»
    cree que es la puerta del rey hacia el oriente de 1Cr 9:18.
- name: Puerta de la Inspección
  note: Puerta del muro oriental, frente al templo y al norte de la Puerta de los Caballos; Malkiya el orfebre reparó hasta
    enfrente de ella (Ne 3:31). Perspicacia «Puerta» cree que era la Puerta de la Guardia.
- name: Casa de David
  note: Edificio de la Ciudad de David junto al que pasó el primer coro, entre la Escalera y la Puerta del Agua (Ne 12:37).
- name: Puerta de la Guardia
  note: Puerta donde se detuvo el segundo coro antes de bajar al templo (Ne 12:39, 40); Perspicacia «Puerta» cree que es la
    Puerta de la Inspección del muro oriental.
- name: Yerushalayim
  modern: true
  note: Nombre que, según Perspicacia, usan los mapas modernos de Israel; en árabe sigue llamándose al-Quds, «la Ciudad Santa».
