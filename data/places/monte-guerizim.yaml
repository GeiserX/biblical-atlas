reason: 'Perspicacia «Guerizim, Monte», párr. 1, 2, 4 y 6; Dt 11:29, 30; la nota de estudio de Jn 4:20 identifica con él «esta
  montaña» de la samaritana. Coordenada de OpenBible: solo tomamos el punto.'
