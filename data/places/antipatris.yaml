summary: Ciudad de la llanura de Sarón, en el cruce de calzadas romanas hacia Cesarea. Antes se llamó Afec, y allí acamparon
  los filisteos cuando tomaron el Arca. La escolta romana llevó a Pablo allí de noche.
reason: 'Perspicacia «Antípatris» (párr. 3-4) y «Afeq» (núm. 3, párr. 5); Hch 23:31 y 1Sa 4:1. Las excavaciones de 1946, 1961
  y 1974 apoyan que Afec estaba en el mismo sitio. OpenBible: solo el punto.'
