summary: 'Mar alargado entre el nordeste de África y Arabia, que al norte se abre en dos brazos: los golfos de Suez y de ʽAqaba.
  Jehová dividió sus aguas para que Israel pasara y ahogó en ellas al ejército del faraón.'
reason: 'Perspicacia «Mar Rojo», párr. 1 y 2; Sl 136:13-15. Coordenada de OpenBible: solo tomamos el punto.'
