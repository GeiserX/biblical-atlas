coord_note: 'Punto de Dibseh, de la ficha de Tifsah en OpenBible, junto al río y al sur de Carquemis (Perspicacia). Es el tramo
  de Jer 13 y de las fronteras del norte; el río sigue hasta el golfo Pérsico.'
summary: Cuarto brazo del río de Edén y el río más largo del suroeste de Asia, de unos 2.700 km. Nace en el este de Turquía
  y cruza Siria y Mesopotamia hasta el golfo Pérsico.
reason: 'Perspicacia «Éufrates», párr. 2 y apartados «Afluentes y curso del río» y «Frontera; Jeremías estuvo allí»; Gé 2:14.
  El punto marca el tramo sirio (Perspicacia «Tifsah», núm. 1). Coordenada de OpenBible: solo tomamos el punto.'
