  - lbt-egipto-a-la-tierra-prometida
  reason: La tradición lo liga a una cordillera de granito de unos 3 km con dos cumbres (Perspicacia, párr. 4). La Atalaya
    de 1993 lo ve muy posible; la ruta de Israel iba hacia las montañas del sur.
  note: 'Centro calculado: punto medio entre Jebel Musa y Ras Safsafa de OpenBible. Radio nuestro.'
