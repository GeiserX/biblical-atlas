- name: Ras Safsafa, la cumbre norte
  geometry:
    type: point
    lat: 28.555556
    lon: 33.967222
  checked_on: '2026-09-29'
  status: alternative
  sources:
  - it-sinai
  - g99-monte-sinai
  reason: Muchos eruditos la prefieren porque a su pie se abre la llanura de er-Raha, de unos 3 por 1 km; frente a Jebel Musa
    no hay una llanura así (Perspicacia, párr. 4-6).
  coord_source: openbible:abfba2a
  coord_url: https://www.openbible.info/geo/ancient/abfba2a/mount-sinai
- name: Jebel Musa, la cumbre sur
  geometry:
    type: point
    lat: 28.539722
    lon: 33.973333
  checked_on: '2026-09-29'
  status: tradition
  sources:
  - it-sinai
  - g99-monte-sinai
  reason: Es la cumbre que la tradición identifica con el Sinaí, la más alta del macizo (Perspicacia, párr. 6; ¡Despertad!
    1999, párr. 5).
  coord_source: openbible:abfba2a
  coord_url: https://www.openbible.info/geo/ancient/abfba2a/mount-sinai
summary: Monte de Arabia, según Gál 4:25, donde Israel acampó casi un año y recibió la Ley. No se sabe cuál es con seguridad;
  lo más citado es un macizo de dos cumbres en el sur de la península del Sinaí.
reason: Perspicacia «Sinaí» (párr. 1, con Gál 4:25, y 3-6) y «Horeb» (párr. 3); el mapa B3 lo dibuja. Har Karkom y Jebel Sin
  Bishar no aparecen en wol.jw.org, así que no los incluimos.
