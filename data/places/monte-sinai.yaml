- name: Horeb
  note: Al parecer, otro nombre del monte o de la zona montañosa que lo rodea (Éx 3:1).
- name: Montaña del Dios verdadero
  note: Así llama 1Re 19:8 al Horeb, adonde llegó Elías huyendo de Jezabel.
