  note: No es la Tapúah de la Sefelá de Judá (Jos 15:34; Perspicacia, núm. 2).
- name: En-Tapúah
  note: Jos 17:7. Perspicacia cree que es un manantial cercano o un nombre más completo de la ciudad.
