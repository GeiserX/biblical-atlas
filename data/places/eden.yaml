summary: Región donde Dios plantó el jardín del primer hombre. Solo se conocen dos de sus cuatro ríos, el Éufrates y el Tigris,
  y el Diluvio borró el jardín, así que su sitio exacto es una conjetura.
reason: 'Perspicacia «Edén»: ubicación conjetural (párr. 12), preferencia del texto hebreo (párr. 13), ubicación tradicional
  (párr. 14) y desaparición en el Diluvio (párr. 15). Gé 2:8-14 describe los ríos.'
