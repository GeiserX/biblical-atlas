id: monte-moria
name: Monte Moria
names:
- name: Monte Moria
- name: Monte del templo
  note: Nombre de la lámina B11 para el recinto del templo en el siglo I.
- name: Tierra de Moria
  note: Región de montañas que, según Perspicacia, rodeaba el sitio de Jerusalén; en una de ellas iba a ofrecer Abrahán a
    Isaac.
- name: Pórtico de Salomón
  note: Columnata del lado este del recinto del templo por la que Jesús caminaba en la Dedicación (lámina B11). Perspicacia
    la llama Columnata de Salomón.
- name: Puerta Hermosa
  note: Una entrada del templo donde a diario dejaban a pedir limosna al cojo que curó Pedro (Hch 3:2, 10; «Testimonio completo»,
    capítulo 4). OpenBible solo le da el punto de Jerusalén.
- name: Montaña de la Casa
  note: Así llama Miq 3:12 al monte del templo, como aclara su nota; Perspicacia «Sion» sitúa el recinto del templo en Moria.
- name: Era de Arauna
  note: La era que David compró a Arauna el jebuseo para el altar (2Sa 24:18-25); luego se levantó allí el templo.
- name: Casa del Bosque del Líbano
  note: Edificio de cedro de Salomón al sur del templo (1Re 7:2; Perspicacia «Casa del Bosque del Líbano»), en la ladera
    que baja del templo hacia la Ciudad de David (Perspicacia «Salomón»). Is 22:8 lo llama arsenal.
- name: Sala de las Columnas
  note: Parte de los edificios de Salomón junto a su palacio, en la ladera que baja del templo hacia la Ciudad de David (1Re
    7:6; Perspicacia «Salomón»).
- name: Sala del Trono
  note: Donde Salomón juzgaba, por eso también Sala de Juicio (1Re 7:7). Perspicacia «Salomón» la pone junto a su palacio,
    en la ladera que baja del templo hacia la Ciudad de David.
