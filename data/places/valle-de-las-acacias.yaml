names:
- name: Valle de las Acacias
  note: La nota de Joe 3:18 da «wadi», un cauce que solo lleva agua en la estación de lluvias (Perspicacia «Acacia»).
- name: Sitim
  note: Nombre hebreo (Acacias) con que lo trata Perspicacia, «Sitim», núm. 2. No es la Sitim del campamento de Israel en
    las llanuras de Moab, el núm. 1.
