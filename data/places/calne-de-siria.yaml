summary: Ciudad que Amós nombra junto a Hamat y Gat para que Israel y Judá se comparen con ellas. Por esa compañía, la mayoría
  la busca en el norte de Siria, cerca del Mediterráneo, y no en Mesopotamia.
reason: Perspicacia «Calné», núm. 2; Am 6:2. Algunos comentaristas la creen la misma que la núm. 1. Perspicacia no elige sitio.
