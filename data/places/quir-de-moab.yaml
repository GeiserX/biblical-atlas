# biblical-atlas: un fichero por lugar. Esquema en docs/investigacion/README.md.
id: quir-de-moab
name: Quir de Moab
names:
- name: Quir de Moab
- name: Quir-Haréset
  note: Así la llaman 2Re 3:25 e Is 16:7, 11. Perspicacia la da por otro nombre de la misma ciudad, como hace el Targum, y «Las profecías
    de Isaías I» escribe Quir o Quir-haréset.
- name: Quir-Heres
  note: Forma de Jer 48:31, 36. El Targum arameo la iguala con Quir de Moab, según Perspicacia «Quir de Moab».
type: city
lat: 31.180556
lon: 35.701389
precision: point
coord_source: openbible:a1a57d0
coord_url: https://www.openbible.info/geo/ancient/a1a57d0/kir-2
coord_note: Punto de OpenBible en Karak, con que se suele identificar la ciudad. Es el mismo punto que representa a todo Moab.
summary: Ciudad principal de Moab, quizá su antigua capital, que se suele identificar con Karak, unos 35 km al sur de Dibón.
  En ella quedó cercado el rey Mesá (2Re 3:25-27), e Isaías anuncia que quedará en silencio.
reason: 'Perspicacia «Quir de Moab» y «Quir-haréset»; 2Re 3:25-27; Is 15:1; 16:7, 11. «Las profecías de Isaías I», cap. 15,
  párr. 10. OpenBible: solo el punto.'
not_claimed:
- 'Que sea la Quir adonde fueron desterrados los arameos (Am 1:5; 9:7): Perspicacia la trata en otro artículo.'
- 'Que la ciudad cayera: Perspicacia «Quir de Moab» dice que no se conquistó, y los aliados se retiraron tras el sacrificio
  (2Re 3:27).'
