summary: Lugar a las afueras de Jerusalén donde ejecutaron a Jesús; cerca pasaba un camino y había un jardín con una tumba
  nueva. La Biblia no dice que fuera una colina, y hoy nadie sabe con exactitud dónde estaba.
reason: Perspicacia «Gólgotha» (párr. 3-6), nota de estudio de Jn 19:17 y «¿Por qué tuvo que morir Jesús?» (párr. 22). El mapa
  B12-A lo marca con signo de duda.
