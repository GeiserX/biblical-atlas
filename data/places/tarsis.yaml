summary: Región del Mediterráneo adonde quiso huir Jonás desde Jope, en dirección opuesta a Nínive. Comerciaba plata, hierro,
  estaño y plomo con Tiro. Lo más probable es que estuviera en el sur de España.
reason: Perspicacia «Tarsis» (párr. 6-14) y Jon 1:3. «Naves de Tarsis» llegó a nombrar un tipo de barco, así que no todo viaje
  con ese nombre iba allí (párr. 12).
