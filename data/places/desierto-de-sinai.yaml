summary: Desierto al pie del monte Sinaí, cerca de Refidim, donde Israel acampó casi un año. Allí Jetró llevó a Moisés su
  familia, se hizo el pacto de la Ley y se construyó el tabernáculo.
reason: 'Perspicacia «Sinaí», núm. 2, «Horeb», párr. 1, y «Tabernáculo», apartado «Cuándo se inauguró»; Éx 17:6; 18:5; 19:1,
  2, y los capítulos 32 a 40, con el campamento al pie del monte. OpenBible: solo el punto.'
