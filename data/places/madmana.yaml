coord_url: https://www.openbible.info/geo/ancient/a8661e2/madmannah
coord_note: Khirbet Tatrit, primera identificación de OpenBible; Perspicacia la da como la propuesta más probable.
summary: Ciudad del sur de Judá dada a Simeón como enclave, que Jos 19:5 llama Bet-Marcabot. Quizá servía a los carros que
  iban de Beer-Seba al norte. Se propone Khirbet Tatrit, unos 15 km al noreste de Beer-Seba.
reason: 'Perspicacia «Madmaná», núm. 2, y «Bet-marcabot»: las listas paralelas indican que es la misma ciudad. Jos 15:31; 19:5;
  1Cr 4:31. OpenBible: solo el punto.'
