id: raba
name: Rabá
names:
- name: Rabá
- name: Rabá de los ammonitas
  note: Así la llama Dt 3:11.
- name: Filadelfia
  note: Nombre que le dio Tolomeo Filadelfo al reconstruirla en el siglo III a.e.c.; después fue una de las ciudades de la
    Decápolis.
- name: Ammán
  note: Ciudad actual que ocupa el mismo sitio (Perspicacia «Rabá», núm. 1).
- name: Ciudad de las aguas
  note: Parte de Rabá que tomó Joab antes de llamar a David (2Sa 12:27). Perspicacia «Rabá» piensa en la zona junto al agua
    o en el control de su suministro.
