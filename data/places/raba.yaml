coord_note: Es el punto de Ammán, el mismo que OpenBible da a todo Ammón.
summary: Probable capital de Ammón y única ciudad ammonita que nombra la Biblia, junto a un afluente del alto Jaboc. Guardaba
  el ataúd de hierro de Og. Joab la sitió y David la conquistó.
reason: 'Perspicacia «Rabá», núm. 1: estaba donde hoy está Ammán, a unos 37 km al este del Jordán; Dt 3:11; 2Sa 11:1; 12:26-31.
  OpenBible: solo el punto.'
