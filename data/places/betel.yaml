# biblical-atlas: un fichero por lugar. Esquema en docs/investigacion/README.md.
id: betel
name: Betel
names:
- name: Luz
  to: -1472
  note: Nombre cananeo de la ciudad (Gé 28:19). Desde 1473 a.e.c. el relato ya la llama Betel; Perspicacia dice que Luz
    dejó de usarse del todo cuando la tomó la casa de José (Jue 1:22-26), suceso sin año.
- name: Betel
  from: -1780
  note: Jacob llamó así al lugar de su campamento en 1781 a.e.c.; tras la conquista el nombre pasó a la ciudad.
- name: El-betel
  note: Nombre que Jacob dio al lugar del altar a su regreso (Gé 35:7).
- name: Bet-Aven
  note: Nombre de desprecio que usa Oseas por la adoración falsa de la ciudad (Os 4:15).
- name: Alón-Bacut
  note: Roble al pie de la colina de Betel donde enterraron a Débora (Gé 35:8); la nota dice que significa «roble del llanto».
type: city
lat: 31.922778
lon: 35.241389
