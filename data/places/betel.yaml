coord_source: openbible:a64f355
coord_url: https://www.openbible.info/geo/ancient/a64f355/bethel-1
summary: Ciudad de la región montañosa de Efraín, unos 17 km al norte de Jerusalén, en un cruce de caminos. Jacob vio allí
  la escalera del sueño; siglos después Jeroboán puso en ella un becerro de oro.
reason: 'Perspicacia «Betel» (párr. 3, 7-9 y 15) y Gé 28:10-19. Los años salen del estudio 3 (la huida de Jacob, 1781 a.e.c.)
  y de Perspicacia (1473 a.e.c.). OpenBible: solo el punto.'
