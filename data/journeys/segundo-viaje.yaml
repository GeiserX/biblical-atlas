summary: Con Silas visita de nuevo Galacia, suma a Timoteo en Listra, cruza a Macedonia desde Troas (Lucas se une
  allí) y pasa 18 meses en Corinto. Áquila y Priscila lo acompañan de Cencreas a Éfeso.
reason: 'El estudio 3 (párr. 24 y 25) fecha la salida a finales del verano de 49, el paso a Europa en la primavera de 50
  y la vuelta en el verano de 52. Acompañantes: Hch 15:40; 16:1-17; 17:14; 18:2-19.'
