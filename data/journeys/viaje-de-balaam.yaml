summary: Balac, rey de Moab, llama a Balaam para que maldiga a Israel. Balaam viaja desde Petor, junto al Éufrates, y desde
  tres alturas que Balac le muestra bendice a Israel en lugar de maldecirlo.
reason: Números 22 a 24 cuenta el viaje y las tres bendiciones, y Dt 23:4 da Petor de Mesopotamia como su ciudad. Los sucesos
  del relato llevan c. 1473 a.e.c., el año de la llegada a Moab.
