summary: Los rebaños de los dos hermanos ya no caben en el mismo país. Esaú se lleva a sus esposas, sus hijos, sus hijas y
  todo lo que tiene de Canaán a la región montañosa de Seír.
reason: Gé 36:6-8 cuenta el traslado y Jos 24:4 lo recuerda. Fecha narrativa del suceso «Esaú se traslada a la región montañosa
  de Seír», tras la muerte de Isaac.
