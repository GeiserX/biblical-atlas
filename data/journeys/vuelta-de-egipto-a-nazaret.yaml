summary: Muerto Herodes, otro sueño manda a José volver a la tierra de Israel. Como en Judea reina Arquelao, se aparta a Galilea
  y se instala con la familia en Nazaret.
reason: Mt 2:19-23 da las etapas en orden, y Lu 2:39 confirma la llegada a Nazaret. Fecha del suceso regreso-a-nazaret. La
  nota de Mt 2:15 pone la muerte de Herodes probablemente en 1 a.e.c.
