reason: El estudio 3 fecha en 607 a.e.c. el asesinato de Guedalías y la huida a Egipto (sucesos asesinato-de-guedalias y el-resto-de-juda-huye-a-egipto).
  Perspicacia «Johanán», núm. 5, cuenta el recorrido.
