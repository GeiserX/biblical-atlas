summary: Israel sale de Ramesés el día siguiente a la Pascua, cruza el mar Rojo y, pasando por Mará, Elim, el desierto de
  Sin y Refidim, llega en el tercer mes al desierto de Sinaí.
reason: Éxodo 12 a 17 y 19 cuentan la marcha, y Nú 33:3-15 da la lista de campamentos. El estudio 3 fecha el éxodo en 1513
  a.e.c.; Nú 33:3 da el día de salida y Éx 19:1 el mes de llegada.
