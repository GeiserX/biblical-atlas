summary: Mientras sus siervos cercan Jerusalén, el rey de Babilonia llega en persona. Joaquín se le rinde, y Nabucodonosor
  se lleva a Babilonia al rey, a su corte, a miles de desterrados y los tesoros del templo.
reason: 2Re 24:11 dice que el rey vino a la ciudad y 24:15 que se llevó a Joaquín de Jerusalén a Babilonia; Perspicacia
  «Joaquín» une a este sitio Da 1:1, 2. Fecha del suceso nabucodonosor-se-lleva-a-joaquin-a-babilonia.
