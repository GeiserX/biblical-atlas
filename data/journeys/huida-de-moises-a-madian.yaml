summary: Con cuarenta años, Moisés mata a un egipcio que golpeaba a un hebreo. Cuando el faraón intenta matarlo, huye a Madián,
  defiende a las hijas de Reuel junto a un pozo y se queda allí, casado con Ziporá.
reason: Éx 2:11-22 y Hch 7:23-29 dan la huida y la llegada, y Hch 7:23 le da cuarenta años. El estudio 3 fecha la huida a
  Madián en 1553 a.e.c.
