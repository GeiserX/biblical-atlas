summary: Moisés envía a doce jefes, uno por tribu, a explorar Canaán. En 40 días van del desierto de Zin a Rehob, ven a los
  anaquim en Hebrón y vuelven a Cadés con un gran racimo de Escol.
reason: Nú 13 da el encargo, el recorrido y la vuelta, y Dt 1:22-25 lo repite. Perspicacia «Espías» fecha el envío en 1512
  a.e.c. Josué va como dueño del viaje y los otros once como acompañantes.
