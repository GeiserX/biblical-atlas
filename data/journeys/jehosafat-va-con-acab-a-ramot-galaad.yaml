summary: Jehosafat baja a Samaria a visitar a Acab y acepta ir con él contra los sirios. En Ramot-Galaad los carros lo confunden
  con el rey de Israel, pero se salva. Acab muere, y Jehosafat vuelve ileso a Jerusalén.
reason: 1Re 22 y 2Cr 18:1-19:1 cuentan la visita, la batalla y la vuelta. Fechas de los sucesos acab-y-jehosafat-consultan-a-los-profetas
  y muerte-de-acab.
