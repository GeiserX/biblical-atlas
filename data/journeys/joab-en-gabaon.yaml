reason: 2Sa 2:13-32; Abisái persigue con él (2:24). Perspicacia «Joab», núm. 2, y «Abner», párr. 5, que da más de 22 km de
  noche hasta Hebrón. Entre 1077 y c. 1075 a.e.c.
