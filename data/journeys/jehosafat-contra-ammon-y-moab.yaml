summary: Ammón, Moab y los de Seír invaden Judá. Jehosafat ora en Jerusalén y sale al desierto de Tecoa, donde los invasores
  se matan entre ellos. Recogen el botín, alaban a Jehová en Beracá y vuelven cantando.
reason: 2Cr 20 va tras la vuelta de Ramot-Galaad (2Cr 19:1) y antes de las naves con Ocozías (2Cr 20:35-37). Fechas de muerte-de-acab
  y las-naves-de-jehosafat-se-destrozan-en-ezion-gueber.
