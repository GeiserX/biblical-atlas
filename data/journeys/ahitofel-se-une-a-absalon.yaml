summary: Mientras ofrece sacrificios en Hebrón, Absalón manda llamar a Ahitofel, que está en Guiló. Ahitofel le aconseja en
  Jerusalén; cuando Absalón prefiere el consejo de Husai, vuelve a su pueblo y se ahorca.
reason: '2Sa 15:12; 16:15-23; 17:1-23. Perspicacia «Ahitofel»: natural de Guiló. El texto no dice que llegara a Hebrón, así
  que no es parada. Sin año: entre 1070 y c. 1040 a.e.c.'
