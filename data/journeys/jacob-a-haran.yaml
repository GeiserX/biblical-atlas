summary: Amenazado por Esaú y enviado a buscar esposa entre los suyos, Jacob sale de Beer-Seba con 77 años. En Luz sueña con
  una escalera y la llama Betel; sigue hacia el este hasta un pozo de Harán.
reason: Gé 28:10 a 29:14 da la salida, la noche en Betel y la llegada. El estudio 3 fecha en 1781 a.e.c. la huida de Jacob,
  y Perspicacia «Jacob» le da 77 años al dejar Beer-Seba.
