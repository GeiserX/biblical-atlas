summary: El año de la destrucción de Sodoma, Abrahán deja Mamré y se instala en el Négueb, entre Cadés y Sur. En Guerar vuelve
  a decir que Sara es su hermana, y el rey Abimélec se la devuelve.
reason: Gé 18:1 y 19:27 lo dejan en Mamré, y Gé 20:1 lo lleva al Négueb y a Guerar. Perspicacia «Abimélec» pone la estancia
  en Guerar hacia 1919 a.e.c.
