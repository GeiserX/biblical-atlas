summary: Las tribus se reúnen en Mizpá contra Guibeá. Entre Betel, donde consultan a Dios, y Guibeá pierden dos batallas;
  en la tercera vencen, persiguen a Benjamín y queman sus ciudades. Lloran en Betel y acampan en Siló.
reason: Jueces 20 y 21 dan las paradas en orden, con tres subidas a Betel. Perspicacia «Betel» cree que el Arca estaba allí
  por la guerra. Fecha de sus sucesos (estudio 3; «Jueces, Libro de», «Orden del libro»).
