summary: Las peleas entre los pastores de Lot y los de Abrán obligan a separarse. Lot elige el distrito del Jordán, bien regado,
  lleva su campamento al este y acaba poniendo su tienda cerca de Sodoma.
reason: Gé 13:5-13 cuenta la elección y el traslado, y Gé 14:12 dice que Lot ya vivía en Sodoma. Fecha narrativa del suceso
  «Abrán y Lot se separan».
