summary: Por otra hambre, Isaac va a Guerar en vez de bajar a Egipto. La envidia de los filisteos lo aparta al valle, donde
  reabre los pozos de su padre y cava Ésec, Sitná y Rehobot; luego sube a Beer-Seba.
reason: Gé 25:11 y 26:1-33 dan las etapas en orden. Todos sus sucesos van entre la muerte de Abrahán (1843 a.e.c.) y la huida
  de Jacob (1781 a.e.c.), sin año propio.
