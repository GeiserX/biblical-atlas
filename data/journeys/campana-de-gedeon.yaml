summary: Gedeón reúne a las tribus desde Ofrá, vence a Madián junto a Moré con 300 hombres, cruza el Jordán tras los reyes
  Zébah y Zalmuná, los apresa en Carcor y castiga a Sucot y Penuel antes de volver.
reason: 'Jueces 6 a 8 dan las paradas en orden. Sin año en jw.org: el libro cubre desde c. 1450 (estudio 3, tabla de libros)
  y Gedeón es anterior a Jefté, que empieza hacia 1173 (Perspicacia «Jefté»).'
