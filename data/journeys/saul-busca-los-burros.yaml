summary: Saúl y un sirviente buscan los burros de Quis por Efraín, Salisá, Saalim y Benjamín. En la tierra de Zuf, Samuel
  lo unge rey, y al volver se cumplen las señales junto a Zelzá y al árbol de Tabor.
reason: 1 Samuel 9 y 10 dan las paradas en orden. El estudio 3 fecha la unción de Saúl en 1117 a.e.c.
