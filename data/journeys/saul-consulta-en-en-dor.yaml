summary: Con los filisteos acampados en Sunem y sin respuesta de Jehová, Saúl se disfraza y va de noche desde Guilboa a En-Dor
  con dos de sus hombres. La médium le anuncia su muerte y él vuelve esa misma noche.
reason: 1Sa 28:4-25; la vuelta al Guilboa sale de 31:1-6. Perspicacia «Saúl», párr. 15, y «En-dor». Todo pasa en 1078, año
  de su muerte (Perspicacia «Jonatán», núm. 2; estudio 3).
