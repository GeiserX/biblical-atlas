summary: Casi un año después de llegar al Sinaí, la nube se levanta e Israel se pone en marcha. Pasa por Taberá, Quibrot-Hataavá
  y Hazerot y, cruzando el desierto de Parán, llega a Cadés, desde donde salen los espías.
reason: Números 10 a 14 da las etapas en orden, y Nú 33:16-18 las repite como lista. El estudio 3 fecha la marcha en 1512
  a.e.c. y Nú 10:11 da el día de salida.
