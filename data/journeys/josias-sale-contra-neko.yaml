summary: Nekó le avisa que no viene contra Judá, pero Josías se disfraza y le sale al paso en la llanura de Meguidó. Herido
  por los arqueros, lo llevan en otro carro a Jerusalén; murió en el camino o al llegar.
reason: 2Re 23:29, 30 y 2Cr 35:20-24 dan la salida, Meguidó y la vuelta. Fecha del suceso muerte-de-josias, 628 a.e.c.
