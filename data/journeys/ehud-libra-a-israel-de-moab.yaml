summary: Ehúd lleva el tributo a Eglón, rey de Moab, en Jericó. Al llegar a las imágenes talladas de Guilgal se vuelve, lo
  mata a solas y huye a Seirá; con los de Efraín corta a Moab los vados del Jordán.
reason: 'Jueces 3:15-30 da el recorrido, y La Atalaya del 15 de marzo de 1997 pone el palacio de Eglón en Jericó. Sin año
  propio: entre la muerte de Josué y el comienzo de Jefté.'
