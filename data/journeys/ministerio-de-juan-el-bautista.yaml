summary: Juan crece en el desierto y en 29 empieza a predicar por la región del Jordán. Bautiza en Betania, al otro lado del
  río, y después en Enón, hasta que Herodes Antipas lo manda encarcelar.
reason: Los Evangelios dan los lugares; el orden y las fechas son los de los sucesos juan-comienza-su-ministerio, bautismo-de-jesus,
  juan-niega-ser-el-cristo, ultimo-testimonio-de-juan y encarcelamiento-de-juan (tablas A7-A y A7-B).
