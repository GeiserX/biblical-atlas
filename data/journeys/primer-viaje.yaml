- bernabe
- {person: juan-marcos, from: 1, to: 5}
summary: Pablo y Bernabé salen de Antioquía de Siria, recorren Chipre y el sur de Galacia y vuelven por el mismo
  camino. Juan Marcos los deja en Perga.
reason: El estudio 3 (párr. 21) fecha la gira de la primavera de 47 al otoño de 48; Hechos 13 y 14 dan las paradas en
  orden. Juan Marcos va hasta Perga (Hch 13:5, 13).
