summary: 'Durante años David huye de Saúl: de Ramá a Nob y a Gat, a la cueva de Adulam, a Moab, a Queilá y por los desiertos
  de Zif, Maón, En-Guedí y Parán, hasta refugiarse con Akís, que le da Ziclag.'
reason: '1 Samuel 19 a 27 dan las paradas en orden. Sin año en jw.org: entre el nacimiento de David (1107, estudio 3) y la
  muerte de Saúl (1078, Perspicacia «Jonatán», núm. 2); el final se cuenta desde 1Sa 27:7.'
