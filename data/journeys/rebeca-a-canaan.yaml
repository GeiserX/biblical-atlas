summary: El siervo de Abrahán va con diez camellos a la ciudad de Nacor y encuentra a Rebeca junto al pozo. Ella acepta ir
  con él, y la caravana baja al Négueb, donde Isaac la recibe como esposa.
reason: Gé 24 cuenta la ida del siervo y la vuelta con Rebeca; Gé 24:59 y 35:8 dan a su nodriza el nombre de Débora. El estudio
  3 fecha la boda en 1878 a.e.c., con Isaac de 40 años (Gé 25:20).
