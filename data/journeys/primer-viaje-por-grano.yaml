summary: Con el hambre, Jacob manda a diez de sus hijos a comprar grano en Egipto y se queda con Benjamín. José los reconoce,
  los trata como espías y retiene a Simeón; de vuelta, hallan el dinero en los costales.
reason: Gé 42 da la ida, la estancia y la vuelta; Rubén, el primogénito, habla por todos (Gé 42:22, 37). Perspicacia «Jacob»
  pone el viaje unos diez años después de morir Isaac. Simeón se queda en Egipto.
