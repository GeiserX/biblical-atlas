summary: Sansón ve en Timná a una filistea y pide a sus padres que se la consigan. En el camino mata un león; en la boda plantea
  una adivinanza y paga la apuesta con ropa de 30 hombres de Asquelón.
reason: 'Jueces 14 da las paradas; la casa de sus padres está en Zorá según Jue 13:2 y Perspicacia «Sansón». Sin año en jw.org:
  después de Jefté (c. 1173) y antes de Saúl (1117, estudio 3).'
