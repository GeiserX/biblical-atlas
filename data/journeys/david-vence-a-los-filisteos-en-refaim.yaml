summary: Cuando los filisteos se despliegan en el valle de Refaím, David baja al refugio y los vence en Baal-Perazim. La segunda
  vez los rodea, cae sobre ellos por la espalda y los persigue desde Gueba hasta Guézer.
reason: 2Sa 5:17-25 y 1Cr 14:8-17. Perspicacia «David», párr. 22, cuenta las dos batallas tras la toma de Sion y antes del
  Arca; «Adulam», párr. 3, dice que fue su base en estas guerras.
