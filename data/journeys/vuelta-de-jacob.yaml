summary: Tras veinte años con Labán, Jacob sale sin avisar con su familia y sus rebaños, pacta con él en Galaad, lucha con
  un ángel junto al Jaboc, se reconcilia con Esaú y se asienta en Sucot y en Siquem.
reason: Gé 31:17 a 33:20 da las etapas en orden, y Os 12:3, 4 recuerda la lucha. Los sucesos del camino son de 1761 a.e.c.;
  la llegada a Siquem va antes de nacer Benjamín, sin año propio.
