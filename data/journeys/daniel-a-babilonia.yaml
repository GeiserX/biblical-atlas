summary: Con el rey Joaquín y los primeros deportados, Daniel, Hananías, Misael y Azarías son llevados de Jerusalén a Babilonia,
  donde reciben nombres babilonios y tres años de formación para servir en la corte.
reason: El estudio 3 fecha en 617 a.e.c. el destierro con Joaquín, suceso nabucodonosor-se-lleva-a-joaquin-a-babilonia; al
  llegar, Aspenaz los escoge (daniel-llevado-a-babilonia). Ezequiel va en el mismo convoy, con joaquin-llevado-a-babilonia
  (Eze 1:2).
