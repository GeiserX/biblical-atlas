summary: Unos astrólogos de Oriente llegan a Jerusalén preguntando por el rey de los judíos. Herodes los manda a Belén; ven
  al niño en una casa, le dan oro, olíbano y mirra y vuelven a su tierra por otro camino.
reason: 'Mateo 2:1-12 da las paradas; tabla A7-A, fila 7. Mateo no nombra su país ni dice cuántos eran (Perspicacia «Astrólogos»):
  no tienen ficha, y la salida y la vuelta son áreas desconocidas.'
