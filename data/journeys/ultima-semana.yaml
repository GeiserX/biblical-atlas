summary: Desde Betania entra en Jerusalén montado en un burro y durante tres días enseña en el templo, volviendo de noche
  a Betania. Celebra la Pascua, lo arrestan en Getsemaní, lo juzgan y muere en el Gólgota.
reason: Los cuatro Evangelios dan las paradas; los días son los de las tablas A7-G, A7-H, B12-A y B12-B, que siguen los sucesos
  anclados de cada parada.
