summary: Acabado el luto, José pide permiso al faraón y sube con sus hermanos y una gran comitiva egipcia. Lloran siete días
  en la era de Atad, entierran a Jacob en la cueva de Macpelá y vuelven a Egipto.
reason: Gé 50:4-14 da la salida, el duelo, el entierro y la vuelta con los hermanos. Jacob murió en 1711 a.e.c., y el viaje
  sigue a los 70 días de luto (Gé 50:3), sin año propio.
