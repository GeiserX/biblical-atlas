summary: Pablo vuelve a Galacia y Frigia, pasa unos tres años en Éfeso, recorre Macedonia y Grecia y regresa por
  mar a Jerusalén para Pentecostés de 56.
reason: El estudio 3 (párr. 26) da las fechas. Cada acompañante va en las paradas que dan Hch 19:22, 29; 20:4-6; 21:29,
  2Co 1:1 y Ro 16:21. Los siete de Hch 20:4 se adelantan a Troas; en Filipos, solo Lucas.
