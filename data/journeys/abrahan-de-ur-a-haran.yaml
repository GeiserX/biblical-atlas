summary: Dios llama a Abrán en Ur. Taré sale con Abrán, Sarái y Lot rumbo a Canaán, pero la familia se asienta en Harán y
  allí se queda hasta que muere Taré.
reason: Gé 11:31, 32 cuenta la salida de Ur y la estancia en Harán; Hch 7:2-4 pone la llamada antes de Harán. La fecha es
  una cuenta nuestra sobre Perspicacia «Abrahán», como el suceso de la salida.
