summary: Abner pacta con David y le lleva a Mical. Su esposo, Paltiel, la sigue llorando hasta Bahurim. En Hebrón David recibe
  a Abner y lo despide, pero Joab lo hace volver desde la cisterna de Sirá y lo mata.
reason: 2Sa 3:12-27 da las etapas; 3:15 no dice dónde estaba Mical, así que el viaje empieza en Bahurim. Perspicacia «Abner»,
  párr. 6, y «Paltiel», núm. 2. Entre 1077 y c. 1075 a.e.c.
