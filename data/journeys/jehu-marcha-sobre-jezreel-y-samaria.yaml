summary: Ungido en Ramot-Galaad, Jehú corre a Jezreel y mata a Jehoram, a Jezabel y a la casa de Acab. Camino de Samaria mata
  a los hermanos de Ocozías y recoge a Jehonadab; allí extermina a los adoradores de Baal.
reason: 2Re 9 y 10 cuentan la marcha en este orden. Todos sus sucesos van fechados en c. 905 a.e.c. (estudio 3; tabla A6-A).
