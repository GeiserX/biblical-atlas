summary: Jacob manda a José, de 17 años, a ver cómo están sus hermanos. No los halla en Siquem y los encuentra en Dotán, donde
  lo venden a una caravana que baja de Galaad; en Egipto lo compra Potifar.
reason: Gé 37:12-28 da la ruta y la venta, y Gé 37:36 con 39:1 la llegada a Egipto. El estudio 3 fecha la venta en 1750 a.e.c.,
  con José de 17 años (Gé 37:2).
