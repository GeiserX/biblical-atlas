summary: Con el espíritu de Jehová, Jefté atraviesa Galaad y Manasés hasta Mizpé, hace su voto y derrota a Ammón desde Aroer
  hasta Minit y Abel-Keramim. Al volver a Mizpá sale a su encuentro su hija.
reason: Jueces 11:29-34 da las paradas en orden. Perspicacia «Jefté» fecha el comienzo de su judicatura, y con ella esta victoria,
  alrededor de 1173 a.e.c.
