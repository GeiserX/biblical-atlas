summary: Un levita de Efraín va a Belén por su concubina. Al volver evita Jebús y se aloja en Guibeá, donde ella muere. En
  casa la parte en doce trozos y explica el crimen en Mizpá.
reason: Jueces 19:1 a 20:7 da las paradas en orden. Perspicacia «Jueces, Libro de», «Orden del libro», lo pone pocos años
  después de morir Josué; fecha de sus sucesos (estudio 3). Ni él ni ella tienen nombre.
