summary: Israel trae el Arca de Siló al campamento, y los filisteos la capturan junto a Ebenézer. Siete meses la pasan
  de una de sus ciudades a otra mientras sufren plagas; al fin la devuelven a Bet-Semes, y sube a Quiryat-Jearim.
reason: 1 Samuel 4:3 a 7:2 da el orden de los lugares; Perspicacia «Arca del pacto», párr. 13 y 16, lo resume. Sin año
  propio; fecha de sus sucesos, entre Jefté y la unción de Saúl (estudio 3).
