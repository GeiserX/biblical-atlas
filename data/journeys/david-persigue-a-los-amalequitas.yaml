summary: Con Ziclag quemada, David consulta a Jehová y sale con 600 hombres. Deja a 200 agotados en el torrente de Besor,
  un egipcio lo guía hasta los saqueadores y lo recupera todo. De vuelta, reparte el botín por igual.
reason: 1Sa 30:1-26 da las etapas en orden; Perspicacia «Besor, Valle torrencial de» y «David», párr. 18. Todo en 1078, el
  año de Guilboa (Perspicacia «Jonatán», núm. 2).
