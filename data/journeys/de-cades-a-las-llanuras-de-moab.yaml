summary: Edom no deja pasar a Israel y Aarón muere en el monte Hor. El pueblo rodea Edom y Moab, vence a Sehón y a Og, reyes
  amorreos, y acampa en las llanuras de Moab, frente a Jericó.
reason: Nú 20 a 22 y 33:37-49 dan las etapas; Dt 2, 3 y 10:6, 7 añaden otras. Nú 33:38 fecha la muerte de Aarón en el año
  cuarenta, y los sucesos de Moab llevan c. 1473 a.e.c.
