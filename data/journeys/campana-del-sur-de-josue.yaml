summary: Josué sale de noche de Guilgal en ayuda de Gabaón, persigue a los cinco reyes por Bet-Horón hasta Azecá y Maquedá
  y conquista Libná, Lakís, Eglón, Hebrón y Debir. Luego vuelve a Guilgal.
reason: 'Josué 10 da las etapas en orden. Sin año propio: va entre la toma de Hai, en 1473 a.e.c., y el fin de la conquista
  general, que el estudio 3 pone en 1467 a.e.c.'
