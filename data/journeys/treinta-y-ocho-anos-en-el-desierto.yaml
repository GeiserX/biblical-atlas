summary: Tras negarse a entrar en Canaán, Israel deja Cadés y cambia de campamento dieciocho veces, de Ritmá a Ezión-Guéber,
  hasta volver a Cadés el primer mes del año cuarenta.
reason: Nú 33:18-36 da las etapas y Dt 2:14 cuenta 38 años de Cadés-Barnea al Zered. Perspicacia «Qadés» cuenta dieciocho
  etapas desde Hazerot, y Nú 20:1 fecha la vuelta en el primer mes.
