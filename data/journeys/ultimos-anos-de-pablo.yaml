# biblical-atlas: un fichero por viaje. Esquema en docs/investigacion/README.md.
id: ultimos-anos-de-pablo
name: Entre los dos encierros en Roma
person: pablo
reference: 1Ti 1:3; Tit 1:5; 3:12; 2Ti 4:6-21
date:
  from: 61
  to: 65
  precision: range
  approx: true
  type: anchored
  chronology: tnm
  text: c. 61-65 e.c.
companions:
- {person: tito, from: 2, to: 2}
- {person: timoteo, from: 3, to: 3}
- person: trofimo
  from: 7
  to: 7
summary: 'Libre hacia 61, Pablo vuelve a viajar: deja a Tito en Creta y a Timoteo en Éfeso, escribe desde Macedonia, piensa
  invernar en Nicópolis y pasa por Troas y Mileto. Hacia 65 está otra vez preso en Roma.'
reason: Perspicacia «Pablo», «Tito, Carta a» y «Timoteo, Cartas a»; nota de estudio de Hch 28:30. Hechos no lo narra y
  el orden de las paradas no es seguro. Tito queda en Creta y Timoteo en Éfeso (Tit 1:5; 1Ti 1:3).
