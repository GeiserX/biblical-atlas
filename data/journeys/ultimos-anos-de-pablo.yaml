history:
- date: '2026-10-02'
  change: 'Tito pasa a ir solo en Creta y Timoteo solo en Éfeso. Trófimo sale de companions y queda en la nota de Roma: se había quedado enfermo en Mileto.'
  source: it-trofimo
- date: '2026-10-13'
  change: Las paradas 2 (Creta) y 3 (Éfeso) decían «orden cierto», pero la razón del viaje y la de la parada 2 dicen que no
    se sabe cuál fue antes. Pasan a «orden incierto».
  source: 1-timoteo-1
- date: '2026-10-13'
  change: 'Nuevas paradas 6 (Troas) y 7 (Mileto), pendientes (2Ti 4:13, 20; Perspicacia «Troas», «Mileto»). La nota de Hch
    28:30 no ordena las visitas: Nicópolis (5) pasa a orden incierto y llega a 65. Roma es la 8, sin Trófimo.'
  source: 2-timoteo-4
- date: '2026-10-13'
  change: Trófimo vuelve a companions solo en la parada 7, Mileto, donde enfermó (2Ti 4:20; Perspicacia «Trófimo»).
  source: 2-timoteo-4
- date: '2026-10-13'
  change: El resumen nombra Troas y Mileto, las paradas nuevas de 2Ti 4:13, 20.
  source: 2-timoteo-4
