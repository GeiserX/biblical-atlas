summary: Al saber que Nahás el ammonita amenaza Jabés, Saúl convoca a Israel desde Guibeá, cuenta a sus tropas en Bézec, derrota
  de madrugada a los ammonitas y va a Guilgal, donde el pueblo confirma su reinado.
reason: 1 Samuel 11 da las paradas en orden. Perspicacia «Saúl», «Sus primeras victorias», pone el ataque de Nahás un mes
  después de la elección; el estudio 3 fecha la unción en 1117.
