summary: Nehemías, que sirve el vino al rey Artajerjes, pide permiso para reconstruir Jerusalén. Sale de Susa con cartas para
  los gobernadores del oeste del Éufrates y una escolta, y a los tres días de llegar revisa la muralla.
reason: Ne 2:1 pone la petición en nisán del año 20 de Artajerjes (suceso nehemias-pide-permiso-a-artajerjes). El estudio
  3 fecha en 455 a.e.c. la obra de la muralla, que empieza el 4 de ab (suceso reparacion-de-la-muralla-por-tramos-455).
