summary: Al saber que Lot está cautivo, Abrán sale de Mamré con 318 hombres de su casa y sus aliados, sorprende a los reyes
  en Dan, los persigue hasta Hobá y, al volver, Melquisedec lo bendice.
reason: 'Gé 14:13-17 da la salida, la persecución y la vuelta en orden, y Gé 14:24 nombra a Aner, Escol y Mamré entre los
  que fueron con él. Sin año propio: dentro de los diez primeros años en Canaán.'
