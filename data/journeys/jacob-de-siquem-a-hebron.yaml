summary: Dios manda a Jacob subir a Betel. Entierra los ídolos cerca de Siquem, levanta el altar de El-Betel y, camino del
  sur, Raquel muere al nacer Benjamín cerca de Belén. Acampa tras la torre de Éder y llega a Mamré.
reason: 'Gé 35:1-27 da las etapas en orden, entre la vuelta a Canaán y la venta de José (1750 a.e.c.). Raquel y Débora mueren
  por el camino y Benjamín nace en él: van en las notas.'
