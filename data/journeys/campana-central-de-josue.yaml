summary: Israel sale de Sitim, cruza el Jordán en seco y acampa en Guilgal. Desde allí toma Jericó y, tras la derrota causada
  por Acán, Hai. Josué lee la Ley entre el Ebal y el Guerizim.
reason: Josué 3 a 9 da las etapas en orden. El estudio 3 fecha en 1473 a.e.c. la entrada en Canaán, y Jos 4:19 pone el cruce
  el día 10 del primer mes.
