summary: Ocozías pelea con Jehoram en Ramot-Galaad y baja a Jezreel a verlo herido. Cuando llega Jehú, huye y se esconde en
  Samaria; lo hieren camino de Gur, muere en Meguidó y lo entierran en Jerusalén.
reason: Paradas de 2Re 8:28-9:28 y 2Cr 22:5-9 en el orden que da Perspicacia «Ocozías», núm. 2, al combinar los dos relatos.
  Fechas de los sucesos de Ramot-Galaad (906-905) y de su muerte (c. 905).
