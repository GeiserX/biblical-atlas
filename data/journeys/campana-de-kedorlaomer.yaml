summary: Tras la rebelión de las ciudades del distrito, Kedorlaomer y otros tres reyes arrasan pueblos al este del Jordán
  y en el sur, vencen en Sidim y se llevan a Lot, hasta que Abrán los ataca en Dan.
reason: Gé 14:5-15 da las etapas en orden. Todos sus sucesos van en los diez primeros años de Abrán en Canaán (estudio 3),
  sin año propio.
