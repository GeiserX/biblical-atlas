summary: Israel trae a Samaria 200.000 cautivos de Judá. Tras oír al profeta Oded, Azarías y otros tres jefes de Efraín rechazan
  quedárselos; los visten, les dan de comer, suben a los débiles en burros y los llevan a Jericó.
reason: '2Cr 28:5-15; Perspicacia «Azarías», núm. 15, lo pone entre los que liberaron a los cautivos. Fecha: c. 760 a.e.c.,
  de Perspicacia «Zicrí», núm. 10, y «Jehohanán», núm. 4.'
