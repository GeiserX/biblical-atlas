summary: Siquem se rebela con Gaal. Abimélec, avisado por Zebul, lo vence, arrasa la ciudad, quema a los refugiados de la
  torre con ramas del Zalmón y muere en Tebez herido por una mujer.
reason: 'Jueces 9:22-55 da las paradas en orden. Sin año en jw.org: tras los tres años de su gobierno (Jue 9:22) y antes de
  Jefté, c. 1173 (Perspicacia «Jefté»; estudio 3 para el comienzo del libro).'
