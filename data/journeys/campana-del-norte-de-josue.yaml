summary: Jabín de Hazor reúne a los reyes del norte junto a las aguas de Merom. Josué los sorprende, los persigue hasta Sidón,
  Misrefot-Maim y el valle de Mizpé, y a la vuelta toma y quema Hazor.
reason: 'Jos 11:1-15 da las etapas. Sin año propio: va tras la campaña del sur y antes del fin de la conquista general, que
  el estudio 3 pone en 1467 a.e.c.'
