summary: Por orden de David, Joab y los jefes del ejército cruzan el Jordán, empiezan en Aroer, suben por Gad y Galaad hasta
  Dan-Jaán, giran hacia Sidón y Tiro, bajan a Beer-Seba y vuelven a Jerusalén.
reason: '2Sa 24:2-9 y 1Cr 21:2-5 dan la ruta. Perspicacia «Aroer», núm. 1: al parecer el censo empezó allí; «Inscripción»:
  a finales del reinado. Sin año: entre 1070 y c. 1040 a.e.c. (estudio 3).'
