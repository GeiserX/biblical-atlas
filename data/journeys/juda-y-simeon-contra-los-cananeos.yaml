summary: Judá sube primero, con Simeón. Vencen a Adoni-Bézec en Bézec y lo llevan a Jerusalén. Después destruyen Zefat, que
  pasa a llamarse Hormá, y Judá toma Gaza, Asquelón y Ecrón.
reason: Jueces 1 da el orden; Perspicacia «Adoni-bézeq» pone Bézec tras morir Josué. Deducimos que Hebrón y Debir (Jue
  1:9-15) quedan fuera, porque van en el viaje de Caleb, cuyos sucesos (Jos 15:13-19) caen antes, entre 1467 y 1450.
