id: abrahan-en-egipto
name: Abrán baja a Egipto por el hambre
person: abrahan
reference: Gé 12:10–13:18
date:
  from: -1942
  to: -1932
  precision: range
  approx: true
  type: narrative
  chronology: tnm
  text: 'entre 1943 y 1933 a.e.c. (tiempo narrativo: en los primeros diez años de Abrán en Canaán)'
companions:
- sara
- lot
summary: El hambre empuja a Abrán a Egipto, donde el faraón se lleva a Sarái y luego la devuelve. Abrán sube al Négueb, vuelve
  a su altar entre Betel y Hai y, tras separarse de Lot, se asienta en Mamré.
reason: Gé 12:10 a 13:18 cuenta la bajada, la vuelta y el traslado a Mamré sin pausa de años. Todos sus sucesos van dentro
  de los diez primeros años en Canaán (Gé 16:3; estudio 3).
