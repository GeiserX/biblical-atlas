summary: Dispersado tras la muerte de Esteban, Felipe predica en la ciudad de Samaria. Un ángel lo manda al camino de Jerusalén
  a Gaza, donde bautiza a un funcionario etíope; después predica desde Asdod hasta Cesarea.
