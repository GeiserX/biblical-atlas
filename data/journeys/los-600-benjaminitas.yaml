summary: Vencidos junto a Guibeá, 600 benjaminitas huyen al peñasco de Rimón y pasan allí cuatro meses. Ofrecida la paz, bajan,
  reciben mujeres de Jabés-Galaad y en Siló toman las que faltan; vuelven a reconstruir sus ciudades.
reason: Jueces 20 y 21 dan las paradas. Perspicacia «Rimón», núm. 4, y «Siló», núm. 2, cuentan la huida y las esposas. Fecha
  de sus sucesos (estudio 3; «Jueces, Libro de», «Orden del libro»).
