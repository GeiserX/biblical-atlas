id: vuelta-de-moises-a-egipto
name: Moisés vuelve de Madián a Egipto
person: moises
reference: Éx 3:1–4:31; Hch 7:30-35
date:
  from: -1513
  to: -1512
  precision: range
  approx: true
  type: anchored
  chronology: tnm
  text: c. 1514-1513 a.e.c. (de la zarza a la vuelta, antes del éxodo)
companions: []
summary: Pastoreando el rebaño de Jetró junto a Horeb, Moisés oye a Jehová en la zarza. Vuelve a despedirse de Jetró, sale
  hacia Egipto con su familia y, en la montaña de Dios, Aarón le sale al encuentro.
reason: Éx 3:1 a 4:31 da las etapas en orden. El estudio 3 pone la zarza hacia 1514 a.e.c.; lo demás va después y antes del
  éxodo de 1513, sin año propio.
