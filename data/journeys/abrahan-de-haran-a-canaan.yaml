summary: A los 75 años, muerto ya Taré, Abrán deja Harán con Sarái, Lot y sus siervos. En Siquem Jehová le promete el país;
  después acampa entre Betel y Hai y va bajando hacia el Négueb.
reason: Gé 12:4-9 da las etapas en orden. Perspicacia «Pacto» pone en 1943 a.e.c. el cruce del Éufrates, y el estudio 3 cuenta
  desde ahí; Betel y el Négueb no tienen año propio.
