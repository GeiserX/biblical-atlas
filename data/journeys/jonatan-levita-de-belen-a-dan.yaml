summary: Un joven levita deja Belén para buscar dónde vivir y se hace sacerdote de Miqueas en Efraín. Los danitas se lo llevan
  con los ídolos a Lais, que pasan a llamar Dan. Jue 18:30 lo llama Jonatán.
reason: Jueces 17 y 18 dan las paradas. Perspicacia «Jueces, Libro de», «Orden del libro», sitúa la toma de Lais antes de
  la muerte de Josué; la conquista general acabó en 1467 (estudio 3).
