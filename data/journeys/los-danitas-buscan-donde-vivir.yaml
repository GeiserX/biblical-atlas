reason: Jueces 18 da las paradas en orden. Perspicacia «Jueces, Libro de», «Orden del libro», sitúa la toma de Lais antes
  de morir Josué; la conquista general acabó en 1467 (estudio 3). Ningún danita tiene nombre.
