summary: Dos años después de lo de Tamar, Absalón invita a los hijos del rey al esquileo de Baal-Hazor y hace matar a Amnón.
  Luego huye a Guesur, con su abuelo Talmái, y se queda allí tres años.
reason: '2Sa 13:23-38. Perspicacia «Absalón», párr. 6, sitúa Baal-Hazor al nornordeste de Jerusalén, a unos 22 km, y Guesur
  al este del mar de Galilea. Sin año: entre 1070 (lámina B7) y c. 1040 a.e.c.'
