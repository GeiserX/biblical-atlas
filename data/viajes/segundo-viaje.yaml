  desde: 49
  hasta: 52
  precision: rango
  aprox: true
  tipo: anclada
  cronologia: tnm
  texto: c. 49-52 e.c. (sale a finales del verano de 49; vuelve en el verano de 52)
companeros:
- silas
- timoteo
