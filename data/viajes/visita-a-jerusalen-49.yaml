id: visita-a-jerusalen-49
nombre: Visita a Jerusalén por la cuestión de la circuncisión
persona: pablo
referencia: Hch 15:1-35; Gál 2:1-10
fecha:
  desde: 49
  hasta: 49
  precision: año
  aprox: true
  tipo: anclada
