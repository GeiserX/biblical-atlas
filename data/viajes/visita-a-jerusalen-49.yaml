resumen: Pablo y Bernabé suben de Antioquía a Jerusalén para consultar sobre la circuncisión de los creyentes gentiles.
  No es uno de los tres viajes misionales, pero une el primero y el segundo.
razon: El estudio 3 (párr. 22 y 23) identifica esta visita con la de Gálatas 2:1-10 y la fecha en 49, entre la primera
  y la segunda gira.
