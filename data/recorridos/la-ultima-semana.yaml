# biblical-earth: un fichero por recorrido. Esquema en docs/investigacion/README.md.
id: la-ultima-semana
titulo: La última semana de Jesús
paradas:
- sel: evento:llegada-a-betania-8-de-nisan
  t: 33.22764
  pasajes:
  - Jn 11:55-12:1
  texto: Al ponerse el sol empieza el 8 de nisán, un sábado. Jesús llega a Betania, a casa de sus amigos, seis días
    antes de la Pascua.
- sel: evento:maria-unge-a-jesus
  t: 33.23051
  pasajes:
  - Jn 12:2-11
  - Mt 26:6-13
  texto: Terminado el sábado, cena en casa de Simón el leproso. María derrama sobre él un nardo carísimo y Judas
    se queja del gasto.
  pregunta:
    texto: ¿En casa de quién fue la cena en la que María ungió a Jesús?
    opciones:
    - Lázaro
    - Simón el leproso
    - Zaqueo
    respuesta: Simón el leproso
    explicacion: Según Mt 26:6 y Mr 14:3, la cena fue en Betania, en la casa de Simón, llamado el leproso.
- sel: evento:entrada-triunfal-en-jerusalen
  t: 33.23215
  pasajes:
  - Lu 19:29-44
  - Mt 21:1-11
  texto: De día, desde Betfagué, baja el monte de los Olivos montado en un burro. La gente lo aclama como rey y
    él llora al ver la ciudad.
  no_sabemos: 'Dónde estaba exactamente Betfagué: la tradición dice et-Tur; otros, Abu Dis.'
- sel: evento:higuera-maldita-y-limpieza-del-templo
  t: 33.23434
  pasajes:
  - Mr 11:12-19
  texto: Duerme en Betania y vuelve temprano. Maldice una higuera sin fruto y echa del templo a los que compran
    y venden.
- sel: evento:senal-de-su-presencia
  t: 33.23708
  pasajes:
  - Mt 21:23-25:46
  texto: 'Último día de enseñanza en el templo: preguntas trampa, parábolas y la ofrenda de la viuda. Por la tarde,
    sentado en el monte de los Olivos, explica la señal de su presencia.'
- sel: evento:judas-acuerda-la-traicion
  t: 33.23982
  pasajes:
  - Mt 26:14-16
  texto: Jesús pasa el día con sus discípulos. Judas va a los sacerdotes principales y acuerda entregarlo.
  pregunta:
    texto: ¿Cuánto le pagaron a Judas por entregar a Jesús?
    opciones:
    - 30 piezas de plata
    - 300 denarios
    - Un talento
    respuesta: 30 piezas de plata
    explicacion: Mt 26:15. Según Éx 21:32, era el precio de un esclavo.
- sel: evento:preparativos-de-la-pascua
  t: 33.24256
  pasajes:
  - Lu 22:7-13
  texto: Pedro y Juan preparan la Pascua en una habitación de arriba de Jerusalén. Al caer la tarde llega Jesús
    con los demás.
- sel: evento:cena-del-senor
  t: 33.2442
  pasajes:
  - Lu 22:14-20
  - Jn 13:21-30
  texto: Empieza el 14 de nisán. Tras la Pascua, Jesús despide a Judas y establece con pan y vino la Cena del Señor.
  pregunta:
    texto: ¿Estaba Judas cuando Jesús estableció la Cena del Señor?
    opciones:
    - Sí
    - 'No'
    respuesta: 'No'
    explicacion: Comparando Mt 26:20-29 con Jn 13:21-30 se ve que salió antes, según Perspicacia «Judas».
- sel: evento:arresto-en-getsemani
  t: 33.24461
  pasajes:
  - Jn 18:1-12
  texto: Cruza el Cedrón y ora en Getsemaní. Judas llega con gente armada, lo identifica con un beso y lo arrestan.
  no_sabemos: 'El lugar exacto del jardín: los árboles se talaron en 70 e.c. y solo queda la tradición.'
- sel: evento:juicio-ante-el-sanedrin
  t: 33.24488
  pasajes:
  - Mt 26:57-75
  texto: De noche lo interroga Anás y lo juzga el Sanedrín en casa de Caifás. En el patio, Pedro niega tres veces
    conocerlo.
  no_sabemos: 'Dónde estaba la casa de Caifás: B12-B la marca con interrogación.'
- sel: evento:ante-pilato-y-herodes
  t: 33.24543
  pasajes:
  - Lu 23:1-25
  texto: Al amanecer lo llevan a Pilato, que lo envía a Herodes Antipas y lo recibe de vuelta. La multitud pide
    a Barrabás.
- sel: evento:muerte-de-jesus
  t: 33.24625
  pasajes:
  - Mr 15:22-41
  texto: En el Gólgota, fuera de la ciudad, lo clavan en un madero. Tras tres horas de oscuridad, muere hacia las
    tres de la tarde.
  no_sabemos: 'Dónde estaba el Gólgota: solo que estaba fuera de las murallas.'
  pregunta:
    texto: ¿Hacia qué hora murió Jesús?
    opciones:
    - Las 9 de la mañana
    - El mediodía
    - Las 3 de la tarde
    respuesta: Las 3 de la tarde
    explicacion: La hora novena de Mr 15:34 equivale a cerca de las 3 de la tarde, según la nota de estudio.
- sel: evento:entierro-de-jesus
  t: 33.24653
  pasajes:
  - Jn 19:38-42
  texto: Antes de que empiece el sábado, José de Arimatea y Nicodemo ponen el cuerpo en una tumba nueva de un jardín
    cercano.
- sel: evento:guardia-en-la-tumba
  t: 33.24803
  pasajes:
  - Mt 27:62-66
  texto: 15 de nisán, sábado grande. Los sacerdotes consiguen de Pilato una guardia, y sellan la tumba.
- sel: evento:resurreccion-de-jesus
  t: 33.25091
  pasajes:
  - Mt 28:1-10
  - Jn 20:1-18
  texto: Al amanecer del 16 de nisán, las mujeres encuentran la tumba vacía. Jesús ha sido resucitado y ese día
    se aparece cinco veces.
- sel: evento:camino-de-emaus
  t: 33.25187
  pasajes:
  - Lu 24:13-35
  texto: Por la tarde camina con Cleopas y otro discípulo hacia Emaús, a unos 11 km. Lo reconocen al partir el pan.
  no_sabemos: 'Dónde estaba Emaús: se han propuesto una docena de lugares.'
- sel: evento:ascension-de-jesus
  t: 33.35626
  pasajes:
  - Hch 1:3-12
  - Lu 24:50-53
  texto: Cuarenta días después, desde el monte de los Olivos, junto a Betania, Jesús sube al cielo ante los apóstoles.
- sel: evento:pentecostes-33
  t: 33.38509
  pasajes:
  - Hch 2:1-4
  texto: Diez días más tarde, el 6 de siván, los discípulos reunidos en Jerusalén reciben espíritu santo.
fuentes:
- tnm-b12-a
- tnm-b12-b
- tnm-a7-g
- tnm-a7-h
- si-3
razon: Las láminas B12-A y B12-B dan cada día del 8 al 16 de nisán; A7-G y A7-H, los lugares; el estudio 3, la ascensión
  y Pentecostés.
consultado: '2026-09-28'
estado: verificado
