# biblical-earth: un fichero por recorrido. Esquema en docs/investigacion/README.md.
id: cartas-y-ciudades
titulo: Las cartas de Pablo y las ciudades que las recibieron
paradas:
- sel: carta:1-tesalonicenses
  t: 50.8
  texto: Otoño de 50. Desde Corinto, Pablo escribe con Silas y Timoteo a la congregación de Tesalónica, de la que
    había tenido que salir de noche. Es su primera carta de la Biblia.
  pasajes:
  - 1Te 1:1
  - Hch 17:1-10
  pregunta:
    texto: ¿Desde qué ciudad escribió Pablo su primera carta a los tesalonicenses?
    opciones:
    - Atenas
    - Corinto
    - Éfeso
    respuesta: Corinto
    explicacion: La Tabla de los libros y el estudio 3 la sitúan en Corinto, hacia el año 50.
- sel: carta:2-tesalonicenses
  t: 51.3
  texto: 'Hacia 51, todavía en Corinto, les escribe otra vez: algunos creían que el día de Jehová ya estaba encima.'
  pasajes:
  - 2Te 1:1
  - 2Te 2:1, 2
- sel: carta:galatas
  t: 51.5
  texto: Entre 50 y 52 escribe a las congregaciones de Galacia, las que fundó con Bernabé, contra quienes exigían
    la circuncisión.
  pasajes:
  - Gál 1:1, 2
  - Gál 2:1-10
  no_sabemos: 'Si la escribió desde Corinto o desde Antioquía de Siria: Perspicacia admite las dos.'
- sel: carta:1-corintios
  t: 55.3
  texto: En 55, en Éfeso, Pablo recibe noticias de divisiones en Corinto y escribe su primera carta. Estéfanas y
    otros dos hermanos habían venido a verlo.
  pasajes:
  - 1Co 1:10-12
  - 1Co 16:8, 17
- sel: carta:2-corintios
  t: 55.7
  texto: Final del verano de 55, en Macedonia. Tito le trae buenas noticias de Corinto y Pablo escribe su segunda
    carta.
  pasajes:
  - 2Co 2:12, 13
  - 2Co 7:5-7
- sel: carta:romanos
  t: 56.1
  texto: Hacia 56, en Corinto, dicta a Tercio la carta a Roma, una ciudad que todavía no conocía. Recomienda a Febe,
    de Cencreas.
  pasajes:
  - Ro 16:1, 2
  - Ro 16:22
  pregunta:
    texto: ¿Quién escribió materialmente la carta a los Romanos?
    opciones:
    - Tercio
    - Timoteo
    - Lucas
    respuesta: Tercio
    explicacion: 'Ro 16:22: Tercio, que escribió la carta, añade su propio saludo.'
- sel: lugar:roma
  t: 59.2
  texto: Hacia 59 Pablo llega preso a Roma. Durante dos años, en una casa alquilada, recibe visitas y escribe varias
    cartas.
  pasajes:
  - Hch 28:16, 30, 31
- sel: carta:efesios
  t: 60.5
  texto: Desde Roma escribe a Éfeso, donde había trabajado tres años. Tíquico lleva la carta.
  pasajes:
  - Ef 6:21, 22
- sel: carta:colosenses
  t: 60.6
  texto: A Colosas, una ciudad que no había visitado, le escribe por las noticias de Epafras. Tíquico y Onésimo
    la llevan.
  pasajes:
  - Col 1:7, 8
  - Col 4:7-9
- sel: carta:filemon
  t: 60.7
  texto: 'Con Onésimo va también una carta para su amo Filemón, en Colosas: Pablo le pide que lo reciba como a un
    hermano.'
  pasajes:
  - Flm 10-17
  pregunta:
    texto: ¿Quién llevó la carta a Filemón?
    opciones:
    - Onésimo
    - Epafras
    - Tito
    respuesta: Onésimo
    explicacion: 'Perspicacia «Onésimo»: Pablo le dio la carta para Filemón al enviarlo de vuelta.'
- sel: carta:filipenses
  t: 60.8
  texto: Los filipenses le mandan un regalo con Epafrodito, que enferma en Roma. Ya curado, vuelve a Filipos con
    la carta.
  pasajes:
  - Flp 2:25-30
  - Flp 4:18
- sel: carta:hebreos
  t: 61.0
  texto: Hacia 61, desde Italia, al parecer Roma, escribe a los cristianos hebreos de Judea.
  pasajes:
  - Heb 13:23, 24
  no_sabemos: La carta no lleva el nombre del escritor; Perspicacia la atribuye a Pablo por su contenido.
- sel: carta:1-timoteo
  t: 62.5
  texto: Ya libre, Pablo deja a Tito en Creta y a Timoteo en Éfeso. Entre 61 y 64, al parecer desde Macedonia, escribe
    a los dos.
  pasajes:
  - 1Ti 1:3
  - Tit 1:5
  no_sabemos: 'El orden de sus viajes en estos años: Hechos ya no los cuenta.'
- sel: carta:2-timoteo
  t: 65.0
  texto: Hacia 65, preso otra vez en Roma, escribe su última carta. Solo Lucas está con él y siente cerca su muerte.
  pasajes:
  - 2Ti 4:6-11
