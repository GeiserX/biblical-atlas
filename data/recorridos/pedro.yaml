razon: Recorrido nuestro por los sucesos de Pedro. Fechas del estudio 3 y de Perspicacia «Pedro»; las llaves, del
  recuadro del capítulo 7 de «Testimonio completo»; las cartas, de la Tabla de los libros.
historial:
- fecha: '2026-09-29'
  cambio: La parada de la curación del cojo decía que no se sabía el año; Perspicacia «Herodes», núm. 2, lo pone en 33.
  fuente: it-herodes
consultado: '2026-09-29'
estado: verificado
