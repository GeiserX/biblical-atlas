# biblical-earth: un fichero por recorrido. Esquema en docs/investigacion/README.md.
id: pedro
titulo: Pedro, de las redes de Galilea a Babilonia
paradas:
- sel: pasaje:jn-1
  t: 29.8
  texto: Otoño de 29. Andrés, discípulo de Juan el Bautista, lleva a su hermano Simón ante Jesús, que le da el nombre de Cefas,
    es decir, Pedro.
  pasajes:
  - Jn 1:35-42
  no_sabemos: 'El sitio exacto: el estudio 3 habla del valle del alto Jordán y Jn 1:28 nombra una Betania al otro lado del
    Jordán de ubicación incierta.'
- sel: lugar:mar-de-galilea
  t: 30.3
  texto: En 30, junto al mar de Galilea, Pedro, Andrés, Santiago y Juan dejan su negocio de pesca para ser pescadores de hombres.
  pasajes:
  - Mt 4:18-22
  - Lu 5:1-11
  pregunta:
    texto: ¿Con quién tenía Pedro su negocio de pesca?
    opciones:
    - Solo con Andrés
    - Con Andrés y los hijos de Zebedeo
    - Con Mateo
    respuesta: Con Andrés y los hijos de Zebedeo
    explicacion: Lu 5:10 llama a Santiago y Juan socios de Simón; Perspicacia lo describe como un negocio grande.
- sel: lugar:capernaum
  t: 30.4
  texto: En Capernaúm, en la casa que Pedro compartía con Andrés, Jesús cura a la suegra de Pedro. Pedro estaba casado.
  pasajes:
  - Mr 1:29-31
- sel: pasaje:mt-16
  t: 32.4
  texto: En 32, cerca de Cesarea de Filipo, Pedro declara que Jesús es el Cristo, el Hijo del Dios vivo.
  pasajes:
  - Mt 16:13-19
- sel: pasaje:mt-26
  t: 33.2449
  texto: Ya de noche, el 14 de nisán de 33, en el patio del sumo sacerdote, Pedro niega tres veces conocer a Jesús y después
    llora amargamente.
  pasajes:
  - Mt 26:69-75
  - Lu 22:54-62
- sel: evento:pentecostes-33
  t: 33.385
  texto: 'El 6 de siván de 33 Pedro habla a la multitud en Jerusalén. Es la primera de las llaves del Reino: se abre el camino
    a judíos y prosélitos.'
  pasajes:
  - Hch 2:14-41
  pregunta:
    texto: ¿Cuántas personas se bautizaron aquel día?
    opciones:
    - Unas 120
    - Unas 3.000
    - Unas 5.000
    respuesta: Unas 3.000
    explicacion: Hch 2:41. Los 120 eran los discípulos reunidos antes; los 5.000 hombres se cuentan más tarde, en Hch 4:4.
- sel: evento:curacion-del-cojo-en-la-puerta-hermosa
  t: 33.6
  texto: Con Juan, cura a un cojo de nacimiento a la puerta del templo. Luego los dos declaran ante el Sanedrín que no pueden
    callar lo que han visto.
  pasajes:
  - Hch 3:1-10
  - Hch 4:18-20
  no_sabemos: 'El día: Perspicacia «Herodes», núm. 2, lo pone en 33, poco después de Pentecostés, y no da fecha más precisa.'
- sel: evento:pedro-y-juan-en-samaria
  t: 34.5
  texto: 'Pedro y Juan van a Samaria. Los bautizados por Felipe reciben espíritu santo: la segunda llave. Pedro reprende a
    Simón el mago.'
  pasajes:
  - Hch 8:14-25
  no_sabemos: 'El año: poco después de la muerte de Esteban, sin fecha en las fuentes.'
- sel: evento:pedro-resucita-a-dorcas
  t: 36.4
  texto: En 36 cura a Eneas en Lida y resucita a Dorcas en Jope, la primera resurrección hecha por un apóstol. Se aloja con
    Simón el curtidor.
  pasajes:
  - Hch 9:32-43
- sel: evento:pedro-predica-a-cornelio
  t: 36.8
  texto: 'Otoño de 36. Tras una visión en Jope, Pedro va a Cesarea y predica a Cornelio. El espíritu cae sobre gentiles incircuncisos:
    la tercera llave.'
  pasajes:
  - Hch 10:1-48
  pregunta:
    texto: ¿Qué tenía de nuevo lo que pasó en casa de Cornelio?
    opciones:
    - Eran los primeros samaritanos
    - Eran los primeros gentiles incircuncisos
    - Era el primer bautismo en Cesarea
    respuesta: Eran los primeros gentiles incircuncisos
    explicacion: 'Perspicacia «Cornelio»: no era prosélito; por eso los seis hermanos de Jope se asombraron.'
- sel: evento:pablo-visita-a-cefas
  t: 36.9
  texto: Quizás en 36, Pablo sube a Jerusalén para visitar a Cefas y pasa quince días con él.
  pasajes:
  - Gál 1:18, 19
- sel: evento:pedro-liberado-de-la-carcel
  t: 44.25
  texto: Pascua de 44. Herodes Agripa I ha matado a Santiago y encierra a Pedro. Un ángel lo saca; Pedro avisa en casa de
    María y se va a otro lugar.
  pasajes:
  - Hch 12:1-17
  no_sabemos: 'Adónde fue después: Hch 12:17 no lo dice.'
- sel: evento:concilio-de-jerusalen-49
  t: 49.5
  texto: Hacia 49, en la reunión de apóstoles y ancianos, Pedro cuenta cómo Dios aceptó a los gentiles. Habla como testigo,
    no como juez.
  pasajes:
  - Hch 15:6-11
- sel: evento:pablo-corrige-a-pedro-en-antioquia
  t: 50
  texto: En Antioquía, Pedro deja de comer con los cristianos gentiles por miedo a los que venían de Jerusalén, y Pablo lo
    corrige delante de todos.
  pasajes:
  - Gál 2:11-14
  no_sabemos: 'El año: después de la reunión de c. 49, sin fecha exacta.'
- sel: carta:1-pedro
  t: 63
  texto: Hacia 62-64 Pedro está en Babilonia, donde vivían muchos judíos. Con Silvano como amanuense y Marcos a su lado, escribe
    a los cristianos de Asia Menor.
  pasajes:
  - 1Pe 1:1
  - 1Pe 5:12, 13
- sel: carta:2-pedro
  t: 64
  texto: Hacia 64 escribe su segunda carta, sabiendo que pronto moriría, como Jesús le había anunciado.
  pasajes:
  - 2Pe 1:14
  - Jn 21:18, 19
  no_sabemos: Dónde y cuándo murió. Tampoco hay base para decir que estuvo en Roma.
fuentes:
- it-pedro
