# La explicación del calendario para la página «El calendario»: hechos cortos, cada uno con su fuente.
explicacion:
- id: mes-lunar
  titulo: El mes lunar
  texto: 'Cada mes empezaba con la luna nueva y duraba 29 o 30 días (Isa 66:23). La palabra hebrea para «mes» viene de la idea de «nuevo». En la Biblia, un mes suele contar 30 días.'
  fuentes: [it-calendario]
  razon: 'Perspicacia «Calendario», párr. 5 de la introducción y párr. 2 y 5 del apartado «Calendario hebreo».'
  consultado: '2026-09-28'
  estado: verificado
- id: mes-anadido
  titulo: El mes que se añadía
  texto: 'Doce meses lunares suman unos 11 días menos que el año del sol. Para que las fiestas no se alejaran de sus cosechas, algunos años llevaban un mes decimotercero, que tras el exilio se llamó Veadar.'
  fuentes: [it-calendario, it-nisan]
  razon: 'Perspicacia «Calendario», párr. 6 de la introducción y párr. 1 y 3 del apartado «Calendario hebreo»; «Nisán», párr. 3.'
  consultado: '2026-09-28'
  estado: verificado
- id: ciclo-de-19-anos
  titulo: Cuándo se añadía
  texto: 'La Biblia no dice cómo decidían qué año llevaba el mes de más; quizá miraban los equinoccios. El primer calendario judío fijo que se conoce, con siete meses añadidos cada 19 años, es de hacia 359 e.c.'
  fuentes: [it-calendario, tnm-b15, it-anio]
  razon: 'Perspicacia «Calendario», apartado «Calendario hebreo», párr. 3 y 4; B15, columna de Veadar; «Año», párr. 5 y 6.'
  consultado: '2026-09-28'
  estado: verificado
- id: anio-sagrado
  titulo: El año sagrado
  texto: 'En el éxodo, Jehová mandó que el año empezara en primavera, con el mes de Abib, luego llamado Nisán (Éx 12:2; 13:4). Por ese año se contaban las fiestas: la Pascua caía el 14 de Nisán.'
  fuentes: [it-anio, it-calendario, it-nisan]
  razon: 'Perspicacia «Año», párr. 8 y 10; Perspicacia «Calendario», apartado «Calendario hebreo», párr. 10; «Nisán», párr. 4.'
  consultado: '2026-09-28'
  estado: verificado
- id: anio-civil
  titulo: El año civil o agrícola
  texto: 'El año del campo siguió empezando en otoño, con Etanim, luego Tisri (Éx 23:16). Así, el primer mes de un calendario era el séptimo del otro. La doble cuenta se nota sobre todo después del exilio.'
  fuentes: [it-anio, it-etanim]
  razon: 'Perspicacia «Año», párr. 8 y 9, y «Etanim», párr. 3 y 4.'
  consultado: '2026-09-28'
  estado: verificado
- id: antes-del-exodo
  titulo: Antes del éxodo
  texto: 'Hasta el éxodo el año se contaba de otoño a otoño y empezaba a mediados de nuestro septiembre, al acabar las cosechas. En tiempos de Noé el año tenía 12 meses de 30 días (Gé 7:11, 24).'
  fuentes: [it-anio, it-calendario, it-nisan]
  razon: 'Perspicacia «Año», párr. 3 y 7; Perspicacia «Calendario», párr. 3 de la introducción; «Nisán», párr. 1: Abib era antes el séptimo mes.'
  consultado: '2026-09-28'
  estado: verificado
- id: nombres-por-epoca
  titulo: Los nombres cambian con la época
  texto: 'Antes del exilio la Biblia nombra solo cuatro meses: Abib, Ziv, Etanim y Bul. Los demás los llama por su número. Tras el exilio los judíos tomaron los nombres de Babilonia, como Nisán, Siván o Kislev.'
  fuentes: [it-calendario]
  razon: 'Perspicacia «Calendario», apartado «Calendario hebreo», párr. 6, 7 y 8.'
  consultado: '2026-09-28'
  estado: verificado
- id: dia-hebreo
  titulo: Cuándo empezaba el día
  texto: 'El día hebreo iba de una puesta de sol a la siguiente (Le 23:32), no de medianoche a medianoche como el nuestro. Por eso un día hebreo abarca parte de dos fechas nuestras.'
  fuentes: [it-dia]
  razon: 'Perspicacia «Día», párr. 3 y 4: los romanos contaban de medianoche a medianoche, como hoy.'
  consultado: '2026-09-28'
  estado: verificado
- id: en-tiempos-de-jesus
  titulo: En tiempos de Jesús
  texto: 'Los Evangelios y Hechos mencionan a menudo las fiestas judías, así que ese calendario seguía en uso en el siglo primero. Esas fiestas ayudan a situar en el tiempo lo que cuentan.'
  fuentes: [it-calendario]
  razon: 'Perspicacia «Calendario», apartado «Calendario hebreo», párr. 13.'
  consultado: '2026-09-28'
  estado: verificado
- id: equivalencias
  titulo: Nuestros meses son solo una guía
  texto: 'Un mes hebreo empieza con la luna nueva, así que cae entre dos de nuestros meses: Nisán es «marzo-abril». Las equivalencias son aproximadas y aplican hacia atrás nuestro calendario gregoriano, que entonces no existía.'
  fuentes: [it-calendario, tnm-b15]
  razon: 'Perspicacia «Calendario», apartado «Calendario hebreo», párr. 2 y 12 (correspondencia aproximada); B15, fila de equivalencias; apartado «Calendario juliano y gregoriano», párr. 1 y 2: el juliano es de 46 a.e.c. y el gregoriano, de 1582.'
  consultado: '2026-09-28'
  estado: verificado
- id: calendario-juliano
  titulo: Roma y el calendario juliano
  texto: 'Roma usaba un calendario lunar hasta que Julio César implantó en 46 a.e.c. uno solar de 365 días, con un día más cada cuatro años y comienzo el 1 de enero. Es el calendario juliano.'
  fuentes: [it-calendario]
  razon: 'Perspicacia «Calendario», apartado «Calendario juliano y gregoriano», párr. 1.'
  consultado: '2026-09-28'
  estado: verificado
- id: calendario-gregoriano
  titulo: El calendario gregoriano
  texto: 'El año juliano duraba unos 11 minutos más que el del sol. En 1582 se saltaron diez días para corregirlo: tras el 4 de octubre vino el 15. Es el calendario gregoriano, el que usamos hoy.'
  fuentes: [it-calendario]
  razon: 'Perspicacia «Calendario», apartado «Calendario juliano y gregoriano», párr. 2.'
  consultado: '2026-09-28'
  estado: verificado
- id: egipto
  titulo: Egipto
  texto: 'En el antiguo Egipto el año tenía 12 meses de 30 días, y cada año se sumaban cinco días más para ajustarlo al sol. Egipcios y romanos contaban el día de medianoche a medianoche.'
  fuentes: [it-anio, it-dia]
  razon: 'Perspicacia «Año», párr. 4, y «Día», párr. 4.'
  consultado: '2026-09-28'
  estado: verificado
- id: babilonia
  titulo: Babilonia
  texto: 'Babilonia usaba meses lunares y algunos años añadía un decimotercero. Contaba el día desde la salida del sol y los años de un rey desde el 1 de Nisán; los meses anteriores eran su año de ascenso.'
  fuentes: [it-anio, it-dia]
  razon: 'Perspicacia «Año», párr. 4 y 12, y «Día», párr. 4.'
  consultado: '2026-09-28'
  estado: verificado
