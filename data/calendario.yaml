# biblical-earth: los meses del calendario hebreo, en el orden del año sagrado (de nisán a adar, y veadar,
# el mes que se añadía algunos años). Nombres de la tabla B15 «El calendario hebreo» de la Biblia de estudio
# (wol.jw.org, 1001070237), consultada el 2026-09-28. Esquema en docs/investigacion/README.md.
#
# Los ids son los que usa fecha.detalle.mes («{mes: nisan, dia: 14}»). Es estructura: los hechos de cada mes
# (equivalencia en nuestro calendario, fiestas, estación) los añade el carril «marco» como campos opcionales,
# cada uno con fuentes, razon, consultado y estado.
meses:
- id: nisan
  orden: 1
  nombre: Nisán
  otros_nombres: [Abib]
  equivale: marzo-abril
  fiestas:
  - desde: 14
    hasta: 14
    nombre: Pascua
  - desde: 15
    hasta: 21
    nombre: Fiesta de los Panes Sin Levadura
  - desde: 16
    hasta: 16
    nombre: Ofrenda de las primicias
  clima: Las lluvias y el deshielo hacen crecer el Jordán.
  campo: Cebada.
  fuentes:
  - tnm-b15
  razon: 'Columna de «Nisán» en B15 «El calendario hebreo»: equivalencia, fiestas, clima y cosechas.'
  consultado: '2026-09-28'
  estado: verificado
