    - {v: 1-2, type: prophecy, entities: [event:primer-mensaje-de-ageo, person:ageo, person:zorobabel, person:sealtiel, person:josue-sumo-sacerdote, person:jehozadac, relation:zorobabel/kin/sealtiel, relation:josue-sumo-sacerdote/kin/jehozadac, relation:josue-sumo-sacerdote/accompanies/zorobabel, relation:ageo/lived_in/jerusalen, relation:zorobabel/lived_in/jerusalen, relation:josue-sumo-sacerdote/lived_in/jerusalen, period:gobierno-de-zorobabel, period:sumo-sacerdocio-de-josue], mentions: [place:juda, person:dario-i, period:dario-i, event:obra-del-templo-prohibida-522], note: "Día 1 del sexto mes, año segundo de Darío I. Por Ageo («nacido en una fiesta», según la nota), Jehová se dirige a Zorobabel, gobernador, y a Josué, sumo sacerdote: el pueblo cree que aún no toca reconstruir su casa."}
    - {v: 3-6, type: prophecy, entities: [event:primer-mensaje-de-ageo], mentions: [event:destruccion-de-jerusalen-607], note: "Ellos habitan casas con paneles y el templo sigue arruinado; la referencia del v. 4 remite a su quema en 607. Que reflexionen: siembran mucho, cosechan poco y el jornal se les va como por una bolsa rota."}
    - {v: 7-11, type: prophecy, entities: [event:primer-mensaje-de-ageo], note: "Que suban a la montaña, que el texto no nombra, por madera y construyan la casa. Por atender sus propias casas y descuidar la de Jehová, él les retiene el rocío y manda sequía sobre campos, personas y ganado."}
    - {v: 12-15, type: narration, entities: [event:se-reanuda-la-obra-del-templo-520, person:zorobabel, person:sealtiel, person:josue-sumo-sacerdote, person:jehozadac, person:ageo, relation:zorobabel/kin/sealtiel, relation:josue-sumo-sacerdote/kin/jehozadac, relation:josue-sumo-sacerdote/accompanies/zorobabel, period:gobierno-de-zorobabel], mentions: [place:juda, person:dario-i, period:dario-i, event:obra-del-templo-prohibida-522], note: "Zorobabel, Josué y el resto del pueblo obedecen y temen a Jehová; Ageo, su mensajero, les asegura que él está con ellos. El 24 del sexto mes empiezan a trabajar en el templo, aunque la prohibición persa sigue vigente."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: prophecy, entities: [event:segundo-mensaje-de-ageo, person:ageo, person:zorobabel, person:sealtiel, person:josue-sumo-sacerdote, person:jehozadac, relation:zorobabel/kin/sealtiel, relation:josue-sumo-sacerdote/kin/jehozadac, relation:josue-sumo-sacerdote/accompanies/zorobabel, period:gobierno-de-zorobabel, period:sumo-sacerdocio-de-josue], mentions: [place:juda, event:templo-de-salomon-terminado], note: "Día 21 del séptimo mes. Ageo pregunta a Zorobabel, a Josué y al pueblo quién vio la casa en su gloria anterior. Según Perspicacia, algunos mayores recordaban el templo de Salomón y el nuevo les parecía nada."}
    - {v: 4-5, type: prophecy, entities: [event:segundo-mensaje-de-ageo, person:zorobabel, person:josue-sumo-sacerdote], mentions: [place:egipto, event:exodo, event:pacto-de-la-ley], note: "Jehová pide a Zorobabel, a Josué y a la gente del país que se esfuercen y trabajen, porque él está con ellos. Les recuerda lo que prometió al salir de Egipto; las referencias remiten al pacto del Sinaí."}
    - {v: 6-9, type: prophecy, entities: [event:segundo-mensaje-de-ageo], note: "Pronto Jehová sacudirá cielos, tierra y naciones; lo valioso de ellas entrará en su casa, y su gloria superará a la del templo anterior. Allí dará paz. Heb 12:26, 27 cita el v. 6 y lo aplica al Reino."}
    - {v: 10-14, type: prophecy, entities: [event:tercer-mensaje-de-ageo, person:ageo], mentions: [person:dario-i, period:dario-i], note: "Día 24 del noveno mes. Ageo consulta a los sacerdotes sobre la Ley: la carne santa no santifica lo que toca, pero quien está impuro por un cadáver sí contamina. Así ve Jehová al pueblo y sus ofrendas."}
    - {v: 15-19, type: prophecy, entities: [event:tercer-mensaje-de-ageo], mentions: [event:se-reanuda-la-obra-del-templo-520], note: "Antes de reanudar la obra, el grano y el vino rendían la mitad o menos. Ag 2:18 llama al día 24 el de los cimientos; las referencias remiten a Esd 5:2. Desde ese día, Jehová los bendecirá."}
    - {v: 20-23, type: prophecy, entities: [event:cuarto-mensaje-de-ageo, person:ageo, person:zorobabel, person:sealtiel, relation:zorobabel/kin/sealtiel, period:gobierno-de-zorobabel], mentions: [place:juda], note: "Ese mismo día 24 llega otro mensaje, para Zorobabel, gobernador de Judá: Jehová derribará los tronos de los reinos y sus jinetes caerán unos a manos de otros. A Zorobabel, su elegido, lo hará como un anillo de sellar."}
