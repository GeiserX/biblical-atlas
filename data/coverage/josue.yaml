    - {v: 10-29, type: narration, entities: [event:israel-toma-hai, person:josue-hijo-de-nun, place:hai, place:betel], note: "El rey de Hai no tiene nombre. Mueren 12.000 habitantes; Hai queda en ruinas y el cuerpo del rey, bajo un montón de piedras a la puerta. La llanura desértica de 8:14 no lleva nombre propio."}
    - {v: 30-35, type: narration, entities: [event:josue-lee-la-ley-entre-el-ebal-y-el-guerizim, person:josue-hijo-de-nun, place:monte-ebal, place:monte-guerizim], mentions: [person:moises, event:moises-manda-escribir-la-ley-en-piedras-en-el-ebal, event:moises-anuncia-las-bendiciones-y-las-maldiciones], note: "Cumple lo mandado en Dt 11:29 y 27:1-13. Asisten ancianos, jueces, sacerdotes levitas con el Arca, mujeres, niños y residentes extranjeros."}
