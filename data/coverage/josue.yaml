book: josue
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: narration, entities: [event:jehova-manda-a-josue-cruzar-el-jordan, person:josue-hijo-de-nun, person:moises, relation:josue-hijo-de-nun/succeeds/moises, relation:josue-hijo-de-nun/tie/moises, relation:josue-hijo-de-nun/kin/nun, place:rio-jordan, place:libano, place:rio-eufrates, place:mar-grande], mentions: [person:nun, event:muerte-de-moises, place:sitim, place:llanuras-deserticas-de-moab], note: "Jehová fija la frontera del desierto, sin nombre, al Líbano y al Éufrates, y hasta el mar Grande. «La tierra de los hititas» nombra a un pueblo sin ficha. Repite el ánimo que Moisés dio a Josué."}
    - {v: 10-11, type: narration, entities: [event:josue-ordena-al-pueblo-prepararse-para-cruzar, person:josue-hijo-de-nun], mentions: [place:rio-jordan, place:sitim, place:llanuras-deserticas-de-moab], note: "Los funcionarios no llevan nombre. El plazo de tres días vuelve a salir cuando el pueblo se acerca al río. Sitim y las llanuras de Moab, sin nombre aquí, son el campamento."}
    - {v: 12-18, type: narration, entities: [event:las-tribus-del-este-prometen-cruzar-armadas, event:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, person:josue-hijo-de-nun, person:moises, relation:josue-hijo-de-nun/succeeds/moises], mentions: [place:rio-jordan, place:sitim, place:llanuras-deserticas-de-moab], note: "Rubenitas, gaditas y la media tribu de Manasés son tribus, sin ficha; la tierra al este que Moisés les dio no se nombra aquí. Sus guerreros irán delante hasta que los demás reciban su parte."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: narration, entities: [event:rahab-esconde-a-los-espias, person:josue-hijo-de-nun, person:rahab, place:sitim, place:jerico, relation:josue-hijo-de-nun/kin/nun, relation:josue-hijo-de-nun/lived_in/sitim], mentions: [person:nun, place:rio-jordan], note: "Los dos espías y el rey de Jericó no llevan nombre. Ella los tapa con lino en la azotea y manda a sus perseguidores hacia los vados del Jordán."}
    - {v: 8-14, type: narration, entities: [event:rahab-esconde-a-los-espias, person:rahab, event:israel-cruza-el-mar-rojo, event:israel-vence-a-sehon, event:israel-vence-a-og], mentions: [place:mar-rojo, place:egipto, person:sehon, person:og, place:rio-jordan], note: "Rahab sabe del mar Rojo y de Sehón y Og, reyes amorreos, un pueblo sin ficha. Pide por juramento la vida de sus padres y hermanos, que no llevan nombre."}
    - {v: 15-21, type: narration, entities: [event:rahab-esconde-a-los-espias, person:rahab, place:jerico, relation:rahab/lived_in/jerico], note: "Les aconseja ocultarse tres días en la región montañosa, sin nombre. La señal pactada es un cordón escarlata en su ventana, con toda la familia dentro de la casa."}
    - {v: 22-24, type: narration, entities: [event:los-dos-espias-vuelven-a-josue, person:josue-hijo-de-nun, place:rio-jordan, relation:josue-hijo-de-nun/kin/nun], mentions: [person:nun]}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: narration, entities: [event:israel-sale-de-sitim-y-acampa-junto-al-jordan, person:josue-hijo-de-nun, place:sitim, place:rio-jordan, relation:josue-hijo-de-nun/lived_in/sitim, journey:campana-central-de-josue], note: "Tras tres días junto al río, los funcionarios mandan seguir el Arca, que llevan los sacerdotes levitas, a unos 2.000 codos (890 m, nota del v. 4). Josué pide al pueblo que se santifique."}
    - {v: 7-13, type: narration, entities: [event:israel-sale-de-sitim-y-acampa-junto-al-jordan, person:josue-hijo-de-nun, relation:josue-hijo-de-nun/succeeds/moises, place:rio-jordan], mentions: [person:moises], note: "Jehová promete estar con Josué como estuvo con Moisés. Josué anuncia que Dios echará a cananeos, hititas, heveos, perizitas, guirgaseos, amorreos y jebuseos, pueblos sin ficha, y pide un hombre por tribu."}
    - {v: 14-17, type: narration, entities: [event:entrada-en-canaan, place:rio-jordan, place:adan, place:zaretan, place:mar-salado], mentions: [place:jerico], note: "Era la cosecha y el Jordán iba desbordado. El agua se represa en Adán y la que baja al mar Salado se corta; los sacerdotes quedan en el cauce seco. Sl 66:6 y 114:3 lo recuerdan."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: narration, entities: [event:doce-hombres-sacan-doce-piedras-del-jordan, person:josue-hijo-de-nun, place:rio-jordan, journey:campana-central-de-josue], note: "Las piedras, una por tribu, serán una señal: cuando los hijos pregunten, se les contará que el agua se detuvo ante el Arca. Según el v. 9, las del cauce seguían allí cuando se escribió."}
    - {v: 10-18, type: narration, entities: [event:entrada-en-canaan, person:josue-hijo-de-nun, relation:josue-hijo-de-nun/succeeds/moises, place:rio-jordan, place:llanuras-deserticas-de-jerico], mentions: [person:moises, event:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, event:las-tribus-del-este-prometen-cruzar-armadas], note: "Rubenitas, gaditas y media tribu de Manasés, unos 40.000 armados, cruzan delante como mandó Moisés; las tribus son pueblos. Jehová engrandece a Josué y, cuando salen los sacerdotes, el río vuelve a desbordarse."}
    - {v: 19-24, type: narration, entities: [event:josue-levanta-las-doce-piedras-en-guilgal, event:entrada-en-canaan, person:josue-hijo-de-nun, place:guilgal, relation:josue-hijo-de-nun/lived_in/guilgal, event:israel-cruza-el-mar-rojo], mentions: [place:jerico, place:rio-jordan, place:mar-rojo], note: "El primer mes es nisán desde el éxodo. El v. 23 compara el paso del Jordán con el del mar Rojo, y el v. 24 da el propósito: que todos los pueblos conozcan el poder de Jehová."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, mentions: [place:rio-jordan, place:mar-grande, event:entrada-en-canaan], note: "Los reyes amorreos del oeste del Jordán y los cananeos de la costa se enteran de que Jehová secó el río y pierden el valor. Son pueblos, sin ficha; el mar es el Mar Grande."}
    - {v: 2-9, type: narration, entities: [event:josue-circuncida-a-israel-en-guilgal, person:josue-hijo-de-nun, place:guilgal, event:jehova-condena-a-israel-a-40-anos-en-el-desierto, journey:campana-central-de-josue], mentions: [place:egipto], note: "Los hombres de guerra que salieron de Egipto murieron en el desierto, como juró Jehová; sus hijos no estaban circuncidados. Guilgal recuerda que Jehová quitó de encima la deshonra de Egipto."}
    - {v: 10-12, type: narration, entities: [event:israel-celebra-la-pascua-en-guilgal, event:cesa-el-mana, place:guilgal, place:llanuras-deserticas-de-jerico, relation:josue-hijo-de-nun/lived_in/guilgal], mentions: [place:canaan, event:codornices-y-mana-en-el-desierto-de-sin]}
    - {v: 13-15, type: narration, entities: [event:el-principe-del-ejercito-de-jehova-se-aparece-a-josue, person:josue-hijo-de-nun, place:jerico], mentions: [event:moises-ante-la-zarza-ardiente], note: "El príncipe es un ángel sin nombre; jw.org no lo identifica, así que no lleva ficha. Como a Moisés en la zarza, se le manda descalzarse porque el suelo es santo."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [event:el-principe-del-ejercito-de-jehova-se-aparece-a-josue, person:josue-hijo-de-nun, place:jerico, journey:campana-central-de-josue], note: "Jericó está cerrada. Jehová le entrega la ciudad con su rey, que no se nombra, y da el plan: seis días de una vuelta, siete vueltas el séptimo, cuernos de carnero y un grito."}
    - {v: 6-21, type: narration, entities: [event:caida-de-jerico, person:josue-hijo-de-nun, place:jerico], mentions: [person:rahab, event:rahab-esconde-a-los-espias, person:nun], note: "Solo se perdona a Rahab. Lo reservado para la destrucción no se toca, para no traer el desastre al campamento, como pasará con Acán (Jos 7); el metal es para el tesoro de Jehová."}
    - {v: 22-25, type: narration, entities: [event:los-espias-sacan-a-rahab-de-jerico, event:caida-de-jerico, person:rahab, person:josue-hijo-de-nun, place:jerico, relation:rahab/lived_in/jerico, relation:rahab/lived_in/israel], mentions: [event:rahab-esconde-a-los-espias], note: "Los espías no tienen nombre. La ciudad se quema y el metal va al tesoro de la casa de Jehová, que Perspicacia «Jericó» llama su santuario."}
    - {v: 26-27, type: narration, entities: [event:josue-maldice-al-que-reconstruya-jerico, person:josue-hijo-de-nun, place:jerico], note: "Una nota dice que quizá Josué hizo jurar al pueblo. Se cumple con Hiel de Betel (1Re 16:34), suceso que crea 1 Reyes. Jehová está con Josué y su fama se extiende."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [person:acan-hijo-de-carmi, person:carmi-hijo-de-zabdi, person:zabdi-abuelo-de-acan, relation:acan-hijo-de-carmi/kin/carmi-hijo-de-zabdi, relation:acan-hijo-de-carmi/kin/zabdi-abuelo-de-acan, relation:acan-hijo-de-carmi/kin/zerah-hijo-de-juda, relation:carmi-hijo-de-zabdi/kin/zabdi-abuelo-de-acan, relation:zabdi-abuelo-de-acan/kin/zerah-hijo-de-juda], mentions: [person:zerah-hijo-de-juda], note: "Acán se queda con parte de lo que Jehová había reservado en Jericó (Jos 6:17-19); lo cuenta del todo su confesión en 7:21. La tribu de Judá es pueblo, sin ficha."}
    - {v: 2-5, type: narration, entities: [event:israel-es-derrotado-en-hai, person:josue-hijo-de-nun, place:hai, place:bet-aven, place:sebarim, journey:campana-central-de-josue], mentions: [place:betel, place:jerico]}
    - {v: 6-15, type: narration, entities: [event:josue-ruega-ante-el-arca, person:josue-hijo-de-nun], mentions: [place:rio-jordan], note: "Josué teme que amorreos y cananeos, pueblos sin ficha, acaben con Israel. Jehová manda santificarse y presentarse por tribus; el culpable será quemado con lo suyo."}
    - {v: 16-23, type: narration, entities: [event:descubren-el-pecado-de-acan, person:acan-hijo-de-carmi, person:josue-hijo-de-nun], mentions: [person:zabdi-abuelo-de-acan, person:carmi-hijo-de-zabdi, person:zerah-hijo-de-juda, place:sinar], note: "Robó una prenda de Sinar, 200 siclos de plata y una barra de oro de 50 siclos; según la nota de 7:21, el siclo pesaba 11,4 g. Los zerahítas son una familia, sin ficha."}
    - {v: 24-26, type: narration, entities: [event:muerte-de-acan, person:acan-hijo-de-carmi, person:josue-hijo-de-nun, place:valle-de-acor, relation:acan-hijo-de-carmi/died_in/valle-de-acor], note: "Sus hijos e hijas, sin nombre, mueren con él. El montón de piedras seguía allí cuando se escribió el libro."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    spans:
