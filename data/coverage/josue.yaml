    - {v: "1", type: narration, entities: [event:josue-renueva-el-pacto-en-siquem, person:josue-hijo-de-nun, place:siquem], note: "Josué junta en Siquem a todas las tribus con sus ancianos, jefes, jueces y funcionarios, y se presentan ante el Dios verdadero."}
    - {v: 2-4, type: speech, entities: [event:josue-renueva-el-pacto-en-siquem, person:tare, person:abrahan, person:nacor-hijo-de-tare, person:isaac, person:jacob, person:esau, place:rio-eufrates, place:canaan, place:seir, place:egipto, event:pacto-con-abrahan, event:nacimiento-de-isaac, event:nacimiento-de-esau-y-jacob, event:esau-se-traslada-a-seir, event:jacob-entra-en-egipto, relation:abrahan/kin/tare, relation:nacor-hijo-de-tare/kin/tare, relation:abrahan/lived_in/canaan, relation:isaac/kin/abrahan, relation:jacob/kin/isaac, relation:esau/kin/isaac, relation:esau/kin/jacob, relation:esau/lived_in/seir, relation:jacob/lived_in/egipto, journey:esau-a-seir, journey:jacob-a-egipto], note: "Jehová habla por Josué. «El Río» es el Éufrates: al otro lado vivieron los antepasados, Taré incluido, y servían a otros dioses, sin nombre. Los hijos de Jacob no se nombran."}
    - {v: 5-7, type: speech, entities: [person:moises, person:aaron, relation:aaron/accompanies/moises, place:egipto, place:mar-rojo, event:exodo, event:israel-cruza-el-mar-rojo], mentions: [event:moises-ante-la-zarza-ardiente, event:israel-vaga-por-el-desierto], note: "Envío de Moisés y Aarón y las plagas de Egipto, sin detalle. Jehová pone oscuridad entre Israel y los egipcios, que se ahogan en el mar Rojo. Después, muchos años en el desierto."}
    - {v: 8-10, type: speech, entities: [event:israel-vence-a-sehon, event:israel-vence-a-og, event:balac-manda-llamar-a-balaam, person:balac, person:balaam, relation:balac/kin/zipor, relation:balac/lived_in/moab, relation:balaam/kin/beor-padre-de-balaam, place:rio-jordan, place:moab], mentions: [person:zipor, person:beor-padre-de-balaam, event:balaam-bendice-a-israel-desde-bamot-baal, event:balaam-bendice-a-israel-desde-pisga, event:balaam-bendice-a-israel-desde-peor], note: "Los amorreos del este del Jordán pelean y pierden su tierra; sus reyes no se nombran aquí. Jehová no escucha a Balaam y lo hace bendecir a Israel una y otra vez."}
    - {v: 11-13, type: speech, entities: [event:entrada-en-canaan, event:conquista-de-canaan, place:jerico, place:rio-jordan, event:caida-de-jerico], note: "Cruzan el Jordán y llegan a Jericó; su caída es el suceso de Jos 6. Pelean los de Jericó y siete pueblos, sin ficha. Un desánimo enviado por Jehová los hace huir, como a los dos reyes amorreos."}
    - {v: 14-15, type: speech, entities: [event:josue-renueva-el-pacto-en-siquem, person:josue-hijo-de-nun], mentions: [place:rio-eufrates, place:egipto], note: "Josué pide dejar los dioses que sus antepasados adoraron junto al Éufrates y en Egipto, y elegir hoy entre esos, los de los amorreos o Jehová. Él y su casa servirán a Jehová."}
    - {v: 16-24, type: speech, entities: [event:josue-renueva-el-pacto-en-siquem, person:josue-hijo-de-nun], mentions: [event:exodo, place:egipto], note: "El pueblo recuerda la salida de Egipto y promete servir a Jehová. Josué avisa que Jehová es santo y exige devoción exclusiva; ellos se declaran testigos contra sí mismos y repiten su promesa."}
    - {v: 25-28, type: narration, entities: [event:josue-renueva-el-pacto-en-siquem, person:josue-hijo-de-nun, place:siquem], note: "Pacto, norma y resolución en Siquem. Josué pone esas palabras por escrito en el libro de la Ley y coloca una gran piedra como testigo bajo el gran árbol junto al santuario. Luego despide al pueblo."}
    - {v: 29-31, type: narration, entities: [event:muerte-de-josue, person:josue-hijo-de-nun, place:timnat-serah, place:monte-gaas, place:region-montanosa-de-efrain, relation:josue-hijo-de-nun/kin/nun, relation:josue-hijo-de-nun/lived_in/timnat-serah], mentions: [person:nun], note: "Muere a los 110 años y lo entierran en su herencia, al norte del monte Gaas. Israel sirve a Jehová mientras viven Josué y los ancianos que le sobreviven."}
    - {v: "32", type: narration, entities: [event:entierran-los-huesos-de-jose-en-siquem, event:jacob-compra-un-campo-junto-a-siquem, person:jose-hijo-de-jacob, person:hamor, person:siquem-hijo-de-hamor, relation:siquem-hijo-de-hamor/kin/hamor, place:siquem], mentions: [person:jacob, place:egipto, event:muerte-de-jose, event:israel-acampa-en-ezam], note: "Se cumple lo que José pidió al morir (Gé 50:25) y Moisés cumplió al salir de Egipto (Éx 13:19). La parcela pasa a los descendientes de José, las tribus de Efraín y Manasés."}
    - {v: "33", type: narration, entities: [person:eleazar-hijo-de-aaron, person:finehas-hijo-de-eleazar, period:sumo-sacerdocio-de-eleazar, place:colina-de-finehas, place:region-montanosa-de-efrain, relation:eleazar-hijo-de-aaron/kin/aaron, relation:finehas-hijo-de-eleazar/kin/eleazar-hijo-de-aaron, relation:finehas-hijo-de-eleazar/succeeds/eleazar-hijo-de-aaron], mentions: [person:aaron], note: "Muere Eleazar, sin escena ni lugar de muerte, y lo entierran en la colina que se había dado a Finehás. El texto no dice que Finehás viviera allí."}
