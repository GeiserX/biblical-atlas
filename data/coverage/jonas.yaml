    spans:
    - {v: 1-4, type: narration, entities: [event:jonas-predica-en-ninive, person:jonas-profeta, place:ninive, journey:viaje-de-jonas], note: "Segundo encargo de Jehová, y esta vez Jonás obedece. La nota al pie traduce literalmente «ciudad grande para Dios»: recorrerla a pie llevaba tres días. Tras un día de camino por ella anuncia su ruina en 40 días."}
    - {v: 5-10, type: narration, entities: [event:ninive-se-arrepiente, place:ninive], mentions: [event:senal-de-jonas-en-galilea, event:dedo-de-dios-y-senal-de-jonas], note: "El rey de Nínive y sus nobles no tienen nombre ni ficha; Perspicacia «Asiria» ve posible, sin seguridad, que reinara Adad-nirari III. Las referencias llevan a Mt 12:41 y Lu 11:32, donde Jesús recuerda este arrepentimiento."}
