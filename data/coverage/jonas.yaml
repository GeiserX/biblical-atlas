    - {v: 5-11, type: narration, entities: [event:leccion-de-la-calabaza-vinatera, person:jonas-profeta, place:ninive], note: "La nota del v. 6 da «ricino» como posible planta. Los más de 120.000 que no saben distinguir el bien del mal son, según otra nota, los que no distinguen su mano derecha de la izquierda."}
