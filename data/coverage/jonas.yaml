    spans:
    - {v: 1-3, type: narration, entities: [person:jonas-profeta, person:amitai, relation:jonas-profeta/kin/amitai, event:jonas-huye-hacia-tarsis, place:ninive, place:jope, place:tarsis, journey:viaje-de-jonas], mentions: [event:senal-de-jonas-en-galilea, event:dedo-de-dios-y-senal-de-jonas], note: "La nota da «paloma» como significado de Jonás. Jehová lo manda a anunciar un juicio contra Nínive por su maldad; él baja a Jope y embarca hacia Tarsis. Perspicacia lo identifica con el profeta de 2Re 14:25."}
    - {v: 4-16, type: narration, entities: [event:los-marineros-arrojan-a-jonas-al-mar, person:jonas-profeta], note: "Jehová lanza una tormenta. Los marineros y su capitán, sin nombre, claman a sus dioses y echan suertes, que señalan a Jonás. Él, hebreo, pide que lo arrojen; al hacerlo, el mar se calma."}
    - {v: "17", type: narration, entities: [event:un-gran-pez-se-traga-a-jonas, person:jonas-profeta], mentions: [event:senal-de-jonas-en-galilea, event:senal-de-jonas-en-magadan, event:dedo-de-dios-y-senal-de-jonas], note: "Jehová envía un pez enorme que se traga a Jonás, y pasa dentro tres días con sus noches. Las referencias llevan a la señal de Jonás que Jesús da en Mt 12:39, 40, 16:4 y Lu 11:29, 30."}
  2:
