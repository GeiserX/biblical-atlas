    spans:
    - {v: 1-9, type: poetry, entities: [event:un-gran-pez-se-traga-a-jonas, person:jonas-profeta, journey:viaje-de-jonas], mentions: [event:senal-de-jonas-en-galilea], note: "Desde el vientre del pez, Jonás ora: se hundió en el mar, pero Jehová lo sacó de la Tumba, el Seol según la nota, un lugar simbólico. Promete cumplir sus votos, porque la salvación viene de Jehová."}
    - {v: "10", type: narration, entities: [event:un-gran-pez-se-traga-a-jonas, person:jonas-profeta], note: "Jehová da la orden y el pez deja a Jonás en la orilla. El texto no dice dónde; Perspicacia «Jonás, Libro de» recuerda que el relato omite ese detalle."}
  3:
    status: complete
