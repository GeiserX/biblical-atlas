  24:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: narration, entities: [event:david-manda-censar-a-israel-y-a-juda, person:david, person:joab-hijo-de-zeruya, relation:joab-hijo-de-zeruya/tie/david, journey:censo-de-david], mentions: [place:dan, place:beer-seba, place:israel, place:juda, person:satanas], note: "El texto no dice quién incitó a David. 1Cr 21:1 y Perspicacia «David» dicen que Satanás; «Inscripción» ve también posible un mal consejero. Desde Dan hasta Beer-Seba es todo el país."}
    - {v: 5-9, type: list, entities: [event:david-manda-censar-a-israel-y-a-juda, person:joab-hijo-de-zeruya, place:rio-jordan, place:aroer, place:gad, place:jazer, place:galaad, place:tahtim-hodsi, place:dan-jaan, place:sidon, place:tiro, place:negueb, place:beer-seba, place:jerusalen], mentions: [place:juda, place:israel], note: "Recorrido del censo. La ciudad en medio del valle no tiene nombre; heveos y cananeos son pueblos, sin ficha. Se tardaron nueve meses y veinte días."}
    - {v: 10-14, type: narration, entities: [event:gad-da-a-elegir-a-david-un-castigo, person:david, person:gad-profeta, relation:gad-profeta/holds_office/-], note: "Tres opciones: siete años de hambre, tres meses huyendo o tres días de epidemia. David prefiere la mano de Jehová a la de los hombres."}
    - {v: 15-17, type: narration, entities: [event:una-epidemia-castiga-a-israel-por-el-censo, person:david, person:arauna, place:jerusalen, place:monte-moria, place:dan, place:beer-seba], mentions: [place:israel], note: "El ángel que hiere al pueblo no tiene nombre. David dice que el pueblo son ovejas que no han pecado."}
    - {v: 18-25, type: narration, entities: [event:david-compra-la-era-de-arauna-y-levanta-un-altar, person:david, person:gad-profeta, person:arauna, place:monte-moria], mentions: [place:israel], note: "David no quiere ofrecer a Jehová nada que no le cueste. 1Cr 21:25 da 600 siclos de oro: Perspicacia «Arauna» cree que pagaban toda la zona del futuro templo."}
