# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: 1-pedro
chapters:
  1:
    status: complete
    reviewed_on: 2026-10-14
    note: "Pedro saluda a los cristianos esparcidos por cinco regiones de Asia Menor. Les recuerda la esperanza que les dio la resurrección de Jesús, el rescate pagado con su sangre y el deber de ser santos y de amarse."
    spans:
    - {v: 1-2, type: letter, entities: [letter:1-pedro, event:pedro-escribe-1-pedro, person:pedro, relation:pedro/holds_office/-, place:ponto, place:galacia, place:capadocia, place:asia, place:bitinia], mentions: [person:jesus, event:pentecostes-33], note: "Pedro, apóstol de Jesucristo, escribe desde Babilonia (1Pe 5:13) a los escogidos que vivían como residentes temporales en cinco regiones. Perspicacia «Ponto» ve posible que algunos lo oyeran en Pentecostés y volvieran cristianos a su tierra."}
    - {v: 3-9, type: letter, mentions: [person:jesus, event:resurreccion-de-jesus], note: "Por la resurrección de Jesucristo, Dios los hizo nacer de nuevo con una esperanza viva y les guarda una herencia en el cielo. Las pruebas pasajeras afinan su fe, que vale más que el oro refinado."}
    - {v: 10-12, type: letter, mentions: [person:jesus, event:muerte-de-jesus], note: "Los profetas, sin nombre aquí, indagaron cuándo vendría esta salvación y anunciaron los sufrimientos de Cristo y su gloria posterior, sirviendo a creyentes futuros. Las referencias llevan a Da 9 e Is 53. Hasta los ángeles quieren verlo."}
    - {v: 13-16, type: letter, entities: [event:jehova-da-las-leyes-de-lo-puro-y-lo-impuro, event:jehova-da-leyes-para-que-israel-sea-santo], mentions: [person:jesus], note: "Mente lista y esperanza en la revelación de Jesucristo, sin los deseos de antes. Sean santos porque Dios lo es: cita Le 11:44 (Perspicacia «Pedro, Cartas de»); las referencias dan el mismo mandato en Le 19:2 y 20:7, 26."}
    - {v: 17-21, type: letter, mentions: [person:jesus, event:muerte-de-jesus, event:resurreccion-de-jesus], note: "Que se porten con temor mientras viven como extranjeros. No los liberó la plata ni el oro, sino la sangre de Cristo, cordero sin defecto, conocido antes de fundarse el mundo. Dios lo resucitó y lo glorificó."}
    - {v: 22-25, type: letter, entities: [event:isaias-anuncia-que-jehova-consolara-a-su-pueblo], note: "Ya purificados, que se amen intensamente: nacieron de nuevo de una semilla incorruptible, la palabra de Dios. Cita Is 40:6-8 sin nombrar a Isaías y dice del propio texto que esa palabra que dura son las buenas noticias."}
  2:
    status: complete
    reviewed_on: 2026-10-14
    note: "Los cristianos son piedras vivas edificadas sobre Cristo, la piedra angular, y un pueblo santo de Dios. Pedro les pide sujetarse a las autoridades y a los amos y seguir el ejemplo de Cristo, que sufrió sin devolver el mal."
    spans:
    - {v: 1-3, type: letter, entities: [letter:1-pedro], note: "Que dejen la maldad, el engaño, la hipocresía, la envidia y la calumnia, y que como recién nacidos ansíen la leche pura de la palabra para crecer hacia la salvación."}
    - {v: 4-8, type: letter, mentions: [person:jesus, event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios, event:isaias-anuncia-invasiones-y-promete-alivio], note: "Jesús es la piedra viva que los hombres rechazaron y Dios escogió; sobre él se edifica una casa espiritual con un sacerdocio santo. Cita Is 28:16, Sl 118:22 e Is 8:14. Perspicacia «Sión» ve aquí la Sion celestial, sin lugar."}
    - {v: 9-10, type: letter, mentions: [event:jehova-ofrece-su-pacto-a-israel, event:isaias-anuncia-que-jehova-consolara-a-su-pueblo, event:nacimiento-de-lo-ammi, event:nacimiento-de-lo-ruhama], note: "Pueblo escogido, sacerdocio real y nación santa, para proclamar las virtudes de Dios: Éx 19:5, 6 (Perspicacia «Pedro, Cartas de») y, por las referencias, Is 43:20, 21. Antes no eran pueblo: se invierten Lo-Ammí y Lo-Ruhamá (Os 1:10; 2:23)."}
    - {v: 11-12, type: letter, note: "Como extranjeros de paso, que se aparten de los deseos de la carne. Su buena conducta entre las naciones hará que quienes los acusan den gloria a Dios el día en que él inspeccione."}
    - {v: 13-17, type: letter, note: "Sumisión a toda autoridad humana: al rey como superior y a los gobernadores que él envía. Hacer el bien calla a los ignorantes; libres, pero esclavos de Dios. El rey no tiene nombre y ninguna fuente leída dice quién era."}
    - {v: 18-20, type: letter, note: "Los sirvientes, sujetos a sus amos, también a los difíciles. Aguantar un castigo merecido no tiene mérito; sufrir sin culpa por la conciencia ante Dios, en cambio, le agrada."}
    - {v: 21-25, type: letter, entities: [event:muerte-de-jesus], mentions: [person:jesus, event:isaias-anuncia-que-sion-sera-consolada], note: "Cristo sufrió y dejó un modelo: no pecó, no devolvió los insultos ni amenazó, y cargó con los pecados en el madero; la referencia del v. 23 lleva a Mt 27:39. Cita Is 53:5. Volvieron al pastor y superintendente."}
  3:
    status: complete
    reviewed_on: 2026-10-14
    note: "Consejos a esposas y esposos, y a todos para vivir unidos y aguantar el sufrimiento injusto. Pedro pone de ejemplo a Sara, recuerda el arca de Noé y lo compara con el bautismo, que salva por la resurrección de Jesús."
    spans:
    - {v: 1-6, type: letter, entities: [letter:1-pedro, person:sara, relation:abrahan/kin/sara], mentions: [person:abrahan, event:tres-angeles-visitan-a-abrahan], note: "Las esposas, sujetas a sus esposos, pueden ganar sin palabras a los que no creen. Su adorno es la persona interior, tranquila y apacible. Modelo: Sara, sumisa a Abrahán, al que llamaba señor (Gé 18:12)."}
    - {v: "7", type: letter, note: "Los esposos, que convivan con ellas con comprensión y las honren como más frágiles y coherederas de la vida, para que nada estorbe sus oraciones."}
    - {v: 8-12, type: letter, note: "Unidad, empatía, cariño fraternal y humildad; no pagar mal con mal, sino bendecir. Pedro apoya el consejo en Sl 34:12-16: quien ama la vida frena la lengua, busca la paz, y Jehová atiende a los justos."}
    - {v: 13-17, type: letter, mentions: [person:jesus], note: "Sufrir por la justicia trae felicidad. Que santifiquen al Cristo en su corazón, estén listos para explicar su esperanza con apacibilidad y respeto, y que su buena conciencia avergüence a quienes los critican."}
    - {v: 18-22, type: letter, entities: [event:diluvio, event:angeles-toman-esposas, event:muerte-de-jesus, event:resurreccion-de-jesus, event:ascension-de-jesus], mentions: [person:jesus, person:noe, event:dios-manda-construir-el-arca], note: "Cristo murió una vez, recibió vida en espíritu y predicó a los espíritus en prisión, ángeles desobedientes en días de Noé (Perspicacia «Tártaro»). Ocho se salvaron en el arca; a eso corresponde el bautismo. Jesús subió al cielo."}
  4:
    status: complete
    reviewed_on: 2026-10-14
    note: "Vivir para la voluntad de Dios y no como las naciones, porque el fin está cerca. Amor intenso, hospitalidad y buen uso de los dones; alegría al sufrir por ser cristianos, sin avergonzarse."
    spans:
    - {v: 1-6, type: letter, entities: [letter:1-pedro], mentions: [person:jesus, event:muerte-de-jesus], note: "Como Cristo sufrió en la carne, que vivan para lo que Dios quiere y no para los vicios de las naciones, que se extrañan y los insultan. Esas personas darán cuentas al que juzgará a vivos y muertos."}
    - {v: 7-11, type: letter, mentions: [event:destruccion-de-jerusalen-70, person:jesus], note: "El fin de todas las cosas está cerca; Perspicacia «Pedro, Cartas de» lo entiende como el del sistema judío que Jesús predijo. Que oren alerta, se amen intensamente, sean hospitalarios y sirvan con sus dones."}
    - {v: 12-19, type: letter, mentions: [person:jesus, event:cristianos-en-antioquia], note: "Que no les extrañen las pruebas de fuego: sufrir por el nombre de Cristo o por ser cristiano, nombre que Perspicacia «Cristiano» liga a Hch 11:26, no avergüenza. El juicio empieza por la casa de Dios (Pr 11:31)."}
  5:
    status: complete
    reviewed_on: 2026-10-14
    note: "Consejo a los ancianos para pastorear el rebaño y a los jóvenes para ser humildes; resistir al Diablo. Despedida: Pedro escribe por medio de Silvano y manda saludos desde Babilonia, con Marcos."
    spans:
    - {v: 1-4, type: letter, entities: [letter:1-pedro, person:pedro], mentions: [person:jesus, event:muerte-de-jesus], note: "Pedro, anciano como ellos y testigo de lo que sufrió Cristo, pide a los ancianos que cuiden el rebaño de buena gana, sin buscar ganancia ni mandar como amos. El pastor principal les dará la corona."}
    - {v: 5-11, type: letter, mentions: [person:satanas], note: "Los jóvenes, sujetos a los mayores; todos, humildes, echando sus inquietudes sobre Dios (Pr 3:34). El Diablo ronda como un león que ruge: hay que resistirle firmes, pues toda la hermandad sufre igual."}
    - {v: 12-14, type: letter, entities: [event:pedro-escribe-1-pedro, letter:1-pedro, person:pedro, person:silas, person:juan-marcos, place:babilonia, event:colonia-judia-en-babilonia, relation:pedro/lived_in/babilonia, relation:pedro/accompanies/silas, relation:pedro/accompanies/juan-marcos], note: "Pedro escribe por medio de Silvano, fiel hermano y quizá su amanuense. Saludan la que está en Babilonia, escogida como ellos, y Marcos, al que llama hijo. Perspicacia: es la Babilonia del Éufrates, no Roma."}
