# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: hebreos
chapters:
  1:
    status: complete
    reviewed_on: 2026-10-14
    note: "Dios, que antes habló por los profetas, habla ahora por su Hijo, heredero de todo, sentado a su derecha y superior a los ángeles. Siete citas de las Escrituras Hebreas lo prueban."
    spans:
    - {v: 1-4, type: letter, entities: [letter:hebreos], mentions: [person:pablo, event:pablo-escribe-hebreos, person:jesus, person:abrahan, person:moises, person:jeremias-profeta, person:habacuc, person:ageo, event:pacto-de-la-ley, event:muerte-de-jesus, event:resurreccion-de-jesus, event:ascension-de-jesus], note: "La carta no nombra a su escritor; la Tabla y las notas dicen Pablo. Entre los profetas de antes, la nota cita a Abrahán, Moisés, Jeremías, Habacuc y Ageo. El Hijo limpió los pecados y se sentó junto a Dios."}
    - {v: 5-6, type: letter, mentions: [person:jesus, person:david, person:salomon, event:pacto-con-david, event:bautismo-de-jesus, event:resurreccion-de-jesus], note: "Cita Sl 2:7 y 2Sa 7:14: según la nota, se cumplieron antes en David y Salomón, y en Jesús al bautizarse y al resucitar. La nota del v. 6 ve futuro e invisible su regreso."}
    - {v: 7-12, type: letter, mentions: [person:jesus, person:david, event:bautismo-de-jesus, relation:jesus/holds_office/-], note: "Los ángeles son siervos (Sl 104:4); el Hijo recibe trono, cetro y unción (Sl 45:6, 7) y dura más que cielos y tierra (Sl 102:25-27). Sus compañeros, los reyes davídicos. Su cargo de rey queda en preguntas."}
    - {v: 13-14, type: letter, mentions: [person:jesus, event:resurreccion-de-jesus, event:ascension-de-jesus], note: "Ningún ángel oyó «siéntate a mi derecha» (Sl 110:1): tras resucitar, el Hijo espera allí a que Dios someta a sus enemigos. Los ángeles sirven a los que heredarán la salvación."}
  2:
    status: complete
    reviewed_on: 2026-10-14
    note: "Hay que atender lo que habló el Señor: si la Ley dada por ángeles castigaba, más aún ahora. Jesús, hecho hombre y probado, murió por todos y es un sumo sacerdote compasivo."
    spans:
    - {v: 1-4, type: letter, entities: [letter:hebreos, event:pacto-de-la-ley], mentions: [person:moises, person:jesus, event:anuncio-del-reino-en-galilea, event:pentecostes-33], note: "La Ley que trajeron los ángeles a Moisés castigaba toda desobediencia; descuidar la salvación que anunció el Señor es peor. Perspicacia «Hebreos» liga los milagros y el reparto de espíritu santo con Pentecostés."}
    - {v: 5-9, type: letter, entities: [person:jesus], mentions: [person:david, person:adan, event:creacion-de-adan, event:muerte-de-jesus, event:resurreccion-de-jesus], note: "Cita Sl 8:4-6, que la nota atribuye a David: el dominio que tuvo Adán se cumple en Jesús, hecho un poco inferior a los ángeles y coronado de gloria tras morir por todos."}
    - {v: 10-13, type: letter, entities: [person:jesus], mentions: [person:david, person:isaias, event:isaias-anuncia-invasiones-y-promete-alivio, event:bautismo-de-jesus, event:pentecostes-33], note: "Dios perfecciona por sufrimientos al Agente Principal de la salvación, que llama hermanos a los ungidos. Pone en su boca Sl 22:22 e Is 8:17, 18: Isaías y sus hijos figuran a Jesús y los ungidos."}
    - {v: 14-18, type: letter, entities: [person:jesus, relation:jesus/holds_office/-], mentions: [person:satanas, person:adan, person:eva, person:abrahan, event:pecado-de-adan-y-eva, event:juicio-en-eden, event:muerte-de-jesus, event:tentacion-en-el-desierto], note: "Se hizo de carne y hueso para acabar, con su muerte, con el Diablo, causante de la muerte desde Edén (nota). Ayuda a la descendencia de Abrahán, los ungidos, como sumo sacerdote probado en todo."}
  3:
    status: complete
    reviewed_on: 2026-10-14
    note: "Jesús, apóstol y sumo sacerdote, merece más gloria que Moisés. Con el Salmo 95, Pablo avisa de no endurecerse como la generación del desierto, que no entró en el descanso de Dios por falta de fe."
    spans:
    - {v: 1-6, type: letter, entities: [letter:hebreos, person:jesus, relation:jesus/holds_office/-], mentions: [person:pablo, person:moises, event:miriam-y-aaron-hablan-contra-moises], note: "Jesús, enviado de Dios y sumo sacerdote, fue fiel como Moisés. Moisés sirvió en la casa, que la nota identifica con Israel (cita Nú 12:7); Cristo está a cargo de ella como hijo. Apóstol vale aquí por enviado."}
    - {v: 7-11, type: letter, entities: [event:agua-de-la-roca-en-horeb, place:masa, event:jehova-condena-a-israel-a-40-anos-en-el-desierto], mentions: [person:david, place:refidim, place:meriba-de-cades, event:agua-del-penasco-en-meriba, place:canaan], note: "Cita el Salmo 95:7-11 como palabras del espíritu santo; la nota dice que lo escribió David. Perspicacia «Masah» lo liga a Masá y Meribá, junto a Refidim, y quizá a Meribá de Cadés. El descanso negado era Canaán."}
    - {v: 12-15, type: letter, note: "Aviso contra un corazón sin fe que se aparta del Dios vivo. Hay que animarse cada día mientras dure el «hoy» del salmo; solo quien se aferra hasta el fin participa del Cristo."}
    - {v: 16-19, type: letter, entities: [event:israel-se-niega-a-entrar-en-canaan, event:jehova-condena-a-israel-a-40-anos-en-el-desierto], mentions: [person:moises, place:egipto, event:exodo], note: "Quienes provocaron a Dios fueron los que salieron de Egipto con Moisés. Los que pecaron cayeron en el desierto durante esos 40 años (Nú 14:29, 32), y por falta de fe no entraron."}
  4:
    status: complete
    reviewed_on: 2026-10-14
    note: "Sigue abierta la posibilidad de entrar en el reposo de Dios, iniciado el séptimo día de la creación; ni Josué lo dio a Israel. La palabra de Dios lo examina todo, y Jesús es un sumo sacerdote compasivo."
    spans:
    - {v: 1-2, type: letter, entities: [letter:hebreos, event:israel-se-niega-a-entrar-en-canaan], mentions: [person:josue-hijo-de-nun, person:caleb-hijo-de-jefune, place:canaan], note: "La promesa sigue en pie. Israel oyó buenas noticias, pero no se unió por la fe a los que obedecieron; la nota nombra a Josué y Caleb y remite a la negativa de Cadés (Nú 14:1-11)."}
    - {v: 3-5, type: letter, entities: [event:jehova-condena-a-israel-a-40-anos-en-el-desierto], mentions: [event:creacion-de-eva], note: "Los que tienen fe entran en el descanso de Dios, que empezó el séptimo día (Gé 2:2) y no ha acabado. La nota sitúa el fin de sus obras terrestres tras crear a Eva. Sin año, no es suceso."}
    - {v: 6-10, type: letter, entities: [event:jehova-condena-a-israel-a-40-anos-en-el-desierto], mentions: [person:david, person:josue-hijo-de-nun, event:entrada-en-canaan, event:conquista-de-canaan, place:canaan], note: "Dios fija otro «hoy» en el salmo de David, unos 450 años después según la nota. Si Josué, al llevarlos a Canaán, les hubiera dado reposo, no habría otro día. El descanso sabático que queda es figura, no suceso."}
    - {v: 11-13, type: letter, note: "Hay que esforzarse por entrar en ese descanso. La palabra de Dios, viva y más cortante que una espada de dos filos, deja al descubierto pensamientos e intenciones; nada se oculta a quien pedirá cuentas."}
    - {v: 14-16, type: letter, entities: [person:jesus, relation:jesus/holds_office/-, event:ascension-de-jesus], note: "Jesús, el Hijo de Dios, es un gran sumo sacerdote que entró en los cielos. Probado en todo pero sin pecado, se compadece de nuestras debilidades; por eso podemos pedir misericordia a Dios sin miedo, cuando hace falta ayuda."}
  5:
    status: complete
    reviewed_on: 2026-10-14
    note: "Jesús, sumo sacerdote nombrado por Dios como Melquisedec, y no por sí mismo; sus ruegos en la tierra y su obediencia. Paréntesis: los cristianos hebreos siguen necesitando leche y no alimento sólido."
    spans:
    - {v: 1-3, type: letter, entities: [letter:hebreos], mentions: [person:pablo], note: "Todo sumo sacerdote humano sale de entre los hombres para ofrecer dones y sacrificios por el pueblo y por sí mismo; su propia debilidad le permite ser compasivo. Las notas ponen la carta en boca de Pablo."}
    - {v: "4", type: letter, entities: [person:aaron], mentions: [period:sumo-sacerdocio-de-aaron], note: "Nadie se da a sí mismo la honra del sumo sacerdocio: Dios llama a quien la recibe, como llamó a Aarón. Según la nota, Aarón no la heredó; Roma nombraba a los de tiempos de Pablo."}
    - {v: 5-6, type: letter, entities: [person:jesus, relation:jesus/holds_office/-, event:bautismo-de-jesus], mentions: [person:melquisedec, event:resurreccion-de-jesus], note: "El Cristo tampoco se dio la gloria: se la dio quien le dijo «Tú eres mi hijo» (Sl 2:7) y lo hizo sacerdote eterno como Melquisedec (Sl 110:4). La nota pone ese nombramiento en su bautismo, en 29."}
    - {v: 7-10, type: letter, entities: [person:jesus, event:arresto-en-getsemani, relation:jesus/holds_office/-], mentions: [place:getsemani, event:muerte-de-jesus, event:resurreccion-de-jesus, person:melquisedec], note: "En su vida terrestre, Cristo suplicó con clamores y lágrimas al que podía librarlo de morir, y Dios lo escuchó. La nota ve aquí Getsemaní y quizá el madero; lo libró resucitándolo. Sufriendo aprendió obediencia."}
    - {v: 11-14, type: letter, note: "Paréntesis: los cristianos hebreos se han vuelto torpes para oír; tendrían que enseñar y aún piden leche en vez de alimento sólido. La nota recuerda que la congregación de Jerusalén llevaba casi 30 años. El maduro ejercita su discernimiento."}
  6:
    status: complete
    reviewed_on: 2026-10-14
    note: "Avanzar hacia la madurez; el peligro de apartarse de la fe; ánimo a los fieles. El juramento de Dios a Abrahán hace segura la esperanza, que llega tras la cortina, donde entró Jesús, sumo sacerdote como Melquisedec."
    spans:
    - {v: 1-3, type: letter, entities: [letter:hebreos], mentions: [person:pablo, person:jesus], note: "Según la nota, Pablo se incluye al invitar a avanzar hacia la madurez sin volver a los fundamentos: dejar las obras muertas, fe en Dios, bautismos, imposición de manos, resurrección y juicio eterno."}
    - {v: 4-8, type: letter, mentions: [person:jesus, event:pentecostes-33, event:muerte-de-jesus], note: "Quienes fueron iluminados y recibieron espíritu santo, que la nota liga a Pentecostés de 33, y luego apostatan no vuelven a arrepentirse: es como clavar otra vez al Hijo al madero. La tierra que solo da espinos acaba quemada."}
    - {v: 9-12, type: letter, note: "A los fieles les espera algo mejor: Dios no olvida cómo sirvieron y siguen sirviendo a los santos. Que mantengan su empeño hasta el final e imiten a quienes heredan las promesas con fe y paciencia."}
    - {v: 13-15, type: letter, entities: [person:abrahan, event:abrahan-ofrece-a-isaac], mentions: [person:isaac, event:pacto-con-abrahan, event:nacimiento-de-isaac], note: "Dios juró por sí mismo al prometer a Abrahán bendecirlo y multiplicarlo; tras esperar con paciencia, Abrahán lo obtuvo. La nota recuerda la promesa de Gé 12, la larga espera hasta Isaac y el juramento tras ofrecerlo."}
    - {v: 16-18, type: letter, mentions: [person:abrahan], note: "Los hombres juran por alguien mayor y así zanjan sus disputas. Dios añadió un juramento a su promesa para animar a sus herederos, refugiados en él: promesa y juramento no cambian, y Dios no puede mentir."}
    - {v: 19-20, type: letter, entities: [person:jesus, relation:jesus/holds_office/-, event:ascension-de-jesus], mentions: [person:melquisedec, event:resurreccion-de-jesus], note: "La esperanza es un ancla firme que pasa tras la cortina, adonde entró Jesús como precursor, sumo sacerdote eterno como Melquisedec. Según la nota, la cortina del tabernáculo figura su carne, y el Santísimo, el cielo."}
  7:
    status: complete
    reviewed_on: 2026-10-14
    note: "Cuerpo doctrinal: el sacerdocio de Jesús, a la manera de Melquisedec, supera al levítico. Recuerda el encuentro de Génesis 14 sin sucesos ni lugares nuevos."
    spans:
    - {v: 1-3, type: letter, entities: [letter:hebreos, person:melquisedec, person:abrahan, event:melquisedec-bendice-a-abran, journey:rescate-de-lot, relation:melquisedec/holds_office/-/king, relation:melquisedec/holds_office/-/priest, relation:melquisedec/lived_in/jerusalen], mentions: [place:jerusalen, event:abran-rescata-a-lot, person:jesus], note: "Melquisedec, rey de Salem y sacerdote, bendice a Abrahán cuando vuelve de vencer a los reyes. Su nombre vale «rey de justicia» y Salem, «paz». Sin padres ni muerte registrados, es figura del Hijo de Dios."}
    - {v: 4-10, type: letter, entities: [person:abrahan, person:melquisedec, person:levi-hijo-de-jacob, relation:levi-hijo-de-jacob/kin/abrahan, event:melquisedec-bendice-a-abran], mentions: [event:pacto-con-abrahan, event:jehova-fija-los-deberes-de-sacerdotes-y-levitas], note: "Abrahán le entregó el diezmo de lo mejor del botín. Por la Ley los levitas cobran diezmos (Nú 18:21), pero Leví, todavía sin nacer, los pagó por medio de su bisabuelo. El menor recibe la bendición del mayor."}
    - {v: 11-14, type: letter, entities: [person:jesus, relation:jesus/kin/juda-hijo-de-jacob], mentions: [person:melquisedec, person:aaron, person:moises, person:juda-hijo-de-jacob, event:pacto-de-la-ley], note: "El sacerdocio levítico, base de la Ley, no perfeccionaba; por eso aparece un sacerdote como Melquisedec y no como Aarón. Jesús desciende de Judá, tribu que nunca sirvió en el altar: al cambiar el sacerdocio cambia la Ley."}
    - {v: 15-19, type: letter, mentions: [person:melquisedec, person:jesus, event:resurreccion-de-jesus], note: "El nuevo sacerdote no lo es por linaje sino por una vida indestructible, que la nota de estudio liga a su resurrección. Cita Sl 110:4. La Ley no perfeccionó nada; la esperanza mejor nos acerca a Dios."}
    - {v: 20-25, type: letter, entities: [person:jesus], mentions: [event:instalacion-del-sacerdocio, event:cena-del-senor], note: "Los sacerdotes de Aarón entraron sin juramento; Jesús, con el de Sl 110:4, y garantiza un pacto mejor. Aquellos se sucedían al morir, más de 80 hasta el año 70 según la nota; él vive siempre e intercede."}
    - {v: 26-28, type: letter, entities: [person:jesus, relation:jesus/holds_office/-], mentions: [event:muerte-de-jesus, event:ascension-de-jesus, event:jehova-fija-las-ofrendas-de-cada-dia-y-de-las-fiestas, event:aaron-ofrece-los-primeros-sacrificios, event:jehova-da-la-ley-del-dia-de-expiacion], note: "Jesús, sumo sacerdote leal y sin pecado, elevado sobre los cielos, no sacrifica cada día por sí y luego por el pueblo: se ofreció una sola vez. El juramento, posterior a la Ley, nombra sumo sacerdote al Hijo."}
  8:
    status: complete
    reviewed_on: 2026-10-14
    note: "Cuerpo doctrinal: Jesús, sumo sacerdote en el cielo, media un pacto mejor que el de la Ley. Cita Jer 31:31-34. Sin sucesos ni lugares nuevos."
    spans:
    - {v: 1-2, type: letter, entities: [letter:hebreos, person:jesus, relation:jesus/holds_office/-], mentions: [event:ascension-de-jesus], note: "Lo principal: el sumo sacerdote ocupa su sitio junto al trono de Dios en el cielo y sirve en la tienda verdadera, levantada por Jehová y no por un hombre. Es una figura, no un lugar."}
    - {v: 3-6, type: letter, entities: [person:jesus, event:jehova-da-a-moises-el-modelo-del-tabernaculo], mentions: [person:moises, event:cena-del-senor], note: "En la tierra no sería sacerdote: allí otros presentan ofrendas según la Ley, en un servicio que es sombra de lo celestial, hecho según el modelo que Moisés vio en la montaña (Éx 25:40). Jesús media un pacto mejor."}
    - {v: 7-13, type: letter, entities: [event:pacto-de-la-ley], mentions: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro, event:exodo, place:egipto], note: "El primer pacto tenía defectos. Cita Jer 31:31-34 sin nombrar al profeta: un nuevo pacto con las casas de Israel y de Judá, pueblos sin ficha. El pacto hecho al salir de Egipto queda anticuado."}
  9:
    status: complete
    reviewed_on: 2026-10-14
    note: "El santuario del pacto anterior y sus sacrificios frente a Cristo, sumo sacerdote que entra en el cielo con su propia sangre y es mediador de un nuevo pacto. No nombra lugares."
    spans:
    - {v: 1-5, type: letter, entities: [letter:hebreos, event:la-vara-de-aaron-echa-brotes], mentions: [person:aaron, event:pacto-de-la-ley, event:se-monta-el-tabernaculo, event:moises-recibe-las-segundas-tablas, event:codornices-y-mana-en-el-desierto-de-sin], note: "La tienda del pacto anterior: el Lugar Santo, con candelabro, mesa y panes, y tras la segunda cortina el Santísimo con el arca. Según Perspicacia «Arca del pacto», la vara y el maná salieron de ella antes del templo."}
    - {v: 6-10, type: letter, entities: [event:jehova-da-la-ley-del-dia-de-expiacion], note: "Los sacerdotes entran a diario en el primer compartimiento; en el segundo, solo el sumo sacerdote, una vez al año y con sangre, el Día de Expiación (Le 16). Eran normas para el cuerpo hasta el tiempo de rectificar."}
    - {v: 11-14, type: letter, entities: [person:jesus, relation:jesus/holds_office/-, event:ascension-de-jesus, event:jehova-da-la-ley-de-la-vaca-roja], mentions: [event:muerte-de-jesus], note: "Cristo, sumo sacerdote, entra una sola vez en el lugar santo con su propia sangre; Perspicacia «Ascensión» lo pone en su subida al cielo. Las cenizas de la ternera son las de la ley de Nú 19."}
    - {v: 15-17, type: letter, mentions: [person:jesus, event:muerte-de-jesus], note: "Cristo es mediador de un nuevo pacto: su muerte sirve de rescate de las faltas cometidas bajo el pacto anterior. Un pacto con Dios solo entra en vigor con la muerte del humano que lo hace."}
    - {v: 18-22, type: letter, entities: [event:pacto-de-la-ley, person:moises], note: "El pacto de la Ley se inauguró con sangre (Éx 24:3-8): Moisés salpicó el libro y al pueblo. Hebreos añade agua, lana escarlata e hisopo, y la sangre sobre la tienda y sus objetos, sin suceso propio aquí."}
    - {v: 23-28, type: letter, entities: [person:jesus, event:ascension-de-jesus, event:jehova-da-la-ley-del-dia-de-expiacion], mentions: [event:muerte-de-jesus], note: "La copia terrena se purificaba con sangre de animales. Cristo entró en el cielo mismo para presentarse ante Dios, una sola vez; el sumo sacerdote entraba cada año. Volverá a aparecer, sin ocuparse del pecado, para salvar."}
  10:
    status: complete
    reviewed_on: 2026-10-14
    note: "Los sacrificios de la Ley no quitan el pecado; el cuerpo de Cristo, ofrecido una vez, sí. Exhortación a acercarse a Dios, reunirse y aguantar con fe. No nombra lugares."
    spans:
    - {v: 1-4, type: letter, entities: [letter:hebreos, event:jehova-da-la-ley-del-dia-de-expiacion], note: "La Ley solo era sombra de los bienes futuros. Sus sacrificios de cada año recordaban los pecados, porque la sangre de toros y cabras no los borra; Perspicacia «Día de Expiación» lo aplica a esa fiesta."}
    - {v: 5-10, type: letter, entities: [person:jesus, event:bautismo-de-jesus], mentions: [event:muerte-de-jesus], note: "Cristo hace suyas las palabras del Sl 40:6-8, sin nombrar a David: Dios no quería ofrendas y le preparó un cuerpo. Perspicacia «Bautismo» pone esa entrada en el mundo cuando se presentó para bautizarse."}
    - {v: 11-14, type: letter, entities: [person:jesus, event:ascension-de-jesus], mentions: [event:muerte-de-jesus], note: "Los sacerdotes repiten cada día sacrificios que no borran pecados; él ofreció uno solo y ocupa su sitio junto a Dios, esperando que sus enemigos caigan. Perspicacia «Enemigo» lo enlaza con el Sl 110."}
    - {v: 15-18, type: letter, mentions: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro], note: "El espíritu santo da testimonio con el nuevo pacto de Jer 31:33, 34, sin nombrar a Jeremías: leyes escritas en el corazón y pecados olvidados. Con el perdón ya no hace falta ofrenda por el pecado."}
    - {v: 19-25, type: letter, entities: [person:jesus, relation:jesus/holds_office/-, event:ascension-de-jesus], mentions: [event:muerte-de-jesus], note: "La sangre de Jesús abre la entrada al lugar santo a través de la cortina, su carne; Perspicacia «Ascensión» liga ese camino nuevo a su subida al cielo. Con él como gran sacerdote: acercarse, animarse y reunirse."}
    - {v: 26-31, type: letter, mentions: [person:moises, person:jesus, event:jehova-da-leyes-de-ofrendas-para-la-tierra-prometida, event:moises-recita-su-cancion-ante-israel], note: "Quien peca a propósito ya no tiene sacrificio. Bajo la Ley de Moisés moría, y Perspicacia «Cortamiento» piensa en Nú 15:30; despreciar al Hijo merece más. «Enemigo» identifica la cita de Dt 32:35."}
    - {v: 32-34, type: letter, mentions: [event:dispersion-de-los-discipulos], note: "Recuerden su aguante tras ser iluminados: insultos en público, apoyo a los presos y bienes saqueados. La Atalaya del 1 de enero de 1998 ve posible que piense en la persecución de Hch 8:1."}
    - {v: 35-39, type: letter, mentions: [event:habacuc-profetiza-contra-juda-y-babilonia], note: "Necesitan aguante: el que viene no tardará, y el justo vivirá por su fe. Son palabras de Hab 2:3, 4, sin nombrar al profeta; La Atalaya de abril de 2023 las aplica a quienes esperan el nuevo mundo."}
  11:
    status: complete
    reviewed_on: 2026-10-14
    note: "El capítulo de la fe: repasa testigos desde Abel hasta los profetas. Sus sucesos son de otros libros; Hebreos añade su pasaje a los que cuenta y nombra de paso a los demás."
    spans:
    - {v: 1-3, type: letter, entities: [letter:hebreos], note: "La fe da seguridad sobre lo que se espera y prueba lo que no se ve. Por ella los antiguos recibieron la aprobación divina, y por ella entendemos que Dios ordenó los sistemas con su palabra."}
    - {v: "4", type: letter, entities: [person:abel, event:ofrendas-de-cain-y-abel], mentions: [person:cain, event:cain-mata-a-abel], note: "Abel ofrece por fe un sacrificio mejor que el de Caín y Dios lo declara justo. Muerto ya, su fe sigue hablando: Perspicacia «Abel» lo explica por el registro que dejó."}
    - {v: 5-6, type: letter, entities: [person:enoc-hijo-de-jared, event:dios-toma-a-enoc], note: "Enoc agradó a Dios y fue trasladado sin ver la muerte; nadie lo halló. Sin fe nadie agrada a Dios: quien se le acerca debe creer que existe y que premia a quien lo busca."}
    - {v: "7", type: letter, entities: [person:noe, event:dios-manda-construir-el-arca], mentions: [event:diluvio], note: "Avisado por Dios de lo que aún no se veía, Noé construye un arca para salvar a su familia. Con esa fe condena al mundo y hereda la justicia que viene de creer."}
    - {v: 8-10, type: letter, entities: [person:abrahan, person:isaac, person:jacob, event:pacto-con-abrahan, journey:abrahan-de-haran-a-canaan, relation:abrahan/lived_in/canaan, relation:isaac/lived_in/canaan, relation:jacob/lived_in/canaan], mentions: [place:canaan], note: "Abrahán obedece la llamada y sale sin saber adónde, hacia la tierra que heredaría, Canaán según Perspicacia «Abrahán». Vive allí en tiendas, como extranjero, con Isaac y Jacob, esperando la ciudad que Dios diseña."}
    - {v: 11-12, type: letter, entities: [person:sara, event:nacimiento-de-isaac], mentions: [person:abrahan, person:isaac, event:tres-angeles-visitan-a-abrahan], note: "Ya pasada la edad, Sara recibe fuerzas para concebir porque confía en quien se lo prometió. De Abrahán, un hombre casi muerto, nace una descendencia incontable como las estrellas y la arena."}
    - {v: 13-16, type: letter, note: "Todos murieron con fe sin recibir lo prometido; lo vieron de lejos y se declararon residentes temporales. No quisieron volver a la tierra de donde salieron: buscaban un lugar celestial, y Dios les prepara una ciudad."}
    - {v: 17-19, type: letter, entities: [person:abrahan, person:isaac, event:abrahan-ofrece-a-isaac, journey:abrahan-a-moria, relation:isaac/kin/abrahan], mentions: [event:isaac-destetado-e-ismael-se-burla], note: "Puesto a prueba, Abrahán casi ofrece a Isaac, su único hijo, aunque la descendencia prometida vendría por él (Gé 21:12). Confiaba en que Dios podía resucitarlo, y de forma simbólica lo recuperó."}
    - {v: "20", type: letter, entities: [person:isaac, person:jacob, person:esau, event:isaac-bendice-a-jacob, event:esau-pide-otra-bendicion], mentions: [event:isaac-envia-a-jacob-a-padan-aram], note: "Por fe, Isaac bendice a Jacob y a Esaú pensando en lo que iba a pasar. Perspicacia «Jacob» compara este versículo con la segunda bendición, al mandarlo a Harán (Gé 28:3, 4)."}
    - {v: "21", type: letter, entities: [person:jacob, event:jacob-bendice-a-efrain-y-manases, relation:efrain/kin/jose-hijo-de-jacob, relation:manases-hijo-de-jose/kin/jose-hijo-de-jacob], mentions: [person:jose-hijo-de-jacob, person:efrain, person:manases-hijo-de-jose, event:jacob-bendice-a-sus-hijos], note: "Jacob, a punto de morir, bendice a cada hijo de José, Efraín y Manasés según Gé 48, y adora apoyado en su bastón. Perspicacia «Jacob» cita también aquí su bendición a los doce (Gé 49)."}
    - {v: "22", type: letter, entities: [person:jose-hijo-de-jacob, event:muerte-de-jose], mentions: [event:exodo, event:entierran-los-huesos-de-jose-en-siquem], note: "Cerca de su fin, José habla de la salida de Israel y da órdenes sobre sus huesos. Perspicacia «José» lo liga a Gé 50:22-26 y al entierro en Siquem (Jos 24:32)."}
    - {v: "23", type: letter, entities: [person:moises, event:nacimiento-de-moises, relation:moises/kin/amram-hijo-de-cohat, relation:moises/kin/jokebed], mentions: [person:amram-hijo-de-cohat, person:jokebed, event:el-faraon-manda-echar-al-nilo-a-los-ninos], note: "Sus padres, Amram y Jokébed según Éx 6:20, esconden tres meses a Moisés recién nacido porque es un niño hermoso, sin miedo a la orden del rey."}
    - {v: 24-26, type: letter, entities: [person:moises, event:moises-mata-a-un-egipcio, relation:moises/lived_in/egipto], mentions: [place:egipto], note: "Ya adulto, Moisés no acepta que lo llamen hijo de la hija del faraón, que no tiene nombre. Prefiere sufrir con el pueblo de Dios y estima más la deshonra del Cristo que las riquezas egipcias."}
    - {v: 27-28, type: letter, entities: [person:moises, event:exodo, event:primera-pascua], mentions: [place:egipto, event:decima-plaga-mueren-los-primogenitos, event:jehova-instituye-la-pascua], note: "Deja Egipto sin temer la furia del rey; Perspicacia «Moisés» lo pone en el éxodo, tras las plagas. Celebra la Pascua y marca las puertas con sangre para que el destructor no toque a los primogénitos."}
    - {v: "29", type: letter, entities: [event:israel-cruza-el-mar-rojo, place:mar-rojo], mentions: [place:cruce-del-mar-rojo, place:egipto], note: "El pueblo cruza el mar Rojo como por tierra seca; cuando los egipcios lo intentan, el mar se los traga."}
    - {v: 30-31, type: letter, entities: [event:caida-de-jerico, place:jerico, person:rahab, event:rahab-esconde-a-los-espias, event:los-espias-sacan-a-rahab-de-jerico], note: "Tras siete días de vueltas alrededor de Jericó, sus murallas caen. Rahab, la prostituta, no muere con los desobedientes porque acogió en paz a los espías."}
    - {v: 32-34, type: letter, mentions: [person:gedeon, person:barac, person:sanson, person:jefte, person:david, person:samuel, person:daniel], note: "Falta tiempo para hablar de Gedeón, Barac, Sansón, Jefté, David, Samuel y los profetas, que por fe vencieron reinos, cerraron bocas de leones y escaparon de la espada. Perspicacia «Daniel» lo incluye aquí."}
    - {v: "35", type: letter, entities: [event:elias-resucita-al-hijo-de-la-viuda-de-sarepta, event:eliseo-resucita-al-hijo-de-la-sunamita], mentions: [person:elias-profeta, person:eliseo], note: "Hubo mujeres que recobraron a sus muertos por resurrección; Perspicacia «Elías» y «Eliseo» piensan en la viuda de Sarepta y la sunamita. Otros aguantaron la tortura sin aceptar rescate, por una resurrección mejor."}
    - {v: 36-38, type: letter, mentions: [person:jeremias-profeta], note: "Otros sufrieron burlas, latigazos, cárceles, piedras y espada, y vagaron por desiertos y cuevas. Perspicacia «Jeremías» lo cuenta entre ellos; «Sierra» recoge una tradición sobre Isaías aserrado que la Biblia no confirma."}
    - {v: 39-40, type: letter, note: "Todos fueron aprobados por su fe, pero no recibieron lo prometido: Dios tenía previsto algo mejor, y sin los cristianos ellos no llegarían a la perfección."}
  12:
    status: complete
    reviewed_on: 2026-10-14
    note: "Aguantar con la vista en Jesús, aceptar la disciplina de Dios, no imitar a Esaú y valorar la Sion celestial por encima del Sinaí."
    spans:
    - {v: 1-3, type: letter, entities: [letter:hebreos], mentions: [person:jesus, event:muerte-de-jesus], note: "Rodeados de tantos testigos, los cristianos deben soltar todo peso y correr con aguante, mirando a Jesús, que soportó el madero por la alegría que le esperaba y está sentado junto al trono de Dios."}
    - {v: 4-11, type: letter, note: "Aún no han resistido hasta la sangre. Cita Pr 3:11, 12: Jehová corrige a quien ama, como un padre a su hijo. La disciplina duele en el momento, pero después produce paz y justicia."}
    - {v: 12-17, type: letter, entities: [person:esau, event:esau-vende-su-primogenitura, event:esau-pide-otra-bendicion], mentions: [person:isaac], note: "Que nadie se quede sin la bondad de Dios ni brote una raíz venenosa. Nadie debe despreciar lo sagrado como Esaú, que cambió su primogenitura por una comida y luego, llorando, no logró la bendición de su padre."}
    - {v: 18-21, type: letter, entities: [person:moises, event:jehova-desciende-sobre-el-monte-sinai, event:diez-mandamientos], mentions: [place:monte-sinai, event:israel-se-santifica-ante-el-sinai, event:moises-rompe-las-tablas], note: "No se han acercado a un monte que arde entre nubes, oscuridad, trompeta y una voz que el pueblo pidió no oír más. Perspicacia «Hebreos» y «Sinaí» lo ligan al Sinaí; Moisés confesó temblar de miedo."}
    - {v: 22-24, type: letter, mentions: [person:jesus, person:abel, event:cain-mata-a-abel], note: "Se han acercado al monte Sion y a la Jerusalén celestial, símbolos sin ficha, con miríadas de ángeles, Dios y Jesús, mediador del nuevo pacto, cuya sangre habla mejor que la de Abel."}
    - {v: 25-29, type: letter, mentions: [event:jehova-desciende-sobre-el-monte-sinai, event:segundo-mensaje-de-ageo], note: "No rechacen al que habla desde el cielo. La voz que sacudió la tierra en el Sinaí promete sacudir también el cielo (cita Ag 2:6); solo quedará lo firme, como el Reino que reciben."}
  13:
    status: complete
    reviewed_on: 2026-10-14
    note: "Consejos finales y saludo. La carta sale de Italia, probablemente de Roma, hacia 61, cuando Timoteo acaba de quedar libre."
    spans:
    - {v: 1-6, type: letter, entities: [letter:hebreos], mentions: [person:abrahan, person:lot, person:gedeon, person:manoah, event:tres-angeles-visitan-a-abrahan, event:angeles-en-casa-de-lot, event:el-angel-de-jehova-comisiona-a-gedeon, event:el-angel-de-jehova-se-aparece-a-manoah], note: "Amor fraternal, hospitalidad, recuerdo de los presos, matrimonio honroso y vida sin codicia. Hubo quienes hospedaron ángeles sin saberlo: Perspicacia «Hospitalidad» y «Abrahán» señalan a Abrahán, Lot, Gedeón y Manóah. Cita Dt 31:6 y Sl 118:6."}
    - {v: 7-9, type: letter, mentions: [person:jesus], note: "Que recuerden a quienes los dirigen e imiten su fe. Jesucristo no cambia. No deben dejarse arrastrar por enseñanzas extrañas: el corazón se fortalece con bondad inmerecida, no con normas sobre comidas."}
    - {v: 10-16, type: letter, mentions: [person:jesus, event:muerte-de-jesus, event:jehova-da-la-ley-del-dia-de-expiacion], note: "Quien sirve en la tienda no come del altar cristiano. Como los restos del Día de Expiación se quemaban fuera del campamento, Jesús sufrió fuera de la puerta (Perspicacia «Día de Expiación»). Ofrezcan alabanza y compartan."}
    - {v: 17-19, type: letter, entities: [person:pablo, event:pablo-escribe-hebreos], mentions: [event:pablo-queda-libre], note: "Obedezcan a quienes los dirigen. Pablo, según la Tabla, pide oraciones para volver antes con ellos. Perspicacia «Italia» pone la carta al final del primer encierro o poco después de su liberación, sin decidir cuál."}
    - {v: 20-21, type: letter, mentions: [person:jesus, event:resurreccion-de-jesus], note: "Oración al Dios de la paz, que levantó de entre los muertos a Jesús, el gran pastor, con la sangre de un pacto eterno, para que los capacite para hacer su voluntad."}
    - {v: 22-25, type: letter, entities: [letter:hebreos, event:pablo-escribe-hebreos, event:timoteo-queda-libre, person:pablo, person:timoteo, place:italia, relation:timoteo/accompanies/pablo], mentions: [place:roma, event:pablo-queda-libre, relation:timoteo/lived_in/roma], note: "Pide que acepten su carta breve. Timoteo está libre; si llega pronto, irán juntos a verlos. Saludan los de Italia: Perspicacia «Italia» pone allí la carta, hacia 61, sin decir si Pablo seguía preso."}
