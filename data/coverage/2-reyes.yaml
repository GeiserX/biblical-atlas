    - {v: 38-41, type: narration, entities: [event:eliseo-sanea-el-guisado-en-guilgal, person:eliseo, place:guilgal-cerca-de-betel], note: "Hay hambre en el país. Quien recoge las calabazas silvestres y el sirviente que cocina no tienen nombre."}
    - {v: 42-44, type: narration, entities: [event:eliseo-alimenta-a-cien-hombres-con-veinte-panes, person:eliseo, place:baal-salisa], mentions: [place:guilgal-cerca-de-betel], note: "El hombre de Baal-Salisá y el sirviente que reparte no tienen nombre. Perspicacia sitúa la escena en Guilgal."}
  5:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-7, type: narration, entities: [event:naaman-lleva-al-rey-de-israel-una-carta-de-siria, person:naaman-el-sirio, person:ben-hadad-ii, person:jehoram-de-israel, place:samaria, place:siria, relation:naaman-el-sirio/lived_in/siria, relation:naaman-el-sirio/tie/ben-hadad-ii], mentions: [person:eliseo, place:israel], note: "La niña israelita cautiva y la esposa de Naamán no tienen nombre. Los reyes sin nombre son Ben-Hadad II y Jehoram, según Perspicacia «Naamán», núm. 2. El profeta de Samaria es Eliseo."}
    - {v: 8-14, type: narration, entities: [event:eliseo-cura-a-naaman-de-la-lepra, person:eliseo, person:naaman-el-sirio, person:jehoram-de-israel, place:rio-jordan, place:samaria, place:rio-abana, place:rio-farpar, relation:eliseo/lived_in/samaria], mentions: [place:damasco, place:israel], note: "El mensajero de Eliseo y los siervos de Naamán no tienen nombre. Naamán compara el Jordán con el Abaná y el Farpar, ríos de Damasco."}
    - {v: 15-19, type: narration, entities: [event:naaman-vuelve-a-eliseo-y-promete-servir-a-jehova, person:naaman-el-sirio, person:eliseo, place:samaria], mentions: [person:ben-hadad-ii, place:israel], note: "Rimón es un dios sirio y no lleva ficha (Perspicacia «Rimón», núm. 5). «Mi señor» es el rey de Siria que se apoya en Naamán en el templo de ese dios."}
    - {v: 20-27, type: narration, entities: [event:guehazi-se-vuelve-leproso, person:guehazi, person:naaman-el-sirio, person:eliseo, place:samaria, relation:guehazi/tie/eliseo, relation:guehazi/lived_in/samaria], mentions: [place:region-montanosa-de-efrain], note: "Ofel, lugar de Samaria según la nota de 2Re 5:24, va en los nombres de samaria. Los dos jóvenes de Efraín son un invento de Guehazí; los sirvientes de Naamán no tienen nombre."}
  6:
    status: complete
    reviewed_on: 2026-09-30
    spans:
