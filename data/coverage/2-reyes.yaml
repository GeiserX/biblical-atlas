    - {v: 8-12, type: narration, entities: [event:eliseo-avisa-al-rey-de-israel-de-los-planes-sirios, person:ben-hadad-ii, person:eliseo, person:jehoram-de-israel, place:israel, place:siria, relation:ben-hadad-ii/tie/jehoram-de-israel], note: "El rey de Siria y el de Israel no tienen nombre en estos versículos; Perspicacia «Ben-hadad», núm. 2, y «Jehoram», núm. 2, dicen quiénes son."}
    - {v: 13-19, type: narration, entities: [event:jehova-ciega-al-ejercito-sirio-en-dotan, person:eliseo, person:ben-hadad-ii, place:dotan], mentions: [place:samaria], note: "El sirviente de Eliseo no tiene nombre; Perspicacia «Dotán» tampoco se lo da. Los caballos y carros de fuego rodean a Eliseo en los montes de Dotán."}
    - {v: 20-23, type: narration, entities: [event:eliseo-lleva-a-samaria-a-los-sirios-cegados, person:eliseo, person:jehoram-de-israel, place:samaria], mentions: [place:israel, place:siria]}
    - {v: 24-30, type: narration, entities: [event:ben-hadad-ii-sitia-samaria-y-hay-hambre, person:ben-hadad-ii, person:jehoram-de-israel, place:samaria, relation:ben-hadad-ii/holds_office/siria, relation:jehoram-de-israel/lived_in/samaria], mentions: [place:siria, place:israel], note: "Las dos mujeres y los niños no tienen nombre. La escena cumple las maldiciones de la Ley que citan las referencias de 2Re 6:28 y 6:29."}
    - {v: 31-33, type: narration, entities: [event:jehoram-jura-matar-a-eliseo, person:jehoram-de-israel, person:eliseo, person:safat-padre-de-eliseo, place:samaria, relation:eliseo/kin/safat-padre-de-eliseo, relation:jehoram-de-israel/kin/acab, relation:eliseo/lived_in/samaria], mentions: [person:acab], note: "El mensajero y los ancianos no tienen nombre. «Ese hijo de un asesino» es Jehoram, hijo de Acab (Perspicacia «Jehoram», núm. 2). La escena sigue en 2Re 7:1, 2."}
  7:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-2, type: prophecy, entities: [event:eliseo-anuncia-el-fin-del-hambre-en-samaria, person:eliseo, person:jehoram-de-israel, place:samaria], mentions: [event:jehoram-jura-matar-a-eliseo], note: "La puerta de Samaria es parte de la ciudad, sin ficha. El oficial de confianza del rey no tiene nombre. El sea y el siclo son medidas (apén. B14)."}
