    - {v: 20-22, type: narration, entities: [event:edom-y-libna-se-rebelan-contra-jehoram-de-juda, person:jehoram-de-juda, place:zair, place:edom, place:libna], mentions: [place:juda], note: "El rey que se da Edom no tiene nombre. La rebelión seguía cuando se escribió el libro."}
