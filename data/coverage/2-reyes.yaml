    - {v: 16-20, type: narration, entities: [event:el-pueblo-saquea-el-campamento-sirio, person:jehoram-de-israel, person:eliseo, place:samaria], note: "Se cumple lo anunciado en 7:1, 2: el oficial, sin nombre, ve la comida y muere en la puerta sin comerla."}
