    - {v: 9-12, type: narration, entities: [event:tres-reyes-marchan-contra-moab, person:jehoram-de-israel, person:jehosafat, person:eliseo, person:safat-padre-de-eliseo, place:edom, relation:eliseo/kin/safat-padre-de-eliseo, relation:eliseo/tie/elias-profeta, relation:eliseo/holds_office/-], mentions: [person:elias-profeta, place:moab, place:israel, place:juda], note: "Tras siete días de rodeo se acaba el agua. Un siervo del rey, sin nombre, recuerda a Eliseo, que servía a Elías; el rey de Edom tampoco se nombra."}
    - {v: 13-20, type: narration, entities: [event:tres-reyes-marchan-contra-moab, person:eliseo, person:jehoram-de-israel, person:jehosafat, place:edom], mentions: [person:acab, person:jezabel, place:moab, place:juda, place:israel], note: "Eliseo solo atiende por Jehosafat. Con un arpista anuncia zanjas llenas de agua sin lluvia y la entrega de Moab; a la hora de la ofrenda de la mañana llega el agua."}
    - {v: 21-27, type: narration, entities: [event:mesa-sacrifica-a-su-primogenito-en-quir-hareset, person:mesa-rey-de-moab, place:quir-hareset, place:moab], mentions: [place:edom, place:israel], note: "El agua parece sangre y los moabitas van al saqueo. El primogénito sacrificado no tiene nombre; Perspicacia cree que fue ofrecido a Kemós, dios sin ficha."}
  4:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-7, type: narration, entities: [event:eliseo-multiplica-el-aceite-de-la-viuda, person:eliseo], note: "No se nombra a la viuda, a su difunto esposo, que era de los hijos de los profetas, ni a sus dos hijos ni al acreedor."}
    - {v: 8-17, type: narration, entities: [event:eliseo-promete-un-hijo-a-la-sunamita, person:eliseo, person:guehazi, place:sunem, relation:guehazi/tie/eliseo], note: "La sunamita, su esposo y el hijo que le nace no tienen nombre. Eliseo le ofrece hablar por ella al rey o al jefe del ejército, y ella lo rechaza."}
