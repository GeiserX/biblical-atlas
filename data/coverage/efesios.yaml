# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: efesios
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    note: "Saludo a los santos de Éfeso, alabanza por lo que Dios da a los ungidos en unión con Cristo y oración de Pablo por ellos. El único suceso es la propia carta, escrita en Roma."
    spans:
    - {v: 1-2, type: letter, entities: [letter:efesios, event:pablo-escribe-efesios, person:pablo, place:efeso], mentions: [person:jesus, place:laodicea], note: "Pablo, apóstol por voluntad de Dios, saluda a los santos fieles de Éfeso. La nota defiende las palabras «en Éfeso», que faltan en algunos manuscritos, frente a quienes suponen la carta enviada a Laodicea."}
    - {v: 3-7, type: letter, mentions: [person:jesus, event:muerte-de-jesus], note: "Alabanza a Dios, que escogió de antemano al grupo de los ungidos, no a cada uno, para adoptarlos como hijos por Jesucristo. Su sangre trae rescate y perdón; la nota la compara con la del Día de Expiación."}
    - {v: 8-14, type: letter, mentions: [person:jesus, event:pentecostes-33], note: "Dios revela su secreto sagrado: una administración para reunir en Cristo lo del cielo y lo de la tierra. Según la nota, lo del cielo empezó a reunirse en Pentecostés de 33. El espíritu sella a los creyentes."}
    - {v: 15-23, type: letter, mentions: [person:jesus, event:resurreccion-de-jesus], note: "Pablo da gracias por su fe y pide que entiendan su esperanza y el poder con que Dios resucitó a Cristo, lo sentó a su derecha sobre toda autoridad y lo hizo cabeza de la congregación, su cuerpo."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    note: "Los ungidos, antes muertos por sus pecados, reciben vida por bondad inmerecida. Con su muerte Cristo quita la Ley que separaba a judíos y gentiles y los une en un templo para Jehová. Sin sucesos nuevos."
    spans:
    - {v: 1-3, type: letter, entities: [letter:efesios, person:satanas], mentions: [person:adan], note: "Antes de ser cristianos estaban muertos por sus pecados y seguían la corriente del mundo y a su gobernante del aire, que la nota identifica con Satanás. Por el pecado heredado de Adán eran hijos de la ira."}
    - {v: 4-10, type: letter, mentions: [person:jesus], note: "Dios, rico en misericordia, les dio vida con Cristo y los sentó con él en los lugares celestiales. La salvación llega por la fe, como regalo y no por obras; son obra suya, creados para hacer el bien."}
    - {v: 11-13, type: letter, mentions: [person:jesus, event:muerte-de-jesus], note: "Los gentiles, a quienes los judíos llamaban incircuncisión, vivían apartados de Israel como nación, ajenos a los pactos de la promesa, sin esperanza y sin Dios. La sangre de Cristo los ha acercado."}
    - {v: 14-18, type: letter, mentions: [person:jesus, event:muerte-de-jesus, event:pacto-de-la-ley, place:jerusalen, event:arresto-en-el-templo, event:pablo-predica-dos-anos-en-roma, place:roma], note: "Cristo derriba el muro entre los dos grupos, la Ley, y los reconcilia en un cuerpo por el madero. La nota ve aludida la barrera del templo de Jerusalén, por la que acusaron a Pablo y acabó preso en Roma."}
    - {v: 19-22, type: letter, mentions: [person:jesus], note: "Ya no son extranjeros, sino conciudadanos de los santos y familia de Dios, edificados sobre apóstoles y profetas con Cristo como piedra angular: un templo santo para Jehová. Perspicacia lo contrasta con el templo de Ártemis."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    note: "Pablo, preso, explica su encargo con las naciones y el secreto sagrado que las hace coherederas con los judíos, y ora por los efesios. Sin sucesos nuevos fuera de la propia carta."
    spans:
    - {v: 1-7, type: letter, entities: [letter:efesios, person:pablo, event:pablo-escribe-efesios, relation:pablo/lived_in/roma], mentions: [person:jesus, place:roma, event:pablo-predica-dos-anos-en-roma, event:arresto-en-el-templo, place:judea], note: "Pablo, prisionero por servir a los gentiles, recibió por revelación el secreto sagrado: los de las naciones son coherederos del mismo cuerpo. La nota recuerda su arresto en Judea y lo pone en Roma, c. 59-61."}
    - {v: 8-13, type: letter, entities: [person:pablo, event:pablo-escribe-efesios], mentions: [person:jesus, place:efeso], note: "Pablo, el menor de los santos, anuncia a las naciones las riquezas del Cristo; por la congregación los ángeles conocen la sabiduría de Dios. Que los de Éfeso no se desanimen por lo que él sufre."}
    - {v: 14-19, type: letter, mentions: [person:jesus], note: "Oración de rodillas al Padre, de quien toman nombre todas las familias del cielo y de la tierra: que el espíritu los fortalezca, que el Cristo viva en su corazón y que conozcan su amor."}
    - {v: 20-21, type: letter, mentions: [person:jesus], note: "Alabanza final de la oración: Dios puede hacer mucho más de lo que se le pide; gloria a él por la congregación y por Cristo Jesús para siempre."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    note: "Consejos para la unidad de la congregación, los hombres que Cristo dio como regalos al subir al cielo, y la nueva personalidad frente a la conducta de las naciones."
    spans:
    - {v: 1-6, type: letter, entities: [letter:efesios, person:pablo, event:pablo-escribe-efesios], mentions: [person:jesus, place:efeso, event:discipulos-de-juan-en-efeso], note: "Pablo, preso por el Señor, pide humildad, paciencia y unidad: un cuerpo, un espíritu, una esperanza, un Señor, una fe, un bautismo, un Dios. La nota del v. 5 recuerda a los unos doce hombres que Pablo bautizó en Éfeso."}
    - {v: 7-10, type: letter, entities: [event:ascension-de-jesus], mentions: [person:jesus, event:david-rey-de-todo-israel], note: "Cita Sl 68:18 sin nombrar a David. Según la nota, el salmo celebra la toma de Jerusalén y Pablo lo aplica a Jesús, que bajó a la tierra y subió por encima de los cielos dando hombres como regalos."}
    - {v: 11-16, type: letter, mentions: [person:jesus, place:efeso, event:ascension-de-jesus], note: "Cristo dio apóstoles, profetas, evangelizadores, pastores y maestros para que el cuerpo madure y no lo arrastren tramposos. La nota ve en los evangelizadores a misioneros y liga las coyunturas a una escuela médica de Éfeso."}
    - {v: 17-24, type: letter, mentions: [person:jesus, place:efeso], note: "Que no vivan como las naciones, con la mente vacía y el corazón endurecido; que se quiten la vieja personalidad y se pongan la nueva. Perspicacia «Efesios» lo relaciona con la superstición y la inmoralidad de Éfeso."}
    - {v: 25-32, type: letter, mentions: [person:satanas, person:jesus, place:efeso, event:despedida-en-mileto], note: "Hablar verdad (Zac 8:16, sin nombrar al profeta), enojarse sin pecar (Sl 4:4), no dejar sitio al Diablo, no robar sino trabajar, edificar al hablar, perdonar. La nota recuerda el ejemplo de Pablo ante los ancianos de Éfeso."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    note: "Consejo de la carta, sin sucesos ni lugares en el texto: imitar a Dios, andar como hijos de la luz, aprovechar el tiempo, y la sujeción y el amor entre esposa y esposo, como Cristo con la congregación."
    spans:
    - {v: 1-2, type: letter, entities: [letter:efesios], mentions: [person:jesus, event:muerte-de-jesus], note: "Imiten a Dios como hijos queridos y anden en amor, igual que el Cristo, que se dio por ellos como ofrenda de olor agradable a Dios. La nota une este «por lo tanto» a Ef 4:32."}
    - {v: 3-5, type: letter, mentions: [person:jesus, place:efeso], note: "Ni se nombren entre santos la inmoralidad sexual, la impureza ni la codicia, que es idolatría; nada de bromas obscenas. Según la nota, en Éfeso eran corrientes, incluso en fiestas de la diosa Deméter, sin ficha."}
    - {v: 6-14, type: letter, mentions: [person:jesus], note: "Que nadie los engañe con palabras vacías. Antes eran oscuridad y ahora son luz: que anden como hijos de la luz y destapen las obras oscuras. El texto no dice de dónde sale la cita del v. 14."}
    - {v: 15-20, type: letter, mentions: [person:jesus, place:efeso], note: "Que vivan como sabios y compren el tiempo oportuno, que según la nota era de relativa libertad en Éfeso. Nada de borracheras, comunes en las fiestas de Dioniso, dios sin ficha; que canten salmos a Jehová."}
    - {v: 21-24, type: letter, mentions: [person:jesus], note: "Sujeción mutua por respeto a Cristo. Las esposas, sujetas a sus esposos como la congregación a Cristo, que es su cabeza y su salvador."}
    - {v: 25-33, type: letter, mentions: [person:jesus, event:muerte-de-jesus, event:creacion-de-eva], note: "Los esposos amen a sus esposas como Cristo a la congregación, por la que se entregó y a la que limpia con la palabra. Cita Gé 2:24 sin nombrar a Adán ni a Eva. La esposa respete al esposo."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    note: "Consejos a hijos, padres, esclavos y amos; la armadura que Dios da contra el Diablo; Pablo, preso, pide oración y envía a Tíquico con la carta. Despedida."
    spans:
    - {v: 1-4, type: letter, entities: [event:diez-mandamientos], note: "Hijos, obedezcan a sus padres: honrarlos, quinto de los Diez Mandamientos (Éx 20:12; Dt 5:16), es según la nota el primer mandato con promesa. Los padres varones no irriten a sus hijos; que los críen con la disciplina de Jehová."}
    - {v: 5-9, type: letter, mentions: [person:jesus], note: "Los esclavos obedezcan a sus amos de corazón, como sirviendo a Cristo y a Jehová, que premia el bien. Los amos, sin amenazas: los dos tienen el mismo Amo en el cielo, que no hace favoritismos."}
    - {v: 10-13, type: letter, entities: [person:satanas], mentions: [place:efeso], note: "Pónganse la armadura de Dios contra las trampas del Diablo: la lucha es contra fuerzas espirituales malvadas, no humanas. La nota de estudio dice que son Satanás y sus demonios, y Perspicacia «Efesios», que Éfeso estaba llena de magia."}
    - {v: 14-18, type: letter, entities: [person:satanas], note: "Las piezas de la armadura, que la nota compara con la del soldado romano: cinturón, coraza, calzado, escudo que apaga las flechas del Maligno, casco y espada. Añade la oración constante por todos los santos."}
    - {v: 19-20, type: letter, entities: [person:pablo, relation:pablo/lived_in/roma, event:pablo-escribe-efesios], mentions: [place:roma, event:pablo-predica-dos-anos-en-roma], note: "Pablo pide que oren para que hable con valor, como embajador encadenado. La nota dice que escribe preso en Roma y que Hch 28:30, 31 muestra que esa oración tuvo respuesta."}
    - {v: 21-22, type: letter, entities: [letter:efesios, event:pablo-envia-a-tiquico-a-efeso-y-colosas, person:tiquico, relation:tiquico/accompanies/pablo@60, person:pablo], mentions: [place:efeso, place:roma, place:colosas, person:onesimo, letter:colosenses], note: "Tíquico, hermano querido y ministro fiel, les llevará noticias de Pablo y los animará. Perspicacia «Tíquico» dice que salió de Roma con esta carta y la de Colosas, junto a Onésimo."}
    - {v: 23-24, type: letter, mentions: [person:jesus], note: "Despedida: que el Padre y el Señor Jesucristo den a los hermanos paz, amor y fe, y que la bondad inmerecida acompañe a quienes aman al Señor con un amor que no se corrompe."}
