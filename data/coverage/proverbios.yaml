    - {v: 1-7, type: poetry, entities: [event:hombres-de-ezequias-copian-proverbios-de-salomon, person:salomon, person:ezequias], mentions: [place:juda, period:ezequias], note: "Encabezamiento de la colección de los capítulos 25 a 29: proverbios de Salomón copiados por los hombres de Ezequías. Dios oculta y los reyes investigan; apartar al malvado afianza el trono; no darse importancia ante el rey."}
    - {v: 8-15, type: poetry, note: "No correr a pleitear ni revelar confidencias. La palabra oportuna es como manzanas de oro en plata; el mensajero fiel refresca como nieve en la siega; la lengua suave quiebra un hueso."}
    - {v: 16-28, type: poetry, note: "Comer miel con medida y no cansar al vecino. Dar pan al enemigo es amontonar brasas sobre su cabeza, para ablandarlo, según la nota. Quien no domina su genio es una ciudad sin muralla."}
