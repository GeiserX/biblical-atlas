    - {v: 11-22, type: poetry, note: "El hijo sabio da al padre respuesta ante quien lo desafía. La esposa que riñe es una gotera; el hierro afila al hierro. Seol y Abadón (v. 20, nota) no son lugares del mapa."}
    - {v: 23-27, type: poetry, note: "Cuidar el rebaño, porque la riqueza y la corona no duran: los corderos dan ropa, los machos cabríos el precio de un campo y las cabras leche para la casa."}
