    spans:
    - {v: 1-5, type: poetry, note: "Guardar los mandamientos como la pupila del ojo y tratar a la sabiduría como a una hermana protege de la mujer inmoral."}
    - {v: 6-23, type: poetry, mentions: [place:egipto], note: "Escena vista desde una ventana: al caer la noche, una casada vestida de prostituta seduce a un joven sin juicio, que la sigue como toro al matadero. Sin nombres ni fecha: enseñanza, no evento. Su colcha es lino egipcio."}
    - {v: 24-27, type: poetry, note: "Aviso final a los hijos: ella ha hecho caer a muchos y su casa es camino a la Tumba, el Seol."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-21, type: poetry, note: "La sabiduría llama en los cruces y en las puertas: sus palabras son rectas, vale más que el oro y la plata, por ella gobiernan reyes y príncipes, y enriquece a quienes la aman."}
    - {v: 22-31, type: poetry, mentions: [person:jesus], note: "La sabiduría dice que Jehová la produjo antes que nada y estuvo a su lado como obrero experto al hacer la tierra. Perspicacia «Jesucristo» ve aquí al Hijo antes de ser hombre (Jn 1:1-3; Col 1:15-17)."}
    - {v: 32-36, type: poetry, note: "Felices los que la escuchan y la esperan a sus puertas cada día: hallan vida y el favor de Jehová. Quien la odia ama la muerte."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: poetry, note: "La sabiduría construye su casa con siete columnas, prepara carne y vino, pone la mesa y envía a sus criadas a invitar desde lo alto de la ciudad a los inexpertos."}
    - {v: 7-12, type: poetry, note: "Reprender al burlón trae insultos; al sabio lo hace más sabio. Respetar a Jehová es el principio de la sabiduría, y ella alarga la vida de quien la tiene."}
    - {v: 13-18, type: poetry, note: "La mujer necia, sentada a su puerta, invita con las mismas palabras a los que pasan y promete agua robada; sus invitados terminan en la Tumba, el Seol."}
  10:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: poetry, mentions: [person:salomon], note: "Encabezamiento «Proverbios de Salomón», que abre la segunda sección del libro. El hijo sensato alegra a sus padres; lo robado no sirve; Jehová sostiene al justo; el diligente cosecha y el perezoso se avergüenza."}
    - {v: 6-14, type: poetry, note: "Contraste entre justo y malvado en su fama y en su habla: la boca del justo da vida, el odio enciende peleas y el amor tapa las faltas; el sabio guarda conocimiento y el necio se arruina hablando."}
    - {v: 15-21, type: poetry, note: "Riqueza y pobreza, el fruto del esfuerzo, aceptar la corrección, el odio disimulado y la murmuración. Quien habla mucho acaba pecando; frenar la lengua es prudente y las palabras del justo valen como plata y alimentan a otros."}
    - {v: 22-32, type: poetry, note: "La bendición de Jehová enriquece sin traer pena. Temerle alarga los días; el justo se mantiene firme como un cimiento y el malvado desaparece tras la tormenta. El perezoso irrita a quien lo manda como humo en los ojos."}
  11:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-11, type: poetry, note: "Jehová aborrece la balanza trucada y se complace en la pesa justa. El orgullo trae deshonra y la modestia, sabiduría; la rectitud salva y guía, la maldad derriba a su dueño. Una ciudad celebra el bien de los justos."}
    - {v: 12-15, type: poetry, note: "Callar ante el prójimo en vez de despreciarlo, guardar un secreto frente al chismoso, buscar muchos consejeros y no avalar la deuda de un desconocido, que se sellaba dándose la mano."}
    - {v: 16-23, type: poetry, note: "La mujer amable gana honra; la bondad beneficia a quien la practica y la crueldad lo daña. Quien siembra justicia cosecha de verdad. La mujer bella sin sensatez es como un cerdo con una argolla dorada en el morro."}
    - {v: 24-31, type: poetry, note: "El generoso prospera y el tacaño empobrece; el pueblo maldice al que retiene el grano. Confiar en la riqueza hace caer; el justo florece, su fruto es árbol de vida y el sabio gana almas."}
  12:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: poetry, note: "Amar la corrección es amar el saber. Jehová aprueba al bueno y condena al intrigante. Una esposa capaz es la corona de su marido y la que avergüenza le pudre los huesos. La casa del justo sigue en pie."}
    - {v: 8-14, type: poetry, note: "Se alaba la prudencia; más vale ser humilde con un criado que presumir sin pan. El justo atiende a sus animales, el que trabaja su tierra tiene pan y cada uno recoge el fruto de sus palabras y sus manos."}
    - {v: 15-23, type: poetry, note: "El necio cree tener razón, se irrita enseguida y lo suelta todo; el sabio escucha consejo y pasa por alto la ofensa. La verdad dura, la mentira es breve, y Jehová aborrece los labios falsos."}
    - {v: 24-28, type: poetry, note: "La mano diligente gobierna y la floja acaba en trabajo forzado. La inquietud abate y una palabra amable anima. El perezoso no caza su presa; la senda de la justicia conduce a la vida, no a la muerte."}
  13:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: poetry, note: "El hijo sabio acepta la corrección de su padre y el burlón no. Cuidar lo que uno dice protege la vida; el perezoso desea sin obtener y el diligente se sacia. La justicia guarda al íntegro."}
    - {v: 7-12, type: poetry, note: "Hay quien finge riqueza y quien finge pobreza. La luz del justo brilla y la del malvado se apaga. El orgullo provoca riñas; lo ganado deprisa mengua; la espera larga enferma y el deseo logrado es árbol de vida."}
    - {v: 13-19, type: poetry, note: "Respetar el mandato trae premio; la enseñanza del sabio aparta de los lazos de la muerte. El entendimiento gana favor, el prudente obra con saber, el mensajero leal sana y quien acepta la reprensión recibe honra."}
    - {v: 20-25, type: poetry, note: "Quien camina con sabios se vuelve sabio. El bueno deja herencia a sus nietos; la injusticia puede arruinar el campo del pobre. No usar la vara es no querer al hijo; el justo come hasta saciarse."}
  14:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: poetry, note: "La mujer sabia levanta su casa y la necia la destruye. Quien va recto teme a Jehová. Sin bueyes no hay cosecha; el testigo leal no miente; el burlón no halla sabiduría y los necios se ríen de la culpa."}
    - {v: 10-19, type: poetry, note: "Nadie más conoce la pena o la alegría de un corazón. Un camino que parece bueno puede acabar en muerte; el ingenuo lo cree todo y el prudente mira dónde pisa; el iracundo hace tonterías."}
    - {v: 20-27, type: poetry, note: "Al pobre lo rechazan hasta sus vecinos y al rico le sobran amigos; es feliz quien se compadece del necesitado. El esfuerzo da provecho y la charla, miseria. Temer a Jehová da seguridad y aparta de la muerte."}
    - {v: 28-35, type: poetry, note: "El rey se gloría en un pueblo numeroso. La paciencia es discernimiento y la envidia pudre los huesos. Oprimir al pobre ofende a su Hacedor; la justicia enaltece a una nación y el rey favorece al siervo perspicaz."}
  15:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: poetry, note: "La respuesta suave calma la ira y la áspera la enciende. Jehová lo ve todo, a malos y buenos. Una lengua serena es árbol de vida; el prudente acepta la corrección de su padre y los sabios difunden conocimiento."}
    - {v: 8-15, type: poetry, note: "Jehová rechaza el sacrificio del malvado y se complace en la oración del recto. La Tumba (Seol) y el lugar de destrucción (Abadón) están a su vista: no son lugares del mapa. El corazón alegre ilumina la cara."}
    - {v: 16-23, type: poetry, note: "Más vale poco con temor de Jehová que mucho con angustia, y verduras con amor que carne con odio. El colérico enciende peleas; el hijo sabio alegra a su padre; los planes salen con muchos consejeros."}
    - {v: 24-33, type: poetry, note: "La senda de la vida aparta de la Tumba. Jehová derriba la casa del orgulloso, protege el lindero de la viuda y escucha al justo, que piensa antes de responder. La humildad precede a la honra."}
  16:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: poetry, note: "El hombre hace sus planes, pero la respuesta y el rumbo los da Jehová, que pesa los motivos. Encomendarle las obras las asegura; el amor leal cubre la culpa y Jehová puede reconciliar a alguien con sus enemigos."}
    - {v: 10-15, type: poetry, note: "Sobre el rey: debe juzgar con justicia y aborrecer el mal, y valora a quien le habla con rectitud. Su ira anuncia muerte, pero el sabio la apacigua; su favor es como la nube de la lluvia tardía."}
    - {v: 16-25, type: poetry, note: "Adquirir sabiduría vale más que el oro. El orgullo precede al desastre y la arrogancia, a la caída; más vale ser humilde. Las palabras amables son miel para el alma. Un camino que parece bueno puede llevar a la muerte."}
    - {v: 26-33, type: poetry, note: "El hambre hace trabajar al obrero. El inútil, el chismoso y el violento siembran daño. Las canas son corona si hay justicia; dominarse vale más que tomar una ciudad. Las suertes se echan, pero la decisión viene de Jehová."}
  17:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: poetry, note: "Mejor pan seco con paz que banquetes con riñas. Un siervo sensato puede heredar con los hijos. Jehová prueba los corazones como el fuego prueba los metales; burlarse del pobre ofende a su Hacedor. Los nietos honran a los ancianos."}
    - {v: 7-14, type: poetry, note: "El soborno parece abrir todas las puertas. Perdonar una falta fomenta el amor y repetirla separa amigos. Una reprensión pesa más en el sensato que cien golpes en el necio. Una riña es agua que se escapa: córtala pronto."}
    - {v: 15-20, type: poetry, note: "Jehová aborrece absolver al malvado y condenar al justo. El amigo verdadero ama siempre y es un hermano en la desgracia. No es sensato avalar al prójimo; quien ama la pelea y agranda su puerta busca su ruina."}
    - {v: 21-28, type: poetry, note: "Un hijo necio amarga a su padre y a su madre. La alegría sana y la tristeza seca los huesos. El soborno tuerce la justicia. Quien sabe mide sus palabras; hasta el necio pasa por sabio si calla."}
  18:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: poetry, note: "Quien se aísla solo busca lo suyo. El necio solo quiere opinar, y su boca le trae golpes y ruina. No hay que favorecer al malvado. El chisme se traga con gusto; el perezoso es hermano del que destruye."}
    - {v: 10-15, type: poetry, note: "El nombre de Jehová es una torre segura para el justo, mientras el rico confía en su dinero como en una muralla. La soberbia precede a la caída; contestar sin escuchar es necio. El ánimo sostiene en la enfermedad."}
    - {v: 16-24, type: poetry, note: "Un regalo da acceso a los poderosos. El primero en hablar parece tener razón hasta que interrogan a la otra parte; la suerte zanja pleitos. La lengua tiene poder de vida o muerte; una buena esposa es favor de Jehová."}
  19:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: poetry, note: "Más vale pobre íntegro que necio mentiroso. El hombre se equivoca por su necedad y luego culpa a Jehová. La riqueza atrae amigos y al pobre lo dejan hasta sus hermanos; el testigo falso tendrá su castigo."}
    - {v: 8-15, type: poetry, note: "Adquirir sensatez es quererse. El necio no está hecho para el lujo. Pasar por alto una ofensa honra; la ira del rey ruge como un león. La esposa que discute es gotera constante y la prudente es regalo de Jehová."}
    - {v: 16-23, type: poetry, note: "Quien guarda el mandato conserva la vida. Ayudar al necesitado es prestar a Jehová, que lo devolverá. Hay que corregir al hijo a tiempo. Los hombres hacen muchos planes, pero se cumple el propósito de Jehová; temerle da descanso."}
    - {v: 24-29, type: poetry, note: "El perezoso no lleva la mano a la boca; golpear al burlón enseña al ingenuo. Maltratar al padre y echar a la madre avergüenza. Sin disciplina se pierde el saber. El testigo inútil desprecia la justicia; al burlón, condena."}
  20:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: poetry, note: "El vino y el licor engañan a quien se deja llevar. Enfurecer al rey arriesga la vida; evitar riñas honra. El perezoso no ara y luego mendiga. Alguien fiel es difícil de hallar; los hijos del justo son felices."}
    - {v: 8-15, type: poetry, note: "El rey en su tribunal descubre el mal. Nadie tiene el corazón limpio. Jehová aborrece las pesas desiguales y creó oído y ojo. El comprador desprecia la mercancía y luego presume; el saber vale más que el oro."}
    - {v: 16-23, type: poetry, note: "A quien avala a un extraño se le toma prenda. Lo obtenido con engaño acaba sabiendo a arena. Planes y guerras con buen consejo. Quien maldice a sus padres se apaga. No hay que vengarse, sino esperar a Jehová."}
    - {v: 24-30, type: poetry, note: "Jehová dirige los pasos del hombre. Prometer algo sagrado sin pensarlo es una trampa. El rey sabio aparta a los malvados y el amor leal sostiene su trono. La fuerza honra al joven, las canas al anciano; el castigo corrige."}
  21:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: poetry, note: "Jehová guía el corazón del rey como a un canal de agua y pesa los motivos; obrar con justicia le agrada más que un sacrificio. Lo ganado mintiendo se esfuma como neblina."}
    - {v: 9-19, type: poetry, note: "Mejor un rincón de la azotea o el desierto que convivir con una esposa que riñe (v. 9 y 19). Quien no escucha al pobre no será escuchado; quien ama los placeres acaba pobre."}
    - {v: 20-31, type: poetry, note: "El sabio guarda aceite y bienes y derriba la fortaleza de los fuertes; quien cuida su lengua se ahorra apuros. Ningún plan vale contra Jehová: el caballo se prepara, pero la victoria es suya."}
  22:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-16, type: poetry, note: "Un buen nombre vale más que la riqueza; Jehová hizo al rico y al pobre. Educar al niño en su camino dura toda la vida, y la vara aparta la necedad."}
    - {v: 17-21, type: poetry, note: "Empiezan las palabras de los sabios: el maestro pide guardarlas dentro para confiar en Jehová y responder con verdad. Perspicacia las atribuye a otros sabios; La Atalaya de 2006 solo saca de Salomón los capítulos 30 y 31."}
    - {v: 22-29, type: poetry, note: "No despojar al pobre en la puerta de la ciudad, pues Jehová lo defiende; no juntarse con el iracundo ni salir fiador; no mover los mojones antiguos. El hábil servirá ante reyes."}
  23:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: poetry, note: "En la mesa de un rey o de un tacaño hay que frenar el apetito, porque su comida engaña. No agotarse por hacerse rico: la riqueza echa alas como el águila y se va."}
    - {v: 9-18, type: poetry, note: "No malgastar palabras con el necio ni invadir el campo del huérfano, que tiene un Defensor fuerte. La vara salva al muchacho de la Tumba; el padre se alegra si el hijo es sabio y teme a Jehová."}
    - {v: 19-28, type: poetry, note: "Evitar a los borrachos y a los glotones, que terminan en harapos; escuchar al padre y no despreciar a la madre anciana; comprar la verdad sin venderla. La prostituta es un pozo angosto."}
    - {v: 29-35, type: poetry, note: "Retrato del que abusa del vino: quejas, heridas sin motivo y ojos apagados. El vino rojo acaba mordiendo como una víbora; el borracho se siente mecido en el mástil y aún pide otro trago."}
  24:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-12, type: poetry, note: "No envidiar a los malos. La sabiduría construye y llena la casa; la guerra se gana con muchos consejeros. Rescatar a quien va a la muerte, pues el que examina los corazones paga a cada uno."}
    - {v: 13-22, type: poetry, note: "La sabiduría es dulce como la miel. El justo cae siete veces y se levanta. No festejar la caída del enemigo; temer a Jehová y al rey, no unirse a rebeldes (según la nota, «ellos dos» son ambos)."}
    - {v: 23-34, type: poetry, note: "Más dichos de los sabios: no favorecer a nadie al juzgar, responder con franqueza, preparar el campo antes que la casa, no devolver el mal. La viña del perezoso, llena de ortigas, enseña que la pobreza llega como un asaltante."}
  25:
    status: complete
