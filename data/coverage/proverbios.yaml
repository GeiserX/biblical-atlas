    - {v: 8-19, type: poetry, note: "El padre pide al hijo que no se junte con los pecadores que planean emboscadas para robar: la avaricia violenta mata a quien la practica. La Tumba es el Seol, no un lugar del mapa."}
    - {v: 20-33, type: poetry, note: "La sabiduría, personificada, llama en las calles y junto a las puertas de la ciudad. Quien desprecia su corrección cosechará su desgracia; quien le hace caso vivirá tranquilo."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: poetry, note: "Si el hijo busca el discernimiento con el empeño de quien busca plata escondida, llegará a entender el temor de Jehová, que da la sabiduría y cuida a los que le son leales."}
    - {v: 10-22, type: poetry, note: "La sabiduría lo librará del hombre perverso y de la mujer inmoral que deja al esposo de su juventud. Los rectos seguirán en la tierra; los malvados serán arrancados de ella."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-12, type: poetry, note: "Confiar en Jehová de todo corazón, honrarlo con lo mejor de lo que uno tiene y aceptar su corrección, que es la de un padre que quiere a su hijo. Heb 12:5, 6 cita los v. 11 y 12."}
    - {v: 13-26, type: poetry, note: "La sabiduría vale más que la plata, el oro y los corales, y es árbol de vida. Con ella Jehová fundó la tierra y los cielos; quien la guarda anda y duerme sin miedo."}
    - {v: 27-35, type: poetry, note: "Hacer el bien al prójimo si está en nuestra mano, no tramar contra él ni envidiar al violento. Jehová bendice la casa del justo y favorece al humilde; Santiago 4:6 cita el v. 34."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: poetry, mentions: [person:salomon, person:david, person:bat-seba], note: "El padre cuenta que su propio padre le enseñaba a conseguir sabiduría por encima de todo. Las referencias del v. 3 remiten a David (1Re 2:12) y a Bat-Seba (1Re 1:16-21), los padres de Salomón."}
    - {v: 10-19, type: poetry, note: "Dos caminos: la senda del justo brilla cada vez más, como la luz desde el alba hasta el mediodía; la del malvado está a oscuras y ni sabe en qué tropieza."}
    - {v: 20-27, type: poetry, note: "Proteger el corazón antes que nada, porque de él sale la vida; alejar el habla torcida, mirar al frente y no desviarse a ningún lado."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-14, type: poetry, note: "Aviso contra la mujer descarriada: al principio sus palabras son miel y al final amargan como el ajenjo. Quien se le acerca pierde honra y bienes y acaba lamentándose. La Tumba es el Seol."}
    - {v: 15-23, type: poetry, note: "Beber del propio pozo: disfrutar de la esposa de la juventud y no de extrañas. Jehová ve cada paso del hombre, y el malvado queda atado por las cuerdas de su propio pecado."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: poetry, note: "Quien salió fiador de otro tiene que librarse cuanto antes, rogando con humildad a su prójimo, igual que la gacela escapa del cazador."}
    - {v: 6-11, type: poetry, note: "El perezoso debe aprender de la hormiga, que sin jefe alguno junta su comida en verano. Dormir de más trae la pobreza de golpe."}
    - {v: 12-19, type: poetry, note: "El hombre inútil engaña con gestos y palabras y siembra peleas. Siete cosas detesta Jehová, desde los ojos altivos hasta quien enfrenta a hermanos."}
    - {v: 20-35, type: poetry, note: "Los mandatos del padre y de la madre guardan del adulterio: nadie lleva brasas en el pecho sin quemarse. El ladrón devuelve siete veces; el esposo celoso no acepta rescate."}
  7:
    status: complete
