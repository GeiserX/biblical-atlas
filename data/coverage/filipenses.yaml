# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: filipenses
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    note: "Saludo desde la prisión de Roma, gracias y oración por los filipenses, efectos del encierro de Pablo, su duda entre vivir y morir y su confianza en volver a verlos. El suceso es la propia carta."
    spans:
    - {v: 1-2, type: letter, entities: [letter:filipenses, event:pablo-escribe-filipenses, person:pablo, person:timoteo, relation:timoteo/accompanies/pablo, relation:timoteo/lived_in/roma, place:filipos], mentions: [person:jesus, place:roma, event:pablo-predica-dos-anos-en-roma], note: "Pablo y Timoteo, esclavos de Cristo, saludan a los santos de Filipos con sus superintendentes y siervos ministeriales. La nota dice que Timoteo estaba con Pablo en su primer encierro en Roma."}
    - {v: 3-6, type: letter, mentions: [person:lidia, event:lidia-se-bautiza], note: "Pablo da gracias con alegría porque los filipenses apoyan las buenas noticias desde que las oyeron. La nota ve posible que piense en la hospitalidad de Lidia."}
    - {v: 7-11, type: letter, entities: [person:pablo, relation:pablo/lived_in/roma, event:pablo-escribe-filipenses], mentions: [event:pablo-apela-a-cesar, person:neron, person:epafrodito, place:roma, place:jerusalen, event:arresto-en-el-templo, place:cesarea, event:traslado-a-cesarea], note: "Comparten sus cadenas y la defensa legal de las buenas noticias. La nota recuerda su arresto en Jerusalén y su apelación a César en Cesarea; espera juicio en Roma, ante Nerón o un delegado. Ora por que su amor crezca."}
    - {v: 12-14, type: letter, entities: [person:pablo, event:pablo-escribe-filipenses], mentions: [event:llegada-a-roma, event:pablo-predica-dos-anos-en-roma], note: "Su prisión ha ayudado a difundir las buenas noticias: toda la guardia pretoriana, cuerpo de élite sin ficha, sabe por qué está encadenado, y los hermanos hablan con más valor."}
    - {v: 15-18, type: letter, mentions: [person:jesus], note: "Unos predican al Cristo por envidia y rivalidad, para causarle problemas; otros, por amor. La nota cree que los primeros serían judíos convertidos. De un modo u otro se anuncia a Cristo, y eso le alegra."}
    - {v: 19-26, type: letter, entities: [person:pablo, event:pablo-queda-libre], mentions: [person:jesus, place:filipos], note: "Confía en quedar libre gracias a sus ruegos; la nota admite también la salvación eterna. Dividido entre morir y seguir sirviendo, cree que vivirá y volverá a Filipos."}
    - {v: 27-30, type: letter, entities: [event:pablo-y-silas-azotados-y-encarcelados], mentions: [place:filipos], note: "Que se porten como ciudadanos dignos de las buenas noticias, unidos y sin miedo. Libran la lucha que vieron sufrir a Pablo; la referencia remite a los azotes y la cárcel de Filipos (Hch 16:22, 23)."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    note: "Llamada a la unidad y a la humildad con el ejemplo de Cristo, planes de Pablo de enviar a Timoteo e ir él mismo, y el regreso de Epafrodito, que enfermó en Roma, con la carta."
    spans:
    - {v: 1-4, type: letter, entities: [letter:filipenses], note: "Si hay ánimo, consuelo y cariño entre ellos, que completen la alegría de Pablo con un mismo sentir: nada por rivalidad ni egocentrismo, considerando a los demás superiores y mirando por sus intereses."}
    - {v: 5-11, type: letter, entities: [person:jesus], mentions: [event:muerte-de-jesus, event:resurreccion-de-jesus], note: "Tengan la actitud de Cristo: existía en forma de Dios y no quiso igualarse a él; se hizo hombre y obedeció hasta morir en un madero. Según la nota, tras resucitarlo Dios le dio un nombre superior."}
    - {v: 12-18, type: letter, mentions: [person:pablo, place:filipos], note: "Que sigan trabajando por su salvación, sin murmurar, y brillen como luces en una generación torcida. Pablo se alegra aunque su vida se derrame como libación; la nota recuerda que Filipos era colonia romana."}
    - {v: 19-24, type: letter, entities: [person:timoteo, relation:timoteo/accompanies/pablo, relation:timoteo/lived_in/roma, person:pablo, event:pablo-queda-libre], mentions: [person:jesus, place:roma], note: "Pablo piensa enviarles pronto a Timoteo, que le sirvió como un hijo, en cuanto sepa cómo acaba su caso, y espera ir él mismo. La nota calcula unos 40 días por tierra, por las vías Apia y Egnatia."}
    - {v: 25-30, type: letter, entities: [letter:filipenses, person:epafrodito, relation:epafrodito/accompanies/pablo, relation:epafrodito/lived_in/filipos, event:epafrodito-lleva-a-pablo-el-regalo-de-filipos, event:pablo-envia-a-epafrodito-de-vuelta-a-filipos, journey:epafrodito-de-filipos-a-roma], mentions: [place:roma, place:filipos, event:pablo-escribe-filipenses], note: "Epafrodito, enviado por ellos para ayudar a Pablo, estuvo a punto de morir enfermo. Pablo lo devuelve para que se alegren y pide que lo reciban bien y estimen a hombres como él."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    note: "Pablo previene contra los que exigen la circuncisión, repasa sus méritos, que ahora tiene por basura al lado de conocer a Cristo, y anima a correr hacia el premio celestial. Solo recuerda un suceso: su persecución de la congregación."
    spans:
    - {v: 1-3, type: letter, entities: [letter:filipenses], mentions: [person:jesus], note: "Que se alegren siempre en el Señor. Pablo avisa contra los «perros», que según la nota son maestros judaizantes que mutilan la carne; los cristianos llevan la circuncisión verdadera, la del corazón, y presumen de Cristo Jesús."}
    - {v: 4-6, type: letter, entities: [person:pablo, relation:pablo/kin/abrahan, relation:pablo/kin/isaac, relation:pablo/kin/benjamin-hijo-de-jacob, event:saulo-persigue-a-la-congregacion], mentions: [person:benjamin-hijo-de-jacob], note: "Nadie tendría más motivos que él para confiar en la carne: circuncidado al octavo día, israelita, benjaminita, hebreo nacido de hebreos, fariseo y tan celoso que persiguió a la congregación. Israel aquí es el pueblo, sin ficha."}
    - {v: 7-11, type: letter, mentions: [person:jesus, person:gamaliel-fariseo, event:resurreccion-de-jesus, event:muerte-de-jesus], note: "Esas ventajas, que la nota enumera (ciudadano romano, fariseo, alumno de Gamaliel), las cuenta ahora como pérdida y basura para ganar a Cristo. Quiere conocer el poder de su resurrección, morir como él y lograr la resurrección más temprana."}
    - {v: 12-16, type: letter, mentions: [person:jesus], note: "Aún no tiene el premio: como un corredor, se olvida de lo que deja atrás y se estira hacia delante, hacia la meta de la llamada celestial. Los maduros piensen igual y sigan avanzando por ese camino."}
    - {v: 17-21, type: letter, mentions: [person:jesus, event:muerte-de-jesus, place:filipos], note: "Que lo imiten. Muchos viven como enemigos del madero del Cristo y su dios es su vientre. La ciudadanía cristiana está en los cielos; la nota la contrasta con la de Filipos, colonia romana. Jesús transformará su cuerpo humilde."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    note: "Pablo pide unidad a Evodia y Síntique, anima a la alegría, a la oración y a pensar en lo bueno, agradece lo que Filipos le mandó a Tesalónica y ahora a Roma con Epafrodito, y cierra la carta."
    spans:
    - {v: 1-3, type: letter, entities: [letter:filipenses, person:evodia, person:sintique, person:clemente, person:pablo, relation:evodia/accompanies/pablo, relation:sintique/accompanies/pablo, relation:clemente/accompanies/pablo, relation:evodia/accompanies/clemente, relation:sintique/accompanies/clemente, relation:evodia/lived_in/filipos, relation:sintique/lived_in/filipos], mentions: [place:filipos, place:roma], note: "Pablo ruega a Evodia y Síntique, que lucharon con él y con Clemente por las buenas noticias, que piensen igual en el Señor, y encarga a un compañero de yugo sin nombre que las ayude. Escribe preso en Roma."}
    - {v: 4-7, type: letter, mentions: [person:jesus], note: "Alégrense siempre; que todos los vean razonables, porque el Señor está cerca. En vez de angustiarse, presenten a Dios sus peticiones con gratitud, y su paz, que nadie puede comprender, guardará por Cristo su corazón y su mente."}
    - {v: 8-9, type: letter, note: "Que llenen la mente de lo verdadero, serio, justo, casto, amable, de buena fama, virtuoso y digno de alabanza, y que hagan lo que aprendieron y vieron en Pablo. El Dios de la paz estará con ellos."}
    - {v: 10-14, type: letter, entities: [event:epafrodito-lleva-a-pablo-el-regalo-de-filipos, person:pablo], note: "Pablo se alegra de que por fin hayan vuelto a mostrar su interés por él. Ha aprendido a bastarse con poco o con mucho y todo lo puede con la fuerza que Dios le da; aun así, agradece su ayuda."}
    - {v: 15-16, type: letter, entities: [event:los-filipenses-envian-ayuda-a-pablo-en-tesalonica, place:tesalonica, place:filipos], mentions: [place:macedonia, journey:segundo-viaje, person:lidia, event:lidia-se-bautiza, event:alboroto-en-tesalonica, event:los-de-berea-examinan-las-escrituras, event:crispo-cree], note: "Desde el principio, cuando según la nota Lidia hospedó a Pablo, solo Filipos compartió gastos con él al dejar Macedonia y le mandó ayuda dos veces a Tesalónica. La nota remite también a la ayuda que recibió en Corinto."}
    - {v: 17-20, type: letter, entities: [event:epafrodito-lleva-a-pablo-el-regalo-de-filipos, person:epafrodito, relation:epafrodito/accompanies/pablo, relation:epafrodito/lived_in/filipos, journey:epafrodito-de-filipos-a-roma], mentions: [place:roma, place:filipos], note: "No busca regalos, sino el fruto que aumenta el crédito de ellos. Con lo que le entregó Epafrodito tiene de sobra: una ofrenda de olor agradable para Dios, que cubrirá lo que ellos necesiten. Gloria al Padre."}
    - {v: 21-23, type: letter, entities: [event:pablo-escribe-filipenses, person:pablo, relation:pablo/lived_in/roma, place:roma], mentions: [person:neron, person:jesus, event:pablo-predica-dos-anos-en-roma], note: "Saludos a todos los santos. Los hermanos que están con Pablo, y sobre todo los de la casa de César, mandan los suyos; la nota dice que ese César era Nerón, hacia 61. Bendición final."}
