# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: deuteronomio
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [event:primer-discurso-de-moises, person:moises, person:sehon, person:og, place:llanuras-deserticas-de-moab, place:moab, place:suf, place:desierto-de-paran, place:tofel, place:laban, place:hazerot, place:dizahab, place:monte-sinai, place:cades, place:hesbon, place:basan, place:astarot, place:edrei, relation:moises/lived_in/llanuras-deserticas-de-moab, relation:sehon/lived_in/hesbon, relation:og/lived_in/basan, relation:og/lived_in/astarot, relation:og/lived_in/edrei], mentions: [place:rio-jordan, place:seir, event:israel-vence-a-sehon, event:israel-vence-a-og], note: "Día 1 del mes undécimo del año cuarenta. Parán, Hazerot y los demás sitios sirven de referencia. De Horeb a Cadés-Barnea hay once días por el camino de Seír. Los amorreos son un pueblo."}
    - {v: 6-8, type: speech, entities: [event:israel-sale-del-desierto-de-sinai, place:monte-sinai, place:araba, place:sefela, place:negueb, place:canaan, place:libano, place:rio-eufrates], mentions: [person:abrahan, person:isaac, person:jacob], note: "En Horeb, Jehová manda ir a la región montañosa de los amorreos, sin ficha propia, y a sus vecinos hasta el Éufrates. «La costa» no es nombre propio; la nota hace del Líbano la cordillera."}
    - {v: 9-18, type: speech, entities: [event:moises-nombra-jefes-para-juzgar, person:moises], note: "Moisés no podía llevar solo a un pueblo tan numeroso como las estrellas. Nombró jefes de mil, cien, cincuenta y diez, y mandó a los jueces no hacer distinciones; los casos difíciles llegaban a él."}
    - {v: 19-21, type: speech, entities: [event:israel-sale-del-desierto-de-sinai, place:monte-sinai, place:desierto-de-paran, place:cades, journey:del-sinai-a-cades], note: "De Horeb a Cadés-Barnea por el desierto grande y temible, que Perspicacia «Parán» identifica. Allí Moisés anima a subir sin miedo a la región montañosa de los amorreos."}
    - {v: 22-25, type: speech, entities: [event:moises-envia-a-los-doce-espias, event:los-espias-recorren-canaan, event:los-espias-informan-en-cades, place:valle-de-escol, journey:viaje-de-los-doce-espias], note: "La idea de mandar espías sale del pueblo y Moisés la acepta: doce, uno por tribu. Llegan al valle de Escol y vuelven con fruta y con un informe favorable."}
    - {v: 26-33, type: speech, entities: [event:israel-se-niega-a-entrar-en-canaan], mentions: [place:egipto], note: "El pueblo murmura en sus tiendas y cree que Jehová lo odia. Los espías hablaron de gente alta y de los anaquim, un pueblo. Jehová los guiaba con fuego de noche y nube de día."}
    - {v: 34-40, type: speech, entities: [event:jehova-condena-a-israel-a-40-anos-en-el-desierto, person:caleb-hijo-de-jefune, person:josue-hijo-de-nun, person:moises, relation:caleb-hijo-de-jefune/kin/jefune-padre-de-caleb, relation:josue-hijo-de-nun/kin/nun, relation:josue-hijo-de-nun/tie/moises, relation:josue-hijo-de-nun/succeeds/moises], mentions: [person:jefune-padre-de-caleb, person:nun, place:mar-rojo, event:agua-del-penasco-en-meriba, event:moises-nombra-a-josue-su-sucesor], note: "Solo Caleb y los niños de entonces verán la tierra. Moisés tampoco entrará, por lo de Meribá; entrará Josué, que lo sirve. Los demás vuelven al desierto hacia el mar Rojo."}
    - {v: 41-46, type: speech, entities: [event:israel-es-derrotado-hasta-horma, place:seir, place:horma, place:cades, journey:treinta-y-ocho-anos-en-el-desierto], note: "Suben armados contra la orden. Los amorreos, nombre que aquí abarca a amalequitas y cananeos según Perspicacia, los persiguen como abejas por Seír hasta Hormá. Luego se quedan mucho tiempo en Cadés."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: speech, entities: [event:primer-discurso-de-moises, event:israel-vaga-por-el-desierto, place:seir, journey:treinta-y-ocho-anos-en-el-desierto], mentions: [place:mar-rojo], note: "Dan media vuelta hacia el mar Rojo, como Jehová mandó, y pasan muchos días rodeando el monte Seír: son los años errantes."}
    - {v: 2-7, type: speech, entities: [event:israel-pasa-junto-a-seir, person:esau, person:moises, place:seir, relation:esau/lived_in/seir], note: "Jehová manda ir al norte. Los hijos de Esaú son hermanos: no se los ataca, porque Seír es suyo, y la comida y el agua se pagan. En cuarenta años no les faltó nada."}
    - {v: 8-12, type: speech, entities: [event:israel-pasa-junto-a-seir, event:israel-acampa-de-obot-al-arnon, place:seir, place:araba, place:elat, place:ezion-gueber, place:moab, place:ar], mentions: [person:lot, person:esau], note: "Bordean Seír lejos del Arabá, Elat y Ezión-Guéber, y siguen por el camino del desierto de Moab, que va en la ficha del país. Ar es de los hijos de Lot. Emim, anaquim, refaím y horeos son pueblos sin ficha."}
    - {v: 13-15, type: speech, entities: [event:israel-acampa-de-obot-al-arnon, event:israel-vaga-por-el-desierto, place:valle-de-zered, place:cades, journey:de-cades-a-las-llanuras-de-moab], note: "Cruzan el valle de Zered 38 años después de salir de Cadés-Barnea, cuando ya han muerto todos los guerreros de aquella generación."}
    - {v: 16-23, type: speech, entities: [event:israel-acampa-de-obot-al-arnon, place:moab, place:ar, place:ammon, place:creta], mentions: [person:lot, person:esau, place:seir, place:gaza], note: "No se ataca a Ammón, dado a los hijos de Lot; los ammonitas llamaban zamzumim a los refaím. Los caftorim, de Caftor, que la nota da como Creta, acabaron con los avim, que llegaban hasta Gaza."}
    - {v: 24-25, type: speech, entities: [event:israel-vence-a-sehon, person:sehon, place:arnon, place:hesbon, relation:sehon/lived_in/hesbon], note: "Jehová manda cruzar el valle de Arnón y pelear contra Sehón, el rey amorreo de Hesbón. Los pueblos temblarán al oír hablar de Israel."}
    - {v: 26-30, type: speech, entities: [event:israel-vence-a-sehon, event:israel-pasa-junto-a-seir, person:sehon, place:quedemot, place:hesbon], mentions: [person:esau, place:ar, place:seir, place:rio-jordan], note: "Desde el desierto de Quedemot, Moisés pide paso en paz y ofrece pagar comida y agua, como con los hijos de Esaú y los moabitas de Ar. Jehová deja que Sehón se obstine."}
    - {v: 31-37, type: speech, entities: [event:israel-vence-a-sehon, person:sehon, place:jahaz, place:aroer, place:arnon, place:galaad, place:ammon, place:rio-jaboc, relation:sehon/died_in/jahaz], note: "En Jáhaz caen Sehón, sus hijos y su pueblo; sus ciudades se destruyen y queda el ganado como botín. Israel toma de Aroer a Galaad sin tocar Ammón ni el Jaboc. La ciudad del valle no se nombra."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: speech, entities: [event:israel-vence-a-og, person:og, person:moises, person:sehon, place:camino-del-rey, place:edrei, place:basan, place:argob, place:hesbon, relation:og/lived_in/basan, relation:og/died_in/edrei, relation:sehon/lived_in/hesbon, event:primer-discurso-de-moises, journey:de-cades-a-las-llanuras-de-moab], mentions: [event:israel-vence-a-sehon], note: "Moisés recuerda la victoria sobre Og: Israel destruye las sesenta ciudades amuralladas de Argob, como hizo con Sehón, y se queda con el ganado y el botín."}
    - {v: 8-9, type: speech, entities: [place:arnon, place:monte-hermon], mentions: [place:sidon, place:rio-jordan, event:israel-vence-a-sehon, event:israel-vence-a-og], note: "La tierra quitada a los dos reyes amorreos iba del Arnón al Hermón. Los sidonios llamaban Sirión a ese monte y los amorreos, Senir; los dos nombres ya están en su ficha."}
    - {v: 10-11, type: speech, entities: [event:israel-vence-a-og, person:og, place:galaad, place:basan, place:saleca, place:edrei, place:raba, relation:og/lived_in/basan], mentions: [place:ammon], note: "La meseta es el llano entre Hesbón y el Arnón (Perspicacia «Meseta»); no lleva ficha. Og, el último de los refaím, tenía un ataúd de hierro de unos cuatro metros."}
    - {v: 12-13, type: speech, entities: [event:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, person:moises, place:aroer, place:arnon, place:galaad, place:basan, place:argob, place:manases], mentions: [person:og], note: "Rubén y Gad reciben la tierra del Arnón a media Galaad; la media tribu de Manasés, el resto de Galaad y Basán. Las tribus son pueblos y no llevan ficha."}
    - {v: "14", type: speech, entities: [event:jair-toma-havot-jair, person:jair-hijo-de-segub, place:argob, place:havot-jair, place:basan, place:guesur, place:maaca, relation:jair-hijo-de-segub/kin/manases-hijo-de-jose], mentions: [person:manases-hijo-de-jose], note: "Los guesuritas y los maacatitas son los pueblos de Guesur y Maacá, cuya frontera marcó el límite de lo que tomó Jaír."}
    - {v: "15", type: speech, entities: [event:los-hijos-de-makir-toman-galaad, person:makir-hijo-de-manases, person:moises, place:galaad]}
    - {v: 16-17, type: list, entities: [event:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, place:galaad, place:arnon, place:rio-jaboc, place:ammon, place:araba, place:rio-jordan, place:mar-de-galilea, place:mar-salado, place:pisga], note: "Límites de Rubén y Gad: el centro del Arnón al sur, el Jaboc frente a Ammón al este y, al oeste, el Jordán desde Kinéret, el mar de Galilea, hasta el mar Salado."}
    - {v: 18-20, type: speech, entities: [event:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan, person:moises], mentions: [place:rio-jordan], note: "Los guerreros de Rubén, Gad y media Manasés cruzarán armados delante de sus hermanos; las familias y el ganado se quedan en las ciudades hasta que todos tengan su tierra."}
    - {v: 21-22, type: speech, entities: [event:moises-nombra-a-josue-su-sucesor, person:moises, person:josue-hijo-de-nun], note: "Moisés anima a Josué con lo que Jehová hizo a los dos reyes. Perspicacia «Josué», núm. 1, lo cuenta entre las instrucciones que le dio como sucesor."}
    - {v: 23-28, type: speech, entities: [event:moises-nombra-a-josue-su-sucesor, person:moises, person:josue-hijo-de-nun, place:pisga, place:monte-nebo, relation:josue-hijo-de-nun/succeeds/moises], mentions: [place:libano, place:rio-jordan, event:agua-del-penasco-en-meriba], note: "Jehová no deja cruzar a Moisés por lo de Meribá (Nú 20:12). La cima de Pisgá es el monte Nebo de Dt 34:1, y por eso se citan las dos fichas."}
    - {v: "29", type: speech, entities: [event:moises-nombra-a-josue-su-sucesor, place:bet-peor], note: "Todo lo anterior ocurre mientras Israel acampa en el valle frente a Bet-Peor, en las llanuras de Moab."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: speech, entities: [event:primer-discurso-de-moises], note: "Moisés pide a Israel que obedezca las normas que enseña, sin añadir ni quitar nada, para vivir y tomar la tierra."}
    - {v: 3-4, type: speech, entities: [event:israel-adora-al-baal-de-peor], mentions: [place:peor], note: "El Baal de Peor es un dios y no lleva ficha; su nombre viene del monte Peor. Jehová eliminó a los que lo siguieron, y los fieles siguen vivos."}
    - {v: 5-8, type: speech, entities: [event:primer-discurso-de-moises], note: "Obedecer esas leyes justas mostrará a los pueblos la sabiduría de Israel, una nación con un Dios que está cerca cuando se le llama."}
    - {v: 9-14, type: speech, entities: [event:israel-se-santifica-ante-el-sinai, event:jehova-desciende-sobre-el-monte-sinai, event:diez-mandamientos, event:dios-da-a-moises-las-tablas-del-testimonio, event:moises-recibe-las-decisiones-judiciales, place:monte-sinai, person:moises], note: "Horeb es el monte Sinaí. Moisés recuerda el fuego, la voz sin figura, las Diez Palabras escritas en dos tablas de piedra y la orden de enseñar las demás leyes."}
    - {v: 15-24, type: speech, entities: [person:moises, event:primer-discurso-de-moises], mentions: [place:monte-sinai, place:egipto, place:rio-jordan, event:diez-mandamientos, event:agua-del-penasco-en-meriba, event:pacto-de-la-ley, event:exodo, event:muerte-de-moises], note: "Nada de imágenes de hombres, animales o astros. Moisés repite que morirá sin cruzar el Jordán."}
    - {v: 25-31, type: prophecy, entities: [event:primer-discurso-de-moises], note: "Aviso: si Israel adora imágenes, Jehová lo dispersará entre las naciones; si desde allí lo busca de corazón, lo encontrará, porque no olvida su pacto con los antepasados."}
    - {v: 32-40, type: speech, entities: [event:primer-discurso-de-moises], mentions: [place:egipto, event:exodo, event:diez-mandamientos], note: "Ningún pueblo oyó a Dios hablar desde el fuego ni fue sacado de otra nación con tales señales. Jehová es el único Dios; obedecerle trae larga vida en la tierra."}
    - {v: 41-43, type: narration, entities: [event:moises-aparta-tres-ciudades-de-refugio, person:moises, place:bezer, place:ramot-galaad, place:golan, place:galaad, place:basan, place:manases], mentions: [event:jehova-da-la-ley-de-las-ciudades-de-refugio, place:rio-jordan], note: "El desierto de la meseta es el llano al este del mar Muerto (Perspicacia «Meseta»); no lleva ficha. Rubenitas, gaditas y manasitas son tribus."}
    - {v: 44-49, type: narration, entities: [person:moises, person:sehon, person:og, place:bet-peor, place:hesbon, place:basan, place:aroer, place:arnon, place:monte-hermon, place:araba, place:mar-salado, place:pisga, relation:sehon/lived_in/hesbon, relation:og/lived_in/basan, event:primer-discurso-de-moises], mentions: [place:egipto, place:rio-jordan, event:israel-vence-a-sehon, event:israel-vence-a-og, event:exodo, event:segundo-discurso-de-moises], note: "Presenta la Ley que Moisés expone en el valle frente a Bet-Peor, en la antigua tierra de Sehón. Siyón es otro nombre del Hermón y el mar del Arabá es el mar Salado."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:segundo-discurso-de-moises, person:moises], note: "Moisés convoca a todo Israel. Empieza su segundo discurso, que según Perspicacia llega hasta el final del capítulo 26."}
    - {v: 2-5, type: speech, entities: [event:segundo-discurso-de-moises, event:pacto-de-la-ley, event:diez-mandamientos, place:monte-sinai], note: "Horeb es aquí el Sinaí. El pacto se cerró con la nación que salió de Egipto, no con los patriarcas. Moisés hizo de intermediario porque el pueblo temía el fuego."}
    - {v: 6-21, type: law, entities: [event:diez-mandamientos], mentions: [place:egipto, event:exodo], note: "Moisés repite las Diez Palabras de Éx 20. Aquí el descanso del sábado se liga al recuerdo de la esclavitud en Egipto; Éx 20:11 lo liga a los seis días de la creación."}
    - {v: 22-27, type: speech, entities: [event:diez-mandamientos, event:dios-da-a-moises-las-tablas-del-testimonio, place:monte-sinai], note: "Dios escribió esas leyes en dos tablas de piedra. Los jefes de las tribus y los ancianos, asustados por la voz que salía del fuego, pidieron a Moisés que escuchara él por todos."}
    - {v: 28-31, type: speech, entities: [event:moises-recibe-las-decisiones-judiciales, person:moises], note: "Jehová aprueba la petición: el pueblo vuelve a sus tiendas y Moisés se queda en el monte para recibir las demás leyes (Éx 20:21)."}
    - {v: 32-33, type: speech, entities: [event:segundo-discurso-de-moises], note: "Moisés insiste en cumplirlo todo sin desviarse, para que les vaya bien y duren en la tierra que van a ocupar."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: speech, entities: [event:segundo-discurso-de-moises, person:moises], note: "Moisés dice para qué enseña estas leyes: que tres generaciones respeten a Jehová, tengan larga vida y lleguen a ser muchos en la tierra que mana leche y miel."}
    - {v: 4-9, type: speech, entities: [event:segundo-discurso-de-moises], note: "Jehová es uno solo. Hay que amarlo con todo el ser, inculcar sus palabras a los hijos y tenerlas a la vista en la mano, la frente y los postes de casa. Jesús citó el versículo 5 (Mr 12:29, 30)."}
    - {v: 10-15, type: speech, entities: [event:segundo-discurso-de-moises], mentions: [person:abrahan, person:isaac, person:jacob, place:egipto, event:exodo], note: "Al recibir la tierra jurada a Abrahán, Isaac y Jacob, con ciudades, casas, cisternas y viñas que no hicieron ellos, no deben olvidar a Jehová ni seguir a los dioses de los pueblos vecinos."}
    - {v: 16-19, type: speech, entities: [event:segundo-discurso-de-moises, place:masa, event:agua-de-la-roca-en-horeb], note: "No hay que poner a prueba a Jehová como en Masá, junto a Refidim (Éx 17:7). Jesús citó este versículo ante el Diablo (Mt 4:7)."}
    - {v: 20-25, type: speech, entities: [event:segundo-discurso-de-moises], mentions: [place:egipto, event:exodo], note: "Qué contestar al hijo que pregunte por las leyes: Jehová sacó a Israel de Egipto con señales contra el faraón y su casa. Faraón es un título y el texto no dice quién era."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    note: "Parte del segundo discurso de Moisés en las llanuras de Moab (Dt 5-26). Moisés habla en primera persona y el capítulo no lo nombra."
    spans:
    - {v: 1-6, type: speech, entities: [event:segundo-discurso-de-moises, person:moises], mentions: [place:canaan], note: "Al entrar en la tierra, Israel acabará con siete naciones: hititas, guirgaseos, amorreos, cananeos, perizitas, heveos y jebuseos, pueblos sin ficha que vivían en Canaán. Nada de pactos ni bodas con ellas; sus altares se derriban."}
    - {v: 7-16, type: speech, entities: [event:segundo-discurso-de-moises], mentions: [place:egipto, event:exodo], note: "Jehová eligió a Israel por amor y por lo jurado a sus antepasados, no por ser muchos, y lo libró del faraón, un título sin nombre. Obedecer traerá hijos, cosechas, crías y salud."}
    - {v: 17-26, type: speech, entities: [event:segundo-discurso-de-moises], mentions: [place:egipto], note: "Que no teman a naciones más fuertes: Jehová, que castigó a Egipto, las irá echando poco a poco para que no se multipliquen las fieras. Los ídolos se queman, sin quedarse la plata ni el oro que los cubre."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    note: "Parte del segundo discurso de Moisés en las llanuras de Moab (Dt 5-26). Perspicacia «Maná» cita Dt 8:3, 16 para el fin del maná: enseñar y probar a Israel."
    spans:
    - {v: 1-6, type: speech, entities: [event:segundo-discurso-de-moises, person:moises, event:codornices-y-mana-en-el-desierto-de-sin], mentions: [event:jehova-condena-a-israel-a-40-anos-en-el-desierto], note: "En 40 años de desierto Jehová probó y educó a Israel: le dio maná para enseñarle que la vida depende de lo que dice Jehová, y su ropa no se gastó. Jesús citó el versículo 3 (Mt 4:4)."}
    - {v: 7-10, type: speech, entities: [event:segundo-discurso-de-moises], note: "La tierra que los espera tiene arroyos y manantiales, trigo, cebada, vides, higueras, granados, olivos y miel, y rocas con hierro y cobre. Cuando coman hasta saciarse, darán gracias a Jehová."}
    - {v: 11-20, type: speech, entities: [event:segundo-discurso-de-moises, event:codornices-y-mana-en-el-desierto-de-sin], mentions: [place:egipto, event:exodo, event:agua-del-penasco-en-meriba], note: "Casas y riquezas no deben volverlos orgullosos: Jehová los guio entre serpientes y escorpiones, sacó agua de la roca (la referencia remite a Nú 20:11) y les dio maná. Si siguen a otros dioses, perecerán."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    note: "Parte del segundo discurso de Moisés en las llanuras de Moab (Dt 5-26). Sus recuerdos del desierto van como pasajes de los sucesos de Éxodo y Números."
    spans:
    - {v: 1-6, type: speech, entities: [event:segundo-discurso-de-moises, person:moises], mentions: [place:rio-jordan, event:los-espias-informan-en-cades, person:abrahan, person:isaac, person:jacob], note: "Israel cruzará el Jordán contra ciudades amuralladas y contra los anaquim, pueblo sin ficha cuya fuerza dio pie a un dicho sobre los hijos de Anac. Vencerá por la maldad de esas naciones y lo jurado a los patriarcas."}
    - {v: 7-21, type: speech, entities: [event:segundo-discurso-de-moises, event:primeros-cuarenta-dias-de-moises-en-el-sinai, event:dios-da-a-moises-las-tablas-del-testimonio, event:becerro-de-oro, event:moises-ruega-por-el-pueblo, event:moises-rompe-las-tablas, event:moises-recibe-las-segundas-tablas, person:aaron, place:monte-sinai], mentions: [place:egipto, event:exodo, event:diez-mandamientos, event:moises-pide-perdon-por-el-pueblo], note: "Moisés repasa lo de Horeb: 40 días sin comer ni beber, las tablas escritas por Dios, el becerro, las tablas rotas y otros 40 días postrado. Rogó también por Aarón y echó el polvo del ídolo al torrente del monte."}
    - {v: 22-24, type: speech, entities: [event:segundo-discurso-de-moises, event:fuego-de-jehova-en-tabera, event:agua-de-la-roca-en-horeb, event:el-pueblo-pide-carne, event:codornices-en-quibrot-hataava, event:israel-se-niega-a-entrar-en-canaan, place:tabera, place:masa, place:quibrot-hataava, place:cades], note: "Más rebeldías: en Taberá, en Masá, junto a Refidim, y en Quibrot-Hataavá; y en Cadés-Barnea, cuando no quisieron subir a tomar la tierra que Jehová les daba."}
    - {v: 25-29, type: speech, entities: [event:segundo-discurso-de-moises, event:moises-recibe-las-segundas-tablas, event:moises-ruega-por-el-pueblo], mentions: [person:abrahan, person:isaac, person:jacob, place:egipto], note: "Postrado 40 días, Moisés suplicó que Jehová no destruyera a su pueblo, recordando a Abrahán, Isaac y Jacob, para que los egipcios no dijeran que no pudo llevarlo a la tierra prometida."}
  10:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: speech, entities: [event:segundo-discurso-de-moises, event:moises-recibe-las-segundas-tablas, person:moises], mentions: [event:moises-rompe-las-tablas, event:diez-mandamientos], note: "Moisés recuerda que talló dos tablas nuevas e hizo un arca de acacia; Jehová volvió a escribir los Diez Mandamientos y él guardó las tablas en el arca. La montaña es el Horeb."}
    - {v: 6-7, type: speech, entities: [event:segundo-discurso-de-moises, event:muerte-de-aaron, event:israel-acampa-en-gudgoda-y-jotbata, person:aaron, person:eleazar-hijo-de-aaron, place:bene-jaacan, place:moserot, place:hor-haguidgad, place:jotbata, relation:aaron/died_in/monte-hor, relation:eleazar-hijo-de-aaron/succeeds/aaron, relation:eleazar-hijo-de-aaron/kin/aaron, journey:de-cades-a-las-llanuras-de-moab], mentions: [period:sumo-sacerdocio-de-aaron], note: "Beerot Bene-Jaacán es Bene-Jaacán, Moserá es Moserot y Gudgoda es probablemente Hor-Haguidgad. Números 33 da otro orden: Perspicacia cree que Israel pasó dos veces. Aarón fue enterrado en Moserá."}
    - {v: 8-9, type: speech, entities: [event:segundo-discurso-de-moises, event:jehova-da-los-levitas-a-aaron, event:jehova-fija-los-deberes-de-sacerdotes-y-levitas], note: "Leví es aquí la tribu, sin ficha. Jehová la aparta para llevar el arca, servirle y bendecir al pueblo; no recibe tierra porque Jehová es su herencia (Nú 3:6; 18:20)."}
    - {v: 10-11, type: speech, entities: [event:segundo-discurso-de-moises, event:moises-recibe-las-segundas-tablas, person:moises], mentions: [event:moises-ruega-por-el-pueblo, event:israel-sale-del-desierto-de-sinai], note: "Segunda estancia de 40 días en la montaña: Jehová escucha a Moisés y no destruye al pueblo. Luego le manda ponerse al frente para ir a la tierra jurada a los antepasados."}
    - {v: 12-19, type: speech, entities: [event:segundo-discurso-de-moises], mentions: [place:egipto], note: "Jehová pide temor, amor, servicio y obediencia. Es Dios de dioses, no tiene favoritos ni acepta sobornos y protege al huérfano, a la viuda y al extranjero; Israel también fue extranjero en Egipto."}
    - {v: 20-22, type: speech, entities: [event:segundo-discurso-de-moises, event:jacob-entra-en-egipto], mentions: [place:egipto], note: "Los antepasados bajaron a Egipto siendo 70 y ahora son tantos como las estrellas. Los antepasados no se nombran."}
  11:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: speech, entities: [event:segundo-discurso-de-moises, event:israel-cruza-el-mar-rojo], mentions: [place:egipto, place:mar-rojo], note: "Los hijos no vieron la disciplina de Jehová: las señales contra el faraón, que no tiene nombre, el ejército ahogado en el mar Rojo y lo hecho en el desierto hasta llegar aquí."}
    - {v: 6-7, type: speech, entities: [event:segundo-discurso-de-moises, event:la-tierra-se-traga-a-datan-y-abiram, person:datan, person:abiram-hijo-de-eliab, person:eliab-hijo-de-palu, relation:datan/kin/eliab-hijo-de-palu, relation:datan/kin/abiram-hijo-de-eliab, relation:abiram-hijo-de-eliab/kin/eliab-hijo-de-palu, relation:eliab-hijo-de-palu/kin/ruben-hijo-de-jacob], mentions: [person:ruben-hijo-de-jacob], note: "La tierra se traga a Datán y Abiram con sus casas y sus tiendas. Moisés no nombra aquí a Coré. Eliab es hijo de Rubén en el sentido de descendiente."}
    - {v: 8-12, type: speech, entities: [event:segundo-discurso-de-moises], mentions: [place:egipto], note: "La tierra que van a ocupar, de montes y llanuras, bebe la lluvia y Jehová la vigila todo el año; en Egipto, en cambio, se regaba con el pie."}
    - {v: 13-17, type: speech, entities: [event:segundo-discurso-de-moises], note: "Si obedecen, habrá lluvia de otoño y de primavera, grano, vino, aceite y pasto. Si se van tras otros dioses, Jehová cerrará el cielo y morirán pronto."}
    - {v: 18-21, type: speech, entities: [event:segundo-discurso-de-moises], note: "Llevar estas palabras en el corazón, atadas a la mano y en la frente, enseñarlas a los hijos a todas horas y escribirlas en los postes de las casas y en las puertas."}
    - {v: 22-25, type: speech, entities: [event:segundo-discurso-de-moises, place:libano, place:rio-eufrates, place:mar-grande], note: "Si aman a Jehová, él echará a naciones mayores. La frontera irá del desierto, sin nombre, al Líbano y del Éufrates al mar occidental, que la nota llama mar Grande o Mediterráneo."}
    - {v: 26-28, type: speech, entities: [event:segundo-discurso-de-moises], note: "Moisés pone delante una bendición, si obedecen, y una maldición, si desobedecen y siguen a dioses que no conocen."}
    - {v: 29-32, type: speech, entities: [event:segundo-discurso-de-moises, place:monte-guerizim, place:monte-ebal, place:araba, place:guilgal-frente-a-guerizim-y-ebal, place:more], mentions: [place:rio-jordan, place:canaan, event:entrada-en-canaan], note: "En la tierra, la bendición irá en el Guerizim y la maldición en el Ebal, al oeste del Jordán; lo cumple Josué (Jos 8:30-35), suceso que crea Josué. Los cananeos son pueblo sin ficha."}
  12:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-14, type: law, entities: [event:segundo-discurso-de-moises], mentions: [place:rio-jordan, event:entrada-en-canaan], note: "Al entrar en la tierra, Israel arrasará los altares, columnas y postes sagrados de las naciones. Sus ofrendas, diezmos y primogénitos irán solo al lugar que Jehová elija para su nombre, donde comerán alegres con el levita."}
    - {v: 15-28, type: law, note: "En cualquier ciudad se puede matar y comer carne, como la gacela, estando puro o impuro; la sangre, que es la vida, se derrama en tierra. Diezmos, primogénitos y votos se comen solo en el sitio elegido."}
    - {v: 29-32, type: law, note: "Vencidas las naciones, Israel no debe preguntar cómo servían a sus dioses para imitarlas: llegaban a quemar a sus hijos en su honor. A lo mandado no se le añade ni se le quita nada."}
  13:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: law, entities: [event:segundo-discurso-de-moises], mentions: [place:egipto, event:exodo], note: "Aunque su señal se cumpla, al profeta o soñador que invite a seguir a otros dioses no se le escucha y muere por rebelde: así prueba Jehová si Israel lo ama de todo corazón."}
    - {v: 6-11, type: law, mentions: [place:egipto, event:exodo], note: "Si un hermano, un hijo, la esposa o el amigo más íntimo incita en secreto a servir a otros dioses, no se le encubre: se le apedrea, empezando por quien lo oyó. Así todo Israel escarmienta."}
    - {v: 12-18, type: law, note: "Si una investigación a fondo confirma que una ciudad israelita se fue tras otros dioses, se la destruye con su ganado, su botín se quema como ofrenda completa y nunca se reconstruye. Nadie se queda nada."}
  14:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: law, entities: [event:segundo-discurso-de-moises], note: "Como hijos de Jehová y pueblo santo, elegido para ser su propiedad especial, los israelitas no se hacen cortes ni se rapan la frente por un muerto."}
    - {v: 3-21, type: law, note: "Qué animales se comen, como en Levítico 11: rumiantes de pezuña partida, peces con aletas y escamas, y no ciertas aves. Lo hallado muerto se da o se vende al extranjero. El cabrito no se hierve en leche materna."}
    - {v: 22-29, type: law, note: "El diezmo anual se come ante Jehová en el sitio elegido; si queda lejos, se vende y allí se compra lo que se quiera. Cada tercer año se guarda en la ciudad para levitas, extranjeros, huérfanos y viudas."}
  15:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: law, entities: [event:segundo-discurso-de-moises], mentions: [person:moises], note: "Cada siete años el acreedor perdona las deudas de su hermano israelita, no las del extranjero. Si Israel obedece, Jehová lo bendecirá: no habrá pobres, prestará a muchas naciones y no pedirá prestado."}
    - {v: 7-11, type: law, note: "Al hermano pobre se le presta lo que le falte, con generosidad y sin mala gana, aunque esté cerca el año en que se perdonan las deudas. En la tierra nunca faltarán pobres."}
    - {v: 12-18, type: law, mentions: [place:egipto, event:egipto-esclaviza-a-israel, event:exodo], note: "El esclavo hebreo, hombre o mujer, sale libre al séptimo año con regalos del rebaño, la era y el lagar; si prefiere quedarse, se le perfora la oreja y sirve de por vida. Israel también fue esclavo en Egipto."}
    - {v: 19-23, type: law, note: "Los primogénitos machos del ganado son de Jehová: no se trabajan ni se esquilan y la familia los come cada año en el lugar que él escoja. El que tiene un defecto se come en casa, sin su sangre."}
  16:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: law, entities: [event:segundo-discurso-de-moises], mentions: [person:moises, place:egipto, event:exodo, event:jehova-instituye-la-pascua], note: "En el mes de abib, la Pascua recuerda la salida nocturna de Egipto y solo se sacrifica, al ponerse el sol, en el lugar que Jehová escoja, que con el tiempo fue Jerusalén. Siguen días de pan sin levadura."}
    - {v: 9-12, type: law, mentions: [place:egipto, event:egipto-esclaviza-a-israel], note: "Siete semanas después de empezar la siega llega la Fiesta de las Semanas: ofrenda voluntaria según lo bendecido y alegría de toda la casa, también del levita, el extranjero, el huérfano y la viuda."}
    - {v: 13-15, type: law, note: "La Fiesta de las Cabañas dura siete días, tras recoger la cosecha de la era y del lagar, en el lugar que Jehová escoja. Toda la casa y los necesitados se alegran juntos."}
    - {v: 16-17, type: law, note: "Tres veces al año, en los Panes Sin Levadura, las Semanas y las Cabañas, cada varón acude ante Jehová al lugar escogido y lleva un regalo según la bendición recibida."}
    - {v: 18-20, type: law, note: "En cada ciudad se nombran jueces y funcionarios por tribus, que juzguen con rectitud, sin favoritismo ni sobornos. Aquí empieza el esbozo del sistema judicial de Israel, que sigue hasta 17:13."}
    - {v: 21-22, type: law, note: "Junto al altar de Jehová no se planta ningún poste sagrado ni se levanta una columna sagrada, porque él las odia."}
  17:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: law, entities: [event:segundo-discurso-de-moises], mentions: [person:moises], note: "A Jehová no se le sacrifica un toro ni una oveja con defecto, porque lo detesta."}
    - {v: 2-7, type: law, note: "Quien adore a otros dioses, al sol, a la luna o a los astros muere apedreado a las puertas de la ciudad, tras una investigación a fondo y con dos o tres testigos, que tiran las primeras piedras."}
    - {v: 8-13, type: law, note: "Los casos difíciles, como un homicidio, una demanda o una agresión, van al lugar que Jehová escoja, ante los sacerdotes levitas y el juez de turno. Quien desobedezca su fallo por arrogancia muere."}
    - {v: 14-20, type: law, mentions: [place:egipto], note: "Si Israel quiere rey, será un israelita escogido por Jehová, sin muchos caballos traídos de Egipto, ni muchas esposas, ni grandes riquezas. Hará su propia copia de la Ley y la leerá cada día."}
  18:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: law, entities: [event:segundo-discurso-de-moises], mentions: [event:jehova-fija-los-deberes-de-sacerdotes-y-levitas], note: "Los sacerdotes levitas, como toda la tribu de Leví (sin ficha), no heredan tierra: Jehová es su herencia. Reciben partes de los sacrificios y las primicias; el levita que vaya al santuario escogido sirve y come como los demás."}
    - {v: 9-14, type: law, entities: [event:segundo-discurso-de-moises], note: "Prohíbe imitar a las naciones del país: quemar hijos en el fuego, adivinar, practicar magia, buscar agüeros, hechizar, echar maleficios, consultar médiums o a los muertos. Por eso Jehová las expulsa."}
    - {v: 15-19, type: prophecy, entities: [event:segundo-discurso-de-moises, person:moises, event:diez-mandamientos], mentions: [person:jesus, place:desierto-de-sinai], note: "Jehová levantará un profeta como Moisés, en respuesta al miedo del pueblo en Horeb, que Perspicacia sitúa en la zona del Sinaí. «Profeta» y «Moisés» lo identifican con Jesús, como Pedro en Hch 3:22, 23."}
    - {v: 20-22, type: law, entities: [event:segundo-discurso-de-moises], note: "Muere el profeta que habla sin mandato de Jehová o en nombre de otros dioses, que no llevan ficha. Si lo anunciado en nombre de Jehová no se cumple, Jehová no lo dijo y no hay que temerlo."}
  19:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-13, type: law, entities: [event:segundo-discurso-de-moises, event:jehova-da-la-ley-de-las-ciudades-de-refugio], note: "Tres ciudades de refugio en la tierra conquistada, con caminos preparados, para quien mata sin querer, como con el hacha suelta; tres más si Jehová ensancha el país. Al asesino, los ancianos lo entregan al vengador de la sangre."}
    - {v: "14", type: law, entities: [event:segundo-discurso-de-moises], note: "Nadie debe correr los mojones que fijaron los antepasados en la herencia de su vecino."}
    - {v: 15-21, type: law, entities: [event:segundo-discurso-de-moises], note: "Se condena con dos o tres testigos, no con uno. Si los jueces prueban que un testigo mintió, sufre lo que quería para el otro: vida por vida, ojo por ojo. Jesús cita esta ley en Mt 5:38."}
  20:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: law, entities: [event:segundo-discurso-de-moises], mentions: [place:egipto, event:exodo], note: "Ante un ejército con más caballos y carros, Israel no debe temer: Jehová, que lo sacó de Egipto, pelea por él. Antes del combate, el sacerdote anima al pueblo."}
    - {v: 5-9, type: law, entities: [event:segundo-discurso-de-moises], note: "Los oficiales mandan a casa a quien no ha estrenado su casa nueva, no ha probado su viña o está comprometido, y también al miedoso. Después nombran jefes para las tropas."}
    - {v: 10-18, type: law, entities: [event:segundo-discurso-de-moises], note: "A la ciudad lejana se le ofrece paz: si acepta, hace trabajos forzados; si no, mueren sus varones. En las de hititas, amorreos, cananeos, perizitas, heveos y jebuseos, pueblos sin ficha, no queda nadie con vida."}
    - {v: 19-20, type: law, entities: [event:segundo-discurso-de-moises], note: "En un asedio largo no se talan los árboles frutales; los que no dan alimento sí pueden cortarse para cercar la ciudad."}
  21:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: law, entities: [event:segundo-discurso-de-moises], mentions: [person:moises], note: "Si aparece un muerto en el campo sin culpable conocido, se mide la distancia hasta las ciudades. Los ancianos de la más próxima desnucan una ternera junto a un arroyo y, ante los sacerdotes, declaran su inocencia lavándose las manos."}
    - {v: 10-14, type: law, note: "El israelita que quiera casarse con una cautiva de guerra la lleva a casa; ella se rapa, se arregla las uñas y llora a sus padres un mes. Si después la rechaza, la deja libre y no puede venderla."}
    - {v: 15-17, type: law, note: "Quien tiene dos esposas y prefiere a una no puede dar el derecho de primogénito al hijo de la favorita. El mayor, aunque sea de la menos querida, recibe doble parte de la herencia."}
    - {v: 18-21, type: law, note: "Al hijo rebelde, glotón y borracho que no se deja corregir lo llevan sus padres a los ancianos, en la puerta, y los vecinos lo apedrean hasta que muere."}
    - {v: 22-23, type: law, note: "El cuerpo del ejecutado que se cuelga de un madero no pasa allí la noche: se entierra ese día, porque el colgado es maldito de Dios. Gál 3:13 cita este versículo."}
  22:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: law, entities: [event:segundo-discurso-de-moises], mentions: [person:moises], note: "Lo que pierde otro israelita, sea toro, oveja, burro, ropa u otra cosa, se le devuelve; si su dueño vive lejos o es desconocido, se guarda hasta que lo reclame. Al animal caído se le ayuda a levantarse."}
    - {v: 5-8, type: law, note: "Nadie se viste con ropa del otro sexo. De un nido se pueden tomar crías o huevos, pero la madre se suelta. La casa nueva lleva un pretil en la azotea, para no cargar con la sangre de una caída."}
    - {v: 9-12, type: law, note: "Sin mezclas: nada de dos semillas en la viña, de un toro y un burro bajo el mismo arado ni de tejidos de lana con lino. La ropa lleva borlas en sus cuatro puntas."}
    - {v: 13-21, type: law, note: "Si un marido acusa en falso a su esposa de no haber llegado virgen, los padres muestran la prueba a los ancianos; él recibe castigo, paga cien siclos al suegro y no podrá divorciarse. Si era verdad, ella muere apedreada."}
    - {v: 22-27, type: law, note: "El adulterio con una casada se castiga con la muerte de ambos. Con una prometida en la ciudad mueren los dos, porque ella no pidió ayuda; si fue en el campo, donde nadie la oyó, muere solo él."}
    - {v: 28-30, type: law, note: "Quien se acuesta con una virgen sin compromiso paga cincuenta siclos al padre, se casa con ella y nunca podrá divorciarse. Nadie toma a la esposa de su padre."}
  23:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: law, entities: [event:segundo-discurso-de-moises], mentions: [person:moises], note: "No entran en la congregación de Jehová el hombre castrado o mutilado ni el hijo ilegítimo; tampoco los descendientes de este hasta la décima generación."}
    - {v: 3-6, type: law, entities: [person:balaam, person:beor-padre-de-balaam, place:petor, place:mesopotamia, relation:balaam/kin/beor-padre-de-balaam, relation:balaam/lived_in/petor, relation:balaam/lived_in/mesopotamia, event:balac-manda-llamar-a-balaam, event:balaam-bendice-a-israel-desde-bamot-baal, event:balaam-bendice-a-israel-desde-pisga, event:balaam-bendice-a-israel-desde-peor, journey:viaje-de-balaam], mentions: [place:ammon, place:moab, place:egipto, event:exodo], note: "Ammonitas y moabitas quedan excluidos de la congregación para siempre: no recibieron a Israel con pan y agua en su viaje desde Egipto y contrataron a Balaam para que lo maldijera. Jehová cambió la maldición en bendición."}
    - {v: 7-8, type: law, mentions: [place:edom, place:egipto, event:jacob-entra-en-egipto], note: "Al edomita no se le odia, porque es hermano, ni al egipcio, porque Israel vivió como extranjero en su tierra. Sus hijos pueden entrar en la congregación desde la tercera generación."}
    - {v: 9-14, type: law, note: "En campaña el campamento se guarda puro: quien tiene una emisión nocturna sale y vuelve al ponerse el sol, ya lavado, y las necesidades se hacen fuera y se tapan, porque Jehová anda por el campamento."}
    - {v: 15-16, type: law, note: "Al esclavo que huye de su amo y pide refugio no se le entrega: vive en la ciudad que elija, sin que nadie lo maltrate."}
    - {v: 17-18, type: law, note: "Ningún israelita, hombre o mujer, puede ser prostituto de templo, y lo ganado con la prostitución no se lleva a la casa de Jehová para pagar un voto."}
    - {v: 19-20, type: law, note: "Al hermano israelita no se le cobra interés por dinero, comida ni ninguna otra cosa prestada; al extranjero sí."}
    - {v: 21-23, type: law, note: "El voto hecho a Jehová se cumple sin retraso; no cumplirlo es pecado. No prometer no es pecado, pero lo que uno ofrece de palabra como ofrenda voluntaria tiene que darlo."}
    - {v: 24-25, type: law, note: "En la viña o el sembrado del prójimo uno puede comer uvas o arrancar espigas con la mano hasta quedar saciado, pero no llenar un recipiente ni meter la hoz."}
  24:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: law, entities: [event:segundo-discurso-de-moises], mentions: [person:moises], note: "Sigue el segundo discurso de Moisés (Dt 5:1-26:19). Divorcio: certificado escrito; el primer esposo no puede volver a tomar a la mujer que se casó con otro. Jesús lo comenta en Mt 19:3-8."}
    - {v: 5-7, type: law, note: "El recién casado queda un año libre del ejército. No se toma en prenda el molino de mano. Quien secuestre y venda a un israelita debe morir."}
    - {v: 8-9, type: law, entities: [event:miriam-y-aaron-hablan-contra-moises, person:miriam-hermana-de-moises], mentions: [place:egipto], note: "Ante la lepra, obedecer a los sacerdotes levitas. Moisés pone como aviso la lepra que Jehová mandó a Míriam por murmurar (Nú 12), en el camino tras salir de Egipto."}
    - {v: 10-15, type: law, note: "El prestamista espera fuera a que le saquen la prenda y devuelve al pobre su manto antes de anochecer. Al jornalero, israelita o extranjero, se le paga el mismo día."}
    - {v: 16-18, type: law, mentions: [place:egipto, event:egipto-esclaviza-a-israel, event:exodo], note: "Cada uno muere por su propio pecado, no por el de padres o hijos (lo aplica Amasías, 2Re 14:6). Justicia para extranjero, huérfano y viuda, recordando la esclavitud en Egipto."}
    - {v: 19-22, type: law, mentions: [place:egipto, event:egipto-esclaviza-a-israel], note: "Lo que queda en el campo, el olivo y la viña tras la cosecha es para el extranjero, el huérfano y la viuda. Rut espiga así en Rut 2."}
  25:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: law, entities: [event:segundo-discurso-de-moises], mentions: [person:moises], note: "Sigue el segundo discurso de Moisés (Dt 5:1-26:19). Los jueces deciden la disputa; al culpable se le dan como máximo 40 golpes. Pablo recibió 40 menos uno cinco veces (2Co 11:24)."}
    - {v: "4", type: law, note: "No se pone bozal al toro que trilla. Pablo aplica esta ley a quienes enseñan (1Co 9:9; 1Ti 5:18)."}
    - {v: 5-10, type: law, note: "Matrimonio de cuñado: si el hermano muere sin hijo, su hermano se casa con la viuda. Si se niega, ella le quita la sandalia ante los ancianos. Ver Gé 38 y Rut 4. Israel es el pueblo."}
    - {v: 11-12, type: law, note: "Castigo para la esposa que, al defender a su marido en una pelea, agarra al otro hombre por sus partes íntimas."}
    - {v: 13-16, type: law, note: "Pesas y medidas exactas, nunca dos distintas, una grande y otra pequeña. Jehová detesta al que engaña así. La nota del v. 14 remite al efá (apéndice B14)."}
    - {v: 17-19, type: law, entities: [event:batalla-contra-amalec-en-refidim], mentions: [place:amalec, place:egipto], note: "Amalec es el pueblo amalequita, sin ficha como pueblo. Tras el éxodo atacó a los rezagados y cansados; Israel debe borrarlo cuando tenga descanso. Saúl recibe esa orden en 1Sa 15."}
  26:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: law, entities: [event:segundo-discurso-de-moises], mentions: [person:moises, event:entrada-en-canaan], note: "Sigue el segundo discurso de Moisés (Dt 5:1-26:19). Ya en la tierra, el israelita lleva primicias en una canasta al lugar que Jehová elija, sin nombre aquí, y el sacerdote las deja ante el altar."}
    - {v: 5-11, type: law, entities: [person:jacob, relation:jacob/lived_in/padan-aram, relation:jacob/lived_in/egipto], mentions: [place:egipto, event:jacob-entra-en-egipto, event:egipto-esclaviza-a-israel, event:exodo], note: "Declaración al ofrecer: el arameo errante es Jacob (Perspicacia «Aram», núm. 5), que bajó a Egipto con pocos. Allí creció Israel, fue oprimido y Jehová lo sacó. La nota da también «a punto de morir»."}
    - {v: 12-15, type: law, note: "El diezmo del tercer año se da en las ciudades a levitas, extranjeros, huérfanos y viudas. El que lo entrega declara que no lo usó de luto, impuro ni para los muertos."}
    - {v: 16-19, type: speech, note: "Cierre del segundo discurso: ese día Israel se compromete a ser propiedad especial de Jehová y Jehová a ser su Dios, y lo pondrá por encima de las naciones si es santo."}
  27:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: speech, entities: [event:moises-manda-escribir-la-ley-en-piedras-en-el-ebal, person:moises, place:monte-ebal], mentions: [place:rio-jordan], note: "Piedras cubiertas de yeso con la Ley escrita y un altar sin herramientas de hierro. Josué lo cumple tras tomar Hai (Jos 8:30-32); ese suceso lo crea Josué."}
    - {v: 9-10, type: speech, entities: [event:moises-anuncia-las-bendiciones-y-las-maldiciones, person:moises], note: "Moisés y los sacerdotes levitas dicen a Israel que ese día ha llegado a ser el pueblo de Jehová y que debe obedecerle."}
    - {v: 11-14, type: speech, entities: [event:moises-anuncia-las-bendiciones-y-las-maldiciones, person:moises, place:monte-guerizim, place:monte-ebal], mentions: [place:rio-jordan], note: "En el Guerizim, para bendecir: Simeón, Leví, Judá, Isacar, José y Benjamín. Rubén, Gad, Aser, Zabulón, Dan y Neftalí van al Ebal, para maldecir. Son tribus, no los patriarcas: sin ficha."}
    - {v: 15-26, type: law, entities: [event:moises-anuncia-las-bendiciones-y-las-maldiciones], note: "Doce maldiciones que proclaman los levitas y el pueblo confirma con amén: ídolos ocultos, desprecio a los padres, mover lindes, extraviar al ciego, torcer la justicia, incesto, bestialidad, homicidio, soborno y desobediencia."}
  28:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-14, type: speech, entities: [event:moises-anuncia-las-bendiciones-y-las-maldiciones], note: "Bendiciones de la obediencia: prosperidad en ciudad y campo, hijos, cosechas y ganado, victoria sobre el enemigo, lluvia a su tiempo, prestar sin pedir prestado y estar a la cabeza de las naciones."}
    - {v: 15-44, type: speech, entities: [event:moises-anuncia-las-bendiciones-y-las-maldiciones], mentions: [place:egipto], note: "Maldiciones de la desobediencia: enfermedad, sequía, derrota, las úlceras de Egipto, locura, robo, pérdida de hijos y cosechas, destierro con su rey a una nación desconocida y el extranjero por encima."}
    - {v: 45-57, type: speech, entities: [event:moises-anuncia-las-bendiciones-y-las-maldiciones], note: "Una nación lejana de idioma extraño sitiará sus ciudades, y el hambre del cerco llevará a comer a los propios hijos. Las referencias remiten a los asedios de Samaria y Jerusalén (2Re 6; 25; Lam 4)."}
    - {v: 58-68, type: speech, entities: [event:moises-anuncia-las-bendiciones-y-las-maldiciones], mentions: [place:egipto], note: "Si no temen el nombre de Jehová: plagas y enfermedades de Egipto, pocos supervivientes, dispersión entre naciones con dioses de madera y piedra, miedo sin descanso y vuelta a Egipto en barco como esclavos."}
  29:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:pacto-con-israel-en-moab, person:moises, place:moab], mentions: [event:pacto-de-la-ley, place:desierto-de-sinai], note: "Título del pacto de Moab, que se suma al de Horeb. Perspicacia «Horeb» cuenta este versículo entre los que usan el nombre para la región del Sinaí."}
    - {v: 2-9, type: speech, entities: [event:pacto-con-israel-en-moab, person:moises, person:sehon, person:og, relation:sehon/lived_in/hesbon, relation:og/lived_in/basan, event:israel-vence-a-sehon, event:israel-vence-a-og, event:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan], mentions: [place:egipto, place:hesbon, place:basan], note: "Moisés repasa las señales contra el faraón, los cuarenta años en que ni la ropa ni las sandalias se gastaron, y la victoria sobre Sehón y Og. Rubenitas, gaditas y manasitas son pueblos."}
    - {v: 10-15, type: speech, entities: [event:pacto-con-israel-en-moab, person:moises], mentions: [person:abrahan, person:isaac, person:jacob], note: "Todos están ante Jehová, desde los jefes hasta el leñador y el aguador, para entrar en el pacto jurado a los patriarcas. Vale también para quienes no están presentes."}
    - {v: 16-21, type: speech, mentions: [place:egipto], note: "Recuerdan los ídolos de Egipto y de las naciones que cruzaron. Quien se crea a salvo siguiendo su propio corazón sufrirá las maldiciones del libro; Heb 12:15 recoge la imagen de la raíz venenosa."}
    - {v: 22-28, type: prophecy, entities: [event:destruccion-de-sodoma-y-gomorra, place:adma, place:zeboyim], mentions: [place:sodoma, place:gomorra, place:egipto, event:exodo], note: "Si abandonan el pacto, la tierra quedará arrasada como las cuatro ciudades destruidas en tiempos de Lot y el pueblo acabará desterrado. Los dioses ajenos no llevan nombre."}
    - {v: "29", type: speech, note: "Lo oculto es de Jehová; lo que él ha dado a conocer es de Israel y de sus hijos, para que lo pongan en práctica."}
  30:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: prophecy, entities: [event:pacto-con-israel-en-moab, person:moises], note: "Si el pueblo dispersado vuelve a Jehová, él lo recogerá de las naciones, lo devolverá a la tierra y purificará su corazón. Las referencias remiten al regreso de Babilonia (Esd 1:2, 3)."}
    - {v: 11-14, type: speech, entities: [event:pacto-con-israel-en-moab], note: "El mandamiento no queda lejos, ni arriba en el cielo ni al otro lado del mar: está en su boca y en su corazón. Pablo cita estas palabras en Ro 10:6-8."}
    - {v: 15-20, type: speech, entities: [event:pacto-con-israel-en-moab, person:moises], mentions: [place:rio-jordan, person:abrahan, person:isaac, person:jacob], note: "Moisés pone al pueblo ante una elección con testigos: obedecer y vivir largo tiempo en la tierra jurada a los patriarcas, o servir a otros dioses y perecer tras cruzar el Jordán."}
  31:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: speech, entities: [event:moises-anima-a-israel-y-a-josue, person:moises, person:josue-hijo-de-nun, place:llanuras-deserticas-de-moab, person:sehon, person:og, event:israel-vence-a-sehon, event:israel-vence-a-og, relation:moises/holds_office/-/leader], mentions: [place:rio-jordan], note: "Moisés, con 120 años, no cruzará el Jordán. Jehová hará con las naciones lo que hizo con Sehón y Og, reyes amorreos. Los amorreos son un pueblo."}
    - {v: 7-8, type: narration, entities: [event:moises-anima-a-israel-y-a-josue, person:josue-hijo-de-nun, person:moises, relation:josue-hijo-de-nun/succeeds/moises, relation:josue-hijo-de-nun/holds_office/-]}
    - {v: 9-13, type: law, entities: [event:moises-escribe-la-ley-y-la-confia-a-los-sacerdotes, person:moises], mentions: [place:rio-jordan], note: "Cada siete años, en la Fiesta de las Cabañas del año en que se perdonan las deudas, se leerá la Ley a hombres, mujeres, niños y extranjeros. La referencia lleva a Ne 8."}
    - {v: 14-15, type: narration, entities: [event:jehova-comisiona-a-josue-en-la-tienda-de-reunion, person:moises, person:josue-hijo-de-nun, relation:josue-hijo-de-nun/holds_office/-]}
    - {v: 16-22, type: prophecy, entities: [event:jehova-comisiona-a-josue-en-la-tienda-de-reunion, person:moises], note: "Jehová predice que, ya saciado en la tierra, el pueblo seguirá a dioses extranjeros y romperá el pacto. La canción quedará como testigo; Moisés la escribe ese día y la enseña. Los dioses no llevan nombre."}
    - {v: "23", type: narration, entities: [event:jehova-comisiona-a-josue-en-la-tienda-de-reunion, person:josue-hijo-de-nun, relation:josue-hijo-de-nun/succeeds/moises, relation:josue-hijo-de-nun/kin/nun], mentions: [person:nun]}
    - {v: 24-29, type: speech, entities: [event:moises-escribe-la-ley-y-la-confia-a-los-sacerdotes, person:moises], note: "El libro de la Ley queda junto al arca del pacto como testigo. Moisés reúne a ancianos y funcionarios y prevé que, tras su muerte, el pueblo se desviará."}
    - {v: "30", type: narration, entities: [event:moises-recita-su-cancion-ante-israel, person:moises]}
  32:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: poetry, entities: [event:moises-recita-su-cancion-ante-israel, person:moises], note: "Empieza la canción: Moisés proclama el nombre de Jehová, la Roca de obras perfectas, y reprocha a un pueblo torcido que no le corresponde."}
    - {v: 7-14, type: poetry, mentions: [person:adan, event:torre-de-babel, place:basan], note: "Dios repartió las naciones al separar a los hijos de Adán. Jacob, aquí el pueblo, es su herencia: lo halló en el desierto, lo guio como un águila y lo alimentó con lo mejor, hasta carneros de Basán."}
    - {v: 15-18, type: poetry, note: "Jesurún, título honroso de Israel (Perspicacia «Jesurún»), engordó y abandonó a la Roca que lo creó para ofrecer sacrificios a demonios y a dioses nuevos."}
    - {v: 19-35, type: poetry, mentions: [place:sodoma, place:gomorra], note: "Jehová les dará la espalda, provocará sus celos con una nación que no es pueblo y enviará calamidades. La vid de sus enemigos es como la de Sodoma y Gomorra. Suya es la venganza (Ro 12:19)."}
    - {v: 36-43, type: poetry, note: "Jehová tendrá compasión de sus siervos, demostrará que no hay otro Dios, se vengará de sus enemigos e invita a las naciones a alegrarse con su pueblo (Ro 15:10)."}
    - {v: 44-47, type: narration, entities: [event:moises-recita-su-cancion-ante-israel, person:moises, person:josue-hijo-de-nun, relation:josue-hijo-de-nun/kin/nun], mentions: [person:nun, place:rio-jordan], note: "Josué recita la canción con Moisés, que lo llama por su nombre original, Hosea."}
    - {v: 48-52, type: narration, entities: [event:jehova-manda-a-moises-subir-al-monte-nebo, person:moises, place:llanuras-deserticas-de-moab, place:monte-nebo, place:abarim, place:moab, relation:moises/died_in/monte-nebo, person:aaron, relation:moises/kin/aaron, place:monte-hor, relation:aaron/died_in/monte-hor, event:muerte-de-aaron, place:meriba-de-cades, place:desierto-de-zin, event:agua-del-penasco-en-meriba, journey:moises-sube-al-nebo], mentions: [place:jerico, place:canaan, place:cades]}
  33:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:moises-bendice-a-las-tribus, person:moises], mentions: [place:llanuras-deserticas-de-moab], note: "Moisés, llamado hombre del Dios verdadero, bendice a los israelitas poco antes de morir. Perspicacia pone el libro entero en las llanuras de Moab."}
    - {v: 2-5, type: poetry, entities: [event:moises-bendice-a-las-tribus, place:desierto-de-paran], mentions: [place:monte-sinai, place:seir, event:jehova-desciende-sobre-el-monte-sinai, event:pacto-de-la-ley, person:moises], note: "Jehová llega desde Sinaí, Seír y los montes de Parán con miríadas de santos, y Moisés da la Ley. Jesurún, «el recto», es un título de Israel según Perspicacia: sin ficha."}
    - {v: "6", type: poetry, entities: [event:moises-bendice-a-las-tribus], note: "Rubén: que viva y no quede reducido a pocos. Es la tribu, no el hijo de Jacob. Simeón no se nombra en la bendición."}
    - {v: "7", type: poetry, entities: [event:moises-bendice-a-las-tribus], note: "Judá: Moisés pide a Jehová que lo escuche, lo haga volver con los suyos y lo ayude contra sus enemigos. Es la tribu, sin ficha."}
    - {v: 8-11, type: poetry, entities: [event:moises-bendice-a-las-tribus, place:masa, event:agua-de-la-roca-en-horeb], mentions: [person:aaron, event:levitas-matan-a-los-idolatras, place:meriba-de-cades, event:agua-del-penasco-en-meriba], note: "Leví guarda el Tumim y el Urim, enseña la Ley y sirve en el altar. La referencia de Meribá lleva a Nú 20:13, en Cadés; Perspicacia «Meribá», núm. 2, ve posible que aluda a Refidim, junto a Masá."}
    - {v: "12", type: poetry, entities: [event:moises-bendice-a-las-tribus], note: "Benjamín, el amado de Jehová, vivirá seguro bajo su protección todo el día."}
    - {v: 13-17, type: poetry, entities: [event:moises-bendice-a-las-tribus], mentions: [person:jose-hijo-de-jacob, event:moises-ante-la-zarza-ardiente, place:territorio-de-efrain, place:manases], note: "La tierra de José tendrá rocío, manantiales y buenas cosechas, con el favor del que estaba en la zarza. Efraín contará decenas de miles y Manasés miles: Perspicacia «Efraín» ve ahí su primacía."}
    - {v: 18-19, type: poetry, entities: [event:moises-bendice-a-las-tribus, place:zabulon], note: "Zabulón e Isacar se alegrarán en sus salidas y en sus tiendas y sacarán riquezas del mar y de la arena. Perspicacia «Zabulón» lo relaciona con su salida a dos mares."}
    - {v: 20-21, type: poetry, entities: [event:moises-bendice-a-las-tribus], mentions: [event:moises-da-a-gad-y-ruben-la-tierra-al-este-del-jordan], note: "Gad, agazapado como un león, escogió primero su parte al este del Jordán (Nú 32:1-5). Su territorio aún no tiene ficha: lo creará Josué."}
    - {v: "22", type: poetry, entities: [event:moises-bendice-a-las-tribus], mentions: [place:basan, person:sanson], note: "Dan es un cachorro de león que salta desde Basán. Perspicacia «Dan» ve la bendición cumplida en Sansón."}
    - {v: "23", type: poetry, entities: [event:moises-bendice-a-las-tribus, place:neftali], mentions: [place:mar-de-galilea], note: "Neftalí, colmado del favor de Jehová, toma el oeste y el sur. Según Perspicacia, «oeste» puede leerse «mar», el de Galilea, y la bendición alude a su tierra."}
    - {v: 24-25, type: poetry, entities: [event:moises-bendice-a-las-tribus], note: "Aser, bendecido con hijos y querido por sus hermanos, bañará sus pies en aceite; sus puertas tendrán cerrojos de hierro y cobre."}
    - {v: 26-29, type: poetry, entities: [event:moises-bendice-a-las-tribus], note: "Nadie iguala al Dios de Jesurún: es refugio desde siempre, echa a los enemigos y deja a Israel vivir seguro en una tierra de grano y vino."}
  34:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: narration, entities: [event:muerte-de-moises, person:moises, place:monte-nebo, place:pisga, place:llanuras-deserticas-de-moab, place:jerico, relation:moises/lived_in/llanuras-deserticas-de-moab, journey:moises-sube-al-nebo], mentions: [place:galaad, place:dan, place:neftali, place:territorio-de-efrain, place:manases, place:juda, place:mar-grande, place:negueb, place:distrito-del-jordan, place:zoar, person:abrahan, person:isaac, person:jacob], note: "Desde Pisgá, Jehová le enseña la tierra jurada a los patriarcas, de Galaad a Dan y hasta Zóar. Según Perspicacia «Dan», ese nombre quizá se debe a que Josué escribió el final del libro."}
    - {v: 5-8, type: narration, entities: [event:muerte-de-moises, person:moises, place:moab, place:bet-peor, place:llanuras-deserticas-de-moab, relation:moises/died_in/monte-nebo], mentions: [place:monte-nebo], note: "Moisés muere en Moab a los 120 años, sin perder vista ni vigor. Jehová lo entierra en el valle frente a Bet-Peor, en un sitio que nadie conoce, e Israel lo llora 30 días."}
    - {v: "9", type: narration, entities: [person:josue-hijo-de-nun, relation:josue-hijo-de-nun/succeeds/moises, relation:josue-hijo-de-nun/kin/nun, event:moises-nombra-a-josue-su-sucesor, person:moises], mentions: [person:nun], note: "Josué está lleno de sabiduría porque Moisés le impuso las manos, y los israelitas le obedecen. La imposición de manos es la de Nú 27:18-23."}
    - {v: 10-12, type: narration, entities: [person:moises, relation:moises/holds_office/-/prophet], mentions: [place:egipto], note: "Cierre del libro: Israel no volvió a tener un profeta como Moisés, que trató con Jehová cara a cara e hizo las señales contra el faraón en Egipto. El faraón no lleva nombre."}
