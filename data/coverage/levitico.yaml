# biblical-earth: cobertura de un libro. Formato en data/coverage/README.md.
book: levitico
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:jehova-da-a-moises-las-leyes-de-las-ofrendas, person:moises], note: "Jehová llama a Moisés desde la tienda de reunión y empieza a darle leyes para el pueblo: el animal que se ofrezca debe ser vacuno, oveja o cabra."}
    - {v: 3-9, type: law, mentions: [person:aaron], note: "Ofrenda quemada de ganado vacuno: un macho sano, dado de buena gana. El oferente le pone la mano en la cabeza; los sacerdotes, hijos de Aarón, echan la sangre y queman todo."}
    - {v: 10-13, type: law, mentions: [person:aaron], note: "Ofrenda quemada de carnero joven o de cabra, macho y sano, degollado al norte del altar; se lavan intestinos y patas y se quema entero."}
    - {v: 14-17, type: law, note: "Ofrenda quemada de aves: tórtolas o palomas jóvenes. La sangre corre por el costado del altar; el buche y las plumas van al este, donde se echan las cenizas."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: law, entities: [event:jehova-da-a-moises-las-leyes-de-las-ofrendas, person:aaron], note: "Ofrenda de grano: harina fina con aceite y olíbano. Un puñado se quema como muestra; lo demás, cosa santísima, es para Aarón y sus hijos."}
    - {v: 4-10, type: law, entities: [person:aaron], note: "Ofrendas de grano cocidas al horno, en plancha o en cacerola, siempre sin levadura y con aceite. El sacerdote quema una parte y el resto queda para Aarón y sus hijos."}
    - {v: 11-13, type: law, note: "Nada con levadura ni con miel se quema en el altar, aunque puede darse como primicia. Toda ofrenda de grano lleva sal, la del pacto con Dios."}
    - {v: 14-16, type: law, note: "Ofrenda de los primeros frutos: grano nuevo tostado y machacado, con aceite y olíbano; se quema una porción como muestra."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: law, entities: [event:jehova-da-a-moises-las-leyes-de-las-ofrendas], mentions: [person:aaron], note: "Sacrificio de paz de ganado vacuno, macho o hembra sano. Se degüella a la entrada de la tienda; se queman la grasa de las entrañas, los riñones y la membrana del hígado."}
    - {v: 6-11, type: law, mentions: [person:aaron], note: "Sacrificio de paz del rebaño, macho o hembra, como un carnero joven: además de esa grasa, se quema la cola gorda entera, cortada junto al espinazo. Es la porción de Dios, llamada pan."}
    - {v: 12-16, type: law, mentions: [person:aaron], note: "Sacrificio de paz de cabra, con las mismas partes quemadas. Toda la grasa es de Jehová."}
    - {v: "17", type: law, note: "Norma para siempre y en cualquier lugar: los israelitas nunca comerán grasa ni sangre."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-12, type: law, entities: [event:jehova-da-a-moises-las-leyes-de-las-ofrendas, person:moises], note: "Jehová sigue hablando a Moisés del pecado cometido sin querer. Si peca el sacerdote ungido, ofrece un toro joven; su sangre se salpica ante la cortina y el resto del animal se quema fuera del campamento."}
    - {v: 13-21, type: law, note: "Si toda la asamblea de Israel, un pueblo sin ficha, peca sin saberlo, los ancianos imponen las manos sobre otro toro, que se trata igual y se quema fuera del campamento."}
    - {v: 22-26, type: law, note: "Un jefe que peca sin querer lleva un cabrito macho sano; con su sangre se untan los cuernos del altar grande y su grasa arde encima."}
    - {v: 27-35, type: law, note: "Una persona cualquiera del pueblo lleva una cabra o una cordera sana; el sacerdote hace expiación por ella y queda perdonada."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: law, entities: [event:jehova-da-a-moises-las-leyes-de-las-ofrendas], note: "Callar como testigo, tocar algo impuro o jurar a la ligera hacen culpable. Quien se da cuenta lo confiesa y ofrece una cordera o una cabrita."}
    - {v: 7-13, type: law, note: "El pobre puede dar dos tórtolas o dos pichones, y quien no llega ni a eso, un décimo de efá de harina fina, sin aceite ni olíbano."}
    - {v: 14-19, type: law, entities: [person:moises], note: "Ofrenda por la culpa: por una falta contra las cosas santas, un carnero valorado en siclos del santuario y la compensación con un quinto más. También por faltas ignoradas."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: law, entities: [event:jehova-da-a-moises-las-leyes-de-las-ofrendas, person:moises], note: "Quien engaña, roba o niega con juramento falso lo hallado o lo confiado devuelve todo con un quinto más al dueño y ofrece un carnero por la culpa."}
    - {v: 8-13, type: law, entities: [person:aaron], mentions: [person:moises], note: "Órdenes para Aarón y sus hijos: la ofrenda quemada arde toda la noche y el fuego del altar nunca se apaga. Las cenizas salen del campamento a un lugar puro."}
    - {v: 14-18, type: law, mentions: [person:aaron], note: "Ofrenda de grano: un puñado se quema en el altar y el resto lo comen, sin levadura, los varones descendientes de Aarón en el patio de la tienda."}
    - {v: 19-23, type: law, mentions: [person:moises, person:aaron], note: "El día de su unción, el sacerdote ofrece un décimo de efá de harina fina, mitad por la mañana y mitad por la tarde. La ofrenda de grano de un sacerdote se quema entera."}
    - {v: 24-30, type: law, mentions: [person:moises, person:aaron], note: "Ofrenda por el pecado: la come el sacerdote en el patio. Se rompe la vasija de barro donde se coció. Si su sangre entró en el lugar santo, se quema."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: law, entities: [event:jehova-da-a-moises-las-leyes-de-las-ofrendas, person:aaron], note: "Ley de la ofrenda por la culpa, igual que la del pecado. El sacerdote que oficia recibe la carne, la piel de la ofrenda quemada y el grano cocido; el resto se reparte entre los hijos de Aarón."}
    - {v: 11-21, type: law, note: "Sacrificio de paz: con panes si es de gratitud, y comido el mismo día; si es voto o voluntario, hasta el día siguiente. Lo del tercer día se quema. El impuro que lo come es eliminado."}
    - {v: 22-27, type: law, entities: [person:moises], note: "Prohibido comer la grasa del toro, del carnero y de la cabra, y cualquier sangre, de ave o de otro animal. Quien lo haga será eliminado de su pueblo."}
    - {v: 28-36, type: law, entities: [person:aaron], mentions: [person:moises], note: "Del sacrificio de paz, el pecho mecido y la pata derecha son para Aarón y sus hijos, porción fija desde el día de su unción."}
    - {v: 37-38, type: law, entities: [event:jehova-da-a-moises-las-leyes-de-las-ofrendas, person:moises, place:monte-sinai, place:desierto-de-sinai], note: "Resumen de las seis leyes: quemada, de grano, por el pecado, por la culpa, de instalación y de paz. Jehová las dio a Moisés en el Sinaí."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [event:instalacion-del-sacerdocio, person:moises, person:aaron, place:desierto-de-sinai], note: "Jehová manda reunir al pueblo ante la tienda de reunión con las prendas, el aceite, el toro, los dos carneros y los panes."}
    - {v: 6-13, type: narration, entities: [event:instalacion-del-sacerdocio, person:moises, person:aaron, person:nadab-hijo-de-aaron, person:abihu, person:eleazar-hijo-de-aaron, person:itamar], note: "Lavado, vestiduras y unción de Aarón y del tabernáculo. El texto no nombra a los hijos; Perspicacia «Instalación» da sus cuatro nombres."}
    - {v: 14-21, type: narration, entities: [event:instalacion-del-sacerdocio, person:moises, person:aaron], note: "El toro por el pecado, cuyos restos se queman fuera del campamento, y el carnero quemado entero en el altar."}
    - {v: 22-30, type: narration, entities: [event:instalacion-del-sacerdocio, person:moises, person:aaron], note: "El carnero del nombramiento: sangre en la oreja, el pulgar y el dedo del pie; ofrenda mecida; el pecho queda para Moisés."}
    - {v: 31-36, type: narration, entities: [event:instalacion-del-sacerdocio, person:aaron, person:moises], note: "Los sacerdotes comen la carne con el pan y no se apartan de la entrada de la tienda durante siete días."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: narration, entities: [event:aaron-ofrece-los-primeros-sacrificios, person:moises, person:aaron, place:desierto-de-sinai], note: "Al octavo día Moisés convoca a Aarón, a los hijos de este y a los ancianos, que no se nombran, y dice qué animales presentar."}
    - {v: 8-14, type: narration, entities: [event:aaron-ofrece-los-primeros-sacrificios, person:aaron, person:nadab-hijo-de-aaron, person:abihu, person:eleazar-hijo-de-aaron, person:itamar], mentions: [person:moises], note: "Aarón sacrifica por sí mismo el ternero y la ofrenda quemada; sus hijos, que el texto no nombra y Perspicacia «Abihú» sí, le acercan la sangre y los trozos."}
    - {v: 15-21, type: narration, entities: [event:aaron-ofrece-los-primeros-sacrificios, person:aaron], mentions: [person:moises], note: "Por el pueblo: el macho cabrío, la ofrenda quemada, la de grano y los sacrificios de paz, con el pecho y la pata mecidos."}
    - {v: 22-24, type: narration, entities: [event:aaron-ofrece-los-primeros-sacrificios, person:aaron, person:moises], note: "Bendición al pueblo; la gloria de Jehová se aparece y su fuego consume lo que hay en el altar. El pueblo grita y se postra."}
  10:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:muerte-de-nadab-y-abihu, person:nadab-hijo-de-aaron, person:abihu, person:aaron, person:moises, place:desierto-de-sinai, relation:nadab-hijo-de-aaron/kin/aaron, relation:abihu/kin/aaron, relation:nadab-hijo-de-aaron/kin/abihu, relation:nadab-hijo-de-aaron/died_in/desierto-de-sinai, relation:abihu/died_in/desierto-de-sinai], note: "Aarón calla ante lo que Jehová dice por medio de Moisés."}
    - {v: 4-7, type: narration, entities: [event:muerte-de-nadab-y-abihu, person:misael-hijo-de-uziel, person:elizafan-hijo-de-uziel, person:uziel-hijo-de-cohat, person:eleazar-hijo-de-aaron, person:itamar, relation:misael-hijo-de-uziel/kin/uziel-hijo-de-cohat, relation:elizafan-hijo-de-uziel/kin/uziel-hijo-de-cohat, relation:misael-hijo-de-uziel/kin/elizafan-hijo-de-uziel, relation:aaron/kin/uziel-hijo-de-cohat, relation:eleazar-hijo-de-aaron/kin/aaron, relation:itamar/kin/aaron, relation:nadab-hijo-de-aaron/kin/eleazar-hijo-de-aaron, relation:nadab-hijo-de-aaron/kin/itamar, relation:eleazar-hijo-de-aaron/kin/itamar, person:moises, person:aaron], note: "El texto escribe Elzafán. «Toda la casa de Israel» es el pueblo, sin ficha."}
    - {v: 8-11, type: law, entities: [event:muerte-de-nadab-y-abihu, person:aaron], mentions: [person:moises], note: "Ese mismo día, justo después, Jehová habla a Aarón: los sacerdotes no beberán vino ni licor al entrar en la tienda, para distinguir lo santo y enseñar las normas dadas por Moisés."}
    - {v: 12-20, type: narration, entities: [event:moises-reclama-por-la-ofrenda-por-el-pecado, person:moises, person:aaron, person:eleazar-hijo-de-aaron, person:itamar], note: "Las hijas de Aarón, sin nombre, también comen el pecho y la pata de los sacrificios de paz."}
  11:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: law, entities: [event:jehova-da-las-leyes-de-lo-puro-y-lo-impuro, person:moises, person:aaron], note: "Jehová habla a Moisés y a Aarón. Se come el animal terrestre rumiante con la pezuña partida; el camello, el damán, la liebre y el cerdo no, y tampoco se toca su cadáver."}
    - {v: 9-12, type: law, note: "De los peces y demás animales del agua solo se comen los que tienen aletas y escamas; los otros son asquerosos."}
    - {v: 13-23, type: law, note: "Aves prohibidas, del águila al murciélago, y los insectos con alas. Solo se comen los que saltan con patas largas: langostas, grillos y saltamontes."}
    - {v: 24-40, type: law, note: "Tocar o cargar el cadáver de un animal impuro deja impuro hasta el atardecer y obliga a lavar la ropa. Los utensilios tocados se lavan o se rompen; manantiales y cisternas siguen puros."}
    - {v: 41-47, type: law, mentions: [place:egipto, event:exodo], note: "Nada que se arrastra o pulula por el suelo se come. Israel debe ser santo porque Jehová es santo (1Pe 1:16 lo cita). La ley separa lo puro de lo impuro."}
  12:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: law, entities: [event:jehova-da-las-leyes-de-lo-puro-y-lo-impuro, person:moises], note: "Jehová habla a Moisés. Si nace un niño, la madre es impura siete días, el hijo se circuncida al octavo y ella sigue 33 días purificándose; si es niña, 14 y 66."}
    - {v: 6-8, type: law, note: "Luego lleva al sacerdote un carnero joven y una paloma o tórtola; si es pobre, dos tórtolas o dos pichones. Lu 2:22-24 aplica esta ley a la purificación de María."}
  13:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: law, entities: [event:jehova-da-las-leyes-de-lo-puro-y-lo-impuro, person:moises, person:aaron], note: "Jehová habla a Moisés y a Aarón. Quien tenga una mancha en la piel va al sacerdote Aarón o a uno de sus hijos, sin nombre; si hay duda, lo aíslan siete días."}
    - {v: 9-17, type: law, note: "Lepra crónica: hinchazón blanca con carne viva, impuro sin cuarentena. Si toda la piel se vuelve blanca es puro. La palabra hebrea abarca varias enfermedades contagiosas de la piel, dice la nota."}
    - {v: 18-28, type: law, note: "Una úlcera curada o una quemadura que dejan una mancha: si es más honda que la piel y el pelo blanquea, es lepra; si no, siete días de cuarentena."}
    - {v: 29-37, type: law, note: "Infección de la cabeza o de la barba: pelo amarillo y ralo indica lepra. Si no avanza y le crece pelo negro, está curado; mientras, se afeita sin tocar la zona."}
    - {v: 38-44, type: law, note: "Las manchas blancuzcas son una erupción sin peligro y la calvicie no hace impuro. Una llaga blanca rojiza en la calva sí es lepra."}
    - {v: 45-46, type: law, note: "El leproso lleva la ropa rasgada, el pelo suelto y la boca tapada, avisa a gritos de que es impuro y vive aparte, fuera del campamento."}
    - {v: 47-59, type: law, note: "Lepra en telas de lana o de lino y en objetos de cuero: el sacerdote aparta la pieza siete días; si la mancha se extiende o no cambia tras lavarla, se quema."}
  14:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: law, entities: [event:jehova-da-las-leyes-de-lo-puro-y-lo-impuro, person:moises], note: "Rito del primer día, fuera del campamento, para el leproso ya sano: dos pájaros, cedro, hilo escarlata e hisopo; uno muere sobre agua corriente y el otro se suelta. A los siete días se rapa entero."}
    - {v: 10-20, type: law, note: "Al octavo día, ante la tienda de reunión: ofrendas por la culpa, por el pecado, quemada y de grano; sangre y aceite en oreja, pulgar y dedo gordo derechos. Jesús remitió a esta ley (Mt 8:4)."}
    - {v: 21-32, type: law, note: "Si el curado es pobre, basta un carnero para la ofrenda por la culpa, menos harina y dos tórtolas o pichones en lugar de los otros animales; el rito de la sangre y el aceite no cambia."}
    - {v: 33-42, type: law, entities: [person:moises, person:aaron], mentions: [place:canaan], note: "Ley para cuando vivan en Canaán: si una casa muestra manchas verdosas o rojizas, el sacerdote la cierra siete días y, si crecen, se cambian las piedras dañadas y se raspa el interior. Perspicacia «Lepra» sugiere moho, sin asegurarlo."}
    - {v: 43-47, type: law, note: "Si la mancha reaparece, la casa es impura: se derriba y sus escombros se tiran fuera de la ciudad. Quien entra, duerme o come allí durante la cuarentena queda impuro o debe lavar su ropa."}
    - {v: 48-53, type: law, note: "Si la mancha no vuelve tras el nuevo revoque, el sacerdote declara pura la casa y la purifica con el mismo rito de los dos pájaros, el cedro, el hisopo y el hilo escarlata."}
    - {v: 54-57, type: law, note: "Cierre: estas normas sirven para decidir qué es puro y qué impuro en la lepra de personas, ropa y casas, y en otras afecciones de la piel."}
  15:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-12, type: law, entities: [event:jehova-da-las-leyes-de-lo-puro-y-lo-impuro, person:moises, person:aaron], note: "Jehová da a Moisés y a Aarón la ley del hombre con flujo genital: su cama, su asiento y su montura quedan impuros, y también quien lo toca o recibe su saliva. La vasija de barro que toca se rompe."}
    - {v: 13-15, type: law, note: "Cuando se cura el flujo, el hombre cuenta siete días, se lava en agua corriente y al octavo lleva dos tórtolas o pichones al sacerdote: una por el pecado y otra quemada."}
    - {v: 16-18, type: law, note: "La emisión de semen obliga a bañarse y deja impuro hasta la tarde, también a la mujer con quien el hombre se acuesta; la ropa o el cuero manchados se lavan."}
    - {v: 19-24, type: law, note: "La regla deja a la mujer impura siete días; su cama, su asiento y quien los toca quedan impuros. El hombre que se acuesta con ella en esos días queda impuro siete días."}
    - {v: 25-30, type: law, note: "Un sangrado fuera de tiempo o más largo de lo normal impurifica como la regla; al cesar, siete días de espera y dos aves al octavo. Las referencias remiten a la mujer con flujo de sangre (Mt 9:20; Lu 8:43)."}
    - {v: 31-33, type: law, note: "Fin de la ley: apartar a Israel de la impureza para que nadie muera por contaminar el tabernáculo de Jehová en medio del campamento, y resumen de los casos."}
  16:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: law, entities: [event:jehova-da-la-ley-del-dia-de-expiacion, person:moises, person:aaron, relation:moises/kin/aaron], mentions: [person:nadab-hijo-de-aaron, person:abihu, event:muerte-de-nadab-y-abihu], note: "Muertos Nadab y Abihú (Le 10), Aarón solo pasará tras la cortina en ropa de lino. Echa suertes entre dos cabritos: uno para Jehová y otro para Azazel, palabra que no es persona ni lugar."}
    - {v: 11-19, type: law, entities: [person:aaron], note: "Aarón mata el toro por él y su casa, llena el Santísimo con la nube del incienso y salpica siete veces la sangre del toro y del cabrito ante la cubierta del Arca y sobre el altar."}
    - {v: 20-28, type: law, entities: [person:aaron], note: "Confiesa los pecados del pueblo sobre el cabrito vivo, que un hombre sin nombre lleva al desierto. Los restos de las ofrendas se queman fuera del campamento, y quienes los manejan se lavan antes de volver."}
    - {v: 29-34, type: law, mentions: [person:moises], note: "Estatuto permanente: el día 10 del mes séptimo, sábado de descanso completo en que todos se humillan, con expiación una vez al año. El versículo 34 dice que se cumplió, sin fecha ni lugar."}
  17:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: law, entities: [event:jehova-da-leyes-para-que-israel-sea-santo, person:moises, person:aaron], note: "Quien mate un toro, un carnero o una cabra debe llevarlo a la entrada de la tienda como sacrificio de paz y no ofrecerlo a los demonios con forma de cabra."}
    - {v: 8-9, type: law, note: "Israelita o extranjero: cualquier ofrenda quemada o sacrificio se presenta a la entrada de la tienda, o su autor es eliminado del pueblo."}
    - {v: 10-16, type: law, note: "Nadie come sangre, porque la vida está en ella y Jehová la dio para expiar en el altar. La sangre de la caza se derrama y se tapa con tierra; comer un animal muerto obliga a lavarse."}
  18:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: law, entities: [event:jehova-da-leyes-para-que-israel-sea-santo, person:moises], mentions: [place:egipto, place:canaan], note: "Israel no seguirá las costumbres de Egipto, donde vivió, ni las de Canaán, adonde Jehová lo lleva, sino sus estatutos, que dan vida a quien los cumple."}
    - {v: 6-18, type: law, note: "Prohibidas las relaciones con parientes cercanos: padres, madrastra, hermanas y medio hermanas, nietas, tías, nuera, cuñada, una mujer y su hija o su nieta, y la hermana de la esposa en vida de esta."}
    - {v: 19-23, type: law, note: "Tampoco con la mujer en su menstruación ni con la esposa del prójimo; nada de entregar hijos a Mólek, dios que Perspicacia liga a los ammonitas; ni relaciones entre hombres ni con animales."}
    - {v: 24-30, type: law, note: "Las naciones que Jehová expulsa contaminaron la tierra con esas prácticas y ella las vomitará. Si Israel, nativo o extranjero, hace lo mismo, correrá igual suerte y el culpable será eliminado."}
  19:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: law, entities: [event:jehova-da-leyes-para-que-israel-sea-santo, person:moises], note: "Jehová encarga a Moisés que pida a todo Israel ser santo, como lo es él. Sigue el habla de Le 17 y 18, sin nombres nuevos."}
    - {v: 3-4, type: law, note: "Respetar a la madre y al padre y guardar los sábados; ni dioses inútiles ni imágenes de metal fundido."}
    - {v: 5-8, type: law, note: "La carne del sacrificio de paz se come ese día o el siguiente; la que queda al tercero se quema, y quien la coma será eliminado del pueblo."}
    - {v: 9-10, type: law, note: "Al cosechar se dejan los bordes del campo, la rebusca y las uvas caídas para el pobre y el extranjero."}
    - {v: 11-18, type: law, note: "Nada de robo, mentira ni falso juramento; el jornal se paga el mismo día; justicia imparcial, sin calumnias ni venganza. El v. 18 manda amar al prójimo como a uno mismo; Jesús lo cita en Mt 22:39."}
    - {v: "19", type: law, note: "Prohibido cruzar animales de especies distintas, sembrar dos semillas en un campo y vestir tela de dos hilos mezclados."}
    - {v: 20-22, type: law, note: "Si un hombre se acuesta con una sierva prometida que no ha sido rescatada, se castiga a los dos sin pena de muerte; él ofrece un carnero por la culpa."}
    - {v: 23-25, type: law, note: "Ya en la tierra prometida, el fruto de un árbol recién plantado no se come en tres años; el del cuarto es santo y desde el quinto es para ellos."}
    - {v: 26-31, type: law, note: "Nada con sangre, ni agüeros ni magia; no afeitarse los lados de la cabeza ni cortarse por un difunto ni tatuarse; no prostituir a la hija; respetar el santuario y rehuir a médiums y adivinos."}
    - {v: 32-37, type: law, mentions: [place:egipto, event:exodo], note: "Honrar a los ancianos; tratar al extranjero como a uno del país y amarlo, porque Israel fue extranjero en Egipto; balanzas y medidas justas. Jehová recuerda que los sacó de Egipto."}
  20:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: law, entities: [event:jehova-da-leyes-para-que-israel-sea-santo, person:moises], note: "Muere apedreado quien dé un hijo a Mólek, sea israelita o extranjero. Mólek es un dios sin ficha, ligado sobre todo a los ammonitas según Perspicacia. Israel, en el v. 2, es el pueblo."}
    - {v: 6-8, type: law, note: "Jehová se pondrá contra quien acuda a médiums y adivinos. El pueblo debe santificarse y cumplir sus estatutos."}
    - {v: 9-21, type: law, note: "Penas por maldecir al padre o a la madre, el adulterio, el incesto, el sexo entre hombres, con animales o durante la menstruación. Algunos casos se castigan con la muerte; otros, con quedarse sin hijos."}
    - {v: 22-26, type: law, note: "Si obedecen, la tierra que mana leche y miel no los vomitará como a las naciones que Jehová expulsa. Deben distinguir animales puros e impuros y ser santos. La tierra y esas naciones no se nombran."}
    - {v: "27", type: law, note: "El hombre o la mujer que actúe como médium o adivino muere apedreado."}
  21:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: law, entities: [event:jehova-da-las-leyes-de-santidad-de-los-sacerdotes, person:moises, person:aaron], note: "El sacerdote solo se contamina por un cadáver de un pariente cercano; nada de raparse ni cortarse por luto; no se casa con prostituta ni divorciada. La hija que se prostituye muere quemada."}
    - {v: 10-15, type: law, note: "El sumo sacerdote ungido no se despeina ni rasga la ropa, no se acerca a ningún muerto, ni a su padre o su madre, no deja el santuario y solo se casa con una virgen de su pueblo."}
    - {v: 16-23, type: law, entities: [person:moises, person:aaron], note: "El descendiente de Aarón con un defecto físico (ciego, cojo, jorobado, enano y otros) come de lo santo, pero no presenta ofrendas ni se acerca a la cortina ni al altar."}
    - {v: "24", type: narration, entities: [event:jehova-da-las-leyes-de-santidad-de-los-sacerdotes, person:moises, person:aaron], note: "Moisés transmite estas normas a Aarón, a sus hijos y a todo Israel."}
  22:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: law, entities: [event:jehova-da-las-leyes-de-santidad-de-los-sacerdotes, person:moises, person:aaron], note: "El descendiente de Aarón impuro por lepra, flujo, semen o contacto con un muerto o un animal impuro no come lo santo hasta bañarse y ponerse el sol."}
    - {v: 10-16, type: law, note: "Quién come lo santo: no el huésped ni el jornalero; sí el esclavo del sacerdote y la hija viuda o divorciada sin hijos que vuelve a casa. Quien lo come por error lo paga y añade un quinto."}
    - {v: 17-25, type: law, entities: [person:moises, person:aaron], note: "Las ofrendas quemadas y de paz, por un voto o voluntarias, sean de israelitas o de extranjeros, han de ser animales sin defecto. Israel, en el v. 18, es el pueblo, como en Le 20:2."}
    - {v: 26-33, type: law, entities: [person:moises], mentions: [place:egipto, event:exodo], note: "La cría pasa siete días con su madre; no se mata el mismo día a una res y su cría; el sacrificio de agradecimiento se come en el día. Jehová recuerda que los sacó de Egipto."}
  23:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: law, entities: [event:jehova-da-las-leyes-de-las-fiestas-periodicas, person:moises], note: "Las fiestas periódicas de Jehová son reuniones santas. La primera es el sábado: seis días de trabajo y el séptimo, descanso completo."}
    - {v: 4-8, type: law, mentions: [event:jehova-instituye-la-pascua], note: "La Pascua, el 14 del primer mes al anochecer; desde el 15, siete días de Panes Sin Levadura, con reunión santa el primero y el séptimo."}
    - {v: 9-14, type: law, entities: [person:moises], note: "Ya en la tierra prometida, el sacerdote mece la primera gavilla de la cosecha el día después del sábado, con un carnero, grano y vino; hasta entonces no se come grano nuevo."}
    - {v: 15-22, type: law, note: "Se cuentan siete semanas, 50 días, y se ofrecen dos panes con levadura y más animales; es día de reunión santa (Pentecostés). Las orillas del campo y lo que queda se dejan al pobre y al extranjero."}
    - {v: 23-25, type: law, entities: [person:moises], note: "El día 1 del séptimo mes es de descanso y reunión santa, anunciado con toques de trompeta."}
    - {v: 26-32, type: law, entities: [person:moises], mentions: [event:jehova-da-la-ley-del-dia-de-expiacion], note: "El 10 del séptimo mes es el Día de Expiación: nadie trabaja y todos se humillan, de la tarde del 9 a la del 10; quien no lo haga será eliminado."}
    - {v: 33-43, type: law, entities: [person:moises], mentions: [place:egipto, event:exodo], note: "Desde el 15 del séptimo mes, siete días en cabañas con ramas y frutos, y el octavo, asamblea solemne; recuerdan cómo vivió Israel al salir de Egipto."}
    - {v: "44", type: narration, entities: [event:jehova-da-las-leyes-de-las-fiestas-periodicas, person:moises], note: "Moisés comunica a los israelitas las fiestas de Jehová."}
  24:
    status: complete
    reviewed_on: 2026-09-29
    note: "Cada habla de Jehová con leyes cae en un suceso de ley. Le 24:1-9 no tiene bloque propio en el esquema de Perspicacia y va con las fiestas, por ser culto fijo de cada sábado; Le 27 lleva el suyo."
    spans:
    - {v: 1-9, type: law, entities: [event:jehova-da-las-leyes-de-las-fiestas-periodicas, person:moises, person:aaron], note: "Aceite puro de oliva para que las lámparas del candelabro de oro ardan cada noche ante Jehová, y doce roscas de pan con olíbano sobre la mesa, renovadas cada sábado; Aarón y sus hijos las comen."}
    - {v: 10-12, type: narration, entities: [event:apedrean-al-hijo-de-selomit, person:selomit-hija-de-dibri, person:dibri, relation:selomit-hija-de-dibri/kin/dibri, relation:selomit-hija-de-dibri/kin/dan-hijo-de-jacob, relation:dibri/kin/dan-hijo-de-jacob, person:moises], note: "El hijo no tiene nombre y su padre egipcio tampoco; Dan es aquí la tribu, no el patriarca. Lo llevan ante Moisés y queda preso."}
    - {v: 13-22, type: law, entities: [event:apedrean-al-hijo-de-selomit, person:moises], note: "Quien maldiga el nombre de Jehová muere apedreado, sea israelita o extranjero. Quien mata a una persona muere; quien mata un animal lo paga. Lesión por lesión, con una sola ley para todos."}
    - {v: "23", type: narration, entities: [event:apedrean-al-hijo-de-selomit, person:moises], note: "Moisés transmite la orden y los israelitas lo apedrean fuera del campamento."}
  25:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: law, entities: [event:jehova-da-a-moises-las-leyes-del-jubileo, person:moises, place:monte-sinai], note: "Ya en la tierra prometida, cada séptimo año la tierra descansa: no se siembra ni se poda, y lo que brote solo es para todos, animales incluidos."}
    - {v: 8-22, type: law, mentions: [event:jehova-da-la-ley-del-dia-de-expiacion], note: "Tras siete veces siete años, el cuerno suena el Día de Expiación y el año 50 es Jubileo: libertad y cada uno recupera su tierra. Las ventas se tasan por las cosechas que faltan hasta él."}
    - {v: 23-34, type: law, note: "La tierra es de Jehová y no se vende para siempre: el pariente cercano la recompra o vuelve en el Jubileo. Las casas de ciudad amurallada tienen un año; las de los levitas, siempre."}
    - {v: 35-38, type: law, mentions: [place:egipto, place:canaan, event:exodo], note: "Al hermano empobrecido se le sostiene y se le presta sin intereses. Jehová los sacó de Egipto para darles Canaán."}
    - {v: 39-55, type: law, mentions: [place:egipto, event:exodo], note: "El israelita que se vende sirve como asalariado hasta el Jubileo y sale libre con sus hijos; puede recomprarlo un pariente. Los esclavos se compran de las naciones vecinas."}
  26:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: law, note: "Ni ídolos, ni columnas sagradas, ni piedras labradas para inclinarse; guardar los sábados y respetar el santuario."}
    - {v: 3-13, type: prophecy, mentions: [place:egipto, event:exodo], note: "Si obedecen: lluvias a tiempo, cosechas que se juntan, paz, victoria sobre enemigos muy superiores y el tabernáculo de Jehová en medio de ellos, que los sacó de Egipto."}
    - {v: 14-39, type: prophecy, note: "Si desobedecen, castigos siete veces mayores cada vez: enfermedad, derrota, sequía, fieras, espada, hambre, ciudades arrasadas y destierro, mientras la tierra desolada paga sus sábados."}
    - {v: 40-45, type: prophecy, mentions: [person:jacob, person:isaac, person:abrahan, place:egipto, event:exodo, event:jacob-suena-con-una-escalera-en-betel, event:jehova-confirma-el-pacto-con-isaac, event:pacto-con-abrahan, event:pacto-de-la-ley], note: "Si confiesan su error, Jehová recordará su pacto con Jacob, Isaac y Abrahán y el que hizo con los que sacó de Egipto, y no los exterminará. Los pactos, por las referencias: Gé 28:13, 26:3, 12:7 y Éx 24."}
    - {v: "46", type: narration, entities: [event:jehova-da-a-moises-las-leyes-del-jubileo, person:moises, place:monte-sinai], note: "Cierre de la sección: Jehová fijó estas normas y decisiones con Israel en el Sinaí, y Moisés fue su intermediario."}
  27:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: law, entities: [event:jehova-da-a-moises-las-leyes-de-los-votos, person:moises], note: "Valor de una persona ofrecida por voto, según sexo y edad, de 50 a 3 siclos de plata; al pobre el sacerdote le fija lo que pueda pagar."}
    - {v: 9-13, type: law, note: "El animal ofrecido por voto es santo y no se cambia; el impuro lo tasa el sacerdote, y quien lo recompra añade una quinta parte."}
    - {v: 14-25, type: law, note: "Casas y campos santificados: el campo se tasa por la semilla y los años hasta el Jubileo, y se recompra con una quinta parte más. El siclo del santuario vale 20 guerás."}
    - {v: 26-29, type: law, note: "El primogénito del ganado ya es de Jehová. Lo dedicado sin condiciones no se vende ni se recompra, y el condenado a destrucción no se rescata."}
    - {v: 30-33, type: law, note: "La décima parte de la cosecha, de los frutos y del ganado es santa; el animal décimo no se examina ni se cambia."}
    - {v: "34", type: narration, entities: [event:jehova-da-a-moises-las-leyes-de-los-votos, person:moises, place:monte-sinai], note: "Cierre del libro: todo esto lo mandó Jehová a Israel, por boca de Moisés, estando en el monte Sinaí."}
