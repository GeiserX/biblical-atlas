    spans:
    - {v: 1-4, type: narration, entities: [event:muerte-de-uza, person:david], mentions: [person:saul, place:israel, event:el-arca-queda-en-casa-de-abinadab], note: "David consulta a los jefes y a la congregación y propone llamar a todo Israel, con los sacerdotes y los levitas, para traer el Arca, olvidada en días de Saúl. Perspicacia «David» incluye esto en el primer intento."}
