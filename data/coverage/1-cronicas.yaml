    - {v: "1", type: narration, entities: [event:david-habla-a-los-principes-de-israel-sobre-el-templo, person:david], mentions: [place:jerusalen, place:israel], note: "Acuden los príncipes de las tribus, los jefes de las divisiones, de mil y de cien, los encargados de los bienes del rey y los oficiales de la corte, todos sin nombre aquí; sus nombres están en el capítulo 27."}
    - {v: 2-8, type: speech, entities: [event:david-habla-a-los-principes-de-israel-sobre-el-templo, person:david, person:salomon, relation:salomon/kin/david], mentions: [event:david-quiere-construir-una-casa-para-jehova, event:pacto-con-david, event:samuel-unge-a-david, event:david-prepara-los-materiales-para-el-templo, place:israel], note: "David quiso dar descanso al arca, pero Jehová reservó la obra a Salomón por la sangre que David derramó. Judá es la tribu escogida como líder; «la casa de mi padre» es la familia de Jesé, sin nombrarlo."}
    - {v: 9-10, type: speech, entities: [event:david-habla-a-los-principes-de-israel-sobre-el-templo, person:david, person:salomon], note: "David pide a Salomón que sirva a Dios de corazón completo y con gusto, porque Jehová examina los corazones."}
    - {v: 11-19, type: narration, entities: [event:david-entrega-a-salomon-el-plano-del-templo, person:david, person:salomon], note: "El plano abarca pórtico, almacenes, azotea, el compartimiento de la reconciliación, patios, comedores y tesoros, y el peso de candelabros, mesas del pan, altar del incienso y querubines de oro, la representación del carro."}
    - {v: 20-21, type: speech, entities: [event:david-entrega-a-salomon-el-plano-del-templo, person:david, person:salomon], note: "David asegura a Salomón que Jehová no lo abandonará hasta acabar la casa, y le presenta las divisiones de sacerdotes y levitas, los obreros, los príncipes y el pueblo."}
  29:
