    - {v: 23-28, type: list, entities: [event:david-rey-de-todo-israel, person:david, person:jehoiada-padre-de-benaya, person:sadoc-hijo-de-ahitub, place:hebron, relation:david/lived_in/hebron, relation:david/succeeds/saul, relation:jehoiada-padre-de-benaya/holds_office/-/leader], mentions: [person:saul, person:aaron], note: "Cuentas de los armados que fueron a Hebrón a hacer rey a David: Judá, Simeón y los levitas. Sadoc, joven y valiente, va con 22 jefes de su casa. Las tribus son pueblos, sin ficha."}
    - {v: 29-40, type: list, entities: [event:david-rey-de-todo-israel, person:david, place:hebron], mentions: [person:saul, place:rio-jordan, place:isacar, place:zabulon, place:neftali], note: "Siguen Benjamín, Efraín, Manasés, Isacar (que entendían los tiempos), Zabulón, Neftalí, Dan, Aser y las tribus del otro lado del Jordán. Comen y beben tres días en Hebrón; de Isacar, Zabulón y Neftalí llegan víveres."}
  13:
