    spans:
    - {v: 1-7, type: narration, entities: [event:discipulos-de-juan-en-efeso, event:apolos-en-acaya, journey:tercer-viaje, person:pablo, person:apolos, relation:apolos/lived_in/corinto, place:efeso, journey:apolos-de-efeso-a-corinto], mentions: [place:corinto, person:juan-el-bautista, person:jesus], note: "Mientras Apolos está en Corinto, Pablo cruza las regiones del interior y baja a Éfeso. Los unos doce hombres no tienen nombre y solo conocían el bautismo de Juan."}
