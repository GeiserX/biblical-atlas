    - {v: 10-19, type: narration, entities: [event:ananias-devuelve-la-vista-a-saulo, person:ananias-de-damasco, person:judas-de-damasco, person:pablo, person:jesus, place:calle-recta, relation:jesus/appears_to/ananias-de-damasco, relation:ananias-de-damasco/lived_in/damasco, relation:judas-de-damasco/lived_in/calle-recta, relation:pablo/tie/judas-de-damasco], mentions: [place:tarso, place:jerusalen], note: "En visión, el Señor envía a Ananías a la casa de Judas en la calle Recta, donde ora Saulo de Tarso, su instrumento escogido para las naciones. Ananías le impone las manos: recobra la vista y se bautiza."}
    - {v: 20-22, type: narration, entities: [event:pablo-predica-en-damasco, person:pablo, place:damasco, relation:pablo/lived_in/damasco], note: "Saulo predica en las sinagogas de Damasco que Jesús es el Hijo de Dios y el Cristo, para asombro de quienes lo sabían perseguidor."}
    - {v: 23-25, type: narration, entities: [event:huida-de-damasco, person:pablo, place:damasco], note: "Muchos días después los judíos traman matarlo y vigilan las puertas; sus discípulos lo bajan de noche en una canasta grande por una abertura de la muralla."}
    - {v: 26-30, type: narration, entities: [event:pablo-visita-a-cefas, event:pablo-enviado-a-tarso, person:pablo, person:bernabe, place:jerusalen, place:cesarea, place:tarso, relation:bernabe/accompanies/pablo@36, relation:pablo/lived_in/tarso], mentions: [place:damasco], note: "En Jerusalén los discípulos le temen; Bernabé lo lleva a los apóstoles, que según Gál 1:18, 19 fueron Pedro y Santiago. Discute con judíos de habla griega, que quieren matarlo, y los hermanos lo mandan a Tarso por Cesarea."}
    - {v: "31", type: narration, mentions: [place:judea, place:galilea, place:region-de-samaria], note: "Resumen, no escena: la congregación de Judea, Galilea y Samaria tiene paz, se fortalece y sigue creciendo. La nota del versículo explica por qué la TNM escribe aquí el temor de Jehová."}
    - {v: 32-35, type: narration, entities: [event:pedro-sana-a-eneas, person:pedro, person:eneas, place:lida, place:llanura-de-saron, relation:eneas/lived_in/lida, journey:pedro-de-lida-a-cesarea], note: "Pedro visita a los santos de Lida y cura a Eneas, paralítico desde hacía ocho años; los de Lida y de Sarón se vuelven al Señor."}
    - {v: 36-43, type: narration, entities: [event:pedro-resucita-a-dorcas, person:dorcas, person:pedro, person:simon-el-curtidor, place:jope, place:lida, relation:dorcas/lived_in/jope, relation:simon-el-curtidor/lived_in/jope, relation:pedro/tie/simon-el-curtidor], mentions: [event:hija-de-jairo], note: "Muere Tabita, o Dorcas, y desde Jope llaman a Pedro. Él ora a solas y la resucita, como hizo Jesús con la hija de Jairo (nota del v. 40). Luego se aloja en casa de Simón el curtidor."}
  10:
