book: hechos
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [person:teofilo], mentions: [person:jesus, person:lucas], note: "Lucas dedica a Teófilo la segunda parte de su relato. El primero, su Evangelio, llegaba hasta el día en que Jesús fue llevado al cielo (nota del v. 1)."}
    - {v: "3", type: narration, entities: [event:mandato-de-hacer-discipulos, person:jesus], mentions: [event:muerte-de-jesus, event:resurreccion-de-jesus], note: "Resumen de los 40 días: el resucitado da pruebas de que vive y habla del Reino. La tabla A7-H pone este versículo entre las apariciones posteriores al 16 de nisán."}
    - {v: 4-5, type: narration, entities: [event:manda-esperar-en-jerusalen, person:jesus, place:jerusalen, journey:los-apostoles-en-galilea], mentions: [person:juan-el-bautista, event:pentecostes-33], note: "Reunido con ellos en Jerusalén, les manda quedarse allí hasta recibir el espíritu prometido. El libro «Jesús: el camino», cap. 137, pone esta reunión después de la de Galilea."}
    - {v: 6-11, type: narration, entities: [event:ascension-de-jesus, person:jesus], mentions: [place:judea, place:region-de-samaria, place:galilea, period:jesus-en-la-tierra], note: "Preguntan si restaurará ya el reino a Israel, la nación. Jesús los manda ser testigos hasta lo más lejano de la tierra y sube; dos ángeles anuncian que volverá de la misma manera."}
    - {v: 12-14, type: narration, entities: [event:ascension-de-jesus, event:eleccion-de-matias, place:monte-de-los-olivos, place:jerusalen, person:pedro, person:juan-apostol, person:santiago-hijo-de-zebedeo, person:andres, person:felipe-apostol, person:tomas, person:bartolome, person:mateo, person:santiago-hijo-de-alfeo, person:simon-el-cananita, person:tadeo, person:maria-madre-de-jesus, person:jose-hijo-de-jose, person:simon-hijo-de-jose, relation:tadeo/kin/santiago-padre-de-tadeo, relation:santiago-hijo-de-alfeo/kin/alfeo-padre-de-santiago, relation:jesus/kin/maria-madre-de-jesus], mentions: [person:alfeo-padre-de-santiago, person:santiago-padre-de-tadeo, person:santiago-hermano-de-jesus, person:judas-hermano-de-jesus, event:aparicion-a-santiago], note: "El monte está a un camino de sábado, unos 890 m (nota del v. 12). En el cuarto de arriba oran los once, algunas mujeres, María y los medio hermanos de Jesús, sin nombre aquí."}
    - {v: 15-22, type: speech, entities: [event:eleccion-de-matias, event:muerte-de-judas, person:pedro, person:judas-iscariote, place:akeldama, relation:judas-iscariote/died_in/jerusalen, relation:matias/disciple_of/jesus], mentions: [person:david, person:juan-el-bautista, event:arresto-en-getsemani, event:bautismo-de-jesus, person:jesus], note: "Ante unos 120 discípulos, Pedro aplica a Judas los Salmos 69:25 y 109:8. El paréntesis de los v. 18 y 19 da el final de Judas y el campo de Akéldama."}
    - {v: 23-26, type: narration, entities: [event:eleccion-de-matias, person:jose-barsabas, person:matias, relation:jose-barsabas/disciple_of/jesus, relation:matias/succeeds/judas-iscariote, relation:matias/holds_office/-], mentions: [person:judas-barsabas, person:judas-iscariote, relation:judas-iscariote/holds_office/-], note: "Proponen a José Barsabás, llamado Justo, y a Matías; oran a Jehová y echan suertes, la última vez que la Biblia lo cuenta de los discípulos (nota del v. 26)."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: narration, entities: [event:pentecostes-33, period:congregacion-cristiana], note: "En la fiesta del día 50, el 6 de siván (nota del v. 1), un ruido de viento llena la casa, bajan algo como lenguas de fuego y los reunidos hablan otros idiomas."}
    - {v: 5-13, type: narration, entities: [event:pentecostes-33, place:jerusalen, place:partia, place:libia], mentions: [place:galilea, place:media, place:elam, place:mesopotamia, place:judea, place:capadocia, place:ponto, place:asia, place:frigia, place:panfilia, place:egipto, place:cirene, place:roma, place:creta, place:arabia], note: "Judíos y prosélitos de quince tierras oyen a los galileos en su lengua materna; el texto nombra a partos, medos, elamitas, cretenses y árabes por su pueblo. Otros se burlan: los creen bebidos."}
    - {v: 14-21, type: speech, entities: [event:pentecostes-33, person:pedro], mentions: [person:joel-profeta, place:judea, place:jerusalen], note: "Pedro, de pie con los Once, explica que son las nueve de la mañana (nota del v. 15) y que se cumple Joel 2:28-32: Dios derrama su espíritu en los últimos días."}
    - {v: 22-36, type: speech, entities: [event:pentecostes-33, person:jesus, person:david, relation:jesus/lived_in/nazaret, relation:jesus/kin/david, relation:david/died_in/jerusalen], mentions: [place:nazaret, event:muerte-de-jesus, event:resurreccion-de-jesus, event:ascension-de-jesus], note: "Jesús el Nazareno, ejecutado y resucitado, es Señor y Cristo. Pedro cita los Salmos 16 y 110: David murió, su tumba sigue allí y él no subió al cielo; hablaba de su descendiente."}
    - {v: 37-41, type: narration, entities: [event:pentecostes-33, person:pedro], note: "Con el corazón herido preguntan qué hacer. Pedro les pide que se arrepientan y que cada uno se bautice en nombre de Jesucristo; ese día se bautizan unas 3.000 personas."}
    - {v: 42-47, type: narration, entities: [event:la-congregacion-de-jerusalen-crece], mentions: [place:monte-moria], note: "Los nuevos discípulos aprenden de los apóstoles, comen juntos en las casas, van cada día al templo y comparten sus bienes; Jehová añade creyentes a diario."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: narration, entities: [event:curacion-del-cojo-en-la-puerta-hermosa, person:pedro, person:juan-apostol, place:monte-moria, relation:pedro/accompanies/juan-apostol], mentions: [person:jesus, place:nazaret], note: "Hacia las tres de la tarde, la hora novena. El cojo no tiene nombre. La Puerta Hermosa, entrada del templo, queda en los nombres del monte Moria."}
    - {v: 11-26, type: speech, entities: [event:discurso-de-pedro-en-el-portico-de-salomon, person:pedro, person:juan-apostol, place:monte-moria], mentions: [person:jesus, person:abrahan, person:isaac, person:jacob, person:poncio-pilato, person:barrabas, person:moises, person:samuel, event:sentencia-y-barrabas, event:muerte-de-jesus, event:resurreccion-de-jesus, event:abrahan-ofrece-a-isaac], note: "El asesino liberado es Barrabás (referencias de 3:14; Perspicacia «Barrabás»). Pedro cita a Moisés (Dt 18:15) y la promesa a Abrahán (Gé 22:18). Hombres de Israel es el pueblo, sin ficha."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: narration, entities: [event:pedro-y-juan-arrestados-en-el-templo, person:pedro, person:juan-apostol, place:monte-moria], mentions: [person:jesus], note: "Los detienen los sacerdotes, el capitán del templo, que no se nombra, y los saduceos, a quienes irrita que anuncien la resurrección de Jesús."}
    - {v: 5-22, type: narration, entities: [event:pedro-y-juan-ante-el-sanedrin, person:pedro, person:juan-apostol, person:anas, person:caifas, person:juan-gobernante-judio, person:alejandro-pariente-de-anas, place:jerusalen, relation:caifas/kin/anas, relation:juan-gobernante-judio/kin/anas, relation:alejandro-pariente-de-anas/kin/anas, relation:pedro/accompanies/juan-apostol, relation:pedro/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus], mentions: [person:jesus, place:nazaret, event:muerte-de-jesus, event:resurreccion-de-jesus], note: "Pedro aplica a Jesús la piedra rechazada del Sl 118:22. El curado tenía más de 40 años. El Sanedrín es el tribunal, sin ficha propia."}
    - {v: 23-31, type: narration, entities: [event:los-discipulos-oran-y-tiembla-el-lugar, person:pedro, person:juan-apostol, place:jerusalen], mentions: [person:david, person:herodes-antipas, person:poncio-pilato, person:jesus, event:ante-pilato-y-herodes], note: "La oración cita el Salmo 2 como palabras de David y lo cumple en Herodes, que Perspicacia «Herodes», núm. 2, identifica con Antipas, y en Poncio Pilato."}
    - {v: 32-37, type: narration, entities: [event:los-discipulos-comparten-sus-bienes, person:bernabe, relation:bernabe/born_in/chipre, relation:bernabe/lived_in/jerusalen], mentions: [place:chipre], note: "Bernabé era levita, de la tribu de Leví, que como pueblo no lleva ficha."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: narration, entities: [event:muerte-de-ananias-y-safira, person:ananias-de-jerusalen, person:safira, person:pedro, relation:ananias-de-jerusalen/kin/safira, relation:ananias-de-jerusalen/died_in/jerusalen], mentions: [person:satanas], note: "Ananías y Safira venden un campo; él entrega solo parte del dinero y finge darlo todo. Pedro le dice que Satanás lo animó a mentir al espíritu santo y a Dios. Cae muerto y los jóvenes lo entierran."}
    - {v: 7-11, type: narration, entities: [event:muerte-de-ananias-y-safira, person:safira, person:pedro, person:ananias-de-jerusalen, relation:ananias-de-jerusalen/kin/safira, relation:safira/lived_in/jerusalen, relation:safira/died_in/jerusalen], note: "Unas tres horas después, Safira repite la mentira sobre el precio. Pedro le dice que los dos pusieron a prueba el espíritu de Jehová; cae muerta y la entierran junto a su marido. Primera vez que Hechos dice «congregación»."}
    - {v: 12-16, type: narration, entities: [event:un-angel-libera-a-los-apostoles, person:pedro, place:monte-moria], mentions: [place:jerusalen], note: "Los apóstoles hacen milagros y se reúnen en el Pórtico de Salomón, en el recinto del templo. Crecen los creyentes; sacan enfermos a la calle para que los toque la sombra de Pedro, y traen más de los pueblos vecinos."}
    - {v: 17-26, type: narration, entities: [event:un-angel-libera-a-los-apostoles, person:caifas, place:monte-moria], note: "Celosos, el sumo sacerdote, Caifás según «Testimonio completo», y los saduceos encarcelan a los apóstoles. De noche el ángel de Jehová los saca; al amanecer enseñan en el templo y el capitán del templo los vuelve a traer, sin violencia."}
    - {v: 27-32, type: narration, entities: [event:consejo-de-gamaliel, person:pedro, person:juan-apostol, person:caifas], mentions: [person:jesus, place:jerusalen], note: "Caifás les reprocha haber llenado Jerusalén con su enseñanza. Pedro y los demás, Juan entre ellos según Perspicacia, contestan que Dios manda antes que los hombres: Dios resucitó a Jesús y lo puso a su derecha como Salvador."}
    - {v: 33-39, type: narration, entities: [event:consejo-de-gamaliel, person:gamaliel-fariseo, relation:gamaliel-fariseo/lived_in/jerusalen, person:teudas, person:judas-el-galileo, relation:judas-el-galileo/lived_in/galilea], mentions: [person:quirinio, place:galilea], note: "Gamaliel hace salir a los apóstoles y recuerda a Teudas y a Judas el galileo, cuyos grupos se deshicieron al morir ellos. Esas revueltas, de hacia el año 6, solo se citan: no son eventos. Aconseja dejarlos."}
    - {v: 40-42, type: narration, entities: [event:consejo-de-gamaliel, place:monte-moria], mentions: [person:jesus], note: "Los golpean, seguramente con los 40 golpes menos uno de la Ley, les prohíben hablar de Jesús y los sueltan. Salen alegres y, cada día, siguen enseñando en el templo y yendo de casa en casa."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: narration, entities: [event:nombramiento-de-los-siete, person:esteban, person:felipe-evangelizador, person:procoro, person:nicanor, person:timon, person:parmenas, person:nicolas, place:antioquia-de-siria, relation:esteban/accompanies/felipe-evangelizador, relation:procoro/accompanies/esteban, relation:nicanor/accompanies/esteban, relation:timon/accompanies/esteban, relation:parmenas/accompanies/esteban, relation:nicolas/accompanies/esteban, relation:nicolas/lived_in/antioquia-de-siria, relation:esteban/lived_in/jerusalen, relation:felipe-evangelizador/lived_in/jerusalen, relation:procoro/lived_in/jerusalen, relation:nicanor/lived_in/jerusalen, relation:timon/lived_in/jerusalen, relation:parmenas/lived_in/jerusalen, relation:nicolas/lived_in/jerusalen], mentions: [place:jerusalen], note: "Las viudas de los judíos de habla griega quedan fuera del reparto diario. Los Doce piden siete hombres; eligen a siete de nombre griego y los apóstoles, tras orar, les imponen las manos. Muchos sacerdotes se hacen creyentes."}
    - {v: 8-15, type: narration, entities: [event:discurso-de-esteban, person:esteban, place:alejandria], mentions: [place:cirene, place:cilicia, place:asia, person:moises, person:jesus, place:nazaret, place:monte-moria, person:caifas], note: "Esteban hace grandes milagros. Los de la Sinagoga de los Libertos y judíos de Cirene, Alejandría, Cilicia y Asia no pueden con él; con testigos falsos lo acusan ante el Sanedrín de hablar contra Moisés y el templo."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:discurso-de-esteban, person:esteban, person:caifas], mentions: [period:sumo-sacerdocio-de-caifas], note: "Ante el Sanedrín, el sumo sacerdote pregunta a Esteban si es verdad lo que le achacan. La nota de estudio dice que ese sumo sacerdote es Caifás."}
    - {v: 2-8, type: speech, entities: [event:discurso-de-esteban, person:abrahan, person:tare, person:isaac, person:jacob, place:mesopotamia, place:haran, place:caldea, event:tare-sale-de-ur, event:pacto-con-abrahan, event:pacto-de-los-animales-partidos, event:pacto-de-la-circuncision, event:nacimiento-de-isaac, relation:abrahan/lived_in/ur, relation:abrahan/lived_in/haran, relation:abrahan/lived_in/canaan, relation:tare/died_in/haran, relation:isaac/kin/abrahan, relation:jacob/kin/isaac, journey:abrahan-de-haran-a-canaan, journey:abrahan-de-ur-a-haran], mentions: [place:ur, place:canaan, event:abran-llega-a-siquem, event:isaac-destetado-e-ismael-se-burla, event:nacimiento-de-esau-y-jacob], note: "De la llamada de Abrahán a los doce patriarcas. Según la nota de 7:3, Dios le habló ya en Ur y se lo repitió en Harán; la de 7:6 cuenta los 400 años de aflicción desde 1913 a.e.c."}
    - {v: 9-16, type: speech, entities: [event:discurso-de-esteban, person:jose-hijo-de-jacob, person:jacob, person:hamor, place:egipto, place:canaan, place:siquem, event:sus-hermanos-venden-a-jose, event:jose-gobernador-de-egipto, event:empiezan-los-siete-anos-de-hambre, event:hermanos-de-jose-compran-grano-en-egipto, event:jose-se-da-a-conocer, event:faraon-invita-a-la-familia-de-jacob, event:jose-recibe-a-jacob-en-gosen, event:muerte-de-jacob, event:muerte-de-jose, relation:jose-hijo-de-jacob/kin/jacob, relation:jose-hijo-de-jacob/lived_in/egipto, relation:jacob/lived_in/canaan, relation:jacob/lived_in/egipto, relation:jacob/died_in/egipto, relation:hamor/lived_in/siquem, journey:cortejo-funebre-de-jacob, journey:jacob-a-egipto, journey:jose-a-egipto, journey:primer-viaje-por-grano, journey:segundo-viaje-por-grano], mentions: [person:abrahan, event:jose-cuenta-sus-suenos, event:jacob-compra-un-campo-junto-a-siquem, event:abrahan-compra-la-cueva-de-macpela], note: "Los 75 de 7:14 contarían familia más amplia (nota de estudio). Perspicacia «Siquem» lee 7:16 como frase abreviada, o como compra atribuida a Abrahán por ser el cabeza: el campo lo compró Jacob. El faraón no tiene nombre."}
    - {v: 17-22, type: speech, entities: [event:discurso-de-esteban, person:moises, place:egipto, event:egipto-esclaviza-a-israel, event:el-faraon-manda-echar-al-nilo-a-los-ninos, event:nacimiento-de-moises, relation:moises/born_in/egipto, relation:moises/lived_in/egipto], mentions: [person:abrahan, person:jose-hijo-de-jacob], note: "Un rey que no conocía a José esclaviza al pueblo y obliga a abandonar a los bebés. La hija del faraón, sin nombre, cría a Moisés; su educación egipcia es un dato que solo da Esteban."}
    - {v: 23-29, type: speech, entities: [event:discurso-de-esteban, person:moises, place:madian, event:moises-mata-a-un-egipcio, event:moises-huye-a-madian, event:nacimiento-de-guersom, relation:moises/lived_in/madian, journey:huida-de-moises-a-madian], mentions: [place:egipto, person:guersom-hijo-de-moises, person:eliezer-hijo-de-moises], note: "A los 40 años, edad que solo da Esteban, Moisés mata al egipcio que maltrataba a un israelita. Al día siguiente lo rechazan y huye a Madián, donde tiene dos hijos que el texto no nombra."}
    - {v: 30-35, type: speech, entities: [event:discurso-de-esteban, person:moises, place:monte-sinai, place:desierto-de-sinai, event:moises-ante-la-zarza-ardiente, journey:vuelta-de-moises-a-egipto], mentions: [person:abrahan, person:isaac, person:jacob, place:egipto], note: "Cuarenta años después, un ángel se le aparece en la zarza y Jehová lo manda como gobernante y libertador. La nota de 7:30 pone la estancia en Madián entre 1553 y 1513 a.e.c."}
    - {v: 36-38, type: speech, entities: [event:discurso-de-esteban, person:moises, place:mar-rojo, event:exodo, event:israel-cruza-el-mar-rojo], mentions: [place:egipto, place:monte-sinai, event:jehova-ofrece-su-pacto-a-israel, event:diez-mandamientos, event:moises-recibe-las-decisiones-judiciales], note: "Moisés saca al pueblo con prodigios en tierra egipcia, junto al mar Rojo y durante 40 años de desierto (1513 a 1473 a.e.c.). Anunció un profeta como él y, por medio de un ángel, recibió la Ley en el Sinaí."}
    - {v: 39-43, type: speech, entities: [event:discurso-de-esteban, person:aaron, event:becerro-de-oro], mentions: [person:moises, place:egipto, place:babilonia, person:amos-profeta], note: "El pueblo pide dioses a Aarón y adora un becerro. Esteban cita Amós 5:25-27: cargaron la tienda de Moloc y la estrella de Refán, dioses sin ficha, y serán desterrados más allá de Babilonia."}
    - {v: 44-50, type: speech, entities: [event:discurso-de-esteban, person:josue-hijo-de-nun, person:david, person:salomon, event:jehova-da-a-moises-el-modelo-del-tabernaculo, event:entrada-en-canaan, event:templo-de-salomon-empieza, event:templo-de-salomon-terminado, event:david-quiere-construir-una-casa-para-jehova], mentions: [person:moises, person:jacob, person:isaias, event:conquista-de-canaan, event:pacto-con-david, event:se-monta-el-tabernaculo], note: "La tienda del Testimonio, hecha según el modelo, entra en la tierra con Josué y sigue hasta David, que pide hacer una morada a Dios; la casa la construye Salomón. Cita Isaías 66:1, 2."}
    - {v: 51-53, type: speech, entities: [event:discurso-de-esteban], mentions: [person:jesus], note: "Esteban llama tercos a sus jueces: sus padres persiguieron a los profetas y ellos han traicionado y matado al Justo. Recibieron la Ley por medio de ángeles, dato que añade Esteban, y no la cumplen."}
    - {v: 54-60, type: narration, entities: [event:muerte-de-esteban, person:esteban, person:jesus, person:pablo, place:jerusalen, relation:esteban/died_in/jerusalen, relation:jesus/appears_to/esteban], mentions: [event:entierro-de-esteban], note: "Esteban ve a Jesús en pie a la derecha de Dios. Lo sacan de la ciudad y lo apedrean ante Saulo, que guarda los mantos. Pide a Jesús que reciba su espíritu y ruega a Jehová por ellos."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:muerte-de-esteban, event:dispersion-de-los-discipulos, event:entierro-de-esteban, event:saulo-persigue-a-la-congregacion, journey:primeros-anos-de-pablo, person:pablo, person:esteban, place:jerusalen, place:judea, place:region-de-samaria, journey:viajes-de-felipe], note: "Saulo aprueba la muerte de Esteban. Estalla una gran persecución y todos menos los apóstoles se dispersan por Judea y Samaria. Hombres devotos entierran a Esteban; Saulo saca de sus casas a hombres y mujeres y los encarcela."}
    - {v: 4-8, type: narration, entities: [event:dispersion-de-los-discipulos, event:felipe-predica-en-samaria, person:felipe-evangelizador, place:samaria], mentions: [place:region-de-samaria, relation:felipe-evangelizador/lived_in/jerusalen], note: "Los dispersados predican por donde pasan. Felipe, uno de los siete y no el apóstol (nota de 8:5), baja a la ciudad de Samaria, reconstruida por Herodes como Sebaste; expulsa espíritus y cura a paralíticos y cojos."}
    - {v: 9-13, type: narration, entities: [event:felipe-predica-en-samaria, person:simon-el-mago, person:felipe-evangelizador, place:samaria, relation:simon-el-mago/lived_in/samaria, relation:simon-el-mago/accompanies/felipe-evangelizador], mentions: [person:jesus], note: "Simón, un mago al que llamaban el Gran Poder, cree como los demás y se bautiza; desde entonces sigue a Felipe, asombrado por los milagros."}
    - {v: 14-17, type: narration, entities: [event:pedro-y-juan-en-samaria, person:pedro, person:juan-apostol, place:jerusalen, place:region-de-samaria, relation:pedro/accompanies/juan-apostol, journey:pedro-y-juan-a-samaria], mentions: [person:jesus], note: "Desde Jerusalén, los apóstoles envían a Pedro y a Juan. Oran e imponen las manos a los bautizados en el nombre de Jesús, y estos reciben espíritu santo."}
    - {v: 18-25, type: narration, entities: [event:pedro-y-juan-en-samaria, person:simon-el-mago, person:pedro, person:juan-apostol, place:region-de-samaria], mentions: [place:jerusalen], note: "Simón ofrece dinero por ese poder, origen de la palabra simonía. Pedro le dice que su corazón no es recto y que suplique a Jehová. Los dos vuelven a Jerusalén predicando en aldeas samaritanas."}
    - {v: 26-35, type: narration, entities: [event:felipe-y-el-funcionario-etiope, person:felipe-evangelizador, person:eunuco-etiope, place:jerusalen, place:gaza, place:etiopia, relation:eunuco-etiope/lived_in/etiopia, journey:regreso-del-funcionario-etiope], mentions: [person:isaias, person:jesus], note: "Un ángel manda a Felipe al camino del desierto entre Jerusalén y Gaza. El tesorero de Candace, título de las reinas etíopes y no un nombre, lee Isaías 53 en su carro; Felipe sube y le habla de Jesús."}
    - {v: 36-39, type: narration, entities: [event:felipe-y-el-funcionario-etiope, person:felipe-evangelizador, person:eunuco-etiope], note: "Junto a una masa de agua del camino, los dos entran en el agua y Felipe lo bautiza. El espíritu se lleva a Felipe y el etíope sigue contento. La TNM no incluye el versículo 37."}
    - {v: "40", type: narration, entities: [event:felipe-de-asdod-a-cesarea, person:felipe-evangelizador, place:asdod, place:cesarea], note: "Felipe aparece en Asdod, llamada Azoto en el siglo I, y predica en todas las ciudades del camino hasta Cesarea."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:saulo-persigue-a-la-congregacion, person:pablo, person:caifas, place:jerusalen], mentions: [place:damasco], note: "Saulo pide al sumo sacerdote, Caifás según la nota del v. 1, cartas para las sinagogas de Damasco: quiere llevar presos a Jerusalén a los del Camino."}
