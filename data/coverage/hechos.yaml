    - {v: 11-20, type: narration, entities: [event:hijos-de-esceva, person:pablo, person:esceva, place:efeso], mentions: [person:jesus], note: "Los siete hijos de Esceva no tienen nombre. Los libros de magia quemados valían 50.000 monedas de plata, unos 137 años de jornales según la nota del v. 19."}
    - {v: 21-22, type: narration, entities: [event:pablo-envia-a-timoteo-y-erasto-a-macedonia, person:pablo, person:timoteo, person:erasto-colaborador-de-pablo, relation:timoteo/accompanies/erasto-colaborador-de-pablo, relation:erasto-colaborador-de-pablo/accompanies/pablo, relation:timoteo/accompanies/pablo, place:macedonia, place:asia, journey:timoteo-y-erasto-a-macedonia], mentions: [place:acaya, place:jerusalen, place:roma]}
