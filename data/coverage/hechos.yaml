    - {v: 35-41, type: narration, entities: [event:motin-de-efeso, person:demetrio-el-platero, place:efeso], note: "Un registrador de la ciudad, sin nombre, disuelve la asamblea: para acusar hay tribunales y procónsules. Éfeso era la capital de Asia y allí vivía el procónsul (nota del v. 38)."}
  20:
