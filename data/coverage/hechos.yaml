    - {v: 1-3, type: narration, entities: [event:apartados-para-la-mision, journey:primer-viaje, person:bernabe, person:symeon-niger, person:lucio-de-cirene, person:manaen, person:pablo, place:antioquia-de-siria, relation:bernabe/lived_in/antioquia-de-siria, relation:symeon-niger/lived_in/antioquia-de-siria, relation:lucio-de-cirene/lived_in/antioquia-de-siria, relation:lucio-de-cirene/lived_in/cirene, relation:manaen/lived_in/antioquia-de-siria, relation:manaen/accompanies/herodes-antipas], mentions: [person:herodes-antipas, place:cirene], note: "Profetas y maestros de Antioquía: Bernabé, Symeón Niger, Lucio de Cirene, Manaén y Saulo. Mientras sirven a Jehová y ayunan, el espíritu pide apartar a dos de ellos para una misión."}
