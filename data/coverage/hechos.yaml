    - {v: "26", type: narration, entities: [event:pablo-se-purifica-en-el-templo, place:monte-moria, person:pablo], note: "Los cuatro hombres del voto no tienen nombre."}
    - {v: 27-39, type: narration, entities: [event:arresto-en-el-templo, person:pablo, person:trofimo, relation:trofimo/lived_in/efeso, relation:trofimo/born_in/efeso, relation:trofimo/accompanies/pablo@56, person:claudio-lisias, relation:claudio-lisias/lived_in/jerusalen, place:jerusalen, place:monte-moria, place:tarso, relation:pablo/born_in/tarso, journey:custodia-en-cesarea, relation:pablo/tie/claudio-lisias], mentions: [place:asia, place:efeso, place:cilicia], note: "El comandante sin nombre es Claudio Lisias (nota del v. 31) y el cuartel, la Fortaleza Antonia (nota del v. 34). El egipcio que sacó al desierto a 4.000 sicarios no tiene nombre."}
    - {v: "40", type: narration, entities: [event:pablo-se-defiende-ante-el-pueblo, person:pablo, person:claudio-lisias], note: "Con permiso del comandante, Pablo pide silencio desde las escaleras y empieza a hablar en hebreo."}
  22:
