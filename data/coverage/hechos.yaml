    spans:
    - {v: 1-7, type: narration, entities: [event:huida-de-iconio, journey:primer-viaje, person:pablo, person:bernabe, place:iconio, place:listra, place:derbe, place:licaonia], note: "En Iconio creen muchos judíos y griegos; los que no creen agitan a la gente. Tras bastante tiempo y muchos milagros la ciudad se divide y huyen a Licaonia. Hechos llama apóstoles a los dos."}
    - {v: 8-18, type: narration, entities: [event:dioses-en-listra, person:pablo, person:bernabe, place:listra], mentions: [place:licaonia], note: "Pablo cura a un cojo de nacimiento. En licaonio los aclaman como Zeus (Bernabé) y Hermes (Pablo), dioses sin ficha; el sacerdote del templo de Zeus, a la entrada de la ciudad, trae toros y guirnaldas."}
    - {v: 19-20, type: narration, entities: [event:apedrean-a-pablo-en-listra, person:pablo, person:bernabe, place:listra], mentions: [place:antioquia-de-pisidia, place:iconio, place:derbe], note: "Judíos venidos de Antioquía de Pisidia y de Iconio ponen a la gente contra Pablo; lo apedrean y lo dan por muerto. Los discípulos lo rodean, se levanta y al día siguiente parte hacia Derbe."}
    - {v: 21-23, type: narration, entities: [event:predican-en-derbe, event:nombran-ancianos-en-galacia, person:pablo, person:bernabe, place:derbe, place:listra, place:iconio, place:antioquia-de-pisidia], note: "Hacen discípulos en Derbe y vuelven por Listra, Iconio y Antioquía animando a los discípulos. Con oración y ayuno nombran ancianos en cada congregación y los dejan en manos de Jehová."}
    - {v: 24-25, type: narration, entities: [event:predican-en-perga, person:pablo, person:bernabe, place:pisidia, place:panfilia, place:perga, place:atalia], note: "Cruzan Pisidia hasta Panfilia, predican en Perga y bajan al puerto de Atalia."}
    - {v: 26-28, type: narration, entities: [event:informe-en-antioquia, person:pablo, person:bernabe, place:antioquia-de-siria, relation:pablo/lived_in/antioquia-de-siria, relation:bernabe/lived_in/antioquia-de-siria], note: "Navegan a Antioquía, de donde habían salido, reúnen a la congregación y cuentan que Dios dio a los no judíos la ocasión de creer. Se quedan allí bastante tiempo."}
