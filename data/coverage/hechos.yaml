    - {v: 1-2, type: narration, entities: [journey:tercer-viaje, place:cos, place:rodas, place:patara, person:pablo, person:lucas], mentions: [place:fenicia, place:licia], note: "De Mileto navegan a Cos, Rodas y Pátara, puerto de Licia, y allí toman un barco hacia Fenicia. Son paradas del tercer viaje, sin suceso propio; el «nosotros» incluye a Lucas."}
