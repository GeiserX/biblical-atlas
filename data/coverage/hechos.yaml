    - {v: 13-16, type: narration, entities: [event:de-troas-a-mileto, person:pablo, person:lucas, place:troas, place:ason, place:mitilene, place:quios, place:samos, place:mileto], mentions: [place:efeso, place:asia, place:jerusalen], note: "No se detiene en Éfeso para no retrasarse en Asia: quiere estar en Jerusalén en Pentecostés."}
    - {v: "17", type: narration, entities: [event:despedida-en-mileto, person:pablo, place:mileto, place:efeso], note: "Los ancianos de Éfeso no tienen nombre; la nota del v. 17 muestra que la congregación tenía varios."}
    - {v: 18-35, type: speech, entities: [event:despedida-en-mileto, person:pablo, place:asia, relation:pablo/lived_in/efeso], mentions: [place:jerusalen, person:jesus], note: "Repasa sus tres años en Asia, enseñando en público y por las casas; los ancianos son superintendentes del rebaño. Cita un dicho de Jesús que no recogen los Evangelios (nota del v. 35)."}
    - {v: 36-38, type: narration, entities: [event:despedida-en-mileto, person:pablo, place:mileto], note: "Oran de rodillas, lloran y lo acompañan al barco, tristes porque no volverán a verlo."}
  21:
