    - {v: 16-22, type: speech, entities: [event:discurso-en-antioquia-de-pisidia, event:nacimiento-de-isaac, event:exodo, event:conquista-de-canaan, event:saul-ungido-rey, period:saul, person:saul, person:quis-hijo-de-ner, relation:saul/kin/quis-hijo-de-ner, relation:david/kin/jese, event:israel-pide-un-rey, event:samuel-unge-a-david], mentions: [place:egipto, place:canaan, person:samuel, person:david, person:jese, period:exodo-y-desierto, period:josue-y-los-jueces, period:david, event:jehova-rechaza-a-saul-como-rey], note: "Pablo repasa la historia: Egipto, 40 años en el desierto, Canaán repartida, unos 450 años desde Isaac (nota de 13:20), los jueces, Samuel, Saúl, al que Dios quitó (1Sa 15), y David."}
    - {v: 23-25, type: speech, entities: [person:jesus, relation:jesus/kin/david, event:juan-comienza-su-ministerio, event:juan-niega-ser-el-cristo], mentions: [person:juan-el-bautista, person:david], note: "De la descendencia de David viene Jesús, el salvador prometido. Antes, Juan predicó el bautismo de arrepentimiento y dijo que él no era el esperado."}
    - {v: 26-37, type: speech, entities: [person:jesus, event:sentencia-y-barrabas, event:entierro-de-jesus, event:resurreccion-de-jesus], mentions: [event:muerte-de-jesus, person:poncio-pilato, person:abrahan, person:david, place:jerusalen, place:galilea], note: "Los de Jerusalén pidieron a Pilato su muerte; lo bajaron del madero y lo enterraron, pero Dios lo resucitó y se apareció a los que subieron con él desde Galilea. Cita Sl 2:7, Is 55:3 y Sl 16:10."}
    - {v: 38-41, type: speech, entities: [event:discurso-en-antioquia-de-pisidia], mentions: [person:moises], note: "Por medio de Jesús se anuncia el perdón y queda libre de culpa quien cree, algo que la Ley de Moisés no lograba. Cierra con una advertencia tomada de Hab 1:5."}
    - {v: 42-43, type: narration, entities: [event:discurso-en-antioquia-de-pisidia, person:pablo, person:bernabe], note: "Al salir les ruegan que vuelvan el sábado siguiente. Muchos judíos y prosélitos los siguen, y ellos los animan a seguir en la bondad inmerecida de Dios."}
    - {v: 44-52, type: narration, entities: [event:expulsados-de-antioquia-de-pisidia, person:pablo, person:bernabe, place:antioquia-de-pisidia, place:iconio], note: "Los judíos, celosos, blasfeman; Pablo y Bernabé se vuelven a las naciones con Is 49:6. Mujeres influyentes y hombres principales los echan; se sacuden el polvo de los pies y van a Iconio."}
  14:
    status: complete
