    - {v: 9-16, type: vision, entities: [event:vision-de-pedro-en-jope, person:pedro, place:jope], note: "Hacia el mediodía, en la azotea, Pedro ve en trance una sábana con animales impuros; tres veces oye que no llame contaminado lo que Dios ha limpiado."}
    - {v: 17-23, type: narration, entities: [event:vision-de-pedro-en-jope, event:pedro-predica-a-cornelio, person:pedro, person:cornelio, person:simon-el-curtidor, place:jope, relation:pedro/tie/simon-el-curtidor], note: "Llegan los tres enviados de Cornelio a casa de Simón y el espíritu dice a Pedro que vaya con ellos. Pedro los hospeda y al día siguiente sale con ellos y con hermanos de Jope."}
    - {v: 24-33, type: narration, entities: [event:pedro-predica-a-cornelio, person:pedro, person:cornelio, place:cesarea], mentions: [person:simon-el-curtidor, place:jope], note: "En Cesarea, Cornelio espera con parientes y amigos y se postra; Pedro lo levanta porque él también es un hombre. Entra en casa de un gentil y Cornelio le cuenta su visión."}
    - {v: 34-43, type: speech, entities: [event:pedro-predica-a-cornelio, person:pedro], mentions: [person:jesus, person:juan-el-bautista, person:satanas, place:judea, place:galilea, place:nazaret, place:jerusalen, event:juan-comienza-su-ministerio, event:bautismo-de-jesus, event:muerte-de-jesus, event:resurreccion-de-jesus, event:aparicion-a-los-discipulos-sin-tomas, event:aparicion-junto-al-mar-de-galilea, event:mandato-de-hacer-discipulos], note: "Dios no es parcial. Pedro resume la obra de Jesús de Nazaret desde el bautismo que predicó Juan: su unción, sus curaciones, su muerte en un madero, su resurrección al tercer día y su cargo de juez."}
    - {v: 44-48, type: narration, entities: [event:pedro-predica-a-cornelio, person:pedro, person:cornelio, place:cesarea], mentions: [event:pentecostes-33], note: "El espíritu santo baja sobre los oyentes antes del bautismo, única vez que se cuenta así, y hablan en lenguas como en Pentecostés. Pedro manda bautizarlos: la tercera llave del Reino (nota del v. 44)."}
