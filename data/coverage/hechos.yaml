    - {v: 15-17, type: narration, entities: [event:pablo-se-hospeda-con-mnason, person:mnason, relation:mnason/born_in/chipre, relation:mnason/lived_in/jerusalen, place:jerusalen, place:cesarea, person:pablo, person:lucas, journey:tercer-viaje], mentions: [place:chipre]}
