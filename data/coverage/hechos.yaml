    - {v: "13", type: narration, entities: [event:juan-marcos-se-vuelve, person:juan-marcos, person:pablo, place:perga, place:panfilia, journey:juan-marcos-vuelve-a-jerusalen], mentions: [place:pafos, place:jerusalen], note: "Zarpan de Pafos hacia Perga, en Panfilia. Allí Juan Marcos los deja y regresa a Jerusalén."}
