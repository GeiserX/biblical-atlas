  17:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: narration, entities: [event:alboroto-en-tesalonica, journey:segundo-viaje, person:pablo, person:silas, place:anfipolis, place:apolonia, place:tesalonica, relation:silas/accompanies/pablo], mentions: [person:jesus], note: "De Filipos pasan por Anfípolis y Apolonia. En la sinagoga de Tesalónica Pablo razona tres sábados con las Escrituras; creen algunos judíos, muchos griegos y bastantes mujeres importantes."}
    - {v: 5-9, type: narration, entities: [event:alboroto-en-tesalonica, person:jason, relation:jason/lived_in/tesalonica], mentions: [person:pablo, person:silas, person:claudio], note: "El César de 17:7 es el emperador, que entonces era Claudio según la nota de estudio. Los gobernantes de la ciudad son los politarcas, título que confirman inscripciones halladas en Macedonia."}
    - {v: 10-12, type: narration, entities: [event:los-de-berea-examinan-las-escrituras, place:berea, person:pablo, person:silas], note: "Salen de noche hacia Berea. Los judíos de allí examinan cada día las Escrituras para comprobar lo que oyen, y creen muchos, con mujeres griegas respetables."}
    - {v: 13-15, type: narration, entities: [event:los-de-berea-examinan-las-escrituras, person:timoteo, relation:timoteo/accompanies/pablo, place:atenas, journey:timoteo-de-berea-a-corinto], mentions: [person:silas, place:tesalonica], note: "Judíos de Tesalónica agitan Berea. Los hermanos llevan a Pablo hacia el mar y hasta Atenas; Silas y Timoteo se quedan con el encargo de unirse a él pronto."}
    - {v: 16-21, type: narration, entities: [event:discurso-en-el-areopago, place:atenas, place:areopago, person:pablo], note: "Indignado por los ídolos, Pablo razona en la sinagoga y a diario en el ágora. Filósofos epicúreos y estoicos lo llaman charlatán y lo llevan al Areópago para oír su enseñanza nueva."}
    - {v: 22-31, type: speech, entities: [event:discurso-en-el-areopago, place:areopago], note: "Parte del altar «A un Dios Desconocido»: el Creador no vive en templos ni se parece a una imagen, hizo de un hombre todas las naciones y juzgará por medio de un hombre que resucitó. Cita al poeta Arato."}
    - {v: 32-34, type: narration, entities: [event:discurso-en-el-areopago, person:dionisio, person:damaris, relation:dionisio/lived_in/atenas, relation:damaris/lived_in/atenas], note: "Al oír de la resurrección unos se burlan y otros lo dejan para otro día. Creen algunos, entre ellos Dionisio, juez del Areópago, y Dámaris."}
  18:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: narration, entities: [event:pablo-llega-a-corinto, event:claudio-expulsa-a-los-judios-de-roma, person:pablo, person:aquila, person:priscila, person:claudio, place:corinto, place:italia, place:roma, place:ponto, relation:pablo/lived_in/corinto, relation:aquila/kin/priscila, relation:aquila/born_in/ponto, relation:aquila/lived_in/italia, relation:aquila/lived_in/corinto, relation:aquila/accompanies/pablo, relation:priscila/lived_in/italia, relation:priscila/lived_in/corinto, relation:priscila/accompanies/pablo, relation:aquila/lived_in/roma@49, relation:priscila/lived_in/roma@49, journey:viajes-de-aquila-y-priscila], mentions: [place:atenas, period:claudio], note: "Pablo llega a Corinto hacia el otoño de 50. Vive y hace tiendas con Áquila y Priscila, expulsados de Roma por Claudio, y cada sábado habla en la sinagoga a judíos y griegos."}
    - {v: 5-8, type: narration, entities: [event:crispo-cree, person:silas, person:timoteo, person:ticio-justo, person:crispo, relation:silas/accompanies/pablo, relation:timoteo/accompanies/pablo, relation:ticio-justo/lived_in/corinto, relation:crispo/lived_in/corinto, journey:timoteo-de-berea-a-corinto], mentions: [place:macedonia, person:jesus, letter:1-tesalonicenses, letter:2-tesalonicenses], note: "Silas y Timoteo llegan de Macedonia. Ante el rechazo, Pablo se sacude la ropa y predica desde la casa de Ticio Justo. Desde Corinto escribe entonces a los tesalonicenses («Testimonio completo», cap. 19)."}
    - {v: 9-11, type: narration, entities: [event:el-senor-anima-a-pablo-en-corinto, person:pablo, person:jesus], note: "De noche, en una visión, el Señor le pide que no calle, porque tiene mucha gente en la ciudad; «Testimonio completo», cap. 19, dice que era Jesús. Se queda año y medio."}
    - {v: 12-17, type: narration, entities: [event:pablo-ante-galion, person:galion, person:sostenes, place:acaya, relation:sostenes/lived_in/corinto], mentions: [period:galion, find:inscripcion-de-galion], note: "Galión no quiere juzgar cuestiones de la ley judía y los echa del tribunal. Golpean a Sóstenes delante. La inscripción de Delfos fecha el proconsulado de Galión (nota de 18:12)."}
    - {v: 18-21, type: narration, entities: [event:voto-en-cencreas, event:primera-parada-en-efeso, place:cencreas, place:efeso, relation:aquila/lived_in/efeso@52, relation:priscila/lived_in/efeso@52], mentions: [place:siria], note: "Pablo zarpa rumbo a Siria acompañado de Priscila y Áquila; antes, en Cencreas, se corta el pelo por un voto. En Éfeso los deja, razona en la sinagoga y promete volver si Jehová quiere."}
    - {v: 22-23, type: narration, entities: [event:pablo-saluda-a-la-congregacion-de-jerusalen, event:pablo-vuelve-a-antioquia-de-siria, event:pablo-recorre-galacia-y-frigia, journey:segundo-viaje, journey:tercer-viaje, place:cesarea, place:jerusalen, place:antioquia-de-siria, place:galacia, place:frigia, relation:pablo/lived_in/antioquia-de-siria], note: "Fin del segundo viaje y comienzo del tercero. El texto no nombra Jerusalén; lo deducen la nota de estudio de 18:22 y Perspicacia «Pablo» por el verbo subir."}
    - {v: 24-28, type: narration, entities: [event:apolos-en-efeso, event:apolos-en-acaya, person:apolos, person:aquila, person:priscila, place:alejandria, place:efeso, place:acaya, place:corinto, relation:apolos/born_in/alejandria, relation:apolos/lived_in/efeso, relation:apolos/lived_in/corinto, relation:apolos/accompanies/aquila, relation:apolos/accompanies/priscila, journey:apolos-de-efeso-a-corinto], mentions: [person:juan-el-bautista, person:jesus], note: "Apolos, que solo conocía el bautismo de Juan, habla con valor en la sinagoga de Éfeso; Priscila y Áquila le explican mejor el camino de Dios. Luego ayuda mucho en Acaya. Hacia 52 (nota de 18:25)."}
  19:
    status: complete
