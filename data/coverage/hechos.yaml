    - {v: 4-6, type: narration, entities: [event:concilio-de-jerusalen-49, place:jerusalen], mentions: [person:moises], note: "Unos fariseos que se habían hecho creyentes piden que los de las naciones se circunciden y guarden la Ley."}
    - {v: 7-11, type: speech, entities: [person:pedro, journey:pedro-baja-a-antioquia], mentions: [event:pedro-predica-a-cornelio, person:jesus], note: "Pedro recuerda que Dios lo escogió para llevar el mensaje a las naciones y les dio su espíritu sin distinguir; judíos y gentiles se salvan igual, por la bondad inmerecida de Jesús."}
    - {v: "12", type: narration, entities: [person:bernabe, person:pablo], mentions: [journey:primer-viaje], note: "Bernabé y Pablo cuentan los milagros que Dios hizo por ellos entre las naciones."}
    - {v: 13-21, type: speech, entities: [person:santiago-hermano-de-jesus], mentions: [person:pedro, person:david, person:moises], note: "Santiago, que al parecer presidía, llama Symeón a Pedro, cita Am 9:11, 12 y propone pedir a los gentiles solo cuatro cosas: apartarse de los ídolos, de la inmoralidad, de lo estrangulado y de la sangre."}
    - {v: "22", type: narration, entities: [person:judas-barsabas, person:silas, relation:judas-barsabas/lived_in/jerusalen, relation:silas/lived_in/jerusalen, relation:silas/accompanies/judas-barsabas, relation:judas-barsabas/accompanies/pablo, journey:judas-y-silas-llevan-la-carta], mentions: [place:antioquia-de-siria]}
    - {v: 23-29, type: letter, mentions: [place:antioquia-de-siria, place:siria, place:cilicia, person:bernabe, person:pablo, person:judas-barsabas, person:silas, person:jesus], note: "Carta de los apóstoles y ancianos a los hermanos gentiles: los que los inquietaron no iban de su parte; solo deben evitar la idolatría, la sangre, la carne sin desangrar y la inmoralidad sexual."}
    - {v: 30-35, type: narration, entities: [event:la-carta-de-jerusalen-llega-a-antioquia, place:antioquia-de-siria, person:judas-barsabas, person:silas, person:pablo, person:bernabe], note: "La TNM no incluye el versículo 34, que según la nota de estudio era una glosa sobre Silas."}
    - {v: 36-41, type: narration, entities: [event:pablo-y-bernabe-se-separan, journey:segundo-viaje, person:pablo, person:bernabe, person:juan-marcos, person:silas, relation:juan-marcos/accompanies/bernabe, relation:silas/accompanies/pablo, place:chipre, place:siria, place:cilicia, journey:bernabe-y-marcos-a-chipre, journey:juan-marcos-vuelve-a-jerusalen], mentions: [place:panfilia, event:juan-marcos-se-vuelve]}
