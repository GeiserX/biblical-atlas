    - {v: 1-5, type: speech, entities: [event:pablo-se-defiende-ante-el-pueblo, person:pablo, place:tarso, relation:pablo/born_in/tarso, person:gamaliel-fariseo, relation:pablo/disciple_of/gamaliel-fariseo, relation:pablo/lived_in/jerusalen, place:jerusalen, event:saulo-persigue-a-la-congregacion, place:damasco], mentions: [place:cilicia, person:caifas], note: "Habla en hebreo. El sumo sacerdote que le dio las cartas para Damasco es Caifás según la nota de Hch 9:1; la asamblea de ancianos sería el Sanedrín (nota del v. 5)."}
    - {v: 6-16, type: speech, entities: [event:conversion-de-pablo, event:ananias-devuelve-la-vista-a-saulo, person:jesus, relation:jesus/appears_to/pablo, person:ananias-de-damasco, relation:ananias-de-damasco/lived_in/damasco, place:damasco, person:pablo], mentions: [place:nazaret], note: "Jesús se presenta como el Nazareno. Sus acompañantes ven la luz pero no entienden la voz (nota del v. 9). Ananías le devuelve la vista y lo anima a bautizarse."}
    - {v: 17-21, type: speech, entities: [event:pablo-en-trance-en-el-templo, person:jesus, person:pablo, place:monte-moria, place:jerusalen, event:muerte-de-esteban, person:esteban], note: "Pablo recuerda que aprobó la muerte de Esteban, testigo de Jesús, y guardó los mantos de quienes lo mataban. La aparición en el trance no lleva otra relación: se_aparece_a ya une a los dos."}
    - {v: 22-29, type: narration, entities: [event:pablo-invoca-su-ciudadania-romana, person:pablo, person:claudio-lisias, place:jerusalen, journey:custodia-en-cesarea, relation:pablo/tie/claudio-lisias], mentions: [event:arresto-en-el-templo], note: "El centurión no tiene nombre. La nota del v. 25 cuenta tres ocasiones en que Pablo alega su ciudadanía; esta es la del medio."}
    - {v: "30", type: narration, entities: [event:pablo-ante-el-sanedrin, person:pablo, person:claudio-lisias], note: "Al día siguiente el comandante lo suelta y lo presenta ante los sacerdotes principales y el Sanedrín; el juicio sigue en Hch 23."}
  23:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [event:pablo-ante-el-sanedrin, person:pablo, person:ananias-sumo-sacerdote, relation:ananias-sumo-sacerdote/lived_in/jerusalen, period:ananias-sumo-sacerdote], note: "Pablo afirma tener la conciencia limpia y Ananías manda que lo golpeen en la boca. Pablo lo llama pared blanqueada; cuando le dicen que es el sumo sacerdote, se disculpa con Éx 22:28."}
    - {v: 6-10, type: narration, entities: [event:pablo-ante-el-sanedrin, person:pablo, person:claudio-lisias, relation:pablo/tie/claudio-lisias], note: "Pablo se declara fariseo, hijo de fariseos, y habla de la resurrección. Saduceos y fariseos discuten a gritos; el comandante, Claudio Lisias, teme por él y lo hace llevar al cuartel."}
    - {v: "11", type: narration, entities: [event:el-senor-anima-a-pablo-en-jerusalen, person:jesus, person:pablo], mentions: [place:jerusalen, place:roma], note: "Esa noche el Señor, Jesús según «Testimonio completo», se aparece junto a Pablo y le promete que dará testimonio también en Roma."}
    - {v: 12-15, type: narration, entities: [event:complot-de-los-cuarenta, person:pablo], note: "Más de 40 judíos se obligan con un juramento (nota del v. 12) a no comer hasta haber matado a Pablo, y piden a los sacerdotes principales y ancianos que lo hagan llevar al Sanedrín."}
    - {v: 16-22, type: narration, entities: [event:complot-de-los-cuarenta, person:pablo, person:claudio-lisias], note: "El hijo de la hermana de Pablo, sin nombre en la Biblia, descubre la emboscada y avisa a su tío; un oficial lo lleva al comandante. Perspicacia «Pablo» sitúa a la hermana y al sobrino en Jerusalén."}
    - {v: 23-30, type: narration, entities: [event:traslado-a-cesarea, person:claudio-lisias, person:felix, person:pablo, place:cesarea, relation:claudio-lisias/lived_in/jerusalen, journey:custodia-en-cesarea], mentions: [period:felix], note: "Salida hacia las 9 de la noche (nota del v. 23). La carta a Félix da por primera vez el nombre del comandante y, según «Testimonio completo», calla que él mismo había encadenado a Pablo."}
    - {v: 31-35, type: narration, entities: [event:traslado-a-cesarea, event:pablo-preso-en-cesarea, person:pablo, person:felix, place:antipatris, place:cesarea, place:cilicia, relation:felix/lived_in/cesarea, relation:pablo/lived_in/cesarea, relation:pablo/tie/felix, journey:custodia-en-cesarea], mentions: [person:herodes-el-grande], note: "De noche llegan a Antípatris y desde allí siguen solo los jinetes. Félix se entera de que Pablo es de Cilicia y lo deja vigilado en el palacio que construyó Herodes el Grande (nota del v. 35)."}
  24:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:juicio-ante-felix, person:ananias-sumo-sacerdote, person:tertulo, person:pablo, relation:tertulo/accompanies/ananias-sumo-sacerdote], note: "Cinco días después bajan a acusarlo el sumo sacerdote Ananías, algunos ancianos y Tértulo, un orador que hacía de abogado (nota de estudio)."}
    - {v: 2-9, type: speech, entities: [event:juicio-ante-felix, person:tertulo, person:felix, person:pablo], mentions: [place:nazaret, event:arresto-en-el-templo], note: "Tértulo halaga a Félix y presenta a Pablo como una peste que agita a los judíos, cabecilla de la secta de los nazarenos y profanador frustrado del templo. El v. 7 no está en los manuscritos más fiables."}
    - {v: 10-21, type: speech, entities: [event:juicio-ante-felix, person:pablo, person:felix, period:felix], mentions: [place:jerusalen, place:asia, event:arresto-en-el-templo, event:pablo-ante-el-sanedrin], note: "Pablo responde que llegó a Jerusalén doce días antes para adorar y traer donativos, que estaba limpio en el templo y que cree en la resurrección. Los judíos de Asia que lo acusaron no se han presentado."}
    - {v: 22-23, type: narration, entities: [event:juicio-ante-felix, person:felix, person:pablo, relation:pablo/tie/felix], mentions: [person:claudio-lisias], note: "Félix, que conoce bien el Camino, deja la decisión para cuando baje Lisias. Un centurión custodia a Pablo con cierta libertad y los suyos pueden atenderlo."}
    - {v: 24-26, type: narration, entities: [event:pablo-habla-a-felix-y-drusila, person:felix, person:drusila, person:pablo, relation:felix/kin/drusila], mentions: [person:jesus, person:herodes-agripa-ii, relation:herodes-agripa-ii/kin/drusila], note: "Félix y Drusila, judía e hija menor de Herodes Agripa I (nota de estudio), escuchan a Pablo sobre la fe en Cristo Jesús. Félix se asusta y después lo llama a menudo esperando un soborno."}
    - {v: "27", type: narration, entities: [event:pablo-habla-a-felix-y-drusila, event:pablo-preso-en-cesarea, person:felix, person:festo, person:pablo, relation:festo/succeeds/felix, relation:pablo/lived_in/cesarea, period:felix, journey:custodia-en-cesarea, relation:festo/holds_office/judea], note: "Pasados dos años, Porcio Festo releva a Félix, que deja a Pablo preso para contentar a los judíos."}
  25:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [event:festo-sube-a-jerusalen, person:festo, person:pablo, place:jerusalen, place:cesarea, relation:festo/lived_in/cesarea, relation:festo/holds_office/judea, journey:festo-visita-jerusalen], mentions: [place:judea], note: "Tres días después de asumir el gobierno de Judea, con sede en Cesarea (nota del v. 1), Festo sube a Jerusalén. Los sacerdotes principales le piden traer a Pablo para matarlo por el camino; Festo los cita en Cesarea."}
    - {v: 6-12, type: narration, entities: [event:pablo-apela-a-cesar, person:festo, person:pablo, person:neron, period:neron, place:cesarea, relation:pablo/lived_in/cesarea, relation:pablo/tie/festo, journey:custodia-en-cesarea], mentions: [place:jerusalen, place:monte-moria], note: "De vuelta en Cesarea, Festo abre el juicio. Pablo niega haber ofendido la Ley, el templo o a César, que era Nerón (nota del v. 8). Para no ir a Jerusalén, apela al emperador; Festo lo acepta tras consultar."}
    - {v: "13", type: narration, entities: [event:agripa-y-berenice-visitan-a-festo, person:herodes-agripa-ii, person:berenice, person:festo, relation:berenice/accompanies/herodes-agripa-ii, relation:herodes-agripa-ii/kin/berenice], mentions: [place:cesarea], note: "Unos días más tarde el rey Agripa, es decir, Herodes Agripa II, llega a Cesarea con su hermana Berenice (nota del v. 13) para saludar al gobernador recién llegado."}
    - {v: 14-21, type: speech, entities: [event:agripa-y-berenice-visitan-a-festo, person:festo, person:herodes-agripa-ii, person:pablo, person:neron], mentions: [person:felix, person:jesus, place:jerusalen, event:festo-sube-a-jerusalen, event:pablo-apela-a-cesar], note: "Festo le cuenta el caso: el preso que dejó Félix, la condena que pedían en Jerusalén y una disputa religiosa sobre un Jesús muerto. El Augusto del v. 21 es Nerón, no César Augusto (nota del v. 21)."}
    - {v: "22", type: narration, entities: [event:agripa-y-berenice-visitan-a-festo, person:herodes-agripa-ii, person:festo], note: "Agripa pide escuchar él también a Pablo, y Festo lo cita para el día siguiente."}
    - {v: 23-27, type: narration, entities: [event:defensa-ante-agripa, person:herodes-agripa-ii, person:berenice, person:festo, person:pablo, person:neron, place:cesarea], mentions: [place:jerusalen], note: "Con gran pompa entran en la sala de audiencias el rey, Berenice, jefes militares y notables. Festo presenta al preso: no halla delito de muerte y necesita algo concreto que escribir a su señor, el emperador."}
  26:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: speech, entities: [event:defensa-ante-agripa, person:herodes-agripa-ii, person:pablo, place:cesarea], note: "Agripa le da la palabra. Pablo se alegra de defenderse ante un rey que conoce bien las costumbres y las disputas de los judíos, y le pide paciencia."}
    - {v: 4-8, type: speech, entities: [person:pablo, relation:pablo/lived_in/jerusalen], mentions: [place:jerusalen], note: "De joven vivió entre su pueblo y en Jerusalén como fariseo, la corriente más rigurosa. Lo juzgan por esperar lo que Dios prometió a los antepasados, igual que las doce tribus, y pregunta por qué parece increíble la resurrección."}
    - {v: 9-11, type: speech, entities: [event:saulo-persigue-a-la-congregacion, person:pablo], mentions: [person:jesus, place:nazaret, place:jerusalen], note: "Combatía el nombre de Jesús el Nazareno: con permiso de los sacerdotes principales encarceló a muchos santos en Jerusalén, votó a favor de ejecutarlos (nota del v. 10), los castigó en las sinagogas y los persiguió hasta ciudades lejanas."}
    - {v: 12-18, type: speech, entities: [event:conversion-de-pablo, person:pablo, person:jesus, relation:jesus/appears_to/pablo], mentions: [place:damasco, person:satanas], note: "Camino de Damasco, a mediodía, una luz más fuerte que el sol los tira al suelo y Jesús le habla en hebreo. Lo nombra siervo y testigo, enviado al pueblo y a las naciones para sacarlos del poder de Satanás."}
    - {v: 19-23, type: speech, entities: [event:pablo-predica-en-damasco, person:pablo, relation:pablo/lived_in/damasco], mentions: [place:damasco, place:jerusalen, place:judea, place:monte-moria, person:moises, person:jesus, event:pablo-visita-a-cefas, event:arresto-en-el-templo], note: "Obedeció la visión: predicó en Damasco, en Jerusalén, por Judea y a las naciones, y por eso lo apresaron en el templo. Solo enseña lo anunciado por Moisés y los Profetas: el Cristo sufriría y resucitaría el primero."}
    - {v: 24-29, type: narration, entities: [event:defensa-ante-agripa, person:festo, person:pablo, person:herodes-agripa-ii], note: "Festo le grita que tanto estudio lo ha trastornado; Pablo responde que habla con cordura y apela a lo que el rey ya sabe. Agripa dice que en poco tiempo lo haría cristiano."}
    - {v: 30-32, type: narration, entities: [event:defensa-ante-agripa, person:herodes-agripa-ii, person:festo, person:berenice, person:pablo, person:neron, relation:berenice/accompanies/herodes-agripa-ii, journey:custodia-en-cesarea], note: "Se levantan el rey, el gobernador, Berenice y los demás, y al salir coinciden en que Pablo es inocente. Agripa dice que podría estar libre de no haber apelado a César, que era Nerón (nota del v. 32)."}
  27:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:zarpan-hacia-roma, journey:viaje-a-roma, person:pablo, person:julio, person:aristarco, person:lucas, place:adramitio, place:sidon, relation:pablo/tie/julio, relation:aristarco/accompanies/pablo@58, relation:aristarco/lived_in/tesalonica, relation:lucas/accompanies/pablo@56], mentions: [place:italia, place:asia, place:macedonia, place:tesalonica], note: "El «nosotros» muestra que Lucas va a bordo hasta Hch 28:16. Julio es del regimiento de Augusto, un cuerpo que Perspicacia no sabe identificar; ese Augusto no es una persona del relato."}
    - {v: 4-6, type: narration, entities: [event:cambian-de-barco-en-mira, place:mira, place:licia, person:julio, person:pablo], mentions: [place:chipre, place:cilicia, place:panfilia, place:alejandria], note: "El barco de Alejandría llevaba grano; Egipto abastecía de cereal a Roma (nota de estudio de 27:6)."}
    - {v: 7-12, type: narration, entities: [event:pablo-advierte-en-bellos-puertos, place:cnido, place:creta, place:salmone, place:bellos-puertos, person:pablo, person:julio], mentions: [place:lasea, place:fenice], note: "El ayuno de Expiación, el único que mandaba la Ley, caía a fines de septiembre o principios de octubre: empezaba la temporada peligrosa para navegar."}
    - {v: 13-20, type: narration, entities: [event:tormenta-y-naufragio, place:creta, place:cauda], mentions: [place:sirte], note: "El euroaquilón es un viento del noreste, el gregal. Suben el esquife, ciñen el casco, arrían los aparejos y echan al mar la carga y las jarcias."}
    - {v: 21-26, type: narration, entities: [event:un-angel-anima-a-pablo-en-la-tormenta, event:tormenta-y-naufragio, person:pablo, person:neron], mentions: [place:creta, place:malta], note: "El ángel no tiene nombre. El César ante quien Pablo debe comparecer es Nerón (Perspicacia «César»); la isla anunciada es Malta (referencia de 27:26)."}
    - {v: 27-38, type: narration, entities: [event:tormenta-y-naufragio, place:mar-de-adria, person:pablo, person:julio], note: "A medianoche sondean 20 y 15 brazas. Los soldados impiden que huyan los marineros. Pablo da gracias por el pan y todos comen; a bordo van 276 personas."}
    - {v: 39-44, type: narration, entities: [event:tormenta-y-naufragio, person:julio, person:pablo], mentions: [place:malta], note: "El barco encalla en un banco de arena de una bahía que no reconocen. Julio impide que maten a los presos y todos llegan a tierra. Hch 28:1 dice que era Malta."}
  28:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: narration, entities: [event:la-vibora-de-malta, place:malta, person:pablo], note: "Los isleños no hablaban griego. La Justicia que nombran puede ser la diosa Diké, que según la mitología griega castigaba a los culpables (nota de estudio de 28:4)."}
    - {v: 7-10, type: narration, entities: [event:padre-de-publio-sanado, person:publio, person:pablo, place:malta, relation:publio/lived_in/malta], note: "El padre de Publio no tiene nombre. Después se curan otros enfermos de la isla, que los despiden con regalos y provisiones."}
    - {v: 11-14, type: narration, entities: [event:los-hermanos-de-puteoli-hospedan-a-pablo, journey:viaje-a-roma, place:siracusa, place:regio, place:puteoli, person:pablo, person:lucas, relation:lucas/accompanies/pablo@56], mentions: [place:malta, place:alejandria], note: "El mascarón de los Hijos de Zeus representa a Cástor y Pólux, dioses gemelos a los que los marinos pedían protección; no llevan ficha."}
    - {v: "15", type: narration, entities: [event:hermanos-salen-al-encuentro, place:plaza-del-mercado-de-apio, place:tres-tabernas, person:pablo], mentions: [place:roma], note: "Los dos lugares están en la Vía Apia, a unos 65 y 50 km de Roma (notas de estudio de 28:14, 15)."}
    - {v: "16", type: narration, entities: [event:llegada-a-roma, place:roma, person:pablo, relation:pablo/lived_in/roma], note: "Fin de los pasajes en «nosotros» que empiezan en Hch 27:1."}
    - {v: 17-22, type: narration, entities: [event:pablo-habla-a-los-judios-de-roma, person:pablo, person:neron, place:roma], mentions: [place:jerusalen, place:judea, event:arresto-en-el-templo, event:pablo-apela-a-cesar], note: "El César al que apeló es Nerón (Perspicacia «César»). Israel aparece como pueblo, en «la esperanza de Israel»."}
    - {v: 23-28, type: narration, entities: [event:pablo-da-testimonio-a-los-judios-de-roma, person:pablo], mentions: [person:jesus, person:moises, person:isaias], note: "Pablo cita Is 6:9, 10. El versículo 29 no está en los manuscritos más antiguos y la TNM no lo incluye."}
    - {v: 30-31, type: narration, entities: [event:pablo-predica-dos-anos-en-roma, person:pablo, place:roma, relation:pablo/lived_in/roma], mentions: [person:jesus, event:pablo-queda-libre, journey:ultimos-anos-de-pablo, letter:efesios, letter:filipenses, letter:colosenses, letter:filemon, letter:hebreos], note: "Según la nota de estudio de 28:30, en estos dos años escribió Efesios, Filipenses, Colosenses, Filemón y, al parecer, Hebreos; hacia 61 lo habrían declarado inocente."}
