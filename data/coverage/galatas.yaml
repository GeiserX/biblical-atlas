# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: galatas
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    note: "Pablo defiende que su apostolado y su mensaje vienen de Jesucristo y no de hombres, y lo prueba con su historia: perseguidor, llamado por Dios, Arabia y Damasco, quince días con Cefas, años en Siria y Cilicia."
    spans:
    - {v: 1-5, type: letter, entities: [letter:galatas, event:pablo-escribe-galatas, person:pablo, place:galacia], mentions: [person:jesus, event:resurreccion-de-jesus, event:muerte-de-jesus, journey:primer-viaje, place:antioquia-de-pisidia, place:iconio, place:listra, place:derbe], note: "Saludo de Pablo, apóstol por Jesucristo y por el Padre que lo resucitó, y de los hermanos con él, a las congregaciones de Galacia. La nota las pone en las ciudades del sur que visitó en el primer viaje."}
    - {v: 6-9, type: letter, mentions: [person:jesus], note: "Le extraña que se aparten tan rápido hacia otras supuestas buenas noticias. Unos alborotadores sin nombre, judaizantes según la nota, las deforman; quien anuncie algo distinto, aunque sea un ángel, queda maldito."}
    - {v: 10-12, type: letter, mentions: [person:jesus, event:conversion-de-pablo], note: "No busca el favor de los hombres, sino el de Dios, como esclavo de Cristo. El mensaje que predica no lo aprendió de nadie: se lo reveló Jesucristo, que según la nota lo comisionó en persona."}
    - {v: 13-14, type: letter, entities: [event:saulo-persigue-a-la-congregacion, person:pablo], mentions: [person:gamaliel-fariseo], note: "Recuerda cómo perseguía con saña a la congregación y cómo destacaba en el judaísmo por su celo por las tradiciones de sus padres. La nota del v. 14 recuerda que lo formó Gamaliel."}
    - {v: 15-17, type: letter, entities: [event:conversion-de-pablo, event:pablo-va-a-arabia, person:pablo, place:arabia, place:damasco, relation:pablo/lived_in/damasco, journey:primeros-anos-de-pablo], mentions: [person:jesus, place:jerusalen, event:pablo-predica-en-damasco, event:huida-de-damasco], note: "Dios, que lo eligió desde que nació, le reveló a su Hijo para que lo anunciara a las naciones. Sin consultar a nadie, fue a Arabia y volvió a Damasco; la nota ve posible que predicara allí antes y después."}
    - {v: 18-20, type: letter, entities: [event:pablo-visita-a-cefas, person:pablo, person:pedro, person:santiago-hermano-de-jesus, place:jerusalen, relation:pablo/tie/pedro, relation:jesus/kin/santiago-hermano-de-jesus, relation:santiago-hermano-de-jesus/lived_in/jerusalen, journey:primeros-anos-de-pablo], mentions: [person:jesus, person:bernabe, relation:bernabe/accompanies/pablo@36], note: "Tres años después sube a Jerusalén a ver a Cefas y pasa 15 días con él; de los apóstoles solo ve a Santiago, hermano del Señor. Bernabé, que según Hch 9:27 lo presentó, no se nombra aquí."}
    - {v: 21-24, type: letter, entities: [event:pablo-predica-en-siria-y-cilicia, event:pablo-enviado-a-tarso, person:pablo, place:siria, place:cilicia, place:judea, relation:pablo/lived_in/tarso, journey:primeros-anos-de-pablo], mentions: [place:tarso, place:antioquia-de-siria, person:bernabe, event:cristianos-en-antioquia, event:vision-del-tercer-cielo, event:saulo-persigue-a-la-congregacion], note: "Va a las regiones de Siria y Cilicia. Las congregaciones de Judea solo saben de oídas que su antiguo perseguidor anuncia la fe, y alaban a Dios. La nota pone ahí Tarso, Antioquía y la visión de 2Co 12."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    note: "Pablo cuenta su segunda subida a Jerusalén, donde las columnas reconocen su encargo entre las naciones, y cómo corrigió a Cefas en Antioquía; de ahí pasa a explicar que se es justo por la fe."
    spans:
    - {v: 1-5, type: letter, entities: [letter:galatas, event:concilio-de-jerusalen-49, journey:visita-a-jerusalen-49, person:pablo, person:bernabe, person:tito, place:jerusalen, relation:tito/accompanies/pablo@49], mentions: [person:jesus, event:pablo-visita-a-cefas, event:debate-en-antioquia-sobre-la-circuncision, place:antioquia-de-siria, relation:bernabe/accompanies/pablo@45], note: "Catorce años después sube a Jerusalén por una revelación, con Bernabé y Tito. Expone en privado su mensaje; a Tito, que es griego, no lo obligan a circuncidarse, y no ceden ante falsos hermanos infiltrados. La nota da 49."}
    - {v: 6-10, type: letter, entities: [event:concilio-de-jerusalen-49, journey:visita-a-jerusalen-49, person:pablo, person:pedro, person:santiago-hermano-de-jesus, person:juan-apostol, person:bernabe, relation:juan-apostol/lived_in/jerusalen, relation:pedro/accompanies/juan-apostol], mentions: [place:jerusalen, event:colecta-de-macedonia-y-acaya, relation:bernabe/accompanies/pablo@45], note: "Los hombres respetados no le añaden nada. Santiago, Cefas y Juan, las columnas, aceptan que él vaya a los incircuncisos y Pedro a los circuncisos, y piden acordarse de los pobres. La nota lo enlaza con la colecta."}
    - {v: 11-14, type: letter, entities: [event:pablo-corrige-a-pedro-en-antioquia, person:pablo, person:pedro, person:bernabe, person:santiago-hermano-de-jesus, place:antioquia-de-siria, relation:pablo/lived_in/antioquia-de-siria, relation:santiago-hermano-de-jesus/lived_in/jerusalen, relation:bernabe/lived_in/antioquia-de-siria], mentions: [place:jerusalen, event:pedro-predica-a-cornelio, event:concilio-de-jerusalen-49, event:la-carta-de-jerusalen-llega-a-antioquia], note: "En Antioquía, Cefas deja de comer con los gentiles al llegar unos de parte de Santiago, y hasta Bernabé se deja arrastrar. Pablo lo corrige delante de todos. La nota lo pone hacia 49, trece años después de Cornelio."}
    - {v: 15-21, type: letter, mentions: [person:jesus, event:muerte-de-jesus], note: "Dios no declara justo a nadie por cumplir la ley, solo por creer en Cristo. Pablo murió para la ley y vive confiando en el Hijo; si la ley bastara, la muerte de Cristo habría sido inútil."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    note: "Justicia por la fe y no por la Ley, con Abrahán de ejemplo. Sin sucesos nuevos: recuerda los pactos con Abrahán y de la Ley."
    spans:
    - {v: 1-5, type: letter, entities: [letter:galatas], mentions: [person:pablo, place:galacia, person:jesus, event:muerte-de-jesus], note: "Pablo reprocha a los gálatas que se dejen desviar. Se les presentó con claridad a Jesucristo muerto en el madero, y recibieron el espíritu por creer lo que oyeron, no por cumplir la ley."}
    - {v: 6-9, type: letter, entities: [person:abrahan, event:pacto-de-los-animales-partidos, event:pacto-con-abrahan], note: "Abrahán creyó a Jehová y se le contó como justicia (Gé 15:6). Son hijos suyos los que tienen fe, y en él serían bendecidas las naciones, como se le anunció al llamarlo (Gé 12:3)."}
    - {v: 10-14, type: letter, entities: [event:pacto-con-abrahan], mentions: [person:jesus, person:abrahan, event:muerte-de-jesus], note: "Confiar en las obras de la Ley trae maldición (Dt 27:26); el justo vive por la fe (Hab 2:4; Habacuc no se nombra). Cristo, colgado en un madero (Dt 21:23), cargó con esa maldición."}
    - {v: 15-18, type: letter, entities: [person:abrahan, person:jesus, relation:jesus/kin/abrahan, event:pacto-con-abrahan, event:pacto-de-la-ley], mentions: [event:abran-llega-a-siquem, event:abran-se-instala-en-mamre, event:pacto-de-la-circuncision, event:abrahan-ofrece-a-isaac, place:rio-eufrates, event:exodo], note: "Las promesas a Abrahán y a su descendencia apuntan a uno solo, Cristo. La Ley, 430 años posterior, no anula ese pacto, que según la nota rigió desde que Abrahán cruzó el Éufrates (1943 a.e.c.)."}
    - {v: 19-22, type: letter, entities: [event:pacto-de-la-ley], mentions: [person:moises, event:diez-mandamientos, event:dios-da-a-moises-las-tablas-del-testimonio], note: "La Ley se añadió para sacar a la luz las transgresiones hasta la llegada de la descendencia. La transmitieron ángeles por un mediador, Moisés según la nota. Dios es uno solo, como en Dt 6:4."}
    - {v: 23-25, type: letter, mentions: [person:jesus], note: "Antes de llegar la fe en Cristo, la Ley vigilaba a los judíos como el tutor que cuida de un niño, y los condujo hasta Cristo. Llegada la fe, ya no están bajo ese tutor."}
    - {v: 26-29, type: letter, mentions: [person:jesus, person:abrahan, event:pacto-con-abrahan, event:abrahan-ofrece-a-isaac], note: "Por la fe en Cristo Jesús todos son hijos de Dios; bautizados en él, ya no cuenta ser judío o griego, esclavo o libre, hombre o mujer. Los de Cristo son descendencia de Abrahán y herederos de la promesa."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    note: "Hijos adoptados y no esclavos, el recuerdo de la primera visita de Pablo a Galacia y la historia simbólica de Agar y Sara."
    spans:
    - {v: 1-7, type: letter, entities: [letter:galatas, event:nacimiento-de-jesus], mentions: [person:jesus, person:maria-madre-de-jesus], note: "Un heredero niño vive como esclavo bajo tutores. Llegado el momento señalado, Dios mandó a su Hijo, nacido de una mujer (María, en 2 a.e.c., según la nota) y bajo la ley, para adoptar como hijos a los liberados."}
    - {v: 8-11, type: letter, note: "Antes servían a dioses que no lo son; ahora que conocen a Dios, vuelven a cosas elementales y guardan días, meses, épocas y años, que la nota liga a las fiestas de la Ley. Pablo teme por ellos."}
    - {v: 12-20, type: letter, entities: [person:pablo, place:galacia], mentions: [person:jesus, journey:primer-viaje, journey:segundo-viaje, person:bernabe, place:antioquia-de-pisidia, place:iconio, place:listra, place:derbe], note: "Pablo les predicó por primera vez a causa de una enfermedad, tal vez de los ojos, y lo acogieron como a un ángel. Otros quieren apartarlos de él. La nota lo sitúa, quizás, en el primer viaje (c. 47-48)."}
    - {v: 21-23, type: letter, entities: [person:abrahan, person:isaac, event:nacimiento-de-ismael, event:nacimiento-de-isaac, relation:isaac/kin/abrahan], mentions: [event:sarai-da-a-agar-a-abran, event:pacto-de-la-circuncision, person:sara, person:ismael-hijo-de-abrahan, person:agar], note: "De Abrahán nacieron dos hijos: el de la sirvienta, de forma natural, y el de la mujer libre, por una promesa. Son Ismael, de Agar, e Isaac, de Sara (notas de los v. 22 y 29)."}
    - {v: 24-27, type: letter, entities: [event:pacto-de-la-ley, event:pacto-con-abrahan, place:monte-sinai, place:arabia, person:agar], mentions: [person:sara, place:jerusalen], note: "Historia simbólica: Agar es el pacto del Sinaí, monte de Arabia, que da hijos esclavos, como la Jerusalén de entonces. La Jerusalén de arriba, libre, es la madre de los cristianos. Cita Is 54:1 sin nombrar a Isaías."}
    - {v: 28-31, type: letter, entities: [person:isaac, event:isaac-destetado-e-ismael-se-burla], mentions: [person:sara, person:agar, event:agar-e-ismael-en-el-desierto, person:ismael-hijo-de-abrahan, event:nacimiento-de-isaac], note: "Los cristianos son hijos de la promesa, como Isaac. Ismael lo persiguió (Gé 21:9) y ahora pasa igual. La Escritura manda echar a la sirvienta y a su hijo (Gé 21:10): son hijos de la mujer libre."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    note: "Consejo de la carta, sin sucesos ni lugares en el texto: la libertad cristiana frente a la circuncisión, y las obras de la carne frente al fruto del espíritu."
    spans:
    - {v: 1-6, type: letter, entities: [letter:galatas, person:pablo], mentions: [person:jesus], note: "Cristo los hizo libres: que no vuelvan al yugo de la Ley. Pablo, que se nombra, avisa de que quien se circuncide queda atado a toda la Ley y lejos de Cristo. Vale la fe que obra por amor."}
    - {v: 7-12, type: letter, entities: [person:pablo], mentions: [place:galacia, event:muerte-de-jesus], note: "Los cristianos de Galacia, dice la nota, iban bien hasta que alguien, sin nombre, los estorbó. Dicho de la levadura. Si Pablo aún predicara la circuncisión no lo perseguirían. Hipérbole: ojalá se castraran los que los confunden."}
    - {v: 13-15, type: letter, note: "La libertad no es excusa para ceder a la carne; por amor, que se sirvan unos a otros. Toda la Ley cabe en amar al prójimo (Le 19:18, sin nombrar a Moisés). Nada de morderse."}
    - {v: 16-18, type: letter, note: "Carne y espíritu tiran en sentidos contrarios. Quien se deja guiar por el espíritu de Dios no cumple los malos deseos ni está bajo la ley."}
    - {v: 19-21, type: letter, note: "Lista de obras de la carne, de la inmoralidad sexual a las fiestas descontroladas, que la nota da por incompleta. Quien las practique no heredará el Reino. La nota cita a Josefo sobre Jezabel y Baal solo como ejemplo."}
    - {v: 22-26, type: letter, mentions: [person:jesus], note: "Los nueve aspectos del fruto del espíritu, del amor al autocontrol, sin ley en contra. Los de Cristo han clavado la carne al madero. Nada de vanagloria, rivalidades ni envidias."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    note: "Final de la carta: consejos para la congregación, la carta escrita de su propia mano y la última advertencia contra los que imponen la circuncisión. Sin saludos de nadie."
    spans:
    - {v: 1-5, type: letter, mentions: [person:jesus], note: "Al que da un paso en falso, que los maduros lo reajusten con apacibilidad, vigilándose a sí mismos. Llevar las cargas de otros cumple la ley del Cristo, aunque cada uno lleva su propia carga de responsabilidad."}
    - {v: 6-10, type: letter, note: "Quien aprende la palabra comparte lo bueno con su maestro. Nadie se burla de Dios: se cosecha lo sembrado, dicho conocido según la nota. Hagan el bien a todos, ante todo a los hermanos en la fe."}
    - {v: "11", type: letter, entities: [letter:galatas, person:pablo, event:pablo-escribe-galatas], note: "Pablo señala las letras grandes que traza de su propia mano; la nota al pie admite leer «qué carta tan larga». La nota de 2Co 12:7 une este versículo y 4:15 a un posible problema de vista."}
    - {v: 12-16, type: letter, entities: [person:pablo], mentions: [person:jesus, event:muerte-de-jesus], note: "Los que empujan a circuncidarse buscan quedar bien y evitar que los persigan por el madero de Cristo. Pablo solo presume de ese madero. Vale ser una nueva creación; el Israel de Dios es el Israel espiritual, sin ficha."}
    - {v: 17-18, type: letter, entities: [person:pablo], mentions: [person:jesus], note: "Que nadie lo moleste: sus señales de esclavo de Jesús pueden ser cicatrices de los abusos de 2Co 11:23-27, o su vida de ministro, según la nota y Perspicacia «Marca». Despedida sin nombres."}
