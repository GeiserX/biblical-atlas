# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: abdias
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: prophecy, entities: [person:abdias-profeta, event:abdias-profetiza-contra-edom, place:edom], note: "Encabezamiento: la visión de Abdías, nombre que la nota traduce «siervo de Jehová». Jehová convoca a las naciones contra Edom, que se cree a salvo en sus peñascos; aunque anidara como el águila, él la derribaría."}
    - {v: 5-7, type: prophecy, entities: [event:abdias-profetiza-contra-edom, place:edom], mentions: [person:nabonido], note: "Un ladrón o un vendimiador dejan algo; a Esaú, aquí Edom, lo saquearán del todo, y sus aliados lo engañarán. Perspicacia y «Toda Escritura» lo ven cumplido cuando Nabonido de Babilonia conquistó Edom, en el siglo VI a.e.c."}
    - {v: 8-9, type: prophecy, entities: [event:abdias-profetiza-contra-edom, place:edom, place:teman], note: "Jehová acabará con los sabios de Edom y con la inteligencia de la región montañosa de Esaú, otro nombre de esa tierra. Los guerreros de Temán, distrito famoso por su sabiduría y su valor, se llenarán de terror."}
    - {v: 10-14, type: prophecy, entities: [event:abdias-profetiza-contra-edom, event:destruccion-de-jerusalen-607, place:edom, place:jerusalen], mentions: [place:juda], note: "Edom maltrató a su hermano Jacob, el pueblo del gemelo de Esaú: cuando Babilonia tomó Jerusalén en 607 a.e.c., se alegró, entró a saquear y entregó a los fugitivos (Sl 137:7). Otra referencia lleva a 2Re 24."}
    - {v: 15-16, type: prophecy, entities: [event:abdias-profetiza-contra-edom, place:edom], mentions: [place:jerusalen], note: "Está cerca el día en que Jehová juzgará a todas las naciones, y a Edom le pagarán con lo mismo que hizo. Así como bebieron en la santa montaña de Jehová, en Jerusalén, las naciones beberán sin parar hasta desaparecer."}
    - {v: "17", type: prophecy, entities: [event:abdias-profetiza-contra-edom, place:jerusalen], mentions: [event:regreso-de-537], note: "En el monte Sion quedarán los que escapen, y será santo; la casa de Jacob, el pueblo, recobrará lo suyo. Joe 2:32 dice casi lo mismo, y Perspicacia «Joel, Libro de» no decide cuál de los dos citó al otro."}
    - {v: "18", type: prophecy, entities: [event:abdias-profetiza-contra-edom, place:edom], mentions: [place:israel, place:idumea], note: "La casa de Jacob será fuego, y la de José, el reino del norte, una llama; la de Esaú arderá como paja. Según Perspicacia, los edomitas acabaron en Idumea y dejaron de ser un pueblo tras el año 70."}
    - {v: 19-20, type: prophecy, entities: [event:abdias-profetiza-contra-edom, place:negueb, place:edom, place:sefela, place:filistea, place:territorio-de-efrain, place:israel, place:galaad, place:canaan, place:sarepta, place:jerusalen, place:sefarad], mentions: [place:samaria, event:regreso-de-537, period:destierro-y-regreso], note: "Los repatriados ocuparán el Négueb, Edom, la Sefelá, Filistea, Efraín, Samaria (el reino del norte) y Canaán hasta Sarepta; Benjamín, la tribu, cuyo territorio no tiene ficha, tomará Galaad. Los desterrados en Sefarad, quizá Saparda de Media, poblarán el Négueb."}
    - {v: "21", type: prophecy, entities: [event:abdias-profetiza-contra-edom, place:jerusalen, place:edom], note: "Unos salvadores subirán al monte Sion a juzgar a Edom, y Jehová será quien reine. «Toda Escritura» lo presenta como el triunfo final de su Reino."}
