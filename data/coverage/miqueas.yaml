# biblical-earth: cobertura de un libro. Formato en data/coverage/README.md.
book: miqueas
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [person:miqueas-profeta, place:moreset, relation:miqueas-profeta/lived_in/moreset, event:miqueas-profetiza-contra-samaria-y-jerusalen, place:samaria, place:jerusalen], mentions: [person:jotan, person:acaz, person:ezequias, place:juda], note: "Encabezamiento: palabra que Miqueas recibe en visión sobre Samaria y Jerusalén, reinando en Judá Jotán, Acaz y Ezequías. La nota explica el nombre como forma breve de Miguel o de Micaya."}
    - {v: 2-7, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:samaria, place:jerusalen, place:juda], mentions: [event:caida-de-samaria], note: "Jehová baja de su templo y los montes se funden. Jacob e Israel son el pueblo, sin ficha. Samaria quedará en ruinas y sus ídolos rotos: Asiria la arrasó en 740 («Toda Escritura», libro 33, párr. 4)."}
    - {v: 8-9, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, person:miqueas-profeta, place:juda, place:jerusalen], mentions: [event:senaquerib-contra-jerusalen], note: "El profeta se lamenta y anda descalzo y desnudo. La herida de Samaria llega hasta la puerta de Jerusalén: «Toda Escritura» lo ve cumplido cuando Senaquerib invadió Judá en días de Ezequías."}
    - {v: 10-12, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:gat, place:bet-afra, place:safir, place:zaanan, place:bet-ezel, place:marot, place:jerusalen], mentions: [place:zenan, event:senaquerib-contra-jerusalen], note: "Serie de juegos de palabras con nombres de ciudades (Perspicacia «Bet-ezel»): en Bet-Afrá, «polvo», revolcarse en el polvo; Safir, «agradable», avergonzada; Marot, «amargo», esperaba el bien. Gat es aquí ciudad extranjera."}
    - {v: 13-15, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:lakis, place:moreset, place:aczib-de-juda, place:maresa, place:adulam], mentions: [place:jerusalen, event:senaquerib-contra-jerusalen], note: "Lakís, que según Perspicacia parece aprestarse a huir, fue principio del pecado de la hija de Sion. Sion perderá Moréset como regalo de despedida; Aczib, «engañosa», defraudará a los reyes. Israel es el pueblo, como en 1:5."}
    - {v: "16", type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], mentions: [event:caida-de-samaria, event:destruccion-de-jerusalen-607], note: "Raparse como el águila por los hijos llevados al destierro. La Atalaya de 2007 lee la calva como la vergüenza de Israel y Judá, que crecería al ir cautivos."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], mentions: [event:caida-de-samaria], note: "¡Ay de quienes traman de noche quitar campos y casas al prójimo! Perderán su herencia y serán deportados (La Atalaya de 2003). Las referencias remiten a Nabot (1Re 21) y al destierro de Israel a Asiria (2Re 17:23)."}
    - {v: 6-11, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], note: "Mandan callar a los profetas de Jehová, despojan a quien pasa confiado y echan de casa a mujeres y niños. La casa de Jacob es el pueblo. El predicador que les gusta promete vino y licor."}
    - {v: 12-13, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], mentions: [event:regreso-de-537, person:jesus], note: "Jehová reunirá al resto de Jacob como ovejas en un corral. Cumplido primero con el regreso de 537, según La Atalaya de 2003 y 2007; la de 2003 aplica el rey del versículo 13 a Jesucristo."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, person:miqueas-profeta], note: "Miqueas llama a los jefes de Jacob y de la casa de Israel, que son el pueblo, sin ficha. Deberían saber lo justo, pero despellejan a la gente como carne para la olla; cuando clamen, Jehová callará."}
    - {v: 5-8, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, person:miqueas-profeta], note: "Los profetas que prometen paz a quien les da de comer y declaran la guerra a quien no, se quedarán a oscuras, sin visiones ni respuesta. Miqueas, en cambio, habla con la fuerza del espíritu de Jehová."}
    - {v: 9-12, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:jerusalen, place:monte-moria], mentions: [person:ezequias, event:destruccion-de-jerusalen-607], note: "Jueces con soborno, sacerdotes y profetas a sueldo levantan Sion con sangre. Jerusalén acabará en ruinas y el monte del templo como un bosque (607 a.e.c.). Jer 26:18, 19 lo pone bajo Ezequías, que hizo caso."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:jerusalen], mentions: [person:jacob], note: "Muchas naciones subirán a la montaña de la casa de Jehová y harán arados de sus espadas (Is 2:2-4). Perspicacia la lee como figura de la adoración pura ensalzada (29-70 e.c.), no como el monte de 3:12: sin ficha."}
    - {v: 6-8, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:jerusalen], mentions: [event:regreso-de-537, place:torre-de-eder], note: "Jehová reunirá a la que cojeaba y hará de ella un resto fuerte; Perspicacia «Resto» lo ve cumplido en 537. Torre del rebaño traduce el nombre hebreo de la torre de Éder (Gé 35:21), según «Éder»."}
    - {v: 9-10, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:jerusalen, place:babilonia], mentions: [event:destruccion-de-jerusalen-607, event:regreso-de-537], note: "Sion se retorcerá como una parturienta: dejará la ciudad, acampará en el campo y llegará a Babilonia, donde Jehová la rescatará. La Atalaya de 2003 lo aplica al destierro de Jerusalén y a la vuelta de un resto."}
    - {v: 11-13, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:jerusalen], note: "Muchas naciones se juntan contra Sion para verla profanada, sin conocer el plan de Jehová: él las amontonará como gavillas en la era, y Sion las trillará con cuernos de hierro y pezuñas de cobre."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], mentions: [person:jesus, event:juicio-ante-el-sanedrin, event:sentencia-y-barrabas], note: "La hija sitiada se hace cortes de duelo, y al juez de Israel lo golpean con una vara en la mejilla. Perspicacia («Mejilla», «Vara, bastón») lo aplica al Mesías, abofeteado ante el Sanedrín y por los soldados."}
    - {v: 2-4, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:belen], mentions: [place:juda, person:jesus, event:nacimiento-de-jesus, event:astrologos-ante-herodes, event:fiesta-de-los-tabernaculos-32], note: "De Belén Efrata, pequeña entre los clanes de Judá, saldrá un gobernante de origen antiquísimo, que pastoreará con la fuerza de Jehová y llegará a los confines de la tierra. Mt 2:4-6 y Jn 7:42 lo aplican al Cristo."}
    - {v: 5-6, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:asiria], mentions: [person:jesus, person:ezequias, person:isaias, person:miqueas-profeta, person:senaquerib, event:senaquerib-contra-jerusalen], note: "Él traerá paz. Contra el asirio invasor se alzarán siete pastores y ocho príncipes, que someterán con espada a Asiria, llamada tierra de Nemrod. La Atalaya de 2013 ve un primer cumplimiento en Ezequías frente a Senaquerib."}
    - {v: 7-9, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], mentions: [event:regreso-de-537], note: "Lo que quede de Jacob, el pueblo y no el patriarca, será entre muchas naciones como rocío de Jehová y como un león entre rebaños. La Atalaya de 2003 lo aplica a un resto arrepentido que volvería a su tierra."}
    - {v: 10-15, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], note: "Jehová quitará a su pueblo los caballos, los carros, las ciudades y las fortalezas en que confiaba, y también la hechicería, la magia, las imágenes, las columnas y los postes sagrados. Se vengará de las naciones desobedientes."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], note: "Jehová abre un pleito contra su pueblo y llama como testigos a los montes y las colinas. «Toda Escritura», libro 33, lo ve como un juicio en forma de diálogo. Israel es aquí el pueblo, sin ficha."}
    - {v: 3-5, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, event:exodo, person:moises, person:aaron, person:miriam-hermana-de-moises, person:balac, person:balaam, relation:balac/lived_in/moab, relation:balaam/kin/beor-padre-de-balaam, place:sitim, place:guilgal], mentions: [place:egipto, place:moab, person:beor-padre-de-balaam, event:israel-canta-junto-al-mar-rojo, event:balac-manda-llamar-a-balaam, event:balaam-bendice-a-israel-desde-bamot-baal, event:balaam-bendice-a-israel-desde-pisga, event:balaam-bendice-a-israel-desde-peor, event:israel-adora-al-baal-de-peor, event:israel-se-venga-de-madian, event:entrada-en-canaan], note: "Jehová recuerda que sacó a Israel de Egipto, le dio por guías a Moisés, Aarón y Míriam, frustró a Balac y Balaam y lo llevó de Sitim a Guilgal. La circuncisión allí (Jos 5:9) es de Josué."}
    - {v: 6-8, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], note: "No bastan holocaustos, miles de carneros ni entregar al primogénito; la referencia remite al rey de Moab de 2Re 3:27. Jehová solo pide justicia, amor leal y un andar modesto con él."}
    - {v: 9-12, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], note: "La voz de Jehová clama a una ciudad que el texto no nombra. Condena el efá escaso, las balanzas falsas, las pesas de engaño, la violencia de los ricos y la mentira de sus vecinos."}
    - {v: 13-16, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, person:omri, person:acab], note: "Jehová herirá al pueblo: comerá sin saciarse y sembrará sin cosechar, porque sigue los estatutos de Omrí y las costumbres de la casa de Acab, reyes de Samaria. Perspicacia «Omrí» sitúa la condena unos doscientos años después de él."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, person:miqueas-profeta], note: "Miqueas se lamenta como quien no halla fruta tras la cosecha: ya no queda nadie leal. El príncipe exige, el juez cobra y el poderoso conspira. Perspicacia «Miqueas» dice que sus imágenes salen de la vida del campo."}
    - {v: 5-7, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, person:miqueas-profeta], mentions: [event:tercera-gira-y-envio-de-los-doce, event:rico-insensato-y-mayordomo-fiel], note: "No se puede fiar uno ni del amigo ni de la familia: el enemigo está en casa. Jesús repitió la idea (Mt 10:35, 36; Lu 12:53). Miqueas, en cambio, seguirá esperando al Dios que lo salva."}
    - {v: 8-10, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], note: "Habla el pueblo castigado: aunque ha caído, se levantará, y Jehová será su luz; aguantará su ira porque pecó. La enemiga que preguntaba dónde estaba su Dios, sin nombre en el texto, acabará pisoteada."}
    - {v: 11-13, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], mentions: [place:asiria, place:egipto, place:rio-eufrates], note: "Llegará el día de levantar murallas y ensanchar límites; vendrán desde Asiria, desde las ciudades de Egipto y hasta el Río, que la nota llama Éufrates. La Atalaya de 2003 lo aplica a gente de todas las naciones."}
    - {v: 14-17, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen, place:basan, place:galaad], mentions: [place:egipto, event:exodo, event:regreso-de-537], note: "Jehová pastoreará a su rebaño, que comerá en Basán y Galaad como antes; Perspicacia «Galaad» ve ahí la promesa de volver a esa tierra. Hará maravillas como al salir de Egipto, y las naciones temblarán."}
    - {v: 18-20, type: prophecy, entities: [event:miqueas-profetiza-contra-samaria-y-jerusalen], mentions: [person:jacob, person:abrahan, event:abrahan-ofrece-a-isaac, event:nacimiento-de-juan-el-bautista, event:regreso-de-537], note: "Nadie es como Jehová: perdona al resto de su pueblo y hunde sus pecados en el mar. Será fiel a Jacob y a Abrahán, como juró (Gé 22:17; Lu 1:72, 73). La Atalaya de 2003 lo ve cumplido en 537."}
