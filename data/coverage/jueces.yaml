    - {v: 23-25, type: narration, entities: [event:israel-pierde-la-segunda-batalla-contra-benjamin, place:guibea-de-benjamin, place:betel], note: "Segunda derrota: 18.000 muertos más."}
    - {v: 26-28, type: narration, entities: [event:israel-ayuna-en-betel-y-consulta-a-jehova, place:betel, person:finehas-hijo-de-eleazar, relation:finehas-hijo-de-eleazar/kin/eleazar-hijo-de-aaron, relation:finehas-hijo-de-eleazar/kin/aaron, relation:finehas-hijo-de-eleazar/succeeds/eleazar-hijo-de-aaron, relation:eleazar-hijo-de-aaron/kin/aaron], mentions: [person:eleazar-hijo-de-aaron, person:aaron], note: "El arca del pacto es un objeto, sin ficha. Perspicacia «Betel» cree que la trajeron de Siló por la cercanía de la batalla."}
    - {v: 29-41, type: narration, entities: [event:israel-vence-a-benjamin-y-quema-guibea, place:guibea-de-benjamin, place:baal-tamar, place:betel], note: "La emboscada recuerda la de Hai (Jos 8:3, 4). El v. 35 adelanta el total de ese día, 25.100 benjaminitas, y los vv. 36-41 vuelven sobre la maniobra y la señal de humo."}
    - {v: 42-46, type: narration, entities: [event:israel-persigue-a-los-benjaminitas-hasta-guidom, place:guibea-de-benjamin, place:guidom, place:penasco-de-rimon], note: "El desierto hacia el que huyen no tiene nombre en el texto. Las cifras de los vv. 44 y 45 suman 25.000, la cifra redonda del v. 46."}
