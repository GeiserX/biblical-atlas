    - {v: 13-26, type: narration, entities: [event:los-danitas-roban-los-idolos-de-miqueas, person:miqueas-de-efrain, person:jonatan-levita, place:region-montanosa-de-efrain, relation:jonatan-levita/lived_in/region-montanosa-de-efrain], mentions: [event:miqueas-hace-un-idolo-con-la-plata-de-su-madre], note: "Los danitas se llevan la imagen tallada, la de metal, el efod y los terafim. Los vecinos que persiguen a los danitas con Miqueas no tienen nombre."}
    - {v: 27-29, type: narration, entities: [event:los-danitas-toman-lesem, place:dan, place:bet-rehob, person:jonatan-levita, person:dan-hijo-de-jacob, relation:dan-hijo-de-jacob/kin/jacob], mentions: [place:sidon, person:jacob], note: "Israel, en el v. 29, es Jacob. Lais estaba lejos de Sidón y en la llanura de Bet-Rehob."}
    - {v: 30-31, type: narration, entities: [event:los-danitas-colocan-en-dan-la-imagen-de-miqueas, person:jonatan-levita, person:guersom-hijo-de-moises, relation:jonatan-levita/kin/guersom-hijo-de-moises, relation:jonatan-levita/kin/moises, relation:jonatan-levita/lived_in/dan, place:dan], mentions: [person:moises, person:miqueas-de-efrain, place:silo, event:israel-instala-la-tienda-de-reunion-en-silo, event:los-filisteos-capturan-el-arca], note: "Según Perspicacia «Jonatán», el destierro del v. 30 apunta a la captura del Arca por los filisteos (1Sa 4). La casa de Dios en Siló es el tabernáculo."}
  19:
