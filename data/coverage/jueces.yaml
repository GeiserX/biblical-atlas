    - {v: 12-16, type: narration, entities: [event:benjamin-se-niega-a-entregar-a-los-culpables-de-guibea, place:guibea-de-benjamin, place:benjamin], note: "Los benjaminitas son un pueblo, sin ficha. Sus honderos zurdos acertaban a un cabello."}
