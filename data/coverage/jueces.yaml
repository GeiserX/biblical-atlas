    - {v: 14-17, type: narration, entities: [event:sanson-mata-a-mil-filisteos-con-una-quijada, person:sanson, place:lehi], note: "Incluye el breve canto de Sansón sobre la quijada. La referencia marginal recuerda los 600 filisteos que abatió Samgar."}
    - {v: 18-19, type: narration, entities: [event:jehova-da-agua-a-sanson-en-lehi, person:sanson, place:lehi], note: "En-Hacore es la fuente de Lehí y va en los nombres de ese lugar."}
    - {v: "20", type: narration, entities: [person:sanson], note: "Resumen: Sansón juzga a Israel veinte años mientras dominan los filisteos. El final del capítulo 16 lo repite."}
  16:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:sanson-se-lleva-las-puertas-de-gaza, person:sanson, place:gaza, place:hebron, journey:sanson-en-gaza-y-sorec], note: "La prostituta de Gaza no tiene nombre y no es Dalila (Perspicacia «Dalila»). No se sabe qué monte frente a Hebrón era; Perspicacia «Gaza» da unos 60 km de distancia."}
    - {v: 4-20, type: narration, entities: [event:dalila-entrega-a-sanson-a-los-filisteos, person:dalila, person:sanson, place:valle-de-sorec, relation:dalila/lived_in/valle-de-sorec], note: "Los gobernantes filisteos no se nombran. Tres respuestas falsas (tendones frescos, sogas nuevas, trenzas en el telar) y la verdadera: es nazareo desde que nació (Nú 6:5; Jue 13:5). Jehová lo deja."}
    - {v: 21-22, type: narration, entities: [event:sanson-preso-en-gaza, event:dalila-entrega-a-sanson-a-los-filisteos, person:sanson, place:gaza], note: "Lo ciegan, lo bajan a Gaza y lo ponen a moler con grilletes de cobre. El pelo le vuelve a crecer."}
    - {v: 23-30, type: narration, entities: [event:muere-sanson, person:sanson, place:gaza, relation:sanson/died_in/gaza], note: "Dagón es el dios de los filisteos y no lleva ficha; su casa, en Gaza según Perspicacia, tenía unas 3.000 personas en la azotea. El muchacho que guía a Sansón no tiene nombre."}
    - {v: "31", type: narration, entities: [event:entierran-a-sanson, person:sanson, person:manoah, place:zora, place:estaol, relation:sanson/kin/manoah], note: "Sus hermanos y la familia de su padre no tienen nombre. El versículo cierra con sus 20 años como juez, como Jue 15:20."}
  17:
    status: complete
