    - {v: 15-21, type: narration, entities: [event:un-anciano-de-efrain-acoge-al-levita-en-guibea, place:guibea-de-benjamin, place:region-montanosa-de-efrain], note: "Los benjaminitas son un pueblo, sin ficha. La casa de Jehová del v. 18 no lleva lugar en el texto ni en sus notas."}
