# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: jueces
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:jehova-manda-subir-primero-a-juda], mentions: [person:josue-hijo-de-nun, event:muerte-de-josue, place:juda, place:simeon], note: "Judá y Simeón son aquí tribus, y los cananeos un pueblo, sin ficha. El texto no dice cómo consultaron a Jehová; la referencia remite a Nú 27:21."}
    - {v: 4-7, type: narration, entities: [event:juda-y-simeon-vencen-a-adoni-bezec, person:adoni-bezec, place:bezec, place:jerusalen, relation:adoni-bezec/lived_in/bezec, relation:adoni-bezec/died_in/jerusalen], note: "Cananeos y perizitas son pueblos, sin ficha. Los 70 reyes mutilados no llevan nombre."}
    - {v: "8", type: narration, entities: [event:juda-toma-y-quema-jerusalen, place:jerusalen]}
    - {v: 9-10, type: narration, entities: [event:caleb-echa-a-los-hijos-de-anac-de-hebron, place:hebron, person:sesai, person:ahiman-hijo-de-anac, person:talmai-hijo-de-anac, relation:sesai/lived_in/hebron, relation:ahiman-hijo-de-anac/lived_in/hebron, relation:talmai-hijo-de-anac/lived_in/hebron, journey:caleb-toma-hebron-y-debir], mentions: [place:negueb, place:sefela], note: "Judá baja contra los cananeos de la región montañosa, sin ficha propia, del Négueb y de la Sefelá. Hebrón se llamaba Quiryat-Arbá. El suceso de Hebrón es el de Jos 15:13, 14."}
    - {v: 11-13, type: narration, entities: [event:otniel-toma-debir-y-se-casa-con-acsa, place:debir, person:caleb-hijo-de-jefune, person:otniel, person:acsa, person:quenaz-padre-de-otniel, relation:otniel/kin/quenaz-padre-de-otniel, relation:otniel/kin/caleb-hijo-de-jefune, relation:otniel/kin/acsa, relation:acsa/kin/caleb-hijo-de-jefune, relation:quenaz-padre-de-otniel/kin/caleb-hijo-de-jefune], mentions: [event:josue-toma-debir], note: "Es la segunda toma de Debir, antes Quiryat-Séfer, tras la de Josué. Perspicacia «Debir», núm. 2, no decide si fue antes o después de su muerte: el suceso sigue con la fecha de Josué 15."}
    - {v: 14-15, type: narration, entities: [event:acsa-pide-a-caleb-gulot-maim, person:acsa, person:otniel, person:caleb-hijo-de-jefune, place:gulot-maim, place:negueb], note: "El terreno en el sur es el Négueb, según la nota; Gulot-Maim significa «cuencas de agua»."}
    - {v: "16", type: narration, entities: [event:los-quenitas-se-instalan-al-sur-de-arad, person:hobab, person:jetro, relation:moises/kin/jetro, place:jerico, place:desierto-de-juda, place:arad], mentions: [person:moises], note: "El texto no nombra al quenita: Perspicacia «Jetró» lo identifica con Jetró, y «Hobab» pone allí a la familia de Hobab. La ciudad de las palmeras es Jericó, según la nota."}
    - {v: "17", type: narration, entities: [event:juda-y-simeon-destruyen-zefat, place:horma], note: "Zefat es el nombre anterior de Hormá, que significa «una entrega a la destrucción», según la nota. Simeón es aquí la tribu."}
    - {v: 18-19, type: narration, entities: [event:juda-toma-gaza-asquelon-y-ecron, place:gaza, place:asquelon, place:ecron, event:las-tribus-no-expulsan-a-los-cananeos], note: "La región montañosa y la llanura no llevan nombre propio. Según la nota, los carros de hierro llevaban cuchillas en las ruedas."}
    - {v: "20", type: narration, entities: [event:caleb-echa-a-los-hijos-de-anac-de-hebron, person:caleb-hijo-de-jefune, place:hebron, relation:caleb-hijo-de-jefune/lived_in/hebron, relation:sesai/kin/anac, relation:ahiman-hijo-de-anac/kin/anac, relation:talmai-hijo-de-anac/kin/anac], mentions: [person:moises, person:anac], note: "Moisés había prometido Hebrón a Caleb (Nú 14:24; Jos 14:9). Los tres hijos de Anac son Sesái, Ahimán y Talmái."}
    - {v: "21", type: narration, entities: [event:las-tribus-no-expulsan-a-los-cananeos, place:jerusalen], note: "Los jebuseos, un pueblo, siguen en Jerusalén con los de Benjamín cuando se escribe el libro, antes de que David tomara la ciudad. Jos 15:63 dice lo mismo de Judá."}
    - {v: 22-25, type: narration, entities: [event:la-casa-de-jose-toma-betel, place:betel], note: "La casa de José son las tribus de Efraín y Manasés. Luz es el nombre antiguo de Betel. El hombre que les enseña la entrada no lleva nombre."}
    - {v: "26", type: narration, entities: [event:el-hombre-de-betel-funda-luz, place:luz-de-los-hititas], note: "Los hititas son un pueblo, sin ficha; su tierra no se sitúa aquí."}
    - {v: 27-28, type: list, entities: [event:las-tribus-no-expulsan-a-los-cananeos, place:bet-sean, place:taanac, place:dor, place:ibleam, place:meguido], note: "La tribu de Manasés deja a los cananeos en cinco ciudades con sus pueblos. Cuando Israel se hace más fuerte, los pone a trabajos forzados, pero no los echa del todo."}
    - {v: 29-30, type: list, entities: [event:las-tribus-no-expulsan-a-los-cananeos, place:guezer, place:catat, place:nahalal], note: "Efraín no echa a los de Guézer. Zabulón deja a los de Quitrón, que suele identificarse con Qatat, y Nahalol, otro nombre de Nahalal, y los pone a trabajos forzados."}
    - {v: 31-33, type: list, entities: [event:las-tribus-no-expulsan-a-los-cananeos, place:tolemaida, place:sidon, place:ahlab, place:aczib-de-aser, place:helba, place:afec-de-aser, place:rehob-de-aser, place:bet-semes-de-neftali, place:bet-anat], note: "Akkó es la posterior Tolemaida, y Afic, Afec de Aser. Aser vive entre los cananeos; Neftalí también, pero pone a trabajar a los de Bet-Semes y Bet-Anat."}
    - {v: 34-36, type: list, entities: [event:las-tribus-no-expulsan-a-los-cananeos, place:monte-heres, place:ayalon, place:saalbim, place:subida-de-acrabim, place:sela-de-los-amorreos], note: "Los amorreos, un pueblo, no dejan a Dan bajar a la llanura, y la casa de José los somete después. Su límite parte de la subida de Acrabim y de Sela hacia el norte."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [event:el-angel-de-jehova-reprende-a-israel-en-bokim, place:guilgal, place:bokim], mentions: [place:egipto, event:exodo, event:el-principe-del-ejercito-de-jehova-se-aparece-a-josue], note: "El ángel no lleva nombre; Perspicacia «Guilgal», núm. 1, ve posible que sea el que se apareció a Josué. La tierra jurada a los antepasados no se nombra."}
    - {v: 6-7, type: narration, entities: [event:josue-renueva-el-pacto-en-siquem, person:josue-hijo-de-nun], note: "Repite Jos 24:28 y 24:31: Josué despide al pueblo, cada uno va a su herencia, y todos sirven a Jehová mientras viven él y los ancianos que le sobreviven."}
    - {v: 8-9, type: narration, entities: [event:muerte-de-josue, person:josue-hijo-de-nun, place:timnat-serah, place:region-montanosa-de-efrain, place:monte-gaas, relation:josue-hijo-de-nun/kin/nun, relation:josue-hijo-de-nun/lived_in/timnat-serah], mentions: [person:nun], note: "Repite Jos 24:29, 30: muere a los 110 años. Timnat-Heres es otro nombre de Timnat-Sérah."}
    - {v: 10-13, type: narration, entities: [event:israel-abandona-a-jehova-y-sirve-a-los-baales], mentions: [place:egipto, event:exodo], note: "Baal, los Baales y Astoret son dioses, sin ficha. Ser reunido con los antepasados es, según la nota, una forma poética de decir morir."}
    - {v: 14-19, type: narration, entities: [event:israel-abandona-a-jehova-y-sirve-a-los-baales], note: "Ciclo de todo el libro: Jehová entrega a Israel a sus enemigos, se compadece de sus gemidos y le da jueces, que aquí no se nombran; al morir el juez, vuelve la idolatría."}
    - {v: 20-23, type: narration, entities: [event:jehova-deja-a-las-naciones-para-probar-a-israel], mentions: [person:josue-hijo-de-nun, event:muerte-de-josue], note: "Las naciones que quedan no se nombran aquí; las enumera Jue 3:1-6."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: narration, entities: [place:baal-hermon, event:jehova-deja-a-las-naciones-para-probar-a-israel], mentions: [place:canaan, place:filistea, place:sidon, place:libano, place:lebo-hamat, person:moises], note: "Jehová deja naciones para probar a la generación que no conoció la guerra. Filisteos, sidonios, cananeos, heveos, hititas, amorreos, perizitas y jebuseos son pueblos sin ficha. Israel se casa con ellos y sirve a sus dioses."}
    - {v: 7-11, type: narration, entities: [event:otniel-libra-a-israel-de-cusan-risataim, person:otniel, person:cusan-risataim, person:quenaz-padre-de-otniel, place:mesopotamia, relation:cusan-risataim/lived_in/mesopotamia, relation:otniel/kin/quenaz-padre-de-otniel, relation:otniel/kin/caleb-hijo-de-jefune, relation:quenaz-padre-de-otniel/kin/caleb-hijo-de-jefune], mentions: [person:caleb-hijo-de-jefune], note: "Los Baales y los postes sagrados son cultos sin ficha. La muerte de Otniel, tras cuarenta años de paz, no tiene escena ni lugar."}
    - {v: 12-14, type: narration, entities: [event:eglon-toma-la-ciudad-de-las-palmeras, person:eglon, place:jerico, relation:eglon/lived_in/moab, journey:ehud-libra-a-israel-de-moab], mentions: [place:moab, place:ammon, place:amalec], note: "La ciudad de las palmeras es Jericó, según la referencia del v. 13. Ammonitas y amalequitas son pueblos; van sus tierras."}
    - {v: 15-25, type: narration, entities: [event:ehud-mata-a-eglon, person:ehud-hijo-de-guera, person:guera-padre-de-ehud, person:eglon, place:jerico, place:guilgal, relation:ehud-hijo-de-guera/kin/guera-padre-de-ehud, relation:ehud-hijo-de-guera/kin/benjamin-hijo-de-jacob, relation:eglon/lived_in/jerico, relation:eglon/died_in/jerico], mentions: [place:moab], note: "Las imágenes talladas de Guilgal quizá eran canteras (nota del v. 19). El texto no nombra la ciudad del palacio; La Atalaya de 1997 la da como Jericó."}
    - {v: 26-30, type: narration, entities: [event:ehud-vence-a-moab-en-los-vados-del-jordan, person:ehud-hijo-de-guera, place:seira, place:region-montanosa-de-efrain, place:rio-jordan], mentions: [place:guilgal, place:moab]}
    - {v: "31", type: narration, entities: [event:samgar-mata-a-600-filisteos, person:samgar, person:anat, relation:samgar/kin/anat, relation:samgar/succeeds/ehud-hijo-de-guera], mentions: [person:ehud-hijo-de-guera, place:filistea], note: "Los filisteos son un pueblo; su tierra va en menciona."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:jabin-oprime-a-israel, person:jabin-rey-de-canaan, person:sisara-de-haroset, place:hazor, place:haroset, relation:jabin-rey-de-canaan/lived_in/hazor, relation:sisara-de-haroset/lived_in/haroset, relation:sisara-de-haroset/accompanies/jabin-rey-de-canaan, journey:huida-de-sisara], mentions: [person:ehud-hijo-de-guera, place:canaan], note: "Muerto Ehúd, Jehová entrega Israel a Jabín veinte años. Es un suceso, como las opresiones de Moab (3:12-14), Madián (6:1-6) y Ammón (10:6-9)."}
    - {v: 4-10, type: narration, entities: [event:debora-manda-llamar-a-barac, event:barac-reune-diez-mil-hombres-en-quedes, person:debora-profetisa, person:lapidot, person:barac, person:abinoam, place:region-montanosa-de-efrain, place:quedes-de-neftali, relation:lapidot/kin/debora-profetisa, relation:debora-profetisa/lived_in/region-montanosa-de-efrain, relation:barac/kin/abinoam, relation:barac/lived_in/quedes-de-neftali, relation:barac/accompanies/debora-profetisa, relation:abinoam/kin/neftali-hijo-de-jacob, relation:abinoam/lived_in/quedes-de-neftali, relation:debora-profetisa/holds_office/-, journey:barac-contra-sisara], mentions: [place:rama-de-benjamin, place:betel, place:monte-tabor, place:cison, person:sisara-de-haroset, person:jabin-rey-de-canaan], note: "La palmera de Débora no tiene punto propio: queda aquí. Zabulón y Neftalí son tribus, sin ficha como pueblo."}
    - {v: "11", type: narration, entities: [person:heber-el-quenita, person:hobab, place:zaananim, relation:heber-el-quenita/kin/hobab, relation:heber-el-quenita/lived_in/zaananim], mentions: [person:moises, place:quedes-de-neftali, place:quision], note: "Los quenitas son un pueblo. Perspicacia «Quedes», núm. 3, y «Zaananim» ven posible que esta Quedes sea la de Isacar, cerca de Meguidó, y no la de Neftalí."}
    - {v: 12-16, type: narration, entities: [event:barac-derrota-a-sisara-junto-al-cison, person:barac, person:sisara-de-haroset, person:debora-profetisa, place:monte-tabor, place:cison, place:haroset], mentions: [place:en-dor], note: "Jueces no nombra En-Dor: va en el suceso porque Sl 83:9, 10 liga allí la derrota de Sísara, y Perspicacia «En-dor» cree que la lucha llegó hasta ella, al sur del Tabor."}
    - {v: 17-22, type: narration, entities: [event:jael-mata-a-sisara, person:jael, person:sisara-de-haroset, person:heber-el-quenita, person:barac, place:zaananim, relation:heber-el-quenita/kin/jael, relation:jael/lived_in/zaananim, relation:sisara-de-haroset/died_in/zaananim], mentions: [person:jabin-rey-de-canaan, place:hazor]}
    - {v: 23-24, type: narration, entities: [event:israel-acaba-con-jabin, person:jabin-rey-de-canaan], mentions: [place:canaan]}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:debora-y-barac-cantan-su-victoria, person:debora-profetisa, person:barac, person:abinoam, relation:barac/kin/abinoam, relation:barac/accompanies/debora-profetisa], note: "Aquel día, el de la victoria sobre Sísara (Jue 4), Débora canta con Barac. Perspicacia «Débora»: la primera persona del v. 7 muestra que ella compuso el canto, al menos en parte."}
    - {v: 2-5, type: poetry, entities: [event:debora-y-barac-cantan-su-victoria], mentions: [place:seir, place:edom, place:monte-sinai, event:jehova-desciende-sobre-el-monte-sinai], note: "Alabanza a Jehová por los voluntarios. Jehová sale de Seír, en Edom, y la tierra tiembla; los montes y el Sinaí se estremecen ante él (referencias a Dt 33:2 y Éx 19:18)."}
    - {v: 6-8, type: poetry, entities: [event:debora-y-barac-cantan-su-victoria, person:samgar, person:anat, relation:samgar/kin/anat, person:jael, person:debora-profetisa], note: "En días de Samgar y de Jael nadie iba por los caminos y los campesinos desaparecieron hasta que Débora se alzó como madre de Israel. Eligieron dioses nuevos; ni escudo ni lanza entre 40.000. La opresión es de Jue 4:1-3."}
    - {v: 9-11, type: poetry, entities: [event:debora-y-barac-cantan-su-victoria], note: "Débora está con los comandantes que se ofrecieron. Invita a los que montan burros pardos y a los que caminan a pensar en los actos justos de Jehová, que se cuentan junto a los abrevaderos."}
    - {v: 12-18, type: poetry, entities: [event:debora-y-barac-cantan-su-victoria, person:debora-profetisa, person:barac, person:abinoam, relation:barac/kin/abinoam, relation:barac/accompanies/debora-profetisa], mentions: [place:galaad, place:rio-jordan, place:territorio-de-dan, place:aser, event:barac-reune-diez-mil-hombres-en-quedes], note: "Tribus como pueblos, sin ficha: Efraín, Benjamín, Makir (toda Manasés, según Perspicacia «Makir»), Zabulón, Isacar y Neftalí luchan; Rubén duda. Galaad, Dan y Aser van como lugar: el texto los sitúa en su tierra."}
    - {v: 19-22, type: poetry, entities: [event:debora-y-barac-cantan-su-victoria, place:taanac, place:meguido, place:cison, person:sisara-de-haroset, event:barac-derrota-a-sisara-junto-al-cison, journey:barac-contra-sisara], mentions: [place:canaan, person:jabin-rey-de-canaan], note: "Los reyes de Canaán combaten en Taanac, cerca de las aguas de Meguidó, y no sacan botín. Las estrellas pelean contra Sísara y el Cisón arrastra al enemigo. La batalla es un suceso de Jue 4:12-16."}
    - {v: "23", type: poetry, entities: [event:debora-y-barac-cantan-su-victoria, event:el-angel-de-jehova-maldice-a-meroz, place:meroz], note: "El ángel de Jehová no tiene nombre ni ficha."}
    - {v: 24-27, type: poetry, entities: [event:debora-y-barac-cantan-su-victoria, person:jael, person:heber-el-quenita, person:sisara-de-haroset, relation:heber-el-quenita/kin/jael, event:jael-mata-a-sisara], note: "Elogio de Jael: le da leche cuajada a Sísara y lo mata con la estaca y el martillo. Ese suceso es de Jue 4:17-22."}
    - {v: 28-30, type: poetry, entities: [event:debora-y-barac-cantan-su-victoria, person:sisara-de-haroset], note: "La madre de Sísara, sin nombre y sin ficha, espera en la ventana su carro, y sus damas le dicen que se reparten el botín."}
    - {v: "31", type: poetry, entities: [event:debora-y-barac-cantan-su-victoria], note: "Que perezcan los enemigos de Jehová y brillen como el sol los que lo aman. Después la tierra tiene paz 40 años."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: narration, entities: [event:madian-oprime-a-israel, place:israel, place:gaza], mentions: [place:madian, place:amalec, person:zebah, person:zalmuna], note: "Con Madián vienen amalequitas y orientales, pueblos sin ficha. Perspicacia «Zébah» cree que él y Zalmuná reinaban en Madián esos siete años. La nota del 6:2 da «graneros subterráneos» por escondites."}
    - {v: 7-10, type: narration, entities: [event:jehova-envia-un-profeta-a-israel-oprimido-por-madian, place:israel], mentions: [place:egipto], note: "El profeta no tiene nombre. Recuerda la salida de Egipto y el reparto de la tierra; los amorreos, cuyos dioses temió Israel, son un pueblo sin ficha."}
    - {v: 11-24, type: narration, entities: [event:el-angel-de-jehova-comisiona-a-gedeon, person:gedeon, person:joas-padre-de-gedeon, place:ofra-de-gedeon, relation:gedeon/kin/joas-padre-de-gedeon, relation:gedeon/kin/abi-ezer-hijo-de-galaad, relation:gedeon/lived_in/ofra-de-gedeon, relation:joas-padre-de-gedeon/kin/abi-ezer-hijo-de-galaad, relation:joas-padre-de-gedeon/lived_in/ofra-de-gedeon, journey:campana-de-gedeon], mentions: [person:abi-ezer-hijo-de-galaad, place:manases, place:egipto, place:madian], note: "El ángel de Jehová no tiene nombre. Gedeón dice que su clan es el menor de Manasés. Ofrece un cabrito y panes de un efá de harina, unos 22 litros. El altar Jehová-Salom va en los nombres de Ofrá."}
    - {v: 25-32, type: narration, entities: [event:gedeon-derriba-el-altar-de-baal, person:gedeon, person:joas-padre-de-gedeon, place:ofra-de-gedeon], note: "Baal es un dios y no lleva ficha. Gedeón quema el segundo toro de su padre con la madera del poste sagrado. Jerubaal, su nuevo nombre, pide que Baal defienda su propia causa."}
    - {v: 33-35, type: narration, entities: [event:gedeon-convoca-a-las-tribus-contra-madian, person:gedeon, place:valle-de-jezreel, place:manases, place:aser, place:zabulon, place:neftali], mentions: [place:madian, place:amalec, person:abi-ezer-hijo-de-galaad], note: "Los invasores cruzan «el río», sin nombre. Los abí-ezritas, familia de Gedeón, lo siguen primero. Manasés, Aser, Zabulón y Neftalí van como lugar porque los mensajeros recorren esos territorios."}
    - {v: 36-40, type: narration, entities: [event:gedeon-pide-la-senal-del-vellon, person:gedeon], mentions: [place:israel], note: "No se dice dónde estaba la era. Perspicacia «Gedeón» ve en las dos pruebas cautela y no falta de fe, porque Dios no se la reprocha."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: narration, entities: [event:jehova-reduce-el-ejercito-de-gedeon-a-300, person:gedeon, place:harod, place:colina-de-more, place:valle-de-jezreel, journey:campana-de-gedeon], mentions: [place:madian], note: "Jerubaal es Gedeón. La nota del v. 1 da «llanura baja». Quedan los 300 que beben lamiendo con la mano, y se quedan con las provisiones y los cuernos de los que se van."}
    - {v: 9-15, type: narration, entities: [event:gedeon-y-pura-oyen-el-sueno-del-pan-de-cebada, person:gedeon, person:pura, relation:pura/accompanies/gedeon, place:valle-de-jezreel], mentions: [place:madian, place:amalec, person:joas-padre-de-gedeon], note: "Los dos madianitas del sueño no tienen nombre. El que lo explica llama a Gedeón hijo de Joás. Los orientales vuelven a nombrarse junto a amalequitas y madianitas."}
