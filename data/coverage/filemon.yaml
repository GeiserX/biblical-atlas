chapters:
  1:
    status: complete
    reviewed_on: 2026-10-15
    note: "Carta de Pablo, preso en Roma, a Filemón de Colosas sobre su esclavo Onésimo, ya cristiano."
    spans:
    - {v: 1-3, type: letter, entities: [letter:filemon, event:pablo-escribe-filemon, person:pablo, relation:pablo/lived_in/roma@59, person:timoteo, relation:timoteo/accompanies/pablo, relation:timoteo/lived_in/roma, person:filemon, relation:filemon/accompanies/pablo, relation:filemon/lived_in/colosas, person:apfia, relation:apfia/lived_in/colosas, relation:filemon/kin/apfia, person:arquipo, relation:arquipo/lived_in/colosas, relation:arquipo/kin/filemon, relation:arquipo/accompanies/pablo], mentions: [person:jesus, place:roma, place:colosas, place:asia, event:pablo-predica-dos-anos-en-roma], note: "Pablo, preso por Cristo, y Timoteo saludan a Filemón, colaborador amado, a la hermana Apfia, a Arquipo, compañero de armas, y a la congregación de su casa. Las notas ponen la carta en el primer encierro romano."}
    - {v: 4-7, type: letter, entities: [person:filemon], mentions: [person:jesus, person:pablo], note: "Pablo da gracias a Dios por la fe y el amor de Filemón, que han reanimado a los santos, y pide que esa fe compartida lo mueva a reconocer lo bueno que tienen por Cristo."}
    - {v: 8-12, type: letter, entities: [person:pablo, person:onesimo, relation:onesimo/accompanies/pablo, event:onesimo-se-hace-cristiano-en-roma, journey:huida-de-onesimo, event:pablo-envia-a-tiquico-a-efeso-y-colosas, journey:tiquico-lleva-las-cartas-a-asia, event:pablo-escribe-filemon], mentions: [person:jesus, person:filemon, place:roma, place:colosas], note: "Pablo, ya mayor y preso, prefiere rogar a mandar: pide por Onésimo, su hijo en la fe desde la prisión, antes inútil y ahora útil, y se lo devuelve. Las notas lo dan huido a Roma."}
    - {v: 13-16, type: letter, entities: [person:onesimo, relation:onesimo/tie/filemon, event:onesimo-se-hace-cristiano-en-roma, person:filemon], mentions: [person:pablo, person:jesus], note: "Pablo querría tenerlo a su servicio en la prisión, pero no sin el permiso de Filemón. Quizás se alejó un tiempo para volver para siempre, no como esclavo, sino como hermano querido."}
    - {v: 17-21, type: letter, entities: [relation:pablo/tie/filemon, person:filemon, event:pablo-escribe-filemon], mentions: [person:pablo, person:onesimo, place:efeso, event:escuela-de-tirano], note: "Que lo reciba como a Pablo; si le debe algo, Pablo, que escribe de su puño, lo pagará, aunque Filemón le debe la vida. La nota ve posible que lo conociera en Éfeso (Hch 19:10)."}
    - {v: "22", type: letter, entities: [event:pablo-queda-libre, event:pablo-escribe-filemon], mentions: [person:pablo, person:filemon, place:colosas], note: "Pablo le pide que le prepare alojamiento, porque espera ser liberado gracias a sus oraciones. Perspicacia «Filemón» ve en esto la hospitalidad de Filemón."}
    - {v: 23-25, type: letter, entities: [person:epafras, relation:epafras/accompanies/pablo, relation:epafras/lived_in/roma, journey:epafras-a-roma, person:juan-marcos, relation:juan-marcos/accompanies/pablo@60, person:aristarco, relation:aristarco/accompanies/pablo@58, person:demas, relation:demas/accompanies/pablo, journey:demas-se-va-a-tesalonica, person:lucas, relation:lucas/accompanies/pablo@56, event:pablo-escribe-filemon], mentions: [person:jesus, person:pablo, place:roma, place:colosas], note: "Saludan Epafras, compañero de prisión de Pablo, y sus colaboradores Marcos, Aristarco, Demas y Lucas. Pablo desea la bondad inmerecida de Cristo al espíritu de todos ellos."}
