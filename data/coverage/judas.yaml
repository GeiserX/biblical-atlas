# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: judas
chapters:
  1:
    status: complete
    reviewed_on: 2026-10-14
    note: "Judas pide luchar por la fe frente a hombres irreverentes que se han colado. Recuerda juicios de Dios, la discusión de Miguel por el cuerpo de Moisés, a Caín, Balaam y Coré, y la profecía de Enoc."
    spans:
    - {v: 1-2, type: letter, entities: [letter:judas, event:judas-escribe-judas, person:judas-hermano-de-jesus, person:santiago-hermano-de-jesus, relation:santiago-hermano-de-jesus/kin/judas-hermano-de-jesus], mentions: [person:jesus], note: "Judas, que se presenta como hermano de Santiago y esclavo de Jesucristo, escribe a los llamados, a quienes Dios ama y guarda para Jesucristo, y les desea más misericordia, paz y amor. La carta no dice desde dónde escribe."}
    - {v: 3-4, type: letter, entities: [event:judas-escribe-judas, letter:judas], mentions: [person:jesus], note: "Quería escribir sobre la salvación común, pero ve preciso pedirles que luchen por la fe: se han colado hombres irreverentes que usan el favor de Dios como pretexto para el libertinaje y traicionan a Jesucristo."}
    - {v: 5-7, type: letter, entities: [event:exodo, event:jehova-condena-a-israel-a-40-anos-en-el-desierto, event:angeles-toman-esposas, event:destruccion-de-sodoma-y-gomorra], mentions: [place:egipto, place:sodoma, place:gomorra, event:angeles-en-casa-de-lot], note: "Tres juicios: Jehová sacó a Israel de Egipto y luego destruyó a los que no creyeron; tiene encadenados a los ángeles que dejaron su sitio (Gé 6, según Perspicacia «Tártaro»); y Sodoma, Gomorra y sus vecinas quedan como aviso."}
    - {v: 8-10, type: letter, entities: [event:miguel-discute-con-el-diablo-por-el-cuerpo-de-moises, person:jesus, person:satanas, person:moises], mentions: [event:muerte-de-moises], note: "Esos hombres desprecian la autoridad e insultan a los gloriosos. Miguel el arcángel, que es Jesús según Perspicacia «Miguel», núm. 1, discutió con el Diablo por el cuerpo de Moisés sin insultarlo: dejó que Jehová lo reprendiera."}
    - {v: "11", type: letter, entities: [person:cain, person:balaam, person:core-hijo-de-izhar, event:muerte-de-core, event:rebelion-de-core], mentions: [event:ofrendas-de-cain-y-abel, event:cain-mata-a-abel, event:la-burra-de-balaam-habla, event:balaam-va-con-los-principes-de-balac], note: "Siguen el camino de Caín, corren tras el error de Balaam por la paga y perecen por su rebeldía, como Coré. Para Perspicacia, ese camino es cómo reaccionó Caín al ver rechazada su ofrenda; el error, la codicia de Balaam."}
    - {v: 12-13, type: letter, note: "Son rocas ocultas en los banquetes de hermandad, pastores que solo se cuidan a sí mismos, nubes sin agua, árboles sin fruto arrancados, olas que echan espuma de vergüenza y estrellas errantes destinadas a la oscuridad."}
    - {v: 14-16, type: letter, entities: [person:enoc-hijo-de-jared, event:enoc-anuncia-el-juicio-de-jehova, relation:enoc-hijo-de-jared/kin/adan, relation:enoc-hijo-de-jared/holds_office/-], mentions: [person:adan, event:dios-toma-a-enoc], note: "Enoc, séptimo desde Adán, anunció que Jehová vendría con miríadas de santos a juzgar a los irreverentes. Estos hombres se quejan de su suerte, viven para sus deseos, hablan con arrogancia y adulan por interés."}
    - {v: 17-19, type: letter, entities: [person:judas-hermano-de-jesus], mentions: [person:jesus], note: "Que recuerden lo que repetían los apóstoles: al final habría burlones guiados por sus deseos. Judas habla de los apóstoles como de otros, y Perspicacia cree que cita 2Pe 3:3. Dividen y no tienen espiritualidad."}
    - {v: 20-25, type: letter, mentions: [person:jesus], note: "Que se edifiquen en la fe, oren con espíritu santo y sigan en el amor de Dios esperando la misericordia de Jesucristo, y que saquen del fuego a los que dudan. Cierra alabando a Dios por medio de Jesucristo."}
