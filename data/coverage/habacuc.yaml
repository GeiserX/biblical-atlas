# biblical-earth: cobertura de un libro. Formato en data/coverage/README.md.
book: habacuc
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: prophecy, entities: [person:habacuc, event:habacuc-profetiza-contra-juda-y-babilonia, relation:habacuc/lived_in/juda], mentions: [place:juda, period:jehoiaquim, event:batalla-de-carquemis], note: "Encabezamiento: declaración que Habacuc recibió en visión. Según la nota al pie, su nombre quizá signifique «abrazo ardiente». Perspicacia pone la profecía al comienzo del reinado de Jehoiaquim, antes de la batalla de Carquemis."}
    - {v: 2-4, type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia, person:habacuc], mentions: [place:juda, person:jehoiaquim], note: "El profeta pregunta hasta cuándo tendrá que clamar: ve violencia, peleas y opresión, la ley no sirve y los malvados tuercen la justicia. La Atalaya de 2000 lo sitúa en la Judá injusta del rey Jehoiaquim."}
    - {v: "5", type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia], mentions: [event:destruccion-de-jerusalen-607, event:destruccion-de-jerusalen-70, place:jerusalen, event:discurso-en-antioquia-de-pisidia], note: "Jehová anuncia algo increíble. La Atalaya lo ve cumplido cuando Babilonia arrasó Jerusalén en 607 a.e.c., y de nuevo con Roma en 70 e.c.; Pablo cita este versículo en Antioquía de Pisidia (Hch 13:40, 41)."}
    - {v: 6-11, type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia], mentions: [place:caldea, period:potencia-babilonica, event:destruccion-de-jerusalen-607], note: "Jehová levantará a los caldeos, un pueblo cruel y veloz: caballos más rápidos que leopardos, cautivos como arena, burla de reyes y fortalezas tomadas con rampas. Atribuyen su poder a su dios, que no se nombra."}
    - {v: 12-17, type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia, person:habacuc], mentions: [place:caldea], note: "Habacuc reconoce que Jehová es eterno y santo, y le pregunta por qué calla mientras el malvado devora al justo. La nota del v. 15 aclara que quien atrapa a la gente con su red es el enemigo caldeo."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: prophecy, entities: [person:habacuc, event:habacuc-profetiza-contra-juda-y-babilonia], mentions: [event:destruccion-de-jerusalen-607], note: "Habacuc se queda en su puesto de guardia a la espera de la respuesta. Jehová le manda escribir la visión en tablillas: llegará a su tiempo sin falta. La Atalaya de 2007 la ve cumplida en 607 a.e.c."}
    - {v: 4-5, type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia], mentions: [period:potencia-babilonica, period:potencia-medopersa, event:caida-de-babilonia], note: "El justo vivirá por su fidelidad, frase que citan Ro 1:17, Gál 3:11 y Heb 10:38. El soberbio, insaciable como la Tumba, es para La Atalaya de 2007 el imperio babilónico, que Jehová derribaría con medos y persas."}
    - {v: 6-8, type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia], mentions: [event:caida-de-babilonia, place:babilonia], note: "Primer ay: contra quien acumula lo ajeno. Los pueblos que saqueó lo saquearán por la sangre derramada. «Toda Escritura» recuerda que Babilonia cayó ante medos y persas en 539 a.e.c."}
    - {v: 9-11, type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia], note: "Segundo ay: contra quien enriquece su casa con ganancias injustas para ponerla a salvo en lo alto. Destruir pueblos lo avergüenza, y hasta las piedras del muro y las vigas lo acusan."}
    - {v: 12-14, type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia], note: "Tercer ay: contra quien levanta una ciudad con sangre e injusticia. Jehová de los ejércitos hace que ese trabajo acabe en el fuego, y la tierra se llenará del conocimiento de su gloria."}
    - {v: 15-17, type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia, place:libano], mentions: [place:jerusalen], note: "Cuarto ay: contra quien emborracha a otros para verlos desnudos; beberá la copa de Jehová. La violencia contra el Líbano, dice Perspicacia, puede ser la que esperaba a Jerusalén o la tala de sus bosques en la guerra."}
    - {v: 18-20, type: prophecy, entities: [event:habacuc-profetiza-contra-juda-y-babilonia], mentions: [place:jerusalen], note: "Quinto ay: contra quien pide a un ídolo de madera o de piedra que despierte y enseñe. Frente a esos dioses mudos, Jehová está en su santo templo, que La Atalaya de 2000 entiende como el de Jerusalén."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: poetry, entities: [person:habacuc, event:habacuc-profetiza-contra-juda-y-babilonia], mentions: [place:mar-rojo, place:jerico, event:israel-cruza-el-mar-rojo, event:caida-de-jerico], note: "Oración de Habacuc en canciones de duelo, o endechas, según la nota. Pide a Jehová que renueve sus obras y sea misericordioso. La Atalaya (2000, 2007) une lo que oyó al mar Rojo, el desierto y Jericó."}
    - {v: 3-6, type: poetry, entities: [event:habacuc-profetiza-contra-juda-y-babilonia, place:teman, place:desierto-de-paran], mentions: [place:edom, person:moises, event:israel-pasa-junto-a-seir, event:israel-adora-al-baal-de-peor], note: "Dios llega desde Temán y el monte Parán, en la ruta de Israel en días de Moisés; Perspicacia piensa en su paso junto a Edom. La peste que lo precede evoca, según La Atalaya, la plaga de Nú 25."}
    - {v: "7", type: poetry, entities: [event:habacuc-profetiza-contra-juda-y-babilonia, place:cusan, place:madian], note: "Tiemblan las tiendas de Cusán y de la tierra de Madián. Perspicacia dice que Cusán, en paralelo con Madián, es otro nombre suyo o un país vecino, y que los madianitas eran nómadas que vivían en tiendas."}
    - {v: 8-11, type: poetry, entities: [event:habacuc-profetiza-contra-juda-y-babilonia], mentions: [place:mar-rojo, place:rio-jordan, event:israel-cruza-el-mar-rojo, event:entrada-en-canaan, event:el-sol-se-detiene-sobre-gabaon, event:barac-derrota-a-sisara-junto-al-cison, person:josue-hijo-de-nun, person:debora-profetisa, person:sisara-de-haroset], note: "Jehová, guerrero en carro, domina ríos, mar y montes; el sol y la luna se paran. La Atalaya de 2000 recuerda el mar Rojo, el Jordán crecido, la lluvia contra Sísara en días de Débora y el sol de Josué."}
    - {v: 12-15, type: poetry, entities: [event:habacuc-profetiza-contra-juda-y-babilonia], note: "Jehová pisotea a las naciones con furia y sale a salvar a su pueblo y a su ungido; aplasta al jefe de la casa del malvado. La Atalaya de 2000 lo aplica a la guerra de Armagedón."}
    - {v: 16-19, type: poetry, entities: [person:habacuc, event:habacuc-profetiza-contra-juda-y-babilonia], note: "Habacuc tiembla al oír el mensaje, pero esperará tranquilo el día de angustia. Aunque falten higos, uvas, aceitunas y ganado, se alegrará en Jehová, su fuerza. La línea final se dirige al director, con sus instrumentos de cuerda."}
