    - {v: 29-34, type: narration, entities: [person:salomon, person:etan-el-ezrahita, person:heman-el-ezrahita, person:calcol, person:darda, person:mahol, relation:calcol/kin/mahol, relation:darda/kin/mahol, relation:heman-el-ezrahita/kin/mahol, relation:etan-el-ezrahita/kin/zerah-hijo-de-juda, relation:heman-el-ezrahita/kin/zerah-hijo-de-juda], mentions: [place:egipto, place:libano, person:zerah-hijo-de-juda], note: "La sabiduría de Salomón supera la de los orientales y la de Egipto. Es autor de 3.000 proverbios y de 1.005 canciones, habló de plantas y animales, y venían reyes de toda la tierra a escucharle."}
  5:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-6, type: narration, entities: [event:hiram-y-salomon-pactan-la-madera-del-templo, person:hiram-rey-de-tiro, person:salomon, person:david, place:tiro, place:libano, relation:hiram-rey-de-tiro/tie/david, relation:hiram-rey-de-tiro/lived_in/tiro, relation:hiram-rey-de-tiro/holds_office/tiro, relation:salomon/succeeds/david, relation:salomon/kin/david], mentions: [event:david-quiere-construir-una-casa-para-jehova, event:pacto-con-david, place:sidon], note: "Las guerras impidieron a David construir la casa; Salomón, ya en paz, la levantará como Jehová se lo prometió a David. Pide taladores de Hiram, porque nadie corta árboles como los sidonios, que son un pueblo."}
    - {v: 7-12, type: narration, entities: [event:hiram-y-salomon-pactan-la-madera-del-templo, person:hiram-rey-de-tiro, person:salomon, place:libano, relation:hiram-rey-de-tiro/tie/salomon], mentions: [person:david, event:jehova-se-aparece-a-salomon-en-gabaon], note: "Hiram alaba a Jehová por el hijo sabio de David. Cedro y enebro bajan del Líbano en balsas; cada año recibe 20.000 coros de trigo y 20 de aceite. La sabiduría es la prometida en el sueño de Gabaón."}
    - {v: 13-18, type: narration, entities: [event:salomon-recluta-trabajadores-para-el-templo, person:salomon, person:adoniram, place:libano, place:guebal, relation:adoniram/tie/salomon], mentions: [person:hiram-rey-de-tiro], note: "Un mes en el Líbano y dos en casa. Los 70.000 cargadores y 80.000 picapedreros no eran israelitas (Perspicacia «Salomón»); 3.300 comisarios dirigían. Para los cimientos se sacan de la cantera piedras grandes y labradas."}
  6:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: "1", type: narration, entities: [event:templo-de-salomon-empieza, person:salomon, period:salomon], mentions: [event:exodo, place:egipto, place:israel], note: "El año 480 desde la salida de Egipto es el cuarto de Salomón, 1034 a.e.c.; de ahí fecha el estudio 3 el éxodo en 1513. Ziv es el segundo mes."}
    - {v: 2-10, type: narration, entities: [event:salomon-levanta-y-adorna-el-templo, person:salomon, place:monte-moria], mentions: [place:jerusalen], note: "Medidas de la casa y del pórtico, ventanas de marco estrecho y tres plantas de cuartos laterales con escalera de caracol. Las piedras llegaban ya labradas y no sonaron herramientas de hierro. Techo de cedro."}
    - {v: 11-13, type: narration, entities: [event:jehova-promete-a-salomon-no-abandonar-a-israel, person:salomon, relation:salomon/kin/david], mentions: [person:david, event:pacto-con-david], note: "La promesa a David es la del pacto del reino (2Sa 7:13). Israel es aquí el pueblo."}
    - {v: 14-22, type: narration, entities: [event:salomon-levanta-y-adorna-el-templo, person:salomon], note: "Paredes de cedro tallado con calabazas y flores y suelo de enebro. Al fondo, el Santísimo, un cubo de 20 codos para el arca del pacto; delante, el Santo, de 40. Todo revestido de oro, también el altar."}
    - {v: 23-28, type: narration, entities: [event:salomon-levanta-y-adorna-el-templo, person:salomon], note: "En el Santísimo, dos querubines de pino de 10 codos de alto y de ala a ala, revestidos de oro; sus alas tocan las dos paredes y se juntan en el centro."}
    - {v: 29-36, type: narration, entities: [event:salomon-levanta-y-adorna-el-templo, person:salomon], note: "Querubines, palmeras y flores talladas en paredes y puertas, cubiertas de oro. Puertas de pino para el Santísimo y de enebro, de dos hojas, para el Santo. Patio interior con tres hileras de piedra y una de cedro."}
    - {v: 37-38, type: narration, entities: [event:templo-de-salomon-empieza, event:templo-de-salomon-terminado, person:salomon], note: "Cimientos en ziv del año cuarto; casa acabada en bul, el octavo mes, del año 11. El texto redondea en siete años; Perspicacia cuenta siete y medio."}
  7:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-12, type: narration, entities: [event:salomon-construye-su-palacio, person:salomon, place:monte-moria], note: "Palacio, Casa del Bosque del Líbano, Sala de las Columnas y Sala del Trono, de cedro y piedra labrada. La hija del faraón, esposa de Salomón, no tiene nombre ni ficha."}
    - {v: 13-14, type: narration, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo, person:hiram-artesano, place:tiro, relation:hiram-artesano/lived_in/tiro, relation:hiram-artesano/tie/salomon, person:salomon], note: "Su madre, viuda de la tribu de Neftalí, y su padre, un tirio que trabajaba el cobre, no tienen nombre. La tribu es el pueblo, sin ficha."}
    - {v: 15-22, type: narration, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo], note: "Las dos columnas de cobre del pórtico, Jakín a la derecha y Boaz a la izquierda, con sus capiteles, mallas y granadas. Son objetos, sin ficha."}
    - {v: 23-26, type: narration, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo], note: "El Mar de metal fundido, redondo, sobre doce toros, con capacidad para 2.000 batos."}
