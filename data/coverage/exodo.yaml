    - {v: 10-17, type: narration, entities: [event:moises-ante-la-zarza-ardiente, person:moises, person:aaron, relation:moises/kin/aaron], note: "Moisés dice que le cuesta hablar; Jehová se enoja y le da a Aarón el levita como portavoz. Moisés será para él como Dios."}
