    - {v: 6-14, type: law, mentions: [person:jacob], note: "El efod, con dos piedras de ónice en los hombros que llevan grabados los nombres de los doce hijos de Israel, seis en cada una."}
    - {v: 15-30, type: law, note: "El pectoral de juicio con doce piedras, una por tribu, y dentro el Urim y el Tumim, sobre el corazón de Aarón."}
