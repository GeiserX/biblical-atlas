    - {v: 1-4, type: narration, entities: [event:nacimiento-de-moises, person:moises, person:amram-hijo-de-cohat, person:jokebed, person:miriam-hermana-de-moises, place:rio-nilo, relation:amram-hijo-de-cohat/kin/jokebed, relation:amram-hijo-de-cohat/kin/levi-hijo-de-jacob, relation:amram-hijo-de-cohat/lived_in/egipto, relation:jokebed/kin/levi-hijo-de-jacob, relation:jokebed/lived_in/egipto, relation:moises/kin/amram-hijo-de-cohat, relation:moises/kin/jokebed, relation:moises/born_in/egipto, relation:miriam-hermana-de-moises/kin/moises, relation:miriam-hermana-de-moises/kin/amram-hijo-de-cohat, relation:miriam-hermana-de-moises/kin/jokebed], mentions: [person:levi-hijo-de-jacob], note: "El texto no nombra a los padres ni a la hermana: Perspicacia los identifica con Amram, Jokébed y Míriam."}
    - {v: 5-10, type: narration, entities: [event:nacimiento-de-moises, person:moises, person:jokebed, person:miriam-hermana-de-moises, place:rio-nilo, relation:moises/lived_in/egipto], note: "La hija del faraón, su esclava y sus sirvientas no tienen nombre. Moisés significa «sacado», es decir, salvado del agua."}
    - {v: 11-12, type: narration, entities: [event:moises-mata-a-un-egipcio, person:moises, place:egipto], note: "Ni el egipcio ni el hebreo golpeado tienen nombre."}
    - {v: 13-15, type: narration, entities: [event:moises-huye-a-madian, person:moises, place:madian, relation:moises/lived_in/madian], mentions: [place:egipto], note: "Los dos hebreos que pelean y el faraón no tienen nombre."}
    - {v: 16-21, type: narration, entities: [event:moises-defiende-a-las-hijas-de-jetro, person:moises, person:jetro, person:zipora, place:madian, relation:moises/kin/zipora, relation:moises/kin/jetro, relation:zipora/kin/jetro, relation:zipora/lived_in/madian, relation:jetro/lived_in/madian], note: "La nota de 2:18 identifica a Reuel con Jetró. Las otras seis hijas y los pastores no tienen nombre."}
    - {v: "22", type: narration, entities: [event:nacimiento-de-guersom, person:guersom-hijo-de-moises, relation:guersom-hijo-de-moises/kin/moises, relation:guersom-hijo-de-moises/kin/zipora, relation:guersom-hijo-de-moises/born_in/madian], note: "Guersom significa «residente extranjero allí»."}
    - {v: 23-25, type: narration, mentions: [place:egipto, person:abrahan, person:isaac, person:jacob], note: "Muere el rey de Egipto, sin nombre. Israel sigue clamando por su esclavitud y Dios recuerda su pacto con Abrahán, Isaac y Jacob. Es un resumen, no una escena."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: narration, entities: [event:moises-ante-la-zarza-ardiente, person:moises, person:jetro, place:monte-sinai, relation:moises/kin/jetro, relation:moises/lived_in/madian, relation:jetro/lived_in/madian], mentions: [place:madian, person:abrahan, person:isaac, person:jacob], note: "Horeb, la montaña del Dios verdadero, es el monte Sinaí o su zona. El ángel de Jehová habla desde una zarza, un arbusto espinoso."}
    - {v: 7-12, type: narration, entities: [event:moises-ante-la-zarza-ardiente, person:moises], mentions: [place:egipto, place:canaan], note: "Dios promete llevar a Israel a la tierra de cananeos, hititas, amorreos, perizitas, heveos y jebuseos. La señal será que lo adorarán en esta misma montaña."}
    - {v: 13-15, type: narration, entities: [event:moises-ante-la-zarza-ardiente, person:moises], mentions: [person:abrahan, person:isaac, person:jacob], note: "Dios explica su nombre: «Yo Seré lo que Yo Decida Ser» (nota de 3:14 y apéndice A4). Jehová será su nombre para siempre."}
    - {v: 16-22, type: narration, entities: [event:moises-ante-la-zarza-ardiente, person:moises], mentions: [place:egipto, place:canaan, event:exodo, person:abrahan, person:isaac, person:jacob], note: "Moisés reunirá a los ancianos y pedirá al rey, sin nombre, un viaje de tres días al desierto. Dios anuncia castigos y que Israel saldrá con plata, oro y ropa de los egipcios."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
