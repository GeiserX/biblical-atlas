    - {v: 15-20, type: narration, entities: [event:israel-cruza-el-mar-rojo, person:moises], note: "El ángel del Dios verdadero, sin nombre, y la columna de nube pasan detrás del campamento: oscuridad para los egipcios y luz para Israel."}
    - {v: 21-31, type: narration, entities: [event:israel-cruza-el-mar-rojo, person:moises, place:cruce-del-mar-rojo], note: "Viento del este toda la noche; en la vigilia de la mañana los carros pierden las ruedas. Ningún egipcio sobrevive y el pueblo cree en Jehová y en Moisés."}
  15:
    status: complete
