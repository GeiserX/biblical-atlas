  20:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-17, type: law, entities: [event:diez-mandamientos], mentions: [place:egipto], note: "Las Diez Palabras: solo Jehová como Dios, ninguna imagen, respeto a su nombre, el sábado, honrar a los padres y no asesinar, adulterar, robar, mentir como testigo ni codiciar. Un ángel las transmitió (Hch 7:38)."}
    - {v: 18-21, type: narration, entities: [event:diez-mandamientos, event:moises-recibe-las-decisiones-judiciales, person:moises, place:monte-sinai], note: "Asustado por los truenos, el cuerno y el humo del monte, el pueblo se aparta y pide que Dios le hable por medio de Moisés. Él se acerca solo a la nube oscura."}
    - {v: 22-26, type: law, entities: [event:moises-recibe-las-decisiones-judiciales], note: "Empieza el libro del pacto: nada de dioses de plata ni de oro, y un altar de tierra o de piedra sin labrar, sin escalones."}
  21:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-11, type: law, entities: [event:moises-recibe-las-decisiones-judiciales], note: "El esclavo hebreo sirve seis años y sale libre al séptimo, salvo que pida quedarse de por vida. Normas para la hija vendida como esclava."}
    - {v: 12-17, type: law, note: "Muere quien mata a propósito, secuestra a alguien o golpea o maldice a su padre o a su madre. Quien mata sin querer puede huir al lugar que Dios indicará."}
    - {v: 18-27, type: law, note: "Heridas en una pelea, golpes a esclavos y el daño a una embarazada. Vida por vida y ojo por ojo, según lo que decidan los jueces."}
    - {v: 28-36, type: law, note: "El toro que cornea y el hoyo destapado: qué paga su dueño. Por un esclavo corneado se pagan 30 siclos a su amo."}
  22:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-15, type: law, entities: [event:moises-recibe-las-decisiones-judiciales], note: "Robo de animales, el ladrón sorprendido de noche, daños a campos y viñas, incendios, bienes dejados en custodia y animales prestados o alquilados."}
    - {v: 16-20, type: law, note: "La virgen seducida, la hechicera, el sexo con animales y los sacrificios a otros dioses."}
    - {v: 21-27, type: law, mentions: [place:egipto], note: "Amparo del extranjero, la viuda, el huérfano y el pobre: préstamo sin intereses y el manto tomado en prenda se devuelve antes del anochecer."}
    - {v: 28-31, type: law, note: "No maldecir a Dios ni a los jefes; dar las primicias y los primogénitos, y no comer carne despedazada por fieras."}
  23:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: law, entities: [event:moises-recibe-las-decisiones-judiciales], mentions: [place:egipto], note: "Justicia sin rumores, sin soborno y sin seguir a la mayoría. Devolver el animal perdido del enemigo y no oprimir al extranjero."}
    - {v: 10-13, type: law, note: "La tierra descansa el séptimo año y todos descansan el séptimo día. No se pronuncian los nombres de otros dioses."}
    - {v: 14-19, type: law, mentions: [place:egipto], note: "Tres fiestas al año: Panes Sin Levadura en el mes de abib, la Cosecha (Pentecostés) y la Recolección (Tabernáculos). Las primicias, a la casa de Jehová; ningún cabrito cocido en la leche de su madre."}
    - {v: 20-31, type: prophecy, entities: [place:mar-rojo, place:mar-grande, place:rio-eufrates], note: "Un ángel con el nombre de Dios guiará a Israel; Perspicacia «Miguel» lo identifica con Miguel. Amorreos, hititas, perizitas, cananeos, heveos y jebuseos son pueblos sin ficha; el desierto del versículo 31 no tiene nombre."}
    - {v: 32-33, type: law, note: "Ningún pacto con esos pueblos ni con sus dioses, y que no vivan en la tierra, para que no hagan pecar a Israel."}
  24:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:ancianos-de-israel-ven-a-dios, person:moises, person:aaron, person:nadab-hijo-de-aaron, person:abihu], note: "Dios manda a Moisés subir con Aarón, Nadab, Abihú y 70 ancianos, que se inclinarán desde lejos; solo Moisés se acercará."}
    - {v: 3-8, type: narration, entities: [event:pacto-de-la-ley, event:moises-recibe-las-decisiones-judiciales, person:moises, place:monte-sinai], note: "Moisés escribe lo que Dios dijo, levanta un altar y doce columnas por las doce tribus, lee el libro del pacto y rocía la sangre sobre el altar y sobre el pueblo."}
    - {v: 9-11, type: narration, entities: [event:ancianos-de-israel-ven-a-dios, person:moises, person:aaron, person:nadab-hijo-de-aaron, person:abihu, place:monte-sinai], note: "Los 70 ancianos no tienen nombre. En visión ven al Dios de Israel sobre algo como un suelo de zafiro, y comen y beben sin sufrir daño."}
    - {v: 12-18, type: narration, entities: [event:primeros-cuarenta-dias-de-moises-en-el-sinai, person:moises, person:josue-hijo-de-nun, person:aaron, person:hur-companero-de-moises, place:monte-sinai, relation:josue-hijo-de-nun/tie/moises, relation:hur-companero-de-moises/accompanies/moises, relation:hur-companero-de-moises/accompanies/aaron], note: "Dios promete a Moisés las tablas de piedra. La nube cubre el monte seis días y al séptimo Dios lo llama; su gloria parece un fuego en la cima."}
  25:
    status: complete
