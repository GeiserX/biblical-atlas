    spans:
    - {v: 1-2, type: law, entities: [event:consagracion-de-los-primogenitos, person:moises], note: "Jehová reclama como suyos a los primogénitos varones de Israel y a los primeros machos del ganado."}
    - {v: 3-10, type: speech, entities: [event:consagracion-de-los-primogenitos, place:egipto], mentions: [place:canaan], note: "Salen en el mes de abib. Cananeos, hititas, amorreos, heveos y jebuseos son pueblos sin ficha; su tierra es Canaán."}
    - {v: 11-16, type: speech, entities: [event:consagracion-de-los-primogenitos], mentions: [place:canaan, place:egipto], note: "Ya en Canaán, el primogénito del burro se rescata con una oveja y el de los hijos con un pago. Se explicará a los hijos por qué."}
    - {v: 17-18, type: narration, entities: [event:israel-acampa-en-ezam, place:mar-rojo], mentions: [place:filistea, place:egipto], note: "Dios evita el camino corto por la tierra de los filisteos y los lleva por el del desierto del mar Rojo. Salen ordenados como un ejército."}
    - {v: "19", type: narration, entities: [event:israel-acampa-en-ezam, person:moises, person:jose-hijo-de-jacob], note: "Moisés se lleva los huesos de José, que antes de morir hizo jurar a los hijos de Israel que lo harían (Gé 50:25). José no actúa en el suceso: había muerto hacía más de un siglo."}
    - {v: 20-22, type: narration, entities: [event:israel-acampa-en-ezam, place:sucot-de-egipto, place:ezam], note: "Jehová va delante en una columna de nube de día y de fuego de noche, así que pueden avanzar a cualquier hora."}
  14:
    status: complete
