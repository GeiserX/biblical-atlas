  12:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-13, type: law, entities: [event:jehova-instituye-la-pascua, person:moises, person:aaron, place:egipto], note: "El mes de la salida pasa a ser el primero del año. Cordero sin defecto de un año, sangre en el marco de la puerta y cena de pie. Los dioses de Egipto no tienen ficha."}
    - {v: 14-20, type: law, entities: [event:jehova-instituye-la-pascua], note: "Fiesta de los Panes Sin Levadura: del día 14 por la tarde al 21 del primer mes, con reunión santa el primer día y el séptimo."}
    - {v: 21-28, type: narration, entities: [event:primera-pascua, person:moises, person:aaron, place:egipto], note: "Moisés instruye a los ancianos de Israel, sin nombre, sobre el hisopo y la sangre. El pueblo se postra y obedece."}
    - {v: 29-30, type: narration, entities: [event:decima-plaga-mueren-los-primogenitos, place:egipto], note: "Mueren los primogénitos, desde el del faraón hasta el del preso. El faraón no tiene nombre: Perspicacia no sabe quién era el del éxodo."}
    - {v: 31-36, type: narration, entities: [event:exodo, person:moises, person:aaron, place:egipto], note: "Esa misma noche el faraón los echa y pide que lo bendigan. Los egipcios dan a los israelitas plata, oro y ropa."}
    - {v: 37-39, type: narration, entities: [event:exodo, place:rameses, place:sucot-de-egipto], note: "Unos 600.000 hombres a pie, sin contar a los niños, más una multitud mixta de no israelitas y mucho ganado. Cuecen panes sin levadura por la prisa."}
    - {v: 40-42, type: narration, entities: [event:exodo], mentions: [event:pacto-con-abrahan], note: "Los 430 años se cuentan desde que entró en vigor el pacto con Abrahán (estudio 3); la salida cae en el mismo día en que se cumplen."}
    - {v: 43-49, type: law, mentions: [person:moises, person:aaron], note: "Quién puede comer la Pascua: el esclavo comprado y el extranjero, solo si se circuncidan. El cordero se come en una casa y sin romperle ningún hueso."}
    - {v: 50-51, type: narration, entities: [event:primera-pascua, event:exodo], mentions: [person:moises, person:aaron, place:egipto], note: "El pueblo obedece en todo y ese mismo día Jehová lo saca de Egipto."}
  13:
