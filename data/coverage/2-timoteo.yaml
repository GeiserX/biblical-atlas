# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: 2-timoteo
chapters:
  1:
    status: complete
    reviewed_on: 2026-10-13
    note: "Pablo, preso en Roma, escribe a Timoteo: recuerda su fe y la de Loida y Eunice, le pide avivar su don y no avergonzarse de él, y contrasta a los de Asia que lo dejaron con Onesíforo."
    spans:
    - {v: 1-2, type: letter, entities: [letter:2-timoteo, event:pablo-escribe-2-timoteo, person:pablo, person:timoteo, relation:pablo/holds_office/-, relation:timoteo/accompanies/pablo], mentions: [person:jesus], note: "Pablo, apóstol por voluntad de Dios, saluda a Timoteo, su hijo amado. La nota lo lee como cariño tras al menos catorce años sirviendo juntos, quizá pensando que es su última carta."}
    - {v: 3-5, type: letter, entities: [person:timoteo, person:loida, person:eunice, relation:timoteo/kin/loida, relation:timoteo/kin/eunice, relation:eunice/kin/loida, relation:timoteo/lived_in/listra, relation:loida/lived_in/listra, relation:eunice/lived_in/listra], mentions: [place:listra], note: "Pablo da gracias y ora por Timoteo; recuerda sus lágrimas y su fe sin hipocresía, que tuvieron antes su abuela Loida y su madre Eunice. La nota ve probable que ambas creyeran hacia 47-48, en Listra."}
    - {v: 6-7, type: letter, entities: [person:timoteo], mentions: [person:pablo, event:timoteo-se-une-a-pablo], note: "Que avive el don recibido cuando Pablo le impuso las manos. La nota no sabe si es la ocasión de 1Ti 4:14, con los ancianos, u otra. Dios da espíritu de poder, amor y buen juicio, no de cobardía."}
    - {v: 8-11, type: letter, entities: [event:segundo-encierro-en-roma, event:pablo-escribe-2-timoteo, person:pablo, relation:pablo/lived_in/roma@65, relation:pablo/holds_office/-, event:bautismo-de-jesus], mentions: [person:jesus], note: "Pablo, prisionero por causa del Señor, pide a Timoteo no avergonzarse ni de él ni del testimonio. La nota fecha la carta en el último encierro, hacia 65. Cristo, manifestado desde su bautismo según la nota, abolió la muerte."}
    - {v: 12-14, type: letter, entities: [person:pablo, person:timoteo], note: "Por eso sufre y no se avergüenza: confía en que Dios guarda lo que dejó a su cuidado, su vida según la nota. Timoteo debe aferrarse al modelo de palabras sanas y proteger el tesoro confiado."}
    - {v: "15", type: letter, entities: [place:asia, person:figelo, person:hermogenes, relation:figelo/lived_in/asia, relation:hermogenes/lived_in/asia, event:segundo-encierro-en-roma], mentions: [person:pablo], note: "Todos los de la provincia de Asia, Figelo y Hermógenes entre ellos, se apartaron de Pablo. Perspicacia lo atribuye quizás a la persecución que siguió al incendio de Roma de 64."}
    - {v: 16-18, type: letter, entities: [person:onesiforo, relation:onesiforo/lived_in/efeso, relation:onesiforo/accompanies/pablo, journey:onesiforo-busca-a-pablo, journey:ultimos-anos-de-pablo, event:segundo-encierro-en-roma, place:roma, place:efeso, relation:pablo/lived_in/roma@65], mentions: [person:timoteo], note: "Pablo pide misericordia para la casa de Onesíforo, que lo animó sin avergonzarse de sus cadenas y lo buscó en Roma hasta encontrarlo. Timoteo conoce bien sus servicios en Éfeso."}
  2:
    status: complete
    reviewed_on: 2026-10-13
    note: "Consejos a Timoteo: transmitir lo aprendido, aguantar como soldado, recordar a Cristo resucitado, manejar bien la palabra, rechazar a apóstatas como Himeneo y Fileto y tratar con apacibilidad incluso a los que se oponen."
    spans:
    - {v: 1-7, type: letter, entities: [letter:2-timoteo, person:timoteo], mentions: [person:pablo, person:jesus], note: "Hijo mío, fortalécete. Lo que oíste de mí, encárgaselo a hombres fieles que enseñen a otros. Tres comparaciones: el soldado, el atleta que respeta las reglas y el agricultor que trabaja duro."}
    - {v: 8-13, type: letter, entities: [event:resurreccion-de-jesus, relation:jesus/kin/david, event:segundo-encierro-en-roma, person:pablo, relation:pablo/lived_in/roma@65], mentions: [person:jesus, person:david], note: "Jesucristo, descendiente de David, resucitó. Por esas buenas noticias Pablo está preso como un delincuente, pero la palabra de Dios no está encadenada. Si aguantamos, reinaremos con él."}
    - {v: 14-19, type: letter, entities: [person:timoteo, person:himeneo, person:fileto, relation:himeneo/lived_in/efeso, relation:fileto/lived_in/efeso, relation:timoteo/lived_in/efeso], mentions: [place:efeso, event:pablo-expulsa-a-himeneo-y-alejandro, event:rebelion-de-core], note: "Nada de pelear por palabras. Himeneo y Fileto decían que la resurrección ya había ocurrido; la nota recuerda la expulsión de Himeneo. La cita «Jehová conoce a los suyos» es de Moisés a Coré (Nú 16:5)."}
    - {v: 20-26, type: letter, entities: [person:timoteo, relation:timoteo/lived_in/efeso], mentions: [place:efeso, person:satanas], note: "En una casa grande hay utensilios honrosos y deshonrosos. Que Timoteo huya de los deseos juveniles, rehúya debates, que la nota sitúa en Éfeso, y enseñe con apacibilidad para que algunos escapen de la trampa del Diablo."}
  3:
    status: complete
    reviewed_on: 2026-10-13
    note: "Los últimos días serán críticos por cómo será la gente. Los que resisten la verdad acabarán como Janes y Jambres; Timoteo, que conoce las persecuciones de Pablo y las Escrituras desde niño, debe mantenerse firme."
    spans:
    - {v: 1-5, type: letter, entities: [letter:2-timoteo], note: "En los últimos días, aún lejanos según la nota, vendrán tiempos difíciles: unos veinte rasgos de egoísmo, amor al dinero y a los placeres, con apariencia de devoción. Timoteo debe apartarse ya de quienes son así."}
    - {v: 6-7, type: letter, note: "De ese grupo salen hombres que se cuelan con astucia en las casas y arrastran a mujeres débiles y llenas de pecados, que siempre aprenden algo pero nunca llegan al conocimiento exacto de la verdad."}
    - {v: 8-9, type: letter, entities: [person:janes, person:jambres, relation:janes/tie/moises, relation:jambres/tie/moises, relation:janes/lived_in/egipto, relation:jambres/lived_in/egipto], mentions: [person:moises, place:egipto, event:la-vara-de-aaron-se-traga-las-de-los-magos, event:primera-plaga-el-agua-se-convierte-en-sangre, event:segunda-plaga-las-ranas, event:tercera-plaga-los-mosquitos, event:sexta-plaga-las-ulceras, place:efeso, event:despedida-en-mileto], note: "Como Janes y Jambres frente a Moisés, los falsos maestros de Éfeso no irán lejos. Las notas ven quizá en ellos a los jefes de los magos, que desde la tercera plaga ya no pudieron imitar a Moisés."}
    - {v: 10-13, type: letter, entities: [person:timoteo, person:pablo, event:expulsados-de-antioquia-de-pisidia, event:huida-de-iconio, event:apedrean-a-pablo-en-listra, place:antioquia-de-pisidia, place:iconio, place:listra], mentions: [person:bernabe, person:jesus, relation:timoteo/accompanies/pablo, relation:timoteo/lived_in/listra], note: "Timoteo, unos catorce años junto a Pablo, conoce lo que sufrió en Antioquía de Pisidia, Iconio y Listra, donde lo apedrearon; la nota cree que Timoteo estaba allí. Todo el que sirve a Dios será perseguido."}
    - {v: 14-17, type: letter, entities: [person:timoteo], mentions: [person:eunice, person:loida, person:pablo, person:jesus, relation:timoteo/kin/eunice, relation:timoteo/kin/loida], note: "Que siga en lo aprendido: desde bebé conoce los santos escritos, que según la nota le enseñaron su madre Eunice y probablemente su abuela Loida. Toda la Escritura es inspirada por Dios y útil para enseñar y corregir."}
  4:
    status: complete
    reviewed_on: 2026-10-13
    note: "Último encargo de Pablo: que Timoteo predique con urgencia. Él ya se ve morir. Pide que venga pronto con Marcos, la capa y los rollos; cuenta quién lo dejó, quién está con él y su primera defensa."
    spans:
    - {v: 1-5, type: letter, entities: [letter:2-timoteo], mentions: [person:jesus, person:timoteo], note: "Ante Dios y Cristo, juez de vivos y muertos, Pablo ordena a Timoteo predicar la palabra con urgencia, porque vendrán quienes busquen maestros a su gusto. Que haga su trabajo de evangelizador, que la nota lee también como misionero."}
    - {v: 6-8, type: letter, entities: [person:pablo, event:segundo-encierro-en-roma, event:pablo-escribe-2-timoteo, relation:pablo/lived_in/roma@65], mentions: [person:jesus, event:pablo-escribe-filipenses, relation:timoteo/lived_in/roma, place:roma], note: "Pablo se ve derramado como ofrenda líquida: su muerte está cerca. Ha peleado, terminado la carrera y guardado la fe, y le espera la corona. La nota recuerda que Timoteo estaba con él en Roma al escribir Filipenses."}
    - {v: 9-12, type: letter, entities: [person:timoteo, person:demas, person:crescente, person:tito, person:lucas, person:juan-marcos, person:tiquico, place:tesalonica, place:galacia, place:ilirico, place:efeso, journey:demas-se-va-a-tesalonica, journey:crescente-a-galacia, journey:tito-de-creta-a-dalmacia, journey:tiquico-enviado-a-efeso, relation:demas/lived_in/tesalonica, relation:lucas/accompanies/pablo@65, relation:tiquico/accompanies/pablo@65, relation:timoteo/lived_in/efeso, event:pablo-escribe-2-timoteo], mentions: [person:pablo, place:roma, place:nicopolis, place:creta, relation:demas/accompanies/pablo, relation:juan-marcos/accompanies/pablo@60, event:segundo-encierro-en-roma], note: "Que Timoteo venga pronto. Demas lo dejó por amor a este sistema y se fue a Tesalónica; Crescente, a Galacia; Tito, a Dalmacia. Solo Lucas sigue con él. Que traiga a Marcos; Tíquico va a Éfeso, quizá a sustituirlo."}
    - {v: "13", type: letter, entities: [person:carpo, relation:carpo/lived_in/troas, place:troas, event:pablo-deja-su-capa-en-troas, journey:ultimos-anos-de-pablo, person:pablo, event:pablo-escribe-2-timoteo], mentions: [person:timoteo], note: "Que le traiga la capa que dejó en Troas, en casa de Carpo, y los rollos, sobre todo los pergaminos. La nota cree que eran porciones de las Escrituras Hebreas, o quizá escritos suyos."}
    - {v: 14-15, type: letter, entities: [person:alejandro-calderero, relation:alejandro-calderero/tie/pablo, relation:alejandro-calderero/same_as/alejandro-expulsado], mentions: [person:alejandro-expulsado, person:pablo, person:timoteo], note: "Alejandro, el artesano del cobre, hizo mucho daño a Pablo y se opuso a su mensaje: Timoteo debe cuidarse de él. La nota ve posible que sea el expulsado con Himeneo."}
    - {v: 16-18, type: letter, entities: [event:primera-defensa-de-pablo, person:pablo, place:roma], mentions: [person:jesus, event:segundo-encierro-en-roma], note: "En su primera defensa nadie lo apoyó, y no quiere que se les pida cuentas. El Señor, Jesús según la nota, lo fortaleció para predicar y lo libró de la boca del león. Confía en llegar al Reino celestial."}
    - {v: "19", type: letter, entities: [person:priscila, person:aquila, person:onesiforo, relation:aquila/lived_in/efeso@65, relation:priscila/lived_in/efeso@65, relation:aquila/accompanies/pablo, relation:priscila/accompanies/pablo, relation:onesiforo/lived_in/efeso, journey:onesiforo-busca-a-pablo], mentions: [place:efeso, person:timoteo], note: "Saludos a Prisca y Áquila, que según la nota habían vuelto a Éfeso tras su paso por Roma, y a la casa de Onesíforo. Perspicacia no da por hecho que Onesíforo hubiera muerto."}
    - {v: "20", type: letter, entities: [person:erasto-colaborador-de-pablo, relation:erasto-colaborador-de-pablo/lived_in/corinto, place:corinto, person:trofimo, relation:trofimo/accompanies/pablo@61, place:mileto, event:pablo-deja-a-trofimo-enfermo-en-mileto, journey:ultimos-anos-de-pablo, person:pablo], note: "Erasto se quedó en Corinto; Perspicacia lo da por probable el compañero de Hechos. A Trófimo, Pablo lo dejó enfermo en Mileto."}
    - {v: "21", type: letter, entities: [person:eubulo, person:pudente, person:lino, person:claudia, relation:pudente/accompanies/pablo, relation:lino/lived_in/roma, relation:claudia/lived_in/roma, event:segundo-encierro-en-roma, event:pablo-escribe-2-timoteo, place:roma], mentions: [person:timoteo, person:pablo], note: "Que venga antes del invierno, cuando no se navegaba y la capa haría falta. Saludan Eubulo, Pudente, Lino, Claudia y los demás hermanos; la nota ve posible que fueran de la congregación de Roma."}
    - {v: "22", type: letter, mentions: [person:jesus, person:timoteo, place:efeso], note: "Que el Señor esté con el espíritu de Timoteo. El último saludo pasa al plural: la nota cree que la carta se leería también a los cristianos de Éfeso."}
