# biblical-earth: cobertura de un libro. Formato en data/coverage/README.md.
book: isaias
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: "1", type: narration, entities: [person:isaias, person:amoz, relation:isaias/kin/amoz, relation:isaias/holds_office/-, event:isaias-profetiza-contra-juda-y-jerusalen, place:juda, place:jerusalen], mentions: [person:uzias, person:jotan, person:acaz, person:ezequias, period:uzias, period:jotan, period:acaz, period:ezequias, event:isaias-empieza-a-profetizar], note: "Encabezamiento de todo el libro: visión de Isaías, cuyo nombre significa «salvación de Jehová», sobre Judá y Jerusalén en días de cuatro reyes de Judá."}
    - {v: 2-6, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], note: "Cielos y tierra oyen que los hijos que Jehová crió se rebelaron: el toro y el burro conocen a su dueño, Israel no. Israel es aquí el pueblo de Judá (ip-1, cap. 2); el Santo de Israel es Jehová."}
    - {v: 7-9, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:juda, place:jerusalen], mentions: [event:senaquerib-contra-jerusalen, event:caida-de-samaria, place:sodoma, place:gomorra, event:destruccion-de-sodoma-y-gomorra], note: "Tierra quemada y comida por extranjeros; la hija de Sion, Jerusalén, queda como choza en un pepinar. ip-1 lo ve cumplido con las invasiones asirias. Sin un resto, serían como Sodoma y Gomorra (Ro 9:29)."}
    - {v: 10-17, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], mentions: [place:jerusalen, place:juda], note: "Los dictadores de Sodoma y la gente de Gomorra son los jefes y el pueblo de Jerusalén y Judá (ip-1). Jehová rechaza sacrificios y fiestas de manos ensangrentadas: que se laven y defiendan al huérfano y la viuda."}
    - {v: 18-20, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], note: "Jehová invita a arreglar las cosas: pecados rojos como escarlata quedarán blancos como la nieve. Quien escuche comerá lo bueno de la tierra; quien se rebele caerá por la espada."}
    - {v: 21-23, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen], note: "Lamento por la ciudad fiel, Jerusalén, vuelta prostituta: plata hecha escoria, cerveza aguada, príncipes que aman el soborno y no defienden al huérfano ni a la viuda."}
    - {v: 24-27, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607, event:regreso-de-537, person:ageo, person:zacarias-profeta, person:josue-sumo-sacerdote, person:esdras, person:zorobabel], note: "Jehová fundirá la escoria de Sion y le devolverá jueces y consejeros. ip-1 lo ve en la destrucción de 607 y en la vuelta de 537, con Ageo, Zacarías, Josué, Esdras y Zorobabel como guías."}
    - {v: 28-31, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], note: "Los que dejan a Jehová acabarán mal y se avergonzarán de los árboles y jardines de su idolatría, según la nota al pie. El hombre fuerte arderá como estopa junto con su obra."}
  2:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: "1", type: narration, entities: [person:isaias, person:amoz, relation:isaias/kin/amoz, event:isaias-profetiza-contra-juda-y-jerusalen, place:juda, place:jerusalen], note: "Nuevo encabezamiento: lo que Isaías hijo de Amoz vio sobre Judá y Jerusalén."}
    - {v: 2-4, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen], mentions: [person:jacob], note: "En la parte final de los días se alzará la montaña de la casa de Jehová, afluirán las naciones y harán arados de sus espadas. ip-1 la lee como la adoración pura ensalzada: sin ficha. Miq 4:1-3 la repite."}
    - {v: 5-9, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], mentions: [person:uzias, period:uzias], note: "La casa de Jacob, el pueblo, se llenó de costumbres de Oriente y de magia como los filisteos, de oro, caballos, carros e ídolos. ip-1 pone esa riqueza en el reinado de Uzías (2Cr 26)."}
    - {v: 10-17, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], mentions: [place:libano, place:basan, place:tarsis, event:destruccion-de-jerusalen-607, person:nabucodonosor-ii], note: "El día de Jehová de los ejércitos humillará todo lo alto: cedros del Líbano, robles de Basán, torres, murallas y barcos de Tarsis. ip-1 lo ve llegar a Jerusalén con Nabucodonosor en 607."}
    - {v: 18-22, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Los dioses inútiles desaparecerán: la gente los tirará a musarañas y murciélagos y se meterá en cuevas y grietas. No hay que confiar en el hombre, que solo tiene aliento en la nariz."}
  3:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-7, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen, place:juda], mentions: [event:destruccion-de-jerusalen-607], note: "Jehová retirará de Jerusalén y Judá el pan, el agua y a quienes mantienen el orden: guerreros, jueces, profetas y consejeros. Mandarán muchachos y nadie aceptará gobernar las ruinas. «Luz para toda la humanidad I» lo ve cumplido en 607."}
    - {v: 8-12, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen, place:juda], mentions: [place:sodoma], note: "Jerusalén y Judá han caído por rebelarse contra Jehová y muestran su pecado como Sodoma, ejemplo de maldad extrema según Perspicacia «Sodoma». Al justo le irá bien, al malvado le volverá lo que hizo; sus guías extravían al pueblo."}
    - {v: 13-15, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], note: "Jehová se levanta como juez contra los ancianos y príncipes de su pueblo: han arrasado la viña, tienen en casa lo quitado a los pobres y los aplastan."}
    - {v: 16-24, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Las hijas de Sion, que «Luz para toda la humanidad I» identifica con las jerosolimitanas, presumen de adornos. Jehová les quitará joyas, perfume y ropa fina: tendrán soga, calvicie, saco y marca de esclava, como en 607."}
    - {v: 25-26, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Los hombres de la ciudad morirán en la guerra, sus puertas estarán de luto y ella quedará vacía, sentada en el suelo. El mismo libro lo ve cumplido en la destrucción de 607."}
  4:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: "1", type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Muertos tantos hombres, siete mujeres se aferrarán a uno solo para llevar su nombre y quitarse la vergüenza, aunque se mantengan ellas. Con este versículo cierra la sección que «Luz para toda la humanidad I» aplica a 607."}
    - {v: 2-4, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen], mentions: [event:regreso-de-537, event:destruccion-de-jerusalen-607], note: "Lo que Jehová haga brotar honrará a los israelitas que escapen; Perspicacia «Rama, brote» lo lee como prosperidad que da Dios. El resto de Sion y Jerusalén, limpiado por el juicio, será santo: la vuelta de 537."}
    - {v: 5-6, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen], mentions: [event:regreso-de-537, event:israel-acampa-en-ezam, event:jehova-desciende-sobre-el-monte-sinai], note: "Sobre el monte Sion, que es Jerusalén, Jehová pondrá nube de día y fuego de noche, que según «Luz para toda la humanidad I» evocan la columna del éxodo y el Sinaí humeante, y una cabaña de sombra y refugio."}
  5:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-7, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen, place:juda], mentions: [person:isaias], note: "Canto de la viña: el amado de Isaías, Jehová según «Las profecías de Isaías», la cuidó con esmero y solo dio uvas silvestres. La viña es la casa de Israel, pueblo sin ficha; quedará sin cerco ni lluvia."}
    - {v: 8-10, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Primer ay, contra quienes acaparan casas y campos. Las casas quedarán vacías y la cosecha será mínima; «Las profecías de Isaías» lo ve probable, al menos en parte, en el destierro a Babilonia."}
    - {v: 11-17, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Ay de los que beben de la mañana a la noche y no miran lo que hace Jehová. El pueblo irá al destierro y la gloria de Jerusalén bajará a la Tumba, el Seol, lugar simbólico sin ficha."}
    - {v: 18-23, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], note: "Cuatro ayes más: contra quienes se burlan del plan del Santo de Israel, llaman bueno a lo malo, se creen sabios, son valientes para el vino y absuelven al culpable por un soborno."}
    - {v: 24-25, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], note: "Por rechazar la ley de Jehová se consumirán como paja en el fuego. Su mano sigue extendida contra su pueblo: tiemblan los montes y los cadáveres quedan en las calles."}
    - {v: 26-30, type: prophecy, entities: [event:isaias-profetiza-contra-juda-y-jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Jehová alza una señal y silba a una nación lejana, veloz e incansable, que ruge como un león y se lleva la presa. Su nombre no se dice; una nota de «Las profecías de Isaías» la identifica con Babilonia."}
  6:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-4, type: vision, entities: [event:isaias-empieza-a-profetizar, person:isaias, person:uzias], mentions: [event:isaias-profetiza-contra-juda-y-jerusalen], note: "El año en que muere el rey Uzías, c. 778, Isaías ve en visión a Jehová en un trono alto. Los serafines, ángeles de alto rango sin nombre ni ficha, proclaman su santidad y el templo se llena de humo."}
    - {v: 5-8, type: vision, entities: [event:isaias-empieza-a-profetizar, person:isaias, relation:isaias/holds_office/-], mentions: [person:jesus], note: "Isaías se siente perdido por sus labios impuros. Un serafín se los toca con una brasa del altar y su pecado queda expiado. Jehová pregunta a quién enviar y él se ofrece; el «nosotros» incluye al Hijo (Jn 12:41)."}
    - {v: 9-10, type: vision, entities: [event:isaias-empieza-a-profetizar, person:isaias], mentions: [event:parabolas-del-reino, event:jehova-habla-desde-el-cielo, event:pablo-da-testimonio-a-los-judios-de-roma, person:jesus, person:pablo], note: "El mensaje: el pueblo oirá y verá sin entender, con el corazón insensible. Jesús lo ve cumplido en quienes oían sus ejemplos (Mt 13:14, 15), Juan en la incredulidad de Jn 12:40 y Pablo en Roma (Hch 28:26, 27)."}
    - {v: 11-13, type: vision, entities: [event:isaias-empieza-a-profetizar, person:isaias], mentions: [event:destruccion-de-jerusalen-607, event:regreso-de-537, event:destruccion-de-jerusalen-70], note: "Durará hasta que las ciudades queden vacías y el pueblo, desterrado: Jerusalén cayó en 607. Quedará un décimo, un tocón santo: el resto que volvió en 537 y, en el siglo I, los discípulos que escaparon antes del 70."}
  7:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-2, type: narration, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, person:acaz, person:rezin-rey-de-siria, person:pecah, person:remalias, place:jerusalen, place:siria, place:israel, relation:acaz/kin/jotan, relation:jotan/kin/uzias, relation:pecah/kin/remalias, relation:rezin-rey-de-siria/holds_office/siria, relation:rezin-rey-de-siria/tie/pecah, relation:acaz/tie/rezin-rey-de-siria, relation:acaz/tie/pecah], mentions: [person:jotan, person:uzias, person:david, place:juda, period:acaz, period:pecah], note: "Rezín y Pécah suben contra Jerusalén y no la toman: suceso de 2Re 16:5, que crea Reyes. Efraín es el reino de Israel; la casa de David, la dinastía de Acaz."}
    - {v: 3-9, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, event:isaias-sale-al-encuentro-de-acaz, person:isaias, person:sear-jasub, person:acaz, person:tabeel-de-tiempos-de-acaz, person:rezin-rey-de-siria, place:campo-del-lavandero, place:jerusalen, place:damasco, place:siria, place:israel, relation:sear-jasub/kin/isaias, relation:sear-jasub/lived_in/jerusalen, relation:isaias/lived_in/jerusalen, relation:rezin-rey-de-siria/lived_in/damasco, person:pecah, place:samaria, relation:pecah/lived_in/samaria], mentions: [person:remalias, place:juda], note: "El estanque superior va en names de Jerusalén. Sobre los 65 años de Efraín, Perspicacia «Esar-hadón» recoge que algunos los cuentan hasta que ese rey asirio llevó extranjeros a Samaria (Esd 4:2)."}
    - {v: 10-17, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, event:isaias-sale-al-encuentro-de-acaz, person:acaz, person:isaias, relation:acaz/kin/david, event:division-del-reino], mentions: [person:david, person:jesus, person:maria-madre-de-jesus, event:nacimiento-de-jesus, place:israel, place:juda, place:asiria, event:jose-lleva-a-maria-a-su-casa], note: "Acaz no pide señal. Una joven tendrá a Emmanuel, «con nosotros está Dios»; Mt 1:23 lo aplica a Jesús, hijo de María. El Emmanuel de días de Acaz queda sin identificar; ip-1 ve posible un hijo de Isaías."}
    - {v: 18-25, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, event:isaias-sale-al-encuentro-de-acaz], mentions: [place:rio-nilo, place:egipto, place:asiria, place:rio-eufrates, person:tiglat-pileser-iii, person:acaz], note: "Moscas del Nilo y abejas de Asiria son sus ejércitos. La navaja alquilada del Río, el Éufrates, es el rey asirio que Acaz pagó, Tiglat-Piléser III (Perspicacia «Acaz»). La tierra quedará llena de espinos."}
  8:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-4, type: narration, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, event:isaias-escribe-maher-salal-has-baz-en-una-tablilla, event:nace-maher-salal-has-baz, person:isaias, person:maher-salal-has-baz, person:uriya-sacerdote-de-acaz, person:zacarias-hijo-de-jeberekias, person:jeberekias, relation:maher-salal-has-baz/kin/isaias, relation:maher-salal-has-baz/lived_in/jerusalen, relation:zacarias-hijo-de-jeberekias/kin/jeberekias, relation:uriya-sacerdote-de-acaz/holds_office/-], mentions: [place:damasco, place:samaria, place:asiria, person:tiglat-pileser-iii, event:caida-de-samaria], note: "La profetisa es la esposa de Isaías y no tiene nombre. Perspicacia «Maher-salal-has-baz» ve cumplido el v. 4 cuando Tiglat-Piléser III tomó Damasco, y del todo con la caída de Samaria en 740 a.e.c."}
    - {v: 5-8, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:jerusalen], mentions: [person:rezin-rey-de-siria, person:pecah, person:remalias, place:rio-eufrates, place:asiria, place:juda, event:caida-de-samaria, event:senaquerib-contra-jerusalen], note: "Israel desprecia las aguas tranquilas del Siloé, canal de Jerusalén (en names). Asiria, como el Éufrates desbordado, cubrirá Siria e Israel y llegará al cuello de Judá, lo que Perspicacia «Isaías» ve en tiempos de Ezequías."}
    - {v: 9-10, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], mentions: [event:senaquerib-contra-jerusalen, person:ezequias], note: "Los pueblos que se preparen contra el pueblo de Dios serán destrozados, porque Dios está con él, que es lo que significa Emmanuel. ip-1 lo ve cumplido en días de Ezequías, cuando el ángel acabó con el ejército asirio."}
    - {v: 11-15, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], mentions: [place:jerusalen, person:jesus], note: "No temer lo que teme el pueblo, sino a Jehová. Será santuario, y piedra de tropiezo para las dos casas de Israel; «Toda Escritura», libro 23, párr. 36, ve cumplido el v. 14 en Jesús (Ro 9:32, 33; 1Pe 2:8)."}
    - {v: 16-18, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, person:isaias, person:sear-jasub, person:maher-salal-has-baz], mentions: [place:jerusalen, person:jesus], note: "Isaías sella la ley entre sus discípulos y espera en Jehová. Él y sus hijos son señales en Israel; Heb 2:13 aplica a Jesús el v. 18. El monte Sion es Jerusalén."}
    - {v: 19-22, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], note: "No hay que consultar a médiums ni a los muertos, sino la ley y la confirmación escrita. Quien no lo haga vagará hambriento, renegará de su rey y de su Dios y solo verá oscuridad."}
  9:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-2, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:zabulon, place:neftali, place:galilea], mentions: [place:rio-jordan, place:mar-de-galilea, person:tiglat-pileser-iii, person:jesus, event:hijo-del-funcionario-y-sinagoga-de-nazaret], note: "Zabulón y Neftalí, antes humilladas, recibirán honra y verán una gran luz. Perspicacia «Neftalí» ve quizá la humillación asiria de 2Re 15:29, suceso que crea Reyes. Mt 4:13-16 lo aplica a la predicación de Jesús."}
    - {v: 3-5, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, event:gedeon-derrota-a-madian-con-300-hombres, place:madian], note: "Jehová alegra a la nación y rompe el yugo del opresor como en el día de Madián, la victoria de Gedeón que Perspicacia «Madián» pone como modelo. Las botas y la ropa de guerra acabarán en el fuego."}
    - {v: 6-7, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], mentions: [person:david, person:jesus, event:anuncio-a-maria], note: "Nace un niño que gobernará en el trono de David, con cuatro títulos, de Maravilloso Consejero a Príncipe de Paz. «Toda Escritura» lo ve cumplido en Jesús, según el anuncio de Lu 1:32, 33."}
    - {v: 8-12, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:israel, place:samaria, place:siria, place:filistea, person:rezin-rey-de-siria], mentions: [event:caida-de-samaria], note: "Mensaje contra Jacob e Israel, el pueblo del norte, al que llama también Efraín. Samaria presume de reconstruir con piedra y cedro; Jehová levanta a los enemigos de Rezín, y Siria y los filisteos devoran a Israel."}
    - {v: 13-17, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:israel], mentions: [event:caida-de-samaria], note: "El pueblo no vuelve a Jehová. En un día cortará a Israel la cabeza, los ancianos respetados, y la cola, los profetas mentirosos. Las referencias remiten al destierro de 2Re 17:6."}
    - {v: 18-21, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:israel], mentions: [place:juda], note: "La maldad arde como fuego y nadie perdona a su hermano. Manasés y Efraín, tribus y no personas, se devoran entre sí y se unen contra Judá. La referencia 2Cr 28:6 remite a la guerra de Péqah contra Acaz."}
  10:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-4, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], note: "¡Ay de quienes dictan leyes injustas y despojan a pobres, viudas y huérfanos! En el día del castigo no tendrán a quién acudir. Cierra el estribillo de Is 9:12-21: la mano de Jehová sigue extendida."}
    - {v: 5-11, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:asiria, place:calno, place:carquemis, place:hamat, place:arpad, place:samaria, place:damasco, place:jerusalen], mentions: [event:caida-de-samaria, event:senaquerib-contra-jerusalen, person:senaquerib], note: "Asiria es la vara de Jehová contra una nación apóstata, pero quiere destruir muchas. Presume de Calnó, Carquemis, Hamat, Arpad, Samaria y Damasco, y amenaza a Jerusalén. Perspicacia «Arpad» ve cumplida la jactancia en Rabsaqué."}
    - {v: 12-19, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:asiria, place:jerusalen], mentions: [event:senaquerib-contra-jerusalen, event:caida-de-ninive], note: "Tras su obra en Sion, Jehová castigará la soberbia del rey de Asiria: la Luz de Israel, que es Jehová, quema su bosque. Las referencias remiten a los 185.000 muertos, y Perspicacia «Asiria» liga el v. 12 a su caída."}
    - {v: 20-23, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], mentions: [event:destruccion-de-jerusalen-607, event:regreso-de-537, event:destruccion-de-jerusalen-70], note: "Solo un resto de Jacob, el pueblo, volverá al Dios Poderoso. Pablo cita los vv. 22 y 23 en Ro 9:27, 28; sus notas ven el castigo en 607 a.e.c. y 70 e.c., y el resto que volvió del destierro."}
    - {v: 24-27, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, event:los-efraimitas-capturan-a-oreb-y-zeeb, event:israel-cruza-el-mar-rojo, place:roca-de-oreb, place:madian, place:asiria, place:jerusalen], mentions: [person:oreb, place:egipto, event:el-faraon-persigue-a-israel, event:senaquerib-contra-jerusalen], note: "Sion no debe temer al asirio que la golpea como hizo Egipto. Jehová lo azotará como a Madián en la roca de Oreb y alzará su bastón sobre el mar como contra Egipto. El yugo se romperá."}
    - {v: 28-32, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:hai, place:migron, place:micmash, place:gueba, place:rama-de-benjamin, place:guibea-de-benjamin, place:galim, place:laisa, place:anatot, place:madmena, place:guebim, place:nob, place:jerusalen], mentions: [person:saul, person:senaquerib, event:senaquerib-contra-jerusalen], note: "Marcha del invasor desde Ayat, que es Hai, hasta Nob, frente a Jerusalén. Perspicacia la aplica al ejército de Senaquerib; Migrón y Galim quizá son las de 1 Samuel. Guibeá de Saúl es la ciudad."}
    - {v: 33-34, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], mentions: [place:libano, event:senaquerib-contra-jerusalen], note: "Jehová tala los árboles altos con estruendo y el Líbano cae ante un poderoso. Perspicacia «Líbano» lo lee como figura del ejército asirio abatido; las referencias remiten a Is 37:36."}
  11:
    status: complete
