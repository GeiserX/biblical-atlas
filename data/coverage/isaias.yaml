    - {v: 23-29, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios], note: "El labrador ara, siembra cada semilla en su sitio y trilla el comino y el ajenuz con vara, sin machacar el grano. Así corrige Jehová a cada uno según lo que necesita, dice La Atalaya de 2006."}
  29:
