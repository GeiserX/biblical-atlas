    - {v: 16-17, type: prophecy, entities: [event:isaias-anuncia-desolaciones-a-las-naciones, place:quedar, place:arabia], mentions: [person:isaias], note: "En un año exacto, como el de un jornalero, acabará la gloria de Quedar y quedarán pocos arqueros. El libro de Isaías no sabe cómo se cumplió; Sargón II o Senaquerib pudieron diezmar a las tribus árabes."}
