    spans:
    - {v: 1-5, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, relation:jesus/kin/jese], mentions: [person:jese, person:jesus, event:bautismo-de-jesus, event:regreso-a-nazaret], note: "Una ramita del tocón de Jesé, con el espíritu de Jehová, juzgará con justicia. Ro 15:12 y Perspicacia «Jesé» lo aplican a Jesús, ungido al bautizarse; la nota de Mt 2:23 ve en «Nazareno» el «brote» del versículo 1."}
    - {v: 6-9, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], mentions: [event:regreso-de-537], note: "Lobo y cordero juntos; nadie hará daño en la santa montaña de Jehová, y su conocimiento llenará la tierra. «Las profecías de Isaías» lo aplica primero a los que volvieron de Babilonia y a un cumplimiento mayor."}
    - {v: "10", type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], mentions: [person:jese, person:jesus, place:jerusalen, event:regreso-de-537], note: "La raíz de Jesé será una señal para los pueblos y las naciones lo buscarán. En 537 Jerusalén hizo de señal para el resto; Ro 15:12 lo aplica a las naciones que aceptan a Jesús."}
    - {v: 11-12, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:asiria, place:egipto, place:patros, place:etiopia, place:elam, place:sinar, place:hamat], mentions: [event:regreso-de-537, event:exodo], note: "Por segunda vez, tras la salida de Egipto, Jehová recogerá al resto de su pueblo. Cus es Etiopía; la nota dice que Sinar es Babilonia. Las islas del mar no tienen ficha. Se cumplió en pequeño en 537."}
    - {v: 13-14, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:filistea, place:edom, place:moab, place:ammon], mentions: [place:israel, place:juda, event:regreso-de-537], note: "Efraín, el reino del norte, y Judá dejarán sus celos y juntos vencerán a filisteos, orientales, Edom, Moab y Ammón. Según «Las profecías de Isaías», los repatriados serán un solo pueblo."}
    - {v: 15-16, type: prophecy, entities: [event:isaias-anuncia-invasiones-y-promete-alivio, place:mar-rojo, place:rio-eufrates, place:asiria, place:egipto, event:exodo], mentions: [event:israel-cruza-el-mar-rojo, event:regreso-de-537], note: "Jehová secará el golfo del mar de Egipto, el de Suez, y el Río, que la nota llama Éufrates, en siete torrentes. Habrá un camino desde Asiria, como lo hubo cuando Israel salió de Egipto."}
  12:
    status: complete
    reviewed_on: 2026-09-30
    spans:
