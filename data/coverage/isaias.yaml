    - {v: 8-11, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios], mentions: [person:isaias], note: "Jehová manda al profeta, Isaías según «Toda Escritura», párr. 4, ponerlo por escrito como testimonio futuro, porque el pueblo pide a los videntes que callen y le cuenten halagos."}
    - {v: 12-17, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios], mentions: [event:destruccion-de-jerusalen-607], note: "Por fiarse del engaño, su error caerá como un muro combado y se romperá como un jarro. Quisieron huir a caballo: mil huirán ante uno. Las profecías de Isaías ve en el resto que quedó el cumplimiento de 607 a.e.c."}
    - {v: 18-26, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios], mentions: [place:jerusalen, event:regreso-de-537, event:caida-de-babilonia], note: "Jehová espera para mostrar favor: el pueblo vivirá en Sion, verá a su Gran Instructor, tirará sus ídolos y tendrá lluvia y pan. Las profecías de Isaías lo aplica primero a 537; las torres caídas quizá sean Babilonia."}
    - {v: 27-33, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios, place:asiria], mentions: [event:senaquerib-contra-jerusalen], note: "Jehová llega ardiendo contra las naciones mientras su pueblo canta como en noche de fiesta. Asiria temblará ante su voz; su Tófet, lugar simbólico de fuego según la nota y Perspicacia, espera también al rey."}
  31:
