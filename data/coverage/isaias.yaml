    - {v: 14-19, type: prophecy, entities: [event:isaias-anuncia-que-sion-sera-consolada], note: "La verdad tropieza en la plaza, donde juzgaban los ancianos, y se despoja a quien evita el mal. Jehová ve que nadie interviene y se arma como un guerrero; su juicio llegará hasta las islas, del oeste al este."}
