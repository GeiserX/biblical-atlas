    - {v: 6-7, type: prophecy, entities: [event:isaias-anuncia-que-sion-sera-consolada], note: "El ayuno que Jehová quiere: romper los yugos, liberar a los oprimidos, dar pan al hambriento, alojar al que no tiene casa, vestir al desnudo y no desentenderse de los parientes."}
