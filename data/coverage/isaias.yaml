    - {v: 4-6, type: poetry, entities: [event:isaias-anuncia-invasiones-y-promete-alivio], mentions: [place:jerusalen], note: "Invitación a dar gracias, invocar el nombre de Jehová y dar a conocer sus actos en toda la tierra. Sion es Jerusalén, y su población grita de gozo porque el Santo de Israel, Jehová, está en medio de ella."}
  13:
    status: complete
