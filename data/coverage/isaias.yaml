    - {v: 2-4, type: prophecy, entities: [event:isaias-anuncia-la-desolacion-de-moab, place:dibon, place:nebo, place:medeba, place:hesbon, place:eleale, place:jahaz, place:moab, event:isaias-anuncia-desolaciones-a-las-naciones], note: "Moab sube a llorar a la Casa (una nota lee el Templo, sin nombre) y a los lugares altos de Dibón, y se rapa por Nebo y Medebá. Hesbón y Elealé gritan hasta Jáhaz. Perspicacia: entonces eran ciudades moabitas."}
    - {v: 5-7, type: prophecy, entities: [event:isaias-anuncia-la-desolacion-de-moab, place:zoar, place:eglat-selisiya, place:luhit, place:horonaim, place:nimrim, place:moab, event:isaias-anuncia-desolaciones-a-las-naciones], note: "Los fugitivos de Moab huyen hasta Zóar y Eglat-Selisiyá, suben llorando a Luhit y gritan camino de Horonaim. Se secan las aguas de Nimrim. El valle de los álamos no es nombre propio en la TNM ni tiene artículo."}
    - {v: 8-9, type: prophecy, entities: [event:isaias-anuncia-la-desolacion-de-moab, place:eglaim, place:beer-elim, place:dimon, place:moab, event:isaias-anuncia-desolaciones-a-las-naciones], note: "El llanto llega a Eglaim y a Beer-Elim; las aguas de Dimón se tiñen de sangre y un león aguarda a los que escapen. Perspicacia duda si Dimón es Dibón o Madmén."}
  16:
