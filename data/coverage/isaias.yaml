    - {v: 15-19, type: poetry, entities: [event:isaias-anuncia-que-jehova-hermoseara-a-sion], mentions: [person:abrahan, person:jacob, place:babilonia, place:jerusalen, event:destruccion-de-jerusalen-607], note: "Empieza la oración de arrepentimiento de los desterrados en Babilonia. Aunque sus antepasados Abrahán e Israel, el patriarca Jacob, no los reconocieran, Jehová es su Padre y Recomprador. Los enemigos pisotearon su santuario en 607."}
  64:
