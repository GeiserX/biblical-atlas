    - {v: 3-5, type: prophecy, entities: [event:isaias-anuncia-la-desolacion-de-moab, place:moab, event:isaias-anuncia-desolaciones-a-las-naciones], mentions: [person:david, person:jesus, event:pacto-con-david], note: "Moab debe esconder a los dispersados hasta que acabe el opresor. Luego se afirma un trono en la tienda de David: «Profecía de Isaías», cap. 15, lo aplica a Jesús, rey del linaje de David, y al pacto con David."}
    - {v: 6-8, type: prophecy, entities: [event:isaias-anuncia-la-desolacion-de-moab, place:moab, place:quir-de-moab, place:hesbon, place:sibma, place:jazer, event:isaias-anuncia-desolaciones-a-las-naciones], note: "El orgullo de Moab no le vale: le harán llorar Quir-Haréset y sus tortas de pasas. Se secan los campos de Hesbón y las vides de Sibmá, que llegaban a Jazer, al desierto y a un mar sin nombre."}
    - {v: 9-12, type: prophecy, entities: [event:isaias-anuncia-la-desolacion-de-moab, person:isaias, place:sibma, place:jazer, place:hesbon, place:eleale, place:quir-de-moab, place:moab, event:isaias-anuncia-desolaciones-a-las-naciones], note: "El profeta llora por Sibmá, Jazer, Hesbón y Elealé: calla el canto de la vendimia. Según «Profecía de Isaías», su interior vibra como un arpa por Moab. El santuario donde Moab ora en vano no tiene nombre."}
    - {v: 13-14, type: prophecy, entities: [event:isaias-anuncia-la-desolacion-de-moab, place:moab, event:isaias-anuncia-desolaciones-a-las-naciones], note: "Plazo: en tres años exactos, contados como los de un jornalero, la gloria de Moab caerá. Perspicacia recuerda tributos de reyes moabitas a Asiria, pero dice que el cumplimiento no se puede fechar."}
  17:
