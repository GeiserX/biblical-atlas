    - {v: 6-16, type: prophecy, entities: [event:isaias-anuncia-la-ruina-de-babilonia], mentions: [place:ofir, event:caida-de-babilonia], note: "Se acerca el día de Jehová: pánico, astros apagados, soberbios humillados y hombres más escasos que el oro de Ofir. Los extranjeros huyen a sus tierras. La nota del v. 10 dice que Kesil quizá sea Orión."}
    - {v: 17-22, type: prophecy, entities: [event:isaias-anuncia-la-ruina-de-babilonia, place:babilonia, place:media], mentions: [place:caldea, place:sodoma, place:gomorra, event:destruccion-de-sodoma-y-gomorra, place:arabia, person:ciro, event:caida-de-babilonia, event:babilonia-en-ruinas, period:potencia-medopersa], note: "Jehová enviará a los medos, que desprecian la plata y el oro; Perspicacia incluye ahí a los persas, y Ciro los guio en 539. Babilonia, orgullo caldeo, acabará como Sodoma y Gomorra, sin árabes ni rebaños, solo fieras."}
  14:
    status: complete
    reviewed_on: 2026-09-30
    spans:
    - {v: 1-2, type: prophecy, entities: [event:isaias-anuncia-la-ruina-de-babilonia], mentions: [event:regreso-de-537], note: "Jehová volverá a compadecerse de Jacob, es decir, de todo Israel, y lo asentará en su suelo con extranjeros que se le unen. «Las profecías de Isaías» lo aplica al regreso que abrió la caída de Babilonia."}
    - {v: 3-11, type: prophecy, entities: [event:isaias-anuncia-la-ruina-de-babilonia], mentions: [period:potencia-babilonica, person:nabucodonosor-ii, person:nabonido, person:belsasar, place:libano, event:caida-de-babilonia], note: "Liberado, Israel se mofará del rey de Babilonia: su vara se rompe, la tierra descansa, los cedros del Líbano respiran y la Tumba lo recibe entre gusanos. Para jw.org ese rey es la dinastía, de Nabucodonosor a Nabonido y Belsasar."}
    - {v: 12-21, type: prophecy, entities: [event:isaias-anuncia-la-ruina-de-babilonia], mentions: [period:potencia-babilonica, person:nabucodonosor-ii, place:jerusalen], note: "El resplandeciente, hijo del amanecer, quiso reinar sobre la montaña de reunión y acaba sin tumba. Perspicacia lo aplica a la dinastía de Babilonia, cuya ambición compara con la de Satanás, y ve en esa montaña el monte Sion."}
    - {v: 22-23, type: prophecy, entities: [event:isaias-anuncia-la-ruina-de-babilonia, place:babilonia], mentions: [event:babilonia-en-ruinas], note: "Jehová borrará de Babilonia su nombre, su resto y su descendencia; la dejará a los puercoespines y a los pantanos, y la barrerá del todo. Perspicacia ve cumplida la desolación en sus ruinas actuales."}
    - {v: 24-27, type: prophecy, entities: [event:isaias-anuncia-la-ruina-de-babilonia], mentions: [place:asiria, period:potencia-asiria, event:senaquerib-contra-jerusalen], note: "Jehová jura quebrar al asirio en sus montañas y librar a su pueblo de su yugo; nadie hará volver su mano. Según «Las profecías de Isaías», la amenaza asiria acabó poco después; las referencias remiten a la derrota de 732."}
    - {v: 28-32, type: prophecy, entities: [event:isaias-declara-contra-filistea, place:filistea, person:acaz, event:isaias-anuncia-desolaciones-a-las-naciones], mentions: [person:uzias, person:ezequias, place:jerusalen], note: "Declaración contra Filistea del año en que murió Acaz. Según «Las profecías de Isaías», el bastón roto es Uzías y la serpiente veloz nacida de su raíz, Ezequías. Los pobres del pueblo se refugiarán en Sion."}
  15:
