    - {v: 7-11, type: poetry, entities: [event:isaias-anuncia-el-juicio-y-la-salvacion-de-jehova], mentions: [person:isaias], note: "Isaías anhela de noche a Jehová y su nombre: sus juicios enseñan justicia, pero el malvado, aunque reciba favor, no la aprende ni ve la majestad de Jehová. El fuego consumirá a sus enemigos."}
    - {v: 12-15, type: poetry, entities: [event:isaias-anuncia-el-juicio-y-la-salvacion-de-jehova], mentions: [event:destruccion-de-jerusalen-607, event:regreso-de-537, place:babilonia, event:caida-de-babilonia], note: "Otros amos dominaron al pueblo, pero Jehová los deja muertos y sin memoria, y agranda la nación. «Las profecías de Isaías» nombra el destierro de 607, la vuelta de 537 y la caída de Babilonia ante medos y persas."}
    - {v: 16-19, type: prophecy, entities: [event:isaias-anuncia-el-juicio-y-la-salvacion-de-jehova], mentions: [place:babilonia, event:regreso-de-537], note: "En su angustia el pueblo oró; como una parturienta, solo dio a luz viento. Pero sus muertos vivirán y los del polvo gritarán de alegría. «Las profecías de Isaías» lo ve cumplido cuando Judá volvió de Babilonia en 537."}
    - {v: 20-21, type: prophecy, entities: [event:isaias-anuncia-el-juicio-y-la-salvacion-de-jehova], mentions: [event:caida-de-babilonia], note: "Jehová manda a su pueblo encerrarse un momento en sus cuartos mientras sale a pedir cuentas y la tierra descubre la sangre derramada. «Las profecías de Isaías» ve quizá un primer cumplimiento en 539, cuando Ciro tomó Babilonia."}
  27:
