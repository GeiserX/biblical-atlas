    - {v: 10-12, type: poetry, entities: [event:isaias-anuncia-que-jehova-hermoseara-a-sion, place:jerusalen], mentions: [place:babilonia, event:destruccion-de-jerusalen-607, event:regreso-de-537], note: "Las ciudades santas están desiertas, Sion y Jerusalén desoladas y quemado el templo donde alabaron sus padres. La publicación lo sitúa tras 607, con el pueblo en Babilonia; Jehová respondió con la vuelta de 537."}
  65:
