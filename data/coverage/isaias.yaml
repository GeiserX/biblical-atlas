    - {v: 5-6, type: prophecy, entities: [event:isaias-anuncia-nuevos-cielos-y-una-nueva-tierra], mentions: [place:jerusalen, event:destruccion-de-jerusalen-607], note: "Los que odian a sus hermanos fieles por el nombre de Jehová quedarán avergonzados. El ruido que sale de la ciudad y del templo es, según Las profecías de Isaías II, el asalto de Babilonia a Jerusalén en 607."}
    - {v: 7-9, type: prophecy, entities: [event:isaias-anuncia-nuevos-cielos-y-una-nueva-tierra], mentions: [place:jerusalen, place:babilonia, event:regreso-de-537], note: "Sion, que es Jerusalén, da a luz a sus hijos antes de tener dolores: una nación nace de golpe. Las profecías de Isaías II lo ve cumplido en 537, cuando los cautivos dejaron Babilonia y llegaron en pocos meses."}
    - {v: 10-14, type: prophecy, entities: [event:isaias-anuncia-nuevos-cielos-y-una-nueva-tierra, place:jerusalen], mentions: [event:regreso-de-537], note: "Quienes aman a Jerusalén se alegrarán con ella. Jehová le dará paz como un río y la gloria de las naciones, y consolará a su pueblo como una madre a su hijo. Primero se cumple con los repatriados de 537."}
    - {v: 15-17, type: prophecy, entities: [event:isaias-anuncia-nuevos-cielos-y-una-nueva-tierra], mentions: [event:destruccion-de-jerusalen-607], note: "Jehová viene como fuego, con carros como un viento de tormenta, a juzgar con la espada; mueren los que se purifican para los jardines de ídolos y comen cerdo y ratones. Las profecías de Isaías II lo pone en 607."}
    - {v: 18-21, type: prophecy, entities: [event:isaias-anuncia-nuevos-cielos-y-una-nueva-tierra, place:tarsis, place:pul, place:lud, place:tubal, place:grecia, place:jerusalen], mentions: [event:regreso-de-537, event:pentecostes-33], note: "Jehová enviará sobrevivientes a Tarsis, Pul, Lud, Tubal, Javán (Grecia) y las islas lejanas; traerán a sus hermanos a Jerusalén como ofrenda y habrá nuevos sacerdotes y levitas. Algunos de esos hermanos estaban en Pentecostés de 33."}
    - {v: 22-24, type: prophecy, entities: [event:isaias-anuncia-nuevos-cielos-y-una-nueva-tierra], note: "Los nuevos cielos y la nueva tierra durarán, y todos vendrán a adorar cada luna nueva y cada sábado. Fuera quedarán los cadáveres de los rebeldes, comidos por gusanos y fuego; Jesús alude a ello en Mr 9:48."}
