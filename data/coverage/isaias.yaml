    - {v: 16-19, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios, place:jerusalen], mentions: [person:jesus, place:babilonia, event:destruccion-de-jerusalen-607], note: "Jehová pone en Sion una piedra probada, angular, y quien tenga fe no se asustará: Perspicacia «Piedra angular» la aplica a Jesucristo (1Pe 2:6). La riada, las tropas de Babilonia, acabará con su pacto con la Muerte."}
