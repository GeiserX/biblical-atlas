    - {v: 5-8, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios, place:jerusalen], mentions: [event:senaquerib-contra-jerusalen, person:senaquerib, event:caida-de-babilonia], note: "Las naciones que luchan contra Ariel y el monte Sion quedarán como el hambriento que sueña que come. Las profecías de Isaías pone de ejemplo el ejército de Senaquerib; las referencias remiten a la caída de Babilonia."}
    - {v: 9-12, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios], note: "Jehová ha dormido a los profetas y videntes del pueblo: la visión es para ellos un libro sellado que nadie lee. Ro 11:8 aplica el versículo 10 a los judíos del siglo primero."}
    - {v: 13-14, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios], mentions: [event:tradiciones-humanas, person:jesus], note: "El pueblo honra a Jehová solo de boca y lo teme por reglas humanas; él hará cosas asombrosas y sus sabios perderán su sabiduría. Jesús aplica el 13 a los fariseos (Mt 15:7-9); 1Co 1:19 cita el 14."}
    - {v: 15-16, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios], note: "Ay de quienes esconden sus planes a Jehová creyendo que nadie los ve: es como si el barro dijera de su alfarero que no lo hizo o que no entiende nada."}
    - {v: 17-24, type: prophecy, entities: [event:isaias-anuncia-la-indignacion-y-las-bendiciones-de-dios], mentions: [place:libano, person:abrahan, person:jacob], note: "Pronto el Líbano será un huerto, los sordos oirán el libro y los tiranos acabarán. Jehová, que rescató a Abrahán, promete a la casa de Jacob, el pueblo, que ya no pasará vergüenza; alude al Santo de Jacob."}
  30:
