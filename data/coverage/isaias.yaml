    - {v: 12-14, type: prophecy, entities: [event:isaias-profetiza-contra-damasco, event:isaias-anuncia-desolaciones-a-las-naciones], note: "Muchos pueblos rugen como el mar, pero Jehová los reprende y huyen como paja ante el viento. Antes del alba ya no existen quienes saquean a su pueblo."}
  18:
