    - {v: 3-6, type: prophecy, entities: [event:isaias-profetiza-contra-etiopia, event:isaias-anuncia-desolaciones-a-las-naciones], mentions: [event:asurbanipal-saquea-no-amon, person:asurbanipal], note: "Jehová observa tranquilo y poda la viña antes de la cosecha; aves y fieras comen lo cortado. Las profecías de Isaías I lo ve cumplido cuando Asiria tomó Tebas con Asurbanipal y acabó el dominio etíope en Egipto."}
    - {v: "7", type: prophecy, entities: [event:isaias-profetiza-contra-etiopia, event:isaias-anuncia-desolaciones-a-las-naciones], mentions: [place:jerusalen], note: "Ese mismo pueblo alto y temido llevará un regalo a Jehová al monte Sion, que es Jerusalén."}
  19:
