    - {v: 19-21, type: prophecy, entities: [event:isaias-anuncia-que-sion-sera-consolada], note: "Jehová crea el fruto de los labios y da paz al que está lejos y al que está cerca; los malvados son un mar revuelto que arroja algas y lodo. Ef 2:17 retoma la frase."}
