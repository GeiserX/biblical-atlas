    - {v: 5-10, type: prophecy, entities: [place:rio-nilo, event:isaias-anuncia-desolaciones-a-las-naciones], mentions: [place:egipto], note: "El agua y el río se secarán: se pudren cañas y juncos, se pierden las siembras de las orillas y sufren pescadores, trabajadores del lino y tejedores. Perspicacia lo toma como figura del juicio sobre Egipto."}
    - {v: 11-15, type: prophecy, entities: [place:zoan, place:menfis, event:isaias-anuncia-desolaciones-a-las-naciones], mentions: [place:egipto], note: "Los príncipes de Zoan y de Nof, que la nota al pie llama Menfis, son necios, y los sabios del faraón, sin nombre, no aciertan. Perspicacia ve probada esa necedad en la conquista asiria de Egipto."}
    - {v: 16-17, type: prophecy, entities: [event:isaias-anuncia-desolaciones-a-las-naciones], mentions: [place:egipto, place:juda], note: "Ese día los egipcios temblarán ante la mano que Jehová alza contra ellos, y oír hablar de la tierra de Judá los llenará de miedo por lo que él ha decidido."}
    - {v: 18-22, type: prophecy, entities: [event:isaias-anuncia-desolaciones-a-las-naciones], mentions: [place:egipto, place:canaan, place:on, person:jesus], note: "Cinco ciudades hablarán la lengua de Canaán; la de Demolición quizá es On, según Perspicacia. Jehová tendrá altar y columna. La profecía de Isaías aplica esto a judíos refugiados (Jer 43, 44) y ve en el salvador a Jesucristo."}
    - {v: 23-25, type: prophecy, entities: [place:asiria, event:isaias-anuncia-desolaciones-a-las-naciones], mentions: [place:egipto, event:regreso-de-537], note: "Un camino unirá Egipto y Asiria, que servirán juntos a Dios, e Israel, el pueblo, será el tercero. La profecía de Isaías ve un primer cumplimiento en los desterrados que volvieron tras caer Babilonia."}
  20:
