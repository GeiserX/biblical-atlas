    - {v: 17-19, type: prophecy, entities: [event:isaias-anuncia-nuevos-cielos-y-una-nueva-tierra, place:jerusalen], mentions: [person:zorobabel, person:josue-sumo-sacerdote, event:regreso-de-537], note: "Jehová creará nuevos cielos y una nueva tierra y hará de Jerusalén una alegría. En 537 los cielos fueron el gobierno de Zorobabel y del sumo sacerdote Josué, y la tierra, el pueblo que volvió. 2Pe 3:13 retoma la promesa."}
    - {v: 20-25, type: prophecy, entities: [event:isaias-anuncia-nuevos-cielos-y-una-nueva-tierra], mentions: [event:regreso-de-537], note: "Nadie morirá antes de tiempo; construirán casas y comerán de sus viñas, vivirán tanto como un árbol y Jehová responderá antes de que llamen. El lobo y el cordero pacerán juntos. Primero se cumple con los repatriados de 537."}
  66:
