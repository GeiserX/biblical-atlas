    - {v: 6-9, type: prophecy, entities: [event:isaias-anuncia-el-juicio-y-la-salvacion-de-jehova], note: "Jehová dará en esta montaña un banquete de manjares y buen vino a los pueblos, quitará el velo que los envuelve, se tragará la muerte y secará las lágrimas. La Atalaya de 2006 ve en el velo pecado y muerte."}
    - {v: 10-12, type: prophecy, entities: [event:isaias-anuncia-el-juicio-y-la-salvacion-de-jehova, place:moab], note: "La mano de Jehová reposará en esta montaña y Moab será pisoteado como paja en el estiércol; su orgullo y sus murallas altas caerán al polvo. «Las profecías de Isaías» lo explica por su vieja enemistad con Israel."}
  26:
