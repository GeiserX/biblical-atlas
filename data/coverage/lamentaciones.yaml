# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: lamentaciones
chapters:
  1:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, place:jerusalen], mentions: [person:jeremias-profeta, event:destruccion-de-jerusalen-607], note: "Primer poema acróstico, como los capítulos 1 a 4 según la nota. La ciudad populosa, señora de provincias, queda sola como viuda que llora. La Atalaya de 1988 cuenta a Egipto entre los amantes que le fallaron."}
    - {v: 3-6, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:destruccion-de-jerusalen-607, place:juda, place:jerusalen], mentions: [period:destierro-y-regreso, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, event:nabucodonosor-ejecuta-en-ribla-a-los-principales-de-jerusalen], note: "Judá parte al destierro entre las naciones y nadie sube ya a Sion, es decir, a Jerusalén, para las fiestas. Sus niños van cautivos y sus príncipes huyen agotados. Referencias: 2Re 24:14, 15; 25:21; Jer 39:9."}
    - {v: 7-9, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, place:jerusalen], mentions: [event:sitio-de-jerusalen-609, event:destruccion-de-jerusalen-607], note: "Afligida y sin hogar, Jerusalén recuerda sus riquezas de antes; al caer, sus enemigos se burlaron. Su pecado la volvió impura y quienes la honraban la desprecian. Las referencias llevan al cerco (Jer 52:4) y a Sl 137:7."}
    - {v: 10-11, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:destruccion-de-jerusalen-607, place:jerusalen], mentions: [event:sitio-de-jerusalen-609, event:sedequias-huye-y-lo-capturan-cerca-de-jerico], note: "El enemigo saquea sus tesoros y entran naciones en el santuario; La Atalaya de 1988 habla de extranjeros que contaminan el templo. El pueblo cambia sus bienes por pan, hambre que las referencias unen al cerco (Jer 52:6)."}
    - {v: 12-16, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:destruccion-de-jerusalen-607, place:jerusalen], mentions: [place:juda, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia], note: "Desde aquí habla Jerusalén personificada, según Perspicacia. Jehová la hizo sufrir el día de su furia. La Atalaya de 2007 explica que pisar el lagar de la hija virgen de Judá es la matanza babilonia en la ciudad."}
    - {v: 17-19, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, place:jerusalen], mentions: [event:sitio-de-jerusalen-609, event:sedequias-huye-y-lo-capturan-cerca-de-jerico], note: "Sion tiende las manos y nadie la consuela; Jehová mandó contra Jacob, aquí el pueblo, a los enemigos de alrededor. Jerusalén admite su rebeldía. Sacerdotes y ancianos mueren buscando comida (referencias: 2Re 25:3; Jer 38:9)."}
    - {v: 20-22, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen], mentions: [event:caida-de-babilonia], note: "Jerusalén, angustiada, ve morir a los suyos por la espada fuera y por la muerte dentro. Pide a Jehová el día anunciado contra sus enemigos alegres. Las referencias remiten a la caída de Babilonia (Is 13:19; Jer 25:12-14)."}
  2:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-5, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:destruccion-de-jerusalen-607, place:jerusalen, place:juda], mentions: [person:jeremias-profeta], note: "Segundo poema; habla Jeremías, según Perspicacia. Jehová, como un enemigo, derriba la hermosura de Israel y las fortalezas de la hija de Judá. Israel y Jacob son el pueblo. La Atalaya de 2007 ve el templo en el banquillo."}
    - {v: 6-7, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:destruccion-de-jerusalen-607, place:jerusalen], mentions: [event:nabucodonosor-ejecuta-en-ribla-a-los-principales-de-jerusalen], note: "Jehová trata su cabaña, que La Atalaya identifica con el templo, como choza de huerto. Borra fiestas y sábados, desecha altar y santuario y no perdona a rey ni sacerdote (referencia: Jer 52:24, 27). El enemigo grita en su casa."}
    - {v: 8-9, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:destruccion-de-jerusalen-607, place:jerusalen], mentions: [event:nabucodonosor-juzga-a-sedequias-en-ribla, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, event:daniel-llevado-a-babilonia], note: "Jehová mide la muralla de la hija de Sion para derribarla y hunde sus puertas. El rey, sin nombre, y los príncipes están entre las naciones (referencias: 2Re 24:15; 25:7; Da 1:3, 6). Ya no hay ley ni visiones."}
    - {v: 10-13, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, place:jerusalen, person:jeremias-profeta], mentions: [event:sitio-de-jerusalen-609, event:sedequias-huye-y-lo-capturan-cerca-de-jerico, event:destruccion-de-jerusalen-607], note: "Los ancianos de Sion callan sentados en el polvo y las muchachas de Jerusalén bajan la cabeza. Jeremías, en primera persona, llora por los niños que desfallecen de hambre en las plazas. Nada se compara con esa caída."}
    - {v: 14-17, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, place:jerusalen], note: "Los profetas de la ciudad le anunciaron visiones falsas y no denunciaron su culpa. Los que pasan se burlan de la que llamaban perfecta en belleza, y sus enemigos celebran. Jehová cumplió lo dicho; La Atalaya remite a Le 26:17."}
    - {v: 18-19, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, place:jerusalen], mentions: [event:sitio-de-jerusalen-609, event:sedequias-huye-y-lo-capturan-cerca-de-jerico], note: "Se pide a la muralla de la hija de Sion que llore día y noche sin descanso y que levante las manos a Jehová por los niños que mueren de hambre en cada esquina."}
    - {v: 20-22, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:destruccion-de-jerusalen-607], mentions: [event:sitio-de-jerusalen-609, event:sedequias-huye-y-lo-capturan-cerca-de-jerico], note: "Ruego a Jehová: madres que comen a sus hijos, lo que Perspicacia ve cumplir Dt 28:53; sacerdotes y profetas muertos en el santuario; cadáveres en las calles. Nadie escapó el día de su furia."}
  3:
    status: complete
    reviewed_on: 2026-10-13
    note: "Tercer poema: cada letra hebrea abre tres versículos seguidos. Según Perspicacia, Jeremías pone sus sentimientos en boca de la nación, figurada como un hombre fuerte, y mantiene la esperanza en Jehová."
    spans:
    - {v: 1-9, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta], mentions: [event:destruccion-de-jerusalen-607, event:nabucodonosor-juzga-a-sedequias-en-ribla], note: "Un hombre cuenta cómo la vara de Jehová lo dejó a oscuras, cercado y atado con grilletes de cobre. Perspicacia dice que Jeremías da voz a la nación; la referencia del v. 7 lleva a Sedequías encadenado (Jer 39:7)."}
    - {v: 10-18, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta], mentions: [event:destruccion-de-jerusalen-607], note: "Jehová lo acecha como oso o león, lo hace diana de sus flechas y lo harta de ajenjo; los pueblos se burlan de él. Perspicacia ve en la grava del v. 16 el duro trato que Babilonia dio a Jerusalén."}
    - {v: 19-24, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta], note: "Pide a Jehová que recuerde su desgracia y decide esperar: el pueblo sigue vivo por su amor leal, sus misericordias se renuevan cada mañana y él es su parte. «Toda Escritura» enlaza el v. 24 con Sl 119:57."}
    - {v: 25-33, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta], note: "Tres versículos seguidos empiezan por «Bueno»: Jehová lo es con quien lo busca, y conviene aguardar callado su salvación y cargar el yugo de joven. Él no rechaza para siempre y, tras el dolor, se compadece."}
    - {v: 34-39, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta], note: "Jehová no consiente que se pisotee a los presos ni que se niegue justicia a nadie. Nada ocurre sin su orden, y quien sufre por su propio pecado no tiene motivo de queja."}
    - {v: 40-47, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta], mentions: [event:destruccion-de-jerusalen-607], note: "Invita a revisar la conducta y volver a Jehová. El pueblo confiesa su rebeldía: Dios no ha perdonado, una nube frena sus oraciones y los enemigos lo desprecian. «Toda Escritura» une el v. 42 con Da 9:5-14."}
    - {v: 48-51, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta], mentions: [event:destruccion-de-jerusalen-607], note: "Llora sin descanso por la ruina de su pueblo y de las hijas de su ciudad hasta que Jehová mire desde el cielo. «Toda Escritura» ve en estas lágrimas una expresión propia de Jeremías (Jer 9:1)."}
    - {v: 52-66, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta], note: "Sin motivo, sus enemigos lo cazaron y lo hundieron en la fosa. Desde allí clamó, y Jehová se le acercó para quitarle el miedo. Le ruega que vea sus burlas y planes, les dé su merecido y los elimine."}
  4:
    status: complete
    reviewed_on: 2026-10-13
    note: "Cuarto poema, acróstico. Según Perspicacia, Jeremías sigue con su lamento por el efecto del sitio; La Atalaya de 1988 añade la captura del rey y el aviso a Edom."
    spans:
    - {v: 1-2, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:destruccion-de-jerusalen-607, person:jeremias-profeta, place:jerusalen], note: "El oro fino se apaga y las piedras santas ruedan por las esquinas; «Toda Escritura» lo lee como la gloria perdida del templo. Los hijos de Sion, que valían oro, ya cuentan como cacharros de alfarero."}
    - {v: 3-10, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta], mentions: [event:sitio-de-jerusalen-609, event:sedequias-huye-y-lo-capturan-cerca-de-jerico, place:sodoma, event:destruccion-de-sodoma-y-gomorra], note: "Hambre del sitio, que Perspicacia «Hambre» fecha en 609-607: niños sin pan, nazareos consumidos y madres que cuecen a sus hijos. El castigo supera al de Sodoma, caída de golpe. Los nazareos son un grupo, sin ficha."}
    - {v: 11-16, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:destruccion-de-jerusalen-607, event:sedequias-huye-y-lo-capturan-cerca-de-jerico, person:jeremias-profeta, place:jerusalen], mentions: [event:nabucodonosor-ejecuta-en-ribla-a-los-principales-de-jerusalen], note: "Jehová enciende en Sion un fuego hasta los cimientos y el enemigo cruza las puertas de Jerusalén. La culpa es de profetas y sacerdotes que vertieron sangre justa; la referencia del v. 16 lleva a los sacerdotes ejecutados en Riblá."}
    - {v: 17-20, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, event:sedequias-huye-y-lo-capturan-cerca-de-jerico, person:jeremias-profeta, person:sedequias], note: "Aguardaron en vano a una nación incapaz de salvarlos; las referencias llevan al ejército del faraón (Jer 37:7). Babilonia los persigue por montes y desierto y atrapa al ungido de Jehová, el rey Sedequías según La Atalaya de 1988."}
    - {v: 21-22, type: prophecy, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, person:jeremias-profeta, place:edom, place:uz, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607, person:nabonido, event:regreso-de-537], note: "Edom, que vive en la tierra de Uz, festeja, pero también beberá la copa; Perspicacia «Edom» ve su caída con Nabonido. La culpa de Sion está pagada y no volverá al destierro: «Toda Escritura» lo une a su vuelta."}
  5:
    status: complete
    reviewed_on: 2026-10-13
    note: "Quinto poema: una oración de 22 versículos que no sigue el alfabeto. Perspicacia dice que hablan los habitantes de Jerusalén; La Atalaya de 1988 la atribuye a Jeremías."
    spans:
    - {v: 1-5, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen], mentions: [person:jeremias-profeta], note: "Piden a Jehová que mire su deshonra: la herencia y las casas son de extranjeros, quedan huérfanos y madres como viudas, compran su propia agua y su leña, y los acosan sin tregua."}
    - {v: 6-10, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen], mentions: [place:egipto, place:asiria, event:sitio-de-jerusalen-609, event:sedequias-huye-y-lo-capturan-cerca-de-jerico], note: "Tendieron la mano a Egipto y Asiria por pan, la confianza en naciones paganas que Perspicacia «Asiria» censura. Pagan los errores de sus antepasados, los gobiernan siervos y el hambre del sitio les abrasa la piel."}
    - {v: 11-14, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, place:jerusalen, place:juda], mentions: [event:nabucodonosor-juzga-a-sedequias-en-ribla], note: "Violan a esposas en Sion y a vírgenes en las ciudades de Judá. Cuelgan de la mano a los príncipes; la referencia lleva a los nobles muertos en Riblá. Jóvenes al molino, ancianos fuera de la puerta."}
    - {v: 15-18, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607, event:miqueas-profetiza-contra-samaria-y-jerusalen], note: "Se acaban el baile y la alegría y cae la corona por su pecado. El monte Sion, que es Jerusalén, queda desierto y lo recorren zorros; la referencia lleva a Jer 26:18, que cita el aviso de Miqueas."}
    - {v: 19-22, type: poetry, entities: [event:jeremias-lamenta-la-destruccion-de-jerusalen], mentions: [person:david, person:salomon, event:pacto-con-david], note: "Jehová reina siempre. Le ruegan que los haga volver a él y renueve los días de antes, que «Toda Escritura» ve en el reinado de David y Salomón y el pacto del reino; aun así, sigue airado."}
