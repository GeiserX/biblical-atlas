# biblical-earth: cobertura de un libro. Formato en data/coverage/README.md.
book: zacarias
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: prophecy, entities: [event:primer-mensaje-de-zacarias, person:zacarias-profeta, person:berekias-hijo-de-ido, person:ido-padre-de-berekias, relation:zacarias-profeta/kin/berekias-hijo-de-ido, relation:berekias-hijo-de-ido/kin/ido-padre-de-berekias, relation:zacarias-profeta/holds_office/-], mentions: [person:dario-i, period:dario-i, event:obra-del-templo-prohibida-522, event:se-reanuda-la-obra-del-templo-520], note: "Encabezamiento: en el mes octavo del año segundo de Darío, el profeta Zacarías («Jehová ha recordado», según la nota), hijo de Berekías y nieto de Idó, recibe la palabra de Jehová. Las referencias remiten a Esd 4:24 y 5:1."}
    - {v: 2-6, type: prophecy, entities: [event:primer-mensaje-de-zacarias], mentions: [event:destruccion-de-jerusalen-607], note: "Jehová se enojó mucho con los antepasados, que desoyeron a los profetas de antes. Pide al pueblo que vuelva a él para volver él a ellos. Sus decretos alcanzaron a aquellos padres; las referencias remiten a 2Cr 36:17."}
    - {v: 7-11, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:zacarias-profeta, person:berekias-hijo-de-ido, person:ido-padre-de-berekias, relation:zacarias-profeta/kin/berekias-hijo-de-ido, relation:berekias-hijo-de-ido/kin/ido-padre-de-berekias], mentions: [person:dario-i, period:dario-i, event:obra-del-templo-prohibida-522], note: "Día 24 de sebat, año segundo de Darío. De noche, Zacarías ve a un jinete en caballo rojo entre mirtos, con más caballos detrás; la tierra está en calma. Perspicacia «Mirto» pone esos mirtos, al parecer, cerca de Jerusalén."}
    - {v: 12-17, type: vision, entities: [event:visiones-nocturnas-de-zacarias, place:jerusalen, place:juda], mentions: [event:destruccion-de-jerusalen-607, event:templo-terminado-515], note: "El ángel de Jehová pregunta hasta cuándo durará su enojo con Jerusalén y Judá tras 70 años (Jer 25:11, 12). Jehová volverá con misericordia: su casa se construirá (Esd 6:14, 15) y Sion, que es Jerusalén, será consolada."}
    - {v: 18-21, type: vision, entities: [event:visiones-nocturnas-de-zacarias, place:juda, place:jerusalen], mentions: [place:israel, event:caida-de-samaria, event:destruccion-de-jerusalen-607], note: "Cuatro cuernos dispersaron a Judá, Israel y Jerusalén, y cuatro artesanos vienen a derribarlos. Perspicacia «Cuerno» ve en los cuernos reyes y dinastías; las referencias remiten a las deportaciones de Asiria y de Babilonia."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:zacarias-profeta, place:jerusalen], note: "Un hombre va a medir Jerusalén, que será ciudad abierta con Jehová como muro de fuego. Perspicacia «Zacarías», núm. 20, ve en el joven de 2:4 al profeta; «Zacarías, Libro de» y La Atalaya de 2007, al que mide."}
    - {v: 6-9, type: prophecy, entities: [event:visiones-nocturnas-de-zacarias, place:babilonia], mentions: [place:jerusalen], note: "Jehová llama a huir de la tierra del norte a los que dispersó a los cuatro vientos: Sion, que vive con la hija de Babilonia, debe escapar. Quien los toca le toca la niña del ojo; sus saqueadores serán saqueados."}
    - {v: 10-13, type: prophecy, entities: [event:visiones-nocturnas-de-zacarias, place:juda, place:jerusalen], note: "Que la hija de Sion grite de alegría: Jehová vendrá a residir en ella y muchas naciones se le unirán como pueblo suyo. Tomará a Judá como su parte en el suelo santo y volverá a elegir a Jerusalén."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:zacarias-profeta, person:josue-sumo-sacerdote, person:satanas, period:sumo-sacerdocio-de-josue], mentions: [place:jerusalen], note: "Cuarta visión. Josué, sumo sacerdote, está ante el ángel de Jehová y Satanás, a su derecha, se le opone; el ángel lo reprende. Le cambian la ropa sucia, señal de culpa perdonada, y el profeta pide un turbante limpio."}
    - {v: 6-7, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:josue-sumo-sacerdote], note: "El ángel da a Josué la condición de Jehová: si anda en sus caminos y cumple su servicio, juzgará en su casa, vigilará sus patios y tendrá acceso entre los que están allí."}
    - {v: 8-10, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:josue-sumo-sacerdote, period:sumo-sacerdocio-de-josue], mentions: [person:jesus], note: "Josué y sus compañeros son una señal: Jehová traerá a su siervo Brote, Jesucristo según Perspicacia «Rama, brote». Una piedra de siete ojos; la culpa del país se quitará en un día, y habrá paz bajo vides e higueras."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:zacarias-profeta], note: "Quinta visión. El ángel despierta a Zacarías y le enseña un candelabro de oro con un tazón arriba y siete lámparas, entre dos olivos. Según La Atalaya de 2022, el aceite de los árboles mantiene las lámparas siempre encendidas."}
    - {v: 6-7, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:zorobabel], note: "Mensaje para Zorobabel: la obra se hará por el espíritu de Jehová, no a fuerza de ejércitos. La gran montaña, los obstáculos según La Atalaya de 2007, quedará llana ante él, y sacará la última piedra entre aclamaciones."}
    - {v: 8-10, type: vision, entities: [event:visiones-nocturnas-de-zacarias, event:fundamento-del-templo-536, event:templo-terminado-515, person:zorobabel], note: "Zorobabel puso los cimientos del templo y lo acabará; los que despreciaron aquel modesto comienzo se alegrarán al ver la plomada en su mano. Perspicacia «Plomada» lo ve cumplido en 515. Los siete son los ojos de Jehová."}
    - {v: 11-14, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:zacarias-profeta, person:josue-sumo-sacerdote, person:zorobabel, relation:josue-sumo-sacerdote/accompanies/zorobabel], note: "Zacarías pregunta por los dos olivos y por sus ramas, que dejan caer aceite dorado. Son los dos ungidos junto al Señor de toda la tierra; La Atalaya de marzo de 2022 los identifica con Josué y Zorobabel."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:zacarias-profeta], note: "Sexta visión: un rollo que vuela, de 20 por 10 codos y escrito por las dos caras. Es la maldición de Jehová, que entrará en casa del ladrón y del que jura en falso por su nombre hasta consumirla."}
    - {v: 5-11, type: vision, entities: [event:visiones-nocturnas-de-zacarias], mentions: [place:sinar, place:babilonia], note: "Séptima visión: dentro de un recipiente de efá tapado con plomo va sentada una mujer, la Maldad. Dos mujeres con alas de cigüeña lo llevan a Sinar, que la nota llama Babilonia, donde le harán una casa."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: vision, entities: [event:visiones-nocturnas-de-zacarias, person:zacarias-profeta], mentions: [place:babilonia], note: "Octava visión: cuatro carros salen entre dos montes de cobre. Son los cuatro espíritus del cielo, ángeles según La Atalaya de 2017. Los que van a la tierra del norte, Babilonia para ella, hacen reposar allí el espíritu de Jehová."}
    - {v: 9-11, type: narration, entities: [event:zacarias-corona-a-josue, person:zacarias-profeta, person:heldai-de-la-corona, person:tobiya-de-la-corona, person:jedaya-de-la-corona, person:josias-hijo-de-sofonias, person:sofonias-padre-de-josias, person:josue-sumo-sacerdote, person:jehozadac, place:babilonia, relation:heldai-de-la-corona/lived_in/babilonia, relation:tobiya-de-la-corona/lived_in/babilonia, relation:tobiya-de-la-corona/accompanies/heldai-de-la-corona, relation:jedaya-de-la-corona/lived_in/babilonia, relation:jedaya-de-la-corona/accompanies/heldai-de-la-corona, relation:josias-hijo-de-sofonias/kin/sofonias-padre-de-josias, relation:josias-hijo-de-sofonias/lived_in/jerusalen, relation:josue-sumo-sacerdote/kin/jehozadac, period:sumo-sacerdocio-de-josue], mentions: [place:jerusalen], note: "Jehová manda a Zacarías tomar lo que Heldái, Tobiya y Jedayá traen de los desterrados, ir con ellos a casa de Josías hijo de Sofonías, hacer una corona de plata y oro y ponérsela a Josué."}
    - {v: 12-13, type: prophecy, entities: [event:zacarias-corona-a-josue, person:josue-sumo-sacerdote], mentions: [person:jesus], note: "Mensaje para Josué: el hombre llamado Brote construirá el templo y reinará en su trono siendo también sacerdote. Perspicacia «Rama, brote» y La Atalaya lo aplican a Jesucristo; Josué, que no venía de David, solo lo prefigura."}
    - {v: 14-15, type: prophecy, entities: [event:zacarias-corona-a-josue, person:heldai-de-la-corona, person:tobiya-de-la-corona, person:jedaya-de-la-corona, person:hen, person:sofonias-padre-de-josias, relation:hen/kin/sofonias-padre-de-josias, relation:hen/same_as/josias-hijo-de-sofonias], note: "La corona quedará en el templo como recuerdo de Hélem, es decir Heldái, de Tobiya, de Jedayá y de Hen hijo de Sofonías. Otros vendrán de lejos a construir el templo si el pueblo obedece a Jehová."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:betel-consulta-sobre-el-ayuno, person:zacarias-profeta, person:sarezer-de-betel, person:reguem-melec, place:betel, place:jerusalen, relation:sarezer-de-betel/lived_in/betel, relation:reguem-melec/lived_in/betel, relation:reguem-melec/accompanies/sarezer-de-betel, relation:zacarias-profeta/lived_in/jerusalen], mentions: [person:dario-i, period:dario-i, event:destruccion-de-jerusalen-607], note: "Día 4 de kislev del año cuarto de Darío I. Betel envía a Sarézer y a Réguem-Mélec a los sacerdotes y profetas del templo: ¿seguir llorando en el quinto mes? La referencia remite a la quema del templo en 607."}
    - {v: 4-7, type: prophecy, entities: [event:betel-consulta-sobre-el-ayuno, place:jerusalen], mentions: [place:negueb, place:sefela, event:asesinato-de-guedalias, event:destruccion-de-jerusalen-607], note: "Jehová pregunta si los ayunos del quinto y del séptimo mes, durante 70 años, eran por él. Recuerda que los profetas anteriores hablaron cuando Jerusalén, sus ciudades, el Négueb y la Sefelá estaban poblados."}
    - {v: 8-14, type: prophecy, entities: [event:betel-consulta-sobre-el-ayuno, person:zacarias-profeta], mentions: [event:destruccion-de-jerusalen-607], note: "Jehová pedía justicia, amor leal y compasión con viudas, huérfanos, extranjeros y pobres. Los padres se negaron y endurecieron el corazón; por eso él no los oyó, los dispersó entre las naciones y dejó la tierra desolada."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: prophecy, entities: [event:betel-consulta-sobre-el-ayuno, person:zacarias-profeta, place:jerusalen], note: "Jehová volverá a Sion, que es Jerusalén, y vivirá en ella: se llamará ciudad de la verdad y su montaña, santa. Ancianos y niños llenarán sus plazas; traerá a su pueblo desde oriente y occidente."}
    - {v: 9-13, type: prophecy, entities: [event:betel-consulta-sobre-el-ayuno], mentions: [event:se-reanuda-la-obra-del-templo-520], note: "Ánimo a quienes oyen a los profetas desde que se pusieron los cimientos; la referencia remite a Esd 5:1. Antes no había jornal ni seguridad; ahora habrá paz y cosecha. Judá e Israel, aquí pueblos, serán bendición."}
    - {v: 14-17, type: prophecy, entities: [event:betel-consulta-sobre-el-ayuno, place:jerusalen], note: "Igual que decidió castigar a sus antepasados, Jehová decide ahora hacer bien a Jerusalén y a Judá, el pueblo. Les pide hablar con verdad, juzgar con paz en las puertas y rechazar tramas y juramentos falsos."}
    - {v: 18-19, type: prophecy, entities: [event:betel-consulta-sobre-el-ayuno, person:zacarias-profeta], mentions: [event:destruccion-de-jerusalen-607, event:asesinato-de-guedalias, event:sitio-de-jerusalen-609], note: "Los ayunos del cuarto, quinto, séptimo y décimo mes serán fiestas alegres. Perspicacia «Ayuno» los une a la brecha del muro y la quema del templo en 607, quizá a la muerte de Guedalías y al comienzo del sitio."}
    - {v: 20-23, type: prophecy, entities: [event:betel-consulta-sobre-el-ayuno, place:jerusalen], note: "Gentes de muchas ciudades y naciones irán a Jerusalén a buscar a Jehová. Diez hombres de todas las lenguas se agarrarán del manto de un judío. La Atalaya de 2007 ve estas promesas cumplidas en parte entonces y desde 1919."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones, place:hadrac, place:damasco, place:hamat, place:tiro, place:sidon, place:asquelon, place:gaza, place:ecron, place:asdod, place:filistea], mentions: [place:juda, event:alejandro-destruye-tiro], note: "Juicio sobre Hadrac, Damasco, Hamat, Tiro, Sidón y Filistea. Los filisteos que queden serán como jefes de clan en Judá; Ecrón, como los jebuseos. Perspicacia lo ve cumplido cuando Alejandro Magno tomó Tiro (332 a.e.c.) y Gaza."}
    - {v: 9-10, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones, place:jerusalen, place:israel], mentions: [person:jesus, event:entrada-triunfal-en-jerusalen, place:rio-eufrates], note: "Sion debe alegrarse: su rey llega justo, humilde y en un burrito. Mt 21:5 y Jn 12:15 lo aplican a Jesús al entrar en Jerusalén. Quitará carros y caballos de Efraín, el reino del norte, y dominará hasta el Éufrates."}
    - {v: 11-17, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones, place:jerusalen, place:juda, place:israel, place:grecia], note: "Por la sangre del pacto, Jehová sacará a los presos del hoyo seco, cisterna vacía usada como cárcel (Perspicacia «Cisterna»), y les dará porción doble. Tensará a Judá como arco y a Efraín como flecha contra los hijos de Grecia."}
  10:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones], note: "Que pidan a Jehová la lluvia de primavera, que según Perspicacia «Lluvia» llegaba hacia mediados de abril y maduraba el grano. Los terafim, ídolos de la casa, y los adivinos mienten, y el pueblo vaga como rebaño sin pastor."}
    - {v: 3-5, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones, place:juda], note: "Jehová está furioso con los pastores y los líderes opresores, y hace de la casa de Judá su caballo de guerra. De Judá, dice la nota, salen el hombre clave, el gobernante y el supervisor; vencerán a los jinetes."}
    - {v: 6-7, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones, place:juda, place:israel], note: "Jehová fortalecerá a Judá, salvará a la casa de José y los hará volver; Efraín será como un guerrero poderoso. José y Efraín nombran al reino del norte, y Perspicacia «Efraín» ve aquí su unión con Judá."}
    - {v: 8-12, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones, place:egipto, place:asiria, place:galaad, place:libano, place:rio-nilo], note: "Jehová silbará para reunir a los dispersos y los traerá de Egipto y Asiria a Galaad y al Líbano, quizá la tierra al oeste del Jordán (Perspicacia «Líbano»). El Nilo se secará; caerán el orgullo asirio y el cetro egipcio."}
  11:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones], mentions: [place:libano, place:basan, place:rio-jordan], note: "El fuego consumirá los cedros del Líbano; lloran el enebro y los robles de Basán, y rugen los leones porque arrasaron la espesura del Jordán. Perspicacia «Cedro» y «Árbol grande» toman esos árboles en sentido figurado."}
    - {v: 4-6, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones, event:zacarias-pastorea-el-rebano-destinado-al-matadero, person:zacarias-profeta], note: "Jehová manda al profeta pastorear un rebaño destinado a la matanza: quien lo compra y quien lo vende se enriquecen sin culpa, y sus pastores no se compadecen. Dejará el país en manos del prójimo y de su rey."}
    - {v: 7-11, type: narration, entities: [event:zacarias-profetiza-contra-las-naciones, event:zacarias-pastorea-el-rebano-destinado-al-matadero, person:zacarias-profeta], note: "El profeta pastorea con dos bastones, Bondad y Unión, se deshace de tres pastores en un mes, deja el rebaño y parte Bondad. La Atalaya de 2007 lo lee como el fin del pacto de la Ley con los judíos."}
    - {v: 12-14, type: narration, entities: [event:zacarias-profetiza-contra-las-naciones, event:zacarias-pastorea-el-rebano-destinado-al-matadero, person:zacarias-profeta, place:monte-moria], mentions: [person:jesus, person:judas-iscariote, event:judas-acuerda-la-traicion, event:muerte-de-judas, place:juda, place:israel], note: "Le pagan 30 piezas de plata, y Jehová le manda arrojarlas al tesoro del templo; luego parte Unión, la hermandad entre Judá e Israel. Mt 26:15 y 27:3-10 lo ven cumplido en la traición de Judas."}
    - {v: 15-17, type: prophecy, entities: [event:zacarias-profetiza-contra-las-naciones], note: "Jehová le manda tomar el equipo de un pastor inútil: surgirá uno que no cuidará de las ovejas débiles y devorará las gordas. Una espada le secará el brazo y le dejará ciego el ojo derecho."}
  12:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], note: "Declaración de Jehová sobre Israel, que aquí es el pueblo, sin ficha. Habla quien extendió los cielos, puso los cimientos de la tierra y formó el espíritu del hombre."}
    - {v: 2-6, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara, place:jerusalen, place:juda], note: "Jerusalén hará tambalearse a los pueblos vecinos como una copa, y quien intente levantarla, como a una piedra pesada, saldrá herido. Jehová cegará a los caballos enemigos; los jeques de Judá arderán como brasero entre leña."}
    - {v: 7-9, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara, place:jerusalen, place:juda], mentions: [person:david], note: "Jehová salvará primero las tiendas de Judá y protegerá Jerusalén: hasta el más débil de sus habitantes se parecerá a David, y la descendencia de David, al ángel de Jehová. Exterminará a las naciones atacantes."}
    - {v: 10-11, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara, place:hadadrimon, place:valle-de-jezreel], mentions: [person:jesus, event:entierro-de-jesus, place:jerusalen, place:meguido, person:josias, event:muerte-de-josias, person:david], note: "Mirarán al que traspasaron y llorarán como por un hijo único; Jn 19:34, 37 lo ve cumplido en la lanzada a Jesús. El duelo igualará al de Hadadrimón, que quizá fue por Josías, muerto en Meguidó."}
    - {v: 12-14, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], mentions: [person:david, person:natan-hijo-de-david], note: "Duelo aparte de cada familia: las casas de David y de Natán, hijo de David si su casa es rama de la davídica (Perspicacia «Natán», núm. 4). Leví es aquí la tribu y los simeítas, un clan suyo: sin ficha."}
  13:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], mentions: [person:david, place:jerusalen], note: "Ese día se abrirá un pozo que limpie de pecado e impureza a la casa de David y a los vecinos de Jerusalén. La casa de David es su linaje real, no el rey en persona."}
    - {v: 2-6, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], note: "Jehová hará olvidar a los ídolos y quitará del país a los falsos profetas; sus propios padres los traspasarán y ellos negarán serlo. «Toda Escritura», párr. 24, saca de aquí una lealtad a Dios por encima de la familia."}
    - {v: "7", type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], mentions: [person:jesus, event:predice-las-negaciones-de-pedro, event:arresto-en-getsemani], note: "La espada herirá al pastor, compañero de Jehová, y las ovejas se dispersarán. Jesús se lo aplicó la última noche (Mt 26:31; Mr 14:27) y sus discípulos huyeron al arrestarlo (Perspicacia «Zacarías, Libro de»; La Atalaya de 2007)."}
    - {v: 8-9, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], note: "Dos partes del país serán eliminadas; la tercera pasará por el fuego como la plata y el oro, invocará a Jehová y él la llamará su pueblo. La Atalaya de 2007 ve en los dos tercios a la nación apóstata."}
  14:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], mentions: [place:jerusalen], note: "Llega un día de Jehová: las naciones toman Jerusalén, saquean y llevan al destierro a media ciudad, pero queda un resto. La Atalaya de 2013 lee la ciudad como el Reino mesiánico, atacado en sus ungidos desde 1914."}
    - {v: 3-5, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara, place:monte-de-los-olivos, place:azel, event:terremoto-en-dias-de-uzias], mentions: [place:jerusalen, person:uzias, period:uzias, place:juda], note: "Jehová sale a combatir. El monte de los Olivos, frente a Jerusalén por el este, se parte y abre un valle hasta Azel, adonde huirán como en el terremoto de Uzías. La Atalaya de 2013 lo lee como protección divina."}
    - {v: 6-9, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara, place:mar-salado, place:mar-grande], mentions: [place:jerusalen], note: "No habrá luz preciosa, y al anochecer habrá luz. De Jerusalén saldrán aguas vivas hacia los dos mares. La adoración pura, recuadro 19A, y La Atalaya de 2013 las leen como bendiciones de Jehová en el Paraíso."}
    - {v: 10-11, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara, place:jerusalen, place:gueba, place:rimon-de-simeon], mentions: [place:araba], note: "De Gueba a Rimón, al sur, el país quedará llano como el Arabá, y Jerusalén se alzará poblada y segura. Perspicacia «Puerta» ve en sus puertas, la Torre de Hananel y los lagares del rey los límites de la ciudad."}
    - {v: 12-15, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], mentions: [place:jerusalen], note: "Un azote pudrirá la carne, los ojos y la lengua de quienes ataquen Jerusalén, y a sus animales. Se pelearán entre ellos, y Judá, el pueblo, luchará allí. La Atalaya de 2013 ve en los animales el armamento enemigo."}
    - {v: 16-19, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], mentions: [place:jerusalen, place:egipto], note: "Los que queden de esas naciones subirán cada año a Jerusalén para adorar al Rey, Jehová, y celebrar allí la Fiesta de las Cabañas. Quien no suba, Egipto incluido, se quedará sin lluvia y sufrirá el azote."}
    - {v: 20-21, type: prophecy, entities: [event:zacarias-anuncia-que-jehova-guerreara-y-reinara], mentions: [place:jerusalen, place:juda], note: "Hasta los cascabeles de los caballos llevarán escrito que la santidad es de Jehová, y toda olla de Jerusalén y de Judá será santa. En su casa no habrá más cananeos; la nota al pie da también «comerciantes»."}
