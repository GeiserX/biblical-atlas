    - {v: 16-25, type: law, note: "Pascua el día 14 del primer mes y, desde el 15, siete días de pan sin levadura, con reunión santa el primero y el séptimo y las mismas ofrendas cada día."}
    - {v: 26-31, type: law, note: "Día de los primeros frutos, en la Fiesta de las Semanas: reunión santa, sin trabajo duro, y las ofrendas del principio de mes con un cabrito de expiación."}
