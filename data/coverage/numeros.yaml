    - {v: 7-11, type: law, note: "Día 10 del séptimo mes, el Día de Expiación: reunión santa, el pueblo se humilla, sin trabajo, y las mismas ofrendas."}
    - {v: 12-16, type: law, note: "Desde el día 15, fiesta de siete días para Jehová. El primero, reunión santa y 13 toros, 2 carneros y 14 corderos, con un cabrito por el pecado."}
