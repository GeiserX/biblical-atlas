    - {v: 4-16, type: list, entities: [event:primer-censo-de-israel, person:elizur, person:sedeur, relation:elizur/kin/sedeur, relation:elizur/accompanies/moises, relation:elizur/accompanies/aaron, person:selumiel, person:zurisadai, relation:selumiel/kin/zurisadai, relation:selumiel/accompanies/moises, relation:selumiel/accompanies/aaron, person:nahson, person:aminadab-hijo-de-ram, relation:nahson/kin/aminadab-hijo-de-ram, relation:nahson/accompanies/moises, relation:nahson/accompanies/aaron, person:netanel-hijo-de-zuar, person:zuar, relation:netanel-hijo-de-zuar/kin/zuar, relation:netanel-hijo-de-zuar/accompanies/moises, relation:netanel-hijo-de-zuar/accompanies/aaron, person:eliab-hijo-de-helon, person:helon, relation:eliab-hijo-de-helon/kin/helon, relation:eliab-hijo-de-helon/accompanies/moises, relation:eliab-hijo-de-helon/accompanies/aaron, person:elisama-hijo-de-amihud, person:amihud-hijo-de-ladan, relation:elisama-hijo-de-amihud/kin/amihud-hijo-de-ladan, relation:elisama-hijo-de-amihud/accompanies/moises, relation:elisama-hijo-de-amihud/accompanies/aaron, person:gamaliel-hijo-de-pedahzur, person:pedahzur, relation:gamaliel-hijo-de-pedahzur/kin/pedahzur, relation:gamaliel-hijo-de-pedahzur/accompanies/moises, relation:gamaliel-hijo-de-pedahzur/accompanies/aaron, person:abidan, person:guideoni, relation:abidan/kin/guideoni, relation:abidan/accompanies/moises, relation:abidan/accompanies/aaron, person:ahiezer-hijo-de-amisadai, person:amisadai, relation:ahiezer-hijo-de-amisadai/kin/amisadai, relation:ahiezer-hijo-de-amisadai/accompanies/moises, relation:ahiezer-hijo-de-amisadai/accompanies/aaron, person:paguiel, person:ocran, relation:paguiel/kin/ocran, relation:paguiel/accompanies/moises, relation:paguiel/accompanies/aaron, person:eliasaf-hijo-de-deuel, person:deuel, relation:eliasaf-hijo-de-deuel/kin/deuel, relation:eliasaf-hijo-de-deuel/accompanies/moises, relation:eliasaf-hijo-de-deuel/accompanies/aaron, person:ahira, person:enan, relation:ahira/kin/enan, relation:ahira/accompanies/moises, relation:ahira/accompanies/aaron], mentions: [person:jose-hijo-de-jacob, person:efrain, person:manases-hijo-de-jose], note: "Un jefe por tribu, cabeza de su casa paterna, ayuda a Moisés y a Aarón. Rubén, Simeón y demás nombran aquí a las tribus, no a los hijos de Jacob."}
    - {v: 17-19, type: narration, entities: [event:primer-censo-de-israel, person:moises, person:aaron, place:desierto-de-sinai], note: "El mismo día 1 del segundo mes reúnen al pueblo y lo inscriben por familias y casas paternas."}
    - {v: 20-43, type: list, entities: [event:primer-censo-de-israel], mentions: [person:ruben-hijo-de-jacob, person:jacob, person:jose-hijo-de-jacob, person:efrain], note: "Cifras por tribu: Rubén 46.500, Simeón 59.300, Gad 45.650, Judá 74.600, Isacar 54.400, Zabulón 57.400, Efraín 40.500, Manasés 32.200, Benjamín 35.400, Dan 62.700, Aser 41.500, Neftalí 53.400."}
    - {v: 44-46, type: list, entities: [event:primer-censo-de-israel, person:moises, person:aaron], note: "Moisés, Aarón y los doce jefes registran en total 603.550 varones."}
    - {v: 47-54, type: law, entities: [event:primer-censo-de-israel, person:moises], note: "Leví no se cuenta con las demás tribus: desmonta, lleva y monta el tabernáculo y acampa a su alrededor; el no levita que se acerque muere. Las demás tribus acampan por divisiones."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: law, entities: [event:jehova-organiza-el-campamento-de-israel, person:moises, person:aaron], note: "Cada israelita acampa junto al estandarte de su casa paterna, dentro de su división de tres tribus, alrededor de la tienda de reunión y de cara a ella."}
    - {v: 3-9, type: list, entities: [event:jehova-organiza-el-campamento-de-israel, person:nahson, person:aminadab-hijo-de-ram, relation:nahson/kin/aminadab-hijo-de-ram, person:netanel-hijo-de-zuar, person:zuar, relation:netanel-hijo-de-zuar/kin/zuar, person:eliab-hijo-de-helon, person:helon, relation:eliab-hijo-de-helon/kin/helon], note: "Al este, la división de Judá, con Isacar y Zabulón: 186.400 varones. Levanta el campamento la primera."}
    - {v: 10-16, type: list, entities: [event:jehova-organiza-el-campamento-de-israel, person:elizur, person:sedeur, relation:elizur/kin/sedeur, person:selumiel, person:zurisadai, relation:selumiel/kin/zurisadai, person:eliasaf-hijo-de-deuel, person:deuel, relation:eliasaf-hijo-de-deuel/kin/deuel], note: "Al sur, la división de Rubén, con Simeón y Gad: 151.450 varones, la segunda en partir. El padre de Eliasaf aparece aquí como Reuel; es Deuel."}
    - {v: "17", type: law, entities: [event:jehova-organiza-el-campamento-de-israel], note: "Al trasladar la tienda de reunión, los levitas van en medio de los demás campamentos, y cada división marcha en el orden en que acampa."}
    - {v: 18-24, type: list, entities: [event:jehova-organiza-el-campamento-de-israel, person:elisama-hijo-de-amihud, person:amihud-hijo-de-ladan, relation:elisama-hijo-de-amihud/kin/amihud-hijo-de-ladan, person:gamaliel-hijo-de-pedahzur, person:pedahzur, relation:gamaliel-hijo-de-pedahzur/kin/pedahzur, person:abidan, person:guideoni, relation:abidan/kin/guideoni], note: "Al oeste, la división de Efraín, con Manasés y Benjamín: 108.100 varones, la tercera en partir."}
    - {v: 25-31, type: list, entities: [event:jehova-organiza-el-campamento-de-israel, person:ahiezer-hijo-de-amisadai, person:amisadai, relation:ahiezer-hijo-de-amisadai/kin/amisadai, person:paguiel, person:ocran, relation:paguiel/kin/ocran, person:ahira, person:enan, relation:ahira/kin/enan], note: "Al norte, la división de Dan, con Aser y Neftalí: 157.600 varones, la última en partir."}
    - {v: 32-34, type: narration, entities: [event:jehova-organiza-el-campamento-de-israel, person:moises], mentions: [event:primer-censo-de-israel], note: "El total de los campamentos es 603.550, sin los levitas. Israel acampa y parte como Jehová mandó a Moisés."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: genealogy, entities: [person:aaron, person:nadab-hijo-de-aaron, person:abihu, person:eleazar-hijo-de-aaron, person:itamar, place:desierto-de-sinai, event:muerte-de-nadab-y-abihu, relation:nadab-hijo-de-aaron/kin/aaron, relation:abihu/kin/aaron, relation:eleazar-hijo-de-aaron/kin/aaron, relation:itamar/kin/aaron, relation:nadab-hijo-de-aaron/kin/abihu, relation:nadab-hijo-de-aaron/kin/eleazar-hijo-de-aaron, relation:nadab-hijo-de-aaron/kin/itamar, relation:eleazar-hijo-de-aaron/kin/itamar, relation:nadab-hijo-de-aaron/died_in/desierto-de-sinai, relation:abihu/died_in/desierto-de-sinai], mentions: [person:moises, place:monte-sinai, event:instalacion-del-sacerdocio], note: "Los cuatro hijos de Aarón, sacerdotes ungidos. Nadab y Abihú murieron sin hijos en el desierto de Sinaí; Eleazar e Itamar siguieron de sacerdotes junto a su padre."}
    - {v: 5-13, type: law, entities: [event:jehova-da-los-levitas-a-aaron, person:moises, person:aaron], mentions: [place:egipto, event:decima-plaga-mueren-los-primogenitos, event:consagracion-de-los-primogenitos], note: "Los levitas sirven a Aarón y cuidan del tabernáculo; el que se acerque sin estar autorizado morirá. Jehová los toma por los primogénitos, que son suyos desde la muerte de los de Egipto."}
    - {v: 14-20, type: genealogy, entities: [event:censo-de-los-levitas-en-el-sinai, person:moises, place:desierto-de-sinai, person:levi-hijo-de-jacob, person:guerson, person:cohat, person:merari, person:libni-hijo-de-guerson, person:simei-hijo-de-guerson, person:amram-hijo-de-cohat, person:izhar-hijo-de-cohat, person:hebron-hijo-de-cohat, person:uziel-hijo-de-cohat, person:mahli-hijo-de-merari, person:musi, relation:guerson/kin/levi-hijo-de-jacob, relation:cohat/kin/levi-hijo-de-jacob, relation:merari/kin/levi-hijo-de-jacob, relation:guerson/kin/cohat, relation:guerson/kin/merari, relation:libni-hijo-de-guerson/kin/guerson, relation:simei-hijo-de-guerson/kin/guerson, relation:libni-hijo-de-guerson/kin/simei-hijo-de-guerson, relation:amram-hijo-de-cohat/kin/cohat, relation:izhar-hijo-de-cohat/kin/cohat, relation:hebron-hijo-de-cohat/kin/cohat, relation:uziel-hijo-de-cohat/kin/cohat, relation:amram-hijo-de-cohat/kin/izhar-hijo-de-cohat, relation:amram-hijo-de-cohat/kin/hebron-hijo-de-cohat, relation:amram-hijo-de-cohat/kin/uziel-hijo-de-cohat, relation:mahli-hijo-de-merari/kin/merari, relation:musi/kin/merari, relation:mahli-hijo-de-merari/kin/musi], note: "Jehová manda registrar a los levitas varones de un mes o más, y Moisés lo hace. Hijos de Leví y las familias de cada uno."}
    - {v: 21-26, type: list, entities: [event:censo-de-los-levitas-en-el-sinai, person:eliasaf-hijo-de-lael, person:lael, relation:eliasaf-hijo-de-lael/kin/lael, relation:eliasaf-hijo-de-lael/kin/guerson, relation:lael/kin/guerson, relation:eliasaf-hijo-de-lael/lived_in/desierto-de-sinai], mentions: [person:guerson, person:libni-hijo-de-guerson, person:simei-hijo-de-guerson], note: "Guersonitas, familias de libnitas y simeítas: 7.500 varones, al oeste del tabernáculo. Cuidan las telas y cubiertas de la tienda, las cortinas del patio y las de las dos entradas."}
    - {v: 27-32, type: list, entities: [event:censo-de-los-levitas-en-el-sinai, person:elizafan-hijo-de-uziel, person:eleazar-hijo-de-aaron, relation:elizafan-hijo-de-uziel/kin/uziel-hijo-de-cohat, relation:elizafan-hijo-de-uziel/lived_in/desierto-de-sinai, relation:eleazar-hijo-de-aaron/kin/aaron], mentions: [person:cohat, person:amram-hijo-de-cohat, person:izhar-hijo-de-cohat, person:hebron-hijo-de-cohat, person:uziel-hijo-de-cohat, person:aaron], note: "Cohatitas: 8.600 varones, al sur. Tienen a su cargo el Arca y la mesa, además del candelabro, los dos altares, los utensilios y la cortina. Eleazar supervisa a quienes guardan el lugar santo."}
    - {v: 33-37, type: list, entities: [event:censo-de-los-levitas-en-el-sinai, person:zuriel, person:abihail-padre-de-zuriel, relation:zuriel/kin/abihail-padre-de-zuriel, relation:zuriel/kin/merari, relation:abihail-padre-de-zuriel/kin/merari, relation:zuriel/lived_in/desierto-de-sinai], mentions: [person:merari, person:mahli-hijo-de-merari, person:musi], note: "Meraritas, familias de mahlitas y musitas: 6.200 varones, al norte. Cuidan armazones, barras, columnas y bases del tabernáculo, y las columnas, estacas y cuerdas del patio."}
    - {v: 38-39, type: list, entities: [event:censo-de-los-levitas-en-el-sinai, person:moises, person:aaron, person:eleazar-hijo-de-aaron, person:itamar, relation:moises/lived_in/desierto-de-sinai, relation:aaron/lived_in/desierto-de-sinai, relation:eleazar-hijo-de-aaron/lived_in/desierto-de-sinai, relation:itamar/lived_in/desierto-de-sinai], note: "Moisés, Aarón y sus hijos acampan al este, frente a la entrada, y guardan el santuario. Los levitas registrados suman 22.000."}
    - {v: 40-51, type: narration, entities: [event:moises-cobra-el-rescate-de-los-primogenitos, person:moises, person:aaron, person:eleazar-hijo-de-aaron, person:itamar], note: "Registro de los primogénitos de Israel y pago de su rescate. El siclo del lugar santo vale 20 guerás; también el ganado de los levitas sustituye a las primeras crías de Israel."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:jehova-reparte-el-servicio-de-los-levitas, person:moises, person:aaron], mentions: [person:cohat, person:levi-hijo-de-jacob], note: "Jehová manda censar a los cohatitas de 30 a 50 años, los que trabajan en la tienda de reunión."}
    - {v: 4-20, type: law, entities: [event:jehova-reparte-el-servicio-de-los-levitas, person:aaron, person:eleazar-hijo-de-aaron, relation:eleazar-hijo-de-aaron/kin/aaron], mentions: [person:cohat, person:moises], note: "Al mover el campamento, Aarón y sus hijos envuelven el Arca, la mesa, el candelabro y los altares; los cohatitas los cargan sin tocar ni mirar lo santo. Eleazar vigila aceite, incienso y tabernáculo."}
    - {v: 21-28, type: law, entities: [event:jehova-reparte-el-servicio-de-los-levitas, person:itamar, relation:itamar/kin/aaron], mentions: [person:guerson, person:moises, person:aaron], note: "Los guersonitas de 30 a 50 años cargan las telas y cubiertas de la tienda y las cortinas del patio y de las entradas, bajo la dirección de Itamar."}
    - {v: 29-33, type: law, entities: [event:jehova-reparte-el-servicio-de-los-levitas, person:itamar, relation:itamar/kin/aaron], mentions: [person:merari, person:aaron], note: "Los meraritas de 30 a 50 años cargan armazones, barras, columnas, bases, estacas y cuerdas, que se les asignan por nombre, dirigidos también por Itamar."}
    - {v: 34-49, type: list, entities: [event:censo-de-los-levitas-de-30-a-50-anos, person:moises, person:aaron], mentions: [person:cohat, person:guerson, person:merari], note: "Registro de los levitas de 30 a 50 años por familias: cohatitas, guersonitas y meraritas, cada uno con su servicio y su carga."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: narration, entities: [event:israel-saca-del-campamento-a-los-impuros, person:moises], note: "Leprosos, personas con flujo e impuros por un cadáver, hombres o mujeres, salen del campamento en el que habita Jehová. Los israelitas obedecen."}
    - {v: 5-10, type: law, entities: [event:jehova-da-las-leyes-de-la-compensacion-y-de-los-celos, person:moises], note: "Quien peca contra otro lo confiesa y paga el daño más un quinto. Si no queda perjudicado ni pariente cercano, el pago es del sacerdote, junto con el carnero de expiación. Las contribuciones santas también son suyas."}
    - {v: 11-15, type: law, entities: [person:moises], note: "Ley de los celos: si un esposo sospecha que su esposa le fue infiel en secreto y sin testigos, la lleva al sacerdote con un décimo de efá de harina de cebada, sin aceite ni olíbano."}
    - {v: 16-22, type: law, note: "El sacerdote mezcla agua santa con polvo del suelo del tabernáculo, suelta el cabello de la mujer y le toma juramento con maldición; ella contesta dos veces «Amén»."}
    - {v: 23-28, type: law, note: "Las maldiciones se escriben y se borran en el agua, que ella bebe tras quemarse un puñado de la ofrenda. Si es culpable, su vientre se hincha y su muslo decae; si es inocente, podrá tener hijos."}
    - {v: 29-31, type: law, note: "Cierre de la ley de los celos: el marido queda libre de culpa y la esposa responde de la suya."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: law, entities: [event:jehova-da-a-moises-la-ley-del-nazareato, person:moises], note: "Voto de nazareo, abierto a hombres y mujeres: nada que salga de la vid, ni vino ni pasas; el pelo sin cortar; ningún contacto con un cadáver, ni siquiera el de un padre o un hermano."}
    - {v: 9-12, type: law, note: "Si alguien muere de pronto a su lado, el nazareo se rapa el séptimo día, lleva dos aves al octavo y un carnero por la culpa, y la cuenta de días vuelve a empezar."}
    - {v: 13-21, type: law, note: "Al acabar el voto lleva a la tienda de reunión dos carneros, una cordera y panes sin levadura; se rapa, echa el pelo al fuego del sacrificio de paz y desde entonces puede beber vino."}
    - {v: 22-27, type: law, entities: [event:jehova-ensena-a-los-sacerdotes-a-bendecir-al-pueblo, person:moises, person:aaron], note: "Palabras con que Aarón y sus hijos bendicen a Israel: que Jehová lo guarde, le muestre favor y le dé paz. Así ponen el nombre de Dios sobre el pueblo."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: narration, entities: [event:se-monta-el-tabernaculo, event:los-jefes-dan-carretas-para-el-tabernaculo, person:moises, person:itamar, relation:itamar/kin/aaron, place:desierto-de-sinai], mentions: [person:aaron, person:guerson, person:merari, person:cohat], note: "Guersón, Merarí y Cohat nombran aquí a sus familias levitas. Los doce jefes van en el suceso y en los tramos de cada día."}
    - {v: 10-11, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:moises], note: "Jehová manda que cada jefe presente su ofrenda en un día distinto."}
    - {v: 12-17, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:nahson, person:aminadab-hijo-de-ram, relation:nahson/kin/aminadab-hijo-de-ram], note: "Primer día: Judá."}
    - {v: 18-23, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:netanel-hijo-de-zuar, person:zuar, relation:netanel-hijo-de-zuar/kin/zuar], note: "Segundo día: Isacar."}
    - {v: 24-29, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:eliab-hijo-de-helon, person:helon, relation:eliab-hijo-de-helon/kin/helon], note: "Tercer día: Zabulón."}
    - {v: 30-35, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:elizur, person:sedeur, relation:elizur/kin/sedeur], note: "Cuarto día: Rubén."}
    - {v: 36-41, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:selumiel, person:zurisadai, relation:selumiel/kin/zurisadai], note: "Quinto día: Simeón."}
    - {v: 42-47, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:eliasaf-hijo-de-deuel, person:deuel, relation:eliasaf-hijo-de-deuel/kin/deuel], note: "Sexto día: Gad."}
    - {v: 48-53, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:elisama-hijo-de-amihud, person:amihud-hijo-de-ladan, relation:elisama-hijo-de-amihud/kin/amihud-hijo-de-ladan], note: "Séptimo día: Efraín."}
    - {v: 54-59, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:gamaliel-hijo-de-pedahzur, person:pedahzur, relation:gamaliel-hijo-de-pedahzur/kin/pedahzur], note: "Octavo día: Manasés."}
    - {v: 60-65, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:abidan, person:guideoni, relation:abidan/kin/guideoni], note: "Noveno día: Benjamín."}
    - {v: 66-71, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:ahiezer-hijo-de-amisadai, person:amisadai, relation:ahiezer-hijo-de-amisadai/kin/amisadai], note: "Décimo día: Dan."}
    - {v: 72-77, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:paguiel, person:ocran, relation:paguiel/kin/ocran], note: "Undécimo día: Aser."}
    - {v: 78-83, type: narration, entities: [event:ofrendas-para-la-inauguracion-del-altar, person:ahira, person:enan, relation:ahira/kin/enan], note: "Duodécimo día: Neftalí."}
    - {v: 84-88, type: list, entities: [event:ofrendas-para-la-inauguracion-del-altar], note: "Suma de lo ofrecido: 2.400 siclos de plata, 120 de oro y 252 animales entre ofrendas quemadas, por el pecado y de paz."}
    - {v: "89", type: narration, entities: [person:moises], note: "Cuando Moisés entraba en la tienda, oía a Dios hablarle desde encima de la cubierta del Arca, entre los querubines. Es una costumbre, no una escena fechada."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: law, entities: [person:moises, person:aaron], note: "Aarón debe encender las siete lámparas para que alumbren delante del candelabro, de oro labrado a martillo según la visión. Es su tarea de siempre, no una escena fechada."}
    - {v: 5-19, type: law, entities: [event:purificacion-de-los-levitas, person:moises, person:aaron], mentions: [place:egipto, event:decima-plaga-mueren-los-primogenitos, event:consagracion-de-los-primogenitos, event:jehova-da-los-levitas-a-aaron], note: "Cómo purificar y presentar a los levitas. Jehová los toma en lugar de los primogénitos, que son suyos desde que mató a los de Egipto."}
    - {v: 20-22, type: narration, entities: [event:purificacion-de-los-levitas, person:moises, person:aaron, place:desierto-de-sinai], note: "Se hace tal como se mandó y los levitas empiezan su servicio."}
    - {v: 23-26, type: law, note: "Los levitas sirven en la tienda de los 25 a los 50 años; después solo ayudan a sus hermanos. Perspicacia «Levitas»: el trabajo pesado empezaba a los 30."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [event:israel-celebra-la-pascua-en-el-sinai, person:moises, place:desierto-de-sinai], mentions: [place:egipto, event:exodo, event:jehova-instituye-la-pascua], note: "Pasa en nisán, antes del censo de Nú 1 (Perspicacia «Números, Libro de»)."}
    - {v: 6-14, type: law, entities: [event:jehova-da-la-ley-de-la-pascua-tardia, person:moises, person:aaron], note: "El impuro por un muerto o el que está de viaje celebra la Pascua el 14 del segundo mes; quien no la celebre sin motivo será eliminado."}
    - {v: 15-16, type: narration, entities: [event:la-gloria-de-jehova-llena-el-tabernaculo], mentions: [event:se-monta-el-tabernaculo], note: "Desde el día en que se montó la tienda, la nube la cubre de día y de noche parece fuego."}
    - {v: 17-23, type: narration, mentions: [person:moises], note: "Norma de todo el viaje: cuando la nube se alza, el campamento parte; mientras se queda, sea una noche, días o un mes, acampan. No es una escena con fecha."}
  10:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: law, entities: [event:jehova-manda-hacer-las-trompetas-de-plata, person:moises], mentions: [person:aaron], note: "Dos trompetas de plata: las dos reúnen a todos; una, a los jefes; los toques cortos mueven los campamentos. Las tocan los hijos de Aarón, también en la guerra y las fiestas."}
    - {v: 11-13, type: narration, entities: [event:israel-sale-del-desierto-de-sinai, person:moises, place:desierto-de-sinai, place:desierto-de-paran], note: "El 20 del segundo mes se alza la nube y parten por primera vez; la nube se detiene en Parán."}
    - {v: 14-17, type: narration, entities: [event:israel-sale-del-desierto-de-sinai, person:nahson, relation:nahson/kin/aminadab-hijo-de-ram, person:netanel-hijo-de-zuar, person:zuar, relation:netanel-hijo-de-zuar/kin/zuar, person:eliab-hijo-de-helon, person:helon, relation:eliab-hijo-de-helon/kin/helon], mentions: [person:aminadab-hijo-de-ram, event:jehova-organiza-el-campamento-de-israel], note: "Delante va el grupo de Judá, con Isacar y Zabulón. Guersonitas y meraritas cargan el tabernáculo desmontado. Las tribus y los clanes no llevan ficha."}
    - {v: 18-21, type: narration, entities: [event:israel-sale-del-desierto-de-sinai, person:elizur, person:sedeur, relation:elizur/kin/sedeur, person:selumiel, person:zurisadai, relation:selumiel/kin/zurisadai, person:eliasaf-hijo-de-deuel, person:deuel, relation:eliasaf-hijo-de-deuel/kin/deuel], note: "Sigue el grupo de Rubén, con Simeón y Gad, y después los cohatitas con los objetos sagrados."}
    - {v: 22-28, type: narration, entities: [event:israel-sale-del-desierto-de-sinai, person:elisama-hijo-de-amihud, person:amihud-hijo-de-ladan, relation:elisama-hijo-de-amihud/kin/amihud-hijo-de-ladan, person:gamaliel-hijo-de-pedahzur, person:pedahzur, relation:gamaliel-hijo-de-pedahzur/kin/pedahzur, person:abidan, person:guideoni, relation:abidan/kin/guideoni, person:ahiezer-hijo-de-amisadai, person:amisadai, relation:ahiezer-hijo-de-amisadai/kin/amisadai, person:paguiel, person:ocran, relation:paguiel/kin/ocran, person:ahira, person:enan, relation:ahira/kin/enan], note: "Luego el grupo de Efraín, con Manasés y Benjamín; cierra la marcha el de Dan, con Aser y Neftalí."}
    - {v: 29-32, type: narration, entities: [event:moises-pide-a-hobab-que-vaya-con-israel, person:moises, person:hobab, person:jetro, relation:hobab/kin/jetro, relation:hobab/kin/moises, relation:hobab/lived_in/madian, relation:moises/kin/jetro], mentions: [place:madian], note: "La nota de Nú 10:29 dice que Reuel es Jetró. La tierra prometida no se nombra."}
    - {v: 33-36, type: narration, entities: [event:israel-sale-del-desierto-de-sinai, place:monte-sinai, person:moises], note: "La montaña de Jehová es el Sinaí (referencias de Nú 10:33). Tres días de camino con el Arca delante y las palabras de Moisés al partir y al parar."}
  11:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:fuego-de-jehova-en-tabera, place:tabera, person:moises], note: "Taberá significa «quema». La queja no dice de qué; el fuego solo alcanza las afueras del campamento."}
    - {v: 4-9, type: narration, entities: [event:el-pueblo-pide-carne, place:quibrot-hataava], mentions: [place:egipto, event:codornices-y-mana-en-el-desierto-de-sin], note: "La multitud de extranjeros, dice la nota, eran los no israelitas que iban con ellos. El maná parecía semilla de cilantro y bedelio; lo molían o machacaban y lo cocían."}
    - {v: 10-15, type: narration, entities: [event:el-pueblo-pide-carne, person:moises], note: "Moisés se lamenta ante Jehová: no engendró a ese pueblo, no tiene carne que darle y prefiere morir antes que seguir así."}
    - {v: 16-23, type: narration, entities: [event:el-pueblo-pide-carne, person:moises], mentions: [event:exodo], note: "Jehová manda reunir a 70 ancianos en la tienda de reunión y promete carne durante un mes entero. Moisés duda, con 600.000 hombres de a pie; Jehová responde que su mano no tiene límites."}
    - {v: 24-30, type: narration, entities: [event:jehova-da-su-espiritu-a-los-setenta-ancianos, place:quibrot-hataava, person:moises, person:eldad, person:medad, person:josue-hijo-de-nun, relation:eldad/accompanies/moises, relation:eldad/accompanies/medad, relation:medad/accompanies/moises, relation:josue-hijo-de-nun/tie/moises, relation:josue-hijo-de-nun/kin/nun], mentions: [person:nun], note: "Los ancianos profetizan una sola vez. El joven que avisa a Moisés no tiene nombre."}
    - {v: 31-34, type: narration, entities: [event:codornices-en-quibrot-hataava, place:quibrot-hataava], note: "El texto no nombra el mar de donde llegan las aves. Dos codos son unos 89 cm y diez homeres, unos 2.200 litros."}
    - {v: "35", type: narration, entities: [event:israel-acampa-en-hazerot, place:hazerot, place:quibrot-hataava]}
  12:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:miriam-y-aaron-hablan-contra-moises, person:miriam-hermana-de-moises, person:aaron, person:moises, person:zipora, relation:moises/kin/zipora], note: "Perspicacia «Ziporá» y «Cusita»: la esposa cusita es Ziporá, de Arabia, no una segunda mujer etíope. Moisés es el hombre más manso de la tierra."}
    - {v: 4-9, type: narration, entities: [event:miriam-y-aaron-hablan-contra-moises, person:moises, person:aaron, person:miriam-hermana-de-moises], note: "Jehová baja en la columna de nube y se para en la entrada de la tienda: a otros profetas les habla en visiones o sueños, a Moisés cara a cara."}
    - {v: 10-15, type: narration, entities: [event:miriam-y-aaron-hablan-contra-moises, person:miriam-hermana-de-moises, person:aaron, person:moises], note: "Míriam queda blanca de lepra; Aarón suplica a Moisés y este a Dios. Pasa siete días de cuarentena fuera del campamento y el pueblo espera para partir."}
    - {v: "16", type: narration, entities: [event:israel-acampa-en-el-desierto-de-paran, place:hazerot, place:desierto-de-paran], note: "Perspicacia «Qadés» pone este campamento del desierto de Parán en Cadés, que el texto nombra después."}
  13:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:moises-envia-a-los-doce-espias, person:moises, place:desierto-de-paran, place:canaan], note: "Jehová manda explorar Canaán con un jefe de cada tribu; Moisés los envía desde el desierto de Parán."}
    - {v: 4-16, type: list, entities: [event:moises-envia-a-los-doce-espias, person:samua-hijo-de-zacur, person:safat-hijo-de-hori, person:caleb-hijo-de-jefune, person:igal-hijo-de-jose, person:josue-hijo-de-nun, person:palti-hijo-de-rafu, person:gadiel, person:gaddi, person:amiel-hijo-de-guemali, person:setur, person:nahbi, person:gueuel, person:zacur-padre-de-samua, person:hori-padre-de-safat, person:jose-padre-de-igal, person:rafu, person:sodi, person:susi, person:guemali, person:miguel-padre-de-setur, person:vofsi, person:maki, person:jefune-padre-de-caleb, relation:samua-hijo-de-zacur/kin/zacur-padre-de-samua, relation:safat-hijo-de-hori/kin/hori-padre-de-safat, relation:igal-hijo-de-jose/kin/jose-padre-de-igal, relation:palti-hijo-de-rafu/kin/rafu, relation:gadiel/kin/sodi, relation:gaddi/kin/susi, relation:amiel-hijo-de-guemali/kin/guemali, relation:setur/kin/miguel-padre-de-setur, relation:nahbi/kin/vofsi, relation:gueuel/kin/maki, relation:caleb-hijo-de-jefune/kin/jefune-padre-de-caleb, relation:josue-hijo-de-nun/kin/nun, relation:caleb-hijo-de-jefune/accompanies/josue-hijo-de-nun], mentions: [person:nun], note: "Los doce, uno por tribu salvo Leví; José cuenta por Manasés y Efraín. A Hosea, Moisés lo llama Josué (Jehosúa, Jehová es salvación). Las tribus son pueblos y no llevan ficha."}
    - {v: 17-20, type: narration, entities: [event:moises-envia-a-los-doce-espias, person:moises, place:negueb], mentions: [place:canaan], note: "Moisés les encarga subir por el Négueb a la región montañosa y observar la gente, las ciudades, el suelo y los árboles, y traer fruta. Corría la época de las primeras uvas."}
    - {v: 21-24, type: narration, entities: [event:los-espias-recorren-canaan, place:desierto-de-zin, place:rehob, place:lebo-hamat, place:negueb, place:hebron, place:zoan, place:valle-de-escol, person:ahiman-hijo-de-anac, person:sesai, person:talmai-hijo-de-anac, relation:ahiman-hijo-de-anac/lived_in/hebron, relation:sesai/lived_in/hebron, relation:talmai-hijo-de-anac/lived_in/hebron, relation:ahiman-hijo-de-anac/kin/sesai, relation:ahiman-hijo-de-anac/kin/talmai-hijo-de-anac], mentions: [place:egipto], note: "Hebrón se construyó siete años antes que Zoan. Los anaquim son un pueblo sin ficha. Escol recibe su nombre por el racimo; también llevan granadas e higos."}
    - {v: 25-33, type: narration, entities: [event:los-espias-informan-en-cades, place:cades, place:desierto-de-paran, person:moises, person:aaron, person:caleb-hijo-de-jefune], mentions: [place:negueb, place:rio-jordan, place:mar-grande, place:amalec], note: "Pueblos sin ficha: amalequitas en el Négueb; hititas, jebuseos y amorreos en los montes; cananeos junto al mar y al Jordán. Nefilim e hijos de Anac, como pueblo, van solo aquí."}
  14:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: narration, entities: [event:israel-se-niega-a-entrar-en-canaan, person:moises, person:aaron, person:josue-hijo-de-nun, person:caleb-hijo-de-jefune, relation:caleb-hijo-de-jefune/accompanies/josue-hijo-de-nun, relation:caleb-hijo-de-jefune/kin/jefune-padre-de-caleb, relation:josue-hijo-de-nun/kin/nun], mentions: [place:egipto, person:nun, person:jefune-padre-de-caleb], note: "La gloria de Jehová aparece sobre la tienda de reunión, que no lleva ficha propia."}
    - {v: 11-25, type: narration, entities: [event:jehova-condena-a-israel-a-40-anos-en-el-desierto, person:moises, person:caleb-hijo-de-jefune], mentions: [place:egipto, place:mar-rojo, place:amalec], note: "Jehová amenaza con destruir al pueblo; Moisés apela a su fama ante las naciones y a su amor leal, y Jehová perdona. Caleb recibirá la tierra. Al día siguiente deben volver al desierto rumbo al mar Rojo."}
    - {v: 26-38, type: speech, entities: [event:jehova-condena-a-israel-a-40-anos-en-el-desierto, person:moises, person:aaron, person:josue-hijo-de-nun, person:caleb-hijo-de-jefune, person:samua-hijo-de-zacur, person:safat-hijo-de-hori, person:igal-hijo-de-jose, person:palti-hijo-de-rafu, person:gadiel, person:gaddi, person:amiel-hijo-de-guemali, person:setur, person:nahbi, person:gueuel], mentions: [person:nun, person:jefune-padre-de-caleb], note: "Sentencia: 40 años, un año por cada día de exploración, hasta que caiga el último de los registrados. Los diez espías del mal informe morirán ante Jehová."}
    - {v: 39-45, type: narration, entities: [event:israel-es-derrotado-hasta-horma, person:moises, place:horma], mentions: [place:amalec], note: "El arca del pacto se queda en el campamento con Moisés. La montaña del combate no tiene nombre."}
  15:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-16, type: law, entities: [event:jehova-da-leyes-de-ofrendas-para-la-tierra-prometida, person:moises], note: "Para cuando vivan en la tierra: cada sacrificio lleva su ofrenda de grano con aceite y su vino, en medidas según sea cordero, carnero o toro. El extranjero residente sigue la misma ley."}
    - {v: 17-21, type: law, entities: [event:jehova-da-leyes-de-ofrendas-para-la-tierra-prometida, person:moises], note: "Al comer el pan de la tierra, darán a Jehová roscas hechas con la primera harina gruesa, igual que la contribución de la era, en todas sus generaciones."}
    - {v: 22-31, type: law, entities: [event:jehova-da-leyes-de-ofrendas-para-la-tierra-prometida, person:moises], note: "Si el pueblo falla sin saberlo, ofrece un toro y un cabrito y queda perdonado; si falla uno solo, una cabra. Quien peca a propósito desprecia a Jehová y debe ser eliminado."}
    - {v: 32-36, type: narration, entities: [event:apedrean-al-que-recogia-lena-en-sabado, person:moises, person:aaron], note: "El desierto no se nombra. El hombre no tiene nombre; queda detenido hasta que Jehová decide su castigo."}
    - {v: 37-41, type: law, entities: [event:jehova-manda-poner-flecos-en-la-ropa, person:moises], mentions: [place:egipto, event:exodo], note: "Flecos con un cordón azul en el borde de la ropa, para recordar los mandamientos. Jehová se presenta como el Dios que los sacó de Egipto."}
  16:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:rebelion-de-core, person:core-hijo-de-izhar, person:izhar-hijo-de-cohat, person:cohat, person:datan, person:abiram-hijo-de-eliab, person:eliab-hijo-de-palu, person:on-hijo-de-pelez, person:pelez-padre-de-on, person:moises, person:aaron, relation:core-hijo-de-izhar/kin/izhar-hijo-de-cohat, relation:izhar-hijo-de-cohat/kin/cohat, relation:cohat/kin/levi-hijo-de-jacob, relation:datan/kin/eliab-hijo-de-palu, relation:datan/kin/abiram-hijo-de-eliab, relation:abiram-hijo-de-eliab/kin/eliab-hijo-de-palu, relation:on-hijo-de-pelez/kin/pelez-padre-de-on, relation:on-hijo-de-pelez/kin/ruben-hijo-de-jacob, relation:pelez-padre-de-on/same_as/palu], mentions: [person:ruben-hijo-de-jacob, person:levi-hijo-de-jacob], note: "«De los hijos de Rubén» es la tribu. Se suman 250 jefes sin nombre. Perspicacia ve posible que Pélez sea Palú, hijo de Rubén."}
    - {v: 4-11, type: narration, entities: [event:rebelion-de-core, person:core-hijo-de-izhar, person:moises, person:aaron], note: "Moisés se postra y cita a Coré y a los suyos con braserillos e incienso para el día siguiente: Jehová mostrará a quién escoge. Les echa en cara que, siendo levitas, buscan también el sacerdocio."}
    - {v: 12-15, type: narration, entities: [event:rebelion-de-core, person:datan, person:abiram-hijo-de-eliab, person:moises], note: "Datán y Abiram no acuden: llaman tierra de leche y miel a Egipto, sin nombrarlo, y acusan a Moisés de querer dominarlos. Moisés pide a Jehová que no acepte su ofrenda."}
    - {v: 16-17, type: narration, entities: [event:rebelion-de-core, person:core-hijo-de-izhar, person:moises, person:aaron], note: "Moisés fija la prueba: 250 braserillos, más los de Coré y Aarón, delante de Jehová."}
    - {v: 18-24, type: narration, entities: [event:la-tierra-se-traga-a-datan-y-abiram, person:core-hijo-de-izhar, person:moises, person:aaron], note: "Ante la tienda de reunión aparece la gloria de Jehová. Moisés y Aarón ruegan por el pueblo y Jehová manda alejarse de las tiendas de los tres cabecillas."}
    - {v: 25-34, type: narration, entities: [event:la-tierra-se-traga-a-datan-y-abiram, person:datan, person:abiram-hijo-de-eliab, person:core-hijo-de-izhar, person:moises], note: "Moisés va con los ancianos a las tiendas de Datán y Abiram. El suelo se abre y baja vivos a la Tumba, el Seol, a ellos, a sus familias y a la gente y los bienes de Coré."}
    - {v: "35", type: narration, entities: [event:muerte-de-core, person:core-hijo-de-izhar], note: "El fuego de Jehová consume a los 250 del incienso; Coré muere con ellos según Nú 26:10."}
    - {v: 36-40, type: narration, entities: [event:eleazar-reviste-el-altar-con-los-braserillos, person:eleazar-hijo-de-aaron, relation:eleazar-hijo-de-aaron/kin/aaron, person:moises, person:core-hijo-de-izhar], mentions: [person:aaron], note: "Los braserillos quedaron santos al presentarse ante Jehová; las láminas del altar recuerdan que solo los descendientes de Aarón queman incienso."}
    - {v: 41-50, type: narration, entities: [event:aaron-detiene-la-plaga, person:aaron, person:moises], note: "Al día siguiente el pueblo culpa a Moisés y a Aarón; la nube cubre la tienda. Mueren 14.700, además de los muertos por lo de Coré."}
  17:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [event:la-vara-de-aaron-echa-brotes, person:moises, person:aaron], note: "Jehová pide doce varas, la de cada jefe de casa paterna; en la de Leví, que aquí es la tribu y no el hijo de Jacob, va escrito el nombre de Aarón."}
    - {v: 6-9, type: narration, entities: [event:la-vara-de-aaron-echa-brotes, person:moises, person:aaron], note: "Los jefes, sin nombre, entregan sus varas y Moisés las deja ante Jehová. Al día siguiente la de Aarón tiene brotes, flores y almendras maduras; cada jefe recoge la suya."}
    - {v: 10-13, type: narration, entities: [event:la-vara-de-aaron-echa-brotes, person:moises, person:aaron], note: "La vara de Aarón vuelve delante del Testimonio como señal para los rebeldes. El pueblo teme morir si alguno se acerca al tabernáculo."}
  18:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: law, entities: [event:jehova-fija-los-deberes-de-sacerdotes-y-levitas, person:aaron], note: "Jehová habla a Aarón: él y sus hijos responden del santuario y del sacerdocio; los levitas, su tribu, los ayudan sin tocar el altar ni lo santo. Quien no sea de su familia y se acerque muere."}
    - {v: 8-19, type: law, entities: [event:jehova-fija-los-deberes-de-sacerdotes-y-levitas, person:aaron], note: "Porciones de los sacerdotes: ofrendas santísimas, regalos y ofrendas mecidas, lo mejor del aceite, el vino y el grano, las primicias, lo dedicado y los primogénitos, con rescate de cinco siclos. Es un pacto de sal."}
    - {v: 20-24, type: law, entities: [event:jehova-fija-los-deberes-de-sacerdotes-y-levitas, person:aaron], note: "Aarón no tendrá tierra: Jehová es su porción. Los levitas, sin herencia entre las tribus, reciben la décima parte de Israel a cambio del servicio de la tienda de reunión."}
    - {v: 25-32, type: law, entities: [event:jehova-fija-los-deberes-de-sacerdotes-y-levitas, person:moises, person:aaron], note: "Por medio de Moisés: los levitas dan al sacerdote Aarón una décima parte, de lo mejor, de lo que reciben. Lo demás es su salario y lo comen donde quieran."}
  19:
    status: complete
    reviewed_on: 2026-09-29
    spans:
