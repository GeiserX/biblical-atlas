    - {v: 3-5, type: law, note: "La joven que vive con su padre: su voto vale si él calla al saberlo; si él lo prohíbe, no vale y Jehová la perdona."}
    - {v: 6-8, type: law, note: "Si se casa con un voto pendiente, su esposo lo confirma callando el día que se entera o lo anula ese mismo día."}
    - {v: "9", type: law, note: "La viuda y la divorciada quedan obligadas por todo lo que prometen."}
    - {v: 10-15, type: law, note: "La esposa que promete estando en casa de su esposo: él confirma callando o anula el día que lo sabe. Si lo anula tarde, carga él con la culpa."}
    - {v: "16", type: law, note: "Cierre: son las normas de Jehová para esposo y esposa, y para padre e hija que vive en su casa."}
