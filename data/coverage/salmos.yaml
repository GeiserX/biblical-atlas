    note: "Sin nombres de personas ni de lugares, salvo Jehová. Perspicacia «Salmos, Libro de los» y «Ezequías» ven indicios de que lo compuso Ezequías siendo aún príncipe; no lleva encabezamiento."
    spans:
    - {v: 1-8, type: poetry, note: "Estrofa álef de un salmo acróstico sin encabezamiento: cada estrofa de ocho versos empieza por una letra hebrea. Felices quienes siguen la ley de Jehová; el salmista pide firmeza para cumplirla."}
    - {v: 9-16, type: poetry, note: "Estrofa bet. Un joven se mantiene limpio si guía su vida por la palabra de Dios; el salmista la guarda dentro para no pecar y disfruta de ella más que de las riquezas."}
    - {v: 17-24, type: poetry, note: "Estrofa guímel. Se siente forastero en la tierra y pide a Dios que le abra los ojos a su ley. Aunque unos príncipes lo critican, sigue meditando en los recordatorios, que son sus consejeros."}
    - {v: 25-32, type: poetry, note: "Estrofa dálet. Abatido y sin sueño por la tristeza, pide vida y fuerzas; ha escogido la fidelidad y quiere correr por la senda de los mandamientos."}
    - {v: 33-40, type: poetry, note: "Estrofa he. Pide que Dios le enseñe y lo guíe, que incline su corazón a los recordatorios y no a la ganancia, y que aparte sus ojos de lo inútil."}
    - {v: 41-48, type: poetry, note: "Estrofa waw. Con la confianza puesta en la palabra de Dios podrá contestar a quien lo ofende y hablar de sus recordatorios hasta ante reyes sin sentir vergüenza."}
    - {v: 49-56, type: poetry, note: "Estrofa zayin. La promesa de Dios lo consuela en el sufrimiento; aunque los soberbios se ríen de él, recuerda los juicios antiguos y de noche piensa en el nombre de Jehová."}
    - {v: 57-64, type: poetry, note: "Estrofa jet. Jehová es su porción. Revisa su conducta, obedece sin tardar aunque lo aten los malvados, se levanta a medianoche a dar gracias y busca la compañía de quienes temen a Dios."}
    - {v: 65-72, type: poetry, note: "Estrofa tet. Antes de sufrir se extraviaba; el sufrimiento le enseñó las normas de Dios, y la ley vale para él más que montones de oro y plata."}
    - {v: 73-80, type: poetry, note: "Estrofa yod. Reconoce a Dios como su Hacedor y admite que lo hizo sufrir con fidelidad; pide misericordia, que los soberbios se avergüencen y que vuelvan a él los que temen a Dios."}
    - {v: 81-88, type: poetry, note: "Estrofa kaf. Consumido como un odre ahumado, pregunta cuánto tendrá que esperar. Lo persiguen sin motivo y casi acaban con él, pero no deja las órdenes de Dios."}
    - {v: 89-96, type: poetry, note: "Estrofa lámed. La palabra de Jehová es firme en los cielos y la tierra sigue en pie por sus decretos; sin su cariño a la ley, el salmista habría muerto en la aflicción."}
    - {v: 97-104, type: poetry, note: "Estrofa mem. Medita en la ley todo el día; eso lo hace más sabio que sus enemigos, sus maestros y los ancianos, y las palabras de Dios le saben más dulces que la miel."}
    - {v: 105-112, type: poetry, note: "Estrofa nun. La palabra de Dios alumbra su camino. Ha jurado obedecer; aunque su vida corre peligro y le ponen trampas, no se aparta y hace de los recordatorios su herencia."}
    - {v: 113-120, type: poetry, note: "Estrofa sámekh. Rechaza a los de corazón dividido y a los malvados; Dios es su refugio y su escudo y desecha a los impíos como escoria. Tiembla de respeto ante sus juicios."}
    - {v: 121-128, type: poetry, note: "Estrofa ayin. Pide que no lo dejen en manos de opresores; como la ley se viola, es hora de que Jehová actúe, y por eso ama los mandamientos más que el oro refinado."}
    - {v: 129-136, type: poetry, note: "Estrofa pe. Las palabras de Dios dan luz y entendimiento al inexperto; pide que el rostro divino le sonría, y llora a raudales porque la gente no guarda la ley."}
    - {v: 137-144, type: poetry, note: "Estrofa sadé. Jehová y sus recordatorios son justos. Aunque se siente pequeño y despreciado y le cae la angustia, su celo arde y no olvida las órdenes de Dios."}
    - {v: 145-152, type: poetry, note: "Estrofa qof. Clama de corazón antes del alba y en las vigilias nocturnas; los de conducta vergonzosa se le acercan, pero Jehová está más cerca y sus recordatorios duran siempre."}
    - {v: 153-160, type: poetry, note: "Estrofa resh. Pide que Dios defienda su causa y lo rescate; la salvación queda lejos de los malvados, los traidores le dan asco y la palabra de Dios es verdad en su esencia."}
    - {v: 161-168, type: poetry, note: "Estrofa sin o shin. Aunque unos príncipes lo persiguen sin razón, se alegra con la palabra de Dios como quien halla un gran botín y lo alaba siete veces al día; quien ama la ley tiene paz."}
    - {v: 169-176, type: poetry, note: "Estrofa taw. Pide que su súplica llegue a Dios, que su mano lo ayude y que le deje vivir para alabarlo; se ha extraviado como una oveja y ruega que Jehová vaya a buscarlo."}
