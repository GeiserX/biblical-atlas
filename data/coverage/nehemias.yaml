Dios. Sacrificios y alegría de hombres, mujeres y niños, que se oye de lejos."}
    - {v: 44-47, type: narration, entities: [event:inauguracion-de-la-muralla-455], mentions: [person:david, person:salomon, person:asaf-hijo-de-berekias, person:zorobabel, person:nehemias, person:aaron, place:juda, event:se-lee-la-ley-y-se-aparta-a-los-extranjeros, period:gobierno-de-zorobabel, period:gobierno-de-nehemias], note: "Ese día nombran encargados de los almacenes de contribuciones, primicias y diezmos para sacerdotes y levitas, y el servicio sigue las instrucciones de David y Salomón."}
  13:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-3, type: narration, entities: [event:se-lee-la-ley-y-se-aparta-a-los-extranjeros], mentions: [person:moises, person:balaam, event:balac-manda-llamar-a-balaam, place:ammon, place:moab, place:jerusalen], note: "Lo que leen es la ley de Dt 23:3-6, según las referencias. «Ese día» lo une «Toda Escritura» a la dedicación del muro."}
    - {v: 4-5, type: narration, entities: [event:nehemias-regresa-a-jerusalen, person:eliasib-sumo-sacerdote, relation:eliasib-sumo-sacerdote/kin/tobias-el-ammonita, relation:eliasib-sumo-sacerdote/lived_in/jerusalen, person:tobias-el-ammonita], note: "Antes de eso, el sacerdote Eliasib, encargado de los almacenes, había dado a su pariente Tobías un cuarto grande donde se guardaban ofrendas y diezmos."}
    - {v: "6", type: narration, entities: [event:nehemias-vuelve-a-la-corte-443, person:nehemias, person:artajerjes-i, relation:nehemias/tie/artajerjes-i@-442], mentions: [place:babilonia, place:jerusalen, period:artajerjes-i, period:gobierno-de-nehemias], note: "En el año 32 de Artajerjes, rey de Babilonia, Nehemías había vuelto con el rey; más tarde pidió permiso para ausentarse."}
    - {v: 7-9, type: narration, entities: [event:nehemias-regresa-a-jerusalen, place:jerusalen, person:nehemias, relation:nehemias/lived_in/jerusalen@-442, person:eliasib-sumo-sacerdote, relation:eliasib-sumo-sacerdote/lived_in/jerusalen, person:tobias-el-ammonita]}
    - {v: 10-14, type: narration, entities: [event:nehemias-restablece-la-parte-de-los-levitas, person:nehemias, person:selemias-encargado-de-los-almacenes, relation:selemias-encargado-de-los-almacenes/holds_office/-, person:sadoc-copista, relation:sadoc-copista/accompanies/selemias-encargado-de-los-almacenes, person:pedaya-encargado-de-los-almacenes, relation:pedaya-encargado-de-los-almacenes/accompanies/selemias-encargado-de-los-almacenes, relation:sadoc-copista/same_as/sadoc-hijo-de-imer, person:hanan-hijo-de-zacur, relation:hanan-hijo-de-zacur/kin/zacur-hijo-de-matanias, relation:hanan-hijo-de-zacur/kin/matanias-abuelo-de-hanan, relation:hanan-hijo-de-zacur/accompanies/selemias-encargado-de-los-almacenes, relation:hanan-hijo-de-zacur/accompanies/sadoc-copista, relation:hanan-hijo-de-zacur/accompanies/pedaya-encargado-de-los-almacenes, person:zacur-hijo-de-matanias, relation:zacur-hijo-de-matanias/kin/matanias-abuelo-de-hanan, relation:hanan-hijo-de-zacur/same_as/hanan-levita-que-explico-la-ley, relation:hanan-hijo-de-zacur/same_as/hanan-levita-firmante, relation:zacur-hijo-de-matanias/same_as/zacur-levita-firmante, person:matanias-abuelo-de-hanan, relation:matanias-abuelo-de-hanan/same_as/matanias-antepasado-de-jahaziel, relation:matanias-abuelo-de-hanan/same_as/matanias-hijo-de-mica], mentions: [place:juda, person:matanias-hijo-de-mica, person:matanias-antepasado-de-jahaziel]}
    - {v: 15-22, type: narration, entities: [event:nehemias-hace-respetar-el-sabado, person:nehemias, place:jerusalen], mentions: [place:tiro, place:juda, place:israel], note: "Los tirios, gente de Tiro, vivían en la ciudad y vendían allí pescado. Los levitas guardan las puertas."}
    - {v: 23-29, type: narration, entities: [event:nehemias-reprende-a-los-casados-con-extranjeras, person:nehemias, person:sanbalat, person:joiada-hijo-de-eliasib, relation:joiada-hijo-de-eliasib/kin/eliasib-sumo-sacerdote, person:eliasib-sumo-sacerdote, relation:eliasib-sumo-sacerdote/succeeds/joiaquim], mentions: [place:asdod, place:ammon, place:moab, person:salomon, event:las-esposas-extranjeras-desvian-a-salomon, place:israel], note: "El hijo de Joiadá expulsado no se nombra; era yerno de Sanbalat el horonita, de Bet-Horón o de Horonaim según Perspicacia «Sanbalat», sin decidir."}
    - {v: 30-31, type: narration, entities: [event:nehemias-reprende-a-los-casados-con-extranjeras, person:nehemias], note: "Nehemías purifica al pueblo, ordena los turnos de sacerdotes y levitas, la leña y los primeros frutos, y pide a Dios que lo recuerde para bien."}
