    - {v: 10-14, type: narration, entities: [event:enemigos-tratan-de-detener-a-nehemias, person:semaya-hijo-de-delaya, person:delaya-hijo-de-mehetabel, person:mehetabel-antepasado-de-semaya, person:noadias-profetisa, person:tobias-el-ammonita, person:sanbalat, person:nehemias, relation:semaya-hijo-de-delaya/kin/delaya-hijo-de-mehetabel, relation:semaya-hijo-de-delaya/tie/tobias-el-ammonita, relation:semaya-hijo-de-delaya/tie/sanbalat, relation:delaya-hijo-de-mehetabel/kin/mehetabel-antepasado-de-semaya], mentions: [place:jerusalen], note: "Nehemías, que no es sacerdote, se niega a entrar en el templo para salvarse. Pide a Dios que recuerde a Tobías, a Sanbalat, a Noadías y a los demás profetas."}
    - {v: 15-16, type: narration, entities: [event:muros-de-jerusalen-455], mentions: [place:jerusalen], note: "El muro se acaba el 25 de elul, en 52 días; los enemigos y las naciones vecinas ven que la obra vino de Dios."}
    - {v: 17-19, type: narration, entities: [event:enemigos-tratan-de-detener-a-nehemias, person:tobias-el-ammonita, person:secanias-hijo-de-ara, person:ara-antepasado-de-secanias, person:jehohanan-hijo-de-tobias, person:mesulam-hijo-de-berekias, person:berekias-hijo-de-mesezabel, relation:tobias-el-ammonita/kin/secanias-hijo-de-ara, relation:secanias-hijo-de-ara/kin/ara-antepasado-de-secanias, relation:jehohanan-hijo-de-tobias/kin/tobias-el-ammonita, relation:jehohanan-hijo-de-tobias/kin/mesulam-hijo-de-berekias, relation:mesulam-hijo-de-berekias/kin/berekias-hijo-de-mesezabel, relation:mesulam-enviado-a-casifia/same_as/mesulam-hijo-de-berekias], mentions: [place:juda, person:mesulam-enviado-a-casifia, person:nehemias], note: "Nobles de Judá se escriben con Tobías y le cuentan lo que dice Nehemías; la esposa de Jehohanán, hija de Mesulam, no tiene nombre."}
  7:
