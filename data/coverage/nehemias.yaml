    - {v: 17-21, type: narration, entities: [person:rehum-hijo-de-bani, relation:rehum-hijo-de-bani/kin/bani-padre-de-rehum, person:bani-padre-de-rehum, person:hasabias-principe-de-queila, person:bavai, relation:bavai/kin/henadad, person:henadad, person:ezer-hijo-de-jesua, relation:ezer-hijo-de-jesua/kin/jesua-padre-de-ezer, person:jesua-padre-de-ezer, relation:jesua-cabeza-de-casa-levita/same_as/jesua-padre-de-ezer, person:baruc-hijo-de-zabai, relation:baruc-hijo-de-zabai/kin/zabai-padre-de-baruc, person:zabai-padre-de-baruc, person:eliasib-sumo-sacerdote, relation:eliasib-sumo-sacerdote/lived_in/jerusalen, person:meremot-hijo-de-uriya], mentions: [place:queila, place:mizpa-de-benjamin, person:zabai, person:uriya-hijo-de-hacoz, person:hacoz, relation:zabai/same_as/zabai-padre-de-baruc, person:jesua-cabeza-de-casa-levita], note: "Trabajan los levitas. Hasabías y Bavái son príncipes de las dos mitades del distrito de Queilá. Arsenal y Contrafuerte, en names de Jerusalén."}
    - {v: 22-24, type: narration, entities: [person:benjamin-companero-de-hasub, relation:benjamin-companero-de-hasub/accompanies/hasub-companero-de-benjamin, relation:benjamin-companero-de-hasub/lived_in/jerusalen, relation:benjamin-companero-de-hasub/same_as/benjamin-descendiente-de-harim, person:hasub-companero-de-benjamin, relation:hasub-companero-de-benjamin/lived_in/jerusalen, person:azarias-hijo-de-maaseya, relation:azarias-hijo-de-maaseya/kin/maaseya-hijo-de-ananiah, relation:azarias-hijo-de-maaseya/lived_in/jerusalen, person:maaseya-hijo-de-ananiah, relation:maaseya-hijo-de-ananiah/kin/ananiah, person:ananiah, person:binui-hijo-de-henadad, relation:binui-hijo-de-henadad/kin/henadad], mentions: [place:distrito-del-jordan, person:benjamin-descendiente-de-harim, person:henadad], note: "Los sacerdotes del Distrito del Jordán (o del distrito vecino, según la nota) reparan un tramo."}
