    - {v: 27-30, type: narration, entities: [event:inauguracion-de-la-muralla-455, place:jerusalen, place:netofa, place:bet-guilgal, place:gueba, place:azmavet], mentions: [place:distrito-del-jordan, place:guilgal, place:guilgal-cerca-de-betel], note: "Traen a los levitas y a los cantores, que vivían en poblados de los netofatitas, Bet-Guilgal, Gueba y Azmávet. La nota del v. 28 dice que el distrito es el del Jordán."}
    - {v: 31-37, type: narration, entities: [event:inauguracion-de-la-muralla-455, place:jerusalen, person:nehemias, person:hosaya-principe-de-juda, person:azarias-de-la-procesion-del-muro, relation:azarias-de-la-procesion-del-muro/same_as/azarias-sacerdote-firmante, person:esdras-de-la-procesion-del-muro, person:esdras, person:mesulam-de-la-procesion-del-muro, person:juda-de-la-procesion-del-muro, relation:mesulam-de-la-procesion-del-muro/same_as/mesulam-enviado-a-casifia, person:benjamin-companero-de-hasub, relation:benjamin-companero-de-hasub/same_as/benjamin-descendiente-de-harim, person:semaya-de-la-procesion-del-muro, person:jeremias-de-la-procesion-del-muro, person:zacarias-hijo-de-jonatan, relation:jeremias-de-la-procesion-del-muro/same_as/jeremias-sacerdote-de-zorobabel, relation:jeremias-de-la-procesion-del-muro/same_as/jeremias-sacerdote-firmante, relation:zacarias-hijo-de-jonatan/kin/jonatan-hijo-de-semaya, relation:zacarias-hijo-de-jonatan/kin/asaf-hijo-de-berekias, relation:zacarias-hijo-de-jonatan/holds_office/-, person:jonatan-hijo-de-semaya, relation:jonatan-hijo-de-semaya/kin/semaya-hijo-de-matanias, relation:jonatan-hijo-de-semaya/holds_office/-, person:semaya-hijo-de-matanias, relation:semaya-hijo-de-matanias/kin/matanias-hijo-de-mica, person:matanias-hijo-de-mica, relation:matanias-hijo-de-mica/kin/mica-hijo-de-zicri, relation:semaya-hijo-de-matanias/holds_office/-, person:mica-hijo-de-zicri, relation:mica-hijo-de-zicri/kin/zacur-hijo-de-asaf, relation:mica-hijo-de-zicri/kin/zicri-hijo-de-asaf, person:zacur-hijo-de-asaf, person:semaya-musico-de-la-procesion, relation:semaya-musico-de-la-procesion/holds_office/-, relation:zacur-hijo-de-asaf/kin/asaf-hijo-de-berekias, person:azarel-musico-de-la-procesion, person:milalai, person:guilalai, person:maai, relation:maai/holds_office/-, person:netanel-musico-de-la-procesion, person:netanel-descendiente-de-pasjur, relation:netanel-descendiente-de-pasjur/same_as/netanel-musico-de-la-procesion, person:juda-