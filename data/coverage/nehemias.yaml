    - {v: 28-32, type: narration, entities: [person:sadoc-hijo-de-imer, relation:sadoc-hijo-de-imer/kin/imer-padre-de-sadoc, relation:sadoc-hijo-de-imer/lived_in/jerusalen, person:imer-padre-de-sadoc, relation:imer-de-tiempos-de-david/same_as/imer-padre-de-sadoc, person:semaya-guarda-de-la-puerta-oriental, relation:semaya-guarda-de-la-puerta-oriental/kin/secanias-padre-de-semaya-el-guarda, person:secanias-padre-de-semaya-el-guarda, person:hananias-hijo-de-selemias, relation:hananias-hijo-de-selemias/kin/selemias-padre-de-hananias, relation:hananias-hijo-de-selemias/accompanies/hanun-hijo-de-zalaf, person:selemias-padre-de-hananias, person:hanun-hijo-de-zalaf, relation:hanun-hijo-de-zalaf/kin/zalaf, person:zalaf, person:mesulam-hijo-de-berekias, relation:mesulam-hijo-de-berekias/lived_in/jerusalen, person:malkiya-orfebre], mentions: [person:imer-de-tiempos-de-david], note: "Puerta de los Caballos, Puerta Oriental, Puerta de la Inspección y Puerta de las Ovejas, en names de Jerusalén. Los sacerdotes trabajan frente a sus casas; orfebres y comerciantes cierran la vuelta."}
  4:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-6, type: narration, entities: [event:sanbalat-y-tobias-se-burlan-de-la-muralla, person:sanbalat, person:tobias-el-ammonita, person:nehemias, place:jerusalen], mentions: [place:samaria], note: "Oración de Nehemías contra los que se burlan (vv. 4, 5). Los judíos, sin ficha. Tobías es el ammonita, de un pueblo sin ficha."}
