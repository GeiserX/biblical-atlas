    - {v: 17-20, type: speech, entities: [event:nehemias-anima-a-reconstruir-la-muralla, person:nehemias, person:sanbalat, person:tobias-el-ammonita, person:guesem, place:jerusalen, relation:guesem/tie/nehemias, relation:sanbalat/tie/guesem, relation:guesem/born_in/arabia], mentions: [event:muros-de-jerusalen-455], note: "La obra misma empieza después, hacia el 4 de ab de 455: es el suceso muros-de-jerusalen-455, que crean los capítulos siguientes."}
