    - {v: 8-12, type: narration, entities: [person:uziel-hijo-de-harhaya, relation:uziel-hijo-de-harhaya/kin/harhaya, person:harhaya, person:hananias-fabricante-de-unguentos, relation:uziel-hijo-de-harhaya/accompanies/hananias-fabricante-de-unguentos, person:refaya-hijo-de-hur, relation:refaya-hijo-de-hur/kin/hur-padre-de-refaya, person:hur-padre-de-refaya, person:jedaya-hijo-de-harumaf, relation:jedaya-hijo-de-harumaf/kin/harumaf, relation:jedaya-hijo-de-harumaf/lived_in/jerusalen, person:harumaf, person:hatus-hijo-de-hasabneya, relation:hatus-hijo-de-hasabneya/kin/hasabneya-padre-de-hatus, person:hasabneya-padre-de-hatus, person:malkiya-hijo-de-harim, relation:malkiya-hijo-de-harim/kin/harim-cabeza-de-familia, relation:malkiya-hijo-de-harim/accompanies/hasub-hijo-de-pahat-moab, relation:malkiya-descendiente-de-harim/same_as/malkiya-hijo-de-harim, person:hasub-hijo-de-pahat-moab, relation:hasub-hijo-de-pahat-moab/kin/pahat-moab, person:salum-hijo-de-halohes, relation:salum-hijo-de-halohes/kin/halohes-padre-de-salum, person:halohes-padre-de-salum], mentions: [person:harim-cabeza-de-familia, person:pahat-moab, person:malkiya-descendiente-de-harim], note: "Muro Ancho y Torre de los Hornos, en names de Jerusalén. Refayá y Salum son príncipes de media Jerusalén; las hijas de Salum trabajan con él y no se nombran."}
