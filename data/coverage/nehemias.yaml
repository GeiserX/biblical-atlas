    - {v: 38-39, type: narration, entities: [event:inauguracion-de-la-muralla-455, place:jerusalen, person:nehemias], note: "El segundo coro, con Nehemías detrás, pasa por la Torre de los Hornos, el Muro Ancho y las puertas del norte hasta la Puerta de la Guardia."}
