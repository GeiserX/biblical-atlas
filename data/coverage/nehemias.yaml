  2:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-8, type: narration, entities: [event:nehemias-pide-permiso-a-artajerjes, journey:nehemias-a-jerusalen, person:nehemias, person:artajerjes-i, person:asaf-guarda-del-parque, place:susa, place:jerusalen, place:parque-del-rey, relation:nehemias/tie/artajerjes-i@-455, relation:asaf-guarda-del-parque/tie/artajerjes-i], mentions: [place:juda, place:region-al-oeste-del-eufrates, event:profecia-de-las-setenta-semanas], note: "La reina sentada junto al rey no tiene nombre. La Fortaleza de la Casa va en los nombres de Jerusalén. Perspicacia «Artajerjes» liga este permiso con Da 9:25."}
    - {v: 9-10, type: narration, entities: [event:nehemias-entrega-las-cartas-a-los-gobernadores, journey:nehemias-a-jerusalen, person:nehemias, person:sanbalat, person:tobias-el-ammonita, place:region-al-oeste-del-eufrates, relation:sanbalat/tie/nehemias, relation:tobias-el-ammonita/tie/nehemias, relation:tobias-el-ammonita/tie/artajerjes-i, relation:tobias-el-ammonita/born_in/ammon], note: "Los jefes militares y los jinetes de la escolta no tienen nombre. Horonita: de Bet-Horón o de Horonaim; Perspicacia cree más probable Bet-Horón, sin decir cuál de las dos."}
