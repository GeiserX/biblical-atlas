    - {v: 15-23, type: narration, entities: [event:nehemias-arma-a-los-que-reconstruyen-la-muralla, person:nehemias, place:jerusalen], mentions: [place:juda], note: "Media gente trabaja y media vigila; los príncipes respaldan a la casa de Judá, la gente de la provincia. Los que cargan llevan un arma en la otra mano, el del cuerno va con Nehemías y todos duermen en Jerusalén."}
  5:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-5, type: narration, entities: [event:nehemias-pone-fin-a-la-usura], note: "Unos piden grano para sus muchos hijos; otros han empeñado campos, viñas y casas, o pedido prestado para el tributo del rey, y ven a sus hijas hechas esclavas."}
    - {v: 6-13, type: narration, entities: [event:nehemias-pone-fin-a-la-usura, person:nehemias], note: "Nehemías acusa a nobles y gobernantes subordinados de cobrar intereses a sus hermanos. Prometen devolver campos, viñas, olivares, casas e intereses; él sacude el pliegue de su ropa y la congregación responde «amén»."}
    - {v: 14-19, type: narration, entities: [period:gobierno-de-nehemias, person:nehemias, person:artajerjes-i, relation:nehemias/lived_in/jerusalen@-454, relation:nehemias/tie/artajerjes-i@-454], mentions: [place:juda, place:jerusalen, period:artajerjes-i, event:nehemias-vuelve-a-la-corte-443], note: "Mirada atrás a sus doce años de gobierno, del año 20 al 32 de Artajerjes: no cobró la comida del gobernador, sentó a 150 judíos a su mesa y trabajó en el muro sin comprar tierras."}
  6:
    status: complete
