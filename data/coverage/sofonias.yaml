    - {v: 2-3, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova], note: "Jehová anuncia que barrerá de la tierra a hombres y animales, aves y peces. Los obstáculos que eliminará son, según la nota al pie, cosas y prácticas de la idolatría."}
    - {v: 4-6, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova, place:juda, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607, event:josias-limpia-juda-de-idolatria], note: "Contra Judá y Jerusalén: caerán los restos de Baal, los sacerdotes de dioses extranjeros, quienes adoran a los astros en las azoteas y quienes juran por Jehová y por Malcam, dios ammonita según Perspicacia. Se cumplió en 607."}
    - {v: 7-9, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova], mentions: [event:destruccion-de-jerusalen-607], note: "Silencio: el día de Jehová se acerca y él tiene listo un sacrificio. Pedirá cuentas a príncipes, hijos del rey y a quienes visten a lo extranjero. «Toda Escritura» lo ve cumplido en los hijos y el nieto de Josías."}
    - {v: 10-13, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Habrá gritos en la Puerta del Pescado, el Segundo Barrio y Mactés, zonas de Jerusalén según Perspicacia, y caerán los comerciantes. Jehová revisará la ciudad con lámparas; los indiferentes perderán casas y viñas."}
    - {v: 14-18, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova], mentions: [event:destruccion-de-jerusalen-607], note: "El gran día de Jehová llega deprisa: furia, angustia, tinieblas y toques de guerra contra las ciudades amuralladas. Ni plata ni oro salvarán. «Toda Escritura» compara el v. 17 con Lamentaciones 4:14, escrito tras 607."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova], mentions: [event:destruccion-de-jerusalen-607], note: "Llamada a la nación sin vergüenza: antes de que llegue la furia de Jehová, que los mansos lo busquen a él, la justicia y la mansedumbre; quizá queden ocultos. «Toda Escritura» compara el v. 2 con Lamentaciones 4:11."}
    - {v: 4-7, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova, place:gaza, place:asquelon, place:asdod, place:ecron, place:filistea], mentions: [place:canaan, period:potencia-babilonica], note: "Gaza, Asquelón, Asdod y Ecrón quedarán vacías. La costa de los keretitas, pueblo afín a los filisteos, y Canaán, que aquí es su tierra, será pasto para el resto de Judá. Perspicacia atribuye el cumplimiento a Babilonia."}
    - {v: 8-11, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova, place:moab, place:ammon], mentions: [place:sodoma, place:gomorra, event:destruccion-de-sodoma-y-gomorra, person:nabucodonosor-ii], note: "Moab y los ammonitas se burlaron del pueblo de Jehová: acabarán como Sodoma y Gomorra, entre ortigas y sal. «Toda Escritura» recuerda que Nabucodonosor sometió a Moab y que ambos pueblos desaparecieron. Jehová dejará sin fuerza a los dioses."}
    - {v: "12", type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova, place:etiopia], mentions: [event:nabucodonosor-contra-egipto], note: "Los etíopes también caerán a espada. Perspicacia cree que, como aliados de Egipto, lo sufrieron cuando Nabucodonosor conquistó ese país (Eze 30:4, 5)."}
    - {v: 13-15, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova, place:asiria, place:ninive], mentions: [event:caida-de-ninive, period:potencia-asiria, person:nabopolasar, person:ciaxares], note: "Jehová arruinará Asiria, al norte, y dejará Nínive seca, refugio de fieras y aves. Perspicacia lo ve cumplido cuando Nabopolasar y el medo Ciaxares la tomaron; La Atalaya de 2007 dice que la voz que canta es de aves."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova, place:jerusalen], note: "¡Ay de la ciudad rebelde y opresora, que Perspicacia identifica con Jerusalén! Príncipes, jueces, profetas y sacerdotes se han corrompido. Jehová, justo, arrasó otras naciones como aviso, pero ella se corrompió todavía más."}
    - {v: "8", type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova], note: "Jehová pide que lo esperen: ha decidido reunir naciones y reinos para derramar sobre ellos su furia, y el fuego de su celo consumirá la tierra. Las referencias remiten a Joel 3:2 y a Ap 16:14."}
    - {v: 9-13, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova, place:etiopia], mentions: [place:jerusalen, event:regreso-de-537], note: "Los pueblos recibirán un idioma puro para servir unidos a Jehová; desde los ríos de Etiopía, sus dispersos le traerán regalos. En su santa montaña quedará un pueblo humilde. La Atalaya de 2007 ve en ese idioma la verdad bíblica."}
    - {v: 14-20, type: prophecy, entities: [event:sofonias-anuncia-el-dia-de-jehova, place:jerusalen], mentions: [event:regreso-de-537], note: "Sion, Israel y Jerusalén deben gritar de alegría: Jehová, Rey de Israel, está con ellos y salva como guerrero. Reunirá a los dispersos y les dará fama; Perspicacia lo une a la vuelta del cautiverio."}
