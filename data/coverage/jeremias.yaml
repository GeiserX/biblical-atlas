    - {v: 12-13, type: prophecy, entities: [event:jeremias-preso-anuncia-el-brote-de-david], mentions: [place:benjamin, place:jerusalen, place:juda, place:sefela, place:negueb], note: "Volverá a haber pastores con sus rebaños en toda la tierra: la Sefelá es la tierra baja y el Négueb, el sur. «La región montañosa» no lleva ficha, como en Jer 17:26 y 32:44."}
    - {v: 14-18, type: prophecy, entities: [event:jeremias-preso-anuncia-el-brote-de-david, event:pacto-con-david, place:jerusalen], mentions: [person:david, person:jesus, place:juda], note: "Brotará para David un brote justo, Jesús según Perspicacia «Rama, brote». Jerusalén se llamará Jehová Es Nuestra Justicia. Nunca faltará descendiente de David en el trono ni sacerdotes levitas, un grupo sin ficha, ante Jehová."}
    - {v: 19-22, type: prophecy, entities: [event:jeremias-preso-anuncia-el-brote-de-david, event:pacto-con-david], mentions: [person:jeremias-profeta, person:david, person:jesus], note: "El pacto con David y el de los levitas son tan firmes como la sucesión del día y la noche. Jehová multiplicará su descendencia como el ejército de los cielos y la arena del mar."}
    - {v: 23-26, type: prophecy, entities: [event:jeremias-preso-anuncia-el-brote-de-david, event:pacto-con-david], mentions: [person:jeremias-profeta, person:david, person:jacob, person:abrahan, person:isaac, event:regreso-de-537], note: "Algunos dicen que Jehová desechó a las dos familias, Israel y Judá. Él responde que nunca rechazará a la descendencia de Jacob ni de David, y que hará volver a los cautivos."}
