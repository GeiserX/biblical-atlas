    - {v: 10-14, type: prophecy, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada, person:jeremias-profeta], mentions: [event:destruccion-de-jerusalen-607], note: "Jeremías se lamenta de haber nacido: sin deber nada a nadie, todo el país lo maldice. Jehová promete ayudarlo; el hierro del norte no se rompe, y los tesoros del pueblo irán como botín a una tierra desconocida."}
    - {v: 15-21, type: poetry, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada, person:jeremias-profeta, relation:jeremias-profeta/holds_office/-], note: "Jeremías pide a Jehová que lo vengue; halló gozo en comer sus palabras y no se sentó con los que se divierten. Si vuelve, será su portavoz (nota del v. 19) y una muralla de cobre invencible."}
  16:
    status: complete
