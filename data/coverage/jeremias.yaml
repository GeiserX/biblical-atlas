    - {v: 27-28, type: prophecy, entities: [event:jeremias-anuncia-que-nabucodonosor-atacara-egipto], note: "Jacob e Israel son el pueblo, sin ficha. Jehová lo traerá del país de su cautiverio y acabará con las naciones, pero a él lo corregirá con medida. Repite casi palabra por palabra Jer 30:10, 11."}
