    - {v: 26-35, type: prophecy, entities: [event:jeremias-compra-el-campo-de-hanamel, place:valle-de-hinon], mentions: [person:nabucodonosor-ii, place:babilonia, place:jerusalen, place:juda, place:monte-moria, event:destruccion-de-jerusalen-607, event:manases-llena-juda-de-idolatria], note: "Jehová responde que los caldeos de Nabucodonosor tomarán y quemarán la ciudad por su idolatría: ofrendas a Baal en las azoteas, ídolos en su templo y niños sacrificados a Mólek. Perspicacia «Hinón» lo liga a Manasés."}
    - {v: 36-44, type: prophecy, entities: [event:jeremias-compra-el-campo-de-hanamel], mentions: [place:babilonia, place:benjamin, place:jerusalen, place:juda, place:sefela, place:negueb, event:regreso-de-537], note: "Jehová reunirá a los dispersos, les dará un solo corazón y un pacto eterno, y se comprarán campos en Benjamín, Jerusalén, Judá, la Sefelá y el Négueb. «La región montañosa» no lleva ficha, como en Jer 17:26."}
  33:
