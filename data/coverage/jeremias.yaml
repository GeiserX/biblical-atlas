    - {v: 14-17, type: prophecy, entities: [event:jeremias-proclama-la-maldicion-de-quienes-rompen-el-pacto], note: "Jeremías no debe orar por el pueblo. Ni la carne santa de los sacrificios del templo lo librará. Jehová llamó a su pueblo olivo frondoso y ahora lo incendia, porque Israel y Judá le ofrecieron sacrificios a Baal."}
    - {v: 18-20, type: poetry, entities: [event:los-hombres-de-anatot-amenazan-de-muerte-a-jeremias, event:jeremias-proclama-la-maldicion-de-quienes-rompen-el-pacto, person:jeremias-profeta], note: "Jehová le hace ver a Jeremías el complot: era como un cordero manso camino del matadero, y ellos querían cortar el árbol con su fruto. Pide que Jehová, que examina el corazón, juzgue su causa."}
    - {v: 21-23, type: prophecy, entities: [event:los-hombres-de-anatot-amenazan-de-muerte-a-jeremias, event:jeremias-proclama-la-maldicion-de-quienes-rompen-el-pacto, place:anatot, person:jeremias-profeta, relation:jeremias-profeta/lived_in/anatot, relation:jeremias-profeta/holds_office/-], mentions: [event:destruccion-de-jerusalen-607], note: "Los hombres de Anatot le prohíben profetizar en nombre de Jehová. Sus jóvenes morirán a espada y sus hijos de hambre, sin que quede resto. Perspicacia «Anatot» lo ve cumplido con la invasión babilonia."}
  12:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-4, type: poetry, entities: [event:jeremias-proclama-la-maldicion-de-quienes-rompen-el-pacto, person:jeremias-profeta], note: "Jeremías reconoce que Jehová es justo, pero le pregunta por qué prosperan los malvados, que lo nombran con los labios y no con el corazón. Pide que los aparte para la matanza, porque la tierra se seca por su maldad."}
    - {v: 5-6, type: prophecy, entities: [event:jeremias-proclama-la-maldicion-de-quienes-rompen-el-pacto, person:jeremias-profeta], mentions: [event:los-hombres-de-anatot-amenazan-de-muerte-a-jeremias, place:rio-jordan], note: "Jehová le responde que vendrán pruebas más duras, como correr contra caballos o andar por la espesura del Jordán. Hasta sus hermanos y la casa de su padre lo traicionaron: que no se fíe de sus buenas palabras."}
    - {v: 7-13, type: prophecy, entities: [event:jeremias-proclama-la-maldicion-de-quienes-rompen-el-pacto], note: "Jehová deja su casa y entrega su herencia a sus enemigos, porque le rugió como un león. Las aves de rapiña la rodean (la referencia remite a 2Re 24:2); muchos pastores arrasan su viña y la espada recorre el país."}
    - {v: 14-17, type: prophecy, entities: [event:jeremias-proclama-la-maldicion-de-quienes-rompen-el-pacto], mentions: [event:regreso-de-537], note: "Los malos vecinos que tocan la herencia de Israel, naciones hostiles según Perspicacia «Vecino, prójimo», serán arrancados, y Judá con ellos. Después habrá misericordia y vuelta; quien jure por Jehová y no por Baal se quedará."}
  13:
