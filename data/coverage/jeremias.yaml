    - {v: 27-29, type: prophecy, entities: [event:jeremias-anuncia-setenta-anos-de-servidumbre-a-babilonia], mentions: [place:jerusalen], note: "Si alguno rehúsa la copa, tendrá que beberla igual: si el castigo empieza por la ciudad llamada con el nombre de Jehová, Jerusalén, ninguna nación quedará impune."}
