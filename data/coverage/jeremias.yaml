    - {v: 14-18, type: poetry, entities: [event:pasjur-pone-a-jeremias-en-el-cepo, person:jeremias-profeta], mentions: [place:sodoma, place:gomorra, event:destruccion-de-sodoma-y-gomorra], note: "Maldice el día en que nació y al hombre que dio la noticia a su padre. «Dios nos habla mediante Jeremías», cap. 7, identifica las ciudades destruidas del v. 16 con Sodoma y Gomorra."}
