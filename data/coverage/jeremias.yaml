    - {v: 6-9, type: prophecy, entities: [event:jeremias-rompe-un-frasco-en-el-valle-de-hinon, place:valle-de-hinon], mentions: [place:juda, place:jerusalen, event:destruccion-de-jerusalen-607], note: "Tófet y el valle pasarán a llamarse valle de la Matanza. Judá y Jerusalén caerán a espada, las aves y las fieras comerán sus cadáveres y el cerco llevará a comerse a los propios hijos."}
    - {v: 10-13, type: prophecy, entities: [event:jeremias-rompe-un-frasco-en-el-valle-de-hinon, place:jerusalen, place:valle-de-hinon], mentions: [place:juda, event:destruccion-de-jerusalen-607], note: "Jeremías rompe el frasco ante ellos: Jehová quebrará al pueblo y a la ciudad sin remedio (Perspicacia «Jeremías», núm. 6). Enterrarán en Tófet hasta llenarlo, y las casas que adoraron a los astros quedarán impuras."}
    - {v: 14-15, type: narration, entities: [event:pasjur-pone-a-jeremias-en-el-cepo, person:jeremias-profeta, place:monte-moria], mentions: [place:valle-de-hinon, place:jerusalen], note: "De vuelta de Tófet, Jeremías se planta en el patio del templo y anuncia a todo el pueblo la calamidad sobre la ciudad y sus pueblos, porque se negaron a obedecer."}
  20:
