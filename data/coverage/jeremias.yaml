    - {v: 15-19, type: letter, entities: [event:jeremias-escribe-a-los-desterrados-de-babilonia], mentions: [person:sedequias, person:david, place:jerusalen], note: "A los que dicen tener profetas en Babilonia: el rey sentado en el trono de David, Sedequías, y los que siguen en Jerusalén sufrirán espada, hambre y peste, como higos podridos, por no escuchar a los profetas."}
    - {v: 20-23, type: letter, entities: [event:jeremias-escribe-a-los-desterrados-de-babilonia, person:acab-hijo-de-colaya, person:colaya-padre-de-acab, person:sedequias-hijo-de-maaseya, person:maaseya-padre-de-sedequias, person:nabucodonosor-ii, relation:acab-hijo-de-colaya/kin/colaya-padre-de-acab, relation:acab-hijo-de-colaya/lived_in/babilonia, relation:sedequias-hijo-de-maaseya/kin/maaseya-padre-de-sedequias, relation:sedequias-hijo-de-maaseya/lived_in/babilonia], mentions: [place:babilonia, place:jerusalen, place:juda], note: "Acab y Sedequías profetizan mentiras y cometen adulterio. Nabucodonosor (nota: grafía Nabucodorosor) los matará ante los desterrados, que los usarán como maldición: asados al fuego. El texto no cuenta que se cumpliera: no hay suceso."}
    - {v: 24-28, type: prophecy, entities: [event:sofonias-lee-a-jeremias-la-carta-de-semaya, person:semaya-de-nehelam, place:nehelam, person:sofonias-hijo-de-maaseya, person:maaseya-padre-de-sofonias, person:jehoiada-de-tiempos-de-jeremias, person:jeremias-profeta, place:anatot, relation:semaya-de-nehelam/lived_in/babilonia, relation:semaya-de-nehelam/tie/jeremias-profeta, relation:sofonias-hijo-de-maaseya/kin/maaseya-padre-de-sofonias, relation:sofonias-hijo-de-maaseya/holds_office/jerusalen, relation:sofonias-hijo-de-maaseya/succeeds/jehoiada-de-tiempos-de-jeremias, relation:jehoiada-de-tiempos-de-jeremias/holds_office/jerusalen, relation:jeremias-profeta/lived_in/anatot], mentions: [place:jerusalen, place:babilonia, place:monte-moria], note: "Mensaje para Semaya de Nehelam, que escribió desde Babilonia al sacerdote Sofonías, puesto en lugar de Jehoiadá sobre la casa de Jehová: que pusiera en el cepo a Jeremías de Anatot por anunciar un destierro largo."}
    - {v: 29-32, type: narration, entities: [event:sofonias-lee-a-jeremias-la-carta-de-semaya, person:sofonias-hijo-de-maaseya, person:jeremias-profeta, person:semaya-de-nehelam], mentions: [place:nehelam], note: "Sofonías lee la carta ante Jeremías, y Jehová responde a los desterrados: Semaya profetizó sin ser enviado e incitó a la rebelión; ni él ni su familia verán el bien que Jehová hará a su pueblo."}
  30:
