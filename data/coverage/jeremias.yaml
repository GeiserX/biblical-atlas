    reviewed_on: 2026-10-12
    spans:
    - {v: 1-4, type: narration, entities: [event:jeremias-en-la-casa-del-alfarero, person:jeremias-profeta], note: "Jehová manda a Jeremías bajar a casa de un alfarero sin nombre. Lo ve trabajar en el torno: la vasija se le estropea y con el mismo barro hace otra a su gusto."}
    - {v: 5-12, type: prophecy, entities: [event:jeremias-en-la-casa-del-alfarero, place:juda, place:jerusalen], note: "Israel está en manos de Jehová como el barro en las del alfarero: si una nación se arrepiente, él cambia la calamidad, y si desobedece, el bien. Judá y Jerusalén responden que seguirán su propio camino."}
    - {v: 13-17, type: prophecy, entities: [event:jeremias-en-la-casa-del-alfarero], mentions: [place:libano], note: "Ni la nieve deja las laderas del Líbano, pero el pueblo olvidó a Jehová por lo que no vale nada. Su tierra causará horror y él los dispersará ante el enemigo como el viento del este."}
    - {v: "18", type: narration, entities: [event:jeremias-en-la-casa-del-alfarero, person:jeremias-profeta], note: "Sus oyentes acuerdan conspirar contra Jeremías y desacreditarlo con la lengua, seguros de que sus sacerdotes, sabios y profetas seguirán enseñando."}
    - {v: 19-23, type: poetry, entities: [event:jeremias-en-la-casa-del-alfarero, person:jeremias-profeta], note: "Jeremías recuerda a Jehová que intercedió por ellos y le pide que no perdone a quienes le cavan una fosa para matarlo: hambre, espada y saqueadores para ellos (ref. 2Cr 36:17)."}
  19:
