    - {v: 13-17, type: prophecy, entities: [event:jeremias-anuncia-en-el-palacio-el-juicio-contra-jehoiaquim, person:jehoiaquim], mentions: [person:josias], note: "Ay del que se hace un palacio amplio, de cedro y bermellón, sin pagar a quienes trabajan. Su padre hizo justicia al pobre; él solo busca ganancia y sangre inocente. Perspicacia «Jehoiaquim», párr. 2, lo aplica a este rey."}
    - {v: 18-19, type: prophecy, entities: [event:jeremias-anuncia-en-el-palacio-el-juicio-contra-jehoiaquim, person:jehoiaquim, place:jerusalen, relation:jehoiaquim/kin/josias, relation:jehoiaquim/died_in/jerusalen], mentions: [person:josias], note: "Nadie hará duelo por Jehoiaquim hijo de Josías: lo enterrarán como a un burro, arrastrado y tirado fuera de las puertas de Jerusalén. Perspicacia cree que murió durante el sitio."}
    - {v: 20-23, type: prophecy, entities: [event:jeremias-anuncia-en-el-palacio-el-juicio-contra-jehoiaquim, place:abarim], mentions: [place:libano, place:basan, place:jerusalen], note: "Que grite desde el Líbano, Basán y Abarim, alturas desde donde se ve la ruina (Perspicacia «Basán» y «Abarim»): sus amantes están aplastados. La que vive en el Líbano, entre cedros, es Jerusalén según Perspicacia «Líbano»."}
    - {v: 24-27, type: prophecy, entities: [event:jeremias-anuncia-que-conias-morira-en-el-destierro, person:joaquin, person:nehusta, relation:joaquin/kin/jehoiaquim, relation:joaquin/kin/nehusta, relation:joaquin/lived_in/babilonia, relation:joaquin/died_in/babilonia, relation:joaquin/tie/nabucodonosor-ii, relation:nehusta/lived_in/babilonia, relation:nehusta/died_in/babilonia], mentions: [person:jehoiaquim, person:nabucodonosor-ii, place:babilonia, place:caldea, period:joaquin, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, journey:joaquin-llevado-a-babilonia], note: "Aunque Conías, también llamado Joaquín y Jeconías según la nota, fuera el anillo de sellar de Jehová, sería arrancado: él y su madre irán a otra tierra y morirán allí. Perspicacia «Joaquín» lo da por cumplido."}
    - {v: 28-30, type: prophecy, entities: [event:jeremias-anuncia-que-conias-morira-en-el-destierro, person:joaquin], mentions: [person:david, place:juda], note: "Conías, vasija rota que nadie quiere, se inscribe como sin hijos: tuvo siete, dice Perspicacia «Joaquín», pero ninguno reinó en Judá. La Atalaya de 2007 explica que eso no quita a Jesús su derecho a reinar."}
  23:
