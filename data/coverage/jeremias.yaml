    - {v: 7-8, type: prophecy, entities: [event:jeremias-anuncia-el-brote-justo-de-david, event:exodo], mentions: [place:egipto, event:regreso-de-537], note: "Ya no jurarán por quien sacó a Israel de Egipto, sino por quien trajo a sus descendientes de la tierra del norte. Perspicacia «Jeremías, Libro de» cuenta 23:3-8 entre los anuncios de la vuelta del resto."}
    - {v: 9-15, type: prophecy, entities: [event:jeremias-anuncia-el-brote-justo-de-david, person:jeremias-profeta, place:jerusalen], mentions: [place:samaria, place:sodoma, place:gomorra, place:monte-moria], note: "Jeremías tiembla por lo que oye. Profetas y sacerdotes están corrompidos, aun en el templo. Los de Samaria profetizaron por Baal, un dios; los de Jerusalén, adúlteros y mentirosos, son como Sodoma y Gomorra y recibirán ajenjo."}
    - {v: 16-22, type: prophecy, entities: [event:jeremias-anuncia-el-brote-justo-de-david], note: "No hay que escuchar a esos profetas: sus visiones salen de su corazón y prometen paz a quien desprecia a Jehová. Él no los mandó; de haber estado en su intimidad, habrían hecho volver al pueblo."}
    - {v: 23-32, type: prophecy, entities: [event:jeremias-anuncia-el-brote-justo-de-david], note: "Nadie se esconde de Jehová, que llena cielo y tierra. Los profetas cuentan sueños falsos para que el pueblo olvide su nombre, como sus padres por Baal. Su palabra es fuego y martillo."}
    - {v: 33-40, type: prophecy, entities: [event:jeremias-anuncia-el-brote-justo-de-david, person:jeremias-profeta], note: "Si alguien pregunta a Jeremías por la «carga» de Jehová (nota: mensaje pesado), responderá que el pueblo es la carga. Quien siga usando esa expresión será castigado, y la ciudad, deshonrada para siempre."}
