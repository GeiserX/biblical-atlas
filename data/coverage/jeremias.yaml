    - {v: 7-9, type: poetry, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada], note: "Súplica del pueblo: admite sus pecados y pide a Jehová, esperanza de Israel (el pueblo, sin ficha), que obre por su nombre y no sea como un forastero de paso."}
    - {v: 10-12, type: prophecy, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada, person:jeremias-profeta], note: "Jehová no se complace en un pueblo que no frena sus pasos. Prohíbe a Jeremías orar por él: rechazará sus ayunos y sus ofrendas y lo acabará con espada, hambre y peste."}
    - {v: 13-16, type: prophecy, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada, person:jeremias-profeta, place:jerusalen], mentions: [event:sitio-de-jerusalen-609], note: "Jeremías objeta que los profetas prometen paz. Jehová no los envió: mueren ellos y sus oyentes en las calles de Jerusalén. Perspicacia «Hambre» ve cumplido el aviso en el sitio de 609-607."}
    - {v: 17-18, type: prophecy, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada], mentions: [event:sitio-de-jerusalen-609, event:destruccion-de-jerusalen-607], note: "Llanto por la hija virgen del pueblo, quebrantada: muertos a espada en el campo y enfermos de hambre en la ciudad; profeta y sacerdote vagan por una tierra extraña."}
    - {v: 19-22, type: poetry, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada, person:jeremias-profeta, place:juda, place:jerusalen], note: "Ruego por Judá y Sion, que es Jerusalén: confiesan su culpa y la de sus padres y piden a Jehová que no rompa su pacto. Perspicacia «Jeremías», núm. 6, dice que el profeta se incluye. Solo Jehová da la lluvia."}
  15:
    status: complete
    reviewed_on: 2026-10-12
    spans:
