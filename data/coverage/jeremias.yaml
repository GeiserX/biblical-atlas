    - {v: 7-10, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-moab, place:moab, place:meseta], mentions: [place:babilonia, person:nabucodonosor-ii], note: "Kemós, dios de Moab (sin ficha), irá al destierro con sus sacerdotes y príncipes. Perderán el valle y la tierra llana (la meseta, según la nota). Perspicacia «Moab»: el destructor son los babilonios de Nabucodonosor."}
    - {v: 11-17, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-moab, place:moab], mentions: [place:betel, event:jeroboan-pone-becerros-de-oro-en-betel-y-dan], note: "Moab, tranquila como vino nunca trasvasado, será volcada. Se avergonzará de Kemós como Israel de Betel; Perspicacia «Betel» y «Kemós» lo explican por el becerro de oro de allí. Su vara poderosa se rompe."}
    - {v: 18-20, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-moab, place:dibon, place:aroer, place:arnon, place:moab], note: "Dibón baja de su gloria y queda sedienta; Aroer pregunta a los que huyen qué pasó; en el Arnón se anuncia la destrucción de Moab. Perspicacia: entonces las tres eran de Moab."}
    - {v: 21-24, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-moab, place:meseta, place:holon-de-moab, place:jahaz, place:mefaat, place:dibon, place:nebo, place:bet-diblataim, place:quiryataim, place:bet-gamul, place:baal-meon, place:queriyot, place:bozra-de-moab, place:moab], mentions: [place:almon-diblataim, place:bezer], note: "Lista de ciudades de la tierra llana, la meseta según la nota y Perspicacia. Bet-Meón es probablemente Baal-Meón; Bet-Diblataim quizá es Almón-Diblataim; esta Bozrá no es la de Edom, y algunos la creen Bézer."}
    - {v: 25-28, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-moab, place:moab], note: "Le cortan el cuerno a Moab y le rompen el brazo. Emborrachada, se revuelca en su vómito por haberse engrandecido contra Jehová y burlarse de Israel. Sus habitantes deben vivir en los peñascos, como palomas."}
    - {v: 29-33, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-moab, place:moab, place:quir-de-moab, place:jazer, place:sibma], note: "De nada le sirve su orgullo. Jehová gime por los hombres de Quir-Heres y llora por la vid de Sibmá, cuyos brotes llegaban al mar y a Jazer; ese mar no tiene nombre. Acaban vendimia y lagar."}
    - {v: 34-39, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-moab, place:hesbon, place:eleale, place:jahaz, place:zoar, place:horonaim, place:eglat-selisiya, place:nimrim, place:quir-de-moab, place:moab], note: "El grito va de Hesbón a Elealé y Jáhaz, de Zóar a Horonaim y Eglat-Selisiyá; se secan las aguas de Nimrim. Cabezas rapadas, barbas cortadas, tela de saco: Moab, vasija rota, es objeto de burla."}
    - {v: 40-44, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-moab, place:moab], note: "Alguien se lanza como un águila y extiende las alas sobre Moab; sus fortalezas caen y sus guerreros tiemblan. Del terror al hoyo y del hoyo a la trampa: llega el año de su castigo."}
    - {v: 45-47, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-moab, place:hesbon, place:moab], mentions: [person:sehon, person:ciro], note: "Sale fuego de Hesbón, la llama de en medio de Sehón: el rey amorreo designa su antigua capital (Nú 21:28). El pueblo de Kemós va cautivo. Perspicacia «Moab» ve en el v. 47 la vuelta que permitió Ciro."}
  49:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-2, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-ammon, place:ammon, place:gad, place:raba], mentions: [place:israel, event:tiglat-pileser-deporta-al-norte-de-israel], note: "Malcam, el dios de los ammonitas (Perspicacia «Malcam», núm. 2), se ha quedado con Gad, cuyos habitantes deportó Tiglat-piléser según Perspicacia «Gad». Rabá será un montón de ruinas e Israel despojará a quienes lo despojaron."}
    - {v: 3-5, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-ammon, place:hesbon, place:hai-de-ammon, place:raba], note: "Hesbón llora porque Hai fue destruida, y los pueblos de Rabá se visten de saco: Malcam irá cautivo con sus sacerdotes y príncipes. Perspicacia «Hesbón» duda si era entonces ammonita. Ammón, orgullosa de sus valles, será dispersada."}
    - {v: "6", type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-ammon], mentions: [place:ammon, person:ciro], note: "Después Jehová reunirá a los cautivos de Ammón. Perspicacia «Ammonitas» ve probable que se cumpliera cuando Ciro dejó volver a su tierra a los desterrados de varias naciones."}
    - {v: 7-11, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-edom, place:edom, place:teman, place:dedan], mentions: [person:nabonido], note: "Esaú es aquí el pueblo de Edom, sin ficha. Temán pierde su sabiduría y Dedán debe ocultarse. Jehová dejará a Esaú sin escondite, peor que ladrones o vendimiadores; Perspicacia «Edom» lo ve cumplido bajo Nabonido."}
    - {v: 12-16, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-edom, place:edom, place:bozra], note: "Edom no se librará de beber la copa del castigo. Jehová jura que Bozrá será un horror y sus ciudades, ruinas eternas. Un mensajero llama a las naciones contra ella; aunque anide en lo alto como el águila, caerá."}
    - {v: 17-22, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-edom, place:edom, place:teman, place:bozra], mentions: [place:sodoma, place:gomorra, event:destruccion-de-sodoma-y-gomorra, place:rio-jordan, place:mar-rojo], note: "Edom quedará sin habitantes, como Sodoma y Gomorra. Alguien subirá como león desde la espesura del Jordán contra Temán; el estruendo de su caída llegará al mar Rojo y un águila extenderá sus alas sobre Bozrá."}
    - {v: 23-27, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-damasco, place:damasco, place:hamat, place:arpad], mentions: [person:ben-hadad-hijo-de-hazael], note: "Mensaje para Damasco. Las torres de Ben-Hadad son, según Perspicacia «Ben-hadad», núm. 3, los palacios reales de Damasco, con la expresión que ya usó Amós (Am 1:4); no habla del rey en persona."}
    - {v: 28-33, type: prophecy, entities: [event:jeremias-anuncia-que-nabucodonosor-atacara-quedar-y-hazor, event:nabucodonosor-conquista-quedar-y-hazor, person:nabucodonosor-ii, place:quedar, place:hazor-de-arabia], mentions: [place:babilonia], note: "Los hijos de Oriente son pueblos de Arabia (Perspicacia «Orientales»), sin ficha. El versículo 28 da por hecha la conquista de Quedar y Hazor por Nabucodonosor, que Perspicacia «Quedar» confirma sin año."}
    - {v: 34-39, type: prophecy, entities: [event:jeremias-anuncia-la-ruina-de-elam, person:jeremias-profeta, place:elam, relation:jeremias-profeta/holds_office/-], mentions: [person:sedequias, period:sedequias, place:juda], note: "Mensaje sobre Elam al principio del reinado de Sedequías. Jehová pondrá allí su trono; al final reunirá a sus cautivos. Perspicacia «Elam» dice que los elamitas desaparecieron como pueblo, como se anunció."}
  50:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-3, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, person:jeremias-profeta, place:babilonia, place:caldea, relation:jeremias-profeta/holds_office/-], mentions: [event:caida-de-babilonia], note: "Empieza el mensaje sobre Babilonia, la tierra de los caldeos. Bel y Merodac (Marduk), dioses de Babilonia sin ficha, quedan avergonzados. Una nación del norte la deja vacía; las referencias remiten a Is 13:17, los medos."}
    - {v: 4-7, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia], mentions: [place:jerusalen, event:regreso-de-537], note: "Israel y Judá, pueblos sin ficha, vendrán juntos llorando a buscar a Jehová y preguntarán por el camino a Sion para un pacto eterno. Sus pastores los extraviaron, y sus enemigos los devoraban sin sentirse culpables."}
    - {v: 8-10, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia, place:caldea], mentions: [event:caida-de-babilonia], note: "Hay que salir de Babilonia y de la tierra de los caldeos. Una coalición de grandes naciones del norte la tomará y Caldea será saqueada; las referencias remiten a Da 5:28, 30."}
    - {v: 11-13, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia], mentions: [event:babilonia-en-ruinas], note: "Babilonia festejaba mientras saqueaba la herencia de Jehová. Su madre, la nación, quedará humillada y hecha un desierto; quien pase junto a Babilonia se horrorizará de sus plagas."}
    - {v: 14-16, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia], note: "Los arqueros rodean Babilonia, que se rinde: caen sus columnas y sus murallas. Es la venganza de Jehová, que le devuelve lo que hizo. Sin sembrador ni segador, los extranjeros huyen a su tierra."}
    - {v: 17-20, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, person:nabucodonosor-ii, place:babilonia], mentions: [place:asiria, place:monte-carmelo, place:basan, place:region-montanosa-de-efrain, place:galaad, event:asiria-destierra-a-israel, event:sitio-de-jerusalen-609, event:el-angel-de-jehova-mata-a-185000-asirios, event:caida-de-ninive, event:regreso-de-537], note: "Israel es un rebaño acosado: primero el rey de Asiria, luego Nabucodonosor (referencias: 2Re 17:6; 25:1). Jehová castigará a Babilonia como a Asiria y llevará a Israel, perdonado, a pastar en Carmelo, Basán, Efraín y Galaad."}
    - {v: 21-28, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:pecod, place:babilonia, place:caldea], mentions: [place:jerusalen, event:destruccion-de-jerusalen-607], note: "Merataim, «rebelión doble», es según Perspicacia otro nombre de Babilonia o de una parte suya. Se quiebra el martillo de toda la tierra y los que escapan anuncian en Sion la venganza por el templo."}
    - {v: 29-32, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia], note: "Los arqueros acampan alrededor para que nadie escape, porque Babilonia se alzó contra el Santo de Israel. A ella, llamada la rebelde, le llega su día: tropezará sin que nadie la levante y el fuego quemará sus ciudades."}
    - {v: 33-34, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia], mentions: [place:babilonia], note: "Los de Israel y Judá siguen retenidos por sus captores, pero su Recomprador, Jehová de los ejércitos, defenderá su causa, traerá descanso al país y agitará a los habitantes de Babilonia."}
    - {v: 35-40, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:caldea, place:babilonia], mentions: [place:sodoma, place:gomorra, event:destruccion-de-sodoma-y-gomorra, event:babilonia-en-ruinas], note: "La espada cae sobre caldeos, príncipes, sabios, guerreros, caballos y tesoros, y la sequía sobre sus aguas. Como Sodoma y Gomorra, quedará sin habitantes; Perspicacia «Jeremías, Libro de» ve cumplida esa desolación."}
    - {v: 41-43, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia], mentions: [event:caida-de-babilonia], note: "Un pueblo del norte con grandes reyes avanza, cruel, contra la hija de Babilonia. Su rey, sin nombre, pierde las fuerzas al oír la noticia; la referencia remite a Da 5:6."}
    - {v: 44-46, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia, place:caldea], mentions: [place:rio-jordan], note: "Repite contra Babilonia y la tierra de los caldeos lo dicho de Edom en 49:19-21: alguien sube como león desde la espesura del Jordán, y su caída hace temblar la tierra y gritar a las naciones."}
  51:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-5, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia, place:caldea], note: "Jehová lanza un viento destructor contra Babilonia y Leb-Camái, que la nota da como nombre cifrado de Caldea. Israel y Judá son aquí pueblos, sin ficha: su Dios no los ha dejado viudos."}
    - {v: 6-10, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia], mentions: [place:jerusalen], note: "Llega la venganza de Jehová y hay que escapar de Babilonia. Fue la copa de oro que embriagó a las naciones y cae de golpe; quienes no la pudieron sanar la dejan y lo cuentan en Sion."}
    - {v: 11-14, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia, place:media], mentions: [event:caida-de-babilonia], note: "Jehová despierta a los reyes de los medos contra Babilonia, para vengar su templo. La ciudad rica que vive junto a muchas aguas ve llegado su final, cercada de enemigos numerosos como langostas."}
    - {v: 15-19, type: poetry, entities: [event:jeremias-anuncia-la-caida-de-babilonia], note: "Alabanza al Creador de la tierra y los cielos, que manda la lluvia y el viento; los ídolos de metal son engaño sin aliento. Jacob es el pueblo, sin ficha. Repite casi Jer 10:12-16."}
    - {v: 20-26, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia, place:caldea], mentions: [place:jerusalen], note: "Jehová destroza con su garrote de guerra naciones, ejércitos y gente de toda clase, y pagará a Babilonia y a Caldea lo que hicieron en Sion. La montaña destructora quedará calcinada y desierta para siempre."}
    - {v: 27-29, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:ararat, place:mini, place:askenaz, place:media, place:babilonia], mentions: [event:caida-de-babilonia], note: "Contra Babilonia se convoca a tres reinos, Ararat, Miní y Askenaz, junto con los reyes de Media y sus gobernantes. Perspicacia «Miní» dice que en 539 esos reinos estaban bajo Ciro."}
    - {v: 30-32, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, event:caida-de-babilonia, place:babilonia], note: "Los guerreros babilonios dejan de luchar, arden las casas y se rompen las trancas. Los correos corren a decir al rey que su ciudad cayó y que el enemigo tomó los vados del río."}
    - {v: 33-40, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, event:babilonia-en-ruinas, person:nabucodonosor-ii, place:babilonia, place:caldea], mentions: [place:jerusalen, event:destruccion-de-jerusalen-607, event:caida-de-babilonia], note: "Sion se queja de que Nabucodonosor la devoró como una gran serpiente. Jehová la defiende: Babilonia quedará hecha un montón de piedras, y a sus jefes los embriagará en un banquete del que no despertarán."}
    - {v: 41-44, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia], note: "Sesac, nombre cifrado de Babilonia según la nota, es tomada; el mar la cubre y sus ciudades quedan sin agua ni gente. Bel, su dios, sin ficha, devolverá lo que se tragó, y caerá la muralla."}
    - {v: 45-50, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia], mentions: [place:jerusalen], note: "El pueblo de Jehová debe salir de Babilonia sin asustarse por los rumores de cada año. Jehová castigará sus ídolos con destructores del norte; quienes escapen de la espada deben recordar a Jerusalén."}
    - {v: 51-53, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia], mentions: [event:destruccion-de-jerusalen-607], note: "Los judíos sienten vergüenza porque extranjeros profanaron los lugares santos del templo. Jehová castigará las imágenes de Babilonia, y aunque ella suba hasta el cielo le llegarán destructores."}
    - {v: 54-58, type: prophecy, entities: [event:jeremias-anuncia-la-caida-de-babilonia, place:babilonia, place:caldea], note: "Gritos y estruendo salen de Babilonia y de Caldea. Jehová, el Dios que retribuye, quiebra los arcos de sus guerreros y emborracha a sus jefes; su ancha muralla cae y sus puertas arden."}
    - {v: 59-64, type: narration, entities: [event:jeremias-encarga-a-seraya-el-libro-contra-babilonia, journey:seraya-a-babilonia, person:jeremias-profeta, person:seraya-hijo-de-nerias, person:nerias, person:mahseya, person:sedequias, place:babilonia, place:rio-eufrates, relation:jeremias-profeta/holds_office/-, relation:seraya-hijo-de-nerias/kin/nerias, relation:nerias/kin/mahseya, relation:seraya-hijo-de-nerias/accompanies/sedequias, relation:baruc-hijo-de-nerias/kin/seraya-hijo-de-nerias, relation:seraya-hijo-de-nerias/tie/sedequias], mentions: [place:juda, place:jerusalen, person:baruc-hijo-de-nerias], note: "Seraya era funcionario del rey; la nota da «comisario ordenador», cargo que el vocabulario no tiene. Con este encargo terminan las palabras de Jeremías."}
  52:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-3, type: narration, entities: [period:sedequias, person:sedequias, person:hamutal, person:jeremias-de-libna, place:libna, place:jerusalen, event:sitio-de-jerusalen-609, relation:sedequias/kin/hamutal, relation:sedequias/lived_in/jerusalen, relation:hamutal/kin/jeremias-de-libna, relation:jeremias-de-libna/lived_in/libna, relation:sedequias/tie/nabucodonosor-ii@-616], mentions: [person:jehoiaquim, person:nabucodonosor-ii, place:juda, place:babilonia], note: "Sedequías sube al trono a los 21 años y reina once en Jerusalén, haciendo el mal como Jehoiaquim. Por la ira de Jehová, Judá acaba fuera de su vista; Sedequías se rebela contra Babilonia."}
    - {v: 4-5, type: narration, entities: [event:sitio-de-jerusalen-609, person:nabucodonosor-ii, person:sedequias, place:jerusalen], mentions: [place:babilonia], note: "El día 10 del mes décimo del año noveno de Sedequías el ejército babilonio levanta un muro de asedio; el cerco dura hasta su año 11."}
    - {v: 6-8, type: narration, entities: [event:sedequias-huye-y-lo-capturan-cerca-de-jerico, journey:huida-de-sedequias, person:sedequias, place:jerusalen, place:araba, place:llanuras-deserticas-de-jerico], mentions: [place:jerico], note: "El día 9 del mes cuarto el hambre es extrema. El jardín del rey, junto a la puerta entre las dos murallas, está en los nombres de Jerusalén. Los caldeos son el pueblo, sin ficha."}
    - {v: 9-11, type: narration, entities: [event:nabucodonosor-juzga-a-sedequias-en-ribla, person:sedequias, person:nabucodonosor-ii, place:ribla, place:babilonia, relation:sedequias/lived_in/babilonia, relation:sedequias/died_in/babilonia], mentions: [place:hamat, place:juda], note: "Los hijos de Sedequías y los príncipes de Judá muertos en Riblá no tienen nombre. Jer 52:11 añade a 2 Reyes que siguió preso en Babilonia hasta morir."}
    - {v: 12-16, type: narration, entities: [event:destruccion-de-jerusalen-607, journey:nebuzaradan-lleva-a-juda-al-destierro, person:nebuzaradan, place:jerusalen, place:babilonia, relation:nebuzaradan/tie/nabucodonosor-ii], mentions: [person:nabucodonosor-ii, period:nabucodonosor-ii], note: "El día 10 del quinto mes, año 19 de Nabucodonosor, Nebuzaradán quema el templo, el palacio y las casas, y el ejército derriba las murallas. Destierra a casi todos y deja a los más pobres para viñas y trabajos."}
    - {v: 17-23, type: narration, entities: [event:destruccion-de-jerusalen-607, place:babilonia], mentions: [person:salomon], note: "Columnas, carritos, el Mar y los doce toros de cobre que hizo Salomón son objetos del templo, no lugares. Las notas dan el codo, 44,5 cm, y el dedo, 1,85 cm."}
    - {v: 24-27, type: narration, entities: [event:nabucodonosor-ejecuta-en-ribla-a-los-principales-de-jerusalen, person:seraya-hijo-de-azarias, person:sofonias-hijo-de-maaseya, person:nebuzaradan, person:nabucodonosor-ii, place:ribla, relation:seraya-hijo-de-azarias/holds_office/jerusalen, relation:seraya-hijo-de-azarias/died_in/ribla, relation:sofonias-hijo-de-maaseya/holds_office/jerusalen, relation:sofonias-hijo-de-maaseya/died_in/ribla], mentions: [place:jerusalen, place:hamat, place:juda], note: "Los tres porteros, el funcionario al mando de los soldados, los siete consejeros del rey, el secretario y los sesenta hombres no tienen nombre. 2Re 25:19 cuenta cinco consejeros."}
    - {v: 28-30, type: list, entities: [event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, event:destruccion-de-jerusalen-607, event:nebuzaradan-destierra-a-745-judios, person:nabucodonosor-ii, person:nebuzaradan, place:jerusalen, place:babilonia], note: "Tres destierros: 3.023 judíos el año séptimo de Nabucodonosor (617), 832 de Jerusalén el año 18 (607) y 745 el año 23 (602); 4.600 en total. Perspicacia «Nabucodonosor» explica los años."}
    - {v: 31-34, type: narration, entities: [event:joaquin-liberado, person:joaquin, person:evil-merodac, place:babilonia, relation:joaquin/tie/evil-merodac, relation:joaquin/lived_in/babilonia, relation:joaquin/died_in/babilonia, relation:evil-merodac/lived_in/babilonia], mentions: [place:juda, person:jeremias-profeta], note: "Jer 52:31 da el día 25 del mes doce y 2Re 25:27 el 27. La nota da la lectura literal: levantó la cabeza de Joaquín. Con este suceso, hacia 580, acaba el libro de Jeremías."}
