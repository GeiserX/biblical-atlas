    - {v: 15-17, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro, place:rama-de-benjamin], mentions: [person:raquel, event:matanza-de-los-ninos-de-belen, event:regreso-de-537], note: "En Ramá llora Raquel, madre de José y Benjamín, por sus hijos llevados al destierro; Jehová promete que volverán. Mt 2:17, 18 cita el versículo 15 en la matanza de Belén (Perspicacia «Raquel» y «Ramá», núm. 1)."}
    - {v: 18-22, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro, place:israel], note: "Efraín, el reino del norte, reconoce su culpa y pide volver; Jehová aún lo quiere como a un hijo y se compadece de él. La virgen de Israel debe marcar el camino y regresar a sus ciudades."}
    - {v: 23-26, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro, place:juda, person:jeremias-profeta], mentions: [place:jerusalen, event:regreso-de-537], note: "Cuando vuelvan los cautivos, en Judá bendecirán otra vez la montaña santa, y labradores y pastores vivirán juntos. Jeremías cuenta que entonces se despertó y que aquel sueño le había resultado agradable."}
    - {v: 27-30, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro], note: "Jehová volverá a sembrar de gente y de ganado a Israel y a Judá, y vigilará para edificar como vigiló para arrancar. Nadie repetirá el refrán de las uvas ácidas: cada uno morirá por su propio pecado."}
    - {v: 31-34, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro, event:exodo, event:pacto-de-la-ley], mentions: [place:egipto, event:cena-del-senor], note: "Un nuevo pacto con Israel y Judá, distinto del que rompieron después de salir de Egipto: la ley irá escrita en el corazón y el pecado quedará perdonado. «Toda Escritura», libro 24, párr. 38, lo une a Lu 22:20."}
    - {v: 35-37, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro], note: "Jehová, que da al sol, la luna y las estrellas sus leyes, no desechará a la descendencia de Israel: antes tendrían que fallar esas normas o medirse los cielos y explorarse los cimientos de la tierra."}
    - {v: 38-40, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro, place:jerusalen, place:valle-de-cedron, place:colina-de-gareb, place:goa], mentions: [place:valle-de-hinon, event:muros-de-jerusalen-455], note: "Jerusalén se reconstruirá de la Torre de Hananel a la Puerta de la Esquina, hacia Gareb y Goá; será santo hasta el Cedrón y la Puerta de los Caballos. Para Perspicacia «Hinón», el valle de los cadáveres quizá sea Hinón."}
