    - {v: 8-11, type: prophecy, entities: [event:jeremias-esconde-un-cinturon-junto-al-eufrates, event:jeremias-anuncia-que-jerusalen-esta-condenada, place:juda, place:jerusalen], note: "Así se pudrirá la soberbia de Judá y de Jerusalén, que sigue a otros dioses. Jehová se ciñó a la casa de Israel y a la de Judá, pueblos sin ficha, pero no escucharon."}
    - {v: 12-14, type: prophecy, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada, place:jerusalen], mentions: [person:david], note: "Las jarras llenas de vino: Jehová emborrachará a reyes, sacerdotes, profetas y vecinos de Jerusalén y los hará chocar entre sí. El trono de David es la dinastía de los últimos reyes (Perspicacia «David»)."}
    - {v: 15-17, type: prophecy, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada, person:jeremias-profeta], mentions: [event:destruccion-de-jerusalen-607], note: "Llamada a honrar a Jehová antes de que caiga la noche. Si no escuchan, Jeremías llorará en secreto, porque el rebaño de Jehová irá cautivo."}
    - {v: 18-19, type: prophecy, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada, place:juda], mentions: [event:destruccion-de-jerusalen-607], note: "El rey y la reina madre, sin nombre en el texto, perderán la corona; las referencias remiten a 2Re 24:12 y Jer 22:24, 26. Las ciudades del sur quedan cerradas y Judá entero va desterrado."}
    - {v: 20-22, type: prophecy, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada], mentions: [place:babilonia, event:destruccion-de-jerusalen-607], note: "Llegan los del norte, que Perspicacia «Norte» identifica con Babilonia (Jer 1:14, 15). La castigarán aquellos a quienes trató como amigos; sufrirá como una parturienta y quedará expuesta por su culpa."}
    - {v: 23-27, type: prophecy, entities: [event:jeremias-anuncia-que-jerusalen-esta-condenada, place:jerusalen], mentions: [place:etiopia], note: "Ni el cusita (etíope, dice la nota; pueblo de Cus, Perspicacia «Cus») cambia su piel ni el leopardo sus manchas: un pueblo hecho al mal no cambiará. El pueblo será esparcido y Jerusalén, avergonzada."}
  14:
    status: complete
