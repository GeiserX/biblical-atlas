    - {v: 10-11, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro], mentions: [event:regreso-de-537], note: "Jacob e Israel son aquí el pueblo, sin ficha: Jehová lo salvará de la tierra lejana del cautiverio, acabará con las naciones adonde lo esparció y a él lo corregirá con medida. Perspicacia «Jeremías, Libro de» liga 30:11 al regreso."}
    - {v: 12-17, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro, place:jerusalen], note: "Su herida parece incurable y sus amantes la olvidaron, castigada por sus muchos pecados. Pero quienes la devoran serán devorados, y Jehová sanará a la que llamaban marginada: Sion, nombre de Jerusalén."}
    - {v: 18-22, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro], mentions: [place:jerusalen, event:regreso-de-537], note: "Jehová traerá de vuelta a los de Jacob; la ciudad se reconstruirá sobre su montículo, con cantos y risas, y su líder será de su propia gente. Perspicacia «Jeremías, Libro de» liga 30:18, 19 al regreso."}
    - {v: 23-24, type: prophecy, entities: [event:jeremias-escribe-que-el-pueblo-volvera-del-destierro], note: "Una tormenta de la furia de Jehová caerá sobre los malvados y no se calmará hasta cumplir lo que él se propone; lo entenderán en la parte final de los días."}
  31:
