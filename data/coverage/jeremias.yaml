    spans:
    - {v: 1-4, type: prophecy, entities: [event:jehova-prohibe-a-jeremias-casarse, event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores, person:jeremias-profeta], mentions: [event:destruccion-de-jerusalen-607], note: "Jehová le dice a Jeremías que no se case ni tenga hijos en este lugar: los niños que nazcan allí morirán de enfermedad, espada y hambre, sin luto ni entierro. Perspicacia «Jeremías» lo cuenta como señal."}
    - {v: 5-9, type: prophecy, entities: [event:jehova-prohibe-a-jeremias-casarse, event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores, person:jeremias-profeta], note: "Tampoco debe entrar en casas de duelo ni de fiesta: Jehová retira su paz, nadie llorará a los muertos y callarán las voces de los novios. Hacerse cortes y raparse eran ritos paganos de luto (nota del v. 6)."}
    - {v: 10-13, type: prophecy, entities: [event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores], mentions: [event:destruccion-de-jerusalen-607], note: "Si el pueblo pregunta por qué, Jeremías responderá: sus padres dejaron a Jehová por otros dioses y ellos son aún más tercos. Serán echados a una tierra desconocida, donde servirán a otros dioses."}
    - {v: 14-15, type: prophecy, entities: [event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores, event:exodo], mentions: [place:egipto, event:regreso-de-537], note: "Ya no jurarán por Jehová, que sacó a Israel de Egipto, sino por el que lo trae de la tierra del norte. Perspicacia «Jeremías, Libro de» cuenta 16:14-21 entre los anuncios de la vuelta del resto."}
    - {v: 16-18, type: prophecy, entities: [event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores], note: "Jehová enviará pescadores y luego cazadores que los busquen por montes, colinas y grietas; nada se le oculta. Les pagará el doble por llenar su tierra de ídolos sin vida."}
    - {v: 19-21, type: poetry, entities: [event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores], note: "Jeremías llama a Jehová su fuerza y refugio: las naciones vendrán de lejos confesando que sus padres heredaron mentiras. El hombre no puede fabricar dioses, y Jehová hará conocer su nombre."}
  17:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-4, type: prophecy, entities: [event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores, place:juda], note: "El pecado de Judá está grabado en su corazón y en sus altares, junto a sus postes sagrados. Perderá tesoros y herencia y servirá a sus enemigos en tierra extraña (refs. 2Re 24:13; 25)."}
    - {v: 5-11, type: poetry, entities: [event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores], note: "Quien se apoya en los hombres es como un arbusto en el desierto; quien confía en Jehová, como un árbol junto al agua. Jehová examina el corazón traicionero, y el rico deshonesto acaba como la perdiz."}
    - {v: 12-18, type: poetry, entities: [event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores, person:jeremias-profeta], note: "Jeremías ora: Jehová, esperanza de Israel y fuente de agua viva, avergonzará a los que lo dejan. Le pide que lo sane, recuerda que otros se burlan de sus avisos y ruega que caiga la calamidad sobre sus perseguidores."}
    - {v: 19-23, type: prophecy, entities: [event:jeremias-proclama-en-las-puertas-de-jerusalen-que-guarden-el-sabado, event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores, person:jeremias-profeta, place:jerusalen], mentions: [place:juda], note: "Jehová envía a Jeremías a la puerta que usaban los reyes de Judá y a las demás puertas de la ciudad: en sábado nadie debe cargar bultos ni trabajar. Sus antepasados tampoco quisieron obedecer."}
    - {v: 24-27, type: prophecy, entities: [event:jeremias-proclama-en-las-puertas-de-jerusalen-que-guarden-el-sabado, event:jeremias-anuncia-que-jehova-enviara-pescadores-y-cazadores, place:jerusalen], mentions: [person:david, place:juda, place:benjamin, place:sefela, place:negueb], note: "Si guardan el sábado, reyes del trono de David seguirán entrando y llegarán ofrendas de Judá, Benjamín, la Sefelá, la región montañosa y el Négueb. Si no, el fuego quemará puertas y torres (2Re 25:9, 10)."}
  18:
