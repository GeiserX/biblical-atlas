# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: jeremias
chapters:
  1:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-3, type: narration, entities: [event:jeremias-comisionado, person:jeremias-profeta, person:hilquias-padre-de-jeremias, place:anatot, relation:jeremias-profeta/kin/hilquias-padre-de-jeremias, relation:jeremias-profeta/lived_in/anatot, relation:jeremias-profeta/holds_office/anatot, relation:hilquias-padre-de-jeremias/lived_in/anatot, relation:hilquias-padre-de-jeremias/holds_office/anatot, person:josias, relation:josias/kin/amon-de-juda, person:jehoiaquim, relation:jehoiaquim/kin/josias, person:sedequias, relation:sedequias/kin/josias, event:destruccion-de-jerusalen-607], mentions: [place:benjamin, person:amon-de-juda, place:juda, place:jerusalen, period:josias, period:jehoiaquim, period:sedequias], note: "Encabezamiento: Jeremías, hijo del sacerdote Hilquías de Anatot, recibe la palabra de Jehová desde el año 13 de Josías hasta el destierro de Jerusalén, en el quinto mes del año 11 de Sedequías. Jehoacaz y Joaquín no se nombran."}
    - {v: 4-10, type: narration, entities: [event:jeremias-comisionado, person:jeremias-profeta, relation:jeremias-profeta/holds_office/-], note: "Jehová lo conocía y lo apartó antes de nacer, y lo hace profeta para las naciones. Jeremías alega que es un muchacho que no sabe hablar; Jehová le toca la boca y le da autoridad para arrancar y para plantar."}
    - {v: 11-12, type: vision, entities: [event:jeremias-comisionado, person:jeremias-profeta], note: "Ve una rama de almendro, «el que despierta» según la nota: Jehová vigila para cumplir su palabra. La Atalaya de 2007 recuerda que el almendro florece de los primeros en primavera."}
    - {v: 13-16, type: vision, entities: [event:jeremias-comisionado], mentions: [place:babilonia, place:jerusalen, place:juda, event:destruccion-de-jerusalen-607], note: "Una olla hirviendo inclinada desde el norte: los reinos del norte pondrán sus tronos a las puertas de Jerusalén por la idolatría de Judá. Perspicacia «Norte» y «Dios nos habla mediante Jeremías», cap. 2, lo aplican a Babilonia."}
    - {v: 17-19, type: narration, entities: [event:jeremias-comisionado, person:jeremias-profeta], mentions: [place:juda], note: "Jeremías debe hablar sin miedo: Jehová lo hace ciudad fortificada, columna de hierro y muralla de cobre ante reyes, príncipes, sacerdotes y pueblo de Judá. Lucharán contra él y no podrán vencerlo."}
  2:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-3, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, person:jeremias-profeta, place:jerusalen, relation:jeremias-profeta/lived_in/jerusalen], note: "Jehová manda a Jeremías decir a Jerusalén que recuerda su amor de novia, cuando lo siguió por el desierto. Israel, el pueblo, le era santo como primicias, y quien lo devoraba pagaba su culpa."}
    - {v: 4-8, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, event:exodo, event:entrada-en-canaan], mentions: [place:egipto, event:israel-vaga-por-el-desierto], note: "A la casa de Jacob, que es el pueblo: sus padres olvidaron al Dios que los sacó de Egipto, los guio por el desierto y les dio tierra fértil. Sacerdotes, pastores y profetas siguieron a Baal, un dios."}
    - {v: 9-13, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, place:chipre, place:quedar], note: "Ninguna nación, ni los kitim al oeste ni Quedar al este (La Atalaya de 2007), cambió a sus dioses; Israel dejó a Jehová, fuente de agua viva, por cisternas rotas. Perspicacia «Kitim» da al nombre un sentido más amplio."}
    - {v: 14-19, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, place:menfis, place:tahpanhes, place:sihor], mentions: [place:egipto, place:asiria, place:rio-eufrates], note: "Israel, saqueado y con sus ciudades quemadas, ve que Nof, que es Menfis, y Tahpanés lo dejan calvo. Beber del Sihor, brazo del Nilo, y del Río, el Éufrates, es buscar alianza con Egipto y Asiria."}
    - {v: 20-25, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], mentions: [place:valle-de-hinon], note: "Jehová rompió su yugo, pero el pueblo se prostituye en colinas y bajo árboles y sigue a los Baales, dioses. Perspicacia «Hinón, Valle de» ve posible que el valle de 2:23 sea Hinón."}
    - {v: 26-28, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], mentions: [place:juda], note: "La casa de Israel queda avergonzada como un ladrón sorprendido: reyes, príncipes, sacerdotes y profetas llaman padre a un árbol y madre a una piedra. Judá tiene tantos dioses como ciudades."}
    - {v: 29-35, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], note: "El pueblo rechaza la corrección y su espada mató a sus propios profetas. Olvidó a Jehová como ninguna novia olvida su faja, y lleva en la ropa sangre de pobres inocentes mientras dice que no pecó."}
    - {v: 36-37, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], mentions: [place:egipto, place:asiria], note: "Cambiar de aliado no sirve: Judá se avergonzará de Egipto como antes de Asiria y saldrá con las manos sobre la cabeza. La referencia de 2:36 remite a Acaz (2Cr 28:20, 21)."}
  3:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-5, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], note: "Si un marido no recupera a la esposa que se fue con otro, ¿cómo volvería Jehová con un pueblo que se entregó a tantos amantes? Por eso falta la lluvia. Perspicacia «Divorcio» liga 3:1 a Dt 24:1-4."}
    - {v: 6-10, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, person:jeremias-profeta, place:israel, place:juda], mentions: [person:josias, period:josias, event:caida-de-samaria], note: "En días de Josías, Jehová dice a Jeremías que despidió a la infiel Israel con certificado de divorcio, y que Judá, su hermana, lo vio y la imitó. Perspicacia «Cautiverio» lo une al destierro de Israel."}
    - {v: 11-13, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, person:jeremias-profeta, place:israel], note: "Israel sale más justa que Judá. Jeremías debe gritar hacia el norte, donde estaba desterrada, que vuelva y reconozca su culpa. Perspicacia «Cronología»: los profetas seguían hablando al reino caído."}
    - {v: 14-18, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, place:jerusalen], mentions: [event:regreso-de-537], note: "Jehová llevará a Sion a unos pocos, con pastores a su gusto; nadie echará de menos el Arca, y Jerusalén será su trono. Judá e Israel volverán juntas del norte: Perspicacia ve aquí la repatriación de un resto."}
    - {v: 19-20, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], note: "Jehová pensaba darles la herencia más hermosa y oírles llamarlo Padre, pero la casa de Israel, que es el pueblo, lo traicionó como una esposa que abandona a su marido."}
    - {v: 21-25, type: poetry, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], note: "En las colinas lloran los israelitas. Jehová los llama a volver y ellos confiesan su pecado: «la cosa vergonzosa», un dios falso según la nota, devoró desde siempre el fruto del trabajo de sus padres."}
  4:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-2, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], note: "Si Israel, el pueblo, vuelve a Jehová, aparta sus ídolos repugnantes y jura por él con verdad y justicia, dejará de andar huido y las naciones se bendecirán por medio de él."}
    - {v: 3-4, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], mentions: [place:juda, place:jerusalen], note: "A los de Judá y Jerusalén: que aren tierra nueva en vez de sembrar entre espinos y se circunciden el corazón. La Atalaya de 2007 lo explica como arrancar del corazón los motivos impuros."}
    - {v: 5-9, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, place:juda, place:jerusalen], mentions: [place:babilonia, event:destruccion-de-jerusalen-607], note: "Alarma en Judá y Jerusalén: hay que huir a las ciudades fortificadas, porque del norte llega como un león el destructor de naciones. Perspicacia «Norte»: esa calamidad vino de Babilonia. Rey, príncipes y sacerdotes se acobardarán."}
    - {v: "10", type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, person:jeremias-profeta], mentions: [place:jerusalen], note: "Jeremías protesta que el pueblo y Jerusalén oyeron «tendrán paz» con la espada encima. La Atalaya de 2007: Jehová dejó que los profetas mentirosos anunciaran ese engaño."}
    - {v: 11-18, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, place:dan, place:region-montanosa-de-efrain, place:jerusalen], mentions: [place:juda], note: "Un viento ardiente y carros veloces caen sobre Jerusalén. La noticia llega de Dan, la primera ciudad en sufrir un ataque del norte según Perspicacia «Dan», y de las montañas de Efraín; los sitiadores cercarán Jerusalén."}
    - {v: 19-22, type: poetry, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, person:jeremias-profeta], note: "Jeremías siente un dolor que le aprieta el pecho y no puede callar al oír el cuerno de guerra; «Dios nos habla mediante Jeremías» toma sus palabras como propias. Jehová llama tonto a su pueblo, hábil solo para el mal."}
    - {v: 23-28, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], mentions: [event:destruccion-de-jerusalen-607], note: "El profeta ve la tierra vacía y a oscuras, los montes temblando, sin gente ni aves, y las ciudades derribadas. Jehová la dejará desolada, pero no la acabará del todo; no se volverá atrás."}
    - {v: 29-31, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Ante jinetes y arqueros, las ciudades se vacían. De nada le sirven a la ciudad el escarlata y los ojos pintados: sus amantes la rechazan. La hija de Sion, Jerusalén, gime como una mujer de parto."}
  5:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-6, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], mentions: [place:jerusalen], note: "Jehová perdonaría a Jerusalén si en sus calles hubiera una sola persona justa y fiel. Ni la gente sencilla ni los poderosos respetan su camino; por eso león, lobo y leopardo acechan sus ciudades."}
    - {v: 7-9, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], note: "Sus hijos dejaron a Jehová y juran por dioses falsos; saciados, corren tras la mujer del prójimo como caballos en celo. Jehová pregunta si no debe pedir cuentas a una nación así."}
    - {v: 10-13, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], note: "Que arrasen sus viñas sin acabar con todo. La casa de Israel y la de Judá, nombradas como pueblos, traicionaron a Jehová: dicen que no hará nada, y sus profetas son puro viento."}
    - {v: 14-19, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, person:jeremias-profeta], note: "Las palabras de Jehová serán fuego en boca de Jeremías («Toda Escritura», párr. 9). Una nación antigua de lengua extraña lo devorará todo; las referencias remiten a los caldeos (Jer 25:9; Hab 1:6). Servirán a extranjeros fuera de su tierra."}
    - {v: 20-25, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], mentions: [place:juda], note: "Aviso a la casa de Jacob, nombre del pueblo, y a Judá: tienen ojos y no ven. El mar respeta su límite de arena, pero ellos se rebelan y no temen a quien manda la lluvia y la cosecha."}
    - {v: 26-31, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], note: "Hay malvados que atrapan personas como cazadores de pájaros y se enriquecen con engaños, sin defender al huérfano ni al pobre. Los profetas mienten, los sacerdotes dominan, y al pueblo le gusta."}
  6:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-5, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, place:tecoa, place:bet-hakerem], mentions: [place:jerusalen, place:benjamin], note: "Los de Benjamín, nombrados como pueblo, deben huir de Jerusalén; que suene el cuerno en Tecoa y arda una señal en Bet-Hakerem, porque del norte llega el desastre. Pastores con rebaños acampan alrededor de Sion, nombre de Jerusalén."}
    - {v: 6-8, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], mentions: [place:jerusalen, event:sitio-de-jerusalen-609, person:nabucodonosor-ii], note: "Jehová manda levantar una rampa contra Jerusalén, llena de opresión y violencia; si no escucha, quedará desierta. Perspicacia «Cerco de sitiar, antemural» dice que Nabucodonosor levantaría esas rampas contra la ciudad."}
    - {v: 9-15, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, person:jeremias-profeta], note: "Al resto de Israel, el pueblo, lo rebuscarán como a las últimas uvas. Jeremías, lleno de la furia de Jehová, no halla quién escuche. Profetas y sacerdotes estafan y prometen paz cuando no la hay."}
    - {v: 16-21, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, place:reino-de-saba], note: "No quieren los caminos antiguos ni oír a los centinelas. De nada sirven el incienso de Saba, reino del suroeste de Arabia según Perspicacia «Seba», núm. 6, ni sus sacrificios: Jehová les pondrá tropiezos."}
    - {v: 22-26, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel], mentions: [place:jerusalen], note: "Un pueblo cruel del norte, con arco, jabalina y caballos, se prepara contra la hija de Sion, Jerusalén. Llega la angustia: que nadie salga al campo, que se vistan de saco y lloren como por un hijo único."}
    - {v: 27-30, type: prophecy, entities: [event:jeremias-acusa-a-jerusalen-de-ser-una-esposa-infiel, person:jeremias-profeta], note: "Según la nota del versículo 27, Jehová hace de Jeremías un examinador de metales que revisa la conducta del pueblo. El refinado fracasa: son cobre y hierro, plata que Jehová rechaza."}
  7:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-7, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, person:jeremias-profeta, place:monte-moria], mentions: [period:jehoiaquim], note: "Jehová manda a Jeremías ponerse en la puerta de su casa y avisar a Judá: si corrigen su conducta y dejan la injusticia y los otros dioses, seguirán en la tierra. Repetir «el templo de Jehová» no salva."}
    - {v: 8-11, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo], mentions: [event:higuera-maldita-y-limpieza-del-templo, person:jesus], note: "Roban, matan, adulteran, juran en falso y queman sacrificios a Baal, un dios sin ficha, y luego se creen a salvo en el templo, hecho una cueva de ladrones. Jesús usó Jer 7:11 al limpiar el templo."}
    - {v: 12-15, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, place:silo], mentions: [event:israel-instala-la-tienda-de-reunion-en-silo, event:los-filisteos-capturan-el-arca, event:asiria-destierra-a-israel, event:destruccion-de-jerusalen-607], note: "Jehová hará con su casa lo que hizo con Siló, donde puso su nombre al principio y que dejó al perderse el Arca. Echará a Judá como echó a los descendientes de Efraín, el pueblo del reino norteño."}
    - {v: 16-20, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, person:jeremias-profeta, place:juda, place:jerusalen], note: "Jeremías no debe orar por el pueblo. En las ciudades de Judá y las calles de Jerusalén cada familia cuece tortas para la Reina del Cielo, título de una diosa sin ficha. La furia de Jehová caerá sobre el país."}
    - {v: 21-28, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, event:exodo, person:jeremias-profeta], mentions: [place:egipto, event:jehova-ofrece-su-pacto-a-israel], note: "Al sacar de Egipto a sus antepasados, Jehová les pidió obediencia más que holocaustos (la referencia de 7:23 lleva a Éx 19:5). Fueron a peor pese a los profetas; tampoco escucharán a Jeremías: la fidelidad ha muerto."}
    - {v: 29-34, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, place:valle-de-hinon, place:juda, place:jerusalen], mentions: [place:monte-moria, event:acaz-quema-a-su-hijo, event:manases-llena-juda-de-idolatria], note: "Judá metió ídolos en el templo y en el valle de Hinón levantó lugares altos en Tófet para quemar a sus hijos; se llamará valle de la Matanza. Perspicacia liga esos sacrificios a Acaz y sobre todo a Manasés."}
  8:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-3, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, place:jerusalen], mentions: [place:juda], note: "Sacarán de las tumbas los huesos de reyes, príncipes, sacerdotes, profetas y vecinos de Jerusalén y los dejarán sin enterrar ante los astros que adoraban. Quienes sobrevivan dispersos preferirán la muerte."}
    - {v: 4-7, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, person:jeremias-profeta], mentions: [place:jerusalen], note: "Jeremías debe preguntar por qué Jerusalén no da media vuelta. La cigüeña, la tórtola, el vencejo y el tordo saben cuándo regresar, pero el pueblo de Jehová no entiende su juicio."}
    - {v: 8-12, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo], note: "Presumen de tener la ley, pero los escribas escriben falsedades. Del profeta al sacerdote todos estafan y curan por encima la herida del pueblo con promesas de una paz que no llega. Caerán cuando Jehová castigue."}
    - {v: 13-17, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, place:dan], note: "No quedará fruto en vid ni higuera. El pueblo corre a las ciudades fortificadas; desde Dan, primera ciudad expuesta a quien llega del norte (Perspicacia «Dan»), se oyen los caballos del invasor. Jehová enviará serpientes."}
    - {v: 18-22, type: poetry, entities: [event:jeremias-avisa-en-la-puerta-del-templo, person:jeremias-profeta, place:galaad], mentions: [place:jerusalen], note: "Jeremías sufre por la herida de su pueblo, que pregunta desde lejos si Jehová ya no está en Sion, nombre de Jerusalén. Galaad era conocida por su bálsamo, pero nadie cura a la hija de su pueblo."}
  9:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-2, type: poetry, entities: [event:jeremias-avisa-en-la-puerta-del-templo, person:jeremias-profeta], note: "Jeremías querría llorar día y noche por los muertos de su pueblo y huir a un refugio del desierto, lejos de adúlteros y traidores. Perspicacia «Jeremías» ve en este llanto su amor a la nación."}
    - {v: 3-9, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo], note: "La lengua del pueblo dispara mentiras como un arco y nadie se fía ni de su hermano. Jehová los fundirá para probarlos como a metal: ¿no debe castigar a una nación así?"}
    - {v: 10-11, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, place:jerusalen, place:juda], mentions: [event:destruccion-de-jerusalen-607], note: "Duelo por montes y pastos quemados, sin ganado ni aves. Jerusalén será ruinas y cubil de chacales, y Judá quedará sin gente. La Atalaya de 2007 cita este aviso; Jerusalén cayó en 607."}
    - {v: 12-16, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo], note: "La tierra muere porque el pueblo dejó la ley de Jehová y siguió tercamente a los baales, como sus padres. Baal es un dios, sin ficha. Les esperan ajenjo, agua envenenada, destierro y espada."}
    - {v: 17-22, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, place:jerusalen], note: "Que vengan las plañideras y enseñen a sus hijas un canto fúnebre. Desde Sion, nombre de Jerusalén, se oye llorar por la tierra perdida; la muerte entra por las ventanas y los cadáveres quedan en el campo."}
    - {v: 23-24, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo], note: "Ni el sabio, ni el fuerte, ni el rico deben jactarse de lo suyo, sino de conocer a Jehová. Pablo usa estas palabras en 1Co 1:31 y 2Co 10:17 sin nombrar al profeta."}
    - {v: 25-26, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, place:egipto, place:juda, place:edom, place:ammon, place:moab], note: "Jehová pedirá cuentas a los circuncidados solo en el cuerpo: Egipto, Judá, Edom, Ammón, Moab y los del desierto que se rapan las sienes, sin nombre. Israel tiene el corazón incircunciso: motivos impuros (La Atalaya de 2007)."}
  10:
    status: complete
    reviewed_on: 2026-10-12
    spans:
    - {v: 1-5, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo], note: "A la casa de Israel, el pueblo: que no copie a las naciones ni tema las señales del cielo. El ídolo es un tronco tallado, forrado de metal y clavado para que no caiga; ni habla ni camina."}
    - {v: 6-10, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, place:tarsis, place:ufaz], note: "Nadie se compara con Jehová, Rey de las naciones, Dios vivo y eterno. Los ídolos salen de manos de orfebres, con plata en láminas traída de Tarsis, oro de Ufaz y vestidos de azul y púrpura."}
    - {v: "11", type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo], note: "Lo que han de responder a las naciones: los dioses que no crearon el cielo ni la tierra se acabarán. La nota al pie dice que este versículo se escribió en arameo."}
    - {v: 12-16, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo], note: "Jehová creó la tierra con su poder y extendió los cielos; manda nubes, rayos, lluvia y viento. Los ídolos fundidos no tienen aliento y desaparecerán. Jacob e Israel son aquí el pueblo, herencia de Jehová: sin persona."}
    - {v: 17-22, type: prophecy, entities: [event:jeremias-avisa-en-la-puerta-del-templo, place:juda], mentions: [event:destruccion-de-jerusalen-607, place:babilonia], note: "Jehová lanzará fuera a los habitantes del país. Se llora la tienda caída y los hijos perdidos; los pastores no consultaron a Jehová. Un estruendo del norte arrasará Judá: según Perspicacia «Norte», Babilonia."}
    - {v: 23-25, type: poetry, entities: [event:jeremias-avisa-en-la-puerta-del-templo, person:jeremias-profeta], note: "Jeremías admite que el hombre no puede guiar sus pasos y pide a Jehová que lo corrija con justicia, sin ira. Que su furia caiga sobre las naciones que devoraron a Jacob, el pueblo, y arrasaron su tierra."}
  11:
