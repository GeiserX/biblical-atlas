    - {v: 5-16, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Un muro rodea el templo. El ángel mide con una caña de seis codos largos el muro y la puerta del este: escalones, umbrales, tres cuartos de guardia por lado, pórtico, columnas con palmeras y ventanas."}
    - {v: 17-19, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Patio exterior: treinta comedores sobre un pavimento junto a las puertas, y cien codos desde la puerta de abajo hasta el patio interior."}
    - {v: 20-27, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Las puertas norte y sur del patio exterior son iguales a la del este: cincuenta codos por veinticinco, siete escalones, y enfrente de cada una, a cien codos, una puerta del patio interior."}
    - {v: 28-37, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Las tres puertas del patio interior, al sur, al este y al norte, miden lo mismo que las exteriores; sus pórticos dan al patio exterior y se sube a ellas por ocho escalones."}
    - {v: 38-43, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Junto a las puertas, un cuarto para lavar las ofrendas quemadas y ocho mesas, cuatro de piedra labrada, para degollar los animales de las ofrendas quemadas, por el pecado y por la culpa."}
    - {v: 44-46, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], mentions: [person:sadoc-hijo-de-ahitub], note: "Comedores en el patio interior para los cantores y para los sacerdotes del templo y del altar. Los del altar son los hijos de Sadoc, el sacerdote de Salomón según Perspicacia «Sadoc», núm. 1."}
    - {v: 47-49, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "El patio interior es un cuadrado de cien codos, con el altar delante del templo; el pórtico del templo tiene veinte codos de ancho, columnas a los lados y escalones de subida."}
  41:
