    spans:
    - {v: 1-7, type: narration, entities: [event:ezequiel-representa-la-salida-al-destierro, person:ezequiel], note: "Ezequiel vive entre una casa rebelde; de día saca su equipaje, al anochecer abre un boquete en la pared y sale con la cara tapada, ante todos."}
    - {v: 8-16, type: prophecy, entities: [event:ezequiel-representa-la-salida-al-destierro, person:ezequiel, place:caldea], mentions: [person:sedequias, place:jerusalen, place:babilonia, place:israel, event:sedequias-huye-y-lo-capturan-cerca-de-jerico, event:nabucodonosor-juzga-a-sedequias-en-ribla, event:destruccion-de-jerusalen-607], note: "El jefe de Jerusalén es Sedequías (Perspicacia «Sedequías», núm. 4): huirá de noche, lo atraparán y lo llevarán a Babilonia sin que la vea. «La adoración pura», cap. 9, lo ve cumplido en 607."}
    - {v: 17-20, type: prophecy, entities: [event:ezequiel-come-su-pan-con-temblor-como-senal, person:ezequiel], mentions: [place:jerusalen, place:israel]}
    - {v: 21-28, type: prophecy, entities: [event:ezequiel-anuncia-que-las-visiones-se-cumpliran-sin-demora, person:ezequiel], mentions: [place:israel], note: "En Ezequiel, Israel es sobre todo la gente de Judá y Jerusalén («La adoración pura», cap. 5, nota a)."}
  13:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-7, type: prophecy, entities: [event:ezequiel-profetiza-contra-los-falsos-profetas, person:ezequiel], note: "Jehová manda a Ezequiel, el «hijo del hombre», profetizar contra los profetas de Israel que hablan por su cuenta: son zorros entre ruinas y no reparan las brechas. Israel es aquí el pueblo, sin ficha."}
    - {v: 8-16, type: prophecy, entities: [event:ezequiel-profetiza-contra-los-falsos-profetas, place:jerusalen], mentions: [place:israel, event:destruccion-de-jerusalen-607], note: "Por anunciar paz cuando no la hay, no volverán a la tierra de Israel. Blanquean una pared frágil: la tormenta la tirará y, al caer la ciudad, morirán dentro. Perspicacia «Profeta» cita Eze 13:1-16."}
    - {v: 17-23, type: prophecy, entities: [event:ezequiel-profetiza-contra-los-falsos-profetas], note: "Contra las hijas del pueblo que inventan profecías: cosen bandas mágicas (nota del v. 18) y velos para cazar vidas por cebada y pan. Jehová librará a su pueblo. Perspicacia «Profetisa» las llama falsas profetisas."}
  14:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-3, type: narration, entities: [event:ancianos-idolatras-consultan-a-ezequiel, person:ezequiel], note: "Unos ancianos de Israel se sientan ante Ezequiel. Jehová le dice que siguen apegados a sus ídolos repugnantes y ponen a la gente un tropiezo (nota del v. 3): no merecen consultarle."}
    - {v: 4-11, type: prophecy, entities: [event:ancianos-idolatras-consultan-a-ezequiel], mentions: [place:israel], note: "Al israelita o extranjero de Israel que consulte a un profeta sin dejar sus ídolos, Jehová le contestará en persona y lo cortará de su pueblo; el profeta que se deje engañar cargará igual culpa. Llamada a volver."}
    - {v: 12-20, type: prophecy, entities: [event:ezequiel-anuncia-cuatro-castigos-contra-jerusalen, person:noe, person:daniel, person:job], note: "Ante hambre, fieras, espada o peste, Noé, Daniel y Job solo salvarían su vida, no la de sus hijos. Perspicacia «Noé», «Daniel», núm. 2, y «Job» citan Eze 14:14, 20 como ejemplo de justicia."}
    - {v: 21-23, type: prophecy, entities: [event:ezequiel-anuncia-cuatro-castigos-contra-jerusalen, place:jerusalen], mentions: [event:sitio-de-jerusalen-609, event:destruccion-de-jerusalen-607], note: "Contra Jerusalén irán los cuatro castigos: espada, hambre, fieras y peste. Algunos hijos e hijas saldrán con vida y llegarán a los desterrados, que verán que Jehová tuvo motivos para lo que hizo."}
  15:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-5, type: prophecy, entities: [event:ezequiel-compara-jerusalen-con-una-vid-inutil, person:ezequiel], note: "La vid no da madera para vigas ni para ganchos; medio quemada, por las puntas y por dentro, sirve todavía menos. Perspicacia «Vid»: es blanda y torcida, y solo sirve de leña."}
    - {v: 6-8, type: prophecy, entities: [event:ezequiel-compara-jerusalen-con-una-vid-inutil, place:jerusalen], mentions: [place:juda, event:destruccion-de-jerusalen-607], note: "Así hará Jehová con los de Jerusalén: salieron de un fuego y otro los consumirá, y la tierra quedará desolada. Para La Atalaya de 2007 la vid es Judá; Perspicacia «Ezequiel, Libro de» liga estos capítulos a la caída."}
  16:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-7, type: prophecy, entities: [event:ezequiel-describe-a-jerusalen-como-una-esposa-infiel, person:ezequiel, place:jerusalen], mentions: [place:canaan, event:david-toma-la-fortaleza-de-sion], note: "Jerusalén nace en tierra cananea, de padre amorreo y madre hitita, pueblos sin ficha que representan a los cananeos (Perspicacia «Hititas»). Los jebuseos la tuvieron hasta que David la tomó (La adoración pura). Abandonada, Jehová la deja vivir."}
    - {v: 8-14, type: prophecy, entities: [event:ezequiel-describe-a-jerusalen-como-una-esposa-infiel], mentions: [event:pacto-de-la-ley, event:david-sube-el-arca-a-la-ciudad-de-david, event:templo-de-salomon-terminado, event:riqueza-de-salomon], note: "Jehová la cubre con su manto, hace pacto con ella, la lava, la viste y la adorna como reina. La adoración pura recuerda el pacto del Sinaí; Perspicacia «Hititas» une su fama a David, al arca y al templo."}
    - {v: 15-22, type: prophecy, entities: [event:ezequiel-describe-a-jerusalen-como-una-esposa-infiel], mentions: [event:las-esposas-extranjeras-desvian-a-salomon], note: "Confiada en su belleza, hace lugares altos con sus ropas e imágenes masculinas con sus joyas, les ofrece pan e incienso y les quema a sus hijos. La adoración pura lo empieza en Salomón y nombra a Mólek."}
    - {v: 23-34, type: prophecy, entities: [event:ezequiel-describe-a-jerusalen-como-una-esposa-infiel], mentions: [place:egipto, place:filistea, place:asiria, place:caldea], note: "Pone un lugar alto en cada plaza y se da a Egipto, a Asiria y a los caldeos, en la tierra de los comerciantes (lit. de Canaán). Jehová la entrega a las filisteas. Ella paga a sus amantes."}
    - {v: 35-43, type: prophecy, entities: [event:ezequiel-describe-a-jerusalen-como-una-esposa-infiel, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Jehová juntará contra ella a todos sus amantes: la dejarán desnuda, derribarán sus lugares altos, la apedrearán y quemarán sus casas. La adoración pura, párr. 15: sus aliados idólatras la destruirían, y así acabaría su prostitución."}
    - {v: 44-52, type: prophecy, entities: [event:ezequiel-describe-a-jerusalen-como-una-esposa-infiel, place:samaria, place:sodoma], mentions: [event:caida-de-samaria, event:destruccion-de-sodoma-y-gomorra], note: "De tal madre, tal hija. Su hermana mayor es Samaria, al norte, y la menor, Sodoma, al sur; sus hijas son las poblaciones que dependen de ellas (nota; Perspicacia «Madre»). Jerusalén hizo más males que ambas."}
    - {v: 53-58, type: prophecy, entities: [event:ezequiel-describe-a-jerusalen-como-una-esposa-infiel, place:samaria, place:sodoma], mentions: [place:siria, place:filistea, event:regreso-de-537], note: "Jehová reunirá a los cautivos de Sodoma, de Samaria y de Jerusalén, y las tres volverán a su estado anterior. Mientras, la insultan las hijas de Siria y sus vecinas y la desprecian las hijas de los filisteos."}
    - {v: 59-63, type: prophecy, entities: [event:ezequiel-describe-a-jerusalen-como-una-esposa-infiel], mentions: [event:pacto-de-la-ley, event:regreso-de-537], note: "Rompió el pacto y lo pagará, pero Jehová recordará el de su juventud y hará con ella un pacto permanente, le dará a sus hermanas por hijas y la perdonará. La adoración pura lo une a la vuelta del destierro."}
  17:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-6, type: prophecy, entities: [event:ezequiel-cuenta-el-enigma-de-las-dos-aguilas, person:ezequiel], mentions: [place:libano, place:babilonia, person:nabucodonosor-ii, person:joaquin, person:sedequias], note: "Enigma para la casa de Israel: un águila grande lleva la punta de un cedro del Líbano a una ciudad de comerciantes, «de Canaán» según la nota, que Perspicacia «Canaán» lee como Babilonia, y planta una vid baja."}
    - {v: 7-10, type: prophecy, entities: [event:ezequiel-cuenta-el-enigma-de-las-dos-aguilas], mentions: [place:egipto], note: "La vid tiende raíces y ramas hacia otra gran águila para que la riegue. No prosperará: la arrancarán y se secará con el viento del este. La adoración pura ve en esa águila al faraón de Egipto, sin nombre."}
    - {v: 11-14, type: prophecy, entities: [event:ezequiel-cuenta-el-enigma-de-las-dos-aguilas, person:nabucodonosor-ii, person:sedequias, place:babilonia, place:jerusalen, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, event:nabucodonosor-hace-rey-a-sedequias, relation:sedequias/tie/nabucodonosor-ii@-616, relation:sedequias/succeeds/joaquin], mentions: [person:joaquin, period:sedequias], note: "La explicación a la casa rebelde: el rey de Babilonia vino a Jerusalén y se llevó al rey y a los príncipes; pactó con uno de linaje real y lo ató con juramento, para que el reino quedara bajo."}
    - {v: 15-18, type: prophecy, entities: [event:ezequiel-cuenta-el-enigma-de-las-dos-aguilas, person:sedequias, place:egipto, place:babilonia, event:sitio-de-jerusalen-609, relation:sedequias/died_in/babilonia, relation:nabucodonosor-ii/lived_in/babilonia], mentions: [person:nabucodonosor-ii, event:los-caldeos-se-retiran-de-jerusalen-ante-el-ejercito-del-faraon], note: "Las notas al pie identifican al rebelde con Sedequías y al rey de Babilonia con Nabucodonosor. Pidió caballos y tropas a Egipto; rompió su juramento y morirá en Babilonia. El ejército del faraón no le servirá durante el asedio."}
    - {v: 19-21, type: prophecy, entities: [event:ezequiel-cuenta-el-enigma-de-las-dos-aguilas, person:sedequias, relation:sedequias/lived_in/babilonia], mentions: [event:sedequias-huye-y-lo-capturan-cerca-de-jerico, event:nabucodonosor-juzga-a-sedequias-en-ribla], note: "Jehová atrapará al rey en su red, lo llevará a Babilonia y lo juzgará por su infidelidad; sus tropas caerán o se dispersarán. La adoración pura, cap. 8, párr. 6, remite a su captura y prisión (Jer 52:6-11)."}
    - {v: 22-24, type: prophecy, entities: [event:ezequiel-cuenta-el-enigma-de-las-dos-aguilas], mentions: [place:israel, person:jesus], note: "Jehová plantará en una montaña alta de Israel un brote tierno del cedro, que crecerá hasta ser majestuoso. La adoración pura, cap. 8, párr. 10, lo aplica a Jesús, del linaje de David, en el monte Sion celestial."}
  18:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-4, type: prophecy, entities: [event:ezequiel-rechaza-el-proverbio-de-las-uvas-acidas, person:ezequiel, place:israel], note: "Se acabará el proverbio de las uvas ácidas de los padres y la dentera de los hijos: toda alma es de Jehová y muere la que peca. «Toda Escritura», párr. 18, lo dirige a los desterrados; véase Jer 31:29, 30."}
    - {v: 5-9, type: prophecy, entities: [event:ezequiel-rechaza-el-proverbio-de-las-uvas-acidas], note: "El hombre justo: no come en los santuarios de las montañas ni mira a los ídolos, respeta a la mujer ajena, devuelve la prenda, da de comer y viste al necesitado, no presta con interés y juzga con rectitud. Vivirá."}
    - {v: 10-13, type: prophecy, entities: [event:ezequiel-rechaza-el-proverbio-de-las-uvas-acidas], note: "Si ese justo tiene un hijo ladrón o violento que hace todo lo contrario, idolatría, adulterio, opresión y usura, el hijo morirá, y la culpa de su sangre será solo suya."}
    - {v: 14-20, type: prophecy, entities: [event:ezequiel-rechaza-el-proverbio-de-las-uvas-acidas], note: "El nieto que ve los pecados de su padre y no los imita vivirá; el padre morirá por los suyos. Ni el hijo carga la culpa del padre ni el padre la del hijo: cada cual responde de lo suyo."}
    - {v: 21-29, type: prophecy, entities: [event:ezequiel-rechaza-el-proverbio-de-las-uvas-acidas], note: "El malvado que se arrepiente y obra bien vive, y sus ofensas se olvidan; el justo que se vuelve malo muere sin que cuente su justicia. Al pueblo que tacha a Jehová de injusto le devuelve el reproche."}
    - {v: 30-32, type: prophecy, entities: [event:ezequiel-rechaza-el-proverbio-de-las-uvas-acidas], note: "Jehová juzgará a cada uno de la casa de Israel según su conducta. Les pide dejar sus ofensas y hacerse un corazón y un espíritu nuevos: no disfruta con la muerte de nadie, así que vuelvan y vivan."}
  19:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-4, type: poetry, entities: [event:ezequiel-entona-una-endecha-por-los-jefes-de-israel, person:ezequiel], mentions: [person:jehoacaz-de-juda, person:neko, place:egipto, event:neko-destrona-a-jehoacaz], note: "Endecha por los jefes de Israel: una leona cría un cachorro que aprende a devorar hombres; lo atrapan en una fosa y lo llevan a Egipto. Perspicacia «Egipto» lo compara con Jehoacaz, a quien Nekó se llevó."}
    - {v: 5-9, type: poetry, entities: [event:ezequiel-entona-una-endecha-por-los-jefes-de-israel], mentions: [person:jehoiaquim, person:joaquin, person:sedequias, person:nabucodonosor-ii, place:babilonia, place:israel, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, event:nabucodonosor-juzga-a-sedequias-en-ribla], note: "Otro cachorro arrasa ciudades hasta que las naciones lo meten en una jaula y lo entregan al rey de Babilonia: ya no ruge en los montes de Israel. La Atalaya de 1988 piensa en Jehoiaquim, Joaquín y Sedequías."}
    - {v: 10-14, type: poetry, entities: [event:ezequiel-entona-una-endecha-por-los-jefes-de-israel], mentions: [place:juda, person:sedequias, event:destruccion-de-jerusalen-607], note: "Su madre, una vid regada, dio ramas fuertes, cetros de reyes según Perspicacia «Cetro». Arrancada, seca por el viento del este y llevada al desierto, el fuego la deja sin cetro. La Atalaya de 1988 lo ve cumplido en 607."}
  20:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-4, type: narration, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel, person:ezequiel], note: "Año séptimo, mes quinto, día 10: unos ancianos de Israel, sin nombre, se sientan ante Ezequiel. Jehová jura que no les responderá y le manda echarles en cara lo que hicieron sus padres."}
    - {v: 5-10, type: prophecy, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel, event:jehova-promete-a-moises-liberar-a-israel, event:exodo], mentions: [person:jacob, place:egipto, event:becerro-de-oro], note: "Jehová eligió a Israel y juró en Egipto a la descendencia de Jacob darle una tierra de leche y miel; no dejaron los ídolos egipcios. Perspicacia «Egipto» ve quizá ese influjo en el becerro de oro."}
    - {v: 11-12, type: prophecy, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel, event:pacto-de-la-ley], mentions: [period:exodo-y-desierto], note: "En el desierto les dio estatutos que dan vida a quien los cumple, y los sábados como señal de que él los santifica."}
    - {v: 13-17, type: prophecy, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel, event:jehova-condena-a-israel-a-40-anos-en-el-desierto], mentions: [period:exodo-y-desierto], note: "Israel se rebeló en el desierto y profanó los sábados. Por su nombre Jehová no lo exterminó, pero juró que aquella generación no entraría en la tierra (Nú 14:30)."}
    - {v: 18-26, type: prophecy, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel], mentions: [period:exodo-y-desierto], note: "Los hijos repitieron la rebeldía. Jehová juró dispersarlos entre las naciones y dejó que se contaminaran con sus sacrificios, hasta quemar al primogénito."}
    - {v: 27-29, type: prophecy, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel, event:entrada-en-canaan], note: "Ya en la tierra jurada ofrecieron sacrificios en cada colina alta y bajo cada árbol frondoso. «Lugar Alto» es el nombre que siguió usándose para esos altares, no un sitio concreto."}
    - {v: 30-32, type: prophecy, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel], note: "Los desterrados hacen lo mismo: ídolos e hijos quemados. Jehová no les responderá, ni dejará que sean como los pueblos que adoran madera y piedra."}
    - {v: 33-38, type: prophecy, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel], mentions: [place:israel], note: "Los sacará de los pueblos y los juzgará cara a cara en el desierto de los pueblos, figura sin lugar en el mapa, como a sus padres. Los rebeldes no entrarán en la tierra de Israel."}
    - {v: 39-44, type: prophecy, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel], mentions: [place:israel, event:regreso-de-537], note: "En su santa montaña de Israel toda la casa de Israel le servirá y él aceptará sus ofrendas. «La adoración pura», cap. 9, lo aplica a los judíos que volvieron del destierro."}
    - {v: 45-49, type: prophecy, entities: [event:ezequiel-repasa-ante-los-ancianos-la-rebelion-de-israel, person:ezequiel], mentions: [place:juda], note: "Nuevo mensaje: Ezequiel mira al sur y anuncia un fuego inextinguible contra el bosque del sur, que Perspicacia «Bosque» identifica con Judá. Se queja de que lo acusan de hablar solo en enigmas."}
  21:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-7, type: prophecy, entities: [event:ezequiel-anuncia-la-espada-de-jehova, person:ezequiel, place:jerusalen, place:israel], mentions: [person:nabucodonosor-ii], note: "Jehová saca su espada contra los lugares santos y la tierra de Israel, contra justos y malvados, y Ezequiel ha de suspirar ante el pueblo. La Atalaya de 2007 ve en esa espada a Nabucodonosor con su ejército."}
    - {v: 8-17, type: prophecy, entities: [event:ezequiel-anuncia-la-espada-de-jehova, person:ezequiel], mentions: [event:destruccion-de-jerusalen-607, event:nabucodonosor-juzga-a-sedequias-en-ribla], note: "Canto de la espada afilada y pulida. Según Perspicacia «Cetro», alude a los babilonios, que acabaron con el reino de Judá y apresaron a su rey: trataron el cetro davídico igual que a cualquier otro árbol."}
    - {v: 18-24, type: prophecy, entities: [event:ezequiel-anuncia-la-espada-de-jehova, person:ezequiel, person:nabucodonosor-ii, place:raba, place:jerusalen], mentions: [place:babilonia, place:juda, event:sitio-de-jerusalen-609], note: "En el cruce entre Rabá y Jerusalén, el rey de Babilonia agita flechas, pregunta a los terafim, sus ídolos, y mira un hígado. Perspicacia «Adivinación»: así decidió Nabucodonosor ir contra Jerusalén. El juramento roto llevará cautivos."}
    - {v: 25-27, type: prophecy, entities: [event:ezequiel-anuncia-la-espada-de-jehova, person:sedequias], mentions: [person:jesus, period:sedequias, event:nabucodonosor-juzga-a-sedequias-en-ribla, event:destruccion-de-jerusalen-607], note: "Al malvado jefe de Israel, Sedequías según La Atalaya de 2007, le quitarán turbante y corona. El reino quedará en ruinas hasta que llegue quien tiene el derecho legal, que la revista y La adoración pura identifican con Jesucristo."}
    - {v: 28-32, type: prophecy, entities: [event:ezequiel-anuncia-la-espada-de-jehova, place:ammon, place:raba], mentions: [person:nabucodonosor-ii], note: "La espada va también contra los ammonitas y sus insultos. Pese a sus visiones engañosas, serán juzgados en su propia tierra y olvidados. La nota de 21:29 piensa en Rabá; Perspicacia «Ammonitas» lo ve cumplido bajo Nabucodonosor."}
  22:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-16, type: prophecy, entities: [event:ezequiel-acusa-a-jerusalen-de-derramar-sangre, person:ezequiel, place:jerusalen], note: "Jerusalén, ciudad culpable de sangre e ídolos: jefes que abusan del poder, desprecio a padres, viudas, huérfanos y extranjeros, sábados profanados, incesto, sobornos y usura. Jehová la dispersará entre las naciones."}
    - {v: 17-22, type: prophecy, entities: [event:ezequiel-acusa-a-jerusalen-de-derramar-sangre, place:jerusalen], note: "La casa de Israel se ha vuelto escoria de metales. Jehová la reunirá en Jerusalén y la derretirá con su furia igual que la plata en un horno, no para refinarla sino como castigo."}
    - {v: 23-31, type: prophecy, entities: [event:ezequiel-acusa-a-jerusalen-de-derramar-sangre], note: "Contra todo el país: profetas que devoran como leones y encalan con visiones falsas, sacerdotes que no separan lo santo, príncipes que matan como lobos y gente que oprime al pobre. Nadie se pone en la brecha."}
  23:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-4, type: prophecy, entities: [event:ezequiel-presenta-a-ohola-y-oholiba, person:ezequiel, place:samaria, place:jerusalen], mentions: [place:egipto], note: "Alegoría de dos hermanas que se prostituyeron ya en Egipto. Oholá (nota: «la tienda de ella») es Samaria, capital del reino de diez tribus; Oholibá («mi tienda está en ella»), Jerusalén. Como figuras de alegoría, no llevan ficha."}
    - {v: 5-10, type: prophecy, entities: [event:ezequiel-presenta-a-ohola-y-oholiba], mentions: [place:asiria, place:egipto, event:caida-de-samaria, event:asiria-destierra-a-israel], note: "Oholá desea a los asirios, se mancha con sus ídolos y sigue con lo aprendido en Egipto. Jehová la entrega a ellos, que la matan y cautivan a sus hijos: Perspicacia «Oholá» ve ahí el fin del reino norteño."}
    - {v: 11-21, type: prophecy, entities: [event:ezequiel-presenta-a-ohola-y-oholiba], mentions: [place:asiria, place:caldea, place:babilonia, place:egipto], note: "Oholibá ve el castigo de su hermana y se corrompe más: busca a los asirios y después a los babilonios, y manda mensajeros a Caldea al ver sus figuras pintadas. Luego se aparta de ellos con asco."}
    - {v: 22-27, type: prophecy, entities: [event:ezequiel-presenta-a-ohola-y-oholiba, place:pecod, place:soa, place:coa], mentions: [place:babilonia, place:caldea, place:asiria, place:egipto, event:destruccion-de-jerusalen-607], note: "Jehová traerá contra Oholibá a sus antiguos amantes: babilonios y caldeos, hombres de Pecod, de Soa y de Coa (nota: o Qoa), y asirios. La rodearán con carros, la mutilarán y la despojarán. Así termina su prostitución nacida en Egipto."}
    - {v: 28-35, type: prophecy, entities: [event:ezequiel-presenta-a-ohola-y-oholiba], mentions: [place:samaria], note: "Entregada a quienes odia, se quedará desnuda y sin el fruto de su trabajo por correr tras las naciones y sus ídolos. Apurará la copa de su hermana Samaria, llena de espanto y ruina, por haber olvidado a Jehová."}
    - {v: 36-45, type: prophecy, entities: [event:ezequiel-presenta-a-ohola-y-oholiba], note: "Ezequiel debe acusar a las dos hermanas: adulterio con los ídolos y manos con sangre. Quemaron a sus hijos para los ídolos, mancharon el santuario y los sábados, y se adornaron para hombres venidos de lejos. Hombres justos las condenarán."}
    - {v: 46-49, type: prophecy, entities: [event:ezequiel-presenta-a-ohola-y-oholiba], mentions: [event:destruccion-de-jerusalen-607], note: "Un ejército las apedreará, matará a sus hijos y quemará sus casas, y las demás mujeres escarmentarán. Perspicacia «Oholibá» dice que los babilonios la harían un objeto de horror; una referencia lleva al incendio de 2Re 25:9."}
  24:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: prophecy, entities: [event:ezequiel-anuncia-el-sitio-con-la-parabola-de-la-olla, event:sitio-de-jerusalen-609, person:ezequiel], mentions: [person:nabucodonosor-ii, place:babilonia, place:jerusalen], note: "Año noveno, mes décimo, día 10: Jehová manda a Ezequiel anotar la fecha, porque ese mismo día el rey de Babilonia, Nabucodonosor según «Toda Escritura», empieza a atacar Jerusalén. El estudio 3 fecha el sitio en 609."}
    - {v: 3-14, type: prophecy, entities: [event:ezequiel-anuncia-el-sitio-con-la-parabola-de-la-olla], note: "Parábola para la casa rebelde: la ciudad sanguinaria es una olla oxidada al fuego, con los mejores trozos dentro. Vacía y sobre las brasas, sigue con óxido. Perspicacia: la olla es la ciudad sitiada; la carne, sus habitantes."}
    - {v: 15-18, type: narration, entities: [event:ezequiel-no-guarda-luto-por-su-esposa, person:ezequiel], note: "Jehová avisa a Ezequiel de que perderá de golpe a su amada y le prohíbe el duelo. Su esposa, sin nombre ni ficha, muere al atardecer, el día en que empezó el sitio según «Toda Escritura»."}
    - {v: 19-24, type: speech, entities: [event:ezequiel-no-guarda-luto-por-su-esposa, person:ezequiel], mentions: [event:destruccion-de-jerusalen-607], note: "El pueblo pregunta qué significa. Jehová profanará su santuario y sus hijos caerán a espada; los desterrados no harán duelo, sino que se consumirán en sus errores. Ezequiel es una señal: Perspicacia «Ezequiel» dice que anunciaba la destrucción de Jerusalén."}
    - {v: 25-27, type: prophecy, entities: [event:ezequiel-no-guarda-luto-por-su-esposa, person:ezequiel], mentions: [event:un-escapado-anuncia-a-ezequiel-la-caida-de-jerusalen], note: "Cuando Jehová les quite su fortaleza, alguien que escape se lo contará a Ezequiel, que dejará de estar mudo. Se cumple en Eze 33:21, 22, en 607 según «Toda Escritura»."}
  25:
    status: complete
