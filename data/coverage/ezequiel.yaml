book: ezequiel
chapters:
  1:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-3, type: narration, entities: [event:ezequiel-empieza-a-profetizar, person:ezequiel, person:buzi, place:rio-kebar, place:caldea, journey:joaquin-llevado-a-babilonia, relation:ezequiel/lived_in/caldea, relation:ezequiel/kin/buzi, relation:ezequiel/holds_office/-, relation:buzi/holds_office/-], mentions: [person:joaquin, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, journey:daniel-a-babilonia], note: "El año 30 de Eze 1:1 sería la edad de Ezequiel, según Perspicacia «Ezequiel». La fecha se cuenta desde el destierro de Joaquín en 617."}
    - {v: 4-14, type: vision, entities: [event:ezequiel-empieza-a-profetizar], note: "Del norte llegan un viento de tormenta, una nube y fuego. Dentro hay cuatro seres vivientes, cada uno con cuatro alas y caras de hombre, león, toro y águila; Eze 10:20 los llama querubines."}
    - {v: 15-21, type: vision, entities: [event:ezequiel-empieza-a-profetizar], note: "Al lado de cada ser viviente hay una rueda, encajada como en otra, con las llantas cubiertas de ojos. Las ruedas los siguen a todas partes porque el espíritu actúa también en ellas."}
    - {v: 22-28, type: vision, entities: [event:ezequiel-empieza-a-profetizar], note: "Encima de los seres vivientes, una plataforma brillante sostiene un trono como de zafiro, con una figura humana envuelta en fuego y en un resplandor de arcoíris: la gloria de Jehová. Ezequiel se postra."}
  2:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-7, type: vision, entities: [event:ezequiel-empieza-a-profetizar, person:ezequiel, relation:ezequiel/holds_office/caldea], note: "Jehová llama a Ezequiel «hijo del hombre» y lo envía al pueblo de Israel, una casa rebelde y terca, para que sepan que hubo un profeta entre ellos. Israel es aquí el pueblo, sin ficha."}
    - {v: 8-10, type: vision, entities: [event:ezequiel-empieza-a-profetizar], note: "Una mano le ofrece un rollo escrito por las dos caras con cantos fúnebres, lamentos y gemidos, y se le manda comer lo que se le da; lo come en Eze 3:1-3."}
  3:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-3, type: vision, entities: [event:ezequiel-empieza-a-profetizar, person:ezequiel], note: "Sigue la visión del capítulo 2: Ezequiel se come el rollo que Jehová le da y lo encuentra dulce como la miel. La Atalaya de 2007 lo atribuye a lo mucho que apreciaba su misión."}
    - {v: 4-11, type: vision, entities: [event:ezequiel-empieza-a-profetizar, person:ezequiel], note: "Jehová lo manda a la casa de Israel, que entiende su idioma pero no querrá escucharlo. Le hace la frente dura como el diamante para que no tema, y le encarga hablar a los desterrados, escuchen o no."}
    - {v: 12-15, type: narration, entities: [event:ezequiel-pasa-siete-dias-aturdido-en-tel-abib, person:ezequiel, place:tel-abib, place:rio-kebar, relation:ezequiel/lived_in/tel-abib], mentions: [event:nabucodonosor-se-lleva-a-joaquin-a-babilonia], note: "Al marcharse oye tras de sí una voz que alaba la gloria de Jehová y el ruido de las alas y las ruedas. Los desterrados de Tel-Abib son los llevados con Joaquín en 617 (Perspicacia «Ezequiel»)."}
    - {v: 16-21, type: speech, entities: [event:jehova-nombra-centinela-a-ezequiel, person:ezequiel], note: "El encargo de centinela: quien avisa al malvado o al justo que peca salva su propia vida aunque el otro no cambie; quien calla carga con la sangre del que muere. Eze 33:7-9 lo repite."}
    - {v: 22-27, type: narration, entities: [event:ezequiel-ve-la-gloria-de-jehova-en-la-llanura, person:ezequiel], mentions: [place:rio-kebar, event:ezequiel-escenifica-el-sitio-de-jerusalen, event:un-escapado-anuncia-a-ezequiel-la-caida-de-jerusalen], note: "La mudez anunciada no fue literal: según La Atalaya de 2003, Ezequiel solo hablaría a Israel cuando Jehová le diera un mensaje. Su boca se abre del todo en Eze 33:22, tras la caída de Jerusalén."}
  4:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-3, type: prophecy, entities: [event:ezequiel-escenifica-el-sitio-de-jerusalen, person:ezequiel], mentions: [place:jerusalen, event:sitio-de-jerusalen-609], note: "El ladrillo es Jerusalén, y Ezequiel, con muro de asedio, rampa, campamentos, arietes y una plancha de hierro, hace de ejército babilonio (La adoración pura, cap. 6, párr. 4). Es señal para Israel."}
    - {v: 4-8, type: prophecy, entities: [event:ezequiel-escenifica-el-sitio-de-jerusalen, person:ezequiel], mentions: [place:israel, place:juda, place:jerusalen, event:division-del-reino, event:jeremias-comisionado, event:destruccion-de-jerusalen-607], note: "390 días del lado izquierdo por la culpa de Israel, el reino de diez tribus, y 40 del derecho por la de Judá. Según La adoración pura, los años acaban en 607: desde 997 y, probablemente, desde 647."}
    - {v: 9-17, type: prophecy, entities: [event:ezequiel-escenifica-el-sitio-de-jerusalen, person:ezequiel], mentions: [place:jerusalen, event:sitio-de-jerusalen-609], note: "Pan de seis granos, unos 230 g al día, y un sexto de hin de agua. Ezequiel rehúsa el excremento humano y Jehová le deja usar estiércol de vaca. Anuncia hambre en Jerusalén y pan impuro en el destierro."}
  5:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-4, type: prophecy, entities: [event:ezequiel-se-afeita-la-cabeza-y-la-barba, person:ezequiel], mentions: [event:ezequiel-escenifica-el-sitio-de-jerusalen, event:sitio-de-jerusalen-609, event:regreso-de-537], note: "Al acabar el asedio representado en Eze 4, Ezequiel reparte su pelo en tres partes. La Atalaya de 2007 ve en los cabellos guardados el resto que volvería tras setenta años."}
    - {v: 5-9, type: prophecy, entities: [event:ezequiel-se-afeita-la-cabeza-y-la-barba, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Jehová puso a Jerusalén en medio de las naciones, pero ella fue más rebelde que sus vecinas. Ejecutará contra ella una sentencia sin igual; La adoración pura, cap. 6, lo une a la destrucción de la ciudad."}
    - {v: 10-12, type: prophecy, entities: [event:ezequiel-se-afeita-la-cabeza-y-la-barba], mentions: [event:sitio-de-jerusalen-609, event:destruccion-de-jerusalen-607, place:jerusalen], note: "Durante el asedio unos comerán a otros. Por haber contaminado el santuario con ídolos, un tercio morirá de peste o hambre, otro a espada fuera de la ciudad y el último irá disperso con la espada detrás."}
    - {v: 13-17, type: prophecy, entities: [event:ezequiel-se-afeita-la-cabeza-y-la-barba], note: "Jehová desahogará su furia porque exige devoción exclusiva. La ciudad quedará en ruinas, objeto de burla y aviso para los vecinos; enviará hambre, fieras, peste y espada."}
  6:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-7, type: prophecy, entities: [event:ezequiel-profetiza-contra-las-montanas-de-israel, person:ezequiel, place:israel], mentions: [place:juda], note: "Ezequiel debe volverse hacia las montañas de Israel, que La Atalaya de 2007 entiende como la tierra de Judá. La espada destruirá lugares altos, altares e ídolos repugnantes, palabra que la nota liga al estiércol."}
    - {v: 8-10, type: prophecy, entities: [event:ezequiel-profetiza-contra-las-montanas-de-israel], mentions: [event:regreso-de-537, period:destierro-y-regreso], note: "Quedará un resto disperso entre las naciones que recordará a Jehová y aborrecerá su idolatría. La adoración pura, cap. 6, cuenta entre ese resto a quienes volvieron a Jerusalén tras setenta años."}
    - {v: 11-14, type: prophecy, entities: [event:ezequiel-profetiza-contra-las-montanas-de-israel, person:ezequiel, place:dibla], mentions: [place:israel], note: "Ezequiel debe dar palmadas y golpear el suelo en señal de lamento. Espada, hambre y peste alcanzarán a lejanos y cercanos, y los cadáveres yacerán donde ofrecían incienso a sus ídolos."}
  7:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-4, type: prophecy, entities: [event:ezequiel-anuncia-el-fin-de-la-tierra-de-israel, person:ezequiel, place:israel], note: "Nueva palabra de Jehová a Ezequiel: el fin alcanza los cuatro extremos de la tierra de Israel, que en este libro es sobre todo Judá y Jerusalén (La adoración pura, cap. 5, nota a)."}
    - {v: 5-9, type: prophecy, entities: [event:ezequiel-anuncia-el-fin-de-la-tierra-de-israel], note: "Llega una calamidad sin igual y el día está cerca: Jehová derramará su furor, juzgará a cada uno por su conducta y no tendrá lástima. En los montes habrá pánico y no fiesta."}
    - {v: 10-13, type: prophecy, entities: [event:ezequiel-anuncia-el-fin-de-la-tierra-de-israel], note: "La vara ha florecido y la violencia crece. Ni la riqueza ni el prestigio salvarán: quien compra no se alegre ni quien vende se lamente, porque nadie conservará lo vendido (nota del v. 12)."}
    - {v: 14-18, type: prophecy, entities: [event:ezequiel-anuncia-el-fin-de-la-tierra-de-israel], mentions: [event:sitio-de-jerusalen-609], note: "Suena la trompeta y nadie sale a luchar; fuera mata la espada y dentro el hambre y la peste. La adoración pura, cap. 6, párr. 15, lo ve cumplido en el asedio que empezó en 609."}
    - {v: 19-22, type: prophecy, entities: [event:ezequiel-anuncia-el-fin-de-la-tierra-de-israel], mentions: [event:destruccion-de-jerusalen-607], note: "Tirarán la plata por las calles; con su oro hicieron ídolos. Jehová lo dará como botín a extranjeros y dejará profanar su lugar oculto, la parte más interior del santuario (nota del v. 22)."}
    - {v: 23-27, type: prophecy, entities: [event:ezequiel-anuncia-el-fin-de-la-tierra-de-israel], mentions: [event:destruccion-de-jerusalen-607], note: "Cadenas para los cautivos: vendrán las peores naciones, que Perspicacia «Reino de Dios» liga a Babilonia. No habrá visión de profeta ni ley de sacerdotes; el rey y el jefe, sin nombre aquí, estarán de duelo."}
  8:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: "1", type: narration, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, person:ezequiel, relation:ezequiel/lived_in/tel-abib], note: "Día 5 del mes sexto del año sexto, 612 a.e.c. Ezequiel está en su casa de Tel-Abib con ancianos de Judá desterrados (La adoración pura, cap. 5, párr. 2) cuando lo toma la mano de Jehová."}
    - {v: 2-4, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, place:jerusalen, place:monte-moria], note: "Una figura de fuego y brillo de electro lo agarra del pelo y el espíritu lo lleva en visión a Jerusalén, a la puerta interior del norte del templo. Allí está la gloria que vio en la llanura."}
    - {v: 5-6, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen], note: "Primera escena: al norte de la puerta del altar, el símbolo de celos, quizá un poste sagrado de la diosa Aserá, sin ficha (La adoración pura, cap. 5, párr. 7). Aleja a Jehová de su santuario."}
    - {v: 7-12, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, person:jaazanias-hijo-de-safan, relation:jaazanias-hijo-de-safan/kin/safan], mentions: [person:safan], note: "Segunda escena: tras perforar la pared, ve reptiles e ídolos grabados y a 70 ancianos de la casa de Israel con incensarios, entre ellos Jaazanías. Dicen que Jehová no los ve y abandonó el país."}
    - {v: 13-14, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen], note: "Tercera escena: junto a la puerta norte del templo, unas mujeres sentadas lloran por Tamuz, dios mesopotámico sin ficha (Perspicacia «Tamuz, I»)."}
    - {v: 15-18, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "Cuarta escena: en el patio interior, entre el pórtico y el altar, unos 25 hombres dan la espalda al templo y se inclinan ante el sol. Judá llena el país de violencia; Jehová actuará con furia."}
  9:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, person:ezequiel], mentions: [place:monte-moria], note: "Una voz llama a los que castigarán la ciudad: seis hombres armados vienen por la puerta superior del norte, que Perspicacia «Puerta» relaciona con la Puerta Superior de Benjamín, y con ellos uno vestido de lino con tintero de secretario."}
    - {v: 3-7, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607], note: "La gloria de Dios pasa al umbral. Jehová manda marcar a quienes gimen por lo detestable de Jerusalén y matar al resto, empezando por los ancianos del templo. Se cumplió en 607 («La adoración pura», cap. 16)."}
    - {v: 8-11, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, person:ezequiel, place:jerusalen], note: "Ezequiel, solo, cae rostro a tierra y pregunta si acabará con el resto de Israel. Jehová responde que la culpa de Israel y Judá es enorme. El de lino dice que cumplió; «La adoración pura» ve ángeles en los siete."}
  10:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-8, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen], mentions: [event:destruccion-de-jerusalen-607, place:monte-moria], note: "Sobre los querubines hay algo como un trono de zafiro. Un querubín da brasas al hombre de lino para lanzarlas sobre la ciudad; la referencia remite al incendio de 2Re 25:8, 9. La nube llena la casa."}
    - {v: 9-17, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, place:rio-kebar], note: "Junto a cada querubín hay una rueda que brilla como crisólito, como una rueda dentro de otra. Cada querubín tiene cuatro caras: de querubín, de hombre, de león y de águila. Son los seres del río Kebar."}
    - {v: 18-22, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, person:ezequiel, place:rio-kebar], mentions: [place:monte-moria], note: "La gloria de Jehová deja el umbral y se pone sobre los querubines, que se paran ante la puerta oriental del templo. Ezequiel reconoce en ellos a los seres vivientes del río Kebar."}
  11:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-4, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, person:ezequiel, person:jaazanias-hijo-de-azur, person:azur-padre-de-jaazanias, person:pelatias-hijo-de-benaya, person:benaya-padre-de-pelatias, relation:jaazanias-hijo-de-azur/kin/azur-padre-de-jaazanias, relation:jaazanias-hijo-de-azur/lived_in/jerusalen, relation:pelatias-hijo-de-benaya/kin/benaya-padre-de-pelatias, relation:pelatias-hijo-de-benaya/lived_in/jerusalen], mentions: [place:jerusalen], note: "Sigue la visión del año sexto, 612 a.e.c. Un espíritu lleva a Ezequiel a la puerta oriental del templo, donde ve a 25 hombres que dan malos consejos en la ciudad."}
    - {v: 5-12, type: prophecy, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen], mentions: [place:jerusalen, place:israel], note: "La ciudad no será olla que proteja a los príncipes: los muertos que dejaron son la carne, y a ellos los sacarán y juzgarán en la frontera de Israel."}
    - {v: "13", type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, person:ezequiel, person:pelatias-hijo-de-benaya, relation:pelatias-hijo-de-benaya/died_in/jerusalen], note: "Pelatías muere al terminar el mensaje, y Ezequiel, rostro a tierra, pregunta si Jehová acabará con el resto de Israel."}
    - {v: 14-21, type: prophecy, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen], mentions: [place:jerusalen, place:israel, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, event:regreso-de-537], note: "Los de Jerusalén dan por perdidos a los desterrados de 617; Jehová será su santuario, los reunirá y les dará la tierra de Israel y un corazón nuevo. «La adoración pura», cap. 6 y 9: el regreso."}
    - {v: 22-23, type: vision, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen], mentions: [place:jerusalen, place:monte-de-los-olivos], note: "La gloria de Jehová deja la ciudad y se detiene sobre el monte del este, que Perspicacia «Olivos, Monte de los» identifica citando Eze 11:23."}
    - {v: 24-25, type: narration, entities: [event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen, person:ezequiel, place:caldea, relation:ezequiel/lived_in/caldea], note: "Acabada la visión, el espíritu devuelve a Ezequiel con los desterrados de Caldea, y él les cuenta lo que Jehová le mostró."}
  12:
    status: complete
