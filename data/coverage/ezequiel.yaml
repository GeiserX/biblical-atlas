    spans:
    - {v: 1-10, type: prophecy, entities: [event:ezequiel-profetiza-contra-los-pastores-de-israel, person:ezequiel], mentions: [event:destruccion-de-jerusalen-607], note: "Los pastores son los gobernantes de Israel (Perspicacia «Pastor»): comen la grasa y visten la lana, no curan ni buscan a las ovejas. Según La adoración pura, cap. 8, Jehová les quitó el poder con los babilonios en 607."}
    - {v: 11-16, type: prophecy, entities: [event:ezequiel-profetiza-contra-los-pastores-de-israel, place:israel], mentions: [event:regreso-de-537], note: "Jehová mismo buscará las ovejas dispersas el día de nubes y las llevará a pastar a las montañas de Israel. La adoración pura, cap. 8, ve un rescate en la vuelta de Babilonia setenta años después."}
    - {v: 17-22, type: prophecy, entities: [event:ezequiel-profetiza-contra-los-pastores-de-israel], note: "Jehová juzgará entre las ovejas gordas, que pisotean el pasto y enturbian el agua, y las flacas a las que empujan. Perspicacia lo compara con las ovejas y las cabras de Mt 25:32, 33."}
    - {v: 23-24, type: prophecy, entities: [event:ezequiel-profetiza-contra-los-pastores-de-israel], mentions: [person:david, person:jesus], note: "Un solo pastor, «mi siervo David», jefe en medio de ellas. El nombre es el del rey, muerto mucho antes; Perspicacia «David», «Toda Escritura» y La adoración pura, cap. 8, lo aplican al Mesías, Jesús, heredero de David."}
    - {v: 25-31, type: prophecy, entities: [event:ezequiel-profetiza-contra-los-pastores-de-israel], note: "Un pacto de paz: sin fieras, con lluvias a su tiempo, cosechas y seguridad, libres del yugo y del hambre. La colina de Jehová no lleva nombre. La adoración pura, cap. 8, ve su pleno cumplimiento en el nuevo mundo."}
  35:
