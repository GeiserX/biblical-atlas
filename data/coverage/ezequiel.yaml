    - {v: 8-11, type: prophecy, entities: [event:ezequiel-anuncia-el-castigo-de-ammon-moab-edom-y-filistea, place:moab, place:seir, place:bet-jesimot, place:baal-meon, place:quiryataim, place:ammon], mentions: [event:sitio-de-jerusalen-609, event:nabucodonosor-invade-ammon-y-moab], note: "Moab y Seír (Edom) dijeron que Judá era una nación más; Perspicacia «Moab» lo une al ataque babilonio. Jehová abrirá su flanco por Bet-Jesimot, Baal-Meón y Quiryataim, ciudades fronterizas, y lo dará a los orientales."}
    - {v: 12-14, type: prophecy, entities: [event:ezequiel-anuncia-el-castigo-de-ammon-moab-edom-y-filistea, place:edom, place:teman, place:dedan], mentions: [person:nabonido, event:destruccion-de-jerusalen-607], note: "Edom se vengó de Judá, también en 607 según La adoración pura. De Temán a Dedán caerán a espada y la venganza vendrá por mano de Israel; Perspicacia «Edom» lo ve cumplido en parte con Nabonido."}
