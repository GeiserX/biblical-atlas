    - {v: 9-12, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Jehová manda a los jefes de Israel dejar la violencia y el despojo del pueblo y usar pesas y medidas exactas: efá y bato, décima parte del homer; el siclo vale 20 guerás y la mina, 60 siclos."}
    - {v: 13-17, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Lo que aporta el pueblo: un sexto de efá por homer de trigo o de cebada, una cuota de aceite y una oveja de cada 200. Se entrega al jefe, que provee las ofrendas de fiestas, lunas nuevas y sábados."}
    - {v: 18-20, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "El 1 del primer mes, la sangre de un toro joven purifica el santuario: se pone en los postes de las puertas y en las esquinas del altar. El día 7 se repite por quien pecó sin saberlo."}
    - {v: 21-25, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Pascua, el 14 del primer mes: el jefe da un toro por sí y por el pueblo, y en los siete días de fiesta, siete toros, siete carneros y un macho cabrío diarios. Igual desde el 15 del mes séptimo."}
  46:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-3, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "La puerta oriental del patio interior se abre solo en sábado y luna nueva. El jefe se queda junto a su poste mientras los sacerdotes presentan sus ofrendas; según Perspicacia «Principal», eso muestra que no era sacerdote."}
    - {v: 4-7, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Ofrendas del jefe: en sábado, seis corderos y un carnero; en luna nueva, además un toro joven. Por cada toro y cada carnero, un efá de grano con un hin de aceite; por los corderos, lo que pueda."}
    - {v: 8-11, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "En las fiestas, quien entra por la puerta norte sale por la sur, y al revés: nadie vuelve por donde entró. El jefe entra y sale junto con el pueblo; la medida de grano y aceite se repite."}
    - {v: 12-15, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Para una ofrenda voluntaria del jefe se abre la puerta oriental, que se cierra al salir él. Cada mañana se ofrece un cordero de un año, con un sexto de efá de harina y un tercio de hin de aceite."}
    - {v: 16-18, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "La herencia que el jefe regale a sus hijos es de ellos para siempre; la que dé a un siervo le vuelve en el año de libertad. No puede echar al pueblo de su tierra para dotar a sus hijos."}
    - {v: 19-20, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], note: "El guía lleva a Ezequiel a los comedores santos del norte y le enseña, al oeste, dónde los sacerdotes cuecen las ofrendas por la culpa y por el pecado sin sacar lo santo al patio exterior."}
    - {v: 21-24, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], note: "En cada esquina del patio exterior ve un patio pequeño de 40 por 30 codos, con hileras de piedra y fogones debajo: allí los servidores del templo cuecen los sacrificios que trae el pueblo."}
  47:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], note: "De vuelta a la entrada del templo de la visión, Ezequiel ve brotar agua bajo el umbral, al sur del altar, y correr hacia el este. Por fuera, junto a la puerta oriental, el agua sigue saliendo."}
    - {v: 3-6, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], note: "El hombre del cordón de medir cuenta cuatro tramos de mil codos largos. El agua cubre los tobillos, luego las rodillas, luego las caderas, y al final es un río que solo se pasa nadando."}
    - {v: 7-12, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel, place:araba, place:mar-salado, place:en-guedi, place:en-eglaim], mentions: [place:mar-grande], note: "Crecen árboles en las dos orillas. El río baja por el Arabá hasta el mar Muerto, como dice La adoración pura, y sana su agua: habrá pescadores de En-Guedí a En-Eglaim. Los pantanos seguirán salados."}
    - {v: 13-14, type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, place:israel], mentions: [event:regreso-de-537], note: "Jehová fija la tierra que heredarán las doce tribus, en partes iguales y con dos para José, es decir, Efraín y Manasés. La adoración pura ve su primer cumplimiento en la vuelta de los desterrados desde 537."}
    - {v: 15-17, type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, place:mar-grande, place:hetlon, place:zedad, place:hamat, place:berota, place:sibraim, place:damasco, place:hazer-haticon, place:hauran, place:hazar-enan], note: "Frontera norte: sale del mar Grande por el camino de Hetlón hacia Zedad, Hamat, Berotá y Sibraim, pasa por Hazer-Haticón, junto a Haurán, y acaba en Hazar-Enón, entre los límites de Damasco y de Hamat."}
    - {v: "18", type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, place:hauran, place:damasco, place:rio-jordan, place:galaad, place:israel, place:mar-salado], note: "Frontera este: pasa entre Haurán y Damasco y baja por el Jordán, que separa Galaad de la tierra de Israel, hasta el mar del este, el mar Muerto según la nota."}
    - {v: "19", type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, place:tamar, place:meriba-de-cades, place:torrente-de-egipto, place:mar-grande], note: "Frontera sur: arranca en Tamar, pasa por las aguas de Meribat-Cadés y sigue por el Torrente, que la nota identifica con el de Egipto, hasta el mar Grande."}
    - {v: "20", type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, place:mar-grande, place:lebo-hamat], note: "Frontera oeste: el mar Grande, desde el límite sur hasta un punto frente a Lebó-Hamat, o la entrada de Hamat según la nota."}
    - {v: 21-23, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, place:israel], note: "Los extranjeros que viven entre las tribus y han tenido hijos allí heredan como israelitas de nacimiento, en la tribu donde residen. La adoración pura, cap. 20, señala que esto va más allá de la Ley mosaica."}
  48:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-7, type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, place:hetlon, place:lebo-hamat, place:hazar-enan, place:damasco, place:hamat], note: "De norte a sur, franjas iguales de este a oeste para Dan, Aser, Neftalí, Manasés, Efraín, Rubén y Judá. La de Dan sigue la frontera norte por Hetlón, Lebó-Hamat y Hazar-Enán, junto a Damasco y Hamat."}
    - {v: 8-14, type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], mentions: [person:sadoc-hijo-de-ahitub], note: "Al sur de Judá se reserva la contribución, con el santuario en medio. Una franja santísima es de los sacerdotes hijos de Sadoc, que no se desviaron; otra igual, de los levitas, que no pueden venderla ni cambiarla."}
    - {v: 15-20, type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "La franja restante, de 5.000 codos, es de uso común: en medio, una ciudad cuadrada de 4.500 codos por lado con 250 de pastos. Sus campos los cultivan trabajadores de todas las tribus. El conjunto mide 25.000 por 25.000."}
    - {v: 21-22, type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Lo que queda a los dos lados de la contribución y de la ciudad es del jefe, entre la franja de Judá y la de Benjamín. El texto no da el nombre del jefe."}
    - {v: 23-29, type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, place:tamar, place:meriba-de-cades, place:torrente-de-egipto, place:mar-grande], note: "Siguen al sur Benjamín, Simeón, Isacar, Zabulón y Gad. La frontera sur, junto a Gad, va de Tamar a las aguas de Meribat-Cadés, al Torrente de Egipto y al mar Grande."}
    - {v: 30-34, type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "La ciudad tiene doce puertas con nombres de tribus: al norte Rubén, Judá y Leví; al este José, Benjamín y Dan; al sur Simeón, Isacar y Zabulón; al oeste Gad, Aser y Neftalí."}
    - {v: "35", type: list, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Perímetro de 18.000 codos y un nombre nuevo: Jehová Está Allí. Para La adoración pura, cap. 21, no es la Jerusalén reconstruida sino una ciudad simbólica de la visión; Perspicacia la llama Jehová Mismo Está Allí."}
