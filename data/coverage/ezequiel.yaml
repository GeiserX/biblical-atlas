    - {v: 10-13, type: prophecy, entities: [event:ezequiel-anuncia-la-desolacion-de-seir, place:israel], mentions: [place:juda], note: "Edom quiso adueñarse de dos naciones y dos países, Judá e Israel según Perspicacia «Edom», aunque Jehová estaba allí. Él oyó sus burlas contra las montañas de Israel y su arrogancia."}
    - {v: 14-15, type: prophecy, entities: [event:ezequiel-anuncia-la-desolacion-de-seir, place:seir, place:edom], note: "Como Seír se alegró de ver desolada la herencia de Israel, toda la tierra se alegrará cuando Jehová la arruine. El v. 15 iguala la región montañosa de Seír con todo Edom."}
  36:
