    - {v: 5-11, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Rodean el templo tres plantas de cámaras laterales, 30 en cada una, apoyadas en repisas y con una subida de caracol a cada lado. Siguen una plataforma, un pasillo libre de cinco codos y un espacio de 20."}
    - {v: 12-14, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Detrás del templo, hacia el oeste, se alza un edificio de 70 por 90 codos. El templo mide 100 codos de largo, igual que ese edificio con el espacio libre, y la fachada oriental 100 de ancho."}
    - {v: 15-20, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Se miden también galerías, umbrales y ventanas de marco estrecho. Paneles de madera forran el interior, tallado con palmeras entre querubines de dos caras, de hombre hacia un lado y de león hacia el otro."}
    - {v: 21-26, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Ante el Santísimo hay un altar de madera de tres codos de alto, que el guía llama la mesa ante Jehová. Las puertas son dobles, de hojas plegables y talladas igual; el pórtico lleva un alero de madera."}
  42:
    status: complete
