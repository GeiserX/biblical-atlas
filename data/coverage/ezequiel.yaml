    - {v: 10-12, type: prophecy, entities: [event:ezequiel-anuncia-el-dia-de-jehova-contra-egipto, person:nabucodonosor-ii, place:egipto, place:rio-nilo], mentions: [place:babilonia, event:nabucodonosor-contra-egipto], note: "Nabucodonosor y sus tropas, las más crueles de las naciones, acabarán con las multitudes de Egipto. Los canales del Nilo se secarán y extranjeros dejarán la tierra desolada."}
    - {v: 13-19, type: prophecy, entities: [event:ezequiel-anuncia-el-dia-de-jehova-contra-egipto, place:menfis, place:patros, place:zoan, place:no-amon, place:sin, place:on, place:pibeset, place:tahpanhes, place:egipto], note: "Caen los ídolos de Nof (Menfis), arden Patrós y Zoan, No (Tebas) es invadida, Sin tiembla y los jóvenes de On y Pibéset mueren. Tehafnehés se oscurece. Los dioses egipcios no llevan ficha."}
    - {v: 20-26, type: prophecy, entities: [event:ezequiel-anuncia-que-jehova-rompe-los-brazos-del-faraon, person:ezequiel, person:nabucodonosor-ii, place:egipto], mentions: [place:babilonia, event:batalla-de-carquemis], note: "Año 11, mes primero, día 7: el faraón, sin nombre en jw.org, ya tiene un brazo partido; las referencias remiten a Carquemis y a 2Re 24:7. El rey de Babilonia recibe la espada de Jehová."}
  31:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: prophecy, entities: [event:ezequiel-compara-al-faraon-con-un-cedro-talado, person:ezequiel, place:egipto], note: "Año 11 del destierro, mes tercero, día 1: Jehová manda a Ezequiel dirigirse al faraón, rey de Egipto, y a sus tropas. El texto no da su nombre ni Perspicacia «Faraón» dice quién era."}
    - {v: 3-9, type: prophecy, entities: [event:ezequiel-compara-al-faraon-con-un-cedro-talado], mentions: [place:asiria, place:libano, place:eden], note: "Imagen de un asirio como un cedro del Líbano, regado por aguas profundas, que daba sombra a las naciones; ningún árbol del Edén, el jardín de Dios, lo igualaba. La Atalaya de 2007 aplica el cedro al faraón."}
    - {v: 10-14, type: prophecy, entities: [event:ezequiel-compara-al-faraon-con-un-cedro-talado], mentions: [person:nabucodonosor-ii, event:nabucodonosor-contra-egipto], note: "Por su orgullo, Jehová lo pone en manos del gobernante poderoso de las naciones: lo talan y sus ramas quedan por montes y valles. La Atalaya de 2007 habla de la espada del rey de Babilonia."}
    - {v: 15-18, type: prophecy, entities: [event:ezequiel-compara-al-faraon-con-un-cedro-talado, place:egipto], mentions: [place:libano, place:eden], note: "Cuando baje a la Tumba, símbolo de la muerte y no un lugar del mapa, habrá duelo y temblarán las naciones; yacerá con los incircuncisos. Así acabarán el faraón y sus multitudes."}
  32:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: prophecy, entities: [event:ezequiel-entona-una-endecha-por-el-faraon, person:ezequiel, place:egipto], note: "Año 12, mes duodécimo, día 1: Ezequiel debe cantar una endecha por el faraón. Se creía un león joven entre las naciones, pero era como un monstruo marino que enturbiaba sus ríos."}
    - {v: 3-10, type: prophecy, entities: [event:ezequiel-entona-una-endecha-por-el-faraon], note: "Jehová lo sacará con su red y lo tirará al campo para las aves y las fieras; su sangre empapará la tierra, oscurecerá el cielo y llevará cautivos a tierras extrañas. Los reyes temblarán."}
    - {v: 11-16, type: prophecy, entities: [event:ezequiel-entona-una-endecha-por-el-faraon, place:egipto], mentions: [person:nabucodonosor-ii, place:babilonia, event:nabucodonosor-contra-egipto], note: "Vendrá la espada del rey de Babilonia, Nabucodonosor según «Toda Escritura»: abatirá el orgullo de Egipto, acabará con su ganado y dejará el país desolado. Las hijas de las naciones cantarán la endecha."}
    - {v: 17-21, type: prophecy, entities: [event:ezequiel-se-lamenta-por-la-caida-de-egipto-a-la-tumba, person:ezequiel, place:egipto], note: "Año 12, día 15 de un mes que el texto no nombra: Ezequiel se lamenta por las multitudes de Egipto, que bajan a la Tumba con los incircuncisos. Allí los guerreros más fuertes hablan, según la nota, quizá al faraón."}
    - {v: 22-23, type: prophecy, entities: [event:ezequiel-se-lamenta-por-la-caida-de-egipto-a-la-tumba], mentions: [place:asiria], note: "En la Tumba está Asiria, con sus tumbas alrededor de la de su rey, según la nota: todos muertos a espada por haber sembrado el terror."}
    - {v: 24-25, type: prophecy, entities: [event:ezequiel-se-lamenta-por-la-caida-de-egipto-a-la-tumba], mentions: [place:elam], note: "Allí está también Elam con sus multitudes, incircuncisos que cargan con su vergüenza. Perspicacia «Elam» lo cuenta entre las naciones que bajarían al Seol."}
    - {v: 26-28, type: prophecy, entities: [event:ezequiel-se-lamenta-por-la-caida-de-egipto-a-la-tumba], mentions: [place:mesec, place:tubal], note: "Allí están Mesec y Tubal, pueblos guerreros según Perspicacia «Mesec», con su rey, según la nota. Los guerreros yacen con las espadas bajo la cabeza; el faraón quedará aplastado entre ellos."}
    - {v: 29-30, type: prophecy, entities: [event:ezequiel-se-lamenta-por-la-caida-de-egipto-a-la-tumba], mentions: [place:edom, place:sidon], note: "Allí están Edom con sus reyes y jefes, y todos los príncipes del norte con los sidonios, humillados a pesar del miedo que causaban. Los príncipes del norte no se nombran."}
    - {v: 31-32, type: prophecy, entities: [event:ezequiel-se-lamenta-por-la-caida-de-egipto-a-la-tumba], note: "Al verlos, el faraón se consolará; él y su ejército caerán a espada y quedarán con los incircuncisos por haber sembrado el terror."}
  33:
