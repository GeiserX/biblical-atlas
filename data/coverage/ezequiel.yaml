    - {v: 16-21, type: prophecy, entities: [event:ezequiel-anuncia-que-jehova-santificara-su-nombre, person:ezequiel], mentions: [period:destierro-y-regreso], note: "Nuevo mensaje. Israel manchó su tierra con sangre e ídolos, y Jehová lo dispersó entre las naciones. Allí la gente profanaba su nombre al ver al pueblo de Jehová fuera de su país."}
    - {v: 22-32, type: prophecy, entities: [event:ezequiel-anuncia-que-jehova-santificara-su-nombre], mentions: [event:regreso-de-537], note: "Jehová actuará por su nombre, no por ellos: los reunirá, los limpiará de sus ídolos y les dará un corazón de carne, receptivo según la nota. La adoración pura, cap. 9, lo aplica al regreso del destierro."}
    - {v: 33-38, type: prophecy, entities: [event:ezequiel-anuncia-que-jehova-santificara-su-nombre, place:israel], mentions: [place:eden, place:jerusalen], note: "Se cultivará la tierra desolada y la gente la comparará con el jardín de Edén; las ciudades se llenarán como Jerusalén en sus fiestas. Según la nota, quizá los rebaños destinados a los sacrificios."}
  37:
