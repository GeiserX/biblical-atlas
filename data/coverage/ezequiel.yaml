    - {v: 6-8, type: prophecy, entities: [event:ezequiel-profetiza-contra-gog-de-magog], note: "Fuego sobre Magog y sobre quienes viven confiados en las islas; Jehová no dejará que se profane más su nombre. Magog no lleva ficha: Perspicacia «Magog», núm. 2, le da sentido simbólico."}
    - {v: 9-10, type: prophecy, entities: [event:ezequiel-profetiza-contra-gog-de-magog], mentions: [place:israel], note: "Los habitantes de las ciudades de Israel harán fuego con las armas del enemigo durante siete años, sin cortar leña, y saquearán a quienes los saquearon."}
