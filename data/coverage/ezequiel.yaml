    - {v: 13-14, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Esos comedores son santos: en ellos los sacerdotes comen y dejan las ofrendas santísimas, y allí se cambian la ropa del servicio antes de pasar al patio exterior, donde está el pueblo."}
    - {v: 15-20, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], note: "Acabado el interior, el guía sale por la puerta oriental y mide el recinto: 500 cañas por lado, cercado por un muro que aparta lo santo de lo común. Perspicacia «Templo» calcula unos 1.555 m por lado."}
  43:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-5, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], mentions: [place:rio-kebar, place:jerusalen, event:ezequiel-empieza-a-profetizar, event:ezequiel-ve-en-vision-la-apostasia-de-jerusalen], note: "En la puerta oriental, Ezequiel ve llegar del este la gloria de Dios, con estruendo de aguas, y entrar en el templo. La compara con lo visto junto al Kebar y en la visión contra la ciudad, Jerusalén (Eze 9)."}
    - {v: 6-9, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], mentions: [place:jerusalen, event:destruccion-de-jerusalen-607], note: "Jehová llama al templo sitio de su trono, donde vivirá siempre con Israel. Los cadáveres de sus reyes serían ídolos (Perspicacia «Sepultura»). Antes solo un muro separaba el templo de la ciudad (La adoración pura, cap. 14)."}
    - {v: 10-12, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], note: "Ezequiel tiene que describir el templo a Israel y poner por escrito su plano y sus estatutos, para que el pueblo se avergüence. La ley del templo declara santísima la zona que rodea la cumbre del monte."}
    - {v: 13-17, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Medidas del altar en codos largos, de un codo y un palmo menor (apéndice B14): una base, dos plataformas con saliente y un fogón de 12 por 12 codos con cuatro cuernos. Su escalera mira al este."}
    - {v: 18-27, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], mentions: [person:sadoc-hijo-de-ahitub], note: "Para inaugurar el altar, los sacerdotes levitas del linaje de Sadoc lo purifican siete días con un toro y machos cabríos por el pecado. Desde el octavo día ofrecerán holocaustos y sacrificios de paz del pueblo."}
  44:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-3, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], note: "La puerta exterior del este se queda cerrada, porque Jehová entró por ella. Solo el jefe, que no era de la tribu sacerdotal (La adoración pura, cap. 14), comerá allí ante Jehová, pasando por el pórtico."}
    - {v: 4-5, type: vision, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo, person:ezequiel], note: "Llevado por la puerta norte, Ezequiel ve la gloria de Jehová llenar el templo y se postra. Jehová le manda atender a los estatutos del templo y vigilar quién entra y sale del santuario."}
    - {v: 6-9, type: prophecy, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], mentions: [place:israel], note: "Jehová reprocha a Israel que dejara entrar en su santuario a extranjeros sin circuncidar, de corazón y de cuerpo, que lo profanaban. Ningún extranjero así que viva en el país volverá a entrar."}
    - {v: 10-14, type: prophecy, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Los levitas que se fueron tras los ídolos cuando Israel se desvió no servirán como sacerdotes: vigilarán las puertas, matarán las víctimas del pueblo y harán los trabajos del templo. Perspicacia «Ídolo, idolatría»: hasta levitas idolatraron."}
    - {v: 15-16, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], mentions: [person:sadoc-hijo-de-ahitub], note: "Los sacerdotes levitas que descienden de Sadoc, fieles cuando Israel se apartó, serán quienes se acerquen a Jehová y le presenten grasa y sangre. Perspicacia «Sadoc» los cita como los sacerdotes de la visión."}
    - {v: 17-27, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], note: "Normas para los sacerdotes: lino y nunca lana en el patio interior, cambiarse antes de salir al pueblo, pelo recortado, sin vino, con quién casarse, enseñar y juzgar, y cómo purificarse tras tocar a un muerto."}
    - {v: 28-31, type: law, entities: [event:ezequiel-ve-en-vision-un-templo-nuevo], mentions: [place:israel], note: "Los sacerdotes no reciben tierras en Israel: Jehová es su herencia. Comen las ofrendas de grano, por el pecado y por la culpa, reciben primicias y lo dedicado, y no comen animales muertos ni despedazados."}
  45:
