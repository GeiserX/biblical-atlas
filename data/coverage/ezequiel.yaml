    - {v: 8-12, type: prophecy, entities: [event:ezequiel-profetiza-contra-el-faraon-y-egipto, place:egipto, place:rio-nilo, place:migdol-de-los-profetas, place:siene, place:etiopia], mentions: [event:nabucodonosor-contra-egipto], note: "Una espada dejará Egipto sin gente ni ganado, de Migdol al norte a Siene y la frontera de Etiopía, y seco cuarenta años. Perspicacia «Egipto, egipcio» cree que fue tras la conquista de Nabucodonosor."}
    - {v: 13-16, type: prophecy, entities: [event:ezequiel-profetiza-contra-el-faraon-y-egipto, place:patros, place:egipto], mentions: [event:alejandro-conquista-egipto], note: "Pasados los cuarenta años, los egipcios volverán a Patrós, su tierra de origen, como reino pequeño que ya no dominará. Perspicacia lo ve cumplido cuando, desde Alejandro, Egipto no tuvo más faraones propios."}
    - {v: 17-20, type: prophecy, entities: [event:ezequiel-anuncia-que-egipto-sera-la-paga-de-nabucodonosor, event:nabucodonosor-sitia-tiro, person:ezequiel, person:nabucodonosor-ii, place:tiro, place:egipto], mentions: [place:babilonia, event:nabucodonosor-contra-egipto], note: "Año 27, mes primero, día uno (591), fuera de orden por tema. El sitio de Tiro no dio paga al ejército; Egipto será su botín. La campaña de 588 pudo ser esa conquista, pero jw.org no lo sabe."}
    - {v: "21", type: prophecy, entities: [event:ezequiel-anuncia-que-egipto-sera-la-paga-de-nabucodonosor, person:ezequiel], note: "Ese día Jehová hará brotar un cuerno, es decir, dará fuerza a la casa de Israel, el pueblo, sin ficha, y Ezequiel hablará entre ellos. Sigue al mensaje de 591: no hay otro hasta Eze 30:1."}
  30:
