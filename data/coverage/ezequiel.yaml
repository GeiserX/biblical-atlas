    - {v: 17-20, type: prophecy, entities: [event:ezequiel-profetiza-contra-gog-de-magog, person:ezequiel], mentions: [place:israel, place:basan], note: "Ezequiel debe convocar a aves y fieras al gran sacrificio de Jehová en las montañas de Israel: comerán la carne de guerreros y jefes, comparados con el ganado cebado de Basán."}
    - {v: 21-24, type: prophecy, entities: [event:ezequiel-profetiza-contra-gog-de-magog], mentions: [period:destierro-y-regreso, event:regreso-de-537], note: "Las naciones verán el juicio y entenderán que Israel fue al destierro y cayó a espada por su infidelidad. «Toda Escritura», libro 26, párr. 29, ve en Eze 39:21-28 la restauración de 537."}
    - {v: 25-29, type: prophecy, entities: [event:ezequiel-profetiza-contra-gog-de-magog], mentions: [period:destierro-y-regreso, event:regreso-de-537], note: "Jehová hará volver a los cautivos de Jacob, el pueblo, sin dejar a ninguno; vivirán seguros en su tierra y derramará su espíritu sobre Israel."}
