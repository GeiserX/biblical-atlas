    - {v: 11-14, type: prophecy, entities: [event:ezequiel-ve-revivir-los-huesos-secos, place:israel], mentions: [event:destruccion-de-jerusalen-607, event:asiria-destierra-a-israel, event:regreso-de-537], note: "Los huesos son la casa de Israel, sin esperanza; Jehová abrirá sus tumbas y la asentará en su tierra. La adoración pura, cap. 10, liga ese desánimo a la caída de Jerusalén y ve el cumplimiento desde 537."}
    - {v: 15-20, type: narration, entities: [event:ezequiel-une-los-palos-de-juda-y-de-jose, person:ezequiel, place:juda, place:israel], mentions: [event:asiria-destierra-a-israel], note: "El palo de Judá es el reino de dos tribus; el de José, en mano de Efraín, el reino del norte que Asiria desterró (La adoración pura, cap. 12, párr. 3 y nota). José y Efraín no van como personas."}
    - {v: 21-23, type: prophecy, entities: [event:ezequiel-une-los-palos-de-juda-y-de-jose, place:israel], mentions: [event:regreso-de-537], note: "Jehová reunirá a los israelitas de las naciones en las montañas de Israel como una sola nación con un solo rey, limpia de ídolos. La adoración pura, cap. 12, párr. 7, lo ve cumplido con el regreso de 537."}
    - {v: 24-28, type: prophecy, entities: [event:ezequiel-une-los-palos-de-juda-y-de-jose], mentions: [person:david, person:jesus, person:jacob], note: "Mi siervo David será su rey: el nombre es del rey histórico y «Toda Escritura», párr. 31, y La adoración pura, cap. 12, lo aplican a Jesús. Vivirán en la tierra dada a Jacob, bajo un pacto de paz."}
  38:
