    spans:
    - {v: 1-5, type: prophecy, entities: [event:ezequiel-anuncia-la-muerte-del-lider-de-tiro, person:ezequiel, place:tiro], mentions: [person:daniel], note: "El líder de Tiro, sin nombre, dice ser un dios sentado en el corazón del mar. Es más sabio que Daniel, el profeta de la corte babilonia según la referencia marginal, y el comercio lo ha hecho rico y altivo."}
    - {v: 6-10, type: prophecy, entities: [event:ezequiel-anuncia-la-muerte-del-lider-de-tiro, place:tiro], mentions: [person:nabucodonosor-ii, event:nabucodonosor-sitia-tiro], note: "Jehová traerá contra él a los extranjeros más despiadados, que lo bajarán al hoyo: morirá como un hombre, no como un dios. La referencia a Eze 30:10, 11 y Perspicacia «Tiro» apuntan a Nabucodonosor."}
    - {v: 11-15, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-el-rey-de-tiro, place:tiro, place:eden], mentions: [person:satanas], note: "Lamento por el rey de Tiro, que Perspicacia «Tiro» ve como su línea de reyes: estuvo en Edén, el jardín de Dios, cubierto de gemas, como querubín protector en la montaña santa, intachable hasta que pecó."}
    - {v: 16-19, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-el-rey-de-tiro, place:tiro], mentions: [person:satanas], note: "El comercio lo llenó de violencia y su belleza, de orgullo: Jehová lo echará de la montaña de Dios y lo hará ceniza ante los reyes. Perspicacia «Perfección» y La Atalaya de 2005 ven en él un reflejo de Satanás."}
    - {v: 20-23, type: prophecy, entities: [event:ezequiel-profetiza-contra-sidon, place:sidon], mentions: [period:potencia-babilonica], note: "Ezequiel vuelve el rostro hacia Sidón: Jehová enviará peste y espada a sus calles y será santificado en ella. Perspicacia «Sidón, sidonios» lo ve cumplido en la destrucción que le causaron los babilonios y otros pueblos."}
    - {v: 24-26, type: prophecy, entities: [event:ezequiel-profetiza-contra-sidon], mentions: [place:israel, person:jacob], note: "Israel ya no tendrá vecinos que lo hieran como espinas. Jehová juntará a los israelitas dispersos por otros pueblos, y vivirán seguros en la tierra dada a su siervo Jacob, con casas y viñas."}
  29:
