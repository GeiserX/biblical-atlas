    reviewed_on: 2026-10-13
    spans:
    - {v: 1-9, type: prophecy, entities: [event:jehova-recuerda-a-ezequiel-su-deber-de-centinela, person:ezequiel], mentions: [event:jehova-nombra-centinela-a-ezequiel], note: "Quien oye el cuerno del vigía y no hace caso responde de su muerte. Ezequiel es centinela de Israel, el pueblo, y responde por el malvado al que no avise, como en Eze 3:17-21."}
    - {v: 10-20, type: prophecy, entities: [event:jehova-recuerda-a-ezequiel-su-deber-de-centinela], note: "Jehová no quiere la muerte del malvado. La justicia pasada no salva al que se rebela; la maldad pasada no condena al que la deja. Al pueblo que lo llama injusto, Jehová lo juzgará uno a uno."}
    - {v: 21-22, type: narration, entities: [event:un-escapado-anuncia-a-ezequiel-la-caida-de-jerusalen, person:ezequiel, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607, event:ezequiel-no-guarda-luto-por-su-esposa, event:ezequiel-ve-la-gloria-de-jehova-en-la-llanura], note: "Se cumple Eze 24:25-27 y acaba la mudez de Eze 3:26, que según La Atalaya de 2003 no era literal: no tenía mensaje para Israel hasta la caída. El escapado no tiene nombre."}
    - {v: 23-29, type: prophecy, entities: [event:ezequiel-anuncia-la-desolacion-a-los-que-quedan-en-las-ruinas, place:israel], mentions: [person:abrahan], note: "Los que siguen en la tierra de Israel arruinada alegan que Abrahán, uno solo, la poseyó. Comen carne con sangre, adoran ídolos y confían en la espada: morirán por espada, fieras o enfermedad, y las montañas de Israel quedarán vacías."}
    - {v: 30-33, type: prophecy, entities: [event:ezequiel-anuncia-la-desolacion-a-los-que-quedan-en-las-ruinas, person:ezequiel, relation:ezequiel/holds_office/caldea], note: "Los desterrados hablan de Ezequiel en los muros y las puertas y van a oírlo como quien oye una canción bonita, sin ponerla en práctica. Cuando se cumpla, sabrán que hubo un profeta entre ellos."}
  34:
