    reviewed_on: 2026-10-13
    spans:
    - {v: 1-6, type: prophecy, entities: [event:ezequiel-anuncia-la-ruina-de-tiro, person:ezequiel, place:tiro, place:jerusalen], mentions: [event:destruccion-de-jerusalen-607, event:alejandro-destruye-tiro], note: "Año 11, día primero de un mes que no se nombra. Tiro celebró la caída de Jerusalén, puerta de los pueblos, esperando enriquecerse. Muchas naciones la rasparán como roca pelada: Perspicacia «Tiro» lo ve cumplido con Alejandro en 332."}
    - {v: 7-14, type: prophecy, entities: [event:ezequiel-anuncia-la-ruina-de-tiro, event:nabucodonosor-sitia-tiro, person:nabucodonosor-ii, place:tiro], mentions: [place:babilonia, event:alejandro-destruye-tiro], note: "Nabucodonosor (Nabucodorosor, según la nota), rey de reyes, vendrá del norte con carros y jinetes, arrasará las poblaciones de tierra firme y la sitiará. Echar sus escombros al agua (v. 12) lo cumplió Alejandro, según «Toda Escritura»."}
    - {v: 15-18, type: prophecy, entities: [event:ezequiel-anuncia-la-ruina-de-tiro, place:tiro], note: "Las islas tiemblan con su caída; los príncipes del mar bajan de sus tronos, se quitan las ropas bordadas y cantan un lamento por la ciudad que dominaba el mar. Ni islas ni príncipes tienen nombre."}
    - {v: 19-21, type: prophecy, entities: [event:ezequiel-anuncia-la-ruina-de-tiro, place:tiro], note: "Jehová la cubrirá con aguas profundas y la bajará al hoyo junto a los pueblos de antaño, para que nadie vuelva a vivir en ella. La buscarán y no aparecerá."}
  27:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-7, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-tiro, person:ezequiel, place:tiro, place:monte-hermon, place:libano, place:basan, place:chipre, place:egipto, place:elisa], mentions: [place:fenicia], note: "Jehová manda a Ezequiel un lamento por Tiro, que se cree perfecta. La pinta como una nave: tablas de enebro de Senir (el Hermón), mástil del Líbano, remos de Basán, marfil de Kitim (Chipre), lino egipcio y toldos de Elisá."}
    - {v: 8-11, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-tiro, place:sidon, place:arvad, place:tiro, place:guebal, place:persia, place:lud, place:put], note: "Remeros de Sidón y Arvad, calafates veteranos de Guebal y marineros tirios. Persas, ludim y hombres de Put servían en su ejército, y los de Arvad guardaban sus murallas y torres colgando en ellas sus escudos."}
    - {v: 12-15, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-tiro, place:tarsis, place:grecia, place:tubal, place:mesec, place:togarma, place:dedan], note: "Tarsis paga con plata, hierro, estaño y plomo; Javán (Grecia), Tubal y Mesec, con esclavos y cobre; Togarmá, con caballos y mulas; Dedán, con marfil y ébano. Perspicacia «Dedán» no sabe si es el cusita o el de Joqsán."}
    - {v: 16-18, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-tiro, place:edom, place:juda, place:israel, place:minit, place:damasco, place:helbon, place:sahar], note: "Edom paga con turquesa, púrpura, bordados y corales; Judá e Israel, con trigo de Minit, miel, aceite y bálsamo; Damasco, con vino de Helbón y lana de Sahar, que la nota también lee «lana gris rojiza»."}
    - {v: 19-21, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-tiro, place:vedan, place:uzal, place:dedan, place:arabia, place:quedar], note: "Vedán y «Javán de Uzal» dan hierro, casia y caña; Perspicacia «Javán» no sabe si ese Javán es error de copista, colonia griega o tribu árabe, así que no lleva ficha. Dedán vende mantas; árabes y Quedar, ganado."}
    - {v: 22-24, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-tiro, place:reino-de-saba, place:raama, place:haran, place:cane, place:eden-centro-comercial, place:asiria, place:kilmad], note: "Saba y Raamá traen perfumes, piedras y oro; Harán, Cané, Edén, Saba, Asur y Kilmad, ropa fina y alfombras. Perspicacia «Seba», núm. 6, une ambos Saba al reino de Arabia; Asur es Asiria o su ciudad, Asur."}
    - {v: 25-27, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-tiro, place:tarsis, place:tiro], mentions: [person:nabucodonosor-ii, event:nabucodonosor-sitia-tiro], note: "Los barcos de Tarsis la cargan, pero sus remeros la llevan a aguas revueltas y el viento del este la parte: todo se hunde el día de su caída. Perspicacia «Tiro» lo une a la calamidad de Nabucodonosor."}
    - {v: 28-36, type: prophecy, entities: [event:ezequiel-canta-un-lamento-por-tiro, place:tiro], mentions: [event:nabucodonosor-sitia-tiro, event:alejandro-destruye-tiro], note: "Los marineros bajan a tierra y la lloran con polvo, ceniza y saco; isleños, reyes y mercaderes se espantan. La adoración pura, cap. 7, párr. 22, ve cumplidos los v. 33 y 34 con Babilonia y luego con Alejandro."}
  28:
    status: complete
