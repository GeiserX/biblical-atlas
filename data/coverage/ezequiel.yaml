    - {v: 8-13, type: prophecy, entities: [event:ezequiel-profetiza-contra-gog-de-magog, place:israel], mentions: [place:reino-de-saba, place:dedan, place:tarsis], note: "En los últimos años Gog invadirá las montañas de Israel, donde el pueblo reunido vive tranquilo y sin murallas, para saquearlo. Saba, Dedán y los mercaderes de Tarsis le preguntan si viene por el botín."}
    - {v: 14-17, type: prophecy, entities: [event:ezequiel-profetiza-contra-gog-de-magog], note: "Gog bajará del norte lejano con muchos pueblos a caballo, y Jehová se santificará ante las naciones por medio de él. Los profetas de Israel que ya lo habían anunciado no se nombran."}
    - {v: 18-23, type: prophecy, entities: [event:ezequiel-profetiza-contra-gog-de-magog, place:israel], note: "El día del ataque, la furia de Jehová hará temblar la tierra de Israel; cada soldado de Gog alzará la espada contra su hermano, y caerán peste, granizo, fuego y azufre. Así sabrán las naciones quién es Jehová."}
  39:
    status: complete
    reviewed_on: 2026-10-13
    spans:
