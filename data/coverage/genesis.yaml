# biblical-earth: cobertura de un libro. Formato en data/coverage/README.md.
book: genesis
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, note: "Dios crea los cielos y la tierra en un principio que no tiene fecha. La tierra estaba vacía y a oscuras, y su fuerza activa se movía sobre las aguas."}
    - {v: 3-25, type: narration, note: "Del primer día creativo al comienzo del sexto: luz, expansión, tierra seca y plantas, lumbreras, animales del agua y del aire, y animales terrestres. Ningún día tiene año, así que no son eventos."}
    - {v: 26-31, type: narration, entities: [event:creacion-de-adan, event:creacion-de-eva, person:adan, person:eva], note: "Dios hace al ser humano, hombre y mujer, a su imagen, le encarga la tierra y los animales y le da las plantas por alimento. Génesis 2 lo cuenta en detalle."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, note: "Terminada su obra, Dios deja de crear el séptimo día, lo bendice y lo declara sagrado. El texto dice que en ese día Dios sigue descansando."}
    - {v: 4-6, type: narration, note: "Comienza el relato de cómo se hicieron los cielos y la tierra. La nota de Gé 2:4 señala que aquí sale por primera vez el nombre Jehová. Aún no llovía ni había quien cultivara el suelo."}
    - {v: 7-9, type: narration, entities: [event:creacion-de-adan, person:adan, place:eden, relation:adan/lived_in/eden]}
    - {v: 10-14, type: narration, entities: [place:eden, place:rio-pison, place:havila, place:rio-guihon, place:tierra-de-cus, place:rio-tigris, place:asiria, place:rio-eufrates], note: "Un río salía de Edén y se partía en cuatro. Según Perspicacia, Moisés llamó a Havilá, Cus y Asiria con los nombres que tenían en su época, posteriores al Diluvio."}
    - {v: 15-17, type: narration, entities: [event:creacion-de-adan, person:adan, place:eden]}
    - {v: 18-25, type: narration, entities: [event:creacion-de-eva, person:eva, person:adan, place:eden, relation:adan/kin/eva, relation:eva/lived_in/eden]}
