    - {v: "21", type: prophecy, entities: [person:neftali-hijo-de-jacob, relation:neftali-hijo-de-jacob/kin/jacob], note: "Neftalí, cierva esbelta, dirá palabras hermosas."}
    - {v: 22-26, type: prophecy, entities: [person:jose-hijo-de-jacob, relation:jose-hijo-de-jacob/kin/jacob], note: "José, rama de un árbol fructífero, resiste a los arqueros gracias al Poderoso de Jacob, y recibirá las mayores bendiciones."}
    - {v: "27", type: prophecy, entities: [person:benjamin-hijo-de-jacob, relation:benjamin-hijo-de-jacob/kin/jacob], note: "Benjamín despedazará como un lobo y repartirá el botín."}
    - {v: "28", type: narration, entities: [event:jacob-bendice-a-sus-hijos, person:jacob], note: "De estos doce hijos salen las doce tribus de Israel."}
    - {v: 29-33, type: narration, entities: [event:muerte-de-jacob, person:jacob, person:lea, person:efron, place:macpela, relation:jacob/died_in/egipto, relation:abrahan/kin/sara, relation:isaac/kin/rebeca, relation:lea/died_in/canaan], mentions: [person:abrahan, person:sara, person:isaac, person:rebeca, place:mamre, place:canaan, place:egipto], note: "Los hijos de Het son los hititas, un pueblo sin ficha. «Reunido con su pueblo» es una forma de decir que murió."}
