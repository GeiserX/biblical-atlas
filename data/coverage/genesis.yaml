    - {v: 8-19, type: narration, entities: [event:juicio-en-eden, person:adan, person:eva, person:satanas, place:eden], note: "En el versículo 15 Dios anuncia enemistad entre la serpiente y la mujer y entre sus descendencias: la primera profecía de la Biblia."}
    - {v: 20-24, type: narration, entities: [event:expulsion-del-eden, person:adan, person:eva, place:eden, relation:adan/lived_in/eden, relation:eva/lived_in/eden], note: "Los querubines que guardan el camino al árbol de la vida no tienen nombre y no llevan ficha."}
