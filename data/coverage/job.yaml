    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: speech, entities: [event:job-responde-al-segundo-discurso-de-elifaz, person:job, person:elifaz-el-temanita], note: "Job llama a sus compañeros consoladores molestos: él, en su lugar, los animaría con sus palabras."}
    - {v: 6-17, type: speech, note: "Job siente que Dios lo ha agotado, ha acabado con su casa y lo ataca como un guerrero; viste saco y llora aunque es inocente."}
