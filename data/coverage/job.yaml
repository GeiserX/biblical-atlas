  33:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: speech, entities: [event:elihu-corrige-a-job, person:elihu-hijo-de-barakel, person:job], note: "Elihú pide a Job que lo escuche: los dos fueron hechos del barro, así que no tiene por qué temerle."}
