    spans:
    - {v: 1-29, type: speech, entities: [event:job-responde-al-segundo-discurso-de-bildad, person:job, person:bildad, person:zofar, person:elifaz-el-temanita, relation:bildad/tie/job, relation:zofar/tie/job, relation:elifaz-el-temanita/tie/job], note: "Job dice que Dios lo ha cercado y que su esposa, hermanos, amigos y criados lo rechazan; quiere que sus palabras queden grabadas. «Mi redentor vive» (19:25): el redentor no se nombra."}
  20:
    status: complete
