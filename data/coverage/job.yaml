    - {v: 5-14, type: speech, note: "El poder de Dios en la creación: la Tumba (Seol) y el lugar de destrucción (Abadón) están a su vista. Rahab, el monstruo marino del versículo 12, es figura poética y no lleva ficha."}
  27:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-12, type: speech, entities: [event:job-responde-al-tercer-discurso-de-bildad, person:job], note: "Job jura por Dios que mientras viva no dará la razón a sus compañeros ni renunciará a su integridad."}
    - {v: 13-23, type: speech, note: "Lo que le espera al malvado: sus hijos mueren, el justo se queda con su plata y un viento del este lo arrastra."}
  28:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-11, type: speech, entities: [event:job-responde-al-tercer-discurso-de-bildad, person:job], note: "El hombre abre minas en lo hondo de la tierra y saca plata, oro, hierro, cobre y zafiro de donde ningún animal llega."}
    - {v: 12-19, type: speech, entities: [place:ofir, place:etiopia], note: "La sabiduría no se compra: vale más que el oro de Ofir y que el topacio de Cus, la región que Perspicacia hace corresponder con Etiopía."}
    - {v: 20-28, type: speech, note: "Solo Dios sabe dónde está la sabiduría. Al hombre le dice que sabiduría es temer a Jehová y apartarse del mal."}
  29:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: speech, entities: [event:job-responde-al-tercer-discurso-de-bildad, person:job], note: "Job echa de menos los días en que Dios lo guardaba y sus hijos lo rodeaban."}
    - {v: 7-17, type: speech, entities: [person:job], note: "En la puerta de una ciudad sin nombre lo respetaban jóvenes, ancianos y príncipes; defendía al pobre, al huérfano y a la viuda y juzgaba con justicia."}
    - {v: 18-25, type: speech, note: "Contaba con morir anciano en su casa; la gente esperaba sus consejos como se espera la lluvia y él los guiaba como un jefe."}
  30:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-15, type: speech, entities: [event:job-responde-al-tercer-discurso-de-bildad, person:job], note: "Ahora se burlan de él y le escupen hombres más jóvenes, hijos de gente despreciada que vivía expulsada en los barrancos."}
    - {v: 16-31, type: speech, note: "Job describe su dolor, su piel ennegrecida y su fiebre, y se queja de que Dios no le responde aunque él siempre lloró con el pobre."}
  31:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-12, type: speech, entities: [event:job-responde-al-tercer-discurso-de-bildad, person:job], note: "Job dice que pactó con sus ojos no desear a otra mujer ni engañar, y pide que Dios lo pese con una balanza justa."}
    - {v: 13-23, type: speech, note: "No negó justicia a sus siervos ni abandonó al pobre, al huérfano o a la viuda: el mismo Dios los formó a todos."}
    - {v: 24-34, type: speech, note: "No se fió de su oro ni adoró al sol o a la luna, no celebró la ruina de su enemigo y abrió su casa al forastero."}
    - {v: 35-40, type: speech, note: "Pide que el Todopoderoso le responda y firma su defensa. El capítulo cierra diciendo que ahí terminan las palabras de Job."}
  32:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [event:elihu-corrige-a-job, person:elihu-hijo-de-barakel, person:barakel, person:ram-antepasado-de-elihu, person:buz-hijo-de-nacor, person:job, person:elifaz-el-temanita, person:bildad, person:zofar, relation:elihu-hijo-de-barakel/kin/barakel, relation:elihu-hijo-de-barakel/kin/ram-antepasado-de-elihu, relation:elihu-hijo-de-barakel/kin/buz-hijo-de-nacor, relation:barakel/kin/buz-hijo-de-nacor, relation:elifaz-el-temanita/tie/job, relation:bildad/tie/job, relation:zofar/tie/job], note: "Los tres compañeros dejan de responder a Job y Elihú, el más joven, se enoja con Job y con ellos."}
