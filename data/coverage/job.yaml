    - {v: 11-13, type: narration, entities: [event:los-tres-companeros-van-a-consolar-a-job, person:elifaz-el-temanita, person:bildad, person:zofar, person:suah, person:job, place:teman, relation:elifaz-el-temanita/tie/job, relation:elifaz-el-temanita/lived_in/teman, relation:bildad/tie/job, relation:bildad/accompanies/elifaz-el-temanita, relation:bildad/kin/suah, relation:zofar/tie/job, relation:zofar/accompanies/elifaz-el-temanita], note: "Naamatita alude a la familia o la tierra de Zofar, que no se conoce; no lleva lugar."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:job-maldice-el-dia-en-que-nacio, person:job]}
    - {v: 3-26, type: poetry, entities: [person:job], note: "Lamento de Job: ojalá no hubiera nacido, pues en la muerte descansaría. Leviatán (v. 8) es un gran animal acuático, no una persona."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-11, type: speech, entities: [event:primer-discurso-de-elifaz, person:elifaz-el-temanita, person:job, place:teman, relation:elifaz-el-temanita/tie/job, relation:elifaz-el-temanita/lived_in/teman], note: "Elifaz el temanita abre la primera ronda: recuerda que Job sostenía a los débiles y ahora se hunde; ningún inocente perece y quien cultiva maldad la recoge."}
    - {v: 12-21, type: speech, entities: [person:elifaz-el-temanita], note: "Elifaz relata una visión nocturna: un espíritu le dijo que Dios desconfía hasta de sus ángeles. Según La Atalaya, aquel espíritu era malo, no un ángel fiel."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-16, type: speech, entities: [event:primer-discurso-de-elifaz, person:elifaz-el-temanita, person:job], note: "Elifaz sigue: ningún santo (ángel, según la nota) ayudará a Job; el necio acaba arruinado. Él acudiría a Dios, que frustra a los astutos."}
    - {v: 17-27, type: speech, entities: [person:elifaz-el-temanita, person:job], note: "Elifaz llama feliz al que Dios corrige y promete a Job protección, muchos hijos y una vejez fuerte si acepta la disciplina."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-13, type: speech, entities: [event:job-responde-al-primer-discurso-de-elifaz, person:job], note: "Job contesta a Elifaz: dice que su angustia supera en peso a la arena del mar, que las flechas del Todopoderoso lo envenenan y que prefiere que Dios acabe con él."}
    - {v: 14-23, type: speech, entities: [person:job, place:tema, place:saba], note: "Sus amigos le fallan como torrentes que se secan en verano y dejan chasqueadas a las caravanas de Temá y a los viajeros de Saba."}
    - {v: 24-30, type: speech, entities: [person:job], note: "Job pide que le enseñen en qué se equivocó y les ruega que lo miren y recapaciten: su justicia sigue intacta."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: speech, entities: [event:job-responde-al-primer-discurso-de-elifaz, person:job], note: "La vida es trabajo forzado; el cuerpo de Job está lleno de gusanos, costras y pus. Quien baja a la Tumba (Seol, lugar simbólico, sin ficha) no vuelve."}
    - {v: 11-21, type: speech, entities: [person:job], note: "Job se queja a Dios: los sueños lo aterran, prefiere morir y pregunta por qué lo ha convertido en su blanco en vez de perdonarlo."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: speech, entities: [event:primer-discurso-de-bildad, person:bildad, person:job, relation:bildad/tie/job, relation:bildad/kin/suah], mentions: [person:suah], note: "Bildad el suhita (ligado a Súah, hijo de Abrahán) habla en segundo lugar: Dios no tuerce la justicia; si los hijos de Job pecaron, pagaron, y si Job es puro, Dios lo restablecerá."}
    - {v: 8-22, type: speech, entities: [person:bildad], note: "Bildad apela a las generaciones pasadas: como el papiro sin agua, el que olvida a Dios se seca; Dios no rechaza al íntegro."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-13, type: speech, entities: [event:job-responde-al-primer-discurso-de-bildad, person:job], note: "Job contesta a Bildad: nadie gana un pleito a Dios, que mueve montañas e hizo las constelaciones Ash, Kesil y Kimá (quizá Osa Mayor, Orión y Pléyades). Rahab es aquí un monstruo marino, sin ficha."}
    - {v: 14-24, type: speech, entities: [person:job], note: "Aunque tuviera razón, Job no sabría responder a Dios; siente que destruye igual al inocente que al malvado."}
    - {v: 25-35, type: speech, entities: [person:job], note: "Sus días huyen más rápido que un corredor; entre él y Dios no hay nadie que juzgue a los dos."}
  10:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-17, type: speech, entities: [event:job-responde-al-primer-discurso-de-bildad, person:job], note: "Job pide a Dios que no lo condene sin decirle por qué: lo formó como barro y lo tejió con huesos y tendones, y ahora lo destruye."}
    - {v: 18-22, type: speech, entities: [person:job], note: "Job lamenta haber nacido y pide un poco de alivio antes de ir a la tierra de oscuridad de la que no se vuelve."}
  11:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: speech, entities: [event:primer-discurso-de-zofar, person:zofar, person:job], note: "Zofar, el naamatita, reprocha a Job su palabrería y su pretensión de pureza, y desea que Dios le hable y le muestre su error."}
    - {v: 7-12, type: speech, note: "Zofar ensalza la sabiduría de Dios, más alta que el cielo y más honda que la Tumba (Seol), y llama cabeza hueca al que no la entiende."}
    - {v: 13-20, type: speech, note: "Zofar insta a Job a apartar la maldad de su tienda y le promete seguridad; a los malvados solo les queda la muerte."}
  12:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: speech, entities: [event:job-responde-al-primer-discurso-de-zofar, person:job, person:zofar, person:bildad, person:elifaz-el-temanita, relation:zofar/tie/job, relation:bildad/tie/job, relation:elifaz-el-temanita/tie/job], note: "Job responde a Zofar: no es inferior a sus compañeros, que se ríen de él aunque es justo, mientras los ladrones viven en paz."}
    - {v: 7-12, type: speech, note: "Los animales, las aves, la tierra y los peces muestran que la mano de Jehová lo hizo todo y sostiene la vida de todos."}
    - {v: 13-25, type: speech, note: "Dios tiene sabiduría y poder: derriba consejeros, jueces, reyes y sacerdotes, engrandece y destruye naciones y extravía a sus jefes."}
  13:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-12, type: speech, entities: [event:job-responde-al-primer-discurso-de-zofar, person:job], note: "Job llama a sus compañeros médicos inútiles que mienten a favor de Dios y prefiere defender su caso ante el Todopoderoso."}
    - {v: 13-19, type: speech, note: "Job pide silencio para hablar: aunque Dios lo matara seguiría esperando en él, porque sabe que tiene razón."}
    - {v: 20-28, type: speech, note: "Job ruega a Dios que aparte su mano, le muestre sus pecados y deje de tratarlo como enemigo por las faltas de su juventud."}
  14:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: speech, entities: [event:job-responde-al-primer-discurso-de-zofar, person:job], note: "La vida del hombre nacido de mujer es breve y agitada; Job pide a Dios que lo deje descansar hasta cumplir su jornada."}
    - {v: 7-12, type: speech, note: "Un árbol cortado vuelve a brotar, pero el hombre muere y no se levanta mientras dure el cielo."}
    - {v: 13-17, type: speech, note: "Job desea que Dios lo oculte en la Tumba (Seol) y fije un plazo para recordarlo; espera que Dios lo llame y el muerto vuelva a la vida."}
    - {v: 18-22, type: speech, note: "Como el agua desgasta la roca, Dios acaba con la esperanza del hombre; el muerto no sabe qué les pasa a sus hijos."}
  15:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: speech, entities: [event:segundo-discurso-de-elifaz, person:elifaz-el-temanita, person:job, place:teman, relation:elifaz-el-temanita/lived_in/teman], note: "Elifaz, el temanita, acusa a Job de hablar viento, de quitar valor al temor de Dios y de condenarse con su propia boca."}
    - {v: 7-16, type: speech, note: "Elifaz se burla de la sabiduría de Job, presume de canosos más viejos que su padre y dice que Dios no confía ni en sus santos."}
    - {v: 17-35, type: speech, note: "Elifaz describe la suerte del malvado: vive aterrado, pierde sus bienes y sus tiendas arden; los irreverentes no dan fruto."}
