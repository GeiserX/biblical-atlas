    - {v: 10-16, type: speech, note: "Job no halla un sabio entre sus compañeros; sus planes se rompieron y su esperanza bajará con él a la Tumba (Seol)."}
  18:
    status: complete
    reviewed_on: 2026-09-29
    spans:
