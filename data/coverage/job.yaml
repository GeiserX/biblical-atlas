    - {v: 31-33, type: speech, entities: [person:elihu-hijo-de-barakel, person:job], note: "Elihú invita a Job a responderle si puede o, si no, a callar y aprender."}
  34:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: speech, entities: [event:elihu-corrige-a-job, person:elihu-hijo-de-barakel, person:job], note: "Elihú se dirige a los sabios y cita a Job: dice tener razón y que no se gana nada con agradar a Dios."}
