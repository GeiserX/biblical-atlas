    spans:
    - {v: 1-8, type: narration, entities: [event:astrologos-ante-herodes, person:herodes-el-grande, person:jesus, place:jerusalen, place:belen, place:judea, relation:jesus/born_in/belen, relation:herodes-el-grande/lived_in/jerusalen, relation:herodes-el-grande/holds_office/judea], mentions: [event:nacimiento-de-jesus, person:miqueas-profeta, place:juda], note: "Los astrólogos no tienen nombre ni número. Vienen de Oriente, que Perspicacia cree probablemente Babilonia o Mesopotamia. La profecía citada es la de Miq 5:2."}
    - {v: 9-12, type: narration, entities: [event:astrologos-en-belen, person:jesus, person:maria-madre-de-jesus, place:belen, relation:jesus/lived_in/belen, relation:maria-madre-de-jesus/lived_in/belen, relation:jose-esposo-de-maria/lived_in/belen], mentions: [person:herodes-el-grande]}
    - {v: 13-15, type: narration, entities: [event:huida-a-egipto, person:jose-esposo-de-maria, person:jesus, person:maria-madre-de-jesus, person:herodes-el-grande, place:egipto, relation:jose-esposo-de-maria/lived_in/egipto, relation:maria-madre-de-jesus/lived_in/egipto, relation:jesus/lived_in/egipto], mentions: [person:oseas], note: "La cita «Llamé a mi hijo» es de Os 11:1. Egipto era entonces provincia romana."}
    - {v: 16-18, type: narration, entities: [event:matanza-de-los-ninos-de-belen, person:herodes-el-grande, place:belen, place:rama-de-benjamin], mentions: [person:jeremias-profeta, person:raquel], note: "La cita es de Jer 31:15. Raquel, enterrada cerca de Belén, representa a las madres que lloran; no actúa en el suceso."}
    - {v: 19-23, type: narration, entities: [event:regreso-a-nazaret, person:jose-esposo-de-maria, person:jesus, person:maria-madre-de-jesus, person:arquelao, person:herodes-el-grande, place:israel, place:judea, place:galilea, place:nazaret, relation:arquelao/kin/herodes-el-grande, relation:arquelao/succeeds/herodes-el-grande, relation:jesus/lived_in/nazaret, relation:jose-esposo-de-maria/lived_in/nazaret, relation:maria-madre-de-jesus/lived_in/nazaret, relation:arquelao/holds_office/judea], mentions: [person:isaias, place:egipto], note: "Nazareno, por Nazaret. Según la nota, Mateo alude al brote de Is 11:1 y quizá a otros profetas."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: narration, entities: [event:juan-comienza-su-ministerio, person:juan-el-bautista, place:desierto-de-juda, place:judea, place:rio-jordan], mentions: [person:isaias, place:jerusalen], note: "La «región del Jordán» del versículo 5 se apunta en el río Jordán."}
    - {v: 7-12, type: speech, entities: [event:juan-comienza-su-ministerio, person:juan-el-bautista], mentions: [person:abrahan], note: "Juan acusa a fariseos y saduceos de fiarse de ser hijos de Abrahán y anuncia a alguien más poderoso, que bautizará con espíritu santo y con fuego."}
    - {v: 13-17, type: narration, entities: [event:bautismo-de-jesus, person:jesus, person:juan-el-bautista, place:rio-jordan], mentions: [place:galilea]}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-11, type: narration, entities: [event:tentacion-en-el-desierto, person:jesus, person:satanas, place:desierto-de-juda, place:jerusalen], note: "Mateo lo llama la ciudad santa (v. 5). La montaña altísima del versículo 8 no tiene nombre."}
    - {v: "12", type: narration, entities: [event:encarcelamiento-de-juan, person:juan-el-bautista, person:jesus, place:galilea], note: "Entre los versículos 11 y 12 pasa cerca de un año (Jn 1:29 a 4:3), según la nota de estudio."}
    - {v: 13-16, type: narration, entities: [event:hijo-del-funcionario-y-sinagoga-de-nazaret, person:jesus, relation:jesus/lived_in/capernaum, place:nazaret, place:capernaum, place:zabulon, place:neftali, place:galilea], mentions: [person:isaias, place:mar-de-galilea, place:rio-jordan], note: "Mateo ve cumplido Is 9:1, 2: la luz llega a la tierra de Zabulón y Neftalí, Galilea de las naciones."}
    - {v: "17", type: narration, entities: [event:anuncio-del-reino-en-galilea, person:jesus]}
    - {v: 18-22, type: narration, entities: [event:llamada-de-cuatro-pescadores, person:jesus, person:pedro, person:andres, person:santiago-hijo-de-zebedeo, person:juan-apostol, person:zebedeo, place:mar-de-galilea, relation:andres/kin/pedro, relation:pedro/disciple_of/jesus, relation:andres/disciple_of/jesus, relation:santiago-hijo-de-zebedeo/kin/juan-apostol, relation:santiago-hijo-de-zebedeo/kin/zebedeo, relation:santiago-hijo-de-zebedeo/disciple_of/jesus, relation:juan-apostol/kin/zebedeo, relation:juan-apostol/disciple_of/jesus]}
    - {v: 23-25, type: narration, entities: [event:primera-gira-por-galilea, person:jesus, place:galilea, place:siria, place:decapolis, place:perea, place:jerusalen], mentions: [place:judea, place:rio-jordan], note: "La región al otro lado del Jordán (v. 25) es Perea, según la nota de estudio."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:sermon-del-monte, person:jesus], mentions: [place:capernaum], note: "La montaña no tiene nombre; la nota de estudio la pone cerca de Capernaúm y del mar de Galilea."}
    - {v: 3-12, type: speech, entities: [event:sermon-del-monte], note: "Nueve veces «felices»: los que saben que necesitan a Dios, los que lloran, los apacibles, los misericordiosos, los limpios de corazón, los pacíficos y los perseguidos por hacer el bien."}
    - {v: 13-16, type: speech, note: "Los discípulos son la sal de la tierra y la luz del mundo: sus buenas obras han de dar gloria al Padre."}
    - {v: 17-20, type: speech, note: "Jesús viene a cumplir la Ley y los Profetas, no a anularlos; la justicia de sus discípulos tiene que superar a la de escribas y fariseos."}
    - {v: 21-26, type: speech, entities: [place:valle-de-hinon], note: "Quien sigue airado o insulta a su hermano merece juicio; antes de ofrecer en el altar hay que hacer las paces. El Tribunal Supremo es el Sanedrín; la Gehena, el valle de Hinón."}
    - {v: 27-30, type: speech, mentions: [place:valle-de-hinon], note: "Mirar a una mujer con pasión ya es adulterio; más vale perder un ojo o una mano que acabar en la Gehena."}
    - {v: 31-32, type: speech, note: "Divorciarse por algo que no sea inmoralidad sexual expone al adulterio a la mujer y a quien se case con ella."}
    - {v: 33-37, type: speech, mentions: [place:jerusalen, person:satanas], note: "Nada de juramentos a la ligera: basta un sí o un no. El Maligno del versículo 37 es Satanás; la nota al pie admite también «lo que es malo»."}
    - {v: 38-42, type: speech, note: "En vez de vengarse, poner la otra mejilla, dar también el manto, andar la segunda milla y prestar a quien pide."}
    - {v: 43-48, type: speech, note: "Amar también a los enemigos y orar por quien persigue, como el Padre, que da sol y lluvia a buenos y malos."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: speech, entities: [event:sermon-del-monte, person:jesus], note: "Sigue el Sermón del Monte. Dar a los necesitados sin buscar el aplauso de nadie, no como los hipócritas de las sinagogas."}
    - {v: 5-15, type: speech, entities: [event:sermon-del-monte], mentions: [person:satanas], note: "Orar en privado y sin frases repetidas de memoria. Jesús da el padrenuestro como modelo y condiciona el perdón de Dios a perdonar a los demás. El Maligno (v. 13) es Satanás."}
    - {v: 16-18, type: speech, entities: [event:sermon-del-monte], note: "Quien ayuna no lo muestra en la cara; basta con que lo vea el Padre."}
    - {v: 19-24, type: speech, entities: [event:sermon-del-monte], note: "Guardar tesoros en el cielo, tener la vista fija en una sola meta y no servir a dos amos. Las Riquezas se personifican como amo; no son un dios con ficha."}
    - {v: 25-34, type: speech, entities: [event:sermon-del-monte], mentions: [person:salomon], note: "No vivir angustiados por comida y ropa: Dios cuida de aves y lirios, vestidos mejor que Salomón. Lo primero ha de ser buscar el Reino y lo que Dios considera justo."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: speech, entities: [event:sermon-del-monte, person:jesus], note: "No condenar a otros: quitarse antes la viga del propio ojo. Lo santo no se da a quien lo desprecia, figurados en perros y cerdos."}
    - {v: 7-12, type: speech, entities: [event:sermon-del-monte], note: "Insistir al pedir, buscar y llamar; el Padre da cosas buenas. Tratar a los demás como uno quiere ser tratado resume la Ley y los Profetas."}
    - {v: 13-14, type: speech, entities: [event:sermon-del-monte], note: "Dos puertas y dos caminos: el ancho lleva a la destrucción; el estrecho, que pocos hallan, a la vida."}
    - {v: 15-23, type: speech, entities: [event:sermon-del-monte], note: "A los falsos profetas se les conoce por sus frutos. Entrar en el Reino exige hacer la voluntad del Padre, no solo decir «Señor»."}
    - {v: 24-27, type: speech, entities: [event:sermon-del-monte], note: "Ilustración del hombre prudente y el insensato, que edifican sobre roca y sobre arena. Son figuras, no personas del atlas."}
    - {v: 28-29, type: narration, entities: [event:sermon-del-monte, person:jesus], note: "Al acabar el sermón, la gente queda asombrada porque enseña con autoridad propia, a diferencia de los escribas."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: narration, entities: [event:curacion-de-un-leproso, person:jesus], mentions: [person:moises], note: "La montaña de 8:1 es la del sermón y no tiene nombre. El curado debe llevar al sacerdote la ofrenda que fijó la Ley de Moisés."}
    - {v: 5-13, type: narration, entities: [event:siervo-del-oficial, person:jesus, place:capernaum], mentions: [person:abrahan, person:isaac, person:jacob], note: "El oficial romano y su siervo no tienen nombre. Israel en 8:10 es el pueblo, sin ficha."}
    - {v: 14-17, type: narration, entities: [event:curaciones-en-capernaum, person:jesus, person:pedro, person:suegra-de-pedro, relation:pedro/kin/suegra-de-pedro], mentions: [person:isaias], note: "Mateo presenta estas curaciones como cumplimiento de una profecía de Isaías."}
    - {v: 18, type: narration, entities: [event:calma-la-tormenta, person:jesus], note: "Jesús manda cruzar a la orilla oriental; el viaje sigue en 8:23."}
    - {v: 19-22, type: narration, entities: [event:dejarlo-todo-por-el-reino, person:jesus], note: "El escriba y el discípulo no tienen nombre. La tabla A7-E pone este diálogo en 32 e.c., camino de Jerusalén, no antes de la tormenta."}
    - {v: 23-27, type: narration, entities: [event:calma-la-tormenta, person:jesus, place:mar-de-galilea]}
    - {v: 28-34, type: narration, entities: [event:demonios-a-los-cerdos, person:jesus, place:gadara, place:mar-de-galilea], note: "Los dos endemoniados no tienen nombre. Perspicacia no nombra la ciudad de 8:33."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-8, type: narration, entities: [event:curacion-de-un-paralitico, person:jesus, place:capernaum, relation:jesus/lived_in/capernaum], mentions: [place:mar-de-galilea], note: "La nota de estudio identifica «su ciudad» con Capernaúm; el mar que cruza es el de Galilea. Los escribas lo acusan de blasfemar."}
    - {v: 9-17, type: narration, entities: [event:llamada-de-mateo, person:mateo, relation:mateo/lived_in/capernaum], mentions: [person:juan-el-bautista], note: "Comida en casa de Mateo con cobradores de impuestos y pecadores; cita de Os 6:6. Los discípulos de Juan preguntan por el ayuno: el novio, el parche y los odres."}
    - {v: 18-26, type: narration, entities: [event:hija-de-jairo, person:jairo], note: "Mateo no da el nombre del gobernante; la nota de estudio lo identifica con Jairo (Mr 5:22; Lu 8:41). La mujer con hemorragias queda sin nombre."}
    - {v: 27-34, type: narration, entities: [event:dos-ciegos-y-un-mudo], mentions: [person:david], note: "Los ciegos lo llaman Hijo de David, título del Mesías. «Israel» (v. 33) es el pueblo. Los fariseos culpan al gobernante de los demonios, sin nombrarlo."}
    - {v: 35-38, type: narration, entities: [event:tercera-gira-y-envio-de-los-doce], note: "Empieza la tercera gira por Galilea (A7-D). Jesús se compadece de la gente y pide rogar por más trabajadores para la cosecha."}
  10:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:tercera-gira-y-envio-de-los-doce, person:jesus], note: "Jesús reúne a los doce y les da autoridad sobre los espíritus malignos y para curar."}
    - {v: 2-4, type: list, entities: [person:pedro, person:andres, person:santiago-hijo-de-zebedeo, person:zebedeo, person:juan-apostol, person:felipe-apostol, person:bartolome, person:tomas, person:mateo, person:santiago-hijo-de-alfeo, person:alfeo-padre-de-santiago, person:tadeo, person:simon-el-cananita, person:judas-iscariote, relation:andres/kin/pedro, relation:santiago-hijo-de-zebedeo/kin/zebedeo, relation:santiago-hijo-de-zebedeo/kin/juan-apostol, relation:santiago-hijo-de-alfeo/kin/alfeo-padre-de-santiago, relation:pedro/disciple_of/jesus, relation:andres/disciple_of/jesus, relation:santiago-hijo-de-zebedeo/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus, relation:felipe-apostol/disciple_of/jesus, relation:bartolome/disciple_of/jesus, relation:bartolome/same_as/natanael, relation:tomas/disciple_of/jesus, relation:mateo/disciple_of/jesus, relation:santiago-hijo-de-alfeo/disciple_of/jesus, relation:tadeo/disciple_of/jesus, relation:simon-el-cananita/disciple_of/jesus, relation:judas-iscariote/disciple_of/jesus, relation:judas-iscariote/holds_office/-], note: "Lista de los doce. La nota de estudio ve en Bartolomé al Natanael de Juan, sin darlo por seguro; Tadeo es el Judas hijo de Santiago de Lucas."}
    - {v: 5-15, type: speech, mentions: [place:region-de-samaria, place:sodoma, place:gomorra], note: "Instrucciones: ir solo a Israel, no a las naciones ni a Samaria; predicar sin cobrar ni llevar provisiones; sacudirse el polvo donde no los reciban."}
    - {v: 16-23, type: speech, mentions: [place:israel], note: "Aviso de persecución: tribunales, sinagogas, gobernadores y reyes; el espíritu hablará por ellos. «Las ciudades de Israel» (v. 23) son las de la tierra de Israel."}
    - {v: 24-33, type: speech, mentions: [person:satanas, place:valle-de-hinon], note: "Si al amo lo llaman Belcebú, a los suyos también; la nota de estudio lo da como nombre de Satanás. La Gehena, el valle de Hinón, simboliza la destrucción eterna. No temer a los hombres."}
    - {v: 34-42, type: speech, note: "Jesús trae división aun en las familias; quien no lo pone primero no es digno de él. Recompensa para quien recibe a sus enviados."}
  11:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:tercera-gira-y-envio-de-los-doce, person:jesus], note: "Cierre del envío de los doce: Jesús parte a enseñar y predicar en otras ciudades, según la nota de estudio las de Galilea."}
    - {v: 2-6, type: narration, entities: [event:juan-envia-discipulos, person:jesus, person:juan-el-bautista], note: "Juan, preso, oye de las obras del Cristo y envía a sus discípulos a preguntarle si es el que había de venir. Jesús contesta señalando curaciones y resurrecciones."}
    - {v: 7-15, type: speech, entities: [event:juan-envia-discipulos, person:jesus, person:juan-el-bautista], mentions: [person:elias-profeta], note: "Ante la multitud, Jesús dice que Juan es más que profeta: el mensajero anunciado en Malaquías 3:1 y el Elías que tenía que venir. Elías solo se nombra."}
    - {v: 16-19, type: speech, entities: [event:juan-envia-discipulos, person:jesus, person:juan-el-bautista], note: "Aquella generación rechazó a Juan, que ayunaba y no bebía vino, y también al Hijo del Hombre, que comía con cobradores de impuestos. Los resultados dan la razón a la sabiduría."}
    - {v: 20-24, type: speech, entities: [event:juan-envia-discipulos, person:jesus, place:corazin, place:betsaida, place:capernaum], mentions: [place:tiro, place:sidon, place:sodoma], note: "Reproche a Corazín, Betsaida y Capernaúm, donde hizo casi todos sus milagros sin que se arrepintieran. Tiro, Sidón y Sodoma solo sirven de comparación."}
    - {v: 25-30, type: speech, entities: [event:juan-envia-discipulos, person:jesus], note: "En la misma ocasión Jesús alaba al Padre por revelar estas cosas a los humildes, dice que solo el Hijo lo da a conocer e invita a los agobiados a llevar su yugo."}
