    - {v: 7-11, type: genealogy, entities: [person:salomon, person:rehoboam, person:abias-de-juda, person:asa, person:jehosafat, person:jehoram-de-juda, person:uzias, person:jotan, person:acaz, person:ezequias, person:manases-de-juda, person:amon-de-juda, person:josias, person:joaquin, relation:rehoboam/kin/salomon, relation:abias-de-juda/kin/rehoboam, relation:asa/kin/abias-de-juda, relation:jehosafat/kin/asa, relation:jehoram-de-juda/kin/jehosafat, relation:uzias/kin/jehoram-de-juda, relation:jotan/kin/uzias, relation:acaz/kin/jotan, relation:ezequias/kin/acaz, relation:manases-de-juda/kin/ezequias, relation:amon-de-juda/kin/manases-de-juda, relation:josias/kin/amon-de-juda, relation:joaquin/kin/josias], mentions: [person:ocozias-de-juda, person:jehoas-de-juda, person:amasias, person:jehoiaquim, place:babilonia, event:daniel-llevado-a-babilonia], note: "Los reyes de Judá. Mateo salta a Ocozías, Jehoás y Amasías entre Jehoram y Uzías, y a Jehoiaquim entre Josías y Jeconías, que es Joaquín."}
    - {v: 12-16, type: genealogy, entities: [person:joaquin, person:sealtiel, person:zorobabel, person:abiud, person:eliaquim-hijo-de-abiud, person:azor, person:sadoc-hijo-de-azor, person:aquim, person:eliud, person:eleazar-hijo-de-eliud, person:mattan, person:jacob-hijo-de-mattan, person:jose-esposo-de-maria, person:maria-madre-de-jesus, person:jesus, relation:sealtiel/kin/joaquin, relation:sealtiel/born_in/babilonia, relation:zorobabel/kin/sealtiel, relation:zorobabel/kin/david, relation:abiud/kin/zorobabel, relation:eliaquim-hijo-de-abiud/kin/abiud, relation:azor/kin/eliaquim-hijo-de-abiud, relation:sadoc-hijo-de-azor/kin/azor, relation:aquim/kin/sadoc-hijo-de-azor, relation:eliud/kin/aquim, relation:eleazar-hijo-de-eliud/kin/eliud, relation:mattan/kin/eleazar-hijo-de-eliud, relation:jacob-hijo-de-mattan/kin/mattan, relation:jose-esposo-de-maria/kin/jacob-hijo-de-mattan, relation:jose-esposo-de-maria/kin/maria-madre-de-jesus, relation:jesus/kin/maria-madre-de-jesus, relation:jesus/kin/jose-esposo-de-maria], mentions: [place:babilonia], note: "Del destierro a Jesús. Mateo no dice que José engendrara a Jesús: solo que era esposo de María, de quien nació; la nota lo explica como padre adoptivo."}
    - {v: "17", type: genealogy, mentions: [person:abrahan, person:david, person:jesus, place:babilonia], note: "Mateo reparte la lista en tres grupos de catorce generaciones: hasta David, hasta la deportación a Babilonia y hasta el Cristo."}
    - {v: 18-25, type: narration, entities: [event:jose-lleva-a-maria-a-su-casa, event:nacimiento-de-jesus, person:jose-esposo-de-maria, person:maria-madre-de-jesus, person:jesus, relation:jose-esposo-de-maria/kin/maria-madre-de-jesus, relation:jose-esposo-de-maria/kin/david], mentions: [person:isaias], note: "La profecía citada es la de Is 7:14. Emmanuel es un título profético del Mesías, no otra persona. El ángel no tiene nombre en el texto."}
  2:
    status: complete
