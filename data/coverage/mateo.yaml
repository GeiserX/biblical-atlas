    - {v: 22-24, type: narration, entities: [event:pecado-sin-perdon, person:jesus], mentions: [person:david, person:satanas], note: "Cura a un endemoniado ciego y mudo, sin nombre. La gente pregunta si es el Hijo de David; los fariseos lo atribuyen a Belcebú, nombre que la nota aplica a Satanás."}
    - {v: 25-37, type: speech, entities: [event:pecado-sin-perdon, person:jesus], mentions: [person:satanas], note: "Un reino dividido no se sostiene, el hombre fuerte atado, la blasfemia contra el espíritu santo que no se perdona y el árbol que se conoce por su fruto. Satanás solo aparece en el argumento."}
    - {v: 38-42, type: narration, entities: [event:senal-de-jonas-en-galilea, person:jesus], mentions: [person:jonas-profeta, place:ninive, person:salomon], note: "Piden una señal y solo tendrán la de Jonás. La reina del sur es la de Sabá según la nota; no tiene nombre ni ficha. Jonás en Nínive y la visita a Salomón aún no son eventos."}
    - {v: 43-45, type: speech, entities: [event:senal-de-jonas-en-galilea, person:jesus], note: "El espíritu impuro que sale de alguien vuelve con otros siete peores: así acabará aquella generación malvada."}
    - {v: 46-50, type: narration, entities: [event:madre-y-hermanos-lo-visitan, person:jesus, person:maria-madre-de-jesus, relation:jesus/kin/maria-madre-de-jesus], note: "Su madre y sus hermanos esperan fuera. Jesús llama familia a quien hace la voluntad del Padre. Los hermanos no se nombran aquí (nota: ver Mt 13:55); el v. 47 falta en algunos manuscritos."}
