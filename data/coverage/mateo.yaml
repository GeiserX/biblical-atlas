    - {v: 13-33, type: speech, entities: [event:denuncia-a-escribas-y-fariseos, person:jesus], mentions: [place:monte-moria, place:valle-de-hinon], note: "Siete ayes contra escribas y fariseos; la TNM no incluye el v. 14. La Gehena, del hebreo «valle de Hinón», al sur de Jerusalén, es aquí símbolo de destrucción total (nota de Mt 5:22)."}
    - {v: 34-36, type: prophecy, entities: [event:denuncia-a-escribas-y-fariseos, person:jesus, person:zacarias-hijo-de-jehoiada, person:baraquias, relation:zacarias-hijo-de-jehoiada/kin/baraquias, relation:zacarias-hijo-de-jehoiada/died_in/monte-moria, place:monte-moria], mentions: [person:abel], note: "De Abel (Gé 4:8) a Zacarías (2Cr 24:20-22): del primer al último justo asesinado en las Escrituras Hebreas. Las dos muertes son sucesos de Génesis y de Crónicas; los crean esos libros."}
    - {v: 37-39, type: prophecy, entities: [event:denuncia-a-escribas-y-fariseos, event:destruccion-de-jerusalen-70, person:jesus, place:jerusalen], note: "Lamento por Jerusalén, que mata a los profetas. Su casa, el templo, quedará abandonada; se cumplió en 70. La nota del v. 37 lo fecha el 11 de nisán. Cita Sl 118:26."}
  24:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:senal-de-su-presencia, person:jesus, place:monte-moria, event:destruccion-de-jerusalen-70], note: "Jesús sale del templo y anuncia que será demolido del todo. La nota de estudio lo da por cumplido cuando Roma arrasó Jerusalén en 70 e.c."}
    - {v: "3", type: narration, entities: [event:senal-de-su-presencia, person:jesus, place:monte-de-los-olivos], note: "Jesús se ha sentado en el monte de los Olivos y cuatro discípulos le piden aparte la señal. Mr 13:3 y la nota de estudio dicen quiénes eran: Pedro, Santiago, Juan y Andrés."}
    - {v: 4-14, type: prophecy, note: "Rasgos de la señal: falsos cristos, guerras, hambres, terremotos, persecución, falsos profetas, amor enfriado y la predicación del Reino por todo el mundo antes del fin."}
    - {v: 15-22, type: prophecy, entities: [place:judea, event:revuelta-judia-66, event:destruccion-de-jerusalen-70], mentions: [person:daniel], note: "La cosa repugnante de la que habló Daniel, en un lugar santo, es el aviso para huir de Judea a las montañas. Las notas lo ven cumplido en el cerco romano de 66 y la destrucción de 70."}
    - {v: 23-28, type: prophecy, note: "Aviso contra falsos cristos y falsos profetas. La presencia del Hijo del Hombre se verá como el relámpago que cruza el cielo de este a oeste."}
    - {v: 29-31, type: prophecy, note: "Tras la tribulación, señales en el sol, la luna y las estrellas; aparece la señal del Hijo del Hombre y sus ángeles juntan a los escogidos de todas partes."}
    - {v: 32-35, type: speech, note: "Comparación de la higuera: al ver todo esto sabrán que él está cerca. Esa generación verá que se cumple y sus palabras no fallarán."}
    - {v: 36-44, type: speech, mentions: [person:noe, event:diluvio], note: "Nadie más que el Padre sabe el día y la hora. Su presencia se parecerá a los días de Noé antes del Diluvio, así que hay que vigilar."}
    - {v: 45-51, type: speech, note: "Comparación del esclavo fiel y prudente que da el alimento a los domésticos a su tiempo, y aviso de lo que sufriría si se volviera malo. Sus personajes no son personas del atlas."}
  25:
