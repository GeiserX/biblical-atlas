    - {v: 31-46, type: prophecy, entities: [person:jesus], mentions: [person:satanas], note: "El Hijo del Hombre, sentado en su trono, separa a las naciones como ovejas y cabras según cómo trataron a sus hermanos. Nombra al Diablo y sus ángeles, que aquí no actúan."}
