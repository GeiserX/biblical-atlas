    - {v: 20-28, type: narration, entities: [event:mardoqueo-instituye-la-fiesta-de-purim, person:mardoqueo, person:haman, person:hamedata, relation:haman/kin/hamedata], mentions: [person:jerjes-i, person:ester, event:decreto-de-haman, event:ester-desenmascara-a-haman], note: "Los versículos 24 y 25 recuerdan el pur de Hamán, la intervención de Ester y la ejecución de Hamán y de sus hijos."}
