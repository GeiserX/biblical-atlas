    - {v: 11-14, type: narration, entities: [event:ester-pide-un-segundo-dia-en-susa, person:ester, person:jerjes-i, place:susa], mentions: [person:haman], note: "Los diez hijos de Hamán no se nombran de nuevo; son los de Est 9:7-10."}
