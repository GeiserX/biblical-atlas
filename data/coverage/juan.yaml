# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: juan
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: narration, entities: [person:jesus], note: "Prólogo. La Palabra, título que la nota da a Jesús antes de hacerse hombre, estaba con Dios desde el principio, y por medio de ella llegaron a existir todas las cosas."}
    - {v: 6-8, type: narration, entities: [event:juan-comienza-su-ministerio, person:juan-el-bautista], note: "Dios envía a Juan como testigo de la luz. La tabla A7-A pone estos versículos en el comienzo de su ministerio."}
    - {v: 9-18, type: narration, entities: [event:nacimiento-de-jesus, event:primeros-discipulos, person:jesus, person:juan-el-bautista], mentions: [person:moises], note: "La Palabra se hace carne: A7-A pone el v. 14 en el nacimiento de Jesús, y A7-B el testimonio de Juan del v. 15 con los primeros discípulos. La Ley llegó por Moisés; la bondad inmerecida, por Jesucristo."}
    - {v: 19-28, type: narration, entities: [event:juan-niega-ser-el-cristo, person:juan-el-bautista, place:betania-del-otro-lado-del-jordan, journey:del-jordan-a-cana, journey:ministerio-de-juan-el-bautista], mentions: [place:jerusalen, place:rio-jordan, person:elias-profeta, person:isaias], note: "Los enviados venían de los fariseos. El Profeta es el que anunció Moisés, según la nota del v. 21. No es la Betania de Lázaro, y su sitio no se conoce."}
    - {v: 29-34, type: narration, entities: [event:primeros-discipulos, person:jesus, person:juan-el-bautista], mentions: [event:bautismo-de-jesus], note: "Al día siguiente, de vuelta del desierto, Jesús se acerca y Juan lo llama Cordero de Dios. Cuenta que en el bautismo vio bajar el espíritu sobre él."}
    - {v: 35-42, type: narration, entities: [event:primeros-discipulos, person:jesus, person:juan-el-bautista, person:andres, person:juan-apostol, person:pedro, person:jonas-padre-de-pedro, relation:andres/disciple_of/juan-el-bautista, relation:juan-apostol/disciple_of/juan-el-bautista, relation:andres/disciple_of/jesus, relation:andres/kin/pedro, relation:pedro/kin/jonas-padre-de-pedro, relation:pedro/disciple_of/jesus], note: "El discípulo sin nombre sería el apóstol Juan (nota del v. 40). La hora décima son las cuatro de la tarde. Al padre de Simón se le llama aquí Juan; en Mt 16:17, Jonás."}
    - {v: 43-51, type: narration, entities: [event:primeros-discipulos, person:jesus, person:felipe-apostol, person:natanael, place:betsaida, relation:felipe-apostol/disciple_of/jesus, relation:felipe-apostol/lived_in/betsaida, relation:andres/born_in/betsaida, relation:pedro/lived_in/betsaida, relation:felipe-apostol/tie/natanael, relation:natanael/disciple_of/jesus, relation:jesus/kin/jose-esposo-de-maria, relation:jesus/lived_in/nazaret], mentions: [person:andres, person:pedro, person:moises, person:jose-esposo-de-maria, place:galilea, place:nazaret, relation:pedro/lived_in/capernaum], note: "Natanael sería Bartolomé, pero jw.org solo lo da como probable: aquí va natanael. Israel es el pueblo. La escalera de ángeles del v. 51 recuerda el sueño de Jacob (nota)."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-11, type: narration, entities: [event:boda-en-cana, person:jesus, person:maria-madre-de-jesus, person:natanael, place:cana, relation:jesus/kin/maria-madre-de-jesus, journey:del-jordan-a-cana], mentions: [place:galilea, person:juan-apostol], note: "Jn 2:2 no nombra a los discípulos: la nota de 1:50 pone a Natanael en la boda, y Perspicacia supone allí a Juan, cosa que el relato no dice. Cada vasija llevaba 44 a 66 litros (nota del v. 6)."}
    - {v: "12", type: narration, entities: [event:boda-en-cana, person:jesus, person:maria-madre-de-jesus, place:capernaum, journey:pascua-de-30-y-judea], mentions: [person:santiago-hermano-de-jesus, person:jose-hijo-de-jose, person:simon-hijo-de-jose, person:judas-hermano-de-jesus], note: "Jesús va a Capernaúm acompañado de María, de sus hermanos y de los discípulos, y la estancia es corta. El texto no da los nombres de los hermanos."}
    - {v: 13-22, type: narration, entities: [event:primera-limpieza-del-templo, person:jesus, place:jerusalen, place:monte-moria], note: "Primera Pascua del ministerio, en 30. Los 46 años son la obra con la que Herodes rehízo el templo, según la nota del v. 20. Jesús habla de su cuerpo."}
    - {v: 23-25, type: narration, entities: [event:primera-limpieza-del-templo, person:jesus, place:jerusalen], note: "Durante la fiesta muchos creen en él por sus señales, pero Jesús no se fía de ellos, porque sabe lo que hay dentro de cada persona."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: narration, entities: [event:conversacion-con-nicodemo, person:nicodemo, person:jesus, journey:pascua-de-30-y-judea], note: "Nicodemo, fariseo y gobernante de los judíos, visita a Jesús de noche. Jesús le dice que sin nacer de nuevo, del agua y del espíritu, nadie entra en el Reino de Dios."}
    - {v: 11-21, type: speech, mentions: [person:moises, event:moises-hace-la-serpiente-de-cobre], note: "Jesús sigue con Nicodemo: el Hijo del Hombre será alzado como la serpiente que Moisés alzó en el desierto (Nú 21:8, 9). Dios dio a su Hijo unigénito por amor al mundo."}
    - {v: 22-24, type: narration, entities: [event:ultimo-testimonio-de-juan, person:jesus, person:juan-el-bautista, place:judea, place:enon, place:salim, journey:ministerio-de-juan-el-bautista], mentions: [event:encarcelamiento-de-juan], note: "Jesús pasa un tiempo en el campo de Judea y sus discípulos bautizan (Jn 4:2). Juan bautiza en Enón, cerca de Salim, porque hay mucha agua; aún no estaba preso."}
    - {v: 25-30, type: narration, entities: [person:juan-el-bautista], mentions: [place:rio-jordan, place:betania-del-otro-lado-del-jordan, event:primeros-discipulos], note: "Tras una discusión sobre la purificación, sus discípulos le dicen que todos se van con Jesús. Juan se compara con el amigo del novio: Jesús tiene que crecer y él menguar."}
    - {v: 31-36, type: speech, note: "Según la nota de Jn 3:31, estas palabras parecen del escritor, el apóstol Juan: quien viene del cielo está sobre todos, y quien pone fe en el Hijo tiene vida eterna."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:encarcelamiento-de-juan, person:jesus, place:judea, place:galilea, journey:de-judea-a-galilea-por-samaria], mentions: [person:juan-el-bautista], note: "Los fariseos oyen que Jesús hace más discípulos que Juan, aunque quienes bautizan son sus discípulos y no él. Jesús deja Judea y vuelve a Galilea."}
    - {v: 4-6, type: narration, entities: [event:jesus-en-sicar, place:region-de-samaria, place:sicar, person:jacob, person:jose-hijo-de-jacob, relation:jose-hijo-de-jacob/kin/jacob], note: "Camino de Galilea cruza Samaria. Cansado, se sienta hacia el mediodía junto al pozo de Jacob, cerca de Sicar y del campo que Jacob había dado a su hijo José."}
    - {v: 7-26, type: narration, entities: [person:jesus, person:jacob, place:monte-guerizim], mentions: [place:jerusalen], note: "Jesús pide agua a una samaritana sin nombre y le ofrece agua viva. Ella dice que Jacob les dio el pozo y que sus antepasados adoraban en Guerizim; Jesús le dice que él es el Mesías."}
    - {v: 27-38, type: narration, note: "Vuelven los discípulos, extrañados de verlo hablar con una mujer, y ella corre a avisar a la ciudad. Jesús dice que su alimento es hacer la voluntad de Dios; por la nota del v. 35, era kislev."}
    - {v: 39-43, type: narration, entities: [place:sicar], note: "Por lo que cuenta la mujer, muchos samaritanos de Sicar creen. Jesús se queda dos días, más gente cree y lo llama salvador del mundo. Después sigue hacia Galilea."}
    - {v: 44-45, type: narration, entities: [event:anuncio-del-reino-en-galilea, place:galilea], mentions: [place:jerusalen, event:primera-limpieza-del-templo], note: "Los galileos lo reciben bien porque vieron lo que hizo en Jerusalén en la Pascua. La nota del v. 44 entiende aquí «su propia tierra» como toda Galilea."}
    - {v: 46-54, type: narration, entities: [event:hijo-del-funcionario-y-sinagoga-de-nazaret, person:jesus, place:cana, place:capernaum], mentions: [person:herodes-antipas, event:boda-en-cana, place:judea, place:galilea], note: "En Caná, un funcionario del rey, de la corte de Herodes Antipas según la nota del v. 46, le ruega por su hijo enfermo en Capernaúm. Jesús lo cura a distancia: segundo milagro en Galilea."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: narration, entities: [event:curacion-en-betzata, person:jesus, place:jerusalen, place:estanque-de-betzata, journey:judea-y-pascua-de-31], note: "La fiesta sin nombre es, según la nota de 5:1, la Pascua de 31. El estanque está junto a la Puerta de las Ovejas, que va en los nombres de Jerusalén. La TNM no incluye el v. 4."}
    - {v: 10-13, type: narration, entities: [event:curacion-en-betzata, person:jesus], note: "Unos judíos, al parecer líderes religiosos (nota de 5:10), reprochan al curado que cargue la camilla en sábado. Él no sabe quién lo curó, porque Jesús se había perdido entre la gente."}
    - {v: 14-18, type: narration, entities: [event:curacion-en-betzata, person:jesus, place:monte-moria], note: "Jesús encuentra al hombre en el templo y le pide que no peque más. Los judíos persiguen a Jesús por curar en sábado y por llamar a Dios su Padre, y buscan matarlo."}
    - {v: 19-30, type: speech, entities: [event:curacion-en-betzata, person:jesus], note: "El Hijo no actúa por su cuenta: hace lo que ve hacer al Padre, que le ha dado autoridad para juzgar y dar vida. Anuncia que los muertos resucitarán, unos para vida y otros para juicio."}
    - {v: 31-38, type: speech, entities: [event:curacion-en-betzata, person:jesus], mentions: [person:juan-el-bautista, event:juan-niega-ser-el-cristo], note: "Dan testimonio de él Juan, al que los judíos enviaron mensajeros (Jn 1:19), sus propias obras y el Padre que lo envió. Juan había sido como una lámpara encendida."}
    - {v: 39-47, type: speech, entities: [event:curacion-en-betzata, person:jesus], mentions: [person:moises], note: "Las Escrituras que estudian hablan de él, pero no quieren ir a él. No los acusará Jesús ante el Padre, sino Moisés, en quien confían, porque Moisés escribió sobre él."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: narration, entities: [event:alimenta-a-5000, person:jesus, place:mar-de-galilea, journey:retiro-a-betsaida], note: "Juan llama al lago mar de Galilea y también de Tiberíades, por la ciudad de su orilla oeste. La montaña no tiene nombre. La Pascua cercana es la de 32 (nota de 6:4)."}
    - {v: 5-13, type: narration, entities: [event:alimenta-a-5000, person:jesus, person:felipe-apostol, person:andres, relation:andres/kin/pedro, relation:andres/disciple_of/jesus, relation:felipe-apostol/disciple_of/jesus], mentions: [person:pedro], note: "Jesús pone a prueba a Felipe preguntándole dónde comprar pan; 200 denarios no bastarían. Andrés, hermano de Simón Pedro, señala a un niño sin nombre con cinco panes de cebada y dos pescados. Sobran 12 canastas."}
    - {v: 14-15, type: narration, entities: [event:camina-sobre-el-mar, person:jesus], note: "Al ver el milagro lo llaman el Profeta esperado (nota de 6:14) y quieren hacerlo rey por la fuerza. Jesús se retira solo a la montaña. Solo Juan lo cuenta."}
    - {v: 16-21, type: narration, entities: [event:camina-sobre-el-mar, person:jesus, place:mar-de-galilea], mentions: [place:capernaum], note: "De noche los discípulos cruzan hacia Capernaúm con viento fuerte. Tras remar 25 o 30 estadios, hacia la mitad del lago según la nota de 6:19, ven a Jesús andando sobre el agua."}
    - {v: 22-25, type: narration, entities: [event:pan-de-la-vida, person:jesus, place:tiberiades, place:capernaum, place:mar-de-galilea], note: "Al día siguiente la gente ve que no hay barca. Llegan barcas de Tiberíades, la única vez que la Biblia nombra la ciudad (nota de 6:23), y cruzan a Capernaúm a buscar a Jesús."}
    - {v: 26-40, type: speech, entities: [event:pan-de-la-vida, person:jesus], mentions: [person:moises, event:codornices-y-mana-en-el-desierto-de-sin], note: "Lo buscan por el pan. Piden una señal y recuerdan el maná del desierto; Jesús responde que no lo dio Moisés, que el Padre da el verdadero pan del cielo y que él es el pan de la vida."}
    - {v: 41-51, type: speech, entities: [event:pan-de-la-vida, person:jesus, relation:jesus/kin/jose-esposo-de-maria, relation:jesus/kin/maria-madre-de-jesus], mentions: [person:jose-esposo-de-maria, event:codornices-y-mana-en-el-desierto-de-sin], note: "Los judíos murmuran: lo tienen por hijo de José y conocen a su madre. Jesús dice que solo va a él quien el Padre atrae, cita Is 54:13 y anuncia que el pan que dará es su carne."}
    - {v: 52-59, type: speech, entities: [event:pan-de-la-vida, person:jesus, place:capernaum], note: "Discuten cómo puede darles su carne. Comer su carne y beber su sangre es tener fe en él (nota de 6:54). Todo esto lo enseña en una sinagoga de Capernaúm."}
    - {v: 60-65, type: narration, entities: [event:pan-de-la-vida, person:jesus], note: "A muchos discípulos les ofende el discurso. Jesús dice que el espíritu es lo que da vida y que algunos no creen; ya sabía quién lo iba a traicionar."}
    - {v: 66-71, type: narration, entities: [event:pan-de-la-vida, person:jesus, person:pedro, person:judas-iscariote, person:simon-iscariote, relation:pedro/disciple_of/jesus, relation:judas-iscariote/disciple_of/jesus, relation:judas-iscariote/kin/simon-iscariote], note: "Muchos lo dejan. Simón Pedro responde por los Doce que solo Jesús tiene palabras de vida eterna. Jesús dice que uno de ellos es calumniador: Judas, hijo de Simón Iscariote."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:tradiciones-humanas, person:jesus, place:galilea, place:judea, relation:jesus/lived_in/galilea, journey:subida-a-la-fiesta-de-los-tabernaculos], note: "Jesús sigue por Galilea y evita Judea, donde querían matarlo desde la curación en sábado (Jn 5:18). La tabla A7-D une este versículo a la denuncia de las tradiciones."}
    - {v: 2-10, type: narration, entities: [event:sus-hermanos-lo-animan-a-ir-a-judea, event:dejarlo-todo-por-el-reino, person:jesus, person:santiago-hermano-de-jesus, person:simon-hijo-de-jose, person:jose-hijo-de-jose, person:judas-hermano-de-jesus, place:galilea, relation:jesus/kin/santiago-hermano-de-jesus, relation:jesus/kin/simon-hijo-de-jose, relation:jesus/kin/jose-hijo-de-jose, relation:jesus/kin/judas-hermano-de-jesus], mentions: [place:judea], note: "Juan no da los nombres de los hermanos; el libro jy (cap. 65) dice que eran Santiago, Simón, José y Judas. Ellos suben a la fiesta y Jesús va después, sin dejarse ver."}
    - {v: 11-13, type: narration, entities: [event:fiesta-de-los-tabernaculos-32, person:jesus], note: "En la fiesta lo buscan. La gente murmura: para unos es bueno y para otros un embaucador, pero nadie habla en público por miedo a los dirigentes judíos, que según la nota son aquí los judíos."}
    - {v: 14-24, type: speech, entities: [event:fiesta-de-los-tabernaculos-32, person:jesus, place:monte-moria], mentions: [person:moises, event:curacion-en-betzata], note: "A mitad de la fiesta enseña en el templo. Se admiran de su saber sin escuelas rabínicas. Defiende la curación en sábado de Jn 5 con la circuncisión, que se hace aunque el octavo día sea sábado."}
    - {v: 25-31, type: narration, entities: [event:fiesta-de-los-tabernaculos-32, person:jesus, place:jerusalen], note: "Vecinos de Jerusalén se preguntan si los gobernantes, el Sanedrín según la nota, lo tienen ya por el Cristo. Intentan prenderlo, pero no llega su hora; muchos creen por sus señales."}
    - {v: 32-36, type: narration, entities: [event:fiesta-de-los-tabernaculos-32, person:jesus], note: "Fariseos y sacerdotes principales envían guardias, policía religiosa del templo según la nota. Jesús dice que irá adonde no podrán encontrarlo, y ellos piensan en los judíos dispersos entre los griegos."}
    - {v: 37-44, type: speech, entities: [event:invita-a-los-sedientos-a-beber, person:jesus, place:monte-moria, place:jerusalen, relation:david/born_in/belen], mentions: [person:david, place:belen, place:galilea], note: "Promete ríos de agua viva, que Juan explica como el espíritu. Unos lo llaman el Profeta o el Cristo; otros objetan que viene de Galilea y no de Belén, la aldea de David."}
    - {v: 45-52, type: narration, entities: [event:nicodemo-defiende-a-jesus, person:nicodemo], mentions: [event:conversacion-con-nicodemo, place:galilea], note: "Nicodemo es el que había visitado a Jesús de noche (Jn 3). Los fariseos le replican que de Galilea no sale profeta; la nota recuerda a Jonás, de la galilea Gat-héfer."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    note: "La TNM no incluye Jn 7:53-8:11 (la mujer adúltera): la nota explica que falta en los manuscritos más antiguos."
    spans:
    - {v: 12-20, type: speech, entities: [event:luz-del-mundo-y-ciego-de-nacimiento, person:jesus, place:monte-moria], note: "Se llama luz del mundo; la nota lo liga a los candelabros del Patio de las Mujeres. Habla junto a las arcas del tesoro, que jy (cap. 68) sitúa allí el último día de la fiesta."}
    - {v: 21-30, type: speech, entities: [event:luz-del-mundo-y-ciego-de-nacimiento, person:jesus], note: "Anuncia que se va y que morirán en sus pecados si no creen quién es. Lo entenderán cuando lo hayan alzado, es decir, ejecutado en un madero según la nota. Muchos creen en él."}
    - {v: 31-47, type: speech, entities: [event:luz-del-mundo-y-ciego-de-nacimiento, person:jesus, person:satanas], mentions: [person:abrahan], note: "La verdad libra del pecado. Ellos alegan ser linaje de Abrahán; Jesús les dice que obran como su padre, el Diablo, homicida desde el principio y mentiroso."}
    - {v: 48-59, type: narration, entities: [event:luz-del-mundo-y-ciego-de-nacimiento, person:jesus, place:monte-moria], mentions: [person:abrahan], note: "Lo tachan de samaritano y endemoniado. Dice que Abrahán se alegró de ver su día y que él ya vivía antes que Abrahán, en el cielo según la nota. Toman piedras; él se esconde y sale del templo."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-7, type: narration, entities: [event:sana-al-ciego-de-nacimiento, person:jesus, place:jerusalen, place:estanque-de-siloam, find:estanque-de-siloam-del-siglo-i], mentions: [event:luz-del-mundo-y-ciego-de-nacimiento], note: "Un sábado, todavía en Jerusalén (jy cap. 70), Jesús unta con barro de saliva los ojos de un ciego de nacimiento y lo manda a Siloam, nombre que Juan traduce «enviado». Al lavarse, ve."}
    - {v: 8-12, type: narration, entities: [event:sana-al-ciego-de-nacimiento, person:jesus, place:estanque-de-siloam], note: "Los vecinos dudan de que sea el mendigo de siempre. Él cuenta que lo curó un hombre llamado Jesús, pero no sabe dónde está."}
    - {v: 13-17, type: narration, entities: [event:sana-al-ciego-de-nacimiento, person:jesus], note: "Ante los fariseos: como era sábado, unos niegan que Jesús venga de Dios y otros preguntan cómo un pecador haría esas señales. El hombre lo llama profeta."}
    - {v: 18-23, type: narration, entities: [event:sana-al-ciego-de-nacimiento], note: "Los líderes llaman a los padres, que no tienen nombre. Temen la expulsión de la sinagoga, acordada contra quien reconociera a Jesús como Cristo, y remiten a su hijo, ya mayor de edad."}
    - {v: 24-34, type: narration, entities: [event:sana-al-ciego-de-nacimiento], mentions: [person:moises], note: "Segundo interrogatorio. Ellos se declaran discípulos de Moisés y llaman pecador a Jesús; el hombre responde que jamás se supo de nadie que curara a un ciego de nacimiento. Lo expulsan."}
    - {v: 35-41, type: narration, entities: [event:sana-al-ciego-de-nacimiento, person:jesus], note: "Jesús lo encuentra y se le da a conocer como el Hijo del Hombre; el hombre cree y se inclina ante él. A los fariseos les dice que su pecado sigue porque afirman ver."}
  10:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: speech, entities: [event:fiesta-de-la-dedicacion-32, person:jesus, journey:de-los-tabernaculos-a-la-dedicacion], note: "Comparación del redil: el pastor entra por la puerta, el portero le abre y las ovejas siguen su voz y huyen del extraño. No lo entienden. A7-E pone 10:1-39 en la Dedicación; jy cap. 80 dice solo Judea."}
    - {v: 7-18, type: speech, entities: [event:fiesta-de-la-dedicacion-32, person:jesus], note: "Jesús es la puerta de las ovejas y el pastor excelente que da su vida por ellas, al revés que el asalariado que huye del lobo. Traerá otras ovejas de otro redil: un solo rebaño."}
    - {v: 19-21, type: narration, entities: [event:fiesta-de-la-dedicacion-32, person:jesus], mentions: [event:sana-al-ciego-de-nacimiento], note: "Nueva división entre los judíos: unos dicen que tiene un demonio; otros responden que un endemoniado no devuelve la vista a los ciegos, en referencia a la curación del capítulo 9."}
    - {v: 22-30, type: narration, entities: [event:fiesta-de-la-dedicacion-32, person:jesus, place:jerusalen, place:monte-moria], mentions: [event:dedicacion-del-templo-165, person:salomon], note: "Dedicación del invierno de 32, que empezaba el 25 de kislev (nota de 10:22). Jesús camina por el Pórtico de Salomón, en el lado este del templo. Nadie le quitará sus ovejas; él y el Padre son uno."}
    - {v: 31-39, type: narration, entities: [event:fiesta-de-la-dedicacion-32, person:jesus], note: "Cogen piedras y lo acusan de blasfemia. Él cita Sl 82:6, que llama dioses a jueces humanos, y apela a las obras de su Padre. Quieren prenderlo y se les escapa."}
    - {v: 40-42, type: narration, entities: [event:va-a-betania-del-otro-lado-del-jordan, person:jesus, person:juan-el-bautista, place:betania-del-otro-lado-del-jordan, journey:ministerio-de-juan-el-bautista, journey:por-perea-hasta-efrain], mentions: [place:rio-jordan], note: "Se queda al otro lado del Jordán, donde Juan bautizaba al principio; A7-F lo llama Betania. La gente admite que Juan, ya muerto, no hizo señales pero dijo la verdad de Jesús. Muchos creen."}
  11:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-16, type: narration, entities: [event:resurreccion-de-lazaro, person:jesus, person:lazaro, person:maria-de-betania, person:marta, person:tomas, place:betania, relation:lazaro/kin/maria-de-betania, relation:lazaro/kin/marta, relation:lazaro/lived_in/betania, relation:lazaro/tie/jesus, relation:maria-de-betania/kin/marta, relation:maria-de-betania/lived_in/betania, relation:maria-de-betania/tie/jesus, relation:marta/lived_in/betania, relation:marta/tie/jesus, relation:tomas/disciple_of/jesus, journey:por-perea-hasta-efrain], mentions: [place:judea, place:betania-del-otro-lado-del-jordan, event:va-a-betania-del-otro-lado-del-jordan, event:maria-unge-a-jesus, event:fiesta-de-la-dedicacion-32], note: "Las hermanas avisan a Jesús, que sigue al otro lado del Jordán (la nota del v. 17 remite a Jn 10:40). Espera dos días; Tomás anima a los demás a ir con él a Judea aunque mueran."}
    - {v: 17-37, type: narration, entities: [event:resurreccion-de-lazaro, person:jesus, person:lazaro, person:marta, person:maria-de-betania, place:betania], mentions: [place:jerusalen, event:sana-al-ciego-de-nacimiento], note: "Lázaro lleva cuatro días enterrado. Marta sale al encuentro de Jesús y confiesa su fe en la resurrección; María llora a sus pies y a Jesús se le saltan las lágrimas. Betania dista unos 3 km de Jerusalén."}
    - {v: 38-46, type: narration, entities: [event:resurreccion-de-lazaro, person:jesus, person:lazaro, person:marta, place:betania], note: "Ante la cueva cerrada con una piedra, Jesús ora en voz alta y llama a Lázaro, que sale con vendas en pies y manos. Muchos creen; otros van a contárselo a los fariseos."}
    - {v: 47-53, type: narration, entities: [event:complot-y-retiro-a-efrain, person:caifas, person:jesus, period:sumo-sacerdocio-de-caifas, place:jerusalen], mentions: [period:potencia-romana], note: "El Sanedrín teme que los romanos le quiten el lugar santo y la nación. Caifás, sumo sacerdote en 33 según la nota del v. 49, anuncia sin saberlo que Jesús morirá por la nación."}
    - {v: "54", type: narration, entities: [event:complot-y-retiro-a-efrain, person:jesus, place:efrain, journey:ultima-subida-a-jerusalen], note: "Jesús deja de mostrarse en público y se queda con sus discípulos en Efraín, junto al desierto. La nota la pone en et-Taiyiba, al este-nordeste de Betel."}
    - {v: 55-57, type: narration, entities: [event:llegada-a-betania-8-de-nisan, person:jesus, place:jerusalen], mentions: [place:monte-moria], note: "Se acerca la Pascua del 33, la cuarta que cita Juan (nota del v. 55). Muchos suben antes para purificarse y buscan a Jesús en el templo; los jefes ordenan avisar si alguien sabe dónde está."}
  12:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:llegada-a-betania-8-de-nisan, person:jesus, person:lazaro, place:betania, relation:lazaro/lived_in/betania, journey:ultima-semana, journey:ultima-subida-a-jerusalen], mentions: [event:resurreccion-de-lazaro], note: "Jesús llega a Betania cuando faltan seis días para la Pascua, hacia la puesta del sol con que empieza el sábado 8 de nisán (nota del v. 1 y apéndice B12)."}
    - {v: 2-8, type: narration, entities: [event:maria-unge-a-jesus, person:jesus, person:marta, person:lazaro, person:maria-de-betania, person:judas-iscariote, relation:judas-iscariote/disciple_of/jesus], mentions: [person:simon-el-leproso], note: "Ya 9 de nisán, cenan en casa de Simón el leproso, que Juan no nombra (nota del v. 2). Marta sirve; María unge los pies de Jesús con nardo puro. Protesta Judas, que robaba de la caja."}
    - {v: 9-11, type: narration, entities: [event:maria-unge-a-jesus, person:jesus, person:lazaro, place:betania], mentions: [event:resurreccion-de-lazaro], note: "Muchos judíos van a Betania a ver a Jesús y también a Lázaro resucitado. Como por él muchos creen, los sacerdotes principales planean matarlo a él también."}
    - {v: 12-19, type: narration, entities: [event:entrada-triunfal-en-jerusalen, person:jesus, place:jerusalen], mentions: [person:lazaro, event:resurreccion-de-lazaro, person:zacarias-profeta], note: "La mañana del 9 de nisán (nota del v. 12) salen con hojas de palmera a recibirlo. Monta un burrito, como anunció Zac 9:9 a la hija de Sion; quienes vieron resucitar a Lázaro lo cuentan."}
    - {v: 20-36, type: narration, entities: [event:jehova-habla-desde-el-cielo, person:jesus, person:felipe-apostol, person:andres, place:betsaida, relation:felipe-apostol/lived_in/betsaida], mentions: [place:galilea, person:satanas], note: "Unos griegos prosélitos piden a Felipe ver a Jesús. Él habla del grano que muere y da fruto, y una voz del cielo le responde. La nota del v. 31 identifica al gobernante del mundo con Satanás."}
    - {v: 37-43, type: narration, entities: [event:jehova-habla-desde-el-cielo], mentions: [person:isaias], note: "Pese a tantos milagros no creen, como anunció Isaías (Is 53:1; 6:10). Algunos gobernantes creen, pero lo callan por miedo a que los fariseos los expulsen de la sinagoga."}
    - {v: 44-50, type: speech, entities: [event:jehova-habla-desde-el-cielo, person:jesus], note: "Jesús proclama que creer en él es creer en quien lo envió, y que sus palabras juzgarán en el último día a quien las rechace."}
  13:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-11, type: narration, entities: [event:lava-los-pies-a-los-apostoles, person:jesus, person:pedro, person:judas-iscariote, person:simon-iscariote, relation:judas-iscariote/kin/simon-iscariote, relation:pedro/disciple_of/jesus, journey:ultima-semana], mentions: [event:ultima-pascua, event:judas-acuerda-la-traicion, person:satanas], note: "En plena cena de la Pascua del 33, Jesús se ciñe una toalla y lava los pies a los discípulos, Judas incluido, en quien el Diablo ya había puesto la traición. Pedro se niega y luego pide más."}
    - {v: 12-20, type: speech, entities: [event:lava-los-pies-a-los-apostoles, person:jesus], note: "Explica el gesto: si el Señor y Maestro les lavó los pies, ellos deben servirse igual. Aplica a quien lo traicionará el Sl 41:9, sobre el que comía de su pan."}
    - {v: 21-30, type: narration, entities: [event:despide-a-judas, person:jesus, person:judas-iscariote, person:pedro, person:juan-apostol, person:satanas, relation:judas-iscariote/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus], mentions: [person:simon-iscariote], note: "El discípulo al que Jesús amaba, Juan según Perspicacia, pregunta por el traidor a una seña de Pedro. Jesús moja un trozo de pan y se lo da a Judas; entra Satanás en él y sale de noche."}
    - {v: 31-35, type: speech, entities: [event:predice-las-negaciones-de-pedro, person:jesus], note: "Ya sin Judas, habla de su glorificación, avisa de que se va adonde ellos no pueden ir y da un mandamiento nuevo: amarse como él los amó. La nota dice que lo nuevo es esa medida."}
    - {v: 36-38, type: narration, entities: [event:predice-las-negaciones-de-pedro, person:pedro, person:jesus], note: "Pedro quiere seguirlo ya y promete dar la vida por él. Jesús le anuncia que antes del canto del gallo habrá negado tres veces conocerlo."}
  14:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: speech, entities: [event:ultimo-discurso-y-oracion, person:jesus, journey:ultima-semana], note: "Jesús les pide que no se angustien: en la casa de su Padre hay muchos lugares donde vivir, va a prepararles uno y volverá por ellos. La nota sitúa esa casa en el cielo."}
    - {v: 5-7, type: speech, entities: [event:ultimo-discurso-y-oracion, person:tomas, relation:tomas/disciple_of/jesus], note: "Tomás dice que no conocen el camino. Jesús responde que él es el camino, la verdad y la vida, y que nadie llega al Padre sin pasar por él."}
    - {v: 8-14, type: speech, entities: [event:ultimo-discurso-y-oracion, person:felipe-apostol, relation:felipe-apostol/disciple_of/jesus], note: "Felipe pide ver al Padre; Jesús contesta que quien lo ve a él ve al Padre. Sus discípulos harán obras mayores y él hará lo que pidan en su nombre."}
    - {v: 15-21, type: speech, entities: [event:ultimo-discurso-y-oracion, person:jesus], note: "Promete que el Padre les dará otro ayudante, el espíritu de la verdad, y que no los dejará solos. La nota explica que el espíritu es una fuerza personificada, no una persona."}
    - {v: 22-24, type: speech, entities: [event:ultimo-discurso-y-oracion, person:tadeo, relation:tadeo/disciple_of/jesus], note: "Judas, no el Iscariote, pregunta por qué se mostrará a ellos y no al mundo; la nota lo identifica con Tadeo. Jesús responde que su Padre y él vivirán con quien lo ame."}
    - {v: 25-31, type: speech, entities: [event:ultimo-discurso-y-oracion, person:jesus], mentions: [person:satanas], note: "El espíritu santo les enseñará y les hará recordar. Les deja su paz, dice que el Padre es mayor que él y que viene el gobernante del mundo, Satanás según la nota. Luego les manda levantarse."}
  15:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: speech, entities: [event:ultimo-discurso-y-oracion, person:jesus, journey:ultima-semana], note: "Sigue la última noche, 14 de nisán. Jesús es la vid verdadera y el Padre el agricultor; los discípulos, las ramas, solo dan fruto si siguen unidos a él y obedecen sus mandatos."}
    - {v: 11-17, type: speech, note: "Su mandamiento es que se amen como él los amó; nadie ama más que quien entrega la vida por sus amigos. Ya no los llama esclavos, sino amigos, y él los eligió."}
    - {v: 18-25, type: speech, note: "El mundo los odiará y perseguirá como a él, porque no son parte de él. Ese odio sin causa cumple lo escrito; la nota del v. 25 remite a Sl 35:19 y 69:4."}
    - {v: 26-27, type: speech, note: "El ayudante, el espíritu de la verdad que enviará desde el Padre, dará testimonio de él, y ellos también, pues lo acompañan desde que empezó su ministerio."}
  16:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-4, type: speech, entities: [event:ultimo-discurso-y-oracion, person:jesus, journey:ultima-semana], note: "Les avisa para que no pierdan la fe: los echarán de la sinagoga y quien los mate creerá servir a Dios. La nota del v. 2 dice que es la primera vez que anuncia que matarían a algunos."}
    - {v: 5-11, type: speech, entities: [person:satanas], note: "Les conviene que se vaya: así enviará al ayudante, que probará al mundo su pecado, la justicia y el juicio. El gobernante del mundo ya está juzgado; la nota del v. 8 dice que es Satanás."}
    - {v: 12-15, type: speech, note: "El espíritu de la verdad los guiará a toda la verdad y les anunciará lo que viene. La nota del v. 13 explica que Jesús personifica una fuerza impersonal."}
    - {v: 16-24, type: speech, note: "Algunos discípulos, sin nombre, no entienden su «dentro de poco». Jesús compara su tristeza con la de una mujer de parto, que se vuelve alegría; pidan al Padre en su nombre."}
    - {v: 25-33, type: speech, note: "Hablará claro del Padre, que los quiere. Los discípulos dicen creer que vino de Dios; Jesús anuncia que se dispersarán y lo dejarán solo, y los anima: él ha vencido al mundo."}
  17:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-5, type: speech, entities: [event:ultimo-discurso-y-oracion, person:jesus, journey:ultima-semana], note: "Alza la vista y ora al Padre, aún en la habitación de arriba según jy. Pide ser glorificado; la vida eterna es conocer al único Dios verdadero y a Jesucristo, su enviado."}
    - {v: 6-12, type: speech, entities: [person:judas-iscariote], note: "Ha dado a conocer el nombre del Padre a los que este le dio y pide por ellos. Ninguno se perdió salvo el hijo de la destrucción; la nota del v. 12 y Perspicacia «Judas» dicen que es Judas Iscariote."}
    - {v: 13-19, type: speech, mentions: [person:satanas], note: "No son parte del mundo; pide que el Padre los proteja del Maligno y los santifique con su palabra, que es la verdad. Mt 13:19 y sus paralelos Mr 4:15 y Lu 8:12 llaman Satanás al Maligno."}
    - {v: 20-26, type: speech, note: "Pide también por los que crean gracias a los apóstoles, para que todos sean uno como el Padre y el Hijo, y promete seguir dando a conocer el nombre de Dios."}
  18:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:arresto-en-getsemani, person:jesus, person:judas-iscariote, place:valle-de-cedron, place:getsemani, journey:ultima-semana], note: "Jesús cruza con sus discípulos el valle de Cedrón hasta un huerto que Juan no nombra; los paralelos lo llaman Getsemaní. Solo Juan dice que con los guardias venían soldados romanos (nota del v. 3)."}
    - {v: 4-9, type: narration, entities: [event:arresto-en-getsemani, person:jesus, person:judas-iscariote, relation:jesus/lived_in/nazaret], mentions: [place:nazaret], note: "Jesús se adelanta y pregunta a quién buscan. Al oír «Soy yo», retroceden y caen al suelo. Pide que dejen ir a los suyos, y así se cumple lo que dijo en Jn 17:12."}
    - {v: 10-11, type: narration, entities: [event:arresto-en-getsemani, person:pedro, person:malco, person:jesus], note: "Solo Juan da los dos nombres: Simón Pedro hiere con la espada a Malco, esclavo del sumo sacerdote, y le corta la oreja derecha. Jesús le manda guardarla; la copa es la voluntad del Padre (nota del v. 11)."}
    - {v: "12", type: narration, entities: [event:arresto-en-getsemani, person:jesus], note: "Los soldados, su comandante y los guardias judíos lo atan. El comandante era un tribuno, oficial romano de alto rango (nota de estudio)."}
    - {v: 13-14, type: narration, entities: [event:juicio-ante-el-sanedrin, person:jesus, person:anas, person:caifas, relation:caifas/kin/anas, period:sumo-sacerdocio-de-anas, period:sumo-sacerdocio-de-caifas], mentions: [place:jerusalen, event:complot-y-retiro-a-efrain], note: "Primero lo llevan a Anás, suegro de Caifás, que era sumo sacerdote ese año. Solo Juan cuenta esta visita; la nota del v. 13 da los años de los dos cargos. Recuerda el consejo de Caifás en Jn 11:49, 50."}
    - {v: 15-18, type: narration, entities: [event:juicio-ante-el-sanedrin, person:pedro, person:juan-apostol, person:jesus, relation:pedro/accompanies/juan-apostol, relation:pedro/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus], note: "Pedro y otro discípulo, al parecer Juan (nota del v. 15), van detrás de Jesús. Juan, conocido del sumo sacerdote, entra en el patio y hace pasar a Pedro. La portera le pregunta y Pedro niega junto al fuego."}
    - {v: 19-24, type: narration, entities: [event:juicio-ante-el-sanedrin, person:anas, person:jesus, person:caifas], mentions: [place:monte-moria], note: "Anás, a quien el v. 19 llama sacerdote principal, lo interroga sobre sus discípulos y su enseñanza. Jesús responde que enseñó en público, en sinagogas y en el templo. Un guardia lo abofetea y Anás lo envía atado a Caifás."}
    - {v: 25-27, type: narration, entities: [event:juicio-ante-el-sanedrin, person:pedro, person:jesus], mentions: [person:malco, event:predice-las-negaciones-de-pedro], note: "Al lado del fuego, Pedro niega dos veces más; la última vez lo interpela un pariente de Malco, esclavo del sumo sacerdote, que lo vio en el huerto. Enseguida canta un gallo, como Jesús había anunciado (Jn 13:38)."}
    - {v: 28-32, type: narration, entities: [event:ante-pilato-y-herodes, person:jesus, person:poncio-pilato, person:caifas, relation:caifas/lived_in/jerusalen], mentions: [place:jerusalen], note: "Al amanecer del 14 de nisán lo sacan de la casa de Caifás y lo llevan ante el gobernador. Los acusadores no entran, para seguir puros hasta la cena del 15 (nota del v. 28); dicen que no pueden ejecutar."}
    - {v: 33-38, type: narration, entities: [event:ante-pilato-y-herodes, person:poncio-pilato, person:jesus], note: "Pilato le pregunta si es el rey de los judíos. Jesús responde que su Reino no procede de este mundo y que vino a dar testimonio de la verdad. Pilato sale y dice que no lo halla culpable."}
    - {v: 39-40, type: narration, entities: [event:sentencia-y-barrabas, person:poncio-pilato, person:barrabas, person:jesus], note: "Pilato propone soltarlo por la costumbre judía de liberar a un preso en la Pascua, sin base en las Escrituras Hebreas (nota del v. 39). Ellos piden a Barrabás, que era un ladrón."}
  19:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:sentencia-y-barrabas, person:poncio-pilato, person:jesus, journey:ultima-semana], note: "Pilato lo manda azotar, castigo que solía ir antes de la ejecución (nota del v. 1). Los soldados le ponen una corona de espinas y un manto púrpura, lo saludan en burla como rey y lo abofetean."}
    - {v: 4-7, type: narration, entities: [event:sentencia-y-barrabas, person:poncio-pilato, person:jesus], note: "Pilato lo saca y repite que no lo halla culpable: «¡Miren! ¡El hombre!». Los sacerdotes piden el madero y, al no servir la acusación política, alegan que se hizo hijo de Dios (nota del v. 7)."}
    - {v: 8-11, type: narration, entities: [event:sentencia-y-barrabas, person:poncio-pilato, person:jesus], note: "Con más miedo, Pilato vuelve adentro y le pregunta de dónde es; Jesús calla. Le dice que su autoridad le viene de arriba y que peca más quien lo entregó, que según la nota son todos los culpables."}
    - {v: 12-16, type: narration, entities: [event:sentencia-y-barrabas, person:poncio-pilato, person:jesus, place:empedrado], mentions: [person:tiberio, event:roma-gobierna-jerusalen-63, place:jerusalen], note: "Le advierten que soltarlo lo haría enemigo de César, que era Tiberio (nota del v. 12). Hacia el mediodía del 14 de nisán, Pilato se sienta en el tribunal del Empedrado, Gábbatha, y lo entrega para ejecutarlo."}
    - {v: 17-22, type: narration, entities: [event:muerte-de-jesus, person:jesus, place:golgota, person:poncio-pilato, relation:jesus/lived_in/nazaret], mentions: [place:nazaret, place:jerusalen, person:simon-de-cirene], note: "Carga su madero hasta el Gólgota; Juan omite a Simón de Cirene (nota del v. 17). Lo clavan entre otros dos. El letrero de Pilato, en hebreo, latín y griego, lo llama Jesús el Nazareno, rey de los judíos."}
    - {v: 23-24, type: narration, entities: [event:muerte-de-jesus, person:jesus], note: "Cuatro soldados se reparten su ropa y sortean la túnica tejida sin costuras, con lo que se cumple Sl 22:18."}
    - {v: "25", type: narration, entities: [event:muerte-de-jesus, person:maria-madre-de-jesus, person:maria-esposa-de-clopas, person:clopas, person:maria-magdalena, relation:jesus/kin/maria-madre-de-jesus, relation:clopas/kin/maria-esposa-de-clopas, relation:alfeo-padre-de-santiago/same_as/clopas, relation:maria-magdalena/disciple_of/jesus, relation:maria-esposa-de-clopas/disciple_of/jesus], mentions: [person:salome-discipula, person:alfeo-padre-de-santiago, person:cleopas], note: "Junto al madero están su madre, la hermana de ella, quizá Salomé (nota de Mr 15:40), María Magdalena y María la esposa de Clopas. Clopas sería Alfeo (nota del v. 25) y no es Cleopas."}
    - {v: 26-27, type: narration, entities: [event:muerte-de-jesus, person:jesus, person:maria-madre-de-jesus, person:juan-apostol, relation:maria-madre-de-jesus/accompanies/juan-apostol, relation:juan-apostol/disciple_of/jesus], mentions: [person:jose-esposo-de-maria], note: "Jesús encarga su madre al discípulo al que amaba, el apóstol Juan (nota del v. 27), que desde entonces la tiene en su casa. La nota la supone viuda: José ya habría muerto."}
    - {v: 28-30, type: narration, entities: [event:muerte-de-jesus, person:jesus, relation:jesus/died_in/golgota], note: "Sabiendo que todo estaba hecho, dice que tiene sed y le acercan vino agrio en una esponja con una caña de hisopo. Exclama «¡Se ha cumplido!», inclina la cabeza y muere."}
    - {v: 31-37, type: narration, entities: [event:entierro-de-jesus, person:jesus, person:poncio-pilato, place:golgota], mentions: [event:guardia-en-la-tumba, person:juan-apostol], note: "Es día de preparación y mañana hay un sábado grande: piden a Pilato quebrar las piernas de los ejecutados. A Jesús, ya muerto, no se las quiebran; un soldado le clava una lanza. Lo cuenta un testigo."}
    - {v: 38-42, type: narration, entities: [event:entierro-de-jesus, person:jose-de-arimatea, place:arimatea, relation:jose-de-arimatea/lived_in/arimatea, relation:jose-de-arimatea/disciple_of/jesus, person:nicodemo, person:poncio-pilato, person:jesus, place:golgota], mentions: [event:conversacion-con-nicodemo], note: "José de Arimatea, discípulo en secreto, obtiene de Pilato el cuerpo. Nicodemo trae unos 33 kg de mirra y áloes (nota del v. 39). Lo envuelven en lino y lo dejan en una tumba nueva del huerto cercano."}
  20:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:resurreccion-de-jesus, person:maria-magdalena, person:pedro, person:juan-apostol, person:jesus, relation:juan-apostol/disciple_of/jesus], note: "Aún de noche, al empezar la semana, María Magdalena encuentra quitada la piedra y corre a avisar a Pedro y al discípulo querido, que la nota del v. 2 identifica con Juan."}
    - {v: 3-10, type: narration, entities: [event:resurreccion-de-jesus, person:pedro, person:juan-apostol, relation:pedro/accompanies/juan-apostol], note: "Juan llega antes, pero Pedro entra primero; ven las vendas y la tela de la cabeza aparte. Lucas 24:12 solo nombra a Pedro. El pasaje que aún no entendían sería Sl 16:10 o Is 53:10 (nota del v. 9)."}
    - {v: 11-18, type: narration, entities: [event:aparicion-a-maria-magdalena, person:maria-magdalena, person:jesus, relation:maria-magdalena/disciple_of/jesus], mentions: [place:golgota], note: "Dos ángeles de blanco le hablan en la tumba. Jesús la llama por su nombre, ella responde «Rabbóni» y él le pide que lo suelte y avise a sus hermanos. Es el 16 de nisán (nota del v. 17)."}
    - {v: 19-23, type: narration, entities: [event:aparicion-a-los-discipulos-sin-tomas, person:jesus, journey:los-apostoles-en-galilea], note: "Al anochecer, con las puertas cerradas por temor a los líderes judíos, Jesús les desea paz, enseña manos y costado, los envía como el Padre lo envió y sopla sobre ellos."}
    - {v: 24-25, type: narration, entities: [event:aparicion-a-los-discipulos-sin-tomas, person:tomas, relation:tomas/disciple_of/jesus], note: "Tomás, el Gemelo, no estaba; dice que no creerá sin tocar las marcas de los clavos y el costado."}
    - {v: 26-29, type: narration, entities: [event:aparicion-a-tomas, person:tomas, person:jesus], note: "Ocho días después, con Tomás presente, Jesús le invita a comprobar sus heridas. Tomás lo reconoce como su Señor y su Dios; la nota del v. 28 explica que no lo tomaba por el Dios todopoderoso."}
    - {v: 30-31, type: narration, mentions: [person:jesus], note: "El escritor aclara que dejó fuera muchos milagros; recoge estos para que el lector crea que Jesús es el Mesías e Hijo de Dios y consiga la vida."}
  21:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [event:aparicion-junto-al-mar-de-galilea, place:mar-de-galilea, person:jesus, person:pedro, person:tomas, person:natanael, person:santiago-hijo-de-zebedeo, person:juan-apostol, place:cana, relation:natanael/born_in/cana, relation:santiago-hijo-de-zebedeo/kin/zebedeo, relation:juan-apostol/kin/zebedeo, relation:santiago-hijo-de-zebedeo/kin/juan-apostol, relation:pedro/accompanies/santiago-hijo-de-zebedeo, relation:tomas/accompanies/pedro, relation:natanael/accompanies/pedro, relation:tomas/disciple_of/jesus, relation:natanael/disciple_of/jesus, journey:los-apostoles-en-galilea], mentions: [person:zebedeo, place:galilea], note: "Mar de Tiberíades es otro nombre del mar de Galilea. Siete discípulos salen a pescar con Pedro, dos de ellos sin nombre, y en toda la noche no sacan nada."}
    - {v: 4-14, type: narration, entities: [event:aparicion-junto-al-mar-de-galilea, person:jesus, person:pedro, person:juan-apostol], note: "Al amanecer, desde la orilla, Jesús les dice dónde echar la red: sacan 153 peces grandes. Juan lo reconoce y Pedro se lanza al agua; estaban a unos 200 codos, 90 metros. Es su tercera aparición al grupo."}
    - {v: 15-19, type: narration, entities: [event:aparicion-junto-al-mar-de-galilea, person:pedro, person:jesus, person:jonas-padre-de-pedro, relation:pedro/kin/jonas-padre-de-pedro, relation:pedro/disciple_of/jesus], note: "Tres veces pregunta Jesús a Simón, hijo de Juan, si lo ama, y le encarga cuidar de sus ovejas; la nota lo liga a las tres negaciones. Luego anuncia de qué modo morirá Pedro."}
    - {v: 20-23, type: narration, entities: [event:aparicion-junto-al-mar-de-galilea, event:muerte-del-apostol-juan, person:juan-apostol, person:pedro, relation:pedro/accompanies/juan-apostol, relation:juan-apostol/disciple_of/jesus], mentions: [event:despide-a-judas], note: "Pedro pregunta por el discípulo querido, el que en la cena preguntó por el traidor. Jesús no dijo que no moriría; según la nota del v. 22, Juan fue probablemente el último apóstol en morir."}
    - {v: 24-25, type: narration, entities: [person:juan-apostol], mentions: [person:jesus], note: "El discípulo querido se presenta como testigo y escritor de este Evangelio. Termina con una hipérbole: no cabrían en el mundo los rollos sobre todo lo que hizo Jesús."}
