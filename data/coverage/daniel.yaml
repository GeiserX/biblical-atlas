# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: daniel
chapters:
  1:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-2, type: narration, entities: [event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, person:jehoiaquim, person:nabucodonosor-ii, place:jerusalen, place:babilonia, journey:joaquin-llevado-a-babilonia, journey:nabucodonosor-contra-jerusalen-617, journey:daniel-a-babilonia, relation:jehoiaquim/tie/nabucodonosor-ii@-619], mentions: [place:juda, place:sinar, place:monte-moria, event:jehoiaquim-vasallo-de-babilonia], note: "El cerco empieza en 618, tercer año de Jehoiaquim como vasallo; él muere durante el asedio y su hijo se rinde en 617 (Perspicacia «Jehoiaquim»). Los utensilios van a la casa del dios del rey, Marduk según dp, cap. 3."}
    - {v: 3-7, type: narration, entities: [event:daniel-llevado-a-babilonia, person:aspenaz, person:nabucodonosor-ii, person:daniel, person:sadrac, person:mesac, person:abednego, place:babilonia, relation:aspenaz/tie/nabucodonosor-ii, relation:aspenaz/lived_in/babilonia, relation:daniel/tie/aspenaz, relation:sadrac/tie/aspenaz, relation:mesac/tie/aspenaz, relation:abednego/tie/aspenaz, relation:daniel/lived_in/jerusalen, relation:sadrac/lived_in/jerusalen, relation:mesac/lived_in/jerusalen, relation:abednego/lived_in/jerusalen, relation:sadrac/accompanies/daniel, relation:mesac/accompanies/daniel, relation:abednego/accompanies/daniel], mentions: [place:juda, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia], note: "Sentido de los nombres hebreos, según las notas: Daniel, Dios es mi juez; Hananías, Jehová ha favorecido; Misael, tal vez ¿quién es como Dios?; Azarías, Jehová ha ayudado. Los nombres nuevos son babilonios."}
    - {v: 8-16, type: narration, entities: [event:daniel-y-sus-companeros-rechazan-los-manjares-del-rey, person:daniel, person:sadrac, person:mesac, person:abednego, person:aspenaz, place:babilonia], note: "El guardián que Aspenaz pone sobre los cuatro no tiene nombre. Según la nota de 1:12, la palabra traducida «legumbres» puede abarcar toda clase de comida vegetal."}
    - {v: 17-20, type: narration, entities: [event:nabucodonosor-examina-a-daniel-y-a-sus-companeros, person:nabucodonosor-ii, person:daniel, person:sadrac, person:mesac, person:abednego, person:aspenaz, place:babilonia, relation:daniel/tie/nabucodonosor-ii, relation:sadrac/tie/nabucodonosor-ii, relation:mesac/tie/nabucodonosor-ii, relation:abednego/tie/nabucodonosor-ii, relation:sadrac/lived_in/babilonia, relation:mesac/lived_in/babilonia, relation:abednego/lived_in/babilonia, relation:daniel/holds_office/-], note: "Los sacerdotes-magos y los adivinos (la nota de 1:20 da también «sortílegos») eran los expertos de la corte en artes ocultas."}
    - {v: "21", type: narration, entities: [person:daniel, place:babilonia, relation:daniel/lived_in/babilonia], mentions: [person:ciro], note: "Daniel sigue en la corte hasta el primer año de Ciro, tras la caída de Babilonia en 539; Da 10:1 lo muestra aún activo en el tercero (Perspicacia «Daniel», núm. 2)."}
  2:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-13, type: narration, entities: [event:nabucodonosor-exige-a-sus-sabios-que-le-revelen-su-sueno, person:nabucodonosor-ii, person:daniel, place:babilonia], note: "Los caldeos de 2:2 son, según la nota, expertos en adivinación y en astrología. Desde 2:4b hasta 7:28 el original está en arameo. Daniel y sus compañeros entran en la condena por contarse entre los sabios."}
    - {v: 14-16, type: narration, entities: [event:daniel-pide-al-rey-tiempo-para-interpretar-su-sueno, person:arioc-jefe-de-la-guardia, person:daniel, person:nabucodonosor-ii, place:babilonia, relation:arioc-jefe-de-la-guardia/tie/nabucodonosor-ii, relation:arioc-jefe-de-la-guardia/lived_in/babilonia]}
    - {v: 17-19, type: narration, entities: [event:jehova-revela-a-daniel-el-sueno-del-rey, person:daniel, person:sadrac, person:mesac, person:abednego, relation:sadrac/accompanies/daniel, relation:mesac/accompanies/daniel, relation:abednego/accompanies/daniel, relation:daniel/holds_office/-], note: "Daniel tiene casa propia en Babilonia. Sus compañeros piden misericordia al Dios del cielo y esa noche el secreto le llega en una visión."}
    - {v: 20-23, type: poetry, entities: [event:jehova-revela-a-daniel-el-sueno-del-rey, person:daniel], note: "Daniel alaba a Dios, que cambia los tiempos, quita y pone reyes y conoce lo oculto, y le da gracias por haberle mostrado lo que el rey quería saber."}
    - {v: 24-30, type: narration, entities: [event:daniel-revela-e-interpreta-el-sueno-de-la-estatua, person:arioc-jefe-de-la-guardia, person:daniel, person:nabucodonosor-ii], mentions: [place:juda], note: "Arioc lo presenta como uno de los desterrados de Judá. Daniel dice que no sabe el secreto por ser más sabio que otros: se lo ha dado a conocer el Dios del cielo."}
    - {v: 31-35, type: vision, entities: [event:daniel-revela-e-interpreta-el-sueno-de-la-estatua], note: "El sueño: una estatua enorme con cabeza de oro, torso y brazos de plata, vientre y muslos de cobre, piernas de hierro y pies de hierro con barro. Una piedra cortada sin manos la tritura y se hace montaña."}
    - {v: 36-45, type: prophecy, entities: [event:daniel-revela-e-interpreta-el-sueno-de-la-estatua], mentions: [person:nabucodonosor-ii, period:potencia-babilonica], note: "La cabeza de oro es Nabucodonosor (2:38). Según el apéndice B9, la plata es Medopersia; el cobre, Grecia; el hierro, Roma, y los pies, Reino Unido y Estados Unidos. La piedra es el Reino de Dios."}
    - {v: 46-49, type: narration, entities: [event:nabucodonosor-engrandece-a-daniel-y-a-sus-companeros, person:nabucodonosor-ii, person:daniel, person:sadrac, person:mesac, person:abednego, place:babilonia, relation:daniel/tie/nabucodonosor-ii, relation:daniel/lived_in/babilonia, relation:sadrac/tie/nabucodonosor-ii, relation:mesac/tie/nabucodonosor-ii, relation:abednego/tie/nabucodonosor-ii, relation:sadrac/lived_in/provincia-de-babilonia, relation:mesac/lived_in/provincia-de-babilonia, relation:abednego/lived_in/provincia-de-babilonia, place:provincia-de-babilonia], note: "Daniel pasa a gobernar la provincia y a presidir a los sabios, y sigue en la corte; sus tres compañeros la administran. El vocabulario no tiene cargo de gobernante de provincia, prefecto de los sabios ni administrador: va a preguntas."}
  3:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-7, type: narration, entities: [event:nabucodonosor-levanta-la-estatua-de-oro, person:nabucodonosor-ii, place:llanura-de-dura, place:provincia-de-babilonia], mentions: [place:babilonia], note: "Estatua de 60 por 6 codos en la provincia de Babilonia. Sátrapas, prefectos, gobernadores, consejeros, tesoreros, jueces y magistrados acuden; un heraldo sin nombre manda postrarse al oír la música."}
    - {v: 8-18, type: narration, entities: [event:sadrac-mesac-y-abednego-en-el-horno-de-fuego, person:nabucodonosor-ii, person:sadrac, person:mesac, person:abednego, relation:sadrac/lived_in/provincia-de-babilonia, relation:mesac/lived_in/provincia-de-babilonia, relation:abednego/lived_in/provincia-de-babilonia, place:provincia-de-babilonia], note: "Unos caldeos sin nombre los acusan. No sirven a los dioses del rey, que quedan sin ficha; Perspicacia cree que la estatua quizás honraba a Marduk. Responden que su Dios puede librarlos, y si no, tampoco adorarán."}
    - {v: 19-27, type: narration, entities: [event:sadrac-mesac-y-abednego-en-el-horno-de-fuego, person:nabucodonosor-ii, person:sadrac, person:mesac, person:abednego, relation:sadrac/accompanies/mesac, relation:sadrac/accompanies/abednego, relation:mesac/accompanies/abednego], note: "Mueren por las llamas los soldados que los arrojan. El rey ve a cuatro paseando en el fuego; el cuarto, «como un hijo de los dioses», es el ángel del versículo 28."}
    - {v: 28-30, type: narration, entities: [event:sadrac-mesac-y-abednego-en-el-horno-de-fuego, person:nabucodonosor-ii, person:sadrac, person:mesac, person:abednego, relation:sadrac/tie/nabucodonosor-ii, relation:mesac/tie/nabucodonosor-ii, relation:abednego/tie/nabucodonosor-ii, place:provincia-de-babilonia], note: "Nabucodonosor alaba al Dios que mandó a su ángel, prohíbe hablar contra él bajo pena de muerte y da a los tres un puesto superior en la provincia de Babilonia."}
  4:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-3, type: letter, entities: [event:nabucodonosor-recobra-el-juicio-y-el-reino, person:nabucodonosor-ii], note: "Proclama del rey a todos los pueblos: cuenta las señales del Dios Altísimo, cuyo reino no tiene fin. La difundió poco después de recobrar el juicio."}
    - {v: 4-9, type: narration, entities: [event:nabucodonosor-suena-con-un-gran-arbol, person:nabucodonosor-ii, person:daniel, place:babilonia, relation:nabucodonosor-ii/lived_in/babilonia, relation:daniel/lived_in/babilonia], note: "Sacerdotes-magos, adivinos, caldeos y astrólogos fallan. Llama a Daniel Beltsasar por su dios, quizá Bel, sin ficha, y jefe de los sacerdotes-magos, cargo que el vocabulario aún no tiene."}
    - {v: 10-17, type: vision, entities: [event:nabucodonosor-suena-con-un-gran-arbol], note: "El árbol y el vigilante, un ángel sin nombre. Según jw.org, el árbol representa además la soberanía de Jehová, y los siete tiempos proféticos van de 607 a.e.c. a 1914 e.c."}
    - {v: 18-19, type: narration, entities: [event:nabucodonosor-suena-con-un-gran-arbol, person:nabucodonosor-ii, person:daniel], note: "Ningún otro sabio puede; Daniel, inquieto, desea que el sueño caiga sobre los enemigos del rey."}
    - {v: 20-27, type: prophecy, entities: [event:nabucodonosor-suena-con-un-gran-arbol, person:daniel, person:nabucodonosor-ii, relation:daniel/tie/nabucodonosor-ii, relation:nabucodonosor-ii/tie/daniel], note: "El árbol es el rey: vivirá con las bestias hasta reconocer que gobierna el Altísimo, y el tocón asegura que recuperará el reino."}
    - {v: 28-33, type: narration, entities: [event:nabucodonosor-pierde-el-juicio, person:nabucodonosor-ii, place:babilonia, period:nabucodonosor-ii], note: "Babilonia la Grande es aquí la ciudad que el rey embelleció, no la de Apocalipsis. Según el libro de Daniel, quizá Evil-Merodac gobernó entretanto."}
    - {v: 34-37, type: narration, entities: [event:nabucodonosor-recobra-el-juicio-y-el-reino, person:nabucodonosor-ii], note: "Altos funcionarios y nobles vuelven a buscarlo y recupera el reino con más grandeza. Alaba al Rey de los cielos, que humilla a los orgullosos."}
  5:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-4, type: narration, entities: [event:daniel-lee-la-escritura-en-la-pared, person:belsasar, relation:belsasar/holds_office/babilonia], mentions: [person:nabucodonosor-ii, place:jerusalen, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, event:destruccion-de-jerusalen-607], note: "Belsasar bebe con nobles, esposas y concubinas en los recipientes del templo (Da 1:2). Su «padre» Nabucodonosor (5:2, 11, 13, 18, 22) sería abuelo materno o antecesor en el trono (Perspicacia «Belsasar»): ninguna lectura es segura, sin relación kin."}
    - {v: 5-9, type: narration, entities: [event:daniel-lee-la-escritura-en-la-pared, person:belsasar, place:babilonia], note: "Una mano escribe en el enlucido de la pared del palacio. Los caldeos de 5:7 son, según la nota, un grupo de expertos en adivinación, no el pueblo. Nadie sabe leerlo."}
    - {v: 10-12, type: narration, entities: [event:daniel-lee-la-escritura-en-la-pared, person:daniel, relation:daniel/tie/nabucodonosor-ii], mentions: [person:nabucodonosor-ii, event:nabucodonosor-engrandece-a-daniel-y-a-sus-companeros], note: "La reina, sin nombre, entra al salón; Perspicacia «Daniel» la ve probablemente como la reina madre. Recuerda que Nabucodonosor puso a Daniel, llamado Beltsasar, al frente de los sabios (Da 2:48)."}
    - {v: 13-16, type: narration, entities: [event:daniel-lee-la-escritura-en-la-pared, person:daniel, person:belsasar], mentions: [place:juda, event:nabucodonosor-se-lleva-a-joaquin-a-babilonia, person:nabucodonosor-ii], note: "Belsasar reconoce a Daniel como uno de los desterrados que su padre trajo de Judá y le ofrece púrpura, collar de oro y el tercer puesto del reino."}
    - {v: 17-24, type: speech, entities: [event:daniel-lee-la-escritura-en-la-pared, person:daniel, event:nabucodonosor-pierde-el-juicio], mentions: [person:nabucodonosor-ii, person:belsasar], note: "Daniel rechaza los regalos y recuerda cómo Dios engrandeció y luego humilló a Nabucodonosor hasta vivir como un animal (Da 4:31-35). Belsasar, que lo sabía, profanó los recipientes del templo."}
    - {v: 25-28, type: prophecy, entities: [event:daniel-lee-la-escritura-en-la-pared, person:daniel], mentions: [place:media, place:persia, period:potencia-medopersa, event:caida-de-babilonia], note: "Mené, Tequel y Parsín son pesos (mina, siclo, medios siclos) que también leen contado, pesado y dividido o persas, según ¡Prestemos atención…!, cap. 7. El reino pasa a medos y persas."}
    - {v: "29", type: narration, entities: [event:daniel-lee-la-escritura-en-la-pared, person:daniel, person:belsasar, relation:daniel/tie/belsasar], mentions: [person:nabonido], note: "Daniel es proclamado tercer gobernante. Según Perspicacia «Daniel» y «Nabonido», ese tercer puesto supone a Nabonido en el primero y a su hijo Belsasar en el segundo."}
    - {v: 30-31, type: narration, entities: [event:caida-de-babilonia, person:belsasar, person:dario-el-medo, place:babilonia, relation:belsasar/died_in/babilonia, relation:dario-el-medo/succeeds/belsasar, relation:dario-el-medo/holds_office/babilonia, relation:dario-el-medo/born_in/media, relation:daniel/lived_in/babilonia], mentions: [place:caldea, person:ciro, place:media, period:potencia-babilonica, period:potencia-medopersa], note: "Matan a Belsasar, el rey caldeo: con él acaba esa dinastía (Perspicacia «Caldea, caldeo»). Darío el medo recibe el reino con unos 62 años. El texto no narra el asalto; Perspicacia «Ciro» lo atribuye a su ejército."}
  6:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-3, type: narration, entities: [event:dario-nombra-120-satrapas, person:dario-el-medo, person:daniel, relation:daniel/tie/dario-el-medo], note: "Darío pone 120 sátrapas bajo tres altos funcionarios; uno es Daniel. El vocabulario no tiene el cargo de sátrapa ni el de alto funcionario."}
    - {v: 4-9, type: narration, entities: [event:dario-firma-la-prohibicion-de-los-treinta-dias, person:dario-el-medo, person:daniel], mentions: [place:media, place:persia], note: "Los funcionarios, prefectos, sátrapas y gobernadores, sin nombre, piden un decreto. Por la norma de medos y persas, lo firmado no podía anularse; son pueblos, y su tierra va en mentions."}
    - {v: 10-11, type: narration, entities: [event:daniel-sale-ileso-del-foso-de-los-leones, person:daniel, relation:daniel/lived_in/babilonia], mentions: [place:jerusalen], note: "Daniel ora en la habitación de la azotea de su casa, con las ventanas abiertas hacia Jerusalén, tres veces al día como siempre (compárese 1Re 8:44, 45)."}
    - {v: 12-17, type: narration, entities: [event:daniel-sale-ileso-del-foso-de-los-leones, person:daniel, person:dario-el-medo, place:babilonia], mentions: [place:juda, place:media, place:persia], note: "Lo acusan como desterrado de Judá. Darío intenta salvarlo hasta el anochecer, pero la ley no cambia: lo echan al foso, que sellan con su anillo y el de sus nobles. El foso va en las partes de Babilonia."}
    - {v: 18-24, type: narration, entities: [event:daniel-sale-ileso-del-foso-de-los-leones, person:daniel, person:dario-el-medo], note: "El rey ayuna toda la noche. Al amanecer, Daniel dice que un ángel, sin nombre, cerró la boca de los leones. Los acusadores, sus esposas y sus hijos mueren en el foso."}
    - {v: 25-27, type: letter, entities: [event:dario-ordena-temer-al-dios-de-daniel, person:dario-el-medo], mentions: [person:daniel], note: "Carta de Darío a los pueblos de su reino: que teman al Dios de Daniel, Dios vivo de reino eterno, que lo libró de los leones."}
    - {v: "28", type: narration, entities: [person:daniel, person:ciro, relation:daniel/tie/ciro, relation:ciro/born_in/persia, relation:dario-el-medo/tie/ciro], mentions: [person:dario-el-medo, place:persia, period:ciro], note: "A Daniel le va bien bajo Darío y bajo Ciro el persa. La referencia remite al decreto de Ciro (Esd 1:1, 2), que no se cuenta aquí."}
  7:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: "1", type: narration, entities: [event:vision-de-las-cuatro-bestias, person:daniel, person:belsasar, place:babilonia, relation:belsasar/holds_office/babilonia, relation:daniel/lived_in/babilonia, relation:daniel/holds_office/-], note: "Primer año de Belsasar como corregente, 553 a.e.c. según «Toda Escritura». Daniel tiene el sueño acostado y lo deja por escrito. Es el último capítulo escrito en arameo (Perspicacia «Daniel, Libro de»)."}
    - {v: 2-3, type: vision, entities: [event:vision-de-las-cuatro-bestias], note: "Los cuatro vientos agitan el mar y de él suben cuatro bestias distintas entre sí. El libro sobre las profecías de Daniel, cap. 9, ve en ese mar a la humanidad apartada de Dios."}
    - {v: "4", type: vision, entities: [event:vision-de-las-cuatro-bestias], mentions: [period:potencia-babilonica], note: "Primera bestia: un león con alas de águila al que se las arrancan; se pone en pie como un hombre y recibe corazón humano. Es Babilonia, que al final de Belsasar perdió su empuje (libro sobre Daniel, cap. 9)."}
    - {v: "5", type: vision, entities: [event:vision-de-las-cuatro-bestias], mentions: [period:potencia-medopersa, event:caida-de-babilonia], note: "Segunda bestia: un oso alzado de un costado, con tres costillas entre los dientes, al que mandan comer mucha carne. Es Medopersia, que según el libro sobre Daniel devoró a Babilonia en 539."}
    - {v: "6", type: vision, entities: [event:vision-de-las-cuatro-bestias], mentions: [period:potencia-griega, event:muerte-de-alejandro], note: "Tercera bestia: un leopardo de cuatro cabezas, con cuatro alas en el lomo, que recibe poder. Es Grecia; las cabezas son los cuatro generales que se repartieron el imperio al morir Alejandro, en 323 a.e.c."}
    - {v: 7-8, type: vision, entities: [event:vision-de-las-cuatro-bestias], mentions: [period:potencia-romana], note: "Cuarta bestia: terrible, con dientes de hierro y diez cuernos; entre ellos brota uno pequeño, con ojos y boca jactanciosa, que arranca tres. El libro sobre Daniel la aplica a Roma, y el cuerno, a la potencia angloamericana."}
    - {v: 9-10, type: vision, entities: [event:vision-de-las-cuatro-bestias], note: "Se colocan tronos y se sienta el Anciano de Días, que el libro sobre Daniel identifica con Jehová, de ropa blanca y trono de llamas. Miles le sirven; el Tribunal se sienta y se abren libros."}
    - {v: 11-12, type: vision, entities: [event:vision-de-las-cuatro-bestias], note: "Por las palabras arrogantes del cuerno, la cuarta bestia muere y arde en el fuego. Las otras pierden su dominio, pero siguen vivas un tiempo más."}
    - {v: 13-14, type: vision, entities: [event:vision-de-las-cuatro-bestias], mentions: [person:jesus], note: "Alguien parecido a un hijo del hombre llega con las nubes ante el Anciano de Días y recibe un reino eterno sobre todos los pueblos. El libro sobre Daniel ve en él a Jesús, rey desde 1914."}
    - {v: 15-16, type: vision, entities: [event:vision-de-las-cuatro-bestias, person:daniel], note: "Daniel, angustiado por lo que ha visto, pide el sentido de todo a uno de los presentes, un ángel sin nombre, que se lo explica."}
    - {v: 17-18, type: vision, entities: [event:vision-de-las-cuatro-bestias], note: "Las cuatro bestias son cuatro reyes, pero el reino será para siempre de los santos del Supremo: Jesús y los cristianos ungidos que reinan con él, según el libro sobre Daniel."}
    - {v: 19-22, type: vision, entities: [event:vision-de-las-cuatro-bestias], note: "Daniel pregunta por la cuarta bestia y por el cuerno que hace guerra a los santos y los vence, hasta que el Anciano de Días juzga a su favor y ellos reciben el reino."}
    - {v: 23-27, type: vision, entities: [event:vision-de-las-cuatro-bestias], note: "Explicación: un cuarto reino devora la tierra; de él salen diez reyes y otro que humilla a tres y acosa a los santos tres tiempos y medio. El libro sobre Daniel cierra ese plazo en junio de 1918."}
    - {v: "28", type: narration, entities: [event:vision-de-las-cuatro-bestias, person:daniel], note: "Fin del relato: Daniel queda muy turbado y pálido, pero guarda el asunto en su corazón."}
  8:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: "1", type: narration, entities: [event:vision-del-carnero-y-el-macho-cabrio, person:daniel, person:belsasar, relation:belsasar/holds_office/babilonia], note: "Tercer año de Belsasar, dos años después de la visión de Da 7 según Perspicacia «Bestias simbólicas». Desde aquí hasta el final, el libro está escrito en hebreo (Perspicacia «Daniel, Libro de»)."}
    - {v: "2", type: vision, entities: [event:vision-del-carnero-y-el-macho-cabrio, person:daniel, place:susa, place:elam, place:rio-ulai], note: "Daniel se ve en el castillo de Susa, en la provincia de Elam, junto al Ulái; la nota da también Susán. Perspicacia no sabe si estuvo allí en persona o solo en visión."}
    - {v: 3-4, type: vision, entities: [event:vision-del-carnero-y-el-macho-cabrio], mentions: [period:potencia-medopersa, event:caida-de-babilonia, person:ciro], note: "Un carnero con dos cuernos, el mayor brotado al final, embiste al oeste, al norte y al sur, y nadie lo frena. Para el libro sobre Daniel, cap. 10, son medos y persas: Ciro venció a Astiages en 550."}
    - {v: 5-8, type: vision, entities: [event:vision-del-carnero-y-el-macho-cabrio], mentions: [period:potencia-griega, event:alejandro-toma-babilonia, event:muerte-de-alejandro], note: "Un macho cabrío llega del oeste sin tocar el suelo, rompe los cuernos del carnero y lo pisotea. Su gran cuerno se quiebra y brotan cuatro: Alejandro y sus cuatro generales, según el libro sobre Daniel."}
    - {v: 9-10, type: vision, entities: [event:vision-del-carnero-y-el-macho-cabrio], note: "De uno de los cuatro sale un cuerno pequeño que crece hacia el sur, el este y la Tierra Hermosa. Esta no es un lugar: el libro sobre Daniel ve en ella la condición del pueblo santo en la tierra."}
    - {v: 11-12, type: vision, entities: [event:vision-del-carnero-y-el-macho-cabrio], note: "El cuerno desafía al Príncipe del ejército, que es Jehová, le quita el sacrificio constante y derriba su santuario. El libro sobre Daniel lo aplica a la potencia angloamericana, nacida de Gran Bretaña."}
    - {v: 13-14, type: vision, entities: [event:vision-del-carnero-y-el-macho-cabrio], note: "Un santo pregunta a otro cuánto durará lo visto: 2.300 tardes y mañanas, y luego el lugar santo recobrará su estado. El libro sobre Daniel los cuenta de 1938 a 1944."}
    - {v: 15-19, type: vision, entities: [event:vision-del-carnero-y-el-macho-cabrio, person:daniel, person:gabriel, place:rio-ulai, relation:gabriel/appears_to/daniel@-550], note: "Aparece alguien con aspecto de hombre y una voz desde el Ulái manda a Gabriel explicar la visión. Daniel cae rostro a tierra, dormido; Gabriel lo levanta y le dice que lo visto se refiere al tiempo del fin."}
    - {v: 20-22, type: vision, entities: [event:vision-del-carnero-y-el-macho-cabrio, person:gabriel], mentions: [place:media, place:persia, place:grecia, period:potencia-medopersa, period:potencia-griega, event:alejandro-toma-babilonia, event:muerte-de-alejandro], note: "Gabriel explica: el carnero representa a los reyes medos y persas; el macho cabrío, al rey de Grecia, y su gran cuerno, al primer rey, Alejandro Magno, sin ficha. Le siguen cuatro reinos más débiles."}
    - {v: 23-26, type: vision, entities: [event:vision-del-carnero-y-el-macho-cabrio, person:gabriel], note: "Al final de esos reinos surge un rey feroz y astuto que hace daño a los santos y se alza contra el Príncipe de príncipes, pero cae sin mano humana. Daniel debe guardar la visión en secreto."}
    - {v: "27", type: narration, entities: [event:vision-del-carnero-y-el-macho-cabrio, person:daniel, relation:daniel/tie/belsasar], note: "Daniel queda agotado y enfermo unos días; después vuelve a su trabajo para el rey, aturdido por una visión que nadie entiende."}
  9:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: 1-3, type: narration, entities: [event:profecia-de-las-setenta-semanas, person:daniel, person:dario-el-medo, person:asuero-padre-de-dario-el-medo, relation:dario-el-medo/kin/asuero-padre-de-dario-el-medo, relation:dario-el-medo/holds_office/babilonia, relation:asuero-padre-de-dario-el-medo/born_in/media], mentions: [person:jeremias-profeta, place:jerusalen, place:caldea, event:jeremias-anuncia-setenta-anos-de-servidumbre-a-babilonia, event:jeremias-escribe-a-los-desterrados-de-babilonia, place:media], note: "Primer año de Darío el medo, rey sobre los caldeos. Daniel saca de los escritos de Jeremías (Jer 25:11; 29:10) que la desolación de Jerusalén dura 70 años y busca a Jehová con ayuno, saco y ceniza."}
    - {v: 4-19, type: speech, entities: [event:profecia-de-las-setenta-semanas, person:daniel], mentions: [person:moises, place:egipto, event:exodo, place:jerusalen, event:destruccion-de-jerusalen-607], note: "Oración de Daniel: reyes, príncipes y pueblo desoyeron a los profetas y cayó la maldición de la Ley de Moisés. Recuerda la salida de Egipto y pide perdón para Jerusalén y su santuario. Judá e Israel son el pueblo."}
    - {v: 20-23, type: narration, entities: [event:profecia-de-las-setenta-semanas, person:gabriel, person:daniel, relation:gabriel/appears_to/daniel@-538], mentions: [place:jerusalen, event:vision-del-carnero-y-el-macho-cabrio], note: "Mientras ora, hacia el momento de la ofrenda vespertina, llega Gabriel, el que Daniel vio en la visión de Da 8, para darle entendimiento. La santa montaña es Jerusalén."}
    - {v: 24-27, type: prophecy, entities: [event:profecia-de-las-setenta-semanas], mentions: [person:jesus, place:jerusalen, event:muros-de-jerusalen-455, event:bautismo-de-jesus, event:muerte-de-jesus, event:pedro-predica-a-cornelio, event:destruccion-de-jerusalen-70, period:potencia-romana], note: "Setenta semanas de años: según «Profecías de Daniel», cap. 11, van de 455 a.e.c., con Nehemías en Jerusalén, a 36 e.c. El Mesías es Jesús, ungido en 29 y muerto en 33; Roma arrasa la ciudad en 70."}
  10:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: "1", type: narration, entities: [event:vision-del-tercer-ano-de-ciro, person:daniel], mentions: [person:ciro, place:persia], note: "Tercer año de Ciro, rey de Persia: 536/535 a.e.c. según «Profecías de Daniel», cap. 12. Daniel, llamado Beltsasar, recibe un mensaje verdadero sobre un gran conflicto y lo entiende."}
    - {v: 2-4, type: narration, entities: [event:vision-del-tercer-ano-de-ciro, person:daniel, place:rio-tigris, relation:daniel/lived_in/babilonia], note: "Tres semanas de duelo y ayuno, que según «Profecías de Daniel», cap. 12, abarcaron la Pascua. El día 24 del primer mes Daniel está a la orilla del Tigris, el Hidequel, aún en tierra de Babilonia."}
    - {v: 5-9, type: vision, entities: [event:vision-del-tercer-ano-de-ciro, person:daniel, place:ufaz], note: "Un hombre vestido de lino, con cinturón de oro de Ufaz: un ángel de alto rango cuyo nombre no se da («Profecías de Daniel», cap. 12). Los que acompañan a Daniel no ven nada, tiemblan y huyen."}
    - {v: 10-21, type: vision, entities: [event:vision-del-tercer-ano-de-ciro, person:daniel, person:jesus], mentions: [place:persia, place:grecia], note: "El ángel fortalece tres veces a Daniel. Los príncipes de Persia y de Grecia son demonios; Miguel, príncipe del pueblo de Daniel, es Jesús (Perspicacia «Miguel», núm. 1). Quien le toca los labios pudo ser otro ángel, quizá Gabriel."}
  11:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: "1", type: vision, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [person:dario-el-medo, person:jesus], note: "El ángel sigue hablando: en el año primero de Darío el medo se puso de pie para dar fuerza. Según «Profecías de Daniel», cap. 13, no a Darío sino a Miguel, que es Jesús, frente al príncipe demoníaco de Medopersia."}
    - {v: "2", type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [place:persia, place:grecia, person:ciro, person:cambises-ii, person:dario-i, person:jerjes-i, period:potencia-medopersa], note: "Tres reyes más en Persia y un cuarto, el más rico, que lanza todo contra Grecia. «Profecías de Daniel», cap. 13: Ciro, Cambises II y Darío I, y el cuarto Jerjes I, el Asuero de Ester, que atacó Grecia."}
    - {v: 3-4, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [period:potencia-griega, event:alejandro-toma-babilonia, event:muerte-de-alejandro], note: "Un rey poderoso hace lo que quiere, pero su reino se parte hacia los cuatro vientos y no pasa a sus hijos. Es Alejandro Magno: tras su muerte, cuatro generales se repartieron el imperio («Profecías de Daniel», cap. 13)."}
    - {v: 5-6, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], note: "Empieza la lucha entre el rey del sur y el del norte, situados respecto a la tierra de Daniel: Tolomeo I de Egipto y Seleuco I de Siria. La hija es Berenice, casada con Antíoco II (cap. 13)."}
    - {v: 7-9, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [place:egipto], note: "Un brote de las raíces de ella vence al rey del norte y vuelve a Egipto con dioses, plata, oro y cautivos. «Profecías de Daniel», cap. 13: Tolomeo III, hermano de Berenice, contra Seleuco II, que después atacó y fracasó."}
    - {v: 10-12, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], note: "Los hijos del rey del norte juntan un ejército enorme; el rey del sur lo derrota, pero no aprovecha la victoria. Según «Profecías de Daniel», cap. 13, Antíoco III fue vencido por Tolomeo IV en Rafia en 217 a.e.c."}
    - {v: 13-16, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [event:seleucidas-toman-judea, place:judea, place:jerusalen], note: "El rey del norte vuelve más fuerte, toma una ciudad fortificada y se planta en la Tierra Hermosa. Cap. 13: Antíoco III toma Sidón y en 198 a.e.c. quita Judá y Jerusalén a Tolomeo V. Los violentos del pueblo fracasan."}
    - {v: 17-19, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [period:potencia-romana], note: "Un pacto con el rey del sur, una hija que no sigue de su parte y un comandante que le devuelve las humillaciones. Cap. 13: Cleopatra I, casada con Tolomeo V, y Roma, que vence a Antíoco III."}
    - {v: "20", type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [person:augusto, event:nacimiento-de-jesus, period:potencia-romana], note: "Quien envía un exactor por el reino espléndido muere pronto, sin guerra. «Profecías de Daniel», cap. 14: Augusto, cuyo censo llevó a José y María a Belén; murió enfermo en 14 e.c. Roma es ya el rey del norte."}
    - {v: 21-24, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [person:tiberio, person:jesus, event:muerte-de-jesus], note: "Un hombre despreciado se hace con el reino a base de halagos, y el Líder del pacto cae destruido. «Profecías de Daniel», cap. 14: Tiberio, y el Líder es Jesús, ejecutado durante su reinado (la referencia remite a Da 9:25)."}
    - {v: 25-26, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], note: "Guerra contra el rey del sur; los que comen de la mesa del rey del norte lo derriban. La Atalaya de mayo de 2020: el Imperio alemán contra Gran Bretaña en la Primera Guerra Mundial, no Aureliano y Zenobia."}
    - {v: 27-28, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], note: "Los dos reyes se mienten sentados a la misma mesa, y el del norte vuelve cargado de riquezas. Según La Atalaya de mayo de 2020, Alemania y Gran Bretaña antes de 1914, con Alemania ya segunda economía del mundo."}
    - {v: 29-30, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [place:chipre], note: "Las naves de Kitim, Chipre según Perspicacia, humillan al rey del norte, que se vuelve contra el pacto santo. Cap. 15: la flota británica, con ayuda de Estados Unidos; después la Alemania nazi persigue al pueblo de Dios (2020)."}
    - {v: "31", type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [event:senal-de-su-presencia, event:revuelta-judia-66, event:destruccion-de-jerusalen-70], note: "Profanan el santuario, quitan el sacrificio constante y ponen la cosa repugnante. Jesús la anuncia en Mt 24:15, cuya nota ve un primer cumplimiento en el ejército romano de 66; La Atalaya de 2020 la identifica con la ONU."}
    - {v: 32-35, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], note: "El pueblo que conoce a su Dios se mantiene firme; los perspicaces enseñan a muchos, sufren y reciben algo de ayuda. La Atalaya de 2020 ve esa ayuda, por ejemplo, cuando cayó la Unión Soviética, en 1991."}
    - {v: 36-39, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], note: "El rey se ensalza sobre todos los dioses, desprecia al Dios de sus padres y honra al dios de las fortalezas. La Atalaya de 2020 lo aplica a la Unión Soviética: ateísmo en las escuelas y enorme gasto en armas."}
    - {v: "40", type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], note: "Llegado el tiempo del fin, el del sur choca con el rey del norte, que inunda los países. Según La Atalaya de 2020 y 2023, hoy son Rusia con sus aliados, y Gran Bretaña con Estados Unidos."}
    - {v: "41", type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [place:edom, place:moab, place:ammon], note: "Invade la Tierra Hermosa, que desde Pentecostés del año 33 no es un territorio sino el lugar donde el pueblo de Dios adora (2020). Edom, Moab y Ammón escapan: naciones que no logra someter («Profecías de Daniel», cap. 16)."}
    - {v: 42-43, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [place:egipto, place:libia, place:etiopia], note: "Egipto no escapa: el rey del norte controla sus tesoros, y libios y etíopes van tras él. «Profecías de Daniel», cap. 16: Egipto es el rey del sur moderno, y sus vecinos, países que a veces siguen al norte."}
    - {v: 44-45, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [place:mar-grande, place:jerusalen], note: "Noticias del este y del norte lo enfurecen; planta sus tiendas entre el gran mar y la montaña santa, y cae sin ayuda. Eran el Mediterráneo y Sion; La Atalaya de 2020 ve el ataque final al pueblo de Dios."}
  12:
    status: complete
    reviewed_on: 2026-10-14
    spans:
    - {v: "1", type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [person:jesus], note: "Se levantará Miguel, el gran príncipe que defiende al pueblo de Daniel; vendrá una angustia sin igual y se salvarán los inscritos en el libro. Miguel es Jesús, y según La Atalaya de 2020 se levanta en Armagedón."}
    - {v: 2-3, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], note: "Muchos que duermen en el polvo despiertan, unos a vida eterna y otros a desprecio, y los perspicaces brillan como estrellas. «Profecías de Daniel», cap. 17, lo aplica sobre todo a los ungidos reactivados en 1919."}
    - {v: "4", type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro, person:daniel], note: "Daniel debe guardar en secreto estas palabras y sellar el libro hasta que llegue el tiempo del fin; entonces muchos lo estudiarán y aumentará el conocimiento verdadero. Aquí acaba el mensaje del ángel («Profecías de Daniel», cap. 17)."}
    - {v: 5-7, type: vision, entities: [event:vision-del-tercer-ano-de-ciro, person:daniel], mentions: [place:rio-tigris], note: "Daniel ve a dos más, uno a cada orilla del río, el Tigris de Da 10:4. El hombre vestido de lino jura que serán tres tiempos y medio: para el cap. 17, de finales de 1914 a mediados de 1918."}
    - {v: 8-10, type: vision, entities: [event:vision-del-tercer-ano-de-ciro, person:daniel], note: "Daniel oye sin entender y pregunta cómo acabará todo. Se le dice que se vaya, porque las palabras quedan selladas hasta el tiempo del fin; muchos serán purificados y solo los perspicaces comprenderán."}
    - {v: 11-12, type: prophecy, entities: [event:vision-del-tercer-ano-de-ciro], mentions: [event:senal-de-su-presencia], note: "Desde que se quita el sacrificio constante y se pone la cosa repugnante pasan 1.290 días; feliz quien llega a 1.335. Cap. 17: de comienzos de 1919 al otoño de 1922, y de allí a la primavera de 1926."}
    - {v: "13", type: vision, entities: [event:vision-del-tercer-ano-de-ciro, person:daniel], note: "A Daniel se le pide seguir hasta el fin: descansará y al final de los días se levantará para recibir su parte. Según Perspicacia «Daniel», le quedaba poca vida, rondaba los cien años, y resucitará."}
