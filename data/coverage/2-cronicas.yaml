# biblical-atlas: cobertura de un libro. Formato en data/coverage/README.md.
book: 2-cronicas
chapters:
  1:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: "1", type: narration, entities: [event:salomon-rey, person:salomon, period:salomon, relation:salomon/kin/david], mentions: [person:david], note: "Paralelo de 1Re 2:12 y 1Cr 29:25: el reino de Salomón se afianza, Jehová está con él y lo hace muy grande."}
    - {v: 2-3, type: narration, entities: [event:jehova-se-aparece-a-salomon-en-gabaon, journey:salomon-va-a-gabaon, person:salomon, place:gabaon], mentions: [person:moises, event:se-hacen-el-tabernaculo-y-sus-muebles, event:sadoc-y-los-sacerdotes-sirven-en-el-tabernaculo-de-gabaon], note: "Llama a todo Israel: jueces, cabezas de familia y oficiales de millares y centenas, todos sin nombre. En el lugar alto de Gabaón seguía la tienda de reunión hecha por Moisés."}
    - {v: 4-5, type: narration, entities: [event:jehova-se-aparece-a-salomon-en-gabaon, person:salomon, person:bezalel-hijo-de-uri, person:uri-hijo-de-hur, person:hur-hijo-de-caleb, place:quiryat-jearim, place:jerusalen, relation:bezalel-hijo-de-uri/kin/uri-hijo-de-hur, relation:bezalel-hijo-de-uri/kin/hur-hijo-de-caleb, relation:uri-hijo-de-hur/kin/hur-hijo-de-caleb], mentions: [person:david, event:david-sube-el-arca-a-la-ciudad-de-david, event:se-hacen-el-tabernaculo-y-sus-muebles], note: "El Arca no estaba en Gabaón: David la había subido de Quiryat-Jearim a una tienda en Jerusalén. Ante el tabernáculo quedaba el altar de cobre de Bezalel; la nota del v. 5 admite que allí consultaban a Jehová."}
    - {v: 6-12, type: narration, entities: [event:jehova-se-aparece-a-salomon-en-gabaon, journey:salomon-va-a-gabaon, person:salomon, place:gabaon, relation:salomon/kin/david, relation:salomon/succeeds/david], mentions: [person:david, event:pacto-con-david], note: "Mil ofrendas quemadas en el altar de cobre. Esa noche Dios le dice que pida; Salomón pide sabiduría y conocimiento para juzgar al pueblo y recibe además riquezas, bienes y honra sin igual."}
    - {v: "13", type: narration, entities: [event:jehova-se-aparece-a-salomon-en-gabaon, journey:salomon-va-a-gabaon, person:salomon, place:gabaon, place:jerusalen, relation:salomon/lived_in/jerusalen], mentions: [place:israel], note: "Deja la tienda de reunión de Gabaón, vuelve a Jerusalén y reina sobre Israel."}
    - {v: 14-17, type: narration, entities: [event:riqueza-de-salomon, person:salomon, place:jerusalen, place:sefela, relation:salomon/lived_in/jerusalen], mentions: [place:egipto, place:siria, place:cilicia], note: "Tiene 1.400 carros y 12.000 caballos o jinetes, repartidos entre Jerusalén, junto al rey, y las ciudades para carros. Los hititas son un pueblo, sin ficha. La nota del v. 16 lee quizás Coa, que tal vez sea Cilicia."}
  2:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: narration, entities: [event:salomon-recluta-trabajadores-para-el-templo, person:salomon], note: "Salomón manda edificar la casa para el nombre de Jehová y un palacio para su reino, obras que se cuentan después. Recluta 70.000 cargadores, 80.000 picapedreros y 3.600 supervisores; 1Re 5:16 da 3.300."}
    - {v: 3-10, type: speech, entities: [event:hiram-y-salomon-pactan-la-madera-del-templo, person:salomon, person:hiram-rey-de-tiro, place:tiro, place:libano, relation:hiram-rey-de-tiro/holds_office/tiro, relation:hiram-rey-de-tiro/lived_in/tiro, relation:hiram-rey-de-tiro/tie/david, relation:salomon/kin/david], mentions: [person:david, event:hiram-envia-cedro-y-artesanos-a-david, place:juda, place:jerusalen], note: "Salomón pide cedro, enebro y sándalo del Líbano y un artesano que trabaje en Judá y Jerusalén con los que David reunió; paga con trigo, cebada, vino y aceite. Recuerda el cedro que Hiram dio a David."}
    - {v: 11-12, type: letter, entities: [event:hiram-y-salomon-pactan-la-madera-del-templo, person:hiram-rey-de-tiro, person:salomon, place:tiro, relation:hiram-rey-de-tiro/holds_office/tiro, relation:hiram-rey-de-tiro/tie/salomon, relation:salomon/kin/david], mentions: [person:david], note: "Hiram contesta por escrito y alaba a Jehová por haber dado a David un hijo sabio que edificará la casa de Jehová y su palacio."}
    - {v: 13-14, type: letter, entities: [event:hiram-y-salomon-pactan-la-madera-del-templo, event:hiram-hace-los-objetos-de-cobre-del-templo, journey:hiram-el-artesano-va-a-jerusalen, person:hiram-artesano, person:hiram-rey-de-tiro, person:salomon, place:tiro, relation:hiram-artesano/lived_in/tiro, relation:hiram-artesano/tie/salomon], mentions: [person:david], note: "Hiram-Abí es el artesano Hiram; Perspicacia «Hiram», núm. 2, toma Abí por apelativo. Su madre era danita, de una tribu sin ficha, y 1Re 7:14 dice Neftalí. Su padre tirio no tiene nombre."}
    - {v: 15-16, type: letter, entities: [event:hiram-y-salomon-pactan-la-madera-del-templo, person:hiram-rey-de-tiro, person:salomon, place:libano, place:jope, place:jerusalen], note: "Hiram pide el pago prometido; sus hombres talarán los árboles y los llevarán en balsas por mar hasta Jope, desde donde Salomón los subirá a Jerusalén."}
    - {v: 17-18, type: narration, entities: [event:salomon-recluta-trabajadores-para-el-templo, person:salomon, relation:salomon/kin/david], mentions: [person:david, event:david-prepara-los-materiales-para-el-templo, place:israel], note: "Salomón cuenta a los residentes extranjeros, como antes David: son 153.600. De ellos saca a los cargadores, a los picapedreros de las montañas y a los supervisores."}
  3:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: narration, entities: [event:templo-de-salomon-empieza, person:salomon, period:salomon, place:jerusalen, place:monte-moria, relation:salomon/kin/david], mentions: [person:david, person:arauna, event:david-compra-la-era-de-arauna-y-levanta-un-altar], note: "La obra empieza en el monte Moria, en la era de Ornán, que es Arauna, el sitio que David dejó preparado. Fecha: día 2 del segundo mes del año cuarto del reinado."}
    - {v: 3-7, type: narration, entities: [event:salomon-levanta-y-adorna-el-templo, person:salomon, place:parvaim], note: "Cimientos de 60 por 20 codos, quizá en el codo largo (nota de 3:3), y pórtico de 20. Enebro, oro de Parvaim, piedras preciosas, palmeras, cadenas y querubines tallados."}
    - {v: 8-9, type: narration, entities: [event:salomon-levanta-y-adorna-el-templo], note: "El Santísimo, de 20 por 20 codos, cubierto con 600 talentos de oro; clavos con 50 siclos de oro y habitaciones de la azotea también revestidas."}
    - {v: 10-13, type: narration, entities: [event:salomon-levanta-y-adorna-el-templo], note: "Dos querubines esculpidos y dorados en el Santísimo; sus cuatro alas, de 5 codos cada una, cubren de pared a pared los 20 codos. Miran hacia el Santo."}
    - {v: "14", type: narration, entities: [event:salomon-levanta-y-adorna-el-templo], note: "La cortina del Santísimo, de hilo azul, lana púrpura, carmesí y lino fino, con querubines bordados. 1 Reyes 6 no la describe."}
    - {v: 15-17, type: narration, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo, person:salomon, place:monte-moria], note: "Dos columnas ante la casa, con capiteles de 5 codos, cadenas y cien granadas. Jakín, al sur, y Boaz, al norte, van en names de monte-moria. 1Re 7:15 da 18 codos a cada columna."}
  4:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: "1", type: narration, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo, person:salomon], note: "El altar de cobre de las ofrendas, de 20 por 20 codos y 10 de alto. 1 Reyes 7 no da sus medidas."}
    - {v: 2-5, type: narration, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo], note: "El Mar de metal fundido sobre doce toros. Perspicacia «Mar fundido» lee sus 3.000 batos como la capacidad máxima, y los 2.000 de 1Re 7:26 como lo que solía tener."}
    - {v: "6", type: narration, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo], note: "Diez palanganas, cinco a cada lado, para lavar lo que se ofrecía; el Mar servía para que se lavaran los sacerdotes."}
    - {v: 7-8, type: narration, entities: [event:salomon-hace-los-utensilios-de-oro-del-templo, person:salomon], note: "Diez candelabros de oro y diez mesas, cinco a cada lado dentro del templo, y cien tazones de oro."}
    - {v: "9", type: narration, entities: [event:salomon-levanta-y-adorna-el-templo, person:salomon], note: "Dos patios, uno para los sacerdotes y otro mayor, cuyas puertas se forran de cobre."}
    - {v: "10", type: narration, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo], note: "El Mar se coloca a la derecha de la casa, hacia el sureste."}
    - {v: 11-16, type: list, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo, person:hiram-artesano, person:salomon, relation:hiram-artesano/tie/salomon, journey:hiram-el-artesano-va-a-jerusalen], note: "Hiram acaba para el rey la obra de cobre pulido: columnas, capiteles, mallas, 400 granadas, carritos, palanganas, el Mar y utensilios. Hiram-Abiv, en 4:16, es él: el nombre está en su ficha."}
    - {v: 17-18, type: narration, entities: [event:hiram-hace-los-objetos-de-cobre-del-templo, place:distrito-del-jordan, place:sucot, place:zaretan], note: "Fundición en moldes de arcilla del distrito del Jordán, entre Sucot y Zeredá. Esta Zeredá es Zaretán (Perspicacia «Zeredá», núm. 2), no el pueblo de Jeroboán. Nadie pesó el cobre."}
    - {v: 19-22, type: narration, entities: [event:salomon-hace-los-utensilios-de-oro-del-templo, person:salomon], note: "Utensilios de oro: altar, mesas del pan de la presencia, candelabros y lámparas, flores, despabiladeras, tazones, copas, braserillos y las puertas del Santísimo y de la casa."}
  5:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: "1", type: narration, entities: [event:templo-de-salomon-terminado, person:salomon, relation:salomon/kin/david], mentions: [person:david], note: "Acabada la obra, Salomón deposita en los tesoros del templo la plata, el oro y los objetos que su padre había dedicado."}
    - {v: 2-10, type: narration, entities: [event:el-arca-entra-en-el-templo, person:salomon, place:jerusalen, place:monte-moria], mentions: [event:david-sube-el-arca-a-la-ciudad-de-david, person:moises, place:monte-sinai, event:moises-recibe-las-segundas-tablas, event:pacto-de-la-ley, event:exodo, place:egipto], note: "Ciudad de David y Sion son nombres de Jerusalén; Horeb, del Sinaí. La fiesta del mes séptimo es la de las Cabañas (nota del v. 3). Con el Arca suben la tienda de reunión y sus utensilios."}
    - {v: 11-14, type: narration, entities: [event:el-arca-entra-en-el-templo, person:heman-hijo-de-joel], mentions: [person:asaf-hijo-de-berekias, person:jedutun-musico, event:salomon-organiza-el-servicio-del-templo], note: "Sirven todos los sacerdotes, sin atender a sus turnos. Cantan los levitas de las casas de Asaf, Hemán y Jedutún junto a 120 sacerdotes con trompetas, y una nube llena el templo."}
  6:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: speech, entities: [event:oracion-de-salomon-en-la-inauguracion-del-templo, person:salomon], note: "Salomón recuerda que Jehová dijo que moraría en la nube oscura y le presenta la casa que le ha construido como morada fija."}
    - {v: 3-11, type: speech, entities: [event:oracion-de-salomon-en-la-inauguracion-del-templo, person:salomon, place:jerusalen, relation:salomon/kin/david, relation:salomon/succeeds/david], mentions: [person:david, period:salomon, event:exodo, event:david-quiere-construir-una-casa-para-jehova, event:pacto-con-david, event:el-arca-entra-en-el-templo, place:egipto, place:israel], note: "Salomón bendice a la congregación: Jehová eligió Jerusalén para su nombre y a David para gobernar; David quiso edificarle casa, pero la obra quedó para su hijo, que ya ocupa el trono."}
    - {v: 12-13, type: narration, entities: [event:oracion-de-salomon-en-la-inauguracion-del-templo, person:salomon, place:monte-moria], note: "Ante el altar, Salomón sube a una plataforma de cobre de cinco codos de lado y tres de alto, puesta en medio del patio, y se arrodilla. Este detalle no está en 1 Reyes 8."}
    - {v: 14-17, type: speech, entities: [event:oracion-de-salomon-en-la-inauguracion-del-templo], mentions: [person:david, event:pacto-con-david, place:israel], note: "Salomón alaba la lealtad de Jehová, que ya cumplió parte de su promesa a David, y le pide que cumpla también la del trono para sus descendientes fieles."}
    - {v: 18-21, type: speech, entities: [event:oracion-de-salomon-en-la-inauguracion-del-templo], note: "Si ni el cielo de los cielos contiene a Dios, menos esta casa; aun así le pide que la vigile de día y de noche y que, desde el cielo, oiga y perdone."}
    - {v: 22-39, type: speech, entities: [event:oracion-de-salomon-en-la-inauguracion-del-templo], note: "Siete súplicas: el juramento ante el altar, la derrota, la sequía, el hambre y las plagas, el extranjero, la guerra y el cautiverio por el pecado. En cada caso pide que Jehová escuche y actúe."}
    - {v: 40-42, type: speech, entities: [event:oracion-de-salomon-en-la-inauguracion-del-templo], mentions: [person:david], note: "Pide a Jehová que suba a su lugar de descanso con el Arca y que no rechace a su ungido. Los v. 41 y 42 se parecen a Sal 132:8-10."}
  7:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-3, type: narration, entities: [event:baja-fuego-del-cielo-sobre-los-sacrificios-del-templo, person:salomon, place:monte-moria], mentions: [event:oracion-de-salomon-en-la-inauguracion-del-templo], note: "El fuego y la segunda vez que la gloria llena la casa solo los cuenta Crónicas; 1Re 8:54 pasa de la oración a la bendición. El pueblo dice que el amor leal de Jehová dura siempre."}
    - {v: 4-10, type: narration, entities: [event:inauguracion-del-templo-de-salomon, person:salomon, place:monte-moria], mentions: [person:david, place:lebo-hamat, place:torrente-de-egipto], note: "Siete días de inauguración del altar y siete de fiesta de las Cabañas, asamblea al octavo y despedida el día 23 del séptimo mes. Los instrumentos de los levitas los hizo David."}
    - {v: 11-12, type: narration, entities: [event:jehova-se-aparece-a-salomon-por-segunda-vez, person:salomon], mentions: [event:templo-de-salomon-terminado, event:salomon-construye-su-palacio], note: "Acabados el templo y el palacio, Jehová se aparece de noche a Salomón: ha oído su oración y ha elegido ese lugar como casa de sacrificio."}
    - {v: 13-16, type: speech, entities: [event:jehova-se-aparece-a-salomon-por-segunda-vez], note: "Si tras una sequía, una plaga de saltamontes o una epidemia el pueblo se humilla y ora, Jehová perdonará y sanará la tierra; su nombre estará en esa casa."}
    - {v: 17-22, type: speech, entities: [event:jehova-se-aparece-a-salomon-por-segunda-vez, relation:salomon/kin/david], mentions: [person:david, event:pacto-con-david, place:israel, place:egipto, event:exodo], note: "Si Salomón es fiel como David, su trono durará; si Israel sirve a otros dioses, será arrancado de la tierra y el templo quedará en ruinas."}
  8:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-2, type: narration, entities: [event:salomon-da-a-hiram-veinte-ciudades-de-galilea, event:salomon-construye-su-palacio, event:salomon-construye-ciudades-en-todo-su-reino, person:salomon, person:hiram-rey-de-tiro, relation:hiram-rey-de-tiro/tie/salomon], note: "Crónicas dice que Salomón reconstruyó las ciudades que Hiram le dio y puso en ellas israelitas. Perspicacia «Hiram» no sabe si Hiram le devolvió las de Cabul (1Re 9:10-13) u otras."}
    - {v: "3", type: narration, entities: [event:salomon-conquista-hamat-zoba, person:salomon, place:hamat-zoba]}
    - {v: 4-6, type: narration, entities: [event:salomon-construye-ciudades-en-todo-su-reino, person:salomon, place:tadmor, place:hamat, place:bet-horon-alta, place:bet-horon-baja, place:baalat, place:jerusalen, place:libano], mentions: [place:tamar], note: "Donde 1Re 9:18 lee Tamar, Crónicas lee Tadmor; Perspicacia «Tamar», núm. 4, las tiene por ciudades distintas. Las ciudades de almacenamiento de Hamat muestran que esa región quedó bajo Salomón."}
    - {v: 7-10, type: narration, entities: [event:salomon-construye-ciudades-en-todo-su-reino, person:salomon], note: "Hititas, amorreos, perizitas, heveos y jebuseos son pueblos, sin ficha. Los 250 jefes de 2Cr 8:10 y los 550 de 1Re 9:23 suman, con los de 2Cr 2:18 y 1Re 5:16, los mismos 3.850 (Perspicacia «Comisario»)."}
    - {v: "11", type: narration, entities: [event:salomon-construye-ciudades-en-todo-su-reino, person:salomon, place:jerusalen], mentions: [person:david, place:israel, event:salomon-se-casa-con-la-hija-del-faraon], note: "La hija del faraón, esposa de Salomón, no tiene nombre ni ficha. Sale de la Ciudad de David, nombre de Jerusalén, porque el Arca había estado allí."}
    - {v: 12-16, type: narration, entities: [event:salomon-organiza-el-servicio-del-templo, person:salomon, place:monte-moria, relation:salomon/kin/david], mentions: [person:moises, person:david, event:templo-de-salomon-terminado, journey:salomon-va-a-ezion-gueber, event:david-reparte-a-los-sacerdotes-en-24-turnos, event:david-organiza-a-los-levitas-en-divisiones, event:se-sortean-las-puertas-entre-los-porteros], note: "Las fiestas son la de los Panes Sin Levadura, la de las Semanas y la de las Cabañas. Los turnos siguen lo que David ordenó (1Cr 24-26), a quien el texto llama hombre del Dios verdadero."}
    - {v: 17-18, type: narration, entities: [event:flota-de-salomon-a-ofir, journey:salomon-va-a-ezion-gueber, person:salomon, person:hiram-rey-de-tiro, place:ezion-gueber, place:elat, place:ofir, relation:hiram-rey-de-tiro/tie/salomon], mentions: [place:edom], note: "Elot es Elat. El mar es el mar Rojo (1Re 9:26). Crónicas da 450 talentos y 1Re 9:28, 420; Perspicacia «Ofir» lo explica quizá como cantidad bruta y ganancia neta."}
  9:
    status: complete
    reviewed_on: 2026-10-13
    spans:
    - {v: 1-9, type: narration, entities: [event:la-reina-de-saba-visita-a-salomon, journey:la-reina-de-saba, person:salomon, place:jerusalen, place:reino-de-saba], note: "La reina no tiene nombre y no lleva ficha; la nota del v. 1 lee también Seba. Israel, al que Dios ama (v. 8), es el pueblo."}
    - {v: 10-11, type: narration, entities: [event:flota-de-salomon-a-ofir, person:salomon, person:hiram-rey-de-tiro, place:ofir, relation:hiram-rey-de-tiro/tie/salomon], mentions: [journey:salomon-va-a-ezion-gueber, place:monte-moria, place:juda], note: "Con el sándalo se hacen escaleras para el templo y el palacio, y arpas para los cantores."}
    - {v: "12", type: narration, entities: [event:la-reina-de-saba-visita-a-salomon, journey:la-reina-de-saba, person:salomon, place:reino-de-saba]}
    - {v: 13-20, type: narration, entities: [event:riqueza-de-salomon, person:salomon, place:jerusalen], mentions: [place:arabia, place:monte-moria], note: "Los reyes de los árabes son un pueblo, sin ficha. La Casa del Bosque del Líbano, donde se guardan los escudos, es un nombre de monte-moria."}
    - {v: "21", type: narration, entities: [event:las-naves-de-tarsis-traen-riquezas-a-salomon, person:salomon, person:hiram-rey-de-tiro, place:tarsis]}
    - {v: 22-28, type: narration, entities: [event:riqueza-de-salomon, person:salomon, place:jerusalen, place:sefela, relation:salomon/lived_in/jerusalen], mentions: [place:rio-eufrates, place:filistea, place:egipto], note: "El Río es el Éufrates, según la nota del v. 26. La tierra de los filisteos es Filistea."}
    - {v: 29-31, type: narration, entities: [event:muerte-de-salomon, person:salomon, person:rehoboam, person:natan-profeta, person:ahiya-profeta, person:ido-hombre-de-visiones, place:jerusalen, period:salomon, relation:salomon/lived_in/jerusalen, relation:salomon/died_in/jerusalen, relation:salomon/kin/david, relation:rehoboam/kin/salomon, relation:rehoboam/succeeds/salomon, relation:natan-profeta/holds_office/-, relation:ahiya-profeta/holds_office/-, relation:ahiya-profeta/lived_in/silo, relation:jeroboan-i/kin/nebat], mentions: [person:david, person:jeroboan-i, person:nebat, place:israel, place:silo], note: "La historia de Salomón quedó en las palabras de Natán, la profecía de Ahíya y las visiones de Idó, registros que consultó el compilador. La Ciudad de David es un nombre de Jerusalén."}
  10:
    status: complete
