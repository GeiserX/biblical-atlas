# biblical-earth: cobertura de un libro. Formato en data/coverage/README.md.
book: marcos
chapters:
  1:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-3, type: narration, entities: [person:jesus], mentions: [person:isaias], note: "Título del libro: buenas noticias sobre Jesucristo, Hijo de Dios. La cita junta Mal 3:1 e Is 40:3, según la nota de estudio, y presenta a Juan como el mensajero que abre camino."}
    - {v: 4-8, type: narration, entities: [event:juan-comienza-su-ministerio, person:juan-el-bautista, place:desierto-de-juda, place:judea, place:rio-jordan], mentions: [place:jerusalen], note: "El desierto es el de Judea (nota de estudio). Juan viste pelo de camello, come langostas y miel, y anuncia a uno más fuerte que bautizará con espíritu santo."}
    - {v: 9-11, type: narration, entities: [event:bautismo-de-jesus, person:jesus, person:juan-el-bautista, place:rio-jordan, place:nazaret, relation:jesus/lived_in/nazaret], mentions: [place:galilea], note: "Jesús llega desde Nazaret de Galilea. La voz del cielo es la primera de tres veces que los Evangelios dicen que se oyó a Jehová."}
    - {v: 12-13, type: narration, entities: [event:tentacion-en-el-desierto, person:jesus, person:satanas, place:desierto-de-juda], note: "Cuarenta días en el desierto, que la tabla A7-B llama de Judea. Solo Marcos menciona las fieras; los ángeles lo atienden."}
    - {v: 14-15, type: narration, entities: [event:anuncio-del-reino-en-galilea, person:jesus, place:galilea], mentions: [event:encarcelamiento-de-juan, person:juan-el-bautista], note: "Tras el arresto de Juan, Jesús predica en Galilea que el tiempo fijado llegó y el Reino está cerca. La tabla A7-C pone aquí estos versículos."}
    - {v: 16-20, type: narration, entities: [event:llamada-de-cuatro-pescadores, person:jesus, person:pedro, person:andres, person:santiago-hijo-de-zebedeo, person:juan-apostol, person:zebedeo, place:mar-de-galilea, relation:andres/kin/pedro, relation:pedro/disciple_of/jesus, relation:andres/disciple_of/jesus, relation:santiago-hijo-de-zebedeo/kin/juan-apostol, relation:santiago-hijo-de-zebedeo/kin/zebedeo, relation:santiago-hijo-de-zebedeo/disciple_of/jesus, relation:juan-apostol/kin/zebedeo, relation:juan-apostol/disciple_of/jesus], note: "Solo Marcos dice que Zebedeo se quedó en la barca con sus asalariados, señal de un negocio próspero."}
    - {v: 21-28, type: narration, entities: [event:curaciones-en-capernaum, person:jesus, place:capernaum], mentions: [place:nazaret, place:galilea], note: "Un sábado, en la sinagoga, Jesús enseña con autoridad y expulsa un espíritu impuro que lo llama Jesús el Nazareno y Santo de Dios. Su fama corre por Galilea."}
    - {v: 29-34, type: narration, entities: [event:curaciones-en-capernaum, person:jesus, person:pedro, person:andres, person:santiago-hijo-de-zebedeo, person:juan-apostol, person:suegra-de-pedro, relation:pedro/kin/suegra-de-pedro, relation:pedro/lived_in/capernaum, relation:andres/lived_in/capernaum, relation:suegra-de-pedro/lived_in/capernaum], note: "En casa de Simón y Andrés cura a la suegra de Simón. Al ponerse el sol, acabado el sábado, le llevan enfermos y endemoniados; no deja hablar a los demonios."}
    - {v: 35-39, type: narration, entities: [event:primera-gira-por-galilea, person:jesus, person:pedro, place:galilea], note: "Ora de madrugada en un lugar apartado; Simón y los demás lo buscan. Empieza la primera gira por las sinagogas de Galilea con los cuatro (nota de estudio)."}
    - {v: 40-45, type: narration, entities: [event:curacion-de-un-leproso, person:jesus], mentions: [person:moises], note: "El leproso, sin nombre, se arrodilla; Jesús lo toca por compasión y le manda ir al sacerdote con la ofrenda que fijó Moisés. Lo divulga y Jesús se queda fuera de las ciudades."}
  2:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-12, type: narration, entities: [event:curacion-de-un-paralitico, person:jesus, place:capernaum, relation:jesus/lived_in/capernaum], note: "En casa, en Capernaúm, cuatro hombres abren el techo y bajan al paralítico. Unos escribas piensan que Jesús blasfema; él cura al hombre para probar que el Hijo del Hombre perdona pecados."}
    - {v: 13-17, type: narration, entities: [event:llamada-de-mateo, person:jesus, person:mateo, person:alfeo-padre-de-mateo, place:mar-de-galilea, relation:mateo/kin/alfeo-padre-de-mateo, relation:mateo/disciple_of/jesus, relation:mateo/lived_in/capernaum], mentions: [person:alfeo-padre-de-santiago], note: "Marcos lo llama Leví, hijo de Alfeo; la nota de estudio dice que es Mateo y que este Alfeo no es el padre de Santiago. Come en casa de Leví con cobradores y pecadores."}
    - {v: 18-22, type: narration, entities: [event:llamada-de-mateo, person:jesus], mentions: [person:juan-el-bautista], note: "Preguntan por qué sus discípulos no ayunan como los de Juan y los fariseos. Jesús responde con el novio, el remiendo en la ropa vieja y el vino en odres."}
    - {v: 23-28, type: narration, entities: [event:espigas-en-sabado, person:jesus, person:abiatar], mentions: [person:david], note: "Jesús recuerda cuando David comió los panes sagrados (1Sa 21:1-6; lo cuenta Samuel, sin evento aún). La casa de Dios era el tabernáculo, entonces en Nob, que no tiene ficha."}
  3:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: narration, entities: [event:mano-paralizada-en-sabado, person:jesus], mentions: [person:herodes-antipas], note: "En una sinagoga sin nombre, en sábado. Fariseos y miembros del partido de Herodes, grupos sin ficha, se juntan para planear su muerte; la nota dice que es la primera de dos veces."}
    - {v: 7-12, type: narration, entities: [event:mano-paralizada-en-sabado, person:jesus, place:mar-de-galilea, place:galilea, place:judea, place:jerusalen, place:idumea, place:perea, place:tiro, place:sidon], mentions: [place:rio-jordan], note: "Se retira al mar y lo sigue gente de siete regiones. «Del otro lado del Jordán» es Perea según la nota. Los espíritus lo llaman Hijo de Dios y él les manda callar."}
    - {v: 13-15, type: narration, entities: [event:eleccion-de-los-doce, person:jesus], note: "La montaña no tiene nombre; la tabla A7-C la pone cerca de Capernaúm. Forma el grupo de los doce para que lo acompañen, prediquen y expulsen demonios."}
    - {v: 16-19, type: list, entities: [event:eleccion-de-los-doce, person:pedro, person:andres, person:santiago-hijo-de-zebedeo, person:juan-apostol, person:felipe-apostol, person:bartolome, person:mateo, person:tomas, person:santiago-hijo-de-alfeo, person:tadeo, person:simon-el-cananita, person:judas-iscariote, person:zebedeo, person:alfeo-padre-de-santiago, relation:pedro/disciple_of/jesus, relation:andres/disciple_of/jesus, relation:santiago-hijo-de-zebedeo/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus, relation:felipe-apostol/disciple_of/jesus, relation:bartolome/disciple_of/jesus, relation:mateo/disciple_of/jesus, relation:tomas/disciple_of/jesus, relation:santiago-hijo-de-alfeo/disciple_of/jesus, relation:tadeo/disciple_of/jesus, relation:simon-el-cananita/disciple_of/jesus, relation:judas-iscariote/disciple_of/jesus, relation:santiago-hijo-de-zebedeo/kin/zebedeo, relation:santiago-hijo-de-zebedeo/kin/juan-apostol, relation:santiago-hijo-de-alfeo/kin/alfeo-padre-de-santiago, relation:bartolome/same_as/natanael], note: "Boanerges, «hijos del trueno», es sobrenombre de Santiago y Juan. Según las notas, Bartolomé sería Natanael, Tadeo es Judas hijo de Santiago y este Alfeo no es el padre de Leví. El v. 19b abre el tramo siguiente."}
    - {v: 20-21, type: narration, entities: [event:pecado-sin-perdon, person:jesus], note: "Desde 3:19b. En una casa sin nombre la gente no los deja ni comer. Su familia, sin nombres, va a llevárselo creyéndolo loco; jy cap. 41 lo cuenta dentro de este suceso."}
    - {v: 22-30, type: speech, entities: [event:pecado-sin-perdon, person:jesus, person:satanas], mentions: [place:jerusalen], note: "Escribas bajados de Jerusalén dicen que expulsa demonios por Belcebú, nombre que la nota aplica a Satanás. Responde con el reino dividido y el hombre fuerte atado; la blasfemia contra el espíritu santo no se perdona."}
    - {v: 31-35, type: narration, entities: [event:madre-y-hermanos-lo-visitan, person:jesus, person:maria-madre-de-jesus, relation:jesus/kin/maria-madre-de-jesus], note: "Su madre y sus hermanos, sin nombres aquí (la nota remite a Mt 13:55 y Mr 6:3), lo llaman desde fuera. Su familia son quienes hacen la voluntad de Dios."}
  4:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:parabolas-del-reino, person:jesus, place:mar-de-galilea], note: "Enseña desde una barca a la multitud de la orilla. El texto no nombra el sitio; la tabla A7-D y el libro jy lo ponen junto a Capernaúm."}
    - {v: 3-9, type: speech, entities: [event:parabolas-del-reino], note: "Comparación del sembrador: la semilla cae junto al camino, en terreno rocoso, entre espinos y en tierra buena."}
    - {v: 10-20, type: speech, entities: [event:parabolas-del-reino, person:jesus], mentions: [person:satanas], note: "A solas con los Doce y otros, explica por qué usa comparaciones, con palabras de Is 6:9, 10 sin nombrar al profeta, y qué es cada terreno. Satanás solo sale en la explicación."}
    - {v: 21-25, type: speech, entities: [event:parabolas-del-reino], note: "La lámpara no se esconde bajo una canasta. Con la medida con que escuchen se les medirá a ellos."}
    - {v: 26-29, type: speech, entities: [event:parabolas-del-reino], note: "La semilla que crece sola mientras el sembrador duerme, hasta la siega. Según la nota, solo Marcos la recoge."}
    - {v: 30-34, type: speech, entities: [event:parabolas-del-reino, person:jesus], note: "El grano de mostaza. Siempre enseñaba con comparaciones y a sus discípulos se las explicaba en privado; la referencia remite a Sl 78:2."}
    - {v: 35-41, type: narration, entities: [event:calma-la-tormenta, person:jesus, place:mar-de-galilea], note: "El mismo día, al anochecer, cruzan con otras barcas. Jesús duerme en la popa sobre un cojín; lo despiertan y calma el viento y el mar. Los discípulos no se nombran."}
  5:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-13, type: narration, entities: [event:demonios-a-los-cerdos, person:jesus, place:gadara, place:mar-de-galilea], note: "Marcos habla de un solo endemoniado, sin nombre. Legión no es su nombre: indica que lo dominaban muchos demonios. La región de los gerasenos se apunta en Gadara, porque la nota de estudio la da por la misma zona."}
    - {v: 14-20, type: narration, entities: [event:demonios-a-los-cerdos, person:jesus, place:gadara, place:decapolis], note: "La gente pide a Jesús que se vaya. Él no deja que el curado lo siga: lo manda contar a los suyos lo que Jehová hizo por él, y el hombre lo anuncia por la Decápolis."}
    - {v: 21-24, type: narration, entities: [event:hija-de-jairo, person:jesus, person:jairo], mentions: [place:mar-de-galilea], note: "De vuelta en la otra orilla, Jairo, que preside una sinagoga, le ruega por su hija. Marcos no nombra la ciudad; A7-D la da como probablemente Capernaúm."}
    - {v: 25-34, type: narration, entities: [event:hija-de-jairo, person:jesus], note: "La mujer que llevaba 12 años sangrando no tiene nombre. Según la nota de estudio, es la única vez que consta que Jesús llamara «hija» a una mujer."}
    - {v: 35-43, type: narration, entities: [event:hija-de-jairo, person:jesus, person:jairo, person:pedro, person:santiago-hijo-de-zebedeo, person:juan-apostol, relation:santiago-hijo-de-zebedeo/kin/juan-apostol, relation:pedro/disciple_of/jesus, relation:santiago-hijo-de-zebedeo/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus], note: "La niña, de 12 años, y su madre no tienen nombre. Solo Marcos conserva las palabras arameas «Tálitha cúmi» y su traducción."}
  6:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-6, type: narration, entities: [event:rechazado-otra-vez-en-nazaret, event:jesus-crece-en-nazaret, event:tercera-gira-y-envio-de-los-doce, person:jesus, person:maria-madre-de-jesus, person:santiago-hermano-de-jesus, person:jose-hijo-de-jose, person:judas-hermano-de-jesus, person:simon-hijo-de-jose, place:nazaret, relation:jesus/kin/maria-madre-de-jesus, relation:jesus/kin/santiago-hermano-de-jesus, relation:jesus/kin/jose-hijo-de-jose, relation:jesus/kin/judas-hermano-de-jesus, relation:jesus/kin/simon-hijo-de-jose, relation:jesus/lived_in/nazaret, relation:santiago-hermano-de-jesus/kin/maria-madre-de-jesus, relation:santiago-hermano-de-jesus/kin/jose-esposo-de-maria, relation:santiago-hermano-de-jesus/kin/jose-hijo-de-jose, relation:santiago-hermano-de-jesus/kin/simon-hijo-de-jose, relation:santiago-hermano-de-jesus/kin/judas-hermano-de-jesus, relation:jose-hijo-de-jose/kin/jose-esposo-de-maria, relation:jose-hijo-de-jose/kin/maria-madre-de-jesus, relation:simon-hijo-de-jose/kin/jose-esposo-de-maria, relation:simon-hijo-de-jose/kin/maria-madre-de-jesus, relation:judas-hermano-de-jesus/kin/maria-madre-de-jesus, relation:judas-hermano-de-jesus/kin/jose-esposo-de-maria], note: "«Su tierra» es Nazaret. Solo aquí llaman a Jesús «el hijo de María»; la nota cree que José quizá ya había muerto. Las hermanas no tienen nombre. En 6:6 empieza la tercera gira por Galilea."}
    - {v: 7-13, type: narration, entities: [event:tercera-gira-y-envio-de-los-doce, person:jesus], note: "Jesús manda a los Doce de dos en dos, sin provisiones y con autoridad sobre los demonios; predican, expulsan demonios y curan ungiendo con aceite. Aquí Marcos no da sus nombres."}
    - {v: 14-16, type: narration, entities: [event:muerte-de-juan-el-bautista, person:herodes-antipas, person:juan-el-bautista], mentions: [person:jesus, person:elias-profeta], note: "Marcos llama rey a Herodes Antipas, como hacía el pueblo, aunque era tetrarca de Galilea y Perea. Unos toman a Jesús por Juan resucitado, otros por Elías o por un profeta."}
    - {v: 17-20, type: narration, entities: [event:encarcelamiento-de-juan, person:herodes-antipas, person:juan-el-bautista, person:herodias, person:filipo-esposo-de-herodias, relation:herodes-antipas/kin/herodias, relation:herodes-antipas/kin/filipo-esposo-de-herodias, relation:filipo-esposo-de-herodias/kin/herodias], note: "Recuerdo de la prisión de Juan. Herodías quería matarlo; Herodes lo protegía porque lo sabía justo y santo, y le gustaba oírlo aunque lo dejaba confundido."}
    - {v: 21-29, type: narration, entities: [event:muerte-de-juan-el-bautista, person:herodes-antipas, person:herodias, person:salome-hija-de-filipo, person:juan-el-bautista, place:tiberiades, relation:salome-hija-de-filipo/kin/herodias, relation:salome-hija-de-filipo/kin/filipo-esposo-de-herodias, relation:salome-hija-de-filipo/kin/herodes-antipas, relation:juan-el-bautista/died_in/tiberiades, relation:herodes-antipas/lived_in/tiberiades], mentions: [place:galilea], note: "Marcos no nombra a la hija de Herodías ni el sitio: la nota de 6:22 la llama Salomé y la de 6:21 pone la cena probablemente en Tiberíades. Un guardia decapita a Juan; sus discípulos lo entierran."}
    - {v: 30-44, type: narration, entities: [event:alimenta-a-5000, person:jesus], note: "Los apóstoles vuelven y cruzan en barca a un lugar retirado que Marcos no nombra; A7-D lo pone en el lado noreste del mar de Galilea. Con cinco panes y dos pescados comen 5.000 hombres."}
    - {v: 45-52, type: narration, entities: [event:camina-sobre-el-mar, person:jesus, place:mar-de-galilea, place:betsaida], note: "Los discípulos salen en la barca «hacia Betsaida». Perspicacia «Betsaida» entiende que bordearon la costa rumbo a Capernaúm, sin otra Betsaida. Marcos no cuenta que Pedro anduviera sobre el agua."}
    - {v: 53-56, type: narration, entities: [event:camina-sobre-el-mar, person:jesus, place:genesaret], note: "Al desembarcar en Genesaret lo reconocen; le llevan enfermos en camillas a aldeas, ciudades y campos, y sanan quienes tocan el borde de su manto."}
  7:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-13, type: narration, entities: [event:tradiciones-humanas, person:jesus], mentions: [place:jerusalen, person:isaias, person:moises], note: "Fariseos y escribas llegados de Jerusalén, grupos sin ficha, reprochan que los discípulos coman sin el lavado ritual. Jesús cita a Isaías y a Moisés y denuncia la costumbre del corbán."}
    - {v: 14-23, type: narration, entities: [event:tradiciones-humanas, person:jesus], note: "Ante la multitud y luego en una casa sin nombre, Jesús explica que contamina lo que sale del corazón. El versículo 16 no está en la TNM."}
    - {v: 24-30, type: narration, entities: [event:sirofenicia-y-4000, person:jesus, place:tiro, place:sidon, place:fenicia], mentions: [place:siria], note: "La madre y la niña no tienen nombre. Era griega y sirofenicia; la nota de estudio explica que Fenicia pertenecía entonces a la provincia romana de Siria."}
    - {v: 31-37, type: narration, entities: [event:sirofenicia-y-4000, person:jesus, place:decapolis, place:mar-de-galilea], mentions: [place:tiro, place:sidon], note: "Vuelve por Sidón y la Decápolis hacia el lago. Solo Marcos cuenta la curación del sordo con dificultades para hablar, al que dice «Éffatha»; el hombre no tiene nombre."}
  8:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: narration, entities: [event:sirofenicia-y-4000, person:jesus, place:decapolis], note: "En un lugar apartado que el texto no nombra, y que Perspicacia «Decápolis» pone en esa región, siete panes y unos pescaditos alimentan a unos 4.000 hombres; sobran siete canastas grandes."}
    - {v: 10-12, type: narration, entities: [event:senal-de-jonas-en-magadan, person:jesus, place:magadan], note: "Marcos dice Dalmanuta; su nota ve posible que fuera otro nombre de Magadán, el sitio del relato de Mateo. Aquí solo piden la señal los fariseos, grupo sin ficha, y Jesús responde que esa generación no recibirá ninguna."}
    - {v: 13-21, type: narration, entities: [event:levadura-y-ciego-de-betsaida, person:jesus], mentions: [person:herodes-antipas, event:alimenta-a-5000, event:sirofenicia-y-4000], note: "Deja a los fariseos y vuelve a cruzar el lago, con un solo pan en la barca. La levadura de Herodes es la de Antipas y su partido, según Perspicacia «Herodes»; él no está en la escena."}
    - {v: 22-26, type: narration, entities: [event:levadura-y-ciego-de-betsaida, person:jesus, place:betsaida], note: "Solo Marcos cuenta esta curación en dos pasos, fuera de la aldea. El ciego no tiene nombre."}
    - {v: 27-30, type: narration, entities: [event:llaves-del-reino, person:jesus, person:pedro, place:cesarea-de-filipo], mentions: [person:juan-el-bautista, person:elias-profeta], note: "Rumbo a las aldeas de Cesarea de Filipo. La gente lo toma por Juan el Bautista, por Elías o por algún profeta; Pedro lo llama el Cristo."}
    - {v: 31-33, type: narration, entities: [event:llaves-del-reino, person:jesus, person:pedro], note: "Primer anuncio de su muerte y resurrección. Al llamar «Satanás» a Pedro, Jesús lo reprende como a un opositor; Satanás no actúa en la escena."}
    - {v: 34-38, type: speech, entities: [event:llaves-del-reino, person:jesus], note: "A la multitud y a los discípulos: quien quiera seguirlo debe renunciar a sí mismo y cargar su madero de tormento."}
  9:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:llaves-del-reino, person:jesus], note: "Cierra la escena de Cesarea de Filipo (Mr 8:27): algunos de los presentes verán el Reino llegar con poder antes de morir. Perspicacia «Transfiguración» lo da por cumplido seis días después."}
    - {v: 2-8, type: narration, entities: [event:transfiguracion, place:monte-de-la-transfiguracion, person:jesus, person:pedro, person:santiago-hijo-de-zebedeo, person:juan-apostol, relation:pedro/disciple_of/jesus, relation:santiago-hijo-de-zebedeo/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus], mentions: [person:elias-profeta, person:moises], note: "Elías y Moisés se aparecen hablando con Jesús, pero Perspicacia «Transfiguración» dice que se les vio en visión y no estaban allí en persona; por eso solo se mencionan. La nota de 9:2 apunta al Hermón."}
    - {v: 9-13, type: narration, entities: [event:transfiguracion, person:jesus], mentions: [person:elias-profeta, person:juan-el-bautista], note: "Al bajar, Jesús les manda callar hasta que resucite. Dice que Elías ya vino y lo maltrataron; Marcos no nombra a Juan el Bautista, pero las referencias remiten a Mt 17:12, 13, que sí lo hace."}
    - {v: 14-29, type: narration, entities: [event:cura-al-muchacho-endemoniado, person:jesus], note: "El padre y el muchacho no tienen nombre. La tabla A7-E pone la curación por Cesarea de Filipo. Los versículos 28 y 29 pasan en una casa que el texto no sitúa."}
    - {v: 30-32, type: narration, entities: [event:segundo-anuncio-de-su-muerte, person:jesus, place:galilea]}
    - {v: 33-37, type: narration, entities: [event:el-mayor-en-el-reino, person:jesus, place:capernaum], note: "En la casa de Capernaúm Jesús pregunta qué discutían por el camino. Llama a los Doce y abraza a un niño como ejemplo de quien sirve."}
    - {v: 38-41, type: narration, entities: [event:el-mayor-en-el-reino, person:juan-apostol, person:jesus, relation:juan-apostol/disciple_of/jesus], note: "Juan cuenta que frenaron a un hombre sin nombre que expulsaba demonios usando el nombre de Jesús. Jesús les dice que no se lo impidan."}
    - {v: 42-50, type: speech, entities: [event:el-mayor-en-el-reino, person:jesus], mentions: [place:valle-de-hinon], note: "Aviso contra hacer tropezar a los pequeños. La Gehena, el valle de Hinón, representa la destrucción completa (nota de 9:48). Los versículos 44 y 46 no están en la TNM."}
  10:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-9, type: narration, entities: [event:matrimonio-y-divorcio, person:jesus, place:perea], mentions: [place:judea, place:rio-jordan, person:moises], note: "Según la nota de 10:1, el texto habla de Perea, en su parte vecina de Judea. Unos fariseos lo prueban con el divorcio; Jesús cita la creación sin nombrar a la primera pareja."}
    - {v: 10-12, type: narration, entities: [event:matrimonio-y-divorcio, person:jesus], note: "Ya en la casa, los discípulos vuelven a preguntar. Jesús dice que quien se divorcia y se casa con otro comete adulterio, sea el hombre o la mujer."}
    - {v: 13-16, type: narration, entities: [event:bendice-a-unos-ninos, person:jesus, place:perea], note: "Solo Marcos cuenta que Jesús se indignó con los discípulos y tomó a los niños en brazos para bendecirlos."}
    - {v: 17-22, type: narration, entities: [event:joven-rico-y-trabajadores-de-la-vina, person:jesus], note: "El hombre rico no tiene nombre en el texto y no lleva ficha. Solo Marcos dice que Jesús sintió cariño por él."}
    - {v: 23-31, type: narration, entities: [event:joven-rico-y-trabajadores-de-la-vina, person:jesus, person:pedro, relation:pedro/disciple_of/jesus], note: "El camello y el ojo de la aguja es una hipérbole, según la nota de 10:25. Pedro dice que lo han dejado todo; Jesús promete cien veces más, con persecuciones."}
    - {v: 32-34, type: narration, entities: [event:tercer-anuncio-de-su-muerte, person:jesus, place:perea], mentions: [place:jerusalen], note: "Suben desde el valle del Jordán hacia Jerusalén (nota de 10:32); la tabla A7-F pone la escena probablemente en Perea."}
    - {v: 35-45, type: narration, entities: [event:peticion-de-santiago-y-juan, person:jesus, person:santiago-hijo-de-zebedeo, person:juan-apostol, place:perea, relation:santiago-hijo-de-zebedeo/kin/juan-apostol, relation:santiago-hijo-de-zebedeo/kin/zebedeo, relation:juan-apostol/kin/zebedeo, relation:santiago-hijo-de-zebedeo/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus], mentions: [person:zebedeo], note: "Marcos no nombra a la madre. La nota de 10:35 explica que en Mateo pide ella, pero la idea parece de los hijos, porque los otros diez se enfadan con los dos hermanos."}
    - {v: 46-52, type: narration, entities: [event:jerico-ciegos-zaqueo-y-minas, person:jesus, person:bartimeo, person:timeo, place:jerico, relation:bartimeo/kin/timeo, relation:bartimeo/accompanies/jesus, relation:jesus/kin/david, relation:jesus/lived_in/nazaret], mentions: [person:david, place:nazaret], note: "Mateo habla de dos ciegos; Marcos se fija en uno y es el único que da su nombre (nota de 10:46). Bartimeo llama a Jesús Rabbóni, mi maestro."}
  11:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-10, type: narration, entities: [event:entrada-triunfal-en-jerusalen, person:jesus, place:jerusalen, place:monte-de-los-olivos, place:betfague, place:betania], mentions: [person:david], note: "Dos discípulos traen de la aldea un burrito que nadie había montado. Marcos, Lucas y Juan hablan de un solo animal; Mateo añade la burra (nota de 11:2). El clamor «Salva, rogamos» viene del Sl 118:25, 26."}
    - {v: "11", type: narration, entities: [event:entrada-triunfal-en-jerusalen, event:noche-en-betania-10-de-nisan, person:jesus, place:jerusalen, place:monte-moria, place:betania], note: "Ya en la ciudad, recorre el templo con la mirada y, por lo avanzado de la hora, vuelve a Betania con los Doce. Con esa tarde empieza el 10 de nisán (B12-A)."}
    - {v: 12-14, type: narration, entities: [event:higuera-maldita-y-limpieza-del-templo, person:jesus, place:betania], note: "Saliendo de Betania el 10 de nisán, busca fruto en una higuera frondosa y no lo halla. Según la nota del v. 13, sus hojas anunciaban higos tempranos que no había; la maldice."}
    - {v: 15-17, type: narration, entities: [event:higuera-maldita-y-limpieza-del-templo, person:jesus, place:jerusalen, place:monte-moria], note: "Echa a vendedores y cambistas. Solo Marcos cuenta que impidió usar el templo como atajo con mercancías, y solo él cita Is 56:7 con «para todas las naciones» (notas de 11:16, 17)."}
    - {v: 18-19, type: narration, entities: [event:planean-matarlo-10-de-nisan, person:jesus, place:jerusalen], note: "Sacerdotes principales y escribas buscan cómo matarlo, pero temen a la gente. Al atardecer salen de la ciudad; la nota del v. 19 cree que durmió en Betania, quizá con Lázaro, Marta y María."}
    - {v: 20-25, type: narration, entities: [event:leccion-de-la-higuera-seca, person:jesus, person:pedro, relation:pedro/disciple_of/jesus], note: "La mañana del 11 de nisán, Pedro llama «Rabí» a Jesús y le señala la higuera seca de raíz. Jesús enseña a orar con fe y a perdonar. La TNM no incluye el v. 26."}
    - {v: 27-33, type: narration, entities: [event:cuestionan-su-autoridad, person:jesus, person:juan-el-bautista, place:jerusalen, place:monte-moria], note: "En el templo, sacerdotes principales, escribas y ancianos le piden cuentas. Él pregunta si el bautismo de Juan era del cielo; ellos, que temen a la gente porque tenía a Juan por profeta, no contestan."}
  12:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-11, type: speech, entities: [event:agricultores-asesinos-y-banquete-de-boda, person:jesus], note: "Parábola de la viña arrendada: los agricultores maltratan a los esclavos del dueño y matan a su hijo amado. Jesús la cierra con Sl 118:22, 23, la piedra desechada. Sus personajes no llevan ficha."}
    - {v: "12", type: narration, entities: [event:agricultores-asesinos-y-banquete-de-boda, person:jesus], note: "Sus enemigos entienden que la parábola va por ellos. Quieren prenderlo, pero el miedo a la multitud los frena y se marchan."}
    - {v: 13-17, type: narration, entities: [event:cesar-resurreccion-y-mandamiento, person:jesus], mentions: [person:tiberio, person:herodes-antipas], note: "Fariseos y miembros del partido de Herodes preguntan por el tributo. La nota de 12:16 remite a la de Mt 22:20: el denario llevaba la cara de Tiberio. Perspicacia sitúa ese partido bajo Herodes Antipas."}
    - {v: 18-27, type: narration, entities: [event:cesar-resurreccion-y-mandamiento, person:jesus], mentions: [person:moises, person:abrahan, person:isaac, person:jacob, event:moises-ante-la-zarza-ardiente], note: "Los saduceos, única vez que Marcos los nombra, plantean el caso de siete hermanos casados con una viuda. Jesús responde con Éx 3:6, el relato de la zarza."}
    - {v: 28-34, type: narration, entities: [event:cesar-resurreccion-y-mandamiento, person:jesus], note: "Un escriba pregunta por el primer mandamiento. Jesús cita la shemá (Dt 6:4, 5) y Le 19:18; el escriba lo aprueba y oye que no está lejos del Reino. Nadie se atreve a preguntar más."}
    - {v: 35-37, type: narration, entities: [event:hijo-de-david, person:jesus, place:monte-moria, relation:jesus/kin/david], mentions: [person:david], note: "Enseñando en el templo, pregunta cómo el Cristo es hijo de David si David, movido por el espíritu, lo llama Señor en el Sl 110:1. La multitud lo escucha con gusto."}
    - {v: 38-40, type: speech, entities: [event:denuncia-a-escribas-y-fariseos, person:jesus], note: "Advierte contra los escribas que buscan saludos, asientos de honor y largas oraciones de apariencia mientras se quedan con los bienes de las viudas."}
    - {v: 41-44, type: narration, entities: [event:donativo-de-la-viuda, person:jesus, place:monte-moria], note: "Junto a las arcas del tesoro, que la nota del v. 41 pone en el Patio de las Mujeres, una viuda pobre echa dos leptones, todo su sustento. La viuda no tiene nombre."}
  13:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:senal-de-su-presencia, person:jesus, place:monte-moria, event:destruccion-de-jerusalen-70], note: "Al dejar el templo, un discípulo sin nombre admira sus piedras y Jesús anuncia que no quedará piedra sobre piedra. La nota remite a la de Mt 24:2: se cumplió cuando Roma arrasó Jerusalén en 70."}
    - {v: 3-4, type: narration, entities: [event:senal-de-su-presencia, place:monte-de-los-olivos, person:pedro, person:santiago-hijo-de-zebedeo, person:juan-apostol, person:andres, relation:pedro/disciple_of/jesus, relation:santiago-hijo-de-zebedeo/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus, relation:andres/disciple_of/jesus], note: "Sentado en el monte de los Olivos, frente al templo, cuatro discípulos que Marcos nombra le preguntan aparte cuándo pasará aquello y qué señal lo anunciará."}
    - {v: 5-13, type: prophecy, note: "Rasgos de la señal: impostores que dicen ser el Cristo, guerras, terremotos y hambres; los discípulos serán llevados ante tribunales, gobernadores y reyes, y antes se predicarán las buenas noticias en todas las naciones."}
    - {v: 14-20, type: prophecy, entities: [place:judea, event:revuelta-judia-66, event:destruccion-de-jerusalen-70], note: "Al ver la cosa repugnante donde no debe estar, los de Judea han de huir a las montañas. Las notas remiten a Mt 24:15, 16: el cerco romano de 66 y la destrucción de 70."}
    - {v: 21-23, type: prophecy, note: "Aviso contra falsos cristos y falsos profetas que harán prodigios para engañar, si pudieran, a los escogidos."}
    - {v: 24-27, type: prophecy, note: "Tras la tribulación se oscurecen el sol y la luna; el Hijo del Hombre llega en las nubes y sus ángeles reúnen a los escogidos de los cuatro vientos."}
    - {v: 28-31, type: speech, note: "Comparación de la higuera: cuando brotan sus hojas se sabe que el verano llega. Esa generación verá todo esto y sus palabras no pasarán."}
    - {v: 32-37, type: speech, note: "Solo el Padre conoce el día y la hora. Comparación del amo que se va de viaje y deja al portero de guardia; las cuatro vigilias de la noche piden estar despiertos. Sus personajes no son personas."}
  14:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: 1-2, type: narration, entities: [event:planean-matarlo-12-de-nisan, person:jesus, place:jerusalen], note: "Dos días antes de la Pascua (12 de nisán, según la nota), sacerdotes principales y escribas buscan cómo prenderlo con engaño, pero no en la fiesta. Marcos no nombra a Caifás."}
    - {v: 3-9, type: narration, entities: [event:maria-unge-a-jesus, person:jesus, person:simon-el-leproso, person:maria-de-betania, place:betania, relation:simon-el-leproso/lived_in/betania], note: "Marcos no da el nombre de la mujer; su nota remite a la de Mt 26:7, que la identifica con María por Jn 12:3. La nota del versículo 3 pone la cena al empezar el 9 de nisán."}
    - {v: 10-11, type: narration, entities: [event:judas-acuerda-la-traicion, person:judas-iscariote, place:jerusalen, relation:judas-iscariote/disciple_of/jesus], mentions: [person:jesus], note: "Según la nota del versículo 10, el trato con los sacerdotes fue el 12 de nisán, el mismo día de los versículos 1 y 2."}
    - {v: 12-16, type: narration, entities: [event:preparativos-de-la-pascua, person:jesus, place:jerusalen], note: "Marcos no nombra a los dos discípulos que envía ni al hombre del cántaro ni al dueño de la casa; Lu 22:8 da Pedro y Juan. Fue la tarde del 13 de nisán, según la nota."}
    - {v: 17-21, type: narration, entities: [event:ultima-pascua, event:despide-a-judas, person:jesus, person:judas-iscariote, place:jerusalen], note: "Al caer la tarde, ya 14 de nisán, cenan con los Doce. Jesús dice que lo traicionará uno que moja el pan con él en la fuente; Marcos no lo nombra aquí."}
    - {v: 22-26, type: narration, entities: [event:cena-del-senor, event:arresto-en-getsemani, person:jesus, place:jerusalen, place:monte-de-los-olivos], note: "Pan y copa como símbolos de su cuerpo y de la sangre del pacto. El versículo 26, la salida al monte de los Olivos tras cantar, abre el suceso de Getsemaní, que lo cita."}
    - {v: 27-31, type: narration, entities: [event:predice-las-negaciones-de-pedro, person:jesus, person:pedro], mentions: [place:galilea], note: "Jesús cita Zac 13:7 y promete ir a Galilea tras resucitar. Marcos es el único que habla de dos cantos del gallo antes de las tres negaciones."}
    - {v: 32-42, type: narration, entities: [event:arresto-en-getsemani, person:jesus, person:pedro, person:santiago-hijo-de-zebedeo, person:juan-apostol, place:getsemani, relation:pedro/disciple_of/jesus, relation:santiago-hijo-de-zebedeo/disciple_of/jesus, relation:juan-apostol/disciple_of/jesus], note: "Se aparta con Pedro, Santiago y Juan y ora tres veces llamando a Dios «Abba, Padre»; ellos se duermen. A Pedro lo llama Simón."}
    - {v: 43-50, type: narration, entities: [event:arresto-en-getsemani, person:judas-iscariote, person:jesus, person:pedro, person:malco, place:getsemani], mentions: [place:monte-moria], note: "Judas lo besa como señal y lo detienen. Marcos no nombra a quien saca la espada ni al esclavo herido; la nota del versículo 47 da a Pedro y Malco por Jn 18:10. Todos huyen."}
    - {v: 51-52, type: narration, entities: [event:arresto-en-getsemani, person:juan-marcos], note: "Un joven vestido solo con una prenda de lino huye desnudo. Solo Marcos lo cuenta; la nota y Perspicacia «Marcos» creen probable que fuera el propio escritor, sin darlo por seguro."}
    - {v: 53-65, type: narration, entities: [event:juicio-ante-el-sanedrin, person:jesus, person:caifas, period:sumo-sacerdocio-de-caifas, person:pedro, place:jerusalen, relation:caifas/lived_in/jerusalen], mentions: [place:monte-moria], note: "Marcos no nombra al sumo sacerdote; la nota del versículo 53 dice que era Caifás. Solo Marcos señala que ni los testigos falsos coincidían. Jesús dice que es el Cristo y lo condenan."}
    - {v: 66-72, type: narration, entities: [event:juicio-ante-el-sanedrin, person:pedro, person:jesus, relation:pedro/disciple_of/jesus, relation:pedro/lived_in/galilea, relation:jesus/lived_in/nazaret], mentions: [place:galilea, place:nazaret], note: "En el patio, una sirvienta lo liga al Nazareno y otros lo delatan por galileo. Niega tres veces, el gallo canta por segunda vez y Pedro llora."}
  15:
    status: complete
    reviewed_on: 2026-09-29
    spans:
    - {v: "1", type: narration, entities: [event:juicio-ante-el-sanedrin, event:ante-pilato-y-herodes, person:jesus, person:poncio-pilato, period:gobierno-de-poncio-pilato, find:inscripcion-de-poncio-pilato], note: "Al amanecer, todo el Sanedrín decide y entrega a Jesús atado a Pilato. La nota de estudio recuerda que Tiberio lo nombró en 26 y la piedra hallada en Cesarea que lo llama prefecto."}
    - {v: 2-5, type: narration, entities: [event:ante-pilato-y-herodes, person:jesus, person:poncio-pilato], note: "Jesús acepta que es el rey de los judíos y después calla ante las acusaciones, y Pilato se asombra. «Rey de los judíos» es un título, sin ficha."}
    - {v: 6-15, type: narration, entities: [event:sentencia-y-barrabas, person:barrabas, person:poncio-pilato, person:jesus], note: "La costumbre de soltar un preso en la fiesta no sale de las Escrituras Hebreas (nota del v. 6). Pilato pregunta tres veces; los sacerdotes, por envidia, hacen pedir a Barrabás."}
    - {v: 16-19, type: narration, entities: [event:sentencia-y-barrabas, person:jesus], note: "En el patio de la residencia del gobernador, la tropa lo viste de púrpura, le pone una corona de espinas y se burla de él. La residencia no lleva ficha propia."}
    - {v: 20-21, type: narration, entities: [event:muerte-de-jesus, person:jesus, person:simon-de-cirene, person:alejandro-hijo-de-simon, person:rufo-hijo-de-simon, place:cirene, relation:simon-de-cirene/born_in/cirene, relation:alejandro-hijo-de-simon/kin/simon-de-cirene, relation:alejandro-hijo-de-simon/kin/rufo-hijo-de-simon, relation:rufo-hijo-de-simon/kin/simon-de-cirene], note: "Simón volvía del campo y lo obligan a cargar el madero. Solo Marcos añade que era padre de Alejandro y Rufo (nota del v. 21)."}
    - {v: 22-32, type: narration, entities: [event:muerte-de-jesus, person:jesus, place:golgota], mentions: [place:monte-moria], note: "Gólgota significa «lugar de la calavera». Rechaza el vino con mirra y lo clavan hacia las 9 de la mañana (nota del v. 25). Los dos ladrones no tienen nombre. La TNM no incluye el v. 28."}
    - {v: 33-39, type: narration, entities: [event:muerte-de-jesus, person:jesus, relation:jesus/died_in/golgota], mentions: [person:elias-profeta, place:monte-moria], note: "Tres horas de oscuridad desde el mediodía; no fue un eclipse, porque en la Pascua había luna llena (nota del v. 33). Se rasga la cortina del santuario. El oficial del ejército no tiene nombre."}
    - {v: 40-41, type: narration, entities: [event:muerte-de-jesus, person:maria-magdalena, person:maria-esposa-de-clopas, person:santiago-hijo-de-alfeo, person:joses, person:salome-discipula, relation:maria-magdalena/disciple_of/jesus, relation:maria-esposa-de-clopas/disciple_of/jesus, relation:salome-discipula/disciple_of/jesus, relation:joses/kin/maria-esposa-de-clopas, relation:santiago-hijo-de-alfeo/kin/maria-esposa-de-clopas, relation:santiago-hijo-de-alfeo/kin/joses, relation:santiago-hijo-de-zebedeo/kin/salome-discipula, relation:juan-apostol/kin/salome-discipula], mentions: [place:galilea, place:jerusalen, person:santiago-hijo-de-zebedeo, person:juan-apostol], note: "Miran de lejos las mujeres que lo servían en Galilea y otras que subieron con él a Jerusalén. La nota del v. 40 ve probable que Salomé fuera la madre de los hijos de Zebedeo."}
    - {v: 42-47, type: narration, entities: [event:entierro-de-jesus, person:jesus, person:jose-de-arimatea, place:arimatea, relation:jose-de-arimatea/lived_in/arimatea, person:poncio-pilato, person:maria-magdalena, person:maria-esposa-de-clopas], mentions: [person:joses], note: "Es el día de la preparación, 14 de nisán (nota del v. 42). Pilato comprueba con el oficial que Jesús ha muerto. José, miembro del Sanedrín, compra lino y cierra la tumba con una piedra."}
  16:
    status: complete
    reviewed_on: 2026-09-29
    note: "Los manuscritos más antiguos acaban en el v. 8. Las conclusiones corta y larga de otros manuscritos no son inspiradas (nota del v. 8), así que no se apuntan."
    spans:
    - {v: "1", type: narration, entities: [event:compran-especias, person:maria-magdalena, person:maria-esposa-de-clopas, person:salome-discipula], mentions: [person:jesus, person:santiago-hijo-de-alfeo], note: "Cuando acaba el sábado del 15 de nisán, con la puesta del sol, las tres compran especias para el cuerpo (nota del v. 1). La madre de Santiago el Menor es la esposa de Clopas."}
    - {v: 2-8, type: narration, entities: [event:resurreccion-de-jesus, person:jesus, person:maria-magdalena, person:maria-esposa-de-clopas, person:salome-discipula, person:pedro], mentions: [place:galilea, place:nazaret], note: "El primer día de la semana hallan la piedra quitada. Un joven vestido de blanco, un ángel sin nombre, anuncia la resurrección y manda avisar a los discípulos y a Pedro. Nazareno, por Nazaret."}
