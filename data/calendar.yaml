# La explicación del calendario para la página «El calendario»: hechos cortos, cada uno con su fuente.
explanation:
- id: mes-lunar
  title: El mes lunar
  text: 'Cada mes empezaba con la luna nueva y duraba 29 o 30 días (Isa 66:23). La palabra hebrea para «mes» viene de la idea de «nuevo». En la Biblia, un mes suele contar 30 días.'
  sources: [it-calendario]
  reason: 'Perspicacia «Calendario», párr. 5 de la introducción y párr. 2 y 5 del apartado «Calendario hebreo».'
  checked_on: '2026-09-28'
  status: verified
- id: mes-anadido
  title: El mes que se añadía
  text: 'Doce meses lunares suman unos 11 días menos que el año del sol. Para que las fiestas no se alejaran de sus cosechas, algunos años llevaban un mes decimotercero, que tras el exilio se llamó Veadar.'
  sources: [it-calendario, it-nisan]
  reason: 'Perspicacia «Calendario», párr. 6 de la introducción y párr. 1 y 3 del apartado «Calendario hebreo»; «Nisán», párr. 3.'
  checked_on: '2026-09-28'
  status: verified
- id: ciclo-de-19-anos
  title: Cuándo se añadía
  text: 'La Biblia no dice cómo decidían qué año llevaba el mes de más; quizá miraban los equinoccios. El primer calendario judío fijo que se conoce, con siete meses añadidos cada 19 años, es de hacia 359 e.c.'
  sources: [it-calendario, tnm-b15, it-anio]
  reason: 'Perspicacia «Calendario», apartado «Calendario hebreo», párr. 3 y 4; B15, columna de Veadar; «Año», párr. 5 y 6.'
  checked_on: '2026-09-28'
  status: verified
- id: anio-sagrado
  title: El año sagrado
  text: 'En el éxodo, Jehová mandó que el año empezara en primavera, con el mes de Abib, luego llamado Nisán (Éx 12:2; 13:4). Por ese año se contaban las fiestas: la Pascua caía el 14 de Nisán.'
  sources: [it-anio, it-calendario, it-nisan]
  reason: 'Perspicacia «Año», párr. 8 y 10; Perspicacia «Calendario», apartado «Calendario hebreo», párr. 10; «Nisán», párr. 4.'
  checked_on: '2026-09-28'
  status: verified
- id: anio-civil
  title: El año civil o agrícola
  text: 'El año del campo siguió empezando en otoño, con Etanim, luego Tisri (Éx 23:16). Así, el primer mes de un calendario era el séptimo del otro. La doble cuenta se nota sobre todo después del exilio.'
  sources: [it-anio, it-etanim]
  reason: 'Perspicacia «Año», párr. 8 y 9, y «Etanim», párr. 3 y 4.'
  checked_on: '2026-09-28'
  status: verified
- id: antes-del-exodo
  title: Antes del éxodo
  text: 'Hasta el éxodo el año se contaba de otoño a otoño y empezaba a mediados de nuestro septiembre, al acabar las cosechas. En tiempos de Noé el año tenía 12 meses de 30 días (Gé 7:11, 24).'
  sources: [it-anio, it-calendario, it-nisan]
  reason: 'Perspicacia «Año», párr. 3 y 7; Perspicacia «Calendario», párr. 3 de la introducción; «Nisán», párr. 1: Abib era antes el séptimo mes.'
  checked_on: '2026-09-28'
  status: verified
- id: nombres-por-epoca
  title: Los nombres cambian con la época
  text: 'Antes del exilio la Biblia nombra solo cuatro meses: Abib, Ziv, Etanim y Bul. Los demás los llama por su número. Tras el exilio los judíos tomaron los nombres de Babilonia, como Nisán, Siván o Kislev.'
  sources: [it-calendario]
  reason: 'Perspicacia «Calendario», apartado «Calendario hebreo», párr. 6, 7 y 8.'
  checked_on: '2026-09-28'
  status: verified
- id: dia-hebreo
  title: Cuándo empezaba el día
  text: 'El día hebreo iba de una puesta de sol a la siguiente (Le 23:32), no de medianoche a medianoche como el nuestro. Por eso un día hebreo abarca parte de dos fechas nuestras.'
  sources: [it-dia]
  reason: 'Perspicacia «Día», párr. 3 y 4: los romanos contaban de medianoche a medianoche, como hoy.'
  checked_on: '2026-09-28'
  status: verified
- id: en-tiempos-de-jesus
  title: En tiempos de Jesús
  text: 'Los Evangelios y Hechos mencionan a menudo las fiestas judías, así que ese calendario seguía en uso en el siglo primero. Esas fiestas ayudan a situar en el tiempo lo que cuentan.'
  sources: [it-calendario]
