# biblical-earth: los meses del calendario hebreo, en el orden del año sagrado (de nisán a adar, y veadar,
# el mes que se añadía algunos años). Nombres de la tabla B15 «El calendario hebreo» de la Biblia de estudio
# (wol.jw.org, 1001070237), consultada el 2026-09-28. Esquema en docs/investigacion/README.md.
#
# Los ids son los que usa fecha.detalle.mes («{mes: nisan, dia: 14}»). Es estructura: los hechos de cada mes
# (equivalencia en nuestro calendario, fiestas, estación) son campos opcionales, cada uno con fuentes, razon,
# consultado y estado. `nombres` da los nombres del mes por época (desde/hasta en años astronómicos, como en los
# lugares) y `explicacion`, al final, los hechos de la página «El calendario».
