<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viajes · Cuaderno de viajes · biblical-atlas</title>
<link rel="stylesheet" href="../comun.css">
<link rel="stylesheet" href="cuaderno.css">
</head>
<body>
<div id="barra"></div>
<main class="cu" id="cu">
  <aside class="cu-lista" id="lista" aria-label="Todos los viajes">
    <div class="cu-lista__cab">
      <h1 class="cu-titulo">Viajes</h1>
      <p class="cu-cifras" id="cifras"></p>
      <label class="sr-only" for="filtro">Filtrar viajes por nombre, persona o lugar</label>
      <input class="cu-filtro" id="filtro" type="search" placeholder="Pablo, Elías, Corinto…" autocomplete="off">
    </div>
    <a class="cu-empieza" id="empieza" href="#viaje=viaje-a-roma&amp;inicio=1">
      <span class="cu-empieza__q">¿No sabes por dónde empezar?</span>
      <span class="cu-empieza__a">Empieza por el viaje de Pablo a Roma: 14 paradas, con días y distancias</span>
    </a>
    <div id="grupos"></div>
  </aside>
  <section class="cu-viaje" id="viaje" aria-live="polite"></section>
  <div class="cu-tramo" id="tramo" role="dialog" aria-modal="false" aria-labelledby="tramo-tit" hidden></div>
  <div class="cu-guia" id="guia" role="dialog" aria-live="polite" hidden></div>
</main>
<script src="../datos.js"></script>
<script src="../comun.js"></script>
<script src="cuaderno.js"></script>
</body>
</html>
